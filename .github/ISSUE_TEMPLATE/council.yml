name: "I work for this council"
description: Council officers - confirm your council's data is correct, or send corrections.
title: "Council: <CODE> <confirmation or corrections>"
labels: [council]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. We will confirm by emailing you at your council address before marking anything
        as verified by the council. Your email address is not published.
  - type: input
    id: council
    attributes: {label: Council code, placeholder: SHR}
    validations: {required: true}
  - type: input
    id: name
    attributes: {label: Your name and role}
    validations: {required: true}
  - type: input
    id: email
    attributes:
      label: Your council email address
      description: Must be on your council's own domain. We only use it to confirm who you are.
    validations: {required: true}
  - type: dropdown
    id: what
    attributes:
      label: What would you like to do?
      options:
        - Confirm our data is correct
        - Send corrections
        - Register as a council contributor (I have a GitHub account)
    validations: {required: true}
  - type: textarea
    id: details
    attributes: {label: Corrections or comments (which requirements, and what should change)}
  - type: input
    id: list
    attributes: {label: Link to your current validation list}
