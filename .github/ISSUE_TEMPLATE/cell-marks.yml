name: "Cell marks"
description: Review marks from the explorer's review mode (used when submitting without a GitHub token).
title: "Cell marks: <CODE> (<n> cells)"
labels: [cell-marks]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer saves the YAML below as `reviews/pending/<date>-<name>.yaml` and runs
        `python scripts/apply_reviews.py --github-user <the author of this issue>`.
  - type: textarea
    id: marks
    attributes:
      label: Marks (YAML)
      render: yaml
    validations: {required: true}
