name: "Confirmed: matches the council's site"
description: Tell us a requirement matches the council's current validation list.
title: "Confirmed: <CODE> <requirement>"
labels: [confirmed]
body:
  - type: markdown
    attributes:
      value: Thanks for checking. The explorer fills most of this in for you.
  - type: input
    id: council
    attributes: {label: Council code, placeholder: SHR}
    validations: {required: true}
  - type: input
    id: requirement
    attributes: {label: Requirement id, placeholder: site-plan}
    validations: {required: true}
  - type: input
    id: file
    attributes: {label: File, placeholder: specification/planning-requirement/SHR/site-plan.yaml}
  - type: input
    id: list
    attributes: {label: Link to the council list you checked against}
    validations: {required: true}
  - type: textarea
    id: site
    attributes: {label: Site settings used in the explorer (optional)}
  - type: textarea
    id: notes
    attributes: {label: Anything else (optional)}
