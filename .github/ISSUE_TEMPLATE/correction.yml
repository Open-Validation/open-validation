name: "Correction: doesn't match the council's site"
description: Tell us a requirement is wrong or out of date.
title: "Correction: <CODE> <requirement>"
labels: [correction]
body:
  - type: input
    id: council
    attributes: {label: Council code, placeholder: SHR}
    validations: {required: true}
  - type: input
    id: requirement
    attributes: {label: Requirement id, placeholder: site-plan}
    validations: {required: true}
  - type: input
    id: file
    attributes: {label: File}
  - type: textarea
    id: actual
    attributes:
      label: What does the council's site actually say?
      description: Paste the council's wording if you can, and say which part is wrong (when it's needed, what it must show, the link...).
    validations: {required: true}
  - type: input
    id: list
    attributes: {label: Link to the council's current list}
    validations: {required: true}
  - type: textarea
    id: site
    attributes: {label: Site settings used in the explorer (optional)}
