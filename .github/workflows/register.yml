# Once a month, check MHCLG's register of planning authorities for councils
# that are new, abolished, renamed or recoded. Fails (and GitHub emails the
# repo owner) if a change affects our councils. Nothing is changed automatically:
# run python scripts/update_register.py, then python scripts/build_lpas.py.
name: register
on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compare MHCLG's register with data/organisation.csv
        run: python scripts/update_register.py --check
