reference: transport-assessment
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: National Planning Policy Framework (the list cites paragraph 32)
source-text: 'Trigger: This applies to development that would result in the generation of significant
  amounts of traffic. ... A Transport Statement (TS) is a simplified, ‘lighter-touch’ version of a TA
  and is required where the transport impacts of a development are expected to be limited. ... Planning
  Policy Guidance 13 ‘Transport’ (March 2001) advises that a Transport Assessment (TA) should be submitted
  as part of any planning application where the proposed development has significant transport implications.'
must-include:
- item: The impact of the proposal on the highway network, accessibility and safety
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Any necessary mitigation, including access improvements and promotion of walking, cycling and
    public transport
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Level of detail proportionate to the scale of the development
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 24. ''Significant amounts of traffic'' has
  no threshold, so it shows as discretionary; a lighter-touch Transport Statement is needed where impacts
  are expected to be limited. Other application types come from the council''s per-type checklists (October
  2023): outline checklist page 11; reserved matters checklist page 10; section 73 checklist page 11.
  Items under the checklists'' ''Additional Requirements'' heading ''may be required'', so they show as
  discretionary unless the guidance notes give a test.'
