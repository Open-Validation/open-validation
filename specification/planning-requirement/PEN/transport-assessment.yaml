reference: transport-assessment
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: National Planning Policy Framework (the list cites paragraph 32)
source-text: 'Trigger: This applies to development that would result in the generation of significant
  amounts of traffic. ... A Transport Statement (TS) is a simplified, ‘lighter-touch’ version of a TA
  and is required where the transport impacts of a development are expected to be limited.'
must-include:
- item: The impact of the proposal on the highway network, accessibility and safety
  level: should
- item: Any necessary mitigation, including access improvements and promotion of walking, cycling and
    public transport
  level: should
- item: Level of detail proportionate to the scale of the development
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 24. 'Significant amounts of traffic' has no
  threshold, so it shows as discretionary; a lighter-touch Transport Statement is needed where impacts
  are expected to be limited.
review-status: unverified
field-status: {}
