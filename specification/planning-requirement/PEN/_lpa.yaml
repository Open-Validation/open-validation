  date: '2026-05-28'
  date-basis: 'Executive minutes of 28 May 2026 (item 7, Validation Requirements for Planning Applications):
    ''RESOLVED (1) That the Council adopts the Validation list as set out at Appendix A to the submitted
    report'', with delegated authority to amend it for legislative changes (https://www.pendle.gov.uk/download/meetings/id/31907/minutes_-_28th_may_2026).
    Appendix A is this ''Full Application Planning Checklist'' (PDF created 18 May 2026; report https://www.pendle.gov.uk/download/meetings/id/31867/item_06_-_validation_requirements_for_planning_applications
    says the previous list was last updated in March 2024 and adds a ball strike assessment). No later
    change was found in the Executive or Council papers to October 2026. On 2026-11-06 the council''s
    checklists page (https://www.pendle.gov.uk/downloads/download/3208/planning_application_checklists)
    still linked the older per-type checklists (full, April 2024; householder, January 2025; outline,
    reserved matters, section 73, listed building, advertisement, lawful development, telecoms, prior
    notification, tree and hedgerow checklists, October 2023). The adopted list covers full applications
    including change of use; householder wording comes from the householder checklist. The other per-type
    checklists were not used.'
  status: current
submission-standards:
- item: All drawings on a recognised scale, with a drawing reference number and title, accurately labelled
    and annotated
  level: must
- item: Location plan and existing and proposed site plans show a North point
  level: must
- item: Plans and documents in PDF format where possible
  level: should
- item: Photos, aerial images or notebook screenshots are not accepted as a substitute for plans
  level: must
- item: 'Paper submissions: one copy of each application (householder checklist: three copies unless submitted
    electronically)'
  level: must
- item: Large files may be sent by a file transfer service (e.g. WeTransfer)
  level: should
- item: Any further information requested must be sent within 21 days, or the application is returned
    as invalid
  level: must
- item: 'Householder: drawings carry a drawing title, drawing number and revision numbers; all documents
    referenced'
  level: must
- item: 'Householder: plans and drawings include the paper size, key dimensions and a scale bar of at
    least 0-10 metres'
  level: should
- item: 'Householder: the checklist completed and submitted with the application'
  level: must
