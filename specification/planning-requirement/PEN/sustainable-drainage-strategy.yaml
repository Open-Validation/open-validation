reference: sustainable-drainage-strategy
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        description: Development with surface water drainage in Flood Zone 2 or 3, or at risk of surface
          water flooding.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Drainage Strategy Trigger: • Major Development • Development with Surface Water drainage
  in flood zones 2 or 3, or at risk of surface water flooding. ... Sustainable Drainage Systems (SuDs)
  Trigger: For all major applications.'
must-include:
- item: How surface water and foul water from the development will be managed
  level: should
- item: That the development will not increase flood risk on or off the site, and that sustainable drainage
    methods have been considered
  level: should
- item: Confirmation that all drainage components will be managed and maintained over the lifetime of
    the development
  level: should
- item: Supporting evidence such as drainage calculations, plans and drawings, showing the approach works
    under current and future conditions
  level: should
- item: 'Major applications: the SuDS that can reasonably be implemented on site, practicable maintenance
    details, and justification for any decision not to use SuDS'
  level: must
  required-if:
    ref: major-development
  source-text: The assessment must show what SuDs can reasonably be implemented on site, include practicable
    maintenance details, and justify any decision not to use SUDs.
- item: 'Major applications: the Lancashire County Council SuDS pro-forma (available with its guidance
    notes)'
  level: should
  required-if:
    ref: major-development
  source-text: The pro-forma and guidance notes are available to download from the Lancashire
confidence: medium
notes: From the council's list (adopted 28 May 2026), pages 16, 23. The list's Drainage Strategy and Sustainable
  Drainage Systems sections are combined here (the closest id).
review-status: unverified
field-status: {}
