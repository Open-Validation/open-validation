reference: planning-statement
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Proposals for one or more dwellings (including change of use proposing residential
            accommodation).
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Commercial proposals over 1,000 sq m, including change of use.
      - all:
        - condition:
            field: agricultural-land
            value: true
            description: The site is agricultural land.
        - condition:
            field: operational-development
            value: true
            description: Non-agricultural development, including farm diversification.
      - condition:
          field: traveller-site
          value: true
          description: A traveller site (land used for Gypsy and Traveller caravan pitches).
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
        - advertising
        - pa-build-agri-forest
        - pa-road-agri-forest
        - pa-excavate-agri
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Planning Statement (PS) Trigger: • Major Applications. • Proposals for 1 dwelling or more.
  • Change of use applications proposing residential accommodation. • Commercial proposals over 1000sqm
  including change of use. • Non-agricultural development on agricultural land (including farm diversification
  proposals). • Traveller sites (land used for Gypsy and Traveller caravan pitches) ... A planning statement
  identifies the context and need for a proposed development and includes an assessment of how the proposed
  development accords with relevant national, regional and local planning policies. ... A planning statement
  identifies the context and need for a proposed development and includes an assessment of how the proposed
  development accords with relevant national, regional and local planning policies.'
must-include:
- item: The context and need for the proposed development
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: An assessment of how the development complies with relevant national, regional and local planning
    policies
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 21. Can be a standalone document or combined
  with the Design and Access Statement. Change of use to residential accommodation is shown through the
  dwelling count. Other application types come from the council''s per-type checklists (October 2023):
  outline checklist page 11; reserved matters checklist page 3; section 73 checklist page 10; advertisement
  consent checklist page 2; telecommunications checklist page 2; agricultural prior notification checklist
  page 3. Required with telecommunications applications; items under the checklists'' ''Additional Requirements''
  heading ''may be required'', so they show as discretionary unless the guidance notes give a test.'
review-status: unverified
field-status: {}
