reference: recreation-facilities-assessment
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - condition:
      field: loss-of-open-space
      value: true
      description: The development results in the loss of existing public or private open space.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Any development resulting in the loss of existing public or private open space.'
must-include:
- item: The amount, type and quality of open space that would be lost
  level: should
- item: The quantitative and qualitative effects on the overall supply of open space in the local area
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 20. The section also lists residential developments
  that must provide public open space through a legal agreement; the draft agreement is with the planning
  obligations item (see the unmapped list).
review-status: unverified
field-status: {}
