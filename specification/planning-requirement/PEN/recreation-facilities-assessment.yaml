reference: recreation-facilities-assessment
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - condition:
        field: loss-of-open-space
        value: true
        description: The development results in the loss of existing public or private open space.
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - site:
        in:
        - open-space
        description: Development within open spaces.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Any development resulting in the loss of existing public or private open space.
  ... For development within open spaces, application proposals should be accompanied by plans showing
  any areas of existing or proposed open space within or adjoining the application site.'
must-include:
- item: The amount, type and quality of open space that would be lost
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The quantitative and qualitative effects on the overall supply of open space in the local area
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 20. The section also lists residential developments
  that must provide public open space through a legal agreement; the draft agreement is with the planning
  obligations item (see the unmapped list). Other application types come from the council''s per-type
  checklists (October 2023): outline checklist page 10; reserved matters checklist page 9; section 73
  checklist page 9.'
review-status: unverified
field-status: {}
