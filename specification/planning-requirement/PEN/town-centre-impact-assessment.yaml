reference: town-centre-impact-assessment
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - outline-all
      - outline-some
      - reserved-matters
      - s73
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2,500 sq m gross floorspace.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other main town centre uses at an edge-of-centre or out-of-centre location, not
            in accordance with the development plan.
      - discretionary
    - discretionary
source-url: https://www.pendle.gov.uk/downloads/file/11868/outline_planning_applications_checklist
source-text: Impact assessments are required for all retail and leisure developments over 2,500 square
  metres gross floorspace, and may be required for smaller developments such as those likely to have a
  significant impact on smaller centres. Impact assessments should also be provided for applications for
  other main town centre uses when they are in an edge of centre or out of centre location and not in
  accordance with a development plan.
confidence: medium
notes: 'From the council''s per-type checklists (October 2023): outline checklist page 9; reserved matters
  checklist page 2; section 73 checklist page 9. Smaller developments ''may'' need one (e.g. a significant
  impact on smaller centres), so that part shows as discretionary. The adopted May 2026 list for full
  applications asks for a sequential assessment instead (see the unmapped list).'
review-status: unverified
field-status: {}
