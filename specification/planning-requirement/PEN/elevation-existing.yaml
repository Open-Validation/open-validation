source-text: Existing and Proposed Elevations ... Existing elevations will be required in all cases. ...
  Have you provided drawings that show full information about site layout, internal arrangements and all
  elevations, both existing and proposed, and where appropriate, a contextual drawing, eg. the street
  scene? ... Existing and proposed elevations (e.g. at a scale of 1:50 or 1:100 ... Have you included
  Existing elevations (e.g. at a scale of 1:50 or 1:100); ... Existing and proposed elevations (e.g. at
  a scale of 1:50 or 1:100 (new buildings only)
