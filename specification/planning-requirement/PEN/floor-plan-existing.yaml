- item: At a scale of 1:50 or 1:100
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The current layout of each floor affected; for roof extensions, the floor below to show access
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Annotated external and internal dimensions where relevant
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Any walls or buildings to be demolished clearly highlighted
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: All boundary lines around the property
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: indicated all boundary lines around the property
