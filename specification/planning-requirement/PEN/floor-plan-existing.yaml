        description: New buildings only.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Floor Plans ... Existing floor plans will be required for each floor
  if the proposed extension/alteration ... Have you provided drawings that show full information about
  site layout, internal arrangements and all elevations, both existing and proposed, and where appropriate,
  a contextual drawing, eg. the street scene? ... Existing floor plans (e.g. at a scale of 1:50 or 1:100);
  ... Existing and proposed floor plans (eg. at a scale of 1:50 or 1:100 (new buildings only)
