reference: noise-assessment
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - any:
      - condition:
          field: use-class
          value: b2
          description: A B2 (general industrial) application.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise-sensitive development, such as housing, near major noise sources (e.g. motorways,
            railway lines or industrial sites).
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: The proposal raises issues of disturbance.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise-sensitive development in a noise-sensitive area.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Noise Impact Assessment Trigger: • All B2 (General industrial) applications. • Noise-sensitive
  developments, such as housing located near major noise sources (e.g. motorways, railway lines, or industrial
  sites). ... Application proposals that raise issues of disturbance or are considered to be a noise sensitive
  development in what are considered noise sensitive areas should be supported by a noise impact assessment
  prepared by a suitably qualified acoustician.'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: How the development will affect noise levels on and around the site, and measures to minimise
    disturbance
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 20. Other application types come from the
  council''s per-type checklists (October 2023): outline checklist page 10; reserved matters checklist
  page 9; section 73 checklist page 9.'
review-status: unverified
field-status: {}
