reference: noise-assessment
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - condition:
        field: use-class
        value: b2
        description: A B2 (general industrial) application.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise-sensitive development, such as housing, near major noise sources (e.g. motorways,
          railway lines or industrial sites).
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Noise Impact Assessment Trigger: • All B2 (General industrial) applications. • Noise-sensitive
  developments, such as housing located near major noise sources (e.g. motorways, railway lines, or industrial
  sites).'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: How the development will affect noise levels on and around the site, and measures to minimise
    disturbance
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 20.
review-status: unverified
field-status: {}
