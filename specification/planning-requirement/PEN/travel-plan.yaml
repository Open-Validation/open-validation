reference: travel-plan
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: A Travel Plan (TP) is required for developments that will generate significant movement.
  It sets out measures to manage travel demand and promote sustainable transport options, reducing reliance
  on the private car. It should include details of implementation, management, and monitoring. ... A (draft)
  travel plan should be submitted alongside planning applications which are likely to have significant
  transport implications.
must-include:
- item: Measures to manage travel demand and promote sustainable transport options
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Details of implementation, management and monitoring
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A travel plan coordinator, management arrangements (e.g. a steering group) and the development
    timetable
  level: should
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - reserved-matters
      - s73
- item: Activities for marketing and promoting the plan to occupiers, users, visitors and residents
  level: should
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - reserved-matters
      - s73
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 24. ''Significant movement'' has no threshold,
  so it shows as discretionary. Other application types come from the council''s per-type checklists (October
  2023): outline checklist page 11; reserved matters checklist page 3; section 73 checklist page 3. Items
  under the checklists'' ''Additional Requirements'' heading ''may be required'', so they show as discretionary
  unless the guidance notes give a test.'
review-status: unverified
field-status: {}
