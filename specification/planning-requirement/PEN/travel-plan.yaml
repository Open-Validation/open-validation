reference: travel-plan
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: A Travel Plan (TP) is required for developments that will generate significant movement.
  It sets out measures to manage travel demand and promote sustainable transport options, reducing reliance
  on the private car. It should include details of implementation, management, and monitoring.
must-include:
- item: Measures to manage travel demand and promote sustainable transport options
  level: should
- item: Details of implementation, management and monitoring
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 24. 'Significant movement' has no threshold,
  so it shows as discretionary.
review-status: unverified
field-status: {}
