reference: photos
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        - listed-building
        description: The property is in a conservation area or is a listed building.
  - application-type:
      in:
      - lbc
      - demolition-con-area
      - ldc-existing-use
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - any:
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition of an existing building.
      - site:
          in:
          - conservation-area
          - listed-building
          description: Development affecting a conservation area or a listed building.
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.pendle.gov.uk/downloads/file/11863/householder_applications_checklist
source-text: In the case of properties in Conservation Areas or which are Listed Buildings photographs
  should be provided ... Photographs must be provided. ... Photographs/Photomontages ... Photographs should
  be provided if the proposal involves the demolition of an existing building or development affecting
  a conservation area or a listed building.
confidence: medium
notes: 'From the council''s householder applications checklist (January 2025), page 2. Not in the adopted
  full application list. For satellite dishes, a photograph of the elevation the dish will be attached
  to is acceptable in place of drawings. Other application types come from the council''s per-type checklists
  (October 2023): outline checklist page 10; reserved matters checklist page 3; section 73 checklist page
  10; listed building consent checklist page 5; conservation area consent for demolition checklist page
  4; advertisement consent checklist page 2; lawful development certificate (existing) checklist page
  1; agricultural prior notification checklist page 3. Advertisement consent lists photographs as an additional
  requirement, so it shows as discretionary.'
review-status: unverified
