reference: section-existing
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - hh
    - condition:
        field: change-in-ground-levels
        value: true
        description: A sloping site (existing changes in ground level), or the proposal changes existing
          ground levels.
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - s73
        - lbc
        - demolition-con-area
    - condition:
        field: change-in-ground-levels
        value: true
        description: Existing changes in ground levels within the site, or the proposal changes the levels.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - pa-build-agri-forest
        - pa-road-agri-forest
        - pa-excavate-agri
    - condition:
        field: new-build
        value: true
        description: New buildings only.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site sections are required for sloping sites or where the proposal involves changes to existing
  ground levels. ... If there are existing changes in ground levels within the site or you propose to
  change the levels have you submitted full details of this at a scale of 1:50 or 1:100 (ie. Levels and
  sections). ... If there are existing changes in ground levels within the site or you propose to change
  the levels have you submitted full details of this at a scale of 1:100 to ... include adjacent land?
  Details should also include sections through the site, and where appropriate these should show adjacent
  existing buildings. ... Existing and proposed site sections and finished floor and site levels (e.g.
  at a scale of 1:50 or 1:100) ... Existing and proposed site sections and finished floor and site levels
  (e.g. at a scale of 1:50 or 1:100) (new buildings only)
must-include:
- item: Existing levels and the relationship to neighbouring buildings
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: At a scale of 1:100 (1:50 or 1:100 for householder applications)
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: 'Outline, section 73, listed building and conservation area demolition: full details at 1:100
    including adjacent land, with sections through the site showing adjacent existing buildings where
    appropriate'
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 13. Householder wording from the householder
  applications checklist (January 2025), page 1. A topographical survey is normally required for major
  applications or where level changes are important to the design (see the unmapped list). Other application
  types come from the council''s per-type checklists (October 2023): outline checklist page 1; reserved
  matters checklist page 1; section 73 checklist page 2; listed building consent checklist page 2; conservation
  area consent for demolition checklist page 1; agricultural prior notification checklist page 1.'
review-status: unverified
field-status: {}
