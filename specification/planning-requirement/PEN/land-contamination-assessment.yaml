reference: land-contamination-assessment
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected (e.g. current or historic landfill, industrial
            or other potentially contaminating uses).
      - condition:
          field: sensitive-end-use
          value: true
          description: A sensitive end use (e.g. residential, schools, allotments).
      - site:
          in:
          - near-landfill-site
          description: Within 250 metres of a currently licensed or historic landfill.
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known.
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposed use would be particularly vulnerable.
      - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: National Planning Policy Framework paragraph 120 (as cited)
source-text: 'Land Contamination Assessment Trigger: • Contamination is known or suspected (e.g. current
  or historic landfill sites, sites with a history of industrial or other potentially contaminating uses).
  • Development involves a sensitive end use (e.g. residential, schools, allotments). • The site is within
  250 metres of a currently licensed or historic landfill. ... Where contamination is known or suspected
  or the proposed use would be particularly vulnerable, the applicant should provide such information
  with the application as is necessary to determine whether the proposed development can proceed.'
must-include:
- item: A Phase I Desk Study assessing potential contamination and risks from previous site use or migrating
    landfill gas
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A Phase II Intrusive Investigation, detailing the extent of contamination and any remedial measures
  level: should
  required-if:
    site:
      in:
      - contaminated-land
      description: High contamination levels are known or suspected.
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 18. Other application types come from the
  council''s per-type checklists (October 2023): outline checklist page 9; reserved matters checklist
  page 8; section 73 checklist page 9. Suspected contamination is a judgement, so that part shows as discretionary.'
review-status: unverified
field-status: {}
