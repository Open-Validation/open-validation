reference: land-contamination-assessment
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected (e.g. current or historic landfill, industrial
          or other potentially contaminating uses).
    - condition:
        field: sensitive-end-use
        value: true
        description: A sensitive end use (e.g. residential, schools, allotments).
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a currently licensed or historic landfill.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: National Planning Policy Framework paragraph 120 (as cited)
source-text: 'Land Contamination Assessment Trigger: • Contamination is known or suspected (e.g. current
  or historic landfill sites, sites with a history of industrial or other potentially contaminating uses).
  • Development involves a sensitive end use (e.g. residential, schools, allotments). • The site is within
  250 metres of a currently licensed or historic landfill.'
must-include:
- item: A Phase I Desk Study assessing potential contamination and risks from previous site use or migrating
    landfill gas
  level: should
- item: A Phase II Intrusive Investigation, detailing the extent of contamination and any remedial measures
  level: should
  required-if:
    site:
      in:
      - contaminated-land
      description: High contamination levels are known or suspected.
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 18.
review-status: unverified
field-status: {}
