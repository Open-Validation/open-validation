source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: All developments located within, or likely to affect, an Air Quality Management
  Area (AQMA), as well as in locations where air quality is already below acceptable standards and the
  proposed development may worsen conditions. Assessments are particularly likely to be necessary for
  major developments along North Valley, the A682 in Brierfield, and the A682 in Barrowford. ... Where
  the development is proposed inside, or adjacent to an air quality management area (AQMA), or where the
  development could in itself result in the designation of an AQMA or where the grant of planning permission
  would conflict with, or render unworkable, elements of a local authority’s air quality action plan,
  applications should be supported by such information as is necessary to allow a full consideration of
  the impact of the proposal on the air quality of the area. Where AQMAs cover regeneration areas, developers
  should provide an air quality assessment as part of their planning application.'
must-include:
- item: Enough information to assess the proposal's impact on local air quality, taking current baseline
    conditions and relevant standards into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 15. Locations where air quality is already
  below acceptable standards, and major developments along North Valley and the A682 in Brierfield and
  Barrowford (''particularly likely''), have no mapped test, so those parts show as discretionary. Other
  application types come from the council''s per-type checklists (October 2023): outline checklist page
  6; reserved matters checklist page 6; section 73 checklist page 6. Items under the checklists'' ''Additional
  Requirements'' heading ''may be required'', so they show as discretionary unless the guidance notes
  give a test.'
