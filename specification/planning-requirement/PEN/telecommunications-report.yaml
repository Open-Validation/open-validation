reference: telecommunications-report
local-authority: PEN
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.pendle.gov.uk/downloads/file/11872/telecommunications_checklist
source-text: 'Details of Area of Search Details of alternative sites rejected with a justification for
  rejecting them: This should include existing masts, structures and other buildings within the search
  area. You must provide an explanation if no alternative were considered Planning Statement ... Map showing
  the relationship of the application site to schools and other telecommunication equipment in the vicinity
  Signed declaration that the equipment and installation fully complies with the ICNIRP requirements Technical
  information including the frequency, modulation characteristics, power output and the height of the
  proposed antenna ... Technical justification — details about the purpose of the site and why the particular
  development is required'
must-include:
- item: Details of the area of search
  level: must
- item: Alternative sites rejected (including existing masts, structures and other buildings in the search
    area) and why; or an explanation if no alternatives were considered
  level: must
- item: A map showing the relationship of the site to schools and other telecommunication equipment nearby
  level: must
- item: A signed declaration that the equipment and installation fully comply with the ICNIRP requirements
  level: must
- item: 'Technical information: frequency, modulation characteristics, power output and antenna height'
  level: must
- item: 'Technical justification: the purpose of the site and why the development is required'
  level: must
confidence: medium
notes: 'From the council''s per-type checklists (October 2023): telecommunications checklist page 1.'
