reference: arboriculturist-report
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Development that may affect existing trees on or adjacent to the site (including
            street trees).
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: Trees covered by a Tree Preservation Order or in a conservation area.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: tree-removal
        value: true
        description: Trees are to be removed or pruned as part of the proposal.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: BS 5837:2012
source-text: 'Tree Survey/Arboricultural Impact Assessment Trigger: • Development that may affect existing
  trees on or adjacent to the site (including street trees). • Trees covered by a Tree Preservation Order
  (TPO) or located in a Conservation Area. • Development that could impact trees of high amenity or ecological
  value. ... If any trees are to be removed or pruned as part of the ... proposal you need to show this
  on your drawings and provide a Tree Survey, Impact Study and Method Statement.'
must-include:
- item: Tree survey by a qualified arboriculturist showing all trees on or next to the site, with species,
    size, condition, location and any protection status
  level: should
- item: Arboricultural Impact Assessment where trees are likely to be affected, with protection, pruning
    or removal measures
  level: must
  source-text: If any trees are likely to be affected by the proposed development, an Arboricultural Impact
    Assessment (AIA) will be required. The AIA should assess the impact on these trees and include any
    protection, pruning, or removal measures.
- item: Survey and assessment to BS 5837:2012
  level: should
- item: 'Householder: trees and hedges on the property and on adjoining land within falling distance of
    the boundary marked on a scaled plan, with trees to be removed or pruned shown on the drawings, and
    a method statement'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Please mark on a scaled plan the position of all trees and hedges on your own property
    and those on adjoining land which are within falling distance of the boundary (i.e. the distance from
    the boundary to the trees and hedges is less than (or equal to) their height). If any trees are to
    be removed or pruned as part of the ... proposal you need to show this on your drawings and provide
    a Tree Survey, Impact Study and Method Statement.
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 24. Householder wording from the householder
  applications checklist (January 2025), page 1. Trees of 'high amenity or ecological value' have no mapped
  test, so that part shows as discretionary.
review-status: unverified
field-status: {}
