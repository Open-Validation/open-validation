reference: roof-plan-proposed
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: A new roof is proposed or an existing roof is being altered.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This is required only when a new roof is proposed or an existing roof is being altered. ...
  Have you provided roof plans (e.g. at a scale of 1:50 or 1:100) ... Roof plans (e.g. at a scale of 1:50
  or 1:100)
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The proposed changes to the roof
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Roof shape, materials and key features such as chimneys, dormers, rooflights, vents or solar panels
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 13. Householder wording from the householder
  applications checklist (January 2025), page 1. The householder checklist lists roof plans without a
  trigger; the adopted list says they are needed only when a roof is new or altered. Other application
  types come from the council''s per-type checklists (October 2023): reserved matters checklist page 1.
  Reserved matters need the plans ''necessary to deal with the matters reserved'', so they show as discretionary.'
review-status: unverified
field-status: {}
