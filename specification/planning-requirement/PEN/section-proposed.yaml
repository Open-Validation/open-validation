reference: section-proposed
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
  - condition:
      field: change-in-ground-levels
      value: true
      description: A sloping site (existing changes in ground level), or the proposal changes existing
        ground levels.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site sections are required for sloping sites or where the proposal involves changes to existing
  ground levels. ... If there are existing changes in ground levels within the site or you propose to
  change the levels have you submitted full details of this at a scale of 1:50 or 1:100 (ie. Levels and
  sections).
must-include:
- item: Existing and proposed levels and the relationship to neighbouring buildings
  level: should
- item: Cross sections through the site and any new structures
  level: should
- item: At a scale of 1:100 (1:50 or 1:100 for householder applications)
  level: must
- item: Existing and finished levels, including details of foundations and eaves, and how encroachment
    onto adjoining land is to be avoided
  level: should
  required-if:
    application-type:
      in:
      - hh
  source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings
    should be submitted to show both existing and finished levels to include details of foundations and
    eaves and how encroachment onto adjoining land is to be avoided.
- item: Existing site levels and finished floor levels related to a fixed datum point off site
  level: should
  required-if:
    application-type:
      in:
      - hh
  source-text: Such plans should show existing site levels and finished floor levels (with levels related
    to a fixed datum point off site)
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 13. Householder wording from the householder
  applications checklist (January 2025), page 1.
review-status: unverified
field-status: {}
