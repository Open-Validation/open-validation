reference: floor-plan-proposed
local-authority: PEN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
  - application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - pa-build-agri-forest
        - pa-road-agri-forest
        - pa-excavate-agri
    - condition:
        field: new-build
        value: true
        description: New buildings only.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Floor Plans ... Have you provided existing and proposed floor plans
  at a scale of 1:50 or 1:100 and indicated all boundary lines around the property (single storey extensions
  should show all of the ground floor; two storey extensions should show all of the ground and first floor).
  ... Have you provided drawings that show full information about site layout, internal arrangements and
  all elevations, both existing and proposed, and where appropriate, a contextual drawing, eg. the street
  scene? ... Existing and proposedfloor plans (e.g. at a scale of 1:50 or 1:100); ... Existing and proposed
  floor plans (eg. at a scale of 1:50 or 1:100 (new buildings only)
must-include:
- item: At a scale of 1:50 or 1:100, clearly illustrating the proposal
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The proposed changes, including new walls, doors or openings
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Annotated external and internal dimensions where relevant
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Existing structures and proposed works, including the relationship with adjacent properties (with
    property numbers where applicable)
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: 'Single storey extensions: all of the ground floor; two storey extensions: all of the ground and
    first floor'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Green Belt: drawings show previous extensions and volume calculations (original dwelling, previous
    and proposed extensions or structures)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - green-belt
        description: In the Green Belt, for extensions or new buildings or structures (not fences or new
          accesses).
  source-text: For applications involving extensions or new buildings or other structures (excluding fences
    or new accesses) to properties within the Green Belt drawings must show previous extensions and calculations
    of volumes (volume of original dwelling, any previous extension/structure and proposed extension/structure).
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 13. Householder wording from the householder
  applications checklist (January 2025), page 1. Other application types come from the council''s per-type
  checklists (October 2023): outline checklist page 1; reserved matters checklist page 1; section 73 checklist
  page 1; listed building consent checklist page 1; conservation area consent for demolition checklist
  page 1; agricultural prior notification checklist page 1; lawful development certificate (proposed)
  checklist page 1. Outline and section 73 checklists ask for ''internal arrangements''.'
