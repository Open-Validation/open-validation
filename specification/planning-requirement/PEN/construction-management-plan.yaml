reference: construction-management-plan
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Required where a proposed development has the potential to impact neighbouring
  properties, particularly in relation to construction activities such as delivery movements, working
  hours, limited on-site space, or the risk of mud and debris on surrounding roads.'
must-include:
- item: Control of working hours and deliveries
  level: should
- item: Management of vehicle movements
  level: should
- item: Site practices (e.g. wheel washing) to prevent mud and debris on the highway
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 15. The list calls it a Construction Method
  Statement. 'Potential to impact neighbouring properties' has no test, so it shows as discretionary.
review-status: unverified
field-status: {}
