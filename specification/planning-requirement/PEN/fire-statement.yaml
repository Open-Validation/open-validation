reference: fire-statement
local-authority: PEN
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.pendle.gov.uk/downloads/file/11878/full_planning_applications_checklist_-_including_biodiversity_net_gain_validation
confidence: medium
notes: 'From the audit (missing_requirement): buildings 18m+ or 7+ storeys with 2+ dwellings or educational
  accommodation.'
review-status: unverified
field-status: {}
