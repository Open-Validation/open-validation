reference: fire-statement
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: New buildings containing two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The building is 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The building has 7 storeys or more.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Fire Statement is required for planning applications involving ‘relevant buildings’, which
  generally includes: • New buildings containing two or more dwellings, or • Educational accommodation,
  where the building is 18 metres or more in height or 7 storeys or more.'
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 8.
review-status: unverified
field-status: {}
