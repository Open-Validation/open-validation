reference: design-and-access-statement
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a designated area (conservation area).
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings creating 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        - listed-building
        description: The property is in a conservation area or is a listed building.
  - application-type:
      in:
      - outline-all
      - outline-some
      - s73
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Developments that need DAS include: • Applications for Major Development as defined in Article
  2 of Town and Country Planning (Development Management Procedure) Order 2015. • Applications for development
  in a designated area (conservation area), where the proposed development consists of: (i) one or more
  dwellings; or (ii) a building or buildings where the floor space created by the development is 100 square
  metres or more • Applications for Listed Building Consent ... All householder applications relating
  to properties in Conservation Areas or which are Listed Buildings must be accompanied by a Design and
  Access Statement. ... Have you included a full Design and Access Statement ... The statement should
  clearly set out how the proposals design out crime.'
must-include:
- item: How the proposal has been developed, taking the site context into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: How consultation has been carried out
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: How issues affecting access have been dealt with
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: How the proposals design out crime
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
- item: How community involvement influenced the approach
  level: should
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
  source-text: Applicants are advised that when they are producing such a statement, they should outline
    how community involvement influenced their approach.
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 7. Householder wording from the householder
  applications checklist (January 2025), page 4. Other application types come from the council''s per-type
  checklists (October 2023): outline checklist page 2; section 73 checklist page 2; listed building consent
  checklist page 2. The outline and section 73 checklists ask for a full statement with every application,
  beyond the national rule; the removal or variation of a condition checklist (a second section 73 checklist)
  also lists it.'
review-status: unverified
field-status: {}
