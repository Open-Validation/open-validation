reference: site-plan
local-authority: PEN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
  - application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and Proposed Site Plan ... Existing and proposed site plans must be provided. ...
  Have you provided drawings that show full information about site layout, internal arrangements and all
  elevations, both existing and proposed, and where appropriate, a contextual drawing, eg. the street
  scene? ... Where appropriate, existing and proposed site plans must be provided. ... Have you provided
  Such plans and drawings as are necessary to deal with the matters reserved in the outline planning permission
  including: ... Block plan of the site (e.g. at a scale of 1:100 or 1:200) showing any site boundaries
  ... Existing site survey plan'
must-include:
- item: Existing and proposed site plans at a scale of 1:500 or 1:200
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A North point
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Any buildings or structures to be demolished clearly indicated
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The extent and type of any hard surfacing, with existing and proposed grassed areas and soft landscaping
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Existing and proposed parking provision and access arrangements
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Existing and proposed bin storage arrangements
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The nearest habitable room window(s) of neighbouring dwellings and the 45 degree line, to show
    compliance with the 45 degree rule
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: The proposed development, in relation to neighbouring dwellings, are required to show the
    nearest habitable room window(s) of these dwellings. The 45 Degree line must also be shown to indicate
    compliance with the 45 Degree rule.
- item: All new boundary treatments
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
  source-text: Do your drawings show all new boundary treatments?
- item: Existing and proposed refuse and recyclables storage
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
  source-text: Details of existing and proposed refuse and recyclables storage arrangements
- item: Existing and proposed access and car parking arrangements
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - demolition-con-area
  source-text: Existing and proposed access and car parking arrangements
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 12. Householder wording from the householder
  applications checklist (January 2025), page 2. Other application types come from the council''s per-type
  checklists (October 2023): outline checklist page 1; reserved matters checklist page 1; section 73 checklist
  page 1; listed building consent checklist page 1; conservation area consent for demolition checklist
  page 1; lawful development certificate (existing) checklist page 1; lawful development certificate (proposed)
  checklist page 1. Reserved matters need the plans ''necessary to deal with the matters reserved'', so
  they show as discretionary.'
review-status: unverified
