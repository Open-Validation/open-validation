reference: site-plan
local-authority: PEN
required-if:
  application-type:
    in:
    - full
    - change-of-use
    - hh
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Site Plan ... Existing and proposed site plans must be provided.
must-include:
- item: Existing and proposed site plans at a scale of 1:500 or 1:200
  level: must
- item: A North point
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: Any buildings or structures to be demolished clearly indicated
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: The extent and type of any hard surfacing, with existing and proposed grassed areas and soft landscaping
  level: must
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
- item: Existing and proposed parking provision and access arrangements
  level: must
- item: Existing and proposed bin storage arrangements
  level: must
- item: The nearest habitable room window(s) of neighbouring dwellings and the 45 degree line, to show
    compliance with the 45 degree rule
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: The proposed development, in relation to neighbouring dwellings, are required to show the
    nearest habitable room window(s) of these dwellings. The 45 Degree line must also be shown to indicate
    compliance with the 45 Degree rule.
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 12. Householder wording from the householder
  applications checklist (January 2025), page 2.
review-status: unverified
field-status: {}
