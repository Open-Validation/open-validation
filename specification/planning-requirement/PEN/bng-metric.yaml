reference: bng-metric
local-authority: PEN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition (not exempt).
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Schedule 7A of the Town and Country Planning Act 1990 (Schedule 14 of the Environment Act 2021)
source-text: Where development is subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information set out in Article 7A of the Town and Country Planning Act
  1990.
must-include:
- item: Metric confirming the pre-development biodiversity value, using the relevant Defra metric, in
    Excel and PDF
  level: must
confidence: medium
notes: From the council's list (adopted 28 May 2026), pages 9, 10. The list's Table 1 sets out what must
  support the application; the rule follows the law (the biodiversity gain condition), so householder
  and the other exempt applications the list names are exempt. The other Table 1 items (statements, draft
  gain plan, draft habitat management and monitoring plan, legal agreement information) and the off-site
  items in Table 3 have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
