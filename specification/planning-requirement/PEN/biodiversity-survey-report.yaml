reference: biodiversity-survey-report
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - local-nature-reserve
        - local-wildlife-site
        - green-belt
        description: On or near a designated site or in the Green Belt.
    - condition:
        field: outside-urban-area
        value: true
        description: In the countryside.
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: A barn conversion.
    - condition:
        field: potential-roost-features
        value: true
        description: Works to older buildings or roof spaces, or structures with potential to support
          bats.
    - condition:
        field: tree-removal
        value: true
        description: Removal of trees.
    - condition:
        field: hedgerows-affected
        value: true
        description: Removal of hedgerows.
    - condition:
        field: protected-species
        value: true
        description: The site has potential to support protected species.
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Preliminary Ecological Appraisal (PEA) and Protected Species Surveys (including bats) Trigger:
  • Development on or near sites with potential ecological interest (e.g. countryside, green belt, or
  designated sites). • Proposals involving demolition, barn conversions, or works to older buildings or
  roof spaces. • Removal of trees, hedgerows, scrub, or works affecting water features. • Sites or structures
  with potential to support protected species, particularly bats.'
must-include:
- item: A Preliminary Ecological Appraisal identifying habitats, potential protected species and likely
    impacts on biodiversity
  level: should
- item: Bat surveys (activity or emergence) by a qualified ecologist where suitable roosting features
    are present
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Suitable bat roosting features are present.
- item: Any presence of bats, the impacts, and mitigation or compensation measures
  level: should
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Suitable bat roosting features are present.
- item: How harm to protected species will be avoided, in line with the relevant legislation
  level: must
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 22. 'Sites with potential ecological interest',
  scrub removal and works affecting water features have no mapped test, so those parts show as discretionary.
  Further surveys 'may be required' where the appraisal finds potential impacts.
review-status: unverified
field-status: {}
