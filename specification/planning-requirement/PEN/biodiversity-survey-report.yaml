source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Preliminary Ecological Appraisal (PEA) and Protected Species Surveys (including bats) Trigger:
  • Development on or near sites with potential ecological interest (e.g. countryside, green belt, or
  designated sites). • Proposals involving demolition, barn conversions, or works to older buildings or
  roof spaces. • Removal of trees, hedgerows, scrub, or works affecting water features. • Sites or structures
  with potential to support protected species, particularly bats. ... Have you identified any ecological
  features or wildlife habitats on your site and how your proposals intend to deal with them? You must
  also include any appropriate surveys (e.g. bat surveys). ... Certain proposals which include work such
  as the demolition of older buildings or roof spaces, removal of trees, scrub, hedgerows or alterations
  to water courses may affect protected species and will need to provide information on them, any potential
  impacts for them and any mitigation proposals for such impacts. ... Ecological survey'
must-include:
- item: A Preliminary Ecological Appraisal identifying habitats, potential protected species and likely
    impacts on biodiversity
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Bat surveys (activity or emergence) by a qualified ecologist where suitable roosting features
    are present
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Suitable bat roosting features are present.
- item: Any presence of bats, the impacts, and mitigation or compensation measures
  level: should
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Suitable bat roosting features are present.
- item: How harm to protected species will be avoided, in line with the relevant legislation
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Ecological features or wildlife habitats on the site and how the proposals deal with them, with
    any appropriate surveys (e.g. bat surveys)
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 22. ''Sites with potential ecological interest'',
  scrub removal and works affecting water features have no mapped test, so those parts show as discretionary.
  Further surveys ''may be required'' where the appraisal finds potential impacts. Other application types
  come from the council''s per-type checklists (October 2023): outline checklist page 2; reserved matters
  checklist page 2; section 73 checklist page 2; listed building consent checklist page 2; conservation
  area consent for demolition checklist page 2; hedgerow removal checklist page 1. ''Possible impacts
  on wildlife'' has no test, so that part shows as discretionary.'
