reference: lighting-assessment
local-authority: PEN
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        description: The development is in the vicinity of a listed building or conservation area.
    - discretionary
source-url: https://www.pendle.gov.uk/download/downloads/id/11868/outline_planning_applications_checklist.pdf
source-text: LIGHTING ASSESSMENT Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a Listed Building or a Conservation Area, or open countryside,
  where external lighting would be provided or made necessary by the development, must be accompanied
  by details of external lighting and the proposed hours when the lighting would be switched on.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
confidence: medium
notes: Publicly accessible developments near residential property or open countryside are shown as officer
  discretion.
review-status: unverified
field-status: {}
