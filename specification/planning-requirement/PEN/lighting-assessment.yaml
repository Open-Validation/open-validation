reference: lighting-assessment
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - condition:
        field: external-lighting
        value: true
        description: Significant external lighting, including floodlighting.
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          description: Adjacent to heritage assets.
      - condition:
          field: protected-species
          value: true
          description: The lighting affects protected wildlife.
      - condition:
          field: outside-urban-area
          value: true
          description: Within the open countryside.
      - discretionary
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - condition:
        field: external-lighting
        value: true
        description: A publicly accessible development where external lighting would be provided or made
          necessary.
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          description: In the vicinity of a listed building or conservation area.
      - condition:
          field: outside-urban-area
          value: true
          description: In open countryside.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements are proposed.
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Proposals involving significant external lighting, including floodlighting, where
  the development is near residential properties, adjacent to heritage assets, affects protected wildlife,
  or is within the open countryside. ... Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a Listed Building or a Conservation Area, or open countryside,
  where external lighting would be provided or made necessary by the development, must be accompanied
  by details of external lighting and the proposed hours when the lighting would be switched on. ... Proposals
  involving illuminated Advertisements must be accompanied by details of lighting and the proposed hours
  when the lighting would be switched on.'
must-include:
- item: Details of all external lighting and the proposed hours of operation
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A layout plan showing beam orientation
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A schedule of the lighting equipment
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 19. ''Near residential properties'' has no
  distance, so that part shows as discretionary. Other application types come from the council''s per-type
  checklists (October 2023): outline checklist page 9; reserved matters checklist page 9; section 73 checklist
  page 9; advertisement consent checklist page 2.'
review-status: unverified
field-status: {}
