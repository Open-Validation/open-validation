reference: elevation-proposed
local-authority: PEN
required-if:
  application-type:
    in:
    - full
    - change-of-use
    - hh
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Elevations ... All proposed elevations will be required.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: All affected elevations, showing their relationship to the existing structure
  level: must
- item: Annotated external dimensions showing the size and scale of the building and any changes
  level: must
- item: Materials, finishes and styles for walls, roofs, windows, doors and other architectural features
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings,
    including the positions of windows, doors and other openings on both properties'
  level: must
- item: Parts of adjoining elevations where necessary to show context and the impact on neighbouring properties
  level: must
- item: Blank elevations included
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Blank elevations must also be included
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 13. Householder wording from the householder
  applications checklist (January 2025), page 3. Street scene elevations are asked for separately for
  proposals affecting the street frontage or in sensitive areas (see the unmapped list).
review-status: unverified
field-status: {}
