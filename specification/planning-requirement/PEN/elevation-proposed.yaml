source-text: Existing and Proposed Elevations ... All proposed elevations will be required. ... Have you
  provided drawings that show full information about site layout, internal arrangements and all elevations,
  both existing and proposed, and where appropriate, a contextual drawing, eg. the street scene? ... Existing
  and proposed elevations (e.g. at a scale of 1:50 or 1:100 ... Have you included existing and proposed
  elevations (e.g. at a scale of 1:50 or ... Existing and proposed elevations (e.g. at a scale of 1:50
  or 1:100 (new buildings only)
