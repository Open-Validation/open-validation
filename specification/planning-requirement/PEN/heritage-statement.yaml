reference: heritage-statement
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - any:
      - all:
        - site:
            in:
            - conservation-area
            description: Within, adjacent to or in close proximity to a conservation area.
        - any:
          - condition:
              field: involves-change-of-use
              value: false
              description: Not a change of use.
          - condition:
              field: external-alterations
              value: true
              description: The proposal involves external alterations.
      - site:
          in:
          - listed-building
          - listed-building-setting
          description: Development to, or in close proximity to, a listed building.
      - discretionary
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
        - lbc
        - demolition-con-area
    - any:
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: In an Area of Archaeological Potential.
        - condition:
            field: ground-disturbance
            value: true
            description: The proposal disturbs the ground.
      - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Heritage Statement (HS) Trigger: • Development within a Conservation Area. • Development
  adjacent to or in close proximity to a Conservation Area. • Development to a Listed Building. • Development
  in close proximity to a Listed Building. • Development that may affect archaeological remains or other
  heritage assets. ... Change of use proposals within a Conservation Area that involve no external alterations
  to the building do not require a Heritage Statement. ... A heritage statement will be required in respect
  of proposals involving the disturbance of ground within an Area of Archaeological Potential,or in other
  areas the subject of major development proposals or significant infrastructure works, where archaeological
  remains may survive.'
must-include:
- item: The significance of the heritage asset, including any contribution made by its setting
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: An assessment of the impact of the proposed development on that significance
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Level of detail proportionate to the significance of the asset and the scale of the development
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 18. Development that ''may affect archaeological
  remains or other heritage assets'' (including non-designated heritage assets) has no mapped test, so
  that part shows as discretionary. A change of use in a conservation area with no external alterations
  does not need one. Other application types come from the council''s per-type checklists (October 2023):
  outline checklist page 9; reserved matters checklist page 8; section 73 checklist page 8; listed building
  consent checklist page 4; conservation area consent for demolition checklist page 4. Major development
  or significant infrastructure ''where archaeological remains may survive'', and listed building and
  conservation area demolition cases (an additional requirement), show as discretionary.'
