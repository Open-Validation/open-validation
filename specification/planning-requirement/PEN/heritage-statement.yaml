reference: heritage-statement
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - all:
      - site:
          in:
          - conservation-area
          description: Within, adjacent to or in close proximity to a conservation area.
      - any:
        - condition:
            field: involves-change-of-use
            value: false
            description: Not a change of use.
        - condition:
            field: external-alterations
            value: true
            description: The proposal involves external alterations.
    - site:
        in:
        - listed-building
        - listed-building-setting
        description: Development to, or in close proximity to, a listed building.
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Heritage Statement (HS) Trigger: • Development within a Conservation Area. • Development
  adjacent to or in close proximity to a Conservation Area. • Development to a Listed Building. • Development
  in close proximity to a Listed Building. • Development that may affect archaeological remains or other
  heritage assets. ... Change of use proposals within a Conservation Area that involve no external alterations
  to the building do not require a Heritage Statement.'
must-include:
- item: The significance of the heritage asset, including any contribution made by its setting
  level: must
- item: An assessment of the impact of the proposed development on that significance
  level: must
- item: Level of detail proportionate to the significance of the asset and the scale of the development
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 18. Development that 'may affect archaeological
  remains or other heritage assets' (including non-designated heritage assets) has no mapped test, so
  that part shows as discretionary. A change of use in a conservation area with no external alterations
  does not need one.
review-status: unverified
field-status: {}
