reference: application-form
local-authority: PEN
required-if:
  application-type:
    in:
    - full
    - change-of-use
    - hh
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'For an application to be valid, the following must be provided: • A completed application
  form. • All applications must have an accurate certificate of ownership. A Local Planning Authority
  is not able to legally entertain an application without an accurate certificate. • Compliance with national
  information requirements. • Payment of the correct application fee. • Submission of any local information
  requirements.'
must-include:
- item: The correct form for the type of application
  level: must
- item: The applicant's name and contact details (applications without them are invalid); the same person
    is not listed as both applicant and agent
  level: must
  source-text: All application forms must include the applicant’s name and contact details. Applications
    submitted without this information are deemed invalid. Furthermore, the same person cannot be listed
    as both the applicant and the agent on the application form.
- item: A clear written description of the proposed development, explaining what is proposed in enough
    detail to understand the nature and extent of the works
  level: must
  source-text: You must provide a clear, written description of the proposed development as part of your
    application, outlining the main elements of the proposal. The description should explain what is being
    proposed in sufficient detail for the Council to understand the nature and extent of the works.
- item: 'For a change of use: the lawful use of the existing development and the proposed new use class'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
  source-text: For example, if an application is for a change of use it must describe the lawful use of
    the existing development and the proposed new use class.
- item: An accurate certificate of ownership (A, B, C or D), with notice served or published as the certificate
    requires
  level: must
  source-text: All applications must be accompanied by a Certificate of Ownership.
- item: Agricultural land declaration confirming that all agricultural tenants have been notified or that
    there are none, whether or not the site includes an agricultural holding
  level: must
  source-text: This declaration is required for all applications, regardless of whether the site includes
    an agricultural holding, and is incorporated within the ownership certificates on the standard application
    form.
- item: Forms and certificate signed and dated
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Have you completed the householder application forms and signed and dated all copies?
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 5. Householder wording from the householder
  applications checklist (January 2025), page 1. The fee is also required (see the unmapped list).
