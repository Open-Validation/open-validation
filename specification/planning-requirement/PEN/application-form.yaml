reference: application-form
local-authority: PEN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
  - application-type:
      in:
      - outline-all
      - outline-some
      - reserved-matters
      - s73
      - lbc
      - demolition-con-area
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - pa-ecomms-network
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - non-material-amendment
      - consent-under-tpo
      - notice-trees-in-con-area
      - hedgerow-removal
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'For an application to be valid, the following must be provided: • A completed application
  form. • All applications must have an accurate certificate of ownership. A Local Planning Authority
  is not able to legally entertain an application without an accurate certificate. • Compliance with national
  information requirements. • Payment of the correct application fee. • Submission of any local information
  requirements. ... Have you completed the planning application forms and signed and dated all copies?
  ... Have you completed, signed and dated the correct Certificate, including the Agricultural Holdings
  Certificate? ... Have you completed the form or made the application in writing containing sufficient
  information to enable the authority to identify the outline planning permission in respect of which
  it is made ... Have you completed the application form or included a written description of the development?
  ... Completed and dated application form, with all [mandatory] questions answered ... A completed form
  or the form set out in Schedule 4 to the Hedgerow Regulations 1997'
must-include:
- item: The correct form for the type of application
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The applicant's name and contact details (applications without them are invalid); the same person
    is not listed as both applicant and agent
  level: must
  source-text: All application forms must include the applicant’s name and contact details. Applications
    submitted without this information are deemed invalid. Furthermore, the same person cannot be listed
    as both the applicant and the agent on the application form.
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A clear written description of the proposed development, explaining what is proposed in enough
    detail to understand the nature and extent of the works
  level: must
  source-text: You must provide a clear, written description of the proposed development as part of your
    application, outlining the main elements of the proposal. The description should explain what is being
    proposed in sufficient detail for the Council to understand the nature and extent of the works.
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: 'For a change of use: the lawful use of the existing development and the proposed new use class'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
  source-text: For example, if an application is for a change of use it must describe the lawful use of
    the existing development and the proposed new use class.
- item: An accurate certificate of ownership (A, B, C or D), with notice served or published as the certificate
    requires
  level: must
  source-text: All applications must be accompanied by a Certificate of Ownership.
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Agricultural land declaration confirming that all agricultural tenants have been notified or that
    there are none, whether or not the site includes an agricultural holding
  level: must
  source-text: This declaration is required for all applications, regardless of whether the site includes
    an agricultural holding, and is incorporated within the ownership certificates on the standard application
    form.
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Forms and certificate signed and dated
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Have you completed the householder application forms and signed and dated all copies?
- item: The correct certificate, including the Agricultural Holdings Certificate; Certificate B with notice
    served if any part of the development is not on land the applicant owns
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
  source-text: Have you completed, signed and dated the correct Certificate, including the Agricultural
    Holdings Certificate?
- item: 'Reserved matters: enough information to identify the outline planning permission, and the particulars
    needed to deal with the reserved matters'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: Have you provided such particulars as are necessary to deal with the matters reserved in
    the outline planning permission
- item: 'Non-material amendment: notice given to any other owner or agricultural tenant, saying what the
    application is for, where it can be viewed, and that representations must be made within 14 days'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
  source-text: 'Have you given notice to any person (other than yourself) who is an owner of the land
    to which the application relates or a tenant of an agricultural holding any part of which is comprised
    in the land to which the application relates, stating: (a) what the application is for and where the
    person can view a copy of it; and (b) that any representations about the application must be made
    to the Planning Department at the Borough of Pendle within 14 days of the date when the notice is
    given.'
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 5. Householder wording from the householder
  applications checklist (January 2025), page 1. The fee is also required (see the unmapped list). Other
  application types come from the council''s per-type checklists (October 2023): outline checklist page
  1; reserved matters checklist page 1; section 73 checklist page 1; listed building consent checklist
  page 1; conservation area consent for demolition checklist page 1; advertisement consent checklist page
  1; lawful development certificate (existing) checklist page 1; lawful development certificate (proposed)
  checklist page 1; telecommunications checklist page 1; agricultural prior notification checklist page
  1; non-material amendment checklist page 1; tree works checklist page 1; hedgerow removal checklist
  page 1.'
review-status: unverified
field-status: {}
