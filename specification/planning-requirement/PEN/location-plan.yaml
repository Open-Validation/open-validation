reference: location-plan
local-authority: PEN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
  - application-type:
      in:
      - outline-all
      - outline-some
      - s73
      - lbc
      - demolition-con-area
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - pa-ecomms-network
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - hedgerow-removal
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All applications must include a location plan that meets the following requirements: ...
  Have you provided a site location plan at a scale of 1:1250 or 1:2500 and edged the application site
  in red and any adjoining land in your ownership or control in blue ... Have you provided a site location
  plan? ... A plan which clearly shows the location and length of the hedgerow(s) to be removed (if possible,
  please provide a plan to a scale of 1:2500. A different scale can be used so long as it shows clearly
  the location and length of the hedgerow or hedgerows that you wish to remove)'
must-include:
- item: Based on an up-to-date Ordnance Survey map
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: At a scale of 1:1250 or 1:2500
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: A North point
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Wherever possible, at least two named roads and surrounding buildings
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Properties numbered or named to identify the exact location of the site
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: The entire site outlined in red, including all land needed to carry out the development (access
    from a public highway, visibility splays, landscaping, car parking, open areas around buildings)
  level: must
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Any other land owned by the applicant, close to or adjoining the site, outlined in blue
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Application site centred on the plan, identifying all roads and properties around the site
  level: should
  required-if:
    application-type:
      in:
      - hh
  source-text: remember the application site should be centred on the plan and identify all roads and
    properties surrounding the site so that neighbour notifications can be easily undertaken
- item: 'Advertisements: the location of the proposed advertisement(s) clearly shown'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: It should clearly show the location of the proposed Adverisement(s).
- item: 'Hedgerow removal: the location and length of the hedgerow(s) to be removed clearly shown, if
    possible at 1:2500'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
