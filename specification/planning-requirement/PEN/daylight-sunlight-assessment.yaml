reference: daylight-sunlight-assessment
local-authority: PEN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Required where a proposed development may affect neighbouring properties through
  a reduction in daylight or sunlight.'
must-include:
- item: The extent of any impact on daylight or sunlight to neighbouring buildings, gardens and amenity
    spaces, evaluated against recognised guidance such as the BRE guidelines
  level: should
confidence: medium
notes: From the council's list (adopted 28 May 2026), page 16. 'May affect' has no test, so it shows as
  discretionary.
review-status: unverified
field-status: {}
