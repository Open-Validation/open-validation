reference: daylight-sunlight-assessment
local-authority: PEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Required where a proposed development may affect neighbouring properties through
  a reduction in daylight or sunlight. ... In circumstances where there is a potential adverse impact
  upon the current levels of sunlight/daylight enjoyed by adjoining properties or building(s), including
  associated gardens or amenity space then applications may also need to be accompanied by a daylight/sunlight
  assessment.'
must-include:
- item: The extent of any impact on daylight or sunlight to neighbouring buildings, gardens and amenity
    spaces, evaluated against recognised guidance such as the BRE guidelines
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 16. ''May affect'' has no test, so it shows
  as discretionary. Other application types come from the council''s per-type checklists (October 2023):
  outline checklist page 7; reserved matters checklist page 6; section 73 checklist page 7. Items under
  the checklists'' ''Additional Requirements'' heading ''may be required'', so they show as discretionary
  unless the guidance notes give a test.'
review-status: unverified
field-status: {}
