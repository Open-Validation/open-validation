source-url: https://www.pendle.gov.uk/download/meetings/id/31868/item_06_-_appendix
source-text: 'Trigger: Required for all development (including minor development and changes of use) •
  In flood zones 2, 3 or 3b. • Within flood zone 1 with a site area of 1 hectare or more. • In areas with
  critical drainage problems. • Development within flood zone 1 where the LPA’s strategic flood risk assessment
  (SFRA) shows it will be at increased risk of flooding during its lifetime. • Development that increases
  the vulnerability classification and may be subject to sources of flooding other than rivers or sea.
  Explanation: A Flood Risk Assessment (FRA) should explain the potential risk of flooding from all sources
  to the proposed development and whether the development could increase flood risk elsewhere, both now
  and in the future, including the effects of climate change. It should identify possible sources of flooding
  affecting the site and set out how these risks will be managed. ... Flood Risk Assessment if required.
  ... Planning applications for development proposals of 1 hectare or greater in Flood Zone 1 and all
  proposals for new development located in Flood Zones 2 and 3 should be accompanied by a Flood Risk Assessment
  (FRA).'
must-include:
- item: The potential risk of flooding from all sources to the development, and whether it could increase
    flood risk elsewhere, now and in the future, including the effects of climate change
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
- item: Possible sources of flooding affecting the site and how these risks will be managed
  level: should
  required-if:
    application-type:
      in:
      - full
      - change-of-use
      - hh
confidence: medium
notes: 'From the council''s list (adopted 28 May 2026), page 17. Householder wording from the householder
  applications checklist (January 2025), page 2. A more vulnerable use only needs an assessment where
  it ''may be subject to sources of flooding other than rivers or sea'', which is a judgement, so that
  part shows as discretionary. Other application types come from the council''s per-type checklists (October
  2023): outline checklist page 8; reserved matters checklist page 7; section 73 checklist page 8.'
