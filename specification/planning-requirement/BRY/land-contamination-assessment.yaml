reference: land-contamination-assessment
local-authority: BRY
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use is sensitive, e.g. residential, school.
  - site:
      in:
      - contaminated-land
      description: The previous use of land could give rise to contamination.
  - site:
      in:
      - near-landfill-site
      description: On and near former landfill sites.
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: 'Planning Practice Guidance: Land affected by contamination; Bromley''s Contaminated Land Strategy'
source-text: Where the proposed use is sensitive e.g. residential, school; Where the previous use of land
  could give rise to contamination On and near former landfill sites; Sites that have a history of commercial
  use or where previous uses are unknown
must-include:
- item: A desktop study of the previous uses of the site
  level: should
- item: Enough information to determine whether contamination exists, its nature and risks, and whether
    these can be reduced to an acceptable level
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 35 (Part 2: Land Contamination Report).
  Part 2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19). Sites with a history of commercial
  use or unknown previous uses show as ''check''.'
review-status: unverified
field-status: {}
