reference: viability-assessment
local-authority: BRY
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Less or no affordable housing than development plan policy requires is offered.
    - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Planning Obligations SPD; Affordable Housing and Viability SPG 2017
source-text: Major developments that generate a need for developer contributions where the applicant is
  of the view that the economics of the development cannot support the likely requirements for affordable
  housing or other contributions required by the Local Planning Authority or other stakeholders.
must-include:
- item: Prepared in accordance with the GLA Affordable Housing and Viability SPG 2017
  level: should
- item: Provided to the Borough in its entirety (it will be made available like other submitted documents)
  level: should
- item: An undertaking to meet the cost of the Council's independent review
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 30 (Part 2: Financial Viability Assessment).
  Part 2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19). Other contributions the applicant
  says the scheme cannot support, and public subsidy for affordable housing, show as ''check''.'
review-status: unverified
field-status: {}
