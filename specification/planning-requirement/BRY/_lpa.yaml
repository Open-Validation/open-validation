  status: current
submission-standards:
- item: Applications submitted electronically through the Planning Portal
  level: should
- item: All documents, photos and plans in PDF format, as individual files (not bundles)
  level: must
- item: Each plan submitted as a separate single page PDF file
  level: must
- item: No personal data (e.g. signatures) in supporting documents; any documents not intended for online
    publication clearly identified
  level: must
- item: Plans scaled accurately, stating the scale, with key dimensions annotated (width, height and depth
    of the works, overall height not just eaves height, and distance to site boundaries where relevant)
  level: must
- item: Plans indicate the direction of north
  level: must
- item: Each plan given a unique drawing number and a title
  level: must
- item: All plans accurate and correlating with partner drawings
  level: must
- item: Amendments and further information emailed to planning.admin@bromley.gov.uk, not sent through
    the Planning Portal
  level: must
- item: 'For section 96A and section 73 amendments: the proposed plans are a full update of those originally
    approved, with copies of the approved plans clearly marked up to show the changes and labelled as
    previously approved'
  level: must
