reference: energy-statement
local-authority: BRY
required-if:
  ref: major-development
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policies SI 2, SI 3 and SI 4
source-text: Major Developments
must-include:
- item: How the need for energy is minimised and how it will be supplied, following the energy hierarchy
  level: should
- item: Calculations of carbon dioxide emissions and energy (kWh), showing how options for renewable energy
    have been considered
  level: should
- item: How the development will reduce the potential for internal overheating and reliance on air conditioning
    (cooling hierarchy, SI4B)
  level: should
- item: The 'Be Seen' element of the energy hierarchy
  level: should
- item: Details of the proposed heating system, with justification where an energy source lower down the
    hierarchy is used
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 28-29 (Part 2: Energy Strategy). Part
  2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19).'
review-status: unverified
field-status: {}
