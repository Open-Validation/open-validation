reference: daylight-sunlight-assessment
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: storey-count
      operator: '>'
      value: 6
      description: 'A tall building: more than 6 storeys.'
  - condition:
      field: building-height
      operator: '>'
      value: 18
      description: 'A tall building: more than 18 metres, measured from ground to the floor level of the
        uppermost storey.'
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policy D9; BRE Site Layout Planning for Daylight and Sunlight
source-text: Major Proposals Tall buildings Other proposals to be decided on a case-by-case basis
must-include:
- item: Carried out in accordance with the BRE guide 'Site Layout Planning for Daylight and Sunlight'
  level: should
- item: Daylight, vertical sky component, sunlight availability and shadow study, assessed against the
    BRE criteria
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 26 (Part 2: Daylight/Sunlight Assessment).
  Part 2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19). Tall buildings are read with
  the list''s own definition (more than 6 storeys or 18 m, page 47).'
review-status: unverified
field-status: {}
