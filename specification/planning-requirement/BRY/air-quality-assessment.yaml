reference: air-quality-assessment
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is in an AQMA or Air Quality Focus Area.
    - discretionary
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policy SI 1; Bromley Local Plan; Air Quality Neutral LPG
source-text: Major Developments Where the site falls into a AQMA or AQFA area and the proposal is potentially
  polluting and traffic generating. Development that is likely to be used by large numbers of people particularly
  vulnerable to poor air quality, such as children or older people (to be decided on a case by case basis
  by the Planning officer).
must-include:
- item: Shows how the development will meet London Plan Policy SI 1 Part B1, being at least Air Quality
    Neutral
  level: must
- item: 'For major applications: full details of the preliminary air quality assessment, as per the London
    Plan'
  level: should
  required-if:
    ref: major-development
- item: 'For major proposals subject to EIA: an Air Quality Positive Statement showing how all aspects
    of the development have responded to their environment, contributed to improvement and used best practice'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: Subject to Environmental Impact Assessment.
  source-text: Major proposals which are subject to Environmental Impact Assessment.
confidence: medium
notes: 'From the council''s list (published January 2025), page 23-24 (Part 2: Air Quality Assessment
  and Air Quality Neutral Statement; Air Quality Positive Statement). Part 2 documents are for more complex
  applications and ''could be requested for householder applications if required, this will be determined
  on a case-by-case basis'' (page 19). ''Potentially polluting and traffic generating'' and use by vulnerable
  people are the planning officer''s call, so they show as ''check''.'
