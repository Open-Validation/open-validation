reference: biodiversity-survey-report
local-authority: BRY
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - area-of-outstanding-natural-beauty
      description: The site falls in designated areas (SSSI, SINC, AONB or Local Nature Reserves).
  - condition:
      field: protected-species
      value: true
      description: Protected species may be affected by the proposal.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policy G6; Wildlife and Countryside Act 1981; Protection of Badgers Act 1992
source-text: For proposed developments where the site falls in designated areas (SSSI/SINC/AONB or Local
  Nature Reserves). Where protected species may be affected by a proposal an appraisal is required to
  review possible impacts on wildlife and biodiversity. ... Where potential impacts on protected species
  and/or their habitats are identified.
must-include:
- item: 'Phase 1 Preliminary Ecological Assessment: existing biodiversity interests and possible impacts
    on them'
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
- item: Plans showing significant wildlife habitats or features and the habitats of protected species
  level: should
  required-if: discretionary
- item: Phase 2 species survey
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Potential impacts on protected species and/or their habitats are identified.
confidence: medium
notes: 'From the council''s list (published January 2025), page 25 (Part 2: Biodiversity/Ecology Assessment
  and Species Surveys). Part 2 documents are for more complex applications and ''could be requested for
  householder applications if required, this will be determined on a case-by-case basis'' (page 19). Work
  such as demolition of older buildings or roof spaces, floodlighting, removal of trees, scrub or hedgerows,
  or alterations to water courses may affect protected species.'
review-status: unverified
field-status: {}
