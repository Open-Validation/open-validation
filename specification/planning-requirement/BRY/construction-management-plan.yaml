reference: construction-management-plan
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Proposals for 5+ new dwellings (including change of use).
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policy T7; TfL Construction Logistics Plan guidance
source-text: Major proposals Proposals for 5+ new dwellings (including change of use) Any other proposal
  likely to have a significant impact on traffic congestion or pedestrian safety such as development on
  a main high street or where loading activities associated with the construction phase of a development
  would cause congestion or obstruction on the highway.
must-include:
- item: 'Construction Logistics Management Plan: construction vehicle routing (swept path analysis may
    be needed)'
  level: should
- item: 'CLMP: details for maintaining clean roads (wheel washing)'
  level: should
- item: 'CLMP: security and access controls (for larger sites)'
  level: should
- item: 'CLMP: details of waste management'
  level: should
- item: 'CLMP: numbers and times of deliveries'
  level: should
- item: 'Construction Environmental Management Plan: measures to address demolition and construction noise,
    dust management and air quality impacts during demolition and construction'
  level: must
  required-if:
    ref: major-development
  source-text: A Construction Environmental Management Plan must include details of measures to address
    the effects of demolition and construction noise, dust management and impacts of the development on
    air quality during the demolition and construction phases
- item: 'CEMP: how emissions from Non-Road Mobile Machinery have been considered'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published January 2025), page 26 (Part 2: Construction Logistics Management
  Plan (CLMP); Construction Environmental Management Plan (CEMP)). Part 2 documents are for more complex
  applications and ''could be requested for householder applications if required, this will be determined
  on a case-by-case basis'' (page 19). The CEMP is for major proposals. Other proposals likely to have
  a significant traffic or pedestrian safety impact show as ''check''.'
review-status: unverified
field-status: {}
