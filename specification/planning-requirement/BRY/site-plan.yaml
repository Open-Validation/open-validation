reference: site-plan
local-authority: BRY
required-if:
  any:
  - condition:
      field: footprint-increase
      value: true
      description: The proposal increases the built footprint.
  - condition:
      field: new-build
      value: true
      description: Proposed buildings.
  - condition:
      field: new-boundary-treatment
      value: true
      description: Boundary treatment.
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
  - condition:
      field: hard-surfacing
      value: true
      description: Changes to hard surfaces (site layout plan).
  - condition:
      field: parking-change
      value: true
      description: Changes to car parking (site layout plan).
  - condition:
      field: landscaping-works
      value: true
      description: Landscaping works (site layout plan).
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: For all proposed developments that involve an increase in built footprint, proposed buildings,
  boundary treatment or freestanding signage. ... Proposals which involve the provision of new buildings
  or other works within the application site boundary such as changes to car parking, hard surfaces or
  landscaping.
must-include:
- item: 'Block plan: the proposed development in relation to the site boundaries and other existing buildings
    in the vicinity'
  level: must
- item: Scaled accurately at 1:100, 1:200 or 1:500, stating the scale, with key dimensions annotated (width,
    height and depth of the works, overall height, and distance to site boundaries where relevant)
  level: must
- item: Proposed development hatched or outlined in red; boundary fences or vehicle accesses clearly marked;
    for freestanding signage, the location of the signage
  level: should
- item: Direction of north
  level: must
- item: 'Site layout plan: all works within the site boundary, including hard surfaces, landscaping, new
    planting, boundary treatment, and changes to accesses and car parking'
  level: should
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: hard-surfacing
        value: true
        description: Changes to hard surfaces.
    - condition:
        field: parking-change
        value: true
        description: Changes to car parking.
    - condition:
        field: landscaping-works
        value: true
        description: Landscaping works.
  source-text: Should provide details of all works within the application site boundary including changes
    to hard surfaces, landscaping, new planting, boundary treatment. Any changes to accesses and car parking
    should also be included.
- item: Site layout (landscaping) plans correlate with any BNG information submitted
  level: should
- item: Given a unique drawing number
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), page 7-8, 14 (Part 1: Block Plan; Existing
  and Proposed Site Layout Plans). The list''s block plan and site layout plan are both recorded here.
  Freestanding signage shows as ''check'' because there is no field for it.'
review-status: unverified
field-status: {}
