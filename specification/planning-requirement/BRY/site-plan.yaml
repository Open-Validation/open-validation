reference: site-plan
local-authority: BRY
required-if:
  any:
  - condition:
      field: footprint-increase
      value: true
      description: The proposal increases the built footprint.
  - condition:
      field: new-build
      value: true
      description: The proposal adds buildings, including outbuildings.
  - condition:
      field: new-boundary-treatment
      value: true
      description: The proposal involves new boundary treatments.
  - condition:
      field: new-vehicle-access
      value: true
      description: The proposal creates a vehicle access.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
source-text: Block Plan Site must be outlined in Red - Please ensure there are no other coloured outlines
  on the plan so the site outline is clear other than the site and any adjoining land.
must-include:
- item: Site outlined in red, with no other coloured outlines except the site and any adjoining land
  level: must
- item: Parking, refuse storage and trees shown, where relevant
  level: must
  source-text: Not showing enough detail such as parking, refuse, trees (where required).
confidence: medium
notes: 'Audit (wrong_app_type): the block plan is not specific to outline applications. It is required
  where the built footprint increases, buildings are added, or there are boundary treatments or freestanding
  signage; the Householder checklist adds outbuildings and vehicle access. Freestanding signage has no
  field.'
review-status: unverified
field-status: {}
