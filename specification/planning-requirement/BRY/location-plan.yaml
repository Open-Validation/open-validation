reference: location-plan
local-authority: BRY
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - ldc
      - prior-approval
      - demolition-con-area
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except Non-Material Amendment, Approval of Details Reserved by Condition
  and S73 Applications where the original site area is used.
must-include:
- item: An up-to-date plan at a scale of 1:1250 or 1:2500 with a scale bar
  level: must
- item: Site outlined in red, with no other coloured outlines other than the site and any adjoining land
  level: must
- item: Direction of north
  level: must
- item: Sufficient roads and/or buildings on adjoining land to make the exact location of the site clear
  level: must
- item: Red outline includes all land necessary to carry out the development, including access from the
    public highway
  level: must
- item: Any adjoining land in the same ownership outlined in blue
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), page 7 (Part 1: Plans and Photos). Section
  73 applications show as ''check'' because the plan is only needed when the site area differs from the
  original permission.'
review-status: unverified
field-status: {}
