reference: elevation-proposed
local-authority: BRY
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Extensions or other alterations to the elevations of an existing building, including
        replacement windows or doors or rendering/insulation.
  - condition:
      field: new-boundary-treatment
      value: true
      description: Proposed boundary treatment such as fencing or gates.
  - application-type:
      in:
      - advertising
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: For any new buildings Proposed extensions Any other proposal which involves alterations to
  the elevation of an existing building including proposals which are only for replacement windows or
  doors or rendering/insultation. Proposals which involve proposed boundary treatment such as fencing/gates.
  Proposed signage
must-include:
- item: The full exterior of all sides of the building being altered, including window and door detailing
  level: should
- item: All elevations where the works will be seen (e.g. both flank elevations for a rear extension,
    even on a semi-detached or terraced property)
  level: must
- item: Scaled accurately at 1:50 or 1:100, stating the scale, with key dimensions annotated
  level: must
- item: Given a unique drawing number
  level: must
- item: Titled; for retrospective applications where the works are complete, existing and pre-existing
    clearly titled
  level: must
- item: Accurate and correlating with partner drawings
  level: must
- item: Shows only existing or proposed development, not other proposed works (e.g. permitted development
    not yet carried out)
  level: must
- item: 'For minor alterations such as window changes, rendering or insulation: where the changes are
    clearly annotated'
  level: must
- item: 'For new buildings or substantial extensions to sensitive buildings: elevations and sections at
    1:20 of typical window sections, entrances and balconies'
  level: should
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - discretionary
- item: 'For listed building consent: 1:20 existing plans of all doors, windows, shop fronts, panelling,
    fireplaces, plaster moulding and other decorative details to be removed or altered, and 1:20 proposed
    plans and sections of all new ones'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (published January 2025), page 10 (Part 1: Existing and Proposed Elevations).
  ''Substantial extensions to sensitive buildings'' shows as ''check''.'
review-status: unverified
field-status: {}
