reference: heritage-statement
local-authority: BRY
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: Development affecting or with the potential to affect the setting of a Listed Building.
  - application-type:
      in:
      - lbc
  - site:
      in:
      - scheduled-monument
      description: Scheduled Ancient Monument Consent.
  - site:
      in:
      - conservation-area
      description: Applications within or adjacent to a Conservation Area.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Bromley Local Plan; NPPF
source-text: Development affecting or with the potential to affect the setting of a Listed Building Listed
  Building Consent Scheduled Ancient Monument Consent; Applications within or adjacent to a Conservation
  Area
must-include:
- item: 'For listed building consent: a schedule of works, an analysis of the significance of archaeology,
    history and character of the building, and the principles of, justification for and impact of the
    works on its special character and setting'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Photographs, where necessary, dated, numbered and cross-referenced to a plan
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For applications affecting the setting of heritage assets: plans showing historic features on
    or next to the site, with an analysis of their significance and the impact of the works'
  level: should
  required-if:
    site:
      in:
      - listed-building-setting
      - park-and-garden
      - scheduled-monument
      description: Affects the setting of heritage assets.
- item: 'For applications within or adjacent to a conservation area: an assessment of the impact on the
    character and appearance of the area'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
confidence: medium
notes: 'From the council''s list (published January 2025), page 33 (Part 2: Heritage Statement). Part
  2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19). The list suggests assessing
  historic, cultural, aesthetic/architectural and archaeological significance; its content items say they
  ''may be required'', so they are ''should''.'
review-status: unverified
field-status: {}
