reference: landscaping-plan
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: new-build
        value: true
        description: New build.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units, including conversions.
  - condition:
      field: external-space
      value: true
      description: Developments that include external amenity space.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policies G1, G5 and G7
source-text: Major Developments New build residential development Developments that include external amenity
  space.
must-include:
- item: Plans of hard and soft landscaping proposals for all parts of the site where no buildings are
    proposed
  level: should
- item: Relevant site features, noting those to be retained, and any species of nature conservation interest
  level: must
- item: Plant species, size and planting densities, any trees with their size, and hard landscaping materials
  level: must
- item: Site levels, gradients and earthworks, bicycle and/or refuse storage, boundary treatments and
    SuDS, as relevant
  level: must
- item: A 5-year management plan for any communal landscaping or public realm areas, saying how and by
    whom they are managed
  level: must
- item: Location and area of porous paving materials, if proposed
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: The proposal includes hardstanding.
- item: 'For major development: the Urban Greening Factor assessment and scoring, including greening measures
    considered and ruled out and why'
  level: should
  required-if:
    ref: major-development
  source-text: Applications should include detailed information on the UGF assessment and scoring, in
    line with London Plan requirements and any subsequent guidance produced by the Mayor or the borough.
    This should include detail of what greening measures have been considered and ruled out, and the reasons
    for this.
confidence: medium
notes: 'From the council''s list (published January 2025), page 36 (Part 2: Landscaping Strategy and Green
  Infrastructure). Part 2 documents are for more complex applications and ''could be requested for householder
  applications if required, this will be determined on a case-by-case basis'' (page 19). Detail should
  be proportionate to the scale of the development.'
review-status: unverified
field-status: {}
