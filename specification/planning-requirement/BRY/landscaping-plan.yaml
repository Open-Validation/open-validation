reference: landscaping-plan
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: new-build
        value: true
        description: New-build development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The new-build development is residential.
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
must-include:
- item: Cycle and/or refuse storage areas, boundary treatments and SuDS shown, as relevant
  level: must
  source-text: bicycles and/or refuse storage areas, boundary treatments and SUDs must be shown as relevant
- item: A 5-year management plan identifying how and by whom any communal landscaping or public realm
    areas would be managed
  level: must
  source-text: A management plan for a period of 5 years identifying how and by whom any communal landscaping
    or public realm areas would be managed.
confidence: medium
