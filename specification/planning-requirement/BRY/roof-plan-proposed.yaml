reference: roof-plan-proposed
local-authority: BRY
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: upper-floor-extension
      value: true
      description: First floor and two storey extensions.
  - condition:
      field: roof-alteration
      value: true
      description: Any proposed works to an existing roof, e.g. dormers, rooflights.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: New Buildings First floor and two storey extensions Any proposed works to an existing roof
  e.g., dormers, rooflights.
must-include:
- item: The shape of the roof, including features such as chimneys, extensions or windows
  level: should
- item: Scaled accurately at 1:50 or 1:100, stating the scale, with key dimensions annotated
  level: must
- item: Given a unique drawing number
  level: must
- item: Titled; for retrospective applications where the works are complete, existing and pre-existing
    clearly titled
  level: must
- item: Accurate and correlating with partner drawings
  level: must
- item: Shows only existing or proposed development, not other proposed works (e.g. permitted development
    not yet carried out)
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), page 11 (Part 1: Existing and Proposed Roof
  Plans).'
review-status: unverified
field-status: {}
