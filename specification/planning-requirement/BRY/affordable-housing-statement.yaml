reference: affordable-housing-statement
local-authority: BRY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 'Major residential development: 10 or more dwellings.'
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: 'Major residential development: a site of 0.5 ha or more.'
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Bromley Local Plan; London Plan 2021 policies H4 and H5; Affordable Housing and Viability SPG
source-text: Major residential developments.
must-include:
- item: The number and mix of dwellings, with numbers of habitable rooms and/or bedrooms, or the floorspace
    of habitable areas
  level: must
- item: Confirmation of whether grant funding with Registered Providers has been explored
  level: must
- item: Plans showing the location of units and their number of habitable rooms and/or bedrooms, and/or
    floorspace
  level: must
- item: How tenure blind development will be provided (London Plan policy D6)
  level: must
- item: A clear and full explanation of any different levels or types of affordability or tenure for different
    units
  level: must
- item: Details of any Registered Provider acting as a partner in the development
  level: must
- item: 'For estate regeneration or loss of existing housing: how proposed floorspace relates to existing
    floorspace and density, existing affordable tenures and floorspace, and which tenants have a right
    of return'
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published January 2025), page 22 (Part 2: Affordable Housing Statement).
  Part 2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19). ''Major residential'' is read
  as 10 or more dwellings or a site of 0.5 ha or more. Estate regeneration or loss of housing shows as
  ''check'' because there is no field for it.'
review-status: unverified
field-status: {}
