reference: sustainable-drainage-strategy
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: greenfield-site
      value: true
      description: Proposals on sites which are not currently developed or greenfield sites.
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policy SI 13
source-text: For developments that will increase surface water runoff (including proposals on sites which
  are not currently developed, greenfield sites and garden land) and/or result in increased demand for
  sewerage and sewage treatment; Sites traversed by public sewers. For all Major development.
must-include:
- item: A plan of the existing site
  level: should
- item: A topographical level survey of the area to metres Above Ordnance Datum (mAOD)
  level: should
- item: Plans of the proposed site layout identifying the footprint of the area being drained (buildings,
    access roads and car parks)
  level: should
- item: Existing and proposed controlled discharge rates for 1 in 1 year and 1 in 100 year (plus climate
    change) events, based on the estimated greenfield runoff rate
  level: should
- item: The proposed storage volume (attenuation)
  level: should
- item: Proposed SuDS measures, with a design statement on managing surface water as close to source as
    possible and following the London Plan drainage hierarchy
  level: should
- item: Geological information including borehole logs, depth to water table and/or infiltration test
    results
  level: should
- item: Overland flow routes for exceedance events
  level: should
- item: A management plan for future maintenance and adoption of the drainage system for the lifetime
    of the development
  level: should
- item: Suitable proposals for any existing sewers crossing the site, including possible diversion
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published January 2025), page 32 (Part 2: Foul Sewage and Surface Water
  Drainage Assessment). Part 2 documents are for more complex applications and ''could be requested for
  householder applications if required, this will be determined on a case-by-case basis'' (page 19). The
  list asks for a Foul Sewage and Surface Water Drainage Assessment that includes a Sustainable Drainage
  Strategy. Increased run-off or sewerage demand, garden land and sites crossed by public sewers show
  as ''check''.'
review-status: unverified
field-status: {}
