reference: waste-management-plan
local-authority: BRY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development (including conversion).
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New development for places of employment, education and entertainment/leisure (including
        conversions).
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Bromley Local Plan
source-text: New Residential Development (including conversion). New development for places of employment,
  education, and entertainment/leisure (including conversions).
must-include:
- item: Layout showing where refuse and recycling can be stored before collection
  level: should
- item: Swept path analysis for an LBB size refuse vehicle where the waste vehicle must enter the site
  level: must
  required-if: discretionary
- item: Location convenient for collection from an adopted highway (distance, route and gradient), with
    an adequate storage area
  level: should
- item: Where on-site car and bicycle parking will be provided
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 46 (Part 2: Refuse and Recycling Storage
  Details). Part 2 documents are for more complex applications and ''could be requested for householder
  applications if required, this will be determined on a case-by-case basis'' (page 19).'
review-status: unverified
field-status: {}
