reference: town-centre-impact-assessment
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: loss-of-use
      value: true
      description: Non-major development proposing a change of use of retail premises.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Bromley Local Plan policies 88 and 91; NPPF
source-text: Major development Non-Major developments which propose changes of use of retail premises.
must-include:
- item: A sequential test for main town centre uses located outside existing centres
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses in edge-of-centre or out-of-centre locations.
- item: A sequential test for hotels not in or on the edge of Bromley or Orpington town centres, or in
    a district or local centre
  level: must
  required-if: discretionary
- item: An impact assessment for 2,500 sq m or more of retail, leisure and office space outside town centres
  level: must
  required-if:
    all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside town centres.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: 2,500 sq m or more of retail, leisure and office space.
confidence: medium
notes: 'From the council''s list (published January 2025), page 48 (Part 2: Town Centre and Retail Impact
  Assessment). Part 2 documents are for more complex applications and ''could be requested for householder
  applications if required, this will be determined on a case-by-case basis'' (page 19).'
review-status: unverified
field-status: {}
