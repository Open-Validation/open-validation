reference: planning-statement
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: NPPF; London Plan 2021; Bromley Local Plan
source-text: Major Developments Proposals which raise a wide range of planning issues, including justification
  of "very special circumstances" regarding Green Belt / MOL.
must-include:
- item: The context and need for the development, and how it accords with national policy, the London
    Plan and the Bromley Local Plan
  level: must
- item: 'For major residential proposals: the play space strategy, showing compliance with London Plan
    policies'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units, including conversions.
- item: 'For Green Belt or MOL: which aspects are considered appropriate or inappropriate, and any ''very
    special circumstances'' relied on'
  level: should
  required-if:
    site:
      in:
      - green-belt
      description: Green Belt or Metropolitan Open Land.
confidence: medium
notes: 'From the council''s list (published January 2025), page 45 (Part 2: Planning Statement). Part
  2 documents are for more complex applications and ''could be requested for householder applications
  if required, this will be determined on a case-by-case basis'' (page 19). Proposals raising a wide range
  of planning issues show as ''check''.'
review-status: unverified
field-status: {}
