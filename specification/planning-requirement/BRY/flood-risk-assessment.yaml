reference: flood-risk-assessment
local-authority: BRY
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zones 2, 3 or 3b.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Within flood zone 1 with a site area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Within flood zone 1 with a site area of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: In areas with critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Within flood zone 1 where the SFRA shows it will be at increased risk of flooding during
        its lifetime.
  - discretionary
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: 'NPPF; Planning Practice Guidance: Flood Risk and Coastal Change'
source-text: 'Development proposals: in flood zones 2, 3 or 3b within flood zone 1 with a site area of
  1 hectare or more or in areas with critical drainage problems within flood zone 1 where the LPA''s strategic
  flood risk assessment (SFRA) shows it will be at increased risk of flooding during its lifetime that
  increases the vulnerability classification and may be subject to sources of flooding other than rivers
  or sea'
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development, and how
    they will be managed, taking climate change into account
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: Design of surface water management systems, including Sustainable Drainage Systems
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: Prepared with reference to the Council's Strategic Flood Risk Assessment
  level: should
- item: A Sequential Test, and an Exception Test where needed
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published January 2025), page 31 (Part 2: Flood Risk Assessment, Sequential
  Test and Exception Test). Part 2 documents are for more complex applications and ''could be requested
  for householder applications if required, this will be determined on a case-by-case basis'' (page 19).
  Development that increases the vulnerability classification and may be flooded from other sources shows
  as ''check''. Householder and other extensions in flood zone 2/3 up to 250 sq m use a Flood Risk Declaration
  instead (see the unmapped list).'
review-status: unverified
field-status: {}
