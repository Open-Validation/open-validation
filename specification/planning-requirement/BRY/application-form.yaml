reference: application-form
local-authority: BRY
required-if:
  always: true
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Applications ... The correct form must be submitted through the Planning Portal.
must-include:
- item: The correct form (flats and maisonettes are not 'householder' and need the Full Planning Permission
    form)
  level: must
- item: A named applicant; the applicant and agent are not listed as the same person
  level: must
- item: All sections completed in full, including the Biodiversity Net Gain minimum information
  level: must
- item: The additional information required by the GLA Planning Data Standard
  level: must
- item: A description of the proposal that accurately describes the development and includes all its elements
  level: must
- item: The correct ownership certificate signed (Certificate B where the applicant does not fully own
    the land in the red line, including flats, or anyone else has an interest in the land)
  level: must
- item: The application declaration signed
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), page 6 (Part 1: Forms and Fees).'
review-status: unverified
field-status: {}
