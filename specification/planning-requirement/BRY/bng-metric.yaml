reference: bng-metric
local-authority: BRY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is not exempt from biodiversity net gain.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Environment Act 2021; London Plan 2021 policy G6
source-text: All relevant applications (major and non-major development except for those that are specifically
  exempt) must be accompanied by a completed metric tool calculation (submitted in full) showing the site's
  biodiversity value before development.
must-include:
- item: The Statutory Metric (or, for non-major applications, the Small Sites Metric) setting out the
    pre-development biodiversity value of the site
  level: must
  source-text: The Biodiversity Net Gain Statutory Metric should set out the pre-development biodiversity
    value of the site. For non-major applications, applicants may use the Small Sites Metric.
- item: Submitted in full
  level: must
- item: Pre-development value on the date of application or an earlier proposed date; any earlier date
    stated, with the reasons for it
  level: must
- item: Prepared by a professional ecologist or, for the small sites metric, a competent person
  level: should
confidence: medium
