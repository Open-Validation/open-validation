reference: noise-assessment
local-authority: BRY
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Mixed use or new noise-sensitive development (including residential) close to noise
        generating activities.
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals that include noise generating activities.
  - condition:
      field: plant-equipment
      value: true
      description: Proposals that include noise generating equipment or machinery.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policies D13 and D14
source-text: All mixed use developments close to noise generating activities (including residential).
  New noise-sensitive development (including residential) close to noise generating activities; Proposals
  that include noise generating activities & equipment / machinery
must-include:
- item: Surveys to BS 7445 to determine ambient and background noise levels
  level: should
- item: Noise assessments, predictions and calculations, with recommendations and specifications of any
    works needed to control noise
  level: should
- item: Any works needed to control noise detailed on the application drawings
  level: should
- item: 'Where external noise attenuation equipment (e.g. acoustic enclosures or screens) is proposed:
    its location, size and visual impact'
  level: should
  required-if: discretionary
- item: An assessment of vibration where relevant, e.g. housing next to railway tracks or use of heavy
    machinery
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published January 2025), page 42 (Part 2: Noise and Vibration Impact
  Assessment). Part 2 documents are for more complex applications and ''could be requested for householder
  applications if required, this will be determined on a case-by-case basis'' (page 19).'
review-status: unverified
field-status: {}
