reference: section-existing
local-authority: BRY
required-if:
  any:
  - condition:
      field: height-change
      value: true
      description: Changing floor to ceiling height levels, or raising the roof height.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential units, including conversions.
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels (including sloping ground) or garden levels, such as a raised
        patio or outdoor swimming pool (site sections).
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; London Plan
  2021 policy D6
source-text: Proposal involving changing floor to ceiling height levels. Proposals involving raising of
  the roof height New residential units including conversions ... Proposals which involve a change in
  ground levels, including development on a sloping ground. Proposals which involve changes in garden
  levels such as raised patio or outdoor swimming pool.
must-include:
- item: Existing and finished levels, with floor to ceiling heights annotated
  level: must
- item: 'For new residential units (including conversions): any floor area with a head height of less
    than 0.9 m and less than 1.5 m'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential units, including conversions.
- item: Scaled accurately at 1:50 or 1:100, stating the scale, with key dimensions annotated
  level: must
- item: Given a unique drawing number
  level: must
- item: Titled; for retrospective applications where the works are complete, existing and pre-existing
    clearly titled
  level: must
- item: Accurate and correlating with partner drawings
  level: must
- item: Shows only existing or proposed development, not other proposed works (e.g. permitted development
    not yet carried out)
  level: must
- item: Site sections showing the changes in ground levels, with finished floor levels
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground or garden levels.
confidence: medium
notes: 'From the council''s list (published January 2025), page 12-13 (Part 1: Existing and Proposed Section
  Drawings; Existing and Proposed Site Sections). Site sections may be shown on the elevations if enough
  detail is shown.'
review-status: unverified
field-status: {}
