reference: design-and-access-statement
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
source-text: 'For Major Applications, Design and Access Statements shall: Explain the design principles
  and concepts that have been applied to the development Demonstrate the steps taken to appraise the context
  of the development and how the design of the development takes that context into account Include all
  options considered in the evolution of a scheme with a clear explanation as to why other options were
  discounted Explain the policy adopted as to access …'
must-include:
- item: All options considered in the evolution of the scheme, with a clear explanation of why other options
    were discounted
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'Audit (wrong_app_type): also required for Listed Building Consent and for one or more dwellings,
  or 100 sqm or more, in a Conservation Area (including householder works).'
review-status: unverified
field-status: {}
