reference: design-and-access-statement
local-authority: BRY
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more dwellings.
  - all:
    - site:
        in:
        - conservation-area
        description: The building is in a conservation area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Proposed floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; London Plan
  2021 policies D4, D5 and E10
source-text: Major Applications Proposals for one or more dwellings where the proposed dwelling is in
  a Conservation Area. Proposed floorspace of 100sqm or more where the building is in a Conservation Area.
  Applications for Listed Building Consent.
must-include:
- item: 'For major applications: the design principles and concepts applied'
  level: must
  required-if:
    ref: major-development
- item: 'For major applications: the steps taken to appraise the context and how the design takes it into
    account'
  level: must
  required-if:
    ref: major-development
- item: 'For major applications: all options considered in the evolution of the scheme, with why others
    were discounted'
  level: must
  required-if:
    ref: major-development
- item: 'For major applications: the policy adopted as to access, and how specific uses that might affect
    access have been addressed'
  level: must
  required-if:
    ref: major-development
- item: An inclusive design statement (London Plan Policy D5C)
  level: must
  source-text: London Plan Policy D5C also requires that design and access statements include an inclusive
    design statement.
confidence: medium
notes: 'From the council''s list (published January 2025), page 17 (Part 1: Design and Access Statement).
  For serviced accommodation, details of accessible bedrooms should be given (London Plan Policy E10).'
review-status: unverified
field-status: {}
