reference: arboriculturist-report
local-authority: BRY
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Existing trees on or next to the site (including street trees) that could be affected
      by the proposal.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: London Plan 2021 policy G7; BS 5837
source-text: For development on sites where there are existing trees that could be affected by the proposal.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Prepared by a qualified arboriculturist
  level: should
- item: Land survey (1:100 or 1:200) locating all trees, hedgerows and shrubs over 2 m high and/or 7.5
    cm stem diameter, spot heights, and trees on adjoining land within half a tree height of the boundary
  level: should
- item: 'Tree survey to BS 5837 (sections 4.2-4.4): species, height, stem diameter, canopy spread, crown
    base height, age class, condition, management recommendations and retention category (A, B, C or R)'
  level: should
- item: How tree removals will be compensated by adequate replacements
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 50 (Part 2: Tree Survey and Arboricultural
  Implications Report). Part 2 documents are for more complex applications and ''could be requested for
  householder applications if required, this will be determined on a case-by-case basis'' (page 19). The
  list cites BS 5837:2005 (since replaced by BS 5837:2012).'
review-status: unverified
field-status: {}
