reference: floor-plan-proposed
local-authority: BRY
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Building works, other than proposals only for external works such as boundary treatment
        or signage.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; London Plan
  2021 policies D6 and D7
source-text: For all proposed developments except proposals which are only for external works such as
  boundary treatment or proposed signage.
must-include:
- item: Shows the layout of the existing building(s) and of the proposed development
  level: should
- item: Scaled accurately at 1:50 or 1:100, stating the scale, with key dimensions annotated
  level: must
- item: Given a unique drawing number
  level: must
- item: Titled; for retrospective applications where the works are complete, existing and pre-existing
    clearly titled
  level: must
- item: Accurate and correlating with partner drawings
  level: must
- item: Shows only existing or proposed development, not other proposed works (e.g. permitted development
    not yet carried out)
  level: must
- item: 'For new dwellings (including conversions): annotated with unit size, and any floor area with
    a head height of less than 0.9 m and less than 1.5 m indicated'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential units, including conversions.
- item: 'For major residential schemes: floor plans at 1:50 for each unit type, annotated to show compliance
    with the full wheelchair housing (M4(3)) criteria'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units, including conversions.
  source-text: In order to demonstrate compliance with the standards floor plans at a scale of 1:50 for
    each unit type proposed must be submitted. The floor plans must be annotated to show compliance with
    full relevant criteria.
confidence: medium
notes: 'From the council''s list (published January 2025), page 8-9, 20 (Part 1: Existing and Proposed
  Floor Plans; Part 2: Accessible/Adaptable Homes and/or Wheelchair Housing Statement). Wheelchair requirements
  apply to major proposals (10% M4(3)).'
review-status: unverified
field-status: {}
