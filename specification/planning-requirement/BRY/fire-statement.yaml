reference: fire-statement
local-authority: BRY
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
source-text: 'Planning Gateway One Fire Statement When Required Applications for Full planning permission
  which involve: provision of one or more relevant buildings, or'
confidence: medium
notes: The excerpt is cut off at 'relevant buildings'; the rule uses the national definition of a relevant
  building. The separate London Plan Fire Statement is listed under unmapped.
review-status: unverified
field-status: {}
