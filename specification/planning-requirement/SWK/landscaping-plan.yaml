reference: landscaping-plan
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - ref: major-development
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P59, P60 and P61
source-text: Submit landscaping details with all major planning applications.
must-include:
- item: Site plans showing all retained and proposed trees on and near the site
  level: must
- item: Tree trenches and pits
  level: must
- item: Location and extent of sustainable urban drainage systems, particularly attenuation tanks
  level: must
- item: Planting schedule of species, sizes and numbers, with typical planting cross-sections
  level: must
- item: 'Where trees are proposed: an irrigation and young tree maintenance schedule (girth 8-16cm every
    3 years; above 16cm every 5 years)'
  level: must
  required-if: discretionary
- item: 'Where trees are in engineered pits: the sustainable soil volumes, in connected trenches where
    possible'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Landscaping details (major section)'. Taken from the full planning checklist, so
  shown for full applications; the outline checklist says officers will say at pre-application stage what
  an outline application needs, and reserved matters applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
