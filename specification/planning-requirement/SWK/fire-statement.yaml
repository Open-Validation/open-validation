reference: fire-statement
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
confidence: medium
notes: 'From the audit (missing_requirement): Fire statement (London Plan D12(B)) and Fire safety Gateway
  1 form (2+ dwellings, educational accommodation, 18 m+ or 7+ storeys).'
review-status: unverified
