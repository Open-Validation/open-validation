reference: fire-statement
local-authority: SWK
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - prior-approval
    - any:
      - application-type:
          in:
          - pa-flats-de-blocks
          - pa-flats-de-comm
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: On an existing building that is 18m or more in height.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: London Plan 2021 policy D12
source-text: Complete and submit fire statement . You must refer to the London Plan Policy D12 (B) draft
  fire statement guidance and provide all listed required information.
must-include:
- item: 'Fire safety strategy: name and title of who wrote and approved the fire safety information, with
    a clear statement of their competence, qualifications and experience'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
        - hh
    - application-type:
        in:
        - prior-approval
- item: 'Fire safety strategy: information under each part of London Plan policy D12(A), specific to the
    development'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
        - hh
    - application-type:
        in:
        - prior-approval
- item: 'Fire safety strategy: the relevant fire safety design codes and standards, and how they achieve
    the highest standards proportionate to the development'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
        - hh
    - application-type:
        in:
        - prior-approval
- item: A Reasonable exception form instead of a strategy only if the application creates no additional
    dwellings or commercial units, provides no new lift, does not change external materials and does not
    change communal areas in the evacuation strategy
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
  source-text: 'Submit a Reasonable exception form if the application: • creates no additional dwellings
    or commercial units and • does not provide a new lift and • does not change external materials and
    • does not change internal or external communal areas that form part of the evacuation strategy for
    the property'
- item: 'Fire statement under London Plan policy D12(B), with all the information listed in the guidance:
    construction methods, products and materials; means of escape, stair cores and evacuation strategy
    for disabled users; features that reduce the risk to life; access for fire service personnel, equipment
    and appliances; future modifications not compromising fire safety'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline
      - ref: major-development
- item: 'Planning gateway 1 (fire safety) form: fire safety principles for each building, site layout,
    emergency vehicle access and firefighting water supplies, fire safety consultation and how it was
    incorporated, and fire safety policies considered'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Contains 2 or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Is educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: Is 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: Contains 7 or more storeys.
  source-text: 'Submit a gateway 1 (fire safety) form if your development: • contains 2 or more dwellings
    • is educational accommodation • is 18 metres or more in height • contains 7 or more storeys'
- item: 'Listed building consent: a Reasonable exception form, and a fire safety strategy complying with
    London Plan guidance on policy D12(A) giving the author''s name and competency, the site address,
    the date completed and all the information in section 3 of the guidance'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: To ensure the highest fire safety standards are met for all development in Southwark, complete
    a reasonable exception form . ... You must provide a fire safety strategy document that complies with
    London plan guidance fire safety policy D12(A) 2021 .
confidence: medium
notes: 'From the council''s list (published 16 October 2026), the ''full planning application'' checklist
  web page, section ''Fire safety strategy (or Reasonable exception form); Fire statement; Fire safety
  gateway 1 form''. The full checklist lists both the fire safety strategy and the fire statement as ''must
  be included''; the index page says major developments must complete a fire statement and that fire safety
  information is needed with every application. The householder checklist asks for a strategy or Reasonable
  exception form, the outline checklist for a fire statement, the listed building consent checklist for
  both a Reasonable exception form and a strategy, and the prior approval checklist for a strategy for
  new dwellinghouses on detached blocks of flats or commercial/mixed-use buildings, or on existing buildings
  18m or more high. The gateway 1 form is in the major section; the list gives its four triggers as separate
  bullets (the 2021 Order applies it to buildings with 2 or more dwellings or educational accommodation
  that are also 18m or 7 storeys or more). The gateway 1 item is encoded as the 2021 Order applies it:
  homes or educational accommodation AND 18m or 7 storeys.'
