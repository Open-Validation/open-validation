confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Biodiversity net gain (BNG)'. From the 'Biodiversity net gain (BNG)' section (also
  in the major section and on the outline checklist). Exemptions must be explained in the application
  form with evidence (self-build needs the self-build verification/exemption form; a de minimis claim
  needs photographs, aerial photography, reports or a scaled plan). Sites with priority habitat cannot
  claim an exemption. Shown with the biodiversity-gain-condition field because householder and other exempt
  applications are exempt by law. A local requirement on top of the national minimum.
