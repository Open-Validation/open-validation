reference: air-quality-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor planning applications (air quality neutral assessment), unless exempt.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: London Plan 2021 policy SI 1
source-text: 'Submit an air quality neutral assessment (AQNA) with all minor planning applications unless
  your development: ... You must submit an air quality assessment for all major applications.'
must-include:
- item: 'Minor: an air quality neutral assessment following the GLA''s air quality neutral guidance and
    the council''s technical guidance'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor planning applications.
- item: 'Major: baseline details for the site and local area'
  level: must
  required-if:
    ref: major-development
- item: 'Major: assessment methodology'
  level: must
  required-if:
    ref: major-development
- item: 'Major: construction phase impact'
  level: must
  required-if:
    ref: major-development
- item: 'Major: development impacts'
  level: must
  required-if:
    ref: major-development
- item: 'Major: proposed mitigation measures'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Air quality neutral assessment; Air quality assessment (major section)'. A minor
  application needs no AQNA if it creates no additional car parking, no increase in local car journeys
  and no new combustion plant, is connected to a heat network or uses low-NOx gas boilers (below 40 mg/kWh),
  and any new parking is within London Plan policies T6 to T6.5. Southwark's Air Quality Management Area
  covers most of the borough. Taken from the full planning checklist, so shown for full applications;
  the outline checklist says officers will say at pre-application stage what an outline application needs,
  and reserved matters applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
