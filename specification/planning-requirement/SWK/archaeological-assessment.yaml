reference: archaeological-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: Proposed groundworks are within an archaeological priority area.
      - condition:
          field: ground-disturbance
          value: true
          description: Groundworks are proposed.
    - condition:
        field: basement
        value: true
        description: Building new basements or extensions to basements.
    - condition:
        field: earthworks
        value: true
        description: Other extensive groundworks.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P23
source-text: 'Submit an archaeological desk-based assessment: • where your proposed groundworks are within
  an archaeological priority area • if you''re building new basements, extensions to basements or other
  extensive groundworks'
must-include:
- item: The archaeological interest and potential of the site, and an assessment of the impacts of the
    development
  level: must
- item: 'Full applications: an archaeological evaluation report, from a scheme of investigation by an
    archaeologist (method statement agreed with the council''s archaeologist), giving the results and
    meeting Chartered Institute for Archaeologists standards'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - any:
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: Groundworks in an archaeological priority area.
        - condition:
            field: ground-disturbance
            value: true
            description: Groundworks are proposed.
      - condition:
          field: earthworks
          value: true
          description: Extensive groundworks outside archaeology priority areas.
  source-text: 'Submit an archaeological evaluation report for: • applications where groundworks are proposed
    in an archaeological priority area • applications outside archaeology priority areas where extensive
    groundworks are proposed'
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Archaeological desk-based assessment; Archaeological evaluation report'. The householder
  checklist has the same desk-based assessment requirement.
review-status: unverified
field-status: {}
