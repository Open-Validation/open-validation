reference: archaeological-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - any:
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Groundworks are proposed.
      - site:
          in:
          - archaeological-priority-area
          description: The site is in an archaeological priority area.
    - condition:
        field: basement
        value: true
        description: New basements or basement extensions.
    - condition:
        field: earthworks
        value: true
        description: Other extensive groundworks.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
confidence: medium
notes: 'Audit (wrong_trigger, missing_requirement): an archaeological desk-based assessment for groundworks
  in an archaeological priority area, or new basements, basement extensions or other extensive groundworks
  (householder and full). The full checklist also asks for an archaeological evaluation report: "The completed
  archaeological evaluation report must detail the results of the work."'
review-status: unverified
field-status: {}
