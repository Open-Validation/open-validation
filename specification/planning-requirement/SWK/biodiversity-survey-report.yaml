reference: biodiversity-survey-report
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Proposed tree works, or development affecting mature trees, trees with holes, cracks
            or cavities, or trees with a girth over 1m at chest height.
      - condition:
          field: previously-developed-land
          value: true
          description: Proposals affecting 'derelict' land (brownfield sites).
      - condition:
          field: demolition
          value: true
          description: Demolition or removal of buildings and structures.
      - condition:
          field: building-works
          value: true
          description: Modification or conversion of buildings and structures (especially roof voids).
      - discretionary
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: protected-species
        value: true
        description: The development is likely to affect bats or their roost, foraging or commuting habitats.
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P57, P59 and P60
source-text: 'You must submit an assessment for: • all proposed tree works • development affecting mature
  trees • trees with obvious holes, cracks and cavities • trees with a girth greater than 1m at chest
  height • proposals affecting ‘derelict’ land (brownfield sites), allotments and mature gardens • railway
  land including bare ground that may support ground-nesting birds or invertebrates • proposals including
  the modification, conversion, demolition or removal of buildings and structures (especially roof voids)'
must-include:
- item: Bat survey prepared by a qualified ecologist, where bats or their habitats are likely to be affected
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Bats or their habitats are likely to be affected.
  source-text: 'You must submit a bat survey with your application if the development is likely to affect
    bats or their: • roost habitats • foraging habitats • commuting habitats A qualified ecologist must
    prepare the survey.'
- item: 'Where biodiversity net gain applies: a biodiversity report showing how the biodiversity gain
    hierarchy has been followed, with photographs and maps'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the biodiversity gain condition.
- item: 'Works to trees: how the site has taken a net gain approach to biodiversity, and any impacts from
    the works on the site or nearby sites'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  source-text: Explain how the site has taken a net gain approach to biodiversity. It should state if
    there are any impacts from the development. Or if any impacts affect nearby sites.
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Ecological impact assessment; Bat survey'. Also on the outline checklist ('Ecological
  impact assessment', must be included) and the trees checklist ('Biodiversity survey and report', must
  be included). Allotments, mature gardens and railway land have no field yet, so show as discretionary.
  Where there is no habitat apart from buildings and hard standing, a preliminary ecological assessment
  is enough.
review-status: unverified
field-status: {}
