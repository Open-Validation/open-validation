reference: arboriculturist-report
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - prior-approval
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Pruning or removal of trees, a tree on or close to the development, excavating foundations
        or installing service runs close to trees.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P59 and P61
source-text: 'Submit a tree survey or arboricultural impacts assessment for applications: • involving
  the pruning or removal of existing trees • where a tree is on or close to where you are developing •
  where you are excavating the foundations of a building and a tree is close by • where you are installing
  service utility runs close to trees'
must-include:
- item: Appraisal of the quality of existing trees on the site
  level: must
- item: Tree protection measures during construction
  level: must
- item: Prepared by a named project arboricultural consultant
  level: must
- item: Tree retention and removal plans
  level: should
- item: Root protection areas on the proposed layout plans
  level: should
- item: Complies with BS 5837, BS 3998, BS 8545 and Trees and Design Action Group (TDAG) guidance
  level: should
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Tree survey'. Also on the householder checklist (no trigger given there, so the same
  one is used) and the prior approval checklist ('Tree survey (for works that impact trees)').
review-status: unverified
field-status: {}
