reference: design-and-access-statement
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
    - site:
        in:
        - conservation-area
        description: The property is in a conservation area.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P13 and P14
source-text: If you submit a planning application for a property in a conservation area, you must write
  a design and access statement.
must-include:
- item: Site safety
  level: must
- item: Site security
  level: must
- item: Site accessibility
  level: must
- item: The relationship between the proposed buildings and their surroundings
  level: must
- item: Proportionate to the complexity of the application but not long (for most straightforward applications,
    perhaps a page)
  level: should
confidence: medium
notes: 'From the council''s list (published 16 October 2026), the ''full planning application'' checklist
  web page, section ''Design and access statement''. The householder checklist adds: ''You might also
  be required to submit a design and access statement if you are doing works on the border of a conservation
  area'', which shows as discretionary. The list does not mention the national requirement for major development.'
review-status: unverified
