reference: location-plan
local-authority: SWK
required-if:
  application-type:
    in:
    - full
    - hh
    - outline
    - lbc
    - demolition-con-area
    - prior-approval
    - ldc
    - advertising
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Submit a plan of the site showing the application site and its surrounding area.
must-include:
- item: At 1:1,250 or 1:2,500 with a scale bar, on A4 or A3 paper
  level: must
- item: An up-to-date base map
  level: must
- item: Roads or buildings on land adjoining the site, labelling at least 2 roads
  level: must
- item: Application site outlined clearly in red, including all land for access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings
  level: must
- item: Any additional adjoining land owned by the applicant outlined in blue
  level: must
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Location plan'. The same location plan requirement is in the 'what must be included'
  section of the householder, outline, listed building consent, demolition in a conservation area, prior
  approval, lawful development certificate, advertisement consent and trees checklists.
review-status: unverified
field-status: {}
