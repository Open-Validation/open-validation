reference: construction-management-plan
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
  - application-type:
      in:
      - pa-extension
      - pa-demo-building
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P50
source-text: You must submit a Demolition/Construction Management Plan (D/CEMP) with all major planning
  applications.
must-include:
- item: How construction harm to the environment and neighbours will be managed and lessened
  level: must
  required-if:
    ref: major-development
- item: 'Larger home extension prior approval: how the impact on neighbours (air quality, noise, light)
    will be reduced, and actions to reduce disturbance from excavation, demolition or construction and
    prevent damage to trees'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
  source-text: details of how you intend to reduce the impact your building will have on your neighbours
    (air quality, noise, light) • details of actions to reduce disturbance due to substantial excavation
    or demolition works, construction works, and prevent damage to trees
- item: 'Demolition prior approval: a demolition method statement'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
  source-text: a demolition method statement
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Demolition or construction management plan'. The prior approval checklist ('Supporting
  documents (larger homes extensions)' and 'Supporting documents (demolition)') adds the prior approval
  items. Taken from the full planning checklist, so shown for full applications; the outline checklist
  says officers will say at pre-application stage what an outline application needs, and reserved matters
  applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
