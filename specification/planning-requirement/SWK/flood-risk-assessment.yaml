reference: flood-risk-assessment
local-authority: SWK
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3, including minor works and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Flood zone 1 sites over 1 ha.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Flood zone 1 sites over 1 ha.
  - condition:
      field: basement
      value: true
      description: Basement extensions.
  - all:
    - ref: major-development
    - site:
        in:
        - critical-drainage-area
        description: The site is in a critical drainage area.
  - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
confidence: medium
notes: 'From the audit (missing_requirement): Flood Zone 2/3 including minor works and change of use,
  Zone 1 >1 ha, basement extensions, majors in critical drainage areas, and Zone 1 with a notified critical
  drainage problem (shown as officer discretion).'
review-status: unverified
field-status: {}
