reference: flood-risk-assessment
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zone 2 or 3, including minor development and changes of use.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Site of more than 1 hectare in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Site of more than 1 hectare in Flood Zone 1.
      - condition:
          field: basement
          value: true
          description: Basement extensions.
      - all:
        - ref: major-development
        - site:
            in:
            - critical-drainage-area
            description: In a Critical Drainage Area for surface water flooding.
      - site:
          in:
          - critical-drainage-area
          description: In Flood Zone 1 with a critical drainage problem notified by the Environment Agency.
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P68
source-text: 'Submit a flood risk assessment for: • all applications in Flood Zones 2 and 3, including
  minor development and changes of use • all developments of sites more than 1 hectare in Flood Zone 1
  • all basement extensions • all major applications in Critical Drainage Areas for surface water flooding
  • all applications within Flood Zone 1 where there is a critical drainage problem as notified by the
  Environment Agency'
must-include:
- item: Flood measures, and the actions to be taken before and during a flood
  level: must
- item: The risks of all forms of flooding to and from the site
  level: must
- item: How flood risk will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems, including sustainable drainage systems
  level: must
- item: Safe access to and from the site in areas at risk of flooding
  level: must
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Flood risk assessment'. The outline checklist says officers 'will usually need' a
  flood risk assessment at outline stage, so that part shows as discretionary.
review-status: unverified
field-status: {}
