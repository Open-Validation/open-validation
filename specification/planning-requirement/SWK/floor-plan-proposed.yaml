reference: floor-plan-proposed
local-authority: SWK
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - full
        - ldc-prospective-use
    - condition:
        field: building-works
        value: true
        description: The application changes the inside of the building.
  - application-type:
      in:
      - pa-extension
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P13, P14, P15 and P56
source-text: If you are changing the inside of the building, submit the old and proposed floor plan drawings.
must-include:
- item: An individual floor plan for each floor of the building
  level: must
- item: Proposed buildings (including extensions and outbuildings) shown in context with neighbouring
    buildings
  level: must
- item: At 1:100 or 1:50 on A4 or A3 paper, with a scale bar on each plan
  level: must
  required-if:
    application-type:
      in:
      - full
      - lbc
      - ldc-prospective-use
      - advertising
- item: A unique reference number on each drawing
  level: must
  required-if:
    application-type:
      in:
      - full
      - lbc
      - ldc-prospective-use
      - advertising
- item: Written dimensions, especially for proposed extensions
  level: must
  required-if:
    application-type:
      in:
      - full
      - lbc
      - ldc-prospective-use
      - advertising
- item: Details of materials used in the development
  level: must
  required-if:
    application-type:
      in:
      - full
      - lbc
      - ldc-prospective-use
      - advertising
- item: The unit reference number and tenure of each proposed residential unit, and which units meet Part
    M4 of the Building Regulations
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new residential units, or changing a house to flats.
    - ref: major-development
  source-text: ensure floor plans identify the unit reference number for each proposed unit with tenure
    • ensure floor plans make clear which units meet M4 of the building regulations
- item: 'Lawful development certificate for extending a home: whether any side-facing windows can be opened
    and are obscure glazed'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: residential-extension
        value: true
        description: Extending a home with side-facing windows.
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Existing and proposed floor plans'. The householder and listed building consent checklists
  require floor plans for every application; the lawful development certificate checklist asks for them
  for some proposed certificates where the inside of the building changes. Scale, reference numbers, dimensions
  and materials are listed on the full, listed building consent and lawful development certificate checklists.
  The prior approval checklist asks for proposed floor plans for larger home extensions; the unit details
  come from the full checklist's 'Schedule of accommodation' section.
review-status: unverified
field-status: {}
