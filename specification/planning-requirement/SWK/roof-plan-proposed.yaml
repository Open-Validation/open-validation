reference: roof-plan-proposed
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
    - any:
      - condition:
          field: footprint-increase
          value: true
          description: Adding an extension or new outbuildings.
      - condition:
          field: roof-alteration
          value: true
          description: Adding roof lights or altering the roof.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to the roof, including extensions, dormer windows and roof lights.
  - application-type:
      in:
      - pa-extension
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
source-text: Submit roof plans if you are making changes to an existing property such as adding an extension,
  roof lights or new outbuildings.
must-include:
- item: At 1:100 or 1:50 on A4 or A3 paper, with a scale bar on each plan
  level: must
- item: A unique reference number on each drawing
  level: must
- item: Written dimensions, especially for proposed extensions
  level: must
- item: Details of materials used in the development
  level: must
- item: 'Lawful development certificate: full calculations of the existing and proposed cubic content
    of the roof space'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'Lawful development certificate: how far roof lights project from the roof slope'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'Lawful development certificate: distance between the eaves of the original roof and the bottom
    of any dormer window'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Roof extensions, new lights or new outbuildings'. Also on the householder checklist;
  the prior approval checklist asks for a proposed roof plan for larger home extensions.
review-status: unverified
field-status: {}
