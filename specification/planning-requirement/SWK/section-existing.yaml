reference: section-existing
local-authority: SWK
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: Alterations to ground levels, including raised or sunken patios, decking and steps.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
        - ldc-prospective-use
    - any:
      - condition:
          field: height-change
          value: true
          description: Altering ceiling or roof heights.
      - condition:
          field: basement
          value: true
          description: Basement works.
      - condition:
          field: roof-alteration
          value: true
          description: Adding a roof extension.
      - condition:
          field: change-in-ground-levels
          value: true
          description: Changes to ground levels, such as sunken patios or decking.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P12, P13 and P56
source-text: 'Submit cross-section drawings with planning applications for: • alterations to ground levels
  including raised or sunken patios, decking and steps • the conversion of a basement or loft to living
  space, where ceiling heights might not be consistent'
must-include:
- item: At 1:100 or 1:50 on A4 or A3 paper, with a scale bar on each plan
  level: must
- item: A unique reference number on each drawing
  level: must
- item: Written dimensions, especially for proposed extensions
  level: must
- item: Ceiling heights measured on the drawings, especially for loft and basement conversions
  level: must
- item: Any living space with a ceiling height of less than 2.3m labelled
  level: must
- item: The height and size of the building's storeys and its internal features
  level: must
  required-if:
    application-type:
      in:
      - hh
      - ldc-prospective-use
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Cross-sections'. The householder checklist (and the lawful development certificate
  checklist) asks for sections when altering ceiling or roof heights, doing basement works, adding a roof
  extension or changing ground levels; the listed building consent checklist always asks for them. For
  full applications, basement or loft conversions 'where ceiling heights might not be consistent' show
  as discretionary.
review-status: unverified
field-status: {}
