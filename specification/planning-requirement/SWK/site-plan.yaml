reference: site-plan
local-authority: SWK
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - outline
      - lbc
      - demolition-con-area
      - prior-approval
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Submit a site plan showing the development site, its boundaries and on-site buildings.
must-include:
- item: At 1:100 or 1:50 on A4 or A3 paper (unless a different scale is required), with a scale bar and
    north arrow
  level: must
- item: All immediately adjoining buildings and all main roads around the site clearly labelled and numbered
  level: must
- item: The property and all land for access from a public highway, visibility splays, landscaping, car
    parking and open areas around buildings outlined in red
  level: must
- item: Any other land within the applicant's control close to or adjoining the site outlined in blue
  level: must
- item: All disabled car parking spaces on site clearly labelled
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new residential units, or changing a house to flats.
    - ref: major-development
  source-text: submit a site plan that clearly labels all disabled car parking spaces on site
- item: 'Lawful development certificate for extending a home: a plan of the entire curtilage, with the
    area of the curtilage and of the extension or outbuilding in square metres'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: residential-extension
        value: true
        description: Extending a home.
  source-text: submit at least one plan that must include the entire curtilage of the property. You must
    provide details of the area of the curtilage, and the area of the extension or outbuilding, in square
    metres
- item: 'Lawful development certificate for front garden hardstanding: confirmation that the ground materials
    are semi-permeable'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: hard-surfacing
        value: true
        description: Front garden hardstanding.
  source-text: confirm the proposed ground materials are semi-permeable
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Site plan'. Also required by the householder, outline, listed building consent, demolition
  in a conservation area and prior approval checklists. The lawful development certificate checklist lists
  it under 'Required for some proposed lawful development certificate applications', so that part shows
  as discretionary.
review-status: unverified
field-status: {}
