reference: town-centre-impact-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - all:
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: Buildings over 1,000 sq m floorspace.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Main town centre uses outside of town and local centres.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P35 and P36
source-text: Submit a town centre impact assessment with all applications for buildings over 1,000 sqm
  floorspace. It must provide main town centre uses outside of town and local centres.
must-include:
- item: That the development complies with the government's sequential test
  level: must
- item: That it will not harm the success of existing town centres or planned investment in them
  level: must
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Town centre impact assessment (major section)'. Taken from the full planning checklist,
  so shown for full applications; the outline checklist says officers will say at pre-application stage
  what an outline application needs, and reserved matters applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
