reference: heritage-statement
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - lbc
        - demolition-con-area
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        - park-and-garden
        - scheduled-monument
        description: The property is in or close to a conservation area, a listed building, a historic
          park or garden or a scheduled ancient monument.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: The home is a listed building.
  - application-type:
      in:
      - ldc-proposed-work-lb
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P13 to P21 and P23 to P26
source-text: 'You must provide a heritage statement if your property is in or close to: • a conservation
  area • a listed building • a historic park or garden • a scheduled ancient monument'
must-include:
- item: 'Lawful development certificate for works to a listed building: details of the listed building,
    including the published listing description'
  level: must
  required-if:
    application-type:
      in:
      - ldc-proposed-work-lb
- item: 'Lawful development certificate for works to a listed building: why the works would not affect
    its special architectural or historic interest and so do not need listed building consent'
  level: must
  required-if:
    application-type:
      in:
      - ldc-proposed-work-lb
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Heritage statement'. Also on the listed building consent and demolition in a conservation
  area checklists; the householder checklist asks for one only if the home is a listed building. The lawful
  development certificate items are from its 'Supporting information (for works to a listed building)'
  section.
review-status: unverified
field-status: {}
