reference: lighting-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P56
source-text: 'Submit a lighting assessment for all applications: • where external lighting is proposed
  • involving works to areas with public access'
must-include:
- item: Layout plan with beam orientation
  level: must
- item: Schedule of the equipment in the design
  level: must
- item: Hours of operation
  level: must
- item: Light levels and spillage
  level: must
- item: Size of the lights/light fittings
  level: must
- item: 'For projecting signs: distance from the edge of the sign to the kerb edge'
  level: must
  required-if: discretionary
- item: Impact on biodiversity, where on or near a site important for nature conservation
  level: must
  required-if:
    site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      description: On or near a site important for nature conservation.
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Lighting assessment'. Works to areas with public access have no field yet, so show
  as discretionary. Taken from the full planning checklist, so shown for full applications; the outline
  checklist says officers will say at pre-application stage what an outline application needs, and reserved
  matters applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
