reference: lighting-assessment
local-authority: SWK
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: External lighting is proposed.
  - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
source-text: 'Lighting assessment Lighting assessment Submit a lighting assessment for all applications:
  where external lighting is proposed involving works to areas with public access Make sure the assessment
  includes: layout plan with beam orientation schedule of the equipment in the design hours of operation
  light levels and spillage the size of the lights/light fittings the distance from the edge of the sign
  to the kerb edge (for projection signs) You must also show how your proposal will impact biodivers'
must-include:
- item: Layout plan with beam orientation
  level: must
- item: Schedule of the equipment in the design
  level: must
- item: Hours of operation
  level: must
- item: Light levels and spillage
  level: must
- item: The size of the lights or light fittings
  level: must
- item: The distance from the edge of the sign to the kerb edge
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: How the proposal will impact biodiversity
  level: must
confidence: medium
notes: '''Submit a lighting assessment for all applications: where external lighting is proposed involving
  works to areas with public access''. Works to areas with public access are shown as officer discretion.
  The excerpt is cut off after the biodiversity item.'
review-status: unverified
field-status: {}
