reference: affordable-housing-statement
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The application creates 1 or more homes.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies SP1, P1 and IP3
source-text: Policy P1 requires you to help provide affordable housing in Southwark. This applies to any
  application that creates 1 or more homes. ... You need to submit an affordable housing statement with
  all major applications that provide housing.
must-include:
- item: 'Where affordable housing cannot be on or off site: the payment in lieu (at least 35% of habitable
    rooms at the rate per habitable room for the CIL zone, Aylesbury Area Action Core or self-build),
    subject to viability'
  level: must
  required-if: discretionary
- item: 'Major: a completed housing delivery monitoring schedule'
  level: must
  required-if:
    ref: major-development
- item: 'Major: the existing buildings on the site and how long they have been there'
  level: must
  required-if:
    ref: major-development
- item: 'Major: justification of the level of affordable housing proposed'
  level: must
  required-if:
    ref: major-development
- item: 'Major: tenure integration or tenure blindness'
  level: must
  required-if:
    ref: major-development
- item: 'Major: any registered providers acting as partners, and who will manage the housing (nomination
    rights)'
  level: must
  required-if:
    ref: major-development
- item: 'Major: how the affordable units will be allocated and managed, and will always remain affordable'
  level: must
  required-if:
    ref: major-development
- item: 'Major: evidence of the site search if affordable housing is proposed on a different site'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Affordable housing contribution; Affordable housing statement (major section)'. No
  contribution is due for a single replacement home, de-conversions, extensions that create no homes,
  changes between C3 and C4 (HMO), or self-build (unless sold within 3 years). Taken from the full planning
  checklist, so shown for full applications; the outline checklist says officers will say at pre-application
  stage what an outline application needs, and reserved matters applications use the full checklist 'for
  guidance'.
review-status: unverified
field-status: {}
