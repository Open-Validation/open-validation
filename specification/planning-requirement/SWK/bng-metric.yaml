reference: bng-metric
local-authority: SWK
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Schedule 7A, Town and Country Planning Act 1990 (inserted by the Environment Act 2021)
source-text: You must submit the minimum biodiversity net gain requirements and the local requirements
  for all small site planning applications.
must-include:
- item: Completed small sites (statutory) metric, completed by a competent person such as an ecologist
  level: must
- item: The statutory major sites metric where the site includes priority habitat
  level: must
  required-if:
    site:
      in:
      - priority-habitat
      description: The site includes priority habitat.
  source-text: If your site includes priority habitat, the statutory major sites metric must be used.
- item: Post-development tabs completed, showing how the minimum 10% biodiversity net gain will be achieved
  level: must
- item: Justification of any use of off-site biodiversity units or statutory biodiversity credits
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Biodiversity net gain (BNG)'. From the 'Biodiversity net gain (BNG)' section (also
  in the major section and on the outline checklist). Exemptions must be explained in the application
  form with evidence (self-build needs the self-build verification/exemption form; a de minimis claim
  needs photographs, aerial photography, reports or a scaled plan). Sites with priority habitat cannot
  claim an exemption. Shown with the biodiversity-gain-condition field because householder and other exempt
  applications are exempt by law.
review-status: unverified
field-status: {}
