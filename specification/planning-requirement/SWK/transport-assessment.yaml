reference: transport-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor applications likely to create an impact on transport.
      - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P45, P49, P50 and P53
source-text: Submit a transport assessment with all minor applications that are likely to create an impact
  on transport. You must submit a transport assessment with all major applications.
must-include:
- item: 'Impact on local transport infrastructure: road capacity, public transport, walking and cycling
    infrastructure'
  level: must
- item: Location and type of cycle parking, and wheelchair-accessible car parking spaces, labelled on
    relevant plans
  level: must
- item: Deliveries and collections from the site
  level: must
- item: 'Minor: changes to car and cycle parking, accessibility by all modes, surveys of how people travel
    to and from the site, and the needs of all users (including disabled people)'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor applications.
- item: 'Major: baseline data with cumulative effects of existing and potential development'
  level: must
  required-if:
    ref: major-development
- item: 'Major: a Travel Plan and a car and cycle parking provision statement'
  level: must
  required-if:
    ref: major-development
- item: 'Major: sustainable modes of transport in line with the London Plan and national policy'
  level: must
  required-if:
    ref: major-development
- item: 'Major: parking provision where PTAL is low and there is no Controlled Parking Zone, or the site
    is near a station or town centre outside a CPZ'
  level: must
  required-if:
    ref: major-development
- item: 'Major: a trip generation report (TRICS, comparable sites, specific use classes or worst case,
    peak-time trips, delivery and servicing trips)'
  level: must
  required-if:
    ref: major-development
  source-text: Complete a trip generation exercise and submit it as a report with all major applications.
    You can include this report within a transport statement or transport assessment.
- item: 'Major: a movement plan showing how vehicles, pedestrians and cyclists access and move through
    the site (one per block for multi-building schemes)'
  level: must
  required-if:
    ref: major-development
  source-text: Submit a plan with all vehicle, pedestrian and cyclist movements clearly marked with all
    major planning applications.
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Transport statement; Trip generation report and Movement plan drawing (major section)'.
  Minor applications 'likely to create an impact on transport' show as discretionary. Taken from the full
  planning checklist, so shown for full applications; the outline checklist says officers will say at
  pre-application stage what an outline application needs, and reserved matters applications use the full
  checklist 'for guidance'.
review-status: unverified
field-status: {}
