reference: land-contamination-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: previously-developed-land
        value: true
        description: On a brownfield site.
    - site:
        in:
        - contaminated-land
        description: On land known to be contaminated.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P64
source-text: 'Submit a land contamination assessment for applications: • on a brownfield site • on land
  known to be contaminated'
must-include:
- item: A desk study and a site visit
  level: should
- item: Scope of the site inspection
  level: should
- item: Review of historical land use and of the environmental setting
  level: should
- item: Consultation with relevant regulatory authorities
  level: should
- item: Qualitative environmental risk assessment
  level: should
- item: Review of existing relevant reports
  level: should
- item: Carried out to established procedures such as BS 10175
  level: should
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Land contamination assessment'. Taken from the full planning checklist, so shown
  for full applications; the outline checklist says officers will say at pre-application stage what an
  outline application needs, and reserved matters applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
