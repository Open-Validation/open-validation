reference: waste-management-plan
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The application will generate residential waste.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: The application will generate commercial waste.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P61
source-text: Submit a refuse storage and collection strategy if your application will generate residential
  or commercial waste.
must-include:
- item: Confirmation that the council's waste collection guidance has been followed, and how waste will
    be stored and managed on site
  level: must
- item: A calculation confirming the residential waste requirements would be met on site
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: How loading and unloading (including taxis for hotels) will be managed
  level: must
- item: Access for waste vehicles and other servicing traffic, and a plan of step-free access from the
    public highway to the waste store
  level: must
- item: How fire risks and amenity impacts of waste storage (noise, odour, pests) will be mitigated
  level: must
- item: Roads that are private or not managed by Southwark Council marked
  level: must
- item: 'Multi-unit residential: a plan showing dropped kerbs, drag distance from the back edge of the
    highway, bin sizes and capacity, bin door width and swing, store dimensions, footpath width in front
    of the store, a bulky waste storage area, and no bin store doors opening over the highway'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: Multi-unit residential schemes.
- item: 'Private dwellings: a plan showing dedicated space for refuse and recycling, door swing (if applicable)
    and no bin store doors opening over the highway'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Private dwellings.
- item: 'Commercial development: a plan showing dropped kerbs, drag distance, bin sizes and capacity,
    bin door width and swing, store dimensions, footpath width in front of the store and no bin store
    doors opening over the highway'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Commercial development.
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Refuse storage and collection strategy'. Taken from the full planning checklist,
  so shown for full applications; the outline checklist says officers will say at pre-application stage
  what an outline application needs, and reserved matters applications use the full checklist 'for guidance'.
review-status: unverified
field-status: {}
