reference: photos
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          description: Involves the setting, character or appearance of a listed building or conservation
            area.
      - condition:
          field: demolition
          value: true
          description: Proposes the demolition of an existing building.
  - application-type:
      in:
      - pa-extension
      - pa-demo-building
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Replacing windows or doors in a listed building.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P13
source-text: 'Submit photographs for all major applications, and for applications that: • involve the
  setting, character or appearance of a listed building or conservation area • propose the demolition
  of an existing building'
must-include:
- item: The existing building and the entire application site, showing each elevation
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Any outbuildings and trees on the site, and the property boundaries
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Where each photograph was taken and the direction it faces
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'Larger home extension prior approval: the site and its relationship with neighbouring properties'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
  source-text: photographs showing the development site and its relationship with neighbouring properties
- item: 'Demolition prior approval: photographs of the existing building'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
  source-text: photographs of the existing building
- item: 'Listed building consent for replacement windows or doors: a photographic condition study of the
    existing windows and doors, saying where in the property each photo was taken'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Send detailed photographs of the existing windows and doors of the property. They should
    include details of where in the property the photo was taken.
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Photographs'. Plus the prior approval checklist's supporting documents for larger
  home extensions and demolition, and the listed building consent checklist's 'Photographic condition
  study (windows and doors)'.
review-status: unverified
field-status: {}
