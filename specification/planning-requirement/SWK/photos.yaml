reference: photos
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - site:
          in:
          - listed-building-setting
          - conservation-area
          description: The setting of a listed building or a conservation area.
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
must-include:
- item: Photographic condition study of the windows and doors
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the audit (missing_requirement): photographs for all majors, listed building or conservation
  area setting, and demolition (full); a ''Photographic condition study (windows and doors)'' where windows
