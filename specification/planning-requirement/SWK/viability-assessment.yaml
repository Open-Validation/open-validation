reference: viability-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
  - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies SP1, P1, P9 and IP3
source-text: 'Submit a viability appraisal if: • planning policy requires you to include affordable housing
  • you must make a payment in-lieu of affordable housing • viability means you must ignore other planning
  policy requirements'
must-include:
- item: An executive summary of the key conclusions
  level: must
- item: A testable, editable electronic or software model showing the calculations and assumptions
  level: must
- item: Payment for the council's review of the appraisal, or a solicitor's undertaking to pay
  level: must
confidence: medium
notes: 'From the council''s list (published 16 October 2026), the ''full planning application'' checklist
  web page, section ''Viability appraisal''. Shown as discretionary: affordable housing applies to 1 or
  more homes, but the affordable housing section says fast-tracked schemes (40%, or 60% in the Aylesbury
  Area Action Core) need no viability appraisal. Taken from the full planning checklist, so shown for
  full applications; the outline checklist says officers will say at pre-application stage what an outline
  application needs, and reserved matters applications use the full checklist ''for guidance''.'
review-status: unverified
field-status: {}
