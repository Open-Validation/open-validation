reference: daylight-sunlight-assessment
local-authority: SWK
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
  - discretionary
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policy P56
source-text: Submit an assessment if your development might affect light to windows neighbouring properties.
  For example, if you are building an extension close to the property boundary.
must-include:
- item: Daylight and sunlight tests shown on the submitted drawings
  level: must
- item: A report confirming the final daylight and sunlight values achieved by any proposal in a restricted
    setting
  level: must
  required-if: discretionary
- item: Evidence prepared by a qualified professional following BRE guidance, for major and complex minor
    applications
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Daylight and sunlight impact assessment'. The householder checklist asks for one
  'if you are building an extension or outbuilding which might affect sunlight to your neighbours home'.
  Shown as discretionary because it depends on likely impact.
review-status: unverified
field-status: {}
