reference: elevation-proposed
local-authority: SWK
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - lbc
      - advertising
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: external-alterations
        value: true
        description: The application changes the outside of the building.
  - application-type:
      in:
      - pa-extension
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P13, P14, P15 and P56
source-text: The drawings should show the building's outside now and after the proposed changes.
must-include:
- item: An individual elevation drawing for the front, back and both sides of the building
  level: must
- item: Proposed buildings (including household extensions and outbuildings) shown in context with neighbouring
    buildings
  level: must
- item: At 1:100 or 1:50 on A4 or A3 paper, with a scale bar, a unique reference number, written dimensions
    and details of materials
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - ldc-prospective-use
      - advertising
- item: 'Advertisement drawings: the advertisement''s size, siting, materials and colours, and how it
    is fixed to the building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisement drawings: height above the ground and extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisement drawings: the method and colours of the illumination or luminance, and the fittings'
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: The advertisement is illuminated.
- item: 'Lawful development certificate: existing and proposed building materials labelled'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Existing and proposed elevation drawings'. Required on the full, householder, listed
  building consent and advertisement consent checklists; for some proposed lawful development certificates
  where the outside of the building changes. The prior approval checklist asks for proposed elevations
  for larger home extensions; the advertisement items are from the 'Advertisement drawings' section of
  the advertisement consent checklist.
review-status: unverified
field-status: {}
