reference: noise-assessment
local-authority: SWK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise-sensitive development likely to be affected by an existing source of noise.
      - condition:
          field: noise-generating-use
          value: true
          description: Noise-intensive uses (including gyms, nightclubs and social venues).
      - condition:
          field: plant-equipment
          value: true
          description: Plant or other equipment that might generate significant noise.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: plant-equipment
        value: true
        description: Noisy development such as an air conditioning unit or an air source heat pump.
source-url: https://www.southwark.gov.uk/planning-environment-and-building-control/planning/planning-checklists-full-planning-application
policy: Southwark Plan 2022 policies P56 and P66
source-text: Submit a noise impact assessment if your application is for a noise-sensitive development
  that is likely to be affected by an existing source of noise. This includes noise-intensive uses (including
  gyms, nightclubs and social venues) and the installation of any plant or other equipment that might
  generate significant noise.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Noise exposure categories
  level: must
- item: Associated impact and mitigation measures
  level: must
- item: Layout, design and insulation
  level: must
confidence: medium
notes: From the council's list (published 16 October 2026), the 'full planning application' checklist
  web page, section 'Noise impact assessment; Noise impact assessment (plant equipment) (major section)'.
  The householder checklist asks for one for noisy development such as an air conditioning unit or an
  air source heat pump.
review-status: unverified
field-status: {}
