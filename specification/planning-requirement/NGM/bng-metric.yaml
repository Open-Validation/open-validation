reference: bng-metric
local-authority: NGM
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.nottinghamcity.gov.uk/information-for-business/planning-and-building-control/biodiversity-net-gain/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Environment Act 2021; Nottingham Biodiversity SPD
source-text: 'In addition to the above minimum mandatory requirements, Nottingham City Council require
  for validation the following: ... Statutory metric (in Excel format) to include forecast post-development
  habitat values and calculations and to be accompanied by habitat condition assessments for all pre-development
  habitats;'
must-include:
- item: The statutory metric in Excel format
  level: must
- item: Forecast post-development habitat values and calculations
  level: must
- item: Habitat condition assessments for all pre-development habitats
  level: must
- item: 'For off-site habitats: offsite baseline habitat assessments, metric calculations and condition
    assessments'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site habitats are to be created or enhanced.
  source-text: Details of any offsite habitats required to be created and/or enhanced, including offsite
    baseline habitat assessments, metric calculations and condition assessments, a plan showing habitats
    and information on initial agreement terms with offsite provider,
confidence: medium
notes: 'From the council''s list (published November 2012), Biodiversity Net Gain web page. These are
  the council''s ''Additional Local Requirements for Validation''. Shown with the biodiversity gain condition:
  the page lists exemptions (householder, permitted development, de minimis, some s73) and national law
  exempts others.'
