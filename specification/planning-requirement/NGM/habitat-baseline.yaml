reference: habitat-baseline
local-authority: NGM
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.nottinghamcity.gov.uk/information-for-business/planning-and-building-control/biodiversity-net-gain/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: However, in order to validate and determine any non-exempt planning application, Nottingham
  City Council’s Local Planning Authority needs to assess whether the development is capable of discharging
  the GBGC and achieving at least 10% net gain.
must-include:
- item: A statement on whether the biodiversity gain condition would apply (and why not, if not)
  level: must
- item: The pre-development biodiversity value of the onsite habitat, with the completed metric and its
    publication date and version
  level: must
- item: Any earlier date proposed, with reasons
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant wishes to use an earlier date.
- item: Whether the value is lower because of degradation, with supporting evidence if so
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
- item: A plan at an identified scale with the direction of North showing onsite habitat (including irreplaceable
    habitat) on the date of application or earlier date
  level: must
confidence: medium
notes: 'From the council''s list (published November 2012), Biodiversity Net Gain web page. The page''s
  summary of the national minimum (DMPO article 7). Shown with the biodiversity gain condition: the page
  lists exemptions (householder, permitted development, de minimis, some s73) and national law exempts
  others.'
review-status: unverified
field-status: {}
