reference: recreation-facilities-assessment
local-authority: NGM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 12
        description: Residential development of 12 dwellings or more.
    - site:
        in:
        - open-space
        description: Within the Open Space Network defined on the Nottingham Local Plan Proposals Map.
    - condition:
        field: playing-field
        value: true
        description: Development on existing playing fields.
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
policy: Nottingham Local Plan (Open Space Network, Proposals Map)
source-text: All residential developments of 12 dwellings or more • All developments within the Open Space
  Network as defined on the Nottingham Local Plan Proposals Map • All developments on existing playing
  fields
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 2. 'Open Space Assessment' on the checklist.
review-status: unverified
field-status: {}
