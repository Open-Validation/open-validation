source-text: All major developments comprising jobs, shopping, leisure and services (using the thresholds
  as set out in the Validation Requirements document) • Smaller developments comprising jobs, shopping,
  leisure and services which would generate significant amounts of travel in, or near to, air quality
  management areas • New and expanded school facilities
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 2. New and expanded schools always need one. The other bullets rely on thresholds in the
  unpublished parent document or on 'significant amounts of travel', so they show as discretionary.
