validation-list:
  url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
  date: 2012-11
  date-basis: 'PDF titles ''Validation Checklist- Full Outline Nov 12'' (also Householder and Listed Building
    CAC Nov 12, created 29 November 2012; Adverts Nov 12, created 10 December 2012); the checklists themselves
    are undated. They are the only lists on the council''s ''Information needed with Planning Applications''
    page (https://www.nottinghamcity.gov.uk/information-for-business/planning-and-building-control/planning-applications/apply-for-planning-permission/information-needed-with-planning-applications/,
    checked 2026-11-06), and also on its Planning Applications Forms page. They refer to a parent ''Validation
    Requirements for Planning Applications'' document that the council does not publish (not on its site
    or in a web search). The other checklists: Householder (https://www.nottinghamcity.gov.uk/media/ldyewr3r/validation-checklist-householder-planning.pdf),
    Listed Building/Conservation Area Consent (https://www.nottinghamcity.gov.uk/media/mgofyyvj/validation-checklist-listed-buildings.pdf),
    Advertisement Consent (https://www.nottinghamcity.gov.uk/media/32ugmk5y/validation-checklist-advertisement-consent.pdf).
    The council''s Biodiversity Net Gain page (https://www.nottinghamcity.gov.uk/information-for-business/planning-and-building-control/biodiversity-net-gain/)
    adds current ''Additional Local Requirements for Validation'' (BNG files cite it). No newer list or
    consultation found; MHCLG''s register lists the same four checklists. More than two years old, so
    outdated.'
  status: outdated
submission-standards:
- item: PDF format for all documents
  level: should
- item: Keep individual file sizes small
  level: should
- item: Accurate file names that reflect their content
  level: should
- item: Drawings separated so they can be printed to the original scale on individual A4 or A3 sheets,
    not grouped on one A2 or larger sheet
  level: should
- item: Drawings in landscape format
  level: should
- item: Drawings indicate the sheet size and scale
  level: should
- item: One copy of the application form and supporting documents (paper applications)
  level: should
- item: Applications are not accepted by email (online via the Planning Portal, or by post)
  level: must
