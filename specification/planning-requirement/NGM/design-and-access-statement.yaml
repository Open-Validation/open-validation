reference: design-and-access-statement
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Not only a change of use or engineering operations.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: The property is a listed building or in a conservation area.
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Design and Access Statement (except for changes of use and engineering operations) ... Design
  and Access Statement (if your property is a listed building or in a conservation area)
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 1; Householder checklist (November 2012), page 1; Listed Building/Conservation Area Consent
  checklist (November 2012), page 1. The Listed Building/Conservation Area Consent checklist lists it
  as a national requirement for every application. These are the 2012 rules; the national rules have since
  narrowed (DMPO 2015 article 9). Conservation Area Consent no longer exists; demolition in a conservation
  area now needs planning permission (shown as demolition-con-area).
review-status: unverified
field-status: {}
