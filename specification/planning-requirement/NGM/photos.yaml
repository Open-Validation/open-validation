reference: photos
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - condition:
            field: new-build
            value: true
            description: New infill development.
        - site:
            in:
            - conservation-area
            - listed-building-setting
            description: In a conservation area or next to a listed building.
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: All major developments • New infill development in conservation areas or adjacent to listed
  buildings ... Required to record any parts of the existing buildings/structures affected by the proposed
  works.
must-include:
- item: 'Listed building/conservation area consent: photographs of any parts of the existing buildings/structures
    affected by the works (may form part of the Structural Survey)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 2; Listed Building/Conservation Area Consent checklist (November 2012), page 1; Advertisement
  Consent checklist (November 2012), page 1. 'Photographs and Photomontages' on the Full/Outline/RM checklist.
  Optional for advertisement consent, so not shown for that type. Conservation Area Consent no longer
  exists; demolition in a conservation area now needs planning permission (shown as demolition-con-area).
review-status: unverified
field-status: {}
