reference: noise-assessment
local-authority: NGM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: class-b2-b8-floorspace
        operator: '>'
        value: 0
        description: Industrial and warehouse development within Classes B2 and B8.
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Night clubs and other entertainment uses (Class D2 in the checklist).
    - condition:
        field: use-class
        value: drinking-establishment
        description: Pubs, bars and other drinking establishments (Class A4 in the checklist).
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential development.
      - any:
        - condition:
            field: fronts-main-road
            value: true
            description: Adjacent to a main road.
        - condition:
            field: adjacent-to-railway
            value: true
            description: Adjacent to a railway.
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: Industrial and warehouse development falling within classes B2 and B8 • Night clubs, and
  other entertainment uses falling within class D2 • Pubs, bars and other drinking establishments falling
  within Class A4 • New residential development adjacent to main roads and railways
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 2. The checklists date from 2012 and use the old Use Classes (A3, A4, A5, B1, D2) and the
  1999 EIA Regulations; the full criteria are in a 'Validation Requirements for Planning Applications'
  document the council does not publish.
review-status: unverified
field-status: {}
