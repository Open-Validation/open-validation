reference: environmental-statement
local-authority: NGM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: eia-development
      value: true
      description: Schedule 1 development, or Schedule 2 development likely to have significant effects
        on the environment.
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations (the checklist cites the
  1999 Regulations)
source-text: All developments specified within Schedule 1 of the Town and Country Planning (Environmental
  Impact Assessment) (England and Wales) Regulations 1999 • Developments specified in Schedule 2 of the
  Regulations that are likely to have significant effects on the environment by virtue of factors such
  as its nature, size or location
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 1. The 1999 Regulations have been replaced by the 2017 EIA Regulations.
