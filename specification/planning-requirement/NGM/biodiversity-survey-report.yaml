reference: biodiversity-survey-report
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: protected-species
        value: true
        description: There is a likelihood that protected species (particularly bats) will be affected.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          - ancient-woodland
          description: The site is within, or its boundary is within 100m of, an SSSI, SINC, Local Nature
            Reserve or Ancient Woodland.
      - ref: major-development
      - all:
        - site:
            in:
            - listed-building
            description: The building is listed.
        - condition:
            field: roof-alteration
            value: true
            description: Loft conversions or roof works.
      - condition:
          field: demolition
          value: true
          description: Proposals involving demolition.
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: Protected Species (Biodiversity) Survey and Report Required if there is a likelihood that
  protected species (particularly bats) will be affected. … Biodiversity Survey and Report – All developments
  within or with site boundaries within 100m of SSSIs, SINCS...
confidence: medium
notes: 'Audit (missing_requirement): the full checklist''s Biodiversity Survey and Report was mislabelled
  ''Biodiversity Checklist''. From the audit: within 100m of SSSI/SINC/LNR/Ancient Woodland, all major
  developments, loft conversions/roof works to listed buildings, demolition. The householder trigger is
  from the householder checklist.'
review-status: unverified
field-status: {}
