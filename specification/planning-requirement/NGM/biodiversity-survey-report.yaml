reference: biodiversity-survey-report
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          - local-nature-reserve
          - ancient-woodland
          description: Within, or with the site boundary within 100m of, an SSSI, SINC, Local Nature Reserve
            or Ancient Woodland.
      - ref: major-development
      - condition:
          field: roof-space-room
          value: true
          description: A loft conversion.
      - all:
        - site:
            in:
            - listed-building
            description: A listed building.
        - condition:
            field: roof-alteration
            value: true
            description: Works to the roof of a listed building.
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: protected-species
          value: true
          description: A likelihood that protected species (particularly bats) will be affected.
      - discretionary
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: All developments within or with site boundaries within 100m of SSSIs, SINCS, Local Nature
  Reserves and Ancient Woodland • All major developments • Loft conversions and works to the roofs of
  Listed Buildings • Proposals involving demolition ... Required if there is a likelihood that protected
  species (particularly bats) will be affected. The need for a survey should be considered if the property
  is adjacent to a Site of Special Scientific Interest, a Site of Importance for Nature Conservation,
  a Local Nature Reserve or Ancient Woodland, a loft conversion is proposed, or you are carrying out works
  affecting the roof of a listed building.
confidence: medium
notes: 'From the council''s list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 1; Householder checklist (November 2012), page 1. Householder: needed where protected species
  are likely to be affected; the checklist says the need ''should be considered'' next to designated sites,
  for loft conversions and for roof works to a listed building, so those show as discretionary. SINCs
  are shown as local wildlife sites.'
review-status: unverified
field-status: {}
