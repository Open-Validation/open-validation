reference: lighting-assessment
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: floodlighting
          value: true
          description: The erection of floodlighting.
      - condition:
          field: public-realm
          value: true
          description: The creation of new roads and public spaces.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: An illuminated advertisement.
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: All developments involving the erection of floodlighting • All developments involving the
  creation of new roads and public spaces ... Required for all applications for illuminated advertisements.
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 2; Advertisement Consent checklist (November 2012), page 1.
review-status: unverified
field-status: {}
