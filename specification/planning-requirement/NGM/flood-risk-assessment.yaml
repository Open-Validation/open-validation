reference: flood-risk-assessment
local-authority: NGM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more (Flood Zone 1).
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: Flood Risk Assessment Required if the property is located in a Flood Zone.
confidence: medium
notes: 'Audit (wrong_trigger): from the audit, 1ha+ in Flood Zone 1 and any development in Flood Zones
  2/3 (full checklist). The council''s words above are from the householder checklist.'
review-status: unverified
field-status: {}
