reference: flood-risk-assessment
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 1
            description: Development of 1 hectare or greater (in Flood Zone 1).
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 1
            description: Development of 1 hectare or greater (in Flood Zone 1).
      - site:
          in:
          - flood-risk-zone
          description: New development in Flood Zone 2 or 3.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: The property is in a Flood Zone.
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: Development proposals of 1 hectare or greater in Flood Zone 1 • Proposals for new development
  located in Flood Zones 2 and 3 ... Required if the property is located in a Flood Zone.
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
