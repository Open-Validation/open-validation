reference: heritage-statement
local-authority: NGM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          description: Development and works affecting Listed Buildings.
      - site:
          in:
          - archaeological-priority-area
          description: Development within an Archaeological Constraint Area.
      - site:
          in:
          - scheduled-monument
          description: Development affecting Scheduled Ancient Monuments.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - all:
        - site:
            in:
            - listed-building
            description: In the grounds of a Listed Building.
        - condition:
            field: outbuilding
            value: true
            description: Erecting a building or enclosure in the grounds of a Listed Building.
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: In an Archaeological Constraint Area.
        - condition:
            field: ground-disturbance
            value: true
            description: Undertaking excavations.
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://www.nottinghamcity.gov.uk/media/qkzik5s3/validation-checklist-full-outline-and-reserved-matters.pdf
source-text: All development and works affecting Listed Buildings • All development within an Archaeological
  Constraint area • All development affecting Scheduled Ancient Monuments • All applications for Conservation
  Area Consent ... Required if you will be erecting a building or enclosure in the grounds of a Listed
  Building, or undertaking excavations in an Archaeological Constraint area. ... Required for all Listed
  Building/Conservation Area Consent applications.
confidence: medium
notes: From the council's list (published November 2012), Full/Outline/Reserved Matters checklist (November
  2012), page 1; Householder checklist (November 2012), page 1; Listed Building/Conservation Area Consent
  checklist (November 2012), page 1. Conservation Area Consent no longer exists; demolition in a conservation
  area now needs planning permission (shown as demolition-con-area).
review-status: unverified
field-status: {}
