reference: heritage-statement
local-authority: NGM
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - listed-building
          description: Erecting a building or enclosure in the grounds of a listed building.
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: The site is in an Archaeological Constraint Area.
        - condition:
            field: ground-disturbance
            value: true
            description: The works involve excavations.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.nottinghamcity.gov.uk/media/mgofyyvj/validation-checklist-listed-buildings.pdf
source-text: Heritage Statement Required for all Listed Building/Conservation Area Consent applications.
  … Heritage Statement Required if you will be erecting a building or enclosure in the grounds of a Listed
  Building, or undertaking excavations in an Archaeological Constraint area.
confidence: low
notes: 'Audit (wrong_trigger): the full checklist''s heritage trigger is not captured; its last line is
  ''All applications for Conservation Area Consent'' (shifted into the Land Contamination row), so full/outline/reserved
  matters are shown as officer discretion. Audit (other): Conservation Area Consent was abolished in 2013;
  it is now planning permission for relevant demolition, so the demolition-con-area mapping is approximate.'
