reference: site-plan
local-authority: CAT
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Extensions, outbuildings and garages.
  - condition:
      field: new-boundary-treatment
      value: true
      description: Boundary walls and fences.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://www.canterbury.gov.uk/planning-and-building/planning-application-process/create-planning-application
source-text: Block plan Extensions, boundary walls and fences, outbuildings, and garages A more detailed
  site plan, showing the relationship of the proposed site to neighbouring properties, drawn to a scale
  of 1:500. ... Your application will need a site plan that shows where the tree is on the property.
must-include:
- item: The relationship of the site to neighbouring properties
  level: must
  required-if:
    any:
    - condition:
        field: building-works
        value: true
        description: Extensions, outbuildings and garages.
    - condition:
        field: new-boundary-treatment
        value: true
        description: Boundary walls and fences.
- item: Drawn to a scale of 1:500
  level: must
  required-if:
    any:
    - condition:
        field: building-works
        value: true
        description: Extensions, outbuildings and garages.
    - condition:
        field: new-boundary-treatment
        value: true
        description: Boundary walls and fences.
- item: 'For works to a tree with a TPO: where the tree is on the property'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
  source-text: Your application will need a site plan that shows where the tree is on the property.
confidence: medium
notes: From the council's list (published 23 November 2022), the 'Documents you need for a planning application'
  table on its 'Create a planning application' web page. Canterbury publishes no formal local validation
  list; this table is the only list of documents the council gives. The council calls it a 'Block plan'.
  The tree item is from the 'Get planning permission to do work to a tree' page (https://www.canterbury.gov.uk/planning-and-building/get-planning-permission-do-work-tree).
