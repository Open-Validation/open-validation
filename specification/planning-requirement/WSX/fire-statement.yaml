reference: fire-statement
local-authority: WSX
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.westsussex.gov.uk/media/e2clz34k/local_list.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the description. From the audit: 2+ dwellings or educational
  accommodation and 18m+ or 7+ storeys.'
review-status: unverified
field-status: {}
