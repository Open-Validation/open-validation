reference: transport-assessment
local-authority: WSX
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 2500
        description: 2,500 square metres or more of minerals/waste floorspace.
    - site:
        in:
        - air-quality-management-area
        description: Traffic affecting an Air Quality Management Area.
    - discretionary
source-url: https://www.westsussex.gov.uk/media/e2clz34k/local_list.pdf
must-include:
- item: A full Transport Assessment (rather than a Transport Statement)
  level: must
  required-if:
    condition:
      field: floorspace
      operator: '>'
      value: 4000
      description: Over 4,000 square metres of floorspace.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave no thresholds. From the audit: Transport Statement for
  2,500-4,000 sqm minerals/waste floorspace; Transport Assessment for over 4,000 sqm, 40+ two-way HGV
  movements a day, 30 an hour or 100 a day vehicle movements, or AQMA. The movement thresholds have no
  field, so they are shown as officer discretion.'
review-status: unverified
field-status: {}
