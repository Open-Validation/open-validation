reference: archaeological-assessment
local-authority: WSX
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - scheduled-monument
        - park-and-garden
        - listed-building
        - conservation-area
        - flood-risk-zone
        description: Within or within 250m of a Scheduled Monument or registered park, affecting a listed
          building or conservation area, or in flood zone 2 or 3.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: A greenfield site over 1 hectare.
source-url: https://www.westsussex.gov.uk/media/e2clz34k/local_list.pdf
must-include:
- item: Relevant information from the Historic Environment Record (WSCC's, or Chichester District Council's
    for Chichester District)
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the ''What is required'' column. Triggers from the
  audit.'
review-status: unverified
field-status: {}
