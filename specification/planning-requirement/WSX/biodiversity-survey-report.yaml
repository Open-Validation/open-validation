reference: biodiversity-survey-report
local-authority: WSX
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: An internationally, nationally or locally designated site (SAC, SPA, Ramsar, SSSI,
          local designation).
    - discretionary
source-url: https://www.westsussex.gov.uk/media/e2clz34k/local_list.pdf
must-include:
- item: Ecological surveys as appropriate
  level: must
- item: A full assessment of the likely effects of the development
  level: must
- item: Avoidance or mitigation measures if applicable
  level: must
- item: Information to support any proposals for mitigation/compensation measures
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the contents bullets (kept as must-include). From the
  audit: designated sites, brownfield land, demolition, vegetation removal, within 500m of a pond; the
  last four are shown as officer discretion.'
review-status: unverified
field-status: {}
