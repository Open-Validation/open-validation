reference: elevation-existing
local-authority: MDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
        - ldc-prospective-use
    - condition:
        field: building-works
        value: true
        description: The proposal creates, alters or adds to a building.
  - all:
    - application-type:
        in:
        - outline
    - site:
        in:
        - conservation-area
        description: Outline application in a conservation area.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/plans-and-drawings/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications (where relevant) ... Elevations to a scale of 1:50 or 1:100 ... Floor Plans
  and Elevations (if the site falls within the Conservation Area)
must-include:
- item: At a scale of 1:50 or 1:100, with a scale bar and the scale used
  level: must
- item: Each side of the building or structure that will be altered or added to, labelled by the direction
    it faces (e.g. north facing)
  level: must
- item: Where an existing structure is demolished or replaced, its extent shown with dashed lines
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: The proposal demolishes or replaces an existing structure.
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Plans and Drawings) and Part 2. Types
  as for floor plans.
review-status: unverified
field-status: {}
