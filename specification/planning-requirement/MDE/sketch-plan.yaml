reference: sketch-plan
local-authority: MDE
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-2-validation-checklists-at-a-glance/
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: Plan or Sketch showing location of tree(s)
must-include:
- item: The tree(s) that are the subject of the application/notification
  level: must
- item: Property boundaries and adjoining properties
  level: must
- item: Road names
  level: must
- item: The position of the tree(s) in relation to buildings and other features
  level: must
- item: Tree reference numbers matching the application form
  level: must
- item: A north arrow where possible
  level: should
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 2 (Works to Trees protected by a Tree
  Preservation Order; Works to Trees within the Conservation Area). A scaled location plan is not required,
  provided the tree(s) can be clearly identified.
review-status: unverified
field-status: {}
