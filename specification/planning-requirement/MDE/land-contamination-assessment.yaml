reference: land-contamination-assessment
local-authority: MDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: On or adjacent to potentially contaminated land.
    - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/land-contamination-assessment/
policy: Policy DM 4 of the Adopted Mid Devon Local Plan Review
source-text: 'A land contamination assessment will be required for all applications which: are on or adjacent
  to potentially contaminated land; involving the significant importation of soils and infill material
  onto the land It does not apply to: householder developments; advertisements; listed building alterations/demolition;
  certificate applications for existing and proposed use; Tree Preservation Orders; Wind turbines less
  than 1ha; Small offices and similar minor applications'
must-include:
- item: Risks to both human health and controlled waters
  level: must
- item: As a minimum, a Phase 1 desktop assessment (an Environmental Search / Homebuyers Check is not
    sufficient)
  level: must
- item: A full Phase 2 intrusive assessment for designated brownfield sites and land known or suspected
    to be contaminated by former industrial or commercial uses
  level: must
  required-if:
    any:
    - condition:
        field: previously-developed-land
        value: true
        description: A designated brownfield site.
    - site:
        in:
        - contaminated-land
        description: Known or suspected to be contaminated by former industrial or commercial uses.
- item: A preliminary conceptual site model showing pollutant linkages, and a preliminary risk assessment
    of them
  level: must
- item: Meets BS 10175:2011 and undertaken by a competent person
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Land Contamination Assessment). The
  exemptions leave full, outline and reserved matters applications (small offices and similar minor applications
  and wind turbines under 1 ha are also exempt). 'Significant importation of soils and infill' has no
  threshold, so that part is discretionary.
review-status: unverified
field-status: {}
