reference: bng-metric
local-authority: MDE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-1-national-requirements/
policy: Schedule 7A, Town and Country Planning Act 1990 (inserted by the Environment Act 2021)
source-text: 'The following information is required to validate applications where Biodiversity Net Gain
  applies and the development is not exempt from the statutory Biodiversity Net Gain requirements: Devon
  BNG Statement for Validation Statutory BNG Metric Biodiversity Gain Plan'
must-include:
- item: Statutory BNG Metric
  level: must
- item: Habitat or biodiversity maps submitted as separate PDF documents, not embedded within the metric
  level: should
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 1 (National Requirements). Part 1 reflects
  the BNG changes of 6 August 2026. Applicants claiming an exemption must instead submit a Devon BNG Statement
  for Validation saying why; the Devon BNG Statement and the (draft) Biodiversity Gain Plan have no id
  and are in the unmapped list.
review-status: unverified
field-status: {}
