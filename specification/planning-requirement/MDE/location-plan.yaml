reference: location-plan
local-authority: MDE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - advertising
    - lbc
    - ldc-existing-use
    - ldc-prospective-use
    - hedgerow-removal
    - prior-approval
    - pip
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-1-national-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications
must-include:
- item: As up-to-date as possible
  level: must
- item: At an identified measurable scale, typically 1:1250 or 1:2500, with a scale bar
  level: must
- item: Clearly marked with the direction of North
  level: must
- item: The full site, all site boundaries, adjoining properties (numbered and/or named) and roads and/or
    buildings to identify the land
  level: must
- item: Application site boundaries and all land necessary to carry out the development (e.g. access from
    the road) outlined in red
  level: must
- item: Land needed for a soakaway and/or septic tank within the red line
  level: must
- item: Any other land in the applicant's ownership or control close to or adjacent the site outlined
    in blue
  level: must
- item: 'Hedgerow removal: the location and length (in metric) of the hedgerow(s) to be removed and the
    direction of North (need not be at 1:1250 or 1:2500)'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: The site location plan should show the location and length (in metric) of the hedgerow(s)
    to be removed.
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 1 (National Requirements) and Part 3
  (Plans and Drawings). Part 1 says 'All applications'; the application types are those whose Part 2 checklist
  lists a site location plan (Part 2 does not list one for section 73, non-material amendment or tree
  applications).
review-status: unverified
field-status: {}
