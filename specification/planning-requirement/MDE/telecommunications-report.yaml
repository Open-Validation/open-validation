reference: telecommunications-report
local-authority: MDE
required-if:
  all:
  - application-type:
      in:
      - full
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications and mobile phone masts.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/telecommunications-icnirp-certificate-statement-of-conformity/
policy: Policy DM 4 of the Adopted Mid Devon Local Plan Review; GPDO 2015 Schedule 2 Part 16
source-text: All prior approval and full applications for telecommunications and mobile phone masts.
must-include:
- item: Evidence of consultation with organisations with an interest, in particular the relevant body
    where a mast is near a school or college or within a statutory safeguarding zone around an aerodrome
    or technical site
  level: must
- item: ICNIRP Certificate (Statement of Conformity) confirming the equipment meets the ICNIRP guidelines
  level: must
- item: 'Prior approval: evidence that the developer has given notice of the development in accordance
    with A.3(1) of Part 16 of Schedule 2 to the GPDO'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
  source-text: Evidence that the developer has given notice of the proposed development in accordance
    with A3(1) of Part 16 of Schedule 2 to the General Permitted Development Order 2015 (as amended).
- item: 'Prior approval for a mast on a civil or defence safeguarding area: evidence that the Civil Aviation
    Authority, the Secretary of State for Defence or the operator has been notified'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
  source-text: Where the proposed development consists of the installation, alteration or replacement
    of a mast on a civil safeguarding area or a defence safeguarding area, evidence that the developer
    has notified the Civil Aviation Authority
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Telecommunications & ICNIRP Certificate)
  and Part 2 (TELCOM prior notification).
review-status: unverified
field-status: {}
