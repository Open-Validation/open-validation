reference: fire-statement
local-authority: MDE
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/fire-statement/
policy: Policy DM1 of the Adopted Mid Devon Local Plan Review; Article 9A, Town and Country Planning (Development
  Management Procedure) (England) Order 2015 (as amended)
source-text: Development of a building 18m or 7 storeys high which consists of 2 or more dwellings or
  educational accommodation.
must-include:
- item: Submitted on the standard form on GOV.UK
  level: must
confidence: medium
notes: 'From the council''s list (adopted 26 September 2025), Part 3 (Fire Statement). Exempt: outline
  applications, section 73 applications, and changes of use that would stop a building being a relevant
  building or would not create one.'
review-status: unverified
field-status: {}
