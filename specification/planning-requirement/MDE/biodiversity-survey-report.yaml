reference: biodiversity-survey-report
local-authority: MDE
required-if: discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/ecology-report/
policy: Conservation of Habitats and Species Regulations 2017; Policy S9 of the Adopted Mid Devon Local
  Plan Review; BS42020
source-text: All applications must include a completed Wildlife and Geology Trigger Table. This will indicate
  whether or not a Wildlife or Geology Report is required. ... Where the trigger table indicates that
  a Wildlife and/or Geology Report is required, it must be submitted with the application and be produced
  by a suitable qualified and experienced ecologist.
must-include:
- item: Produced by a suitably qualified and experienced (and licensed) ecologist; surveys up to date
  level: must
- item: Complies with national guidance such as BS42020
  level: must
- item: All information needed to determine the application, including survey information on protected
    and priority species, County Wildlife Sites, Priority Habitats and Protected Sites (SSSIs, SACs, SPAs
    and Ramsar sites)
  level: must
- item: All additional surveys the report says are needed, completed and submitted (they cannot be conditioned)
  level: must
- item: 'Exe Estuary SPA: the type and extent of impacts, mitigation and how it will be delivered and
    maintained, how it fully offsets the impacts, and ongoing monitoring'
  level: must
  required-if:
    site:
      in:
      - special-protection-area
      description: May affect the Exe Estuary Special Protection Area, directly or indirectly.
- item: 'Bat and bird survey report by a licensed bat consultant (licence number quoted): survey date,
    methodology, evidence found, impact assessment, mitigation/compensation, delivery and monitoring;
    or a letter from the consultant saying why a full report is not required'
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: agricultural-building-reuse
          value: true
          description: Barn conversion.
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: roof-alteration
          value: true
          description: Works to roofs, roof spaces, external cladding or cellars of existing buildings.
      - condition:
          field: wind-turbine
          value: true
          description: Wind turbines.
      - condition:
          field: renewable-energy-development
          value: true
          description: Solar panels.
    - discretionary
  source-text: 'Bat and Bird reports are required for the applications listed unless:'
- item: 'Ecological report appraising the site and adjacent land: desk study, protected sites in the zone
    of influence, phase 1 habitat survey (UK Habitats Classification), protected species surveys, assessment
    of features and impacts, avoidance/mitigation/compensation measures and their delivery, biodiversity
    enhancements and a monitoring scheme'
  level: must
  required-if:
    any:
    - condition:
        field: greenfield-site
        value: true
        description: New build or change of use on, or next to, a greenfield or vegetated brownfield site.
    - condition:
        field: near-watercourse
        value: true
        description: Works to, or adjacent to, rivers and streams.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Loss of trees.
    - discretionary
  source-text: Applications for development that has the potential to adversely affect biodiversity must
    be accompanied by an Ecological Report
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Ecology Report). The list calls it
  an Ecology Report. Whether a report is needed is decided by the council's Wildlife and Geology Trigger
  Table (required for every application; see the unmapped list), so the report is discretionary. Bat and
  bird reports are not needed in highly urban areas, for buildings put up after 2005 without bat provision,
  or for works to a flat or single-layer sheet roof, so that item is discretionary too.
review-status: unverified
field-status: {}
