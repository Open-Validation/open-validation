source-text: The report must include all the information required in order for the local planning authority
  to determine the application (including any survey information on protected and priority species), County
  Wildlife Sites, Priority Habitats and Protected Sites, including Sites of Special Scientific Interest
  (SSSI’s), Special Areas of Conservation (SAC’s), Special Protection Areas (SPA’s) and Ramsar Sites.
must-include:
- item: Survey information on protected and priority species
  level: must
- item: Information on County Wildlife Sites, Priority Habitats and Protected Sites (SSSIs, SACs, SPAs
    and Ramsar sites)
  level: must
- item: Evidence of how the mitigation will fully offset the impacts on the SPA/SAC
  level: must
  required-if:
    site:
      in:
      - special-protection-area
      description: The development may affect the Exe Estuary Special Protection Area, directly or indirectly,
