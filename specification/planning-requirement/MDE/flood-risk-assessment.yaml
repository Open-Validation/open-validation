reference: flood-risk-assessment
local-authority: MDE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within, in whole or in part, flood zone 2 and/or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: Within a critical drainage area.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/flood-risk-assessment/
policy: Policies S1 and S9 of the Adopted Mid Devon Local Plan Review
source-text: 'All planning applications for: development within, in whole or in part of flood zone 2 and/or
  flood zone 3; development on sites with an area of 1 hectare or more (in flood zones 1, 2 or 3); and
  development within critical drainage areas.'
must-include:
- item: 'Development of less than 250 sq m in flood zones 2 and 3: a simple flood risk assessment with
    a plan showing finished floor levels and estimated flood levels'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3.
    - condition:
        field: floorspace
        operator: <
        value: 250
        description: Less than 250 square metres.
- item: 'Other developments: the risks of all forms of flooding to and from the development and how they
    will be managed, taking climate change into account'
  level: must
- item: Uses the latest Environment Agency flood risk information, including the Flood Map for Planning
    datasets and climate change information
  level: should
- item: Reference to the Strategic Flood Risk Assessment
  level: must
- item: A sequential/exception test if necessary
  level: must
  required-if: discretionary
- item: Plans, including an outline of the development with identified SuDS
  level: must
- item: Surveys
  level: must
- item: Assessments of flood risk and surface water run-off, including off-site impacts
  level: must
- item: Flood management and protection measures
  level: must
- item: 'Change of use prior approvals in flood zone 2 or 3, or flood zone 1 with critical drainage problems:
    a site-specific flood risk assessment'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: A site-specific flood risk assessment in an area within Flood Zone 2 or Flood Zone 3; or
    in an area within Flood Zone 1 which has critical drainage problems (change of use prior approvals
    only)
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Flood Risk Assessment) and Part 2
  (Applications for Prior Notification).
review-status: unverified
field-status: {}
