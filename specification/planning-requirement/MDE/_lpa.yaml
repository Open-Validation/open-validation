submission-standards:
- item: Applications on the appropriate standard application form, signed and dated, with all questions
    answered
  level: must
- item: 'Emailed submissions: attachments no larger than 5 MB'
  level: must
- item: Plans drawn true to a stated, recognised metric scale; plans marked 'Not to scale' or 'Do not
    scale' are not accepted
  level: must
- item: All drawings clearly titled and numbered (e.g. 'Proposed Ground Floor Plan')
  level: should
- item: Personal or sensitive data in a separate document marked confidential, not cross-referenced in
    public documents
  level: should
- item: 'Postal applications: one copy of each document/plan'
  level: must
- item: Where an LVIA forms part of an Environmental Statement, one set of good quality hard copies of
    visualisations may be required
  level: should
