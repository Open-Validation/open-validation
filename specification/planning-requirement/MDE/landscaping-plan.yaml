reference: landscaping-plan
local-authority: MDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/landscape-visual-impact-assessment/
policy: Policies S1, DM1 and DM27 of the Adopted Mid Devon Local Plan Review
source-text: Any development that may result in adverse impacts on landscape / townscape character and/or
  visual amenity. ... For full and outline applications, submissions should be supported by an Outline
  Landscape Scheme showing general approaches to landscape treatments, and an outline plan for the establishment
  and ongoing management of the proposals.
must-include:
- item: 'Full and outline: an Outline Landscape Scheme showing general approaches to landscape treatments,
    and an outline plan for establishment and ongoing management'
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
- item: 'Reserved matters: a fully detailed Landscape Scheme including establishment and ongoing management'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: For Reserved Matters applications, submissions will need to be supported by a fully detailed
    Landscape Scheme including details of establishment and ongoing management of the landscape proposals.
- item: Biodiversity mitigation, compensation or enhancement measures from the EcIA incorporated in a
    combined Landscape and Ecological Management Plan (LEMP)
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Landscape & Visual Impact Assessment/Landscape
  Proposals). Landscape proposals sit under the LVIA requirement, which applies to development that 'may
  result in adverse impacts' on landscape or visual amenity (a judgement), so discretionary. The LVIA
  itself has no id and is in the unmapped list.
review-status: unverified
field-status: {}
