reference: transport-assessment
local-authority: MDE
required-if: discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/transport-assessment/
policy: Policies S1, DM3 and DM5 of the Adopted Mid Devon Local Plan Review; NPPF paragraph 118; DfT Circular
  01/2022
source-text: They are required for all developments which generate significant amounts of movements”.
  Developments that would result in a material increase or change in traffic over a level crossing including
  both vehicular and pedestrian crossings should equally prepare a suitable Transport Assessment.
must-include:
- item: Annual Average Daily Traffic flow (AADT) as well as peaks
  level: must
- item: Scope agreed with Devon County Council highways officers (and National Highways where the strategic
    road network is affected) before submission
  level: should
- item: Impact on the strategic road network assessed in line with DfT Circular 01/2022, including National
    Highways assets where relevant
  level: must
  required-if: discretionary
  source-text: National Highways requires that planning application submissions comply with the requirements
    of DfT Circular 01/2022
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Transport Assessment). 'Significant
  amounts of movement' is decided case by case and need not be limited to major development, so discretionary.
  A road safety audit is required where changes to the existing highway are proposed (see the unmapped
  list).
