reference: air-quality-assessment
local-authority: MDE
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: car-free
        value: false
        description: Not a car-free residential development.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - site:
        in:
        - air-quality-screening-area
        description: In one of the wards listed in the Air Quality SPD (Cadbury, Sandford and Creedy,
          Way, Taw Vale, Upper Yeo and Taw, Crediton Lawrence, Crediton Boniface, Yeo, Upper Culm, Canonsleigh,
          Halberton, Lower Culm, Cullompton St Andrews, Cullompton Padbrooke, Cullompton Vale, Bradninch,
          Silverton).
  - condition:
      field: parking-spaces
      operator: '>'
      value: 10
      description: A car park of more than 10 spaces.
  - site:
      in:
      - air-quality-management-area
      description: Within 20 metres of the Air Quality Management Area.
  - condition:
      field: direct-air-emissions
      value: true
      description: Will give rise to emissions to air of pollutants.
  - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/air-quality-assessment/
policy: Policy DM3 of the Adopted Mid Devon Local Plan Review; Mid Devon Air Quality SPD
source-text: 'All applications for major developments, except car-free residential developments, must
  be supported by an Air Quality Assessment (AQA) ... In accordance with the Air Quality SPD an AQA will
  also be required for minor developments that fall within the following wards: ... An AQA is also required
  for proposals that significantly increase traffic flows to/from the site or that change traffic flows
  to high polluting vehicles, e.g. car parks (>10 spaces), coach/lorry parks, etc. ... An AQA will also
  be required for any applications within 20 metres of the Air Quality Management Area (AQMA) ... Applications
  that will give rise to emissions to air of pollutants.'
must-include:
- item: The Air Quality Management Areas Initial Statement, completed
  level: must
  source-text: Please complete the Air Quality Management Areas- Initial Statement
- item: Prepared by a suitably qualified expert
  level: must
- item: The change in air quality or exposure resulting from the development, and mitigation measures
    as necessary
  level: must
- item: 'Major development: air quality impacts of the construction and operational phases on human health
    and ecological receptors, taking account of the Transport Statement/Assessment'
  level: must
  required-if:
    ref: major-development
- item: Description of baseline conditions, likely impact, any modelling or assessment and details of
    mitigation and management, as a minimum
  level: must
  source-text: The assessment must include a description of base line conditions, likely impact of the
    development proposed, any modelling or assessment undertaken to determine impact and details of mitigation
    and management as a minimum.
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Air Quality Assessment and Pollution
  Impact Statement). The Pollution Impact Statement (https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/pollution-impact-statement/)
  also asks for an air quality assessment for proposals with emissions to air and adds that any proposal
  needing a Transport Assessment needs one; it is merged here. 'Significantly increase traffic flows'
  and the AQMA case (to be confirmed with Environmental Health) are judgements, so those parts are discretionary.
  The ward list notes Newbrooke has been removed.
review-status: unverified
field-status: {}
