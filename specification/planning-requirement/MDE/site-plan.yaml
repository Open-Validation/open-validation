reference: site-plan
local-authority: MDE
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
    - lbc
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-1-national-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications
must-include:
- item: Existing and proposed block plans
  level: must
- item: As up-to-date as possible
  level: must
- item: At an identified measurable scale of 1:500, 1:200 or 1:100, with a scale bar
  level: must
- item: Clearly marked with the direction of North
  level: must
- item: Clearly shows the proposed development
  level: must
- item: All site boundaries, existing buildings, roads, tracks, footpaths, public rights of way, banks
    and historic features, ponds, watercourses and proposed boundary treatments (with removal/retention),
    on the site and on adjoining land
  level: must
- item: Any buildings to be demolished
  level: must
- item: Existing and proposed parking provision (including cycle storage), access and turning arrangements,
    and the extent and type of any hard surfacing
  level: must
- item: Position of all trees and hedges that could influence or be affected by the development, on the
    site and adjoining land, with removal/retention shown (including boundary hedges)
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 1 (National Requirements) and Part 3
  (Plans and Drawings). Part 1 says 'All applications'; the application types are those whose Part 2 checklist
  lists a block plan. Parking and access arrangements 'may be shown on Block Plan'.
review-status: unverified
field-status: {}
