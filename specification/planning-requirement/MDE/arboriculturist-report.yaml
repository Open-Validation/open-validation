reference: arboriculturist-report
local-authority: MDE
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on the site, or in close proximity to the site boundary.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/tree-survey-and-report/
policy: BS 5837:2012
source-text: For development proposals on site with trees, or where trees are in close proximity of the
  site boundary
must-include:
- item: Survey and appraisal by an arboriculturist of trees on the site and adjoining land, consistent
    with BS 5837:2012
  level: must
- item: Plan clearly marking trees to be felled and retained, with a schedule giving amenity value, species,
    size, age and condition of each tree
  level: must
- item: Tree constraints plan showing root protection areas and canopy spread on the site and adjoining
    land
  level: must
- item: Key landscape features such as ponds, hedges and wildlife corridors that may be affected
  level: must
- item: 'For larger applications: the landscape strategy, including new native planting'
  level: should
  required-if: discretionary
- item: Arboricultural method statement on protecting retained trees, with schedules of tree work and
    long-term maintenance proposals
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Tree Survey and Report).
review-status: unverified
field-status: {}
