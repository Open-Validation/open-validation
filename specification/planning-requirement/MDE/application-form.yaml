reference: application-form
local-authority: MDE
required-if:
  always: true
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-1-national-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications
must-include:
- item: All sections and questions answered
  level: must
- item: Declaration signed and dated
  level: must
- item: 'For development other than housing: non-residential floor space given as gross internal floor
    space'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential floorspace is proposed.
- item: One ownership certificate (A, B, C or D) completed and signed (not for advertisement consent);
    certificates C and D give the steps taken to find other owners, including the newspaper advert
  level: must
  source-text: Only one ownership certificate should be signed. If more than one certificate is signed
    your application cannot be processed.
- item: Notice served on all owners and agricultural tenants of the site
  level: must
  source-text: The applicant must serve notice on all owners of the application site including any agricultural
    tenants. Failure to serve the correct notice will invalidate the application.
- item: The appropriate fee paid in full at the time of submitting (where a fee is necessary)
  level: must
  source-text: The appropriate fee must be paid in full at the time of submitting your application
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 1 (National Requirements). The list gives
  the fee and the ownership certificate their own rows; they are shown here as part of the form.
review-status: unverified
field-status: {}
