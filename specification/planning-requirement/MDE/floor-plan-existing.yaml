reference: floor-plan-existing
local-authority: MDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
        - ldc-prospective-use
    - condition:
        field: building-works
        value: true
        description: The proposal creates, alters or adds to a building.
  - all:
    - application-type:
        in:
        - outline
    - site:
        in:
        - conservation-area
        description: Outline application in a conservation area.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/plans-and-drawings/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications (where relevant) ... Floor Plans to a scale of 1:50 or 1:100 ... Floor Plans
  and Elevations (if the site falls within the Conservation Area)
must-include:
- item: At a scale of 1:50 or 1:100, with a scale bar and the scale used
  level: must
- item: Layout of the whole of each floor created, altered or added to (a partial floor plan is acceptable
    for a single room extension)
  level: must
- item: The name of each room or area
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Plans and Drawings) and Part 2. The
  types are those whose Part 2 checklist asks for plans and drawings or floor plans; for outline applications
  Part 2 lists floor plans and elevations only where the site is in a conservation area.
review-status: unverified
field-status: {}
