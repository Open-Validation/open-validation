reference: noise-assessment
local-authority: MDE
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: New use (including change of use) such as restaurants, cafes, nightclubs, takeaways,
        places of worship, clinics, nurseries, cinemas, concert halls, sports and leisure uses, bingo
        halls, casinos, or industrial (B2/B8) development close to homes.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New residential development, including next to established industrial estates or transport
        sources.
  - condition:
      field: renewable-energy-development
      value: true
      description: Energy generation development, including wind turbines.
  - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/noise-impact-assessment/
policy: Policy DM 4 of the Adopted Mid Devon Local Plan Review
source-text: 'Development proposals that have the potential to raise issues of disturbance, or are considered
  to be noise sensitive developments. An Assessment will generally be required for the following types
  of application:'
must-include:
- item: Potential sources of noise and how they may affect local amenity and environmental receptors,
    particularly near nationally and internationally designated sites
  level: must
- item: How the developer intends to overcome these issues
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Noise Impact Assessment). The list
  calls it a Noise Impact Assessment and says it will 'generally' be required for the listed types; other
  proposals with 'potential to raise issues of disturbance' are a judgement, so discretionary.
review-status: unverified
field-status: {}
