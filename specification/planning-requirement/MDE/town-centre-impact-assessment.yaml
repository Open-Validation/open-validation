reference: town-centre-impact-assessment
local-authority: MDE
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or leisure development outside town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: More than 500 sq m of floorspace.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/retail-impact-assessment/
policy: Policies S7, DM14 and DM15 of the Adopted Mid Devon Local Plan Review
source-text: For all retail and leisure development outside of Town Centres for proposals exceeding 500
  m2 floorspace.
must-include:
- item: Impact on the vitality and viability of existing centres in the surrounding area
  level: must
- item: Impact on all retail offering, considering recent permissions, developments under construction
    and completed developments
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Retail Impact Assessment). The list
  calls it a Retail Impact Assessment.
review-status: unverified
field-status: {}
