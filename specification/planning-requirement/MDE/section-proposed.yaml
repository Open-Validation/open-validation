reference: section-proposed
local-authority: MDE
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal creates, alters or adds to a building.
  - condition:
      field: track-or-riding-arena
      value: true
      description: The proposal is for a track or an outdoor horse-riding arena.
  - site:
      in:
      - listed-building
      description: The proposal relates to a listed building.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/plans-and-drawings/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'Cross Section Drawings will be required if: the proposal will create, alter or add to a
  building, showing: ... the proposal is for a track or an outdoor horse-riding arena, showing: ... the
  proposal relates to a listed building, showing:'
must-include:
- item: Cross sections through the existing (if any) and proposed building and the rest of the site, related
    to adjoining ground levels, with a scale bar and the scale used
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: The proposal creates, alters or adds to a building.
- item: 'Track or riding arena: cross sections of any proposed surface treatment, with details of the
    surfacing materials and a scale bar'
  level: must
  required-if:
    condition:
      field: track-or-riding-arena
      value: true
      description: Track or outdoor horse-riding arena.
- item: 'Listed building: whole vertical and horizontal cross sections of joinery details, profiles and
    sections for new or replacement windows, doors and other architectural features, at 1:20 with a scale
    bar'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Relates to a listed building.
- item: Existing and proposed ground levels across the site, measured from an Ordnance Survey data point
    or another authoritative fixed point, in plan and cross section, covering land including and beyond
    any building footprint, with a north point, scale bar and scale
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Site levels are relevant to the proposal.
  source-text: Site Levels to an appropriate scale
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Plans and Drawings). Site levels are
  listed under 'All applications (where relevant)'.
review-status: unverified
field-status: {}
