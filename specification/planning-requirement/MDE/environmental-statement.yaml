reference: environmental-statement
local-authority: MDE
required-if:
  any:
  - condition:
      field: eia-development
      value: true
      description: Development listed in Schedule 1 of the EIA Regulations 2017.
  - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/environmental-impact-assessment-eia-screeningscoping-opinion/
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017 (as amended)
source-text: All applications where the development is listed in Schedule 1 of the Town and Country Planning
  (Environmental Impact Assessment) Regulations 2017. Developments that are listed in Schedule 2 of the
  above regulations, either above or below the thresholds, may require an Environmental Statement if it
  is likely to have significant effects on the environment by virtue of factors such as nature, size and
  location.
must-include:
- item: The information set out in Schedule 4 to the EIA Regulations
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Environmental Impact Assessment (EIA)
  Screening/Scoping Opinion). Schedule 2 development needs one only if screening finds likely significant
  effects, so that part is discretionary.
review-status: unverified
field-status: {}
