reference: heritage-statement
local-authority: MDE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - world-heritage-site
      - listed-building
      - listed-building-setting
      - conservation-area
      - archaeological-priority-area
      description: Affects a World Heritage Site, a listed building or their setting; within or affecting
        a conservation area; or in an area of archaeological interest.
  - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/heritage-statement/
policy: Policy DM25 of the Adopted Mid Devon Local Plan Review
source-text: 'All application for development which: affect a World Heritage Site or its setting; affect
  a listed building or its setting; are within or would impact upon a conservation area; may lie within
  an area of archaeological interest; or could impact upon any other designated or non-designated heritage
  asset or its setting.'
must-include:
- item: The proposed works and their extent, scope and purpose (repair, alteration or extension; internal
    or external)
  level: must
- item: Description and assessment of the significance of the asset affected, including the contribution
    of its setting
  level: must
- item: Any harm to the heritage asset and its setting, and any positive impacts
  level: must
- item: Mitigation and/or enhancement measures
  level: must
- item: The designation records from the National Heritage List for England (address, number and date
    of listing or schedule entry) and the description
  level: must
- item: The results of any archaeological work
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: In an area of archaeological interest.
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Heritage Statement) and Part 2. Part
  2 lists it as required for listed building consent. Other designated or non-designated heritage assets
  are covered by 'could impact upon', a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
