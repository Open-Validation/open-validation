reference: planning-statement
local-authority: MDE
required-if:
  any:
  - ref: major-development
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
  - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/planning-statement/
policy: Town and Country Planning Act 1990
source-text: All major applications, wind turbines and applications with economic impacts. This can be
  useful for other application to explain what is proposed.
must-include:
- item: How the development accords with relevant national, regional and local planning policies (not
    just reproducing policies)
  level: must
- item: Details of consultations with the LPA and wider community/statutory consultees
  level: must
- item: A separate statement on community involvement where appropriate
  level: must
  required-if: discretionary
- item: Regeneration benefits, including new jobs, and any regeneration strategies behind the proposal
  level: must
- item: Relative floorspace totals for each proposed use (where known)
  level: must
- item: Community benefits
  level: must
- item: Public open space to be provided
  level: must
- item: A utilities statement on links to existing utility infrastructure
  level: must
- item: Achievement of code for sustainable homes standards
  level: must
- item: Consideration of designing out crime
  level: must
- item: Adherence to any renewable energy requirements
  level: must
- item: A separate justification statement for tourism (where applicable)
  level: must
  required-if: discretionary
- item: Justification where community facilities such as a pub or play space would be lost
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Community facilities would be lost.
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Planning Statement). 'Applications
  with economic impacts' has no definition, so that part is discretionary.
review-status: unverified
field-status: {}
