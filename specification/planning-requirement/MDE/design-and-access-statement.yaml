reference: design-and-access-statement
local-authority: MDE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-2-validation-checklists-at-a-glance/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  NPPF; NPPG (Design & Access Statements Guidance)
source-text: Not statutorily required for all applications ... Design and Access Statement
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 1 (National Requirements) and Part 2
  (Listed Building Consent and Joint Householder and Listed Building Consent checklists). Part 2 lists
  it as required for listed building consent; for householder, full, outline and reserved matters applications
  it is listed as 'might be required'. The list doesn't repeat the statutory triggers (major development;
  one or more dwellings or 100 sq m in a conservation area or World Heritage Site) but cites the DMPO
  and Planning Portal guidance, so they are shown.
review-status: unverified
field-status: {}
