reference: sustainable-drainage-strategy
local-authority: MDE
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: In an area liable to flood from any source, including surface water, ground water
          or flood zones 2 and 3.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - site:
        in:
        - critical-drainage-area
        description: Within a Critical Drainage Area.
    - discretionary
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/surface-water-drainage-strategy/
policy: Policy DM1 of the Adopted Mid Devon Local Plan Review
source-text: 'A surface water drainage strategy is required for: All Major developments Minor development
  within an area liable to flood from all sources of flooding including surface water, ground water or
  flood zones 2 and 3. Minor development that is likely to increase flood risk locally and falls within
  a Critical Drainage Area'
must-include:
- item: 'Major outline: indicative sustainable drainage principles; topographical survey of natural water,
    groundwater and land drainage flows; post-development surface water destination; infiltration results
    (if appropriate); existing/proposed watercourses, sewers and pumping stations; flows and flood risk
    to and from the site; off-site works; sensitive receptors; maintenance principles'
  level: must
  required-if:
    all:
    - ref: major-development
    - application-type:
        in:
        - outline
  source-text: Any outline application for a development falling within the definition of ‘major’ shall
    be accompanied by a drainage strategy.
- item: 'Major full: a Detailed Drainage Strategy with everything for outline plus compliance with the
    Defra non-statutory technical standards, consents, flow paths, storage volumes and locations, sub-catchments,
    treatment train, landscaping/vegetative systems, design calculations (run-off rates, peak flows, volumes,
    storage, drain-down times, exceedance routes, climate change and future development allowances), temporary
    drainage during construction, and who will maintain the system for its lifetime'
  level: must
  required-if:
    all:
    - ref: major-development
    - application-type:
        in:
        - full
  source-text: Detailed Drainage Strategy (and FRA if appropriate)
- item: 'Minor: a Drainage Statement setting out how the development is to be drained, where it includes
    a proposed adoptable highway, creates impermeable area over more than 50% of the site or is in flood
    zones 2 and 3'
  level: must
  required-if:
    all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - discretionary
  source-text: 'If the proposed development meets any of the following criteria, a Drainage Statement
    may be required, setting out how the development is to be drained:'
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Surface Water Drainage Strategy).
  Whether minor development in a Critical Drainage Area is 'likely to increase flood risk locally' is
  a judgement, so that part is discretionary; for other minor applications a Drainage Statement 'may be
  required'.
review-status: unverified
field-status: {}
