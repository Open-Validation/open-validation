source-text: 'All Applications – Our preferred approach is completion of the checklist in the link below:'
must-include:
- item: How the applicant has addressed climate change and interconnected environmental impacts, in construction
    and over the lifetime of the development
  level: must
- item: How carbon emissions and consumption of natural resources have been or will be reduced through
    design, construction and operational systems
  level: must
- item: Completed Climate Emergency Planning Application Checklist (preferred format)
  level: should
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Climate Emergency). The list calls
  it Climate Emergency. Part 3 says 'All Applications', while the Part 2 checklists list it as 'might
  be required' for householder, full, outline, reserved matters and listed building consent applications;
  those types are shown. The level of information should be proportionate.
