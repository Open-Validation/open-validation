reference: waste-management-plan
local-authority: MDE
required-if:
  ref: major-development
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/waste-audit-statement/
policy: Policy DM4; Devon Waste Plan; Waste Management and Infrastructure SPD
source-text: Major development proposals
must-include:
- item: Sustainable procurement measures to minimise waste during construction, including avoiding over-ordering
    and reducing hazardous materials
  level: must
- item: Types and quantities of demolition and construction waste and how it will be managed under the
    waste hierarchy (segregation, recycling on site or at the nearest facility, disposal location for
    the rest)
  level: must
- item: Types and quantities of operational waste and how it will be managed under the waste hierarchy
    (limiting waste, storage for segregating reusable and recyclable waste)
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Waste Audit Statement). The list calls
  it a Waste Audit Statement. The contents are 'where relevant to the proposed development'.
review-status: unverified
field-status: {}
