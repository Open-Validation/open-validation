reference: schedule-of-works
local-authority: MDE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Converts a building to a dwelling.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates one or more dwellings.
source-url: https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/schedule-of-works/
policy: Policy DM25 of the Adopted Mid Devon Local Plan Review
source-text: Listed Building Consents and Applications to covert a building to a dwelling
must-include:
- item: The extent of any repairs, demolition and rebuilding
  level: must
- item: A supporting statement describing the works, including where relevant the methodology, materials
    and techniques
  level: must
- item: Alternatives considered and why the proposed approach is most appropriate
  level: must
confidence: medium
notes: From the council's list (adopted 26 September 2025), Part 3 (Schedule of Works) and Part 2.
review-status: unverified
field-status: {}
