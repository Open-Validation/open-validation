reference: archaeological-assessment
local-authority: ENF
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - scheduled-monument
        description: The site is within 50m of a Scheduled Monument.
    - any:
      - condition:
          field: basement
          value: true
          description: The proposal includes a new or extended basement.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal involves other extensive groundworks.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Archaeological Priority Area.
    - any:
      - condition:
          field: demolition
          value: true
          description: The proposal involves extensive demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal involves extensive groundworks.
  - all:
    - ref: major-development
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: The site is over 0.5 hectares.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.5
          description: The site is over 0.5 hectares.
  - condition:
      field: eia-development
      value: true
      description: The proposal needs EIA screening or scoping.
  - discretionary
source-url: https://www.enfield.gov.uk/__data/assets/pdf_file/0008/141101/Enfield-2026-Validation-Checklist-Householders-28-Sept-2026-Planning.pdf
source-text: Archaeological Assessment Proposals within 50m of Scheduled Monuments and include new basements,
  extensions to basements or other extensive groundworks London Plan (2021) An assessment of potential
  archaeological heritage should be provided.
confidence: medium
notes: 'The householder trigger is the council''s wording. From the audit (missing_requirement): item
  2 on the non-householder list covers extensive demolition or groundworks within an Archaeological Priority
  Area, heritage-asset sites (shown as officer discretion), majors over 0.5ha, and EIA screening/scoping.'
review-status: unverified
field-status: {}
