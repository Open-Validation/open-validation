reference: construction-management-plan
local-authority: ENF
required-if:
  any:
  - ref: major-development
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 250
      description: Commercial, community or industrial extensions of 250 square metres or more.
source-url: https://www.enfield.gov.uk/__data/assets/pdf_file/0007/141100/Enfield-2026-Validation-Checklist-All-Applications-except-Householders-28-Sept-2026-Planning.pdf
source-text: 'Construction Management Plan (CMP) When Expected: Proposals involving major developments
  and/or commercial/community/industrial extensions of 250m² or greater Details should be included of
  how on-site impacts will be managed during the demolition/construction phase (particularly on homes,
  other sensitive uses and biodiversity), including traffic management, dust, noise, vibration and stability.'
confidence: medium
notes: 'Audit (other): in the source this is ''When Expected'' content within the Planning Statement guidance
  (Section Three), not a checklist item; the trigger is accurate.'
