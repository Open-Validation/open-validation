reference: arboriculturist-report
local-authority: ENF
required-if:
  all:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees or hedges on the site or within 15m of the works.
  - any:
    - site:
        in:
        - conservation-area
        - tree-preservation-zone
        description: Trees or hedges in a Conservation Area or protected by a Tree Preservation Order
          are to be removed or pruned.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves groundworks within 15m of trees.
source-url: https://www.enfield.gov.uk/__data/assets/pdf_file/0007/141100/Enfield-2026-Validation-Checklist-All-Applications-except-Householders-28-Sept-2026-Planning.pdf
must-include:
- item: Prepared by a suitably qualified arboriculturist
  level: must
- item: In accordance with policy DMD80 and BS 5837:2012 Trees in relation to design, demolition and construction
  level: must
- item: Tree Protection Plan, including the location of proposed new utility and drainage services
  level: must
confidence: medium
notes: 'Audit (missing_requirement): item 24 Tree Assessment applies to non-householder applications too:
  removal or pruning of trees or hedges in a Conservation Area or under a TPO, or groundworks within 15m
  of trees. The workbook''s excerpts were garbled table text; the must-include items are the council''s
  wording from them ("All reports must be prepared by a suitably qualified arboriculturist and in accordance
  with policy DMD80 and British Standard BS 5837:2012").'
review-status: unverified
field-status: {}
