reference: flood-risk-assessment
local-authority: ENF
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new buildings.
    - condition:
        field: basement
        value: true
        description: The proposal includes a new or extended basement.
    - condition:
        field: residential-extension
        value: true
        description: The proposal includes a ground level extension.
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use creating new residential or commercial units.
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in a specified flood zone or at risk of surface water flooding.
    - condition:
        field: near-watercourse
        value: true
        description: The development is within 8m of a watercourse.
source-url: https://www.enfield.gov.uk/__data/assets/pdf_file/0008/141101/Enfield-2026-Validation-Checklist-Householders-28-Sept-2026-Planning.pdf
source-text: 'Flood Risk Assessment Proposals involving new buildings, basements, extensions to basements
  or ground level extensions with the following constraints: Surface Water Flood Risk'
confidence: low
notes: 'The householder trigger is the council''s wording (cut off after ''Surface Water Flood Risk'').
  From the audit (missing_requirement): item 14 also applies to non-householder applications, including
  changes of use creating new residential/commercial units, sites in specified flood zones or at surface
  water risk, and development within 8m of a watercourse. How the proposal types and the flood constraints
  combine on the non-householder list needs checking.'
review-status: unverified
field-status: {}
