reference: design-and-access-statement
local-authority: ENF
required-if:
  any:
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The proposal creates 100 square metres or more of new floorspace.
  - site:
      in:
      - listed-building-setting
      - park-and-garden
      - scheduled-monument
      description: The proposal affects the setting of a Listed Building, historic park or garden, or
        Scheduled Monument.
  - ref: major-development
source-url: https://www.enfield.gov.uk/__data/assets/pdf_file/0007/141100/Enfield-2026-Validation-Checklist-All-Applications-except-Householders-28-Sept-2026-Planning.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt stopped at ''Required for all applications: The Town and Country
  Planning (Development''. From the audit: Section One item 4 limits it to Conservation Areas with 100m2+
  of new floorspace, or proposals affecting the setting of a Listed Building, historic park/garden or
  Scheduled Monument, plus major development under national rules.'
review-status: unverified
field-status: {}
