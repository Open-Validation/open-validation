reference: viability-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing is required by JCS Policy SD12 but the offer is below policy because
        of viability.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/viability-appraisal/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy SD12 (Affordable Housing)
source-text: When the provision of affordable housing is a requirement of Policy SD12 of the Joint Core
  Strategy, but the affordable housing offer is below that required by policy due to financial viability
  concerns.
must-include:
- item: A detailed appraisal setting out why a policy compliant affordable housing offer is unviable
  level: must
- item: Follows the approach in the NPPF/NPPG
  level: must
- item: Prepared by suitably qualified professionals
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Viability appraisal'
  and the 'Planning application supporting information' checklist page. The appraisal is independently
  assessed at the applicant's cost after validation and is not treated as confidential. For reserved matters
  the list asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
