reference: noise-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: A new commercial entertainment/leisure facility such as a public house, nightclub
          or cinema.
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: Development likely to generate additional levels of noise and/or vibration in its
            operational phase.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Close to existing (or proposed) residential uses.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential development proposed close to existing sources of noise or vibration.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/noise-impact-asssessment/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policies SD14 (Health and Environmental
  Quality) and SD4 (Design Requirements)
source-text: Planning applications for new commercial entertainment/leisure facilities such as public
  houses, nightclubs and cinemas Development likely to generate additional levels of noise and/or vibration
  (in its operational phase) where close to existing (or proposed) residential uses Residential development
  where proposed close to existing sources of noise or vibration
must-include:
- item: Potential sources of noise and how they will impact upon noise sensitive receptors
  level: must
- item: Where an adverse impact is identified, how it will be mitigated to an acceptable level
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Noise impact assessment'
  and the 'Planning application supporting information' checklist page. For reserved matters the list
  asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
