reference: flood-risk-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Environment Agency Flood Zone 2 or 3 (medium or high risk river flooding).
    - site:
        in:
        - surface-water-flood-risk
        description: In an area designated medium or high risk surface water flooding.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: In Flood Zone 1 or a low risk surface water zone with a site area of 1 hectare or
          more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: In Flood Zone 1 or a low risk surface water zone with a site area of 1 hectare or
          more.
    - site:
        in:
        - future-flood-risk
        description: The council's Strategic Flood Risk Assessment (SFRA) shows the site will be at risk
          from any form of flooding, now or in the future.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/flood-risk-assessment/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy INF2 (Flood Risk Management)
source-text: 'Development (including householder applications) in areas designated by the Environment
  Agency as Flood Zone 2 or 3 (medium risk or high-risk river flooding) or in areas designated medium
  or high-risk surface water flooding, plus: Development within Flood Zone 1 or low risk surface water
  flood risk zone with a site area of 1 hectare or more. Development where the council’s Strategic Flood
  Risk Assessment (SFRA) shows that the site will be at risk from any form of flooding, now or in the
  future.'
must-include:
- item: An assessment of flood risk from all sources of flooding, plus an allowance for climate change
  level: must
- item: A detailed description and explanation of the site and development proposed
  level: must
- item: Estimated site-specific flood levels
  level: must
- item: Details of proposed finished floor levels
  level: must
- item: Details of any proposed flood mitigation measures, including safe access and egress routes where
    required
  level: must
- item: Any supporting plans and documentation
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Flood risk assessment'
  and the 'Planning application supporting information' checklist page. For reserved matters the list
  asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
