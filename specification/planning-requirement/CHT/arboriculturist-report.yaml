reference: arboriculturist-report
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The development will have an impact on a tree on or next to the site (not small trees
        with a trunk diameter under 75 mm measured 1.5 m above ground level).
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/arboricultural-impact-assessment/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy INF3 (Green Infrastructure);
  Cheltenham Plan 2020 policy G13 (Trees and Development)
source-text: Any development (including householder applications) which will have an impact on a tree
  on or next to the site. This does not apply to small trees with a trunk diameter of less than 75 millimeters
  measured 1.5 meters above ground level.
must-include:
- item: A tree survey carried out in line with BS 5837:2012
  level: must
- item: A plan showing which trees will be retained or removed
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Arboricultural impact
  assessment' and the 'Planning application supporting information' checklist page. For reserved matters
  the list asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
