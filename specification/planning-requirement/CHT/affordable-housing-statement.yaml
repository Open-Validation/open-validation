reference: affordable-housing-statement
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10 dwellings or more.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Residential development with a gross floor space exceeding 1000 sq m.
    - discretionary
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/affordable-housing-statement/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policies SD12 (Affordable Housing) and
  SD11 (Housing Mix and Standards)
source-text: An affordable housing statement will need to be submitted when the provision of affordable
  housing is a policy requirement, for example residential developments of 10 dwellings or more, or residential
  developments with a gross floor space exceeding 1000 square meters.
must-include:
- item: The number, type, mix, size, accessibility standards and tenure of the proposed affordable homes
  level: must
- item: An explanation of how the proposal meets JCS Policy SD12 (Affordable Housing) and Policy SD11
    (Housing Mix and Standards)
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Affordable housing statement'
  and the 'Planning application supporting information' checklist page. The two thresholds are given 'for
  example'; any other case where affordable housing is a policy requirement shows as discretionary. For
  reserved matters the list asks for its local requirements 'in so far as they are relevant to the matters
  reserved'.
review-status: unverified
field-status: {}
