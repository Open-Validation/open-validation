reference: heritage-statement
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - application-type:
        in:
        - lbc
    - all:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
      - any:
        - site:
            in:
            - conservation-area
            - listed-building
            - listed-building-setting
            - scheduled-monument
            - park-and-garden
            description: 'The development may impact upon a designated heritage asset (including its setting):
              conservation areas, listed buildings, scheduled monuments and registered parks/gardens.'
        - discretionary
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/heritage-statement/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy SD8 (Historic Environment); Cheltenham
  Plan 2020 policy HE2 (Archaeology)
source-text: All applications for listed building consent Any development that may impact upon a designated
  heritage asset (including its setting); this includes but is not limited to conservation areas, listed
  buildings, scheduled monuments and registered parks/gardens. Householder planning applications are excluded
  from this requirement (but not householder listed building applications)
must-include:
- item: An assessment of the significance of the heritage asset
  level: must
- item: An assessment of the impact of the proposal on that significance
  level: must
- item: Where harmful impacts are found or likely, the justification for that harm
  level: should
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Heritage statement or
  statement of heritage significance' and the 'Planning application supporting information' checklist
  page. The list of designated assets is 'not limited to' those named, so other designated heritage assets
  show as discretionary. Householder planning applications are excluded. The statement may be incorporated
  into the design and access statement. For reserved matters the list asks for its local requirements
  'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
