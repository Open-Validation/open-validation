reference: recreation-facilities-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
    - condition:
        field: loss-of-open-space
        value: true
        description: The development involves the loss of, or erosion of, open space.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/open-space-assessment/
policy: Cheltenham Plan 2020 policy C12 (Sport and Open Space in New Residential Development)
source-text: All major residential development Any development involving the loss of, or erosion of open
  space.
must-include:
- item: The amount and nature of existing and proposed open space within the application site and the
    wider area
  level: must
- item: Where an increase in open space is proposed, a demonstration that it is sufficient to meet the
    development's needs
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: The proposal includes new open space.
- item: Where a loss of open space is proposed, a comprehensive demonstration of how the proposal meets
    one or more of Sport England's 'Five Exceptions'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The proposal would result in a loss of open space.
- item: The information needed to assess compliance with Cheltenham Plan Policy C12
  level: must
confidence: medium
notes: 'From the council''s list (approved by Cabinet 18 February 2025), web page ''Open space assessment''
  and the ''Planning application supporting information'' checklist page. Open space is as defined in
  the Cheltenham Plan 2020 (para. 17.20): parks and gardens, natural and semi-natural greenspaces, amenity
  greenspace, provision for children and young people, allotments, cemeteries, disused churchyards or
  other burial grounds, and civic spaces. For reserved matters the list asks for its local requirements
  ''in so far as they are relevant to the matters reserved''.'
review-status: unverified
field-status: {}
