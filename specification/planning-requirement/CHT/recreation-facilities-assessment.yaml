reference: recreation-facilities-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The major development is residential.
    - condition:
        field: loss-of-open-space
        value: true
        description: The proposal would result in the loss of open space.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/
confidence: medium
notes: 'From the audit (missing_requirement): an Open Space Assessment for all major residential development,
  or where open space would be lost.'
review-status: unverified
field-status: {}
