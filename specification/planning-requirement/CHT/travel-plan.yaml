reference: travel-plan
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
  - discretionary
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/travel-plan/
source-text: All major applications unless they are unlikely to generate significant levels of vehicular
  movements.
must-include:
- item: A package of measures to encourage sustainable travel options to and from the development
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Travel plan' and the
  'Planning application supporting information' checklist page. The exception ('unlikely to generate significant
  levels of vehicular movements') is not defined, so the trigger is major development plus discretion.
  For reserved matters the list asks for its local requirements 'in so far as they are relevant to the
  matters reserved'.
review-status: unverified
field-status: {}
