reference: sustainability-statement
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential applications for new dwellings.
    - all:
      - ref: major-development
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Non-residential development.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/sustainable-construction-checklist/
source-text: All residential applications (new dwellings) All non-residential major applications
must-include:
- item: A completed Sustainable Construction Checklist (the council's form)
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Sustainable construction
  checklist' and the 'Planning application supporting information' checklist page. The list item is the
  Sustainable Construction Checklist, a less onerous document than an energy statement for smaller residential
  schemes (1-9 homes); major applications need both the energy statement and this checklist. For reserved
  matters the list asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
