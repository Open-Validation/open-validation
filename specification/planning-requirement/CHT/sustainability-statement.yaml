reference: sustainability-statement
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates 1 or more dwellings.
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: The proposal creates no more than 9 dwellings.
    - ref: major-development
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/
confidence: medium
notes: 'From the audit (missing_requirement): a Sustainable Construction Checklist for all 1-9 dwelling
  schemes, and for major applications alongside the Energy Statement.'
review-status: unverified
field-status: {}
