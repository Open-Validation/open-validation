reference: town-centre-impact-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or leisure development outside a defined centre.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 square metres of retail or leisure floorspace.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/
confidence: medium
notes: 'From the audit (missing_requirement): a Retail Impact Assessment for retail or leisure development
  over 2,500 sq m out of centre. The Retail Sequential Test is listed separately (unmapped).'
review-status: unverified
field-status: {}
