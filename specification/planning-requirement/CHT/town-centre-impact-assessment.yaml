reference: town-centre-impact-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use neither located in an existing centre nor in accordance with
        the development plan (not small scale rural offices or other small scale rural development).
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/retail-impact-assessment/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy SD2 (Retail and City/Town Centres)
source-text: Applications for retail and leisure developments which exceed 2500m2 gross floor space if
  that development is neither located in an existing centre nor in accordance with the development plan.
  ... Applications for main town centre uses which are neither located in an existing centre nor in accordance
  with the development plan. This excludes applications for small scale rural offices and other small
  scale rural development.
must-include:
- item: 'Retail sequential test: whether there are any suitable alternative sites for the proposed town
    centre use in sequentially preferable locations (within existing centres, then edge-of-centre)'
  level: must
- item: 'Retail impact assessment: the impact on existing, committed and planned public and private investment
    in a centre or centres in the catchment area'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development exceeding 2,500 sq m gross floor space.
- item: 'Retail impact assessment: the impact on town centre vitality and viability, including local consumer
    choice and trade in the town centre and the wider retail catchment'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development exceeding 2,500 sq m gross floor space.
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Retail Impact Assessment'
  and the 'Planning application supporting information' checklist page. Combines the list's Retail Impact
  Assessment and Retail Sequential Test (https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/retail-sequential-test/);
  the sequential test applies to all main town centre uses out of centre and not in line with the plan,
  the impact assessment only above 2,500 sq m. Main town centre uses are as defined on the checklist page
  (retail, leisure and entertainment, offices, arts, culture and tourism). For reserved matters the list
  asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
