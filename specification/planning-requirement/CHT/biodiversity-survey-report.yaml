reference: biodiversity-survey-report
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - ref: major-development
    - condition:
        field: demolition
        value: true
        description: A non-major application (including listed building consent) where demolition is proposed.
    - all:
      - application-type:
          in:
          - hh
          - full
          - outline
          - reserved-matters
      - any:
        - condition:
            field: near-woodland
            value: true
            description: The development affects woodland.
        - all:
          - condition:
              field: trees-on-or-near-site
              value: true
              description: The development affects parkland and mature trees.
          - discretionary
        - condition:
            field: near-watercourse
            value: true
            description: The development affects watercourses and other aquatic habitat.
        - condition:
            field: underground-structures
            value: true
            description: The development affects underground structures (for example caves and cellars).
        - condition:
            field: derelict-site
            value: true
            description: The development affects derelict buildings or land.
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/ecology-reportprotected-species-survey/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy SD9 (Biodiversity and Geodiversity)
source-text: 'An ecology report should be submitted with: all major applications non-major applications
  (including listed building consent) where demolition is proposed applications for development (including
  householder applications) affecting the following: woodland parkland and mature trees watercourses and
  other aquatic habitat underground structures (for example caves and cellars) derelict buildings or land
  ... A Heritage Statement is always required for applications for listed building consent as is an Ecology
  Report if demolition work is proposed'
must-include:
- item: Surveys and report comply with the British Standard for Biodiversity (BS 42020; the page says
    'GS42020')
  level: must
- item: Any additional surveys the report identifies as needed are carried out and submitted
  level: must
- item: An ecological baseline including an up-to-date desktop search of protected habitats and species
    on and near the site
  level: should
- item: An evaluation of ecological features and an assessment of the significance of effects arising
    from the impacts of the development
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Ecology report/protected
  species survey' and the 'Planning application supporting information' checklist page. 'Mature' trees
  are not defined, so that part is discretionary. The listed building consent section of the checklist
  page asks for an ecology report only if demolition work is proposed. For reserved matters the list asks
  for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
