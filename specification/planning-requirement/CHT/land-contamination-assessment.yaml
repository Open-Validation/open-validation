reference: land-contamination-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: The site may be contaminated due to past or current use.
    - condition:
        field: industrial-site
        value: true
        description: Redevelopment of an industrial or manufacturing site or a petrol filling station
          (or similar).
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/contaminated-land-assessment/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy SD14 (Health and Environmental
  Quality)
source-text: Applications proposing development on sites which may be contaminated due to past or current
  use. Applications proposing the redevelopment of industrial and manufacturing sites and petrol filling
  stations (and similar).
must-include:
- item: A Phase 1 Preliminary Risk Assessment
  level: must
- item: Complies with BS 10175 (Code of Practice for the investigation of potentially contaminated sites)
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Contaminated land assessment'
  and the 'Planning application supporting information' checklist page. Further assessment is likely after
  validation if the Phase 1 assessment identifies potential unacceptable risk. For reserved matters the
  list asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
