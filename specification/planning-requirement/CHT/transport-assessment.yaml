reference: transport-assessment
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
  - discretionary
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/transport-assessment-transport-statement/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy INF1 (Transport Network)
source-text: All major applications likely to generate significant levels of vehicular movements.
must-include:
- item: Scope agreed with Gloucestershire County Council case by case
  level: should
- item: The impact, including cumulative impacts, on congestion on the transport network
  level: must
- item: The impact, including cumulative impacts, on travel safety within the zone of influence
  level: must
- item: The impact, including cumulative impacts, on noise and/or atmospheric pollution within the zone
    of influence
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Transport assessment/statement'
  and the 'Planning application supporting information' checklist page. 'Significant levels of vehicular
  movements' is not defined, so the trigger is major development plus discretion. For reserved matters
  the list asks for its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
