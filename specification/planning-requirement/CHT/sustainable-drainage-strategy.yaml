reference: sustainable-drainage-strategy
local-authority: CHT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: 1 or more new dwellings.
    - condition:
        field: footprint-area
        operator: '>'
        value: 100
        description: A construction footprint exceeding 100 sq m (not householder).
source-url: https://cheltenham.gov.uk/planning-and-building/planning-permission/make-a-planning-application/planning-application-supporting-information/sustainable-drainage-strategy/
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy policy INF2 (Flood Risk Management)
source-text: 'A SUDS strategy is required for any development of: 1 or more new dwellings. A construction
  footprint exceeding 100m2 (not householder)'
must-include:
- item: Demonstrates that the SuDS hierarchy for surface water disposal has been followed and that the
    SuDS provide multifunctional benefits (water quantity, water quality, amenity and biodiversity)
  level: must
- item: Proposed post-development surface water flows and volume, compared with pre-development values
  level: must
- item: A drainage design layout plan including proposed design levels
  level: must
- item: An exceedance flow route plan identifying safe surface water flow routes through the site if the
    drainage system's capacity is exceeded
  level: must
- item: Proposals for maintenance and management of SuDS
  level: must
confidence: medium
notes: From the council's list (approved by Cabinet 18 February 2025), web page 'Sustainable drainage
  strategy' and the 'Planning application supporting information' checklist page. For single dwellings
  a high-level strategy identifying the method of surface water disposal (following the SuDS hierarchy)
  may be acceptable, with technical detail left to a condition. For reserved matters the list asks for
  its local requirements 'in so far as they are relevant to the matters reserved'.
review-status: unverified
field-status: {}
