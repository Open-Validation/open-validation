reference: flood-risk-assessment
local-authority: GOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: The site is over 1 hectare in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: The site is over 1 hectare in Flood Zone 1.
    - discretionary
source-url: https://www.gosport.gov.uk/article/1237/List-of-documents-required-by-GBC-LPA
source-text: Flood Zones 2 and 3; sites over 1 ha in Flood Zone 1; sites flagged in the SFRA as future
  flood risk
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave the Fire Statement trigger. Sites flagged in the SFRA
