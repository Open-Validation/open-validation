reference: fire-statement
local-authority: GOS
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The building would be 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The building would be seven storeys or more.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The development comprises two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The development comprises educational accommodation.
source-url: https://www.gosport.gov.uk/article/1237/List-of-documents-required-by-GBC-LPA
source-text: From 1st August 2021, any planning application for a development comprising two or more dwellings
  or educational accommodation in a building that would exceed either seven storeys or 18 metres in height
  must be accompanied by a Fire Statement.
confidence: medium
notes: The council's sentence was in the workbook's Design and Access Statement and FRA rows. The thresholds
  follow the national rule (18m or 7 storeys or more).
review-status: unverified
