reference: cil-form
local-authority: GOS
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: The proposal erects more than 100 square metres of new floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates any number of new dwellings.
source-url: https://www.gosport.gov.uk/article/1237/List-of-documents-required-by-GBC-LPA
source-text: 'Community Infrastructure Levy - Determining whether a Development may be CIL Liable Planning
  Application Additional Information Requirement form: This form must be submitted with all planning applications
  (including householder) that relate to either the erection of more than 100 square metres of new floorspace,
  or the creation of any number of new dwellings.'
confidence: medium
notes: 'Audit (wrong_app_type): the form applies to all planning applications (including householder,
  outline, reserved matters and s73) meeting the threshold.'
