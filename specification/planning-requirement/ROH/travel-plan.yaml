reference: travel-plan
local-authority: ROH
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: A major application of 50 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Or 1,000 sq m or more of commercial floorspace.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy TR3; NPPF paragraph 111
source-text: Any major application of 50 or more dwellings or 1,000sqm or more of commercial floorspace.
must-include:
- item: A draft travel plan outlining how the transport implications of the development will be managed
    to ensure the minimum environmental, social and economic impacts
  level: should
- item: How new occupiers or customers will use alternative means of travel that do not involve private
    vehicle use
  level: should
- item: Details of targets and arrangements for monitoring
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 26 and Annex
  A, page 17, 32.
review-status: unverified
field-status: {}
