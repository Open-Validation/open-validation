reference: arboriculturist-report
local-authority: ROH
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Protected or significant trees on or next to the site.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
source-text: Tree Survey / Arboricultural Statement Information will be required on which trees are to
  be retained within or on land adjacent to the site, and the means of protecting these trees during construction
  works.
must-include:
- item: Which trees within or adjacent to the site are to be retained
  level: must
- item: How the retained trees will be protected during construction
  level: must
confidence: low
notes: 'Audit (wrong_app_type): also ''Any applications for consent to fell or remove a tree subject to
  a Tree Preservation Order'', and householder applications.'
review-status: unverified
field-status: {}
