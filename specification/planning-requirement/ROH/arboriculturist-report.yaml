reference: arboriculturist-report
local-authority: ROH
required-if:
  any:
  - site:
      in:
      - ancient-woodland
      - tree-preservation-zone
      description: Ancient woodland or a tree protected by a Tree Preservation Order may be affected.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: A protected (including trees in conservation areas with a trunk diameter of 75cm or
        more at 1.5m above ground) or any other significant tree, within the site or on adjacent land,
        may be affected directly or indirectly.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy EN1; NPPF paragraph 170; BS5837:2012
source-text: Any application for planning permission where ancient woodland, a protected or any other
  significant tree, within the application site or on land adjacent to it, may be affected, directly or
  indirectly, by the proposals. ... or Any applications for consent to fell or remove a tree subject to
  a Tree Preservation Order
must-include:
- item: Which trees are to be retained within or on land adjacent to the site, and the means of protecting
    them during construction
  level: must
- item: Survey prepared by a suitably qualified arboriculturist in accordance with BS5837:2012
  level: should
- item: Plans
  level: must
- item: A full tree survey using the BS5837 criteria and classification system
  level: must
- item: Trees to be retained and those to be removed
  level: must
- item: Root protection areas (RPAs)
  level: must
- item: Any new planting/landscaping
  level: must
- item: Tree protection plan, including the location of tree protection measures
  level: must
- item: 'Report: survey information on the trees'
  level: must
- item: 'Report: an arboricultural implications assessment, including tree constraints (e.g. shading),
    the impact of the development and recommended mitigation'
  level: must
- item: 'Report: a concise list of trees to be retained/removed and tree surgery work (with annotated
    photographs where relevant)'
  level: must
- item: 'Report: an arboricultural method statement describing how the trees will be physically protected
    during construction, particularly any activity within the RPA'
  level: must
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 27 (Tree Survey
  / Arboricultural Statement) and Annex A, page 18, 32-33.
review-status: unverified
field-status: {}
