reference: affordable-housing-statement
local-authority: ROH
required-if:
  any:
  - all:
    - site:
        in:
        - rural-area
        description: In the Rural Areas.
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: In the High Weald Area of Outstanding Natural Beauty.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 6
          description: Schemes of 6 dwellings or more.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.2
          description: Or 0.2 hectares or more.
  - all:
    - site:
        in:
        - rural-area
        description: In the Rural Areas elsewhere.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: Schemes of 10 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.3
          description: Or 0.3 hectares or more.
  - all:
    - discretionary
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 'In Rye or Battle: schemes of 10 or more dwellings.'
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.3
          description: Or 0.3 hectares or more.
  - all:
    - discretionary
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 15
          description: 'In Bexhill and Hastings Fringes: schemes of 15 or more dwellings.'
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Or 0.5 hectares or more.
  - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy LHN2; Development and Site Allocations Local Plan
  (DaSA) Proposed Submission October 2018 policy DHG1
source-text: 1. Where affordable housing is required by an adopted development plan policy 2. Where the
  proposal includes an element of affordable housing that is to be operated by a registered provider
must-include:
- item: The mix and size of units
  level: should
- item: The tenure arrangements of such units
  level: should
- item: 'For a supported affordable housing scheme: any relevant care arrangements'
  level: should
- item: The involvement of a Registered Provider
  level: should
- item: Details on any consultation with Parish or Town Council or local community
  level: should
confidence: medium
notes: 'From the council''s list (formally reviewed July 2021, no revisions), local list item 1 and Annex
  A, page 13, 19-20. Thresholds are from policy DHG1 as quoted in Annex A: Bexhill and Hastings Fringes
  30% on schemes of 15+ dwellings (or 0.5 ha+); Rye 30% and Battle 35% on 10+ dwellings (or 0.3 ha+);
  Rural Areas in the High Weald AONB 40% on 6+ dwellings (or 0.2 ha+), elsewhere 40% on 10+ (or 0.3 ha+).
  Bexhill/Hastings Fringes, Rye and Battle have no map field yet, so those parts show as the council''s
  discretion, as does a scheme with affordable housing to be operated by a registered provider. The statement''s
  contents should be agreed with the council''s Housing officers.'
review-status: unverified
field-status: {}
