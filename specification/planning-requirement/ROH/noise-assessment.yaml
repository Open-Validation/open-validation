reference: noise-assessment
local-authority: ROH
required-if:
  any:
  - condition:
      field: plant-equipment
      value: true
      description: All applications for plant installation.
  - condition:
      field: noise-generating-use
      value: true
      description: Development/use involving activities that may generate significant levels of noise
        adjacent to existing noise sensitive uses (e.g. residential, schools and hospitals).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development (e.g. schools, hospitals and residential, excluding householder)
        adjacent to major road/transport infrastructure.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy OSS4; NPPF paragraphs 170, 180 and 205
source-text: • All applications for plant installation • Any application for development / use that involves
  activities that may generate significant levels of noise adjacent to existing noise sensitive uses (e.g.
  residential development, schools and hospitals) • Any application for noise sensitive development (e.g.
  schools, hospitals and residential development (excluding householder development)) adjacent to major
  road / transport infrastructure
must-include:
- item: Prepared by suitably qualified acousticians
  level: should
- item: The existing noise environment, the potential noise sources from the development or likely to
    affect it, and any mitigation measures
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 16 (Noise
  Impact Assessment) and Annex A, page 16, 28.
review-status: unverified
field-status: {}
