reference: floor-plan-proposed
local-authority: ROH
required-if: discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor plans should normally be drawn to a scale of 1:50 or 1:100, and should explain the
  proposal in detail.
must-include:
- item: Normally drawn to a scale of 1:50 or 1:100, explaining the proposal in detail
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: Details of the existing buildings as well as the proposed development
  level: should
- item: New buildings shown in context with adjacent buildings (including property numbers where applicable)
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: New buildings.
- item: 'Change of use involving physical changes internally: the existing use(s) and the extent and nature
    of the proposed change of use'
  level: should
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Change of use involving physical changes internally.
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (Further Guidance
  on Drawings), page 10. The list asks for such plans and drawings 'as is necessary to describe the development',
  in proportion to the proposal, so the trigger is shown as the council's discretion.
review-status: unverified
field-status: {}
