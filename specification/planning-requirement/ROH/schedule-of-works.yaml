reference: schedule-of-works
local-authority: ROH
required-if:
  application-type:
    in:
    - lbc
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Planning (Listed Buildings and Conservation Areas) Act 1990, sections 10 and 11
source-text: 'Applications for alterations for listed buildings must include such plans and drawings as
  are necessary to describe the proposed works, including their impact on the listed building. In addition
  to the plans and elevations described above, this should include: ❖ a description of all the works involved
  with plans identifying the exact part of the building to be altered'
must-include:
- item: A description of all the works involved, with plans identifying the exact part of the building
    to be altered
  level: should
- item: Details of any known historic fabric that will be affected
  level: should
- item: Repairs schedules/specifications where such work is proposed
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (Applications for
  Listed Building Consent), page 12. The detailed drawings of new or altered features (minimum 1:50) and
  joinery details are listed in the unmapped requirements.
