reference: viability-assessment
local-authority: ROH
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: Affordable housing is not included, or an application is made to vary the affordable
      housing obligation, and the absence or reduction is argued on viability grounds.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy LHN2; Development and Site Allocations Local Plan
  (DaSA) Proposed Submission October 2018 policy DHG1; Planning Practice Guidance (Viability)
source-text: Where affordable housing is not included in the proposal or an application is made to vary
  a planning obligation in respect of the affordable housing requirement and where the absence or reduction
  in affordable housing is argued on viability grounds, a full justification must be provided in line
  with the government's recommended approach set out national Planning Practice Guidance.
must-include:
- item: A full justification in line with the approach in national Planning Practice Guidance (paragraphs
    010-019)
  level: must
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), Annex A, item 1 (Affordable
  Housing), Viability Statement, page 20. Applicants must pay for an independent assessment by the District
  Valuation Service before the application is considered, and viability statements are made publicly available.
  Local list item 28 (Viability and Marketing Statement, for loss of facilities or conversion of agricultural
  buildings) is listed in the unmapped requirements.
review-status: unverified
field-status: {}
