reference: application-form
local-authority: ROH
required-if:
  always: true
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: An application must be submitted using the appropriate form.
must-include:
- item: The appropriate ownership certificate (A, B, C or D), with notice completed and served on all
    owners; also for listed building consent
  level: must
  source-text: All applications for planning permission must include the appropriate certificate of ownership.
    A notice to all owners of the application site must be completed and served. An ownership certificate,
    A, B, C or D must be completed stating the ownership of the property.
- item: 'Where Notices C or D are necessary: the application advertised in a local newspaper'
  level: must
- item: 'Agricultural land declaration: certifies that any agricultural tenants have been notified, or
    that there are none'
  level: must
  source-text: Applicants must certify that they have notified any agricultural tenants about their application,
    or that there are no agricultural tenants on the site.
- item: The correct fee (no fee for listed building consent)
  level: must
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (National List),
  page 6. The ownership certificates, agricultural land declaration and fee rows are shown as items here.
review-status: unverified
