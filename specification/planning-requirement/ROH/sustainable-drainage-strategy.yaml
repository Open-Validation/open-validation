reference: sustainable-drainage-strategy
local-authority: ROH
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: drainage-alterations
        value: true
        description: Involving surface water drainage.
  - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policies OSS3 (viii), SRM2 (iii), EN6 and EN7
source-text: Any major development involving surface water drainage In Fairlight Cove, any new development
  within or adjoining the Development Boundary – Inset Map No.14 of the Rother District Plan 2006
must-include:
- item: Existing drainage arrangements
  level: must
- item: Discharge rates existing and as a result of the development
  level: must
- item: Proposed drainage layout and strategy
  level: must
- item: Site investigations
  level: must
- item: Construction details
  level: must
- item: Off-site impacts
  level: must
- item: Future maintenance and management
  level: must
- item: 'Fairlight Cove (new development, excluding changes of use, other than major development): surface
    water drainage arrangements, where applicable based on the East Sussex County Council SuDS Decision
    Support Tool for Small Scale Development'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 23 (Sustainable
  Drainage) and Annex A, page 17, 30-31. Filed under the retired MHCLG id for a drainage strategy. Fairlight
  Cove (within or adjoining the Development Boundary, Inset Map 14) has no map field, so it shows as the
  council's discretion. The amount of information depends on the type of application.
