reference: waste-management-plan
local-authority: ROH
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 1
    description: The creation of one or more new dwellings.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy OSS4
source-text: Any application resulting in the creation of one of more new dwellings
must-include:
- item: How, as part of the overall design, refuse and recycling will be stored and collected
  level: must
- item: That the proposal will meet the current waste and recycling requirements and is flexible to adapt
    to future needs
  level: must
- item: Provision for prevention of litter from commercial premises
  level: must
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 19 (Refuse
  Disposal Strategy) and Annex A, page 17, 29. This can be shown on the plans or in the Design and Access
  Statement.
review-status: unverified
field-status: {}
