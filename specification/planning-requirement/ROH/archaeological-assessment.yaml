reference: archaeological-assessment
local-authority: ROH
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: Within an Archaeological Notification Area (ANA).
    - any:
      - condition:
          field: ground-disturbance
          value: true
          description: Ground works.
      - condition:
          field: structural-alteration
          value: true
          description: Structural works.
  - site:
      in:
      - scheduled-monument
      description: Affecting a Scheduled Ancient Monument (SAM).
  - ref: major-development
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy EN2; NPPF paragraph 189
source-text: • Any application involving structural or ground works within an Archaeological Notification
  Area (ANA) • Any application affecting a Scheduled Ancient Monument (SAM) • Any major development (10
  or more dwellings or 1,000sqm or more)
must-include:
- item: As a minimum, the relevant Historic Environment Record (HER) consulted, with an HER consultation
    report submitted where required
  level: must
- item: 'For development or works likely to have significant effects: a Desk-based Assessment and/or the
    results of field evaluation'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 11 (Heritage
  Statement (2) Archaeological Report) and Annex A, page 15, 25-26. It may form part of the Assessment
  of Significance.
review-status: unverified
field-status: {}
