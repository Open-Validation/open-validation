reference: recreation-facilities-assessment
local-authority: ROH
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: loss-of-open-space
        value: true
        description: Involves a loss of open space of public value (including areas of water such as rivers,
          canals, lakes and reservoirs).
  - all:
    - site:
        in:
        - open-space
        description: A playing field.
    - condition:
        field: loss-of-open-space
        value: true
        description: The loss of part or all of a playing field.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother District Local Plan (2006) policy CF4; NPPF section 8
source-text: • Any major development proposal (10 or more dwellings or 1,000sqm or more) which involves
  a loss of open space N.B. Open space is defined as open space of public value, including not just land,
  but also areas of water such as rivers, canals, lakes and reservoirs • Any development that includes
  the loss of part or all of a playing field
must-include:
- item: Plans showing areas of existing or proposed open space within or adjoining the application site
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 17 (Open Space
  Assessment) and Annex A, page 16, 28.
review-status: unverified
field-status: {}
