reference: photos
local-authority: ROH
required-if:
  any:
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: a description of all the works involved with plans identifying the exact part of the building
  to be altered including photographs showing the whole building in its setting and/or the particular
  section of the building affected by the proposed works. ... Retrospective applications should clearly
  indicate (with drawings and/or photographs) how the site or building appeared before the unauthorised
  works took place, and how it appears now
must-include:
- item: 'Listed building consent: photographs showing the whole building in its setting and/or the particular
    section of the building affected by the proposed works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Retrospective applications: drawings and/or photographs showing how the site or building appeared
    before the unauthorised works took place and how it appears now, with details of the extent of the
    works'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (Further Guidance
  on Drawings; Applications for Listed Building Consent), page 11-12. Retrospective applications are shown
  as the council's discretion (no field for them yet).
