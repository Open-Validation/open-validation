reference: heritage-statement
local-authority: ROH
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - battlefield
      - locally-listed-building
      description: Affects a designated heritage asset or its setting (conservation area, listed building,
        scheduled ancient monument, registered park and garden, historic battlefield) or a non-designated
        heritage asset.
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy EN2; NPPF paragraph 189
source-text: • Any application for planning permission affecting a designated Heritage Asset or its setting,
  including Conservation Areas, Listed Buildings, Scheduled Ancient Monuments, Registered Parks & Gardens,
  Historic Battlefields, or any application affecting a non-designated Heritage Asset, including unlisted
  historic structures such as traditional agricultural buildings, and Victorian and Edwardian buildings.
  • Any application for Listed Building Consent • Any application for Conservation Area Consent
must-include:
- item: A description of the historic, cultural, aesthetic and archaeological significance of the heritage
    assets affected, and the contribution of their setting to that significance
  level: must
- item: Uses the council's Assessment of Significance pro forma as a starting point
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 10 (Heritage
  Statement (1) Assessment of Significance) and Annex A, page 15, 25. Non-designated heritage assets the
  council considers of historic interest (e.g. unlisted oast-houses, barns, chapels, mills, Victorian
  villas) are shown as the council's discretion. Conservation Area Consent no longer exists; it is shown
  as demolition in a conservation area.
review-status: unverified
field-status: {}
