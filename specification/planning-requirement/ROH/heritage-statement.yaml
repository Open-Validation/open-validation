reference: heritage-statement
local-authority: ROH
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      description: The application affects a designated heritage asset or its setting.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
source-text: Heritage Statement (1) Assessment of Significance for works affecting Heritage Assets An
  Assessment of Significance will need to contain a description of the historic, cultural, aesthetic and
  archaeological significance of those heritage assets affected by the proposal, and the contribution
  of their setting to that significance.
must-include:
- item: The historic, cultural, aesthetic and archaeological significance of the heritage assets affected,
    and the contribution of their setting
  level: must
  source-text: An Assessment of Significance will need to contain a description of the historic, cultural,
    aesthetic and archaeological significance of those heritage assets affected by the proposal, and the
    contribution of their setting to that significance.
confidence: low
notes: 'Audit (wrong_app_type): ''Any application for planning permission affecting a designated Heritage
  Asset or its setting'', including householder, and listed building consent.'
review-status: unverified
