reference: roof-plan-proposed
local-authority: ROH
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: Any proposed alteration to an existing roof.
  - all:
    - condition:
        field: new-build
        value: true
        description: New development.
    - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof plans are required for any proposed alteration to an existing roof, or for any new development
  proposing a complex or unusual roof structure.
must-include:
- item: Details of the roofing material proposed and locations of any equipment to be installed on the
    roof
  level: must
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (Further Guidance
  on Drawings), page 10. Whether a new development's roof structure is 'complex or unusual' is shown as
  the council's discretion.
review-status: unverified
field-status: {}
