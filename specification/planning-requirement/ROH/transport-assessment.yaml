reference: transport-assessment
local-authority: ROH
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 0
        description: The development involves traffic generation.
  - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy TR3; NPPF paragraph 111
source-text: A Transport Assessment or Transport Statement will be required with all major developments
  involving traffic generation.
must-include:
- item: The transport consequences of the development
  level: should
- item: Details of measures and/or initiatives proposed to provide for the transport demands arising from
    the development and to mitigate its transport impacts
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 25 and Annex
  A, page 17, 31-32. Annex A says all relevant applications in East Sussex should include a transport
  document (a Transport Assessment, Transport Statement or Transport Report, chosen using East Sussex
  County Council's thresholds); that wider part is shown as the council's discretion. A Car Parking Capacity
  Survey may also accompany it.
review-status: unverified
field-status: {}
