reference: location-plan
local-authority: ROH
required-if:
  always: true
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A 'location plan' that shows the application site in relation to the surrounding area must
  be submitted
must-include:
- item: Based on an up-to-date map
  level: should
- item: Scale typically 1:1250 or 1:2500; wherever possible scaled to fit onto A4 or A3 size paper
  level: should
- item: Sufficient roads and/or buildings on land adjoining the site to make the exact location clear
    (in remote rural areas, a Grid Reference if roads cannot be indicated)
  level: should
- item: Application site edged clearly with a red line, including all land necessary to carry out the
    development (e.g. access from a public highway, visibility splays, landscaping, car parking and open
    areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant, close to or adjoining the application
    site
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (National List),
  page 5.
review-status: unverified
field-status: {}
