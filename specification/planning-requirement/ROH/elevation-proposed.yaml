reference: elevation-proposed
local-authority: ROH
required-if: discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevations should normally be drawn to a scale of 1:50 or 1:100, and show clearly the proposed
  works in relation to what already exists. All sides of the proposal must be shown, including blank elevations.
must-include:
- item: Normally drawn to a scale of 1:50 or 1:100
  level: should
- item: Shows clearly the proposed works in relation to what already exists
  level: should
- item: All sides of the proposal, including blank elevations
  level: must
- item: The proposed building materials and the style, materials and finish of windows and doors
  level: should
- item: 'Where a proposed elevation adjoins another building or is in close proximity: the relationship
    between the buildings and the positions of the openings on each property'
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (Further Guidance
  on Drawings), page 10. The list asks for such plans and drawings 'as is necessary to describe the development',
  in proportion to the proposal, so the trigger is shown as the council's discretion.
