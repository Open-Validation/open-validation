submission-standards:
- item: Plans clearly drawn and to a scale or dimensioned, understandable to members of the public and
    clearly describing the proposal
  level: must
- item: Plans and drawings drawn to an identified scale; plans show the direction of north
  level: must
- item: A linear scale bar on all electronic submissions
  level: must
- item: Drawings should not say that measurements must not be scaled; any drawing that does must be clearly
    dimensioned with accurate measurements
  level: must
- item: Drawings must not show a level site where this is not a true representation of actual ground conditions
  level: must
- item: Each plan separately and correctly annotated when submitted via the Planning Portal
  level: should
- item: One paper copy of the application plans sent direct to the council
  level: should
- item: 'Major applications: one hard copy of all plans and documents before validation'
  level: must
