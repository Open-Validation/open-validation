reference: flood-risk-assessment
local-authority: ROH
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: 'In Flood Zones 2, 3a or 3b: any development, except minor domestic extensions or works
        that create no new dwelling and no new bedroom space.'
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: 'Flood Zone 1: development over 1 hectare.'
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: 'Flood Zone 1: development over 1 hectare.'
  - site:
      in:
      - critical-drainage-area
      description: 'Flood Zone 1: a critical drainage problem as notified by the Environment Agency.'
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy EN7; NPPF paragraph 163 and Technical Guidance
source-text: • Flood Zone 1. Any application any development over 1 hectare having a critical drainage
  problem as notified by the Environment Agency. • Flood Zones 2, 3a and 3b. Any development, except for
  minor domestic extensions or works where no new residential dwelling unit is being created and the scheme
  involves no new bedroom space.
must-include:
- item: Addresses flood risk to both property and people
  level: should
- item: Identifies and assesses the risks of all forms of flooding to and from the development and demonstrates
    how they will be managed, taking climate change into account
  level: should
- item: Identifies opportunities to reduce the probability and consequences of flooding
  level: should
- item: Includes the design of surface water management systems, including Sustainable Drainage Systems
    (SuDS)
  level: should
- item: Addresses safe access to and from the development in areas at risk of flooding
  level: should
- item: 'Flood Risk Sequential Test evidence: that a sequential approach to site selection has been undertaken,
    as required by the Technical Guidance to the NPPF'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2, 3a or 3b.
    - discretionary
  source-text: Any relevant application within Flood Risk Zone 2, 3a and 3b
- item: 'Flood Risk Exception Test evidence: that the Exceptions Test has been applied, as required by
    the Technical Guidance to the NPPF'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2, 3a or 3b.
    - discretionary
  source-text: Any relevant application within Flood Risk Zone 2 or 3a and 3b
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list items 7-9 and Annex
  A, page 14-15, 24-25. The list's 'Flood Zone 1' bullet reads 'any development over 1 hectare having
  a critical drainage problem'; it is shown as two triggers (over 1 ha, or a critical drainage problem).
  The minor-extension exception in Flood Zones 2-3 has no field. The Sequential and Exception Test evidence
  (items 8 and 9) are separate rows, shown here as items; 'any relevant application' is shown as the council's
  discretion.
review-status: unverified
field-status: {}
