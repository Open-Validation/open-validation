reference: flood-risk-assessment
local-authority: ROH
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Development in flood zone 2, 3a or 3b (minor domestic extensions with no new dwelling
        or bedroom are excluded).
  - all:
    - site:
        in:
        - critical-drainage-area
        description: The site is in flood zone 1 with critical drainage problems.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: The site is over 1 hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: The site is over 1 hectare.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
confidence: medium
notes: 'From the audit (wrong_trigger): FZ1 sites over 1 ha with critical drainage problems, and development
  in FZ2/3a/3b. The workbook quoted ''A matrix is also provided...''.'
review-status: unverified
field-status: {}
