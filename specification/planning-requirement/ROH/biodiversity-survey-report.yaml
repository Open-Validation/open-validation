reference: biodiversity-survey-report
local-authority: ROH
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - special-protection-area
      - ramsar
      - special-area-of-conservation
      - priority-habitat
      - ancient-woodland
      description: 'Within, or adjacent to where any impact is likely: an SSSI, SNCI, Local Nature Reserve,
        SPA, Ramsar site, SAC or Biodiversity Action Plan habitat (e.g. ancient woodland). Not for change
        of use or householder development.'
  - all:
    - ref: major-development
    - condition:
        field: outside-urban-area
        value: true
        description: Outside an urban area (except for change of use of a building).
  - condition:
      field: protected-species
      value: true
      description: Nationally or internationally protected species or their habitat are likely to be present
        (e.g. conversions of farm buildings).
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy EN5; ODPM Circular 06/2005; DEFRA Circular 01/2005;
  Wildlife and Countryside Act 1981; CROW Act 2000; Conservation of Habitats and Species Regulations 2010;
  Natural Environment and Rural Communities Act 2006
source-text: '• Any application (except for change of use and development to an existing dwelling (householder))
  within a: o Site of Special Scientific Interest (SSSI) o Site of Nature Conservation Interest (SNCI)
  o Local Nature Reserve (LNR) o Special Protection Area (SPA) o RAMSAR site o Special Area of Conservation
  (SAC) or adjacent to any of the above where any impact is likely o Biodiversity Action Plan (BAP) Habitat.
  • Any major development outside an urban area (except for change of use of a building). • Where there
  is likely to be nationally or internationally protected species or their habitat, e.g. conversions of
  farm buildings.'
must-include:
- item: A survey and assessment where the development is within, or likely to affect, a designated site
    or priority habitat
  level: must
- item: 'Where there is a reasonable likelihood of protected or priority species being present and affected:
    an ecological phase 1/scoping report, and any further survey reports it identifies as needed'
  level: should
  required-if:
    condition:
      field: protected-species
      value: true
      description: Nationally or internationally protected species or their habitat are likely to be present
        (e.g. conversions of farm buildings).
- item: 'Where protected or priority species or habitats are found: mitigation, avoidance and/or compensatory
    measures proposed'
  level: must
- item: Carried out by a suitably qualified ecological consultant, in accordance with the latest survey
    standards and Natural England's Standing Advice, at appropriate times of the year
  level: should
- item: 'Where European Protected Species are present and an offence would be committed without a Natural
    England licence: information on how the three derogation tests would be met'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Nationally or internationally protected species or their habitat are likely to be present
        (e.g. conversions of farm buildings).
- item: Information on badger setts in a separate document marked 'CONFIDENTIAL'
  level: should
  required-if:
    condition:
      field: protected-species
      value: true
      description: Nationally or internationally protected species or their habitat are likely to be present
        (e.g. conversions of farm buildings).
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 4 (Ecological
  Survey and Report) and Annex A, page 14, 22-23.
review-status: unverified
field-status: {}
