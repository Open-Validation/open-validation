reference: telecommunications-report
local-authority: ROH
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications development.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: NPPF section 10
source-text: Any application for telecommunications development
must-include:
- item: A declaration that the equipment and installation fully complies with the ICNIRP requirements
  level: must
- item: Area of search
  level: must
- item: A map showing the relationship of the site to schools and other telecommunication equipment in
    the vicinity
  level: must
- item: A statement explaining the reasons for the choice of design
  level: must
- item: Technical information including the frequency, modulation characteristics, power output and height
    of the proposed antenna
  level: must
- item: 'Technical justification: the purpose of the site and why the development is required'
  level: must
- item: Details of alternative sites rejected, with justification, including existing masts, structures
    and other buildings in the search area, or an explanation if no alternatives were considered
  level: must
- item: Visual impact assessment
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 24 (Telecommunication
  Information) and Annex A, page 17, 31.
review-status: unverified
field-status: {}
