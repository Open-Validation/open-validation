reference: town-centre-impact-assessment
local-authority: ROH
required-if:
  condition:
    field: retail-floorspace
    operator: '>='
    value: 500
    description: A retail application comprising floor space of 500 sq m or more.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy EC7; Rother District Local Plan (2006) policies
  EM13, BX5 and BX6; NPPF paragraph 89
source-text: Any retail application comprising floor space of 500 sq m or more.
must-include:
- item: The impact on existing, committed and planned public and private investment in a centre or centres
    in the catchment area of the proposal
  level: should
- item: The impact on town centre vitality and viability, including local consumer choice and trade in
    the town centre and the wider retail catchment (as applicable to the scale and nature of the scheme)
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 20 (Retail
  Assessment - Town Centre Uses) and Annex A, page 17, 29.
review-status: unverified
field-status: {}
