reference: design-and-access-statement
local-authority: ROH
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Development in a designated area (a World Heritage Site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement is required for certain types of planning applications. •
  Applications for major development, as defined in article 2 of the Town and Country Planning (Development
  Management Procedure (England) Order 2015; • Applications for development in a designated area, where
  the proposed development consists of: o one or more dwellings; or o a building or buildings with a floor
  space of 100 square metres or more. • Applications for listed building consent.'
must-include:
- item: Explains the design principles and concepts that have been applied to the proposed development
  level: must
- item: Demonstrates the steps taken to appraise the context of the proposed development, and how the
    design takes that context into account
  level: must
- item: Explains the applicant's approach to access and how relevant Local Plan policies have been taken
    into account
  level: must
- item: Details any consultation undertaken on access issues and how its outcome informed the development,
    and how specific access issues have been addressed
  level: must
- item: 'Listed building consent: explains the design principles and concepts applied to the works and
    how they take account of the building''s special architectural or historic importance, the physical
    features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent (unless the works only affect the interior): how access to the building
    has been dealt with, including alternative means of access considered and how relevant Local Plan
    policies have been taken into account'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: information on any consultation undertaken and how its outcome has informed
    the works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (National List),
  page 7-8. Not needed for waste development, a material change of use, or engineering or mining operations.
  The council publishes guidance notes and a pro-forma.
review-status: unverified
field-status: {}
