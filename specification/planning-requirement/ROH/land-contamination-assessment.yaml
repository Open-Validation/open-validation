reference: land-contamination-assessment
local-authority: ROH
required-if:
  any:
  - all:
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected.
      - discretionary
    - condition:
        field: ground-disturbance
        value: true
        description: Ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development with a sensitive end use (a Preliminary Risk Assessment as a minimum).
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policies OSS3 and OSS4; NPPF paragraph 178
source-text: Any application relating to sites where contamination is known or suspected, or the development
  is in the vicinity of such land, and ground works are proposed ... For development with a sensitive
  end use, a minimum of a Preliminary Risk Assessment (PRA) will be required regardless of the history
  of the site, contaminated or otherwise.
must-include:
- item: A report from a Competent Person (as defined by the NPPF Annex 2 Glossary) determining the existence
    of contaminated land, its nature, the risks it may pose to the development and whether remedial measures
    are feasible
  level: must
- item: A desk study listing current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
- item: A preliminary conceptual site model showing all potential pollutant linkages, with a preliminary
    risk assessment of them
  level: must
- item: 'Development with a sensitive end use: as a minimum, a Preliminary Risk Assessment (PRA)'
  level: must
  required-if:
    condition:
      field: sensitive-end-use
      value: true
      description: Sensitive end use.
- item: 'Depending on the site, end use and potential for contamination: a Site Investigation and Risk
    Assessment and Remediation Strategy'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 14 and Annex
  A, page 16, 26-27. Development 'in the vicinity of' contaminated land has no distance, so it is shown
  as the council's discretion.
review-status: unverified
field-status: {}
