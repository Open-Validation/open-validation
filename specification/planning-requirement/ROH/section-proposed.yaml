reference: section-proposed
local-authority: ROH
required-if:
  condition:
    field: new-build
    value: true
    description: New building(s).
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Full information should be submitted to demonstrate how any new building(s) will relate in
  scale, height and situation to neighbouring development, both on the site and outside it. This should
  normally be in the form of cross-sections and/or long sections drawn at a scale of 1:100 or 1:200 to
  show the proposal in context with adjoining or adjacent buildings.
must-include:
- item: Cross-sections and/or long sections, normally at a scale of 1:100 or 1:200
  level: should
- item: How the new building(s) relate in scale, height and situation to neighbouring development, on
    the site and outside it, in context with adjoining or adjacent buildings
  level: must
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), section 1 (Further Guidance
  on Drawings), Site Sections, page 11. Existing and proposed site levels (contours, spot levels or cross
  sections) are a separate row, listed in the unmapped requirements.
