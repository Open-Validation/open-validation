reference: lighting-assessment
local-authority: ROH
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The application includes or is for floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting.
    - discretionary
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: Rother Local Plan Core Strategy (2014) policy OSS4; NPPF paragraph 180
source-text: Any application including or for floodlighting, or any significant amount of external lighting
must-include:
- item: Details of the external lighting and the proposed hours when it would be switched on
  level: should
- item: A layout plan with beam orientation and a schedule of equipment in the design
  level: must
- item: Technical specification designed to ensure nuisance from lighting is minimised/prevented
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 15 and Annex
  A, page 16, 27-28. 'Any significant amount of external lighting' is shown as the council's discretion.
  Annex A names floodlighting for sport, recreational and publicly accessible developments within 100
  m of homes, a listed building, a conservation area or open countryside, and lighting for advertisements.
review-status: unverified
field-status: {}
