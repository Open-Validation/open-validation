reference: sci
local-authority: ROH
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: A major proposal in excess of 50 dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Or in excess of 1000 square metres of commercial floorspace.
source-url: https://rdcpublic.blob.core.windows.net/website-uploads/2021/07/Planning-Validation-Checklist-July-2021.pdf
policy: NPPF paragraphs 39-46
source-text: Any Major proposal in excess of 50 dwellings or 1000m2 of commercial floorspace.
must-include:
- item: How pre-application community involvement has been undertaken, and how the results of any consultation
    have been considered and led to the evolution of the submitted scheme
  level: should
confidence: medium
notes: From the council's list (formally reviewed July 2021, no revisions), local list item 18 (Pre-application
  Engagement Statement) and Annex A, page 17, 28-29.
review-status: unverified
field-status: {}
