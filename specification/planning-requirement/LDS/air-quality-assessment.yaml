reference: air-quality-assessment
local-authority: LDS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Within or adjacent to an Air Quality Area.
    - condition:
        field: direct-air-emissions
        value: true
        description: Industrial development where emissions could affect the surrounding neighbourhood.
    - discretionary
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: Natural Resources and Waste Local Plan Policy AIR 1
source-text: 'An Air Quality Report is needed if any of these apply: Within or adjacent to Air Quality
  Area Result in designation of new Air Quality Area Development near designated industrial process Industrial
  development where emissions could affect surrounding neighbourhood'
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Air
  quality assessment'. 'Result in designation of new Air Quality Area' and 'Development near designated
  industrial process' have no defined test, so they show as discretionary.
review-status: unverified
field-status: {}
