reference: structural-damage
local-authority: LDS
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - any:
    - condition:
        field: structural-damage-alleged
        value: true
        description: Damage to property, structures or surfaces (garden walls, drains, paving, drives)
          by the tree is alleged.
    - condition:
        field: subsidence-alleged
        value: true
        description: Damage to property by the tree is alleged.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Where damage to property by trees is alleged then evidence that the tree is a material cause
  of the problem and that other factors have been eliminated as potential influences so far as possible
  is required. ... Where damage to structures and surfaces such as garden walls, drains, paving and drives
  is alleged technical evidence from a relevant engineer, building/drainage surveyor or other appropriate
  expert must be provided.
must-include:
- item: Evidence that the tree is a material cause of the problem and that other factors have been eliminated
    as far as possible
  level: must
- item: Evidence from a suitably qualified person (Structural Engineer/Drains Specialist and Arborist
    Contractor/Arboricultural Consultant)
  level: must
- item: 'Damage to structures and surfaces: technical evidence from a relevant engineer, building/drainage
    surveyor or other appropriate expert'
  level: must
  required-if:
    condition:
      field: structural-damage-alleged
      value: true
      description: Damage to structures and surfaces is alleged.
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Applications
  for works to trees with a TPO: Additional evidence – Damage to property; Damage to structures and surfaces''.'
review-status: unverified
field-status: {}
