reference: photos
local-authority: LDS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: retrospective
          value: true
          description: A retrospective application.
      - condition:
          field: telecommunications-development
          value: true
          description: A satellite dish.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - any:
      - ref: major-development
      - site:
          in:
          - conservation-area
          description: Affecting a Conservation Area.
  - application-type:
      in:
      - ldc-existing-use
      - advertising
      - lbc
      - pa-demo-building
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Retrospective applications – photographs should be provided showing all elevations. ... Photographs
  should be provided showing where the dish will be positioned and the manufacturers brochure/specification.
  ... Will include major developments and proposals affecting Conservation Areas or having a significant
  impact in Conservation Areas. ... Photographs should be provided showing the existing buildings on site,
  showing both interior and exterior details and its setting. ... Photographs and photomontages should
  be provided where possible showing details of the advertisements and the proposed locations. ... Photographs
  should be provided showing the existing and adjacent buildings on the site. ... Where possible photographs
  of the trees including their relationship with other trees/vegetation/buildings.
must-include:
- item: 'Retrospective householder applications: photographs showing all elevations'
  level: should
  required-if:
    condition:
      field: retrospective
      value: true
      description: A retrospective application.
- item: 'Satellite dishes: photographs showing where the dish will be positioned, with the manufacturer''s
    brochure/specification'
  level: should
  required-if:
    condition:
      field: telecommunications-development
      value: true
      description: A satellite dish.
- item: 'Major developments and proposals affecting conservation areas: visual information such as photographs,
    artists'' impressions and computer generated images'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: Existing buildings on site, showing interior and exterior details and their setting
  level: should
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - lbc
- item: 'Listed buildings: a plan showing the position each photograph was taken from'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Advertisements: photographs and photomontages showing the advertisements and their proposed locations,
    where possible'
  level: should
  required-if:
    application-type:
      in:
      - advertising
- item: 'Notification for demolition: the existing and adjacent buildings on the site'
  level: should
  required-if:
    application-type:
      in:
      - pa-demo-building
- item: 'Tree works: photographs of the trees, individually and within their setting, with relevant buildings/structures
    or boundaries, where possible'
  level: should
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Photographs
  (householder, listed building, notification for demolition, tree works); Visual representations (planning);
  Photomontages and photographs (certificates, advertisements)'. The planning section's 'Visual representations'
  item is filed here.
review-status: unverified
field-status: {}
