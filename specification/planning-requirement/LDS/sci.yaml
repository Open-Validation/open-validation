reference: sci
local-authority: LDS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - any:
      - ref: major-development
      - discretionary
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: Onshore wind development.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height of any turbine exceeds 15 metres.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: Adopted and interim SCI; UK Statutory Instruments 2013 No. 2932
source-text: 'Major developments and other sensitive schemes. ... More than 2 turbines or where hub height
  for any turbine exceeds 15 metres: Compulsory pre-application consultation with local community. Provide
  details of how this was done, responses received and the account taken of responses.'
must-include:
- item: Details of consultations
  level: must
- item: A summary of responses
  level: must
- item: How the responses have been taken into consideration
  level: must
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Statement
  of community involvement; Wind turbines (onshore wind development)'. 'Other sensitive schemes' shows
  as discretionary.
review-status: unverified
field-status: {}
