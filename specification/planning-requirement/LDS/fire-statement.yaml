reference: fire-statement
local-authority: LDS
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Fire Statement (for some planning applications made on or after 1 August 2021)
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Statutory
  national requirements'. Listed as a statutory national requirement; the rule is the national one (DMPO
  article 9A).
review-status: unverified
field-status: {}
