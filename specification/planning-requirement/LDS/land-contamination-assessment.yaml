reference: land-contamination-assessment
local-authority: LDS
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: A vulnerable use, including a single house in a garden.
  - condition:
      field: previously-developed-land
      value: true
      description: A low-vulnerability use on brownfield land.
  - site:
      in:
      - near-landfill-site
      description: The site is within 250m of a landfill.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
must-include:
- item: A Phase 1 report
  level: must
  required-if:
    condition:
      field: sensitive-end-use
      value: true
      description: A vulnerable use.
- item: A historic map review from 1850 (single houses in gardens)
  level: must
confidence: low
notes: 'From the audit (missing_requirement): vulnerable uses need a Phase 1; single houses in gardens
  need a historic map review from 1850; low-vulnerability uses on brownfield land or within 250m of a
  landfill. The exact wording needs checking on the page.'
review-status: unverified
field-status: {}
