reference: lighting-assessment
local-authority: LDS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - any:
      - site:
          in:
          - conservation-area
          description: In a conservation area.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: External lighting is provided as part of the advertisement.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: 'Where external lighting proposed in a residential area or conservation area: ... Where external
  lighting is to be provided as part of an advertisement, details of any lighting scheme including proposed
  hours of use and an assessment of the potential for light pollution from the proposed lighting scheme
  should be provided.'
must-include:
- item: Lighting scheme including hours of use
  level: must
- item: Assessment of light pollution/trespass
  level: must
- item: Upward light output ratio (ULOR) and overall lighting levels
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: 'Advertisements: details of any shrouds and the play of the illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Lighting
  assessment (planning); Advertisement applications: External lighting''. ''Residential area'' isn''t
  defined, so that part shows as discretionary.'
review-status: unverified
field-status: {}
