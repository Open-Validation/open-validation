reference: site-plan
local-authority: LDS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - lbc
    - ldc-existing-use
    - ldc-prospective-use
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: 'The following plans and drawings are required for all householder applications: ... In most
  cases, the following plans and drawings will be required as a minimum:'
must-include:
- item: Existing and proposed block plan at a scale of 1:100 or 1:200
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: All site boundaries
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: Position, type and height of boundary treatment (walls, gates, fences etc), existing and proposed
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: Position of any building or structure on the other side of the boundaries, such as neighbours'
    houses
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: Details of any existing or proposed vehicular access, including drop kerbs, hard surfaces and
    all public rights of way crossing or adjoining the site
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Lawful development certificates: existing site survey plan / block plan at a scale of 1:50 or
    1:100, showing the direction of North, all existing buildings and structures and any vehicular/pedestrian
    access'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
- item: 'Where the application has landscaping: landscaping details on the layout plan as a minimum'
  level: must
  required-if:
    condition:
      field: landscaping-works
      value: true
      description: The application includes landscaping.
  source-text: 'All applications which have landscaping: Details on layout plan as minimum for all applications.'
- item: Bin storage area and waste collection point shown on the site layout plan
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  source-text: 'To be shown on site layout plan: bin storage area waste collection point'
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Householder
  applications / Planning applications / Listed Building consent / Certificates of Existing and Proposed
  Uses: Block plan''. Leeds calls it a ''block plan''. For planning applications the page says the plans
  are needed ''in most cases''. The bin storage and landscaping items come from the ''Waste and refuse
  collection'' and ''Landscaping'' requirements, which ask for the details on the site layout plan (''All
  developments'').'
review-status: unverified
field-status: {}
