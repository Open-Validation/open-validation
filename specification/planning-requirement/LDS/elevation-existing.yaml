reference: elevation-existing
local-authority: LDS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - lbc
    - ldc-existing-use
    - ldc-prospective-use
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: 'Existing and proposed relevant elevations at a scale of 1:50 or 1:100 showing: ... Existing
  and proposed relevant elevations which should:'
must-include:
- item: Existing elevations accurately showing the situation on site
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: At a scale of 1:50 or 1:100
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - ldc-existing-use
      - ldc-prospective-use
- item: All sides of the proposal, including any blank elevations (for example where screened by other
    buildings)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: Proposed building materials
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: 'Householder: the height of buildings'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Style, materials and finish of windows, doors and other features
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the position of the openings in each property'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Elevation
  plans - existing and proposed'. Required for householder, planning, listed building and lawful development
  certificate applications (the certificate section repeats the floor plan wording 'Relevant existing
  and proposed floor plans which should be at a scale of 1:50 or 1:100' under its elevations heading).
review-status: unverified
field-status: {}
