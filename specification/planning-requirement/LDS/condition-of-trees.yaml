reference: condition-of-trees
local-authority: LDS
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - condition:
      field: tree-condition-reasons
      value: true
      description: Felling is proposed due to disease or structural problems with the tree.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Where felling is proposed due to disease or structural problems with the tree evidence of
  the damage and disease is required including photographs, written description of the issue and where
  necessary assessment by a suitably qualified person.
must-include:
- item: Evidence of the damage and disease, including photographs
  level: must
- item: Written description of the issue
  level: must
- item: Where necessary, assessment by a suitably qualified person (Arborist Contractor/Arboricultural
    Consultant)
  level: must
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Applications
  for works to trees with a TPO: Additional evidence – Diseased trees''.'
review-status: unverified
field-status: {}
