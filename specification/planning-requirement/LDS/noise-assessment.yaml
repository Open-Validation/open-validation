reference: noise-assessment
local-authority: LDS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: plant-equipment
        value: true
        description: Plant/machinery such as wind turbines, swimming pools or air conditioning units.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise sensitive development (residential, hospitals, offices) in town and city
            centres or within or adjacent to noise such as busy roads, airports, industry or railway stations.
      - condition:
          field: noise-generating-use
          value: true
          description: Uses in classes E(c), E(d), F2(c-d) and sui generis (former A4, A5, D2) uses, or
            industry generating noise, close to residential or other noise sensitive uses.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: 'All proposals involving plant/machinery such as wind turbines, swimming pools, air conditioning
  units and so on - a noise impact assessment will be required ... Noise sensitive developments like residential,
  hospitals, offices. Use classes: E(c) - (formerly A3) sui generis (formerly A4 & A5) E(d) F2(c-d) uses
  sui generis - (formerly D2) Industry generating noise Town and City Centre locations or within or adjacent
  to noise, such as busy roads, airports, industry, railway stations. Close to residential or other noise
  sensitive uses.'
must-include:
- item: 'Householder plant/machinery: operational noise levels measured in decibels (dB), with the manufacturer''s
    specification/leaflet'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Noise attenuation measures
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Noise
  assessment (householder and planning)'.
review-status: unverified
field-status: {}
