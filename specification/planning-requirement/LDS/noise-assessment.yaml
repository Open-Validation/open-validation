reference: noise-assessment
local-authority: LDS
required-if:
  any:
  - condition:
      field: plant-equipment
      value: true
      description: The proposal involves plant or machinery such as wind turbines, swimming pools or air
        conditioning units.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use.
  - condition:
      field: noise-generating-use
      value: true
      description: Uses in classes E(c), E(d), F2, sui generis pubs and takeaways, or industry in town
        centres.
  - discretionary
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Noise assessment All proposals involving plant/machinery such as wind turbines, swimming
  pools, air conditioning units and so on - a noise impact assessment will be required detailing operational
  noise levels measured in decibels (dB) including the manufacturer's specification/leaflet.
must-include:
- item: Operational noise levels measured in decibels (dB), with the manufacturer's specification or leaflet
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: The proposal involves plant or machinery.
