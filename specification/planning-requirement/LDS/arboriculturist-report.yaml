reference: arboriculturist-report
local-authority: LDS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        description: A Tree Preservation Order exists on the site.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
        - lbc
        - pa-demo-building
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees (stem over 75mm at 1.5m height) on or near the site, including street trees,
          that could influence or be affected by the development.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: UDPR Policies GP5, N8, N23, N24, LD1; Core Strategy Objectives and Policy P10; SPG13 – Neighbourhoods
  for Living; SPG25 – Greening the Built Edge
source-text: Where a Tree Preservation Order (TPO) exists on the site, the location of all trees must
  be marked on a plan with details of the species and how they will be protected during construction.
  ... All with trees (stem over 75mm at 1.5m height) on or near the site. ... Where there are trees within
  the application site, or on land adjacent to it that could influence or be affected by the development
  (including street trees), information will be required on which trees are to be retained and on the
  means of protecting these trees during construction works.
must-include:
- item: 'Householder (TPO on site): the location of all trees on a plan, with species and how they will
    be protected during construction'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: How trees will be retained and protected during construction or demolition; this may include a
    full tree survey in accordance with British Standards
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: Which trees are to be retained and how they will be protected during construction works
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - pa-demo-building
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - pa-demo-building
- item: Survey information, tree protection plan and method statement as set out in BS 5837
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - pa-demo-building
- item: Hedges, areas of shrub vegetation and all trees within 12 metres of the development shown
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Details of hedges and areas of shrub vegetation, and all trees within 12 metres of the
    developments should be shown.
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Tree
  Preservation Order (householder); Trees (planning); Tree survey and arboricultural implications (listed
  building); Tree survey or arboricultural implications (notification for demolition)'.
review-status: unverified
field-status: {}
