reference: arboriculturist-report
local-authority: LDS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within the site, or on adjacent land, that could influence or be affected
        by the development (including street trees).
  - site:
      in:
      - tree-preservation-zone
      description: A tree on the site is protected by a TPO (householder TPO tree plan).
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Tree survey and arboricultural implications Where there are trees within the application
  site, or on land adjacent to it that could influence or be affected by the development (including street
  trees), information will be required on which trees are to be retained and on the means of protecting
  these trees during construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: The means of protecting the retained trees during construction works
  level: must
- item: A tree plan showing species and protection measures
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      description: There is a TPO on the site.
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. From the audit
  (wrong_app_type): householder applications need a TPO tree plan where a TPO is on site; listed building
  consent and prior notification of demolition also need a tree survey where relevant.'
review-status: unverified
field-status: {}
