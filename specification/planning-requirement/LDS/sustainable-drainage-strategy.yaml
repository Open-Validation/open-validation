reference: sustainable-drainage-strategy
local-authority: LDS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site area of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site area of 1 hectare or more.
    - all:
      - condition:
          field: new-build
          value: true
          description: New development.
      - site:
          in:
          - flood-risk-zone
          description: In flood zone 2 or 3.
    - discretionary
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: UDPR Policy GP5; Natural Resources and Waste Local Plan – Policies WATER 6 and 7; Leeds SPG 22
  Sustainable Drainage in Leeds
source-text: For sites of 1 ha or more in zone 1 and new development in zones 2 and 3. ... Developments
  outside of the criteria above will require a Foul and Surface Water Drainage Assessment to be provided.
must-include:
- item: 'Simple change of use or minor development (less than 250 sq m): a drainage plan showing pipe
    sizes, cover and invert levels and the outfall location, with the existing/proposed drainage connections
    and the relevant approval'
  level: must
  required-if:
    any:
    - condition:
        field: involves-change-of-use
        value: true
        description: A simple change of use.
    - condition:
        field: floorspace
        operator: <
        value: 250
        description: Minor development of less than 250 sq m.
  source-text: If the development is for a simple change of use, or minor i.e. less than 250 sq m, then
    a plan drainage plan showing pipe sizes, cover and invert levels and outfall location is required.
- item: 'Other development: a Foul and Surface Water Drainage Assessment'
  level: must
- item: 'Major applications: a separate Conceptual SuDS Design Assessment'
  level: must
  required-if:
    ref: major-development
  source-text: For all Major applications a separate Conceptual SUDS Design Assessment should be undertaken
- item: 'Full applications: the drainage design, including the proposed SuDS measures, with supporting
    calculations and investigations (not left to a planning condition)'
  level: must
  required-if:
    application-type:
      in:
      - full
  source-text: In respect to full planning applications, please note that it is now not acceptable to
    leave the details of the drainage design, including details of the proposed SuDS measures to a future
    planning condition.
- item: 'Where soakaways are proposed: permeability testing to BRE 365 or equivalent, with supporting
    calculations'
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: Soakaways are proposed.
  source-text: Where Soakaways are proposed then permeability testing to BRE 365 or equivalent must be
    undertaken and the supporting calculations provided.
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Foul
  sewerage, surface water drainage utilities assessment'. Filed under MHCLG's (retired) sustainable drainage
  strategy id. The page's own trigger ('sites of 1 ha or more in zone 1 and new development in zones 2
  and 3') is followed by a drainage plan for minor schemes and a drainage assessment for others, so the
  remainder shows as discretionary. The linked Flood Risk requirements table (https://www.leeds.gov.uk/sites/default/files/files-imported/341736a87955719f4a68ea1e04b211698011f40b943e4b243d187bf13dab2827.pdf,
  June 2022) lists in detail what each application stage must contain; the last three items come from
  it.
review-status: unverified
field-status: {}
