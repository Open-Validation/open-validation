reference: heritage-statement
local-authority: LDS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The proposal affects a heritage asset or its setting.
  - all:
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Heritage statement The scope and degree of detail necessary in a Heritage Statement will
  vary according to the particular circumstances of each application.
confidence: medium
notes: 'Audit (wrong_trigger): from the audit, it applies to proposals affecting a heritage asset or its
  setting, demolition in conservation areas and LBC applications. For LBC the page also asks for a conservation
  area impact assessment where the site is within or adjacent to a conservation area.'
review-status: unverified
field-status: {}
