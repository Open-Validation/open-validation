reference: heritage-statement
local-authority: LDS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - locally-listed-building
          - scheduled-monument
          - park-and-garden
          - battlefield
          - world-heritage-site
          description: Likely to affect a heritage asset or its setting.
      - all:
        - condition:
            field: demolition
            value: true
            description: Demolition.
        - site:
            in:
            - conservation-area
            description: In a Conservation Area.
  - application-type:
      in:
      - lbc
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: Where a proposal is likely to affect a heritage asset or impact upon its setting. Demolition
  in Conservation Areas. In addition for listed building applications.
must-include:
- item: A schedule of works to the listed building(s)
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: An analysis of the significance of archaeology, history and character of the building/structure
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The impact of the works on the special character of the listed building or structure, its setting
    and the setting of adjacent listed buildings
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The principles of and justification for the proposed works
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Plans clearly showing all existing structures and features to be demolished or removed
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Within or adjacent to a conservation area: an assessment of the impact of the development on
    the character and appearance of the area'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - conservation-area
        description: Within or adjacent to a conservation area.
  source-text: For applications within or adjacent to a conservation area, an assessment of the impact
    of the development on the character and appearance of the area may be required.
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Heritage
  statement (planning); Listed Building consent: Heritage statement''. The listed building section says
  the scope ''will vary according to the particular circumstances of each application''. It also says
  a structural survey ''may be required'' and a condition survey ''will be required'' where historic fabric
  is replaced (see the unmapped list).'
review-status: unverified
field-status: {}
