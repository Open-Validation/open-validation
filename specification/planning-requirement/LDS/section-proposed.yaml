reference: section-proposed
local-authority: LDS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: 'Existing and proposed sections, finished floor and site levels at a scale of 1:50 or 1:100
  showing: ... Existing and proposed sections, finished floor and site levels which should:'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Cross section(s) through the proposed building(s)
  level: must
- item: Both existing and finished levels where ground levels change
  level: must
- item: How the proposal relates to existing ground levels on sloping sites or where ground levels outside
    it would be modified
  level: must
- item: 'Planning applications: details of foundations and eaves, including their relationship to the
    site boundary'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: 'Planning applications: how proposed buildings relate to existing site levels and neighbouring
    development'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: 'Planning applications: existing site levels and finished floor levels, related to a fixed datum
    point off site'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Sections
  and levels - existing and proposed'. Required for householder and planning applications.
