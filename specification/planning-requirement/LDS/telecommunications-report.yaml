reference: telecommunications-report
local-authority: LDS
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: The Town and Country Planning (General Permitted Development) (England) Order 2015 Schedule 2,
  Part 16, Class A
source-text: 'In addition, you must give evidence that the developer has given notice: ... Information
  shown within Appendix E of the Code of Best Practice on Mobile Network Development in England should
  also be provided (see references).'
must-include:
- item: Evidence that the developer has given notice to any owner of the land or tenant of an agricultural
    holding on it
  level: must
- item: Notification if a mast is to be installed within 3 km of the perimeter of an aerodrome
  level: must
  required-if:
    condition:
      field: near-aerodrome
      value: true
      description: A mast within 3 km of the perimeter of an aerodrome.
- item: The information in Appendix E of the Code of Best Practice on Mobile Network Development in England
  level: should
- item: Acoustic report where relevant
  level: should
  required-if: discretionary
  source-text: Acoustic report where relevant.
- item: Written description of the proposed development and of the materials to be used
  level: must
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Notification
  for Telecom Code Operators'. The acoustic report is asked for 'where relevant', so discretionary.
review-status: unverified
field-status: {}
