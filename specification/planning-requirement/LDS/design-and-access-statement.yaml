reference: design-and-access-statement
local-authority: LDS
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Design and Access Statement (for some planning applications)
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Statutory
  national requirements'. The page lists it as a statutory national requirement 'for some planning applications'
  and refers to GOV.UK; the rule is the national one (DMPO article 9). Leeds adds that photographs for
  listed building consent 'can form part of the design and access statement'.
review-status: unverified
field-status: {}
