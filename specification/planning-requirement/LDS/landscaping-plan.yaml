reference: landscaping-plan
local-authority: LDS
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: landscaping-works
        value: true
        description: The application has landscaping.
  - all:
    - application-type:
        in:
        - pa-demo-building
    - condition:
        field: landscaping-works
        value: true
        description: Landscaping is proposed.
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: UDPR Policies; Core Strategy; Neighbourhoods for Living; Greening the Built Edge
source-text: 'Major applications: Landscaping plan at a scale of 1:200 including: ... If landscaping is
  proposed a landscaping plan should be provided at scale of 1:200 including:'
must-include:
- item: At a scale of 1:200
  level: must
- item: Existing planting and all trees/shrubs to be removed
  level: must
- item: Size, species, density and position of all shrubs and trees
  level: must
- item: Existing and proposed boundary treatments, hard standing/parking
  level: must
- item: Any levels to be altered
  level: must
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Landscaping
  (planning); Notification for Demolition: Landscaping details''. For other applications with landscaping,
  details on the layout plan are enough (see the site plan).'
review-status: unverified
field-status: {}
