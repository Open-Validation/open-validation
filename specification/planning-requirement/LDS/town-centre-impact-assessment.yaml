reference: town-centre-impact-assessment
local-authority: LDS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Not in a defined centre and not in accordance with an up to date development plan.
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail development over 2,500 sq m.
    - all:
      - condition:
          field: entertainment-leisure-use
          value: true
          description: Leisure development.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 2500
          description: Over 2,500 sq m.
    - discretionary
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
policy: Core Strategy Policies P4, P8
source-text: Retail and leisure developments over 2,500 sq m not in a defined centre and not in accordance
  with an up to date development plan Retail and leisure developments under 2,500 sq m not in a defined
  centre and not in accordance with an up to date development plan that would be likely to have a significant
  impact on other centres
confidence: medium
notes: From the council's list (published as a web page, last modified 9 September 2026), section 'Town
  centres uses – impact assessment'. Smaller schemes 'likely to have a significant impact on other centres',
  and main town centre uses in an existing centre that could affect other centres, show as discretionary.
  The separate sequential test statement is in the unmapped list.
review-status: unverified
field-status: {}
