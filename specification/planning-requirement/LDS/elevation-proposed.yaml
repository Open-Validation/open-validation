reference: elevation-proposed
local-authority: LDS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - lbc
    - ldc-existing-use
    - ldc-prospective-use
    - advertising
source-url: https://www.leeds.gov.uk/planning/planning-permission/find-out-if-you-need-planning-permission/apply-for-planning-permission/validation-requirements
source-text: 'Existing and proposed relevant elevations at a scale of 1:50 or 1:100 showing: ... Existing
  and proposed relevant elevations which should: ... Advertisement drawings should be at a scale of 1:50
  or 1:100 and show:'
must-include:
- item: Proposed elevations clearly showing the proposed works
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: At a scale of 1:50 or 1:100
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - ldc-existing-use
      - ldc-prospective-use
- item: All sides of the proposal, including any blank elevations (for example where screened by other
    buildings)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: Proposed building materials
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: 'Householder: the height of buildings'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Style, materials and finish of windows, doors and other features
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the position of the openings in each property'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - lbc
- item: 'Advertisements: drawings at a scale of 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: size, siting, materials and colours, and how the advertisement is fixed'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: height above the ground and extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: method and colour(s) of illumination'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
- item: 'Advertisements: a cross section through all signs, including any supporting structures or walls'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (published as a web page, last modified 9 September 2026), section ''Elevation
  plans - existing and proposed; Advertisement applications: Advertisement drawing''. The advertisement
  drawing is filed here, as Crawley''s example does.'
review-status: unverified
field-status: {}
