reference: daylight-sunlight-assessment
local-authority: HRY
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: The major development is new build.
  - condition:
      field: building-height
      operator: '>='
      value: 18
      description: A tall building (18m or more).
  - condition:
      field: storey-count
      operator: '>='
      value: 6
      description: A tall building (6 storeys or more).
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
source-text: All major new build applications and tall buildings as defined under the tall buildings statement
  requirement
confidence: medium
notes: 'From the audit (missing_requirement): sunlight/daylight assessment for major new build and tall
  buildings; tall buildings are defined as 6 storeys or 18m. The council''s words were found in the workbook''s
  tall buildings row.'
