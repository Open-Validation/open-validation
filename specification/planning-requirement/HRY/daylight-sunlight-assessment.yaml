reference: daylight-sunlight-assessment
local-authority: HRY
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: Major new build.
  - any:
    - condition:
        field: storey-count
        operator: '>='
        value: 6
        description: 6 storeys or more.
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more, measured from ground to the floor level of the uppermost storey.
  - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: Local Plan
source-text: All major new build applications and tall buildings as defined under the tall buildings statement
  requirement Major development proposals are likely to have a detrimental effect on habitable rooms of
  ... amenity space in neighbouring dwellings, workspaces and public open space.
must-include:
- item: Follows the BRE guide 'Site Layout Planning for Daylight and Sunlight' (2022)
  level: must
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 28-29. Tall buildings
  are those of 6 storeys or 18 metres (to the floor of the uppermost storey) and over, those above the
  Mayor of London referral thresholds, or those the council thinks will have a significant impact on the
  skyline; the last two are judgements, so discretionary.
review-status: unverified
field-status: {}
