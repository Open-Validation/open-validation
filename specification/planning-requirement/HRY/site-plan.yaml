reference: site-plan
local-authority: HRY
required-if:
  always: true
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; London Plan;
  Local Plan (DMDPD)
source-text: 'Site plan - direction of North, proposed development in relation to the site boundaries
  with written dimensions (and public rights of way, trees, hard surfacing and boundary treatment where
  relevant) typically 1:500 or 1:200 ... Block Plan: drawn to at least 1:500 scale showing properties
  either side and to rear of site with North point.'
must-include:
- item: Drawn to at least 1:500 (typically 1:500 or 1:200) with a North point
  level: must
- item: The proposed development in relation to the site boundaries, with written dimensions
  level: must
- item: Properties on either side and to the rear of the site
  level: must
- item: Public rights of way, trees, hard surfacing and boundary treatment, where relevant
  level: must
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 2, 5. National site
  plan (page 2) plus the local Block Plan requirement for all applications (page 5).
