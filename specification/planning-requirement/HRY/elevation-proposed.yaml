reference: elevation-proposed
local-authority: HRY
required-if:
  always: true
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan; Local Plan (DMDPD)
source-text: All applications
must-include:
- item: Drawn to 1:100 or 1:50
  level: must
- item: Principal street elevations showing the two neighbouring properties on each side or 10 m (whichever
    is less); other elevations showing the immediate neighbouring property or 5 m (whichever is less)
  level: must
- item: Any rooftop plant
  level: must
- item: At least one significant dimension
  level: must
- item: 'Outline applications: plans showing the upper and lower limits of height, width and length of
    each building'
  level: must
  required-if:
    application-type:
      in:
      - outline
      - outline-some
      - outline-all
confidence: medium
notes: 'From the council''s list (August 2024, in effect from 29 August 2024), page 5. The ''Existing
  and proposed plans'' requirement is for all applications; a full set of existing drawings must be provided.
  Outline item: page 6.'
review-status: unverified
field-status: {}
