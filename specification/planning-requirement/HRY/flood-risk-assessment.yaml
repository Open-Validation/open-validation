reference: flood-risk-assessment
local-authority: HRY
required-if:
  any:
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Proposals of 1 hectare or greater (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Proposals of 1 hectare or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development (including minor development and change of use) in Flood Zones 2 and
        3.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 area with critical drainage problems notified by the Environment Agency;
        or major development or new residential units in a Critical Drainage Area.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Development or a change of use to a more vulnerable class.
    - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan; Local Plan; NPPF and technical guidance on flood risk
source-text: Proposals of 1 hectare or greater in Flood Zone 1; all proposals for new development (including
  minor development and change of use) in Flood Zones 2 and 3, or in an area within Flood Zone 1 which
  has critical drainage problems (as notified to the local planning authority by the Environment Agency);
  Where proposed development or a change of use to a more vulnerable class may be subject to other sources
  of flooding. ... All Major Development and any new residential units within a Critical Drainage Areas
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 12-13. Whether development
  'may be subject to other sources of flooding' is a judgement, so discretionary. The list gives no contents.
  'All Major Development and any new residential units within a Critical Drainage Areas' is read as both
  being within a Critical Drainage Area.
review-status: unverified
field-status: {}
