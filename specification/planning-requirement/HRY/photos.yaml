reference: photos
local-authority: HRY
required-if:
  always: true
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: Local Plan (DMDPD) Policy DM1; London Plan; Haringey Local Plan
source-text: Site photographs with signed statement confirming they have been taken within 21 days of
  the application submission ... Development affecting a conservation area or a listed building Proposals
  which will have a significant effect on the existing streetscene Prior approvals for telecomms application
  (at the applicant's discretion)
must-include:
- item: A signed statement confirming the photographs were taken within 21 days of the application submission
  level: must
- item: Photomontages for development affecting a conservation area or listed building, or with a significant
    effect on the existing streetscene
  level: must
  required-if:
    any:
    - site:
        in:
        - conservation-area
        - listed-building
        description: Affects a conservation area or a listed building.
    - discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 6, 38. Site photographs
  are required for all applications (page 6). Photos/photomontages (page 38) are listed for development
  affecting a conservation area or listed building and proposals with a significant effect on the streetscene
  (a judgement, so discretionary), and at the applicant's discretion for telecoms prior approvals.
review-status: unverified
