reference: fire-statement
local-authority: HRY
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: Exceeds 18 m in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Contains two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Contains educational accommodation.
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan (the list cites Policy D11); Building a safer future (Gateway One)
source-text: 'All major applications ... The provision of a relevant building Development of an existing
  relevant building Development within ... the curtilage of a relevant building Relevant buildings: Contain
  two or more dwellings or educational accommodation and exceed 18m or more in height, or 7 or more storeys
  whichever is reached first'
must-include:
- item: 'Major applications: an independent fire strategy produced by a third-party suitably qualified
    assessor'
  level: must
  required-if:
    ref: major-development
- item: 'Relevant buildings: the Gateway 1 Fire Statement form'
  level: must
  required-if:
    any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 7-8. Combines the independent
  fire strategy (majors) and the Gateway 1 Fire Statement Form.
review-status: unverified
field-status: {}
