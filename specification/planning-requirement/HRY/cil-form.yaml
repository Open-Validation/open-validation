reference: cil-form
local-authority: HRY
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: Adds more than 100 sq m (GIA) of new development.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Proposes 1 or more new dwellings (even under 100 sq m).
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: CIL Regulations; London Plan; Local Plan
source-text: All developments adding more than 100 sqm (GIA) of new development and/or proposing 1 or
  more new dwelling(s) (even if the floorspace of the new dwelling is under 100sqm)
must-include:
- item: The 'determining whether a development is CIL liable' form
  level: must
- item: A plan or drawing showing any chargeable development and the gross internal area in square metres
    on each plan
  level: must
- item: All floorspace measurements as Gross Internal Area (GIA)
  level: must
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 3, 6.
review-status: unverified
field-status: {}
