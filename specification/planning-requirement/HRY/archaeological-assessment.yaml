reference: archaeological-assessment
local-authority: HRY
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: Within or adjacent to an Area of Archaeological Potential / Archaeological Priority
        Area.
  - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: NPPF; London Plan; Local Plan
source-text: All applications that may have an impact on archaeology within or adjacent to Areas of Archaeological
  Potential/ Archaeological ... Priority Areas (consult with GLAAS)
must-include:
- item: An appropriate desk-based assessment where the site includes or may include heritage assets with
    archaeological interest
  level: should
- item: A field evaluation, where necessary
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 15-16. Whether an application
  'may have an impact on archaeology' is a judgement, so discretionary.
review-status: unverified
field-status: {}
