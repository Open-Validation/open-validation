source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan; Haringey Local Plan Policies DM31, DM32 and DM36
source-text: Proposal including > 1000 sqm Retail (A1) or Business (B1). ... > 2000 sqm Non-food retail
  (A1), Hospital (D1), School, higher and further education (D1), Cinema (D2), Other Assembly and Leisure
  (D2). > 2500 sqm Industrial (B2), Warehousing (B8) Hotel (C1). Any proposals which are likely to have
  a significant transport impact including all new places of workship Any proposal ... Where a development
  is located in a sensitive area (Areas where redevelopment proposals could impact on the SRN or TLRN,
  bus ... standing/garages/interchan ges, operational railway lines and/or London Underground tunnels,
  in line with London Plan policies to smooth traffic flow and safeguard land for transport).
must-include:
- item: 'For strategic applications: confirmation that TfL have been consulted and agree the methodology'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 23-25. Transport Assessment
  / Transport Statement. 'Significant transport impact' and the 'sensitive area' test have no field, so
  they are discretionary.
