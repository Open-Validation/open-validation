reference: noise-assessment
local-authority: HRY
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: A noise-generating use in close proximity to housing.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Housing adjacent to major roads, railway lines or industrial activity.
  - condition:
      field: plant-equipment
      value: true
      description: Commercial extraction flues will be introduced.
  - condition:
      field: food-or-drink-use
      value: true
      description: A change of use to Use Classes A3, A4 or A5.
  - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: NPPF; London Plan; Local Plan
source-text: When proposal will result in a change to the qualitative or quantitative acoustic environment
  brought about by the development and/or where a noise generating use is to ... be located in close proximity
  to housing or housing is to be located adjacent to major roads, railway lines and industrial activity
  - please seek advice from EHO ... All applications where commercial extraction flues will be introduced
  and all application involving a change of use to Use Classes A3, A4 or AS ... Acoustic report to be
  included
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 15, 26-27. Combines
  the noise impact assessment (pages 26-27) with the acoustic report that must go with ventilation/extraction
  details (page 15; the details themselves have no matching id, see the unmapped list). A change to the
  acoustic environment is a judgement, so discretionary.
review-status: unverified
