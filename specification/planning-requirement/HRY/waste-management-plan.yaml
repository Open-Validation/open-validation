reference: waste-management-plan
local-authority: HRY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates one or more new residential units, including by change of use or conversion.
  - all:
    - condition:
        field: new-build
        value: true
        description: A new building.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1
        description: A new commercial building.
  - ref: major-development
  - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: Haringey Local Plan SP6 (Waste and Recycling) and DM4 (Provision and design of waste management
  facilities); London Plan
source-text: All applications that involve the creation of any new residential units, including changes
  of use and conversions. Any new commercial building ... All major applications and applications for
  larger HMOs
must-include:
- item: 'Bin storage details: plans showing the location and elevational detail of the storage'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates one or more new residential units, including by change of use or conversion.
    - condition:
        field: new-build
        value: true
        description: A new commercial building.
- item: 'Major and larger HMO applications: volume and types of demolition and construction waste, and
    how waste will be minimised and managed during construction and occupation'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 8, 36. Combines 'Bin
  storage details' (page 8) and 'Waste Management Plan' (page 36). Waste space requirements are in Appendix
  A3 of the Sustainable Design and Construction SPD. 'Larger HMOs' is not defined, so that part is discretionary.
review-status: unverified
field-status: {}
