policy: Local Plan
source-text: planning applications for ... telecommunications applications
must-include:
- item: ICNIRP certificate
  level: must
- item: Area of search
  level: must
- item: Technical information including frequency, modulation characteristics, power output and antenna
    height
  level: must
- item: 'Technical justification: the purpose of the site and why the development is needed'
  level: must
- item: Alternative sites rejected (including existing masts, structures and buildings in the search area)
    with reasons, or an explanation if none were considered
  level: must
- item: Visual impact assessment and acoustic report, where relevant
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 38-39. 'Telecommunications
  application Supporting planning statement and ICNIRP certificate'.
