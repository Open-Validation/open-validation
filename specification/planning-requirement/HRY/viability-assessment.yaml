reference: viability-assessment
local-authority: HRY
required-if:
  all:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Proposes less than the London Plan affordable housing threshold (35%, or 50% on industrial
        or publicly owned land).
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: More than 10 residential units.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: More than 1,000 sq m of floorspace.
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan; Local Plan
source-text: Any application for more than 10 residential units, or providing more than 1000 sqm of floorspace,
  which is for less than the relevant affordable housing threshold set out in the London Plan (35% or
  50% on Industrial or Publicly owned land
must-include:
- item: A redacted copy excluding commercially sensitive information, for publication when the application
    is submitted, with reasons for any redaction
  level: must
- item: Undertaken using a standard, accepted methodology
  level: should
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 31. The full viability
  assessment is published by default once the affordable housing level is agreed.
review-status: unverified
field-status: {}
