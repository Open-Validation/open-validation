reference: biodiversity-survey-report
local-authority: HRY
required-if:
  any:
  - site:
      in:
      - local-wildlife-site
      description: A site designated for its biodiversity value (SINC, Local Nature Reserve, Ecological
        Corridor), or adjacent to one.
  - condition:
      field: protected-species
      value: true
      description: Protected species known or reasonably likely to be present or affected.
  - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: NPPF; London Plan; Local Plan; Wildlife and Countryside Act 1981 (as amended); Regulation 61 of
  the Habitats Regulations 2010 (as amended)
source-text: 'Any site designated for its biodiversity value (such as: Sites of Importance for Nature
  Conservation (SINGS), Local Nature Reserves, Ecological Corridors)or where significant wildlife interest
  or protected species is known to be present or is reasonable ... likely to be present or affected (such
  as those adjacent to a site designated for biodiversity value.).'
must-include:
- item: Preliminary Ecological Appraisal and Ecological Impact Assessment, setting out biodiversity enhancement
    measures
  level: must
- item: Survey, assessment and mitigation report by a suitably qualified professional
  level: must
- item: How habitats and protected species will be safeguarded during site preparation and construction,
    and maintained in future
  level: should
- item: Information supporting any mitigation or compensation measures for protected habitats and species
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Mitigation or compensation proposed.
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 16-17. 'Significant
  wildlife interest' is a judgement, so discretionary.
review-status: unverified
field-status: {}
