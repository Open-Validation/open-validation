reference: design-and-access-statement
local-authority: HRY
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Any part of the development is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provides one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Provides a building or buildings creating 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Planning (Listed Buildings and Conservation Areas) Regulations 1990; Local Plan (DMDPD) Policy DM1
source-text: Major developments ( those which involve the creation of 1O or more residential units; residential
  development of on a site of 0.5 hectares or more; development on a site of at least 1 hectare; or the
  provision of a building or buildings where the floor space to be created by the development is 1,000
  square metres or more;). • Proposals where any part of the development is in a Conservation Area and
  consists of­ o the provision of one or more dwellinghouses; or o the provision of a building or buildings
  where the floor space created by the development is 100 square metres or more. ... Design and Access
  statements are also required with all applications f or Listed Building Consent.
must-include:
- item: 'A Design Charter Response: a brief description of the response to Policy DM1 requirements'
  level: must
  source-text: All proposals requiring a Design and Access Statement
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 2-3, 7. The Design Charter
  Response (page 7) goes in the Design and Access Statement. The accessibility statement (Part M4(2)),
  also 'to be included in a Design and Access Statement', is needed for every application creating new
  residential units, so it is listed separately (no matching id; see the unmapped list).
review-status: unverified
field-status: {}
