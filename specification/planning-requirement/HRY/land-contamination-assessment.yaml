reference: land-contamination-assessment
local-authority: HRY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - site:
      in:
      - contaminated-land
      description: Known or suspected to be affected by land contamination (e.g. landfill, railway land,
        waste disposal sites, scrapyards, petrol stations, other industrial uses).
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan; Local Plan
source-text: All applications excluding householder ... Sites known or suspected to be affected by land
  contamination such as a landfill site, railway land, waste disposal site.scrapyards, petrol stations
  and other industrial uses.
must-include:
- item: A desk top study of all previous and existing uses of the site and adjacent land, assessing potential
    contamination and risks to local receptors
  level: must
- item: 'Where land uses have caused soil and/or groundwater contamination: a site investigation reported
    as a quantitative risk assessment'
  level: must
  required-if: discretionary
- item: 'Where there is a significant possibility of significant harm: a remediation strategy'
  level: must
  required-if: discretionary
- item: Investigations carried out to established procedures (such as BS 10175)
  level: should
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 34-35. The council asks
  for these steps 'according to the individual site circumstances', so the later steps are discretionary.
review-status: unverified
field-status: {}
