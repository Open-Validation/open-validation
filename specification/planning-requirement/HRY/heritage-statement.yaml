reference: heritage-statement
local-authority: HRY
required-if:
  any:
  - site:
      in:
      - listed-building
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: Affects a statutorily or locally listed building, Scheduled Ancient Monument or Registered
        Park and Garden.
  - all:
    - site:
        in:
        - conservation-area
        description: Affects a conservation area.
    - any:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
          - change-of-use
          - s73
          - lbc
          - advertising
          - demolition-con-area
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Householder development creating 100 sq m or more of floorspace.
  - discretionary
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: NPPF; sections 66 and 72 of the Planning (Listed Buildings and Conservation Areas) Act 1990; London
  Plan; Local Plan
source-text: For all development affecting all heritage assets (conservation areas, statutorily or locally
  listed buildings, Scheduled Ancient Monuments, Registered Parks and Gardens and any other designations)
  Excluding Householder applications in Conservation Areas where the floor space created by the development
  is less than 100 square metres
must-include:
- item: The significance of any heritage asset affected, including any contribution made by its setting
  level: should
- item: The relevant historic environment record consulted, as a minimum, and assets assessed with appropriate
    expertise where necessary
  level: should
- item: An assessment of the impact on the affected assets and their setting
  level: should
- item: A clear and convincing justification where the works would lead to harm or loss of significance
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 10-11. 'Any other designations'
  is open-ended, so discretionary. The list says statements 'should' contain these items.
review-status: unverified
field-status: {}
