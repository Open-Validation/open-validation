reference: heritage-statement
local-authority: HRY
required-if:
  site:
    in:
    - conservation-area
    - listed-building
    - listed-building-setting
    - locally-listed-building
    - scheduled-monument
    - park-and-garden
    description: Development affecting heritage assets (conservation areas, statutorily or locally listed
      buildings, Scheduled Ancient Monuments, Registered Parks and Gardens and other designations).
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
source-text: Heritage statement For all development affecting all heritage assets (conservation areas,
  statutorily or locally listed buildings, Scheduled Ancient Monuments, Registered Parks and Gardens and
  any other designations) All National Planning Policy Framework (NPPF) Statements should describe the
  significance of any heritage asset affected, including any contribution made by their setting.
must-include:
- item: The significance of any heritage asset affected, including any contribution made by its setting
  level: must
confidence: medium
notes: 'The source excludes ''Householder applications in Conservation Areas''; that exclusion can''t
  be written as a rule here. From the audit: householder works affecting listed or locally listed buildings
  do need one.'
