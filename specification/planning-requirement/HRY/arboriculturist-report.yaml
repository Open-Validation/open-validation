reference: arboriculturist-report
local-authority: HRY
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Proposes tree works.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Semi-mature or mature trees within the site or on adjacent sites, including street
        trees.
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: Local Plan
source-text: 'Any development proposing tree works: including applications to alter trees with a TPO or
  works to trees in a conservation area Any development where there are semi-mature or ... mature trees
  within the application site or on adjacent sites including street trees.'
must-include:
- item: A plan identifying the tree(s), boundaries and surrounding properties, with distances to other
    relevant features and, where necessary, ownership of trees straddling boundaries
  level: should
- item: The work for which consent is sought and the reasons, covering the health and condition of the
    tree(s) and any other justification
  level: should
- item: Technical supporting evidence from a qualified arboriculturalist
  level: should
- item: Where subsidence or other structural damage is alleged, a report by a qualified structural engineer
    or chartered surveyor
  level: should
  required-if: discretionary
- item: A statement and planting plan for any replacement trees, identifying species
  level: should
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 13-14. Called an Arboricultural
  Impact Assessment and Method Statement. The list says the statement 'should' include these items.
review-status: unverified
field-status: {}
