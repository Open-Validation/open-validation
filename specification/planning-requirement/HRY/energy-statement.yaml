reference: energy-statement
local-authority: HRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates one or more new residential units, including by change of use or conversion.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1
      description: Minor development creating new commercial units.
source-url: https://www.haringey.gov.uk/sites/default/files/2024-09/planning_local_validation_list.pdf
policy: London Plan Policies SI 2 and SI 3; Local Plan Policy SP4
source-text: All majors developments and minor developments creating new residential and/or commercial
  units
must-include:
- item: Plans annotated with the location of air/ground source heat pumps, mechanical ventilation, solar
    PV arrays and living roofs, where relevant
  level: must
- item: A 100% reduction in carbon emissions below Building Regulations Part L following the Energy Hierarchy,
    with summary tables for Be Lean, Be Clean and Be Green
  level: must
- item: SAP/BRUKL worksheets evidencing the reduction (baseline, Be Lean and Be Green scenarios)
  level: must
- item: Fabric efficiencies, space heating/cooling and hot water strategy, and renewable energy technology
    (location, capacity and efficiency)
  level: must
- item: How overheating risk is reduced following the cooling hierarchy
  level: must
- item: 'Majors: fabric energy efficiency improvement and space heating demand, the latest GLA Carbon
    Emissions Reporting Spreadsheet, and the carbon offset contribution if 100% on site cannot be met'
  level: must
  required-if:
    ref: major-development
- item: 'Where 100% reduction is not shown: a Unilateral Undertaking agreeing carbon offset payments and
    to pay the council''s legal checking fees'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2024, in effect from 29 August 2024), page 18-21. The Unilateral
  Undertaking item depends on whether the statement shows a 100% reduction, so it is shown as discretionary.
  The GLA 'Be Seen' reporting (page 22) and overheating assessment (page 22) have no matching id (see
  the unmapped list).
review-status: unverified
field-status: {}
