reference: sustainable-drainage-strategy
local-authority: WFT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - change-of-use
  - any:
    - condition:
        field: new-build
        value: true
        description: Includes buildings.
    - condition:
        field: hard-surfacing
        value: true
        description: Non-permeable hard surfacing.
    - condition:
        field: footprint-increase
        value: true
        description: Extensions that increase the area of impermeable surface.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All development proposals including buildings, non- permeable hard surfacing, or extensions
  that increase the area of impermeable surface
must-include:
- item: A drainage strategy aligned with the London Plan Drainage Hierarchy, using SuDS to manage runoff
    on site
  level: must
- item: 'Major: runoff limited to greenfield rates, with the attenuation volume shown'
  level: must
  required-if:
    ref: major-development
- item: Safe management of exceedance flows within the site, and adherence to DEFRA standards and CIRIA
    C753
  level: must
- item: A drainage plan showing levels and the extent of permeable and impermeable surfaces
  level: must
- item: Section drawings and specifications for all SuDS components
  level: must
- item: A completed LBWF SuDS Proforma (major) or Minor SuDS Proforma (minor)
  level: must
- item: 'A Management and Maintenance Plan: responsible party, schedule of inspections (including within
    48 hours of a storm event) and a monitoring and performance review process'
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 44. Called
  a Surface Water Drainage Assessment. Uses the retired MHCLG id sustainable-drainage-strategy. Also in
  the householder checklist (page 13).
review-status: unverified
field-status: {}
