reference: viability-assessment
local-authority: WFT
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Includes residential units.
  - all:
    - ref: major-development
    - discretionary
  - condition:
      field: dwelling-loss
      value: true
      description: Proposes a reduction in existing housing numbers on the site.
  - condition:
      field: loss-of-use
      value: true
      description: Proposes the loss of a public house (including a change of use).
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a heritage asset.
    - site:
        in:
        - conservation-area
        - listed-building
        - locally-listed-building
        description: A designated or undesignated heritage asset.
  - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All major developments that include residential units Any other major development where the
  deliverability of the scheme as designed needs to be understood Any development proposing a reduction
  in existing housing numbers on the site ... Any application proposing the loss of a public house (including
  a change of use) Any application proposing the demolition of or substantial harm to a designated or
  undesignated heritage asset Any application where the viability of the existing use is relevant
must-include:
- item: Set out in writing with a scheme layout plan, TR1 (Land Registry title) and a Statement of Ownership
    with purchase price and conditions of purchase and build, linked to the Planning Obligations Statement
  level: must
- item: Assumptions on build costs, residual values, use classes, unit sizes, affordable housing percentage
    and mix, fees, development return, planning obligations and S106 schedule, CIL, grant, end users,
    cash flow, programme, yields/rents, interest rates, finance period, Existing Use Value report, Registered
    Provider heads of terms and lease terms
  level: must
- item: A solicitor's undertaking to meet the council's costs of independent review
  level: must
- item: 'Loss of housing: the cost of refurbishment to a habitable level'
  level: must
  required-if:
    condition:
      field: dwelling-loss
      value: true
      description: Reduction in housing numbers.
- item: 'Heritage asset demolition or harm: valuation, repairs survey, costed schedule of repairs, repaired
    value and marketing evidence'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      - listed-building
      - locally-listed-building
      description: A heritage asset.
- item: 'Loss of a public house: at least three years of audited accounts, efforts to preserve it, changes
    in the trading period plus one year, evidence it has been operated positively, and ancillary uses
    assessed'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Loss of a public house.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 51-53.
  Called a Viability Appraisal. 'Deliverability needs to be understood', 'substantial harm' and 'viability
  of the existing use is relevant' are judgements, so discretionary.
review-status: unverified
field-status: {}
