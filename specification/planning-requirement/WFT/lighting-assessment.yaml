reference: lighting-assessment
local-authority: WFT
required-if:
  condition:
    field: external-lighting
    value: true
    description: The proposal involves external lighting or floodlighting where the site is publicly accessible
      (e.g. commercial, education, sports or public realm) or in other listed circumstances.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: 'Lighting Assessment All development proposals involving external lighting or floodlighting,
  where the site: Is publicly accessible (e.g. commercial, education, sports, or public realm)'
must-include:
- item: A lighting layout plan showing fitting locations, optic orientation and lux levels (in Lighting
    Reality file format)
  level: must
confidence: medium
notes: The list of site circumstances is cut off in the source. The must-include item was filed under
  the workbook's 'Submission rules'.
review-status: unverified
field-status: {}
