reference: lighting-assessment
local-authority: WFT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
  - any:
    - all:
      - any:
        - condition:
            field: external-lighting
            value: true
            description: External lighting.
        - condition:
            field: floodlighting
            value: true
            description: Floodlighting.
      - any:
        - site:
            in:
            - listed-building
            - conservation-area
            - local-wildlife-site
            description: Adjacent to or near listed buildings, conservation areas or SINCs.
        - discretionary
    - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: 'All development proposals involving external lighting or floodlighting, where the site:
  • Is publicly accessible (e.g. commercial, education, sports, or public realm) • Lies adjacent to or
  near residential properties, listed buildings, conservation areas, or Sites of Importance for Nature
  Conservation (SINCs) • Includes large-scale internal lighting (e.g. glazed extensions) that may result
  in significant external illumination.'
must-include:
- item: A lighting layout plan with fitting locations, optic orientation and lux levels (Lighting Reality
    file format)
  level: must
- item: A lighting equipment schedule with mounting heights, luminaire types, wattages and cut-off angles
  level: must
- item: Mitigation measures such as hoods, baffling, dimming or shielding
  level: must
- item: How the lighting class was determined (BS 5489-1:2020)
  level: must
- item: A statement of compliance with ILP GN01 and/or CIBSE LG6, with evidence
  level: must
- item: Hours of operation and switching or control systems, and the power supply method
  level: must
- item: 'External floodlighting: a lux contour diagram of predicted light spill onto sensitive receptors'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: External floodlighting.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 32. Public
  accessibility and nearness to homes have no field, and 'significant external illumination' from internal
  lighting is a judgement, so those parts are discretionary.
review-status: unverified
field-status: {}
