reference: section-proposed
local-authority: WFT
required-if:
  any:
  - any:
    - all:
      - application-type:
          in:
          - full
          - outline
          - change-of-use
          - lbc
      - condition:
          field: building-works
          value: true
          description: Creates new floor plans or changes the floor plans of a property, including at
            roof level.
    - condition:
        field: change-in-ground-levels
        value: true
        description: Changes to ground levels, or a sloping site.
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Proposals for new and altered buildings and/or changes in ground levels ... Required for
  all applications that involve the creation of new or changes to the floor plans of a property (including
  roof level), where a proposal involves changes to ground levels or for any application on a sloping
  site. ... All Applications for Express Consent
must-include:
- item: At 1:50 or 1:100
  level: must
- item: Cross sections through the site and buildings with existing site levels and finished floor levels
    related to a fixed datum point off-site
  level: must
- item: The proposals in relation to neighbouring buildings
  level: must
- item: All floors, including the basement, loft space and roof, and any terraces
  level: must
- item: 'Major applications: plans at 1:10 showing typical window sections, entrances and balconies'
  level: must
  required-if:
    ref: major-development
- item: 'Advertisement consent: sections of all proposed adverts at 1:20 showing the building and how
    the signage would be affixed, with details of any illumination and whether it is static or moving'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Shopfronts in a conservation area or on a listed building: a section of the shopfront at 1:10'
  level: must
  required-if:
    all:
    - condition:
        field: shopfront
        value: true
        description: Alteration or installation of a shopfront.
    - site:
        in:
        - conservation-area
        - listed-building
        description: In a conservation area or on a listed building.
- item: 'Section 73 / 96a: a full update or revision of the approved sections'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: 'From the council''s list (published 26 November 2025, enforced from 1 January 2026), page 9. For
  householder development and works to individual flats the levels may be evident from floor plans and
  elevations, but sections are needed on sloping sites or where ground levels outside the extension change.
  Advert, shopfront and s73/s96a items: page 10.'
review-status: unverified
field-status: {}
