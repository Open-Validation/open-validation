reference: land-contamination-assessment
local-authority: WFT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - lbc
  - any:
    - site:
        in:
        - contaminated-land
        description: On or adjacent to potentially contaminated land.
    - condition:
        field: sensitive-end-use
        value: true
        description: A particularly sensitive use such as a nursery, school or housing likely to be used
          by families with children.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Any application on or adjacent to potentially contaminated land Any application for a particularly
  sensitive use such as a ... nursery, school or housing likely to be used by families with children.
must-include:
- item: 'A preliminary risk assessment (desk top study): site description and inspection scope, full review
    of historical land use and potential contamination, consultation with regulatory authorities, and
    an outline Conceptual Site Model'
  level: must
- item: On highly contaminated sites, a Phase 2 intrusive survey and environmental risk assessment
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: A highly contaminated site.
- item: Undertaken by a competent and qualified person
  level: must
- item: Not a Thames Water Asset Search or similar land search on its own
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 29-30.
  Also in the listed building consent checklist.
review-status: unverified
field-status: {}
