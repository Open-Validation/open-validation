reference: arboriculturist-report
local-authority: WFT
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site, or on adjacent land, that would influence or be affected by the
      development (including street trees).
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All applications where there are trees within the application site, or on land adjacent to
  trees that would influence or be affected by the development (including street trees).
must-include:
- item: Prepared by a qualified arboriculturist, in line with BS 5837
  level: must
- item: Species, spread, roots and position of existing trees, and their categorisation (A/B/C/D)
  level: must
- item: Trees to be felled and trees affected (including on adjacent sites), with protection measures
  level: must
- item: A tree survey, tree constraints plan, Arboricultural Implications Assessment and Arboricultural
    Method Statement with a Tree Protection Plan
  level: must
- item: The AIA shows tree/building relationships at the end of the project, issues during demolition
    and construction, where protection is needed (including special foundations, storage and worker facilities),
    trees retained and felled, protective fencing and ground protection, and landscaped areas to be fenced
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 49-50.
  Called a Tree Survey / Arboricultural Implications. Also in the householder and LBC checklists.
review-status: unverified
field-status: {}
