reference: sustainability-statement
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New minor residential development of 1 or more units.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: New minor non-residential development over 100 sq m.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: For all new Major development ... For all new Minor residential development of 1 or more
  units or all new Minor non- residential development greater than 100 sq.m.
must-include:
- item: Covers sustainable design and construction, energy, water, climate resilience, biodiversity, waste/materials/resources
    (embodied and whole-life carbon), transport, and pollution and air quality
  level: must
- item: 'Residential: target maximum water consumption of 105 litres/person/day plus 5 litres external
    use'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Proposes one or more new residential units.
- item: 'Non-residential over 100 sq m: commitment to BREEAM Very Good as a minimum, with a BREEAM New
    Construction (or Refurbishment and Fit-out) Pre-Assessment'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: Non-residential floorspace over 100 sq m.
- item: Details of any Home Quality Mark or Passivhaus targets and initial assessments
  level: should
- item: 'Major: non-residential areas achieve BREEAM Excellent for the water category; Whole Life Carbon
    and Circular Economy Statements provided'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 45-47.
  Requirements 57(a) (major) and 57(b) (minor).
review-status: unverified
field-status: {}
