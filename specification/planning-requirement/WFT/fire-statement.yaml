notes: 'Audit (wrong_trigger): the workbook gave only the national 18m / 7-storey Fire Statement trigger.
  The 2025 list (London Plan D12) also needs a Planning Fire Safety Strategy or Reasonable Exception Statement
  for householder and non-major development. The national Fire Statement form still applies to relevant
  buildings (18m+ or 7+ storeys with 2+ dwellings or educational accommodation). The application types
  approximate "all major, householder and non-major development".'
