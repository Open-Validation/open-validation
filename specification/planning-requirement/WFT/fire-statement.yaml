reference: fire-statement
local-authority: WFT
required-if:
  any:
  - all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: A new or existing building 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A new or existing building of 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Containing two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Containing education accommodation.
  - ref: major-development
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: London Plan Policy D12A
source-text: Development involving new or existing buildings 18 metres or more in height; or 7 or more
  storeys, or development within the curtilage of such buildings containing two or more dwellings or education
  accommodation ... All Major applications ... Householder & Non-major development (that does not create
  additional units or alter the materials on the external walls or alter the internal or external communal
  areas that support the evacuation strategy for the property and does not include a lift).
must-include:
- item: 'For buildings 18 m+ or 7+ storeys with two or more dwellings or education accommodation: a Fire
    Statement on the Secretary of State''s form (or a form to similar effect)'
  level: must
  required-if:
    any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
- item: 'Major development: an independent fire strategy produced by a suitably qualified third-party
    assessor'
  level: must
  required-if:
    ref: major-development
- item: 'Major development: how the development will function on construction (methods, products and materials,
    with manufacturers'' details), means of escape and evacuation strategy, features that reduce risk
    to life, access for fire service personnel and equipment, fire appliance access within the curtilage,
    and protection of base build fire safety measures from future modifications'
  level: must
  required-if:
    ref: major-development
- item: 'Householder and non-major development: a Planning Fire Safety Strategy, or a Reasonable Exception
    Statement if parts or all of London Plan policy D12A are not relevant'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: minor-development
        value: true
        description: Minor (non-major) development.
- item: 'Planning Fire Safety Strategy: author''s fire safety knowledge, understanding and qualifications
    shown'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: minor-development
        value: true
        description: Minor (non-major) development.
- item: 'Planning Fire Safety Strategy: unobstructed outside space for fire appliances and for an evacuation
    assembly point, fire safety features, construction that minimises fire spread, means of escape and
    evacuation strategy, and access and equipment for firefighting'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: minor-development
        value: true
        description: Minor (non-major) development.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 5, 24-26.
  Combines the national Fire Statement (page 5) with local requirement 29. The bracket in the householder/non-major
  trigger appears to describe the proposals for which a Reasonable Exception Statement may be appropriate;
  either a PFSS or a Reasonable Exception Statement must be submitted. The householder and listed building
  consent checklists also list this requirement.
review-status: unverified
field-status: {}
