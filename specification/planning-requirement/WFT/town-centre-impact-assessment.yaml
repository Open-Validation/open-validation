reference: town-centre-impact-assessment
local-authority: WFT
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: New or extended edge or out-of-centre Class A uses, entertainment or leisure development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 200
      description: Over 200 square metres gross floorspace.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Sequential Test and Impact Assessment Proposals for new, or extension to, existing edge or
  out-of-centre Class A uses, entertainment or leisure development in excess of 200 sq.m gross floorspace
  must submit a sequential test and an impact assessment
confidence: medium
notes: 'Audit (other): the trigger was in rows mislabelled ''Sequential / Exception Test (flood)''; the
  town centre rows held marketing assessment text.'
review-status: unverified
field-status: {}
