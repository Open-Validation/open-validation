reference: town-centre-impact-assessment
local-authority: WFT
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: An edge-of-centre or out-of-centre location (outside Major or District centres).
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: Retail or leisure uses of 2,500 sq m and above, including extensions and amalgamations
          creating a single unit over 2,500 sq m.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 200
        description: Class A uses, entertainment or leisure development over 200 sq m gross.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Other main town centre uses not in accordance with the development plan.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All applications for retail or leisure uses of 2500sq.m and above on the edge or outside
  of Major or District centres. This also applies to extensions and the amalgamation of existing retail
  units which would result in the creation of a single unit exceeding 2500sqm. Proposals for new, or extension
  to, existing edge or out-of-centre Class A uses, entertainment or leisure development in excess of 200
  sq.m gross floorspace must submit a sequential test and an impact assessment ... Impact assessments
  must also be provided for applications for other main town centre uses when they are in edge-of-centre
  or out-of-centre locations, and not in accordance with the development plan.
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m or more.
- item: Impact on town centre vitality and viability, including consumer choice and trade, up to five
    years ahead (ten years for major schemes whose full impact takes longer)
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m or more.
- item: Qualitative and quantitative analysis showing no adverse impact on the vitality and viability
    of all designated town centres
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 42. Combines
  requirement 51 (Retail Impact Assessment) and the impact part of requirement 52; the sequential test
  has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
