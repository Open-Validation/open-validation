reference: air-quality-assessment
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - lbc
    - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All major development, unless there is clear evidence that transport and building emissions
  will be less than the existing use; Development in areas of substandard air quality and changes of use
  which would result in the introduction of sensitive receptors to areas of poor air quality; Development
  in close proximity to ... sensitive uses; and Developments which involve significant demolition and
  construction;
must-include:
- item: An assessment of current air quality in the area
  level: must
- item: Potential pollutant sources from the development during construction and operation, the pollutants
    and the objectives they may impinge on
  level: must
- item: Predicted concentrations at suitable receptor locations, comparing with- and without-development
    scenarios for the first year of occupation
  level: must
- item: Measures to mitigate and minimise impacts, with reference to the Mayor's air quality neutral objective
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 11-12.
  Major development needs it unless there is clear evidence that emissions will be lower than the existing
  use. 'Substandard' or 'poor' air quality areas, closeness to sensitive uses and 'significant' demolition
  are not defined, so those parts are discretionary. Also in the listed building consent checklist.
review-status: unverified
field-status: {}
