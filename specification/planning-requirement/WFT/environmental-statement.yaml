reference: environmental-statement
local-authority: WFT
required-if:
  condition:
    field: eia-development
    value: true
    description: EIA development, as determined through a formal Screening Opinion.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017 (SI 2017/571)
source-text: The Town and Country Planning (Environmental Impact Assessment) Regulations (SI 2017/571),
  as amended, set out the circumstances in which an Environmental Impact Assessment (EIA) is required.
  The need for an Environmental Statement shall be determined through a formal Screening Opinion.
must-include:
- item: Content as confirmed through a formal Scoping Opinion
  level: must
- item: 'For s96a / s73 amendments to EIA development: an addendum to the Environmental Statement, by
    a suitably qualified consultant, screening the changes and assessing them against each chapter''s
    previous conclusions'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 24.
review-status: unverified
