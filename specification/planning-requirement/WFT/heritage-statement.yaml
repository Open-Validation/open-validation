reference: heritage-statement
local-authority: WFT
required-if:
  site:
    in:
    - conservation-area
    - listed-building
    - locally-listed-building
    - local-character-area
    - archaeological-priority-area
    - scheduled-monument
    description: Within or affecting a conservation area, listed building, locally listed building, area
      of special character, archaeological remains or a Scheduled Ancient Monument.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All applications within or affecting conservation areas, listed buildings, locally listed
  buildings, areas of special character, archaeological remains and Scheduled Ancient Monuments. This
  includes householder applications.
must-include:
- item: The heritage asset(s) affected, their significance and their setting (if applicable)
  level: must
- item: Research into the relevant history of the building/site, including its planning history
  level: must
- item: The proposal and its impact on the heritage asset(s), how the scheme was tailored to preserve
    them, measures to minimise harm, and a justification
  level: must
- item: How the proposal complies with statutory requirements, local plan policy, NPPF policies and other
    material considerations
  level: must
- item: 'Listed building consent for comprehensive works: a full photographic record of the building'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Comprehensive works to a listed building: a full architectural appraisal of the building''s history
    and evolution, and a schedule of works'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Comprehensive works to a listed building.
- item: 'Major works or a number of alterations to a listed building (including repairs): a full schedule
    of works with a method statement explaining the principles'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: A listed building.
- item: A clearly titled section if it forms part of the Design and Access Statement
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 28-29.
  Also in the householder, listed building consent and advertisement checklists. A desk-based archaeological
  assessment is needed where the site may include heritage assets with archaeological interest (see archaeological-assessment).
review-status: unverified
field-status: {}
