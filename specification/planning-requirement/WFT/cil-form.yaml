reference: cil-form
local-authority: WFT
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: New buildings or extensions creating 100 sq m or more of gross internal floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates one or more dwellings (even below 100 sq m).
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Community Infrastructure Levy Regulations 2010; Mayor of London CIL and LBWF CIL
source-text: Proposals including new buildings or extensions which involve the creation of 100 square
  metres or more of gross internal floorspace, or involve the creation of one or more dwellings (even
  where this is below 100 square metres) ... All applications, with the exceptions of Advertisement consent
  and Submission of details pursuant to planning permission.
must-include:
- item: The council's Planning Application Additional Information Requirement Form, fully completed
  level: must
- item: A breakdown of proposed residential and non-residential GIA floorspace and the GIA of existing
    uses to be demolished or retained
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 15. The
  second part of the wording is from the householder checklist, page 9 (https://www.walthamforest.gov.uk/sites/default/files/2025-12/Householder-%20Applications%20Checklist-V1-2025.pdf),
  which asks for the form with every householder application.
review-status: unverified
field-status: {}
