reference: application-form
local-authority: WFT
required-if:
  always: true
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Completed in full, signed and dated
  level: must
- item: A concise, clear and accurate description of the development that refers to storey heights, the
    number of units and the amount of non-residential floorspace, and the condition number for an approval
    of details
  level: must
- item: Extensions to flats made on the full planning application form, not the householder form
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: An extension to a flat.
- item: One ownership certificate (A, B, C or D) with the notices it needs; Certificate B with notice
    to the Highways Authority if the pavement in front of the site is inside the red line and not owned
    by you
  level: must
- item: Agricultural Holdings Certificate completed, even for non-agricultural applications
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 2. The
  per-type checklists give the same national requirements for every application type.
review-status: unverified
field-status: {}
