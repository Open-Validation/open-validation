reference: noise-assessment
local-authority: WFT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential or other noise-sensitive development close to existing noise sources.
    - condition:
        field: noise-generating-use
        value: true
        description: A noise-generating use that raises disturbance issues to existing buildings.
    - condition:
        field: plant-equipment
        value: true
        description: Installation of flues, air conditioning, plant, extraction etc.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Proposals for residential and other noise sensitive development close to existing sources
  of noise; noise generating uses that raise disturbance issues to existing buildings; applications involving
  installation of flues, air conditioning, plant, extraction etc.
must-include:
- item: Existing background noise/vibration level over a 24-hour period
  level: must
- item: Predicted noise levels in decibels at a specified distance
  level: must
- item: Predicted vibration levels and the means of mounting ducting, with all anti-vibration measures
  level: must
- item: Mitigation needed to meet the required levels
  level: must
- item: Undertaken by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 36. Called
  a Noise and Vibration Assessment.
review-status: unverified
field-status: {}
