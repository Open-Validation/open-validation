reference: planning-statement
local-authority: WFT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - condition:
        field: minor-development
        value: true
        description: Minor (non-major) development.
  - ref: major-development
  - condition:
      field: food-or-drink-use
      value: true
      description: A café, restaurant, drinking establishment or hot food takeaway.
  - condition:
      field: noise-generating-use
      value: true
      description: Nightclubs, places of worship, minicab offices, community facilities or other uses
        with potential for significant impacts on neighbouring residential amenity.
  - condition:
      field: loss-of-use
      value: true
      description: Change of use from retail/main town centre, business or community use, loss of a public
        house, or loss of a heritage asset.
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Minor applications for full planning permission Major developments (including applications
  for outline permission and approval of reserved matters) ... Proposals involving café or restaurant,
  club or drinking establishment, or hot food takeaway, nightclubs, places of worship, minicab offices,
  community facilities or other uses with the potential for significant impacts upon neighbouring residential
  amenity. Applications involving a change of use from retail/main town centre uses, business or community
  use; amalgamation of retail units; change of use from A4 within a Public House; and loss of a heritage
  asset Applications for variation or removal of conditions and for material and non-material amendments
must-include:
- item: 'Minor: a short description and justification against key policies, why other documents are not
    appropriate, crime prevention, energy and sustainability, pre-application consultation with neighbours,
    and a highways works plan for any works to the existing highway'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor (non-major) development.
- item: 'Major: description of the site, context and planning history; summary of relevant policies and
    how the development accords with them; consultations; other material information; justification for
    any local list information not supplied; evidence of engagement with infrastructure providers'
  level: must
  required-if:
    ref: major-development
- item: 'Uses affecting amenity: opening hours, covers, staff and customer numbers, transport, refuse
    storage and collection, activities and ancillary uses; for minicab offices, number of minicabs and
    whether drivers are remote or office based'
  level: must
  required-if:
    any:
    - condition:
        field: food-or-drink-use
        value: true
        description: Food or drink use.
    - condition:
        field: noise-generating-use
        value: true
        description: Use with amenity impacts.
- item: 'Loss of protected uses: marketing information and evidence of lack of demand, alternative employment
    and community uses considered, and information on policy exception criteria'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Change of use from a protected use.
- item: 'Variations and amendments: how the development differs from the approved scheme, policies adopted
    since, and why the alterations are needed'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 38-39.
  The council will apply proportionality to what the statement must include.
review-status: unverified
field-status: {}
