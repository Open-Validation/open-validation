reference: daylight-sunlight-assessment
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All Major Applications Proposals where there may be a potential adverse impact on current
  levels of sunlight / daylight enjoyed by adjoining properties or building(s), including associated gardens
  or amenity space. Or where new residential properties are created within a restricted setting.
must-include:
- item: Methodology of the latest BRE guide 'Site layout planning for daylight and sunlight'
  level: must
- item: Impacts on existing properties and sites with extant planning permissions
  level: must
- item: 'In restricted settings: the final daylight and sunlight values within the proposed scheme'
  level: must
  required-if: discretionary
- item: An overshadowing study with shadow diagrams at different times of day and throughout the year
  level: must
- item: Diagrams as relevant and a non-technical summary of the conclusions
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 19. Potential
  adverse impact and 'restricted setting' are judgements, so discretionary. The householder checklist
  (page 11) asks for it 'if the proposal is likely to have an adverse effect upon levels of light to adjoining
  sensitive land uses'.
review-status: unverified
field-status: {}
