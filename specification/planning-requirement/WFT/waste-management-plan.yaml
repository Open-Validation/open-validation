reference: waste-management-plan
local-authority: WFT
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: demolition
        value: true
        description: Demolition is necessary.
    - condition:
        field: earthworks
        value: true
        description: Excavation is necessary.
    - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Major developments where demolition, excavation and/or substantial site ... clearance is
  necessary
must-include:
- item: Volume and type of material to be demolished and/or excavated
  level: must
- item: Opportunities for reuse and recovery of materials, and how off-site disposal will be minimised
    and managed
  level: must
- item: Frequency and timing of collections, drag distance issues, and who will manage it and how
  level: must
- item: A tracked drawing showing LBWF waste vehicle movements
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 42-43.
  Called a Site Waste Management Plan. 'Substantial site clearance' is a judgement, so discretionary.
  Also in the listed building consent checklist.
review-status: unverified
field-status: {}
