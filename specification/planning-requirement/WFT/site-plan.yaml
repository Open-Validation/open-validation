reference: site-plan
local-authority: WFT
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - change-of-use
    - s73
    - non-material-amendment
    - lbc
    - advertising
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications (All Applications except Approval of Details)
must-include:
- item: At a scale of 1:200 or 1:500, with the direction of North
  level: must
- item: All buildings, roads and footpaths on land adjoining the site
  level: must
- item: The position of all trees on the site, and on adjacent land where affected by the proposal
  level: must
- item: Boundary treatment, including walls and fencing, where proposed
  level: must
- item: Space identified for positioning fire appliances, kept clear of obstructions and conflicting uses
  level: must
  required-if:
    ref: major-development
  source-text: Applicants must demonstrate on a site plan that space has been identified for the appropriate
    positioning of fire appliances.
- item: Appropriate evacuation assembly points
  level: must
  required-if:
    ref: major-development
  source-text: Applicants must also show on a site plan appropriate evacuation assembly points.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 3, 24-25.
  Not needed for approval of details. The householder, full/outline, listed building and advertisement
  checklists all list a Proposed Site (Block) Plan; the lawful development certificate checklist does
  not. The fire appliance and assembly point items come from the Fire Statement section (major applications).
review-status: unverified
field-status: {}
