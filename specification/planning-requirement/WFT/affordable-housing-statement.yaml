reference: affordable-housing-statement
local-authority: WFT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more new residential units.
  - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Development proposals which would provide 10 or more new residential units / proposals for
  residential development on sites with the potential to provide 10 or more residential units
must-include:
- item: The number of residential units and the number of affordable units
  level: must
- item: The mix of units, with numbers of habitable rooms and/or bedrooms or the floorspace of habitable
    areas
  level: must
- item: The tenure of units, with a clear explanation of the different levels or types of affordability
    or tenure
  level: must
- item: The location of the affordable units on a plan to scale, identifying their size and layout
  level: must
- item: Details of discussions with affordable housing providers and of any Registered Providers acting
    as partners
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 11. Called
  an Affordable Housing Appraisal. Sites with the 'potential' to provide 10 or more units is a judgement,
  so that part is discretionary.
review-status: unverified
field-status: {}
