reference: construction-management-plan
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
  - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All major applications All applications for new residential development Other Applications
  ... likely to have a significant impact on traffic congestion or pedestrian safety.
must-include:
- item: How on-site impacts will be managed during demolition/construction (particularly on homes, other
    sensitive uses and biodiversity), including traffic management, dust, noise, vibration and stability
  level: must
- item: A plan to scale identifying the site access points and where safe and legal loading can take place
  level: must
- item: How deliveries could be managed to reduce vehicle movements and use more sustainable modes, where
    possible
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 15-16.
  Called a Construction and Demolition Method Statement (or Construction and Environmental Management
  Plan). 'Significant impact on traffic congestion or pedestrian safety' is a judgement (sites in town
  centres or near bus stops are more likely to qualify), so that part is discretionary; the householder
  checklist lists only that part. The Outline Construction Logistics Plan (requirement 19) is separate
  and has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
