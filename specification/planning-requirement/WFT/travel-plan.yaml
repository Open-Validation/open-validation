reference: travel-plan
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>'
          value: 50
          description: Over 50 residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Commercial development (including retail) over 1,000 sq m.
  - condition:
      field: car-free
      value: true
      description: No parking proposed.
  - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All major planning applications Others likely to have significant transport implications
  (such as schools, nurseries and hotels) or where there is no parking or a low level of car parking proposed.
  All applications requiring the submission of a Transport Assessment.
must-include:
- item: 'Residential: a full travel plan'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Proposes one or more new residential units.
- item: 'Non-residential schemes or elements: a framework travel plan with a commitment to travel plan
    development by individual occupiers'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1
      description: Non-residential floorspace.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 49. 'Significant
  transport implications' and a 'low level' of parking are judgements, so discretionary; 'All applications
  requiring a Transport Assessment' is shown with the Transport Assessment thresholds.
review-status: unverified
field-status: {}
