reference: energy-statement
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New minor residential development of 1 or more units.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: New minor non-residential development greater than 100 square metres.
