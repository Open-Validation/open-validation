reference: energy-statement
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New minor residential development of 1 or more units.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: New minor non-residential development over 100 sq m.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: London Plan Policy SI 2; Waltham Forest Local Plan (Part 1) Policy 85 and Policy 87 B iii
source-text: All Major applications ... For all new Minor residential development of 1 or more units or
  all new Minor non- residential development greater than 100 sq.m.
must-include:
- item: Follows the GLA's Energy Assessment Guidance
  level: must
- item: Baseline energy demand and carbon dioxide emissions, with evidence of how they were calculated
  level: must
- item: A response to the 4 stages of the Mayor's Energy Hierarchy, with the estimated percentage carbon
    reduction at each stage and overall (minimum 35% on site below Part L; residential able to target
    50%)
  level: must
- item: How onsite and zero carbon targets will be achieved, including offsetting
  level: must
- item: Energy Use Intensity and space heating demand, and Target and Design Fabric Energy Efficiency
    for residential
  level: must
- item: A feasibility study of all renewable and low carbon technologies, any district heating or communal
    networks, and the proposed technical solution
  level: must
- item: Fuel costs and how they are minimised; peak demand, demand management and energy flexibility measures
  level: must
- item: Where and why the development does not meet identified standards, if applicable
  level: must
- item: A summary of the modelling output (BRUKL reports, TER/DER worksheets for dwellings)
  level: must
- item: 'Refurbishment/change of use: baseline from the notional specifications in Appendix 3 of the GLA
    guidance (or the existing specification if better), the same Use Class for baseline and proposal,
    and new-build and refurbished CO2 savings presented separately'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Refurbishment or change of use.
- item: 'Major: CIBSE dynamic overheating assessment, and the GLA overheating risk tool for residential'
  level: must
  required-if:
    ref: major-development
- item: 'Minor: how the development mitigates overheating by following the cooling hierarchy'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor (non-major) development.
- item: 'Major: evidence of engagement with infrastructure providers, cross-reference to the air quality
    assessment (Building Emissions Benchmarks), and evidence that planning-stage energy data has been
    sent to the GLA (''Be Seen'')'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 21-24.
  Requirements 27(a) (major) and 27(b) (minor). The list cites 'Policy S12 of the London Plan' (London
  Plan Policy SI 2). The Full & Outline checklist gives the minor residential threshold as 'more than
  1 unit'; the main list says '1 or more units', which is used here.
review-status: unverified
field-status: {}
