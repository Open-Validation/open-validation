  date: 2025-11-26
  date-basis: 'Title ''London Borough of Waltham Forest: Local validation requirements for planning applications
    2025''; the PDF was created on 26 November 2025 and published in December 2025 (2025-12 file path).
    The council''s ''What to include in a planning application'' page (last updated 1 October 2026) says
    the council has approved this updated checklist and will only invalidate applications that do not
    meet it after 1 January 2026; it gives no adoption date. Checked on 2026-11-06: that page links only
    this 2025 list and its V1-2025 per-type checklists (householder, full/outline, listed building consent,
    advertisement, lawful development certificate, larger home extension), so it is the latest. Page numbers
    in the requirement notes are PDF pages.'
  status: current
submission-standards:
- item: Each drawing has a title and drawing number, with the revision number as necessary
  level: must
- item: Drawings state the print (paper) size and the scale at that print size (e.g. 1:50 at A3 or 1:100
    at A3)
  level: must
- item: A scale bar of 5 metres highlighting each metre
  level: must
- item: The wording 'do not scale' must not be used
  level: must
- item: All plans at a recognisable scale (1:50, 1:100, 1:200, 1:500, 1:1250, 1:2500)
  level: must
- item: The proposed development shown in relation to the site boundaries and other existing buildings
    on the site
  level: must
- item: 'Major applications: existing and proposed plans on separate drawings (householder and minor applications
    may show both on the same drawing)'
  level: must
- item: Paper plans no larger than A3
  level: must
- item: Electronic documents as PDFs, with embedded documents of one size only (e.g. A4 or A3)
  level: must
- item: No restrictions on editing/redacting (at minimum, the document can be saved as another file name),
    so the council can comply with GDPR
  level: must
- item: Images, spreadsheets, text files and CAD files converted to PDF or Word
  level: must
- item: Individual documents and plans must not exceed 10 MB; electronic copies requested with paper applications
  level: must
- item: Neighbouring properties and neighbouring windows always shown on plans, elevations and sections
    (existing and proposed)
  level: must
- item: Existing and proposed ground levels always shown for extensions or new buildings; any demolition
    clearly hatched and shown on a separate set of drawings
  level: must
- item: Level of detail in additional plans and documents proportionate to the scale of the development
  level: must
