  notes: 'Grokbot''s link is the current Waltham Forest 2025 local list (enforced from 1 Jan 2026), but
    extraction is poor. Around 18 of the list''s 65 numbered requirements (e.g. Affordable Housing Appraisal,
    minor Energy/Sustainability Statements, Materials, Urban Greening, Tall Building Assessment, Delivery
    and Servicing Plan) have no row. Many triggers are fragments or mislabelled, and some rows come from
    the superseded 2023 list. The Epping Forest SAC HRA and householder fire-safety triggers are misstated.
    Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
