reference: archaeological-assessment
local-authority: WFT
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in a Tier 1 Archaeological Priority Area.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves groundworks.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in a Tier 2 Archaeological Priority Area.
    - ref: major-development
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All proposals involving groundworks within Tier 1 Archaeological Priority Areas, all Major
  applications in Tier 2 Archaeological Priority Areas An assessment of potential archaeological heritage
  must be provided.
confidence: medium
notes: 'Audit (wrong_trigger): this trigger was in the workbook''s Basement Impact Assessment row; the
