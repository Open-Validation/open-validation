reference: archaeological-assessment
local-authority: WFT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - lbc
    - site:
        in:
        - archaeological-priority-area
        description: A Tier 1 Archaeological Priority Area.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves groundworks.
  - all:
    - ref: major-development
    - site:
        in:
        - archaeological-priority-area
        description: A Tier 2 Archaeological Priority Area.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All proposals involving groundworks within Tier 1 Archaeological Priority Areas, all Major
  applications in Tier 2 Archaeological Priority Areas
must-include:
- item: Prepared by a qualified individual or organisation
  level: must
- item: Uses existing information to establish the archaeological significance of the site and the impact
    on surviving monuments or remains
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 12. A
  desk-based assessment. The tiers are those in the Greater London Archaeological Advisory Service's Archaeological
  Priority Areas Appraisal for Waltham Forest; the archaeological-priority-area designation does not record
  the tier.
review-status: unverified
field-status: {}
