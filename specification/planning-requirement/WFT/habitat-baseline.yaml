reference: habitat-baseline
local-authority: WFT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Minor and Major Applications (not Householders) other exclusions apply refer to Government
  Website
must-include:
- item: Drawn to an identified scale with the direction of North, showing onsite habitat on the date of
    application (or earlier proposed date), including any irreplaceable habitat
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
