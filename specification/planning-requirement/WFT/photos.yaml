reference: photos
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - conservation-area
      - listed-building
      - locally-listed-building
      - local-character-area
      - archaeological-priority-area
      - scheduled-monument
      description: Affecting a heritage asset or its setting.
  - condition:
      field: demolition
      value: true
      description: Demolition of an existing building.
  - application-type:
      in:
      - ldc
  - application-type:
      in:
      - s73
      - non-material-amendment
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the biodiversity gain condition.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: All major applications Development affecting a heritage asset or its setting; demolition
  of an existing building Certificates of lawfulness ... Any application for minor material (s.73) amendments
  or non-material (s.96a) ... All major and minor applications (unless exemption is applied for)
must-include:
- item: Photographs of the existing building(s)
  level: must
- item: 'Major: photomontage or CGI images showing the development in the street scene or from the public
    realm; CGI locations agreed with officers before submission'
  level: must
  required-if:
    ref: major-development
- item: 'Biodiversity net gain: site photos showing all existing green habitat'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the biodiversity gain condition.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 10, 14,
  38. Called Photographs and CGIs. Section 73 / 96a amendments need photographs of the site (page 10)
  and BNG applications site photos of existing green habitat (page 14). The lawful development certificate
  and advertisement checklists call photographs 'desirable'; the householder checklist (page 13) asks
  for them where the proposal involves demolition or affects a conservation area or listed building.
review-status: unverified
field-status: {}
