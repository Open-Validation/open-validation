reference: design-and-access-statement
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floorspace created is 100 square metres or more.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - conservation-area
        - listed-building
        description: Adverts in conservation areas or on listed buildings.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Design and Access Statement Major developments Listed building consent Applications for one
  or more dwellings or a building or buildings where the floorspace created is 100sq.m or more within
  a conservation area A Design and Access Statement must be proportionate to the scale of the development.
  … Design and access statements are required for adverts in conservation areas and for Listed Buildings.
confidence: medium
review-status: unverified
field-status: {}
