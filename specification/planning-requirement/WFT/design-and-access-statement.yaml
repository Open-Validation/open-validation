reference: design-and-access-statement
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 sq m or more of floorspace.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - conservation-area
        - listed-building
        description: Adverts in a conservation area or on a listed building.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Major developments Listed building consent Applications for one or more dwellings or a building
  or buildings where the floorspace created is 100sq.m or more within a conservation area ... Design and
  access statements are required for adverts in conservation areas and for Listed Buildings.
must-include:
- item: Proportionate to the scale of the development
  level: must
- item: Visual, using diagrams, sketches, plans and photographs wherever possible and appropriate
  level: should
- item: 'For outline applications with scale and/or layout reserved: the design approach and design intent
    for future reserved matters applications'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: Reference to the conservation area and any statutory listing designation
  level: must
  required-if:
    site:
      in:
      - conservation-area
      - listed-building
      description: In a conservation area or a listed building.
- item: 'For listed buildings: how the historical and architectural importance of the building, in particular
    its physical features and setting, has been considered in the design'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: A listed building.
- item: Any Heritage Statement included as a clearly titled standalone section
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 3-4. The
  advert wording comes from the Advertisement Consent checklist, page 6 (https://www.walthamforest.gov.uk/sites/default/files/2025-12/Advertisement%20Consent%20Validation%20Checklist-V1-2025.pdf).
review-status: unverified
field-status: {}
