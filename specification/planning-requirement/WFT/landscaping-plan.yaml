reference: landscaping-plan
local-authority: WFT
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor (non-major) development.
    - discretionary
  - condition:
      field: hard-surfacing
      value: true
      description: Front garden hardstanding.
  - condition:
      field: basement
      value: true
      description: A basement that extends beyond the footprint of the building.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Major developments Minor developments which contain a significant element of landscaping
  or that result in a loss of private open space Applications for front garden hardstanding and basements
  which extend beyond the footprint of a building.
must-include:
- item: Hard and soft landscaping for all parts of the site without buildings, noting features to be retained
    and any species of nature conservation interest
  level: must
- item: Plant species, sizes and planting densities, proposed tree sizes, and hard landscaping materials
  level: must
- item: Site levels, gradients and earthworks, bicycle and refuse storage areas, boundary treatments and
    SuDS, as relevant
  level: must
- item: A 5-year management plan for communal landscaping or public realm areas
  level: must
- item: Extent of mature tree canopy for proposed trees as well as size at planting
  level: should
- item: 'Hardstanding: location and area of porous paving materials, if proposed'
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: Proposes hardstanding.
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 31. A
  'significant element of landscaping' and loss of private open space are judgements, so discretionary
  for minor development. Also in the householder and listed building consent checklists.
review-status: unverified
field-status: {}
