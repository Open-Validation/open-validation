reference: bng-metric
local-authority: WFT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Minor and Major Applications (not Householders) other exclusions apply refer to Government
  Website ... All major and minor applications (unless exemption is applied for)
must-include:
- item: Completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat on the date of application (or proposed earlier date), with the publication date of the metric
    used
  level: must
- item: 'Where degradation has taken place: the completed metric showing the value before the activities'
  level: must
- item: An indicative post-development biodiversity metric calculation for onsite gains and, where possible,
    for offsite gains
  level: must
confidence: medium
notes: 'From the council''s list (published 26 November 2025, enforced from 1 January 2026), page 5-6,
  14. National requirement (page 5) plus local requirement 15. Follows the law: only development subject
  to the biodiversity gain condition needs it (householder and other exempt development is exempt). The
  local BNG statement has no matching id (see the unmapped list); its site-photo part is in photos.'
review-status: unverified
field-status: {}
