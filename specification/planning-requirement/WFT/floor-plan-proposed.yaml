reference: floor-plan-proposed
local-authority: WFT
required-if:
  any:
  - any:
    - application-type:
        in:
        - hh
    - all:
      - application-type:
          in:
          - full
          - outline
          - change-of-use
          - lbc
      - condition:
          field: building-works
          value: true
          description: The application involves building works.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
      - discretionary
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Applications that involve building works ... Applications for changes of use ... Applications
  for change of use will need to be accompanied by floor plans where it is necessary to indicate the extent
  of the use and its relationship to adjacent development, for example, where it is proposed to change
  the use of part of a floor or building.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: The proposed building including each floor and the roof
  level: must
- item: 'All floors, including floors with no changes (householder and individual flat applications: a
    statement confirming unchanged floors will remain unchanged)'
  level: must
- item: The site boundary and the outline of any existing neighbouring buildings
  level: must
- item: Cycle parking arrangements, annotated with the number of cycle stands
  level: must
- item: Internal storage and proposed refuse storage facilities
  level: must
- item: Room sizes and overall unit sizes (GIA) for new residential accommodation, including conversions
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Proposes one or more new residential units.
- item: 'Section 73 / 96a: a full update or revision of the approved plans'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 8. The
  householder checklist (page 7, https://www.walthamforest.gov.uk/sites/default/files/2025-12/Householder-%20Applications%20Checklist-V1-2025.pdf)
  lists floor and roof plans for 'All applications'. For a change of use they are needed only where necessary
  to show the extent of the use, so that part is discretionary. Proposed plans are also needed for section
  73 / 96a amendments (page 10).
review-status: unverified
field-status: {}
