reference: biodiversity-survey-report
local-authority: WFT
required-if:
  any:
  - site:
      in:
      - local-wildlife-site
      description: Within or adjacent to a Site of Importance for Nature Conservation.
  - condition:
      field: protected-species
      value: true
      description: May have impacts on protected species.
  - discretionary
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Proposals on sites within or adjacent to a Site of Importance for Nature Conservation, or
  which may have impacts on biodiversity or protected species
must-include:
- item: At minimum a Preliminary Ecological Appraisal following CIEEM technical guidance
  level: should
- item: Any further surveys the appraisal recommends carried out before submission and reported following
    CIEEM guidance (typically an Ecological Impact Assessment)
  level: must
- item: Up-to-date surveys conforming with the latest legislation
  level: must
- item: Full details of the surveyor and their qualifications or licences
  level: must
- item: 'For schemes next to SSSIs, SINCs, rivers/waterways, green corridors or other green open space:
    lighting plans and an assessment of likely changes to baseline light levels'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 13-14.
  'May have impacts on biodiversity' is a judgement, so that part is discretionary. Includes refurbishment
  works that may affect species using the building, such as swifts or bats. Also in the householder and
  listed building consent checklists.
review-status: unverified
field-status: {}
