reference: recreation-facilities-assessment
local-authority: WFT
required-if:
  any:
  - site:
      in:
      - open-space
      description: Development on open spaces or play, sports and recreation facilities.
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
  - condition:
      field: new-open-space
      value: true
      description: Creation of public open space.
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Development on open spaces or play, sports and recreation facilities ... Major residential
  developments Creation of public open space
must-include:
- item: Existing open space in the vicinity of the site
  level: must
- item: Open space lost (in ha), and the area (in ha) and type of open space proposed
  level: must
- item: Any necessary mitigation, which may include financial contributions
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 36-37.
  Called an Open Space Assessment.
review-status: unverified
field-status: {}
