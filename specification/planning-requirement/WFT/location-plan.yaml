reference: location-plan
local-authority: WFT
required-if:
  always: true
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: At a scale of 1:1250 or 1:2500, based on an up-to-date map
  level: must
- item: Site outlined in red, with a blue line around any other land owned by the applicant close to or
    adjoining the site
  level: must
- item: Sufficient roads and buildings to make the exact location clear, wherever possible at least two
    named roads and surrounding buildings
  level: should
- item: Properties shown numbered or named so the exact location of the site is clear
  level: must
- item: All land necessary to carry out the development (e.g. access from a public highway, visibility
    splays, landscaping, car parking and open areas around buildings)
  level: must
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 3. The
  main list says the plan 'must wherever possible' show two named roads, so that item is 'should'.
review-status: unverified
field-status: {}
