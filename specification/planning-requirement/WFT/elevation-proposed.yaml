reference: elevation-proposed
local-authority: WFT
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - change-of-use
        - lbc
    - condition:
        field: building-works
        value: true
        description: The application involves building works.
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.walthamforest.gov.uk/sites/default/files/2025-12/Full%20National%20%20Local%20_%20Validation%20Checklist%202025%20Final%20key%20changes%20highlighted.pdf
source-text: Required for all applications that involve Building Works ... All Applications for Express
  Consent ... Any application for minor material (s.73) amendments or non-material (s.96a)
must-include:
- item: At an appropriate scale, usually 1:50 or 1:100 for householder and minor applications
  level: must
- item: 'All elevations, including blank elevations (householder or individual flat applications: a statement
    confirming unchanged elevations will remain unchanged)'
  level: must
- item: The full elevation of the building (for flats in a larger converted property, the entire elevation)
  level: must
- item: Relationship to neighbouring buildings, with positions of windows and doors on all buildings
  level: must
- item: 'Advertisement consent: elevations or computer-generated images of all proposed adverts on the
    building, pole or hoarding'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisement consent: a drawing of each advert at 1:20 noting all colours and materials, and
    the height of lettering'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Listed building consent: existing and proposed internal elevations at 1:10 as necessary, and
    drawings at 1:20 of all new or altered external details and elevations'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Shopfronts in a conservation area or on a listed building: proposed drawings at 1:50, an elevation
    of the shopfront at 1:10 noting all colours and materials, joinery details at 1:50, and materials
    and RAL colours'
  level: must
  required-if:
    all:
    - condition:
        field: shopfront
        value: true
        description: Alteration or installation of a shopfront.
    - site:
        in:
        - conservation-area
        - listed-building
        description: In a conservation area or on a listed building.
- item: 'Section 73 / 96a: a full update or revision of the approved plans, with all information and clarifications
    on the approved plans'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: From the council's list (published 26 November 2025, enforced from 1 January 2026), page 8, 10.
  Items for adverts, s73/s96a amendments, listed building consent and shopfronts come from local requirements
  6-9 on page 10. The listed building consent checklist (page 8) instead asks for 'Other Plans (at a scale
  of not less than 1:20)'; the main list's 1:5 detail plans have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
