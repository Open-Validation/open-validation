reference: design-and-access-statement
local-authority: RCH
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (World Heritage Site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications for major development; Applications for development in a designated area (World
  Heritage Site or a conservation area), where the proposed development consists of: one or more dwellings;
  or a building or buildings with a floor space of 100 square metres or more. Applications for listed
  building consent.'
confidence: medium
notes: From the council's list (published October 2022), page 7. The detail column repeats the national
  contents of a statement.
review-status: unverified
field-status: {}
