reference: fire-statement
local-authority: RCH
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: 'Applications for development which: contain two or more dwellings or educational accommodation
  and meet the height condition of18m or more in height, or 7 or more storeys'
confidence: medium
notes: From the council's list (published October 2022), page 7. The detail column repeats the national
  form contents.
review-status: unverified
field-status: {}
