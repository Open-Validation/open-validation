reference: affordable-housing-statement
local-authority: RCH
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 15
    description: Residential development of 15 or more dwellings.
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policies C4 and DM2; Rochdale Affordable Housing SPD
source-text: Residential development of 15 or more dwellings
must-include:
- item: A written statement including a site plan showing the number of residential units and the mix
    of housing types (for example affordable housing, PRS and any market housing)
  level: must
- item: For each unit, the number of bedrooms and the floor space of habitable areas
  level: should
- item: A clear and full explanation where different levels or types of affordability or tenure are proposed
    for different units
  level: should
- item: The mechanism that will secure affordability in perpetuity for local people at an affordable cost
    (for example a registered social landlord)
  level: should
confidence: medium
notes: From the council's list (published October 2022), page 8. The list's indicative checklists say
  local requirements 'may be required for your scheme, depending on the circumstances'.
review-status: unverified
field-status: {}
