reference: biodiversity-survey-report
local-authority: RCH
required-if:
  any:
  - discretionary
  - condition:
      field: potential-roost-features
      value: true
      description: The development could affect roosting bats or nesting birds (including listed building
        consent applications).
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policies G6, G7 and E5; UDP Policy NE/2; Conservation of Habitats and Species Regulations
  2017; Wildlife and Countryside Act 1981; Natural Environment and Rural Communities Act 2006; Rochdale
  Biodiversity and Development SPD
source-text: Applications for development that would have the potential to affect a European, national
  or locally designated site or other sites which support important habitats. Applications for development
  that would have the potential to affect a priority species or a species protected by law and their habitat.
must-include:
- item: Bat and bird surveys where the development could affect roosting bats or nesting birds
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: The development could affect roosting bats or nesting birds.
  source-text: Applications for development (including Listed Building Consent applications) that would
    have the potential to affect roosting bats or nesting birds
- item: A Phase II Ecological Appraisal where the Phase I appraisal identifies it as necessary (habitats
    of potential nature conservation value)
  level: should
  source-text: A Phase II Ecological Appraisal should be submitted where identified as necessary within
    the Phase I appraisal.
confidence: medium
notes: From the council's list (published October 2022), page 8-10. Called 'Preliminary Ecological Appraisal
  (Extended Phase I Survey)'; the list's separate 'Bat and Bird Surveys' and 'Ecological Appraisal (Phase
  II Survey)' items are folded in as parts. Shown as discretionary because it depends on whether the development
  has 'the potential to affect' designated sites, important habitats or protected species. The list's
  indicative checklists say local requirements 'may be required for your scheme, depending on the circumstances'.
review-status: unverified
