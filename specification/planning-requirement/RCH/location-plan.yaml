reference: location-plan
local-authority: RCH
required-if:
  always: true
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications, with the exception in part of some applications for prior approval and
  some applications for minor or householder development
must-include:
- item: On an up-to-date OS map, with a compass point indicating North
  level: must
- item: Typically at a scale of 1:1250 or 1:2500
  level: should
- item: 'For a lawful development certificate: the land edged in red, drawn to an identified scale (preferably
    1:1250) and showing the direction of North'
  level: must
  required-if:
    application-type:
      in:
      - ldc
  source-text: Plan identifying the land (edged in red) to which the application relates drawn to an identified
    scale (preferably 1:1250) and showing the direction of North;
confidence: medium
notes: From the council's list (published October 2022), page 6, 28. The red line / blue line rules repeat
  the national requirement. The list asks for these drawings with 'All applications, with the exception
  in part of some applications for prior approval and some applications for minor or householder development';
  it does not say which drawings those exceptions cover.
