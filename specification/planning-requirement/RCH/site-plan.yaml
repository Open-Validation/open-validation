reference: site-plan
local-authority: RCH
required-if:
  always: true
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications, with the exception in part of some applications for prior approval and
  some applications for minor or householder development
must-include:
- item: Existing and proposed site layout/block plans at a scale of 1:200 or 1:500
  level: must
- item: The proposed development in relation to the site boundaries and other buildings on and around
    the site
  level: must
- item: Buildings, roads and footpaths on land adjoining the site
  level: must
- item: The position of trees on the site and adjacent land
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: Any boundary treatments where proposed
  level: must
confidence: medium
notes: From the council's list (published October 2022), page 6. Called 'Site Layout/Block Plan (Existing
  and Proposed)'. The list asks for these drawings with 'All applications, with the exception in part
  of some applications for prior approval and some applications for minor or householder development';
  it does not say which drawings those exceptions cover.
review-status: unverified
field-status: {}
