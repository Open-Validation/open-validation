reference: viability-assessment
local-authority: RCH
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Planning obligations are sought and the applicant proposes that the development cannot
        meet the required contributions because of financial viability.
  - discretionary
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policy DM2
source-text: Applications involving development for which planning obligations are sought and where the
  applicant proposes that the development is unable to meet the required contributions due to issues of
  financial viability or where an enabling case may be required to support development
must-include:
- item: Follows the government's recommended approach in national Planning Practice Guidance; proportionate,
    simple and transparent
  level: should
- item: Prepared on the basis that it will be made publicly available
  level: should
confidence: medium
notes: From the council's list (published October 2022), page 13. Called 'Viability Appraisal'. Where
  'an enabling case may be required' is shown as discretionary. The applicant pays for independent review
  by the council's appointed assessors. The list's indicative checklists say local requirements 'may be
  required for your scheme, depending on the circumstances'.
review-status: unverified
field-status: {}
