reference: land-contamination-assessment
local-authority: RCH
required-if:
  any:
  - site:
      in:
      - contaminated-land
      - near-landfill-site
      description: Contamination is known or suspected due to a previous use or an offsite source such
        as landfill gas.
  - all:
    - condition:
        field: new-build
        value: true
        description: New build development.
    - condition:
        field: sensitive-end-use
        value: true
        description: Of a sensitive end use.
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policy G9; UDP Policies EM/7 and EM/8
source-text: Applications for development on sites where contamination is known or suspected due to a
  previous use or an offsite source such as landfill gas; applications for new build developments of a
  sensitive end use.
must-include:
- item: A Phase II intrusive site investigation where the Phase I appraisal identifies it as necessary
  level: should
confidence: medium
notes: From the council's list (published October 2022), page 9. Called 'Contamination Report/Phase I
  Site Investigation'. The list's indicative checklists say local requirements 'may be required for your
  scheme, depending on the circumstances'.
review-status: unverified
field-status: {}
