reference: flood-risk-assessment
local-authority: RCH
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood Zones 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A site of 1 ha or above in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 ha or above in Flood Zone 1.
  - site:
      in:
      - surface-water-flood-risk
      description: A site under 1 ha in Flood Zone 1 that could be affected by sources of flooding other
        than rivers and the sea (e.g. surface water drainage, reservoirs).
  - all:
    - ref: major-development
    - site:
        in:
        - critical-drainage-area
        description: Critical Drainage Areas (as notified by the Environment Agency or identified within
          the SFRA).
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policy G8; UDP Policy EM/7
source-text: Applications for development within Flood Zones 2 or 3; on sites of 1ha or above within Flood
  Zone 1; on sites less than 1ha in Flood Zone 1 where they could be affected by sources of flooding other
  than rivers and the sea (e.g. surface water drainage, reservoirs); and for major development within
  Critical Drainage Areas (as notified by the Environment Agency or identified within the SFRA)
confidence: medium
notes: From the council's list (published October 2022), page 10. The list's indicative checklists say
  local requirements 'may be required for your scheme, depending on the circumstances'.
review-status: unverified
field-status: {}
