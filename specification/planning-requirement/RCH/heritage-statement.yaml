reference: heritage-statement
local-authority: RCH
required-if:
  any:
  - site:
      in:
      - listed-building
      description: Alterations to a Listed Building.
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building-setting
      description: Within the setting of a Listed Building.
  - site:
      in:
      - conservation-area
      description: Within or affecting the setting of a Conservation Area.
  - site:
      in:
      - locally-listed-building
      description: Alteration of a non-designated heritage asset, or a site that includes a building or
        structure considered to be a Heritage Asset.
  - site:
      in:
      - park-and-garden
      description: Within an Historic Park or Garden or its setting.
  - site:
      in:
      - archaeological-priority-area
      description: A site of archaeological interest.
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policy P2; UDP Policies BE/16, BE/17 and BE/18; Planning (Listed Buildings and Conservation
  Areas) Act 1990
source-text: Applications for development which involves alterations to a Listed Building; is within the
  setting of a Listed Building; is within or affects the setting of a Conservation Area; involves the
  alteration of a non-designated heritage asset; is within an Historic Park or Garden or it’s setting;
  is on a site of archaeological interest; or is on a site that includes any building or structure considered
  to be a Heritage Asset
confidence: medium
notes: From the council's list (published October 2022), page 11. The list's indicative checklists say
  local requirements 'may be required for your scheme, depending on the circumstances'.
review-status: unverified
