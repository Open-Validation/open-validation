reference: town-centre-impact-assessment
local-authority: RCH
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, office or leisure development outside centres defined in the Development Plan.
  - any:
    - all:
      - condition:
          field: settlement-type
          value: rochdale
          description: Rochdale.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 2000
          description: 2,000 sq m gross and above.
    - all:
      - condition:
          field: settlement-type
          value: middleton
          description: Middleton.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m gross and above.
    - all:
      - condition:
          field: settlement-type
          value: heywood-littleborough-district-local-centre
          description: Heywood, Littleborough and District/Local Centres.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 500
          description: 500 sq m gross and above.
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
policy: Core Strategy Policy E1
source-text: Applications for retail, office or leisure development outside of centres defined in the
  Development Plan and which exceed the relevant floorspace thresholds
confidence: medium
notes: 'From the council''s list (published October 2022), page 12. Called ''Retail, Office and Leisure
  Impact Assessment''. The thresholds come from the detail column (Core Strategy): Rochdale 2,000 sq m
  gross, Middleton 1,000 sq m, Heywood, Littleborough and District/Local Centres 500 sq m. The list''s
  indicative checklists say local requirements ''may be required for your scheme, depending on the circumstances''.'
review-status: unverified
field-status: {}
