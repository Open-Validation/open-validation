  - condition:
      field: departure-from-development-plan
      value: true
      description: A departure from the Development Plan.
  - discretionary
source-url: https://www.rochdale.gov.uk/downloads/file/452/local-list
source-text: Applications for major development or for complex or potentially controversial development,
  including departures from the Development Plan
must-include:
- item: The context and need for the proposed development
  level: should
