reference: design-and-access-statement
local-authority: BEX
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - conservation-area
        - world-heritage-site
        - site-of-special-scientific-interest
        - area-of-outstanding-natural-beauty
        description: 'In a designated area: National Park, SSSI, Conservation Area, AONB, World Heritage
          Site or the Broads.'
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floorspace created of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement must normally accompany applications for planning permission
  (in outline or in full) which are for Major Development or which fall within one of the following designated
  areas: ... In these instances a Design and Access Statement is only required for applications involving
  the provision of one of more dwellinghouses or of building(s) where the floorspace created by the development
  is 100sq m or more. Listed Building Consent applications must also include a Design and Access Statement.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes that context into account
  level: must
- item: The policy adopted as to access, and how access policies in local development documents have been
    taken into account
  level: must
- item: Any consultation on access and what account has been taken of it
  level: must
- item: How specific issues which might affect access have been addressed
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (Design and
  Access Statement), page 6-8. Not typically required for s73 applications. For householder applications
  the checklist asks for one where the site is in a Conservation Area and the floorspace created is 100
  sq m or more.
review-status: unverified
field-status: {}
