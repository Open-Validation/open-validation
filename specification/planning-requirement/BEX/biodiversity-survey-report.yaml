reference: biodiversity-survey-report
local-authority: BEX
required-if:
  any:
  - site:
      in:
      - local-wildlife-site
      description: On or adjacent to Sites of Importance for Nature Conservation (SINCs), Local Nature
        Reserves and Green Corridors.
  - condition:
      field: protected-species
      value: true
      description: May impact protected and/or priority species (e.g. demolition of older buildings or
        roof spaces, removal of trees, scrub or hedgerows, alterations to water courses, derelict land,
        near water bodies, lighting near woodland, hedgerows or water).
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 7.19; Bexley Core Strategy 2012 CS01, CS17 and CS18
source-text: any development that may impact nature conservation areas; any development that may impact
  protected and/or priority species
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: must
- item: Information supporting any enhancement, mitigation and/or compensation measures
  level: must
- item: Where appropriate, plans showing significant wildlife habitats or features and the location of
    habitats of protected and/or priority species
  level: should
- item: 'For development affecting designated nature conservation areas: habitat and species surveys,
    impact assessment, mitigation and enhancement proposals, and long term maintenance and management
    proposals'
  level: must
  required-if:
    site:
      in:
      - local-wildlife-site
      description: Affects areas designated for nature conservation.
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Biodiversity
  / Ecology Survey and Report), page 12. 'May impact' is a judgement, so discretionary is included. The
  list predates the Bexley Local Plan (adopted April 2023) and the London Plan 2021, so the policies it
  cites have since been replaced.
review-status: unverified
field-status: {}
