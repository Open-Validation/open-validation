reference: land-contamination-assessment
local-authority: BEX
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use is sensitive, e.g. residential, schools.
  - site:
      in:
      - contaminated-land
      description: The previous use of land could give rise to contamination.
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 5.21; Bexley UDP (saved policies) ENV39, ENV40; Bexley Core Strategy 2012
  CS01 and CS09
source-text: Any development in relevant locations, in particular where the proposed use is sensitive
  e.g. residential, schools, or where the previous use of land could give rise to contamination.
must-include:
- item: Enough information to determine whether contamination exists, its nature, the risks and whether
    they can be reduced to an acceptable level
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Land Contamination
  Assessment), page 20. 'Any development in relevant locations' is shown as discretionary. The list predates
  the Bexley Local Plan (adopted April 2023) and the London Plan 2021, so the policies it cites have since
  been replaced.
review-status: unverified
field-status: {}
