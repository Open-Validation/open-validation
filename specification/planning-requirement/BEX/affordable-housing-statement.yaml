reference: affordable-housing-statement
local-authority: BEX
required-if: discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policies 3.10-3.13; Bexley Core Strategy 2012 CS01 and CS10; Bexley UDP (saved
  policies) H14
source-text: All development liable for the provision of affordable housing
must-include:
- item: 'For both the affordable and any market housing: numbers of units, mix with numbers of habitable
    rooms and/or bedrooms, or floor space of habitable areas'
  level: must
- item: Plans showing the location of units and their habitable rooms and/or bedrooms and/or floor space
  level: must
- item: Any different levels or types of affordability or tenure clearly and fully explained
  level: must
- item: Details of any Registered Providers acting as partners in the development
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Affordable
  Housing Statement), page 10. The list does not state which development is liable (that is set by the
  development plan), so it is shown as discretionary. The list predates the Bexley Local Plan (adopted
  April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
