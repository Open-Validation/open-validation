reference: archaeological-assessment
local-authority: BEX
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: ground-disturbance
        value: true
        description: Disturbance of ground.
    - any:
      - site:
          in:
          - archaeological-priority-area
          description: Within an Area of High Archaeological Potential.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.4
          description: Site of greater than 0.4 ha.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.4
          description: Site of greater than 0.4 ha.
  - site:
      in:
      - scheduled-monument
      description: Affecting nationally important archaeological remains that are scheduled.
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 7.8; Bexley Core Strategy 2012 CS01 and CS19
source-text: applications for all non-householder development located within an Area of High Archaeological
  Potential AND/OR where the application involves the disturbance of ground on sites of greater than 0.4ha.
  All applications affecting nationally important archaeological remains, whether scheduled or not.
must-include:
- item: A desktop Archaeological Assessment
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Archaeological
  Assessment), page 11. Unscheduled nationally important remains are shown as discretionary. Extensions
  to existing residential properties are excluded. The list predates the Bexley Local Plan (adopted April
  2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
