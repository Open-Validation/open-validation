reference: energy-statement
local-authority: BEX
required-if:
  ref: major-development
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policies 5.1-5.11; Bexley UDP (saved policies) ENV39; Bexley Core Strategy 2012
  CS01 and CS08
source-text: Major developments
must-include:
- item: An energy strategy based on the Mayor's energy hierarchy (lean, clean, green), following the GLA
    guidance on preparing energy assessments
  level: must
- item: How the need for energy is minimised and how it will be supplied
  level: must
- item: Reduction in carbon dioxide emissions through on-site renewable energy generation, where feasible
  level: must
- item: 'Major residential: measures to achieve zero regulated carbon emissions, or at least a 35% reduction
    beyond Part L 2013 with the rest offset by a cash-in-lieu contribution'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Major residential development.
- item: Assessment of renewable energy options for the site, with space for equipment and fuel storage
    and the site and form of buildings and flues
  level: must
- item: That connection to existing or planned district heating networks (including the Riverside Resource
    Recovery Facility network) has been prioritised, with correspondence from heat network operators
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Energy Assessment),
  page 15-16. The list predates the Bexley Local Plan (adopted April 2023) and the London Plan 2021, so
  the policies it cites have since been replaced.
review-status: unverified
field-status: {}
