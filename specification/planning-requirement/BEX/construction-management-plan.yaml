reference: construction-management-plan
local-authority: BEX
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policies 6.11, 6.12 and 6.14; Bexley Core Strategy 2012 CS15; Bexley UDP (saved
  policies) T6, T14, T15
source-text: Major developments and others likely to have a significant impact on traffic congestion or
  pedestrian safety and where loading and delivery activities associated with the construction phase of
  development would cause congestion or obstruction on the highway.
must-include:
- item: How construction traffic can access the site safely and how traffic conflicts can be minimised
  level: must
- item: The route construction traffic will follow to and from the site
  level: must
- item: Provision for on-site delivery, off-loading, turning and parking of construction and operatives'
    vehicles
  level: must
- item: Efficiency and sustainability measures during construction
  level: must
- item: Hours of operation
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Construction
  Logistics Plan), page 13-14. A draft plan; 'others likely to have a significant impact' is shown as
  discretionary. The list predates the Bexley Local Plan (adopted April 2023) and the London Plan 2021,
  so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
