reference: waste-management-plan
local-authority: BEX
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 3
      description: New development, conversions or changes of use resulting in three or more residential
        units.
  - ref: major-development
  - application-type:
      in:
      - waste-dev
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Bexley Core Strategy 2012 CS20; London Plan 2016 policies 5.16-5.19; Bexley UDP (saved policies)
  WAS3
source-text: Refuse and Recycling Storage and collection strategy ... proposals for new development, conversions
  or changes of use resulting in a total of three or more residential units; new HMOs; proposals for new
  development or the change of use to commercial, employment, leisure and educational uses and mixed use
  developments and the extension of such premises where the number of employees, customers and/or students
  would significantly increase as a result of the development. ... Site Waste Management Plan ... Major
  developments and all proposals for the production, transfer, management or deposit of waste
must-include:
- item: 'Refuse and recycling: storage space shown on the layout, and the arrangements for storage and
    collection, including enclosed storage'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 3
        description: Three or more residential units.
    - discretionary
- item: Refuse storage convenient for collection from an adopted highway or suitable access (distance,
    route, gradient), sited with regard to visual impact and neighbours' amenity
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 3
        description: Three or more residential units.
    - discretionary
- item: 'Site Waste Management Plan: the source of waste and where it will go for treatment or disposal,
    and compliance with Core Strategy CS20 and London Plan 5.17'
  level: must
  required-if:
    any:
    - ref: major-development
    - application-type:
        in:
        - waste-dev
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Refuse and
  Recycling Storage and collection strategy; Site Waste Management Plan), page 25. Both documents are
  recorded here. New HMOs and commercial premises where users 'significantly increase' have no field or
  threshold, so they are covered by 'discretionary'. The list predates the Bexley Local Plan (adopted
  April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
