reference: noise-assessment
local-authority: BEX
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Noise-generating activities, including places of worship and entertainment.
  - condition:
      field: plant-equipment
      value: true
      description: Plant and machinery.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development (including residential) close to existing or proposed noise
        generating activities.
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 7.15; Bexley Core Strategy 2012 CS01 and CS09; Bexley UDP (saved policies)
  ENV39
source-text: All proposals which include noise-generating activities, including places of worship and
  entertainment, plant and machinery and any noise- sensitive development (including residential) which
  is being proposed close to existing or proposed noise generating activities.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Noise measurement surveys to relevant British Standards; noise assessments, predictions and calculations;
    recommendations and specifications of works to control noise
  level: must
- item: 'New residential: follows ProPG: Planning and Noise'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: New residential development.
- item: Fixed plant and industrial noise assessed in full using BS4142:2014 (only within its scope)
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Fixed plant, industrial processes or loading.
- item: Noise control works, including external attenuation equipment, shown on the drawings
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Noise and Vibration
  Assessment), page 22-23. The list predates the Bexley Local Plan (adopted April 2023) and the London
  Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
