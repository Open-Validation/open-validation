reference: application-form
local-authority: BEX
required-if:
  always: true
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; section 65(5)
  Town and Country Planning Act 1990
source-text: 'The following is a list of what is required for all applications for planning permission
  including outline planning permission (for full details see below): Application form including signed
  Ownership certificate and Agricultural holding certificate'
must-include:
- item: Ownership certificate A, B, C or D completed
  level: must
- item: Agricultural holdings certificate completed, whether or not the site includes an agricultural
    holding (not needed for reserved matters, renewal of temporary permission, discharge or variation
    of conditions, TPO or advertisement consent)
  level: must
- item: Where Ownership Certificate B, C or D is completed, notice served on owners in accordance with
    Article 13 of the DMPO
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements, page 1-2,
  8.
review-status: unverified
field-status: {}
