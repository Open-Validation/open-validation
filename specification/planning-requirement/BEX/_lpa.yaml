submission-standards:
- item: Each drawing has a title and drawing number identifying its subject, including any revisions
  level: must
- item: Drawings state the scale and paper size and include a scale bar indicating a minimum of 0-10 metres
  level: must
- item: Plans and drawings show key dimensions
  level: must
- item: Drawings marked 'Do not scale' are generally not acceptable; if used, all dimensions must be shown
  level: must
- item: PDF is the preferred file type for drawings and documents; photos normally in JPEG
  level: should
- item: Each file no larger than 20MB
  level: should
- item: Householder and small minor application drawings preferably at A3
  level: should
- item: 'Hard copy applications: 2 sets of documents; major applications in hard copy and on CD'
  level: must
- item: No submissions by file transfer websites (e.g. Dropbox) or USB pens
  level: must
