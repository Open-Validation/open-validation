reference: landscaping-plan
local-authority: BEX
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New build proposals.
    - condition:
        field: external-space
        value: true
        description: The site includes external areas.
  - condition:
      field: landscaping-works
      value: true
      description: Proposals which include changes to existing external areas.
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policies 7.1, 7.4 and 7.5; Bexley Core Strategy 2012 CS01, CS17, CS18; Bexley
  UDP (saved policies) ENV35, ENV39
source-text: All new build proposals where the site includes external areas and any proposals which include
  changes to existing external areas.
must-include:
- item: Plans of hard and soft landscaping for all external parts of the site
  level: must
- item: Site features to be removed and/or retained
  level: must
- item: Any species of nature conservation interest
  level: must
- item: Plant species, sizes and planting densities, and the size of any proposed trees
  level: must
- item: Hard landscaping materials
  level: must
- item: Site levels, gradients and earthworks; bicycle and refuse storage areas; boundary treatments and
    SUDs, where relevant
  level: must
- item: A 5-year management plan for any communal landscaping or public realm areas
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Landscaping
  Details), page 21. Detail proportionate to the scale of development. The list predates the Bexley Local
  Plan (adopted April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
