reference: sustainable-drainage-strategy
local-authority: BEX
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: new-build
          value: true
          description: Buildings are proposed.
      - condition:
          field: hard-surfacing
          value: true
          description: Hard surfaces are proposed.
    - site:
        in:
        - critical-drainage-area
        description: Within a Vulnerable Drainage Area.
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 5.13; Bexley Core Strategy 2012 CS01 and CS08
source-text: All major applications. All non-householder applications where buildings or hard surfaces
  are proposed and are within a Vulnerable Drainage Area.
must-include:
- item: That the London Plan SuDS hierarchy has been followed, with greenfield run-off rates
  level: must
- item: Detailed site layout at an identified scale
  level: must
- item: Topographical survey of the site
  level: must
- item: Plans, drawings and specification of the SuDS proposed, including hard construction, soft landscaping
    and planting
  level: must
- item: Calculations of discharge and run-off rates and water storage capacity, showing they meet the
    site's requirements
  level: must
- item: Details of any offsite works required, with necessary consents
  level: must
- item: Management and maintenance plan for all SuDS
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Sustainable
  Urban Drainage Systems (SuDS) Strategy), page 27-28. The list predates the Bexley Local Plan (adopted
  April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
