reference: heritage-statement
local-authority: BEX
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - battlefield
      - protected-wreck-site
      - locally-listed-building
      - archaeological-priority-area
      description: 'Affects a heritage asset or its setting: listed building, conservation area, scheduled
        ancient monument, registered park or garden, battlefield or designated shipwreck, locally listed
        building, or an area of known archaeological interest.'
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: NPPF; London Plan 2016 policies 7.8-7.12; Bexley Core Strategy 2012 CS19; Bexley UDP (saved policies)
  ENV22, ENV46, ENV47, ENV51 and ENV52
source-text: Applications affecting a heritage asset or its settings, including a listed building, a conservation
  area, a scheduled ancient monument, a registered park or garden, or a battlefield of designated shipwreck;
  applications affecting non-designated heritage assets including a locally listed building, a building
  or structure of historic or architectural importance, or heritage land; and applications in an area
  of known archaeological interest.
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
- item: 'Listed buildings: contextual and detailed photographs of the building as existing'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'Listed buildings: a schedule of works, an analysis of their impact on significance, and the justification
    and methodology for the works'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'Listed buildings: an illustration of any features to be altered or removed'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'Listed buildings: historic evidence (plans or photographs) for reinstatement of lost or damaged
    features, where possible'
  level: should
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'Listed buildings: elevations and sections at 1:20 or less for altered or new windows, doors and
    shopfronts (details such as mouldings at 1:5 or less)'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'Listed buildings: a detailed specification of all proposed materials, with samples where appropriate'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'Other heritage assets: plans showing historic features, listed buildings, historic parks and
    gardens and scheduled ancient monuments; analysis of significance, justification and impact on the
    asset and its setting'
  level: must
- item: 'In an area of known archaeological interest with intrusive ground works: a desk-based assessment
    and, where necessary, a field evaluation'
  level: must
  required-if:
    condition:
      field: ground-disturbance
      value: true
      description: Intrusive ground works.
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Heritage Assessment),
  page 19-20. Buildings of historic or architectural importance and 'heritage land' have no designation
  id, so they are covered by 'discretionary'. For listed building consent the written statement 'may be
  required'. The list predates the Bexley Local Plan (adopted April 2023) and the London Plan 2021, so
  the policies it cites have since been replaced.
review-status: unverified
field-status: {}
