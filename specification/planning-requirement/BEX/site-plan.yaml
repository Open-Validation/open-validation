reference: site-plan
local-authority: BEX
required-if:
  always: true
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Block Plan should be submitted at a scale of 1:500 or 1:200 and should accurately show:'
must-include:
- item: 'Scale of 1:500 or 1:200 (householder: e.g. 1:100 or 1:200)'
  level: should
- item: The direction of North
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on and
    adjacent to the site, with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: The type and height of boundary treatment, including existing and proposed walls or fencing
  level: should
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (Block Plan)
  and Householder Application Checklist, page 2, 4, 8.
review-status: unverified
field-status: {}
