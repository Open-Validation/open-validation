reference: lighting-assessment
local-authority: BEX
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Proposals for floodlights.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Other external lighting.
    - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 7.19; Bexley Core Strategy 2012 CS01, CS18; Bexley UDP (saved policies)
  ENV39
source-text: All proposals for floodlights and other external lighting which may impact on visual or residential
  amenity or nature conservation interests on or adjacent to an application site.
must-include:
- item: The proposed hours when the lighting would be switched on
  level: must
- item: Beam orientation, luminance levels and a schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (External Lighting
  Assessment), page 16. For other external lighting, whether it 'may impact' amenity or nature conservation
  is a judgement, so it is shown as discretionary. Details can be on the plans, landscaping details or
  Design and Access Statement. The list predates the Bexley Local Plan (adopted April 2023) and the London
  Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
