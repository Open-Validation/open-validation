reference: cil-form
local-authority: BEX
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: New floor build area, including extensions.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A new dwelling.
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: Your proposed development may be liable for a Charge under the Community Infrastructure Levy
  if it involves new floor build area, including extensions or a new dwelling. ... To assist the Council
  in establishing whether or not your proposal is liable for a Charge you are required to complete a Planning
  Application Additional Information Requirement form
must-include:
- item: Submitted at the same time as the planning application, with accurate floorspace figures
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (CIL Additional
  Information form), page 3.
review-status: unverified
field-status: {}
