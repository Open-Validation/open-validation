reference: floor-plan-existing
local-authority: BEX
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following is a list of what is required for all applications for planning permission
  including outline planning permission (for full details see below): ... Existing and proposed Floorplans'
must-include:
- item: Scale of 1:50 or 1:100
  level: should
- item: Room uses and the positions of windows, doors etc.
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: New buildings shown in context with adjacent buildings, including property numbers where applicable
  level: should
- item: Boundary lines, to show whether encroachment onto neighbouring land will occur
  level: should
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (Existing
  and Proposed Floor Plans), page 2, 5, 8.
