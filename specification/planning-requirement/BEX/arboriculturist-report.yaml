reference: arboriculturist-report
local-authority: BEX
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on the site or adjacent land (including street trees) that could influence or be
      affected by the development.
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 7.21; Bexley UDP (saved policies) G27, ENV34-ENV37
source-text: all developments which have the potential to impact on trees either on or outside the development
  site.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Prepared by a qualified arboriculturist
  level: must
- item: In accordance with BS 5837 (the list cites BS 5837:2005)
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Tree Survey/Arboricultural
  Survey and Assessment), page 31. The list predates the Bexley Local Plan (adopted April 2023) and the
  London Plan 2021, so the policies it cites have since been replaced.
