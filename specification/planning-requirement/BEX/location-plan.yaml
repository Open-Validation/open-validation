reference: location-plan
local-authority: BEX
required-if:
  always: true
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a location plan which must be drawn to an identified
  Scale (1:1250 or 1:2500), must show the direction of North, show at least two named roads, show surrounding
  buildings with property numbers or names and be based on an up-to-date map.
must-include:
- item: Drawn to an identified scale (1:1250 or 1:2500), based on an up-to-date map
  level: must
- item: The direction of North
  level: must
- item: At least two named roads, and surrounding buildings with property numbers or names
  level: must
- item: Application site edged clearly with a red line, including all land needed for the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (Site Location
  Plan), page 4.
review-status: unverified
field-status: {}
