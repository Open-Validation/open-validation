reference: town-centre-impact-assessment
local-authority: BEX
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: On the edge or outside of the strategic, major and district centres (including extensions
        to an out or edge of town shopping centre).
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Exceeding 2,500 sq m gross of floorspace (cumulatively for extensions).
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: NPPF; London Plan 2016 policy 4.7; Bexley Core Strategy 2012 CS14; Bexley UDP (saved policies)
  SHO2 and SHO7
source-text: The impact test only applies to proposals exceeding 2,500 square metres gross of floorspace
  which are on the edge or outside of the strategic, major and district centres (including extensions
  to an existing out or edge of town shopping centre which would cumulatively exceed the threshold).
must-include:
- item: Details of the sequential test that led to the site being selected, including the need for the
    use
  level: must
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on town centre vitality and viability up to five years from the application (ten years
    for major schemes)
  level: must
- item: An assessment of the accessibility of the chosen location
  level: must
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Town Centre
  Uses/Retail Impact Assessment), page 28-29. Scope to be agreed with the council before submission. The
  list predates the Bexley Local Plan (adopted April 2023) and the London Plan 2021, so the policies it
  cites have since been replaced.
review-status: unverified
field-status: {}
