reference: flood-risk-assessment
local-authority: BEX
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Proposals of 1 hectare or greater in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Proposals of 1 hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: All new development (including minor development and change of use) in Flood Zones
        2 and 3.
  - site:
      in:
      - critical-drainage-area
      description: An area within Flood Zone 1 which has critical drainage problems.
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policies 5.12 and 5.13; Bexley Core Strategy 2012 CS01, CS08 and CS09
source-text: Application for proposals of 1 hectare or greater in Flood Zone 1; all proposals for new
  development (including minor development* and change of use) in Flood Zones 2 and 3, or in an area within
  Flood Zone 1 which has critical drainage problems; where proposed development or a change of use to
  a more vulnerable class may be subject to other sources of flooding. Major development and proposals
  for all new dwellings in flood zones 2 and 3 will also require a Sequential Assessment.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including SUDs
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: A Sequential Assessment of sites in lower flood risk areas (may not be needed in the Sustainable
    Growth Areas)
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwellings.
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Flood Risk
  Assessment), page 17-19. 'Other sources of flooding' is shown as discretionary. Minor extensions and
  some vulnerable developments in Flood Zones 2 and 3 follow the Environment Agency's standing advice.
  The list predates the Bexley Local Plan (adopted April 2023) and the London Plan 2021, so the policies
  it cites have since been replaced.
review-status: unverified
field-status: {}
