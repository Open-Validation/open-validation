reference: flood-risk-assessment
local-authority: BEX
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or greater (including in Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or greater (including in Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3 (including minor development such as householder extensions).
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
source-text: 'Application Trigger: Application for proposals of 1 hectare or greater in Flood Zone 1;…
  The FRA should include the design of surface water management systems including Sustainable Drainage
  Systems (SUDs) and address the requirement for safe access to and from the development in areas at risk
  of flooding.'
must-include:
- item: Design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the workbook gave report content, not the thresholds. The
  FRA also covers minor development, including householder extensions, in Flood Zones 2 and 3.'
review-status: unverified
