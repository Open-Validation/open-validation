reference: viability-assessment
local-authority: BEX
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: The proposal does not fully accord with the Development Plan on affordable housing (including
      tenure split and unit sizes).
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policies 3.10-3.12; Bexley Core Strategy 2012 CS10; Mayor of London's Affordable
  Housing and Viability SPG (2017)
source-text: Applications which do not fully accord with the Development Plan (and associated guidance)
  in relation to Affordable Housing (including tenure split and unit sizes)
must-include:
- item: Demonstrates that the proposed affordable housing is the maximum reasonably viable
  level: must
- item: Any request to withhold information from publication explained in an accompanying letter
  level: should
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Financial Viability
  Assessment), page 17. There is a presumption that the FVA will be published. The list predates the Bexley
  Local Plan (adopted April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
