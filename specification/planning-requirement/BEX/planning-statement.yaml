reference: planning-statement
local-authority: BEX
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Developments contrary to policies of the development plan.
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Development Plan as a whole
source-text: Major developments and any others requiring further details, explanation or justification
  in planning policy terms.
must-include:
- item: How the proposal relates to national and regional guidance, the development plan (London Plan,
    Core Strategy, UDP) and adopted SPDs
  level: must
- item: Details of pre-submission consultation with the council and the wider community/statutory consultees,
    if not submitted separately
  level: must
- item: Where the application departs from pre-application advice, an explanation why
  level: must
- item: Secure by Design principles
  level: should
  source-text: Planning Statement (Including Secure by Design principles)
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Planning Statement),
  page 9, 24-25. Also needed for Certificates of Lawfulness needing written justification and where pre-application
  advice says so; those cases are covered by 'discretionary'. The list predates the Bexley Local Plan
  (adopted April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
