reference: elevation-existing
local-authority: BEX
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following is a list of what is required for all applications for planning permission
  including outline planning permission (for full details see below): ... Existing and proposed Elevations
  (including flank elevations)'
must-include:
- item: Scale of 1:50 or 1:100
  level: should
- item: Clearly labelled as to which side of the building they relate
  level: should
- item: All sides of the proposal, including flank elevations; blank elevations included
  level: must
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: Where adjoining or close to another building, the relationship between the buildings and the positions
    of openings on each
  level: should
- item: Boundary lines, to show whether encroachment onto neighbouring land will occur
  level: should
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (Existing
  and Proposed Elevations), page 2, 4, 8.
review-status: unverified
field-status: {}
