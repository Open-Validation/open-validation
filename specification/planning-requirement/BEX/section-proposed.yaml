reference: section-proposed
local-authority: BEX
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: new-build
      value: true
      description: Applications involving new buildings.
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings should
  be submitted to show both existing and finished levels ... This will be required for all applications
  involving new buildings.
must-include:
- item: Scale of 1:50 or 1:100, showing cross section(s) through the proposed building(s)
  level: should
- item: 'Where ground levels change: existing and finished levels, including details of foundations and
    eaves and how encroachment onto adjoining land is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: Existing site levels and finished floor levels related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: Applications involving new buildings.
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), National Requirements (Existing
  and Proposed Site Sections and Finished Floor and Site Levels), page 5. For householder applications
  they are needed 'where necessary and requested by the validation officer' (page 8), shown as discretionary.
review-status: unverified
field-status: {}
