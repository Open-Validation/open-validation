reference: air-quality-assessment
local-authority: BEX
required-if:
  any:
  - all:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: Located in or adjacent to an Air Quality Management Area.
  - condition:
      field: biomass-or-chp
      value: true
      description: Proposals which include biomass boilers and/or combined heat and power.
  - application-type:
      in:
      - waste-dev
      - mineral-extraction
  - discretionary
source-url: https://www.bexley.gov.uk/sites/default/files/2021-10/Planning-application-requirements.pdf
policy: London Plan 2016 policy 7.14; Bexley UDP (saved policies) ENV39 and ENV41; Bexley Core Strategy
  2012 CS01
source-text: Major developments where the development is located in or adjacent to an Air Quality Management
  Area (AQMA) and other potentially polluting development; all proposals which include biomass boilers
  and/or combined heat and power; all proposals involving waste management / treatment activities, mineral
  extraction or any other general industrial combustion process.
must-include:
- item: A review of air quality around the site using existing monitoring and/or modelling data
  level: must
- item: Air quality dispersion modelling in accordance with the London Councils Air Quality and Planning
    Guidance
  level: must
- item: The number of people (receptors) exposed to poor air quality as a result of the development, with
    their location on a map
  level: must
- item: The impact on air quality during construction, with detailed mitigation for controlling dust and
    pollution emissions
  level: must
- item: An outline and justification of mitigation measures in the design, location and operation of the
    development
  level: must
- item: A maintenance regime for any combustion equipment or mitigation measures, where required
  level: must
- item: Air quality neutral assessment using the Outer London benchmarks
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (reviewed and updated 17 October 2018), Local Requirements (Air Quality
  and Dust Risk Assessment), page 10-11. 'Other potentially polluting development' and 'any other general
  industrial combustion process' are shown as discretionary. The list predates the Bexley Local Plan (adopted
  April 2023) and the London Plan 2021, so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
