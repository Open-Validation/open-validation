notes: 'From the council''s list (adopted May 2024, in force for West Lindsey from 1 July 2024), Full
  Applications list page 3; Outline Applications list page 3. Wording from the Outline Applications list
  (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Outline%20Applications%20Validation%20List.pdf)
  as quoted. Category 2 local requirement (''required through the policies of the Central Lincolnshire
  Local Plan or other Development Plan documents''). The list gives no trigger: its matrix marks the document
  ''Where Required'', so it is shown as discretionary. At outline stage a statement proposing deferral
  of the Energy Statement to reserved matters is accepted instead. The Full list also asks for a ''Completed
  Energy Efficiency Checklist'' (CLLP Policies S6, S7, S8), which has no matching id. The Householder
  and Outline lists also ask for ''Any other report/survey from the Central Lincolnshire ‘full’ validation
  checklist relevant to the scale, nature and location of development'', so householder and outline applications
  are included as discretionary.'
