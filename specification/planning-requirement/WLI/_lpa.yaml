  notes: 'Grokbot''s link is the current joint Central Lincolnshire Full Applications list, in force for
    West Lindsey from 1 July 2024, with 2026 revisions consulted on but not yet adopted. The extract is
    badly incomplete: it misses nearly all of the roughly 25 Category 2 policy-driven local requirements
    and most Category 3 items, and its triggers are garbled matrix text. Fixed 2026-11-05: every file
    was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Lincolnshire, North Lincolnshire and North East Lincolnshire
  paused 7 Sep 2026 and WITHDRAWN 29 Oct 2026 for reconsideration (outcome due early 2027). Not in force:
  council remains the LPA; May 2027 elections on existing boundaries.'
