validation-list:
  url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
  date: '2024-07-01'
  date-basis: 'West Lindsey''s ''Local Validation List from 1 July 2024'' page (https://www.west-lindsey.gov.uk/planning-building-control/planning/apply-planning-permission/local-validation-list-1-july-2024):
    the joint Central Lincolnshire lists were due in force on 20 May 2024 but ''implementation of the
    local validation requirements for West Lindsey District Council was delayed until 1 July 2024'' (North
    Kesteven''s page says 3 June 2024). The lists (Full, Householder, Listed Building Consent, Outline;
    PDFs created 13-14 May 2024) carry no date themselves. A revised set (''Full Applications Validation
    List 2026'' and three others, PDFs created 30 April 2026) was consulted on from 11 May to 7 June 2026;
    the joint consultation page (https://www.central-lincs.org.uk/consultations/local-validation-list-review-consultation-11-may-2026,
    checked 2026-11-06) says ''The proposed Local Validation Lists are not adopted and do not currently
    apply'' and that the existing adopted lists remain in force, and North Kesteven''s checklists page
    says the same. City of Lincoln''s ''Submit a planning application'' page (https://www.lincoln.gov.uk/planning/planning-applications/3)
    does say updated lists ''were adopted by West Lindsey District Council on 24 August 2026'', but it
    links to that same consultation page, no adoption notice or summary report is published, West Lindsey''s
    own page still shows the 2024 list, and the 2026 PDFs sit in a ''2026-08'' upload folder only because
    the joint website was migrated then (2023 documents are in the same folder). Committee papers (democracy.n-kesteven.gov.uk,
    democracy.west-lindsey.gov.uk) could not be checked: the proxy refuses those hosts.'
  status: outdated
submission-standards:
- item: All plans and drawings drawn to the identified scale, with a linear scale bar; plans show the
    direction of north
  level: must
- item: Plans annotate key dimensions, as a minimum the external length, width and height (eaves and ridge)
    of buildings and structures, and the separation distances between the buildings and structures closest
    to the site boundary and the boundary itself
  level: must
- item: All measurements in metres
  level: must
- item: Applications made on the standard national form, with the correct planning fee
  level: must
