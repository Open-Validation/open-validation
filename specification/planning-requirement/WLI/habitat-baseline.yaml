reference: habitat-baseline
local-authority: WLI
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: 'Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015:'
must-include:
- item: Plan(s) drawn to an identified scale and showing the direction of North, showing onsite habitat
    existing on the date of application (or earlier proposed date), including any irreplaceable habitat
    (if applicable)
  level: must
confidence: medium
notes: From the council's list (adopted May 2024, in force for West Lindsey from 1 July 2024), Full Applications
  list page 1; Outline Applications list page 1. Wording from the Outline Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Outline%20Applications%20Validation%20List.pdf)
  as quoted. Category 1 'Biodiversity Net Gain mandatory requirements' (the national Article 7 information).
  The list says the statements may be provided through the Central Lincolnshire Biodiversity Gain Statement.
  Householder applications are exempt by law; the Householder list only asks for an exemption statement,
  which forms part of the application form.
review-status: unverified
field-status: {}
