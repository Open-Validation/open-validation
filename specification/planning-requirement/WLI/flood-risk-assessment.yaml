reference: flood-risk-assessment
local-authority: WLI
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3 (including minor development and change of use).
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare (Flood Zone 1).
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area in Flood Zone 1.
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
must-include:
- item: Sequential and exception test evidence
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
confidence: medium
notes: 'From the audit (missing_requirement): Flood Zone 2/3 including minor development and change of
  use; over 1 ha in Zone 1; Zone 1 critical drainage areas, with sequential/exception test evidence (Category
  3).'
review-status: unverified
field-status: {}
