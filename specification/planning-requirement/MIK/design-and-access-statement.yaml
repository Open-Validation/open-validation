reference: design-and-access-statement
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: 1 or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: 100 square metres or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Plan:MK policies D1, D2, D3, D4, D5, CT2 and HN4
source-text: 'for major developments, or for the erection of 1 or more dwellings or for 100m2 or more
  of floorspace in a conservation area; a design and access statement; ... a design and access statement
  which explains the design principles and concepts that have been applied to the works, and how these
  principles and concepts take account of:'
must-include:
- item: The design principles and concepts applied
  level: must
- item: The steps taken to appraise the context and how the design takes it into account
  level: must
- item: The policy adopted on access and how access policies have been taken into account
  level: must
- item: Any consultation on access and what account has been taken of it
  level: must
- item: How specific issues that might affect access have been addressed
  level: must
- item: 'Listed building consent: how the design takes account of the building''s special interest, its
    physical features and its setting; and (unless interior works only) access alternatives, consultation
    and access policies'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 13, 19, 21, 24-25, 70.
review-status: unverified
field-status: {}
