source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policy D5
source-text: for development which is likely to have significant shading effects on existing residential
  property by way of its height, massing or proximity to boundaries or existing buildings; a daylight
  and sunlight assessment; ... In addition, in respect of proposals for the construction of additional
  storeys, the local planning authority may require sectional drawings and/or a daylight and sunlight
  assessment.
must-include:
- item: Visual representations of the shading effect on adjoining property and, where relevant, property
    within or next to the development
  level: must
- item: Following the tests in the BRE 'Site Layout Planning for Daylight and Sunlight'
  level: must
- item: Cross-referenced to floor plans and elevations near adjacent habitable windows, with the 45-degree
    line from the affected window(s) and from the verge or eaves line
  level: should
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 12, 16, 22, 69. 'Significant shading effects'
  is a judgement, so shown as 'check'.
review-status: unverified
field-status: {}
