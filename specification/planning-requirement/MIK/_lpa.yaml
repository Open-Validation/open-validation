submission-standards:
- item: Documents provided as PDF files (exceptions listed in Annex B, e.g. the housing accommodation
    schedule in .xls/.xlsx and the biodiversity metric as .xlsx with a PDF export)
  level: must
- item: Each file accurately, logically and clearly named (e.g. 'Site Layout - 9453_07 Rev A.pdf'); Planning
    Portal submissions named and categorised correctly
  level: must
- item: File sizes no more than 10MB; large documents such as Environmental Statements split by chapter,
    not simply by size
  level: should
- item: Documents provided editable ('unsecured') so sensitive information can be redacted
  level: must
- item: Personal data, including signatures, minimised in documents other than the application form
  level: should
- item: Documents to be treated in confidence marked accordingly, with exceptional justification
  level: must
- item: Plans drawn to a metric scale
  level: must
- item: 'Environmental Statements: copies for each affected Town or Parish Council on removable media
    or by secure file transfer'
  level: must
