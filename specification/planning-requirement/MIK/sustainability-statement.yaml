reference: sustainability-statement
local-authority: MIK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - condition:
      field: new-build
      value: true
      description: Creates new premises, commercial or residential.
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies SC1 and SC2
source-text: for all proposals creating new premises, both commercial and residential, a sustainability
  statement;
must-include:
- item: How the design and construction comply with sustainable design and construction policies and guidance
  level: must
- item: Layout and construction methods, landscaping, renewable energy, sustainable building materials
    and carbon neutrality
  level: must
- item: Justification where an element cannot meet the policy requirements
  level: must
- item: Positive environmental, social and economic implications, such as sustainable transport links
    and climate change mitigation
  level: should
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 20, 22, 84.
review-status: unverified
field-status: {}
