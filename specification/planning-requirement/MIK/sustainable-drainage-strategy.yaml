source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies FR1, FR2, FR3 and SC1
source-text: for developments providing new or extended buildings or creation of hard surfaces, a surface
  water management strategy;
must-include:
- item: Compliance with the Defra non-statutory technical standards (or why not)
  level: must
- item: Exceedance routes through the development
  level: must
- item: Treatment train components, with reasons for type, size and bank gradient
  level: must
- item: Design calculations for discharge rates, peak flow rates and storage, with evidence of ground
    conditions and permeability
  level: must
- item: Climate change and urban creep allowances
  level: must
- item: Outfall choice justified against the SuDS hierarchy
  level: must
- item: Temporary drainage during construction
  level: must
- item: How the system will be maintained for the lifetime of the development
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 83. The surface water management strategy;
  it can be part of a flood risk assessment.
