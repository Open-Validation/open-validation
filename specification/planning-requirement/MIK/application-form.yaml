reference: application-form
local-authority: MIK
required-if:
  always: true
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: the completed application form; ... the completed application form, including necessary statements
  relating to biodiversity net gain8;
must-include:
- item: Complete, accurate and on the latest version of the form (Planning Portal or the council's website)
  level: must
- item: The correct ownership certificate and declaration completed
  level: must
- item: A full but concise description of the building or engineering works and/or change of use, without
    opinion or reasons
  level: must
- item: 'Where biodiversity net gain is relevant: whether the biodiversity gain condition applies; the
    pre-development biodiversity value(s); any earlier date and the reasons for it; any degradation, with
    dates, values and evidence; any irreplaceable habitat'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - technical-details-consent
- item: A declaration of any connection to the Council, where the applicant is a councillor or member
    of staff
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 5-6, 58. The fee is a national requirement
  for most application types (no matching id).
review-status: unverified
field-status: {}
