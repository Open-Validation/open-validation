reference: recreation-facilities-assessment
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - any:
      - condition:
          field: loss-of-open-space
          value: true
          description: Loss of playing fields, public open space or amenity open space.
      - all:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Major residential development.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - s73
    - any:
      - condition:
          field: loss-of-open-space
          value: true
          description: Loss of playing fields, public open space or amenity open space.
      - all:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Major residential development.
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies L2, L3 and L4
source-text: for development leading to the loss of playing fields, public open space or amenity open
  space (whether publicly adopted or not), and for major applications for residential development (where
  the proximity to existing playing fields or public open space will need to be considered); a sports
  and/or open space analysis;
must-include:
- item: Existing sports facilities, playing fields and open space of public value nearby, relative to
    what is affected or lost, with justification
  level: must
- item: Evidence of marketing of the facility, where relevant
  level: must
  required-if: discretionary
- item: 'For playing fields: the extent of loss in hectares, the reason for the location and alternatives
    considered'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of playing fields.
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 16, 82. The sports and open space analysis.
