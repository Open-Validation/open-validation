reference: waste-management-plan
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - condition:
          field: structural-demolition
          value: true
          description: Significant demolition.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policy SC1; Waste DPD policy WDC2; Waste Management Plan for England
source-text: for major development and for developments with significant demolition involved, a site waste
  management plan;
must-include:
- item: How waste storage and collection can be accommodated
  level: must
- item: Waste reduction methods, use of recycled materials and dedicated recyclable waste storage space
  level: must
- item: Volumes and types of waste for the construction and operational phases
  level: must
- item: A swept path drawing where refuse vehicles will enter the site
  level: must
- item: Any potentially hazardous or polluting waste generated, stored and disposed of
  level: must
- item: 'Prior approval: the management and location of domestic waste storage and collection'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 20, 22, 46, 81. The site waste management
  plan.
review-status: unverified
field-status: {}
