source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies FR1, FR2 and FR3
source-text: for certain forms of development within flood zone 2 or 3, or where the site exceeds 1 hectare
  in site area in flood zone 1, a flood risk assessment supported by evidence for the sequential test
  and the exception test where necessary;
must-include:
- item: All sources of flood risk to and from the site managed now and over the lifetime, allowing for
    climate change and urban creep
  level: must
- item: Whether the development is likely to be affected by current or future flooding, and whether it
    increases flood risk elsewhere
  level: must
- item: Whether the proposed measures are appropriate
  level: must
- item: Evidence for the Sequential Test and, if necessary, the Exception Test
  level: must
- item: Accompanied by a surface water management strategy
  level: must
- item: Regard to part E of policy FR1 (Critical Drainage Catchments)
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 42-46, 73. 'Certain forms of development'
  in Flood Zones 2 and 3 is shown as the flood zone itself. Also needed for some prior approvals (additional
  storeys in Flood Zone 2 or 3 or with critical drainage problems, campsites in Flood Zone 2 or 3, film-making)
  and where constraints raise concern.
