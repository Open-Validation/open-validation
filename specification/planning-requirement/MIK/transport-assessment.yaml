- item: The proposed development and site layout, especially access and layout for all modes
  level: must
- item: Neighbouring uses, amenity and character, and the functional classification of nearby roads
  level: must
- item: Existing public transport provision and frequency, and proposed changes
  level: must
- item: 'Travel characteristics: movements across all modes from the development and near the site'
  level: must
- item: Likely trips from committed development in the area
  level: must
- item: Current traffic flows on links and at junctions, and critical links and junctions
  level: must
- item: Injury accident records near the site access for the most recent 5 years
  level: must
- item: Environmental impacts of transport, especially near AQMAs or noise sensitive areas
  level: must
- item: Accessibility improvements, parking facilities and strategy, ways of reducing the need to travel,
    and mitigation of residual impacts
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 46, 85-87. Annex C sets a transport statement
  from the lower threshold and a transport assessment above the higher one. Sui generis uses, and transport
  statements for prior approvals where constraints raise concern, are shown as 'check'. Where flexible
  or hybrid uses are proposed, the lowest threshold of any proposed use applies.
