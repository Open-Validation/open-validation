reference: landscaping-plan
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK
source-text: for major developments, topic-based plans showing hard and soft landscaping, facing materials
  for buildings, enclosures/boundary treatments and swept path drawings for refuse and service vehicles;
  ... where landscaping is to be considered, a landscaping plan to show the hard surfacing, boundary treatments,
  earthworks and planting proposals across the site, along with relevant sections and elevations as relevant;
must-include:
- item: At 1:200 or 1:500 (metric), ideally on a topographical survey base
  level: must
- item: Layout of the development, trees and hedgerows to be retained, water bodies and sustainable drainage
    features
  level: must
- item: Boundary treatments/enclosures and hard landscaping materials
  level: must
- item: 'Soft landscaping specifications: species, standard, number and planting intervals'
  level: must
- item: Location and amount of play, sports and open space facilities
  level: must
- item: Ecological enhancement measures (not sensitive locations of protected habitats) and climate change
    adaptation measures
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 14, 18-19, 22, 60. For outline applications
  it is national where landscaping is to be considered; for reserved matters, as relevant to the matters
  applied for (both shown as 'check').
review-status: unverified
field-status: {}
