reference: viability-assessment
local-authority: MIK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - s73
      - mod-discharge-s106
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Affordable housing below the Development Plan requirement.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Financial contributions below the Development Plan requirement.
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policy INF1
source-text: where the level of affordable housing or financial contributions fall below that required
  by Development Plan policies; an ‘open book’ viability appraisal (also see paragraphs 1.25 and 1.26);
must-include:
- item: Open book, using the latest BCIS build costs and local property values, with profit reflecting
    risk and tenure mix
  level: must
- item: Following the standardised inputs to viability assessment
  level: must
- item: Abnormal and site-specific infrastructure costs supported by tender costs and/or a quantity surveyor's
    schedule
  level: must
- item: An undertaking by the applicant to cover the Council's costs of an independent viability consultant
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 16, 50, 54, 86. Viability assessments are
  expected to be published (paragraphs 1.25-1.26).
review-status: unverified
field-status: {}
