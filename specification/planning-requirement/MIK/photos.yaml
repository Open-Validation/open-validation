reference: photos
local-authority: MIK
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - consent-under-tpo
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
source-text: site photos, particularly for proposed side or rear extensions or alterations; ... for works
  involving the pruning of trees; as a minimum, recent photos or diagrams marked with pruning points,
  crown lifting height and/or extent of crown reduction, but ideally an arboricultural impact assessment;
must-include:
- item: Up-to-date photos showing the proposal's location in the context of its surroundings, high-resolution
    and labelled, in a single PDF
  level: must
- item: A site location or block plan showing where each photo was taken and the angle of view
  level: must
- item: 'Trees: a general view of the whole tree (trunk from ground to crown) from three evenly spaced
    aspects, and detailed photos of specific features'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: 'Tree pruning: pruning points, crown lifting height and/or extent of crown reduction marked'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9, 30-31, 62. TPO pruning is shown as 'check'
  (photos or diagrams are the minimum). For works to trees in a conservation area marked photos are 'strongly
  encouraged'.
review-status: unverified
field-status: {}
