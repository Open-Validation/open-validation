reference: location-plan
local-authority: MIK
required-if:
  application-type:
    in:
    - hh
    - pa-extension
    - pa-storey
    - full
    - outline
    - pip
    - technical-details-consent
    - lbc
    - demolition-con-area
    - advertising
    - consent-under-tpo
    - hedgerow-removal
    - prior-approval
    - ldc
    - mod-discharge-s106
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: a site location plan;
must-include:
- item: Based on up-to-date Ordnance Survey data, accurately showing surrounding property and roads
  level: must
- item: At 1:1250 or 1:2500 (1:5000 or 1:10000 in exceptional circumstances), metric
  level: must
- item: The direction of north
  level: must
- item: The site outlined in red, including all land necessary to carry out the development (e.g. access
    from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: Any other land within the applicant's control outlined in blue
  level: must
- item: No sensitive locations of existing protected habitats (such as badger setts)
  level: must
- item: A linear scale bar
  level: should
- item: 'Tree works: the tree or trees (and species) to which the application relates'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: 'Hedgerow removal: the hedgerow(s) to be removed'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
- item: 'Planning obligations: the land to which the planning obligation relates'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
- item: 'Existing-use certificates claiming multiple uses, works or operations: each component shaded,
    outlined or hatched in different colours'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-existing-use
    - discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9-54, 62. Not needed for reserved matters,
  variation of condition, non-material amendment or approval of details. For works to trees in a conservation
  area it is 'strongly encouraged' (identifying the trees as T1, T2 etc.).
review-status: unverified
field-status: {}
