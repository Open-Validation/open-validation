reference: roof-plan-proposed
local-authority: MIK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - technical-details-consent
      - lbc
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The application changes the approved plans (minor material amendment or non-material
          amendment to designs).
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: existing and proposed roof plans; ... proposed roof plans;
must-include:
- item: At 1:100 or 1:200 (metric), showing the roof slopes from a bird's eye view
  level: must
- item: Proposed materials indicated
  level: should
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9-52, 61. Also proposed roof plans for amendments
  to designs. The PAVR says local items are 'likely to be required' and are requested case by case; the
  council can waive them.
review-status: unverified
field-status: {}
