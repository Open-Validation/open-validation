reference: planning-statement
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development: 1 to 9 dwellings, under 1,000 sq m of floorspace, or a site
            under 1 hectare.'
  - application-type:
      in:
      - s73
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Whole of Plan:MK, Minerals Local Plan and Waste Development Plan DPD
source-text: for major and minor developments; a planning statement; ... a planning statement setting
  out the reasons for the application;
must-include:
- item: The context and need for the development, and how it accords with Plan:MK, any Neighbourhood Plan,
    SPDs and SPGs, the NPPF and PPG
  level: must
- item: Consideration of emerging planning policies
  level: must
- item: Details of any pre-application advice or consultation
  level: must
- item: 'Variation of condition: the reasons for the application'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: 'Non-material amendment removing or altering conditions: the basis for the application and why
    the effect would be non-material'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 14, 19, 22, 49, 52, 79. For prior approvals
  the council recommends a planning statement on lawfulness (not a requirement). Non-material amendments
  that remove or alter conditions show as 'check'.
review-status: unverified
field-status: {}
