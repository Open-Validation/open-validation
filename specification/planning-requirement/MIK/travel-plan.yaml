policy: Plan:MK policies CT3, CT6 and CT10
source-text: for development likely to generate notable use of or demand for sustainable modes of transport;
  a framework travel plan;
must-include:
- item: Methods to promote sustainable modes of transport by occupiers and users, including new public
    transport provision
  level: must
- item: Takes account of the scale and trip generation, existing transport use and public transport, nearby
    attractions and sensitive areas, other strategies, cumulative impacts and particular impacts to focus
    on
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 74, 87. The framework travel plan. Annex
  C sets the same thresholds as for a transport assessment.
