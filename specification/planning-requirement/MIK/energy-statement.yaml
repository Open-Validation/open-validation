reference: energy-statement
local-authority: MIK
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres or more of floorspace.
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK SC3
source-text: 'Energy and climate statement: for development of 11 or more dwellings or 1,000 square metres
  or more of floorspace'
must-include:
- item: A 19% carbon reduction improvement over Part L of the Building Regulations 2013 (or any higher
    standard later required)
  level: must
- item: On-site renewable energy generation or connection to a low carbon community energy network achieving
    a further 20% reduction
  level: must
