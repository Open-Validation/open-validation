reference: energy-statement
local-authority: MIK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 square metres or more of floorspace.
