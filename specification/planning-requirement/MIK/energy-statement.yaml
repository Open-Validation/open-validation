policy: Plan:MK policies SC1, SC2 and SC3
source-text: for development of 11 or more dwellings or 1,000 square metres or more of floorspace, an
  energy and climate statement;
must-include:
- item: How the development achieves a 19% carbon reduction over Part L of the Building Regulations 2013
    (or any higher standard later required)
  level: must
- item: On-site renewable energy or connection to a low carbon community energy network achieving a further
    20% reduction
  level: must
- item: Compliance with the rest of part K of policy SC1, unless exempt under part A
  level: must
