source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies D1, D2, D3, NE3, NE4 and NE5
source-text: for proposals affecting protected or significant trees, an arboricultural survey; ... for
  development influenced by protected, veteran, significant or a high number of trees and/or priority
  or important hedgerows; an arboricultural impact assessment; ... for works involving the removal of
  trees; an arboricultural impact assessment;
must-include:
- item: Prepared by a qualified arboriculturist in line with the current British Standard (BS 5837)
  level: must
- item: 'Arboricultural survey: trees and relevant hedgerows plotted on a layout plan, with their value,
    condition, health and longevity in a cross-referenced schedule'
  level: must
- item: 'How development and trees will co-exist: root protection, level changes, services and material
    storage'
  level: must
- item: Future issues, such as pruning or removal because of shade or encroachment
  level: must
- item: A tree constraints plan
  level: must
- item: 'A tree protection plan: trees and hedgerow retained or removed, protective fencing and signage,
    ground protection and special construction techniques'
  level: must
confidence: medium
notes: 'From the council''s list (adopted 12 March 2025), page 9, 15, 30, 49, 67. Householder: an arboricultural
  survey where protected or significant trees are affected. TPO applications: an AIA for removal (and
  ideally for pruning), shown as ''check''. Variations of condition: an update where the original is more
  than 5 years old.'
review-status: unverified
field-status: {}
