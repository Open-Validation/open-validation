        - discretionary
  - any:
    - all:
      - application-type:
          in:
          - full
          - technical-details-consent
      - any:
        - site:
            in:
            - tree-preservation-zone
            description: Protected trees.
        - condition:
            field: veteran-trees
            value: true
            description: Veteran trees.
        - condition:
            field: hedgerows-affected
            value: true
            description: Priority or important hedgerows.
        - all:
          - condition:
              field: trees-on-or-near-site
              value: true
              description: Significant or a high number of trees.
          - discretionary
    - all:
      - application-type:
          in:
          - outline
          - reserved-matters
          - s73
      - any:
        - site:
            in:
            - tree-preservation-zone
            description: Protected trees.
        - condition:
            field: veteran-trees
            value: true
            description: Veteran trees.
        - condition:
