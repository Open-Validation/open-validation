reference: sci
local-authority: MIK
required-if:
  any:
  - any:
    - condition:
        field: wind-turbine-count
        operator: '>='
        value: 2
        description: 2 or more wind turbines.
    - condition:
        field: turbine-hub-height
        operator: '>'
        value: 15
        description: A turbine hub height over 15 metres.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - ref: major-development
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Sections 61W and 61X, Town and Country Planning Act 1990; whole of Plan:MK; Milton Keynes Statement
  of Community Involvement
source-text: For applications for the installation of 2 or more wind turbines or a single turbine where
  the hub height exceeds 15 metres; a statement of community involvement. ... for major developments;
  a statement of community involvement;
must-include:
- item: How local communities and stakeholders (local authorities, statutory undertakers, consultees and
    surrounding businesses) were engaged and consulted
  level: must
- item: How responses have shaped the proposals
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 13-14, 19, 22, 82.
review-status: unverified
field-status: {}
