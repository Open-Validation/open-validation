    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policy HE1
source-text: for development affecting an archaeological entry (historic site) on the Historic Environment
  Record; an archaeological desk-based assessment, geophysical survey and/or field evaluation as appropriate;
must-include:
- item: Analysis of the Historic Environment Record as a minimum
  level: must
- item: The nature and extent of any further pre-determination works, such as geophysical survey or field
    evaluation
  level: must
- item: 'For field evaluation: a proposed written scheme of investigation'
  level: must
  required-if: discretionary
- item: Geophysical survey, where appropriate, using the most suitable technique (magnetometry, electrical
    resistance or ground penetrating radar)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 67, 74. Desk-based assessment, geophysical
  survey and/or field evaluation as appropriate.
