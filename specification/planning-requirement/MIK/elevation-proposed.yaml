reference: elevation-proposed
local-authority: MIK
required-if:
  any:
  - application-type:
      in:
      - hh
      - pa-storey
      - full
      - technical-details-consent
      - lbc
      - reserved-matters
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The application changes the approved plans (minor material amendment or non-material
          amendment to designs).
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  Town and Country Planning (Control of Advertisements) (England) Regulations 2007
source-text: existing and proposed elevation drawings; ... elevation drawings of the sign(s)/advert(s);
must-include:
- item: At 1:100 or 1:200 (metric)
  level: must
- item: The accurate position of all windows and doors
  level: must
- item: Elevations hidden by another elevation shown separately with the obscuring elevation removed
  level: must
- item: Proposed materials and obscure glazing indicated
  level: should
- item: 'Additional storeys prior approval: the position and dimensions of the proposed windows'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
- item: 'Proposed-use certificates: enough detail to assess all relevant limitations and conditions (e.g.
    dimensions, glazing types, whether materials match the existing)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
- item: 'Illuminated advertisements: specification of the method of proposed lighting'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated signage.
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9-52, 59. Also elevation drawings of signs
  for advertisement consent and proposed elevations for amendments to designs. The PAVR says local items
  are 'likely to be required' and are requested case by case; the council can waive them.
review-status: unverified
field-status: {}
