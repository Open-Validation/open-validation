reference: bng-metric
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - technical-details-consent
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the biodiversity gain condition.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 square metres or more of floorspace.
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Environment Act 2021; Plan:MK policies NE1, NE2, NE3 and NE5
source-text: for development where the biodiversity gain condition applies, a biodiversity impact assessment
  metric; ... for development of 5 or more dwellings or 1,000 square metres or more of floorspace where
  the biodiversity gain condition does not apply, a biodiversity impact assessment metric;
must-include:
- item: On the latest national calculation tool
  level: must
- item: Provided both as an .xlsx file and as a 'fit to page' publishable .pdf export
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 13, 19, 22, 49, 68. The Biodiversity Impact
  Assessment Metric (BIAM). National where the biodiversity gain condition applies (householder and other
  exempt applications are exempt by law); the council also asks for it locally for 5 or more dwellings
  or 1,000 sq m or more where the condition doesn't apply, including at reserved matters and for variations
  of condition (an updated metric).
review-status: unverified
field-status: {}
