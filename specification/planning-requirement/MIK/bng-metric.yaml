reference: bng-metric
local-authority: MIK
required-if:
  all:
  - application-type:
      in:
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 square metres or more of floorspace.
