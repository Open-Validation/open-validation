reference: floor-plan-proposed
local-authority: MIK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - technical-details-consent
      - lbc
      - reserved-matters
  - all:
    - application-type:
        in:
        - pa-storey
        - pa-flats-de-blocks
        - pa-flats-de-comm
        - pa-flats-terr-comm
        - pa-flats-de-dwh
        - pa-flats-terr-dwh
    - condition:
        field: building-works
        value: true
        description: Additional storeys.
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The application changes the approved plans (minor material amendment or non-material
          amendment to designs).
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: existing and proposed floor plans; ... proposed floor plans;
must-include:
- item: At 1:50 or 1:100 (metric), showing the internal layout and the use of each space
  level: must
- item: The position of windows and doors on all external elevations
  level: must
- item: 'For dwellinghouses and flats: the gross internal area (GIA) of each unit, calculated using the
    Nationally Described Space Standard'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Dwellings or flats.
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9-52, 60. Also proposed floor plans for minor
  material and non-material amendments to designs. For the larger home extension prior approval, floor
  plans are 'strongly recommended'. The PAVR says local items are 'likely to be required' and are requested
  case by case; the council can waive them.
review-status: unverified
field-status: {}
