reference: heritage-statement
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - listed-building-setting
        description: Affects a listed building, its curtilage or setting.
  - any:
    - all:
      - application-type:
          in:
          - full
          - technical-details-consent
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - scheduled-monument
          - park-and-garden
          - locally-listed-building
          description: Affects a designated or non-designated heritage asset, including its setting.
    - all:
      - application-type:
          in:
          - outline
          - reserved-matters
          - s73
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - scheduled-monument
          - park-and-garden
          - locally-listed-building
          description: Affects a designated or non-designated heritage asset, including its setting.
      - discretionary
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
  - application-type:
      in:
      - demolition-con-area
  - all:
    - application-type:
        in:
        - prior-approval
    - site:
        in:
        - conservation-area
        description: In a conservation area, with change of use of the ground floor.
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policy HE1
source-text: for proposals affecting a listed building (including its curtilage or the setting of), a
  heritage impact assessment; ... for development affecting a designated or non-designated heritage asset,
  including the setting of assets; a heritage impact assessment; ... a heritage impact assessment where
  the proposed works are likely to have a notable effect on, or loss of, the significance of the listed
  building.
must-include:
- item: 'Documents on the asset: listing entry or conservation area character statement, historic environment
    record, New Town Heritage Register, historical maps and photographs, publications and archives'
  level: must
- item: A description of the asset(s) and setting, including important views
  level: must
- item: A summary of significance (architectural, archaeological, artistic or historical), using Historic
    England's Conservation Principles
  level: must
- item: 'Justification: need, alternatives, public benefits, harm or risk, avoidance or mitigation, and
    suitability of scale, design and materials'
  level: must
- item: 'Listed buildings: whether the works also meet other regulations such as Building Regulations'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Enabling development: implications and a viability appraisal'
  level: must
  required-if: discretionary
- item: 'Relevant demolition: justification having regard to significance and the effect on the conservation
    area, including any restoration of the site; the building volume, or the height of gates, fences,
    walls or railings'
  level: must
  required-if:
    application-type:
      in:
      - demolition-con-area
confidence: medium
notes: 'From the council''s list (adopted 12 March 2025), page 10, 15, 26, 28, 46, 75. The heritage impact
  assessment. Listed building consent: where the works are likely to have a notable effect on significance
  (shown as ''check'').'
review-status: unverified
field-status: {}
