source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policy NE6
source-text: for development influenced by an area of known contamination, a land contamination assessment;
must-include:
- item: Current and historical uses of the site and land next to it, including nearby landfill
  level: must
- item: Gas monitoring data if necessary
  level: must
  required-if: discretionary
- item: 'In line with BS 10175: a desktop study and ground survey with trial bore holes and pits where
    necessary'
  level: must
- item: Measures to remediate or mitigate the findings so no new pollutant-pathway-receptor linkage is
    created
  level: must
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 46, 76. Phase 1 site investigation.
