reference: site-plan
local-authority: MIK
required-if:
  any:
  - application-type:
      in:
      - hh
      - pa-extension
      - pa-storey
      - full
      - reserved-matters
      - technical-details-consent
      - demolition-con-area
      - advertising
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The application changes the approved plans (minor material amendment or non-material
          amendment to designs).
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: an existing and proposed layout plan, accurately showing the position of adjoining properties
  and their windows; ... existing and proposed layout plans, accurately showing the position of adjoining
  properties and their windows, as well as any provision or alteration of a vehicular access, parking
  spaces hard surfaces, boundary treatments and landscaping;
must-include:
- item: 'Layout plan at 1:200 or 1:500 (metric), ideally on a topographical survey base: the layout, means
    of access, existing buildings within and next to the site (including windows on neighbouring homes),
    trees and hedgerows, hard and soft landscaping, water bodies, boundary treatments, roads and rights
    of way'
  level: must
- item: 'Block plan (where a block plan is asked for): 1:200 or 1:500, showing the footprint of the proposal,
    existing built footprint, site boundaries and neighbouring buildings and roads'
  level: must
- item: A linear scale bar
  level: should
- item: 'Householder vehicular access: the position of the lowered kerb and hard surfaces in the public
    highway, with the materials and drainage of any driveway'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-vehicle-access
        value: true
        description: Provision or alteration of a vehicular access.
- item: 'Larger home extension prior approval: the proposed extension and any existing extension it joins'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Outline: where access, layout or scale is to be considered, the access points and their setting
    out; the position of routes, buildings, parking, drainage features and open spaces; maximum ridge
    and eaves heights'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - outline
    - discretionary
- item: 'Relevant demolition: the building(s) and/or gates, fences, walls or railings to be demolished'
  level: must
  required-if:
    application-type:
      in:
      - demolition-con-area
- item: 'Advertisements: the position of the proposed signs on the site and/or building(s)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Proposed-use certificates: dimensions of the development, site boundaries and ancillary features
    such as parking, circulation and amenity areas'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
- item: 'Prior approval: any curtilage to be created and the position of adjoining properties and their
    windows'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9-52, 59-60. Layout plan or block plan. For
  outline applications the layout plan is a national item where access, layout or scale is to be considered
  (shown as 'check'). The PAVR says local items are 'likely to be required' and are requested case by
  case; the council can waive them.
review-status: unverified
field-status: {}
