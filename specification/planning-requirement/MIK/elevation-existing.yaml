reference: elevation-existing
local-authority: MIK
required-if:
  any:
  - application-type:
      in:
      - hh
      - pa-storey
      - full
      - technical-details-consent
      - lbc
      - reserved-matters
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: operational-development
        value: true
        description: A proposed-use certificate involving extensions, alterations or other operational
          development.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: existing and proposed elevation drawings;
must-include:
- item: At 1:100 or 1:200 (metric)
  level: must
- item: The accurate position of all windows and doors
  level: must
- item: Elevations hidden by another elevation shown separately with the obscuring elevation removed
  level: must
- item: Proposed materials and obscure glazing indicated
  level: should
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 9-48, 59. Existing elevations only where
  there is an existing building. The PAVR says local items are 'likely to be required' and are requested
  case by case; the council can waive them.
review-status: unverified
field-status: {}
