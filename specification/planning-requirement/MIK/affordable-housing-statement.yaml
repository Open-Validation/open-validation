reference: affordable-housing-statement
local-authority: MIK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
    - any:
      - condition:
          field: outside-urban-area
          value: true
          description: Outside settlement boundaries.
      - condition:
          field: affordable-housing-percent
          operator: '>'
          value: 31
          description: Providing more than 31% affordable housing.
  - all:
    - application-type:
        in:
        - outline
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
  - all:
    - application-type:
        in:
        - s73
        - mod-discharge-s106
    - condition:
        field: affordable-housing-percent
        operator: '>'
        value: 31
        description: The changes result in more than 31% affordable housing.
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies HN1, HN2, HN3, HN4, HN5, HN8, HN10, HN11 and HN12; Affordable Housing SPD
source-text: for major residential developments outside of settlement boundaries or providing more than
  31% affordable housing, a housing statement; ... for major residential developments, a housing statement;
  ... for changes which result in the development providing more than 31% affordable housing, a housing
  statement;
must-include:
- item: The overall mix of housing tenures and provision of accessible and adaptable homes
  level: must
- item: A housing accommodation schedule
  level: must
- item: Any arrangements with social housing providers
  level: should
- item: Justification where tenure proportions or mix deviate from the Strategic Housing Market Assessment
  level: should
- item: 'Full and reserved matters: a layout plan showing the location of market and affordable housing'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Any innovative design and construction methods, and other information affecting affordable housing
    or mix
  level: should
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 14, 20, 49, 54, 76. The council's 'housing
  statement'.
review-status: unverified
field-status: {}
