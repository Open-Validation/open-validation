source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Plan:MK policies NE1, NE2 and NE3
source-text: for development within or influencing a site of nature conservation importance, site of special
  scientific interest, local nature reserve, regionally important geological site, locally important geological
  site or local wildlife site, or has suitable habitat for protected and priority species; a preliminary
  ecological appraisal (inclusive of further targeted survey work for protected species where necessary);
must-include:
- item: Desk-based assessment and site walkover identifying designated areas and habitats of ecological
    or geological interest
  level: must
- item: Habitat on and next to the site, and the potential for protected or priority species or habitat
  level: must
- item: Significance of the habitats and the on- and off-site impacts during construction and occupation
  level: must
- item: Measures to avoid, mitigate or compensate for adverse impacts, and a demonstrated net gain in
    biodiversity
  level: must
- item: An Ecological Impact Assessment (EcIA) in line with British Standards, with an Ecological Constraints
    and Opportunities Plan (ECOP)
  level: must
- item: Further targeted (phase 2) surveys, such as bats or nesting birds, where the appraisal shows they
    are needed
  level: must
  required-if: discretionary
- item: Great Crested Newt District Licensing Scheme reports and/or licence, where entering the scheme
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 15, 20, 49, 80. The preliminary ecological
  appraisal (PEA). For variations of condition, an update is likely where the original appraisal is more
  than 2 years old (shown as 'check').
