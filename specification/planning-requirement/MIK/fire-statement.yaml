reference: fire-statement
local-authority: MIK
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 storeys or more.
source-url: https://www.milton-keynes.gov.uk/file/19351/download?token=flfqBbYj
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (as amended); Plan:MK policies D1, D2, D3 and CT2
source-text: for development involving or within a curtilage of a ‘relevant building’ where dwellings
  or educational accommodation are being provided, and where the building is 7 storeys or 18 metres or
  more in height, a fire statement10;
must-include:
- item: On the standard form (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How planning policies on fire safety have been taken into account
  level: must
- item: 'For additional storeys on existing buildings: a report from a chartered engineer or other competent
    professional that the external wall construction complies with paragraph B4(1) of Schedule 1 to the
    Building Regulations 2010'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
confidence: medium
notes: From the council's list (adopted 12 March 2025), page 13, 21, 24, 35, 42-43, 72.
review-status: unverified
field-status: {}
