reference: arboriculturist-report
local-authority: HOR
required-if:
  all:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the site or on adjacent land that could influence or be affected by the development.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Horsham District Planning Framework policies 30 and 31; BS5837 Trees in relation to design, demolition
  and construction
source-text: Sites where there are trees within the application site, or on land adjacent to it that could
  influence or be affected by the development (including street trees). ... For minor and major applications
  where trees might be affected, the application needs to be accompanied by a Tree Survey and Arboricultural
  Impact Assessment including appropriate tree protection measures.
must-include:
- item: Tree survey and arboricultural impact assessment following the current BS5837
  level: must
- item: Which trees are retained, and the means of protecting them during construction works (tree protection
    measures)
  level: must
- item: Prepared by a person with relevant education, training and experience in trees in relation to
    construction
  level: should
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''Local requirements: Tree survey/arboricultural impact assessment''. For householder applications a
  block plan with the trees identified and measured is enough (see site-plan). ''Minor and major applications''
  are shown as full, outline and reserved matters applications.'
review-status: unverified
field-status: {}
