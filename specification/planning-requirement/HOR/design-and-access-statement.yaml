reference: design-and-access-statement
local-authority: HOR
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 square metres or more of floorspace.
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Part 2, Article
  9
source-text: Required for all major developments and all development within a Conservation Area consisting
  of the provision of one or more dwelling houses and/or the provision of a building or buildings where
  the floor space created by the development is 100 square metres or more.
must-include:
- item: The design principles and concepts applied to the development, and how issues relating to access
    to the development have been dealt with
  level: must
- item: Details relating to amount, layout, scale, appearance, landscaping and use
  level: should
- item: Proportionate to the complexity of the application
  level: must
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''National requirements: Design and Access Statement''. The council''s Design and Access Statement guidance
  notes give more detail.'
