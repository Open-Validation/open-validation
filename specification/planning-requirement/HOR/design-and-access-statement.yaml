reference: design-and-access-statement
local-authority: HOR
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The development is within a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The development provides one or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The floor space created is 100 square metres or more.
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
source-text: Article 11 Design and Access Statement Required for all major developments and all development
  within a Conservation Area consisting of the provision of one or more dwelling houses and/or the provision
  of a building or buildings where the floor space created by the development is 100 square metres or
  more.
confidence: medium
review-status: unverified
field-status: {}
