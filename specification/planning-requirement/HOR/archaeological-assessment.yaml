reference: archaeological-assessment
local-authority: HOR
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In a Red or Amber Archaeological Notification Area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.2
          description: Any development over 0.2 ha.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.2
          description: Any development over 0.2 ha.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In a Red or Amber Archaeological Notification Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 or more new residential units.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In a Red Archaeological Notification Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: 1 or more new or replacement residential units.
    - discretionary
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In an Archaeological Notification Area.
    - site:
        in:
        - scheduled-monument
        description: Within or adjacent to a Scheduled Ancient Monument.
    - discretionary
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In a Red Archaeological Notification Area.
    - condition:
        field: church-curtilage
        value: true
        description: Within a historic church or churchyard.
    - condition:
        field: ground-disturbance
        value: true
        description: Residential development involving any below ground activity.
    - discretionary
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: Any development over 0.5 ha (outside an Archaeological Notification Area).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.5
      description: Any development over 0.5 ha (outside an Archaeological Notification Area).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more new residential units (outside an Archaeological Notification Area).
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
source-text: 'An archaeological desk-based assessment, which should include a recent search of the Historic
  Environment Record at West Sussex County Council (WSCC), should be submitted for all applications falling
  within the following boundaries. ... Within a Red Archaeological Notification Area: Any development
  over 0.2ha, residential development involving any below ground activity within a Scheduled Ancient Monument
  or Historic Church or Churchyard, and development involving 1 or more new replacement residential units
  ... Within an Amber Archaeological Notification area: Any development over 0.2ha, 5 or more new residential
  units, and sites within or adjacent to Scheduled Ancient Monuments ... Outside of an Archaeological
  Notification Area: Any development over 0.5ha in area, and development involving 10 or more new residential
  units'
must-include:
- item: A recent search of the West Sussex County Council Historic Environment Record
  level: should
- item: The heritage assets assessed using appropriate expertise where necessary
  level: should
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''Local requirements: Heritage Environment Record (HER) Search''. Conditions that only apply in Red
  Archaeological Notification Areas (1 or more new or replacement homes; below-ground residential works
  in a historic churchyard) show as ''check'' because the map doesn''t yet tell Red from Amber. Sites
  within or adjacent to a Scheduled Ancient Monument also show as ''check'' (Amber: any such site; Red:
  residential below-ground works only).'
review-status: unverified
field-status: {}
