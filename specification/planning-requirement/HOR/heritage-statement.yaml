reference: heritage-statement
local-authority: HOR
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      description: 'Directly or indirectly affects a designated or non-designated heritage asset: listed
        building or its setting, conservation area, scheduled monument, registered park or garden, or
        locally listed building.'
  - discretionary
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: National Planning Policy Framework paragraph 207; Horsham District Planning Framework policy 34
source-text: Required when proposed works would directly or indirectly impact a heritage asset, designated
  and non-designated.
must-include:
- item: The potential impact of the proposal on the significance of the heritage assets, proportionate
    to the assets’ importance
  level: must
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''Local requirements: Heritage Statement''. Other indirect impacts and other non-designated heritage
  assets show as ''check''.'
