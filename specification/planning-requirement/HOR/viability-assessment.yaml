reference: viability-assessment
local-authority: HOR
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major applications of 10 or more dwellings.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant says they cannot provide the full range of S106 requirements, including
        affordable housing, for viability reasons.
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: National Planning Policy Framework; Planning Practice Guidance (viability); RICS Guide to Planning
  and Viability (GN 94/2012)
source-text: Required for Major applications of 10 or more residential dwellings where an applicant is
  proposing that they cannot provide the full range of S106 requirements, which includes affordable housing,
  due to financial viability issues.
must-include:
- item: Completed in accordance with the standards set out in the Planning Practice Guidance
  level: must
- item: Shows the scheme is deliverable with the proposed level of planning obligations
  level: should
- item: Accompanied by an agreement that the applicant will pay the reasonable costs of an independent
    appraisal
  level: must
- item: 'Any request to withhold specific inputs on grounds of commercial confidentiality: fully evidenced
    reasoning for each piece of information'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''Local requirements: Financial Viability Appraisal/Assessment''. Viability assessments are published
  for public scrutiny.'
