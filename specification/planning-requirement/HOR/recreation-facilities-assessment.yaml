reference: recreation-facilities-assessment
local-authority: HOR
required-if:
  any:
  - site:
      in:
      - open-space
      description: Within open space, including playing fields and bowling greens.
  - condition:
      field: loss-of-open-space
      value: true
      description: Affects or results in the loss of open space.
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Horsham District Planning Framework policy 32
source-text: Required for applications within or affecting open spaces, including the loss of openspace,
  playing fields, bowling green’s etc.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the application
    site
  level: must
- item: An independent assessment showing the land or buildings are surplus to local requirements
  level: must
