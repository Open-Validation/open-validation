submission-standards:
- item: Drawings to a recognised metric scale
  level: must
- item: A north figure and a scale bar always included; the wording 'do not scale' not used
  level: must
- item: 'Electronic submissions: page size matches the size the plan is noted as drawn to'
  level: must
- item: 'Electronic submissions: all documents and plans capable of being accessed by the recipient and
    legible in all material respects'
  level: must
- item: 'Electronic submissions: only one copy of each document or plan'
  level: must
- item: 'Hard copy submissions: two copies of the application form, plans and supporting documents; for
    major applications two hard copies plus one electronic copy'
  level: must
- item: 'Large scale development: documents and plans can be provided via USB/FTP'
  level: should
- item: Where the applicant considers an item of information is not required, this is clearly set out
    in the submission
  level: should
- item: Revised details accompanied by a written explanation clearly setting out the proposed changes
  level: must
