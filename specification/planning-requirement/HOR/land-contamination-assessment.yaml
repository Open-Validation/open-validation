reference: land-contamination-assessment
local-authority: HOR
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on the site.
  - discretionary
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: National Planning Policy Framework section 15; Horsham District Planning Framework policy 24
source-text: Where contamination is known or suspected or the development site is in the vicinity of such
  land, a report with a desk study listing current and historic uses of the site and adjoining land, together
  with a site reconnaissance shall be provided, to determine the likelihood of contamination.
must-include:
- item: A desk study listing current and historic uses of the site and adjoining land
  level: must
- item: A site reconnaissance
  level: must
