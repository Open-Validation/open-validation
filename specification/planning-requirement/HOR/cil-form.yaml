reference: cil-form
local-authority: HOR
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The proposal creates new floorspace, including residential extensions.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates one or more new dwellings (of any size).
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use (the form declares whether there is any CIL liability).
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Horsham District Planning Framework policy 39; Horsham CIL Charging Schedule
source-text: Where relevant and in order to calculate CIL liability the Additional Information Requirement
  form will to be submitted. See Appendix 1 for further information. ... There will be a significant number
  of applications where an Additional Information Requirement form should be submitted, but where there
  will be no liability for CIL, if this is the case it is still necessary to complete a form so that a
  declaration of this is made and on record. This will be the case for almost all changes of use without
  any additional floor space, for example. ... The Community Infrastructure Levy Additional Information
  Form will be required for all applications for development of floor space (including residential extensions,
  for the creation of a new dwellings (of any size), or for the conversion of a new building no longer
  in use.)
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''Local requirements: Community Infrastructure Levy - Additional Information Requirement Form; Appendix
  1''. The form is needed whenever floorspace or a dwelling is created, not only above the CIL liability
  thresholds (net additional floorspace over 100 sq m, or one or more new dwellings), because the council
  wants a declaration on record even where nothing is payable. Appendix 1 says this includes almost all
  changes of use without additional floorspace.'
