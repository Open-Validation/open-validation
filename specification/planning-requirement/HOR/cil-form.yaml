reference: cil-form
local-authority: HOR
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The proposal creates new floorspace, including householder extensions.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates one or more new homes.
source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
source-text: DistrictPlanning Framework Community Infrastructure Levy – Additional Information Requirement
  Form Where relevant and in order to calculate CIL liability the Additional Information Requirement form
  will to be submitted.
confidence: medium
notes: 'Horsham asks for its CIL Additional Information form ''where relevant and in order to calculate
  CIL liability''. From the audit: it covers householder extensions creating floorspace, and the council
  asks for the form even where there is no CIL liability, so it is needed whenever new floorspace or homes
  are created (not only above the national 100 square metre / 1 home liability threshold).'
