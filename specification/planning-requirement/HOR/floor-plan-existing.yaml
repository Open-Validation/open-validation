reference: floor-plan-existing
local-authority: HOR
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building operations or changes the floor layout.
  - condition:
      field: external-alterations
      value: true
      description: The plans need to show where new windows or doors go relative to the existing property.
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Part 3, Article
  7; Horsham District Planning Framework policy 33
source-text: Required when the application would involve building operations or some change to the floor
  layout, or to indicate the locations of new windows/doors relative to the existing property.
must-include:
- item: Drawn at a metric scale of 1:50 or 1:100
  level: must
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''National requirements: Floor plans (existing and proposed)''. Existing plans only where there is an
  existing building.'
review-status: unverified
field-status: {}
