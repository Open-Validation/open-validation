reference: flood-risk-assessment
local-authority: HOR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All or part of the site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: Land identified by the Environment Agency as having critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Land identified in a strategic flood risk assessment as being at increased flood risk
        in future.
  - all:
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: Land that may be subject to other sources of flooding.
    - discretionary
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: National Planning Policy Framework paragraphs 175 and 181; Planning Practice Guidance (Flood Risk
  and Coastal Change) paragraph 027
source-text: 'All applications where all or part of the site falls within Flood Zones 2 and 3 ... Applications
  within Flood Zone 1 on: ... sites of 1 hectare or more; ... land which has been identified by the Environment
  Agency as having critical drainage problems; ... land identified in a strategic flood risk assessment
  as being at increased flood risk in future; or ... land that may be subject to other sources of flooding,
  where its development would introduce a more vulnerable use'
must-include:
- item: A Sequential Test (followed by an Exceptions Test if applicable), where all or part of the site
    is in Flood Zone 2 or 3 or at medium or high risk of surface water or other flooding; not needed on
    sites allocated after a sequential test, for householder development, small non-residential development
    with a footprint under 250 sq m, or changes of use (other than to a caravan, camping, chalet, mobile
    home or park home site)
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: All or part of the site is in Flood Zone 2 or 3, or at medium or high risk of surface
        water flooding.
  source-text: Subject to Paragraph 175 of the NPPF (2024) and Paragraph 027 of the PPG (Flood Risk and
    Coastal Change), a Sequential Test (followed by an Exceptions Test if applicable) will be required
    for development where all or part of the site falls within Flood Zones 2 or 3, and/or where there
    is a medium or high risk of surface water flooding or flooding from other sources.
confidence: medium
