reference: site-plan
local-authority: HOR
required-if:
  always: true
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Part 3, Article
  7; Horsham District Planning Framework policy 33
source-text: 'The Town and Country Planning (Development Management Procedure) (England) Order 2015 (“DMPO”)
  requires, as a minimum, the following information to validate an application as per mandatory national
  information requirements specified in the DMPO: ... A location and site plan'
must-include:
- item: Drawn at a metric scale of 1:200 or 1:500 (1:200 where the works are likely to affect trees)
  level: must
- item: The proposed development, with the direction of North
  level: must
- item: Existing buildings, boundaries, adjacent properties and trees
  level: must
- item: Any Public Rights of Way, footpaths, cycle paths and highways
  level: must
- item: Drawn at 1:200 where the proposed works are likely to have an impact on trees
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the site or on adjacent land that could influence or be affected by the development.
- item: Red and blue outlines, where included, match those on the location plan
  level: must
- item: 'For householder applications: the trees clearly identified and measured'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on the site or on adjacent land that could influence or be affected by the
          development.
  source-text: For Householder applications a block plan with the trees clearly identified and measured
    would be a requirement.
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''National requirements: Block plan''. The council calls it a block plan. The householder trees item
  comes from the ''Tree survey/arboricultural impact assessment'' section.'
review-status: unverified
field-status: {}
