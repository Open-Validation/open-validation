reference: location-plan
local-authority: HOR
required-if:
  always: true
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Part 3, Article
  7; Horsham District Planning Framework policy 33
source-text: 'The Town and Country Planning (Development Management Procedure) (England) Order 2015 (“DMPO”)
  requires, as a minimum, the following information to validate an application as per mandatory national
  information requirements specified in the DMPO: ... A location and site plan'
must-include:
- item: Drawn at a metric scale of 1:1250 or 1:2500
  level: must
- item: Site edged clearly in red, including all land necessary to carry out the development, such as
    access to a highway, parking and hard standing
  level: must
- item: All other land owned by the applicant outlined in blue
  level: must
- item: The direction of North clearly marked
  level: must
