reference: air-quality-assessment
local-authority: HOR
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - air-quality-management-area
      description: In an Air Quality Management Area (Cowfold or Storrington).
  - discretionary
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 500
      description: Use Class B8 (storage and distribution) with 500 sq m or more floorspace.
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Horsham District Planning Framework policy 24; Sussex Air Quality Guidance 2021
source-text: 'The Sussex Air Quality Guidance includes a screening checklist which explains when an Air
  Quality Assessment and an Emissions Mitigation Assessment is required to be submitted. This is usually
  when the proposal is any of the following: ... A major development, as defined by Town and Country Planning
  Order (England) 2015 ... Located within an Air Quality Management Area (AQMA). There are two AQMA’s
  in the Horsham District - Cowfold and Storrington ... In relevant proximity to an AQMA ... B8 storage
  and distributions use class with a floorspace or 500m2 or more.'
must-include:
- item: How the proposal will satisfactorily mitigate against increased emissions
  level: must
- item: An Emissions Mitigation Assessment, where the Sussex Air Quality Guidance screening checklist
    requires one
  level: must
  required-if: discretionary
confidence: medium
