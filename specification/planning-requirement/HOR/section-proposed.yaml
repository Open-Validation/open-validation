reference: section-proposed
local-authority: HOR
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: Floor levels change in an existing building, a new building is on sloping ground, or
        land is infilled.
  - condition:
      field: hard-surfacing
      value: true
      description: Laying materials for a drive or similar.
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Part 3, Article
  7; Horsham District Planning Framework policy 33
source-text: Required when the application would cause changes to floor levels in an existing building,
  or when a new building is to be built on sloping ground. Also required with any infill of land or laying
  of materials for a drive etc. ... A section through planis also often required at a scale of 1:10 or
  1:20.
must-include:
- item: Drawn at a metric scale of 1:50 or 1:100
  level: must
- item: 'For advertisements: a section through the sign at a scale of 1:10 or 1:20'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (web page, undated; text supplied by the user on 2026-11-06), section
  ''National requirements: Section plans (existing and proposed); Advert details plans''. For advertisements
  the list says a section is ''often required'', so it shows as ''check''.'
