reference: energy-statement
local-authority: SLG
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New or replacement dwellings.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial (non-residential) development.
source-url: https://www.slough.gov.uk/directory-record/35561/energy-statement
policy: Slough Borough Council Climate Change Action Plan; General Development Guidance (Part 4)
source-text: ALL new/replacement dwellings. All major applications for non- residential development that
  require a Design & Access Statement.
must-include:
- item: At least 10% of total energy consumption from renewable sources
  level: must
- item: Baseline annual CO2 emissions and energy costs
  level: must
- item: Energy efficiency of the building fabric (passive design strategy)
  level: must
- item: Heating, ventilation and lighting factors
  level: must
- item: A low and zero carbon feasibility report on renewable energy technologies, with the contribution
    and cost of each
  level: must
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35561).
review-status: unverified
field-status: {}
