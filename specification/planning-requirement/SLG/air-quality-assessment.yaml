reference: air-quality-assessment
local-authority: SLG
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: direct-air-emissions
        value: true
        description: Introduces polluting plant.
  - discretionary
source-url: https://www.slough.gov.uk/directory-record/35552/air-quality-assessment
policy: National Planning Policy Framework; Air Quality Standards Regulations 2010; Slough Low Emission
  Strategy
source-text: Typically a detailed air quality assessment will only apply to major applications which trigger
  the need for a Transport Assessment or introduce polluting plant.
must-include:
- item: Proportionate to the nature and scale of development and the level of concern
  level: must
- item: Carried out by a suitably qualified environmental scientist
  level: must
- item: An exposure assessment where new receptors are introduced to an area with existing poor air quality
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35552).
  'Typically' and the long list of cases where an assessment is needed (near an AQMA, EIA, new point sources,
  significant demolition and construction, combustion units over 300kWh, significant traffic effects,
  sensitive neighbouring sites, effects on biodiversity) are shown as 'check'. Reserved matters are excluded
  where an assessment was considered at outline.
review-status: unverified
field-status: {}
