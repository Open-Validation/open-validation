reference: site-plan
local-authority: SLG
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - advertising
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.slough.gov.uk/directory-record/35537/block-plan-and-site-plan
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications.
must-include:
- item: 'At 1:200 or 1:500 (householder: 1:100, 1:200 or 1:500)'
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: The direction of north
  level: must
- item: 'Householder: up to date, reflecting the as-built existing situation'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    on adjoining land including access; public rights of way; trees on the site and adjacent land; extent
    and type of hard surfacing (with drainage details); boundary treatment; parking arrangements'
  level: should
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35537;
  record 35522). Other records: https://www.slough.gov.uk/directory-record/35522/block-plan-and-site-plan-for-householder-applications.
  Block plan/site plan. Always required except for lawful development certificates, where it is ''often
  required'' (shown as ''check'').'
review-status: unverified
field-status: {}
