reference: land-contamination-assessment
local-authority: SLG
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contaminated land is suspected.
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive use is proposed.
source-url: https://www.slough.gov.uk/directory-record/35555/contaminated-land-assessment
policy: Part 2A, Environmental Protection Act 1990
source-text: Required where contaminated land is suspected, or where a sensitive use is proposed.
must-include:
- item: Whether contamination exists, its nature and risks, and whether and how they can be reduced to
    an acceptable level
  level: must
- item: Prepared by a competent professional
  level: must
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35555).
  Contaminated Land Assessment.
review-status: unverified
field-status: {}
