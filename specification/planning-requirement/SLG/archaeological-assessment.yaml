reference: archaeological-assessment
local-authority: SLG
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: Significant ground impacts.
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: An area with high archaeological potential.
    - discretionary
source-url: https://www.slough.gov.uk/directory-record/35553/archaeology-desk-based-assessment
policy: National Planning Policy Framework
source-text: Required for sites in areas with high archaeological potential, and in areas with unknown
  potential, where significant ground impacts will be undertaken by the development.
must-include:
- item: Following the CIfA Standard and guidance for historic environment desk-based assessments
  level: must
- item: Undertaken by a CIfA registered archaeological professional
  level: must
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35553).
  Areas of 'unknown potential' are shown as 'check'.
review-status: unverified
field-status: {}
