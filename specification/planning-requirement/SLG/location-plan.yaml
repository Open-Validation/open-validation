reference: location-plan
local-authority: SLG
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - advertising
    - lbc
    - demolition-con-area
    - ldc
    - pa-extension
    - pa-storey
    - prior-approval
    - mod-discharge-s106
source-url: https://www.slough.gov.uk/directory-record/35536/site-location-plan
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended)
source-text: All applications.
must-include:
- item: At 1:1250 or 1:2500, fitting onto A4 or A3 paper wherever possible
  level: must
- item: An up-to-date licensed OS plan (not title or Land Registry plans, for copyright reasons)
  level: must
- item: The direction of north
  level: must
- item: At least two named roads (where possible), and the surrounding buildings, roads and footpaths
    on adjoining land
  level: must
- item: A red line around all land required for the development (including access to the public highway
    where relevant)
  level: must
- item: A blue line around all other land owned by the applicant close to or adjoining the site
  level: must
- item: 'Modification or discharge of a S106 agreement: a map identifying the land to which the obligation
    relates'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35536;
  record 35521; record 35593). Other records: https://www.slough.gov.uk/directory-record/35521/site-location-plan-for-householder-applications,
  https://www.slough.gov.uk/directory-record/35593/modification-or-discharge-of-a-s106-legal-agreement.
  Always required for householder, major, minor, change of use, advertisement, listed building, demolition
  and lawful development certificate applications.'
review-status: unverified
field-status: {}
