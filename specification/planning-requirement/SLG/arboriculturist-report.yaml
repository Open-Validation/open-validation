reference: arboriculturist-report
local-authority: SLG
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: 'Trees within or on the edge of the site likely to be affected (householder: trees or
      hedges on or next to the site).'
source-url: https://www.slough.gov.uk/directory-record/35546/tree-survey-aia-and-ams
policy: National Planning Policy Framework; BS 5837:2012
source-text: ANY applications where there are trees within the site or on the edge of the site likely
  to be affected by the development. This will include householder applications, minors and majors. ...
  When there are trees or hedges either on the proposed development site or on land adjacent to the site
  .
must-include:
- item: Species, position and canopy spread of trees annotated and accurately shown on the block plan
  level: must
- item: All trees over 75mm diameter within influencing distance of the development surveyed
  level: must
- item: Compliant with BS5837:2012, including an Arboricultural Impact Assessment, Arboricultural Method
    Statement and Tree Protection Plan
  level: must
- item: Prepared by a qualified arboriculturist (with Professional Indemnity Insurance)
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35546;
  record 35528). Other records: https://www.slough.gov.uk/directory-record/35528/tree-survey-aia-ams-tree-protection-plan-for-householder-applications.
  Tree survey, AIA and AMS.'
review-status: unverified
field-status: {}
