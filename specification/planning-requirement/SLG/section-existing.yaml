reference: section-existing
local-authority: SLG
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: roof-space-room
          value: true
          description: A loft extension.
      - condition:
          field: change-in-ground-levels
          value: true
          description: Land level changes.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
    - any:
      - condition:
          field: earthworks
          value: true
          description: Engineering works.
      - condition:
          field: basement
          value: true
          description: A basement.
      - discretionary
source-url: https://www.slough.gov.uk/directory-record/35543/cross-sections
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Where engineering works proposed. ALL basement proposals. May be required to indicate usable
  floorspace within a roof, particularly Green Belt locations, and for new dwellings to calculate internal
  space standards. ... When the proposal is for a loft extension or when your proposal involves land level
  changes.
must-include:
- item: At 1:20, 1:50 or 1:100
  level: must
- item: A unique drawing number reference
  level: must
- item: Window positions and head heights (1.5 metres above for habitable space)
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35543;
  record 35526). Other records: https://www.slough.gov.uk/directory-record/35526/cross-sections-for-householder-applications.
  Cross sections. Floorspace within a roof (especially in the Green Belt) and internal space standards
  for new dwellings are ''may be required'', shown as ''check''.'
review-status: unverified
field-status: {}
