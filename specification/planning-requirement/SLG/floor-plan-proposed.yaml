reference: floor-plan-proposed
local-authority: SLG
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - ldc
    - any:
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use.
      - condition:
          field: operational-development
          value: true
          description: Operational development (building works and engineering operations).
source-url: https://www.slough.gov.uk/directory-record/35538/floor-plans-existing-and-proposed
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: ALL changes of use. ALL where operational development (building works and engineering operations)
  is proposed.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: 'A unique drawing number reference (householder: and revision numbers)'
  level: must
- item: All floors within the property, including any loft space
  level: must
- item: The use of each room annotated
  level: must
- item: Door and window openings
  level: must
- item: Walls to be demolished highlighted, and existing and proposed distinguished if shown on the same
    plan
  level: must
- item: 'Green Belt: floor area calculations (original, existing and proposed), on the plans or in a supporting
    document'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: In the Green Belt.
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35538;
  record 35523). Other records: https://www.slough.gov.uk/directory-record/35523/existing-and-proposed-floor-plans-for-householder-applications.
  Always required for householder, listed building and demolition applications; for other types, for all
  changes of use and operational development.'
review-status: unverified
field-status: {}
