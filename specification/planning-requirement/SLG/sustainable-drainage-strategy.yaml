reference: sustainable-drainage-strategy
local-authority: SLG
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New or replacement dwellings.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial (non-residential) development.
source-url: https://www.slough.gov.uk/directory-record/35560/drainage-assessment-suds-
policy: Flood and Water Management Act 2010
source-text: ALL new/replacement dwellings. All major applications for non- residential development that
  require a Design & Access Statement.
must-include:
- item: Slough's Surface Water Drainage Pro-Forma
  level: should
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35560).
  Drainage Assessment (SuDS).
review-status: unverified
field-status: {}
