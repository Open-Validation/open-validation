reference: lighting-assessment
local-authority: SLG
required-if:
  condition:
    field: external-lighting
    value: true
    description: New or replacement external spotlights, floodlights, streetlighting or lighting in car
      parks/parking courts.
source-url: https://www.slough.gov.uk/directory-record/35568/lighting-assessment
policy: National Planning Policy Framework
source-text: If the application involves new or replacement external spotlights or floodlights or streetlighting
  and lighting within car parks/parking courts
must-include:
- item: Hours of operation
  level: must
- item: Light spillage (Isolux) diagrams and light levels
  level: must
- item: Column heights, equipment design, and a layout plan with beam orientation and light maps
  level: must
- item: Impact on nearby dwellings, wildlife, habitat or roads, and planting to mitigate effects
  level: must
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35568).
review-status: unverified
field-status: {}
