reference: roof-plan-existing
local-authority: SLG
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: operational-development
        value: true
        description: Operational development (building works and engineering operations).
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: operational-development
        value: true
        description: Operational development (building works and engineering operations).
    - discretionary
source-url: https://www.slough.gov.uk/directory-record/35540/roof-plans-existing-and-proposed
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: ALL where operational development (building works and engineering operations) is proposed.
  If no changes to the external appearance are proposed then only the existing roof plan will be required.
must-include:
- item: At 1:50, 1:100 or 1:200
  level: must
- item: 'A unique drawing number reference (householder: and revision numbers)'
  level: must
- item: 'Key features on the roof such as chimneys, parapets, railings and rooflights (householder: and
    solar panels)'
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35540;
  record 35525). Other records: https://www.slough.gov.uk/directory-record/35525/existing-and-proposed-roof-plans-for-householder-applications.
  Often required (shown as ''check'') for lawful development certificates.'
review-status: unverified
