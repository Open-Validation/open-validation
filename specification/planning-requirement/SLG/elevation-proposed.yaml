reference: elevation-proposed
local-authority: SLG
required-if:
  any:
  - application-type:
      in:
      - hh
      - advertising
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - ldc
    - condition:
        field: operational-development
        value: true
        description: Operational development (building works and engineering operations).
    - condition:
        field: external-alterations
        value: true
        description: Changes to the external appearance.
source-url: https://www.slough.gov.uk/directory-record/35539/elevations-existing-and-proposed
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: ALL where operational development (building works and engineering operations) is proposed.
  If no changes to the external appearance are proposed then only existing elevations will be required.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: 'A unique drawing number reference (householder: and revision numbers)'
  level: must
- item: Each elevation annotated as front, rear, side or north, south, east, west
  level: must
- item: Door and window openings
  level: must
- item: 'External materials indicated (householder: annotated)'
  level: must
- item: 'Green Belt: volume calculations (original, existing and proposed), on the plans or in a supporting
    document'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: In the Green Belt.
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35539;
  record 35524). Other records: https://www.slough.gov.uk/directory-record/35524/existing-and-proposed-elevations-for-householder-applications.
  Proposed elevations only where the external appearance changes.'
review-status: unverified
field-status: {}
