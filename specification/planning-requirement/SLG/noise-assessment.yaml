reference: noise-assessment
local-authority: SLG
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential development or a sensitive use adjacent to a noise generating use such
        as industrial estates, major highways or rail lines.
  - condition:
      field: noise-generating-use
      value: true
      description: Potential noise generation (e.g. plant or machinery) that could affect its environs.
source-url: https://www.slough.gov.uk/directory-record/35570/noise-assessment
policy: National Planning Policy Framework; National Planning Policy Guidance on Noise; Noise Policy Statement
  for England 2010
source-text: ALL applications proposing residential development or a sensitive use adjacent to noise generating
  use such as industrial estates, major highways or rail lines; or, an application proposing potential
  noise generation (e.g. plant or machinery) that could affect its environs.
must-include:
- item: Carried out by a qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35570).
review-status: unverified
field-status: {}
