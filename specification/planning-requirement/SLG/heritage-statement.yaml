reference: heritage-statement
local-authority: SLG
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      - listed-building
      - locally-listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      description: Within a Conservation Area, a listed or locally listed building, or affecting any heritage
        asset (including scheduled monuments) or its setting.
source-url: https://www.slough.gov.uk/directory-record/35565/heritage-statement
policy: National Planning Policy Framework; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: Mandatory if the works are within a Conservation Area or the property is a Listed or Locally
  Listed Building or affects any heritage asset or their setting (A heritage asset also includes scheduled
  monuments).
must-include:
- item: Proportionate to the importance of the asset and scale of development, and enough to understand
    the impact on significance
  level: must
- item: A description of the significance of the asset, with reference to the relevant historic record,
    including the contribution of its setting
  level: must
- item: The impact of the works on significance, and how the development protects or enhances the asset
  level: must
- item: How the development responds to scale, proportions, height, massing, building lines, historic
    pattern, use, design, detailing and materials
  level: must
- item: 'Listed buildings: how the proposal retains integrity and significance: room hierarchy, historic
    floor levels, structure, fabric and significant features'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Where harm is caused: full justification, degree of harm, alternatives considered and public
    benefits'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35565;
  record 35532). Other records: https://www.slough.gov.uk/directory-record/35532/heritage-statement-and-design-access-statement-for-householder-applications.
  Always required for listed building and demolition applications; often for other types. It can be included
  in the Design and Access Statement.'
review-status: unverified
field-status: {}
