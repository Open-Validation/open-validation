reference: bng-metric
local-authority: SLG
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.slough.gov.uk/directory-record/35554/biodiversity-net-gain-information
policy: Schedule 7A, Town and Country Planning Act 1990 (inserted by the Environment Act 2021); Biodiversity
  Gain Requirements (Exemptions) Regulations 2024; Biodiversity Gain (Town and Country Planning) (Modifications
  and Amendments) (England) Regulations 2024; Biodiversity Gain (Town and Country Planning) (Amendments
  and Transitional Provisions) (England) Regulations 2026
source-text: Major developments. Changes of use. Please note that some change of use applications are
  exempt. Minor developments.
must-include:
- item: The biodiversity metric spreadsheet, with all onsite pre- and post-development habitat information
  level: must
- item: 'Where the site includes land within 10m of a canal or river and/or 5m of a ditch: the adjacent
    lengths of watercourse in the watercourse baseline, and a River Condition Assessment'
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: Within 10m of a canal or river, or 5m of a ditch.
- item: 'Where a separate biodiversity gain site is proposed: detailed information about it'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: A separate off-site biodiversity gain site is proposed.
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35554).
  Biodiversity Net Gain Information, always required for major, minor and change of use applications.
  Shown with the biodiversity gain condition, as the law sets it: householder and other exempt applications
  (and some changes of use) are exempt. The Biodiversity Statement that goes with it has no matching id
  (see the unmapped list).'
review-status: unverified
field-status: {}
