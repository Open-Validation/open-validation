reference: waste-management-plan
local-authority: SLG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New or replacement dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial (non-residential) development.
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use.
source-url: https://www.slough.gov.uk/directory-record/35580/refuse-and-recycling-strategy
policy: Slough Developers Guide on refuse and recycling storage
source-text: All new residential developments and commercial developments, including changes of use.
must-include:
- item: Storage and collection arrangements for recycling and refuse shown on the plans
  level: must
- item: A collection and management strategy
  level: must
confidence: medium
notes: From the council's list (adopted 1 January 2026), Local Validation List directory (record 35580).
  Refuse and Recycling Strategy.
review-status: unverified
field-status: {}
