reference: design-and-access-statement
local-authority: SLG
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Any part of the development in a designated area (e.g. a Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building (including an extension) creating 100 square metres or more.
source-url: https://www.slough.gov.uk/directory-record/35547/design-and-access-statement
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'ONLY the following: Major development both full and outline; Listed Building Consent applications
  Where any part of the development is in a designated area (e.g. Conservation Area) and the proposed
  development consists of: The provision of one or more dwellinghouses; or, the provision of a building
  (including an extension to an existing building); or buildings where the floor space created by the
  development is 100 square metres or more'
must-include:
- item: Proportionate to the complexity of the application
  level: must
- item: Computer Generated Images (CGIs), in the statement or as standalone plans, for major developments
  level: must
  required-if:
    ref: major-development
- item: 'Householder: the design principles and concepts; how the context was appraised; consultation
    on access; how access issues are addressed'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35547;
  record 35532). Other records: https://www.slough.gov.uk/directory-record/35532/heritage-statement-and-design-access-statement-for-householder-applications.
  Listed under ''Always required'' for major, listed building and demolition applications, but the record
  itself limits it to the cases above.'
review-status: unverified
field-status: {}
