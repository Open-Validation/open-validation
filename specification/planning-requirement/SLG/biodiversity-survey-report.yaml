reference: biodiversity-survey-report
local-authority: SLG
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: 'Likely to affect protected species (householder: such as bats).'
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - special-area-of-conservation
      - special-protection-area
      - national-nature-reserve
      description: Likely to affect, within or abutting a local, county, national or internationally designated
        site of nature conservation.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
    - discretionary
source-url: https://www.slough.gov.uk/directory-record/35550/habitats-survey
policy: National Planning Policy Framework
source-text: ALL applications, including householder, on sites likely to affect protected species; and/or,
  likely to affect/is located within or abuts a local, county, national or internationally designated
  site of nature conservation. ... When a protected species such as bats may be present on site.
must-include:
- item: A Phase I Habitat Survey (with an Extended Phase I and a Phase II in certain circumstances)
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 January 2026), Local Validation List directory (record 35550;
  record 35530). Other records: https://www.slough.gov.uk/directory-record/35530/ecological-survey. Habitats
  survey; for householders, an ecological survey (for example older timber-framed buildings or roof voids
  that could hold bats). It is also required for all major developments within 5.6km of Burnham Beeches
  (no map field yet, so shown as ''check'').'
review-status: unverified
field-status: {}
