source-text: Existing and proposed site sections and finished floor and site levels and datum point (1:50
  or 1:100) (In all cases where proposals involve a change in ground levels or is on a sloping site).
must-include:
- item: Drawn at 1:50 or 1:100
  level: must
- item: Finished floor and site levels, with a datum point
  level: must
