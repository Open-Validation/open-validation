reference: biodiversity-survey-report
local-authority: SDNPA
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development is within, next to or would affect priority species (section 41, NERC
        Act 2006), or there is a reasonable likelihood of protected species and/or their habitats.
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - priority-habitat
      description: Within, next to or affecting Local Wildlife Sites (SINCs and SNCIs), Local or National
        Nature Reserves, SSSIs, internationally designated sites, or notable habitats.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policies SD9 and SD10
source-text: 'All applications for development within or adjacent to, or would have an impact on priority
  species as detailed on Section 41 of the Natural Environment and Rural Communities Act 2006, or within,
  adjacent to, or would have an impact upon one or a combination of the following sites: Local Wildlife
  sites (SINCS & SNCIs), Local Nature Reserves, National Nature Reserves, SSSIs, internationally designated
  sites and/or where there is a reasonable likelihood of protected species and/or their habitats/notable
  habitats.'
must-include:
- item: Appraisal and any further habitat or protected species surveys undertaken by competent persons
    with suitable protected species licences, qualifications and experience, and professional membership
    of the Chartered Institute of Ecology and Environmental Management (CIEEM)
  level: should
confidence: medium
notes: From the council's list (published March 2024), page 3. The list heads this 'Biodiversity Survey
  and Report/Environmental Impact Assessment/Ecological Impact Assessment/Geodiversity/International Sites'.
review-status: unverified
field-status: {}
