reference: town-centre-impact-assessment
local-authority: SDNPA
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail outside the defined Market Town or Larger Village centre boundary but within
          the settlement policy boundary.
    - any:
      - all:
        - condition:
            field: settlement-type
            value: market-town
            description: The settlement is a Market Town.
        - condition:
            field: retail-floorspace
            operator: '>'
            value: 750
            description: More than 750 sq m of retail floorspace.
      - all:
        - condition:
            field: settlement-type
            value: larger-village
            description: The settlement is a Larger Village.
        - condition:
            field: retail-floorspace
            operator: '>'
            value: 500
            description: More than 500 sq m of retail floorspace.
  - all:
    - condition:
        field: outside-urban-area
        value: true
        description: Outside the Market Town and Larger Village settlement policy boundaries.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 150
        description: More than 150 sq m of retail floorspace.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD38
source-text: Retail development outside of the defined Market Town and Larger Village Centre boundaries
  but within settlement policy boundaries where the proposal exceeds 750 sq m floorspace (Market Town)
  or 500 sq m (Larger Village) … Retail development outside of Market Town and Larger Village settlement
  policy boundaries where the proposal exceeds 150 sq m.
confidence: medium
notes: From the council's list (published March 2024), page 13. The list calls this a Retail Impact Assessment.
review-status: unverified
field-status: {}
