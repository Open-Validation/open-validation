reference: viability-assessment
local-authority: SDNPA
required-if: discretionary
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policies SD12, SD23, SD28, SD32, SD35, SD38 and SD41; SDNPA Affordable
  Housing SPD
source-text: All proposals where development viability is a relevant consideration, including, but not
  limited to those set out below. This is a bespoke specialist piece of work that should be prepared by
  a suitably qualified and experienced assessor and submitted as a stand alone document, or where appropriate
  combined with Need and/or Marketing Assessments.
must-include:
- item: Prepared by a suitably qualified and experienced assessor, as a stand-alone document (or combined
    with Need and/or Marketing Assessments where appropriate)
  level: should
- item: 'Agreement to pay for the LPA''s assessment of the viability information: the completed External
    Viability Appraisal Agreement proforma naming the person who will pay'
  level: must
- item: An electronic version of the viability appraisal that can be fully tested and interrogated
  level: must
- item: Any particularly sensitive information clearly identified and able to be separated (e.g. in an
    appendix)
  level: should
- item: 'For enabling development: a full objective analysis of the conservation deficit, supported by
    specialist heritage assessment, structural surveys and other evidence, showing the development is
    the minimum required to safeguard the asset'
  level: should
  required-if: discretionary
  source-text: Viability Assessments for Enabling Development should include a full objective analysis
    of the conservation deficit, be supported by appropriate specialist heritage assessment, structural
    surveys and other relevant evidence and demonstrate that the proposed development is the minimum required
    to safeguard the asset.
- item: 'For optimum viable use: an objective assessment of realistic alternatives and impacts on heritage
    significance, including the future conservation of the asset'
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published March 2024), page 10-11. Shown as discretionary: the list
  names cases where it is ''especially relevant'' (under-provision of affordable homes, enabling development
  or optimum viable use, loss of employment land, loss of visitor accommodation or recreation facilities,
  conversion of agricultural or forestry buildings, new rural worker dwellings) but says ''including,
  but not limited to''. The authority''s web page says it is required where an application seeks to depart
  from specified SDNPA policies.'
review-status: unverified
field-status: {}
