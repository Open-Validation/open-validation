source-text: Heritage statement in accordance with SDNPA Guidance, (to include Archaeological Assessment)
  … All applications for development affecting a designated heritage asset or any undesignated heritage
  asset recognised as such by the SDNPA, or its setting. Heritage assets include but are not restricted
  to listed buildings, scheduled monuments and other archaeological sites, Conservation Areas, Historic
  Parks and Gardens and other historic landscapes, and historic battlefields. Heritage statements must
  follow the SDNPA’s Heritage Statement Guidance
