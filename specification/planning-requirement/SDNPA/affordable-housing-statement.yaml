reference: affordable-housing-statement
local-authority: SDNPA
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing development.
  - discretionary
source-url: https://www.southdowns.gov.uk/wp-content/uploads/2023/05/Local-Validation-List-September-2023.pdf
policy: South Downs Local Plan Policy SD28
source-text: Affordable Housing Statement (& S106 Agreement Heads of Terms, if Affordable Housing required
  as part of the application) All applications for housing development which require on-site affordable
  housing provision and/or a financial contribution in lieu, in accordance with policy SD28, including
  rural exception sites.
must-include:
- item: S106 Agreement Heads of Terms, if affordable housing is required as part of the application
  level: must
confidence: medium
notes: Needed where Policy SD28 requires on-site affordable housing or a contribution (thresholds are
  in the policy, not the list).
