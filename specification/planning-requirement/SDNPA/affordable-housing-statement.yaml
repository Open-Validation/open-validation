reference: affordable-housing-statement
local-authority: SDNPA
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing development.
  - discretionary
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policies SD27, SD28 and SD29; SDNPA Affordable Housing SPD
source-text: All applications for housing development which require on-site affordable housing provision
  and/or a financial contribution in lieu, in accordance with policy SD28, including rural exception sites.
  This should include information on the housing mix and tenure of each unit.
must-include:
- item: Information on the housing mix and tenure of each unit
  level: should
- item: S106 Agreement Heads of Terms, if affordable housing is required as part of the application
  level: must
confidence: medium
notes: From the council's list (published March 2024), page 2. Whether affordable housing is required
  depends on the thresholds in policy SD28, which the list doesn't repeat, so that part is shown as discretionary.
  Rural exception sites are included. The separate Mix of Homes Statement (all housing development; it
  can be part of this statement) has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
