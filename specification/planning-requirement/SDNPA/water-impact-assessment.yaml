reference: water-impact-assessment
local-authority: SDNPA
required-if:
  any:
  - site:
      in:
      - water-neutrality-area
      description: The site is in the Sussex North Water Resource Zone and the proposal would materially
        increase water demand.
  - site:
      in:
      - nutrient-neutrality-area
      description: The site is in the Solent or Itchen catchment and the proposal is residential, provides
        overnight accommodation or is a tourism attraction bringing people from outside the catchment.
source-url: https://www.southdowns.gov.uk/wp-content/uploads/2023/05/Local-Validation-List-September-2023.pdf
source-text: 'Applications within the Sussex North Water Resource Zone that would lead to a material increase
  in water demand will need to demonstrate ‘water neutrality’ in a water budget showing the baseline and
  proposed water consumption and mitigation measures proposed.

  Applications within the Solent or Itchen Catchments for residential development, including new homes
  and other uses that provide overnight accommodation and tourism attractions of a nature that would bring
  people from outside the catchment. These applications must demonstrate nutrient neutrality by submitting
  a nutrient budget using the most up-to-date Natural England calculator.'
must-include:
- item: Water budget showing baseline and proposed water consumption, and the mitigation proposed
  level: must
  required-if:
    site:
      in:
      - water-neutrality-area
      description: Sussex North Water Resource Zone.
- item: Nutrient budget using the most up-to-date Natural England calculator
  level: must
  required-if:
    site:
      in:
      - nutrient-neutrality-area
      description: Solent or Itchen catchment.
confidence: medium
notes: The authority's Water Neutrality Statement and nutrient neutrality information, which the workbook
  had as unmapped rows with cut-off triggers. The full triggers are from the workbook's 'Policy-driven
  requirements' tab.
review-status: unverified
field-status: {}
