reference: water-impact-assessment
local-authority: SDNPA
required-if:
  any:
  - site:
      in:
      - water-neutrality-area
      description: In the Sussex North Water Supply Zone and the proposal would lead to a material increase
        in water demand.
  - site:
      in:
      - nutrient-neutrality-area
      description: In the Solent or Itchen catchment and the proposal is residential, provides overnight
        accommodation, or is a tourism attraction bringing people from outside the catchment.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD10
source-text: Any applications within the Sussex North Water Supply Zone where proposals would lead to
  a material increase in water demand … Applications within the Solent or Itchen Catchments for residential
  development, including new homes and other uses that provide overnight accommodation and tourism attractions
  of a nature that would bring people from outside the catchment. These applications must demonstrate
  nutrient neutrality by submitting a nutrient budget using the most up-to-date Natural England calculator.
must-include:
- item: 'Water neutrality: a water budget showing the baseline and proposed water consumption and the
    mitigation measures proposed'
  level: must
  required-if:
    site:
      in:
      - water-neutrality-area
      description: In the Sussex North Water Supply Zone.
- item: 'Nutrient neutrality: a nutrient budget using the most up-to-date Natural England calculator'
  level: must
  required-if:
    site:
      in:
      - nutrient-neutrality-area
      description: In the Solent or Itchen catchment.
confidence: medium
notes: From the council's list (published March 2024), page 7, 16. Covers the list's Water Neutrality
  Statement (page 16) and the water and nutrient budgets asked for under 'Information to support Habitat
  Regulations Assessment screening' (page 7). The wider HRA information has no matching id and is listed
  as unmapped.
review-status: unverified
field-status: {}
