reference: bng-metric
local-authority: SDNPA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD9 (1)(b); Environment Act 2021
source-text: 'On or after 12 February 2024: In addition to Statutory BNG information set out in Article
  7 of The Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended),
  applicants are required to submit the following additional information: … Completed draft Statutory
  BNG Metric for the proposed scheme* … All minor applications on or after 2 April 2024: … Completed draft
  Statutory Small Sites BNG Metric for the proposed scheme*'
must-include:
- item: Submitted in macro-disabled MS Excel format
  level: must
- item: 'For major development: the completed draft Statutory BNG Metric'
  level: must
  required-if:
    ref: major-development
- item: The Statutory BNG Metric, not the Small Sites Metric, where the site has irreplaceable habitats,
    priority habitats or European Protected Species present, or needs off-site interventions to provide
    BNG
  level: must
  source-text: N.B. The Small Sites Metric cannot be used for sites with irreplaceable habitats (as defined
    in The Biodiversity Gain Requirements (Irreplaceable Habitats) Regulations 2024) or priority habitats
    or European Protected Species present, or sites which require off-set interventions to provide BNG.
confidence: medium
notes: From the council's list (published March 2024), page 3-5. Required for major sites (from 12 February
  2024) and minor sites (from 2 April 2024), unless exempt, in addition to the national BNG information.
  A BNG Strategy setting out how 10% BNG will be achieved is also required; it has no matching id and
  is listed as unmapped. A draft Biodiversity Gain Plan and Habitat Management and Maintenance Plan are
  only encouraged 'where appropriate', so they are not shown as required.
review-status: unverified
field-status: {}
