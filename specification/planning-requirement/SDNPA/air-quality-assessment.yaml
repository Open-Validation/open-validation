reference: air-quality-assessment
local-authority: SDNPA
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 500
      description: B8 storage and distribution floorspace greater than 500 sq m.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD54
source-text: All applications for major development where traffic generation, bio-aerosols, particulate
  matter or odour is increased and/or the development is likely to affect or cause the declaration of
  an Air Quality Management Area, including through cumulative impact. … All applications for B8 storage
  and distribution use class with a floorspace greater than 500m2
confidence: medium
notes: From the council's list (published March 2024), page 3. For major development, whether traffic,
  bio-aerosols, particulates or odour increase or an Air Quality Management Area is affected is a judgement,
  so it is shown as discretionary.
