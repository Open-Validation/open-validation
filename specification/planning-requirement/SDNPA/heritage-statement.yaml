reference: heritage-statement
local-authority: SDNPA
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - scheduled-monument
    - archaeological-priority-area
    - conservation-area
    - park-and-garden
    - locally-listed-building
    description: 'Development affecting a designated heritage asset, or an undesignated heritage asset
      the SDNPA recognises, or its setting: listed buildings, scheduled monuments and other archaeological
      sites, conservation areas, historic parks and gardens and other historic landscapes, and historic
      battlefields.'
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policies SD12, SD13, SD14, SD15 and SD16
source-text: All applications for development affecting a designated heritage asset or any undesignated
  heritage asset recognised as such by the SDNPA, or its setting. Heritage assets include but are not
  restricted to listed buildings, scheduled monuments and other archaeological sites, Conservation Areas,
  Historic Parks and Gardens and other historic landscapes, and historic battlefields. Heritage statements
  must follow the SDNPA’s Heritage Statement Guidance
must-include:
- item: Follows the SDNPA's Heritage Statement Guidance
  level: must
confidence: medium
notes: From the council's list (published March 2024), page 8. The list heads this 'Heritage statement
  in accordance with SDNPA Guidance, (to include Archaeological Assessment)'; see archaeological-assessment.
