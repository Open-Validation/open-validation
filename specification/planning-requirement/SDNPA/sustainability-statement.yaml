reference: sustainability-statement
local-authority: SDNPA
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New residential, commercial, agricultural or community buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversion of existing buildings.
  - all:
    - condition:
        field: residential-extension
        value: true
        description: A residential extension.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: The extension adds more than 100 sqm internal floor area.
source-url: https://www.southdowns.gov.uk/wp-content/uploads/2023/05/Local-Validation-List-September-2023.pdf
policy: South Downs Local Plan Policy SD48
source-text: Sustainability Assessment All applications for new residential, commercial, agricultural,
  community buildings (and also conversion of existing buildings) and residential extensions with an increase
  of more than 100sqm internal floor area.
confidence: medium
notes: 'Audit (missing_requirement): the workbook had this only as a garbled tab item.'
review-status: unverified
field-status: {}
