reference: sustainability-statement
local-authority: SDNPA
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New residential, commercial, agricultural or community buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversion of existing buildings.
  - all:
    - condition:
        field: residential-extension
        value: true
        description: A residential extension.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Increase of more than 100 sq m internal floor area.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD48; SDNPA Sustainable Construction SPD (adopted August 2020)
source-text: All applications for new residential, commercial, agricultural, community buildings (and
  also conversion of existing buildings) and residential extensions with an increase of more than 100sqm
  internal floor area.
confidence: medium
notes: From the council's list (published March 2024), page 14. The list calls this a Sustainability Assessment.
review-status: unverified
field-status: {}
