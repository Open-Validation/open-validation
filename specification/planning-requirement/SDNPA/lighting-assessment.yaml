reference: lighting-assessment
local-authority: SDNPA
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: The proposal includes outdoor lighting.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: outside-urban-area
        value: true
        description: Development outside settlement boundaries.
  - site:
      in:
      - listed-building-setting
      - conservation-area
      description: In the vicinity of a listed building or within a conservation area.
  - condition:
      field: protected-species
      value: true
      description: Bats and their roosts or other protected species are present.
  - discretionary
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD8; SDNPA Dark Night Skies Technical Advice Note
source-text: All applications which include outdoor lighting … All applications for development outside
  settlement boundaries other than householder … All applications in the vicinity of a listed building
  or within a conservation area … All applications at a location where bats and their roosts or other
  protected species are present … Please note that this list is not exhaustive, and you may be required
  to submit a lighting assessment during the course of your application
confidence: medium
notes: From the council's list (published March 2024), page 9. The list 'is not exhaustive', so other
  cases are shown as discretionary. The list says 'other than householder' (or 'with the exception of
  householder'); the rules can't say 'not householder', so the main planning application types are listed.
review-status: unverified
field-status: {}
