reference: land-contamination-assessment
local-authority: SDNPA
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected (including previous military uses), or the site
        is within 250m of a current licensed or historic landfill site.
  - discretionary
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
source-text: Land contamination Assessment All applications if contamination is known/suspected to exist,
  including previous military uses in case of unexploded ordnance and ordnance clearance All applications
  where the site is within 250m of a current licensed or historic landfill site.
confidence: medium
notes: 'Audit (wrong_app_type): not a minerals and waste requirement; it applies to all applications.
  A sensitive use proposed on previously used land is shown as officer discretion.'
