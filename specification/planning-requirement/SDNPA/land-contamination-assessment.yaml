reference: land-contamination-assessment
local-authority: SDNPA
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: 'Contamination is known or suspected (including previous military uses: unexploded
        ordnance and ordnance clearance), or groundworks where a previous use of the site or a nearby
        site may have introduced contamination.'
  - site:
      in:
      - near-landfill-site
      description: Within 250m of a current licensed or historic landfill site.
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive land use is proposed (e.g. housing, private gardens, allotments, schools
        or nurseries).
  - discretionary
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policy SD55
source-text: All applications if contamination is known/suspected to exist, including previous military
  uses in case of unexploded ordnance and ordnance clearance … All applications where the site is within
  250m of a current licensed or historic landfill site. … All applications where one or more of the following
  applies should be accompanied by a desk study report (including a site walkover and conceptual site
  model) which concludes with a preliminary risk assessment.
must-include:
- item: Desk study report, including a site walkover and conceptual site model, concluding with a preliminary
    risk assessment
  level: should
confidence: medium
notes: From the council's list (published March 2024), page 8. A desk study is also needed where 'a potentially
  polluting land use is proposed'; there is no field for that, so it is shown as discretionary.
review-status: unverified
field-status: {}
