reference: flood-risk-assessment
local-authority: SDNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3 (including minor applications and changes of use).
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site area greater than 1 hectare (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site area greater than 1 hectare (Flood Zone 1).
  - site:
      in:
      - surface-water-flood-risk
      description: Under 1 hectare in Flood Zone 1 but could be affected by sources of flooding other
        than rivers and the sea (for example surface water drains, reservoirs), including a change of
        use to a more vulnerable class.
  - site:
      in:
      - critical-drainage-area
      description: In an area of Flood Zone 1 with critical drainage problems notified by the Environment
        Agency.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policies SD17 and SD49
source-text: All applications where:- … site area is greater than 1 Ha in Flood Zone 1; All proposals
  where application site is in Flood Zones 2 and 3 (including minor applications and changes of use);
  all applications less than 1ha in Flood Zone 1 (including a change of use to a more vulnerable class
  (e.g. from commercial to residential) where they could be affected by sources of flooding other than
  rivers and the sea (e.g. surface water drains, reservoirs); in an area within Flodd Zone 1 which has
  critical drainage problems as notified by the Environment Agency.
confidence: medium
notes: From the council's list (published March 2024), page 6.
review-status: unverified
field-status: {}
