reference: flood-risk-assessment
local-authority: SDNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All proposals in Flood Zones 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: A site over 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: A site over 1 hectare in Flood Zone 1.
  - site:
      in:
      - critical-drainage-area
      description: A site under 1 hectare in Flood Zone 1 with other flood risk or in a critical drainage
        area.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
