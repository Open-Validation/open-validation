notes: From the council's list (published March 2024), page 8-9. The list calls this 'Landscape Appraisal/Study/Relative
  Tranquillity and Visual Impact assessment Relative Tranquillity/Safeguarding views/Landscape Character';
  the whole authority area is a National Park. A full Landscape & Visual Impact Assessment is only required
  as part of an EIA. The list says 'other than householder' (or 'with the exception of householder');
  the rules can't say 'not householder', so the main planning application types are listed.
