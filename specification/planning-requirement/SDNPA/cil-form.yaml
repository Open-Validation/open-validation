      in:
      - hh
      - full
      - s73
      - outline
      - reserved-matters
- item: 'Form 5: Notice of Chargeable Development, for prior approvals and certificates of lawful use
    (existing and proposed)'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
      - ldc-existing-use
      - ldc-prospective-use
