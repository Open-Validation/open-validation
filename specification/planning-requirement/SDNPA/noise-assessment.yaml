reference: noise-assessment
local-authority: SDNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Likely to generate noise that may raise issues of disturbance and/or reduce tranquillity.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential or other noise-sensitive uses proposed next to existing noise sources.
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
policy: South Downs Local Plan policies SD7 and SD54
source-text: All applications for development other than householder likely to generate noise that may
  raise issues of disturbance by noise and/or reduce tranquillity, including where residential or other
  noise sensitive uses are proposed adjacent to existing noise sources.
confidence: medium
notes: From the council's list (published March 2024), page 11. The list says 'other than householder'
  (or 'with the exception of householder'); the rules can't say 'not householder', so the main planning
  application types are listed.
review-status: unverified
field-status: {}
