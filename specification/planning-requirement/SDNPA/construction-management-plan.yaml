reference: construction-management-plan
local-authority: SDNPA
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: Major development of more than 80 dwellings.
  - discretionary
source-url: https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
source-text: All applications for major development in excess of 80 properties or significant commercial/industrial/tourism
  development.
confidence: medium
notes: From the council's list (published March 2024), page 15. The list calls this a Construction Traffic
  Management Plan and refers to the Transport Assessment for policy. 'Significant' commercial, industrial
  or tourism development has no threshold, so it is shown as discretionary. A Strategic Traffic Management
  Plan has the same trigger; it has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
