reference: site-plan
local-authority: FYL
required-if: discretionary
source-url: https://new.fylde.gov.uk/validation-checklist/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Other information as required dependent on the application type. All drawings and plans
  should include a drawing reference number and you will need to provide a schedule of the drawings you
  are submitting on your application form. The plans required can include: … Block plan of the site (e.g.
  at a scale of 1:100 or 1:200)'
must-include:
- item: At a scale such as 1:100 or 1:200
  level: must
- item: The position of north, site boundaries and other buildings on the site
  level: must
- item: Written dimensions, including the external measurements of the proposed extensions/buildings and
    those to the boundaries
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: Public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing; boundary treatment including walls or fencing where proposed
  level: should
confidence: medium
notes: From the council's list (Validation Checklist web page, last modified 17 August 2022), page 1.
  The page lists the plans that 'can' be required 'dependent on the application type' without saying which
  types, so discretionary. The 'should' items are to be shown 'unless these will not influence or be affected
  by the proposed development'.
review-status: unverified
field-status: {}
