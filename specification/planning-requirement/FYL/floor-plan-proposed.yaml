reference: floor-plan-proposed
local-authority: FYL
required-if: discretionary
source-url: https://new.fylde.gov.uk/validation-checklist/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Other information as required dependent on the application type. All drawings and plans
  should include a drawing reference number and you will need to provide a schedule of the drawings you
  are submitting on your application form. The plans required can include: … Existing and proposed floor
  plans (e.g. at a scale of 1:50 or 1:100) showing boundaries with written dimensions to them'
must-include:
- item: At a scale such as 1:50 or 1:100
  level: must
- item: Boundaries, with written dimensions to them
  level: must
- item: External dimensions of the proposed extensions/buildings
  level: must
- item: The proposed uses of the rooms within the building (e.g. bedroom, kitchen, garage)
  level: must
confidence: medium
notes: From the council's list (Validation Checklist web page, last modified 17 August 2022), page 1.
  Listed among the plans that 'can' be required 'dependent on the application type', with no types given,
  so discretionary.
