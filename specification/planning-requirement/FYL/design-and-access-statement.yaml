reference: design-and-access-statement
local-authority: FYL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://new.fylde.gov.uk/validation-checklist/
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: You may be also required to produce a Design and Access Statement to accompany your application.
  … Design and Access Statement, if required
confidence: medium
notes: From the council's list (Validation Checklist web page, last modified 17 August 2022), page 1.
  The checklist only says 'if required' and links the council's Design and Access Statement page (https://new.fylde.gov.uk/resident/planning/design-and-access-statement/,
  last modified May 2019), whose list of exceptions ('All applications will require a Statement except...')
  predates the 2013 change to the law. The rule shown is the statutory one (DMPO article 9).
review-status: unverified
field-status: {}
