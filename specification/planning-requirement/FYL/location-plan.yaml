reference: location-plan
local-authority: FYL
required-if:
  always: true
source-url: https://new.fylde.gov.uk/validation-checklist/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Location plan. This is a plan that identifies the land to which the application relates
  drawn to a scale of 1:1250 with the site and surrounding land and roads indicated.
must-include:
- item: Drawn at a scale of 1:1250, with the site and surrounding land and roads indicated
  level: must
- item: Application site edged with a red line, including all land needed for access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings
  level: should
- item: Any other land owned by the applicant but not part of the application site outlined in blue
  level: should
confidence: medium
notes: From the council's list (Validation Checklist web page, last modified 17 August 2022), page 1.
  The red and blue line items are 'should' in the council's wording.
review-status: unverified
field-status: {}
