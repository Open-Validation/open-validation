reference: sustainability-statement
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: protected-landscape-major-development
      value: true
      description: 'Major development as defined for paragraphs 172 and 173 of the NPPF (2019): a matter
        for the decision maker, taking into account its nature, scale and setting.'
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1 and DM13; NPPF paragraphs 7, 17 and
  93 to 97
source-text: 'A Sustainability Statement is required for: ... Major developments'
must-include:
- item: How the development meets each relevant requirement of Local Plan policy ST1 (criteria a to m)
  level: must
- item: 'Renewable energy proposals: compliance with Local Plan policy DM13'
  level: must
  required-if:
    condition:
      field: renewable-energy-development
      value: true
      description: The development generates renewable energy.
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 24, page 43. It can be part of a Planning Statement if the information is
  provided. The list's footnote defines major development 'as set out for paragraphs 172 and 173 of NPPF
  (2019)' and says whether a proposal is major 'is a matter for the decision maker', so it is shown with
  protected-landscape-major-development rather than MHCLG's major-development thresholds.
review-status: unverified
field-status: {}
