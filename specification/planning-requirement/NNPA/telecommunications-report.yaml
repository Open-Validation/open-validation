reference: telecommunications-report
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: Mast and antenna development by mobile phone network operators.
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies DM1; NPPF chapter 10; Code of Practice on
  Mobile Network Development in England (2016)
source-text: Planning applications for mast and antenna development by mobile phone network operators.
must-include:
- item: Area of search
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification
  level: must
- item: Evidence of mast sharing
  level: must
- item: Details of any consultation undertaken
  level: must
- item: A signed declaration that the equipment and installation comply with the ICNIRP radio frequency
    public exposure guidance
  level: must
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 25, page 45. The telecommunications prior notification checklist says 'Required
  in all cases'.
review-status: unverified
field-status: {}
