reference: roof-plan-proposed
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - non-material-amendment
      - s73
      - pa-build-agri-forest
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: There is an alteration to an existing roof.
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1 and ST2; Town and Country Planning (Development
  Management Procedure) (England) Order 2015 article 7(1)(c)(ii)
source-text: Should be submitted where there is an alteration to an existing roof, or otherwise where
  this is expected to add to the understanding of the proposal.
must-include:
- item: The shape of the roof and its location
  level: should
- item: The roofing material to be used
  level: should
- item: At a scale of 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 04, page 13. 'Otherwise where this is expected to add to the understanding'
  is shown as discretionary.
review-status: unverified
field-status: {}
