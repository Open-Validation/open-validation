reference: elevation-existing
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - lbc
        - ldc-existing-use
        - ldc-prospective-use
        - non-material-amendment
        - s73
        - pa-build-agri-forest
    - condition:
        field: external-alterations
        value: true
        description: External alterations are proposed ...
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1 and ST2; Town and Country Planning (Development
  Management Procedure) (England) Order 2015 article 7(1)(c)(ii)
source-text: Elevation plans should be submitted for all applications where external alterations are proposed
  and where this adds to the understanding of the proposal.
must-include:
- item: At a recognised scale (for example 1:50 or 1:100)
  level: should
- item: All external sides of the proposal shown
  level: must
  source-text: All external sides of the proposal must be shown,
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: must
- item: Relationship to an adjoining or nearby building/structure and the positions of openings on each
  level: should
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: The elevation adjoins or is close to another building.
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 01, page 10. '... and where this adds to the understanding of the proposal'
  is shown as discretionary. The telecommunications prior notification checklist says 'Required in all
  cases'. Blank or unchanged elevations are not always required.
review-status: unverified
field-status: {}
