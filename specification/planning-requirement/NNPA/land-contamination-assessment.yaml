reference: land-contamination-assessment
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - site:
        in:
        - contaminated-land
        description: Land contamination can reasonably be expected to be found.
    - all:
      - condition:
          field: new-build
          value: true
          description: New development ...
      - condition:
          field: sensitive-end-use
          value: true
          description: '... with a sensitive end use (including dwellings, schools, playgrounds, nurseries
            and care homes).'
    - site:
        in:
        - coalfield-area
        description: Within a former mining area as identified by the Coal Authority, irrespective of
          low or high risk.
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST2; NPPF paragraphs 178 to 179; Environmental
  Protection Act 1990 Part 2A
source-text: All applications where land contamination can reasonably be expected to be found (non- householder).
  All new development with a sensitive end use (including dwellings, schools, playgrounds, nurseries and
  care homes). All applications (non-householder) within a former mining area as identified by the Coal
  Authority, irrespective of the designation as either low or high risk
must-include:
- item: 'A Phase 1 Land Contamination Assessment: desktop study, site walkover and in some cases a conceptual
    site model'
  level: should
- item: Previous uses of the land and adjacent land, and potential sources of contamination, receptors
    and pathways
  level: should
- item: Mine gas protection measures, where needed in the coalfield
  level: should
  required-if:
    site:
      in:
      - coalfield-area
      description: Site is in the coalfield.
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 14, page 30. Non-householder applications only. For removal or variation of
  a condition only where the condition relates to land contamination. The outline checklists mark it 'May
  be required'.
review-status: unverified
field-status: {}
