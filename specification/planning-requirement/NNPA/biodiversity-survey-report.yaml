reference: biodiversity-survey-report
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - s73
  - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1 and DM10; NPPF paragraphs 175 to 177;
  Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017; Protection
  of Badgers Act 1992; NERC Act 2006
source-text: 'When wildlife or biodiversity may be affected by the proposals. Proposals which include,
  but are not limited to, work listed below could have the potential to affect protected species or habitats:
  • The demolition or alteration of buildings (particularly older buildings) including Work affecting
  roof spaces; • Erection of wind turbines close to trees or buildings; • Removal of trees or other vegetation;
  • Works impacting upon, or with a pathway to affect watercourses. • Loss of areas or natural or semi-natural
  habitat'
must-include:
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: should
- item: Surveys (full ecological surveys, bat and barn owl surveys or risk assessments) with an assessment
    of risk and appropriate mitigation, where there is potential harm to protected species or priority
    habitats
  level: should
- item: Any further survey work recommended by an initial Phase 1 Habitat Survey or risk assessment, carried
    out and submitted at validation
  level: must
  source-text: If initial Phase 1 Habitat Surveys or risk assessments recommend further survey work these
    should be carried out and submitted with the application at validation stage.
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 08, page 17. 'When wildlife or biodiversity may be affected' with a non-exhaustive
  list of examples (demolition or alteration of buildings including roof spaces, wind turbines close to
  trees or buildings, removal of trees or vegetation, works affecting watercourses, loss of semi-natural
  habitat), and 'each case is individually assessed', so it is shown as discretionary. For removal or
  variation of a condition only where the condition relates to biodiversity. The outline checklists mark
  it 'May be required'.
