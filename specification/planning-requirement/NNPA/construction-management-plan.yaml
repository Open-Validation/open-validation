reference: construction-management-plan
local-authority: NNPA
required-if:
  application-type:
    in:
    - pa-demo-building
source-url: https://www.northumberlandnationalpark.org.uk/planning/planning-permission/validation-checklist/prior-notification-proposed-demolition-checklist/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Demolition Method Statement (see below for detail) Required in all cases
must-include:
- item: A noise management plan, including monitoring of demolition noise
  level: should
- item: A scheme to control dust from demolition works
  level: should
- item: Chassis and wheel cleaning for demolition vehicles, with contingency measures and cleaning of
    affected public highways
  level: should
- item: Working hours for demolition works
  level: should
- item: Demolition access from the highway, loading and unloading clear of the highway, and any haul routes
  level: should
- item: Parking for contractors' vehicles
  level: should
- item: Access and deliveries, including hours
  level: should
confidence: medium
notes: 'From the Prior Notification Proposed Demolition Checklist web page, which asks for a ''Demolition
  Method Statement'' in all cases: ''A demolition and construction management plan should include'' the
  items listed. The same checklist requires display of a site notice (not a document).'
review-status: unverified
field-status: {}
