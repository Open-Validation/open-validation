reference: sci
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: protected-landscape-major-development
      value: true
      description: 'Major development as defined for paragraphs 172 and 173 of the NPPF (2019): a matter
        for the decision maker, taking into account its nature, scale and setting.'
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: NPPF
source-text: When required? For all major developments
must-include:
- item: The steps taken to consult the public on the proposal
  level: must
- item: Feedback received from communities and how it was considered in the final proposals
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 22, page 41. The list's footnote defines major development 'as set out for
  paragraphs 172 and 173 of NPPF (2019)' and says whether a proposal is major 'is a matter for the decision
  maker', so it is shown with protected-landscape-major-development rather than MHCLG's major-development
  thresholds. The outline checklists mark it 'May be required'.
review-status: unverified
field-status: {}
