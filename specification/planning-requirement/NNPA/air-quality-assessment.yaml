reference: air-quality-assessment
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
  - all:
    - application-type:
        in:
        - full
        - outline
        - s73
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1 and ST2; NPPF paragraph 181
source-text: Where the development would be likely to result in a materially adverse effect upon local
  air quality, including proposals for industrial processes where there are direct emissions to the air.
  This will always be required for new minerals sites or extensions to existing sites. This may be required
  for biomass boilers or a combined heat and power systems.
must-include:
- item: The existing local air quality (existing baseline)
  level: must
- item: Predicted future air quality without the development (future baseline)
  level: must
- item: Predicted future air quality with the development in place
  level: must
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 07, page 16. 'Always required for new minerals sites or extensions to existing
  sites' is shown as the mineral-extraction application type; 'likely to result in a materially adverse
  effect' (including industrial processes with direct emissions) and biomass boilers or combined heat
  and power ('may be required') are discretionary. For removal or variation of a condition only where
  the condition relates to air quality.
review-status: unverified
field-status: {}
