reference: location-plan
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - consent-under-tpo
      - notice-trees-in-con-area
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-ecomms-network
      - pa-demo-building
  - all:
    - application-type:
        in:
        - non-material-amendment
        - s73
        - approval-condition
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7(1)(c)(i)
source-text: When required? In all cases. In the case of discharge of condition applications, a location
  plan is not always necessary as long there is sufficient information to enable the authority to identify
  the previous grant of planning permission and the associated condition(s) which the applicant is seeking
  to discharge.
must-include:
- item: Based on an up to date map
  level: must
  source-text: All applications must include copies of a location plan based on an up to date map.
- item: An identified standard metric scale (typically 1:1250 or 1:2500)
  level: should
- item: The direction of North
  level: should
- item: Sufficient roads and/or buildings on adjoining land, numbered or named, to make the exact location
    clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around any other land owned or controlled by the applicant close to or adjoining the
    site
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), NATIONAL 02, page 5. The non-material amendment checklist says 'Required in most
  cases' and the removal or variation of a condition checklist 'May be required'; for discharge of conditions
  a location plan is not always needed. Those are shown as discretionary.
review-status: unverified
field-status: {}
