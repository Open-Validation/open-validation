reference: design-and-access-statement
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - world-heritage-site
            - conservation-area
            description: The site lies within a 'designated area' (a World Heritage Site or a Conservation
              Area) ...
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: '... and consists of one or more dwellings ...'
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: '... or a building or buildings of 100 square metres or more.'
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Northumberland
  National Park Local Plan 2020 policies ST1 and DM14
source-text: 'A Design and Access Statement is required for applications consisting of the following:
  • Applications for major development. • If the application site lies within a “designated area” (a World
  Heritage Site or a Conservation Area) and consists of i) one or more dwellings; or ii) a building or
  buildings of 100 square metres or more. • Applications for Listed Building Consent.'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Shows the steps taken to appraise the context and how the design takes that context into account
  level: must
- item: Explains the approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Details any consultation on access issues and how it informed the development
  level: must
- item: 'Listed building consent: how the design takes account of the building''s special architectural
    or historic importance, its physical features and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: how access issues have been dealt with, unless the works only affect
    the interior'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), NATIONAL 05, page 8. Waste development, a material change of use, engineering or
  mining operations and variation of conditions do not need one. The major development here is the national
  DMPO definition (the list does not footnote it).
review-status: unverified
field-status: {}
