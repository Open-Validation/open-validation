reference: design-and-access-statement
local-authority: NNPA
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building of 100 square metres or more.
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a Conservation Area or World Heritage Site.
  - application-type:
      in:
      - lbc
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
source-text: 'NATIONAL 05 Design & Access Statement When required? A Design and Access Statement is required
  for applications consisting of the following: Applications for major development.'
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt stops after major development; the list also names 1+ dwellings
  or 100sqm+ buildings in a Conservation Area or World Heritage Site, and listed building consent.'
review-status: unverified
field-status: {}
