reference: transport-assessment
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: protected-landscape-major-development
      value: true
      description: 'Major development as defined for paragraphs 172 and 173 of the NPPF (2019): a matter
        for the decision maker, taking into account its nature, scale and setting.'
  - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1, ST3 and DM9; NPPF paragraph 84 and
  chapter 9
source-text: Applications for major development ... that have the potential to generate significant vehicle
  movements.
must-include:
- item: The impact on traffic movement and highway safety, quantified and assessed
  level: should
- item: How the development could be accessed by alternative transport modes and how they would be promoted
  level: should
- item: Any proposals for access or transport improvements
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 26, page 46. 'Potential to generate significant vehicle movements' is discretionary.
  For other development the transport outcomes are normally covered in the Planning Statement. The list's
  footnote defines major development 'as set out for paragraphs 172 and 173 of NPPF (2019)' and says whether
  a proposal is major 'is a matter for the decision maker', so it is shown with protected-landscape-major-development
  rather than MHCLG's major-development thresholds.
review-status: unverified
field-status: {}
