reference: section-existing
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - non-material-amendment
      - s73
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: Site levels are being changed as part of the application.
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1 and ST2; Town and Country Planning (Development
  Management Procedure) (England) Order 2015 article 7(1)(c)(ii)
source-text: Should be submitted for applications where this would be expected to add to the understanding
  of the proposal, including where site levels are being changed as part of the application.
must-include:
- item: At a recognised scale (e.g. 1:50 or 1:100)
  level: should
- item: How the proposed development relates to existing site levels and adjacent land, with levels related
    to a fixed datum point off site
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 03, page 12. The checklists call it 'Existing and Proposed Site Sections and
  Layout' (or 'and Site Levels').
review-status: unverified
field-status: {}
