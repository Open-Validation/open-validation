reference: arboriculturist-report
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - s73
  - any:
    - condition:
        field: tree-removal
        value: true
        description: Trees are to be felled.
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1, DM10, DM11 and DM12; NPPF paragraphs
  8 and 175; BS 5837:2012
source-text: For all development that would potentially have a material impact on trees, including their
  root protection zones, either directly or indirectly.
must-include:
- item: A detailed and accurate plan with trees and their canopies plotted
  level: must
- item: A schedule of the species, size and condition of each tree
  level: must
- item: An assessment of the impacts of the development on trees
  level: must
- item: Recommendations for work, including which trees are to be felled and why
  level: must
- item: For retained trees, the means of protection during construction, including root protection zones
    and protective fencing specifications
  level: must
- item: Age class, physiological and structural condition, preliminary management recommendations, estimated
    remaining contribution in years and category grading
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: A tree is protected by a Tree Preservation Order or the site is in a Conservation Area.
  source-text: 'The following additional information will also be required where a tree is protected by
    a Tree Preservation Order or the site is located in a Conservation Area:'
- item: Prepared by a suitably qualified and experienced arboriculturist to BS 5837:2012
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 28, page 48. The list calls it a Tree Survey / Arboricultural implications.
  'Potentially have a material impact on trees' is a judgement, so beyond felling it is discretionary.
  The outline checklists mark it 'May be required'.
review-status: unverified
field-status: {}
