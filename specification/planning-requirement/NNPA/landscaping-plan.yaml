reference: landscaping-plan
local-authority: NNPA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: protected-landscape-major-development
        value: true
        description: 'Major development as defined for paragraphs 172 and 173 of the NPPF (2019): a matter
          for the decision maker, taking into account its nature, scale and setting.'
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - s73
    - discretionary
  - all:
    - application-type:
        in:
        - consent-under-tpo
        - notice-trees-in-con-area
    - condition:
        field: landscaping-works
        value: true
        description: New landscaping is proposed.
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST2 and DM11; NPPF paragraph 172
source-text: Planning applications where landscaping would be a consideration in the assessment of the
  application and /or would contribute to the acceptability of the proposal. They will always be needed
  for Major development ... Landscaping Plan Required if new landscaping is proposed
must-include:
- item: Existing trees, shrubs and other landscape features, showing which are retained and which removed
  level: should
- item: Planting plans, specifications and schedules of plants (species, sizes, numbers/densities)
  level: should
- item: Existing and proposed levels and contours
  level: should
- item: Means of enclosure, walls, retaining walls and boundary treatment
  level: should
- item: Paving and surface treatment, parking and circulation layouts, landscape furniture, equipment,
    storage, signage, lighting, services and drainage
  level: should
- item: Location of site cabins and compounds
  level: should
- item: Existing and proposed watercourses and associated landscaping
  level: should
- item: Management and maintenance arrangements
  level: should
- item: A landscape strategy, for phased major applications
  level: should
  required-if:
    condition:
      field: protected-landscape-major-development
      value: true
      description: 'Major development as defined for paragraphs 172 and 173 of the NPPF (2019): a matter
        for the decision maker, taking into account its nature, scale and setting.'
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 16, page 33. 'Where landscaping would be a consideration ... and/or would
  contribute to the acceptability of the proposal' is discretionary. The list's footnote defines major
  development 'as set out for paragraphs 172 and 173 of NPPF (2019)' and says whether a proposal is major
  'is a matter for the decision maker', so it is shown with protected-landscape-major-development rather
  than MHCLG's major-development thresholds.
review-status: unverified
field-status: {}
