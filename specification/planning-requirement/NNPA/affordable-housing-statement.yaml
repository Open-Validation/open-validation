reference: affordable-housing-statement
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 6
        description: The creation of six or more new dwellings.
    - condition:
        field: affordable-housing-proposed
        value: true
        description: Conversion of buildings outside settlements to one or more units of affordable housing,
          or the creation of affordable housing in named settlements.
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST4 and DM3; NPPF paragraph 63
source-text: 'An Affordable Housing Statement is required for applications for: • The creation of six
  or more new dwellings • Applications that wish to convert buildings outside settlements to one or more
  units of affordable housing. • Applications for the creation of affordable housing in named settlements'
must-include:
- item: The type, tenure and number of affordable housing units proposed
  level: should
- item: Details of any commuted sum proposed
  level: should
- item: An assessment of the need for affordable housing in the area, referring to an up to date Housing
    Needs Survey, with evidence that the level and type proposed is appropriate and meets the identified
    need
  level: must
  source-text: A statement also needs to provide an assessment of the need for affordable housing in the
    area where the application site lies.
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 06, page 15. Policy DM3 asks schemes of six or more dwellings to provide 50%
  affordable housing where a need exists. The Full checklist summarises it as 'May be required where affordable
  housing is being proposed and for schemes of more than 5 houses'; the removal or variation of a condition
  checklist says it 'applies to new residential units'. The outline checklists mark it 'May be required'.
review-status: unverified
field-status: {}
