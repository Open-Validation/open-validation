reference: planning-statement
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - ldc-existing-use
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: protected-landscape-major-development
          value: true
          description: 'Major development as defined for paragraphs 172 and 173 of the NPPF (2019): a
            matter for the decision maker, taking into account its nature, scale and setting.'
      - condition:
          field: departure-from-development-plan
          value: true
          description: Development not in accordance with the development plan.
      - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - non-material-amendment
        - s73
        - pa-build-agri-forest
        - pa-road-agri-forest
        - pa-excavate-agri
    - discretionary
  - all:
    - application-type:
        in:
        - consent-under-tpo
        - notice-trees-in-con-area
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST3 and ST4; NPPF paragraph 172
source-text: 'A supporting Planning Statement is required for: ... Major developments ... Developments
  not in accordance with the development plan'
must-include:
- item: Background information and an assessment of how the proposal accords with the development plan
    and other material considerations
  level: should
- item: The need for the proposed development
  level: should
- item: 'Lawful development certificates (existing): the reasoning why the Certificate is sought, with
    evidence'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
  source-text: In all cases to set out the reasoning why the Certificate is being sought and provide evidence.
- item: 'Wind turbines: why the turbine is needed, design and siting, wind speed data, evidence of need
    and feasibility, and a shadow flicker report'
  level: should
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: The application is for wind turbine(s).
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 21, page 39. Also 'strongly recommended' for any application raising complex
  planning issues (discretionary). The tree works checklist requires one 'in all cases where the application
  form alone does not both specify the work ... and a statement of the applicant's reasons', and other
  checklists say 'May be required' (discretionary). The list's footnote defines major development 'as
  set out for paragraphs 172 and 173 of NPPF (2019)' and says whether a proposal is major 'is a matter
  for the decision maker', so it is shown with protected-landscape-major-development rather than MHCLG's
  major-development thresholds.
review-status: unverified
field-status: {}
