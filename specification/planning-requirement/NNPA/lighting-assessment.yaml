reference: lighting-assessment
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - s73
  - condition:
      field: external-lighting
      value: true
      description: New or additional external lighting is proposed as part of new development.
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1, ST2 and DM11; NPPF paragraph 180
source-text: A Lighting Assessment should be submitted with any application where new or additional external
  lighting is proposed as part of any new development.
must-include:
- item: Layout plan and/or elevation plans showing the location of proposed external lighting
  level: should
- item: A specification of the lighting design, including technical information, lux levels, beam orientation,
    proposed hours of illumination and measures such as motion sensors
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 17, page 35. Northumberland National Park is part of the International Dark
  Sky Park. For removal or variation of a condition only where the condition relates to lighting.
review-status: unverified
field-status: {}
