reference: application-form
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - non-material-amendment
      - consent-under-tpo
      - notice-trees-in-con-area
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-ecomms-network
      - pa-demo-building
  - all:
    - application-type:
        in:
        - approval-condition
        - s73
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: When required? In all cases. In the case of discharge of condition applications, a location
  plan is not always necessary as long there is sufficient information to enable the authority to identify
  the previous grant of planning permission and the associated condition(s) which the applicant is seeking
  to discharge.
must-include:
- item: Completed, signed and dated
  level: must
- item: A clear and concise description of the proposed development
  level: must
- item: All relevant questions answered, or 'not applicable' / 'N/A' inserted
  level: should
- item: The relevant ownership certificate (A, B, C or D) completed, with Article 13 notices served and
    any newspaper advert placed where needed
  level: must
  source-text: The relevant certificates concerning the ownership of the application site must accompany
    all forms of applications.
- item: The agricultural land declaration signed
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
  source-text: It is incorporated into the standard application form, and must be signed for the application
    to be valid.
confidence: medium
notes: 'From the council''s list (Local Validation Checklist December 2020, approved 25 January 2021,
  reviewed 21 September 2023), NATIONAL 01, page 3. For approval of details reserved by condition and
  removal or variation of a condition the checklists say the form ''is not mandatory: a written submission
  is acceptable'', so those are shown as discretionary. No agricultural land declaration is needed for
  reserved matters, discharge or variation of conditions, tree works, listed building consent, lawful
  development certificates, prior notifications, non-material amendments or advertisement consent.'
review-status: unverified
field-status: {}
