reference: flood-risk-assessment
local-authority: NNPA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
        - s73
    - site:
        in:
        - flood-risk-zone
        description: Development within Flood Zones 2 or 3.
  - all:
    - application-type:
        in:
        - full
        - outline
        - s73
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development on a site of 1 ha or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development on a site of 1 ha or greater.
      - all:
        - condition:
            field: more-vulnerable-use-change
            value: true
            description: Development or a change of use to a more vulnerable class ...
        - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST1; NPPF chapter 14
source-text: 'For development proposals: ... Development within Flood Zones 2 & 3: ... Development on
  sites of 1ha or greater; ... Development or changes of use to a more vulnerable class that may be subject
  ... to other sources of flooding'
must-include:
- item: A simple flood risk assessment (Environment Agency standing advice) for residential extensions
    and non-residential extensions under 250 square metres in Flood Zones 2 and 3
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3.
    - condition:
        field: floorspace
        operator: <
        value: 250
        description: Residential extensions, or non-residential extensions of less than 250 square metres.
- item: 'Otherwise: the risks of all forms of flooding to and from the development and how they will be
    managed, taking climate change into account'
  level: should
- item: The design of surface water management systems, including Sustainable Drainage Systems
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: A sequential assessment of available sites (Sequential Test and/or Exception Test, where relevant)
    for new development in Flood Zones 2 and 3
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: New development in Flood Zones 2 and 3.
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOC12, page 24. 'Changes of use to a more vulnerable class that may be subject to
  other sources of flooding' is shown as discretionary. The householder checklist limits it to Flood Zones
  2 and 3. The outline checklists mark it 'May be required'.
review-status: unverified
field-status: {}
