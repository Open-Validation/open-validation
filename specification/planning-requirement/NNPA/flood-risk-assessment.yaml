reference: flood-risk-assessment
local-authority: NNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Development within Flood Zones 2 and 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use to a more vulnerable class.
    - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
source-text: 'LOC12 Flood Risk Assessment (FRA) When required? For development proposals: Development
  within Flood Zones 2 & 3:'
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt is cut off; it omits sites of 1ha or more and changes of use
  to a more vulnerable class. The audit confirms it applies to householder applications.'
review-status: unverified
