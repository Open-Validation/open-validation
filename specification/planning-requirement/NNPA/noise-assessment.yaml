reference: noise-assessment
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Likely to have an impact on noise and/or vibration sensitive locations (for example
          air conditioning, heat pumps, ventilation, biomass boilers, public address systems, recycling
          centres, plant movements, mineral workings, wind turbines).
    - condition:
        field: noise-sensitive-use
        value: true
        description: Introduces noise and/or vibration sensitive development into areas where noise and/or
          vibration are likely to have an adverse impact.
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies ST2; NPPF paragraph 180
source-text: All applications likely to have an impact on noise and/ or vibration sensitive locations
  and all applications that introduce noise and/ or vibration sensitive developments into areas and locations
  where noise and/ or vibration are likely to have an adverse impact. Examples include air conditioning
  units, heat pumps, ventilation & refrigeration, biomass boilers, public address systems, recycling centres,
  vehicle & plant movements and operation, mineral workings and wind turbines.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Potential sources of noise and how they may affect local amenity
  level: should
- item: Mitigation measures
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 18, page 36. For removal or variation of a condition only where the condition
  relates to noise impacts. The outline checklists mark it 'May be required'.
review-status: unverified
field-status: {}
