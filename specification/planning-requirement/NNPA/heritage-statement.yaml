reference: heritage-statement
local-authority: NNPA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - advertising
        - s73
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - scheduled-monument
          - battlefield
          - locally-listed-building
          - historic-environment-record
          description: Development potentially affecting the preservation of a designated heritage asset
            (scheduled monuments, listed buildings, conservation areas, historic battlefields) or a non-designated
            heritage asset, or their setting.
      - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies DM14 and DM15; NPPF chapter 16; Planning
  (Listed Buildings and Conservation Areas) Act 1990 sections 66 and 72
source-text: A Heritage Statement is required for any planning or listed building applications for development
  potentially affecting the preservation of any designated or non-designated heritage asset, or their
  setting.
must-include:
- item: The Northumberland National Park Historic Environment Record consulted as a minimum
  level: should
  source-text: The Northumberland National Park HER should normally be consulted as a minimum
- item: Proportionate to the significance of the heritage asset
  level: should
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOC15, page 28. The listed building checklist says 'Always required'. Non-designated
  assets (for example pre-1914 buildings, archaeological sites or designed landscapes) and whether a building
  has enough interest are matters to check with the authority, so that part is discretionary. No separate
  statement is needed where a Design and Access Statement adequately assesses every heritage asset affected.
  The authority may also require a Desk Based Assessment and field evaluation.
review-status: unverified
field-status: {}
