reference: site-plan
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - non-material-amendment
      - s73
      - approval-condition
      - consent-under-tpo
      - notice-trees-in-con-area
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-ecomms-network
      - pa-demo-building
  - discretionary
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7(1)(c)(ii);
  Northumberland National Park Local Plan 2020 policies ST1 and ST2
source-text: In most cases, where this is needed to identify the development and/or site or will add to
  the understanding of the proposed development.
must-include:
- item: Existing and proposed site plans at a recognised metric scale (typically 1:100 or 1:200 for householder
    applications and 1:500 otherwise)
  level: should
- item: Numbered
  level: should
- item: The direction of North
  level: should
- item: The footprint of all existing and proposed buildings on the site
  level: should
- item: 'Where relevant: buildings, roads and footpaths on adjoining land including access arrangements;
    public rights of way; existing trees on the site and adjacent land; extent and type of hard surfacing;
    boundary treatment including type and height where proposed'
  level: should
- item: 'Advertisements: a proposed site plan at 1:100 or 1:200 showing north, all buildings on site and
    the position of the advert(s) with written dimensions and distances to the site boundaries'
  level: should
  required-if:
    application-type:
      in:
      - advertising
  source-text: A proposed site plan to a scale of either 1:100 or 1:200 showing the direction of north,
    all buildings on site, and the position of the advert(s) with written dimensions and distances to
    the site boundaries as a minimum;
- item: 'Tree works: the location and species of the affected trees, clearly identifying the tree(s) (need
    not be to scale)'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  source-text: Required in most cases, showing the location and species of affected trees. This does not
    normally need to be to scale, but must clearly identify the tree (or trees) to which the application
    relates.
confidence: medium
notes: 'From the council''s list (Local Validation Checklist December 2020, approved 25 January 2021,
  reviewed 21 September 2023), NATIONAL 03, page 6. The checklists say ''Required in most cases'' (for
  discharge of conditions and variations: ''Sufficient information'' or ''May be required''), so it is
  shown as discretionary.'
review-status: unverified
field-status: {}
