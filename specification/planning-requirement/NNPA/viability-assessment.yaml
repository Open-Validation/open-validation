reference: viability-assessment
local-authority: NNPA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: dwelling-count
      operator: '>='
      value: 6
      description: A housing scheme of six or more dwellings ...
  - condition:
      field: affordable-housing-below-target
      value: true
      description: '... that the applicant does not consider viable at the relevant affordable housing
        percentage.'
source-url: https://www.northumberlandnationalpark.org.uk/wp-content/uploads/2021/01/Local-Validation-Checklist-Final.pdf
policy: Northumberland National Park Local Plan 2020 policies DM3; NPPF paragraph 63
source-text: If applicants do not feel that housing schemes would be viable at the relevant percentage
  level a financial appraisal/viability report (to include such matters as land acquisition costs, build
  costs, sales values, fees, etc.) justifying such a course of action must accompany planning applications.
must-include:
- item: Land acquisition costs, build costs, sales values, fees and similar matters
  level: must
confidence: medium
notes: From the council's list (Local Validation Checklist December 2020, approved 25 January 2021, reviewed
  21 September 2023), LOCAL 06, page 15. Part of the Affordable Housing Statement note.
review-status: unverified
field-status: {}
