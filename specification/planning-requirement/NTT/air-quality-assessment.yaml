reference: air-quality-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: The development would introduce sensitive receptors, such as a school.
      - site:
          in:
          - air-quality-management-area
          description: The site is in an area of poor air quality.
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
source-text: Air Quality Assessments will be required where a proposed development would emit dust, lead
  to an increase in congestion, HGV movements, or would introduce sensitive “receptors”, such as a school
  in an area of poor air quality.
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type):
  moved from Full planning to minerals, waste and Regulation 3. Dust, congestion and HGV movements have
  no field, so they are shown as officer discretion.'
review-status: unverified
field-status: {}
