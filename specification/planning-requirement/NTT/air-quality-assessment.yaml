reference: air-quality-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: dust-generation
        value: true
        description: The development would emit dust.
    - condition:
        field: hcv-movements
        value: true
        description: The development would lead to an increase in HGV movements.
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 180-194); Planning Practice Guidance (minerals dust)
source-text: Proposals that impact on air quality or are potential pollutants should be supported by an
  Air Quality Assessment indicating the change in air quality resulting from the proposed development,
  details of sensitive receptors/locations, the methodology used for assessing impact and the proposed
  mitigation measures. Air Quality Assessments will be required where a proposed development would emit
  dust, lead to an increase in congestion, HGV movements, or would introduce sensitive “receptors”, such
  as a school in an area of poor air quality.
must-include:
- item: The change in air quality resulting from the development
  level: must
- item: Details of sensitive receptors/locations
  level: must
- item: The methodology used for assessing impact
  level: must
- item: The proposed mitigation measures
  level: must
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 24. Dust and more HGV movements are clear
  triggers. An increase in congestion, or sensitive receptors (such as a school) in an 'area of poor air
  quality', need judgement, so they show as discretionary.
review-status: unverified
field-status: {}
