reference: transport-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 108-117); Planning Practice Guidance; Nottinghamshire
  Highways Design Guide (section 1.2.6)
source-text: All developments that generate significant amounts of vehicle movements should be supported
  by a transport assessment (TA) or a transport statement (TS). The need for a TA or TS should be scoped
  with the County Highways Authority, or in situations affecting strategic routes, National Highways.
must-include:
- item: All existing and proposed vehicular and pedestrian movements to and from the site
  level: should
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles
  level: should
- item: Existing transport conditions, how the development would affect them, and measures to overcome
    any problems
  level: should
- item: Proposed measures to improve access by public transport, walking and cycling
  level: should
confidence: medium
notes: 'From the council''s list (adopted 10 March 2026), pages 13, 14. Discretionary: ''significant''
  vehicle movements and a need scoped with the County Highways Authority (or National Highways). A Transport
  Assessment or a lighter Transport Statement. For smaller schemes such as significant school extensions,
  the council asks for employee numbers, accessibility and parking estimates so it can advise on the level
  of assessment.'
review-status: unverified
field-status: {}
