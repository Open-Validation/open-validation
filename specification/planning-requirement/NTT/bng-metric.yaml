reference: bng-metric
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Environment Act 2021 (biodiversity gain condition); Planning Practice Guidance on biodiversity
  net gain (paragraph 011); Nottinghamshire County Council BNG Supplementary Planning Document (Appendix
  1)
source-text: 'Biodiversity Net Gain – Since 2024, all qualifying applications are required to deliver
  a minimum 10% net gain for biodiversity (Biodiversity Net Gain, BNG). Certain exemptions are set out
  in legislation, for example some Section 73 applications to vary conditions. ... Further to this, applicants
  must also ensure that, for qualifying applications:'
must-include:
- item: The information requirements of the County Council's BNG SPD (Appendix 1)
  level: should
- item: BNG assessment boundary matches the application red line boundary, with a digital red line boundary
    submitted
  level: must
- item: Strategic Significance multiplier completed with reference to the Nottinghamshire and Nottingham
    Local Nature Recovery Strategy (November 2025)
  level: must
- item: BNG assessment provided in a document separate from the Ecological assessment
  level: must
confidence: medium
notes: 'From the council''s list (adopted 10 March 2026), pages 9, 10. Shown with the biodiversity gain
  condition: the law exempts some applications (for example some s73 applications, as the list says).'
review-status: unverified
field-status: {}
