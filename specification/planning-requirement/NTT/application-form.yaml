reference: application-form
local-authority: NTT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Town and Country Planning (Development Management Procedure) (England) Order 2015 requires
  the following forms, plans and information to be submitted with all applications unless otherwise stated.
  ... The standard (1APP) application form should be used for all applications (except those for Minerals,
  which should be submitted on the Minerals application form available on the Council’s website).
must-include:
- item: On the standard (1APP) form; minerals applications on the council's Minerals application form;
    onshore oil and gas development on its separate form
  level: must
- item: Signed and dated, with all relevant sections completed
  level: must
- item: One completed, signed and dated ownership/agricultural holding certificate (A, B, C or D)
  level: must
- item: Notice to owners and/or agricultural tenants completed and served under Article 13 of the DMPO
  level: must
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 7. The county council decides minerals, waste
  and its own (Regulation 3) development, so 'all applications' is shown as those types. The fee (3.4)
  is a national requirement too; see the unmapped list.
