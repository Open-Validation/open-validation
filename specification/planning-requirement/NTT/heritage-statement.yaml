reference: heritage-statement
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      - locally-listed-building
      - historic-environment-record
      description: The proposal affects a heritage asset, directly or indirectly (designated or non-designated,
        including Local Interest List buildings and Nottinghamshire HER entries).
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 202-221); Historic England GPA 3
source-text: A Heritage Statement should be submitted with all proposals affecting Heritage assets either
  directly or indirectly. ‘Heritage Assets’ include Listed Buildings, Conservation Areas, Scheduled Ancient
  Monuments, Registered Parks and Gardens, sites of Archaeological Interest, and assets identified either
  by the local planning authority or during the related site investigations. This requirement also applies
  to non-designated heritage assets, such as buildings on Local Interest Lists and those identified on
  the Nottinghamshire Historic Environment Record (NHER).
must-include:
- item: The significance of the heritage asset affected, including any contribution made by its setting
  level: should
- item: The effect of the development on the asset
  level: should
- item: Detail proportionate to the asset's importance
  level: should
- item: The Nottinghamshire HER consulted (with specialist officers at the County and District Councils)
    and the HER search number referenced clearly
  level: must
- item: Results of any archaeological assessment
  level: must
  required-if: discretionary
  source-text: The results of this work will need to be included in the Heritage Statement submitted with
    the application.
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 20. The county council decides minerals,
  waste and its own (Regulation 3) development, so 'all applications' is shown as those types.
review-status: unverified
field-status: {}
