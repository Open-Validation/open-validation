reference: arboriculturist-report
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal involves works that affect trees within the site (or adjacent trees,
          including highway trees).
    - condition:
        field: hedgerows-affected
        value: true
        description: The proposal involves works that affect hedgerows within the site.
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: BS 5837:2012; National Planning Policy Framework (para 136)
source-text: Where a proposal involves works that affect any trees or hedgerows within the application
  site, the position, species, spread and roots of trees should be illustrated accurately on the site
  plan.
must-include:
- item: Position, species, spread and roots of trees shown accurately on the site plan
  level: must
- item: Trees protected by Tree Preservation Orders indicated
  level: must
- item: Quality/value of the trees assessed using a recognised methodology
  level: should
- item: Trees to be felled or otherwise affected by the development
  level: must
- item: Trees on adjacent sites, including highway trees, that may be affected
  level: should
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: should
- item: A detailed arboricultural survey for large-scale proposals or sites with significant tree coverage
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 20. The list asks for the tree information
  on the site plan rather than as a named report; it is filed here because it must be prepared by an arboriculturist.
  A detailed survey 'may be appropriate' for large schemes, so that part is discretionary.
review-status: unverified
field-status: {}
