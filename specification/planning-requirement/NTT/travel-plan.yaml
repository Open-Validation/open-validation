reference: travel-plan
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: new-school
        value: true
        description: A new school.
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (para 118); Planning Practice Guidance; NCC Guidance for the
  preparation of Travel Plans (2010)
source-text: Where a development will generate a significant amount of vehicle movements a travel plan
  should be provided ... School Travel Plans (see link below) will be required for all new schools or
  significant extensions to existing schools - these should address parent, staff, and pupil parking as
  well as vehicular and pedestrian access. ... For the purpose of validation, an application will need
  to be accompanied by the framework of a Travel Plan that identifies relevant travel related issues,
  objectives, initiatives and timescale for delivery and review.
must-include:
- item: A framework identifying relevant travel related issues, objectives, initiatives and timescale
    for delivery and review
  level: must
- item: The travel plan coordinator, the management arrangements and the timetable of the plan
  level: should
- item: A strategy for its implementation appropriate to the development
  level: should
- item: 'School Travel Plans: parent, staff and pupil parking, and vehicular and pedestrian access'
  level: must
  required-if:
    any:
    - condition:
        field: new-school
        value: true
        description: A new school.
    - condition:
        field: school-expansion
        value: true
        description: A significant extension to an existing school.
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 14, 15. A new school always needs one. 'Significant'
  vehicle movements and 'significant' school extensions are judgements, so those show as discretionary.
  It can form part of the Transport Assessment or Statement.
review-status: unverified
field-status: {}
