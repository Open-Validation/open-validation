reference: water-impact-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 187-201); Environment Agency's approach to groundwater
  protection (2018); Abstraction Licensing Strategy
source-text: Most proposals for mineral extraction or waste disposal to land will require a hydrogeological/hydrological
  impact assessment, particularly where the water table is encountered and where water levels and/or quality
  could be impacted by development. ... Details of how the design of a proposal takes account of such
  constraints should usually be set out within a hydrogeological and or hydrological assessment.
must-include:
- item: Any designations of local ground waters (such as Source Protection Zones and Drinking Water Safeguard
    Zones) taken into account in siting and in designing safeguards against groundwater pollution
  level: should
- item: 'Waste development needing an Environmental Permit: a proportionate level of detail, as part of
    wider site investigation work'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: environmental-permit
        value: true
        description: The waste development would also need an Environmental Permit.
- item: 'Where abstraction or dewatering is proposed: the sustainability status of local ground and surface
    water (Abstraction Licensing Strategy), and how the design takes account of such constraints'
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: The proposal needs abstraction, including dewatering at quarries.
confidence: medium
notes: 'From the council''s list (adopted 10 March 2026), page 18. A hydrogeological/hydrological impact
  assessment. Shown as discretionary within minerals and waste: the list says ''most'' such proposals
  need one, ''particularly'' where the water table is met or water levels or quality could be affected.'
review-status: unverified
field-status: {}
