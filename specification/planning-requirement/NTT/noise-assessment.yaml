reference: noise-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Development that may generate significant noise.
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise sensitive use (such as a school).
      - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 222-230); Planning Practice Guidance (Minerals, Noise);
  BS4142; BS 5228-1; ProPG; BB93; BS 8233
source-text: A Noise Impact Assessment should be submitted with all applications for developments that
  may generate significant noise, or for noise sensitive uses (such as a school) close to existing sources
  of noise.
must-include:
- item: The impact of the development on the surrounding environment and neighbouring properties, and
    of existing nearby noise sources on future occupants
  level: must
- item: Results of a site-specific noise survey of existing background noise levels (including night-time
    levels where relevant)
  level: must
- item: How the development would affect or be affected by noise, with mitigation measures if required
  level: must
- item: Prepared by a suitably qualified acoustician
  level: should
- item: 'Waste development: assessed using BS4142+A1:2019'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Where the council recommends it (significant minerals or waste development, many noise sources
    or complex topography): 3D noise modelling with the model files, input data and numerical noise data
    in a labelled spreadsheet'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 23. A noise sensitive use is caught only
  when it is 'close to existing sources of noise', a judgement, so that part is discretionary. The council
  tells applicants at pre-application stage if 3D modelling is needed.
review-status: unverified
field-status: {}
