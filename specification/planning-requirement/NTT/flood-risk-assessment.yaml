reference: flood-risk-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zone 2, 3a or 3b.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more (in Flood Zone 1).
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more (in Flood Zone 1).
    - site:
        in:
        - critical-drainage-area
        description: In an area of Flood Zone 1 with critical drainage problems.
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 161-186); Planning Practice Guidance on Flood Risk and
  Coastal Change
source-text: Planning applications for proposals for new development in Flood Zones 2, 3a and 3b and for
  proposals of 1 hectare or greater in Flood Zone 1 should be accompanied by a Flood Risk Assessment (FRA).
  Furthermore, a FRA should be submitted for proposals within an area of Flood Zone 1 which has critical
  drainage problems or where proposals may be subject to other sources of flooding.
must-include:
- item: All forms of flooding to and from the development, and how the risks will be managed now and in
    the future, taking climate change into account
  level: should
- item: That the proposals are appropriate to the level of flood risk and do not increase flood risk elsewhere
  level: should
- item: 'In flood risk areas: confirmation of the flood resilience of the development, with flood emergency
    plans where relevant'
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In a flood risk area.
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: should
- item: Surface water discharge following the sequence soakaway (with percolation tests), watercourse,
    mains drainage; if a less sustainable method is proposed, why a more sustainable one cannot be used
  level: should
  source-text: 'In all cases, drainage strategies should follow a sustainable approach to the discharge
    of surface water following the sequential preference: (i) soakaway with supporting percolation tests;
    (ii) watercourse; (iii) mains drainage. Where a less sustainable form of surface water drainage is
    proposed the application should demonstrate why a more sustainable method of surface water drainage
    cannot be used.'
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 16, 17. 'Other sources of flooding' is a
  judgement, so it shows as discretionary. Prepared in consultation with the County Council as Lead Local
  Flood Authority, the Environment Agency and the Internal Drainage Board where appropriate. The flood
  risk Sequential Test (12.1-12.2) is in the unmapped list.
review-status: unverified
field-status: {}
