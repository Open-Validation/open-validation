reference: flood-risk-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zone 2, 3a or 3b.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more (in Flood Zone 1).
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more (in Flood Zone 1).
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
source-text: 12.4 Where a FRA is required this should be prepared by the applicant in consultation with
  Nottinghamshire County Council as the Lead Local Flood Authority, the Environment Agency, and the Internal
  Drainage Board where appropriate.
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt omits the trigger. From the audit: s12, new development in
  Flood Zones 2, 3a and 3b, and 1 hectare or more in Flood Zone 1.'
review-status: unverified
