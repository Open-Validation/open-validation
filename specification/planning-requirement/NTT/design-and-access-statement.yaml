reference: design-and-access-statement
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a Conservation Area or World Heritage Site.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  National Planning Policy Framework (paras 131-141)
source-text: 'Design and Access Statement: A Design and Access Statement (DAS) must accompany the following
  applications: • All applications for major development (as defined in article 2 of the Town and Country
  Planning (Development Management Procedure) (England) Order 2015; or • If within a designated area (Conservation
  Area or World Heritage Site) for development consisting of one or more dwelling or a building or buildings
  with a floor space of 100 square metres or more. ... Applications for waste development, minor development,
  change of use, engineering or mining operations or applications to amend the conditions attached to
  a planning permission (Section 73 applications) do not need to be accompanied by a DAS,'
must-include:
- item: The design principles and concepts applied, and the steps taken to consider the context of the
    development and how its design takes that context into account
  level: must
- item: Compliance with Local Plan design policies, adopted Design Codes and, where relevant, Neighbourhood
    Plan policies
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been considered
  level: must
- item: Any consultation undertaken on access issues and how it informed the development
  level: should
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 8, 9. The list says waste development, minor
  development, change of use, engineering or mining operations and s73 applications don't need a DAS,
  so only the council's own (Regulation 3) development is shown. Where design matters but no DAS is needed,
  design goes in the Planning Statement (section 6).
review-status: unverified
field-status: {}
