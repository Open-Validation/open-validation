reference: design-and-access-statement
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: The site is in a Conservation Area or World Heritage Site.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The development consists of one or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
source-text: 'A Design and Access Statement (DAS) must accompany the following applications: All applications
  for major development (as defined in article 2 of the Town and Country Planning (Development Management
  Procedure) (England) Order 2015; or If within a designated area (Conservation Area or World Heritage
  Site) for development consisting of one or more dwelling or a building or buildings with a floor space
  of 100 square metres or more. 3.10 Applications for waste development, minor development, change'
confidence: medium
notes: The list's own rule (para 3.9). Para 3.10, cut off in the excerpt, begins 'Applications for waste
  development, minor development, change ...', listing applications that are exempt.
review-status: unverified
field-status: {}
