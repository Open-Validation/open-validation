reference: archaeological-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 202-221); Chartered Institute for Archaeologists Standards
  & Guidance
source-text: Applicants submitting proposals on sites of potential archaeological interest will be required
  to undertake an archaeological assessment and where necessary carry out further archaeological investigations
  to allow the significance of the archaeology, as well as the impact of the development, to be understood.
must-include:
- item: Sufficient to establish the archaeological significance of the site
  level: must
- item: Results included in the Heritage Statement
  level: must
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 21. 'Sites of potential archaeological interest'
  is not a defined area, so it shows as discretionary; advice comes from the County Council's Archaeological
  Officers.
review-status: unverified
field-status: {}
