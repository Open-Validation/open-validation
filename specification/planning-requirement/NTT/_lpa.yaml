    within two years, so current.'
  status: current
submission-standards:
- item: Maximum single or combined file size 15 MB (the sum of all document file sizes); larger submissions
    via Cryptshare
  level: must
- item: PDF is the recommended file format; files not secured, so they can be date stamped and read by
    consultees
  level: should
- item: Drawings produced in a single layer, avoiding several issues on one plan (e.g. existing and proposed
    vegetation)
  level: must
- item: Drawings correctly orientated for on-screen display (landscape)
  level: must
- item: Drawings include a scale bar, key dimensions, paper size and scale (e.g. 1:1250 at A3)
  level: must
- item: All plans and supporting documents clearly labelled
  level: should
- item: All plans at an appropriate scale with a unique drawing reference number and a title
  level: should
- item: Plans and elevations specify critical dimensions (external measurements) such as building footprint
    and height to eaves/ridge
  level: should
- item: Where available, a digitised plan of the site boundary in GIS format
  level: should
- item: Photographs submitted in PDF format
  level: should
- item: Revised plans or documents clearly labelled (e.g. 'Revision 1')
  level: should
- item: 'Paper submissions: one paper copy of the form, all plans and all Local List documents'
  level: must
- item: Personal data kept to a minimum; documents with unnecessary personal data (e.g. in every header
    or footer) must be revised before validation
  level: should
- item: Technical assessments prepared by a suitably qualified, and where relevant accredited, professional
  level: should
