reference: environmental-statement
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: eia-development
      value: true
      description: EIA development (Schedule 1, or Schedule 2 likely to have significant effects).
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: An Environmental Statement (ES) will be required if your proposal is likely to have significant
  effects on the environment and meets the criteria set out in the Town and Country Planning (Environmental
  Impact Assessment) Regulations 2017 (The Regulations). The Regulations require a developer to prepare
  an ES for all Schedule 1 projects and some Schedule 2 projects.
must-include:
- item: The information in Regulation 18 and Schedule 4 of the EIA Regulations
  level: must
- item: Prepared by a competent expert, with a statement of the relevant expertise or qualifications of
    the experts
  level: must
- item: Copies of the ES (e.g. the Non-Technical Summary) for public display if the council asks
  level: should
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 12, 13. The county council decides minerals,
  waste and its own (Regulation 3) development, so 'all applications' is shown as those types.
review-status: unverified
field-status: {}
