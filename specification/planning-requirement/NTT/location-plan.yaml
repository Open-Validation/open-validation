reference: location-plan
local-authority: NTT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Town and Country Planning (Development Management Procedure) (England) Order 2015 requires
  the following forms, plans and information to be submitted with all applications unless otherwise stated.
must-include:
- item: At a scale of 1:1250 or 1:2500 (a smaller scale in exceptional circumstances, e.g. a development
    covering a large area)
  level: should
- item: Based on a metric OS map, with a north point and a drawing reference number
  level: should
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (e.g. access from a public highway)
  level: should
- item: On a large application site, the proposed development hatched in red
  level: should
- item: A blue line around any other land owned by or under the control of the applicant, close to or
    adjoining the site
  level: should
- item: Wherever possible, at least two named roads, surrounding buildings and features
  level: should
- item: No other information that is provided on other plans, such as topographical details
  level: should
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 7, 8. The county council decides minerals,
  waste and its own (Regulation 3) development, so 'all applications' is shown as those types. The list
  also says it would be helpful if s73 applications included the location plan from the original permission.
review-status: unverified
field-status: {}
