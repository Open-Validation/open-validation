reference: sci
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: wind-turbine-count
        operator: '>'
        value: 2
        description: On-shore wind development with more than two turbines.
    - condition:
        field: turbine-hub-height
        operator: '>'
        value: 15
        description: On-shore wind development where the hub height of any turbine exceeds 15 metres.
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 3;
  Nottinghamshire County Council Statement of Community Involvement (Second Review, 2018)
source-text: Where relevant, applications need to be supported by a statement detailing how the requirements
  for pre-application consultation set out in the Council’s adopted Statement of Community Involvement
  Review has been met. ... Article 3 of the Town and Country (Development Management Procedure) (England)
  Order 2015 requires a statement providing evidence of how the applicant has undertaken and responded
  to community consultation before submitting an application for on-shore wind turbine developments where
  the development ... involves more than two turbines, or where the hub height of any turbine exceeds
  15 metres.
must-include:
- item: How the pre-application consultation requirements of the council's Statement of Community Involvement
    have been met
  level: must
- item: That the views of the local community have been sought and taken into account in forming the proposals
  level: must
- item: 'On-shore wind: evidence of how the applicant undertook and responded to community consultation
    before submitting'
  level: must
  required-if:
    any:
    - condition:
        field: wind-turbine-count
        operator: '>'
        value: 2
        description: More than two turbines.
    - condition:
        field: turbine-hub-height
        operator: '>'
        value: 15
        description: Hub height of any turbine over 15 metres.
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 3, 25. 'Where relevant' is discretionary;
  on-shore wind turbine schemes over the DMPO thresholds always need the consultation statement (compulsory
  pre-application engagement).
review-status: unverified
field-status: {}
