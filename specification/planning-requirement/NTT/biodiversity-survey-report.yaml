reference: biodiversity-survey-report
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 187-195); Circular 06/2005; BS PAS 2010
source-text: Where a proposed development may have potential impacts on biodiversity and/or geodiversity,
  an assessment of these potential impacts must be carried out.
must-include:
- item: The existing features, wildlife and habitats on site and on adjacent sites
  level: must
- item: The mitigation hierarchy (avoidance, mitigation, compensation) followed
  level: must
- item: 'Major development: an Ecological Impact Assessment (EcIA)'
  level: must
  required-if:
    ref: major-development
- item: 'Other development: a Preliminary Ecological Appraisal (PEA); an EcIA or more surveys may follow'
  level: must
- item: A desktop study including consultation with the Nottinghamshire Biological and Geological Records
    Centre and relevant nature conservation organisations, groups and individuals
  level: must
- item: Survey results on the presence or absence of notable habitats, protected species and species of
    principal importance
  level: must
- item: Undertaken by a suitably qualified and accredited person, following nationally recognised guidelines
  level: must
- item: Information on badgers and Goshawk, Peregrine, Honey Buzzard, Marsh Harrier, Red Kite, Osprey
    and Hobby in a separate confidential report
  level: must
- item: Direct and indirect impacts (e.g. hydrology, air quality, noise, disturbance)
  level: should
- item: Information supporting any mitigation and/or compensation measures
  level: must
- item: Ecological enhancements and maintenance and management of retained or created features
  level: should
confidence: medium
notes: From the council's list (adopted 10 March 2026), pages 21, 22. 'May have potential impacts' is
  a judgement, so it shows as discretionary. A Habitats Regulations Assessment for the Birklands and Bilhaugh
  SAC or the Sherwood ppSPA (18.4) is in the unmapped list.
review-status: unverified
field-status: {}
