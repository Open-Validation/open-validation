reference: land-contamination-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: asbestos-suspected
        value: true
        description: Works to buildings known, or suspected, to contain asbestos.
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework (paras 187-201); Planning Practice Guidance – Land affected
  by contamination; Land contamination risk management (LCRM)
source-text: 'A desktop study and site walkover survey to establish the potential contamination risks
  at the site will be required in support of planning applications involving sites where: • there is a
  significant change in land use from the existing use of the land; • the proposed development could result
  in increased risks to site users from contaminated land or ground gas; or • there is a risk of creating
  new pathways for contamination or ground gas to migrate to other sensitive receptors within the site
  or surrounding area. ... Applications involving any works to buildings known, or suspected, to contain
  asbestos should be indicated as such on the planning application form and include, as a minimum, a desk
  top study.'
must-include:
- item: A desktop study and site walkover survey of the potential contamination risks at the site
  level: must
- item: 'Where the desk study recommends further investigation that is critical to the decision: an appropriate
    site investigation showing whether the site is suitable for the proposed use, with any mitigation'
  level: must
  required-if: discretionary
  source-text: If a desk top study identifies and recommends that further investigation is critical to
    the determination of an application (i.e., could not be the subject of a planning condition) an appropriate
    site investigation will be required to validate the application.
- item: 'Asbestos: indicated on the application form, with at least a desk top study'
  level: must
  required-if:
    condition:
      field: asbestos-suspected
      value: true
      description: Works to buildings known, or suspected, to contain asbestos.
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 19. The three 14.2 triggers (a 'significant'
  change of land use, increased risk to site users from contamination or ground gas, new pathways for
  contamination) need judgement, so they show as discretionary. Works to buildings with known or suspected
  asbestos always need at least a desk top study.
review-status: unverified
field-status: {}
