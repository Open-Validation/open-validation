reference: planning-statement
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework; Planning Practice Guidance
source-text: A Planning Statement is required for most applications explaining the context and need for
  the proposed development and should be proportionate and specific to the development. For minor development
  proposals including some section 73 applications to vary planning conditions, a supporting letter will
  be sufficient setting out what is being proposed and why. Larger development proposals should be accompanied
  by a Planning Statement
must-include:
- item: 'For larger proposals: relevant local and national planning policy and how the development complies
    with it, or the overriding reasons why it should go ahead'
  level: must
  required-if:
    ref: major-development
- item: How the development achieves sustainable development, covering economic, social and environmental
    issues
  level: should
- item: Details of any consultation with Development Management or other County Council officers and the
    wider community or statutory consultees before submission
  level: should
- item: 'School sites: existing and proposed pupil and staff numbers, parking provision and nearby school
    information'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: school-expansion
        value: true
        description: A school proposal that changes pupil or staff numbers.
  source-text: The Planning Statement submitted with proposals on school sites should also set out existing
    and proposed pupil and staff numbers, parking provision and nearby school information where there
    is a proposed change to pupil/staff numbers.
- item: 'School developments affecting or losing playing field: existing and proposed summer and winter
    pitch layouts, and why that location within the site was chosen'
  level: should
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: The school development affects or involves the loss of playing field area.
- item: 'Landscaping schemes importing inert waste: the rationale for the landform changes, supported
    by detailed pre and post contour plans'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: change-in-ground-levels
        value: true
        description: A landscaping scheme that imports inert waste to change the landform.
- item: 'Where no DAS is needed but design is an important and material consideration: the design considerations
    (NPPF chapter 12)'
  level: should
  required-if: discretionary
  source-text: Design considerations should be incorporated into Planning Statements where a DAS is not
    required but where design is an important and material consideration.
confidence: medium
notes: 'From the council''s list (adopted 10 March 2026), pages 11, 12. Shown as major development or
  discretionary: the list asks for it for ''most applications'', says a supporting letter is enough for
  minor proposals and some s73 applications, and wants a full Planning Statement for larger proposals.
  The county council decides minerals, waste and its own (Regulation 3) development, so ''all applications''
  is shown as those types.'
review-status: unverified
field-status: {}
