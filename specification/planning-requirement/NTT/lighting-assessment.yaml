reference: lighting-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting is proposed (for instance, floodlighting of a multi-use
        games area).
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
source-text: 21.2 Where significant external lighting is proposed as part of a development (for instance,
  floodlighting of a multi-use games area) the application must include a layout plan with beam orientation,
  a schedule of the proposed equipment and the proposed measures to reduce any impact on neighbouring
  sites/properties.
must-include:
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the proposed equipment
  level: must
- item: The proposed measures to reduce any impact on neighbouring sites/properties
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook swapped the lighting and sunlight/daylight excerpts.'
review-status: unverified
field-status: {}
