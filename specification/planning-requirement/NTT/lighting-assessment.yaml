reference: lighting-assessment
local-authority: NTT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting (for instance of a multi-use games area).
    - all:
      - condition:
          field: external-lighting
          value: true
          description: External lighting is proposed.
      - discretionary
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: National Planning Policy Framework; Planning Practice Guidance – Light pollution
source-text: Where significant external lighting is proposed as part of a development (for instance, floodlighting
  of a multi-use games area) the application must include a layout plan with beam orientation, a schedule
  of the proposed equipment and the proposed measures to reduce any impact on neighbouring sites/properties.
must-include:
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the proposed equipment
  level: must
- item: Measures to reduce any impact on neighbouring sites/properties
  level: must
- item: Energy efficiency data for new external lighting
  level: should
  source-text: Energy efficiency data should also be submitted for proposals for new external lighting.
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 24. Floodlighting is the list's own example;
  other external lighting is caught only when 'significant', a judgement, so it is discretionary.
review-status: unverified
field-status: {}
