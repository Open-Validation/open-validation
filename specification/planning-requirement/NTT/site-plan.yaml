reference: site-plan
local-authority: NTT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.nottinghamshire.gov.uk/media/r3qpuy11/guidancenoteonvalidationrequirementsforplanningapplications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Town and Country Planning (Development Management Procedure) (England) Order 2015 requires
  the following forms, plans and information to be submitted with all applications unless otherwise stated.
must-include:
- item: At an appropriate scale for the development, showing the direction of North
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written dimensions including those to the boundaries
  level: should
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    adjoining the site including access arrangements; all public rights of way; the position of all trees
    on the site and on adjacent land; the extent and type of any hard surfacing; any boundary treatment'
  level: should
confidence: medium
notes: From the council's list (adopted 10 March 2026), page 8. The county council decides minerals, waste
  and its own (Regulation 3) development, so 'all applications' is shown as those types. Where trees or
  hedgerows are affected, section 15 asks for more tree detail on the site plan (see arboriculturist-report).
review-status: unverified
field-status: {}
