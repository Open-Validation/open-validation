source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: An application form is required for every application.
must-include:
- item: The correct form for the application type
  level: must
- item: Every relevant question completed in full
  level: must
- item: Applicant's full name and title, where an agent is applying
  level: must
- item: One ownership certificate completed, where it is part of the form
  level: must
- item: Agricultural land declaration completed, where it is part of the form
  level: must
- item: The correct notice served on other owners before applying, where notice is needed
  level: must
  source-text: if you need to serve notice on other owners, make sure you serve the correct notice before
    you apply
