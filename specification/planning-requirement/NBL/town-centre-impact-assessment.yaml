reference: town-centre-impact-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - all:
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 1000
          description: 1,000 square metres or more of gross retail floorspace ...
      - any:
        - all:
          - condition:
              field: near-named-town
              value: true
              description: '... in Amble, Bedlington, Haltwhistle, Ponteland or Prudhoe ...'
          - condition:
              field: out-of-centre-town-centre-use
              value: true
              description: '... outside the town centre boundary.'
        - all:
          - condition:
              field: near-named-town
              value: true
              description: '... in Alnwick, Ashington, Berwick-upon-Tweed, Blyth, Cramlington, Morpeth
                or Hexham ...'
          - condition:
              field: outside-primary-shopping-area
              value: true
              description: '... outside the primary shopping area.'
    - all:
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 2500
          description: 2,500 square metres or more of gross retail floorspace outside the Morpeth town
            centre boundary.
    - all:
      - condition:
          field: entertainment-leisure-use
          value: true
          description: Leisure development ...
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 2500
          description: '... of 2,500 square metres or more of leisure floorspace ...'
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: '... outside a town centre boundary anywhere in Northumberland.'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies TCS 1, TCS 2 and TCS 4; NPPF chapter 7
source-text: 'You must submit an impact assessment if you are applying for: full planning permission approval
  of reserved matters and your proposal includes: Retail development 1,000 square metres or more of gross
  retail floorspace outside a town centre boundary in: Amble Bedlington Haltwhistle Ponteland Prudhoe
  1,000 square metres or more of gross retail floorspace outside a primary shopping area in: Alnwick Ashington
  Berwick-upon-Tweed Blyth Cramlington Morpeth Hexham 2,500 square metres or more of gross retail floorspace
  outside a town centre boundary in Morpeth Leisure development 2,500 square metres or more of leisure
  floorspace outside a town centre boundary anywhere in Northumberland'
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 36. Gross retail floorspace
  includes the shop floor, storage, staff rooms and offices. The 2,500 square metre retail threshold applies
  outside the Morpeth town centre boundary (Morpeth's primary shopping area has the 1,000 square metre
  threshold). The sequential assessment in the same note has no requirement id (see unmapped).
review-status: unverified
field-status: {}
