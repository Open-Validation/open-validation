reference: roof-plan-existing
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Changes to the shape of an existing roof (including flat to pitched, dormers, solar
            panels).
      - all:
        - site:
            in:
            - conservation-area
            description: Site is in a conservation area.
        - condition:
            field: roof-alteration
            value: true
            description: Any roof change.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: scale
          description: Scale is applied for.
      - condition:
          field: reserved-matters-sought
          value: appearance
          description: Appearance is applied for.
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Changes to the shape of an existing roof (including flat to pitched, dormers, solar
            panels).
      - all:
        - site:
            in:
            - conservation-area
            description: Site is in a conservation area.
        - condition:
            field: roof-alteration
            value: true
            description: Any roof change.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Any roof change (including solar panels).
      - condition:
          field: demolition
          value: true
          description: Demolition.
  - all:
    - application-type:
        in:
        - demolition-con-area
    - condition:
        field: demolition
        value: true
        description: Total demolition of a building.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You need roof plans if you are applying for: householder planning permission full planning
  permission outline planning permission or reserved matters (if scale or appearance is applied for) But
  only for these works: changes to the shape of an existing roof (including flat to pitched, dormers,
  solar panels) any roof changes in a conservation area You also need roof plans for: listed building
  consent for any roof change (including solar panels or demolition) removal or variation of a condition
  including roof changes (we only need proposed drawings) non-material amendment including roof changes
  (we only need proposed drawings) demolition in a conservation area (for total demolition we only need
  existing drawings)'
must-include:
- item: The whole roof, with any changes clearly identified
  level: must
- item: Features such as chimneys, rooflights, dormers and solar panels, where relevant
  level: must
- item: Each drawing labelled as existing or proposed
  level: must
- item: At the correct scale, normally 1:50 or 1:100
  level: must
  source-text: use the correct scale, normally 1:50 or 1:100
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 8. For sheds, greenhouses and
  summerhouses a clear product brochure with metric measurements may be accepted instead of drawings.
  For lawful development certificates drawings are not required. The general drawing rules (scale bar,
  paper size, labels, no photographs of drawings) are in submission-standards.
