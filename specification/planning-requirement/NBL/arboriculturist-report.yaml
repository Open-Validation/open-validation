reference: arboriculturist-report
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - consent-under-tpo
    - any:
      - condition:
          field: tree-condition-reasons
          value: true
          description: Answered yes on the form to the question about the condition of the tree(s).
      - condition:
          field: subsidence-alleged
          value: true
          description: Answered yes to alleged damage due to subsidence.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        description: Trees protected by a TPO ...
    - condition:
        field: tree-works
        value: true
        description: '... will be removed or pruned.'
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: minor-development
        value: true
        description: Minor development where protected trees ...
    - condition:
        field: tree-works
        value: true
        description: '... will be removed or pruned.'
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - ref: major-development
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on the site, whether protected or not.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies QOP 4; NPPF chapter 12, paragraph 136
source-text: 'You must provide a tree report for: Tree works applications trees protected by a Tree Preservation
  Order (TPO), where you have answered yes to questions about tree condition or damage to property Householder
  planning permission where you plan to remove or prune trees protected by a TPO Full planning permission
  or approval of reserved matters minor developments where protected trees will be removed or pruned major
  developments where there are trees on the site, whether protected or not'
must-include:
- item: Prepared by a qualified arboriculturist
  level: should
- item: Less than 12 months old
  level: must
  source-text: Your report must be less than 12 months old.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 39. The council calls it a Tree
  report (arboricultural statement). For conservation area tree works the checklist says a tree report
  is not needed but can help. The TPO tree works checklist makes it mandatory where the form answers yes
  on the condition of the tree(s) or alleged subsidence damage.
review-status: unverified
field-status: {}
