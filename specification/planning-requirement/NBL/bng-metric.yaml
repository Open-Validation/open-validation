reference: bng-metric
local-authority: NBL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The statutory biodiversity gain condition applies (the development is not exempt).
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Environment Act 2021 Schedule 7A (biodiversity gain condition)
source-text: 'BNG applies to most applications for: full planning permission outline planning permission
  demolition in a conservation area removal or variation of a condition on the above if submitted on or
  after 12 Feb 2024 for majors, 2 April 2024 for minors'
must-include:
- item: A completed biodiversity metric Excel document
  level: must
- item: The BNG information completed on the application form
  level: must
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 6. Shown with biodiversity-gain-condition
  because householder and other exempt applications are exempt by law (the page lists householder applications,
  sites of 0.2 ha or less and temporary permissions of 5 years or less unless they harm priority habitat).
  The page adds that self-build and custom-build homes are no longer exempt for applications submitted
  from 6 August 2026, and that a missing or incorrect BNG submission can make an application invalid even
  after validation.
review-status: unverified
