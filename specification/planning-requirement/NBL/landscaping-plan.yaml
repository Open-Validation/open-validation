reference: landscaping-plan
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - ref: major-development
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies INF 6, QOP 2, QOP 4, HOU 12, ECN 17, TRA 7, WAS 2
  and INF 5; NPPF chapter 12
source-text: 'You must submit a landscaping scheme if you are applying for: full planning permission for
  a major development approval of reserved matters for a major development'
must-include:
- item: A detailed landscaping plan
  level: must
  source-text: Include the detailed landscaping plan.
- item: Paths, paving, driveways and parking areas
  level: should
- item: Walls, fences and other boundaries
  level: should
- item: Trees, shrubs and other planting
  level: should
- item: Existing landscape features, showing what will stay and what will be removed
  level: should
- item: New planting, including plant types, numbers and spacing
  level: should
- item: Site levels before and after the work
  level: should
- item: Lighting and signs
  level: should
- item: Bins, bike stores, benches and other outdoor items
  level: should
- item: Drainage and utility lines
  level: should
- item: Temporary cabins and storage areas
  level: should
- item: Watercourses and how they will be landscaped
  level: should
- item: How the landscaping will be maintained and looked after
  level: should
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 25. Not normally needed for
  a change of use only, or changes to an existing building with no landscaping. The page says the scheme
  'should include' the listed contents.
review-status: unverified
field-status: {}
