reference: land-contamination-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: Homes, flats or care homes; schools, nurseries or play areas; playing fields or allotments;
          or mixed use including any of these.
    - site:
        in:
        - contaminated-land
        description: The land is known or suspected to be contaminated.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
source-text: 'When to submit this You must submit a land contamination assessment if you are applying
  for full or outline planning permission for: homes, flats or care homes schools, nurseries or play areas
  playing fields or allotments mixed-use development that includes any of these You must also submit one
  if you complete the Existing Use section of your application form because: the land is known to be contaminated
  contamination is suspected on all or part of the site What to include For a single home , co'
must-include:
- item: For a single home, the YALPAG Screening Form
  level: must
