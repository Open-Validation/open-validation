reference: land-contamination-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: Homes, flats or care homes; schools, nurseries or play areas; playing fields or allotments;
          or mixed-use development that includes any of these.
    - site:
        in:
        - contaminated-land
        description: The Existing Use section of the form says the land is known or suspected to be contaminated.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies POL 1 and MIN 2; NPPF chapter 15, paragraphs 180,
  189 to 194
source-text: 'You must submit a land contamination assessment if you are applying for full or outline
  planning permission for: homes, flats or care homes schools, nurseries or play areas playing fields
  or allotments mixed-use development that includes any of these You must also submit one if you complete
  the Existing Use section of your application form because: the land is known to be contaminated contamination
  is suspected on all or part of the site'
must-include:
- item: For a single home, the YALPAG Screening Form, and a full report if the form says one is needed
  level: must
  required-if:
    condition:
      field: dwelling-count
      value: 1
      description: A single home.
- item: Prepared by a competent person (other proposals)
  level: must
- item: Risks to people's health, drinking water, groundwater and rivers, wildlife and habitats, soil,
    and buildings and property
  level: must
  source-text: 'Your assessment must consider risks to: people''s health drinking water, groundwater and
    rivers wildlife, animals and habitats soil buildings and property'
- item: A Phase Two Site Investigation, if the Phase One report says one is needed
  level: must
  source-text: If one is needed to assess the risks from contamination, you must submit it with your application.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 24. The council calls it a Phase
  One Preliminary Risk Assessment.
review-status: unverified
field-status: {}
