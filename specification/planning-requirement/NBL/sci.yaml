reference: sci
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 200
        description: 200 or more new homes.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 10000
        description: 10,000 square metres or more of non-residential floorspace.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 2
        description: A site of 2 hectares or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 2
        description: A site of 2 hectares or more.
    - condition:
        field: wind-turbine-count
        operator: '>='
        value: 2
        description: 2 or more new wind turbines.
    - condition:
        field: turbine-hub-height
        operator: '>'
        value: 15
        description: A wind turbine with a hub height of more than 15 metres.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Section 61W Town and Country Planning Act 1990; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 article 3A; Northumberland Local Plan 2016-2036 policy REN 2; Northumberland
  Statement of Community Involvement
source-text: 'You must submit a consultation statement if you are applying for: full planning permission
  approval of reserved matters and your proposal includes: 200 or more new homes 10,000 square metres
  or more of non-residential floorspace a site of 2 hectares or more ... You must submit a pre-application
  consultation statement if you are applying for: full planning permission approval of reserved matters
  and you propose: 2 or more new wind turbines a wind turbine with a hub height of more than 15 metres'
must-include:
- item: Shows the council's Statement of Community Involvement was followed
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: false
      description: Not a wind turbine proposal.
- item: A summary of the feedback received
  level: must
- item: How people's concerns were dealt with
  level: must
- item: Changes made to the proposal before submitting
  level: must
- item: Evidence that pre-application consultation was carried out
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: false
      description: Not a wind turbine proposal.
- item: 'Wind turbines: shows the section 61W(1) consultation rules were followed (contact details, at
    least 21 days to respond, letters to nearby homes, a local newspaper advert, the town or parish council
    consulted)'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind turbine proposal.
- item: 'Wind turbines: a statement is still submitted if the applicant thinks the development is exempt,
    explaining why'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind turbine proposal.
  source-text: Submit a statement even if you think you are exempt.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 33. Also Note 32 (pre-application
  consultation statement for wind turbines), filed here because it is a statement of pre-application community
  consultation.
review-status: unverified
field-status: {}
