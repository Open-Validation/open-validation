reference: coastal-change-assessment
local-authority: NBL
required-if:
  site:
    in:
    - coastal-erosion-zone
    description: The development is in the coastal change area.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
source-text: 'It must consider: the risk of coastal erosion and flooding existing sea defences planned
  changes to the coast how the development could affect coastal change You must show that your development
  will: be safe for its planned lifetime not make coastal erosion or other coastal change worse protect
  the character and important features of the coast provide wider benefits where possible not block the
  England Coast Path'
must-include:
- item: The risk of coastal erosion and flooding
  level: must
- item: Existing sea defences and planned changes to the coast
  level: must
- item: How the development could affect coastal change
  level: must
- item: That the development will be safe for its planned lifetime and won't make coastal erosion or other
    coastal change worse
  level: must
- item: That the development protects the character and important features of the coast
  level: must
- item: That the development will not block the England Coast Path
  level: must
