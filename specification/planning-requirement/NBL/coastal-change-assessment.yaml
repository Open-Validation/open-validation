reference: coastal-change-assessment
local-authority: NBL
required-if:
  all:
  - site:
      in:
      - coastal-erosion-zone
      description: Any part of the site is in a Coastal Change Management Area (CCMA).
  - any:
    - all:
      - application-type:
          in:
          - hh
      - any:
        - condition:
            field: residential-extension
            value: true
            description: An extension with an internal door into the house (garages without one are exempt).
        - all:
          - condition:
              field: residential-annexe
              value: true
              description: A new outbuilding or annexe ...
          - condition:
              field: bedroom-count
              operator: '>='
              value: 1
              description: '... with a bedroom.'
    - application-type:
        in:
        - full
        - outline
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies WAT 5; NPPF chapter 14, paragraphs 177 to 179; North
  Northumberland Coast Neighbourhood Plan
source-text: 'You must submit an assessment if you are applying for householder planning permission and
  your site is in a CCMA and you propose: an extension with an internal door into the house a new outbuilding
  or annexe with a bedroom Garages without an internal door into the house are exempt. You must also submit
  an assessment if you are applying for full or outline planning permission and any part of your site
  is in a CCMA and you propose: new buildings demolition or rebuilding extensions splitting a building
  into more homes a change of use of land or buildings engineering, mining or other operations'
must-include:
- item: The risk of coastal erosion and flooding
  level: must
- item: Existing sea defences
  level: must
- item: Planned changes to the coast
  level: must
- item: How the development could affect coastal change
  level: must
- item: Shows the development will be safe for its planned lifetime, not make coastal erosion or other
    coastal change worse, protect the character and important features of the coast and not block the
    England Coast Path
  level: must
- item: Less than 3 years old, or with an updated statement if older
  level: must
  source-text: Your assessment must be less than 3 years old.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 18. For full and outline applications
  the list covers new buildings, demolition or rebuilding, extensions, subdivision, change of use and
  engineering, mining or other operations in a CCMA, which is effectively any development there.
review-status: unverified
field-status: {}
