reference: location-plan
local-authority: NBL
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - outline
    - reserved-matters
    - advertising
    - demolition-con-area
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You need a location plan if you are applying for: householder planning permission full planning
  permission listed building consent outline planning permission approval of reserved matters consent
  to display an advertisement demolition in a conservation area a Regulation 77 application'
must-include:
- item: Based on a current map
  level: must
- item: At 1:1250 or 1:2500, or an appropriate scale for larger sites
  level: must
- item: A north arrow
  level: must
- item: Enough roads and buildings to identify the site
  level: must
- item: Application site edged in red
  level: must
- item: Other land owned by the applicant edged in blue
  level: must
- item: Proposed access points, even if access is a reserved matter
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: show proposed access points for outline applications, even if access is a reserved matter
- item: Red line reaching the public road
  level: must
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: Any new development.
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: new-vehicle-access
        value: true
        description: A new access or changes to an existing one.
  source-text: 'Make sure the red line reaches the public road for: any new development or change of use
    a new access or changes to an existing one'
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 3. For lawful development certificates,
  certificates of lawfulness for proposed works to a listed building, prior approvals and hedgerow removal
  notices the page accepts a location plan or a site plan, so those types are not shown. The red line
  need not reach the road for lawful development certificates or most prior approvals. Regulation 77 applications
  (after prior approval) also need one but have no application type here.
review-status: unverified
field-status: {}
