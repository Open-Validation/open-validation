reference: elevation-proposed
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - lbc
        - full
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings or structures (including outbuildings and ground mounted solar panels).
      - condition:
          field: external-alterations
          value: true
          description: Alteration to existing elevations (including window or door alteration or replacement,
            solar panels).
      - condition:
          field: demolition
          value: true
          description: Partial demolition.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: scale
          description: Scale is applied for.
      - condition:
          field: reserved-matters-sought
          value: appearance
          description: Appearance is applied for.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings or structures (including outbuildings and ground mounted solar panels).
      - condition:
          field: external-alterations
          value: true
          description: Alteration to existing elevations (including window or door alteration or replacement,
            solar panels).
      - condition:
          field: demolition
          value: true
          description: Demolition.
  - application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-sui-to-dwh
      - cho-amusements-to-dwh
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: The advertisement is attached to a building or structure.
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The change affects an elevation.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You need elevations if you are applying for: householder planning permission listed building
  consent full planning permission outline planning permission or reserved matters, where scale or appearance
  is being applied for But only for these works: new buildings or structures (including outbuildings and
  ground mounted solar panels) alteration to existing elevations (including window or door alteration
  or replacement, solar panels) demolition (for total demolition we only need existing drawings) You also
  need elevations for: prior approval for a change of use to a residential dwelling or flat consent to
  display an advertisement attached to a building or structure – proposed elevations only removal or variation
  of a condition where the change affects an elevation – proposed elevations only a non-material amendment
  where the change affects an elevation – proposed elevations only demolition in a conservation area –
  existing elevations only for total demolition'
must-include:
- item: A drawing for each side of the building that will change or where the new work can be seen
  level: must
- item: Each drawing labelled by the direction it faces and as existing or proposed
  level: should
  source-text: Elevations are normally labelled by the direction they face, such as north, south, east
    or west. Label each drawing clearly as existing or proposed.
- item: All windows and doors shown, including high-level windows
  level: must
- item: Where buildings adjoin each other
  level: must
- item: Anything to be demolished clearly shown
  level: must
- item: At the correct scale, normally 1:50 or 1:100
  level: must
  source-text: use the correct scale, normally 1:50 or 1:100
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 8. For total demolition only
  existing drawings are needed. For advertisements, removal or variation of a condition and non-material
  amendments only proposed elevations are needed. For sheds, greenhouses and summerhouses a clear product
  brochure with metric measurements may be accepted instead of drawings. For lawful development certificates
  drawings are not required. The general drawing rules (scale bar, paper size, labels, no photographs
  of drawings) are in submission-standards.
