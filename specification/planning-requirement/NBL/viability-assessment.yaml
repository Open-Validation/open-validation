reference: viability-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more homes.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Less than 10 homes on a site of 0.5 hectares or larger.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 to 9 homes ...
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: '... within the Northumberland Coast AONB.'
  - condition:
      field: affordable-housing-proposed
      value: false
      description: 'Affordable housing is not provided on site: an off-site financial contribution is
        offered, or no affordable housing is provided.'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies HOU 2, HOU 4, HOU 5, HOU 6, HOU 7, HOU 11, ENV 5,
  ENV 6 and INF 6; NPPF chapter 5; NPPF Policy DM5(4) (publication of viability assessments)
source-text: 'If you''re making an off-site contribution: include a financial viability appraisal, it
  must be prepared by a chartered professional suggest a contribution amount provide supporting details
  such as land price, build costs and estimated sale prices'
must-include:
- item: Prepared by a chartered professional
  level: must
- item: A suggested contribution amount, where an off-site contribution is made
  level: must
- item: Supporting details such as land price, build costs and estimated sale prices
  level: must
- item: No sensitive personal information (viability assessments are published)
  level: should
  source-text: you should not include sensitive personal information in any viability assessment submitted
    to us.
- item: An executive summary and reasons, if exemption from publication is sought
  level: should
  source-text: applicants seeking an exemption from publication should provide an executive summary and
    explain their reasons when submitting the application.
confidence: medium
notes: 'From the council''s list (web page, republished 1 April 2026), Note 10. Part of the affordable
  housing note: a financial viability appraisal is needed for an off-site contribution or where no affordable
  housing is provided.'
review-status: unverified
field-status: {}
