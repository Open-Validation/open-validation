reference: recreation-facilities-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - site:
      in:
      - open-space
      description: The proposal builds on protected open space ...
  - condition:
      field: loss-of-open-space
      value: true
      description: '... or would stop or reduce its current use.'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies INF 5, STP 6 and ENV 9; NPPF chapter 8, paragraphs
  97 and 102 to 107
source-text: 'You must submit an open space assessment if you are applying for: full planning permission
  approval of reserved matters and your proposal: builds on protected open space would stop or reduce
  its current use'
must-include:
- item: The open space's size, location, use, condition and quality, and how people access it
  level: must
- item: Comparison with similar open spaces nearby and with the standards in Appendix H1 of the Local
    Plan
  level: must
- item: How local people use and value the space and what would happen if it was lost
  level: must
- item: Existing and proposed site plans at 1:200, 1:500 or 1:1000 showing all open space affected, with
    its area clearly measured
  level: must
  source-text: 'Include existing and proposed site plans: at 1:200, 1:500 or 1:1000 scale showing all
    open space affected by the proposal with the area of open space clearly measured'
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 31. The council calls it an
  Open space assessment. Not normally needed where the proposal improves or supports the open space (for
  example pitch fencing, artificial turf, a small store or a car park extension).
review-status: unverified
field-status: {}
