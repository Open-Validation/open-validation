reference: air-quality-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: 100 or more new homes, including residential caravan parks.
    - condition:
        field: floorspace
        operator: '>='
        value: 10000
        description: 10,000 square metres or more of new floorspace.
    - condition:
        field: biomass-or-chp
        value: true
        description: A combined heat and power plant.
    - discretionary
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
source-text: 'When to submit this You must submit an air quality assessment if you are applying for full
  planning permission or approval of reserved matters for: 100 or more new homes, including residential
  caravan parks 10,000 square metres or more of new floorspace a combined heat and power plant industrial
  processes that release emissions into the air a new minerals site or an extension to an existing minerals
  site major changes to roads, such as new roundabouts or dual carriageways What to include An Air'
