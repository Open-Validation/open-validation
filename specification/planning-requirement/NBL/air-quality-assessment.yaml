reference: air-quality-assessment
local-authority: NBL
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 100
          description: 100 or more new homes, including residential caravan parks.
      - condition:
          field: floorspace
          operator: '>='
          value: 10000
          description: 10,000 square metres or more of new floorspace.
      - condition:
          field: biomass-or-chp
          value: true
          description: A combined heat and power plant.
      - condition:
          field: direct-air-emissions
          value: true
          description: Industrial processes that release emissions into the air.
      - condition:
          field: major-road-changes
          value: true
          description: Major changes to roads, such as new roundabouts or dual carriageways.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies POL 2, QOP 2 and STP 5; NPPF chapter 15
source-text: 'You must submit an air quality assessment if you are applying for full planning permission
  or approval of reserved matters for: 100 or more new homes, including residential caravan parks 10,000
  square metres or more of new floorspace a combined heat and power plant industrial processes that release
  emissions into the air a new minerals site or an extension to an existing minerals site major changes
  to roads, such as new roundabouts or dual carriageways'
must-include:
- item: Written by a qualified air quality or environmental consultant
  level: should
- item: Less than 3 years old, or with an updated statement (addendum) if older
  level: must
  source-text: The assessment must be less than 3 years old. If it’s older, include an updated statement
    (addendum).
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 11. 'A new minerals site or
  an extension to an existing minerals site' is shown as the mineral-extraction application type. biomass-or-chp
  is used for the combined heat and power trigger only (a biomass boiler alone needs the biomass boiler
  information form, see unmapped).
review-status: unverified
field-status: {}
