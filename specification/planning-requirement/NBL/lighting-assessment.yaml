reference: lighting-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: floodlighting
          value: true
          description: Major development with floodlighting.
    - condition:
        field: floodlighting
        value: true
        description: Sports pitches, fields or sports complexes with lighting.
    - all:
      - site:
          in:
          - dark-sky-area
          description: The site is in the Northumberland Dark Sky Park ...
      - condition:
          field: external-lighting
          value: true
          description: '... and the proposal includes any lighting.'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies INF 6, QOP 2, QOP 4, HOU 12, ECN 17, TRA 7, WAS 2
  and INF 5; NPPF chapter 12
source-text: 'You must submit a lighting assessment if you are applying for: full planning permission
  approval of reserved matters and your proposal includes: major development with floodlighting sports
  pitches, fields or sports complexes with lighting any lighting in the Northumberland Dark Sky Park'
must-include:
- item: The type of lighting and when it will be used
  level: must
- item: Light spill and glare checked
  level: must
- item: How harm will be reduced or avoided
  level: must
- item: Elevation drawings showing the height and position of lights, and whether freestanding or attached
    to buildings
  level: must
- item: A layout plan at a recognised metric scale showing the location of all lights, the direction of
    the beams and where light will fall, and light levels in lux
  level: must
- item: Effects on nearby homes, public places, community safety, listed buildings and conservation areas,
    the countryside and dark sky areas, and wildlife including bats
  level: must
- item: Less than 12 months old, or with an updated statement if older
  level: must
  source-text: Your assessment must be less than 12 months old.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 26.
review-status: unverified
field-status: {}
