reference: noise-assessment
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: plant-equipment
        value: true
        description: New or replacement air source or ground source heat pumps.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise-sensitive use (homes, flats, care and nursing homes, schools and nurseries,
            hospitals, hotels and hostels, open countryside in the North Pennines and Northumberland Coast
            National Landscapes or Kielder Water Forest Park, and sites with protected species (List A))
            next to a potentially noisy use (List B).
      - condition:
          field: noise-generating-use
          value: true
          description: 'A new or changed use that could create harmful noise (List B: for example pubs,
            takeaways, event spaces, industry, storage, sports, minerals and waste sites, energy generation,
            transport uses, classified A or B roads).'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies STP 5, QOP 2, POL 2 and MIN 1; NPPF chapter 15, paragraphs
  180 and 191
source-text: 'You must submit a noise assessment for: Householder planning permission new or replacement
  air source or ground source heat pumps Full planning permission or approval of reserved matters a noise-sensitive
  use (list A) next to a potentially noisy use (list B) a new or changed use that could create harmful
  noise (list B)'
must-include:
- item: 'Heat pumps: how loud the equipment is, usual noise levels in the area, whether it runs at night,
    noise insulation, maintenance and whether several units are close together'
  level: should
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Air or ground source heat pumps.
- item: Prepared by a qualified noise consultant
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Measurements of existing and proposed noise
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: How the noise could affect nearby people, protected species or quiet areas
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'Mitigation: steps to reduce or manage harmful noise'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 29. The page gives full lists
  of noise-sensitive uses (List A) and potentially noisy uses (List B).
review-status: unverified
field-status: {}
