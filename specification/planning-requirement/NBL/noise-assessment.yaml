reference: noise-assessment
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: plant-equipment
        value: true
        description: New or replacement air source or ground source heat pumps.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise-sensitive use (list A) next to a potentially noisy use (list B).
      - condition:
          field: noise-generating-use
          value: true
          description: A new or changed use that could create harmful noise (list B).
