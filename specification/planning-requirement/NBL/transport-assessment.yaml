reference: transport-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more dwellings (Transport Statement 50 to 80; Transport Assessment over 80).
    - condition:
        field: industrial-floorspace
        operator: '>='
        value: 2500
        description: 2,500 square metres or more of B2 general industrial floor area.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 3000
        description: 3,000 square metres or more of B8 storage or distribution floor area.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 75
        description: 75 or more hotel bedrooms (C1).
    - condition:
        field: residential-capacity
        operator: '>='
        value: 30
        description: 'C2 thresholds in the council''s table: 30 or more beds in residential institutions,
          50 or more students in residential education, 250 or more residents in institutional hostels.'
    - discretionary
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies TRA 1; NPPF chapter 9
source-text: 'You may need a TA, TS or TP if you are applying for: full planning permission approval of
  reserved matters This includes: new development changes of use extensions to existing buildings ...
  Use class and type of development proposed Transport Statement Transport Assessment or Travel Plan B2
  - General Industrial 2500 to 4000 square metres floor area Over 4000 square metres floor area B8 - Storage
  or Distribution 3000 to 5000 square metres floor area Over 5000 square metres floor area C1 - Hotels
  75 to 100 bedrooms Over 100 bedrooms C2 - Residential institutions such as hospitals and nursing homes
  30 to 50 beds Over 50 beds C2 - Residential education such as boarding schools and training centres
  50 to 150 students Over 150 students C2 – Institutional hostels such as homeless shelters 250 to 400
  residents Over 400 residents C3 Dwelling houses 50 to 80 dwellings Over 80 dwellings'
must-include:
- item: A Transport Statement for developments between the lower and upper thresholds (2,500 to 4,000
    square metres B2; 3,000 to 5,000 square metres B8; 75 to 100 hotel bedrooms; 30 to 50 beds in C2 residential
    institutions; 50 to 150 students in C2 residential education; 250 to 400 residents in C2 hostels;
    50 to 80 dwellings.)
  level: must
- item: A Transport Assessment above the upper thresholds (Over 4,000 square metres B2; over 5,000 square
    metres B8; over 100 hotel bedrooms; over 50 beds in C2 residential institutions; over 150 students
    in C2 residential education; over 400 residents in C2 hostels; over 80 dwellings.)
  level: must
- item: Less than 3 years old, or with an updated statement if older
  level: must
  source-text: your document is less than 3 years old
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 37. The threshold table sets
  a Transport Statement band and a 'Transport Assessment or Travel Plan' band. The C2 bands are shown
  as one residential-capacity condition at the lowest band. The page adds 'Some types of development may
  not meet these thresholds but could still affect roads or traffic. We may ask for a TA, TS or TP later',
  shown as discretionary.
review-status: unverified
field-status: {}
