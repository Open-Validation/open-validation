reference: design-and-access-statement
local-authority: NBL
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Site is in a conservation area or Hadrian's Wall World Heritage Site.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: 100 square metres or more of new floorspace (including extensions).
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: Site is in a conservation area or World Heritage Site.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more new homes.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: 100 square metres or more of new floorspace, including extensions.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You need a Design and Access Statement if you are applying for: listed building consent
  a householder extension of more than 100 square metres in a conservation area or World Heritage Site
  full or outline planning permission for: one or more new homes in a conservation area or World Heritage
  Site 10 or more new homes, or a site of 0.5 hectares or more where the number of homes is not known
  100 square metres or more of new floorspace in a conservation area or World Heritage Site, including
  extensions 1,000 square metres or more of new floorspace, including extensions a site of 1 hectare or
  more, except for some mining, waste and engineering projects'
must-include:
- item: How the design fits the site and the area around it
  level: must
- item: How people will get to and use the development safely
  level: must
- item: How the proposal meets relevant planning policies
  level: must
- item: How relevant Northumberland Local Plan policies have been used
  level: must
- item: Housing policies that apply, such as HOU 9 and HOU 11
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal includes new homes.
  source-text: For new homes, check if any housing policies apply to your proposal, such as HOU 9 and
    HOU 11.
- item: If part of another document, the front cover says so
  level: should
  source-text: If the statement is included as part of another document, the front cover should clearly
    say this.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 5. The page lists 'a householder
  extension of more than 100 square metres' while the householder checklist (and national law) say '100
  square metres or more'; the rule uses 100 or more. The full and outline thresholds (10 or more homes,
  0.5 ha, 1,000 square metres, 1 ha) are the major development thresholds, shown as major-development.
  Not needed for a change of use with no building work or other development.
review-status: unverified
field-status: {}
