notes: From the council's list (web page, republished 1 April 2026), Note 37. The upper band of the table
  is headed 'Transport Assessment or Travel Plan'. The C2 bands are shown as one residential-capacity
  condition at the lowest band. The council may ask for one later for developments below the thresholds
  (discretionary).
