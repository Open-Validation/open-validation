reference: travel-plan
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: Over 80 dwellings.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 4000
        description: Over 4,000 square metres of B2 general industrial floor area.
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 5000
        description: Over 5,000 square metres of B8 storage or distribution floor area.
    - condition:
        field: bedroom-count
        operator: '>'
        value: 100
        description: Over 100 hotel bedrooms (C1).
    - condition:
        field: residential-capacity
        operator: '>'
        value: 50
        description: 'C2 thresholds in the council''s table: over 50 beds in residential institutions,
          over 150 students in residential education, over 400 residents in institutional hostels.'
    - discretionary
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies TRA 1; NPPF chapter 9
source-text: Use class and type of development proposed Transport Statement Transport Assessment or Travel
  Plan B2 - General Industrial 2500 to 4000 square metres floor area Over 4000 square metres floor area
  B8 - Storage or Distribution 3000 to 5000 square metres floor area Over 5000 square metres floor area
  C1 - Hotels 75 to 100 bedrooms Over 100 bedrooms C2 - Residential institutions such as hospitals and
  nursing homes 30 to 50 beds Over 50 beds C2 - Residential education such as boarding schools and training
  centres 50 to 150 students Over 150 students C2 – Institutional hostels such as homeless shelters 250
  to 400 residents Over 400 residents C3 Dwelling houses 50 to 80 dwellings Over 80 dwellings
must-include:
- item: Less than 3 years old, or with an updated statement if older
  level: must
  source-text: your document is less than 3 years old
