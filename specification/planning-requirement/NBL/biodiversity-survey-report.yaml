reference: biodiversity-survey-report
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: potential-roost-features
        value: true
        description: Bat or barn owl habitat listed in the council's Ecology Checklist is affected (for
          example roofs, roof spaces or wall tops of rural buildings, permanent agricultural buildings,
          bridges, underground structures, large or decaying trees, or floodlighting within 50 m of woodland,
          water or connected hedgerows).
    - site:
        in:
        - special-protection-area
        - ramsar
        - special-area-of-conservation
        - site-of-special-scientific-interest
        - local-wildlife-site
        - local-nature-reserve
        description: The proposal will affect an SPA, Ramsar site, SAC, SSSI, Local Wildlife or Geological
          Site, Local Nature Reserve or Marine Conservation Zone.
    - all:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
          - lbc
          - demolition-con-area
      - site:
          in:
          - ancient-woodland
          description: Within 100 m of Ancient Woodland (excluding householder).
    - condition:
        field: hedgerows-affected
        value: true
        description: Woodland, scrub or hedgerows/lines of trees with an obvious connection to woodland
          or water are affected.
    - discretionary
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017
source-text: 'You must check if you need an ecology report for: full planning permission outline planning
  permission householder planning permission listed building consent approval of reserved matters demolition
  in a conservation area'
must-include:
- item: Less than 2 years old, or with an updated statement if older
  level: must
  source-text: the report is less than 2 years old
- item: A final version, not a draft
  level: must
- item: If badger setts or nesting birds of prey are found, this is stated on the cover
  level: must
- item: A Bat Survey (or Bat and Barn Owl Survey for farm buildings) where bat or barn owl habitat is
    affected
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Bat or barn owl habitat is affected.
  source-text: If they are, you will need to submit a Bat Survey report. Or for farm buildings a Bat and
    Barn Owl Survey report.
- item: An Ecological Impact Assessment (EcIA) where other listed habitats or designated sites are affected;
    a Preliminary Ecological Appraisal only where impacts are very limited and no further survey is needed
  level: must
  source-text: 'We can only accept Preliminary Ecological Appraisal (PEA) Reports in place of EcIAs where:
    1. ecological impacts are likely to be very limited, and 2. no further survey work is required. In
    all other instances you must submit an EcIA.'
- item: An EcIA informed by data from the Environmental Records Information Centre North East (ERIC NE)
  level: must
  source-text: The survey must be informed by ecological data from the Environmental Records Information
    Centre North East (ERIC NE).
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 19. The page and the checklists
  ask applicants to self-assess with the council's Ecology Checklist and Guidance Note (https://www.northumberland.gov.uk/NorthumberlandCountyCouncil/media/Planning-and-Building/EcologyChecklistAndGuidanceNote.pdf),
  whose triggers are summarised in the rule; the remaining ones (for example major applications within
  200 m, or minor applications next to, a river, stream, pond or lake) are left as discretionary. Not
  normally needed for a change of use only, no external or roof work, or only replacing doors or windows.
review-status: unverified
field-status: {}
