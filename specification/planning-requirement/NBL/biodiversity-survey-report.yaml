reference: biodiversity-survey-report
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - reserved-matters
      - demolition-con-area
  - condition:
      field: protected-species
      value: true
      description: The proposal may affect protected species (a bat survey is more likely where works
        affect the roof, roof space or wall tops).
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
source-text: 'Householder: Ecology reports Note 19 You’ll need to self-assess the need for this.


  Full planning, Outline, Reserved matters, Listed building consent, Demolition in cons area: You must
  check if you need an ecology report for: full planning permission outline planning permission householder
  planning permission listed building consent approval of reserved matters demolition in a conservation
  area Check if you need an ecology report (PDF) You are more likely to need a bat survey if your house
  is in a settlement with large gardens and mature trees, such as Darras Hall, Stocksfield or Riding Mill,
  and your work affects the roof, roof space or wall tops.'
confidence: low
notes: Applicants must self-assess the need for an ecology report using the council's PDF guide. The audit
