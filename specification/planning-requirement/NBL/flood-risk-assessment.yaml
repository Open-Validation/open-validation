reference: flood-risk-assessment
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: The development is in Flood Zone 2 or 3.
    - any:
      - condition:
          field: residential-extension
          value: true
          description: An extension to an existing home.
      - condition:
          field: residential-annexe
          value: true
          description: Extra accommodation, such as an annexe.
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: The development, or the change of use of a building or land, is in Flood Zone 2
            or 3.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more and in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more and in Flood Zone 1.
  - all:
    - application-type:
        in:
        - prior-approval
    - site:
        in:
        - flood-risk-zone
        description: Change of use, new homes or flats from existing buildings, demolition and replacement
          with a new home, or temporary campsite or school use, in Flood Zone 2 or 3 (not Class T state-funded
          schools).
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies WAT 3, WAT 4 and WAT 5; NPPF chapter 14, paragraphs
  165 to 175
source-text: 'You must submit an FRA if you are applying for: Householder planning permission for: an
  extension to an existing home in Flood Zone 2 or 3 extra accommodation, such as an annexe, in Flood
  Zone 2 or 3 Full or outline planning permission where: the development is in Flood Zone 2 or 3 you are
  changing the use of a building or land in Flood Zone 2 or 3 the site is 1 hectare or more and in Flood
  Zone 1 Prior approval for: a change of use in Flood Zone 2 or 3, except Class T state-funded schools
  new homes or flats created from existing buildings in Flood Zone 2 or 3 demolition and replacement with
  a new home in Flood Zone 2 or 3 temporary use as a campsite Class BC or school Class CA on vacant land
  in Flood Zone 2 or 3 temporary use for film making Class E - an FRA is always needed, whatever the flood
  zone'
must-include:
- item: Specific to the site and proposed development
  level: must
- item: Explains how flood risk will be managed for the lifetime of the development
  level: must
- item: Shows the development will not increase flood risk elsewhere
  level: must
- item: Suitable for the size and type of development
  level: must
- item: Less than 3 years old, or with an updated statement if older
  level: must
  source-text: Your FRA must be less than 3 years old.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 20. Only needed if the development
  itself is in the flood zone. Prior approval for temporary use for film making (Class E) always needs
  an FRA, whatever the flood zone. A planning officer may ask for an FRA later, for example where foundations
  are close to a flood zone.
review-status: unverified
field-status: {}
