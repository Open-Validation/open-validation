reference: floor-plan-proposed
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings or structures (including outbuildings).
      - condition:
          field: footprint-increase
          value: true
          description: Extensions (including outbuildings).
      - condition:
          field: openings-alteration
          value: true
          description: New or altered window or door openings.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: scale
          description: Scale is applied for.
      - condition:
          field: reserved-matters-sought
          value: appearance
          description: Appearance is applied for.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings or structures (including outbuildings).
      - condition:
          field: footprint-increase
          value: true
          description: Extensions (including outbuildings).
      - condition:
          field: openings-alteration
          value: true
          description: New or altered window or door openings.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: internal-works
          value: true
          description: Internal changes.
      - condition:
          field: openings-alteration
          value: true
          description: New or altered window or door openings.
  - application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-sui-to-dwh
      - cho-amusements-to-dwh
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: floor-layout-change
        value: true
        description: The change affects the approved floor plans.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You need floor plans if you are applying for: householder planning permission full planning
  permission outline planning permission or reserved matters (if scale or appearance is applied for) But
  only for these works: new buildings or structures (including outbuildings) extensions (including outbuildings)
  new or altered window or door openings You also need floor plans for: listed building consent for: internal
  changes new or altered window or door openings demolition prior approval applications for change of
  use to a residential dwelling or flat removal or variation of a condition where the change affects an
  elevation – proposed floor plans only a non-material amendment where the change affects the floor plan
  – proposed floor plans only demolition in a conservation area – existing floor plans only for total
  demolition regulation 77 application'
must-include:
- item: The layout of every floor affected by the proposed work
  level: must
- item: Each drawing labelled by floor or level and as existing or proposed
  level: should
  source-text: Floor plans are normally labelled by the floor or level they show, such as ground floor,
    first floor or loft. Label each drawing clearly as existing or proposed.
- item: All windows and doors shown, including high-level windows, matching those on the elevations
  level: must
  source-text: Make sure windows and doors shown on the floor plans match those shown on the elevations.
- item: Anything to be demolished clearly shown
  level: must
- item: At the correct scale, normally 1:50 or 1:100
  level: must
  source-text: use the correct scale, normally 1:50 or 1:100
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 8. For removal or variation
  of a condition the page says 'where the change affects an elevation – proposed floor plans only'; the
  s73 checklist says 'you propose to amend the approved floor plans', which is what the rule shows. For
  total demolition only existing drawings are needed. For sheds, greenhouses and summerhouses a clear
  product brochure with metric measurements may be accepted instead of drawings. For lawful development
  certificates drawings are not required. The general drawing rules (scale bar, paper size, labels, no
  photographs of drawings) are in submission-standards.
