reference: archaeological-assessment
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - all:
        - any:
          - condition:
              field: site-area-residential
              operator: '>='
              value: 1
              description: The site is 1 hectare or more ...
          - condition:
              field: site-area-non-residential
              operator: '>='
              value: 1
              description: The site is 1 hectare or more ...
        - condition:
            field: ground-disturbance
            value: true
            description: '... and includes external works.'
      - all:
        - site:
            in:
            - scheduled-monument
            - battlefield
            - world-heritage-site
            description: 'The site includes a designated heritage asset: a scheduled monument, registered
              battlefield or Hadrian''s Wall World Heritage Site (not its buffer zone) ...'
        - any:
          - condition:
              field: new-build
              value: true
              description: '... and a new building or ground floor extension is proposed.'
          - condition:
              field: ground-disturbance
              value: true
              description: '... or groundworks, new roads, tracks or access routes, or underground services.'
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: demolition
        value: true
        description: The proposal includes demolition of a building or structure (not a boundary wall).
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies ENV 7, ENV 8, WAT 2 and MIN 1; NPPF chapter 16
source-text: 'You must submit a desk-based assessment if you are applying for full or outline planning
  permission and: the site is 1 hectare or more and includes external works the site includes a designated
  heritage asset and you are proposing: a new building or ground floor extension groundworks, such as
  digging, levelling or lowering the ground new roads, tracks or access routes underground services, such
  as drainage, sewers, power cables or ground-source heating ... You must submit an archaeological building
  assessment and recording if you are applying for listed building consent that includes the demolition
  of a building or structure. This does not include the demolition of a boundary wall.'
must-include:
- item: Known or possible archaeological remains on or near the site, what they are, how important they
    may be and how far they may extend
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: How the development could affect them or their setting
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: Prepared by a qualified archaeologist
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
- item: An Archaeological Statement explaining why, if the applicant thinks a desk-based assessment is
    not needed
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
  source-text: If you think you do not need one, you must submit an Archaeological Statement explaining
    why.
- item: What the building is like, including its style, age and layout
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: What the building was used for and how it has changed over time
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Why the building is important and what makes it special
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: How the area around the building adds to its importance
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (web page, republished 1 April 2026), Note 13. Also Note 12 (archaeological
  building report: historic building assessment and recording) for listed building consent involving demolition.
  The listed building checklist calls it ''Archaeological building assessment and recording''.'
review-status: unverified
field-status: {}
