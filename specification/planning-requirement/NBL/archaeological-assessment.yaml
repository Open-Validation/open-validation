reference: archaeological-assessment
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 1
            description: The site is 1 hectare or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 1
            description: The site is 1 hectare or more.
      - condition:
          field: external-alterations
          value: true
          description: The proposal includes external works.
    - all:
      - site:
          in:
          - listed-building
          - scheduled-monument
          - conservation-area
          - park-and-garden
          - world-heritage-site
          description: The site includes a designated heritage asset.
      - condition:
          field: ground-disturbance
          value: true
          description: A new building or ground floor extension, groundworks, new roads, tracks or access
            routes, or underground services.
