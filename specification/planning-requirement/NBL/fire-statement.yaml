reference: fire-statement
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building will contain 2 or more homes.
    - condition:
        field: educational-accommodation
        value: true
        description: The building will contain residential educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The building will be 18 metres or more high.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The building will have 7 or more storeys.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9A
source-text: 'You may need a fire statement for: full planning permission approval of reserved matters
  some prior approval applications It is needed if the proposed building: will contain 2 or more homes
  or residential educational accommodation, and will be 18 metres or more high, or have 7 or more storeys'
must-include:
- item: A completed fire statement (GOV.UK form), or an exemption statement explaining which exemption
    applies and why
  level: must
  source-text: submit a completed fire statement or an exemption statement
- item: All relevant questions on the form answered
  level: must
- item: Covers the whole development shown on the location plan
  level: must
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 7. The page also lists 'some
  prior approval applications' without saying which, so those are not shown. National exemptions apply.
review-status: unverified
field-status: {}
