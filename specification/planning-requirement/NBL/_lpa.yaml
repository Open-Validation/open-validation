submission-standards:
- item: Documents clearly named, with the title shown on the front cover; the council will not search
    through reports to find missing information
  level: must
- item: Where a document is included in another document, the front cover says so
  level: should
- item: Drawings at the correct scale for the drawing type, stating the scale and with a scale bar or
    a measurement that matches the scale
  level: must
- item: Drawings provided at the correct paper size for the scale (for example 1:50 on A3, 1:20 at A3
    on A3 paper)
  level: must
- item: Each drawing clearly labelled, for example existing ground floor or proposed north elevation
  level: must
- item: Drawings clear and easy to read; not photographs of drawings
  level: must
- item: Detailed drawings show the materials and colours, either on the drawing or in the application
    form
  level: must
- item: Existing drawings show the building as it is now (or before retrospective work); proposed drawings
    show it after the work (or as built)
  level: should
