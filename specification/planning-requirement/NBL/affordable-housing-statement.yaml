reference: affordable-housing-statement
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more homes (new homes, conversions and changes of use).
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site of 0.5 hectares or larger.
    - all:
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: The site is in the Northumberland Coast AONB.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 to 9 homes.
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
source-text: 'When to submit this You must submit an affordable housing statement if you are applying
  for full planning permission or approval of reserved matters for: 10 or more homes less than 10 homes
  on a site 0.5 hectares or larger 5 to 9 homes within the Northumberland Coast Area of Outstanding Natural
  Beauty (AONB) This applies to new homes, conversions and changes of use.'
confidence: low
notes: The audit couldn't read this council's list, so its contents weren't checked.
review-status: unverified
field-status: {}
