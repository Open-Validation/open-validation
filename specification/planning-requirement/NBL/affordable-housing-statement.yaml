reference: affordable-housing-statement
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more homes.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Less than 10 homes on a site of 0.5 hectares or larger.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 to 9 homes ...
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: '... within the Northumberland Coast AONB.'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies HOU 2, HOU 4, HOU 5, HOU 6, HOU 7, HOU 11, ENV 5,
  ENV 6 and INF 6; NPPF chapter 5
source-text: 'You must submit an affordable housing statement if you are applying for full planning permission
  or approval of reserved matters for: 10 or more homes less than 10 homes on a site 0.5 hectares or larger
  5 to 9 homes within the Northumberland Coast Area of Outstanding Natural Beauty (AONB) This applies
  to new homes, conversions and changes of use.'
must-include:
- item: Prepared by a chartered professional
  level: must
  source-text: The report must be prepared by a chartered professional.
- item: Whether the affordable housing is on-site or an off-site financial contribution
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is provided.
- item: Type of units (houses or flats)
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is provided.
- item: Tenure (such as social rent, affordable rent or intermediate housing)
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is provided.
- item: Location of the affordable units shown on the proposed site plan
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is provided on site.
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 10. Required percentages depend
  on the housing value area (Local Plan policy HOU 6). An off-site contribution or no affordable housing
  needs a viability appraisal (see viability-assessment).
review-status: unverified
field-status: {}
