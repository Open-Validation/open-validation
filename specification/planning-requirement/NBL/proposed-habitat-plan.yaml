reference: proposed-habitat-plan
local-authority: NBL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: National BNG rules apply to the application (not for householder applications).
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Environment Act 2021 Schedule 7A; National Planning Practice Guidance on Biodiversity Net Gain
source-text: You must submit a BNG strategy if national BNG rules apply to your application, as explained
  in Note 6. You do not need to submit this for householder applications.
must-include:
- item: Explains how the development will achieve at least 10% biodiversity net gain
  level: must
- item: Shows where the habitat will be created or improved
  level: must
- item: The completed BNG condition sheets
  level: must
- item: Plans showing the location of each habitat area included in the biodiversity metric
  level: must
- item: Prepared by a suitably qualified and competent ecologist
  level: should
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 14. The council calls this a
  'Biodiversity net gain strategy', a local requirement (Note 6 lists it as 'a BNG Strategy – this is
  a local requirement'). It is filed as proposed-habitat-plan because its validation contents are plans
  of the habitat areas to be created or improved.
review-status: unverified
field-status: {}
