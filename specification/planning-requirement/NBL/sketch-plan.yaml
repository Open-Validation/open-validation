reference: sketch-plan
local-authority: NBL
required-if:
  any:
  - all:
    - application-type:
        in:
        - consent-under-tpo
        - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Trees protected by a TPO or in a conservation area ...
    - condition:
        field: tree-works
        value: true
        description: '... will be removed or pruned (answered yes in the Trees and Hedges section).'
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: minor-development
        value: true
        description: Minor development ...
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: '... involving protected trees (TPO or conservation area) ...'
    - condition:
        field: tree-works
        value: true
        description: '... that will be pruned or removed.'
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies QOP 4; NPPF chapter 12, paragraph 136
source-text: 'You must include a tree plan if your application involves pruning or removing trees and
  either: the trees are protected by a Tree Preservation Order (TPO) the trees are in a conservation area
  This applies to: tree works applications householder planning permission where you have answered yes
  in the Trees and Hedges section of the application form full planning permission or approval of reserved
  matters for minor developments involving protected trees'
must-include:
- item: Which trees will be removed or pruned and which will be kept
  level: must
- item: Based on a current map
  level: must
- item: Drawn to scale with the scale shown (not needed for tree works applications)
  level: must
  source-text: the plan is drawn to scale and the scale is shown
- item: Less than 12 months old
  level: must
  source-text: your plan is less than 12 months old
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 38. The council calls it a Tree
  plan; the tree works checklists call it 'Tree plan (sketch plan)', so it is filed under MHCLG's retired
  sketch-plan id. It can be added to the site plans.
review-status: unverified
field-status: {}
