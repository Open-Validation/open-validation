reference: sustainable-drainage-strategy
local-authority: NBL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
source-url: https://www.northumberland.gov.uk/planning-and-building/planning/apply-planning-permission/planning-application-requirements
policy: Northumberland Local Plan 2016-2036 policies WAT 3, WAT 4 and WAT 5; NPPF chapter 14, paragraphs
  173 and 175; North East LLFA Local SuDS Standards
source-text: 'You must submit a surface water drainage strategy if you are applying for: full planning
  permission for a major development outline planning permission for a major development'
must-include:
- item: How surface water will be managed and how SuDS will be used
  level: should
- item: A pre-planning enquiry from Northumbrian Water, if surface water cannot drain into the ground
    or a watercourse and will connect to a sewer
  level: must
  source-text: If so, include a pre-planning enquiry from Northumbrian Water.
- item: Less than 3 years old, or with an updated statement if older
  level: must
  source-text: your strategy is less than 3 years old
confidence: medium
notes: From the council's list (web page, republished 1 April 2026), Note 35. The council calls it a Surface
