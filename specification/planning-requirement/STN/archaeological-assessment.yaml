reference: archaeological-assessment
local-authority: STN
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Area of Archaeological Priority.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves ground disturbance.
  - all:
    - site:
        in:
        - scheduled-monument
        description: The site is within 50m of an Ancient Monument.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves new footings.
source-url: https://www.sutton.gov.uk/sites/default/files/2026-08/London%20Borough%20of%20Sutton%20Local%20Validation%20List%202026.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook had no trigger. From the audit: ground disturbance in an Area
  of Archaeological Priority, or new footings within 50m of an Ancient Monument (applies to Householder
  and LBC too).'
review-status: unverified
