reference: flood-risk-assessment
local-authority: STN
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves new footings.
  - condition:
      field: basement
      value: true
      description: The proposal involves new subterranean levels.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
source-url: https://www.sutton.gov.uk/sites/default/files/2026-08/London%20Borough%20of%20Sutton%20Local%20Validation%20List%202026.pdf
source-text: Flood Zones 2 or 3 with new footings; new subterranean levels; or sites of 1 hectare or more
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s excerpt said ''should be prepared for all developments''.'
review-status: unverified
field-status: {}
