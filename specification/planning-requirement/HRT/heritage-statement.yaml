reference: heritage-statement
local-authority: HRT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - reg-3
    - site:
        in:
        - listed-building
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - world-heritage-site
        description: Developments affecting the historic environment (Listed Buildings, Conservation Areas,
          Scheduled Monuments, Historic Parks and Gardens, World Heritage Sites).
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All applications for listed building consent and for developments affecting the historic
  environment (Listed Buildings, Conservation Areas, Scheduled Monuments, Historic Parks and Gardens,
  World Heritage Sites).
must-include:
- item: An analysis and assessment of the special interest and significance of the heritage asset, including
    any contribution made by its setting
  level: must
- item: An assessment of the potential impact of the proposals on the special interest, significance and
    qualities identified
  level: must
- item: Proposals to avoid any harmful impacts
  level: should
- item: Detail proportionate to the asset's importance and sufficient to understand the impact on its
    significance
  level: should
- item: The sources considered, the expertise consulted, and the steps taken to avoid or minimise adverse
    impacts on significance
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 14-15. The list cites the NPPF and Historic
  England guidance only.
review-status: unverified
field-status: {}
