reference: heritage-statement
local-authority: HRT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - mineral-app
        - waste-dev
        - reg-3
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - world-heritage-site
        description: Development affecting Listed Buildings, Conservation Areas, Scheduled Monuments,
          Historic Parks and Gardens or World Heritage Sites.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Heritage Statement … When Required All applications for listed building consent and for developments
  affecting the historic environment (Listed Buildings, Conservation Areas, Scheduled Monuments, Historic
  Parks and Gardens, World Heritage Sites).
confidence: medium
notes: 'Audit (wrong_app_type): not only listed building consent; also development affecting the historic
  environment.'
review-status: unverified
field-status: {}
