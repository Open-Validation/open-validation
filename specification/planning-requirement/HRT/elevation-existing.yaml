reference: elevation-existing
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new buildings.
    - condition:
        field: external-alterations
        value: true
        description: The proposal includes external changes to a building.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications excluding applications for changes of use or certificates of lawfulness
  with no external changes and S73 applications.
must-include:
- item: Drawings at a scale of 1:50, 1:100 or 1:200
  level: must
- item: All relevant external parts, including side elevations
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the relative positions of openings, parapets, levels etc. on each property'
  level: must
  required-if: discretionary
- item: Blank elevations (e.g. blank end elevations) included
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 7. The list excludes changes of use and lawful
  development certificates with no external changes, so the requirement is shown for new buildings or
  external changes. The county only decides minerals, waste and its own (Regulation 3) development, so
  the application types are the minerals, waste and Regulation 3 types. The list excludes Section 73 applications,
  which the application types cannot show.
review-status: unverified
field-status: {}
