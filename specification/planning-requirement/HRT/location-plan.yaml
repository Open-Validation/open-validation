reference: location-plan
local-authority: HRT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Up to date map at a scale of 1:1250 or 1:2500 with a scale bar
  level: must
- item: Application site boundary clearly edged with a red line, including all land required for the proposed
    development
  level: must
- item: Any other land within the control or ownership of the applicant, adjacent or close to the application
    site, edged with a blue line
  level: should
- item: An arrow indicating the direction of North
  level: must
- item: At least two surrounding named roads
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 5. The county only decides minerals, waste
  and its own (Regulation 3) development, so the application types are the minerals, waste and Regulation
  3 types.
review-status: unverified
field-status: {}
