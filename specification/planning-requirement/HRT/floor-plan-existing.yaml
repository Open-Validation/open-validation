reference: floor-plan-existing
local-authority: HRT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except S73 applications.
must-include:
- item: Drawings at a scale of 1:50, 1:100 or 1:200
  level: must
- item: Each relevant floor or part floor, the roof and the means of access
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: For a change of use, floor plans annotated to show the extent of the existing and proposed use
    within the land or building
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
confidence: medium
notes: From the council's list (published June 2024), page 7. The county only decides minerals, waste
  and its own (Regulation 3) development, so the application types are the minerals, waste and Regulation
  3 types. The list excludes Section 73 applications, which the application types cannot show.
review-status: unverified
field-status: {}
