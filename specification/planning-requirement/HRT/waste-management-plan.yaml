reference: waste-management-plan
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - condition:
      field: floorspace
      operator: '>'
      value: 500
      description: Over 500 square metres of new building development.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Site Waste Management Plan … When Required Regulation 3 applications with over 500m2 of new
  building development.
must-include:
- item: Estimates of waste arising
  level: must
- item: Recordings of waste managed
  level: must
- item: List of waste carriers
  level: must
- item: Proportion of wastes re-used, recycled and disposed
  level: must
