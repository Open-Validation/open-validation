reference: landscaping-plan
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: landscaping-works
        value: true
        description: The application includes some form of landscaping.
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All planning applications that include some form of landscaping. Where the proposal contains,
  or is likely to require, some form of landscaping to make it acceptable in planning terms. Applications
  for full planning permission (apart from change of use) should be accompanied by a fully detailed scheme.
must-include:
- item: 'Proposed landform: existing and proposed contours/levels, including areas of cut and fill'
  level: must
- item: Layout of buildings and open spaces (including car parks) and areas of hard surfacing
  level: must
- item: Areas of new and retained planting, with measures to protect it during construction
  level: must
- item: Boundary treatments, vehicle and pedestrian access points, routes and circulation areas
  level: must
- item: Services and any other structures and ancillary objects (refuse bins, lighting columns etc.)
  level: must
- item: Hard (materials and workmanship) and soft (planting) landscape construction details
  level: should
- item: Planting plans and schedules (plant numbers, sizes, species, density and locations) and written
    specifications
  level: should
- item: Aftercare for at least 5 years, detailed in management and maintenance specifications and schedules
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 16-17. Called a Landscape Scheme. Proposals
  likely to need landscaping to be acceptable are shown as discretionary. Full applications (apart from
  change of use) should include a fully detailed scheme.
review-status: unverified
field-status: {}
