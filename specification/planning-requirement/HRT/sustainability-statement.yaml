reference: sustainability-statement
local-authority: HRT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All applications except householders, certificates of lawfulness.
must-include:
- item: Water use, particularly where water scarcity is a local issue and for major development involving
    surface or groundwater abstraction
  level: should
- item: 'Energy consumption: renewable energy schemes (e.g. photovoltaic panels, wind turbines) and fabric
    design to reduce energy needs and CO2 emissions'
  level: should
- item: 'Sustainable construction: recycled and locally-sourced building and landscaping materials'
  level: should
- item: 'Waste management: promoting resource efficiency'
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 22. Called a Sustainability Statement/Appraisal.
  Householder and lawful development certificate applications are excluded; the county decides neither.
  The county only decides minerals, waste and its own (Regulation 3) development, so the application types
  are the minerals, waste and Regulation 3 types.
review-status: unverified
field-status: {}
