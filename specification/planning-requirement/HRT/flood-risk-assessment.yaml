reference: flood-risk-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: All development proposals of 1 hectare or greater (Flood Zones 1, 2 and 3).
    - all:
      - condition:
          field: operational-development
          value: true
          description: Operational development (of less than 1 hectare).
      - site:
          in:
          - flood-risk-zone
          description: The site is in Flood Zone 2 or 3.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: A change of use resulting in 'highly vulnerable' or 'more vulnerable' development,
            or from water compatible to less vulnerable development.
      - site:
          in:
          - flood-risk-zone
          description: The site is in Flood Zone 2 or 3.
    - condition:
        field: near-watercourse
        value: true
        description: The development includes culverting or control of any river or stream, or is within
          20 metres of the top of a bank of a main river.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All development proposals of 1 hectare or greater in Flood Zones 1, 2 and 3; Operational
  development of less than 1 hectare in Flood Zones 2 and 3; Change of use resulting in ‘highly vulnerable’
  or ‘more vulnerable’ development in Flood Zone 2 and 3; Change of use from water compatible to less
  vulnerable development in Flood Zone 3 and Non- residential extensions with a footprint of less than
  250m 2 where the development includes culverting or control of any river or stream or development within
  20 metres of the top of a bank of a main river.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: How the sequential approach has been taken into account, with appropriate mitigation measures
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 13-14. The list cites the NPPF and the LLFA's
  summary guidance for developers.
review-status: unverified
field-status: {}
