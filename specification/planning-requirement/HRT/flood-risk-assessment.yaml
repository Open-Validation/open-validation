reference: flood-risk-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or greater.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or greater.
    - site:
        in:
        - flood-risk-zone
        description: Operational development or a change to a more vulnerable use in Flood Zone 2 or 3.
    - condition:
        field: near-watercourse
        value: true
        description: Culverting, or works within 20 metres of the bank of a main river.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Flood Risk Assessment … When Required All development proposals of 1 hectare or greater in
  Flood Zones 1, 2 and 3;
must-include:
- item: Rainfall data from FEH22 (FSR and FEH1999 data are not accepted)
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook kept only the first clause. From the audit: also operational
  development under 1 ha in Flood Zones 2 and 3, changes of use to highly or more vulnerable uses in Flood
  Zones 2 and 3, water-compatible to less vulnerable in Flood Zone 3, and culverting or works within 20
  m of a main river bank. The FEH22 item is from the L30 footnote.'
review-status: unverified
field-status: {}
