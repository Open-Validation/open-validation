reference: biodiversity-survey-report
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Biodiversity net gain is mandatory for the development (Biodiversity Assessment).
    - condition:
        field: loss-of-habitat-features
        value: true
        description: The proposal could result in a net loss to biodiversity.
    - condition:
        field: protected-species
        value: true
        description: The proposal could negatively affect protected habitats or species.
    - site:
        in:
        - priority-habitat
        description: The proposal could negatively affect priority habitats or species.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Major applications and when proposals could result in a new loss to biodiversity, negatively
  affected protected habitats or species or priority habitats or species. … From 12 February 2024, BNG
  will be mandatory for new planning applications for major development made under the Town and Country
  Planning Act (TCPA) 1990, subject to the confirmed exemptions.
must-include:
- item: Protected species surveys where there is a reasonable likelihood of protected species being present
    and affected
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species are reasonably likely to be present and affected.
- item: A Phase 1 habitat survey
  level: must
- item: A Phase 2 habitat survey where necessary
  level: must
  required-if: discretionary
- item: Compliant with BS42020, carried out by a trained ecologist to national survey standards
  level: must
- item: Up to date surveys, ideally from the most recent survey season
  level: should
- item: Through survey and assessment, the effect of the development on designated sites, legally protected
    species, priority habitats and species on the English List (Section 41, NERC Act 2006), Wildlife Sites,
    Regionally Important Geological Sites and ecological or landscape features important to biodiversity
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Biodiversity net gain is mandatory (Biodiversity Assessment).
  source-text: Needs to consider, through survey and assessment, the effect of the development on designated
    sites, legally protected species, priority habitats and species on the English List
- item: Monitoring of the site before, during and after implementation
  level: should
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Biodiversity net gain is mandatory (Biodiversity Assessment).
  source-text: The Assessment should include monitoring of the site prior to, during and after implementation.
confidence: medium
notes: From the council's list (published June 2024), page 10 and 13. Covers the list's Ecological Survey
  (L10, page 13) and the survey parts of its Biodiversity Assessment (L4, page 10), which is needed where
  biodiversity net gain is mandatory. 'New loss' is the list's wording (read as net loss). The list cites
  the NPPF, BS 42020 and national guidance only.
review-status: unverified
field-status: {}
