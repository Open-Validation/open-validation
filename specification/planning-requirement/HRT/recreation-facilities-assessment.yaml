reference: recreation-facilities-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: loss-of-open-space
      value: true
      description: The development may result in the loss or degradation of designated playing field space.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All developments that may result in the loss or degradation of designated playing field space.
must-include:
- item: Existing playing field space
  level: must
- item: The impact of the development on playing field space, including proposed pitch provision
  level: must
- item: Evidence that the development would benefit the development of sport enough to compensate for
    the loss or degradation of playing field space
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 19-20. Called a Playing Field Assessment. The
  list cites the NPPF and Sport England guidance only.
review-status: unverified
field-status: {}
