reference: lighting-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: The application involves exterior lighting, or exterior lighting will be required.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Planning applications involving exterior lighting or where exterior lighting will be required.
must-include:
- item: The type of lighting, its height above ground and its power rating
  level: must
- item: The proposed hours of use and the means of controlling the hours of illumination
  level: must
- item: Drawings showing the spread of light and how it will be kept from extending beyond the site
  level: should
- item: The impact on any sensitive biodiversity feature
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2024), page 17. Called a Lighting Statement/Scheme. The
  list cites the NPPF and national guidance only.
review-status: unverified
field-status: {}
