reference: site-plan
local-authority: HRT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: At a scale of either 1:200 or 1:500 with a scale bar
  level: must
- item: Direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: must
- item: All neighbouring buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 5-6. Sometimes known as a block plan. The county
  only decides minerals, waste and its own (Regulation 3) development, so the application types are the
  minerals, waste and Regulation 3 types.
review-status: unverified
field-status: {}
