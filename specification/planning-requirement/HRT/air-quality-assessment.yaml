reference: air-quality-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: The site lies within or adjoining an Air Quality Management Area.
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: direct-air-emissions
        value: true
        description: Industrial activities with significant emissions to the atmosphere regulated by Environmental
          Permit.
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All major applications; when the site lies within or adjoining an Air Quality Management
  Area (excluding householders) or where proposals will have a significant adverse impact on air quality;
  all minerals and waste applications. Proposals that will significantly alter the traffic composition
  in an area such as heavy goods delivery traffic or industrial activities with significant emissions
  to the atmosphere regulated by Environmental Permit or introduction of a new school or public building
  close to an existing source of air pollution.
must-include:
- item: Current baselines in the area
  level: must
- item: The cumulative impact of known future developments in the area
  level: must
- item: The predicted future impact with and without the development, including mitigation, with statistics
    that can be compared with the air quality objectives
  level: must
- item: A dust suppression scheme showing how the impact of dust on the surrounding area will be minimised
  level: must
  required-if: discretionary
  source-text: Any application that has the potential to generate increased dust should include a dust
    suppression scheme
- item: Where the development could itself lead to an AQMA designation or undermine the air quality action
    plan, how this is addressed
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2024), page 9. Called an Air Quality Impact Assessment.
  A significant adverse impact on air quality, significant changes to traffic composition (such as heavy
  goods traffic) and a new school or public building near a source of air pollution are shown as discretionary.
  The list cites the NPPF only.
review-status: unverified
field-status: {}
