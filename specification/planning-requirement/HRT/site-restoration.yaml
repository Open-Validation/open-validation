reference: site-restoration
local-authority: HRT
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: The proposal involves waste disposal (landfill).
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Where proposals involve the disturbance of the ground for the extraction of minerals or waste
  disposal.
must-include:
- item: The approach to restoration, including the phasing and direction of working and progressive restoration
  level: must
- item: For each working phase, site layout plans showing enabling infrastructure (site access, offices,
    welfare facilities, car parking, haul roads, plant etc.), temporary and permanent mitigation measures,
    and the location of voids, stockpiles and waste materials
  level: must
- item: Cross sections showing the relative height of these within the wider site context
  level: should
- item: The proposed restoration material and soils (overburden and/or imported infill material) and the
    final landform
  level: should
- item: Plans of existing and proposed contours with cross sections of existing and proposed ground levels
    and gradients
  level: should
- item: A landscape scheme to the Landscape Scheme requirements, showing the proposed land use (e.g. agriculture,
    geodiversity, biodiversity, native woodland, historic environment, recreation)
  level: should
- item: A statement of the existing and proposed Agricultural Land Classification
  level: must
  required-if:
    condition:
      field: agricultural-land
      value: true
      description: The proposal affects agricultural land.
  source-text: For proposals that affect agricultural land, a statement of the existing and proposed Agricultural
    Land Classification is required.
- item: Site access, vehicular and pedestrian routes, public rights of way, and retained and new landscape
    features (including water and drainage features)
  level: should
- item: Aftercare for at least 5 years, detailed in management and maintenance specifications and schedules
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 20. Called a Restoration Strategy and Aftercare;
  the list cites the NPPF, national guidance and Defra guidance only. Pre and post settlement contours
  may be needed where high settlement rates are expected. The retired MHCLG id site-restoration is used.
review-status: unverified
field-status: {}
