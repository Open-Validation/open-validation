reference: transport-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - discretionary
    - condition:
        field: parking-change
        value: true
        description: Additional parking is proposed.
    - condition:
        field: hcv-movements
        value: true
        description: The use of HGVs is required (a Transport Assessment).
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: All applications where there is likely to be a significant impact upon the existing transport
  network, and/or where additional parking is proposed. All applications where the use of HGVs is required
  will require a Transport Assessment (TA).
must-include:
- item: 'Smaller schemes: an outline of the transport aspects of the application'
  level: must
- item: Accessibility to the site by all modes of transport and the likely modal split of journeys to
    and from the site
  level: must
  required-if:
    ref: major-development
- item: Measures to improve access by public transport, walking and cycling, to reduce the need for parking
    and to mitigate transport impacts
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published June 2024), page 22-23. A likely significant impact on the transport
  network is shown as discretionary. Any application needing HGVs needs a full Transport Assessment. The
  list cites the NPPF and national guidance only.
review-status: unverified
field-status: {}
