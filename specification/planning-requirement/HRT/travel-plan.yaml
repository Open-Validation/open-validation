reference: travel-plan
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - condition:
      field: pupil-increase
      operator: '>='
      value: 1
      description: New schools, or schools expanding the number of pupils.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: For new schools or where schools will be expanding the number of pupils.
must-include:
- item: How the transport implications of the development will be managed to minimise environmental, social
    and economic impacts, and a strategy for implementation
  level: must
- item: That any new pupil levels generated by the proposal will be brought to the site by public transport
    or by hired coaches
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 23. The list cites the NPPF and national guidance
  only.
review-status: unverified
field-status: {}
