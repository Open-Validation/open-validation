reference: water-impact-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed or the proposals affect the water table.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Hertfordshire Waste Core Strategy and Development Management Policies document, Policy 16; Hertfordshire
  Minerals Local Plan Review 2002-2016
source-text: For minerals and/or waste related development proposals, where dewatering is proposed or
  proposals affect the water table.
must-include:
- item: The calculation of the extent and volumes of dewatering
  level: must
- item: Topography and surface drainage, artificial ground, superficial deposits, landslip deposits, rockhead
    depth, bedrock geology and any borehole reports, including licensed and unlicensed abstractions
  level: must
- item: The natural water table, including its depth, source catchment areas and characteristics
  level: should
- item: The potential impact on any wetland site of special scientific interest
  level: must
- item: That third parties will not be affected by the dewatering
  level: must
- item: Mitigation measures (e.g. recharging reservoirs) where dewatering is likely to affect public or
    private water supplies, water bodies or watercourses
  level: must
  required-if: discretionary
- item: Proposed methods of dewatering and of water disposal
  level: must
- item: Measures to control pollution of ground and surface water, drainage and flood control, and monitoring
    (including settlement lagoons, surface water disposal and preventing material entering open watercourses)
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 15. Called a Hydrological/Hydrogeological Assessment.
  Works affecting the flow of an ordinary watercourse also need the Lead Local Flood Authority's prior
  written consent (Land Drainage Act 1991, section 23).
review-status: unverified
field-status: {}
