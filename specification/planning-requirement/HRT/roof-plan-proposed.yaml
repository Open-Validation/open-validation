reference: roof-plan-proposed
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: The application involves changes to roofs.
    - condition:
        field: new-build
        value: true
        description: The application is for a new building.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve changes to roofs or are for new building except S73 applications.
must-include:
- item: Shape and materials of roofs at a scale of 1:50, 1:100 or 1:200
  level: must
- item: The proposed works in relation to what is already there, highlighting any structures to be demolished
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 8. The county only decides minerals, waste
  and its own (Regulation 3) development, so the application types are the minerals, waste and Regulation
  3 types. The list excludes Section 73 applications, which the application types cannot show.
review-status: unverified
field-status: {}
