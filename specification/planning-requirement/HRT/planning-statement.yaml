reference: planning-statement
local-authority: HRT
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
    - lbc
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Hertfordshire Waste Local Plan Policy 6
source-text: Outline, reserved matters and full applications, listed building consent applications. All
  applications in the Hertfordshire Green Belt must provide a Green Belt Statement as part of the Planning
  Statement.
must-include:
- item: How the development accords with the development plan, supplementary planning documents, masterplans
    or development briefs, national policy and guidance and other relevant technical guidance
  level: must
- item: The need for the development and justification for any departure from policy, unless the development
    is entirely in accordance with development plan policies
  level: must
  required-if:
    condition:
      field: departure-from-development-plan
      value: true
      description: The development is not entirely in accordance with development plan policies.
- item: A Green Belt Statement, including very special circumstances where the development is contrary
    to Green Belt policies
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: The site is in the Hertfordshire Green Belt.
  source-text: All applications in the Hertfordshire Green Belt must provide a Green Belt Statement as
    part of the Planning Statement.
- item: S106 Heads of Terms where relevant
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2024), page 19. Needed for outline, reserved matters and
  full applications and listed building consent, so not for Section 73, details pursuant (conditions),
  non-material amendment or lawful development applications. The county only decides minerals, waste and
  its own (Regulation 3) development, so the application types are the minerals, waste and Regulation
  3 types.
review-status: unverified
field-status: {}
