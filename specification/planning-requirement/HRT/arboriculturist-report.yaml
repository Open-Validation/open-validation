reference: arboriculturist-report
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within, on the boundary of or close to the site could be affected.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Where there are trees within, on the boundary or in close proximity to the site that could
  be affected by the proposed development.
must-include:
- item: Trees proposed for retention or removal
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist using the BS 5837:2012 methodology
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 23. Called a Tree Survey/Arboricultural Statement.
review-status: unverified
field-status: {}
