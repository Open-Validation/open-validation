reference: noise-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: New development with the potential to create noise affecting existing noise sensitive
          development (such as residential areas, hospitals and schools).
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development in a location subject to noise from an existing use.
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - condition:
        field: landfill-development
        value: true
        description: Land-filling and land raising applications.
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Where new development will have the potential to create noise which will have an impact on
  existing noise sensitive development (such as residential areas, hospitals and schools). Where noise
  sensitive development (such as those listed above) would be developed in a location where it will be
  subject to noise from an existing use in the vicinity. Minerals and road developments, all land-filling
  and land raising applications; reworking or reclamation of former landfill sites; recycling of inert
  waste; where the proposal is likely to generate a noise level above background noise levels.
must-include:
- item: The existing ambient noise climate, and a survey of pedestrian and vehicular numbers in and around
    the premises
  level: must
- item: The existing and future noise climate due to the development, showing any predicted increase in
    noise levels
  level: must
- item: The existing and predicted number of events and their size and scale
  level: must
- item: Management procedures to reduce the impact of the operation on the locality, including noise from
    incoming and outgoing vehicles
  level: must
- item: Sound insulation details
  level: must
  required-if: discretionary
  source-text: Developments that may require sound insulation of a building to contain the noise generated
    within it need to be accompanied by these details.
confidence: medium
notes: From the council's list (published June 2024), page 18. Called a Noise and/or Vibration Statement.
  Road developments, reworking former landfill sites, inert waste recycling and proposals likely to exceed
  background noise levels are shown as discretionary. The list cites the NPPF, BS 4142 and national guidance
  only.
review-status: unverified
field-status: {}
