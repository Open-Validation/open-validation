reference: noise-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: New development that could create noise affecting noise-sensitive uses.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise-sensitive development next to an existing noisy use.
    - application-type:
        in:
        - mineral-app
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Minerals and road developments, all land-filling and land raising applications; reworking
  or reclamation of former landfill sites; recycling of inert waste ...
confidence: medium
notes: 'From the audit (missing_requirement): L20 Noise and/or Vibration Statement. The minerals, landfill,
  landraising and inert recycling cases apply where the proposal is likely to raise noise above background
  levels; the waste cases are shown as discretionary.'
review-status: unverified
field-status: {}
