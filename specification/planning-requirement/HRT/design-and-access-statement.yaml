reference: design-and-access-statement
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          description: The site is in a Conservation Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The proposal provides one or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: The floorspace created is 100 square metres or more.
