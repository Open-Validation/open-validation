reference: design-and-access-statement
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          description: The development is in a Conservation Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The provision of one or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings where the floorspace created is 100 square metres or
              more (measured externally).
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All major developments; developments in Conservation Area which consists of the provision
  of one or more dwelling houses or the provision of a building or buildings where the floorspace created
  by the development is 100 square metres or more (measured externally). Where a planning application
  is submitted in parallel with an application for listed building consent, a single combined Design and
  Access Statement should address the requirements of both.
must-include:
- item: The design principles and concepts that have been applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the proposed development, and how the design takes
    that context into account
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation undertaken on access issues, and how its outcome has informed the proposed development
  level: must
- item: How any specific issues which might affect access to the proposed development have been addressed
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 6. With a parallel listed building consent
  application, one combined statement should cover both. The county only decides minerals, waste and its
  own (Regulation 3) development, so the application types are the minerals, waste and Regulation 3 types.
review-status: unverified
field-status: {}
