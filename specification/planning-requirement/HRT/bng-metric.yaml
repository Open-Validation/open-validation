reference: bng-metric
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Environment Act 2021 (biodiversity net gain)
source-text: From 12 February 2024, BNG will be mandatory for new planning applications for major development
  made under the Town and Country Planning Act (TCPA) 1990, subject to the confirmed exemptions. … BNG
  for small sites will have an extended transition period and will apply from 2 April 2024.
must-include:
- item: A biodiversity impact calculation demonstrating net gain
  level: should
  source-text: A biodiversity impact calculation should be included in the Assessment to demonstrate net
    gain.
confidence: medium
notes: 'From the council''s list (published June 2024), page 10-11. Part of the list''s ''Biodiversity
  Assessment''. Shown for developments subject to the statutory biodiversity gain condition: the list
  explains the national rules, exemptions and transitional arrangements (retrospective applications are
  exempt). The survey parts of the assessment are in the biodiversity survey file.'
review-status: unverified
