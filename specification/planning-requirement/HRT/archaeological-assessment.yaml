reference: archaeological-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - all:
      - condition:
          field: operational-development
          value: true
          description: Operational development.
      - site:
          in:
          - archaeological-priority-area
          description: The site is in an Area of Archaeological Significance.
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Operational development in Areas of Archaeological Significance and/or where the development
  would have an impact upon a site which has, or has the potential to have, heritage assets with archaeological
  interest. These may include below ground archaeological remains, historic buildings and historic landscapes
  and gardens.
must-include:
- item: 'Desk-based assessment: existing archaeological and historic information about the site, including
    previous land uses, summarised in a report'
  level: must
- item: An assessment of the impact of the development on heritage assets, with an assessment of their
    significance
  level: must
- item: Field evaluation (e.g. geophysical survey, test pits or trenches), discussed in advance with the
    County Council's Historic Environment team and carried out to its brief and an approved written scheme
    of investigation
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2024), page 9-10. Called an Archaeological Desk-based Assessment/Field
  Evaluations. Sites with the potential to have heritage assets with archaeological interest are shown
  as discretionary, as is a field evaluation. The list cites the NPPF only.
review-status: unverified
field-status: {}
