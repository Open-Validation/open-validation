reference: sustainable-drainage-strategy
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Major applications and all development likely to significantly increase or change patterns
  of surface water run-off.
must-include:
- item: Detailed calculations of the greenfield run-off rate and post-development run-off rate, discharge
    rate and attenuation volume, with consideration of climate change
  level: must
- item: Ground investigation proving the hydrological behaviour of the site (geological and ground surface
    characteristics)
  level: must
- item: Infiltration rates
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: Infiltration is proposed.
- item: The location and adequacy of the watercourse
  level: must
  required-if: discretionary
  source-text: if the site will drain to a water course, the location and adequacy of the watercourse
    is required
- item: Written agreement from the sewerage undertaker to connect to the sewer
  level: must
  required-if: discretionary
  source-text: if connecting the surface water system to a sewer is the only option, written agreement
    to connect to the sewer from the sewerage undertaker will be required.
- item: Rainfall modelling using the most up to date FEH22 data (FSR and FEH1999 data are not accepted)
  level: must
  source-text: Any new planning applications that have not already commissioned an FRA or drainage strategy
    to be completed, should use the most up to date FEH22 data.
- item: The LLFA Surface Water Drainage Statement pro-forma (Appendix 1), completed in full
  level: must
  required-if:
    ref: major-development
  source-text: this pro-forma must be completed in full and be submitted with any planning application
    which seeks permission for ‘major’ development.
confidence: medium
notes: From the council's list (published June 2024), page 22-31. Called a Surface Water Drainage Strategy
  (page 22); the footnote (pages 23-24) and the Appendix 1 pro-forma (pages 24-31) add to it. Other development
  likely to significantly increase or change surface water run-off is shown as discretionary. The retired
  MHCLG id sustainable-drainage-strategy is used.
review-status: unverified
field-status: {}
