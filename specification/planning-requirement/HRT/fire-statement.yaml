reference: fire-statement
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A new or existing building of 18 metres or more in height.
    - all:
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A building of seven or more storeys.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: It contains two or more dwellings.
        - condition:
            field: educational-accommodation
            value: true
            description: It contains educational accommodation.
