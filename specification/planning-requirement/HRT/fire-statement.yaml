reference: fire-statement
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: New or existing buildings of 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Buildings of seven or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: For new or existing buildings of 18m or more in height, or those of seven or more storeys
  that contain either two or more dwellings or educational accommodation.
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect), with
    the particulars it specifies
  level: must
- item: The principles, concepts and approach relating to fire safety applied to each building in the
    development
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting purposes
  level: must
- item: Any consultation undertaken on fire safety issues, and what account has been taken of it
  level: must
- item: How any fire safety policies in relevant local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 6-7. The county only decides minerals, waste
  and its own (Regulation 3) development, so the application types are the minerals, waste and Regulation
  3 types.
review-status: unverified
field-status: {}
