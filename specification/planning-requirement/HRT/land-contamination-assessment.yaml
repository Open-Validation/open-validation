reference: land-contamination-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - site:
      in:
      - contaminated-land
      description: Reason to suspect contamination of the site or neighbouring land from previous operations
        (former industrial uses, landfill sites or mineral tips).
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Land Contamination Assessment Why Required National/Local Policy Drivers/Relevant Guidance
  National Planning Policy Framework - GOV.UK ( Land affected by contamination - GOV.UK ( When Required
  Where there is reason to suspect contamination of the application site or neighbouring land due to previous
  operations e.g. the existence of former industrial uses, the presence of former landfill sites, and
  the presence of former mineral tips.
must-include:
- item: Landfill gas risk assessment
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: The site is on or within 250 metres of a former landfill site.
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt drops ''former mineral tips'' and the landfill gas risk assessment
  for sites on or within 250 m of a former landfill (audit''s summary).'
