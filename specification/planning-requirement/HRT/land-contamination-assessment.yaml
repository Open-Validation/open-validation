reference: land-contamination-assessment
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - contaminated-land
        description: The application site or neighbouring land is suspected to be contaminated by previous
          operations (e.g. former industrial uses, landfill sites or mineral tips).
    - discretionary
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
source-text: Where there is reason to suspect contamination of the application site or neighbouring land
  due to previous operations e.g. the existence of former industrial uses, the presence of former landfill
  sites, and the presence of former mineral tips.
must-include:
- item: Information to determine whether contamination exists, its nature, the risks it may pose and whether
    they can be reduced to an acceptable level
  level: must
- item: 'A preliminary risk assessment: a desk study, a walkover site reconnaissance and a conceptual
    model of pollution sources, pathways and receptors'
  level: must
  source-text: 'the applicant should provide a preliminary risk assessment, with the application to determine
    whether the proposed development can proceed. The preliminary risk assessment should comprise the
    following: A desk study; Walkover site reconnaissance and Conceptual model'
- item: A risk assessment of landfill gas migration
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: The site is on or within 250 metres of a former landfill site.
confidence: medium
notes: From the council's list (published June 2024), page 16. Other reasons to suspect contamination
  are shown as discretionary. Long-term monitoring may be needed, secured through a legal agreement. The
  list cites the NPPF and national guidance only.
review-status: unverified
field-status: {}
