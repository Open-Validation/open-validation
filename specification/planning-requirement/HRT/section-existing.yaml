reference: section-existing
local-authority: HRT
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - ref: major-development
source-url: https://www.hertfordshire.gov.uk/media-library/documents/environment-and-planning/planning/planning-applications-decisions/validation-checklist-june-24-pdf-550kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All major applications.
must-include:
- item: Drawings at a scale of 1:50, 1:100 or 1:200
  level: must
- item: Clearly labelled cross sections through the proposed buildings, with existing site levels and
    finished floor levels related to a fixed datum point off site
  level: must
- item: The proposals in relation to adjoining buildings
  level: must
- item: Spot levels and cross/long sections
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 8. The list calls them 'Existing and proposed
  sections and site levels'. The county only decides minerals, waste and its own (Regulation 3) development,
  so the application types are the minerals, waste and Regulation 3 types.
review-status: unverified
field-status: {}
