  issues-open: 0
  notes: 'Grokbot''s extraction for this county minerals and waste authority is poor. It missed 10 of
    the 34 local requirements, mostly the core minerals and waste items: Restoration Strategy and Aftercare,
    Phasing Plan, Noise/Vibration, Borehole/Trial Pit, Climate Change, Mineral Resources, Bio-aerosol,
    Soils Management, Rights of Way and Geo-diversity. It also missed the Green Belt Statement and the
    LLFA drainage pro-forma, and filed most of what it did capture under Full planning with preamble,
    cut-off or borrowed trigger text and wrong labels. It put the Sustainability Statement under the only
    two types that statement excludes (Householder and Lawful development certificates). Its list date,
    taken from PDF metadata (2025-02-01) instead of the document''s June 2024, hides that the list is
    now over two years old. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Hertfordshire paused 7 Sep 2026 and WITHDRAWN 29 Oct
  2026 for reconsideration (outcome due early 2027). Not in force: council remains the LPA; May 2027 elections
  on existing boundaries.'
