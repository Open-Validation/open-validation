  date-basis: 'Cover title: ''Hertfordshire County Council Local List for the Validation of Planning Applications
    (June 2024)'' (the Validation Requirements section still calls it the ''(January 2024)'' list; PDF
    created 19 Feb 2025, re-saved 29 May 2026 with the same June 2024 title). It is the only list linked
    from the council''s Validation Checklist page (https://www.hertfordshire.gov.uk/services/recycling-waste-and-environment/planning-in-hertfordshire/planning-applications-decisions/validation-checklist.aspx),
    checked 2026-11-06; the planning applications page also links only an older ''Proposed validation
    checklist'' (Feb 2019), no consultation on a newer list was found, and MHCLG''s register (planning.data.gov.uk,
    local-area-requirements) has no Hertfordshire County entry. The list says it ''needs to be reviewed
    at least every two years'', and June 2024 is more than two years ago. It covers minerals, waste and
    county (Regulation 3) development.'
  status: outdated
submission-standards:
- item: Applications submitted electronically via the Planning Portal where possible
  level: should
- item: Files submitted in PDF format and labelled appropriately
  level: should
- item: Documentation produced electronically supplied in electronic format, whether the application is
    made online or on paper
  level: should
- item: Where there are numerous large documents (such as minerals and waste applications), documents
    submitted in both digital and paper format; one paper copy of application documents
  level: should
- item: Scale of plans and paper size no larger than is required to illustrate the proposals
  level: should
