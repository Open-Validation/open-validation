reference: design-and-access-statement
local-authority: YDNPA
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or a world heritage site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Provision of building(s) where the floor space is over 100 square metres.
  - application-type:
      in:
      - lbc
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2026/05/Full-Outline-Variation-validation-questionnaire-December-2025.doc
source-text: Design and access statement – only required for some major applications; or applications
  in a conservation area or a world heritage site for provision of one or more dwellinghouses or provision
  of building(s) where the floor space >100m²
confidence: medium
notes: Built from the authority's questionnaires (Householder, Full/Outline/Variation and LBC, which lists
  a DAS) and PDF 3.8 (major applications, except a material change of use with no operational development).
  The Change of use row was filed there only for that exception.
review-status: unverified
field-status: {}
