reference: heritage-statement
local-authority: YDNPA
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - archaeological-priority-area
      - park-and-garden
      description: The proposal affects a heritage asset or its setting.
  - discretionary
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2025/12/Local-validation-requirements-December-2025.pdf
source-text: 4.11 Heritage Statement When required? Applications for proposals affecting heritage assets
  (listed buildings, scheduled monuments, non-designated archaeological sites and features and traditional
  buildings [any building pre1914]) and/or their setting must be supported by a Heritage Statement that
  describes the significance of the heritage asset affected.
must-include:
- item: A description of the significance of the heritage asset affected
  level: must
confidence: medium
notes: The questionnaire excerpts were run-on Yes/No cells. Traditional buildings (any building before
  1914) have no field, so they are shown as officer discretion.
review-status: unverified
field-status: {}
