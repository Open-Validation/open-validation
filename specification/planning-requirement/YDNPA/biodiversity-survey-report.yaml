reference: biodiversity-survey-report
local-authority: YDNPA
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The proposal is likely to affect protected species.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: The proposal is likely to affect a designated site or priority habitat.
  - condition:
      field: demolition
      value: true
      description: Demolition or removal of buildings (questionnaire).
  - condition:
      field: roof-alteration
      value: true
      description: Removal or disturbance to the roof or roof structure (questionnaire).
  - discretionary
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2025/12/Local-validation-requirements-December-2025.pdf
source-text: to affect protected species, a designated site, or priority habitat, the application must
  be accompanied by an ecology report and meet the BS latest biodiversity code of practice for planning
  and development.
must-include:
- item: Meets the latest British Standard biodiversity code of practice for planning and development
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the questionnaire excerpts were run-on Yes/No cells. The questionnaires
  also ask for a protected species survey for work to bridges, mines and tunnels, loft conversions, felling
  broadleaved trees over 10m, wind turbines and removal of barge or fascia boards (officer discretion
  here).'
review-status: unverified
field-status: {}
