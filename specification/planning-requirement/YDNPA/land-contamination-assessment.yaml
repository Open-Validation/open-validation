reference: land-contamination-assessment
local-authority: YDNPA
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be particularly vulnerable.
  - condition:
      field: previously-developed-land
      value: true
      description: Redevelopment of a former industrial or garage site.
  - site:
      in:
      - near-landfill-site
      description: The site is close to a former waste disposal site.
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2025/12/Local-validation-requirements-December-2025.pdf
source-text: 4.20 Contaminated Land Assessment When required? Where contamination is known, or suspected,
  or the proposed use would be particularly vulnerable.
confidence: medium
notes: The former industrial/garage site and waste disposal site cases are from the questionnaire (Q16).
review-status: unverified
field-status: {}
