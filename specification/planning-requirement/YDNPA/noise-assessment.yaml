reference: noise-assessment
local-authority: YDNPA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development is likely to give rise to noise that could disturb residents or the
        tranquillity of the area (including HGV manoeuvring or kennelling of dogs).
  - condition:
      field: plant-equipment
      value: true
      description: Plant such as air source heat pumps or ventilation and extraction units.
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2025/12/Local-validation-requirements-December-2025.pdf
source-text: 4.21 Noise Assessment When required? When the development is likely to give rise to noise
  that could disturb residents or the tranquillity of the area around the site.
must-include:
- item: Either a report from a qualified acoustician giving anticipated noise levels and noise mitigation
    measures, or a statement from the District Council Environmental Health Officer that the development
    would be compatible with the location relative to the nearest residential properties
  level: must
confidence: medium
notes: The questionnaire (Q17, Q18) adds plant (ASHP, ventilation and extraction units, power tools),
  HGV manoeuvring and dog kennelling; for plant a product specification sheet with dB levels may be given
  instead. The 'What is required?' text was in the workbook's ventilation row.
review-status: unverified
field-status: {}
