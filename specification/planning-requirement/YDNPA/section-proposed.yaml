reference: section-proposed
local-authority: YDNPA
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground level, or the site is sloping.
  - condition:
      field: new-build
      value: true
      description: A new building.
  - discretionary
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2026/05/Full-Outline-Variation-validation-questionnaire-December-2025.doc
source-text: 'Householder, Outline: Existing and proposed sections – required where a change in ground
  level is proposed or the site is sloping; when a new building is proposed; when a track is proposed;
  or creation of new floor level.


  Listed building consent: and Proposed Section Drawings When required? Drawings showing a cross section
  through the building or the site are needed if any of the following apply: • a change in ground level;
  • the site is sloping; • a new building; • a track; • new opening(s); • new staircase(s); • double glazing
  in a listed building (sections through the glazing unit).'
must-include:
- item: Sections through the glazing unit for double glazing in a listed building
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: The building is listed.
confidence: low
notes: The workbook's excerpt looks garbled; re-read the council's list. Also for a track, new openings
  or staircases, new floor levels and double glazing in a listed building (no fields, so officer discretion).
