reference: roof-plan-proposed
local-authority: YDNPA
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: Works to the roof are proposed.
  - condition:
      field: new-build
      value: true
      description: New roofs are proposed.
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2026/05/Full-Outline-Variation-validation-questionnaire-December-2025.doc
source-text: Roof plan - Required in all cases where works to the roof or new roofs are proposed.
must-include:
- item: Details of any proposed changes, e.g. roofing material, rooflights, solar panels
  level: must
confidence: medium
notes: 'Rows from Change of use - prior approval were dropped after the audit. Audit (wrong_trigger):
  the Change of use row quoted DAS text and is dropped.'
review-status: unverified
field-status: {}
