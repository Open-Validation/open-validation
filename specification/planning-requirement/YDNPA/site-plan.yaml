source-text: 'Householder, Outline, Listed building consent: Site plan – required in all cases where the
  site layout will change as a result of the proposal, at an appropriate metric scale of 1:200 or 1:500
  and should accurately show: the direction of north;


  Full planning: a proposed site plan at a scale where its distance from any development can be measured
  (such as 1:200 or in some cases 1:100 may also be necessary).'
must-include:
- item: An appropriate metric scale of 1:200 or 1:500
  level: must
- item: The direction of north
  level: must
- item: On the proposed plan, the development in relation to the site boundaries and other existing buildings
    on the site
  level: must
