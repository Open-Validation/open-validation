reference: flood-risk-assessment
local-authority: YDNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A Flood Zone 1 site of 1 hectare or greater.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A Flood Zone 1 site of 1 hectare or greater.
  - site:
      in:
      - critical-drainage-area
      description: Critical drainage problems as notified by the Environment Agency.
  - site:
      in:
      - surface-water-flood-risk
      description: A moderate or high risk of flooding from surface or ground water.
source-url: https://www.yorkshiredales.org.uk/wp-content/uploads/sites/13/2025/12/Local-validation-requirements-December-2025.pdf
source-text: '1990. 4.9 Flood Risk Assessment When required? A flood risk assessment is required for proposals
  where the site falls within: 20 • Flood Zone 1 (flooding from watercourses) and the development site
  has a site area of 1 hectare or greater OR has critical drainage problems as notified by the Environment
  Agency; or, • Flood Zones 2 and 3 (flooding from watercourses); or, • areas identified as having a moderate
  or high risk of flooding from surface or ground water.'
