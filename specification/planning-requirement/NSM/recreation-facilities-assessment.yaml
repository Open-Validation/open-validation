reference: recreation-facilities-assessment
local-authority: NSM
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: loss-of-open-space
        value: true
        description: Major development (10+ dwellings or 1,000m2) causing loss of open space.
  - all:
    - site:
        in:
        - open-space
        description: The site is a playing field.
    - condition:
        field: loss-of-open-space
        value: true
        description: Any loss of a playing field.
source-url: https://n-somerset.gov.uk/sites/default/files/2025-12/local%20list%20of%20planning%20application%20requirements%20-%20parts%201%20and%202.pdf
