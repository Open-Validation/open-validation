reference: flood-risk-assessment
local-authority: NSM
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 1ha or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 1ha or more in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: Flood Zone 2 or 3.
  - site:
      in:
      - surface-water-flood-risk
      description: At risk from other sources of flooding.
  - discretionary
source-url: https://n-somerset.gov.uk/sites/default/files/2025-12/local%20list%20of%20planning%20application%20requirements%20-%20parts%201%20and%202.pdf
confidence: medium
notes: 'From the audit (wrong_trigger): 1ha+ in FZ1, FZ2/3, other flood sources, and future flood risk
  shown in the SFRA (officer discretion).'
review-status: unverified
field-status: {}
