reference: floor-plan-proposed
local-authority: NSM
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: New buildings and extensions to existing buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
source-url: https://n-somerset.gov.uk/sites/default/files/2025-12/local%20list%20of%20planning%20application%20requirements%20-%20parts%201%20and%202.pdf
source-text: Floor plans - proposed Required for all new buildings, extensions to existing buildings and
  proposals for a change of use.
must-include:
- item: Wheelchair turning areas
  level: must
  required-if:
    condition:
      field: housing-type
      value: older-people
      description: Retirement or supported independent living housing.
confidence: medium
notes: 'Audit (wrong_app_type): ''change of use'' means change-of-use planning applications, not prior
  approvals.'
review-status: unverified
field-status: {}
