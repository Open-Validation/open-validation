required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees (stem diameter over 75mm at 1.5m) within or adjacent to the site, including trees
      overhanging it or within 12 times their stem diameter of the boundary.
source-url: https://n-somerset.gov.uk/sites/default/files/2025-12/local%20list%20of%20planning%20application%20requirements%20-%20parts%201%20and%202.pdf
source-text: Tree Survey and Tree Protection Plan A Tree Survey and Tree Protection Plan is required where
  there are trees* within or adjacent** to the application site. * A tree should be considered where it
  has a stem diameter greater than 75mm when measured at 1.5m above ground level (not including hedgerows
  – which must be considered separately) ** Trees that overhang the site or are located beyond the site
  boundaries within a distance of up to 12 times their estimated stem diameter; o NPPF – Paragraph 4
must-include:
- item: A Tree Protection Plan
  level: must
- item: An Arboricultural Method Statement, where working is required for any reason within the trees'
