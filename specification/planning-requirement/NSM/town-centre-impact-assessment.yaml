reference: town-centre-impact-assessment
local-authority: NSM
required-if:
  any:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 2500
      description: Retail development over 2,500sqm (gross).
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail outside a defined centre.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 200
        description: 200m2 or more of retail floorspace.
  - discretionary
source-url: https://n-somerset.gov.uk/sites/default/files/2025-12/local%20list%20of%20planning%20application%20requirements%20-%20parts%201%20and%202.pdf
source-text: Retail Impact Assessment Required for all retail development over 2,500sqm (gross).
confidence: low
notes: 'Retail Impact Assessment over 2,500sqm. From the audit (missing_requirement): a Retail Sequential
  Test for retail of 200m2+ outside a defined centre, over 500m2 in a district centre, over 300m2 in a
  local centre, or additions in a retail park; the centre thresholds can''t be expressed, so they are
  shown as officer discretion. The Retail Park Justification is a separate item (unmapped).'
review-status: unverified
field-status: {}
