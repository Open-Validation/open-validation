  - discretionary
source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
policy: National Planning Policy Framework (paragraph 189 as cited)
source-text: 'You may need to produce a Statement of Significance/Heritage Statement to accompany a planning
  application or a listed building consent application. The level of detail should be proportionate to
  the importance of the assets and no more than is sufficient to understand the potential impact of the
  proposal on their significance. ... In practice, the compilation of a Statement of Significance/Heritage
  Statement will be applicable to the following types of proposal: Development requiring listed building
  consent Development within the curtilage of a listed building Development within or adjoining a Conservation
  Area Development affecting a Registered Park or Garden of Special Historic Interest Applications affecting
  an unlisted building on the Historic Environment Record (HER). Applications affecting non-designated
  heritage assets identified by the Borough Council during the consideration of an application.'
must-include:
- item: Detail proportionate to the importance of the assets, enough to understand the potential impact
    of the proposal on their significance
  level: should
- item: All affected heritage assets, where the proposal affects more than one
  level: should
  source-text: Some proposals will affect more than one asset, so the statement should address them all.
- item: As a minimum, evidence that the relevant historic environment record has been consulted and the
    heritage assets assessed using appropriate expertise where necessary
  level: should
  source-text: as a minimum the relevant historic environment record should have been consulted and the
    heritage assets assessed using appropriate expertise where necessary.
confidence: medium
notes: 'Redditch publishes no local validation list (checked 2026-11-06): its ''Submit a planning application''
  page says the Borough Council uses the national validation criteria. From the council''s ''Submit a
  planning application'' page (undated, read 2026-11-06). The discretionary part: applications affecting
  non-designated heritage assets identified by the council while it considers the application (the statement
  may then follow the rest of the application). The guidance note ''Plans and Drawings to be submitted
  with a Planning Application'' also says a Heritage Statement may be necessary ''if the building is of
  historic significance''.'
