reference: fire-statement
local-authority: RED
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
policy: Article 7(1)(d), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: Fire Statement (for some planning applications made on or after 1 August 2021)
confidence: medium
notes: 'Redditch publishes no local validation list (checked 2026-11-06): its ''Submit a planning application''
  page says the Borough Council uses the national validation criteria. From the council''s ''Submit a
  planning application'' page (undated, read 2026-11-06). The page says ''for some planning applications'',
  so the national rule is shown: two or more dwellings or educational accommodation, in a building 18
  metres or more high or with 7 or more storeys.'
