validation-list:
  url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
  date: ''
  date-basis: 'Redditch has no local validation list, so there is no list date. Checked 2026-11-06: the
    ''Submit a planning application'' page (undated; it refers to fee and external-advice changes from
    1 April 2026) says the Borough Council uses the national validation criteria and lists what a standard
    planning application needs; it links a guidance note on plans and drawings (file name dated 04-10-17).
    A site search for ''validation'' and ''checklist'' found no local list, and the last formal local
    list (Revised and Adopted 1 September 2009; planning.data.gov.uk entity 20299) has lapsed and is not
    linked. Bromsgrove and Redditch share one planning service and publish matching pages'
  status: national-only
submission-standards:
- item: Plans and drawings of a professional standard, accurate and to scale, with all the information
    needed to describe the proposal in detail
  level: must
- item: 'Online submissions: plans clearly and correctly labelled, preferably as Plan Title followed by
    the Plan Reference Number (e.g. ''Front Elevation P-001'')'
  level: should
- item: 'Paper or emailed applications: two versions of the application form, one with the applicant''s
    personal information and contact details (internal use only) and one without them (published)'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the council''s live planning submission page, which is the right current
    source: it states that Redditch uses national validation criteria and no current local list exists.
    Grokbot did not record that fact, captured only process text, missed the linked drawings guidance
    note, and did not flag the lapsed 2009 Local Validation Checklist that is still online and listed
    in the government dataset. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: government "minded to" implement the Worcestershire proposal (announced 29
