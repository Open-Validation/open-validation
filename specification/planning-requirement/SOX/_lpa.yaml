validation-list:
  url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
  date: 2024-06-04
  date-basis: 'cover: ''June 2024''; file name and PDF creation date 4 June 2024. The council''s Validation
    Checklists page (checked 2026-11-06) links this guide and the June 2024 full/outline checklists and
    says the requirements were ''adopted ... on 21 December 2022''. The councils'' media libraries hold
    no later validation guide or checklists.'
  status: outdated
submission-standards:
- item: Plans in PDF format, each submitted as a separate single-page PDF file; multi-page combined PDF
    files are not accepted
  level: must
- item: No individual file larger than 10 MB
  level: must
- item: No .zip or .exe files
  level: must
- item: Plans drawn to a metric scale, with a scale bar, the scale stated and the paper size
  level: must
- item: Each plan or drawing has a descriptive title (for example existing rear (south) elevation)
  level: must
- item: No disclaimers such as 'Do not scale', 'Not to scale' or 'Draft' on plans or drawings
  level: must
- item: Documents and drawings accurately described when uploaded; incorrectly labelled or formatted plans
    or documents make the application invalid
  level: must
- item: All documents correctly orientated
  level: should
- item: Personal or sensitive personal data in a separate document clearly marked confidential; no signatures
    or personal information in documents or plans, and personal details removed from photographs
  level: should
- item: A completed copy of the validation checklist for the application type submitted with the application
  level: must
joint-list:
  partners:
  - VAL
