  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current joint South & Vale Validation Guide (June 2024), still linked
    by the council. The extraction mixes in the superseded 2023 guide, wrongly applies the Vale-only nutrient
    neutrality requirement to South Oxfordshire, misses four local items (rural worker dwellings, economic
    report, drainage and water report, sustainable design statement), and has many definition-only or
    misattributed triggers. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
