reference: cil-form
local-authority: SOX
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: The proposal (including outbuildings) exceeds 100 square metres (GIA).
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2023/03/FINAL-Non-Material-Amendment-Validation-Checklist.docx
source-text: … to complete a CIL Form 1 for all residential development applications and all householder
  applications, including provision of outbuildings where the proposal exceeds 100 square metres (GIA).
  … Revised CIL Form 1 and measurements plan
must-include:
- item: A revised CIL Form 1 and measurements plan
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
review-status: unverified
field-status: {}
