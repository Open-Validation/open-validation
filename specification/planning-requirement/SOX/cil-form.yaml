reference: cil-form
local-authority: SOX
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings are created.
  - application-type:
      in:
      - reserved-matters
      - s73
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - non-material-amendment
    - condition:
        field: floorspace-change
        value: true
        description: The amendment would change the floor space being created.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: A householder extension or outbuilding over 100 sq m (gross internal area).
  - condition:
      field: residential-annexe
      value: true
      description: An annexe of any size.
  - condition:
      field: use-class
      value: supermarket
      description: A supermarket.
  - condition:
      field: use-class
      value: retail-warehouse
      description: Retail warehousing.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy INF1
source-text: 'CIL Form 1 and associated measurement plan are required for: ... all applications where
  one or more new dwellings are created ... Reserved Matters applications following outline planning permission
  ... Section 73 applications for removal/variation of condition ... Lawful Development Certificates (proposed
  only) ... Non-Material Amendments where the proposed changes would result in any changes to the floor
  space being created ... all householder extension proposals, including provision of outbuildings, over
  100sqm (Gross Internal Area) ... applications for annexes of any size ... supermarkets and retail warehousing'
must-include:
- item: CIL Form 1 (Additional Information) completed accurately
  level: must
- item: Annotated measurement plan showing how the gross internal area has been calculated
  level: should
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.21, 'Community Infrastructure Levy (CIL)
  Form 1 and Measurement Plan', page 19-20. The joint South Oxfordshire and Vale of White Horse Validation
  Guide is published by both councils; the checklist for each application type says which items apply.
  The s73 and non-material amendment checklists ask for a 'Revised CIL Form 1 and measurements plan'.
  The guide calls the measurement plan 'beneficial and ... strongly recommended'. CIL took effect in April
  2016 (South Oxfordshire) and November 2017 (Vale of White Horse).
review-status: unverified
field-status: {}
