reference: affordable-housing-statement
local-authority: SOX
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Use Class C3 housing with a net gain of 10 units or more.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Use Class C3 housing on a site of 0.5 hectares or more.
  - all:
    - condition:
        field: use-class
        value: C2
        description: Use Class C2 (residential institution).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: A net gain of 10 self-contained units or more.
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: In an Area of Outstanding Natural Beauty (National Landscape).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: A net gain of 5 units or more.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: A site of 0.5 hectares or more.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy H9
source-text: for all Use Class C3 housing proposals delivering a net gain of 10 units or more, or where
  the site has an area of 0.5 hectares or more ... for Use Class C2 proposals delivering a net gain of
  10 self-contained units or more ... in Areas of Outstanding Natural Beauty (AONB) where proposals deliver
  a net gain of 5 units or more, or where the site has an area of 0.5 hectares or more
must-include:
- item: Number, mix and tenure of both affordable and open market units
  level: must
- item: Gross internal floor area per unit in square metres
  level: must
- item: How the proposal complies with relevant development plan policy
  level: must
- item: Where a financial contribution is proposed instead of on-site provision, a clear statement of
    this and why it is acceptable
  level: must
  required-if: discretionary
- item: A viability assessment if fewer affordable units are proposed or the proposal does not meet policy
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less affordable housing than policy requires.
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.15, 'Affordable Housing Statement/Plan',
  page 15. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils;
  the checklist for each application type says which items apply. It can be part of a Planning Statement
  if the title says so (for example 'Planning and Affordable Housing Statement'). Where the proposal meets
  the Local Plan's contribution and tenure requirements, a Housing Tenure Plan is enough. The financial
  contribution item applies only where one is proposed.
review-status: unverified
field-status: {}
