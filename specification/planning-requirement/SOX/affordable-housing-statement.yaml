reference: affordable-housing-statement
local-authority: SOX
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Housing proposals delivering a net gain of 10 units or more.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: The site has an area of 0.5 hectares or more.
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: The site is in an Area of Outstanding Natural Beauty.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: A net gain of 5 units or more.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
source-text: 7.15.2 When is an affordable housing statement or plan required? - for all Use Class C3 housing
  proposals delivering a net gain of 10 units or more, or where the site has an area of 0.5 hectares or
  more for Use Class C2 proposals delivering a net gain of 10 self-contained units or more in Areas of
  Outstanding Natural Beauty (AONB) w…
must-include:
- item: A viability assessment, if fewer affordable units are proposed or the proposal does not meet development
    plan policy
  level: must
  source-text: a viability assessment must be provided if less affordable units are proposed, and/or the
    proposals do not meet the requirements of the development plan policy.
