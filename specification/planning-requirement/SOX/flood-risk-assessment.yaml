reference: flood-risk-assessment
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more.
    - site:
        in:
        - critical-drainage-area
        description: Land identified by the Environment Agency as having critical drainage problems.
    - site:
        in:
        - future-flood-risk
        description: Land identified in the Strategic Flood Risk Assessment as at increased flood risk
          in future.
    - all:
      - site:
          in:
          - surface-water-flood-risk
          - groundwater-flood-risk
          description: Land that may be subject to other sources of flooding.
      - discretionary
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy EP4
source-text: all development within Flood Zones 2 and 3 ... for all sites in Flood Zone 1 ... Of 1 hectare
  or more ... With land which has been identified by the Environment Agency as having critical drainage
  problems ... With land identified in the Strategic Flood Risk Assessment as being at increased flood
  risk in the future ... With land that may be subject to other sources of flooding, where the development
  would introduce a more vulnerable use
must-include:
- item: The risks of all forms of flooding to and from the development, including surface water drainage
  level: must
- item: How the flood risks will be managed, taking climate change into account
  level: must
- item: Any flood incidents in the vicinity
  level: must
- item: That the development will be safe for its lifetime and will not increase flood risk elsewhere,
    from all sources
  level: must
- item: 'For sites of strategic scale: the cumulative impact on flood risk to existing settlements, communities
    or allocated sites, with mitigation'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.26, 'Flood Risk Assessment (Site-Specific)',
  page 22-23. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both
  councils; the checklist for each application type says which items apply. On the householder, full,
  outline and reserved matters checklists. The 'other sources of flooding' case applies only where the
  development would introduce a more vulnerable use, which needs a judgement, so it is shown as discretionary.
  The strategic-scale item has no threshold.
review-status: unverified
field-status: {}
