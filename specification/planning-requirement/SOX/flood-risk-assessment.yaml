reference: flood-risk-assessment
local-authority: SOX
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt was only the definition. From the audit: 7.26 triggers are
  Flood Zones 2/3, Flood Zone 1 sites of 1ha+, and critical drainage areas; it applies to householder
  work too.'
review-status: unverified
field-status: {}
