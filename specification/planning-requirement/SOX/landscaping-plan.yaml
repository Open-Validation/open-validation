reference: landscaping-plan
local-authority: SOX
required-if:
  ref: major-development
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy STRAT4
source-text: 'Hard and soft landscape plans are required for: ... All major planning application proposals'
must-include:
- item: Planting of trees and/or shrubs, surface materials, boundary screen walls and fences
  level: must
- item: Materials; species; tree and plant sizes, numbers and planting densities
  level: must
- item: Levels, gradients and any earthworks required
  level: must
- item: Timing of implementation
  level: must
- item: Long-term maintenance and landscape management proposals
  level: must
- item: Details of drainage and utility runs
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.27, 'Hard and Soft Landscape Plan',
  page 23-24. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both
  councils; the checklist for each application type says which items apply.
