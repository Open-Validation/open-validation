reference: town-centre-impact-assessment
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 1
          description: Retail development.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside the town centres and local centres defined in South Oxfordshire Local Plan
            policy TC2.
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policies TC2 and TC3; NPPF
source-text: 'all major planning application proposals for retail development ... in South Oxfordshire:
  ... Outside of town centres and local centres (as defined in policy TC2 of SOLP 2035), proposals for
  500sqm or more'
must-include:
- item: 'For major retail proposals: evidence of compliance with the sequential test (NPPF)'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1
        description: Retail development.
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment area
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.34, 'Retail Impact Assessment', page
  28-29. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils;
  the checklist for each application type says which items apply. The guide gives different thresholds
  for each council; these are the South Oxfordshire ones.
review-status: unverified
field-status: {}
