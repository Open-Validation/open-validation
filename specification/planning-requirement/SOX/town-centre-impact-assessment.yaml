reference: town-centre-impact-assessment
local-authority: SOX
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail outside town centres and local centres (as defined in SOLP 2035 policy TC2).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: Proposals for 500sqm or more.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: SOLP 2035 TC2, TC3
source-text: '7.34.2 A retail impact assessment is required for: - - all major planning application proposals
  for retail development in South Oxfordshire: - Outside of town centres and local centres (as defined
  in policy TC2 of SOLP 2035), proposals for 500sqm or more'
confidence: medium
notes: Major retail development has no field of its own, so the major branch is shown as officer discretion
  within major development.
review-status: unverified
field-status: {}
