reference: site-plan
local-authority: SOX
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc-prospective-use
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
source-text: We require this plan to identify the site and the proposed development in relation to its
  surroundings.
must-include:
- item: Up-to-date Ordnance Survey based map
  level: must
- item: At an identified scale of 1:500 or 1:200, with a scale bar
  level: must
- item: Direction of North
  level: must
- item: Red edge matching the location plan
  level: must
- item: The full site, all site boundaries, existing buildings, roads, tracks, historic features, ponds,
    watercourses and proposed boundary treatments
  level: must
- item: Any buildings to be removed
  level: must
- item: 'Access arrangements where relevant: access width, vision splays, existing and proposed vehicle
    parking and cycle parking'
  level: must
  required-if: discretionary
- item: Position of existing trees and hedges, including those that could be affected (such as near the
    site boundaries), and those to be removed
  level: must
- item: Original paper size (A4, A3 etc); uploaded and printable in colour
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.7 (national list), page 9-10. The joint
  South Oxfordshire and Vale of White Horse Validation Guide is published by both councils; the checklist
  for each application type says which items apply. The minor full planning and lawful development (proposed)
  checklists also ask for an existing site/block plan. The access item applies 'where relevant to the
  proposal', so it is shown as discretionary.
review-status: unverified
field-status: {}
