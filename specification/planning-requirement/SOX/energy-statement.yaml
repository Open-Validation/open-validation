reference: energy-statement
local-authority: SOX
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New-build residential development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings.
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 1000
      description: C2 or HMO development of 1,000 sq m or more.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Non-residential development over 1,000 sq m.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: SOLP 2035 DES10
source-text: The policy requirement for this is set out in SOLP 2035 policy DES10.
confidence: medium
notes: 'From the audit (wrong_trigger): 7.25 Energy Statement (SOUTH REQUIREMENT ONLY) for new-build residential,
  C2/HMO 1,000 sq m+ and non-residential over 1,000 sq m.'
review-status: unverified
field-status: {}
