reference: energy-statement
local-authority: SOX
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New build.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential dwellinghouses.
  - all:
    - any:
      - condition:
          field: use-class
          value: C2
          description: Use Class C2.
      - condition:
          field: use-class
          value: hmo
          description: Houses in Multiple Occupation (HMOs).
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m or more of C2 use and HMOs.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential development of 1,000 sq m or more.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy DES10
source-text: 'An energy statement is required for: ... all new build residential dwellinghouses ... all
  developments that include 1,000 sqm or more of C2 use and Houses in Multiple Occupation (HMOs) ... all
  non-residential development over 1,000 sqm or more.'
must-include:
- item: The percentage reduction in carbon emissions against the 2013 Building Regulations (starting at
    40%), for each dwelling and/or building, not just the site as a whole
  level: must
- item: SAP/SBEM calculations demonstrating compliance
  level: must
- item: A short statement on the Target Emission Rate (TER) and Design Emission Rate (DER)
  level: must
- item: The percentage carbon emission reduction achieved
  level: must
- item: 'For non-residential development: built to BREEAM Excellent'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential development of 1,000 sq m or more.
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.25, 'Energy Statement – SOUTH REQUIREMENT
  ONLY', page 22. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by
  both councils; the checklist for each application type says which items apply. South Oxfordshire only
  (the checklists say 'Energy Statement (SOUTH ONLY)').
review-status: unverified
field-status: {}
