reference: roof-plan-existing
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - ldc-prospective-use
      - ldc-existing-use
  - condition:
      field: roof-alteration
      value: true
      description: Alterations are proposed to the roof form.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
source-text: These plans are required where alterations are proposed to the roof form.
must-include:
- item: At an identified scale of 1:100 or 1:50, with a scale bar
  level: must
- item: Position of all ridges, valleys, dormer openings, rooflights and other features
  level: must
- item: A unique drawing reference
  level: must
- item: Original paper size (A4, A3 etc); uploaded and printable in colour
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.9 (national list), page 10-11. The joint
  South Oxfordshire and Vale of White Horse Validation Guide is published by both councils; the checklist
  for each application type says which items apply.
review-status: unverified
field-status: {}
