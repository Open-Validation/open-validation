reference: air-quality-assessment
local-authority: SOX
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
source-text: '7.17.2 An air quality assessment is required: - For all major planning application proposals
  where the development could result in significant vehicle movements through an Air Quality Management
  Area (AQMA)'
must-include:
- item: The existing air quality (baseline)
  level: must
- item: A prediction of future air quality without the proposed development
  level: must
confidence: medium
notes: Applies to major outline as well as full applications. Whether vehicle movements through an AQMA
  are significant is a judgement, so it is shown as officer discretion.
review-status: unverified
field-status: {}
