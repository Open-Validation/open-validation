reference: sustainable-drainage-strategy
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - condition:
        field: residential-annexe
        value: true
        description: Annexes.
    - condition:
        field: drainage-alterations
        value: true
        description: Extensions or other works that need new drainage.
    - discretionary
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy EP4
source-text: any application that has surface water implications e.g. applications for new dwellings,
  annexes, extensions that necessitate new drainage ... all major planning application proposals
must-include:
- item: Adequate water and wastewater infrastructure to serve the development
  level: must
- item: Drawings showing where surface and foul drainage will discharge
  level: must
- item: All potential flood risks, with existing and proposed run-off rates calculated
  level: must
- item: A sustainable drainage system (SuDS) for surface water, with a detailed design including materials
  level: must
- item: How infiltration of surface and ground water into the foul network will be prevented
  level: must
- item: 'For major development: the existing foul drainage infrastructure and the additional sewage volume
    (average peak and daily discharges, with workings), plus permitted dry weather flow, flow to full
    treatment and storm tank capacity'
  level: must
  required-if:
    ref: major-development
- item: Confirmation from the provider that the sewer network and pumping stations have capacity, or how
    and with whose agreement capacity will be increased
  level: must
- item: Prepared by a qualified engineer
  level: should
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.23, 'Drainage and Water Report – Foul
  and/or Surface Water and Water Supply/Efficiency', page 20-21. The joint South Oxfordshire and Vale
  of White Horse Validation Guide is published by both councils; the checklist for each application type
  says which items apply. Filed under MHCLG's (retired) sustainable drainage strategy id; the report also
  covers foul drainage and water supply. On the full, outline and reserved matters checklists (not the
  householder one). 'Surface water implications' has no fixed test, so it is also shown as discretionary.
review-status: unverified
field-status: {}
