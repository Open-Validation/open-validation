reference: section-existing
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - ldc-prospective-use
  - condition:
      field: change-in-ground-levels
      value: true
      description: Alterations are made to existing ground levels, for example a sloping site or clear
        level differences across the site or with neighbouring properties.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
source-text: These plans are required where alterations are being made to the existing ground levels,
  for example a sloping site or where there are clear ground level differences across the site and/or
  between neighbouring properties.
must-include:
- item: At an identifiable scale of 1:200, 1:100 or 1:50, with a scale bar
  level: must
- item: A cross section through the building(s) or structure as existing and proposed
  level: must
- item: Existing and proposed levels related to an off-site fixed datum point, including any existing
    or proposed retaining walls where levels change across the site or with neighbouring land
  level: must
- item: The proposal in relation to adjoining or neighbouring buildings
  level: must
- item: Original paper size (A4, A3 etc)
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.10 (national list), 'Site sections and
  finished floor and site levels', page 11. The joint South Oxfordshire and Vale of White Horse Validation
  Guide is published by both councils; the checklist for each application type says which items apply.
review-status: unverified
field-status: {}
