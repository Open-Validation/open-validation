reference: elevation-proposed
local-authority: SOX
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc-prospective-use
    - ldc-existing-use
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
source-text: We require these plans to clearly show the proposed works in relation to what currently exists
  on the site.
must-include:
- item: At an identified scale of 1:100 or 1:50, with a scale bar
  level: must
- item: Each elevation labelled with its direction (for example north elevation)
  level: must
- item: All elevations shown in full unless otherwise agreed
  level: must
- item: Proposed building materials, style and finish, with window, door and rainwater goods details
  level: must
- item: A unique drawing reference
  level: must
- item: Original paper size (A4, A3 etc); uploaded and printable in colour
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.8 (national list), page 10. The joint
  South Oxfordshire and Vale of White Horse Validation Guide is published by both councils; the checklist
  for each application type says which items apply. 'Existing and Proposed Elevations' is a national requirement
  on the householder, full, outline, reserved matters, listed building, advertisement and lawful development
  (proposed and existing) checklists.
review-status: unverified
field-status: {}
