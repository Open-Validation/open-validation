reference: land-contamination-assessment
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected (including a known past potentially contaminative
          land use), or the site is near such land and ground works are proposed.
    - condition:
        field: industrial-site
        value: true
        description: Petrol filling station sites, or industrial and manufacturing sites.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Rural building conversions to other uses.
    - condition:
        field: change-in-ground-levels
        value: true
        description: Previous or proposed alterations to the topography of the land, or land nearby, may
          have caused or may cause contamination.
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: 'A sensitive end-user: residential, allotments, schools, nurseries and creches,
            children''s play areas and playing fields.'
      - discretionary
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policies ENV11 and ENV12
source-text: 'A contaminated land survey and report is needed where contamination is known or suspected
  or the development site is in the vicinity of such land and ground works are proposed, or where there
  is a sensitive end-user. Sensitive end-users include residential, allotments, schools, nurseries and
  creches, children’s playing areas and playing fields. ... Sites that would require a contaminated land
  survey are: ... sites with a known past potentially contaminative historical land use ... petrol filling
  station sites ... industrial and manufacturing sites ... rural building conversions to other uses ...
  sites where previous or proposed alterations to the topography of the land, or land nearby, may have,
  or may result in the land being contaminated'
must-include:
- item: Risks from contamination to human health; property (buildings, crops, livestock, woodland, service
    lines); adjoining land; ground and surface waters; ecological systems; and archaeological sites
  level: must
- item: A preliminary risk assessment in line with national guidance
  level: must
- item: Where the site is affected by contamination, measures for remediation
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: The site is affected by contamination.
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.22, 'Contaminated Land Survey and Report',
  page 20. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils;
  the checklist for each application type says which items apply. On the full, outline and reserved matters
  checklists. 'Or where there is a sensitive end-user' is read with the contamination context, so a sensitive
  end use on its own is shown as discretionary. A desk-based review may be enough; some sites need site
  investigation, soil sampling or ground gas monitoring.
review-status: unverified
field-status: {}
