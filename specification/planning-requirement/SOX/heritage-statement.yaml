reference: heritage-statement
local-authority: SOX
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - scheduled-monument
          - park-and-garden
          - world-heritage-site
          - battlefield
          description: Affects a listed building, conservation area, scheduled monument, registered park
            and garden, World Heritage Site or registered battlefield, or their setting.
      - site:
          in:
          - locally-listed-building
          description: Affects a non-designated heritage asset.
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policies ENV6, ENV7 and ENV8
source-text: 'all listed building consent applications ... planning applications affecting any of the
  following, or their setting: ... listed buildings ... conservation areas ... scheduled ancient monuments
  ... registered parks and gardens ... world heritage sites ... registered battlefields ... proposals
  affecting non-designated heritage assets'
must-include:
- item: Enough detail to understand and assess the impact of the work on the significance of the heritage
    asset
  level: must
- item: 'For historic buildings: documented research of the building''s history and analysis of surviving
    historic fabric'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: The proposal affects a historic building.
- item: 'For setting assessments: the surroundings in which the asset is experienced, the area''s character
    and evolution, and important views'
  level: must
  required-if:
    site:
      in:
      - listed-building-setting
      - park-and-garden
      - world-heritage-site
      - battlefield
      - scheduled-monument
      description: The proposal affects the setting of a heritage asset.
- item: 'For conservation areas: the contribution the building or site makes to the character and appearance
    of the area'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: The proposal affects a conservation area.
- item: 'Where there are structural changes to a listed building: a structural impact assessment'
  level: must
  required-if:
    condition:
      field: structural-alteration
      value: true
      description: Structural changes to a listed building.
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.29, page 25. The joint South Oxfordshire
  and Vale of White Horse Validation Guide is published by both councils; the checklist for each application
  type says which items apply. A template for straightforward heritage proposals is linked from the guide
  and the checklist page.
review-status: unverified
field-status: {}
