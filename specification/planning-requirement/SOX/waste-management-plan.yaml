reference: waste-management-plan
local-authority: SOX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.southoxon.gov.uk/wp-content/uploads/sites/2/2024/06/2024-06-04-Final-Validation-Guide.pdf
policy: South Oxfordshire Local Plan 2035 policy EP3
source-text: 'A waste management plan is required for: ... All proposals and changes of use that are likely
  to generate waste'
must-include:
- item: Enclosed, adequately sized refuse and recycling bin storage
  level: must
- item: A suitably sized area for convenient refuse collection
  level: must
- item: Safe access for users or residents and for refuse and recycling collection vehicles
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.41, page 33. The joint South Oxfordshire
  and Vale of White Horse Validation Guide is published by both councils; the checklist for each application
  type says which items apply. On the full, outline and reserved matters checklists ('Recycling and Waste
  Management Plan'). 'Likely to generate waste' has no fixed test, so it is shown as discretionary.
review-status: unverified
field-status: {}
