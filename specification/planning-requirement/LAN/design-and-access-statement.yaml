reference: design-and-access-statement
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area (conservation area or World Heritage Site).
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with a floorspace of 100 square metres or more.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015 (the
  guide cites Article 8 of the 2010 Order)
source-text: A Design and Access Statement must accompany applications for both outline and full planning
  permission other than in the circumstances set out in Article 8 Part 2 of the Town and Country Planning
  ( Development Management Procedure) (England) Order 2010.
confidence: medium
notes: 'From the council''s list (updated December 2012), page 4. Listed on the full and section 73 checklists.
  The guide defers to the national exemptions in the Development Management Procedure Order (it cites
  the 2010 Order, now replaced by Article 9 of the 2015 Order). The rule follows the current law: a statement
  is needed for major development, or for one or more dwellings or 100 sq m or more in a designated area,
  and not for waste development, engineering or mining operations, a material change of use or section
  73 applications, so it applies to the council''s own (Regulation 3) development only.'
review-status: unverified
field-status: {}
