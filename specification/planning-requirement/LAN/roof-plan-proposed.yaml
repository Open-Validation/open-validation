reference: roof-plan-proposed
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - approval-condition
      - pa-demo-building
  - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In addition other plans should be submitted (dependent on the type of application) as follows:
  ... Roof plans (e.g. at a scale of 1:50 or 1:100)'
must-include:
- item: The shape of the roof
  level: should
- item: Details of all plant and equipment to be located on the roof, including guardrails
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 3. Elevations, floor plans, sections and
  roof plans are 'other plans' needed 'dependent on the type of application', so they show as discretionary
  for the applications whose checklists list 'Site and other plans' (full, section 73, approval of details,
  prior notification of demolition). The guide asks for 'Roof plans' without separating existing and proposed,
  so only the proposed roof plan is shown.
review-status: unverified
field-status: {}
