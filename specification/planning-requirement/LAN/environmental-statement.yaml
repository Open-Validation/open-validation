reference: environmental-statement
local-authority: LAN
required-if:
  condition:
    field: eia-development
    value: true
    description: The proposal is EIA development (Schedule 1, or Schedule 2 screened as EIA).
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations (the guide cites the 2011
  Regulations)
source-text: The Town and Country Planning (Environmental Impact Assessment) Regulations 2011 (SI 2011/No.1824)
  as amended, set out the circumstances in which an Environmental Impact Assessment (EIA) is required.
  ... An EIA application should be submitted with a full Environmental Statement (ES) and a non-technical
  summary. Technical appendices should also be included where relevant.
must-include:
- item: A non-technical summary
  level: must
- item: Technical appendices, where relevant
  level: should
confidence: medium
notes: From the council's list (updated December 2012), pages 7, 8. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. The Part 3 guidance notes for minerals and waste (page 5) add that an Environmental
  Statement must accompany proposals for the incineration of waste, as set out in their appendices of
  EIA thresholds.
