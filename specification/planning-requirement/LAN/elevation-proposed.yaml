reference: elevation-proposed
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - approval-condition
      - pa-demo-building
  - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In addition other plans should be submitted (dependent on the type of application) as follows:
  ... Existing and proposed elevations (e.g. at a scale of 1:50 or 1:100)'
must-include:
- item: Drawn to a scale of 1:50 or 1:100, showing clearly the proposed works in relation to what is already
    there
  level: should
- item: All sides of the proposal shown, including blank elevations
  level: must
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 2. Elevations, floor plans, sections and
  roof plans are 'other plans' needed 'dependent on the type of application', so they show as discretionary
  for the applications whose checklists list 'Site and other plans' (full, section 73, approval of details,
  prior notification of demolition).
review-status: unverified
field-status: {}
