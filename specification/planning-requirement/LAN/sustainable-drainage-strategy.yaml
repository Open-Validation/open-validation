reference: sustainable-drainage-strategy
local-authority: LAN
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - critical-drainage-area
      description: In a Critical Drainage Area.
source-url: https://www.lancashire.gov.uk/media/xxtgwedr/guidance-notes-for-sustainable-drainage-systems-pro-forma.pdf
policy: National Planning Policy Framework; Lancashire SuDS Pro-forma guidance (version 8, January 2024)
source-text: 'If your development proposal is for major development1, or in a Critical Drainage Area,
  regardless of your type of planning application, you must submit the following with your application
  for planning permission: ... Sustainable Drainage Strategy – This will include your overall approach
  and is where you will evidence your approach to surface water management. E.g. plans, drawings, calculations
  etc. ... A Sustainable Urban Drainage System (SUDs) statement should be submitted for major applications
  where there is a potential for significant surface water run-off (e.g. development of Greenfield sites
  usually results in new large areas of impermeable surfaces such as roofs, roads and car parking).'
must-include:
- item: The overall approach to surface water management, evidenced with plans, drawings, calculations
    etc., taking into account any requirements identified in the flood risk assessment
  level: must
- item: How all sustainable drainage components will be managed and maintained over the lifetime of the
    development
  level: must
  source-text: The Sustainable Drainage Strategy must also set out how all sustainable drainage components
    are intended to be managed and maintained over the lifetime of the development
- item: The completed Lancashire SuDS pro-forma, with all white boxes filled in
  level: must
  source-text: You must fill in all white boxes in the pro-forma for the document to be accepted as complete.
confidence: medium
notes: From the Lancashire Sustainable Drainage Systems Pro-forma guidance (version 8, January 2024),
  pages 2-3, linked from the council's planning application page with the pro-forma itself; and the council's
  list (updated December 2012), page 8, which asks for a SuDS statement for major applications with potential
  for significant surface water run-off. The county council is also the lead local flood authority; its
  guidance says the strategy and pro-forma must be submitted for major development or development in a
  Critical Drainage Area, 'regardless of your type of planning application'.
review-status: unverified
field-status: {}
