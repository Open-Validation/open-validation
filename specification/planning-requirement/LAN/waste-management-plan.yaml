reference: waste-management-plan
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - condition:
      field: new-build
      value: true
      description: Proposed new development.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Supplementary planning document 'Minimizing and Managing Waste in New Developments'
source-text: Proposed new development should be supported by site waste management plans of the type now
  required by The Site Waste Management Plans Regulations 2008. These do not require formal approval by
  planning authorities, but are intended to encourage the identification of the volume and type of material
  to be demolished and/or excavated, opportunities for the reuse and recovery of materials and to demonstrate
  how off-site disposal of waste will be minimised and managed. Proposed new developments may need to
  be supported by a waste audit.
must-include:
- item: The volume and type of material to be demolished and/or excavated
  level: should
- item: Opportunities for the reuse and recovery of materials
  level: should
- item: How off-site disposal of waste will be minimised and managed
  level: should
- item: A waste audit
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2012), page 15. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. The Site Waste Management Plans Regulations 2008 the guide refers to were
  revoked in 2013; the requirement stays on the council's list. A waste audit 'may' be needed, so that
  item is discretionary.
review-status: unverified
field-status: {}
