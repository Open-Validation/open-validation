reference: archaeological-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: In an Area of Archaeological Potential defined in the development plan.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal disturbs the ground.
    - ref: major-development
  - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) section 12
source-text: For all applications involving the disturbance of ground within an Area of Archaeological
  Potential as defined in the development plan or in other areas in the case of a major development proposal
  or significant infrastructure works, an applicant may need to commission an assessment of existing archaeological
  information and submit the results as part of the Heritage Statement.
confidence: medium
notes: From the council's list (updated December 2012), page 10. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Part of the Heritage Statement section. The guide says an applicant 'may
  need to commission' an assessment (also for significant infrastructure works), so the rule keeps a discretionary
  part.
review-status: unverified
field-status: {}
