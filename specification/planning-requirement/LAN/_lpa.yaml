review-status: unverified
validation-list:
  url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
  date: 2012-12
  date-basis: 'Footer on every page: ''Updated December 2012'' (PDF created 8 January 2013). On 2026-11-06
    the council''s Planning application process page (https://www.lancashire.gov.uk/environment-and-planning/planning/planning-application-process/)
    still linked this Validation Information Guide as the ''validation checklist guide'', with one validation
    checklist per application type (full, section 73, approval of details, lawful development certificates,
    prior notification of demolition and of telecommunications development; all created November 2012),
    the Part 3 form and guidance notes for minerals and waste applications (dated 24/03/2014), and the
    Lancashire SuDS pro-forma and guidance (version 8, January 2024). The council''s BNG validation page
    links the same guide (identical file at /media/ldrjz2u1/). No newer list, consultation or adoption
    notice was found on the council''s site or in MHCLG''s register of local lists. More than two years
    old, so outdated, but still the list the council uses.'
  status: outdated
submission-standards:
- item: One copy of all supporting information (the council may ask for further copies at the outset,
    depending on the proposal)
  level: must
- item: When referring to a document (e.g. an Ofsted report), include a copy or a referenced extract with
    the relevant information highlighted
  level: must
- item: Where a checklist item is not submitted, explain on the checklist why the information is not included
  level: should
- item: 'Minerals and waste applications: plans and drawings at an appropriate scale, no less than 1:2500'
  level: should
- item: Ask the council about the number of copies and format (hard copy, disc, electronic) of an Environmental
    Statement
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is still the only local list Lancashire County Council publishes, and the December
    2012 date is correct, but the guide is 14 years old and cites revoked policy. The extraction misses
    about half of the local items, including all the minerals and waste requirements, wrongly shows Minerals
    & waste and County Reg 3 development as having no local requirements, and fills the tab with process
    text. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Lancashire, Blackburn with Darwen and Blackpool paused
  7 Sep 2026 and WITHDRAWN 29 Oct 2026 for reconsideration (outcome due early 2027). Not in force: council
  remains the LPA; May 2027 elections on existing boundaries.'
