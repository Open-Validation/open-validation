reference: land-contamination-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected on the site.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable to contamination.
