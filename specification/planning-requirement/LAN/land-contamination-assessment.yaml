reference: land-contamination-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known on the site.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable to contamination.
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) paragraph 120
source-text: Where contamination is known or suspected or the proposed use would be particularly vulnerable,
  the applicant should provide such information with the application as is necessary to determine whether
  the proposed development can proceed.
must-include:
- item: Enough information to determine whether contamination exists, its nature, the risks it may pose
    and whether these can be satisfactorily reduced to an acceptable level
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 11. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Suspected contamination is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
