reference: planning-statement
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - approval-condition
      - ldc-existing-use
      - ldc-prospective-use
      - pa-demo-building
      - pa-ecomms-network
  - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: A planning statement identifies the context and need for a proposed development and includes
  an assessment of how the proposed development accords with relevant national, regional and local planning
  policies. ... If the proposal is located within the Green Belt and it would involve inappropriate development,
  a planning policy statement must accompany the application. This would need to address and justify the
  very special circumstances that would exist to overcome presumption against development in the Green
  Belt.
must-include:
- item: The context and need for the proposed development
  level: must
- item: An assessment of how the proposal accords with relevant national, regional and local planning
    policies
  level: must
- item: 'Where the proposal is inappropriate development in the Green Belt: the very special circumstances
    that would overcome the presumption against it'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: In the Green Belt, where the proposal would be inappropriate development.
confidence: medium
notes: From the council's list (updated December 2012), pages 14, 15. Listed on every checklist. The guide
  gives no general trigger, so it shows as discretionary; inside the Green Belt a statement 'must accompany'
  inappropriate development, which is a planning judgement.
review-status: unverified
field-status: {}
