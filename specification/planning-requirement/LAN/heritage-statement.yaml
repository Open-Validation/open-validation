reference: heritage-statement
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - site:
      in:
      - listed-building
      - listed-building-setting
      - park-and-garden
      - battlefield
      - scheduled-monument
      - conservation-area
      description: Related to or affecting the setting of a heritage asset (listed building, registered
        park or garden, battlefield, scheduled monument), or within or adjacent to a conservation area.
  - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) section 12
source-text: The scope and degree of detail necessary in a Heritage Statement will vary according to the
  particular circumstances of each application. ... For applications either related to or impacting on
  the setting of heritage assets a written statement that includes plans showing historic features that
  may exist on or adjacent to the application site including listed buildings and structures, historic
  designated landscapes including listed parks and gardens, historic battlefields and scheduled ancient
  monuments and an analysis of the significance of archaeology, history and character of the building/structure,
  the principles of and justification for the proposed works and their impact on the special character
  of the listed building or structure, its setting and the setting of adjacent listed buildings may be
  required. ... For applications within or adjacent to a conservation area, an assessment of the impact
  of the development on the character, setting and appearance of the area may be required.
must-include:
- item: Plans showing historic features that may exist on or adjacent to the site, including listed buildings
    and structures, historic designated landscapes, historic battlefields and scheduled ancient monuments
  level: should
- item: An analysis of the significance of archaeology, history and character of the building or structure
  level: should
- item: The principles of and justification for the proposed works and their impact on the special character
    of the listed building or structure, its setting and the setting of adjacent listed buildings
  level: should
- item: 'Within or adjacent to a conservation area: an assessment of the impact on the character, setting
    and appearance of the area'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
confidence: medium
notes: From the council's list (updated December 2012), page 10. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. The guide says each statement 'may be required' and its scope varies with
  the case, so the rule keeps a discretionary part. Archaeology is in archaeological-assessment.
