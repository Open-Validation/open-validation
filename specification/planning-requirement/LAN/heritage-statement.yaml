reference: heritage-statement
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - scheduled-monument
        - conservation-area
        description: The development affects a heritage asset or its setting, or is in or adjacent to
          a conservation area.
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal disturbs the ground.
      - any:
        - site:
            in:
            - archaeological-priority-area
            description: The site is in an Area of Archaeological Potential.
        - ref: major-development
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Heritage Statement (including Historical, archaeological features and Scheduled Ancient Monuments)
  The scope and degree of detail necessary in a Heritage Statement will vary according to the particular
  circumstances of each application.
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_trigger):
  the excerpt only says the scope ''will vary''. From the audit, s16 applies to the setting of heritage
  assets, in or adjacent to a conservation area, ground disturbance in an Area of Archaeological Potential
  or major development, and removal of important hedgerows (no field, so officer discretion).'
review-status: unverified
field-status: {}
