reference: site-restoration
local-authority: LAN
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Lancashire Minerals and Waste Local Plan; National Planning Policy Framework (2012) section 13
source-text: In particular, sufficient information will be required to ensure that working will be carried
  out to modern working, restoration, aftercare and environmental standards.
must-include:
- item: Full details of the method of restoration and aftercare on the submitted plans, preferably also
    in a written supporting document
  level: should
  required-if:
    any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - condition:
        field: landfill-development
        value: true
        description: The proposal involves depositing waste materials.
  source-text: Full details of the method of restoration and aftercare should be included on the submitted
    plans and preferably in a written supporting document.
confidence: medium
notes: From the council's list (updated December 2012), pages 12, 18. Listed in the local list on the
  full planning permission and section 73 checklists, which cover the county council's minerals, waste
  and Regulation 3 applications. Sections 23 ('Mineral working and restoration including mineral type,
  likely usage of minerals') and 43 ('Waste Management applications', 'Waste Details' on the checklists)
  say 'generally comprehensive information will be required' to ensure working, restoration and aftercare
  meet modern standards, to be agreed at pre-application stage; restoration is the closest matching id.
  The aftercare item is from the Part 3 guidance notes (24/03/2014), page 4. Section 18 (Landfill statements)
  only refers to sections 31 and 43.
