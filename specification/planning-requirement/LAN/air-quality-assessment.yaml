reference: air-quality-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Inside, or adjacent to, an air quality management area (AQMA).
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) paragraphs 120-123
source-text: Where the development is proposed inside, or adjacent to an air quality management area (AQMA),
  or where the development could in itself result in the designation of an AQMA or where the grant of
  planning permission would conflict with, or render unworkable, elements of a local authority‟s air quality
  action plan, applications should be supported by such information as is necessary to allow a full consideration
  of the impact of the proposal on the air quality of the area. ... Where AQMAs cover regeneration areas,
  developers should provide an air quality assessment as part of their planning application.
confidence: medium
notes: From the council's list (updated December 2012), pages 4, 5. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Development that could itself lead to an AQMA being designated, or conflict
  with an air quality action plan, is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
