reference: air-quality-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - air-quality-management-area
        description: The development is inside or adjacent to an Air Quality Management Area.
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Air quality assessments Where the development is proposed inside, or adjacent to an air quality
  management area (AQMA), or where the development could in itself result in the designation of an AQMA
  or where the grant of planning permission would conflict with, or render unworkable, elements of a local
  authority‟s air quality action plan, applications should be supported by such information as is necessary
  to allow a full consideration of the impact of the proposal on the air quality of the area.
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type):
  moved from Full planning to the county''s application types. The other cases (could cause an AQMA to
  be designated, or conflict with an air quality action plan) are shown as officer discretion.'
