reference: transport-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 500
        description: 500 sq m gross floor area or more (simple Transport Assessment).
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) section 4; Joint Lancashire Structure Plan Parking Standards
  and SPG 'Access and Parking'
source-text: 'Section 4: ''Promoting sustainable transport'' of the National Planning Policy Framework
  advises that a Transport Assessment (TA) or Transport Statement (TS) should be submitted as part of
  any planning application where the proposed development has significant transport implications. ...
  For example simple Transport Assessments will be required for all developments of 500m2 gross floor
  area. This form can be found on page 30 of the Access and Parking document. Comprehensive Transport
  Assessments rather than simple forms should be provided where the proposal for cumulative floor space
  or change of use exceeds the thresholds in Table E p14 of the ''Parking Standards''.'
must-include:
- item: 'Major proposals: accessibility to the site by all modes of transport and the likely modal split
    of journeys'
  level: should
  required-if:
    ref: major-development
- item: 'Major proposals: measures to improve access by public transport, walking and cycling, to reduce
    the need for parking and to mitigate transport impacts'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (updated December 2012), page 17. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. 'Significant transport implications' and the Table E thresholds for a comprehensive
  assessment (in the Parking Standards, not the guide) are not stated, so those parts show as discretionary.
review-status: unverified
field-status: {}
