reference: location-plan
local-authority: LAN
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
    - s73
    - approval-condition
    - ldc-existing-use
    - ldc-prospective-use
    - pa-demo-building
    - pa-ecomms-network
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a location plan based on an up to date map.
must-include:
- item: At a scale of 1:1250 or 1:2500
  level: should
- item: At least two named roads and surrounding buildings, with properties numbered or named so the exact
    location of the site is clear
  level: should
- item: Application site edged clearly with a red line, including all land needed for the development
    (access from a public highway, visibility splays, landscaping, car parking and open areas around the
    site)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 1. On every checklist (in the local list
  part of the section 73, approval of details and prior notification of demolition checklists).
review-status: unverified
field-status: {}
