reference: photos
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - approval-condition
      - ldc-existing-use
      - pa-demo-building
  - any:
    - condition:
        field: demolition
        value: true
        description: The proposal involves the demolition of an existing building.
    - site:
        in:
        - conservation-area
        - listed-building
        description: Development affecting a conservation area or a listed building.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Photographs should be provided if the proposal involves the demolition of an existing building
  or development affecting a conservation area or a listed building.
confidence: medium
notes: From the council's list (updated December 2012), page 14. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Also in the local list of the approval of details, existing-use lawful development
  certificate and prior notification of demolition checklists.
