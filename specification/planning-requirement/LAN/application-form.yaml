reference: application-form
local-authority: LAN
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
    - s73
    - approval-condition
    - ldc-existing-use
    - ldc-prospective-use
    - pa-demo-building
    - pa-ecomms-network
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Section 65(5)
  of the Town and Country Planning Act 1990
source-text: All planning applications will need to be presented on a standard application form, which
  will be available electronically and as a paper copy. One copy of all supporting information is required.
must-include:
- item: Part 3 form (additional information in respect of minerals operations, waste disposal or associated
    treatment/transfer plants) completed as well as Part 1
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: Part 1 and Part 3 of the planning application forms must be completed for mineral and waste
    developments.
- item: The appropriate certificate of ownership (A, B, C or D)
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  source-text: All applications for planning permission must include the appropriate certificate of ownership.
- item: Notice to owners of the application site completed and served
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  source-text: A notice to owners of the application site must be completed and served
- item: Agricultural holdings certificate, whether or not the site includes an agricultural holding, with
    all agricultural tenants notified before submission
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  source-text: This certificate is required whether or not the site includes an agricultural holding.
confidence: medium
notes: From the council's list (updated December 2012), pages 1, 3. The form is the first item on every
  checklist (full, section 73, approval of details, lawful development certificates, prior notification
  of demolition and of telecommunications development). Ownership and agricultural certificates are listed
  on the full and section 73 checklists. Section 24 of the guide says the council will 'Use and adapt
  our existing mineral application form'; the Part 3 guidance notes (24/03/2014, page 2) say Part 1 and
  Part 3 must be completed for mineral and waste developments. The fee is also a national requirement
  (see the unmapped list).
review-status: unverified
