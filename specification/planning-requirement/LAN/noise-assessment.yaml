reference: noise-assessment
local-authority: LAN
required-if:
  any:
  - application-type:
      in:
      - mineral-app
      - waste-dev
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: The development is likely to disturb occupiers of nearby property.
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise-sensitive use near an existing noise source.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
confidence: medium
notes: 'From the audit (missing_requirement): s25, development likely to disturb occupiers, noise-sensitive
  uses near noise sources, and all minerals or waste operations.'
review-status: unverified
field-status: {}
