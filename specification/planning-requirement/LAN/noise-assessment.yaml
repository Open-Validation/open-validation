reference: noise-assessment
local-authority: LAN
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - all:
    - application-type:
        in:
        - reg-3
        - s73
        - pa-ecomms-network
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: The development raises issues of disturbance by noise to occupants of nearby existing
            buildings.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise-sensitive development close to existing sources of noise.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Applications for developments that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and for developments that are considered to be noise sensitive and which
  are close to existing sources of noise should be supported by a noise assessment prepared by a suitably
  qualified acoustician. Almost all minerals and waste management operations have potential for generating
  noise, either through the operation of plant and machinery or from vehicle movements. Therefore unless
  otherwise agreed in writing by the County Planning Authority, all applications should be accompanied
  by a Noise Impact Statement prepared by a suitable qualified acoustician.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 13. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Also in the local list of the telecommunications prior notification checklist
  ('Noise Impact Assessment/Acoustic report'). All minerals and waste applications need one 'unless otherwise
  agreed in writing by the County Planning Authority'. A vibration impact assessment 'may also be required'
  (see the unmapped list).
review-status: unverified
field-status: {}
