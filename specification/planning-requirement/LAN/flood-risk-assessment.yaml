reference: flood-risk-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - any:
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zone 2 or 3.
    - all:
      - site:
          in:
          - critical-drainage-area
          description: In a critical drainage area notified by the Environment Agency.
      - condition:
          field: minor-development
          value: false
          description: Development other than minor development.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) paragraphs 99-108
source-text: A Flood Risk Assessment (FRA) will be required for development proposals of 1 hectare or
  greater outside flood risk zones and for all proposals for new development located in Flood Zones 2
  and 3 as designated by the Environment Agency.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 8. Listed in the local list on the full planning
  permission and section 73 checklists, which cover the county council's minerals, waste and Regulation
  3 applications.
review-status: unverified
field-status: {}
