reference: flood-risk-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or greater.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or greater.
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zone 2 or 3.
    - all:
      - condition:
          field: minor-development
          value: false
          description: The proposal is not minor development.
      - site:
          in:
          - critical-drainage-area
          description: The site is in a notified critical drainage area.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Flood risk assessment A Flood Risk Assessment (FRA) will be required for development proposals
  of 1 hectare or greater outside flood risk zones and for all proposals for new development located in
  Flood Zones 2 and 3 as designated by the Environment Agency.
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type,
  wrong_trigger): moved to the county''s application types; the excerpt left out non-minor development
  in a notified critical drainage area (from the audit, s14).'
review-status: unverified
field-status: {}
