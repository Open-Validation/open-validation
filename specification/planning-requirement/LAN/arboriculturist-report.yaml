reference: arboriculturist-report
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within, overhanging or within half their height of the site boundary.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Tree survey/Arboricultural implications Where there are trees within, overhanging or in close
  proximity of the application site (within half their height of the boundary of a site), an application
  should include the accurate plotting of all tree stems and crowns, accompanied by a tree survey which
  details species, size, condition, any surgery work recommended and a scheme for tree protection during
  the development of the site.
must-include:
- item: Accurate plotting of all tree stems and crowns
  level: must
- item: A tree survey giving species, size and condition of the trees
  level: must
- item: Any surgery work recommended
  level: must
- item: A scheme for tree protection during the development of the site
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type):
  moved from Full planning to the county''s application types.'
