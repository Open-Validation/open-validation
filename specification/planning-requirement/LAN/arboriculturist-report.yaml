reference: arboriculturist-report
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - pa-demo-building
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within, overhanging or close to the site (within half their height of the site
        boundary).
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: BS5837 'Trees in relation to construction – Recommendations'
source-text: Where there are trees within, overhanging or in close proximity of the application site (within
  half their height of the boundary of a site), an application should include the accurate plotting of
  all tree stems and crowns, accompanied by a tree survey which details species, size, condition, any
  surgery work recommended and a scheme for tree protection during the development of the site. An arboricultural
  implications study will be required on sites with an important tree resource.
must-include:
- item: Accurate plotting of all tree stems and crowns
  level: should
- item: A tree survey detailing species, size, condition and any surgery work recommended
  level: should
- item: A scheme for tree protection during the development of the site
  level: should
- item: An arboricultural implications study, on sites with an important tree resource
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2012), page 18. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Also in the local list of the prior notification of demolition checklist.
  What counts as 'an important tree resource' is not defined, so that item is discretionary.
review-status: unverified
field-status: {}
