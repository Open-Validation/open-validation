reference: floor-plan-existing
local-authority: LAN
required-if:
  any:
  - application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - reg-3
        - s73
        - approval-condition
        - pa-demo-building
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In addition other plans should be submitted (dependent on the type of application) as follows:
  ... Existing and proposed floor plans (e.g. at a scale of 1:50 or 1:100) ... Plans Existing Elevations,
  Existing floor plans existing site survey plan'
must-include:
- item: Drawn to a scale of 1:50 or 1:100
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 2. Elevations, floor plans, sections and
  roof plans are 'other plans' needed 'dependent on the type of application', so they show as discretionary
  for the applications whose checklists list 'Site and other plans' (full, section 73, approval of details,
  prior notification of demolition). The lawful development certificate checklists list existing floor
  plans as a national essential requirement.
review-status: unverified
field-status: {}
