reference: telecommunications-report
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: Mast and antenna development by a mobile phone network operator within a mineral or
        waste operation.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Code of Practice on Mobile Network Development (2002)
source-text: Where planning applications for mast and antenna development by mobile phone network operators
  in England fall within a mineral or waste operation, applications should be submitted to the County
  Planning Authority and should be accompanied by a range of supplementary information including the area
  of search, details of any consultation undertaken, details of the proposed structure, and technical
  justification and information about the proposed development. Planning applications should also be accompanied
  by a signed declaration that the equipment and installation has been designed to be in full compliance
  with the requirements of the radio frequency (RF) public exposure guidelines of the International Commission
  on Non-Ionizing Radiation Protection (ICNIRP).
must-include:
- item: The area of search
  level: should
- item: Details of any consultation undertaken
  level: should
- item: Details of the proposed structure
  level: should
- item: Technical justification and information about the proposed development
  level: should
- item: A signed declaration that the equipment and installation fully comply with the ICNIRP radio frequency
    public exposure guidelines
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 16. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. The telecommunications prior notification checklist also asks for the 'Supplementary
  Information Template'.
