reference: site-plan
local-authority: LAN
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
    - s73
    - approval-condition
    - pa-demo-building
    - ldc-existing-use
    - ldc-prospective-use
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The site plan should be drawn at a scale of 1:500 or 1:200 and should accurately show:'
must-include:
- item: At a scale of 1:500 or 1:200
  level: should
- item: The direction of North
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing, where this is proposed
  level: should
- item: Block plan (e.g. 1:100 or 1:200) showing the site as existing, site boundaries, the type and height
    of boundary treatment and the position of any building or structure on the other side of the boundaries
  level: should
  required-if: discretionary
  source-text: These should show the site as existing; any site boundaries; the type and height of boundary
    treatment (e.g. walls, fences etc); the position of any building or structure on the other side of
    such boundaries.
- item: 'Minerals and waste working plans: the application land edged red and adjoining land in which
    the applicant owns or holds an interest edged blue; areas already excavated, worked or infilled; and
    the boundaries of existing planning permissions'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: existing and proposed buildings and fixed plant (sites and
    elevational details)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: construction and location of the means of access, with widths,
    relation to public roads, kerb radii and visibility splays; and details of vehicular routing'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: public rights of way, railway lines, overhead power lines,
    statutory services and watercourses crossing the working area, and any proposed diversions'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: direction and programme of working, with stages and phasing
    of working and restoration; and land within the site that is not to be worked or infilled'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: location and height of stockpiles, topsoil and overburden storage
    and mineral waste disposal areas; settling lagoons and drainage during and after the development'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: landscaping, screening and reclamation proposals (earth bunds,
    trees to be felled and retained, new planting)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
- item: 'Minerals and waste working plans: wheel cleaning facilities, weighbridge and site offices; monitoring
    boreholes; and equipment and method for leachate or landfill gas control'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: 'Working Plans should identify the following:'
confidence: medium
notes: From the council's list (updated December 2012), page 2. 'Site and other plans' is on the full
  and section 73 checklists, and in the local list of the approval of details ('Site and other plans required
  to meet the requirements of the condition') and prior notification of demolition checklists; the lawful
  development certificate checklists ask for an 'existing site survey plan'. The block plan is one of
  the 'other plans' needed 'dependent on the type of application', so it shows as discretionary. The working
  plan items come from the council's Part 3 guidance notes for minerals and waste applications (24/03/2014),
  pages 6-7, which the guide (sections 23, 24 and 43) points to for minerals and waste applications.
