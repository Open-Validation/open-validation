reference: section-existing
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - approval-condition
      - pa-demo-building
  - any:
    - condition:
        field: new-build
        value: true
        description: The application involves new buildings.
    - condition:
        field: change-in-ground-levels
        value: true
        description: The proposal involves a change in ground levels.
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In addition other plans should be submitted (dependent on the type of application) as follows:
  ... Existing and proposed site sections and finished floor and site levels (e.g. at a scale of 1:50
  or 1:100) ... In all cases where a proposal involves a change in ground levels, illustrative drawings
  should be submitted to show both existing and finished levels to include details of foundations and
  eaves and how encroachment onto adjoining land is to be avoided. Full information should also be submitted
  to demonstrate how proposed buildings relate to existing site levels and neighbouring development. Such
  plans should show existing site levels and finished floor levels (with levels related to a fixed datum
  point off site) and also show the proposals in relation to adjoining buildings. This will be required
  for all applications involving new buildings.'
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: should
- item: Existing site levels, related to a fixed datum point off site
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 3. Levels information is 'required for all
  applications involving new buildings', and drawings of existing and finished levels are asked for 'In
  all cases where a proposal involves a change in ground levels'; otherwise sections are 'other plans'
  needed 'dependent on the type of application' (discretionary).
review-status: unverified
field-status: {}
