reference: recreation-facilities-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - site:
      in:
      - open-space
      description: Development within existing open space.
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) section 8
source-text: For development within open spaces, application proposals should be accompanied by plans
  showing any areas of existing or proposed open space within or adjoining the application site. ... However,
  in the absence of a robust and up-to-date assessment by a local authority, an applicant for planning
  permission may seek to demonstrate through an independent assessment that the land or buildings are
  surplus to local requirements. Any such evidence should accompany the planning application.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: should
- item: Any independent assessment that the land or buildings are surplus to local requirements
  level: should
confidence: medium
notes: From the council's list (updated December 2012), page 13. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications.
review-status: unverified
field-status: {}
