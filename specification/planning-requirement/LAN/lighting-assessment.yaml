reference: lighting-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        description: The development is in the vicinity of a listed building or a conservation area.
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
source-text: Lighting assessments Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a listed building or a conservation area, or open countryside,
  where external lighting would be provided or made necessary by the … development, should be required
  to be accompanied by details of external lighting and the proposed hours when the lighting would be
  switched on.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): filed under Listed building consent only because the trigger mentions
  a listed building; LBC is not a county application type. Residential property and open countryside have
  no field, so they are shown as officer discretion.'
review-status: unverified
field-status: {}
