reference: lighting-assessment
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
  - condition:
      field: external-lighting
      value: true
      description: A publicly accessible development where external lighting would be provided or made
        necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - condition:
        field: outside-urban-area
        value: true
        description: In open countryside.
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) paragraph 125
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or a conservation area, or open countryside, where external
  lighting would be provided or made necessary by the ... development, should be required to be accompanied
  by details of external lighting and the proposed hours when the lighting would be switched on.
must-include:
- item: Details of external lighting and the proposed hours when the lighting would be switched on
  level: should
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (updated December 2012), page 11. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. 'In the vicinity of residential property' has no distance, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
