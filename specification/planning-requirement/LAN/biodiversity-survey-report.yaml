reference: biodiversity-survey-report
local-authority: LAN
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - pa-demo-building
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - local-nature-reserve
        - local-wildlife-site
        description: On or adjacent to a site designated for its biodiversity interest (international,
          national or local, e.g. Biological Heritage Sites) that the development might affect.
    - condition:
        field: protected-species
        value: true
        description: Protected species are involved, or suspected to be present on the site.
    - discretionary
source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
policy: National Planning Policy Framework (2012) section 11; ODPM Circular 06/2005
source-text: Where a proposed development may have possible impacts on wildlife and biodiversity, information
  should be provided on existing biodiversity interests and possible impacts on them to allow full consideration
  of those impacts. ... A full wildlife survey will be required where designated sites or protected species
  are involved or it is suspected that there may be protected species on an application site. In addition
  where developments that are proposed adjacent to such a site, but it might have an impact upon it; will
  also be required to be submitted with a full assessment of the impact of the proposal on the feature
  of importance.
must-include:
- item: Significant wildlife habitats or features and the location of habitats of any protected species
  level: should
- item: A survey report containing the survey methodology and all the baseline data, prepared by a professional
    ecological surveyor
  level: should
- item: Any wildlife interest present, the likely impact of the development on it, and a mitigation scheme
    to protect and, wherever possible, enhance it
  level: should
- item: Surveys undertaken by a suitably experienced professional at an appropriate time of year, using
    appropriate survey techniques
  level: must
- item: 'Where designated sites are affected: an assessment of impacts and proposals for long-term maintenance
    and management'
  level: should
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      - local-nature-reserve
      - local-wildlife-site
      description: The development will affect a site designated for its biodiversity interest.
confidence: medium
notes: From the council's list (updated December 2012), pages 5, 6. Listed in the local list on the full
  planning permission and section 73 checklists, which cover the county council's minerals, waste and
  Regulation 3 applications. Also in the local list of the prior notification of demolition checklist.
  'Possible impacts on wildlife and biodiversity' has no test, so that part shows as discretionary. Where
  European protected sites or species are involved the survey cannot be left to a condition.
review-status: unverified
field-status: {}
