reference: noise-assessment
local-authority: STR
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals generating significant noise/vibration, such as industrial uses near homes
        or restaurants/cafes with an extract system.
  - condition:
      field: plant-equipment
      value: true
      description: Air conditioners/condensers.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New residential next/near to an existing noise source.
  - discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policies CS.9, CS.11 and AS.11
source-text: 'Proposals generating or particularly sensitive to significant noise/vibration including:
  o Applications for industrial uses (including some uses in Use Class E) adjacent or close to residential
  properties; 1 o Restaurants/cafes which have an extract system o Air conditioner/condensers o New residential
  next/near to existing noise source'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: Existing noise environment, potential noise sources from the development or affecting it
  level: should
- item: Sufficient sound insulation or mitigation to avoid harm to adjacent residents
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 17. 'Significant' is a
  judgement, so a discretionary branch is kept alongside the listed examples.
review-status: unverified
field-status: {}
