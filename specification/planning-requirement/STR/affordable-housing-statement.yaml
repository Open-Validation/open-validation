reference: affordable-housing-statement
local-authority: STR
required-if: discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.18
source-text: Where a proportion of affordable housing is required by Policy CS.18, whether on-site provision
  or off-site contribution.
must-include:
- item: An explanation and/or plans of how the proposal meets Policy CS.18
  level: should
- item: Confirmation that the applicant is prepared to enter into a planning obligation based on the council's
    model S106 clauses
  level: should
- item: Evidence that the estate layout and detailed design of the affordable homes has been discussed
    with, and is considered satisfactory by, a named partner Registered Provider
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Confirmation of agreement to pay the costs of independent advice on affordable housing provision,
    when the council needs it
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 4. Shown as discretionary
  because the list gives no threshold of its own; the threshold is set by Core Strategy policy CS.18.
review-status: unverified
field-status: {}
