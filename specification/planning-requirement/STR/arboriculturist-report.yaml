reference: arboriculturist-report
local-authority: STR
required-if:
  all:
  - any:
    - condition:
        field: building-works
        value: true
        description: Building works.
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - condition:
        field: engineering-operations
        value: true
        description: Engineering works.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within or adjoining the site with a stem of more than 75 mm diameter at 1.5 m
        above ground level.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.5
source-text: All developments involving building, demolition or engineering works where there are trees
  within or adjoining the application site which have a stem of more than 75mm (3 inches approx.) diameter
  at 1.5 metres above ground level.
must-include:
- item: Prepared by a suitable professional in accordance with BS 5837:2012, including survey, impact
    and mitigation proposals
  level: should
- item: Covers all trees on the site and within 15 m of any operations
  level: must
- item: A tree shading plan where proposed buildings will be shaded
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 22. The list's 'Tree survey
  / Arboricultural Impact Assessment and Arboricultural Method Statements'.
review-status: unverified
field-status: {}
