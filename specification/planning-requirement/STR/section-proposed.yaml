  - discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Dependent on the nature of works proposed (i.e external, internal works, or works that will
  result in removal or changes to internal details or other key architectural details) the following will
  be required for validation: Existing and Proposed External Elevations at 1:50 scale Existing and proposed
  floorplans at 1:50 scale Existing and Proposed Roof Plans at 1:50 scale Existing and Proposed Internal
  Sections at 1:20 or 1:10 scale.'
must-include:
- item: Internal sections at a scale of 1:20 or 1:10
  level: must
- item: 'For listed building consent: detailed elevation and section drawings of joinery and other architectural
    features (internal or external) at 1:20, 1:10, 1:2 or full size'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
  source-text: 'Joinery and Other Architectural Features: Detailed Elevation and Section Drawings (Internal
    or External) at 1:20, 1:10, 1:2 or full size, as appropriate'
confidence: medium
notes: From the council's list (published July 2026), Listed Building Consent applications, page 26. Only
  listed building consent applications; shown as discretionary because the list ties it to the nature
  of the works. For planning applications the list only says sections 'can also be useful'.
