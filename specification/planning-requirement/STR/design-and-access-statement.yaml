reference: design-and-access-statement
local-authority: STR
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: New building(s) with 100 sq m or more floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Stratford-on-Avon
  Core Strategy 2011-2031 policy CS.9
source-text: Applications for major developments. Applications for developments in a Conservation Area
  for 1 or more new dwellings, or for new building(s) with 100sqm or more floorspace. Applications for
  listed building consent.
must-include:
- item: The information required by the DMPO and Planning Practice Guidance
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements and Listed Building Consent,
  page 11, 25. Street scene/contextual drawings are optional.
review-status: unverified
field-status: {}
