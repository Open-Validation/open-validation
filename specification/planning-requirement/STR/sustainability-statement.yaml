reference: sustainability-statement
local-authority: STR
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New build development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 20
      description: Non-residential development adding over 20 square metres.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversions.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 20
        description: A householder extension adding over 20 square metres.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Development Requirements SPD Part V
source-text: A completed checklist must accompany all qualifying applications.
confidence: medium
notes: 'This is the Climate Change Checklist (SPD Part V). Audit (not_a_requirement and missing_requirement):
  the workbook''s ''Validation checklist form'' row had lost its name and trigger. From the audit: new
  build, non-residential development adding over 20 sqm, conversions, and householder extensions adding
  over 20 sqm.'
review-status: unverified
field-status: {}
