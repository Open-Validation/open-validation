reference: sustainability-statement
local-authority: STR
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New build dwellings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 20
      description: Over 20 square metres of additional floorspace (non-residential or householder).
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversion and change of use of buildings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential development (BREEAM).
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Development Requirements SPD Part V; Stratford-on-Avon Core Strategy 2011-2031 policies CS.2,
  CS.3, CS.4, CS.5, CS.6, CS.7, CS.9, CS.19, CS.20, CS.22, CS.25, CS.26, AS.1-9, AS.10 and AS.11
source-text: 'The Checklists are set out in appendices to SPD Part V as follows: Appendix 1: New build
  dwellings and non-residential developments where over 20 square metres of additional floorspace is proposed.
  Appendix 2: Conversion and change of use of buildings. Appendix 3: Householder developments where over
  20 square metres of additional floorspace is proposed. A completed checklist must accompany all qualifying
  applications.'
must-include:
- item: 'Completed Climate Change Checklist from the relevant appendix to SPD Part V (1: new build dwellings
    and non-residential; 2: conversion and change of use; 3: householder)'
  level: must
- item: BREEAM pre-assessment certification for the 'Good' standard, prepared or approved by a registered
    assessor
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential development.
  source-text: All non-residential development should be compliant with BREEAM ‘Good’ standard. Pre-assessment
    certification for the relevant scheme should be prepared or approved by a registered assessor.
confidence: medium
notes: 'From the council''s list (published July 2026), Local Requirements, page 9, 11. Holds the list''s
  ''Climate Change Checklist'' and ''BREEAM Pre-assessment certification'' (policy CS.2). Reading of Appendix
  1: new build dwellings, and non-residential development adding over 20 sq m.'
review-status: unverified
field-status: {}
