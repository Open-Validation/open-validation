reference: land-contamination-assessment
local-authority: STR
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - contaminated-land
        description: The site, or a site next to it, has a history of industrial/commercial use, landfill/waste
          management or agricultural use.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.9
source-text: All major developments Applications (excluding householder) on sites, or sites next to those,
  with a history of industrial/commercial use, landfill/waste management or agricultural use
must-include:
- item: Desk top study assessing the possibility of soil contamination and gas migration
  level: must
- item: Carried out in accordance with the Environment Agency's Land Contamination Risk Management (LCRM)
    and industry guidance, by competent persons
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 10-11. The list's 'Contaminated
  Land Desktop Study / Remediation Statement'. Ground investigation and remediation may be required with
  the application or by condition.
review-status: unverified
field-status: {}
