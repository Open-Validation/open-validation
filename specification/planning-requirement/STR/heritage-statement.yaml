reference: heritage-statement
local-authority: STR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - battlefield
      - world-heritage-site
      - locally-listed-building
      description: Affects a designated or non-designated heritage asset or their settings (NPPF Annex
        2).
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.8
source-text: 'Must accompany developments affecting a ‘designated heritage asset’, or ‘non-designated
  heritage asset’ or their settings (the definition which can be found in NPPF Annex 2: Glossary here).'
must-include:
- item: Proportionate to the asset's significance and prepared by an appropriate expert
  level: should
- item: Refers to the Historic Environment Record (HER)
  level: should
- item: Assesses the significance of the heritage assets affected, including any contribution made by
    their setting
  level: should
- item: Assesses the likely impact of the proposal on that significance
  level: should
- item: Refers to the relevant NPPF, Core Strategy and (where relevant) Neighbourhood Development Plan
    policies
  level: should
- item: Takes account of the headings in Historic England's 'Statements of Heritage Significance' (October
    2019), Section 3
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements and Listed Building Consent,
  page 13-14, 25. Also called a Statement of Significance. Required for all listed building consent applications.
review-status: unverified
field-status: {}
