reference: biodiversity-survey-report
local-authority: STR
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Likely to affect a protected or nationally, regionally or locally important species.
  - site:
      in:
      - priority-habitat
      description: Likely to affect protected or nationally, regionally or locally important habitats.
  - condition:
      field: geodiversity-interest
      value: true
      description: Likely to affect protected or nationally, regionally or locally important geological
        features.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policies CS.6 and CS.7
source-text: All planning applications which are likely to affect a protected or nationally, regionally
  or locally important species and / or protected or nationally, regionally or locally important habitats
  or geological features.
must-include:
- item: Any further pre-determination surveys that a Preliminary Ecological Appraisal identifies as needed
  level: must
  source-text: Where applications require a Preliminary Ecological Appraisal which identifies ary that
    further predetermination surveys would be required, these will also be required in order to make the
    application valid.
- item: 'Where there is ecological land-take: a Biodiversity Impact Assessment showing biodiversity net
    gain and how the proposal integrates into the wider green infrastructure network'
  level: must
  required-if:
    condition:
      field: loss-of-habitat-features
      value: true
      description: The proposal has ecological land-take.
- item: Protected species surveys carried out by an appropriately licensed surveyor, where Warwickshire
    County Council's householder, non-householder or habitat trigger lists require them
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 8-9. The list's 'Biodiversity
  and Geodiversity Statement / Preliminary Ecological Appraisal / Preliminary Roost Assessment'. The detailed
  triggers are Warwickshire County Council's trigger lists, which the list links to.
review-status: unverified
field-status: {}
