reference: sustainable-drainage-strategy
local-authority: STR
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Development with surface water drainage in an area at risk of flooding (flood zone
        2 or 3, or surface water flooding).
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.4
source-text: 'All planning applications for: major development proposals; and development with surface
  water drainage in an area at risk of flooding such as flood zones 2 or 3, or at risk of surface water
  flooding.'
must-include:
- item: Existing surface water drainage arrangements, including existing rates and volumes of run-off
  level: must
- item: Proposals for restricting discharge rates and managing surface water using SuDS
  level: must
- item: How the multifunctional benefits of SuDS have been considered
  level: must
- item: How climate change has been accounted for and the opportunities to mitigate flood risk
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 21. The list's 'Surface
  Water Drainage Strategy'. The LLFA's Flood Risk Guidance for Development sets out further detail.
review-status: unverified
field-status: {}
