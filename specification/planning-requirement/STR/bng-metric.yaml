reference: bng-metric
local-authority: STR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Stratford-on-Avon Core
  Strategy 2011-2031 policies CS.6 and CS.7
source-text: 'The following will therefore need to be submitted with the planning application, where development
  would be subject to the biodiversity gain condition:'
must-include:
- item: Statement confirming whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value of the on-site habitat on the date of application (or an
    earlier date), with the completed metric calculation, its publication date and version
  level: must
- item: The proposed earlier date and the reasons for it
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant wishes to use an earlier date.
- item: Statement on whether the on-site biodiversity value is lower because of activities carried on
    ('degradation')
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
- item: Biodiversity Net Gain Statement setting out the Baseline Metric Output for the entire site within
    the red line, using the latest Statutory Biodiversity Metric or Small Sites Metric
  level: must
  source-text: The Biodiversity Net Gain Statement should set out the Baseline Metric Output as existing
    for the entire site within the red line of the application, based on the latest Statutory Biodiversity
    Metric or Small Sites Metric Biodiversity Metric (whichever is applicable).
- item: Pre and post development biodiversity value quantified, with an explanation of the condition scores
    as set out in the DEFRA guidance
  level: must
- item: Excel copies of the completed metrics, with full calculations leading to the final biodiversity
    unit scores (summarised information not accepted)
  level: must
- item: Evidence, including surveys, to justify the baseline date
  level: must
- item: Surveys carried out no more than 12 months before the application date
  level: should
- item: How 10% Biodiversity Net Gain can be achieved, on-site first, then a combination of on-site and
    partial off-site, or completely off-site
  level: must
- item: Demonstrate that the trading rules have been adhered to
  level: must
- item: Demonstrate that the mitigation hierarchy has been followed and how good design has minimised
    the biodiversity impact
  level: must
- item: 'For full and reserved matters applications: how the BNG habitats could be implemented, managed,
    maintained, monitored and funded for at least 30 years'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (published July 2026), National Requirements and Local Requirements, page
  2, 7-8. The national requirements apply to development subject to the biodiversity gain condition; the
  list's local BNG statement covers major and small-site development, which by law is the same set less
  exempt development. Householder and other exempt applications are exempt by law.
review-status: unverified
field-status: {}
