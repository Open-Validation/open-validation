reference: archaeological-assessment
local-authority: STR
required-if: discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.8
source-text: Development on sites where there is potential for the site to contain heritage assets of
  archaeological interest.
must-include:
- item: Desk-based assessment and, if necessary, a field evaluation, carried out by a registered member
    of the Chartered Institute for Archaeologists (CIfA)
  level: must
- item: Description of the site, the potential for archaeology and its significance
  level: must
- item: Impact of the proposed development on this archaeology
  level: must
- item: Confirmation of the need or otherwise for field evaluation
  level: must
- item: Advice on the most appropriate way to avoid or minimise conflict between the conservation of any
    archaeology and the development
  level: must
- item: Informed by the up-to-date Warwickshire County Council Historic Environment Record (not the free
    online version), quoting the unique HER reference number
  level: must
confidence: medium
notes: 'From the council''s list (published July 2026), Local Requirements, page 6. Shown as discretionary:
  ''potential'' for archaeological interest is a judgement.'
review-status: unverified
field-status: {}
