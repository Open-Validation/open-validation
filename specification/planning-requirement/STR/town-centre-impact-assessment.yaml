reference: town-centre-impact-assessment
local-authority: STR
required-if:
  any:
  - all:
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 1000
        description: Comparison retail over 1,000 sq m.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Site outside Stratford-upon-Avon town centre.
  - all:
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 2500
        description: Convenience retail over 2,500 sq m.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Site outside Stratford-upon-Avon town centre.
  - discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.23
source-text: For all comparison retail proposals over 1,000 sq.m for sites outside Stratford-upon-Avon
  town centre. For all convenience retail proposals over 2,500 sq. m for sites outside Stratford-upon-Avon
  town centre.
must-include:
- item: Agreement to pay for the council's independent advice, when it needs it
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 19. The list's 'Retail
  Impact Assessment'. It 'may also be required for proposals with potential to affect existing centres'
  (discretionary).
review-status: unverified
