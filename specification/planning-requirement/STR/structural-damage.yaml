  - application-type:
      in:
      - consent-under-tpo
  - condition:
      field: structural-damage-alleged
      value: true
      description: The TPO tree is thought to contribute to structural damage/subsidence of a property.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
source-text: If you consider that the TPO tree is contributing to structural damage/subsidence of a property,
