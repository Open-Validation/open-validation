reference: ecology-assessment
local-authority: STR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: biodiversity-gain-condition
      value: false
      description: The site is exempt from the national biodiversity net gain requirements.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.6; NPPF paragraph 193(a)
source-text: All sites (excluding householders) which are considered to be exempt from national Biodiversity
  Net Gain requirements. Policy CS.6 of the Core Strategy sets out that proposals will be expected to
  minimise impacts on biodiversity and, where possible secure a net gain in biodiversity. Statement to
  be submitted to demonstrate what measures being taken to deliver Net Gain to Biodiversity on site. Statement
  will need to demonstrate mitigation hierarchy Mitigation Hierarchy – NPPF Para 193 (a).
must-include:
- item: The measures being taken to deliver net gain to biodiversity on site
  level: must
- item: Demonstrates the mitigation hierarchy (NPPF paragraph 193(a))
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 8. The list's 'Biodiversity
  Net Gain (Exempt BNG sites)' statement.
