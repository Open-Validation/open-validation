reference: landscaping-plan
local-authority: STR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policies CS.5 and CS.9; Development Requirements SPD
  Part L
source-text: Required for all full applications for major development. Outline applications for major
  development must include an indicative masterplan to show how the quantum of development proposed and
  accompanying landscaping and Public Open Space can be accommodated on the site.
must-include:
- item: 'For outline: an indicative masterplan showing how the development, landscaping and Public Open
    Space can be accommodated'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: RPAs and other constraints plotted around each category A, B and C tree on all drawings (BS 5837:2012)
  level: must
- item: 'Soft landscape: planting plan; written specification of quality standards; schedule of species,
    plant sizes and densities'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'Soft landscape: existing trees and hedges to be retained, accurately plotted'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Existing and proposed levels, including cross sections of SuDS and the relationship between existing
    trees/hedges and new levels
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'Hard landscape: existing and proposed finished levels; surfacing materials (manufacturer, type,
    design, colour)'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'Hard landscape: position and elevation of all site enclosures (walls, railings, fences)'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'Hard landscape: street furniture, play equipment, bin areas, lighting and utility infrastructure
    such as substations'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For structural landscape and POS areas: a schedule of maintenance operations for up to 5 years
    after planting and a landscape management plan with responsibilities, long-term objectives and maintenance
    schedules'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For full and reserved matters major applications: details and location of street trees along
    the primary and secondary routes, where possible'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
  source-text: Full Applications and Reserved Matters Applications for major developments should, where
    possible, identify on plans the details 5) and location of street trees along the primary and secondary
    routes.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 14-15, 20. The list's 'Landscaping
  Details (hard & soft)'. The street trees item is the list's separate 'Street Trees' requirement (policies
  CS.2 and CS.5, SPD Part M).
review-status: unverified
field-status: {}
