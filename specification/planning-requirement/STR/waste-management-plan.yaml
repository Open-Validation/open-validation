reference: waste-management-plan
local-authority: STR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Development for new dwellings.
  - condition:
      field: new-business
      value: true
      description: Development for new businesses.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policies CS.2 and CS.9; Development Requirements SPD
  Part P
source-text: All developments for new dwellings or new businesses must include plans showing the location
  of bin stores in relation to the proposed development and on bin collection day with either ‘bin carry’
  distances or ‘bin collection’ points clearly shown.
must-include:
- item: Plans showing the location of bin stores in relation to the development and on bin collection
    day, with 'bin carry' distances or 'bin collection' points
  level: must
- item: 'Where a waste collection vehicle needs access to the bin store: tracking for a Mercedes Econic
    4-axle mid wheel steer bin lorry (11.73 m long, 2.49 m wide) showing it can enter and leave the site
    in a forward gear'
  level: should
  required-if:
    condition:
      field: bins-beyond-collection-distance
      value: true
      description: Bin store access is required by a waste collection vehicle.
- item: Bin storage capable of meeting the requirements of Part P of the Development Requirements SPD
  level: should
- item: Bins can be stored next to the public highway on collection day
  level: should
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 6. The list's 'Bin storage
  and collection plan'.
review-status: unverified
field-status: {}
