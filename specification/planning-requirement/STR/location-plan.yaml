reference: location-plan
local-authority: STR
required-if:
  always: true
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan (to show us where the site is). Must be based on an up-to-date map. Use a scale
  of 1:1250 or 1:2500 showing at least two named roads and show the north point. The application site
  should be edged clearly with a red line on the location plan. It should include all land necessary to
  carry out the proposed development (e.g. land required for access to the site from a public highway,
  access visibility splays, landscaping, car parking and open areas around buildings). A blue line should
  be drawn around any other land owned by the applicant, close to or adjoining the application site.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At a scale of 1:1250 or 1:2500, showing at least two named roads and the north point
  level: must
- item: Application site edged clearly with a red line, including all land necessary to carry out the
    development (e.g. access from a public highway, visibility splays, landscaping, car parking and open
    areas around buildings)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: 'For a new or widened access: the red line includes all land needed for the visibility splay'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new access or an amendment (e.g. widening) to an access.
  source-text: An application for a new access or amendment to the access (e.g. widening) requires the
    red line to include all land needed for the visibility splay.
- item: 'For a house extension (or other building): the red line goes round the whole property, including
    garden and drive, up to the road'
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: An extension to a house or other building.
  source-text: An application for a new extension to a house (or any other building) should show a red
    line around the whole property i.e. the whole of the house and garden and drive, all the way to the
    road, not just around the proposed extension.
- item: 'For advertisement consent: drawn to an identified scale and showing the direction of North'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: A plan which identifies the land to which the application relates drawn to an identified
    scale and showing the direction of North
confidence: medium
notes: From the council's list (published July 2026), National Requirements, Advertisement Consent and
  Further Guidance, page 1, 24, 28-29. The list also asks for a plan identifying the land with advertisement
  and lawful development certificate applications.
review-status: unverified
field-status: {}
