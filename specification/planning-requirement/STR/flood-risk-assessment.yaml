reference: flood-risk-assessment
local-authority: STR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in Flood Zone 2 or 3 (including minor development and change of use), or
        in a critical drainage area.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare (in Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare (in Flood Zone 1).
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
confidence: medium
notes: 'From the audit (missing_requirement): Flood Zones 2/3 including minor development and change of
  use, Zone 1 sites over 1ha, critical drainage areas. It can apply to householder proposals. The workbook''s
  ''A sequential test may also be required'' row belongs here.'
review-status: unverified
field-status: {}
