reference: flood-risk-assessment
local-authority: STR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Land in flood zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 ha in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 ha in flood zone 1.
  - condition:
      field: more-vulnerable-use-change
      value: true
      description: Less than 1 ha in flood zone 1 with a change to a more vulnerable class, where the
        occupation could be affected by flooding from sources other than rivers.
  - site:
      in:
      - critical-drainage-area
      description: An area in flood zone 1 with critical drainage problems notified by the Environment
        Agency.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policy CS.4
source-text: 'If the development involves: land in flood zone 2 or 3 including minor development and change
  of use. more than 1 hectare (ha) in flood zone 1. less than 1 ha in flood zone 1, but including a change
  of use in development type to a more vulnerable class (e.g. from commercial to residential), where the
  occupation could be affected by sources of flooding other than rivers (e.g., surface water drains, canals,
  reservoirs). an area within flood zone 1 which has critical drainage problems as notified by the Environment
  Agency.'
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 12. A sequential test may
  also be required.
review-status: unverified
field-status: {}
