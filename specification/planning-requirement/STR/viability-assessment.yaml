reference: viability-assessment
local-authority: STR
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant cannot provide the full range of S106 requirements (including affordable
        housing) or CIL due to viability.
  - discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policies CS.18, CS.22, CS.25 and CS.27
source-text: Any development where the applicant cannot provide the full range of S106 requirements (including
  affordable housing) or Community Infrastructure Levy (CIL) due to financial viability issues. ... Where
  financial considerations are relied upon to justify the proposal a financial appraisal will be required.
must-include:
- item: Contents as in Appendix C of the RICS Guide to Planning and Viability (GN 94/2012)
  level: should
- item: 'If confidentiality is sought: evidence that the excluded information is commercially sensitive,
    plus an executive summary for publication'
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: The applicant asks for an exemption from publication.
- item: Agreement to pay for the council's independent advice
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 11-12, 23. Holds both the
  list's 'Viability Assessment' and 'Financial Appraisal'. 'Where financial considerations are relied
  upon' (e.g. loss of a rural pub or shop, enabling development) is shown as discretionary. The council
  publishes appraisals unless confidentiality is requested.
review-status: unverified
field-status: {}
