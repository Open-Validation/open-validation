reference: site-plan
local-authority: STR
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site/Block Plan – Show the whole of the proposal (show the relationship of the proposal to
  existing buildings and features on the site and to adjacent land uses, buildings, features and highways).
  Include the access to the site from a public road, any buildings, significant trees/hedges or other
  features within or adjacent to the site or close to the boundary of the site. Use a scale of 1:200 or
  1:500.
must-include:
- item: At a scale of 1:200 or 1:500
  level: must
- item: The whole proposal and its relationship to existing buildings and features on the site and to
    adjacent land uses, buildings, features and highways
  level: must
- item: The access to the site from a public road, buildings, significant trees/hedges and other features
    within, adjacent to or close to the site boundary
  level: must
- item: 'For a new vehicular access or significant intensification of an existing access: details of the
    visibility splays'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new vehicular access or significant intensification in the use of an existing access.
  source-text: Any application that includes a new vehicular access or significant 21 intensification
    in the use of an existing access should include details of Visibility Splays.
confidence: medium
notes: From the council's list (published July 2026), National Requirements and Local Requirements, page
  1, 21-22, 25. Listed building consent applications need a block plan at 1:500 or 1:200.
