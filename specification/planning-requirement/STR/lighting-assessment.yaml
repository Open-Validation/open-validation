reference: lighting-assessment
local-authority: STR
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting, including in light sensitive areas (e.g. Cotswold AONB
        and Special Landscape Areas).
  - condition:
      field: illuminated
      value: true
      description: The proposal includes illumination of advertisements.
  - discretionary
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Core Strategy CS.9, CS.11
source-text: floodlighting, significant external lighting and illumination of advertisements New residential
  next/near to existing lighting source Applications in light sensitive areas (eg Cotswold AONB and Special
  Landscape Areas) where external lighting will be required. … (Policies CS.9 and CS.11) A light impact
  assessment should provide details of external lighting and the proposed hours when the lighting would
  be switched on.
must-include:
- item: Details of external lighting
  level: should
- item: The proposed hours when the lighting would be switched on
  level: should
confidence: medium
notes: 'The workbook placed this under Advertisement consent only, twice (audit: duplicate); the triggers
  cover other applications too. ''New residential next/near to existing lighting source'' has no field,
  so it is shown as officer discretion.'
review-status: unverified
field-status: {}
