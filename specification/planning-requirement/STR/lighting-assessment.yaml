reference: lighting-assessment
local-authority: STR
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: Street lighting, floodlighting, significant external lighting or illumination of advertisements.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - discretionary
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: In a light sensitive area (e.g. Cotswolds AONB and Special Landscape Areas).
    - condition:
        field: external-lighting
        value: true
        description: External lighting will be required.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Stratford-on-Avon Core Strategy 2011-2031 policies CS.9 and CS.11
source-text: Proposals involving street lighting, floodlighting, significant external lighting and illumination
  of advertisements New residential next/near to existing lighting source Applications in light sensitive
  areas (eg Cotswold AONB and Special Landscape Areas) where external lighting will be required.
must-include:
- item: Details of external lighting and the hours it would be on, complying with the ILP guidelines
  level: must
- item: Layout plan with beam orientation, a schedule of the equipment and design, and the expected level
    of luminance and glare
  level: must
- item: 'For floodlighting of an area (e.g. a sports pitch): a light contour diagram with projected lux
    levels including backlight, superimposed on a topographical survey where ground levels differ'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Floodlights for an area.
- item: 'For illuminated advertisements: the level of luminance'
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: Illuminated advertisement.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements, page 15-16. 'New residential
  next/near to existing lighting source' is shown as discretionary (no distance given). Special Landscape
  Areas have no national dataset; the AONB is used.
review-status: unverified
field-status: {}
