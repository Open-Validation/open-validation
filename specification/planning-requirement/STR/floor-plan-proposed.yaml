reference: floor-plan-proposed
local-authority: STR
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: New or altered buildings.
  - condition:
      field: demolition
      value: true
      description: Buildings to be demolished.
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: residential-extension
        value: true
        description: A proposed dwelling extension.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor Plans and Elevations of all new and altered buildings including any buildings to be
  demolished (to show us the precise details of what you propose). Plans and elevations of the site/buildings
  as existing should also be provided. Use a scale of 1:100, with 1:20 for specific details such as window
  details on Listed Buildings.
must-include:
- item: At a scale of 1:100
  level: must
- item: 'For listed building consent: at 1:50'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Existing and proposed floorplans at 1:50 scale
- item: 'For a lawful development certificate for a proposed dwelling extension: drawn to a recognised
    scale'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
  source-text: Lawful development applications for proposed dwelling extensions must be accompanied by
    floor and elevation plans to a recognised scale.
confidence: medium
notes: From the council's list (published July 2026), National Requirements and other application types,
  page 1, 24-26. For listed building consent the list says these drawings are needed 'dependent on the
  nature of works proposed', so that part is shown as discretionary.
review-status: unverified
field-status: {}
