reference: condition-of-trees
local-authority: STR
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - condition:
      field: tree-condition-reasons
      value: true
      description: The health of the TPO tree is the reason for the works.
source-url: https://www.stratford.gov.uk/doc/211993/name/2023%20Local%20List%20for%20website.pdf
source-text: Where the health of the TPO tree is the reason for the proposed work, the application must
  be accompanied by an arboriculturalist’s report which provides evidence and justifies the need for the
  proposed arboricultural works.
must-include:
- item: Arboriculturalist's report providing evidence and justifying the need for the works
  level: must
confidence: medium
notes: From the council's list (published July 2026), Works to trees protected by Tree Preservation Orders,
  page 27.
review-status: unverified
field-status: {}
