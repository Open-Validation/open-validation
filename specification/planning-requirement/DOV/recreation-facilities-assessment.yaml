reference: recreation-facilities-assessment
local-authority: DOV
required-if:
  site:
    in:
    - open-space
    description: Development on open space (outdoor sports pitches, children's play areas, informal amenity
      open space).
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Dover District Core Strategy 2010 policy DM25; Land Allocations Local Plan policy DM27
source-text: All development on open spaces ... An applicant for planning permission within an open space
  will need to demonstrate, through an assessment, that the land and any buildings upon them are surplus
  to requirements.
must-include:
- item: Evidence that the land and any buildings on it are surplus to requirements
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Open Space
  Assessment) and Note 23, page 19, 45. Note 23 also says new residential development above the DM27 threshold
  must provide open space or justify not doing so. The list predates the Dover District Local Plan to
  2040 (adopted October 2024), so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
