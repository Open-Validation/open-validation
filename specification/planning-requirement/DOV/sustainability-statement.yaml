reference: sustainability-statement
local-authority: DOV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: new-build
          value: true
          description: New-build dwellings.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new-build dwellings.
    - all:
      - condition:
          field: new-build
          value: true
          description: New-build non-residential floorspace.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 100
          description: 100 square metres or more of non-residential floorspace.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
source-text: All applications (full and outline) of 1 (new build) dwelling or more
confidence: low
notes: 'From the audit (missing_requirement): Note 29 Code for Sustainable Homes/BREEAM Pre-Assessment
  Statement, for 1+ new-build dwellings and non-residential new build of 100 sqm or more. The Code for
  Sustainable Homes was withdrawn in 2015, so this is outdated.'
review-status: unverified
field-status: {}
