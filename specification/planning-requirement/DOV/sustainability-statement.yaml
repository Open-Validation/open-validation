reference: sustainability-statement
local-authority: DOV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: new-build
      value: true
      description: New build development.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: 1 or more new build dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 100
        description: New build non-residential development of 100 sq m or more.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Dover District Core Strategy 2010 policy CP5
source-text: The Pre-Assessment Statement will be required for all applications (full and outline) of
  1 (new build) dwelling or more and all applications for (new build) non-residential development of 100sqm
  or more.
must-include:
- item: How the development will achieve the requirements of Core Strategy Policy CP5 (Code for Sustainable
    Homes / BREEAM pre-assessment)
  level: must
- item: If Policy CP5 cannot be met, a justification based on the technical requirements of CFSH/BREEAM
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Code for Sustainable
  Homes/BREEAM Pre-Assessment Statements) and Note 29, page 23-24, 47. The Code for Sustainable Homes
  was withdrawn by the government in 2015, but the list still asks for this. The list predates the Dover
  District Local Plan to 2040 (adopted October 2024), so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
