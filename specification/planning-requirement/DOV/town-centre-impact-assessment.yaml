reference: town-centre-impact-assessment
local-authority: DOV
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure and office development outside town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 square metres gross floor space.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF
source-text: Applications for retail, leisure & office development outside of town centres over 2,500
  square metres gross floor space.
must-include:
- item: Details of the sequential approach to main town centre uses not in an existing centre and not
    in accordance with an up-to-date Local Plan
  level: must
- item: Impact on existing, committed and planned public and private investment in the centre or centres
    in the catchment area
  level: must
- item: Impact on town centre vitality and viability, including local consumer choice and trade, up to
    five years from the application (ten years for major schemes)
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Retail Impact
  Assessment) and Note 31, page 24-25, 47.
review-status: unverified
field-status: {}
