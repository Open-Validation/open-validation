reference: noise-assessment
local-authority: DOV
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal is likely to generate noise above current background levels (including
        places of entertainment).
  - condition:
      field: plant-equipment
      value: true
      description: The proposal includes external plant and equipment.
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
source-text: Proposals likely to generate noise in excess of current background levels … Applications
  for residential and commercial developments including places of entertainment and all applications where
  external plant and equipment is proposed should be submitted with a noise survey and report prepared
  by a competent acoustician who shall be a member of the Institute of Acoustics or the Association of
  Noise Consultants.
must-include:
- item: Prepared by a competent acoustician who is a member of the Institute of Acoustics or the Association
    of Noise Consultants
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s noise row quoted only the acoustician sentence, and the
  Acoustic Report text was on its ventilation row. Residential and commercial developments in general
  are shown as officer discretion.'
review-status: unverified
field-status: {}
