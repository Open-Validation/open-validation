reference: noise-assessment
local-authority: DOV
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals likely to generate noise above background levels or WHO community noise guideline
        levels, including new places of entertainment.
  - condition:
      field: plant-equipment
      value: true
      description: External plant and equipment is proposed.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential and noise sensitive developments.
  - condition:
      field: basement
      value: true
      description: Subterranean developments.
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF; BS4142; BS8233; WHO Guidelines for Community Noise
source-text: 'Proposals likely to generate noise in excess of current background levels and/or above the
  levels specified in the World Health Organisations Guidelines for Community Noise. Applications for
  residential and commercial developments including places of entertainment and all applications where
  external plant and equipment is proposed should be submitted with a noise survey and report prepared
  by a competent acoustician who shall be a member of the Institute of Acoustics or the Association of
  Noise Consultants. ... Noise surveys and reports will generally be required for developments including:
  1. Building services and other external plant 2. Residential and noise sensitive developments 3. Subterranean
  developments 4. New Places of entertainment 5. Where there are increases in road traffic'
must-include:
- item: Prepared by a competent acoustician who is a member of the Institute of Acoustics or the Association
    of Noise Consultants
  level: must
- item: Works needed to control noise detailed on the application drawings
  level: must
- item: 'For external noise attenuation equipment (acoustic enclosures or screens): its location, size
    and visual impact on the host building and street scene'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: External noise attenuation equipment is proposed.
- item: Ambient and background noise measurements made in accordance with BS 7445-1:2003
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Acoustic Report)
  and Note 10, page 9, 34-35. 'Where there are increases in road traffic' has no threshold, so it is shown
  as discretionary. The list predates the Dover District Local Plan to 2040 (adopted October 2024), so
  the policies it cites have since been replaced.
review-status: unverified
field-status: {}
