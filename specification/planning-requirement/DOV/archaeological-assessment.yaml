reference: archaeological-assessment
local-authority: DOV
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: The development would lead to intrusive ground works.
  - any:
    - site:
        in:
        - archaeological-priority-area
        - scheduled-monument
        description: An area identified as being of known archaeological importance, or nationally important
          remains that are scheduled.
    - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF
source-text: Applications that involve development which would lead to intrusive ground works in an area
  identified as being of known archaeological importance, or affecting nationally important archaeological
  remains, whether scheduled or not, must include an archaeological desk top assessment and a field evaluation
  report.
must-include:
- item: An archaeological desk top assessment
  level: must
- item: A field evaluation report
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Heritage Statement/Archaeological
  Survey) and Note 18, page 15-16, 42. Unscheduled nationally important remains are shown as discretionary.
  This information forms part of any Heritage Statement.
review-status: unverified
field-status: {}
