reference: viability-assessment
local-authority: DOV
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: The development falls short of 30% affordable housing and/or the financial contribution
      required by the Affordable Housing SPD.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Dover District Core Strategy 2010 policy DM5; Affordable Housing SPD
source-text: Where, as confirmed in the Affordable Housing Statement, the development falls short of providing
  30% affordable housing and/or the financial contribution required through the Affordable Housing SPD,
  the application shall also be accompanied by a Viability Assessment which shall confirm the reasons
  why it would not be financially viable to provide the full quota/payment for affordable housing as sought
  by Policy DM5 and the SPD.
must-include:
- item: The reasons why it would not be financially viable to provide the full affordable housing quota
    or payment
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Note 11 (Affordable Housing Statement),
  page 35. The applicant meets the cost of any specialist advice the council needs. The list predates
  the Dover District Local Plan to 2040 (adopted October 2024), so the policies it cites have since been
  replaced.
review-status: unverified
field-status: {}
