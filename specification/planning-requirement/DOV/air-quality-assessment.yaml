reference: air-quality-assessment
local-authority: DOV
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - air-quality-management-area
      description: Development within or adjacent to an Air Quality Management Area, or that could generate
        additional traffic through one.
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF; DEFRA LAQM TG(09); Kent and Medway Air Quality Partnership technical guidance
source-text: Major developments or proposals that generate high levels of air pollution such as significant
  industrial developments and development within or adjacent to Air Quality Management Areas
must-include:
- item: Information to enable the Council to assess the likely impact on local air quality
  level: must
confidence: medium
notes: 'From the council''s list (adopted July 2014, amended April 2015), Local Requirements and Note
  12, page 10, 36. ''Proposals that generate high levels of air pollution'' and the note''s tests (deterioration
  in local air quality, exposure of future occupiers, significant construction dust) have no thresholds,
  so they are shown as discretionary. Existing AQMAs: Townwall Street, Snargate Street and part of the
  High St/Ladywell junction in Dover.'
review-status: unverified
