reference: heritage-statement
local-authority: DOV
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - world-heritage-site
      - locally-listed-building
      - battlefield
      - protected-wreck-site
      description: 'Applications that affect a heritage asset or its setting: listed buildings, scheduled
        monuments, protected wreck sites, registered parks and gardens, registered battlefields, World
        Heritage Sites and locally listed buildings.'
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: external-alterations
          value: true
          description: Altering the external appearance of existing buildings.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF
source-text: All applications which have an impact on a heritage asset, or its setting must include a
  ‘Heritage Statement’. ... All listed buildings applications, and planning applications affecting a listed
  building MUST include a Heritage Statement as described above. ... Applications within conservation
  areas for new buildings, or for altering the external appearance of existing buildings, must include
  a Heritage Statement.
must-include:
- item: Clearly labelled as a Heritage Statement (stand-alone or part of the Design and Access Statement)
  level: must
- item: The significance of any heritage asset, including any contribution made by its setting
  level: must
- item: The impact of the proposals on that significance, and a justification for the works
  level: must
- item: 'For listed buildings: the significance of the building and the parts affected; a schedule of
    the proposed works; an evaluation of the works on its significance; justification'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'For listed buildings: existing and proposed floor plans and elevations at 1:50 or larger (only
    the level altered; whole elevation where elevations change)'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'For listed buildings: a detailed specification of all proposed materials'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'For listed buildings: historic photographs or plans of lost or damaged features to be reinstated,
    if possible'
  level: should
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Affects a listed building.
- item: 'For conservation areas: the special character of the area around the site and the impact of the
    proposals on it'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: Where more than one heritage asset is affected, the impact on each
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 18,
  page 15-16, 41-42.
review-status: unverified
field-status: {}
