reference: arboriculturist-report
local-authority: DOV
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees and/or hedgerows within the site, or on adjacent land (including street trees),
      that could influence or be affected by the development.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: BS5837:2012; Hedgerow Regulations
source-text: Where there are trees and/or hedgerows within the application site, or on land adjacent to
  it that could influence or be affected by the development (including street trees)
must-include:
- item: Tree survey and/or hedgerow survey by an arboriculturalist experienced in protecting trees on
    development sites
  level: must
- item: 'For each tree: species, height, stem diameter (at 1.5m, or above the root flare for multi-stemmed
    trees), canopy spread to four compass points, crown base height, age class, condition, management
    recommendations and BS 5837:2012 retention category'
  level: must
- item: Retention categories clearly differentiated on plans
  level: must
- item: Tree retention/removal plan
  level: must
- item: Root protection areas, with retained trees and root protection areas shown on the proposed layout
  level: must
- item: Location and type of tree protection
  level: must
- item: Routes of proposed underground services on layout plans
  level: must
- item: Arboricultural Method Statement (AMS)
  level: must
- item: 'Landscaping/tree planting scheme: strategic hard and soft landscape design, including species
    and location of new tree planting and timing'
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Tree Survey/Arboricultural
  Assessment) and Note 33, page 26-27, 48-49.
review-status: unverified
field-status: {}
