reference: flood-risk-assessment
local-authority: DOV
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or greater (any flood zone, including Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or greater (any flood zone, including Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3 (except minor domestic extensions or works where
        no new dwelling or new bedroom space is created).
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF; PPS25 Development and Flood Risk practice guide
source-text: An FRA will be required for development proposals of one hectare or greater in Flood Zone
  1 and all proposals for new developments located in Flood Zones 2 and 3 should be accompanied by a FRA
  (except for minor domestic extensions or works where no new residential dwelling unit is being created
  and the scheme involves no new bedroom space). An FRA will also be required where the proposed development
  or change of use to a more vulnerable class may be subject to other sources of flooding, or where there
  are identified drainage problems.
must-include:
- item: The risks of all forms of flooding to and from the development
  level: must
- item: How these flood risks will be managed and mitigated, taking climate change into account
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 16,
  page 13-14, 39-40. 'Other sources of flooding' and 'identified drainage problems' have no fixed test,
  so they are shown as discretionary.
review-status: unverified
field-status: {}
