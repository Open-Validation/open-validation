reference: design-and-access-statement
local-authority: DOV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: Any part of the development is in a Conservation Area or World Heritage Site.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Floorspace created of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Article 8, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'only types of applications for planning permission that will require a D&A Statement will
  be: 1. Major Development; 2. The provision of one or more dwelling houses where any part of the development
  is in a Designated area (Note: the phrase “Designated Area” is defined as a Conservation Area or a World
  Heritage Site); and 3. The provision of a building or buildings where the floor space created by the
  development is 100 square metres or more where any part of the development is in a Designated Area.
  ... All applications for Listed Building Consent will require a D&A Statement'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes that context into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The policy adopted as to access, and how access policies in local development documents have been
    taken into account
  level: must
- item: Any consultation on access and what account has been taken of it
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: How specific issues which might affect access have been addressed
  level: must
- item: 'For listed building consent: the special architectural or historic importance of the building,
    the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: alternative means of access considered'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), National Requirements and Note
  8, page 7, 32. Not needed (Article 8) for applications to remove or vary a condition, to extend the
  time limit, for engineering or mining operations, for a material change of use, or for waste development.
review-status: unverified
field-status: {}
