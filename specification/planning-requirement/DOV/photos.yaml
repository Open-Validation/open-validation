reference: photos
local-authority: DOV
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - listed-building
      - conservation-area
      - area-of-outstanding-natural-beauty
      description: Works involving the demolition of a listed building; affecting a conservation area
        or listed building; development affecting the AONB.
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
source-text: Major Development Proposals and/or works involving the demolition of a listed building; affecting
  a conservation area or listed building; development affecting AONB or development affecting important
  viewpoints
must-include:
- item: Dated, numbered and cross-referenced to a plan showing the site and its context
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Photographs
  and Photomontages), page 20-21. 'Development affecting important viewpoints' has no defined list, so
  it is shown as discretionary.
review-status: unverified
field-status: {}
