reference: photos
local-authority: DOV
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - listed-building
      - conservation-area
      - area-of-outstanding-natural-beauty
      description: Works involving the demolition of, or affecting, a listed building; affecting a conservation
        area; or affecting the AONB.
  - condition:
      field: parking-change
      value: true
      description: The development affects parking provision.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
source-text: Photographs and Photomontages Validation Requirement Major Development Proposals and/or works
  involving the demolition of a listed building; affecting a conservation area or listed building; development
  affecting AONB or development affecting parking provision.
confidence: medium
notes: 'Audit (wrong_app_type): not only listed building consent; this covers major development, conservation
  areas, AONB and parking changes.'
review-status: unverified
field-status: {}
