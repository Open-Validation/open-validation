policy: Dover District Council Statement of Community Involvement
source-text: A Statement of Community Involvement will normally only be required for major development
  applications or other applications which are of importance to the local community.
must-include:
- item: How the applicant has complied with the pre-application consultation requirements of the Council's
    adopted Statement of Community Involvement
  level: must
- item: That the views of the local community have been sought and taken into account
  level: must
