reference: affordable-housing-statement
local-authority: DOV
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 5
    description: Schemes of 5 units or more (new build and conversions).
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Dover District Core Strategy 2010 policy DM5; Affordable Housing SPD
source-text: All applications that generate the need for affordable housing ... Core Strategy Policy DM5
  seeks all schemes of 5 units or more to make provision for affordable housing. ... Any application must
  provide an Affordable Housing Statement and be accompanied with a Site Proforma to set out the financial
  contribution required; if affordable housing is not to be provided on site. This applies to both new
  build properties and conversions.
must-include:
- item: What, if any, provision is to be made for affordable housing, including the location, number and
    mix of units, the numbers of habitable rooms and bedrooms or the unit floor space, and any financial
    contribution
  level: must
- item: A Site Proforma setting out the financial contribution required
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing is not to be provided on site.
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 11,
  page 9-10, 35. Policy DM5 asks for 30% affordable homes on schemes of 15 or more dwellings; 5 to 14
  units may provide on-site homes or a financial contribution. The list predates the Dover District Local
  Plan to 2040 (adopted October 2024), so the policies it cites have since been replaced.
review-status: unverified
field-status: {}
