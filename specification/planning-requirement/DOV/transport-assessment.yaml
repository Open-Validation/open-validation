reference: transport-assessment
local-authority: DOV
required-if: discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF; Dover District Core Strategy 2010 policy DM13
source-text: Developments likely to have a significant impact on traffic congestion, transportation, or
  parking
must-include:
- item: Accessibility to the site by all modes and the likely modal split of journeys
  level: must
- item: Proposed measures to improve access by public transport, walking and cycling, to reduce the need
    for parking and to mitigate transport impacts
  level: must
- item: Existing trip levels and evidence that the fallback position is relevant, where a fallback position
    is proposed
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Transport
  Statement/Assessment/Travel Plan) and Note 32, page 26, 48. The list gives no threshold ('generally,
  but not exclusively, ... larger scale developments'; DfT indicative thresholds; agree scope with the
  Highway Authority), so it is shown as discretionary. The list predates the Dover District Local Plan
  to 2040 (adopted October 2024), so the policies it cites have since been replaced.
