reference: location-plan
local-authority: DOV
required-if:
  always: true
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must be accompanied by a site location plan based upon an up to date map
  at a scale of 1:1250 or 1:2500.
must-include:
- item: Up to date map at a scale of 1:1250 or 1:2500
  level: must
- item: Scale bar, scale and paper size
  level: should
- item: Where possible, at least two named roads and surrounding buildings, named or numbered
  level: should
- item: Application site clearly edged with a red line, including all land required to carry out the development,
    including access to the highway
  level: must
- item: Any other land within the control or ownership of the applicant adjacent or close to the site
    edged with a blue line
  level: should
- item: An Ordnance Survey plan must be licensed
  level: should
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), National Requirements and Note
  2, page 6, 31.
review-status: unverified
field-status: {}
