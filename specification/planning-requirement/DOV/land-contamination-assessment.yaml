reference: land-contamination-assessment
local-authority: DOV
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: New development with a sensitive end use (e.g. residential, nurseries, schools), whatever
        the site history.
  - all:
    - site:
        in:
        - contaminated-land
        description: On land which adjoins an affected contamination site, or where contamination is known
          or suspected, or in the vicinity of such land.
    - any:
      - condition:
          field: new-build
          value: true
          description: New development.
      - condition:
          field: ground-disturbance
          value: true
          description: Ground works are proposed.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF
source-text: For all new development with a sensitive end use (e.g. residential, nurseries, schools) a
  minimum of a Preliminary Risk Assessment (PRA) will be required regardless of the history of the site,
  contaminated or otherwise. Also, for all new developments on land which adjoins an affected contamination
  site a PRA will be required as a minimum. ... Also, for all new developments where contamination is
  known, or suspected, or the development is in the vicinity of such land, and ground works are proposed
  a PRA will be required as a minimum.
must-include:
- item: Carried out by a Competent Person (as defined by the NPPF)
  level: must
- item: A desk study listing current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
- item: A preliminary conceptual site model showing all potential pollutant linkages, with a preliminary
    risk assessment of them
  level: must
- item: Site Investigation and Risk Assessment and Remediation Strategy, depending on the site, the end
    use and the potential for contamination
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 19,
  page 17-18, 43-44. Applicants must contact envhealth@dover.gov.uk before submitting. Whether more than
  a PRA is needed is the environmental health officer's advice, so that item is discretionary.
review-status: unverified
field-status: {}
