reference: elevation-existing
local-authority: DOV
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The proposal creates a new building.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the external appearance of the property.
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use applications (the list includes them).
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve the creation of new or changes to the external appearance of
  the property (this includes change of use applications)
must-include:
- item: Scale of 1:50 or 1:100, with a scale bar, scale and paper size
  level: must
- item: All relevant external sides of the proposal, including blank elevations
  level: must
- item: Proposed building materials and the manufacturer, where known
  level: should
- item: Where an elevation adjoins or is close to another building, the relationship between the two and
    the positions of openings on each
  level: should
- item: Street scene elevation, its extent depending on the scale and nature of the development (not householder)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), National Requirements and Note
  4, page 6, 31. Existing elevations only where there is an existing building.
review-status: unverified
field-status: {}
