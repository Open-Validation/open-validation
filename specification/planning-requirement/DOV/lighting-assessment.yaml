reference: lighting-assessment
local-authority: DOV
required-if:
  condition:
    field: external-lighting
    value: true
    description: Development involving the provision of external lighting.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF; Dover District Local Plan policy ER6; Dover District Core Strategy 2010 policy CP4
source-text: Development involving the provision of external lighting
must-include:
- item: The number, type (e.g. wall mounted or free-standing columns), location and intensity of any lighting
    installation
  level: must
- item: The hours when the lighting would be switched on
  level: must
- item: Layout plan with beam orientation, schedule of the equipment in the design, and lighting diagram
    showing the intensity of illumination
  level: must
- item: Lighting impact study for floodlighting, particularly for sports grounds, near homes, in open
    countryside (especially AONB) or in sensitive buildings
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 21,
  page 18, 44. The lighting impact study 'may be required', so that item is discretionary. The list predates
  the Dover District Local Plan to 2040 (adopted October 2024), so the policies it cites have since been
  replaced.
review-status: unverified
field-status: {}
