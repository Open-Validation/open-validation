reference: floor-plan-proposed
local-authority: DOV
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The proposal creates new floorspace.
  - condition:
      field: building-works
      value: true
      description: The proposal changes the floor plans of a property.
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve the creation of new or changes to the floor plans of a property
must-include:
- item: Scale of 1:50 or 1:100, with a scale bar, scale and paper size
  level: must
- item: Each relevant floor and the roof
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: The development in context with the site boundary and existing adjacent buildings, including property
    numbers or names where appropriate
  level: should
- item: 'For change of use: floor plans where needed to show the extent of the use and its relationship
    to adjacent development'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use of part of a floor or building.
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), National Requirements and Note
  5, page 6, 32.
review-status: unverified
field-status: {}
