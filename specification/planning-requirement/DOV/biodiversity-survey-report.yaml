reference: biodiversity-survey-report
local-authority: DOV
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Change of use, modification or demolition of buildings with bat or other protected-species
        potential listed in Note 13 (e.g. pre-1960 buildings within 200m of woodland or water; tunnels,
        kilns, cellars; bridges), or lighting near woodland or water.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Works affecting woodland, hedgerows or lines of trees with a connection to woodland
        or water.
  - condition:
      field: veteran-trees
      value: true
      description: Felling or lopping of veteran trees, trees with cracks, holes or cavities, or trees
        over 1m diameter at chest height.
  - all:
    - ref: major-development
    - condition:
        field: near-watercourse
        value: true
        description: Within 500m of a pond, or 200m of rivers, streams, canals, lakes or other aquatic
          habitats.
  - condition:
      field: near-watercourse
      value: true
      description: Minor proposals within 100m of a pond or adjacent to rivers, streams, canals, lakes
        or other aquatic habitats.
  - site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      - ancient-woodland
      description: Would affect an SPA, SAC, Ramsar site, SSSI, Local Wildlife Site/SNCI, LNR, NNR or
        Ancient Woodland.
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Conservation of Habitats and Species Regulations 2010; Wildlife and Countryside Act 1981; Circular
  06/2005
source-text: Applications that involve the change of use/modification/demolition (including in part) of
  the following buildings must provide a protected species survey, assessment and mitigation report, unless
  an exception applies. ... Applications that would affect the following must provide a protected species
  survey, assessment and mitigation report, unless an exception applies. ... Applications that would affect
  any of the following must provide an ecological survey assessment and mitigation report, unless and
  exception applies.
must-include:
- item: Protected species survey, assessment and mitigation report
  level: must
- item: Undertaken by a suitably qualified person, in accordance with relevant and up-to-date good practice
    guidelines
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 13,
  page 11, 37-39. Other features in Note 13 (veteran trees, trees and scrub used by nesting birds, quarries
  and cliffs, urban greenspace) are covered by 'discretionary'. Waived if the council confirms in writing
  at pre-application stage that it is not needed, if a reasoned risk assessment by a suitably qualified
  person shows no protected species would be affected, or (for SPA, SAC, SSSI) if Natural England confirms
  in writing. The separate geological survey is in the unmapped list.
review-status: unverified
field-status: {}
