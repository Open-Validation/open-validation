reference: section-proposed
local-authority: DOV
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels, or the site slopes.
  - discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Section drawings should be drawn at a scale of 1:20/1:50/1:100 showing cross sections through
  the proposed buildings and must be submitted in the following cases: Where a proposal involves a change
  in ground levels drawings should be submitted to show both the existing and finished levels On sloping
  sites ... Section drawings may also be requested in other cases by the planning office.'
must-include:
- item: Scale of 1:20, 1:50 or 1:100, with a scale bar, scale and paper size
  level: must
- item: Both the existing and finished levels
  level: must
- item: 'On sloping sites: alterations to levels, how the proposal sits within the site and the relative
    levels between existing and proposed buildings'
  level: must
- item: Existing site levels and finished floor levels related to a fixed datum point off-site, and the
    proposals in relation to adjoining buildings
  level: should
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), National Requirements and Note
  6, page 7, 32-33. 'May also be requested in other cases by the planning office' is shown as discretionary.
review-status: unverified
field-status: {}
