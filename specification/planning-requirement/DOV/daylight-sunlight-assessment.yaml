reference: daylight-sunlight-assessment
local-authority: DOV
required-if: discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF
source-text: Applications may need to be accompanied by a daylight/sunlight assessment in circumstances
  where there is a potential adverse impact upon the current levels of sunlight/daylight enjoyed by adjoining
  properties or buildings, including associated gardens or amenity space. An assessment may also be required
  in situations where the application site itself is subject to potential adverse impact from adjoining
  buildings or features or where one part of the development is affected by another part of the same development.
must-include:
- item: Carried out in accordance with the BRE document Site Layout Planning for Daylight and Sunlight
  level: must
- item: Daylight, vertical sky component, sunlight availability and shadow study, assessed against the
    BRE criteria
  level: must
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements and Note 14,
  page 11-12, 39. 'Potential adverse impact' is a judgement, so it is shown as discretionary.
