reference: site-plan
local-authority: DOV
required-if:
  always: true
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications should include a block plan at a scale of either 1:200 (Householder Application)
  or 1:500 (Other Applications).
must-include:
- item: Scale of 1:200 for householder applications or 1:500 for other applications
  level: should
- item: The direction of north
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjacent to the site
  level: should
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), National Requirements (Block Plan)
  and Note 3, page 6, 31. The table says 'All application types'.
