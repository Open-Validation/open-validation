reference: sustainable-drainage-strategy
local-authority: DOV
required-if: discretionary
source-url: https://www.dover.gov.uk/Planning/Planning-Applications/PDF/Validation-Requirements.pdf
policy: NPPF; Circular 03/99
source-text: A surface water drainage assessment will be required for those developments that are likely
  to generate significant increase in the flow of water across and from the site. ... If there is a known
  drainage or localised flooding problem and an assurance from the developer is needed that sewer capacity
  and flood risk from surface water have been addressed
must-include:
- item: Surface water run-off controlled as near to its source as possible through a sustainable drainage
    (SUDS) approach
  level: should
confidence: medium
notes: From the council's list (adopted July 2014, amended April 2015), Local Requirements (Foul Sewage
  and Utilities Assessment) and Note 17, page 14, 40-41. The surface water part of Dover's Foul Sewage
  and Utilities Assessment. 'Significant increase in the flow of water' and 'known drainage problem' are
  judgements, so it is shown as discretionary. The foul sewage and utilities parts are in the unmapped
  list.
