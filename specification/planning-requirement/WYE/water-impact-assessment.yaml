reference: water-impact-assessment
local-authority: WYE
required-if:
  any:
  - condition:
      field: hydro-scheme
      value: true
      description: Hydropower development.
  - condition:
      field: watercourse-culverting
      value: true
      description: Physical modifications to a water body (diversion, culverting, realignment), bridge
        crossings over watercourses, dams and impoundments, dredging.
  - all:
    - condition:
        field: eia-development
        value: true
        description: EIA development.
    - discretionary
  - condition:
      field: underground-storage-tanks
      value: true
      description: 'Underground storage of pollutants (petrol filling stations, oil storage, cemeteries):
        groundwater assessment.'
  - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'A WFD assessment is normally required for development works, including: Hydropower development
  Transport and Highway schemes that involve physical modifications to a water body (e.g. diversion, culverting,
  realignment etc) Bridge crossings over watercourses Flood defence works and flood alleviation schemes
  Environmental Impact Assessment (EIA) development deemed to have likely significant effects on the water
  environment Dams and other impoundments Water transmission and treatment infrastructure Wastewater treatment
  infrastructure Dredging activities ... A groundwater assessment (including groundwater level and depth
  to the water table) will be required for any development involving underground storage of pollutants,
  including petrol filling stations, oil storage and cemeteries.'
must-include:
- item: 'For underground storage of pollutants: groundwater level and depth to the water table'
  level: must
  required-if:
    condition:
      field: underground-storage-tanks
      value: true
      description: Underground storage of pollutants.
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Water Framework
  Directive Assessment; Groundwater Assessment). A WFD assessment is 'normally required' for the listed
  works; flood defence works, water transmission and treatment infrastructure, wastewater treatment works
  and EIA development with likely significant effects on water need judgement, so a discretionary part
  is kept.
review-status: unverified
field-status: {}
