reference: affordable-housing-statement
local-authority: WYE
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Use Class C3 housing delivering a net gain of 10 units or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: The site has an area of 0.5 hectares or more.
    - site:
        in:
        - rural-area
        description: Proposed rural housing developments.
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'Affordable Housing Statement/Plan (for Full and Reserved Matters) A statement will be required
  for applications for: for all Use Class C3 housing proposals delivering a net gain of 10 units or more,
  or where the site has an area of 0.5 hectares or more. on entry level exception sites on proposed rural
  housing developments Where a proposal meets the contribution and tenure requirements of the Local Plan,
  a Housing Tenure Plan will be sufficient to demonstrate compliance.'
confidence: medium
notes: 'Audit (wrong_app_type): the heading says Full and Reserved Matters; the workbook had Reserved
  matters only. Entry level exception sites have no field, so they are shown as officer discretion.'
review-status: unverified
field-status: {}
