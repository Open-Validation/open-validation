reference: affordable-housing-statement
local-authority: WYE
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Use Class C3 housing delivering a net gain of 10 units or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site of 0.5 hectares or more.
    - condition:
        field: exception-site-housing
        value: true
        description: An entry level exception site.
    - all:
      - site:
          in:
          - rural-area
          description: In the rural area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Proposed rural housing development.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Wyre Forest District Local Plan 2016-2036
source-text: 'A statement will be required for applications for: for all Use Class C3 housing proposals
  delivering a net gain of 10 units or more, or where the site has an area of 0.5 hectares or more. on
  entry level exception sites on proposed rural housing developments'
must-include:
- item: Information on both the affordable housing and any open market housing proposed
  level: must
- item: Number, mix and tenure of units
  level: must
- item: Gross internal floor area per unit in square metres
  level: must
- item: How the proposal complies with relevant development plan policy
  level: must
- item: Where a financial contribution is proposed instead of on-site provision, a clear statement saying
    so and why this is acceptable
  level: must
  required-if:
    condition:
      field: affordable-housing-commuted-sum
      value: true
      description: A financial contribution is proposed in lieu of on-site provision.
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Affordable
  Housing Statement/Plan, for Full and Reserved Matters). Where a proposal meets the Local Plan's contribution
  and tenure requirements, a Housing Tenure Plan is enough. Also listed in Checklist 16 (major residential).
  A viability assessment is needed if fewer affordable units are proposed (see viability-assessment).
  'Rural housing developments' is read as housing in the rural area.
review-status: unverified
field-status: {}
