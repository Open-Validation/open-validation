reference: viability-assessment
local-authority: WYE
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The applicant considers cost constraints prevent the 25% affordable housing expectation.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant considers cost constraints prevent meeting other planning obligations
        and requirements.
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: agricultural-building-reuse
          value: true
          description: A barn conversion under Local Plan Policy DM.29 (Checklist 4).
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Wyre Forest District Local Plan 2016-2036
source-text: A full viability assessment must be submitted with applications where the applicant considers
  that there are significant cost constraints affecting a development site and that these are sufficient
  to impede the developer meeting the Council’s affordable housing policy expectations of 25% on residential
  or other planning obligations and requirements on development sites, they will be expected to demonstrate
  that the viability of the proposals would be jeopardised by this level of provision. ... Viability/marketing
  (economic use) evidence (as required by Local Plan policy)
must-include:
- item: 'Presented on a residual land value or profit basis: projected sales revenues and values (including
    affordable housing) giving a Gross Development Value, less Gross Development Costs'
  level: should
- item: Either a fixed site value with the developer's return compared to a benchmark profit level, or
    a fixed developer's return with the residual land value compared to the site's benchmark market value
  level: should
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Viability
  Assessment), and Checklists 4 and 16. The methodology should be agreed at pre-application stage, and
  the developer pays for any independent review. For barn conversions, viability/marketing evidence is
  needed 'as required by Local Plan policy' (discretionary).
review-status: unverified
field-status: {}
