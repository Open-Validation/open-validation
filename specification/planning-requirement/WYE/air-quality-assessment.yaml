reference: air-quality-assessment
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - all:
    - discretionary
    - site:
        in:
        - air-quality-management-area
        description: Significant vehicle movements through an Air Quality Management Area (AQMA).
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'An air quality assessment is required: For all major planning application proposals where
  the development could result in significant vehicle movements through an Air Quality Management Area
  (AQMA)'
must-include:
- item: The existing air quality (baseline)
  level: should
- item: A prediction of future air quality without the development (future baseline)
  level: should
- item: The impacts of the development during construction (construction phase)
  level: should
- item: A prediction of future air quality with the development (operational phase)
  level: should
- item: Measures to mitigate and manage impact
  level: should
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Air Quality
  Assessment). Whether vehicle movements through an AQMA are 'significant' is the council's judgement,
  so that part is discretionary (the site condition stands for traffic passing through an AQMA). The methodology
  and datasets should be agreed with Worcestershire Regulatory Services first. Also listed 'where applicable'
  in Checklist 15.
review-status: unverified
field-status: {}
