reference: air-quality-assessment
local-authority: WYE
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'An air quality assessment is required: For all major planning application proposals where
  the development could result in significant vehicle movements through an Air Quality Management Area
  (AQMA)'
must-include:
- item: The existing air quality (baseline)
  level: must
- item: A prediction of future air quality without the proposed development (future baseline)
  level: must
- item: The impacts of the development during construction (construction phase)
  level: must
- item: A prediction of future air quality with the development
  level: must
confidence: medium
notes: Major applications (including outline, per the audit) where the development could result in significant
  vehicle movements through an AQMA; that part has no field, so it is officer discretion within majors.
review-status: unverified
field-status: {}
