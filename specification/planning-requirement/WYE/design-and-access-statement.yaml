reference: design-and-access-statement
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (World Heritage Site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) with a floor space of 100 square metres or more.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications for major development, as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015 (as amended). Applications for listed building
  consent. Applications for development in a designated area (World Heritage Site or a conservation area),
  where the proposed development consists of: one or more dwellings; or building(s) with a floor space
  of 100 square metres or more.'
must-include:
- item: The design principles and concepts applied, and how the development's context has influenced the
    design
  level: should
- item: The approach to access and how relevant Local Plan policies have been taken into account; any
    consultation on access issues and how it informed the development
  level: should
- item: How any specific issues which might affect access to the development have been addressed
  level: should
- item: Details of the existing surface water drainage system, including its current condition
  level: should
- item: 'For applications affecting the historic environment: how the development takes account of the
    significance of heritage assets, their special interests and setting'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, National Requirements. Also listed
  in Checklist 15 (major commercial/industrial). The list says a DAS isn't needed for waste development,
  a material change of use, engineering or mining operations, or to amend conditions.
review-status: unverified
field-status: {}
