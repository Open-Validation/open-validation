reference: biodiversity-survey-report
local-authority: WYE
required-if:
  any:
  - any:
    - condition:
        field: potential-roost-features
        value: true
        description: The roof of a pre-1960 building, or agricultural buildings of brick or stone or with
          wooden beams over 20cm thick, or bridges.
    - condition:
        field: near-watercourse
        value: true
        description: Within 100m of water bodies.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees (including fruit trees).
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedgerows.
    - condition:
        field: underground-structures
        value: true
        description: Underground structures.
    - condition:
        field: semi-natural-habitat-impact
        value: true
        description: Natural rock features, or pastures and grassed areas that are not part of a lawn.
    - condition:
        field: protected-species
        value: true
        description: Protected species are known to be present (bats, badgers, reptiles, amphibians, dormice).
    - site:
        in:
        - site-of-special-scientific-interest
        - local-nature-reserve
        - local-wildlife-site
        description: Adjacent to a Site of Special Scientific Interest, Local Nature Reserve or Local
          Wildlife Site.
    - condition:
        field: adjoins-allotment-or-railway
        value: true
        description: Adjacent to an allotment or railway.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-forestry-building
        description: An agricultural or forestry building (Checklist 2).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-workers-dwelling
        description: An agricultural worker's dwelling (Checklist 3).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: agricultural-building-reuse
        value: true
        description: A barn conversion under Local Plan Policy DM.29 (Checklist 4).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use (Checklist 7).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: equestrian
        description: Equestrian development (Checklist 10).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: live-work
        description: Live/work units (Checklist 14).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial/industrial development (Checklist 15).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: solar-panels
        value: true
        description: Solar panels (Checklist 24).
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'A Preliminary Ecological Assessment (PEA) produced by a suitably qualified ecologist will
  be required if the application is likely to effect: Roof of a pre-1960 building Within 100m of water
  bodies Trees, hedgerows Fruit trees Agricultural buildings of brick or stone construction or with wooden
  beans greater than 20cm thickness Underground structures Bridges Natural rock features Pastures and
  grassed areas that are not part of a lawn If there is known to be protected species, such as bats, badgers,
  reptiles, amphibians or dormice If the application site is adjacent to a Site of Special Scientific
  Interest, Local Nature Reserve, Local Wildlife Site, allotment or railway'
must-include:
- item: Produced by a suitably qualified ecologist
  level: must
- item: Any further surveys the PEA recommends, carried out before submission and validation
  level: must
  required-if: discretionary
  source-text: The PEA may recommend additional surveying this will need to be conducted prior to submission
    and validation.
- item: A mitigation plan showing how the application will achieve a net gain in biodiversity
  level: should
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Preliminary
  Ecological Assessment). The PEA is also listed without conditions (with the BNG metric) in checklists
  2, 3, 4, 7, 10, 14, 15, 16, 17 and 24, and 'where applicable' or 'where necessary' in checklists 8,
  11 and telecommunications. 'Adjacent to an allotment or railway' needs a new field. Development checklists
  (agricultural buildings, barn conversions, change of use, equestrian, HMO, live/work, major commercial,
  major residential, minor residential, annexes, solar, telecoms) are shown as full planning applications;
  the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
