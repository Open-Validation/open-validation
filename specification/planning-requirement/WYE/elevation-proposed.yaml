reference: elevation-proposed
local-authority: WYE
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - advertising
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-forestry-building
        description: An agricultural or forestry building (Checklist 2).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-workers-dwelling
        description: An agricultural worker's dwelling (Checklist 3).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: agricultural-building-reuse
        value: true
        description: A barn conversion under Local Plan Policy DM.29 (Checklist 4).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use (Checklist 7).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: equestrian
        description: Equestrian development (Checklist 10).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: hmo-creation
        value: true
        description: A house in multiple occupation (Checklist 12).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: live-work
        description: Live/work units (Checklist 14).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial/industrial development (Checklist 15).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  - all:
    - application-type:
        in:
        - full
        - hh
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe (Checklist 22).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: solar-panels
        value: true
        description: Solar panels (Checklist 24).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development needing full planning permission.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Proposed Elevation Plans at a scale of 1:100 or 1:50 ... Existing and proposed elevation
  plans to scale 1:100 or 1:50
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Any proposed raised platforms, and the height of existing boundary treatment where necessary
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: showing any proposed raised platforms and indication of height of existing boundary treatment
    where necessary
confidence: medium
notes: From the council's list (last updated January 2025), Part 1 checklists 1, 2, 3, 4, 6, 7, 10, 11,
  12, 13, 14, 15, 16, 17, 22, 24 and telecommunications. The telecommunications checklist gives no scale.
  Development checklists (agricultural buildings, barn conversions, change of use, equestrian, HMO, live/work,
  major commercial, major residential, minor residential, annexes, solar, telecoms) are shown as full
  planning applications; the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
