source-text: 'Block Plan at a scale of 1:500 or 1:200 ... Block Plan At a Glance Normal Scales: 1:200
  and 1:500 Paper Size: A4 or A3 Coverage: 36m x 36m or larger File Type: PDF or Printed copies Must include:
  North Arrow, Scale, Licence Number Colour Format: Colour Should show entire development site'
