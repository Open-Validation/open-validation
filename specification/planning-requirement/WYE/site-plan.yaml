confidence: medium
notes: From the council's list (last updated January 2025), Part 1 checklists, and Annex E (block plan
  at a glance). Listed in every checklist except demolitions, non-material amendments, section 73 and
  tree works. The removal of an agricultural occupancy condition checklist asks for a block plan at 1:100
  or 1:50. Annex A gives the council's minimum dimensions for a dropped kerb (guidance on what will be
  approved, not validation). Development checklists (agricultural buildings, barn conversions, change
  of use, equestrian, HMO, live/work, major commercial, major residential, minor residential, annexes,
  solar, telecoms) are shown as full planning applications; the list doesn't give separate outline checklists.
