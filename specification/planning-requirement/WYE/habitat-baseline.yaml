notes: 'From the council''s list (last updated January 2025), Part 2, Local List Requirements (Biodiversity
  Net Gain Metric and net gain plan). The legal rule is shown: applications subject to the general biodiversity
  gain condition. The list itself names the exemptions (householder development, section 73 where the
  original permission had no BNG, permitted development, sites with no biodiversity value, de minimis,
  small self-build, biodiversity gain sites). The Part 1 checklists for agricultural buildings, agricultural
  workers'' dwellings, barn conversions, change of use, equestrian, live/work, major and minor development
  and solar list ''PEA, BNG metric and draft BNG Plan''; the draft BNG Plan is listed as unmapped. The
  list doesn''t name the habitat plan separately; it is part of the national information the BNG metric
  needs.'
