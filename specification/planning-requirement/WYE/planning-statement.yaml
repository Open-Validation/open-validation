reference: planning-statement
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposed development would be contrary to the Development Plan.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: A Planning Statement will be required for all applications for a major development or where
  the proposed development would be contrary to the Development Plan.
must-include:
- item: Evidence that the site has been actively marketed for at least a 12 month continuous period
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: The proposal involves the loss of community facilities.
  source-text: If loss of community facilities, this also needs to be contained in the planning statement
    with evidence that the site has been actively marketed for at least a 12 month continuous period
confidence: medium
notes: 'Audit (wrong_app_type): also applies to outline majors.'
review-status: unverified
field-status: {}
