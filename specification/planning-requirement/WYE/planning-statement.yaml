reference: planning-statement
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: The development would be contrary to the Development Plan.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-forestry-building
        description: An agricultural or forestry building (Checklist 2).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-workers-dwelling
        description: An agricultural worker's dwelling (Checklist 3).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: live-work
        description: Live/work units (Checklist 14).
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: agricultural-occupancy
        description: Removal of an agricultural occupancy condition (Checklist 21).
  - all:
    - application-type:
        in:
        - full
        - hh
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe (Checklist 22).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development needing full planning permission.
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One to nine dwellings (Checklist 17).
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: One to nine dwellings (Checklist 17).
    - any:
      - condition:
          field: outside-urban-area
          value: true
          description: Land beyond the settlement boundary.
      - condition:
          field: loss-of-use
          value: true
          description: Loss of community facilities.
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: solar-panels
          value: true
          description: Solar panels (Checklist 24).
    - site:
        in:
        - green-belt
        description: In the Green Belt.
  - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Wyre Forest District Local Plan 2016-2036
source-text: 'A Planning Statement will be required for all applications for a major development or where
  the proposed development would be contrary to the Development Plan. ... A planning statement is required
  for: - all major planning application proposals - applications where a planning justification, assessment
  or interpretation is required.'
must-include:
- item: The context, and an explanation of the principles behind the development
  level: must
- item: An assessment of how the proposal complies with relevant national and development plan policies,
    including supplementary planning guidance and documents
  level: must
- item: A clear need for the building for agriculture or forestry, and the reason for its siting
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-forestry-building
        description: An agricultural or forestry building (Checklist 2).
  source-text: Planning Statement which sets out a clear need for the proposed building for the purposes
    of agriculture or forestry and the reason for the proposed siting
- item: The proposed business use/need
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-workers-dwelling
        description: An agricultural worker's dwelling (Checklist 3).
  source-text: Planning Statement explaining the proposed business use/need
- item: The proposed work use
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: live-work
        description: Live/work units (Checklist 14).
  source-text: Planning Statement to describe the proposed work use
- item: A Statement of Community Involvement
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
  source-text: Planning Statement including Statement of Community Involvement
- item: How it meets Policy SP.11 Rural Housing Needs
  level: must
  required-if:
    all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One to nine dwellings (Checklist 17).
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: One to nine dwellings (Checklist 17).
    - condition:
        field: outside-urban-area
        value: true
        description: Beyond the settlement boundary.
  source-text: Planning Statement to state how it meets SP.11 Rural Housing Needs if it relates to land
    beyond the settlement boundary.
- item: Evidence that a community facility site has been actively marketed for at least a continuous 12
    months
  level: must
  required-if:
    all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One to nine dwellings (Checklist 17).
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: One to nine dwellings (Checklist 17).
    - condition:
        field: loss-of-use
        value: true
        description: Loss of community facilities.
  source-text: If loss of community facilities, this also needs to be contained in the planning statement
    with evidence that the site has been actively marketed for at least a 12 month continuous period
- item: Evidence of at least 12 months' active marketing to rural workers by a specialist or local agent
    at a price reflecting the occupancy condition, and that no financially viable interest has been expressed,
    supported by a letter from the agent (dates, price, enquiries, viewings, offers and why refused, price
    reductions)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: agricultural-occupancy
        description: Removal of an agricultural occupancy condition (Checklist 21).
  source-text: 'Planning Statement which includes evidence of: · active marketing to rural workers or
    potential rural works employed locally, by a local or specialist estate agent that are familiar with
    the marketing of rural workers dwellings, for a period of at least 12 months, at a price which reflects
    the existence of an occupancy condition, · and evidence to demonstrate that there is no financially
    viable interest has been expressed from within the District or adjoining Parishes. This evidence should
    be supported by a letterheaded document from the estate agent/s advising of when the property was
    put on the market and for what price, the number of enquiries, viewings and offers (if any) and why
    these offers were turned down (if applicable), any reduction in price and the number of enquiries,
    viewings and offers that were submitted (if any) and why these were turned down (if applicable).'
- item: Why annex accommodation is needed on site, and, for a detached annex, why it could not be an extension
    to the main dwelling (Policy SP.13)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - hh
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe (Checklist 22).
  source-text: 'Planning Statement containing: · Details of why residential annex accommodation is required
    on site · If residential annex is to be provided in a detached building separate to the main dwellinghouse,
    a statement to explain why the annex could not be provided as an extension to the main dwellinghouse
    in line with the recommendation of Local Plan Policy SP.13'
- item: The public benefits
  level: must
  required-if:
    all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: solar-panels
          value: true
          description: Solar panels (Checklist 24).
    - site:
        in:
        - green-belt
        description: In the Green Belt.
  source-text: If the Development falls within the Green Belt, then a Planning Statement will be required
    to set out the public benefits
- item: Why the site was chosen and which alternatives (including site sharing) were discounted and why;
    evidence that the ICNIRP Guidelines have been met
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development needing full planning permission.
  source-text: 'Planning Statement setting out: why the specific site has been identified and what alternative
    sites have been discounted including site sharing and reasons why these have been discounted and evidence
    that the International Commission on Non-Ionizing Radiation Protection (ICNIRP) Guidelines have been
    met'
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Planning
  Statement), and Part 1 checklists 2, 3, 7, 14, 15, 16, 17, 21, 22, 24 and telecommunications. 'Applications
  where a planning justification, assessment or interpretation is required' is the council's judgement,
  so a discretionary part is kept. It can be combined with the design and access statement and heritage
  statement.
review-status: unverified
field-status: {}
