reference: section-proposed
local-authority: WYE
required-if:
  any:
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Internal illumination is proposed.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: solar-panels
        value: true
        description: Solar panels (Checklist 24).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: Relating to a Listed Building and/or within the Conservation Area.
    - condition:
        field: external-alterations
        value: true
        description: Replacement doors and windows.
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Proposed Cross Section Plans (at a scale of 1:100 or 1:50) if internal illumination is proposed.
  ... For any Householder Application that involves replacement doors and windows, section drawings at
  the scale of 1:20 should be provided. ... Cross Section plans to scale 1:100 or 1:50 (where applicable)
  ... Cross section plans
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
  required-if:
    any:
    - application-type:
        in:
        - advertising
    - application-type:
        in:
        - lbc
- item: Section drawings of the replacement doors and windows at 1:20
  level: should
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: Relating to a Listed Building and/or within the Conservation Area.
confidence: medium
notes: From the council's list (last updated January 2025), Part 1 checklists 1 (advertisements), 11 (householder),
  13 (listed building consent) and 24 (solar). For listed building consent only 'where applicable', so
  that part shows as discretionary.
review-status: unverified
field-status: {}
