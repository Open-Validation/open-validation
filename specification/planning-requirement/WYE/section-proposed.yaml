reference: section-proposed
local-authority: WYE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: Householder development relating to a listed building and/or within a conservation
          area, involving replacement doors and windows.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is internally illuminated.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: Householder Development relating to a Listed Building and/or within the Conservation Area
  For any Householder Application that involves replacement doors and windows, section drawings at the
  scale of 1:20 should be provided.
must-include:
- item: Section drawings at a scale of 1:20 of replacement doors and windows
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'From the audit (missing_requirement, wrong_app_type): Checklist 13 (LBC) asks for cross-sections
  where applicable, and Checklist 1 (adverts) for cross-section plans if internally illuminated. The householder
  rule applies only to replacement doors and windows.'
