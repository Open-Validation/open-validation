reference: elevation-existing
local-authority: WYE
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: agricultural-building-reuse
        value: true
        description: A barn conversion under Local Plan Policy DM.29 (Checklist 4).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use (Checklist 7).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: hmo-creation
        value: true
        description: A house in multiple occupation (Checklist 12).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial/industrial development (Checklist 15).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevation plans to scale 1:100 or 1:50
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
confidence: medium
notes: From the council's list (last updated January 2025), Part 1 checklists 4, 6, 7, 11, 12, 13, 15,
  16 and 17. For a proposed lawful development certificate only 'where applicable' (discretionary). Development
  checklists (agricultural buildings, barn conversions, change of use, equestrian, HMO, live/work, major
  commercial, major residential, minor residential, annexes, solar, telecoms) are shown as full planning
  applications; the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
