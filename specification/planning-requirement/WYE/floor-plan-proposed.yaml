reference: floor-plan-proposed
local-authority: WYE
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-workers-dwelling
        description: An agricultural worker's dwelling (Checklist 3).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: agricultural-building-reuse
        value: true
        description: A barn conversion under Local Plan Policy DM.29 (Checklist 4).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use (Checklist 7).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: equestrian
        description: Equestrian development (Checklist 10).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: hmo-creation
        value: true
        description: A house in multiple occupation (Checklist 12).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: live-work
        description: Live/work units (Checklist 14).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial/industrial development (Checklist 15).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  - all:
    - application-type:
        in:
        - full
        - hh
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe (Checklist 22).
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed floor layout plans to scale 1:100 or 1:50 ... Proposed floor layout
  plans to scale 1:100 or 1:50 showing NDSS and Adequate natural sunlight/daylight and habitable windows
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Compliance with the Nationally Described Space Standard (NDSS), adequate natural sunlight/daylight
    and habitable windows
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  source-text: showing NDSS and Adequate natural sunlight/daylight and habitable windows
- item: A manager's/warden flat/HMO room, or a statement explaining why one cannot be provided
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: hmo-creation
        value: true
        description: A house in multiple occupation (Checklist 12).
  source-text: A managers/warden flat/HMO room should be included or a statement to explain why a flat/HMO
    room cannot be provided.
- item: 'Green Belt house extensions and replacement dwellings: full calculations of the original volume
    (the dwelling as it stood in 1948) and proposed volume, including previous extensions and outbuildings
    within 5 metres, annotated on the original and proposed building plans'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
    - site:
        in:
        - green-belt
        description: In the Green Belt.
  source-text: Full calculations of the original volume and proposed volume (including any previous extensions*)
    should be annotated on original building and proposed building plans. The Original being taken as
    the dwelling stood in 1948.
- item: 'Green Belt outbuildings/garages: what the building will be used for'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - green-belt
        description: In the Green Belt.
    - condition:
        field: outbuilding
        value: true
        description: An outbuilding or garage.
  source-text: If the proposal includes the erection of an outbuilding/garage, the proposed Floor Plans
    must show what the use of the building will be used for
confidence: medium
notes: From the council's list (last updated January 2025), Part 1 checklists 3, 4, 6, 7, 10, 11, 12,
  13, 14, 15, 16, 17 and 22. Volume 'is taken to mean cubic content', measured externally including roof
  space and basements. Development checklists (agricultural buildings, barn conversions, change of use,
  equestrian, HMO, live/work, major commercial, major residential, minor residential, annexes, solar,
  telecoms) are shown as full planning applications; the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
