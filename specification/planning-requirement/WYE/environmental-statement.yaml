source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: If the project is listed in Schedule 1 of the Town and Country Planning (Environmental Impact
  Assessment) Regulations 2017 an EIA is required. If the development is listed in the first column in
  Schedule 2 of Regulations 2017, a Screening Opinion from the Local Planning Authority should be obtained.
  The Screening Opinion issued by the Local Planning Authority will determine if an EIA is required.
