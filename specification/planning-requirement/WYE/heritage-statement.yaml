reference: heritage-statement
local-authority: WYE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
    - site:
        in:
        - listed-building
        - conservation-area
        description: Relating to a Listed Building and/or within a Conservation Area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - conservation-area
      description: A designated heritage asset (listed building, scheduled monument, conservation area)
        or its setting may be impacted.
  - site:
      in:
      - locally-listed-building
      - historic-environment-record
      - archaeological-priority-area
      description: A non-designated heritage asset (locally listed building, building on the Worcestershire
        HER, site of archaeological interest) may be impacted.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: National Planning Policy Framework
source-text: 'The National Planning Policy Framework requires applicants to describe the significance
  of heritage assets affected by development proposals. Heritage Statements will be required for all applications
  where a heritage asset or its setting may be impacted by the proposed development. A Heritage Statement
  includes: Designated Heritage Assets - Listed buildings, Scheduled Monuments, Conservation Areas. Non-designated
  Heritage Assets - Locally Listed buildings, Buildings recorded on the Worcestershire County Council’s
  Historic Environment Record (HER) and sites of Archaeological interest.'
must-include:
- item: The history and development of the asset, using photographic, map, archival and fabric evidence
  level: should
- item: A photographic record of the site context and the spaces and features which might be affected,
    preferably cross-referenced to survey drawings
  level: should
- item: An assessment of the archaeological, architectural, historical or other significance of the asset
  level: should
- item: 'Normally: an assessment of the impact of the works on the significance of the asset, a statement
    of justification, and any mitigation proposed'
  level: should
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Heritage
  Statement), and Annex F. Listed 'where applicable' in most Part 1 checklists and always for listed building
  consent and householder works to a listed building or in a conservation area (Checklists 11 and 13;
  Checklist 12 for HMOs). Normally prepared by an appropriately qualified historic environment professional.
review-status: unverified
field-status: {}
