source-text: Supporting Photos of Tree(s) to have work undertaken on/removed ... Photographs and Photomontages
  where the proposal involves the demolition of an existing building or development affecting a heritage
  asset, telecommunication mast applications, or proposals affecting views of existing landmarks and/
  or focal points.
must-include:
- item: Photos of the tree(s) to be worked on or removed
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Photographs and photomontages
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: A photograph showing that a notice about the demolition has been posted on site
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
  source-text: A statement and photograph to demonstrate that a notice has been posted on site advising
    of the proposed demolition.
confidence: medium
notes: From the council's list (last updated January 2025), Part 1, Tree Work checklist and Checklists
  8 (demolitions) and 13 (listed building consent). For listed building consent the list names demolition
  or development affecting a heritage asset, telecoms masts and views of landmarks; any listed building
  consent affects a heritage asset.
