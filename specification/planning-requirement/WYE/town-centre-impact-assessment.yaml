reference: town-centre-impact-assessment
local-authority: WYE
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Out of town retail, entertainment or leisure development, or an extension to an existing
          edge or out-of-centre one.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: In excess of 2,500 square metres gross floorspace.
  - all:
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Major commercial/industrial development (Checklist 15).
    - condition:
        field: use-class
        value: leisure
        description: Leisure uses.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: More than 500sqm.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Located outside of the town centres.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'Retail Impact Assessment including a sequential test will be required for applications involving
  a proposed out of town retail, entertainment or leisure development, or an extension to an existing
  edge or out-of-centre retail, entertainment or leisure development in excess of 2,500 square metres
  gross floorspace. ... For Leisure Uses more than 500sqm: A retail impact assessment is required for
  any facilities that are to be located outside of the town centres'
must-include:
- item: A sequential test
  level: must
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Retail Impact
  Assessment), and Checklist 15.
review-status: unverified
field-status: {}
