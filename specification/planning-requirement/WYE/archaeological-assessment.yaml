reference: archaeological-assessment
local-authority: WYE
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: Within, or in the setting of, a Scheduled Ancient Monument.
  - site:
      in:
      - archaeological-priority-area
      description: Within a priority or archaeologically sensitive area.
  - ref: major-development
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: National Planning Policy Framework, section 12 (Conserving and Enhancing the Historic Environment)
source-text: 'An Archaeological assessment is required: if the site or part of the site is within, or
  in the setting of, a Scheduled Ancient Monument or if the site is within a priority or in an archaeologically
  sensitive area. the proposal is a major development application.'
must-include:
- item: A description of the significance of the heritage assets affected and their contribution to the
    site
  level: must
- item: A desk-based assessment of the impact, showing the sources considered and the expertise consulted
  level: must
- item: Relevant supporting documents, such as plans of historic features that may exist on or next to
    the site (listed buildings, structures, historic parks and gardens, historic battlefields)
  level: must
- item: That the impact on heritage assets and their settings has been considered, as in section 12 of
    the NPPF
  level: must
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Archaeological
  Survey/Assessment). It can be combined with the Heritage Statement. If a field evaluation is needed,
  the list recommends discussing it first with Worcestershire County Council's Archaeologist.
review-status: unverified
field-status: {}
