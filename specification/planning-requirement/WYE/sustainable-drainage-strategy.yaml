reference: sustainable-drainage-strategy
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-forestry-building
        description: An agricultural or forestry building (Checklist 2).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: agricultural-workers-dwelling
        description: An agricultural worker's dwelling (Checklist 3).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: agricultural-building-reuse
        value: true
        description: A barn conversion under Local Plan Policy DM.29 (Checklist 4).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: live-work
        description: Live/work units (Checklist 14).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  - all:
    - application-type:
        in:
        - full
        - hh
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe (Checklist 22).
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: use-class
          value: equestrian
          description: Equestrian development (Checklist 10).
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Wyre Forest District Local Plan 2016-2036 policy SP32
source-text: 'Surface Water Drainage Strategy: Policy SP32 of the Adopted Wyre Forest Local Plan requires
  that all new developments incorporate Sustainable Drainage Systems (SuDS). For all major applications
  the Council requires to see a detailed Drainage Strategy that demonstrates how the proposed drainage
  system meets the criteria set out above and how the proposed drainage system will be managed and maintained
  for the lifetime of the development. ... Surface water drainage details'
must-include:
- item: A detailed drainage strategy showing how the system meets the SuDS criteria and how it will be
    managed and maintained for the lifetime of the development
  level: must
  required-if:
    ref: major-development
- item: Details of the existing drainage system on the application drawings, where connecting to it
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development connects to the existing drainage system.
- item: Details of permeability testing on the site, if infiltration drainage is used
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: Infiltration drainage is proposed.
- item: 'For minor and major residential and commercial/industrial development: an assessment showing
    sufficient treatment before discharge, using the simple index approach in the SuDS Manual'
  level: must
  required-if:
    any:
    - ref: major-development
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One to nine dwellings (Checklist 17).
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: One to nine dwellings (Checklist 17).
- item: Assessment of managing surface water wholly or partly by infiltration
  level: should
- item: SuDS designed to the non-statutory technical standards (Defra, 2015) and the WFDC SuDS Design
    and Evaluation Guide (2017), allowing for climate change, urban creep in residential development,
    and green infrastructure and biodiversity improvements
  level: should
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Surface Water
  Drainage Strategy), and Part 1 checklists. The checklists ask for 'surface water drainage details' (householder,
  agricultural buildings and workers' dwellings, live/work, major residential, minor residential, annexes;
  equestrian 'where applicable') or a 'surface water drainage strategy' (barn conversions, major commercial).
  Development checklists (agricultural buildings, barn conversions, change of use, equestrian, HMO, live/work,
  major commercial, major residential, minor residential, annexes, solar, telecoms) are shown as full
  planning applications; the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
