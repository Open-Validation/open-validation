reference: arboriculturist-report
local-authority: WYE
required-if:
  any:
  - all:
    - any:
      - condition:
          field: building-works
          value: true
          description: Building works.
      - condition:
          field: demolition
          value: true
          description: Demolition works.
      - condition:
          field: engineering-operations
          value: true
          description: Engineering works.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees with a stem diameter over 100mm (at 1.5m) within 15m of any operation, on or
          next to the site.
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: A tree survey and arboricultural statement will be required for all developments involving
  building, demolition works or engineering works where there are trees, with a stem diameter of more
  than 100mm (measured at 1.5 metres up the stem), located within 15m of any operation within or on adjacent
  land, to the application site.
must-include:
- item: How tree constraints on and next to the site have been incorporated into the design, and how retained
    trees will be protected during construction and occupancy
  level: should
- item: Produced in line with BS5837:2012 (or later amendments)
  level: must
- item: 'Tree survey drawing and schedule: species, size, age, condition and useful life expectancy, with
    trees, groups and woodlands categorised by quality and value in their existing context'
  level: must
- item: Arboricultural Constraints Plan showing Root Protection Areas and the effect of mature height
    and spread of retained trees, with above-ground (shade) and below-ground constraints
  level: must
- item: 'Tree Protection Plan: a scale drawing by an arboriculturalist showing the final layout, tree
    retention and protection measures'
  level: must
- item: 'Arboricultural Method Statement: site-specific measures to protect retained trees, and the method
    for any work that could harm a tree'
  level: must
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Arboricultural
  Assessment/Tree Survey). Also in Checklist 16 (major residential) without conditions, and 'where applicable'
  in checklists 4, 11, 15, 17 and 24.
review-status: unverified
field-status: {}
