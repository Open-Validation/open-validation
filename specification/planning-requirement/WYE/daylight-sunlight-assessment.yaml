reference: daylight-sunlight-assessment
local-authority: WYE
required-if:
  any:
  - all:
    - condition:
        field: adjoins-residential-property
        value: true
        description: Next to residential property whose daylight/sunlight may be affected.
    - discretionary
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: fails-bre-basic-tests
        value: true
        description: In breach of the 45 degree code and likely to cast a shadow over habitable room windows
          at a neighbouring home.
  - all:
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development (Checklist 16).
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: A Daylight / Sunlight Assessment will be required for all applications where the proposed
  development may affect the current levels of daylight/sunlight enjoyed by occupiers of an adjoining
  residential property. ... Shadow analysis where the development is in breach of the 45 degree code and
  is likely to cast a shadow over habitable room windows at neighbouring residential property
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Daylight/Sunlight
  Assessment), and Part 1 checklists 11 and 16 (shadow analysis). Whether a proposal 'may affect' neighbours'
  daylight is the council's judgement, so it shows as discretionary; for householder applications the
  45 degree code breach is clear.
review-status: unverified
field-status: {}
