reference: recreation-facilities-assessment
local-authority: WYE
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
  - condition:
      field: affects-playing-field
      value: true
      description: Loss of playing field provision.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: A Open Space or Playing field Assessment will be required for applications for a development
  involving the loss of open space or playing field provision. An assessment of community and technical
  need is required which should clearly demonstrate that the open space or playing field provision is
  surplus to requirements; or an alternative/replacement provision of at least equivalent quantity and
  quality would be provided.
must-include:
- item: An assessment of community and technical need showing the provision is surplus to requirements,
    or that replacement provision of at least equivalent quantity and quality would be provided
  level: must
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Open Space
  or Playing Field Assessment).
review-status: unverified
field-status: {}
