reference: land-contamination-assessment
local-authority: WYE
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the site is in the vicinity of such land and
        ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: There is a sensitive end-user.
  - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: information required Contaminated Land Survey and Report A contaminated land survey and report
  is needed where contamination is known or suspected, where the development site is in the vicinity of
  such land and ground works are proposed, where there is a sensitive end-user or where there could be
  harm to drinking water supply, ground and/or surface water.
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Harm to drinking water
