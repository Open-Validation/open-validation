reference: land-contamination-assessment
local-authority: WYE
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected (for example a past contaminative use, petrol filling
        station, or industrial or manufacturing site).
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive end-user (residential, allotments, schools, nurseries and creches, children's
        play areas, playing fields).
  - condition:
      field: agricultural-building-reuse
      value: true
      description: A rural building conversion to another use.
  - condition:
      field: change-in-ground-levels
      value: true
      description: Previous or proposed alterations to the topography of the land, or land nearby, which
        may result in contamination.
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial/industrial development (Checklist 15).
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development (Checklist 16).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One to nine dwellings (Checklist 17).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: One to nine dwellings (Checklist 17).
  - application-type:
      in:
      - cho-commercial-to-dwh
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use (Checklist 7).
    - discretionary
  - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'A contaminated land survey and report is needed where contamination is known or suspected,
  where the development site is in the vicinity of such land and ground works are proposed, where there
  is a sensitive end-user or where there could be harm to drinking water supply, ground and/or surface
  water. Sensitive end-users include residential, allotments, schools, nurseries and creches, children’s
  playing areas and playing fields. Sites that would require a contaminated land survey are: sites with
  a known past potentially contaminative historical land use petrol filling station sites industrial and
  manufacturing sites rural building conversions to other uses sites where previous or proposed alterations
  to the topography of the land, or land nearby, may have, or may result in the land being contaminated.
  ... Contaminated Land Survey and Report ... Land Contamination Assessment'
must-include:
- item: A phased report into the risks from contamination to human health; property (existing and proposed);
    adjoining land, ground and surface waters; and ecological systems and archaeological sites
  level: must
- item: In line with national guidance, forming a preliminary risk assessment
  level: must
- item: Proposed remediation measures where the site is affected by contamination
  level: should
  required-if:
    site:
      in:
      - contaminated-land
      description: The site is affected by contamination.
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Contaminated
  Land Survey and Report). Listed without conditions in Checklists 15, 16, 17 and 20, and 'where applicable'
  in Checklist 7. Sites 'in the vicinity of' contaminated land with ground works, or where drinking water
  or ground and surface water could be harmed, need the council's judgement, so a discretionary part is
  kept. Development checklists (agricultural buildings, barn conversions, change of use, equestrian, HMO,
  live/work, major commercial, major residential, minor residential, annexes, solar, telecoms) are shown
  as full planning applications; the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
