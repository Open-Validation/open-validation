reference: bng-metric
local-authority: WYE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Environment Act 2021; Biodiversity Gain (Town and Country Planning) (Consequential Amendments)
  Regulations 2024
source-text: A draft BNG metric, using the statutory biodiversity metric, must be used for the calculation
  of pre-development post development biodiversity value of sites and projects. ... PEA, BNG metric and
  draft BNG Plan
must-include:
- item: Pre-development and post-development biodiversity value, calculated with the statutory biodiversity
    metric
  level: must
- item: The statutory metric (not the small sites metric) where priority habitat is present, for 10 or
    more dwellings on a site over 1ha, for a site over 0.5ha where the number of dwellings is not known,
    and for other development on a site over 1ha or over 1000m2 floorspace
  level: must
  source-text: 'The statutory biodiversity metric should be used for: Any development site where priority
    habitat is present Residential development of 10 or more dwellings on a site >1ha Where the number
    of dwellings is not known the site area is >0.5ha For all other development types, the site area is
    >1ha or floorspace >1000m2'
- item: The small sites metric only where no unsupported or priority habitats or protected species are
    present and no off-site interventions are needed
  level: must
  required-if: discretionary
  source-text: 'The small sites metric cannot be used on sites where: habitats are not available in the
    small sites metric are present; where priority habitats are in the development site (excluding some
    hedgerow and arable field margins); where protected species are present; where any off site interventions
    are required.'
confidence: medium
notes: 'From the council''s list (last updated January 2025), Part 2, Local List Requirements (Biodiversity
  Net Gain Metric and net gain plan). The legal rule is shown: applications subject to the general biodiversity
  gain condition. The list itself names the exemptions (householder development, section 73 where the
  original permission had no BNG, permitted development, sites with no biodiversity value, de minimis,
  small self-build, biodiversity gain sites). The Part 1 checklists for agricultural buildings, agricultural
  workers'' dwellings, barn conversions, change of use, equestrian, live/work, major and minor development
  and solar list ''PEA, BNG metric and draft BNG Plan''; the draft BNG Plan is listed as unmapped.'
