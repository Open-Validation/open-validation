reference: transport-assessment
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: hmo-creation
        value: true
        description: A house in multiple occupation (Checklist 12).
  - all:
    - any:
      - all:
        - application-type:
            in:
            - full
        - condition:
            field: involves-change-of-use
            value: true
            description: A change of use (Checklist 7).
      - all:
        - application-type:
            in:
            - full
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One to nine dwellings (Checklist 17).
        - condition:
            field: dwelling-count
            operator: <=
            value: 9
            description: One to nine dwellings (Checklist 17).
      - application-type:
          in:
          - cho-commercial-to-dwh
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: Transport Assessment ... Transport Statement ... Transport Statement (where applicable)
must-include:
- item: Accessibility to the site by all modes of transport
  level: must
- item: Likely modal splits of journeys to and from the site
  level: must
- item: Measures to improve access to the site by sustainable methods
  level: must
- item: Parking and manoeuvring areas on a plan
  level: must
- item: How the transport implications will be managed to minimise impacts
  level: must
- item: A strategy for implementation and coordination of a travel plan
  level: must
confidence: medium
notes: From the council's list (last updated January 2025), Part 1 checklists 7, 12, 15, 16, 17 and 20,
  and Part 2, Local List Requirements (Transport Assessments/Statements). Part 2 gives the contents but
  no trigger. A Transport Assessment is listed for major residential and major commercial development
  and a Transport Statement for HMOs; for change of use, minor residential and Class MA prior approvals
  only 'where applicable' (discretionary). Development checklists (agricultural buildings, barn conversions,
  change of use, equestrian, HMO, live/work, major commercial, major residential, minor residential, annexes,
  solar, telecoms) are shown as full planning applications; the list doesn't give separate outline checklists.
review-status: unverified
field-status: {}
