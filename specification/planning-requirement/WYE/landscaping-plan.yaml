reference: landscaping-plan
local-authority: WYE
required-if:
  any:
  - ref: major-development
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: use-class
          value: agricultural-forestry-building
          description: An agricultural or forestry building (Checklist 2).
    - condition:
        field: hedgerows-affected
        value: true
        description: The proposal involves loss of hedgerow.
  - all:
    - all:
      - application-type:
          in:
          - full
      - condition:
          field: use-class
          value: equestrian
          description: Equestrian development (Checklist 10).
    - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: All major planning applications will require a Landscaping Scheme to be submitted, including
  outline applications and should include a landscape strategy plan. ... Landscaping details if proposal
  involves loss of hedgerow
must-include:
- item: A landscape strategy plan
  level: should
  required-if:
    ref: major-development
- item: A landscape management plan
  level: must
  required-if:
    any:
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Major commercial/industrial development (Checklist 15).
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development (Checklist 16).
  source-text: Landscaping Scheme and Management Plan
- item: Landscaping and screening of the development
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: use-class
        value: equestrian
        description: Equestrian development (Checklist 10).
  source-text: Details of landscaping and screening of the development (where necessary)
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Landscaping
  Scheme), and Part 1 checklists 2, 10, 15 and 16. For equestrian development only 'where necessary' (discretionary).
review-status: unverified
field-status: {}
