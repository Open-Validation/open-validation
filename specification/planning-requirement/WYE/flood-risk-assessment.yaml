reference: flood-risk-assessment
local-authority: WYE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zones 2 and 3.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more (Flood Zone 1).
  - site:
      in:
      - critical-drainage-area
      description: Land identified by the Environment Agency as having critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Land identified in the Strategic Flood Risk Assessment as being at increased flood
        risk in future.
  - all:
    - site:
        in:
        - surface-water-flood-risk
        description: Land subject to surface water or other sources of flooding.
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: The development would introduce a more vulnerable use.
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'A site-specific flood risk assessment (FRA) will be required for all development in Flood
  Zones 2 and 3. In Flood Zone 1, an assessment should accompany for all proposals involving: sites of
  1 hectare or more; land which has been identified by the Environment Agency as having critical drainage
  problems; land identified in a strategic flood risk assessment as being at increased flood risk in future;
  or land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use. Please seehttps://flood-map-forplanning.service.gov.uk/, for example; development on
  land identified in the Council’s Strategic Flood Risk Assessment as being at increased flood risk in
  future. Development proposals on land subject to surface water flooding, where development would introduce
  a more vulnerable use.'
must-include:
- item: A level survey to Ordnance Datum/GPS showing the 1% river flood level including climate change
    (or 0.5% tidal and coastal) relative to proposed site levels; in Flood Zone 3 an assessment of the
    functional floodplain (3.3%); and any defences and their standard of protection
  level: should
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3.
    - condition:
        field: minor-development
        value: false
        description: Not minor development (NPPG paragraph 051).
- item: 'An assessment of the risks to the site: 1% modelled flooding with climate change, breach and
    overtopping where necessary, historic flooding and surface water runoff'
  level: should
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3.
    - condition:
        field: minor-development
        value: false
        description: Not minor development.
- item: Mitigation for the lifetime of the development based on a 1% event with climate change (floor
    levels, flood proofing, safe access and egress)
  level: should
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3.
    - condition:
        field: minor-development
        value: false
        description: Not minor development.
- item: Impact on flood risk elsewhere (flood storage compensation, flow routes, surface water disposal)
  level: should
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3.
    - condition:
        field: minor-development
        value: false
        description: Not minor development.
- item: Residual risks after mitigation, including an extreme 0.1% event
  level: should
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3.
    - condition:
        field: minor-development
        value: false
        description: Not minor development.
- item: 'Minor development and extensions under 250m2: written confirmation that floor levels will be
    no lower than existing and flood proofing has been considered, or preferably that floor levels will
    be 600mm above the 1% river (0.5% tidal) flood level with climate change, shown on a plan to Ordnance
    Datum/GPS'
  level: should
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3.
    - condition:
        field: minor-development
        value: true
        description: Minor development (NPPG paragraph 051), including domestic and commercial/industrial
          extensions under 250m2.
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Flood Risk
  Assessment), and Annexes B and C (Environment Agency advice, last updated March 2023). The list says
  the FRA 'should reflect' that advice; the annexes say the applicant 'should confirm as a minimum' these
  points, so they are 'should'. Also listed 'where applicable' in most Part 1 checklists.
