reference: location-plan
local-authority: WYE
required-if:
  always: true
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan Scale 1:1250 or 1:2500 All applications ... Location Plan at a scale of 1:1250
must-include:
- item: At a scale of 1:1250 or 1:2500 (the Part 1 checklists say 1:1250)
  level: must
- item: An up-to-date base map, scaled to fit A4 or A3 paper wherever possible, showing the direction
    of North
  level: must
  source-text: An up-to-date base map and scaled to fit onto A4 or A3 size paper wherever possible, showing
    the direction of North.
- item: North arrow, scale and licence number
  level: must
  source-text: 'Must include: North Arrow, Scale, Licence Number'
- item: In colour
  level: must
  source-text: 'Colour Format: Colour'
- item: PDF or printed copy
  level: must
  source-text: 'File Type: PDF or Printed copies'
- item: Coverage of about 4 hectares (urban) or 16 hectares (rural)
  level: should
  source-text: 'Coverage: Urban 4 hectares, Rural 16 hectares'
- item: The entire property and normally one or two named roads
  level: should
  source-text: Should show entire property and normally 1 or 2 named roads.
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, National Requirements, and Annex D
  (site location plan at a glance). The red and blue edging the annex mentions repeats the national rules.
  Not listed in the Part 1 checklists for listed building consent, non-material amendments or section
  73 applications, but Part 2 says 'All applications'.
