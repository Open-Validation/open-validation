reference: noise-assessment
local-authority: WYE
required-if:
  any:
  - condition:
      field: plant-equipment
      value: true
      description: Plant, ventilation, air extraction or air conditioning equipment and flues.
  - condition:
      field: noise-generating-use
      value: true
      description: Uses likely to create significant noise (food/drink, entertainment and leisure, industrial,
        day nurseries).
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use in a noisy environment or near an existing noise-generating use.
  - discretionary
source-url: https://www.wyreforestdc.gov.uk/planning-and-buildings/guidance-and-practice-notes/local-validation-list/
source-text: 'For applications where noise is likely to be a material consideration/ cause an impact for
  either noise sensitive development or noise generating development, for example: Plant, ventilation,
  air extraction of air conditioning equipment and flues. Uses likely to create significant noise such
  as food/drink, Entertainment and leisure uses, industrial uses, day nurseries, etc. A noise-sensitive
  use located in a noisy environment. Use likely to generate a significant amount of traffic. Noise-sensitive
  use being proposed in proximity to an existing noise generating use.'
must-include:
- item: An assessment of existing background noise levels measured over a 24-hour period
  level: must
- item: A clear understanding of proposed noise levels
  level: must
- item: Any proposed measures to reduce noise levels
  level: must
- item: The method used to compile the report, with examples of the calculations and assumptions made
  level: must
- item: Prepared by a suitably qualified acoustic consultant, with a scheme of noise mitigation measures
    where required
  level: should
confidence: medium
notes: From the council's list (last updated January 2025), Part 2, Local List Requirements (Acoustic
  Report/Noise Impact Assessment). Whether noise is 'likely to be a material consideration' is the council's
  judgement and the list gives examples (including uses that generate a lot of traffic), so a discretionary
  part is kept. Also listed 'where applicable' in Checklists 15, 16 and 20. The list recommends discussing
  it with Worcestershire Regulatory Services.
review-status: unverified
field-status: {}
