reference: design-and-access-statement
local-authority: KEN
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: The site is in a conservation area or World Heritage Site.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: The development creates more than 100 square metres of floorspace.
source-url: https://www.kent.gov.uk/__data/assets/pdf_file/0015/204450/Guidance-and-validation-requirements-for-county-council-regulation-3-applications.pdf
source-text: 'structures. 5) Design and Access Statement 5.1 A Design and Access Statement will be required
  (as set out in Article 9 of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended), for the following development proposals: All major development applications.'
confidence: medium
