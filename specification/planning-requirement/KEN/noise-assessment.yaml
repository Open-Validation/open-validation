reference: noise-assessment
local-authority: KEN
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: The development is close to an existing major noise source (motorways, trunk roads,
          airports, industry).
    - condition:
        field: noise-generating-use
        value: true
        description: The development is likely to generate significant noise (e.g. outdoor sports facilities).
source-url: https://www.kent.gov.uk/__data/assets/pdf_file/0015/204450/Guidance-and-validation-requirements-for-county-council-regulation-3-applications.pdf
source-text: Impacts 9.1 Noise Impact Assessment 9.1.1 Required when a proposed development is in close
  proximity to existing major noise source e.g. motorways or trunk road, airports, industrial activities
  etc, and/or where the development itself is likely to generate significant noise levels e.g. outdoors
  sports facilities.
confidence: low
notes: 'Audit (wrong_app_type): Reg 3 note.'
review-status: unverified
field-status: {}
