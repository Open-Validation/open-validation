source-text: 'Sport England Artificial Lighting Guidance 9.4 Daylight/Sunlight Assessment 9.4.1 Required
  for any application where there is potential for adverse impacts on current levels of daylight/sunlight
  enjoyed by adjoining properties or buildings including associated gardens or amenity space. 9.4.2 The
  assessment should include: Details of existing and expected levels of daylight, sunlight and overshadowing
  on neighbouring properties;'
