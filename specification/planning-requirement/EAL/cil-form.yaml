reference: cil-form
local-authority: EAL
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: An increase in floor area over 100 square metres.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The creation of new dwellings (the 100 square metre limit does not apply).
source-url: https://www.ealing.gov.uk/info/201161/planning_permission/1151/community_infrastructure_levy
policy: Community Infrastructure Levy Regulations 2010; Mayor of London's CIL
source-text: Applications decided from 1 April 2012 with an increase in floor area over 100 square metres
  or the creation of new dwellings (the 100 square metre limit does not apply when new dwellings are created),
  are liable to pay the Mayor of London's Community Infrastructure Levy (CIL).
must-include:
- item: The CIL additional information form, completed after reading the additional information guidance
    and submitted with the application
  level: must
confidence: medium
notes: 'Ealing publishes no local validation list (checked 2026-11-06): its ''Planning application process''
  page lists the national requirements and says design and access statements and CIL ''may also apply''.
  From the council''s ''Mayor of London''s Community Infrastructure Levy'' page (undated). Ealing collects
  the Mayoral CIL and has no borough CIL of its own.'
review-status: unverified
field-status: {}
