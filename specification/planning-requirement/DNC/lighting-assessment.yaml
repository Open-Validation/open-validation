reference: lighting-assessment
local-authority: DNC
required-if:
  any:
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated adverts.
  - all:
    - any:
      - condition:
          field: external-lighting
          value: true
          description: External lighting such as car-park lighting or a ménage.
      - condition:
          field: floodlighting
          value: true
          description: Floodlighting of sports facilities.
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          description: Within or in the vicinity of a listed building or conservation area.
      - condition:
          field: outside-urban-area
          value: true
          description: Within or in the vicinity of open countryside.
      - discretionary
source-url: https://dmbcwebstolive01.blob.core.windows.net/media/Default/Planning/Documents/DM%20Planning/Planning%20Application%20Information%20Requirements%20and%20Validation%20Checklist%20-%20Reviewed%20August%202023.pdf
source-text: 'Full planning: open countryside, a lighting impact assessment must be provided, along with
  a light spillage report.


  Advertisement consent: Lighting details Proposals for illuminated adverts (internal and Guidance & Further
  Information Relevant Legislation & Policy Context1 Images should show the proposed new signage on the
  existing CDC Policies 36, building or within the existing street scene. 37, 40 & 49 Details should include
  technical specification of all forms of illumination, including beam orientation and lighting spill
  and explain the proposed hours of illumination.'
must-include:
- item: Technical specification of all forms of illumination, including beam orientation and lighting
    spill
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: The proposed hours of illumination
  level: must
  required-if:
    application-type:
      in:
      - advertising
