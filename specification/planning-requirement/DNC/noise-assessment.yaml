reference: noise-assessment
local-authority: DNC
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development close to a significant source of noise.
  - condition:
      field: noise-generating-use
      value: true
      description: The development is likely to generate noise.
source-url: https://dmbcwebstolive01.blob.core.windows.net/media/Default/Planning/Documents/DM%20Planning/Planning%20Application%20Information%20Requirements%20and%20Validation%20Checklist%20-%20Reviewed%20August%202023.pdf
source-text: Noise Impact Assessment Where a proposal is for a noise sensitive development [e.g. housing,
  hospitals or schools] close to a significant source of noise [e.g. general industry, road, rail and
  air transport], or where the proposed development itself is likely to generate noise, it must be accompanied
  by a noise impact assessment.
