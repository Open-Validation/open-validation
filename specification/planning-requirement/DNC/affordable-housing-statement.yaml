source-text: 'Affordable Housing Statement Where an application for residential development generates
  a requirement for affordable housing in accordance with the planning policy prevailing at the time,
  it must be accompanied by an affordable housing statement that includes the following information: The
  total number of residential units proposed, The mix of market and affordable housing units, with details
  of numbers and floorspace of habitable rooms and bedrooms, Plans showing the location of affordable
  unit'
must-include:
- item: The total number of residential units proposed
  level: must
- item: The mix of market and affordable units, with numbers and floorspace of habitable rooms and bedrooms
  level: must
- item: Plans showing the location of the affordable units
  level: must
