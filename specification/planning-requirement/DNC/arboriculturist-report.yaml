reference: arboriculturist-report
local-authority: DNC
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        description: Protected trees on the site or the adjacent site would be affected.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The development is within 12m of any above-ground part of a tree on or adjacent to
          the site.
source-url: https://dmbcwebstolive01.blob.core.windows.net/media/Default/Planning/Documents/DM%20Planning/Planning%20Application%20Information%20Requirements%20and%20Validation%20Checklist%20-%20Reviewed%20August%202023.pdf
source-text: 'Householder: Tree Survey 7 Where there are protected trees either on the application site
  or on the site adjacent to the application site which would be affected by the proposals.7 The survey
  should include details of trees to be retained/removed and planted, and an assessment of the direct
  and indirect impacts of the proposed development.


  Full planning: Tree Survey For all forms of development proposals which are within 12m from any above
  ground part of a tree on or adjacent to the site you will be required to submit information relating
  to trees.'
must-include:
- item: Trees to be retained, removed and planted
  level: should
- item: An assessment of the direct and indirect impacts of the development
  level: should
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The Full planning
  trigger (12m) is from the superseded August 2023 checklist. The audit couldn't read this council's list,
  so its contents weren't checked.
review-status: unverified
field-status: {}
