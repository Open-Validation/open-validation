reference: noise-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Will potentially create noise disturbance (e.g. pubs, nightclubs, factories, motor
          racing tracks, dog kennels).
    - condition:
        field: noise-sensitive-use
        value: true
        description: Introduces residential development close to noisy uses (e.g. busy roads, railway
          lines, airfields, motor racing tracks).
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: BS4142:2014; BS8233:1999
source-text: For planning applications that will potentially create noise disturbance (e.g. pubs, nightclubs,
  factories, motor racing tracks, dog kennels) or would introduce residential development within close
  proximity to noisy uses (e.g. busy roads, railway lines, airfields, motor racing tracks etc.).
must-include:
- item: Noise survey carried out in accordance with BS4142:2014
  level: must
- item: Where sound insulation is needed, in accordance with BS8233:1999
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 19. The summary
  checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
