reference: flood-risk-assessment
local-authority: SHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: Ground floor level development in flood zone 2 or 3.
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: All development in flood zones 2 and 3.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Sites over 1 hectare in flood zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Sites over 1 hectare in flood zone 1.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: All development in flood zones 2&3 or for sites measuring over 1 hectare in flood zone 1
  as identified by the Environment Agency maps ... All ground floor level development in flood zones 2
  or 3 as identified by the Environment Agency maps.
must-include:
- item: A location plan showing street names and any rivers, streams, ponds, wetlands or other bodies
    of water
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: Surveys showing the existing and proposed site levels
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: A cross-section of the site showing finished floor or road levels and any other levels that inform
    the flood risk
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: Reference to the Council's Strategic Flood Risk Assessment (SFRA)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: 'Householder: confirmation that proposed finished floor levels are no lower than existing (can
    be annotated on the drawings); a full flood risk assessment if they are lower'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Confirmation that proposed finished floor levels are no lower than existing (this can be
    annotated on the submitted drawings). If they are to be lower than existing then a full flood risk
    assessment will be required.
confidence: medium
notes: From the council's list (published February 2023), Non-householder document item 13 and the Householder
  document. The second sentence of the quote is the householder trigger, from https://www.folkestone-hythe.gov.uk/downloads/file/4239/householder-2020-reviewed-2023.
  The summary checklist ticks it for householder, full and outline applications.
review-status: unverified
field-status: {}
