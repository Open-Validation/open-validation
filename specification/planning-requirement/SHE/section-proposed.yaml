reference: section-proposed
local-authority: SHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: site-level-change
          operator: '>'
          value: 300
          description: Ground levels changing by more than 0.3 metres.
      - condition:
          field: raised-platform
          value: true
          description: A raised platform (e.g. decking) is proposed.
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: change-in-ground-levels
        value: true
        description: Existing or proposed site levels vary.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: Where existing or proposed site levels vary. ... Where ground levels are changing by more
  than 0.3 metres or where a raised platform (e.g. decking) is proposed.
must-include:
- item: A plan showing the proposed ground (floor) levels relative to existing levels; this can be shown
    by cross section
  level: must
- item: Ridge / roof heights in relation to neighbouring properties
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: Full cross sections where there are significant changes in levels across the site
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
confidence: medium
notes: From the council's list (published February 2023), Non-householder document item 17 and the Householder
  document. (Levels survey / cross sections through the site). The second sentence of the quote is the
  householder trigger. The summary checklist ticks it for householder, full and outline applications.
review-status: unverified
field-status: {}
