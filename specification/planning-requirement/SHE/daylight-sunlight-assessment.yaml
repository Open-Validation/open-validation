reference: daylight-sunlight-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: new-build
      value: true
      description: New residential development or new build development adjacent to existing residential
        properties.
  - condition:
      field: fails-bre-basic-tests
      value: true
      description: The development fails the basic BRE 45 degree and 25 degree tests in policy HB8.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: Places and Policies Local Plan 2020 policy HB8
source-text: For planning applications of new residential development or new build development adjacent
  to existing residential properties which fail the basic BRE (Building Research Establishment) tests
  as set out in policy HB8 of the Places and Policies Local Plan (45 degree and 25 degree tests).
must-include:
- item: Carried out in accordance with BRE guidance, assessing the impact on existing and future occupants
  level: must
- item: 'Daylight tests: vertical sky component, no sky line and average daylight factor'
  level: must
- item: 'Sunlight tests: annual probable sunlight hours and sun on ground'
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 6. The summary
  checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
