reference: land-contamination-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: sensitive-end-use
      value: true
      description: Sensitive use such as residential, allotments, hospitals, schools, nurseries and children's
        play areas, of all scales.
  - site:
      in:
      - contaminated-land
      description: On or adjacent to land known or suspected of being contaminated (e.g. garage blocks,
        industrial sites, farmyards, former landfill).
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For planning applications of sites for sensitive use such as residential developments, allotments,
  hospitals, schools, nurseries and children’s play areas of all scales on land, or adjacent to land,
  that is known or suspected of being contaminated (e.g. domestic garage blocks, industrial sites, farmyards,
  former landfill sites). This is not required for replacement dwellings, dwellings in gardens, flat conversions
  with no land associated (other than hardstanding for parking).
must-include:
- item: Desktop study assessing the nature and extent of contamination on the site and relevant surrounding
    land, including risks to human health and ground water
  level: must
- item: Site history, site walkover, potential contaminants and receptors, and a conceptual site model
  level: should
- item: Undertaken by a suitably qualified person
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 5. (Contaminated
  land desktop study and site walkover). The summary checklist ticks it for full and outline applications
  only.
review-status: unverified
field-status: {}
