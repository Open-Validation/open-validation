reference: viability-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The policy levels of planning obligations (such as affordable housing or play/open
        space) cannot be met due to viability.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For planning applications where the policy required levels of financial contributions for
  planning obligations provisions, such as affordable housing or play / open space, cannot be met due
  to viability issues.
must-include:
- item: An open book appraisal setting out in detail the costs of the development (including land costs)
    and the anticipated return
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 29. The applicant
  agrees to pay the Council's costs of independent review. The summary checklist ticks it for full and
  outline applications only.
review-status: unverified
field-status: {}
