reference: site-plan
local-authority: SHE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: All development proposals
must-include:
- item: Existing and proposed block plans
  level: must
- item: Boundary treatments (walls, fences etc.)
  level: must
- item: Buildings and outbuildings within the site (e.g. sheds, garages)
  level: must
- item: Parking area or space
  level: must
- item: Neighbouring properties, including windows, doors or other openings that may be affected by the
    development
  level: must
- item: 'Trees (householder: existing trees)'
  level: must
- item: Landscaping strategy
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: Waste and recycling provision
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
confidence: medium
notes: From the council's list (published February 2023), Non-householder document item 3 and the Householder
  document. (Block plan). The summary checklist ticks it for householder, full and outline applications.
  The householder document asks for the same items except landscaping and waste.
review-status: unverified
field-status: {}
