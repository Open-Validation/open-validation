reference: lighting-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Flood lighting, or external lighting for manèges.
    - all:
      - ref: major-development
      - condition:
          field: outside-urban-area
          value: true
          description: In the countryside.
    - all:
      - ref: major-development
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: In the AONB.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For developments including flood lighting, external lighting for manèges, major applications
  in the countryside and major applications in the AONB (Area of Outstanding Natural Beauty).
must-include:
- item: A layout plan showing the location of lights
  level: must
- item: A design of the equipment, including specifications, beam orientation, light spills and lux levels
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 18. The summary
  checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
