reference: heritage-statement
local-authority: SHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - listed-building
        - scheduled-monument
        description: Affects a listed building, a curtilage listed building (built before 1948 within
          the curtilage of a listed building) or a scheduled ancient monument.
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - listed-building-setting
        - locally-listed-building
        - conservation-area
        description: Affects the setting of a historic building, a building on the Local List of Heritage
          Assets or a conservation area.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For proposals that affect a listed building, a curtilage listed building (a building built
  before 1948 within the curtilage of a listed building), a scheduled ancient monument, the setting of
  a historic building or a building identified on the Local List of Heritage Assets or a conservation
  area.
must-include:
- item: An assessment of the significance of the heritage asset(s)
  level: must
- item: An assessment of the impact on significance
  level: must
- item: A justification for the proposed works
  level: must
- item: 'For works affecting a listed building or its setting: the list description'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      description: Affects a listed building or its setting.
- item: 'For works affecting a listed building or its setting: photos (householder: of the relevant parts
    of the listed building, interior and exterior, and its grounds/garden)'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      description: Affects a listed building or its setting.
confidence: medium
notes: From the council's list (published February 2023), Non-householder document item 14 and the Householder
  document. (Heritage assessment of significance and impact). For householder applications the trigger
  is a listed building, curtilage listed building or scheduled ancient monument only. The summary checklist
  ticks it for householder, full and outline applications.
review-status: unverified
field-status: {}
