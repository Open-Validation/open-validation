reference: air-quality-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For any planning application where the proposal is likely to give rise to significant air
  quality impacts on the surrounding area. For example large scale housing developments, large scale sewage
  treatment or applications involving landfill sites or large scale industrial.
must-include:
- item: Sufficient information for the Council to understand the likely impact on local air quality, including
    cumulative impacts
  level: must
- item: The number of receptors exposed to poor air quality as a result of the development, with their
    location shown on a map
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 1. 'Significant
  air quality impacts' and 'large scale' have no thresholds, so it is shown as discretionary. The summary
  checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
