reference: archaeological-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks, e.g. new foundations.
  - site:
      in:
      - archaeological-priority-area
      description: Within an identified Area of Archaeological Potential (AAP) on the Council's policies
        map.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For all planning applications involving groundworks (e.g. new foundations) in areas within
  an identified Area of Archaeological Potential (AAP) as shown on the Council’s policies.
must-include:
- item: A desktop archaeological report taking into consideration all known historic records relating
    to the site, referring to KCC's Historic Environment Record
  level: must
- item: The archaeological potential of the site and its significance
  level: must
- item: The level of harm to the heritage asset that would result from the development
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 2. The summary
  checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
