reference: arboriculturist-report
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on or adjoining the site that will be affected, including root protection areas;
        walls, hard surfaces, excavations or land raising close to trees.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: BS5837:2012
source-text: For applications where trees are present on or adjoining the site and in such locations that
  it / they will be affected by the development, including root protection areas. This includes walls
  / hard surfaces / excavations / land raising is to take place close to trees.
must-include:
- item: A site survey showing the exact location of existing trees
  level: must
- item: A report prepared by a qualified arboriculturalist in accordance with BS 5837:2012
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 28. (Tree survey).
  The summary checklist ticks it for householder, full and outline applications. The householder document
  itself does not describe it.
review-status: unverified
field-status: {}
