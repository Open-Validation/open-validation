reference: planning-statement
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: Applications contrary to policy (e.g. a new dwelling outside the settlement boundary,
          or housing on an allocated employment site).
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: Places and Policies Local Plan 2020 policies C3 and C4
source-text: All major applications and other applications that are contrary to policy (e.g. a new dwelling
  outside of the defined settlement boundary or housing on an allocated employment site).
must-include:
- item: An explanation of the principles behind the proposed development
  level: must
- item: How the development complies with the development plan policies and the NPPF, or a justification
    against planning policy
  level: must
- item: Open space assessment
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 20
      description: 20 dwellings or more.
- item: Play space assessment
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings with 2 or more bedrooms.
- item: Affordable housing statement
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings.
- item: Health impact assessment
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>'
      value: 100
      description: More than 100 dwellings.
- item: Details of any pre-application advice given and reasons where the application deviates from it
  level: should
  source-text: Include details of the pre-application advice given in the planning statement, and where
    the submitted application deviates from the advice given, provide reasons for not following the advice.
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 20. The play
  space threshold counts dwellings with 2 or more bedrooms. The pre-application item is from the council's
  'What needs to be submitted' web page. The summary checklist ticks it for full and outline applications
  only.
review-status: unverified
field-status: {}
