reference: cil-form
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings, including subdivision, change of use, self-contained holiday lets,
          HMOs and sheltered accommodation in classes C3/C4.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 280
        description: Large retail developments over 280 sq m net retail selling space.
    - discretionary
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: Community Infrastructure Levy Regulations 2010
source-text: All planning applications for new dwellings (including subdivision, change of use, self-contained
  holiday lets and HMOs (House of Multiple Occupation) and sheltered accommodation for any development
  that falls within a C3/C4 class and large retail developments over 280sqm net retail selling space except
  in Folkestone where all retail development is CIL liable.
must-include:
- item: Completed CIL additional information form, with measurements in gross internal area (GIA)
  level: must
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 4. The 280 sq
  m threshold is net retail selling space. In Folkestone all retail development is CIL liable; there is
  no field for that, so it is covered by 'discretionary'. The summary checklist ticks it for full and
  outline applications only.
review-status: unverified
field-status: {}
