reference: landscaping-plan
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: external-space
      value: true
      description: The application has land associated (not a change of use or conversion of a building
        with no land associated).
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: For all planning applications excluding applications for a change of use or conversion of
  a building with no land associated.
must-include:
- item: A plan identifying areas of hard and soft landscaping
  level: must
- item: Footpaths; boundary treatments; grassed areas; planting beds; parking areas (including their limits)
  level: must
- item: Proposed and retained trees
  level: must
- item: Translocation areas for reptiles, where appropriate
  level: must
  required-if: discretionary
- item: Full planting schedule, implementation and maintenance details, only if ecological mitigation
    is required
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 15. (Landscape
  strategy). It can be shown on the block plan. The summary checklist ticks it for full and outline applications
  only.
review-status: unverified
field-status: {}
