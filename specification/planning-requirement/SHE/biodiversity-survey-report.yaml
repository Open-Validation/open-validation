reference: biodiversity-survey-report
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: protected-species
        value: true
        description: Existing habitats on the site include meadow/grassland, pasture, rough grassland,
          scrubland or hedgerows, or buildings with potential for bats are to be demolished.
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - site-of-special-scientific-interest
        - ancient-woodland
        - local-wildlife-site
        description: Development in or likely to affect an SAC, SPA, Ramsar site, SSSI, ancient woodland,
          Local Nature Reserve or Local Wildlife Site.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
source-text: 'For proposals where the existing habitats on the site includes meadow / grassland, pasture,
  rough grassland, scrubland, hedgerows and the demolition of buildings that have the potential for bat
  activity / roosting. Or for development in or likely to affect the following areas: Special Area of
  Conservation (SAC) Special Protection Area (SPA) Ramsar Site of Special Scientific Interest (SSSI) Ancient
  woodland Local Nature Reserves (LNR) Local Wildlife Sites (LWS)'
must-include:
- item: A Preliminary Ecological Appraisal carried out by a suitably qualified person
  level: must
- item: Individual habitat / species surveys establishing the presence or absence of protected species
    and, if present, the population level; the ecological interest of the site; the likely impact; a detailed
    scheme of mitigation; following best practice guidelines
  level: must
  required-if: discretionary
  source-text: When the preliminary ecological appraisal (above) recommends further surveys are needed
    in regard to specific protected species / habitats / sites (such as SSSI / Ramsar).
- item: 'For off-site species translocation: a survey of the receptor site and evidence of the site owner''s
    agreement to keep it free of development as species habitat in perpetuity'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 9-10. (Preliminary
  Ecological Appraisal; Ecology / protected species surveys). The further surveys depend on what the appraisal
  recommends, so those items are discretionary. Ramsar sites have no designation id here and are named
  in the description. The summary checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
