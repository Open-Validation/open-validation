reference: town-centre-impact-assessment
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside town centres, on sites not allocated for that use.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Proposed floor space exceeds 2,500 sq m.
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: Core Strategy Review 2022 policy SS4
source-text: For planning applications for main town centre uses outside of town centres that are not
  allocated for that use, where the proposed floor space exceeds 2,500 sqm.
must-include:
- item: Impact on the vitality and viability of existing town, district and local centres up to 5 years
    from the application
  level: must
- item: A need for the proposed development
  level: must
- item: 'For large major schemes whose impact will not be realised in 5 years: impact up to 10 years from
    the application'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 21. (Retail impact
  assessment). The summary checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
