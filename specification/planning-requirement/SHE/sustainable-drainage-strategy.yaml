reference: sustainable-drainage-strategy
local-authority: SHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 dwellings or more.
    - discretionary
source-url: https://www.folkestone-hythe.gov.uk/downloads/file/4240/non-householder-2020-reviewed-2023
policy: KCC Drainage and Planning Policy Statement (2017)
source-text: For all developments of 10 dwellings or more, or equivalent non-residential or mixed use
  development.
must-include:
- item: A location plan and a site layout plan
  level: must
- item: A drainage proposal schematic or sketch
  level: must
- item: A clear description of key drainage features (e.g. attenuation volumes, flow control devices)
  level: must
- item: Information supporting key assumptions (e.g. impermeable areas, infiltration rates)
  level: must
- item: Supporting calculations demonstrating the system's operation, and a drainage model network schematic
  level: must
- item: Drainage strategy summary form (Appendix E of KCC's Drainage and Planning Policy Statement 2017)
  level: must
- item: Consideration of the key questions in KCC's Drainage and Planning Policy Statement (2017)
  level: must
- item: Details of foul drainage, only for cesspits, cesspools, package treatment plants etc. (anything
    other than mains)
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Foul drainage other than connection to the mains.
confidence: medium
notes: From the council's list (published February 2023), Non-householder document, item 26. (SUDS strategy).
  'Equivalent non-residential or mixed use development' has no stated floorspace, so it is shown as discretionary.
  The summary checklist ticks it for full and outline applications only.
review-status: unverified
field-status: {}
