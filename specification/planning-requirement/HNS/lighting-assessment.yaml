reference: lighting-assessment
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - advertising
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or a conservation area, or open countryside, where external
  lighting would be provided or made necessary by the development, should be required to be accompanied
  by details of external lighting and the proposed hours when the lighting would be switched on.
must-include:
- item: Details of external lighting and the hours it would be switched on
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Schedule of the equipment in the design
  level: must
- item: Light/lux levels for the proposed lighting
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  10. Publicly accessible development and the vicinity of residential property or open countryside have
  no field, so they show as discretionary. The advertisement consent checklist (page 5) has the same wording.
review-status: unverified
field-status: {}
