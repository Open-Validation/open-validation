reference: lighting-assessment
local-authority: HNS
required-if:
  condition:
    field: external-lighting
    value: true
    description: Publicly accessible development near homes, a listed building, a conservation area or
      open countryside, where external lighting would be provided or made necessary.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: Lighting Assessment Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a listed building or a conservation area, or open countryside,
  where external lighting would be provided or made necessary by the development, should be required to
  be accompanied by details of external lighting and the proposed hours when the lighting would be switched
  on.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
confidence: low
