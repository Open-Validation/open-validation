reference: archaeological-assessment
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - archaeological-priority-area
      description: In an archaeological priority area.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: An assessment of potential archaeological heritage should be Provided if the site is in an
  archaeological priority area.
must-include:
- item: Prepared by a qualified individual or organisation, using existing information to establish the
    archaeological significance of the site and the impact on surviving monuments or remains
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  12. 'Historical and Archaeological Assessment'. Small-scale fieldwork may be needed.
review-status: unverified
field-status: {}
