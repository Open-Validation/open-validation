reference: air-quality-assessment
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - prior-approval
  - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Hounslow draft Air Quality SPD (2013)
source-text: The Air Quality Assessment should be submitted and confirm whether air quality is an issue
  and demonstrate what mitigation measures will be implemented to ensure the inhabitants of the proposed
  development are not negatively affected by the existing poor air quality.
must-include:
- item: Whether air quality is an issue
  level: must
- item: Mitigation measures so that occupiers are not negatively affected by existing poor air quality
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  9. The 'Air Quality Statement'. No trigger is given, so it shows as discretionary (the list says not
  everything will be required and each application is dealt with case by case). Application types follow
  the checklists that list it (Hounslow publishes one checklist per application type); 'prior-approval'
  stands for the 'Prior approval - non-householder' checklist.
review-status: unverified
field-status: {}
