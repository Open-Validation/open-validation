reference: energy-statement
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: new-build
        value: true
        description: All new builds.
    - ref: major-development
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: London Plan; GLA guidance on preparing energy assessments
source-text: Required for all new builds, and all applications for major developments
must-include:
- item: How the development will contribute towards energy and carbon reduction targets
  level: must
- item: Produced in accordance with the GLA's guidance on preparing energy assessments
  level: should
- item: A BREEAM pre-assessment
  level: should
  required-if: discretionary
  source-text: It should include a BREEAM pre-assessment where a BREEAM “Excellent” rating is required
- item: Dynamic thermal modelling
  level: should
  required-if: discretionary
  source-text: dynamic thermal modelling where there is a risk of overheating (such as single aspect south
    or west facing homes)
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  9.
review-status: unverified
field-status: {}
