reference: roof-plan-existing
local-authority: HNS
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
  - all:
    - application-type:
        in:
        - lbc
        - ldc
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to the roof are proposed.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Scaled at 1:50 or 1:100 ... Required only if alterations to the roof are proposed. Scaled
  at 1:50 or 1:100.
must-include:
- item: Scaled at 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  6. The listed building consent and lawful development certificate checklists (page 5 of each) ask for
  roof plans 'only if alterations to the roof are proposed'. Application types follow the checklists that
  list it (Hounslow publishes one checklist per application type); 'prior-approval' stands for the 'Prior
  approval - non-householder' checklist.
review-status: unverified
field-status: {}
