reference: sustainable-drainage-strategy
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: 'The Flood Risk and Drainage Document requires the following information to be addressed
  in the FRA (where applicable) for all Major, and a number of minor planning applications:'
must-include:
- item: Completed Hounslow Drainage Assessment Form
  level: must
- item: Drainage layout drawings
  level: must
- item: Infiltration feasibility assessment
  level: must
- item: Evidence that all levels of the drainage hierarchy have been considered and justified
  level: must
- item: Greenfield, pre-development and post-development runoff rate calculations, with mitigation
  level: must
- item: Design storage volume calculations and drainage design calculations showing the scheme meets policy
  level: must
- item: The most up to date climate change allowance incorporated in the design
  level: must
- item: Maintenance and adoption plan
  level: must
- item: Consultation with Thames Water
  level: must
  required-if: discretionary
  source-text: Consultation with Thames Water if connecting to the sewer network
- item: Consultation with the Environment Agency
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
  source-text: Consultation with the Environment Agency is in Flood Zone 2 or 3
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  10. The 'Drainage Assessment Form'. 'A number of minor planning applications' has no threshold, so it
  shows as discretionary.
review-status: unverified
field-status: {}
