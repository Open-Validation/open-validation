reference: travel-plan
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - discretionary
    - condition:
        field: parking-change
        value: true
        description: Seeks to reduce existing parking provision (except individual dwellings).
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: A Transport Assessment and Travel Plan, prepared by a suitably qualified traffic consultant,
  is required for all applications that generate significant additional traffic and/or parking requirements,
  or seek to reduce existing parking provisions (with the exception of individual dwellings).
must-include:
- item: Prepared by a suitably qualified traffic consultant
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  8. Asked for together with the Transport Assessment. 'Significant additional traffic' shows as discretionary.
review-status: unverified
field-status: {}
