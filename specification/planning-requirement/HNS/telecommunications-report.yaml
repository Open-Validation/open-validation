reference: telecommunications-report
local-authority: HNS
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.hounslow.gov.uk/downloads/file/11156/prior-approval-telecommunications
source-text: A signed declaration that the equipment and installation has been designed to be in full
  compliance with the requirements of the radio frequency (RF) public exposure guidelines of the International
  Commission of Non-Ionizing Radiation Protection (ICNIRP). Details of consultation undertaken should
  also be provided.
must-include:
- item: Signed ICNIRP declaration that the equipment and installation fully complies with the RF public
    exposure guidelines
  level: must
- item: Details of consultation undertaken
  level: should
confidence: medium
notes: From the council's list (published January 2020), Prior approval telecommunications checklist,
  page 5. 'ICNIRP Signed' and 'Details of consultation undertaken'.
review-status: unverified
field-status: {}
