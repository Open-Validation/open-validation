reference: floor-plan-proposed
local-authority: HNS
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - lbc
    - ldc
    - prior-approval
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Drawings at a scale of 1:50 or 1:100 showing floor plans of the existing buildings & the
  proposed building, identifying each relevant floor/ part floor, roof, and means of access.
must-include:
- item: Drawn at a scale of 1:50 or 1:100, identifying each relevant floor or part floor, roof and means
    of access
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: Proposed plans shown in context with the site boundary and any existing adjacent buildings
  level: should
- item: 'For change of use: the extent of the existing and proposed use within the land or building'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  6. Application types follow the checklists that list it (Hounslow publishes one checklist per application
  type); 'prior-approval' stands for the 'Prior approval - non-householder' checklist.
review-status: unverified
field-status: {}
