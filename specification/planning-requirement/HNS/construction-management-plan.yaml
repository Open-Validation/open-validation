reference: construction-management-plan
local-authority: HNS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: basement
          value: true
          description: Creates a basement.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: basement
        value: true
        description: Basement excavation and/or extension.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Mayor's Sustainable Design and Construction SPG
source-text: Applications for major developments, or any develop which includes the creation of a basement,
  should submit details of how onsite impacts will be managed during the demolition/construction phase
  ... Required if the proposal involves basement excavation and/or extension.
must-include:
- item: How on-site impacts will be managed during demolition and construction (particularly on homes,
    other sensitive uses and biodiversity)
  level: must
- item: Traffic management, dust, noise, vibration and stability
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  9. The 'Design and Construction Method Statement'; the householder checklist (page 6) calls it a Construction
  Method Statement.
review-status: unverified
field-status: {}
