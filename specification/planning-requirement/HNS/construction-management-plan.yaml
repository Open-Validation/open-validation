reference: construction-management-plan
local-authority: HNS
required-if:
  any:
  - ref: major-development
  - condition:
      field: basement
      value: true
      description: The development includes the creation of a basement.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: Design and Construction Method Statement Applications for major developments, or any develop
  which includes the creation of a basement, should submit details of how onsite impacts will be managed
  during the demolition/construction phase (particularly on homes, other sensitive uses and biodiversity),
  including traffic management, dust, noise, vibration and stability.
must-include:
- item: How on-site impacts on homes, other sensitive uses and biodiversity will be managed during demolition
    and construction, including traffic management, dust, noise, vibration and stability
  level: must
