reference: planning-statement
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
  - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: A Planning Statement should to be submitted to support a planning application, and is to
  (where relevant)
must-include:
- item: Describes the site in detail (physical and operational)
  level: must
  required-if: discretionary
- item: Describes the proposed development in detail
  level: must
  required-if: discretionary
- item: Shows the environmental impacts of the development have been considered
  level: must
  required-if: discretionary
- item: Justification for any areas of non-compliance
  level: must
  required-if: discretionary
- item: Drawing numbers and accompanying documents list
  level: must
  required-if: discretionary
- item: Hours of operation / trading hours, staff numbers and use of car parking, for certain development
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  7. Shown as discretionary because the list lets a Cover Letter listing the drawing numbers and documents
  be submitted instead ('Where a Planning Statement is not submitted, a Cover Letter must be submitted');
  the cover letter is sent to unmapped.
review-status: unverified
field-status: {}
