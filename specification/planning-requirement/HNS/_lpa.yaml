submission-standards:
- item: All plans clearly highlight the proposed works; buildings or parts to be demolished shown with
    a dotted line or on a separate plan
  level: must
- item: Plans at the scales in the national requirements, with the scale clearly identified on each plan
  level: must
- item: All plans and documents show the applicant/agent name, property address, measurements in metric,
    draftsman/architect name or company, and reference details (date, name and number, version/revision)
  level: should
- item: All plans and documents consistent with each other
  level: must
- item: 'Minor applications: one electronic copy; paper only in exceptional circumstances'
  level: should
- item: 'Major applications: at least two paper copies and one copy on CD'
  level: must
- item: An email address for the applicant and/or agent on the application form
  level: must
- item: All fields on the application form completed, as the GLA Planning Data Standard requires
  level: must
