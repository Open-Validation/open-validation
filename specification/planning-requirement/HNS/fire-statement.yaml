reference: fire-statement
local-authority: HNS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.hounslow.gov.uk/planning-permission/apply-planning-permission
policy: London Plan (2021) Policy D12
source-text: Pursuant to the publication of the London Plan all new planning applications must be accompanied
  by fire safety information. This involves the submission of a Fire Statement for all major planning
  applications. All other applications, including householder extensions must demonstrate the highest
  standards of fire safety will be met.
must-include:
- item: A Fire Statement
  level: must
  required-if:
    ref: major-development
- item: A site plan showing a dedicated unobstructed area for the storage of fire equipment
  level: must
  required-if: discretionary
  source-text: 'For all non major applications to validated we require: a site plan showing a dedicated
    unobstructed area for the storage of fire equipment'
- item: A site plan showing a dedicated unobstructed area for evacuation
  level: must
  required-if: discretionary
  source-text: a site plan showing a dedicated unobstructed area for evacuation
- item: A statement confirming the requirements of London Plan policy D12(A) have been met
  level: must
  required-if: discretionary
  source-text: a statement confirming the requirements of policy D12a of the London Plan have been met
confidence: medium
notes: From the council's 'Apply for planning permission' web page (fire safety information), not the
  2020 checklists, which predate the London Plan 2021. The three items are required 'for all non major
  applications'; there is no 'not major' construct, so they show as discretionary.
