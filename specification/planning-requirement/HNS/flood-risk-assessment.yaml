reference: flood-risk-assessment
local-authority: HNS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - prior-approval
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of one hectare or greater in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of one hectare or greater in Flood Zone 1.
      - site:
          in:
          - flood-risk-zone
          description: New development in Flood Zone 2 or 3.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In flood risk zone 2 or 3.
    - condition:
        field: ground-floor-or-basement
        value: true
        description: A basement or ground floor extension.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: National Planning Policy Framework
source-text: An FRA needs to accompany development proposals of one hectare or greater in Flood Zone 1
  and all proposals for new developments located in Flood Zones 2 and 3. ... Required if the site is in
  a flood risk zone 2 or 3 and the proposal is for a basement or ground floor extension
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed
  level: must
- item: 'For householder proposals: the Environment Agency Flood Risk Matrix'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  11. The householder checklist (page 5) asks for the 'Environment Agency Flood Risk Matrix' for a basement
  or ground floor extension in flood zone 2 or 3. Application types follow the checklists that list it
  (Hounslow publishes one checklist per application type); 'prior-approval' stands for the 'Prior approval
  - non-householder' checklist.
review-status: unverified
field-status: {}
