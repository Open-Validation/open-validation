reference: design-and-access-statement
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - all:
      - site:
          in:
          - conservation-area
          description: Within a conservation area.
      - any:
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: Creates 100 sq m or more of floorspace.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Creates one or more dwelling houses.
    - ref: major-development
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Design and Access Statement is required if the site is within a conservation area and creates
  100m2 or more of floorspace or one or more dwelling houses. ... Section 9 of the Town and Country Planning
  (Development Management Procedure) (England) Order 2015 describes in detail when a Design and Access
  Statement is required.
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: How the context was appraised and how the design takes it into account
  level: must
- item: The policy adopted as to access, and how local access policies have been taken into account
  level: must
- item: Any consultation on access and what account was taken of it
  level: must
- item: How specific issues which might affect access have been addressed
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  7. Major development is included because the list points to the DMPO, which requires a DAS for major
  development.
review-status: unverified
field-status: {}
