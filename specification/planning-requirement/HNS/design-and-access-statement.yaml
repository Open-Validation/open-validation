reference: design-and-access-statement
local-authority: HNS
required-if:
  all:
  - site:
      in:
      - conservation-area
      description: The site is within a conservation area.
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The proposal creates 100 square metres or more of floorspace.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwelling houses.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: Use of car parking Design and Access Statement A Design and Access Statement is required
  if the site is within a conservation area and creates 100m2 or more of floorspace or one or more dwelling
  houses.
