reference: sci
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: 'Large scale major: 100 or more net homes.'
    - condition:
        field: floorspace
        operator: '>='
        value: 10000
        description: 'Large scale major: 10,000 sq m or more of commercial or visitor floorspace.'
  - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: Required for all large-scale major applications where consultation with the local community
  is required before the submission of an application.
must-include:
- item: Full details of community consultation and engagement, and how it influenced the design
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  13. 'Statement of Community Engagement'. 'Large scale major' uses the list's own definition in its Health
  Impact Assessment item (100 or more net homes, or 10,000 sq m or more). Whether consultation 'is required
  before the submission' is not defined, so that part shows as discretionary.
review-status: unverified
field-status: {}
