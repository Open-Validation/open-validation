reference: town-centre-impact-assessment
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Edge-of-centre or out-of-centre location.
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 500
          description: 500 sq m of retail.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Edge-of-centre or out-of-centre location.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 2500
          description: 2,500 sq m of retail or other main town centre uses.
    - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: National Planning Policy Framework
source-text: If the proposal involves the loss of retail floorspace in a town centre location or the location
  of 2,500sqm of retail or other main town centre uses in an edge-of-centre or out-of-centre location
  then a retail impact assessment will be required. ... Any proposal for 500sqm of retail or 2,500sqm
  of other main town centre uses in an edge-of-centre or out-of-centre location should demonstrate that
  there are no available or suitable sites in a town centre
must-include:
- item: Impact on existing, committed and planned public and private investment, and on town centre vitality
    and viability
  level: must
  required-if:
    any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: 2,500 sq m of retail or other main town centre uses out of centre.
    - discretionary
- item: A sequential approach (NPPF) showing no available or suitable town centre sites
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  13. 'Retail / Office Assessment'. Loss of retail floorspace in a town centre has no field, so it shows
  as discretionary. The same item's loss-of-employment evidence (B1, B2, B8) is sent to unmapped.
review-status: unverified
field-status: {}
