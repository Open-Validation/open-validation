reference: heritage-statement
local-authority: HNS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline
        - reserved-matters
    - site:
        in:
        - listed-building
        description: Works to a listed building.
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
  - application-type:
      in:
      - lbc
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: National Planning Policy Framework
source-text: Required if the proposal involves works to a listed building and is within a conservation
  area. ... As required by the NPPF, applicants should describe the significance of any heritage assets
  affected by the proposal, including any contribution made to the setting of the heritage asset.
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting;
    detail proportionate to the assets' importance
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  12. 'Listed Building and Conservation Area Appraisal' in the planning checklists; 'Heritage Statement'
  in the listed building consent checklist (page 5), which adds that development in a conservation area
  may affect the setting of a heritage asset and could therefore require one.
review-status: unverified
field-status: {}
