reference: site-plan
local-authority: HNS
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc
    - prior-approval
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A site plan is required to be submitted for all planning applications, and is to include
  accurately show the proposed development and, where relevant, include:'
must-include:
- item: Scaled at 1:500
  level: must
- item: Accurately shows the proposed development
  level: must
- item: Boundary locations
  level: must
  required-if: discretionary
- item: Existing structures on the site (including sheds, outbuildings and extensions)
  level: must
  required-if: discretionary
- item: Landscaping features and fences
  level: must
  required-if: discretionary
- item: Car parking, cycle parking and waste storage areas
  level: must
  required-if: discretionary
- item: Utility manholes
  level: must
  required-if: discretionary
- item: North point (true north)
  level: must
- item: Scale bar
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  5. The 'Block Plan'. Not listed for prior approval of demolition, non-material amendments or discharge
  of conditions. The items listed 'where relevant' show as discretionary. Application types follow the
  checklists that list it (Hounslow publishes one checklist per application type); 'prior-approval' stands
  for the 'Prior approval - non-householder' checklist.
review-status: unverified
field-status: {}
