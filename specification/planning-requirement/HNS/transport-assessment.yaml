reference: transport-assessment
local-authority: HNS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - discretionary
      - condition:
          field: parking-change
          value: true
          description: Seeks to reduce existing parking provision (except individual dwellings).
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
source-text: A Transport Assessment and Travel Plan, prepared by a suitably qualified traffic consultant,
  is required for all applications that generate significant additional traffic and/or parking requirements,
  or seek to reduce existing parking provisions (with the exception of individual dwellings).
must-include:
- item: Prepared by a suitably qualified traffic consultant
  level: must
- item: Addresses all traffic and parking issues, including potential conflicts between vehicles, pedestrians,
    cyclists and other road users
  level: must
- item: Considers sustainable modes of transport in line with the London Plan and NPPF
  level: should
- item: Supported by a parking survey
  level: should
  required-if: discretionary
  source-text: 'The assessment should be supported by a parking survey where the following criteria apply:
    • Developments in an area with a low PTAL and not covered by a CPZ • Developments surrounding stations
    and not covered by a CPZ • Developments within area not covered by a CPZ and within a close proximity
    to Town Centres'
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  8. 'Significant additional traffic' has no threshold, so it shows as discretionary. The 'Prior approval
  - non-householder' checklist (page 6) also lists a Transport Statement, with no trigger. Application
  types follow the checklists that list it (Hounslow publishes one checklist per application type); 'prior-approval'
  stands for the 'Prior approval - non-householder' checklist.
review-status: unverified
field-status: {}
