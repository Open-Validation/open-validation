reference: noise-assessment
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - prior-approval
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Would generate noise disturbance for adjoining occupants.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Existing noise pollution could have an adverse impact on the development.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Development Control for Noise Generating and Noise Sensitive Development SPD
source-text: A Noise Impact Assessment should be submitted where the development proposal would generate
  noise disturbance issues for adjoining occupants and for developments where noise pollution is already
  poor and could have an adverse impact on the proposed development.
must-include:
- item: Whether noise is an issue, and the mitigation so that occupiers are not negatively affected by
    existing noise
  level: must
- item: Informed by BS 8233, BS 4142 and BS 6472-1
  level: should
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  10. Application types follow the checklists that list it (Hounslow publishes one checklist per application
  type); 'prior-approval' stands for the 'Prior approval - non-householder' checklist.
review-status: unverified
field-status: {}
