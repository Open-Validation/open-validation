reference: location-plan
local-authority: HNS
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc
    - prior-approval
    - non-material-amendment
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required to be submitted for every application. An up to date map at a scale of 1:1250 or
  1:2500 for larger sites.
must-include:
- item: Up to date map at a scale of 1:1250, or 1:2500 for larger sites
  level: must
- item: Application site clearly edged with a red line, including all land required for the development
    (including any access)
  level: must
- item: Other land within the control or ownership of the applicant, adjacent or close to the site, edged
    with a blue line
  level: should
- item: Not sourced from Land Registry or the London Borough of Hounslow
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  5. Listed in every checklist except prior approval (householder), tree works and discharge of conditions.
  Application types follow the checklists that list it (Hounslow publishes one checklist per application
  type); 'prior-approval' stands for the 'Prior approval - non-householder' checklist.
review-status: unverified
field-status: {}
