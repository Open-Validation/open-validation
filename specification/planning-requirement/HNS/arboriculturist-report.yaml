required-if:
  all:
  - application-type:
      in:
      - hh
  - condition:
      field: loss-of-habitat-features
      value: true
      description: A tree is proposed to be felled.
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: The tree is covered by a tree preservation order or is in a conservation area.
