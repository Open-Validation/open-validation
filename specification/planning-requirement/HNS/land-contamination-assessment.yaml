reference: land-contamination-assessment
local-authority: HNS
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - prior-approval
  - site:
      in:
      - contaminated-land
      description: The site has a land contamination history or could be contaminated.
source-url: https://www.hounslow.gov.uk/downloads/file/11164/full-planning-major-or-minor-checklist
policy: Hounslow Contaminated Land Strategy
source-text: A land contamination assessment will be required where there is a land contamination history
  or there is the potential for a development site to be contaminated. ... Required if the area has a
  history of contaminated land.
must-include:
- item: Site investigation information prepared by a competent person with a relevant qualification, experience
    of the type(s) of pollution or land instability, and membership of a professional organisation
  level: must
confidence: medium
notes: From the council's list (published January 2020), Full planning (major or minor) checklist, page
  10. The 'Prior approval - non-householder' checklist (page 5) asks for a desk top contamination study
  'if the area has a history of contaminated land'. Application types follow the checklists that list
  it (Hounslow publishes one checklist per application type); 'prior-approval' stands for the 'Prior approval
  - non-householder' checklist.
review-status: unverified
field-status: {}
