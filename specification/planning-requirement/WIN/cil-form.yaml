reference: cil-form
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - change-of-use
      - s73
      - ldc-prospective-use
      - prior-approval
  - any:
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 100
        description: New residential development over 100 square metres.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The creation of 1 or more dwellings (even if less than 100 square metres).
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 0
        description: New retail development.
    - condition:
        field: hotel-development
        value: true
        description: New hotel development.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester CIL Charging Schedule; Community Infrastructure Levy Regulations 2010 (as amended)
source-text: 'We will need a CIL Additional Information Requirement Form when: New residential development
  over 100 square meters The creation of 1 or more dwellings (even if it is less than 100 square meters).
  New retail and hotel developments'
must-include:
- item: A statement addressing the criteria in Part 6 of the CIL Regulations 2010 (as amended)
  level: must
  required-if:
    condition:
      field: cil-relief-claimed
      value: true
      description: The applicant is applying for Charitable Relief or Social Housing Relief.
  source-text: Applications for either Charitable Relief or Social Housing Relief will be required to
    include a statement which addresses the criteria set out in Part 6 of the CIL Regulations 2010 (as
    amended).
confidence: medium
notes: From the council's list (approved 6 March 2023), page 5. Listed for 'All Full, Householders and
  Prior Approval applications that meet the criteria in the CIL charging zone.' The quick checklist also
  ticks it for outline, change of use, variation of condition and lawful development (proposed) applications
  where new residential, retail or hotel floorspace is created.
review-status: unverified
field-status: {}
