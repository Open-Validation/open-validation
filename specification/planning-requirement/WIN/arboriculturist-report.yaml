reference: arboriculturist-report
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - s73
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Construction works which would impact on a tree, either on site or in a neighbouring
          property (a TPO tree, a retained important tree or tree removal).
  - all:
    - application-type:
        in:
        - reserved-matters
        - change-of-use
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policy CP15; Local Plan Part 2 policies DM15, DM24; BS 5837:2012
source-text: For any construction works which would impact on a Tree(s), either on site or in a neighbouring
  property we expect an arboriculture impact and method statement with a tree protection plan in accordance
  with BS 5837:2012 Trees in relation to design, demolition and construction recommendations.
must-include:
- item: Arboricultural impact assessment and method statement
  level: must
- item: Tree protection plan
  level: must
- item: In accordance with BS 5837:2012 Trees in relation to design, demolition and construction
  level: must
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 20. ''Tree Survey / Report'', ''For All
  Applications where proposal affects a TPO, retained important tree or tree removal.'' Application types
  follow the council''s Quick Checklist (to be read with the list), which marks this document for: householder,
  full or outline and variation of condition (''Where trees affected''), with ''?'' for reserved matters
  and change of use (shown as discretionary). The quick checklist also ticks tree works and hedgerow applications,
  but the detailed wording is about construction works, so those types are left out.'
review-status: unverified
field-status: {}
