reference: bng-metric
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
      - prior-approval
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://www.winchester.gov.uk/planning/planning-applications/national-and-local-validation
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Winchester District Local Plan Part 1 policy CP16
source-text: Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015 ... the completed metric calculation
  tool showing the calculations of the pre-development biodiversity value of the onsite habitat on the
  date of application (or proposed earlier date) including the publication date of the biodiversity metric
  used to calculate that value
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value(s) on the date of application, or an earlier proposed date
    with the reasons for proposing it
  level: must
- item: The publication date of the biodiversity metric used
  level: must
- item: A statement whether activities have been carried out that result in loss of onsite biodiversity
    value (degradation) and, if so, the date before they were carried out, the value on that date, the
    completed metric for it and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or the earlier
    date)
  level: must
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 4, and the council''s ''National and Local
  Validation List Requirements'' web page (last updated 7 March 2024). The list itself says BNG will be
  required ''as of November 2023'' for ''All Applications for Major and Minor Development and desirable
  for Householders'' (an interim requirement ''to be updated''); the web page gives the statutory minimum
  information, which is what this file follows: the rule uses the biodiversity gain condition because
  householder and other exempt applications are exempt by law. Types follow the quick checklist (''From
  Nov 2023'').'
review-status: unverified
field-status: {}
