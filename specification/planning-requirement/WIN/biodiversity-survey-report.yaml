reference: biodiversity-survey-report
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - change-of-use
        - s73
    - any:
      - condition:
          field: protected-species
          value: true
          description: Impact on priority species (section 41 NERC Act 2006), or a reasonable likelihood
            of protected species and/or their habitats/notable habitats.
      - site:
          in:
          - local-wildlife-site
          - site-of-special-scientific-interest
          - special-protection-area
          - special-area-of-conservation
          description: Within, adjacent to, or would have an impact on Local Wildlife sites (SINCs & SNCIs),
            Local Nature Reserves, National Nature Reserves, SSSIs or internationally designated sites.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies CP13, CP15, CP16; Local Plan Part 2 policies DM15,
  DM17; Conservation of Habitats and Species Regulations; Wildlife and Countryside Act 1981; NERC Act
  2006
source-text: 'As determined by the Biodiversity checklist - all applications for development within or
  adjacent to, or would have an impact on priority species as detailed on Section 41 of the Natural Environment
  and Rural Communities Act 2006, or within, adjacent to, or would have an impact upon one or a combination
  of the following sites: Local Wildlife sites (SINCS & SNCIs), Local Nature Reserves, National Nature
  Reserves, SSSIs, internationally designated sites and/or where there is a reasonable likelihood of protected
  species and/or their habitats/notable habitats.'
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 4. Row ''Biodiversity Survey and Report;
  Construction Environment Method Statement; Ecological Impact Assessment''. Application types follow
  the council''s Quick Checklist (to be read with the list), which marks this document for: householder,
  full or outline, change of use and variation of condition (''Subject to checklist''), with ''?'' for
  reserved matters (shown as discretionary). The Biodiversity Checklist itself is in the council''s unmapped
  rows.'
review-status: unverified
field-status: {}
