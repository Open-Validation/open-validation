reference: floor-plan-existing
local-authority: WIN
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - full
      - outline
      - change-of-use
      - s73
      - prior-approval
  - all:
    - application-type:
        in:
        - reserved-matters
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Full, Outline and Householder applications
must-include:
- item: Drawn at a scale of 1:50 or 1:100 with a scale bar
  level: must
- item: Any existing buildings or walls to be demolished clearly shown
  level: must
- item: Details of the existing building(s) as well as the proposed development
  level: must
- item: A new building shown in context with adjacent buildings, including property numbers where applicable
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building is proposed.
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 10. ''Floor Plans (existing and proposed)'',
  listed for ''All Full, Outline and Householder applications''. Application types follow the council''s
  Quick Checklist (to be read with the list), which marks this document for: householder, listed building
  consent, full or outline, change of use, removal or variation of a condition and prior approval; ''If
  relevant'' for reserved matters and lawful development certificates (shown as discretionary).'
review-status: unverified
field-status: {}
