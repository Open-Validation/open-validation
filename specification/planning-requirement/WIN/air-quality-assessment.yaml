reference: air-quality-assessment
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - site:
      in:
      - air-quality-screening-area
      description: On land in or within 1km of the Winchester settlement area, as mapped in the council's
        Air Quality SPD.
  - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies DS1, CP11, CP13; Local Plan Part 2 policy DM19;
  Air Quality Supplementary Planning Document (September 2021); Air Quality Action Plan Winchester City
  Centre 2017
source-text: The Supplementary Planning Document (SPD) sets out the Council’s requirements for reducing
  air pollution emissions from new development on all land that is either in or within 1km of the Winchester
  settlement area as shown on the map in the SPD and in larger detail in Appendix H. Planning applications
  within the SPD area should be screened using the thresholds in Table 2 of the SPD and should be subject
  to the relevant level of assessment required for the application.
confidence: medium
notes: From the council's list (approved 6 March 2023), page 1-2. The level of assessment depends on the
  screening thresholds in Table 2 of the SPD, which the list does not give, so that part is shown as discretionary.
  Listed for 'Full Planning Applications for Housing or Commercial uses and Householder Planning Applications';
  the quick checklist ticks householder, full or outline, reserved matters, change of use and variation
  of condition 'Within 1km of Winch'.
