reference: design-and-access-statement
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (Conservation Area, World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - reserved-matters
        - change-of-use
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Winchester
  District Local Plan Part 1 policies CP13, CP20; Local Plan Part 2 policies DM15, DM16, DM17, DM27, DM30,
  DM31
source-text: 'Design and Access statements must be provided for: Applications for major development, as
  defined in article 2 of the Town and Country Planning (Development Management Procedure (England) Order
  2015; Applications for development in a designated area (Conservation Area, World heritage Site), where
  the proposed development consists of: one or more dwellings; or a building or buildings with a floor
  space of 100 square metres or more. Applications for listed building consent.'
confidence: medium
notes: From the council's list (approved 6 March 2023), page 8. Not needed for 'waste development, a material
  change of use, engineering or mining operations or material minor amendment to amend the conditions
  on an application'. The quick checklist shows '?' for reserved matters and change of use (shown as discretionary).
review-status: unverified
field-status: {}
