reference: waste-management-plan
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential uses.
      - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
        - s73
        - prior-approval
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policy CP13; Local Plan Part 2 policy DM17; WCC Waste Management
  Guidelines for new development
source-text: All new residential uses must provide suitable waste management facilities in coordination
  with WCCs collection service.
must-include:
- item: Suitable waste management facilities, coordinated with the council's collection service
  level: must
confidence: medium
notes: From the council's list (approved 6 March 2023), page 20. 'Waste Management Strategy', listed for
  'All Full and Outline applications for new residential or other uses needing waste services'; 'other
  uses needing waste services' is shown as discretionary. The quick checklist shows '?' for reserved matters,
  variation of condition and prior approval.
review-status: unverified
field-status: {}
