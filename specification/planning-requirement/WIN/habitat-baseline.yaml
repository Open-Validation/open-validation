reference: habitat-baseline
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
      - prior-approval
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://www.winchester.gov.uk/planning/planning-applications/national-and-local-validation
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: plan(s), drawn to an identified scale and showing the direction of North, showing onsite
  habitat existing on the date of application (or earlier proposed date), including any irreplaceable
  habitat (if applicable).
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's 'National and Local Validation List Requirements' web page (last updated 7 March
  2024), which publishes the list; part of the biodiversity gain information required by Article 7. The
  rule uses the biodiversity gain condition because exempt applications (including householder) are exempt
  by law.
review-status: unverified
field-status: {}
