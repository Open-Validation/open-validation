reference: affordable-housing-statement
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more homes.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A housing site of 0.5 hectares or more.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies CP2, CP3, CP4; Affordable Housing SPD (2008); High
  Quality Places SPD (2015)
source-text: Required for housing development where 10 or more homes will be provided, or the site has
  an area of 0.5 hectares or more and must include 40% affordable housing including on site provision
  specifying, number and mix, tenure and distribution of affordable units.
must-include:
- item: 40% affordable housing, including on-site provision
  level: must
- item: Number and mix of the affordable units
  level: must
- item: Tenure of the affordable units
  level: must
- item: Distribution of the affordable units
  level: must
confidence: medium
notes: From the council's list (approved 6 March 2023), page 1. Listed for 'Full Planning Applications
  for Housing – Major 10 or more house and Minor greater > than 0.5 ha.' The quick checklist ticks it
  for full or outline major residential applications and 'update if for residential' at reserved matters
  and variation of condition.
review-status: unverified
field-status: {}
