reference: telecommunications-report
local-authority: WIN
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Mast and antenna development, or other telecommunication equipment.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Local Plan Part 2 policy DM22; Code of practice for wireless network development in England
source-text: Applications for mast and antenna development by mobile phone network operators should be
  accompanied by a range of supplementary information including as set out in the Code of Best Practice
  on for Wireless network development in England.
must-include:
- item: Coverage plots of existing and proposed signal coverage
  level: should
- item: Coverage plots demonstrating poor signal where alternative sites are rejected for poor coverage
    reasons
  level: should
- item: ICNIRP certificate
  level: must
- item: 'For a mast within three kilometres of the perimeter of an aerodrome: evidence that the developer
    has notified the Civil Aviation Authority, the Secretary of State for Defence or the aerodrome operator'
  level: must
confidence: medium
notes: From the council's list (approved 6 March 2023), page 19. 'Telecommunications Coverage Plots and
  ICNIRP Certificate', for 'All planning applications and prior notifications for telecommunication equipment.'
review-status: unverified
field-status: {}
