reference: site-plan
local-authority: WIN
required-if:
  always: true
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Applications
must-include:
- item: Drawn at a scale of 1:500 or 1:200 with a scale bar
  level: must
- item: Direction of North
  level: must
- item: Footprint of the proposed development in relation to the site boundaries and other existing buildings,
    with written dimensions including those to the boundaries
  level: must
- item: Extent and type of any existing and proposed hard surfacing
  level: must
- item: Position and extent of any existing and proposed boundary treatment, including walls or fencing
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site and present on the extent of the plan
  level: must
- item: Position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: Ordnance Survey plan bearing a valid Ordnance Survey licence number
  level: must
  source-text: Ordnance Survey plans submitted with planning applications for location and block plans
    MUST bear a valid licence number, the licence having been issued by the Ordnance Survey and allowing
    the applicant/agent to use that information.
confidence: medium
notes: From the council's list (approved 6 March 2023), page 5, 13. 'Block/Site Plan (existing and proposed
  site)'. The OS licence item is from the 'OS Copyright Information' row.
review-status: unverified
field-status: {}
