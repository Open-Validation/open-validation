reference: sustainable-drainage-strategy
local-authority: WIN
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Local Plan Part 2 policy DM17; NPPF section 14; Building Regulations Approved Document H; Non-statutory
  technical standards for sustainable drainage systems (March 2015)
source-text: 'Developments will provide a drainage strategy for surface and foul drainage showing existing
  and proposed arrangements. ... For Minor applications of 1-9 houses/ small commercial buildings should
  provide a drainage strategy with the appropriate plans / calculations to ensure measures are put in
  place to manage water from additional hardstanding areas, particularly where they are within one of
  HCC priority areas. ... Householder planning applications: A basic drainage strategy will be desirable
  to ensure measures are put in place to manage water from additional hardstanding areas'
must-include:
- item: Surface and foul drainage, showing existing and proposed arrangements
  level: must
- item: Plans and calculations showing how water from additional hardstanding areas will be managed
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor applications of 1-9 houses or small commercial buildings.
- item: Infiltration testing where soakaways are being considered
  level: should
  source-text: Infiltration testing is critical if soakaways are being considered.
confidence: medium
notes: From the council's list (approved 6 March 2023), page 7. 'Drainage Strategy', listed for 'All Full,
  Outline and Householder applications'. Householder applications show as discretionary because the list
  calls a basic strategy 'desirable' (the quick checklist shows '?'). Types follow the quick checklist
  ('Drainage Strategies'), including 'update' at reserved matters. Hampshire County Council is the Lead
  Local Flood Authority for major applications.
review-status: unverified
field-status: {}
