reference: archaeological-assessment
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
    - site:
        in:
        - archaeological-priority-area
        description: Within an area of recognised archaeological significance or potential.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal disturbs the ground.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies CP13, CP20; Local Plan Part 2 policy DM26; NPPF
  chapter 16; Ancient Monuments and Archaeological Areas Act 1979; Hedgerows Regulations 1997
source-text: All Full, Outline and Householder Applications involving the disturbance of ground within
  an area of recognised archaeological significance or potential. Major Applications or applications with
  significant infrastructure works in other areas, where heritage assets with archaeological interest
  may survive. Hedgerow Removal Applications where it affects a hedgerow which is important for landscape
  or historical reasons.
must-include:
- item: An appropriate desk-based assessment and/or a report on a field evaluation, as required
  level: must
  source-text: Applicants may be required to submit an appropriate desk-based assessment, and /or to undertake
    and submit a report on a field evaluation.
- item: 'Desk-based assessment: known and potential archaeological remains, their significance and any
    contribution made by their setting'
  level: should
- item: An assessment of the impact of the proposed development on the significance of archaeological
    remains within the site
  level: should
confidence: medium
notes: From the council's list (approved 6 March 2023), page 2-3. Major applications and significant infrastructure
  works 'in other areas where heritage assets with archaeological interest may survive', and hedgerows
  'important for landscape or historical reasons', depend on judgement, so they are shown as discretionary.
  The assessment may be part of a Heritage Statement.
review-status: unverified
field-status: {}
