reference: town-centre-impact-assessment
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
      - prior-approval
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development outside defined town centres.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m or more (Winchester Town).
    - all:
      - condition:
          field: outside-main-town
          value: true
          description: Outside Winchester Town.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more elsewhere.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies WT1, WT2, MTRA1-MTRA4, CP8; Local Plan Part 2 policies
  WIN1, DM7, DM8, DM9
source-text: 'Required for development proposals exceeding 2,500 square metres gross of floor space for
  out of centre and edge of centre proposals on town centre vitality/viability and investment, relating
  to retail and leisure developments (not all main town centre uses) which are not in accordance with
  up to date plan policies and which would be located outside existing town centres. Local requirement:
  Proposals for retail, leisure and office developments that are outside of defined town centres and have
  floor space of 1,000 sq m or more in Winchester Town and 500 sq m or more elsewhere, will also require
  the submission of an impact assessment'
confidence: medium
notes: From the council's list (approved 6 March 2023), page 17. 'Retail Impact Assessment', 'For Full
  and Outline Applications where relevant size'. The national 2,500 sq m threshold is covered by the lower
  local thresholds. The quick checklist also marks it 'Update for retail' at reserved matters and variation
  of condition, 'For retail' for change of use and 'For retail COU' for prior approval.
review-status: unverified
field-status: {}
