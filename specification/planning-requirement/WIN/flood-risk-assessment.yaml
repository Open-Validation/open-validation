reference: flood-risk-assessment
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - change-of-use
    - any:
      - site:
          in:
          - flood-risk-zone
          description: In flood zone 2 or 3, including minor development and change of use.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: More than 1 hectare in flood zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: More than 1 hectare in flood zone 1.
      - site:
          in:
          - surface-water-flood-risk
          description: Less than 1 ha in flood zone 1 (including a change of use to a more vulnerable
            class) where it could be affected by sources of flooding other than rivers and the sea, such
            as surface water drains or reservoirs.
      - site:
          in:
          - critical-drainage-area
          description: In flood zone 1 with critical drainage problems notified by the Environment Agency.
  - all:
    - application-type:
        in:
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policy CP17; Local Plan Part 2 policy DM17
source-text: Requirement for most developments within one of the flood zones. In flood zone 2 or 3 including
  minor development and change of use More than 1 hectare (ha) in flood zone 1 Less than 1ha in flood
  zone 1, including a change of use in development type to a more vulnerable class (for example from commercial
  to residential), where they could be affected by source of flooding other than rivers and the sea (for
  example surface water drains, reservoirs) In an area within flood zone 1 which has critical drainage
  problems as notified by the Environment Agency
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 10. Listed for ''All Applications of relevant
  size in relevant Flood Zone''. Application types follow the council''s Quick Checklist (to be read with
  the list), which marks this document for: householder, full or outline and change of use (''If in relevant
  flood zone''), with ''?'' for reserved matters and variation of condition (shown as discretionary).
  Where the developer believes the risk is low, Hampshire County Council expects a high level assessment
  confirming risk from fluvial, surface water, groundwater and coastal sources.'
review-status: unverified
field-status: {}
