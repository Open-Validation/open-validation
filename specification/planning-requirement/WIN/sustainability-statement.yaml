reference: sustainability-statement
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 500
        description: Commercial floorspace over 500 square metres.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: A conversion.
      - condition:
          field: floorspace
          operator: '>'
          value: 500
          description: Over 500 square metres of floorspace.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies DS1, WT3, SH2, SH3, CP11, CP12
source-text: All new Housing will be required to meet the mandatory Building Regulations requirements
  for energy and water use and additional options which are comparable with the requirements for the former
  Code for Sustainable Homes Level 4 will also be required by a planning applications. ... For residential
  conversions and new non domestic buildings over 500sqm a BREEAM Residential Conversion or New Construction
  excellent standard would be expected to be demonstrated at design stage with the submission of an Energy
  Assessment.
must-include:
- item: 'For new housing: how it meets the mandatory Building Regulations requirements for energy and
    water use, plus options comparable with the former Code for Sustainable Homes Level 4'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New housing.
- item: 'For residential conversions and new non-domestic buildings over 500 sq m: BREEAM Residential
    Conversion or New Construction ''excellent'' standard demonstrated at design stage, with an Energy
    Assessment'
  level: should
  required-if:
    any:
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 500
        description: New non-domestic buildings over 500 sq m.
    - condition:
        field: involves-change-of-use
        value: true
        description: A residential conversion.
confidence: medium
notes: From the council's list (approved 6 March 2023), page 18. 'Sustainability Strategy', listed for
  'All Full and Outline Applications for new residential. Commercial or conversion of over 500msq Floorspace'.
  The quick checklist also ticks reserved matters ('Update'), change of use and variation of condition,
  and marks householder applications 'Desirable'.
review-status: unverified
field-status: {}
