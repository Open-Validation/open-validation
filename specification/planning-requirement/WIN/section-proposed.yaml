reference: section-proposed
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - hh
      - lbc
      - full
      - outline
      - reserved-matters
      - s73
      - ldc-prospective-use
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The site slopes.
    - all:
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zone 2 or 3.
      - condition:
          field: building-works
          value: true
          description: A detached building or an extension.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for proposals on sloping sites. Required for detached buildings and extensions within
  flood zones 2 and 3.
must-include:
- item: Finished floor levels shown above a fixed datum point, e.g. a manhole cover
  level: must
- item: Drawn at a scale of 1:50 or 1:100 with a scale bar
  level: must
- item: A cross section(s) through the proposed building(s)
  level: must
confidence: medium
notes: From the council's list (approved 6 March 2023), page 17. 'Section Plans/Levels (existing and Proposed)';
  the detailed list gives no application types. The quick checklist marks sections 'Desirable' for full
  and outline applications and '?' for householder, listed building consent, reserved matters, variation
  of condition and lawful development (proposed); the types here are those columns.
review-status: unverified
field-status: {}
