reference: viability-assessment
local-authority: WIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 dwellings or over.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: 0.5 ha and over.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The policy CP3 requirement of 40% affordable housing cannot be met.
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies CP3, CP4
source-text: In all instances where policy CP3 40% requirement cannot be met. This document will be publically
  available and published on the public access website to view with the planning application.
confidence: medium
notes: From the council's list (approved 6 March 2023), page 20. Listed for 'All Major Applications for
  new residential development (10 dwellings or over or 0.5ha and over)'. The quick checklist ticks full
  or outline major residential, and change of use and variation of condition 'Where Major resi'. The assessment
  is published on the council's website.
review-status: unverified
field-status: {}
