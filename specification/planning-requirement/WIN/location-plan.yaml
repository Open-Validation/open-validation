reference: location-plan
local-authority: WIN
required-if:
  always: true
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Applications
must-include:
- item: Drawn at a scale of 1:1250 or 1:2500 with a scale bar
  level: must
- item: Direction of North
  level: must
- item: Enough roads or buildings on adjoining land to make the exact location of the site clear
  level: must
- item: The boundary of the property, including access to the highway, edged in red
  level: must
- item: Any other land in the same ownership or control close to or adjacent to the site edged in blue
  level: must
- item: Rights of way identified
  level: must
- item: Ordnance Survey plan bearing a valid Ordnance Survey licence number
  level: must
  source-text: Ordnance Survey plans submitted with planning applications for location and block plans
    MUST bear a valid licence number, the licence having been issued by the Ordnance Survey and allowing
    the applicant/agent to use that information.
confidence: medium
notes: From the council's list (approved 6 March 2023), page 12, 13. The OS licence item is from the 'OS
  Copyright Information' row.
review-status: unverified
field-status: {}
