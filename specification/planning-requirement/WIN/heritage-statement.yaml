reference: heritage-statement
local-authority: WIN
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - world-heritage-site
    - scheduled-monument
    - park-and-garden
    - locally-listed-building
    description: 'Proposals affecting heritage assets and their settings: world heritage sites, listed
      buildings, conservation areas, scheduled monuments, registered parks and gardens, registered battlefields,
      protected wrecks, and non-designated heritage assets such as locally listed buildings.'
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policies CP13, CP19, CP20; Local Plan Part 2 policies WIN3,
  DM25-DM34; NPPF chapter 16; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: A Heritage Statement is required for all proposals affecting heritage assets and their settings.
must-include:
- item: A proportionate and impartial description of the significance of the heritage asset(s), following
    appropriate desk-based and archival research and analysis of its historical development, form, construction,
    materials, character and appearance
  level: should
- item: Depending on the proposals, the contribution made by setting to the asset's significance
  level: should
- item: Enough information and analysis for the council to understand the impact of the proposals on that
    significance
  level: should
- item: Contextual and detailed photographs of the asset, with any relevant research material
  level: should
confidence: medium
notes: From the council's list (approved 6 March 2023), page 11. Listed for 'all Applications with proposals
  affecting heritage assets and their settings'. The quick checklist marks it 'Where Heritage Asset affected'
  for listed building consent, full or outline and change of use, '?' for reserved matters and variation
  of condition, and a cross for householder applications; this file follows the detailed list. It may
  be part of a Design and Access Statement.
review-status: unverified
field-status: {}
