reference: elevation-proposed
local-authority: WIN
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - full
      - outline
      - s73
      - advertising
  - all:
    - application-type:
        in:
        - reserved-matters
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Applications
must-include:
- item: Drawn at a scale of 1:50 or 1:100 with a scale bar
  level: must
- item: The proposed works shown in relation to what is already there
  level: must
- item: Proposed building materials, and the type, materials and finish of doors and windows, clearly
    annotated
  level: must
- item: 'Where a proposed elevation adjoins or is close to another building: the relationship between
    the buildings and the positions of openings on each property'
  level: must
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 9. ''Elevation Drawings (existing and proposed)''.
  Application types follow the council''s Quick Checklist (to be read with the list), which marks this
  document for: householder, listed building consent, full or outline, removal or variation of a condition
  and advertisement consent; ''If relevant to REM'' for reserved matters and ''If relevant proposal''
  for lawful development certificates (shown as discretionary). Not for change of use or tree works. Prior
  approval: ''Desirable''.'
review-status: unverified
field-status: {}
