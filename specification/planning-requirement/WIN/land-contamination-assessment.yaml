reference: land-contamination-assessment
local-authority: WIN
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Land which is known or suspected to be contaminated, or likely to be affected by contamination.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Local Plan Part 2 policy DM21
source-text: The development of land which is known or suspected to be contaminated, or which is likely
  to be affected by contamination should provide a desk based assessment, site investigations, risk assessment,
  remediation strategy in accordance with current industry best practice guidelines. Assessments should
  accompany planning applications.
must-include:
- item: Desk based assessment
  level: should
- item: Site investigations
  level: should
- item: Risk assessment
  level: should
- item: Remediation strategy
  level: should
- item: Prepared in accordance with current industry best practice guidelines
  level: should
confidence: medium
notes: From the council's list (approved 6 March 2023), page 12. Listed for 'All Applications where land
  is known or suspected to be contaminated'. The quick checklist marks it 'Where known contamination'
  for most types (householder 'Unless known contamination') and '?' for reserved matters.
review-status: unverified
field-status: {}
