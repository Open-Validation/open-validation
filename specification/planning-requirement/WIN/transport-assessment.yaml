reference: transport-assessment
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - prior-approval
    - any:
      - condition:
          field: new-vehicle-access
          value: true
          description: The proposal forms, lays out or alters a means of access to a highway.
      - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
        - hh
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Winchester District Local Plan Part 1 policy CP10; Local Plan Part 2 policy DM18
source-text: 'For all Major Development HCC considers the transport implications across the county. ...
  Relevant highway information for most applications is needed where it: Is likely to result in a material
  increase in the volume or a material change in the character of traffic entering or leaving a classified
  road or proposed highway; Is likely to prejudice the improvement or construction of a classified road
  or proposed highway; Involves the formation, laying out or alteration of any means of access to a highway;
  Involves the constructions of a highway or private means of access to premises affording access to a
  road in relation to which a toll order is in force; Includes the laying out or construction of a new
  street.'
must-include:
- item: Achievable site access visibility, if a new or modified access is proposed
  level: should
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new or modified access is proposed.
  source-text: 'The Highways Authority would recommend for all applications that affect the highway, the
    following information is provided:'
- item: Classification of the road the site access is taken from
  level: should
- item: Existing and proposed site layout showing boundary treatments and internal road/parking layout,
    including tracking of turning areas
  level: should
- item: The highway boundary
  level: should
- item: Existing and proposed impacts of the proposal on the public rights of way (PROW) network
  level: should
- item: 'Where access is not reserved: the PROW network (and works directly affecting it) fully addressed
    alongside any road-based access'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (approved 6 March 2023), page 18-19. 'Transport Assessment / Statement',
  listed 'For all Major Applications. For all other Applications where transport impacts, affects a classified
  road or access.' 'Material' changes in traffic and the other highway triggers depend on judgement, so
  they are shown as discretionary. The quick checklist shows householder as 'Unless parking or access
  affected' and '?' for reserved matters (shown as discretionary). Hampshire County Council's standing
  advice sets further requirements.
review-status: unverified
field-status: {}
