reference: noise-assessment
local-authority: WIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - prior-approval
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Development which generates noise pollution.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Development which is sensitive to noise.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.winchester.gov.uk/assets/attach/37771/Local-Validation-List-in-detail-by-Document-Type.docx
policy: Local Plan Part 2 policy DM20; Noise Policy Statement for England (2010)
source-text: Development which generates noise pollution or is sensitive to it will be required to include
  an assessment of the noise impact and demonstrate how it prevents, or minimises it to an acceptable
  level.
must-include:
- item: An assessment of the noise impact
  level: must
- item: How the development prevents noise, or minimises it to an acceptable level
  level: must
- item: Has regard to the DEFRA Noise Policy Statement for England (NPSE), March 2010, or its replacement
  level: should
confidence: medium
notes: 'From the council''s list (approved 6 March 2023), page 13. ''Noise/Vibration Assessment'', listed
  ''For All Applications which generate or are susceptible to noise''. Application types follow the council''s
  Quick Checklist (to be read with the list), which marks this document for: full or outline, change of
  use, variation of condition and prior approval (''Where sensitive noise receptor or generator''), with
  ''?'' for reserved matters (shown as discretionary).'
review-status: unverified
field-status: {}
