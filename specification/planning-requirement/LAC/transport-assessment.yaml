reference: transport-assessment
local-authority: LAC
required-if:
  any:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 500
      description: 'Retail (A1) over half the threshold: 500 sq m.'
  - all:
    - condition:
        field: use-class
        value: former-d2
        description: Assembly/Leisure (D2).
    - condition:
        field: floorspace
        operator: '>'
        value: 500
        description: 'Over half the threshold: 500 sq m.'
  - all:
    - condition:
        field: use-class
        value: business
        description: Business (B1).
    - condition:
        field: floorspace
        operator: '>'
        value: 1250
        description: 'Over half the threshold: 1,250 sq m.'
  - all:
    - condition:
        field: use-class
        value: education-health-facility
        description: Any education or health facility.
    - condition:
        field: floorspace
        operator: '>'
        value: 1250
        description: 'Over half the threshold: 1,250 sq m.'
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more residential units.
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: National Planning Policy Framework paragraphs 108 and 111; Circular 02/13
source-text: 'A Transport Assessment (including a Travel Plan) will be required where proposals exceed
  the following thresholds: ... New or extended (cumulative) gross floorspace of 1000sq.m of retail (A1
  Use Class) or Assembly/Leisure (D2 Use Class); ... New or extended (cumulative) gross floorspace of
  2500sq.m of business (B1 Use Class); ... New or extended floorspace of 2500sq.m of any education or
  health facility; or ... 100 or more residential units. ... A Transport Statement (TS) will be required
  in all instances where developments exceed half of the above thresholds (e.g. 50 or more residential
  units). Even if the proposed development falls below this threshold, a TS will be required where the
  proposed development involves a known highway safety issue, or has implications for public or private
  transport capacity or car parking.'
must-include:
- item: 'A full Transport Assessment (rather than a Transport Statement) where the proposal exceeds the
    thresholds: 1,000 sq m retail or D2; 2,500 sq m B1; 2,500 sq m education or health; 100 or more homes'
