reference: biodiversity-survey-report
local-authority: LAC
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - national-nature-reserve
      - local-wildlife-site
      - local-nature-reserve
      description: Potential to affect (directly or indirectly) an international, national or locally-designated
        site.
  - condition:
      field: protected-species
      value: true
      description: Potentially affecting habitat or species protected by the Habitats Regulations 2017,
        the Wildlife and Countryside Act 1981 or the Protection of Badgers Act 1992.
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policy DM27; Arnside and Silverdale AONB DPD policy AS04; National
  Planning Policy Framework paragraphs 170-177
source-text: A Biodiversity Report will be required for all development or works to Listed buildings that
  have the potential to affect (directly or indirectly) an international, national or locally-designated
  site; or for any development potentially affecting habitat or species protected by the Conservation
  of Habitats and Species Regulations 2017, the Wildlife and Countryside Act 1981 (as amended) or the
  Protection of Badgers Act 1992, or any subsequent protective legislation (including impacts arising
  from water quality, air quality, light emission and noise generation as well as loss or damage to habitats).
  This includes development where works would be required below mean high water or close to mean high
  water, affecting the Marine Conservation Zone.
must-include:
- item: Surveys by an appropriately-qualified person at appropriate times of year, in suitable weather
    and using recognised techniques, undertaken within the 18 months before the validation date
  level: must
- item: An assessment of the likely effects on habitats and species recorded in the locality
  level: must
- item: Mitigation measures to avoid adverse impacts
  level: must
- item: 'Where impacts cannot be reduced further: compensatory provision so there is a clear net gain
    for biodiversity'
  level: must
- item: Impacts on geological interests, such as Limestone Pavements
  level: should
- item: A Bat Survey where the development is likely to disturb an existing roof structure within 100m
    of freshwater or woodland, or involves conversion or disturbance (including extension, alteration,
    demolition or replacement) of an existing barn, farmhouse, stable or church
  level: must
  required-if:
    any:
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Conversion or disturbance of an existing barn, farmhouse or stable.
    - discretionary
- item: A Great Crested Newt Survey where operational development is within 250m of a pond or lake
  level: must
  required-if: discretionary
- item: An Otter and Water Vole Survey where the development area includes natural watercourses or is
    within 50m of a main river or 25m of a stream or beck
  level: must
  required-if: discretionary
- item: 'Where the proposal could affect European (Natura 2000) sites: sufficient information for the
    council''s Appropriate Assessment / Habitats Regulations Assessment'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      description: Could affect a designated European site.
confidence: medium
notes: 'From the council''s list (published January 2020), section 2 (Local Validation List), L3, page
  8-9. Discretionary as well: ''potentially affecting'' protected habitat or species, and works below
  or close to mean high water affecting the Marine Conservation Zone, have no mapped trigger. The species
  surveys depend on distances to water and woodland that are not modelled, so they show as discretionary.'
review-status: unverified
field-status: {}
