reference: land-contamination-assessment
local-authority: LAC
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Potentially contaminated by an existing or former use (including the dumping of waste).
  - site:
      in:
      - near-landfill-site
      description: Within 250m of any possible landfill site.
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Lancaster District Core Strategy policy SC1; National Planning Policy Framework paragraphs 178-180
source-text: 'A LCA will be required where: ... Development sites are potentially contaminated by an existing
  or former use (including the dumping of waste); ... The site is located within 250m of any possible
  landfill site; or ... Land outside the development boundary has been potentially contaminated and could
  impact upon the development site (e.g. via migrating contaminants such as fuel oils or landfill gases).'
must-include:
- item: Sufficient information to determine the existence or otherwise of contamination, its nature, the
    risks it may pose and whether they can be reduced to an acceptable level
  level: must
- item: Carried out by a suitably qualified person
  level: must
- item: 'In accordance with BS 10175 (2011) Investigation of Potentially Contaminated Sites: Code of Practice'
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L12, page
  14. Contamination migrating from land outside the site has no mapped trigger, so it shows as discretionary.
review-status: unverified
field-status: {}
