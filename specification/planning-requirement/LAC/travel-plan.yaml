reference: travel-plan
local-authority: LAC
required-if:
  any:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 1000
      description: New or extended (cumulative) retail (A1) gross floorspace over 1,000 sq m.
  - all:
    - condition:
        field: use-class
        value: former-d2
        description: Assembly/Leisure (D2).
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: New or extended (cumulative) gross floorspace over 1,000 sq m.
  - all:
    - condition:
        field: use-class
        value: business
        description: Business (B1).
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: New or extended (cumulative) gross floorspace over 2,500 sq m.
  - all:
    - condition:
        field: use-class
        value: education-health-facility
        description: Any education or health facility.
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: New or extended floorspace over 2,500 sq m.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 100
      description: 100 or more residential units.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: National Planning Policy Framework paragraph 111
source-text: 'A Transport Assessment (including a Travel Plan) will be required where proposals exceed
  the following thresholds: ... New or extended (cumulative) gross floorspace of 1000sq.m of retail (A1
  Use Class) or Assembly/Leisure (D2 Use Class); ... New or extended (cumulative) gross floorspace of
  2500sq.m of business (B1 Use Class); ... New or extended floorspace of 2500sq.m of any education or
  health facility; or ... 100 or more residential units.'
must-include:
- item: Aimed at reducing reliance on private motorised transport and promoting integrated transport and
    journeys on foot, by bicycle and by public transport
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L23, page
  21. Included in the Transport Assessment.
review-status: unverified
field-status: {}
