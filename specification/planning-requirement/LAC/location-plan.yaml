reference: location-plan
local-authority: LAC
required-if:
  always: true
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include an up-to-date location plan at an appropriate metric scale,
  usually 1:1250 or 1:2500, but wherever possible scaled to fit onto either A4 or A3 paper.
must-include:
- item: Up to date, at an appropriate metric scale (usually 1:1250 or 1:2500), scaled to fit A4 or A3
    paper wherever possible
  level: must
- item: A red edge around all of the application site, including any new or altered access, proposed landscaping
    areas and proposed car parking areas
  level: should
- item: A blue edge around any other land in the applicant's ownership
  level: should
- item: Sufficient named roads and surrounding properties/buildings
  level: should
- item: The direction of north
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 1 (National Validation List), N3, page
  3.
review-status: unverified
field-status: {}
