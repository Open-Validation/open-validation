reference: affordable-housing-statement
local-authority: LAC
required-if:
  any:
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: In the Arnside and Silverdale Area of Outstanding Natural Beauty.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: 2 residential dwellings or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 residential dwellings or more elsewhere in the District.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Sites of 0.5 hectares or more elsewhere in the District.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policy DM41; Arnside and Silverdale AONB DPD policy AS03; Meeting Housing
  Needs SPD (2013)
source-text: 'An AHS will be required where the proposal is for: ... 2 residential dwellings or more in
  Arnside and Silverdale Area of Outstanding Natural Beauty; ... 10 residential dwellings or more elsewhere
  in the District; or ... Sites of 0.5 hectares or more elsewhere in the District. ... The only exception
  relates to any residential proposal within the Morecambe Area Action Plan (MAAP) area and the West End
  Masterplan area (as defined by the Emerging Local Plan Policies Map and successor versions) where no
  AHS will be required.'
must-include:
- item: The overall number of proposed residential units
  level: should
- item: The affordable housing provision as a percentage of the overall number
  level: should
- item: The tenure mix of the affordable units (e.g. social, intermediate)
  level: should
- item: The affordable unit types and size
  level: should
- item: The affordable unit space standards
  level: should
- item: Any Registered Providers acting as development partners
  level: should
- item: 'Outline applications for 2 or more units in the AONB: a statement confirming a legal agreement
    will be entered into to provide 50% on-site affordable housing'
  level: should
  required-if:
    all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: In the Arnside and Silverdale Area of Outstanding Natural Beauty.
    - application-type:
        in:
        - outline
- item: 'If no affordable housing is offered: why'
  level: must
- item: 'If the reason for no provision, or provision below the adopted policy position, is viability:
    a detailed financial appraisal'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing provision below policy, or none, on viability grounds.
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L1, page 6-7.
  Not required for residential proposals in the Morecambe Area Action Plan area or the West End Masterplan
  area (not modelled in the rule).
review-status: unverified
field-status: {}
