reference: affordable-housing-statement
local-authority: LAC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: The proposal creates 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: The residential site is 0.5 hectares or more.
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: The site is in the Arnside & Silverdale AONB.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The proposal creates 2 or more dwellings.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
source-text: West End Masterplan area (as defined by the Emerging Local Plan Policies Map and successor
  versions) where no AHS will be required.
confidence: medium
notes: 'From the audit (missing_requirement): L1, for 10+ dwellings or 0.5ha+, and 2+ dwellings in the
  Arnside & Silverdale AONB. It is not needed in the Morecambe Area Action Plan or West End Masterplan
  areas (the council''s words above, which the workbook had filed as a design code row); the rule cannot
  express that exemption.'
review-status: unverified
field-status: {}
