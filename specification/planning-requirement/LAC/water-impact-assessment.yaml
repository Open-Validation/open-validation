reference: water-impact-assessment
local-authority: LAC
required-if:
  site:
    in:
    - strategic-allocation
    description: Within the Port of Heysham Expansion (SG14), Port of Heysham Industrial Estate (EC1.6),
      Middleton Towers (DOS7) or Glasson Dock Industrial Area (EC1.18).
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Local Plan Part Two (then emerging) policy DM34; National Planning Policy Framework paragraph
  170
source-text: 'All development within the following areas: ... Port of Heysham Expansion (Emerging Policy
  SG14); ... Port of Heysham Industrial Estate (Emerging Policy EC1.6); ... Middleton Towers (Emerging
  Policy DOS7); and ... Glasson Dock Industrial Area (Emerging Policy EC1.18)'
must-include:
- item: The movement and distribution of water to all water sources (waterways, coastal waters, drains,
    groundwater)
  level: must
- item: How the quality of the water may be affected by the development, and how this can be mitigated
    if necessary
  level: must
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L11, page
  14. The guide calls it a Hydrological Risk Assessment. The four areas are shown as strategic allocations.
review-status: unverified
field-status: {}
