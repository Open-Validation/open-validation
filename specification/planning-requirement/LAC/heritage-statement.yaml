reference: heritage-statement
local-authority: LAC
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - conservation-area
      - park-and-garden
      - world-heritage-site
      - locally-listed-building
      description: Potential to affect Scheduled Monuments, Listed Buildings, Conservation Areas, Registered
        Parks and Gardens, World Heritage Sites or locally listed heritage assets.
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: National Planning Policy Framework paragraphs 184-202 (paragraph 189)
source-text: A Heritage Statement will be required for all proposals that have the potential to affect
  heritage assets listed above. NPPF Paragraph 189 states that as a minimum the relevant historic environment
  record should have been consulted and the heritage assets assessed using appropriate expertise where
  necessary.
must-include:
- item: How the development will affect the significance of any heritage assets, including their setting
  level: must
- item: As a minimum, the relevant historic environment record consulted and the heritage assets assessed
    using appropriate expertise where necessary
  level: must
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L10, page
  13. Local heritage assets identified through the pre-application process or the Historic Environment
  Record show as discretionary.
review-status: unverified
field-status: {}
