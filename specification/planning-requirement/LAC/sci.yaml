reference: sci
local-authority: LAC
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is a departure from the Development Plan.
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbine development.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height of any turbine exceeds 15 metres.
  - site:
      in:
      - asset-of-community-value
      description: The proposal involves an Asset of Community Value.
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Lancaster City Council Statement of Community Involvement (2013); Planning and Compulsory Purchase
  Act 2004
source-text: 'An SCI will be required where: ... The proposal constitutes a departure from the Development
  Plan; ... The proposal is for wind turbine development involving more than 2 turbines or where the hub
  height of any turbine exceeds 15 metres (please refer to National Planning Practice Guidance for the
  minimum requirements); ... The proposal involves an Asset of Community Value (please refer to the Council’s
  website where such assets are identified); or ... The pre-application advice has specified that one
  is necessary.'
must-include:
- item: How the applicant has complied with the council's Statement of Community Involvement (2013), including
    pre-application consultation with the local community
  level: should
- item: How the development has evolved in response to community involvement
  level: must
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L19, page
  18. Discretionary where pre-application advice has said one is needed.
review-status: unverified
field-status: {}
