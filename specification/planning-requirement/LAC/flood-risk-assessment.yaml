reference: flood-risk-assessment
local-authority: LAC
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: 'Flood Zone 1: development sites exceeding 1 hectare.'
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: 'Flood Zone 1: development sites exceeding 1 hectare.'
  - site:
      in:
      - future-flood-risk
      description: Land identified in the Strategic Flood Risk Assessment as at increased flood risk in
        the future.
  - site:
      in:
      - surface-water-flood-risk
      - groundwater-flood-risk
      description: Land subject to other sources of flooding, such as surface water.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policy DM38; National Planning Policy Framework paragraphs 148-169
source-text: A FRA (including a sequential test) will be required for all proposals for new development
  in Flood Zones 2 and 3 (though for changes of use, householder development and non-residential extensions
  with a footprint less than 250sq.m a sequential test will not be required). ... In Flood Zone 1, a FRA
  will be required for development sites exceeding 1 hectare; on land identified in the Council’s Strategic
  Flood Risk Assessment as being at increased flood risk in the future; or land that is subject to other
  sources of flooding, such as surface water.
must-include:
- item: The extent to which the development is at risk from all sources of flooding, and how flood risk
    will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability of flooding, the design of sustainable drainage systems
    and safe access to and from areas at risk of flooding
  level: should
- item: A sequential test (not for changes of use, householder development or non-residential extensions
    with a footprint under 250 sq m)
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L8, page 11-12.
review-status: unverified
field-status: {}
