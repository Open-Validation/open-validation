reference: floor-plan-existing
local-authority: LAC
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The application includes new buildings.
  - condition:
      field: building-works
      value: true
      description: The application includes alterations to buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: The application changes the use of any space within a building.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The application must be accompanied by existing and proposed plans at an appropriate metric
  scale, usually 1:50 or 1:100, which explain the proposal in detail. ... similarly existing and proposed
  floor plans are required for all applications which include new buildings, alterations to buildings
  or changes to the use of any space within a building.
must-include:
- item: At an appropriate metric scale, usually 1:50 or 1:100, explaining the proposal in detail
  level: must
confidence: medium
notes: From the council's list (published January 2020), section 1 (National Validation List), N5, page
  4.
review-status: unverified
field-status: {}
