reference: site-plan
local-authority: LAC
required-if:
  always: true
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The Site Layout Plan must be at an appropriate metric scale, usually 1:200 or 1:500, and
  it should accurately show:'
must-include:
- item: At an appropriate metric scale, usually 1:200 or 1:500
  level: must
- item: The proposed development in relation to site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads, footways and public rights of way that may cross or adjoin the site
  level: should
- item: The position of all trees on or immediately adjoining the site, where affected by the development
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: The location of any new or altered boundary treatments
  level: should
- item: The direction of north
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 1 (National Validation List), N4, page
  3.
review-status: unverified
field-status: {}
