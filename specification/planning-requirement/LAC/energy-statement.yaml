reference: energy-statement
local-authority: LAC
required-if:
  ref: major-development
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: National Planning Policy Framework chapters 2 and 14
source-text: An Energy Statement will be required for all major applications
must-include:
- item: The predicted energy demands of the development and the degree to which it will exceed current
    energy efficiency standards
  level: should
- item: How the development takes account of passive solar gain or how renewable and low-carbon energy
    technologies will be incorporated as an integral part of the design
  level: must
- item: 'As a minimum: insulation standards for walls, windows and doors (compared against current Building
    Regulations and passivhaus or equivalent); management of solar gain; ventilation and heat recovery;
    reduction of thermal bridges; solar panels; battery energy storage; non-CO2 heat and cooling (e.g.
    ground or air source heat pumps); consideration of combined heat and power or district heating'
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L6, page 10.
review-status: unverified
field-status: {}
