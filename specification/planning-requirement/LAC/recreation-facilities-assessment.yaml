reference: recreation-facilities-assessment
local-authority: LAC
required-if:
  site:
    in:
    - open-space
    description: Affects all or part of any sports ground, playing field, park, play facility, allotment,
      informal recreation or leisure area (including walking routes, cycling and bridleways), local green
      space or open space, or burial ground.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: National Planning Policy Framework paragraph 97
source-text: 'An Assessment will be required where a proposal affects all, or part of the following: ...
  Any sports ground, playing field, park, play facility or allotment; ... Any informal recreation or leisure
  area (including walking routes, cycling and bridleways); ... Any other local green space network or
  open space (including those defined by Annex 2 of the NPPF); or ... Any burial ground.'
must-include:
- item: An assessment of existing open space provision
  level: should
- item: Takes into account the Open Space Study (2018), the Playing Pitch & Outdoor Sports Strategy (2019)
    or successors, and Annex B of Sport England's Playing Fields Policy and Guidance
  level: should
- item: Satisfies the three criteria in NPPF paragraph 97
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L16, page
  17. The guide calls it an Open Space Assessment.
review-status: unverified
field-status: {}
