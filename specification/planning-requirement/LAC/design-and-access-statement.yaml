reference: design-and-access-statement
local-authority: LAC
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Development in a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provides one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Provides a building(s) creating 100 sq m of floorspace or more.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A Design and Access Statement is a national requirement for the following types of applications:
  ... Major Development ... Listed Building Consent; ... Development in either a Conservation Area or
  World Heritage Site consisting of: (a) The provision of one or more dwellinghouses; or, (b) The provision
  of a building(s) where the floorspace created by the development is 100 sq.m or greater.'
must-include:
- item: How design and access considerations have influenced the evolution of the proposed development
  level: should
- item: Whether alternative options have been considered and discounted
  level: should
- item: The key aspects in Article 9 of the DMPO 2015, taking into account the 10 characteristics of well-designed
    places in the National Design Guide
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 1 (National Validation List), N7, page
  4. Not required for section 73 applications, engineering and mining operations or waste development,
  or material change of use.
review-status: unverified
field-status: {}
