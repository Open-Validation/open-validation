reference: noise-assessment
local-authority: LAC
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: A potentially noisy activity introduced within a residential area.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Within a residential area.
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Housing introduced in a potentially noisy location, or residential development close
          to an existing noise generator (e.g. railway, M6, city centre gyratory, industrial use).
    - discretionary
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals demonstrably noisy by nature (e.g. heavy industry).
    - discretionary
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: National Planning Policy Framework paragraph 180
source-text: 'A Noise and Vibration statement will be required where: ... The proposal has the potential
  for noise disturbance either via a potentially noisy activity being introduced within a residential
  area, or due to the proposed introduction of housing in a potentially noisy location; ... The proposals
  are demonstrably noisy by nature (e.g. heavy industry); ... The proposals would result in the transmission
  of vibration; ... The proposal is for residential development close to an existing noise generator (e.g.
  railway, M6 motorway, city centre gyratory, industrial use) or ... The proposal is in or adjacent to
  an European or nationally designated natural conservation site that by nature of the method of its construction
  or its operation would generate noise and vibration.'
must-include:
- item: That the proposal will not have unacceptably adverse noise or vibration impacts for residential
    properties
  level: should
- item: Carried out by an appropriately-qualified person, in accordance with BS 7445 (2003) Description
    and Measurement of Environmental Noise
  level: should
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L15, page
  16. The guide calls it a Noise & Vibration Statement. 'Potentially noisy', vibration and noisy works
  near designated nature sites have no measure, so they show as discretionary.
review-status: unverified
field-status: {}
