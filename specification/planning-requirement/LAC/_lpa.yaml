submission-standards:
- item: Plans at an appropriate metric scale (location plan usually 1:1250 or 1:2500; site layout plan
    usually 1:200 or 1:500; elevations, sections and floor plans usually 1:50 or 1:100)
  level: must
- item: Location plan scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Documents with sensitive personal or commercial details clearly marked 'confidential', including
    their file name if submitted electronically
  level: must
- item: 'Paper applications: only one paper copy required (electronic submissions need no paper copies)'
  level: should
