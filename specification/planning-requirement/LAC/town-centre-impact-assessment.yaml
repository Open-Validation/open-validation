reference: town-centre-impact-assessment
local-authority: LAC
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: A main town centre use (NPPF Annex 2) proposed outside existing town centres.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policy DM1; National Planning Policy Framework paragraphs 87-90
source-text: A Sequential Analysis will be required for all proposals for main town centre uses (see Annex
  2 of the NPPF for definition), in accordance with the provisions of the Development Management DPD Policy
  DM1. ... An Impact Assessment will be required where the proposal is for a main town centre use exceeding
  the default threshold of 2500 sq.m of floorspace, and is located outside a town centre and is not in
  accordance with an up-to-date Local Plan (in accordance with the provisions of NPPF Paragraph 89).
must-include:
- item: 'Sequential analysis: the site''s availability, viability and suitability; all potential in-centre
    locations thoroughly assessed, followed by edge-of-centre locations; store scale, flexibility in layout/format
    and car parking considered'
  level: must
- item: Impact Assessment where the main town centre use exceeds 2,500 sq m, is outside a town centre
    and is not in accordance with an up-to-date Local Plan
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Main town centre use floorspace exceeding 2,500 sq m.
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L22, page
  21.
review-status: unverified
field-status: {}
