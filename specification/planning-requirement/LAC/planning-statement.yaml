reference: planning-statement
local-authority: LAC
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: The application is a departure from the Development Plan.
  - discretionary
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Planning and Compulsory Purchase Act 2004, section 38(6)
source-text: A Planning Statement will be required to support all applications that are a departure from
  the Development Plan, or where pre-application advice has specified that one is necessary.
must-include:
- item: How the proposal relates to national and local (Development Plan) policies
  level: must
- item: A Development Costs / Economic or Marketing Appraisal, where development viability information
    is required
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L18, page
  18. Discretionary as well where pre-application advice has said one is needed.
review-status: unverified
field-status: {}
