source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policies DM35, DM36 and DM37; National Planning Policy Framework paragraph
  181
source-text: 'An AQA will be required where the proposal: ... is a care/nursing home, day nursery, residential
  scheme of 1 to 10 units, student accommodation, education and hospital scheme in an AQMA but is below
  the relevant threshold within the 5th column in the table (see Appendix 1) – only an exposure assessment
  will be required; ... has the potential to adversely affect an AQMA (developments within areas defined
  by the hatched areas on the map – see Appendix 1) and exceeds the thresholds within the 5th column in
  the table (see Appendix 1) – emissions and concentration assessments will be required; ... is a large
  site outside the hatched areas on the map (see below) and exceeds the thresholds in the 6th column in
  the table (see Appendix 1) – emissions and concentration assessments will be required; ... is of such
  scale that it could by itself result in the designation of a new AQMA – all 3 assessments could be required;
  or ... is a slurry tank or an intensive livestock installation in or adjacent to an European or national
  designated nature conservation site.'
must-include:
- item: Existing air quality in the locality, a calculation of the air pollution arising from the development,
    and how it will be fully mitigated
  level: must
- item: 'Exposure assessment only: sensitive uses in an AQMA below the Appendix 1 (5th column) thresholds'
  level: must
  required-if:
    site:
      in:
      - air-quality-management-area
      description: In an Air Quality Management Area.
- item: 'Emissions and concentration assessments: proposals in the hatched areas over the 5th column thresholds,
    or large sites outside them over the 6th column thresholds'
