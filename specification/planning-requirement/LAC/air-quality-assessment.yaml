notes: 'From the council''s list (published January 2020), section 2 (Local Validation List), L2 and Appendix
  1, page 7. The thresholds are the Appendix 1 table (5th column inside the hatched areas, 6th column
  outside; ''Other: discuss LPA'' shows as discretionary). The ''hatched areas'' are shown as the air
  quality screening area. Development that could by itself create a new AQMA has no measure, so it shows
  as discretionary.'
