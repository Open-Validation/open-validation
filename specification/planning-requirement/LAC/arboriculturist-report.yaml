source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
source-text: 'The Arboricultural Implications Assessment (AIA) is a statement that must include the following:
  • a Survey of existing trees and hedgerows; • a Method statement indicating how the work will be carried
  out in relation to any trees (including site preparation and earth works); • a Tree constraints plan;
  and • a Tree protection plan.'
