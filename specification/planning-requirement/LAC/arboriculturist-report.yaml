reference: arboriculturist-report
local-authority: LAC
required-if:
  all:
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal (including access, services and earthworks) could affect trees within
          or adjacent to the site.
    - condition:
        field: hedgerows-affected
        value: true
        description: The proposal could affect field or roadside hedgerows within or adjacent to the site.
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: Trees subject to a Tree Preservation Order.
    - site:
        in:
        - conservation-area
        description: Trees within a Conservation Area.
    - discretionary
    - ref: major-development
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policy DM29; Arnside and Silverdale AONB DPD policy AS04; Town and
  Country Planning Act 1990 sections 197-198; BS 5837:2012
source-text: 'An AIA will be required where the proposal (including its associated access, services and
  earthworks) has the potential to affect trees, field hedgerows and/or roadside hedgerows (within or
  adjacent to the application site): ... that are subject to a Tree Preservation Order; ... that are within
  a Conservation Area; ... that have significant public amenity value; or ... as part of a major development.'
must-include:
- item: A survey of existing trees and hedgerows
  level: must
- item: A method statement for how the work will be carried out in relation to any trees (including site
    preparation and earthworks)
  level: must
- item: A tree constraints plan
  level: must
- item: A tree protection plan
  level: must
- item: 'Major developments: all retained trees/hedgerows and new or compensatory planting set out on
    a proposed landscaping plan included with the AIA'
  level: must
  required-if:
    ref: major-development
- item: Produced by an appropriately-qualified arboriculturist; works to conform to BS 5837 (2012)
  level: must
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L24, page
  22-23. The guide calls it a Tree/Arboricultural Implications Assessment. Trees of 'significant public
  amenity value' have no mapped trigger, so that part shows as discretionary.
review-status: unverified
field-status: {}
