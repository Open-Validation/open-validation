reference: sustainable-drainage-strategy
local-authority: LAC
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Any new proposal involving 5 or more residential units.
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Development Management DPD policy DM39; Arnside and Silverdale AONB DPD policy AS12; National
  Planning Policy Framework paragraphs 163 and 165
source-text: A Sustainable Drainage Strategy will be required for any major developments or any new proposal
  that involves 5 or more residential units.
must-include:
- item: How the sustainable drainage components will be constructed, managed and maintained for the lifetime
    of the development
  level: must
- item: Details of the current drainage system, capacity and discharge rate
  level: must
- item: Identification of the catchment area(s)
  level: must
- item: Site investigation report, including infiltration tests (to BRE 365) and geological/soil tests
  level: must
- item: Flood risk from main river and coastal sources and from surface and ground water
  level: must
- item: Topographical plan (existing and proposed) with contours at 1m intervals
  level: must
- item: New surface water system, capacity, storage, discharge rate and controls, and proposed outfalls
    (flows for 1 in 1, 1 in 2, 1 in 30 and 1 in 100 year plus 30% climate change)
  level: must
- item: Drainage layout plans, including SuDS, sewers, drains and watercourses (long and cross sections
    including levels)
  level: must
- item: Details of adoption, and/or maintenance and management for non-adopted sections
  level: must
- item: 'For phased proposals: access to/from interconnecting phases'
  level: must
  required-if: discretionary
- item: That the strategy meets the surface water hierarchy (NPPG), with clear evidence why more preferable
    options, including rainwater harvesting, were discounted
  level: must
confidence: medium
notes: From the council's list (published January 2020), section 2 (Local Validation List), L20, page
  19-20. Uses MHCLG's retired id for a drainage strategy.
review-status: unverified
field-status: {}
