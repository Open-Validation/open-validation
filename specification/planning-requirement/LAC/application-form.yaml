reference: application-form
local-authority: LAC
required-if:
  always: true
source-url: https://www.lancaster.gov.uk/assets/attach/135/PAVG-publication-version-Jan-2020.pdf
policy: Town and Country Planning Act 1990, section 65(5); Town and Country Planning (Development Management
  Procedure) (England) Order 2015, articles 13 and 14
source-text: Planning applications can be submitted online or by completing a paper application form.
  ... There is a requirement under Section 65(5) of the Town and Country Planning Act 1990, and Articles
  13 and 14 of the Town and Country Planning (Development Management Procedure) (England) Order 2015 (hereafter
  referred to as the DMPO) for the applicant to make a declaration in respect of the ownership of the
  application site, and in respect of whether the site is an agricultural holding.
must-include:
- item: The ownership certificate and agricultural holding declaration, with notice served on other owners
    and agricultural tenants where the site isn't wholly owned by the applicant
  level: must
- item: 'Where non-mains drainage pipework crosses land outside the applicant''s ownership (other than
    the public highway): that land in the red edge, the correct certificate B, C or D, and notice served
    on its owner(s)'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: The proposal connects to non-mains drainage.
confidence: medium
notes: From the council's list (published January 2020), section 1 (National Validation List), N1-N2,
  page 2-3.
review-status: unverified
field-status: {}
