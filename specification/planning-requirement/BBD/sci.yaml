reference: sci
local-authority: BBD
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Residential schemes of 50+ units.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 2
      description: Retail, commercial, industrial, educational, hospital, leisure or recreation schemes
        on sites of 2 hectares or more.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use of buildings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1500
        description: Gross floor area of 1,500 sq m or more.
  - discretionary
source-url: https://www.blackburn.gov.uk/sites/default/files/2025-03/Validation%20Checklist.pdf
source-text: 'L2 Statement of Community Involvement Required for: The following developments within or
  adjoining residential areas o Residential schemes of 50+ units o Retail, commercial & industrial schemes
  with a floor space of between 2000sqm on sites of 2 hectares or more o Educational, hospital leisure
  and recreation schemes on sites of 2 hectares or more o Schemes with 2 or more land uses on sites of
  1.5 hectares o Changes of use of building(s) with a gross floor area of 1,500 sq m or more o Any scheme'
