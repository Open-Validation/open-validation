reference: town-centre-impact-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - condition:
      field: use-class
      value: retail-leisure-office
      description: Retail, leisure and office use proposals.
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside the Primary Shopping Areas (retail) or the town, district and local centres
            (leisure and office).
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: More than 500 sq m gross floorspace.
    - all:
      - condition:
          field: distance-to-district-centre
          operator: <=
          value: 800
          description: Within 800 m of the boundary of a district centre.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 300
          description: More than 300 sq m gross floorspace.
    - all:
      - condition:
          field: distance-to-local-centre
          operator: <=
          value: 800
          description: Within 800 m of the boundary of a local centre.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: More than 200 sq m gross floorspace.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy ED2
source-text: 'For retail, leisure and office use proposals, impact assessment will be required at the
  locations identified below based on the floorspace thresholds set out: - Developments which propose
  more than 500m2 gross floorspace outside of the Primary Shopping Areas (for retail) or the town, district
  and local centres (for leisure and office uses) - Developments which propose more than 300m2 gross floorspace
  within 800 metres of the boundaries of the district centres - Developments which propose more than 200m2
  gross floorspace within 800 metres of the boundaries of a local centre.'
must-include:
- item: Impact on existing, committed and planned public and private investment in centres, and on town
    centre vitality and viability, including consumer choice and trade
  level: must
confidence: medium
notes: From the council's list (August 2025), page 39. Impact Assessment part of 'Town Centre uses - Sequential
  Test/Impact Assessment'; the sequential test is in the unmapped list. Where more than one threshold
  applies, the lower one takes precedence. Listed on the Full or Reserved Matters and Outline checklists
  (pages 8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
