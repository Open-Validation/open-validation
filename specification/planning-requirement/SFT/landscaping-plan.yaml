reference: landscaping-plan
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - condition:
      field: new-open-space
      value: true
      description: Public open space is being provided.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 or more new build homes.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 11
          description: 11 to 149 new build homes.
      - condition:
          field: dwelling-count
          operator: <=
          value: 149
          description: 11 to 149 new build homes.
      - condition:
          field: distance-to-main-park
          operator: '>'
          value: 2
          description: More than 2 km from a main park or Countryside Recreation Area.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy EQ9; Open Space SPD (2017)
source-text: Residential development of 150 or more new build homes where public open space is being provided.
  Residential development for 11 to 149 new build homes on sites more than 2 kilometres from a main park
  or Countryside Recreation Area where public open space is being provided.
must-include:
- item: 'Outline: headline open space proposals and layouts, intentions for new strategic paths, and headline
    points for long-term management, funding and legal agreements for the whole site'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Full and reserved matters: a comprehensive plan including landscaping and all facilities in the
    open space'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'Full and reserved matters: full management and maintenance plans including monitoring, review,
    funding and legal agreements'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (August 2025), page 33-34. 'Landscaping principles'. Listed on the Full
  or Reserved Matters and Outline checklists (pages 8 and 11), where 'Some of the requirements below depend
  on the proposal'.
review-status: unverified
field-status: {}
