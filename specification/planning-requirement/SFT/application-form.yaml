reference: application-form
local-authority: SFT
required-if:
  always: true
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All sections need be completed using the relevant national 1APP form
must-include:
- item: All sections completed on the relevant national 1APP form
  level: must
- item: Ownership and agricultural holdings certificate (A, B, C or D), where included in the form
  level: must
- item: Notice to the owner(s) completed and served in accordance with article 13 of the DMPO; agricultural
    tenants notified before submission
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: The applicant is not the sole owner, or there are agricultural tenants.
confidence: medium
notes: From the council's list (August 2025), page 16. Every checklist in section 3 starts with the application
  form.
review-status: unverified
field-status: {}
