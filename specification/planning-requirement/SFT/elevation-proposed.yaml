reference: elevation-proposed
local-authority: SFT
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
        - outline
        - ldc-existing-use
        - ldc-prospective-use
        - approval-condition
        - s73
        - non-material-amendment
        - prior-approval
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes the elevations.
  - application-type:
      in:
      - advertising
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
source-text: Elevations – all existing and proposed to be shown at a metric scale of 1:50 or 1:100 (unless
  retrospective)
must-include:
- item: A scale bar or at least one dimension written on each plan (more than one where a plan has differing
    scales)
  level: must
- item: At a metric scale of 1:50 or 1:100 (unless retrospective); all elevations of the proposal shown
  level: must
- item: 'Listed building consent: detailed drawings at no less than 1:20 of all the work (e.g. new doors,
    shop fronts, panelling, fireplaces, plaster moulding), showing the relationship to adjacent existing
    structures'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Detailed drawings must be to a scale of no less than 1:20
- item: 'Advertisements: drawing at 1:20 or 1:50 showing the size and position of the advertisement, how
    it is attached or stands, materials and colours, height above ground, any projection, and the method
    and colour(s) of illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: 'The drawing of the proposed advertisement must: Be at a scale of 1:20 or 1:50'
confidence: medium
notes: From the council's list (August 2025), page 4, 9-10, 36. Includes the drawing requirements of the
  listed building and advertisement checklists.
review-status: unverified
field-status: {}
