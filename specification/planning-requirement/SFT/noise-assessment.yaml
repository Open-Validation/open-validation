reference: noise-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: A potentially noise generating development (pubs, clubs, takeaways, industrial/commercial
          uses, recreation) near existing noise sensitive development.
    - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
source-text: 'Noise Assessment Where or when this item is required: • • • • • Potentially noise generating
  developments (i.e. pubs, clubs, takeaways, industrial/commercial uses, recreation) in the vicinity of
  existing noise sensitive developments - residential, schools and hospitals;'
must-include:
- item: Plant such as extract ventilation systems and refrigeration equipment likely to be installed
  level: should
- item: Where noise-generating plant or equipment will be located and installed to reduce noise impacts
    on neighbouring properties
  level: should
- item: Delivery times and opening hours for commercial premises within noise sensitive areas
  level: should
- item: Details of waste collection, for example pubs/clubs where glass collection could be noisy
  level: should
