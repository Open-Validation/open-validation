reference: noise-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: Potentially noise generating development (pubs, clubs, takeaways, industrial/commercial,
            recreation).
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: In the vicinity of existing noise sensitive development (residential, schools,
            hospitals).
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive uses near existing noise generating uses, railways or in a noisy
          environment.
    - all:
      - condition:
          field: mixed-use
          value: true
          description: Mixed use applications.
      - condition:
          field: noise-generating-use
          value: true
          description: Comprising both noise generating and noise sensitive uses.
    - all:
      - condition:
          field: plant-equipment
          value: true
          description: Commercial applications including extractor or cooling units.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: In the vicinity of noise sensitive uses.
    - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy EQ4
source-text: Potentially noise generating developments (i.e. pubs, clubs, takeaways, industrial/commercial
  uses, recreation) in the vicinity of existing noise sensitive developments - residential, schools and
  hospitals; Noise sensitive uses in the vicinity of existing noise generating uses, railways or in areas
  with an existing noisy environment; Mixed use applications comprising both noise generating and noise
  sensitive uses; Commercial applications including extractor or cooling units in the vicinity of noise
  sensitive uses. Where there is potential for noise to impact on European or Nationally designated sites.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The existing noise environment, noise sources from or affecting the development, and mitigation
  level: should
- item: Sound power and resultant boundary noise levels of noise-producing machinery, and plant locations
  level: should
- item: 'Commercial premises in noise sensitive areas: delivery times, opening hours and waste collection
    details'
  level: should
- item: 'Development adjoining (including above or below) homes: sound insulation, entrances/exits and
    car parking; for pubs and clubs, the smoking area'
  level: must
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: The development immediately adjoins residential premises (including above or below).
confidence: medium
notes: From the council's list (August 2025), page 35. Potential impact on designated sites is a judgement,
  so discretionary. Listed on the Full or Reserved Matters and Outline checklists (pages 8 and 11), where
  'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
