reference: location-plan
local-authority: SFT
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
    - lbc
    - outline
    - ldc-existing-use
    - ldc-prospective-use
    - approval-condition
    - s73
    - non-material-amendment
    - prior-approval
    - advertising
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The plan must show the site location outlined in red at a standard metric scale (typically
  1:1250 or 1:2500) with a north point.
must-include:
- item: Site outlined in red at a standard metric scale (typically 1:1250 or 1:2500) with a north point
  level: must
- item: Any other land owned by the applicant outlined in blue
  level: must
- item: At least two named roads and surrounding buildings, properties numbered or named (one named road
    where only one is nearby)
  level: should
- item: The appropriate Ordnance Survey copyright notice on every plan based on OS maps
  level: must
- item: Ideally on a separate sheet to aid consultation
  level: should
confidence: medium
notes: From the council's list (August 2025), page 4, 16. On every section 3 checklist except tree works.
review-status: unverified
