reference: sustainable-drainage-strategy
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - any:
    - all:
      - ref: major-development
      - any:
        - condition:
            field: involves-change-of-use
            value: false
            description: Not a change of use.
        - condition:
            field: impermeable-area-increase
            operator: '>'
            value: 0
            description: A change of use that increases the impermeable area.
    - all:
      - site:
          in:
          - critical-drainage-area
          description: In a critical drainage area.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: Land of 0.5 ha or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 0.5
            description: Land of 0.5 ha or more.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy EQ8; Sustainable Drainage Systems (SuDS) and Flood Risk Information Note
  (2018)
source-text: All major developments (except a change of use where no increase in permeable area is proposed)
  Development on land of 0.5ha or more in critical drainage areas
must-include:
- item: How surface water will be managed sustainably now and in future, with evidence (infiltration results,
    drainage calculations, plans)
  level: must
- item: How the components will be constructed, managed and maintained for the lifetime of the development
  level: must
- item: Current drainage system, capacity and discharge rate
  level: must
- item: Infiltration tests to BRE 365
  level: must
- item: New surface water system, capacity, storage and discharge rate
  level: must
- item: Details of adoption, and maintenance and management of unadopted sections
  level: must
- item: Topographical changes and other mitigation (e.g. finished floor levels)
  level: must
- item: A completed Sustainable Drainage Pro-Forma
  level: must
confidence: medium
notes: From the council's list (August 2025), page 37-38. The list says 'permeable'; read as the impermeable
  (hard) area. Listed on the Full or Reserved Matters and Outline checklists (pages 8 and 11), where 'Some
  of the requirements below depend on the proposal'. Retired MHCLG id, used here on purpose.
review-status: unverified
field-status: {}
