reference: archaeological-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - any:
    - site:
        in:
        - scheduled-monument
        - historic-environment-record
        description: On or adjoining a site of known archaeological interest.
    - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy NH14
source-text: Where any proposal includes works on or adjoining a site of known or suspected archaeological
  interest.
must-include:
- item: A desk-based archaeological assessment and/or field evaluation in accordance with NPPF section
    16
  level: must
- item: Undertaken by CIfA members or to the Institute's Code of Conduct and Standards
  level: should
confidence: medium
notes: From the council's list (August 2025), page 23. 'Suspected' archaeological interest has no defined
  test, so that part is discretionary. Listed on the Full or Reserved Matters and Outline checklists (pages
  8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
