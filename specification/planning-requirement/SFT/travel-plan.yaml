reference: travel-plan
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policies EQ3, IN2; Sustainable Travel and Development SPD
source-text: Where a new development is likely to have significant transportation implications, a Transport
  Assessment (TA) and Travel Plan (TP) should be prepared. In some instances a simplified report in the
  form of a Transport Statement (TS) may be sufficient.
must-include:
- item: How occupiers or customers will use alternatives to private vehicles
  level: must
- item: Targets and monitoring arrangements
  level: must
confidence: medium
notes: From the council's list (August 2025), page 40-41. Thresholds are in the SPD and 'for guidance
  only', so discretionary. Listed on the Full or Reserved Matters and Outline checklists (pages 8 and
  11), where 'Some of the requirements below depend on the proposal'.
