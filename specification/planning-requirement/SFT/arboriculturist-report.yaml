reference: arboriculturist-report
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development within 2 m of a tree's canopy spread, or trees on the site or adjacent
        land (including street trees) that may be affected.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy EQ9; BS5837:2012
source-text: Any proposals involving development within two metres of the canopy spread of a tree; or
  Where there are trees within the application site that may be affected by a development; or On land
  adjacent to it that could influence or be affected by the development (including street trees).
must-include:
- item: In accordance with BS5837:2012, by a suitably qualified and experienced arboriculturist
  level: must
- item: Tree retention/removal plan
  level: must
- item: Retained trees and root protection areas shown on the proposed layout
  level: must
- item: Arboricultural Implications Assessment
  level: must
- item: Location of new tree planting
  level: must
- item: Tree protection plan
  level: must
- item: Arboricultural method statement, including special engineering within RPAs, where applicable
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2025), page 42. Tree Survey; on the householder, full/reserved
  matters and outline checklists.
review-status: unverified
field-status: {}
