reference: air-quality-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - any:
    - all:
      - ref: major-development
      - site:
          in:
          - air-quality-management-area
          - air-quality-screening-area
          description: Within or adjacent to an Air Quality Management Area or Air Quality Threshold Area.
    - condition:
        field: dwelling-count
        operator: '>'
        value: 100
        description: More than 100 dwellings.
    - condition:
        field: office-floorspace
        operator: '>='
        value: 3500
        description: Offices of 3,500 sq m or more.
    - condition:
        field: industrial-floorspace
        operator: '>='
        value: 7500
        description: Industrial estates of 7,500 sq m or more.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 15500
        description: Warehousing of 15,500 sq m or more.
    - all:
      - condition:
          field: hotel-development
          value: true
          description: Hotels.
      - condition:
          field: bedroom-count
          operator: '>='
          value: 150
          description: 150 or more bedrooms.
    - all:
      - condition:
          field: use-class
          value: leisure-exhibition
          description: Leisure facilities or exhibition centres.
      - condition:
          field: floorspace
          operator: '>='
          value: 9000
          description: 9,000 sq m or more.
    - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy EQ5
source-text: Major development within/or adjacent to an Air Quality Management Area (AQMA) or Air Quality
  Threshold Area; and/or, Development in excess of 100 dwellings; and/or, Office developments of 3,500m2
  or more Industrial estates of 7,500 m2 or more Warehousing of 15,500 m2 or more Hotels with 150 or more
  bedrooms Leisure facilities or exhibition centres of 9,000 m2 or more Where there is potential for air
  quality to impact on European or Nationally designated sites. New agricultural development which may
  pose a significant risk to air quality.
must-include:
- item: The change in air quality resulting from the development and appropriate mitigation
  level: must
- item: Ecological and environmental receptors, where disturbance to European, national or local designated
    sites is likely
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2025), page 21-22. 'Potential ... to impact on European or Nationally
  designated sites' and agricultural development that 'may pose a significant risk' are judgements, so
  discretionary. Listed on the Full or Reserved Matters and Outline checklists (pages 8 and 11), where
  'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
