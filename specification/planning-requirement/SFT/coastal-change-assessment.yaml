reference: coastal-change-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - site:
      in:
      - coastal-erosion-zone
      description: In the Coastal Change Management Area (CCMA).
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy NH4
source-text: Development in the Coastal Change Management Area (CCMA) Please note - this does not apply
  to householder applications
must-include:
- item: Location of the site in relation to the CCMA
  level: must
- item: 'A proportionate sequential assessment: no reasonably available sites outside the CCMA, then in
    less vulnerable parts'
  level: must
- item: Vulnerability and lifetime of the development, and any potential for temporary permission
  level: must
- item: Impact on coastal processes, tidal flooding and coastal erosion with a changing climate, and safety
    over its lifetime
  level: must
- item: Flood risk from tidal flooding and other sources
  level: must
- item: Wider sustainability benefits
  level: must
- item: That it does not hinder a continuous route around the coast (the national coast path)
  level: must
confidence: medium
notes: From the council's list (August 2025), page 24-25. Listed on the Full or Reserved Matters and Outline
  checklists (pages 8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
