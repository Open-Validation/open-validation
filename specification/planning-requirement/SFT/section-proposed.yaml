reference: section-proposed
local-authority: SFT
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in levels, or a sloping site.
  - condition:
      field: basement
      value: true
      description: Basement conversion.
  - condition:
      field: roof-space-room
      value: true
      description: Attic conversion.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
source-text: Sections – required where any proposal involves a change in levels or are on a sloping site.
  Also required for basement and attic conversions.
must-include:
- item: A scale bar or at least one dimension written on each plan (more than one where a plan has differing
    scales)
  level: must
- item: Finished floor levels
  level: must
- item: 'Replacement windows on a listed building: sectional details of the proposed windows at 1:5, vertical
    and horizontal'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (August 2025), page 9, 36.
review-status: unverified
field-status: {}
