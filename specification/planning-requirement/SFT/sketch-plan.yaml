reference: sketch-plan
local-authority: SFT
required-if:
  application-type:
    in:
    - consent-under-tpo
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
source-text: 'For works to trees protected by a Tree Protection Order, the following information must
  be provided: A completed and dated application form, with all mandatory questions answered, a sketch
  plan showing the location of all trees, a full and clear specification of the works to be carried out,
  statement of reasons for the proposed work; and evidence in support of statement of reasons, where required
  by the standard application form.'
must-include:
- item: The location of all trees
  level: must
confidence: medium
notes: From the council's list (August 2025), page 12. For trees in conservation areas the list strongly
  advises (not compulsory) a sketch plan showing the precise location of all tree(s). Retired MHCLG id,
  used here on purpose.
