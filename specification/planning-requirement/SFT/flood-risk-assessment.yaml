reference: flood-risk-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Development within Flood Zone 2 or Flood Zone 3.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Development over 1 hectare.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Development over 1 hectare.
    - all:
      - site:
          in:
          - critical-drainage-area
          description: The site is in a Critical Drainage Area.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: The site is 0.5 hectares or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 0.5
            description: The site is 0.5 hectares or more.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
