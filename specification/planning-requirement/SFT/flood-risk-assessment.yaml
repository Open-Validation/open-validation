reference: flood-risk-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Within Flood Zone 2 or Flood Zone 3.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Development over 1 ha.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Development over 1 ha.
    - all:
      - site:
          in:
          - critical-drainage-area
          description: In a Critical Drainage Area.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: Site of 0.5 ha or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 0.5
            description: Site of 0.5 ha or more.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policies EQ8, NH4
source-text: Development within Flood Zone 2 or Flood Zone 3; or Development over 1 ha Developments on
  sites of 0.5 hectares or more in a Critical Drainage Area. Please note - this does not apply to householder
  applications.
must-include:
- item: The risks of all forms of flooding to and from the development and how they will be managed, taking
    climate change into account
  level: must
- item: Sequential and exception tests, for development other than minor development
  level: must
  required-if:
    condition:
      field: minor-development
      value: false
      description: Not minor development in flood risk terms.
confidence: medium
notes: From the council's list (August 2025), page 29. Listed on the Full or Reserved Matters and Outline
  checklists (pages 8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
