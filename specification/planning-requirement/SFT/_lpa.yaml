validation-list:
  url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
  date: 2025-08
  date-basis: 'cover: ''Planning Validation Checklist National and Local List of Requirements August 2025''
    (the file is named July 2025; its PDF metadata still says created June 2023). The council''s ''Getting
    your application right first time'' page (https://www.sefton.gov.uk/planning-building-control/apply-for-permission/getting-your-application-right-first-time/,
    ''Last Updated on Thursday, August 21, 2025'') says the checklist ''was reviewed in summer 2025 and
    no changes were proposed from the previous version'' apart from the viability section, and links it
    beside the superseded July 2023 checklist. No newer list or consultation was found on 2026-11-06.'
  status: current
submission-standards:
- item: Every plan based on Ordnance Survey maps carries the appropriate OS copyright notice
  level: must
- item: Plans and drawings accurately drawn to a conventional metric scale (such as 1:100 or 1:50) and
    true to the stated scale
  level: must
- item: All plans and drawings have a scale bar or at least one written dimension (more than one where
    a plan has differing scales)
  level: must
- item: No disclaimers such as 'not to scale' or 'do not scale' (except perspective drawings)
  level: must
- item: Drawings of a suitable standard, capable of being scanned and displayed electronically
  level: must
- item: Existing and proposed drawings grouped side by side at the same scale
  level: should
- item: A title box with the address and proposal, drawing title, date, scale and drawing number, with
    revisions clearly identified
  level: should
- item: Plans and drawings fully annotated
  level: should
- item: 'Paper applications: one copy of form, plans and documents, with a CD/DVD of electronic copies
    where there are many drawings'
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current Sefton list (dated August 2025 in the text, not July), but the
    tab items come from the superseded 2023 checklist. The app-type mapping ignores the source''s explicit
