reference: elevation-existing
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
      - outline
      - ldc-existing-use
      - ldc-prospective-use
      - approval-condition
      - s73
      - non-material-amendment
      - prior-approval
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the elevations.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
source-text: Elevations – all existing and proposed to be shown at a metric scale of 1:50 or 1:100 (unless
  retrospective)
must-include:
- item: A scale bar or at least one dimension written on each plan (more than one where a plan has differing
    scales)
  level: must
- item: At a metric scale of 1:50 or 1:100 (unless retrospective)
  level: must
confidence: medium
notes: From the council's list (August 2025), page 4, 36. 'For applications that propose no changes to
  any elevations, and clearly state that this is the case, elevation drawings are not required' (page
  4).
review-status: unverified
field-status: {}
