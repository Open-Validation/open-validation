reference: transport-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policies EQ3, IN2; Sustainable Travel and Development SPD
source-text: Where a new development is likely to have significant transportation implications, a Transport
  Assessment (TA) and Travel Plan (TP) should be prepared. In some instances a simplified report in the
  form of a Transport Statement (TS) may be sufficient.
must-include:
- item: All existing and proposed trips by all modes, accessibility by all modes and likely modal split
  level: must
- item: Measures to improve public transport, walking and cycling access, reduce parking need and mitigate
    impacts
  level: must
- item: Loading, manoeuvring, servicing and parking arrangements
  level: must
- item: Existing transport conditions, how the development affects them and measures to overcome problems
  level: must
confidence: medium
notes: From the council's list (August 2025), page 40-41. The thresholds are in the Sustainable Travel
  and Development SPD and are 'for guidance only', so discretionary. A Transport Statement may be enough
  for small impacts. Listed on the Full or Reserved Matters and Outline checklists (pages 8 and 11), where
  'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
