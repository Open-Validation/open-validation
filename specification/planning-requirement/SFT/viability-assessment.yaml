reference: viability-assessment
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: On-site works, affordable housing or contributions (off-site works, affordable housing,
        education) are required by policy but the applicant cannot meet them.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policies HC1, IN1, IN2, EQ3, EQ9
source-text: For all minor, other or major applications where on site works or affordable housing is required
  in accordance with adopted policy or where a financial contribution towards off-site works, affordable
  housing provision or education contributions is required in accordance with policy but the applicant
  cannot meet the level of provision set out in the policies or SPD’s.
must-include:
- item: 'A residual valuation with: existing use value (independent valuation); land price, basis, terms
    and process of acquisition and purchase costs'
  level: must
- item: Estimated sales values with independent evidence and a schedule of unit sizes; marketing/disposal
    costs
  level: must
- item: Construction costs supported by tender or QS schedule with contingency, fees and itemised abnormals;
    itemised preliminaries; professional fees
  level: must
- item: S106 costs as advised; financing rate and terms; estimated profit with context
  level: must
- item: Value/cost of affordable housing provision with tenure assumptions and any commuted sum calculation
  level: must
  required-if: discretionary
- item: 'Where non-publication is agreed in exceptional circumstances: two versions (confidential and
    public)'
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: Exceptional circumstances for not publishing are agreed.
confidence: medium
notes: From the council's list (August 2025), page 43-44. Listed on the Full or Reserved Matters and Outline
  checklists (pages 8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
