reference: design-and-access-statement
local-authority: SFT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellinghouses.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Dwellinghouses on a site of 0.5 ha or more where the number is not known.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: A building or buildings creating 1,000 sq m or more of floorspace.
  - all:
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
    - application-type:
        in:
        - full
        - reserved-matters
        - outline
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: A building (or extension) of more than 100 sq m.
  - application-type:
      in:
      - lbc
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9
source-text: 'A Design and Access Statement is required in the following instances: The provision of dwellinghouses
  where – (i) the number of dwellinghouses to be provided is 10 or more; or (ii) the development is to
  be carried out on a site having an area of 0.5 hectares or more and it is not known whether the development
  falls within (i); … The provision of a building or buildings where the floor space to be created by
  the development is 1,000 square metres or more; Development carried out on a site having an area of
  1 hectare or more (excluding minerals, mining or waste development applications) In conservation areas;
  (i) the provision of one or more dwellinghouse(s) (ii) the provision of a building (or extension) where
  the proposed floor space is more than 100 square metres; Applications for listed building consent'
must-include:
- item: The steps taken to appraise the context and how the design takes it into account
  level: must
- item: The policy adopted on access, how local access policies were considered, any consultation on access
    and how specific access issues were addressed
  level: must
- item: A description of any heritage asset affected, including its setting, and the development's contribution
    to local character
  level: must
- item: The design principles and concepts applied
  level: must
- item: 'Listed building consent: how the design principles take account of the building''s special importance,
    its physical features and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (August 2025), page 16-17. The 1 ha trigger excludes minerals, mining and
  waste development applications.
review-status: unverified
field-status: {}
