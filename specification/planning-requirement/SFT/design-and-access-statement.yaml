reference: design-and-access-statement
local-authority: SFT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: A building or extension over 100 square metres.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
confidence: medium
notes: 'From the audit (missing_requirement / wrong_app_type): the 3.2, 3.3 and 3.5 checklists include
  it, for 10+ dwellings or 0.5ha+, 1,000 sqm+, 1ha+, conservation area development of 1+ dwellings or
  over 100 sqm, and Listed Building Consent.'
review-status: unverified
field-status: {}
