reference: heritage-statement
local-authority: SFT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - outline
    - any:
      - all:
        - ref: major-development
        - site:
            in:
            - conservation-area
            description: Within, adjacent to or otherwise affecting a conservation area.
      - all:
        - site:
            in:
            - conservation-area
            description: Within a conservation area, including demolition (not change of use), materially
              affecting its appearance.
        - condition:
            field: external-alterations
            value: true
            description: The proposal would materially affect the conservation area's appearance.
      - all:
        - site:
            in:
            - listed-building
            - listed-building-setting
            - locally-listed-building
            - park-and-garden
            - battlefield
            - scheduled-monument
            description: May affect the significance of a heritage asset, including its setting.
        - discretionary
      - site:
          in:
          - historic-environment-record
          description: The site includes or has potential to include archaeological interest.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policies NH9, NH10, NH14
source-text: Listed Building Consent applications; Major planning applications within, adjacent or otherwise
  affecting conservation areas; Planning applications for developments within conservation areas, including
  demolition, (except changes of use) where the proposal would materially affect its appearance; Planning
  applications that may affect the significance of any heritage asset, including its setting; Planning
  Applications where the site includes or has potential to include archaeological interest.
must-include:
- item: The significance of the heritage assets affected, including their setting, proportionate to their
    importance
  level: must
- item: The relevant historic environment record consulted and assets assessed with appropriate expertise
  level: must
- item: 'Listed building consent, as appropriate: schedule of works with impact analysis and justification;
    contextual and detailed photographs of features to be altered; historic evidence for reinstatement;
    elevations and sections at 1:20 or less (1:5 or less for details) for windows, doors and shopfronts;
    materials specification; photomontages'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Demolition in a conservation area: the building''s contribution to the area''s character and
    appearance, and justification for demolition'
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Includes demolition.
- item: 'Conservation areas: how the design has regard to, and preserves or enhances, the area''s character
    or appearance, with photographs'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: 'Setting of heritage assets: plans showing historic features on or next to the site and analysis
    of significance and impact'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (August 2025), page 30-32. Whether a proposal 'may affect the significance'
  of a heritage asset is a judgement, so discretionary. Listed building consent applications also list
  it on page 9.
review-status: unverified
field-status: {}
