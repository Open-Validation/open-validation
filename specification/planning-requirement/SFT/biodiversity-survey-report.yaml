reference: biodiversity-survey-report
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected species are known to be present.
    - all:
      - site:
          in:
          - ramsar
          - special-protection-area
          - special-area-of-conservation
          description: An internationally important site (e.g. Ramsar, SPA, SAC).
      - discretionary
    - site:
        in:
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-nature-reserve
        - local-wildlife-site
        description: Within or adjacent to a designated site of nature conservation importance (e.g. SSSI,
          NNR, LNR, LWS).
    - condition:
        field: geodiversity-interest
        value: true
        description: Within or adjacent to a Local Geological Site.
    - site:
        in:
        - nature-improvement-area
        description: Development proposed in a Nature Improvement Area.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policies NH1, NH2, NH3, NH4; Nature Conservation SPD
source-text: Where protected species are known to be present; If the proposal may result in a likely significant
  direct or indirect effect on an internationally important site (e.g Ramsar, SPAs, SACs) If proposal
  is within or adjacent to a designated site of nature and/or geological conservation importance (e.g
  SSSI, NNR, LNR, LWS and LGS); Development proposed in a Nature Improvement Area.
must-include:
- item: Appropriate surveys and assessments by suitably qualified persons using standard methods
  level: must
- item: Mitigation measures where negative ecological impacts are identified
  level: must
- item: 'Where a European protected site could be affected: information for a Habitats Regulations Assessment'
  level: must
  required-if:
    site:
      in:
      - ramsar
      - special-protection-area
      - special-area-of-conservation
      description: Could impact a European protected site.
confidence: medium
notes: From the council's list (August 2025), page 26-27. A 'likely significant ... effect' on an international
  site is a judgement, so that part is discretionary. Listed on the Full or Reserved Matters and Outline
  checklists (pages 8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
