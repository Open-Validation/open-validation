reference: site-plan
local-authority: SFT
required-if:
  any:
  - application-type:
      in:
      - ldc-prospective-use
  - discretionary
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
source-text: A Block plan may be required at a metric scale (suggestive scale 1:200 or 1:500).
must-include:
- item: At a metric scale (suggested 1:200 or 1:500), showing the direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    on adjoining land including access, public rights of way, trees on the site and adjacent land, hard
    surfacing, and proposed boundary treatment'
  level: must
confidence: medium
notes: From the council's list (August 2025), page 13, 36. 'May be required', so discretionary, except
  for proposed lawful development certificates, whose checklist asks for a 'site plan (block plan)'.
review-status: unverified
field-status: {}
