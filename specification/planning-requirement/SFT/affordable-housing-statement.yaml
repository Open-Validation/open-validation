reference: affordable-housing-statement
local-authority: SFT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings, including 15 or more additional dwellings net by conversion.
source-url: https://www.sefton.gov.uk/media/jhudnmux/validation-checklist-july-2025.pdf
policy: Sefton Local Plan policy HC1; Affordable and Special Needs Housing and Housing Mix SPD (2018)
source-text: For housing schemes where 15 or more dwellings are proposed or for residential and other
  conversions involving 15 or more additional dwellings net
must-include:
- item: What is proposed for affordable housing, with justification if less than the policy requirement
  level: must
- item: Total residential units by tenure; affordable units by type, size and category
  level: should
- item: Bed spaces by affordable type and dwelling mix, explained against the policy
  level: should
- item: Room and property types across all tenures
  level: should
- item: Plans showing the location of units and how 'pepper-potting' is achieved
  level: should
- item: Design quality standards with full unit floor plans
  level: should
- item: 'Vacant Building Credit sought: a statement with evidence the building is vacant and not abandoned,
    and existing against proposed GIFA (RICS definition)'
  level: must
  required-if:
    condition:
      field: vacant-building
      value: true
      description: Vacant Building Credit is sought.
confidence: medium
notes: From the council's list (August 2025), page 19-20. Listed on the Full or Reserved Matters and Outline
  checklists (pages 8 and 11), where 'Some of the requirements below depend on the proposal'.
review-status: unverified
field-status: {}
