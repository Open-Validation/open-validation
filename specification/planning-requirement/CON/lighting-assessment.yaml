reference: lighting-assessment
local-authority: CON
required-if:
  all:
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Flood lighting.
    - condition:
        field: external-lighting
        value: true
        description: A significant amount of external lighting, or of glass on elevations.
  - any:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        - dark-sky-area
        description: In a National Landscape (AONB) or the Bodmin Moor or West Penwith International Dark
          Sky designations.
    - condition:
        field: rural-area
        value: true
        description: In the open countryside.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'Planning Practice Guidance: Light pollution'
source-text: Applications which include flood lighting, significant amount of external lighting or glass
  on elevations within a National Landscape (formally Area of outstanding Natural Beauty); Bodmin Moor
  and West Penwith International Dark Sky designations or the open Countryside.
must-include:
- item: The impact of predicted light spill on the character of the surrounding area
  level: must
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 87, 146. Reserved matters
  (appearance): a lighting statement is listed (page 222).'
review-status: unverified
field-status: {}
