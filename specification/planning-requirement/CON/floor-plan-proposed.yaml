reference: floor-plan-proposed
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: floorspace-change
          value: true
          description: New or amended floor space, including alterations to an existing building.
      - all:
        - condition:
            field: involves-change-of-use
            value: true
            description: Change of use.
        - condition:
            field: floor-layout-change
            value: true
            description: Changes to the internal layout or use of rooms.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: internal-works
          value: true
          description: Works to the internal layout.
      - condition:
          field: floorspace-change
          value: true
          description: Extension of floor space.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Developments involving new or amended floor space including alterations to an existing building
  ... Required where there are changes to the internal layout or use of rooms within a building are proposed.
must-include:
- item: Metric scale, usually 1:50 or 1:100, with a scale bar
  level: must
- item: Match the existing/proposed elevations
  level: must
- item: Any 'do not scale' wording removed, including any wording which indicates the LPA is unable to
    scale from the plans
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 15, 16, 36, 54, 110, 235.
review-status: unverified
field-status: {}
