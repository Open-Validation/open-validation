reference: roof-plan-existing
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: complex-roof-design
          value: true
          description: The proposal involves a more complex roof design.
      - condition:
          field: roof-alteration
          value: true
          description: An existing roof is altered by the proposal.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: Works to the roof, other than maintenance or repair only.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Proposals involving more complex roof design. Where an existing roof is altered by the proposal.
must-include:
- item: Metric scale, usually 1:50 or 1:100, or shown on the site/block plan, with a scale bar and north
    point
  level: must
- item: Any 'do not scale' wording removed, including any wording which indicates the LPA is unable to
    scale from the plans
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 16, 55, 111, 236.
review-status: unverified
field-status: {}
