reference: location-plan
local-authority: CON
required-if:
  always: true
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All applications What is required: Provided at a metric scale (usually 1:2500 or 1:1250)'
must-include:
- item: Provided at a metric scale (usually 1:2500 or 1:1250), on an up-to-date map, with a north point
  level: must
- item: Site area edged in red, including all land necessary to carry out the development (access to the
    nearest public highway, visibility splays, landscaping, car parking, any new drainage systems such
    as soakaways and open areas around buildings)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  source-text: Show the site area edged in red (to include all land necessary to carry out the development,
    access to the nearest public highway, visibility splays, landscaping, car parking, any new drainage
    systems such as soakaways and open areas around buildings).
- item: 'Householder: the red line includes the residential curtilage'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Show the site area edged in red (this should include the ‘residential curtilage’).
- item: 'Advertisements: the red line goes around each advert and any other land necessary, and all adverts
    are in the same vicinity (all visible on the location plan)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Show the site area edged in red (the redline should go around the advert(s) and any other
    land necessary. If more than one advert is proposed the red a should go around each of the adverts
    and any other land necessary and all adverts must be in the same vicinity i.e. all visible on the
    location plan).
- item: 'Listed building consent: the red line goes around the building and any other land necessary (it
    need not include the whole curtilage or access to the highway)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Show the site area edged in red. The redline should go around the building and any other
    land necessary. The redline does not need to include the whole curtilage or access to the highway.
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
- item: Any 'do not scale' wording removed, including any wording which indicates the LPA is unable to
    scale from the plans
  level: must
- item: Where an Ordnance Survey based plan is used, the copyright and licence number shown
  level: must
- item: Not taken from the Cornwall Council mapping web pages (no Cornwall Council watermark or licence
    number)
  level: must
  source-text: The Planning Service is unable to accept plans which are taken from the Cornwall Council
    Mapping web pages. (i.e. anything with the Cornwall Council watermark or the Cornwall Council licence
    number across the bottom.).
- item: 'Section 73 and non-material amendments: a location plan is still provided (the council cannot
    copy plans from the earlier application); for non-material amendments the red line matches the original
    permission'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: Although not a national requirement please provide a location plan. This can be the same
    as the original application however please note applicants/agents must provide the location plan as
    Planning are unable to copy any plans over from previous submissions. If no plan is provided and we
    are unable to locate the site a location plan will be required.
- item: 'Trees in a conservation area, TPO works and new TPO requests: a scaled plan is not needed, but
    enough particulars to identify the tree or trees'
  level: must
  required-if:
    application-type:
      in:
      - notice-trees-in-con-area
      - consent-under-tpo
  source-text: Although a scaled location plan is not required the request should include sufficient particulars
    to identify the tree or trees
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 12, 107, 108, 227, 232,
  272, 278, 286. Location plans are listed for every application type. Prior approvals need a 'plan indicating
  the site'; the council recommends the same level of detail (page 294).
review-status: unverified
field-status: {}
