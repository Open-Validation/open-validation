reference: arboriculturist-report
local-authority: CON
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development within two metres of the canopy spread of a tree, or on land adjacent to
        trees (including street trees) that could influence or be affected by the development.
  - site:
      in:
      - tree-preservation-zone
      description: Protected trees within the application site.
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees within the development area.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: BS 5837:2012
source-text: Any proposals involving development within two metres of the canopy spread of a tree. Any
  proposals where there are protected trees within the application site. Any proposals on land adjacent
  to trees that could influence or be affected by the development (including street trees). Developments
  within a Conservation Area where there are trees within the development area.
must-include:
- item: 'A tree and topographical survey: a plan of tree positions and a schedule describing them (BS
    5837 part 4)'
  level: must
- item: A tree constraints plan (BS 5837 part 5)
  level: must
- item: An Arboricultural Implication Assessment (BS 5837 section 6)
  level: must
- item: An Arboricultural Method Statement showing how trees will be protected (BS 5837 section 7)
  level: must
- item: Photographs of the trees
  level: should
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 31, 32, 99, 166, 167, 270.
  The guide calls this the 'Tree Survey'.
review-status: unverified
field-status: {}
