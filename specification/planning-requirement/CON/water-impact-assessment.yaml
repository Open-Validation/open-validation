reference: water-impact-assessment
local-authority: CON
required-if:
  all:
  - site:
      in:
      - nutrient-neutrality-area
      description: Within the River Camel (SAC) catchment.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units (including changes of use).
    - condition:
        field: overnight-accommodation
        value: true
        description: Commercial or industrial development with overnight accommodation, or tourism attractions
          including overnight tourist accommodation.
    - condition:
        field: use-class
        value: employment, agricultural intensification or anaerobic digester
        description: Employment sites hosting employees from outside the catchment; agricultural development
          supporting more livestock; anaerobic digesters.
    - condition:
        field: non-mains-drainage
        value: true
        description: Discharge to a septic tank or package treatment plant (small discharges to ground
          under 2 m3/day) relying on the council's interim small-scale guidelines.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Conservation of Habitats and Species Regulations 2017; Interim guidelines on small scale thresholds
  and nutrient neutrality principles for the River Camel SAC (September 2021)
source-text: 'Required for developments within the River Camel Catchment Area comprising any of the following,
  this includes changes of use: New residential units; Commercial / industrial developments which includes
  overnight accommodation; Employment sites where employees will be hosted from outside of the catchment,
  and/or overnight accommodation; Agricultural Development that supports intensification of livestock
  numbers (and therefore increased phosphorous in the catchment); Anaerobic Digesters; Tourism attractions,
  including over-night tourist accommodation. ... Proposals (including changes of use) that discharge
  to septic tanks or package treatment plants within the hydrological catchment area of the River Camel
  SAC (small discharges to ground i.e. less that 2m3/day) and the applicant is seeking to rely upon the
  Interim guidelines on small scale thresholds and nutrient neutrality principles for the hydrological
  catchment of the River Camel Special Area of Conservation September 2021 to demonstrate that no likely
  significant effect alone or in combination for phosphorus can be reached.'
must-include:
- item: River Camel Phosphate Budget Calculator results
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: false
      description: Not relying on the small-scale guidelines.
- item: 'A nutrient neutrality statement: location in relation to the Camel catchment; details of the
    proposal; current land use (showing changes over the last 10 years); justification of the land use
    and number of dwellings; the phosphate budget calculation with a table of key findings; any mitigation'
  level: must
  source-text: 'This statement should include: Location of the development in relation to the Camel catchment;
    Details of the proposed application; Details of the current land use (please show where there is a
    difference in land use over the last 10 years); Justification of the proposed land use and number
    of dwellings; Details of the phosphate budget calculation including a table of key findings; Details
    of any mitigation if appropriate.'
- item: 'Small-scale sites: an assessment of how the development meets conditions a to h of the interim
    guidelines'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Relying on the small-scale guidelines.
- item: Prepared by a competent person with relevant experience
  level: should
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 43, 44, 90, 91, 148, 149,
  150. The guide's 'Nutrient Neutrality – River Camel Phosphate Budget Calculator and Nutrient Neutrality
  Statement' and 'Nutrient Neutrality – Small Scale Sites'. If the calculator shows an increase in phosphates
  that cannot be mitigated on or off site, the list says not to submit the application.
review-status: unverified
field-status: {}
