reference: fire-statement
local-authority: CON
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings (including flats).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Development proposing new, the alteration of an existing or within the curtilage of two or
  more dwellings (includes flats) or educational accommodation and meets the height condition of 18m or
  more, or 7 or more storeys.
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety applied to each building; the site layout;
    emergency vehicle access and water supplies for firefighting; any consultation on fire safety and
    how it was taken into account; how local fire safety policies were taken into account
  level: must
  source-text: The principles, concepts and approach relating to fire safety that have been applied to
    each building in the development; The site layout; Emergency vehicle access and water supplies for
    firefighting purposes; What, if any, consultation has been undertaken on issues relating to the fire
    safety of the development; and What account has been taken of this; how any policies relating to fire
    safety in relevant local development documents have been taken into account
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 61, 117, 118. Also listed
  for prior approvals adding storeys where the existing building is 18 m or more (pages 313-315).
review-status: unverified
field-status: {}
