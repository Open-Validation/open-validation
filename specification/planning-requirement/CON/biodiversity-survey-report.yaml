reference: biodiversity-survey-report
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - demolition-con-area
    - condition:
        field: protected-species
        value: true
        description: The council's Ecology Trigger List indicates an ecology report is required, or protected
          species or habitats are known or suspected to be present.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Climate Emergency Development Plan Document (2023); Natural England standing advice
source-text: 'All major developments What is required: An Ecological Impact Assessment (EcIA) must be
  presented ... All applications where the ecology trigger list indicates an Ecology report is required.
  ... Required where protected species or habitats are known or suspected to be present.'
must-include:
- item: 'Major: an Ecological Impact Assessment (EcIA) with up-to-date protected species and habitat surveys
    and the completed and signed CIEEM EcIA checklist, linked to the BNG reports'
  level: must
  required-if:
    ref: major-development
  source-text: An Ecological Impact Assessment (EcIA) must be presented at validation for all major applications
    and include up to date protected species and habitat surveys and the completed and signed CIEEM EcIA
    checklist.
- item: 'Householder: protected species survey and assessment, including a Preliminary Bat Roost Assessment
    as set out in the trigger list'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Existing wildlife interest of the site and adjacent land, and possible impacts
  level: must
- item: How the proposal will protect or enhance biodiversity, with mitigation and enhancement during
    and after construction
  level: must
- item: Plans mapping protected habitats and species within or adjacent to the red line
  level: must
- item: Surveys carried out at the appropriate times of year
  level: must
- item: Produced by a suitably qualified, experienced and (where protected species surveys are needed)
    licensed ecologist
  level: must
- item: All survey information, potential impacts, how the mitigation hierarchy has been followed, and
    proportionate mitigation and enhancement for protected and priority species and designated sites
  level: must
- item: Where a European Protected Species licence is needed, full mitigation proposals (for bats, a lighting
    strategy)
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: A European Protected Species licence is required.
- item: Surveys and assessments not more than 12 months old unless the report says otherwise
  level: must
  source-text: All surveys and assessments must not be more than 12 months old unless stated otherwise
    within the report.
- item: 'No further surveys outstanding: protected species surveys cannot be conditioned'
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 25, 26, 75, 134, 135, 136,
  239, 268. Householder, full minor, listed building and conservation-area demolition applications must
  first include the signed Ecology Trigger List (see the unmapped list); the report is needed where the
  trigger list says so. Applications are returned if a recommended survey cannot take place in season.
  A Geology Report (county geology sites, or where the trigger list says) can be a chapter of the ecology
  report; it has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
