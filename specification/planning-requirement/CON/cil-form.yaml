reference: cil-form
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Creates one or more new dwellings of any size (including self-contained annexes).
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Creates over 100 sq m of new floorspace in a building into which people normally
            go.
  - all:
    - application-type:
        in:
        - hh
        - ldc-prospective-use
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: Creates new floor space.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use to a dwelling house.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floorspace-change
        value: true
        description: The original permission was granted after 1 January 2019 and the amendment changes
          the approved floorspace.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Community Infrastructure Levy Regulations 2010; Cornwall CIL Charging Schedule
source-text: creates one or more new dwellings of any size (including self-contained annexes); or creates
  over 100sqm of new floorspace; and is a building into which people normally go. ... Developments creating
  new floor space.
must-include:
- item: CIL Planning Application Additional Information Requirement Form (AIR/Form 1)
  level: must
- item: If CIL liable, CIL Form 2 (Assumption of Liability) as soon as possible
  level: should
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 19, 37, 60, 116, 252,
  280. Change of use with no operational development: ''Change of use to dwelling house'' (page 37). Section
  73: ''Required where the original permission was granted after 1 January 2019 and the amendment proposes
  to change the approved floorspace'' (page 280). Lawful development certificates (proposed): not required
  on certificates seeking confirmation of commencement (page 252).'
review-status: unverified
field-status: {}
