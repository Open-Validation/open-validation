reference: flood-risk-assessment
local-authority: CON
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Within Flood Zone 2 or 3.
    - condition:
        field: openings-only
        value: false
        description: Not only replacement windows and doors.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Any development over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Any development over 1 hectare.
  - site:
      in:
      - critical-drainage-area
      description: In an area the Environment Agency has indicated as having critical drainage problems.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'National Planning Policy Framework section 14; Planning Practice Guidance: Flood risk and coastal
  change'
source-text: Development within Flood Zone 2 or Flood Zone 3. Any development over 1 ha. ... A Flood Risk
  Assessment [FRA] is required where proposed development is in an area where the Environment Agency have
  indicated as having critical drainage problems. ... Change of use prior approvals only within flood
  zone 2 or flood zone 3; or within flood zone 1 which has critical drainage problems.
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development
  level: must
- item: How the flood risks will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems including SuDS, following the drainage hierarchy
  level: must
- item: Safe access to and from the development throughout its lifetime
  level: must
- item: A Sequential Test assessment, if needed, in Zone 2 or 3
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
- item: 'In a critical drainage area: focus on managing surface water from outside the site and rain falling
    on and around it; householder and minor extensions can use the council''s flood risk assessment form'
  level: must
  required-if:
    site:
      in:
      - critical-drainage-area
      description: In a critical drainage area.
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 24, 27, 28, 42, 73, 81,
  133, 140, 141, 294. Householder: flood zones 2 or 3 except replacement windows and doors (page 27).
  Change of use: all changes of use in Flood Zone 2 or 3 (page 42). The ''Critical Drainage Assessment''
  row is a flood risk assessment for critical drainage areas. Prior approvals for change of use: in Flood
  Zone 2 or 3, or Flood Zone 1 with critical drainage problems (page 294).'
review-status: unverified
field-status: {}
