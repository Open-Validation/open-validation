reference: flood-risk-assessment
local-authority: CON
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in Flood Zone 2 or 3, or in an area with critical drainage problems.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
source-text: A Flood Risk Assessment [FRA] is required where proposed development is in an area where
  the Environment Agency have indicated as having critical drainage problems.
confidence: low
notes: 'Audit (wrong_trigger): the workbook gave only the critical drainage case and left out Flood Zones
  2 and 3 and sites over 1ha. Audit (other): a ''Validation Guide 2026 DRAFT'' was consulted on in July-August
  2026 and is being finalised; recheck once it is adopted. The audit couldn''t read this council''s list,
  so its contents weren''t checked.'
review-status: unverified
