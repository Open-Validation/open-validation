reference: travel-plan
local-authority: CON
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Minor development of 5 or more residential units, including changes of use.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Minor development with proposed commercial floor area, including changes of use.
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbine applications.
  - condition:
      field: level-crossing-impact
      value: true
      description: Development likely to increase pedestrian and/or vehicular use of a level crossing,
        or otherwise impacting a level crossing as set out by Network Rail.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'Planning Practice Guidance: Travel plans, transport assessments and statements'
source-text: 'All major developments What is required: These should reflect the scale of the development
  ... All minor developments for 5 or more residential units or proposed commercial floor area, this includes
  changes of use. Wind Turbine Applications Developments likely to increase the level of pedestrian and/or
  vehicular usage at a level crossing Developments impacting a level crossing as set out by Network Rail.'
must-include:
- item: Reflects the scale of development and its transport implications; for major proposals, accessibility
    by all modes and the likely modal split
  level: should
- item: How the development is designed and located to minimise travel and support a modal hierarchy,
    with measures for public transport, walking and cycling, reduced parking and transport mitigation
  level: should
- item: 'Wind turbines: site access, access route across the landholding and delivery/installation vehicles;
    for turbines over 26 m, a Traffic Management Plan with the delivery route (swept paths where needed)
    and delivery hours'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
- item: 'Level crossings: a full Transport Statement assessing the impact'
  level: must
  required-if:
    condition:
      field: level-crossing-impact
      value: true
      description: Increased use of a level crossing.
  source-text: For development be likely to increase the level of pedestrian and/or vehicular usage at
    a level crossing a full Transport Statement assessing the impact is required.
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 100, 164, 165, 166. The
  guide''s ''Travel Plan/Travel Plan Statement''. Reserved matters (layout): travel plan/statement listed
  (page 224). For 150+ dwellings, 7,500 sq m+ or 5 ha+ the list points to Active Travel England''s toolkit
  (guidance).'
review-status: unverified
field-status: {}
