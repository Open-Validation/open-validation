reference: recreation-facilities-assessment
local-authority: CON
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Places of work.
  - condition:
      field: loss-of-open-space
      value: true
      description: The development may have impacts on existing open space, parks, green infrastructure
        or access to open space.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - site:
        in:
        - open-space
        description: Involves the loss or gain of a playing field (Sport England exemptions apply).
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Open Space Strategy and Standards; Sport England Playing Fields Policy
source-text: Major residential developments or places of work. All types where a proposed development
  may have possible impacts on existing open space, parks, green infrastructure or access to open space.
  ... Any change of use application involving the loss or gain of a playing field.
must-include:
- item: Quantity and typology of open space to be created on or off site, against local standards
  level: must
  required-if:
    ref: major-development
- item: Layout plans showing accessibility, community safety design, natural, play and recreational value
  level: must
  required-if:
    ref: major-development
- item: Access within the site and contribution to the strategic green infrastructure network
  level: must
  required-if:
    ref: major-development
- item: Maintenance of the open space, and any off-site contribution (planning obligations)
  level: must
  required-if:
    ref: major-development
- item: 'Playing fields: proportionate statement with the information in appendix B of Sport England''s
    Playing Field Policy Guidance'
  level: must
  required-if:
    site:
      in:
      - open-space
      description: Loss or gain of a playing field.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 47, 95, 152, 155. Combines
  the 'Open Space, Sport, Recreation and Green Infrastructure Assessment' (major and outline sections)
  and the 'Playing Fields Impact Statement' (change of use, minor and major).
review-status: unverified
field-status: {}
