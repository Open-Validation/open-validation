reference: air-quality-assessment
local-authority: CON
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The application is for dwellings.
    - site:
        in:
        - air-quality-management-area
        description: Within an Air Quality Priority Area of concern, including a 1km buffer.
  - all:
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - site-of-special-scientific-interest
        description: The development is likely to affect a habitats site (SPA/SAC/Ramsar) or an SSSI.
    - discretionary
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
source-text: 'Air Quality Assessment LR When Required: Applications for dwellings within an Air Quality
  Priority Area of concern including 1km buffer'
