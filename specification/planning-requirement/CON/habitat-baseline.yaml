reference: habitat-baseline
local-authority: CON
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Schedule 7A, Town and Country Planning Act 1990; Biodiversity Gain Requirements (Exemptions) Regulations
  2024; article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: a plan, drawn to an identified scale which must show the direction of North, showing onsite
  habitat existing on the date of application (or an earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale, showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), page 116. The list says BNG applies
  where development would be subject to the general biodiversity gain condition; householder and other
  exempt applications are outside it by law, so the rule is the biodiversity gain condition. The council's
  Validation updates page adds that from 6 August 2026 sites of 0.2 hectares or less within the red line
  and temporary permissions of 5 years or less are exempt, and the self-build or custom build exemption
  no longer applies to new applications.
