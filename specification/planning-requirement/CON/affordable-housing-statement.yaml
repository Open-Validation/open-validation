reference: affordable-housing-statement
local-authority: CON
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: A net increase of more than 10 dwellings (not including replacement dwellings).
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Dwellings with a combined gross floor space of more than 1,000 sq m (not including
          replacement dwellings).
    - all:
      - site:
          in:
          - area-of-outstanding-natural-beauty
          - designated-rural-area
          description: In a National Landscape (AONB) or Designated Rural Area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 6
          description: 6 or more dwellings.
    - condition:
        field: exception-site-housing
        value: true
        description: Rural Exception Sites, Self-/Custom Build sites, Entry Level Exception sites and
          Starter Home Exception Sites.
    - all:
      - condition:
          field: holiday-occupancy-removal
          value: true
          description: Lifting of holiday conditions, or change of use from holiday use to residential.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 6
            description: 6 or more dwellings.
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: A site area of more than 0.5 hectares.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Local Plan Strategic Policies 2010-2030 Policy 8; Cornwall Affordable Housing SPD
source-text: Developments where there is a net increase of more than 10 dwellings or where dwellings would
  have a combined gross floor space more than 1,000 square metres (not including replacement dwellings).
  6 or more dwellings in a National Landscape (formally Area of Outstanding Natural Beauty (AONB)) or
  Designated Rural Area (DRA) (as defined by s157 of the Housing Act 1985 and an accompanying Housing
  Order from 1981). Rural Exception Sites, Self-/Custom Build- sites, Entry Level Exception sites and
  ‘Starter Home Exception Sites’ built on under-used, or unviable commercial or industrial sites not currently
  identified for housing. Lifting of Holiday Conditions or changes of use from holiday use to residential
  on schemes of 6 or more dwellings or a site area >0.5 hectares.
must-include:
- item: A short statement explaining what provision is being made for affordable housing
  level: must
- item: Draft heads of terms on the prescribed template, setting out the obligations and their timing/triggers
  level: must
  source-text: Draft heads of terms must be submitted following the prescribed template. The draft heads
    of terms should set out clearly the obligations that the developer/landowner is willing to be bound
    by, in order to meet the needs generated by the development. The draft heads of terms should also
    include the agreed timing/triggers for satisfying the obligations.
- item: An Economic Viability Appraisal for Rural and Entry-Level Exception Sites and wherever the affordable
    housing policy position is not met in full
  level: must
  required-if:
    any:
    - condition:
        field: exception-site-housing
        value: true
        description: A Rural or Entry-Level Exception Site.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The affordable housing policy position is not met in full.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 66, 122, 123. Full minor
  applications use the same triggers except the 'more than 10 dwellings' one (page 66). See also viability-assessment.
review-status: unverified
field-status: {}
