reference: town-centre-impact-assessment
local-authority: CON
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development not in an existing centre and not in accordance with
        an up-to-date development plan.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 sq m gross floor space.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: National Planning Policy Framework; Cornwall Site Allocations Development Plan Document
source-text: All retail and leisure development, over 2500 sq. m gross floor space not located within
  an existing centre (city/town centre, district or local) and not in accordance with an up-to-date development
  plan.
must-include:
- item: Impact on existing, committed and planned public and private investment, and on town centre vitality
    and viability, including consumer choice and trade
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 163, 211.
review-status: unverified
field-status: {}
