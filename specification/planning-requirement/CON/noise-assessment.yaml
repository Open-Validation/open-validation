reference: noise-assessment
local-authority: CON
required-if:
  any:
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
  - condition:
      field: use-class
      value: solar farm, diesel generating farm, mining or mineral extraction
      description: Solar farms, diesel generating farms, mining operations and mineral extraction.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Shops, financial and professional services, offices, research and development or
          industrial processes, F1, F2 or sui generis uses, hotels (C1) or residential institutions (C2/C2a)
          that include HVACR plant (heating, ventilation, air-conditioning, refrigeration with external
          plant or emission points) or another noise-generating process.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: 'Residential dwellings/institutions, hospitals and schools (including care homes,
          nurseries, holiday lets and campsites), within the vicinity (initial screening: within 100 m).'
  - all:
    - any:
      - condition:
          field: food-or-drink-use
          value: true
          description: Restaurants, cafes, drinking establishments and hot food takeaways.
      - condition:
          field: use-class
          value: B2
          description: General industrial (use class B2).
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: 'Residential dwellings/institutions, hospitals and schools (including care homes,
          nurseries, holiday lets and campsites), within the vicinity (initial screening: within 100 m).'
  - condition:
      field: noise-sensitive-use
      value: true
      description: C2/C2a residential institutions in the vicinity of existing noise generating uses,
        railways (including stations), within 50 m of a classified road with an AADT of 5,000-9,999 or
        within 100 m of a classified/trunk road with an AADT of 10,000+; C3 dwellings and C4 HMOs in the
        vicinity of existing noise generating uses or railways; and changes of use to C2, C2A or C4 in
        the vicinity of any of these.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'Planning Practice Guidance: Noise'
source-text: 'All applications for wind turbines, solar farms, diesel generating farms, mining operations
  and mineral extraction. Proposals including shops (retail warehouses, post offices, ticket and travel
  agencies, sale of cold food for consumption off premises, hairdressers, funeral directors, hire shops,
  dry cleaners and internet cafes) and financial and professional services which include *1HVACR and is
  in the *2vicinity of 3*sensitive uses. Proposals for restaurants, cafes, drinking establishments and
  hot food takeaways in the vicinity of 3*sensitive uses. *2 Proposals for business premises which include
  offices, research and development of products or processes or any industrial process which include *1HVACR
  and is in the *2vicinity of 3*sensitive uses. Proposals within use class B2 in the *2vicinity of 3*sensitive
  uses. Proposals within use classes F1, F2 and Sui generis which includes a *1HVACR or other noise generating
  process and is in the *2vicinity of other 3*sensitive uses. Applications for development within use
  class C1 (Hotels) which includes a *1HVACR or other noise generating process and is in the *2vicinity
  of other 3*sensitive uses. Applications for development within uses classes C2 (Residential institutions)
  and C2a (Secure residential institutions) which includes a *1HVACR or other noise generating process
  and is in the *2vicinity of other 3*sensitive uses and/or development in the vicinity of existing noise
  generating issues; railways (including stations etc.); within 50m of a classified road with an AADT
  of 5000-9999; within 100m of a classified/trunk road with an AADT of 10000+ ... Applications for development
  within use classes C3 (Dwelling-houses) and C4 (Houses in Multiple Occupation) in the *2vicinity of
  existing noise generating issues; railways (including stations etc.); within 50m of a classified road
  with an AADT of 5000-9999; within 100m of a classified/trunk road with an AADT of 10000+ ... Proposals
  involving the change of use to C2, C2A or C4 in the vicinity of: existing noise generating uses; railways
  (including stations etc.); within 50m of a classified road with an AADT of 5000-9999; within 100m of
  a classified/trunk road with an AADT of 10000+.'
must-include:
- item: By a suitably competent and qualified acoustician, with baseline monitoring, predictions supported
    by sound source data, full details of mitigation and an assessment against the relevant standards
  level: must
- item: 'For residential development: good acoustic design to achieve national noise standards in rooms
    and amenity areas'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Residential development.
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 46, 66, 88, 89, 146, 147,
  148. The guide also lists C3 and C4 development within 50 m of a classified road with an AADT of 5,000-9,999
  or within 100 m of one with an AADT of 10,000+, but the council''s Validation updates page says: "For
  C3 (dwellinghouses) and C4 (houses in multiple occupation) uses only, if development is in the vicinity
  of any of the following: within 50m of a classified road with an AADT of 5000-9999 within 100m of a
  classified/trunk road with an AADT of 10000+ There is no longer a need to provide a noise assessment."
  So that road trigger is left out for C3/C4. Changes of use to C2, C2A or C4 near noise sources need
  a ''Noise Statement'' / ''Acoustic Design Statement'' (pages 46, 66), included here. ''Vicinity'' is
  a screening guide of 100 m (glossary, page 337).'
review-status: unverified
field-status: {}
