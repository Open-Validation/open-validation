reference: viability-assessment
local-authority: CON
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New-build development (from 15 June 2023).
    - condition:
        field: energy-policy-shortfall
        value: true
        description: The policy position of Policy SEC1 2a and 2b of the Climate Emergency DPD is not
          met in full on viability grounds.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing policy position (including Policy 8) is not met in full, or
        a Rural or Entry-Level Exception Site.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'Cornwall Climate Emergency Development Plan Document (2023) Policy SEC1; Cornwall Local Plan
  Strategic Policies 2010-2030 Policy 8; Planning Practice Guidance: Viability'
source-text: From 15 June 2023, new-build development where the policy position of Policy SEC1 2a and
  2b of the Climate Emergency Development Plan document is not met in full on the grounds of viability.
  ... An Economic Viability Appraisal must accompany all Rural and Entry-Level Exception Site applications
  and in all other cases including Policy 8 applications where the policy position of Affordable Housing
  is not met in full.
must-include:
- item: A full open book viability appraisal and the associated assessment fee
  level: must
  required-if:
    condition:
      field: energy-policy-shortfall
      value: true
      description: SEC1 not met on viability grounds.
- item: Published in full; documents titled 'confidential' are not accepted and redaction only in exceptional
    circumstances
  level: must
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 103, 123, 169. Full minor
  applications: new-build residential where SEC1 2b is not met (page 103). The affordable housing Economic
  Viability Appraisal comes from the Affordable Housing Statement row. Reserved matters: where the outline
  was approved on or after 1 June 2023 (page 222).'
review-status: unverified
field-status: {}
