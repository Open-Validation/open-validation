reference: energy-statement
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - all:
        - condition:
            field: new-build
            value: true
            description: New-build
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Residential units.
      - all:
        - ref: major-development
        - condition:
            field: new-build
            value: true
            description: New-build
        - condition:
            field: floorspace-non-residential
            operator: '>='
            value: 1000
            description: Non-residential development of 1,000 sq m or more (not agricultural buildings).
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: original-energy-statement
        value: true
        description: The original application was subject to an Energy Statement.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Climate Emergency Development Plan Document (2023) Policy SEC1 (Part 2); Renewable Energy
  Offsetting Framework
source-text: Applications submitted on or after 15 June 2023 for new-build residential units and new-
  build non-residential development proposals of 1000 sqm or more (this does not include agricultural
  buildings). ... Where the original application was subject to an Energy Statement
must-include:
- item: 'Residential: a completed, up-to-date Energy Summary Tool (SAP or PHPP version, or an agreed alternative)
    and an Energy Report'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential.
- item: SAP data and the SAP Energy Summary Tool only for schemes of up to 25 units (up to 9 flats) without
    district heating; PHPP for any scheme
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential.
- item: 'Energy Report: contents; tab 3 results from the Energy Summary Tool; any offsetting payment calculation;
    any Alternative Offsetting Statement; heating and renewable energy overview (ventilation, overheating,
    generating capacity, storage, monitoring); siting/layout plans of renewable equipment; unadjusted
    energy data per property (SAP report or PHPP outputs); water efficiency; embodied carbon measures'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential.
- item: Completed by an Accredited Energy Assessor unless using SAP data
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential.
- item: Offsetting payment method (S111 or S106) agreed before submission
  level: must
  required-if:
    condition:
      field: renewable-energy-offsetting
      value: true
      description: A renewable energy offsetting payment is needed.
- item: 'Non-residential: a BREEAM Pre-Assessment Report by an accredited assessor with a certification
    estimate and summary (or an agreed alternative)'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential development of 1,000 sq m or more.
- item: 'Retrospective applications: the endeavours made to meet Policy SEC1 and any renewable energy
    offsetting'
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: The application is retrospective.
- item: Any measures to meet SEC1 shown on the submitted plans (e.g. roof-mounted solar panels on the
    proposed elevations and roof plans)
  level: must
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 79, 137, 138, 139, 140,
  283. Full minor applications: new-build residential units only (page 79). Reserved matters: where the
  outline permission was approved on or after 15 June 2023 (page 222).'
review-status: unverified
field-status: {}
