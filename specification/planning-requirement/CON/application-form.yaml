reference: application-form
local-authority: CON
required-if:
  always: true
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: All sections of the application form answered
  level: must
  source-text: All sections of the application form must be answered.
- item: Declaration signed and dated
  level: must
  source-text: The declaration must be signed and dated.
- item: Certificate A, B, C or D completed stating the ownership of the property, with notice served on
    any other landowners where the applicant is not the owner
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - lbc
      - s73
  source-text: Certificate A, B, C or D must be completed stating the ownership of the property. Where
    the applicant is not the owner of the application site, a notice must be completed and served on any
    other landowners.
- item: Agricultural tenants notified before submission and certificate B, C or D completed where the
    land is an agricultural holding subject to an agricultural tenancy
  level: must
  required-if:
    condition:
      field: agricultural-holding
      value: true
      description: The land is, or is part of, an agricultural holding subject to an agricultural tenancy.
  source-text: If the land to which the application relates forms an agricultural holding or part of an
    agricultural holding, as defined by the Agricultural Holdings Act 1986, and comprises land subject
    to an Agricultural Tenancy all agricultural tenants must be notified prior to the submission of an
    application and certificate B, C or D completed as indicated above.
- item: 'For mineral extraction: the council''s own Application for Planning Permission for Mineral Extraction
    and Ancillary Operations form, submitted electronically to planning@cornwall.gov.uk'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
  source-text: A full Application for Planning Permission form except planning permission for mineral
    extraction and associated development. This form is only available via the Cornwall Council website
    under download forms, other useful forms and documents, Application for Planning Permission for Mineral
    Extraction and Ancillary Operations. The form should be downloaded and submitted electronically to
    planning@cornwall.gov.uk.
- item: 'Prior approvals: if made in writing, the written submission includes all information requested
    on the application form'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: If submitting in writing, the written submission should include all information as requested
    on the application form.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 10, 11, 106, 293. Each application-type
  section opens with 'Application Form' (NR), 'All applications'. The householder form is used for works
  to a dwelling, except detached ancillary outbuildings with fully habitable rooms, which need the full
  form (page 10). The fee is also listed as a national requirement (no matching id).
review-status: unverified
field-status: {}
