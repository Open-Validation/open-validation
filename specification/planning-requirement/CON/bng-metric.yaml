reference: bng-metric
local-authority: CON
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Schedule 7A, Town and Country Planning Act 1990; Biodiversity Gain Requirements (Exemptions) Regulations
  2024; article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: Where development would be subject to the general biodiversity gain condition.
must-include:
- item: A statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed metric calculation tool showing the calculations and the publication date
    and version of the metric
  level: must
  source-text: the pre-development biodiversity value of the onsite habitat on the date of application
    (or an earlier date) including the completed metric calculation tool used showing the calculations,
    the publication date and version of the biodiversity metric used to calculate that value;
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
- item: Whether the onsite biodiversity value is lower because of degradation, with supporting evidence
    if so
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 36, 58, 115, 116. The list
  says BNG applies where development would be subject to the general biodiversity gain condition; householder
  and other exempt applications are outside it by law, so the rule is the biodiversity gain condition.
  The council's Validation updates page adds that from 6 August 2026 sites of 0.2 hectares or less within
  the red line and temporary permissions of 5 years or less are exempt, and the self-build or custom build
  exemption no longer applies to new applications. Major and outline applications also need a local Biodiversity
  Net Gain Statement (post-development habitat, off-site gains, draft habitat management and monitoring
  plan, heads of terms); it has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
