reference: landscaping-plan
local-authority: CON
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - ref: major-development
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Climate Emergency Development Plan Document (2023) (tree canopy, 15%)
source-text: All major applications submitted from the 15 June 2023
must-include:
- item: A proposed landscaping plan
  level: must
- item: A plan of canopy provision 25 years after planting
  level: must
- item: Retention or new canopy cover of at least 15% of the site area (excluding priority habitat), with
    any loss justified by the canopy mitigation hierarchy and any shortfall fully evidenced
  level: must
- item: How the new canopy is sustainable (resilient to pests, diseases and climate change)
  level: must
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 167, 168, 216. The guide''s
  ''Tree Canopy Calculation'', needed in addition to the tree survey. Reserved matters (layout): where
  the outline was approved on or after 15 June 2023 (page 224).'
review-status: unverified
field-status: {}
