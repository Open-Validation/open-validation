reference: planning-statement
local-authority: CON
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - ref: major-development
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Local Plan Strategic Policies 2010-2030
source-text: 'All major developments. What is required: A Planning Statement is a statement in support
  of'
must-include:
- item: The context, and the principles behind and justification for the development
  level: should
- item: How it fits with Local Plan policies and supplementary planning documents
  level: should
- item: Any pre-application consultation with the council, the community or statutory consultees
  level: should
- item: Compliance with national, regional and local planning policies
  level: should
- item: The business case, where necessary; crime prevention or other considerations
  level: should
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 153, 154, 205.
review-status: unverified
field-status: {}
