reference: protected-landscape-assessment
local-authority: CON
required-if:
  all:
  - ref: major-development
  - site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within a National Landscape (AONB).
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'National Planning Policy Framework: conserving and enhancing the natural environment (major development
  in AONBs)'
source-text: All major development within an AONB.
must-include:
- item: 'The exceptional circumstances and public interest, assessing: the need for the development (including
    national considerations) and the impact of permitting or refusing it on the local economy; the cost
    of and scope for developing elsewhere or meeting the need another way; and any detrimental effect
    on the environment, landscape and recreation and how far it could be moderated'
  level: must
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 124, 125. The guide calls
  this the 'AONB Assessment of Need'.
review-status: unverified
field-status: {}
