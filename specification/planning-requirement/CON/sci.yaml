reference: sci
local-authority: CON
required-if:
  any:
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 5
      description: All non-residential development over 5 hectares.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 200
      description: New residential development of 200 units or more.
  - condition:
      field: wind-turbine-count
      operator: '>='
      value: 2
      description: 2 or more wind turbines.
  - condition:
      field: turbine-hub-height
      operator: '>'
      value: 15
      description: The hub height of any turbine exceeds 15 metres.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Cornwall Council Statement of Community Involvement
source-text: All non-residential development over 5 hectares New residential development comprising 200
  units or more Applications for 2 or more wind turbines or where the hub height of any turbine exceeds
  15 metres
must-include:
- item: How the applicant has complied with the pre-application consultation in the Statement of Community
    Involvement, and how community views were taken into account
  level: must
- item: 'Wind turbines: written notice to all homes within 500 m of the tower, the local councils and
    the Divisional Member'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
- item: 'Wind turbines that are major or more than one turbine with a 50 m tip height: details published
    on a website, a press advert and at least one public consultation event'
  level: must
  required-if:
    all:
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbines.
    - any:
      - ref: major-development
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 1
          description: More than one turbine with a tip height of 50 m.
  source-text: 'For schemes defined as major development or those consisting of more than one turbine
    with a tip height of 50m: Publish details on a website; Place a press advert in the local paper; and
    Hold a minimum of one public consultation event within the local community.'
- item: Notifications give the proposal details, how and by when to comment (at least 21 days), and that
    comments may be published
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
- item: A Community Consultation Statement showing compliance, the responses received and how they were
    taken into account
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 158, 159, 160. The guide
  calls this the 'Statement of Community Consultation'.
review-status: unverified
field-status: {}
