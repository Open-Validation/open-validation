reference: land-contamination-assessment
local-authority: CON
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Within Potentially Contaminated Land, or known/suspected contamination is indicated
        on the application form.
  - condition:
      field: industrial-site
      value: true
      description: The current land use is industrial/commercial, except low-risk commercial uses (e.g.
        caravan/camp sites, hotels, care homes, small offices).
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Conversion of a building used for agricultural purposes to dwelling(s).
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'National Planning Policy Framework; Planning Practice Guidance: Land affected by contamination'
source-text: All applications that fall within Potentially Contaminated Land; AND/OR where the current
  land use is industrial/commercial *1; AND/OR where known/suspected contamination is indicated on the
  application form; AND/OR Conversion of building used for agricultural purposes to dwelling(s).
must-include:
- item: 'A Phase 1 report: desk study of current and historic uses of the site and adjoining land, with
    a site reconnaissance'
  level: must
- item: A preliminary conceptual site model of pollutant linkages and a preliminary risk assessment
  level: must
- item: Meets BS 10175:2011 and is undertaken by a competent person
  level: must
- item: Not more than 5 years old
  level: must
  source-text: Reports must not be more than 5 years old.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 40, 72, 131, 132. Required
  'irrespective of whether there is ground disturbance'. For full minor applications it is not required
  for minor developments within development code Q018G (unless a vulnerable/sensitive end use such as
  schools, nurseries, hospitals, play areas, holiday use or allotments) or wind turbines (page 72). There
  is no public mapping layer for contaminated land.
review-status: unverified
field-status: {}
