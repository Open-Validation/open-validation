submission-standards:
- item: Scale bars on elevations, floor plans and other plans the council is required to scale from, with
    a scale bar for each scale ratio shown (not needed on the location or block plan)
  level: must
- item: No 'do not scale' wording, or other wording that stops the council scaling from the plan; only
    'do not scale for construction purposes' is accepted
  level: must
- item: Plans provided at the scale indicated on them (e.g. a plan stating 1:100 @A3 must be provided
    at A3)
  level: must
- item: Plans copied from the council's interactive mapping are not accepted
  level: must
- item: Documents titled 'confidential' are not accepted; redacted versions only in exceptional circumstances
    where specific commercial harm is demonstrated
  level: must
- item: Development descriptions containing 'retrospective', 'retention' or 're-submission' are not accepted
  level: must
