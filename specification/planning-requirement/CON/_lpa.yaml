submission-standards:
- item: Plans drawn to an identified standard metric scale
  level: must
- item: A linear scale bar on plans; scale bars are required on elevations, floor plans and other plans
    the council scales from, one for each scale ratio shown (not needed on location or block plans or
    supporting plans within documents)
  level: must
- item: '''Do not scale'' removed and replaced with wording that allows the council to scale from the
    drawing; only ''do not scale for construction purposes'' is accepted'
  level: must
- item: Location and block plans on an up-to-date map and indicating North
  level: must
- item: Plans provided at the scale indicated on them (e.g. a plan stating 1:100 @A3 is provided at A3)
  level: must
- item: Plans taken from the Cornwall Council mapping web pages (Cornwall Council watermark or licence
    number) are not accepted
  level: must
- item: Ordnance Survey based plans show the copyright and licence number
  level: must
- item: Applications that can be submitted through the Planning Portal are not accepted by email (since
    1 April 2022); prior approvals are not accepted by email
  level: must
- item: Plans ideally scaled to fit A4 or A3, clear and legible, uploaded in the orientation shown, named
    and titled logically, numbered, and each submitted as a separate clearly labelled document
  level: should
- item: Personal details such as mobile numbers removed
  level: should
- item: Viability and financial information is published in full; documents titled 'confidential' are
    not accepted and redacted versions only in exceptional circumstances where specific commercial harm
    is demonstrated
  level: must
- item: Development descriptions containing 'retrospective', 'retention' or 're-submission' are not accepted
    (Validation updates page)
  level: must
- item: All national and local list items are required for validation; missing information not provided
    within 21 days (plus a further 7) closes the application, with a 10% administration fee kept
  level: must
