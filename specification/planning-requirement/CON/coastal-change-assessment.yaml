reference: coastal-change-assessment
local-authority: CON
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - hh
  - any:
    - site:
        in:
        - coastal-erosion-zone
        description: Development (including replacement buildings) within a coastal vulnerability zone;
          for full minor applications not walls, fences, gates, elevation alterations, private gardens
          or bus shelters.
    - condition:
        field: cliff-or-coastal-zone-drainage
        value: true
        description: A proposed soakaway within 5 metres of a coastal vulnerability zone, or discharge
          of water over or down the face of a cliff.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'National Planning Policy Framework paragraph 172 (as cited); Cornwall Climate Emergency Development
  Plan Document (2023); Chief Planning Officer''s Advice Note: Planning for coastal change'
source-text: All developments including replacement buildings within a coastal vulnerability zone. Where
  a proposed soakaway is within 5 metres of a coastal vulnerability zone. Where there would be discharge
  of water over or down the face of a cliff.
must-include:
- item: 'Whether NPPF paragraph 172 can be met: the development would not impair adaptation to climate
    change, will be safe over its lifetime without increasing risk or needing new coastal defences, and
    would not affect the stability of the coast or worsen shoreline change'
  level: must
- item: Measures for managing the development at the end of its planned life
  level: should
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 22, 71, 129, 130. The
  guide calls this the ''Coastal Vulnerability Assessment''. For full minor applications it excludes minor
  works such as walls, fences, gates, elevation alterations, private gardens and bus shelters (page 71).
  Reserved matters: needed where not considered at outline or where the scale affects it (page 224).'
review-status: unverified
field-status: {}
