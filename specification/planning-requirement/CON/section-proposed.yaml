reference: section-proposed
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: earthworks
          value: true
          description: Cut and fill operations are proposed.
      - condition:
          field: change-in-ground-levels
          value: true
          description: The site is sloping or uneven, or immediately adjoining land is on a different
            level.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Any proposal where cut and fill operations are proposed, proposals on sloping or uneven
  land or sites where immediately adjoining land are on a different level. ... All major developments.
  What is required: Identify FFLs and ridge levels of buildings'
must-include:
- item: Finished floor levels and ridge levels of buildings, and existing and proposed site levels
  level: must
  required-if:
    ref: major-development
- item: Slices through the land, showing the development in relation to adjoining land and properties,
    including street scene sections front and back
  level: must
  required-if:
    ref: major-development
  source-text: Show slices through the land Show existing and proposed development in relation to land/properties
    adjoining the site including street scene sections front and back.
- item: Accompanied by a plan showing where the cross sections were taken
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 57, 113. The householder
  section's 'Finished Floor Levels/Section Drawing' (page 17) asks only for finished floor levels, which
  can be on the block plan (see site-plan).
review-status: unverified
field-status: {}
