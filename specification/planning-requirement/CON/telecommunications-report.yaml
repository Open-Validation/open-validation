reference: telecommunications-report
local-authority: CON
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Planning applications for mast and antenna development.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Code of Practice on Mobile Network Development
source-text: Planning applications for mast and antenna development.
must-include:
- item: The outcome of consultations with interested organisations, in particular the relevant body where
    a mast is near a school or college or within an aerodrome or technical site safeguarding zone
  level: must
- item: 'For an addition to an existing mast or base station: a self-certified statement that cumulative
    exposure will not exceed ICNIRP guidelines'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: true
      description: An addition to an existing mast or base station.
- item: 'For a new mast or base station: evidence that sharing an existing building, mast or structure
    was explored, and a self-certified ICNIRP statement'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new mast or base station.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 98, 162.
review-status: unverified
field-status: {}
