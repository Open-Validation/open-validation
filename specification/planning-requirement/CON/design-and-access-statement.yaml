reference: design-and-access-statement
local-authority: CON
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: The site is in a World Heritage Site or a Conservation Area.
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The development creates 100 square metres or more of floor space.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The development creates one or more dwellings.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
source-text: 'Design and Access Statement NR When required: Developments within World Heritage Site (WHS)
