reference: elevation-proposed
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: new-build
          value: true
          description: The proposal includes new buildings.
      - condition:
          field: external-alterations
          value: true
          description: Alterations to the exterior of an existing building (including replacement windows
            and doors).
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: External works, including 'like for like' and replacement windows and doors.
  - application-type:
      in:
      - advertising
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Cornwall Climate
  Emergency Development Plan Document (2023) policy SEC1
source-text: All applications proposing new buildings or alterations to the exterior of an existing building
  (including replacement windows and doors). ... Existing and proposed for all applications for external
  works, including ‘like for like’ and replacement windows and doors etc.
must-include:
- item: Metric scale, usually 1:50 or 1:100, with a scale bar (photographs with annotated dimensions are
    not accepted)
  level: must
- item: All elevations, including any blank elevations (unless completely obscured, e.g. attached to another
    building)
  level: must
- item: Match the existing/proposed floor plans
  level: must
- item: Clearly labelled (e.g. north, west) or a north point indicated
  level: must
- item: Any building attached to the elevation and, where possible, its main features (e.g. doors and
    windows of an adjoining terraced or semi-detached dwelling), and a street scene where appropriate
  level: must
- item: Any 'do not scale' wording removed, including any wording which indicates the LPA is unable to
    scale from the plans
  level: must
- item: Any proposals to meet policy SEC1 shown (e.g. roof-mounted solar panels)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  source-text: Any proposals to adhere to the policy SEC1 must be shown, for example, where roof mounted
    solar panels are proposed in order to adhere to the policy these must be shown.
- item: 'Advertisements: cross sections/elevations at a metric scale, usually 1:20 or 1:50, with a scale
    bar'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: materials, fixings, colours, height above ground and any projection from a building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: the type and dimensions of each sign and, if illuminated, the type of illumination,
    hours, lumens/candela and whether static, flashing or moving'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Show the signs, size and illumination. The type of each sign for which application is being
    made, e.g. fascia, projecting box, pole-mounted free-standing, should be shown, together with the
    dimensions of each sign. If any of the signs are to be illuminated, please describe the type of illumination,
    e.g. internal, external, floodlight, etc., hours of illumination, lumens/candela and whether the illumination
    will be static, flashing, or have moving parts.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 14, 52, 109, 110, 229, 230,
  234.
review-status: unverified
field-status: {}
