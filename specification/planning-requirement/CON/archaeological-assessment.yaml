reference: archaeological-assessment
local-authority: CON
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - any:
    - site:
        in:
        - historic-environment-record
        description: Land known to have archaeological interest.
    - discretionary
    - site:
        in:
        - listed-building
        - conservation-area
        - scheduled-monument
        - world-heritage-site
        - park-and-garden
        - battlefield
        description: The application may have an impact on the character or setting of a designated asset.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: 'National Planning Policy Framework: conserving and enhancing the historic environment; Historic
  England Advice Note 17'
source-text: Applications on land which is known to have archaeological interest, or an archaeological
  assessment has been requested as part of any pre-application advice. Applications which may have an
  impact on the character or setting of a designated asset e.g. Listed Building, Conservation Area Scheduled
  Monument, WHS, Registered Parks and Gardens and Registered Battlefields.
must-include:
- item: Undertaken by a competent person to the standards of the Chartered Institute for Archaeologists
  level: should
- item: The significance of the site and its setting, and whether and how far the proposals will harm
    the historic environment
  level: should
- item: Goes beyond a consultation of the Cornwall and Isles of Scilly Historic Environment Record, exploring
    the potential for unrecorded remains
  level: should
- item: Wider visual impacts on historic buildings, upstanding monuments and historic landscapes
  level: should
- item: Any Zone of Theoretical Visibility informs the heritage setting assessment
  level: should
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 68, 125, 126. 'An archaeological
  assessment has been requested as part of any pre-application advice' is shown as discretionary.
review-status: unverified
field-status: {}
