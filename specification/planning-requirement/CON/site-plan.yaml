reference: site-plan
local-authority: CON
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: first-floor-or-openings-only
        value: false
        description: Not only first-floor development or changes to windows and doors.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - advertising
      - demolition-con-area
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: first-floor-or-openings-only
        value: false
        description: Not only changes to windows and doors.
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Not required for first floor development or proposals to change windows and doors only. ...
  Proposed block plan required for all applications. Existing block plan required for all application
  except if the site is vacant and has no buildings or structures however a site plan will be required.
must-include:
- item: Plans for both existing and proposed, at a metric scale (1:200 or 1:500), with a scale bar and
    north point, on an up-to-date map
  level: must
- item: The proposed development in relation to site boundaries, other existing buildings on the site,
    adjoining properties and the immediate area, including roads, public rights of way (if they will influence
    or be affected by the development), position of trees, changes in levels, boundary treatment, vehicular
    and pedestrian access and parking
  level: must
  source-text: Show the proposed development in relation to site boundaries, other existing buildings
    on the site, adjoining properties and the immediate area, this includes roads, public rights of way
    if it will influence or will be affected by the proposed development and position of trees, changes
    in levels, boundary treatment, vehicular/pedestrian access and parking.
- item: House names and road names labelled
  level: should
- item: Any red edge matches the location plan
  level: must
- item: Any connection to an existing drainage system indicated
  level: should
- item: Any 'do not scale' wording removed, including any wording which indicates the LPA is unable to
    scale from the plans
  level: must
- item: Where an Ordnance Survey based plan is used, the copyright and licence number shown
  level: must
- item: Not taken from the Cornwall Council mapping web pages
  level: must
- item: 'Parking and access: how access will be provided, how safe access and egress will be achieved
    and how reasonable parking demands are met within the site (can be shown on the proposed site or block
    plan)'
  level: must
  required-if:
    any:
    - condition:
        field: parking-change
        value: true
        description: The development reduces the available parking or turning space, or increases the
          demand for parking.
    - condition:
        field: new-vehicle-access
        value: true
        description: The development changes access arrangements.
  source-text: Required where the proposed development reduces the available parking or turning space(s),
    changes access arrangements or increases the demand for parking.
- item: Finished floor levels relative to a fixed and identifiable datum point shown on the plan (not
    taken from structures to be demolished or that can be moved); can be on the site layout or block plan
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New buildings or floor space, except extensions to existing buildings.
  source-text: All new buildings or floor space except extensions to existing buildings.
- item: Existing and proposed site levels (can be shown on the existing and proposed site layout plan)
  level: must
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: New buildings or floor space (not extensions to existing buildings).
    - condition:
        field: earthworks
        value: true
        description: Groundworks such as access tracks or hard surfaced areas.
  source-text: Any proposal involving new buildings or floor space and any groundworks e.g. access tracks,
    hard surfaced areas etc. Not required for extensions to existing buildings or where no other groundworks
    are proposed.
- item: 'Advertisements: the proposed advertisement''s dimensions and position on the land or building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Plans provided for both existing and proposed to show the proposed advertisement dimensions
    and position on the land or building in question.
confidence: medium
notes: 'From the council''s list (adopted, version 1.7 of 10 April 2024), pages 13, 51, 108, 112, 220,
  228, 233, 264. The guide calls this the ''Block Plan (existing and proposed)''. For full minor applications
  on a vacant site with no buildings, the existing block plan is not needed but ''a site plan may be required''
  (page 51). Listed building consent: block plan for all requests except proposals to change windows and
  doors only (page 233). Finished floor levels and site levels are separate national requirements in the
  guide that can be shown on the block or site layout plan, so they are items here.'
review-status: unverified
field-status: {}
