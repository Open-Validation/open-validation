reference: heritage-statement
local-authority: CON
required-if:
  any:
  - site:
      in:
      - listed-building
      - scheduled-monument
      - conservation-area
      - world-heritage-site
      description: Directly affects a heritage asset (e.g. listed building or scheduled monument) or the
        setting of designated heritage assets (listed buildings, conservation area, World Heritage Site).
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - locally-listed-building
        description: Affects a non-designated heritage asset.
    - discretionary
source-url: https://www.cornwall.gov.uk/media/wadiaqe0/validation-guide-17-web.pdf
policy: National Planning Policy Framework (paragraphs 194 and 200 of the 2021 NPPF)
source-text: 'All applications directly affecting a heritage asset (e.g. Listed Building or Scheduled
  Monument) or the setting of designated heritage assets (e.g. listed buildings, Conservation Area, World
  Heritage Site). Applications affecting non-designated heritage assets may, in some circumstances, also
  require a HIA. By “affecting a heritage asset”, this may involve change including loss of, or alteration
  to fabric which has the potential to affect character or significance. This may include, for example:
  repair, restoration, alteration or addition (singly or in combination).'
must-include:
- item: Considers and describes the heritage asset, meets NPPF (2021) paragraph 194 and shows the asset
    has been assessed and understood using best practice methods
  level: must
- item: If part of the Design and Access Statement, clearly labelled
  level: must
  source-text: However, if included within the Design and Access Statement it should be clearly labelled.
confidence: medium
notes: From the council's list (adopted, version 1.7 of 10 April 2024), pages 19, 20, 64, 119, 120, 238,
  266. Required for all listed building consents (page 238). For non-designated heritage assets the list
  says a heritage impact assessment 'may, in some circumstances' be required, so that part is discretionary.
  The council publishes a Heritage Assessment template.
review-status: unverified
field-status: {}
