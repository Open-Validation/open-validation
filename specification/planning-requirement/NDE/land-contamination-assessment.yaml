reference: land-contamination-assessment
local-authority: NDE
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the site is in the vicinity of such land and
        ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive or vulnerable end user, such as allotments, residential development (including
        residential rural building conversions), schools or hospitals.
source-url: https://www.northdevon.gov.uk/media/382034/local-list-november-2022.pdf
source-text: checklist 7) Contaminated Land Assessment When is this required? • • where contamination
  is known or suspected, or the development site is in the vicinity of such land and ground works are
  proposed; and there is a sensitive or vulnerable end user, such as allotments, residential development,
  including residential rural building conversions, schools or hospital.
