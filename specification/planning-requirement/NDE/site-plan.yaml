reference: site-plan
local-authority: NDE
required-if:
  condition:
    field: footprint-increase
    value: true
    description: The proposal will alter an existing building/structure footprint or create a new one.
source-url: https://www.northdevon.gov.uk/media/382034/local-list-november-2022.pdf
source-text: validation checklist Block Plan based on an up-to date map, at a scale of 1:500 or Site Plan
  at 1:200 (if the proposal will alter an existing building/ structure footprint or create a new building/structure
  footprint).
must-include:
- item: Block plan at 1:500 or site plan at 1:200, based on an up-to-date map
  level: must
- item: The proposed development within the context of existing
  level: must
- item: Any existing or proposed vehicle parking spaces and areas
  level: must
- item: The species, position and spread of all trees on the site, and those on adjacent land that overhang
    the site
  level: must
- item: A north point
  level: must
- item: The scale used, a scale bar and one significant measurement
  level: must
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Contents are from
