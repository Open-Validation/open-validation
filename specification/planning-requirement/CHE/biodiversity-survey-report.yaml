reference: biodiversity-survey-report
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - approval-condition
        - mineral-app
        - mineral-extraction
        - waste-dev
    - any:
      - ref: major-development
      - site:
          in:
          - priority-habitat
          description: Affects semi-natural habitats.
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: Affects a designated site (SSSIs, Local Wildlife Sites etc.).
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: Affects a designated site (SSSIs, Local Wildlife Sites etc.).
      - discretionary
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SE3 and SE6; Site Allocations and Development Policies
  Document (SADPD) policy ENV 2
source-text: 'Ecological and Geodiversity Assessments when: • Proposal is for major development and /
  or developments affecting semi-natural habitats • The development affects any of the designated sites
  (SSSI’s, Local Wildlife sites etc) • The application involves any of the types of development identified
  in Table PART I of the ‘Guidance on Local Requirements: Biodiversity and Geodiversity Conservation Statement’'
must-include:
- item: Potential impact on protected species, ecology/biodiversity and geodiversity
  level: must
confidence: medium
notes: 'From the council''s list (adopted 11 March 2024), VC1 page 4; VC2 page 3; VC3 page 6. Development
  types in Table PART I of the council''s separate ''Guidance on Local Requirements: Biodiversity and
  Geodiversity Conservation Statement'' (not part of the list) show as discretionary. Application types
  follow the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.'
review-status: unverified
field-status: {}
