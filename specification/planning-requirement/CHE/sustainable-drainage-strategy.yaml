reference: sustainable-drainage-strategy
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Site Allocations and Development Policies Document (SADPD) policies ENV7 and ENV16
source-text: 'SUDS Drainage Design for: • All major developments'
must-include:
- item: How foul and surface water flows from the development will be controlled and managed
  level: must
- item: 'Minerals and waste: foul and surface water arrangements with capacity for the development and
    climate change; surface water run-off up to the 1 in 100 year plus climate change storm not exceeding
    undeveloped run-off; no impact on neighbouring land; SuDS unless percolation tests show soakaways
    work'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
- item: 'Minerals and waste disposing of trade waste or foul effluent: a detailed foul drainage assessment
    with storage, treatment and disposal and scale plans'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - condition:
        field: non-mains-drainage
        value: true
        description: Disposal of trade waste or foul sewage effluent.
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 7; VC3 page 8; VC4 page 8. Not in the
  matrix; VC1 lists it for all major development, and VC3/VC4 for all minerals and waste development.
review-status: unverified
field-status: {}
