reference: lighting-assessment
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - approval-condition
    - any:
      - all:
        - ref: major-development
        - condition:
            field: external-lighting
            value: true
            description: External lighting is proposed.
      - condition:
          field: floodlighting
          value: true
          description: Facilities for outdoor sports and recreation where external lighting is proposed.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policy SE12; Site Allocations and Development Policies Document
  (SADPD) policy ENV14
source-text: 'Lighting Scheme (including spillage / contour details) for: • All major developments where
  external lighting is proposed • Facilities for outdoor sports and recreation where external lighting
  is proposed'
must-include:
- item: Impact on adjoining property, the natural environment and night sky, with light spill, glare and
    contour analysis
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 6; VC3 page 8. Application types follow
  the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
