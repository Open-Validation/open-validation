reference: design-and-access-statement
local-authority: CHE
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: involves-change-of-use
        value: false
        description: Not solely a change of use of land and buildings or engineering/mining operations.
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: For all major applications (10 or more dwellings or where the floor space to be built is
  1,000 square metres or more or where the site area is 1 hectare or more) unless solely a change of use
  of land and buildings or engineering/mining operations  Development in a Conservation Area of one or
  more dwelling houses or provision of a building or buildings with a floor space of 100 square metres
  or more  Is a Listed Building
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 2; VC2 page 2. The householder checklist
  asks for one in a Conservation Area where the floor space is 100 sq m or more, or for a listed building
  (listed building consent).
review-status: unverified
field-status: {}
