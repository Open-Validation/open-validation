reference: recreation-facilities-assessment
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of existing open space or leisure and recreation facilities, unless replaced
          by equivalent or better provision.
    - condition:
        field: loss-of-use
        value: true
        description: Loss of existing indoor sports and recreation facilities, unless alternative provision
          of equivalent or better quality is made.
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 200
        description: Large scale major residential development (200 residential units or more, as the
          list defines it for health impact assessments).
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SC1, SC2, SC3 and SD1; Site Allocations and Development
  Policies Document (SADPD) policy REC 2
source-text: Proposals involving the loss of existing leisure and recreation facilities unless alternative
  provision of equivalent or better quality is to be made ... The proposal is for major residential development
  • The development will result in the loss of Open Space unless it is to be replaced by equivalent or
  better open space in terms of quantity and quality ... All large scale major residential developments
  • For proposals involving the loss of existing indoor sports and recreation facilities unless alternative
  provision of equivalent or better quality is to be made
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 6; VC1 page 6; VC1 page 7. Combines the
  list's Leisure/Recreation Facilities Needs Assessment, Public Open Space Statement and Sports Needs
  Assessment. 'Large scale major' uses the list's own 200-unit definition. Application types follow the
  checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
