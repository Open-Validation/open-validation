reference: affordable-housing-statement
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: rural-exception-housing
        value: true
        description: Affordable rural exceptions housing.
    - all:
      - condition:
          field: settlement-type
          value: principal-town-or-key-service-centre
          description: In the Principal Towns and Key Service Centres.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 15
            description: 15 or more units.
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.4
            description: 0.4 hectares.
    - all:
      - condition:
          field: settlement-type
          value: local-service-centre-or-other
          description: In Local Service Centres and all other locations.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 11
            description: 11 or more units.
        - condition:
            field: housing-floorspace
            operator: '>'
            value: 1000
            description: A maximum combined gross floorspace of more than 1,000 sq m.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SC5 and SC6
source-text: 'Affordable Housing Statement where: • The proposal is for affordable rural exceptions housing
  or; • The proposal is for development of 15 or more units (or 0.4 hectares) in the Principal Towns and
  Key Service Centres • The proposal is for development of 11 or more units (or has a maximum combined
  gross floorspace of more than 1,000 sq.m) in Local Service Centres and all other locations'
must-include:
- item: Site plan showing the number of residential units and the mix of housing type (affordable, low-cost,
    market) and tenure split
  level: must
  source-text: A statement including a site plan showing the number of residential units and the mix of
    housing type, for example, affordable housing, low-cost housing and any market housing and tenure
    split.
- item: 'For each unit: number of bedrooms and floor space of habitable areas, in line with NDSS'
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 3; Guidance page 10. Application types
  follow the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
