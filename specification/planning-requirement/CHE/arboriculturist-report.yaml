reference: arboriculturist-report
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - approval-condition
      - mineral-app
      - mineral-extraction
      - waste-dev
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: A tree on the site subject to a Tree Preservation Order.
    - site:
        in:
        - conservation-area
        description: The site is within a Conservation Area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The stem of any tree is within 15 metres of any proposed development.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policy SE5; Site Allocations and Development Policies Document
  (SADPD) policy ENV 6; BS5837:2012
source-text: 'Tree Survey/Arboricultural Implications - An arboricultural statement is required (in accordance
  with the latest requirements BS5837:2012) where: • There is a tree(s) on the site subject to a Tree
  Preservation Order (TPO) • The site is within a Conservation Area • If the stem of any tree is within
  15 metres of any proposed development'
must-include:
- item: Tree survey to BS5837:2012 showing how the development will affect existing and proposed trees
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 7; VC2 page 3. Application types follow
  the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
