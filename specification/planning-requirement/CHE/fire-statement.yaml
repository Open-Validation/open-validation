reference: fire-statement
local-authority: CHE
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: For proposals containing two or more dwellings or educational accommodation and exceeding
  18 metres or more in height, or 7 or more storeys
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 3.
review-status: unverified
field-status: {}
