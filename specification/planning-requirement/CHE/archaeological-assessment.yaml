reference: archaeological-assessment
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - approval-condition
    - condition:
        field: ground-disturbance
        value: true
        description: New building or ground disturbance.
    - site:
        in:
        - scheduled-monument
        - archaeological-priority-area
        - historic-environment-record
        description: On or adjoining a heritage asset of archaeological interest, a scheduled monument,
          an archaeological site of national importance or an area of archaeological interest.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - any:
      - condition:
          field: ground-disturbance
          value: true
          description: New areas of extraction or other ground disturbance.
      - site:
          in:
          - scheduled-monument
          - archaeological-priority-area
          - historic-environment-record
          description: On or adjoining a heritage asset of archaeological interest, a scheduled monument,
            an archaeological site of national importance or an area of archaeological interest.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD2 and SE7; Site Allocations and Development Policies
  Document (SADPD) policy HER 8
source-text: Any proposed development includes new building or ground disturbance on or adjoining a heritage
  asset of archaeological interest, a scheduled monument, archaeological site of national importance,
  or area of archaeological interest.
must-include:
- item: Desk-based assessment and/or field evaluation in line with the NPPF, establishing what further
    pre-determination work is needed
  level: must
- item: 'For field evaluation: a written scheme of investigation'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted 11 March 2024), VC1 page 3; VC3 page 4. Minerals and waste:
  required for all development involving extraction or ground disturbance. Application types follow the
  checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.'
review-status: unverified
field-status: {}
