reference: viability-assessment
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant says they can't provide the full range of planning obligations/S106 requirements
        (including affordable housing) because of viability.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies IN2, SC5 and SC6; Site Allocations and Development
  Policies Document (SADPD) policy GEN 7
source-text: An applicant is proposing that they cannot provide the full range of Planning Obligations
  / Section 106 requirements (including affordable housing) due to financial viability issues
must-include:
- item: Open book, in a form that can be put in the public domain, in line with national guidance
  level: must
- item: The applicant bears the cost of an independent review
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 7. Application types follow the checklist
  matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
