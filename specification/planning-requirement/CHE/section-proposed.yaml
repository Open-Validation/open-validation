reference: section-proposed
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - mineral-app
        - mineral-extraction
        - waste-dev
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: The proposal changes ground levels, or the site slopes.
      - condition:
          field: new-build
          value: true
          description: The application involves new buildings.
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed site sections and finished floor and site levels to a scale of 1:50
  or 1:100: • Where a proposal involves a change in ground levels, illustrative drawings should be submitted
  to show both existing and finished floor levels to include details of foundations and eaves. • For applications
  involving new buildings, information to demonstrate how proposed buildings relate to existing site levels
  and neighbouring development • In the case of a sloping site, show how proposals relate to existing
  ground levels or where ground levels outside the new development would be modified'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: 'Where ground levels change: existing and finished floor levels, with foundations and eaves'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Ground levels change.
- item: 'New buildings: how they relate to existing site levels and neighbouring development'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New buildings.
- item: 'Sloping sites: how the proposals relate to existing ground levels, or where levels outside the
    development would be modified'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The site slopes.
- item: 'Minerals and waste: cross sections showing existing and final restoration levels (and intermediate
    pre-settlement levels for waste); maximum depth of excavation, winter water table and quarry faces;
    representative sections and borehole diagrams distinguishing topsoil, subsoil and overburden (or fill,
    capping and restoration thickness for waste); typical profiles and gradients of mounds'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 2; VC3 page 2; VC4 page 2. Minerals and
  waste applications always need sections and profiles.
review-status: unverified
field-status: {}
