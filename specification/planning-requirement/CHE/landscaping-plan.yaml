reference: landscaping-plan
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - ref: major-development
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD2, SE4 and SE6
source-text: 'Landscape Scheme (and Management Plan as appropriate) for: • All major development'
must-include:
- item: In accordance with the council's checklist for landscape schemes
  level: must
  source-text: Landscape plans and documents must in accordance with the CEC checklist for
- item: 'Minerals and waste: existing landscape features to be retained and proposed planting (size and
    species), and how planting will be protected and maintained'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 6; VC3 page 7. Other developments may
  also need one because of their type, size, scale or location (e.g. replacement or new dwellings, commercial,
  leisure, retail), shown as discretionary. Application types follow the checklist matrix (Guidance Appendix
  01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
