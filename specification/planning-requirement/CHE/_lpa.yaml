  date-basis: 'Council''s Local validation checklists page (https://www.cheshireeast.gov.uk/planning/planning-validation-checklists.aspx,
    ''Page last reviewed: 31 December 2024'', read 2026-11-06): ''The checklists and guidance documents
    were consulted on in February and March of 2024 and subsequently approved for adoption by the Council''s
    Environment and Communities Committee at their meeting of 11 March 2024.'' Checklist footers read
    ''Validation Checklist_VC1_February 2024''; the PDFs were re-uploaded 20-31 December 2024 (file names
    still say ''draft'' for VC1). The page links only these five 2024 documents (VC1 general, VC2 householder,
    VC3 minerals, VC4 waste and the guidance with the checklist matrix), and no newer list or consultation
    was found. planning.data.gov.uk still records the superseded 2018 draft. Adopted more than two years
    ago, so outdated.'
  status: outdated
submission-standards:
- item: 'Paper submissions: 1 original copy of each document and plan'
  level: must
- item: Electronic documents in PDF or Microsoft Word format, unsecured so that sensitive information
    can be redacted
  level: must
- item: Each file clearly labelled with its content, e.g. 'Site Location Plan - 123 Rev A pdf'
  level: must
- item: File size no more than the portal upload limit (10MB); no CDs or memory sticks (contact the council
    for larger files)
  level: must
- item: Limit personal information outside the application form; provide a redacted copy where personal
    details are included
  level: should
- item: Detailed drawings include a scale bar where appropriate
  level: should
- item: Plans clear, legible and accurate, to a recognisable metric scale and good enough to scan and
    display electronically
  level: must
- item: Hand-drawn plans only if drawn competently; no graph paper, background images or watermarks
  level: must
- item: 'Householder: existing and proposed elevations side by side at the same scale where possible'
  level: should
- item: Where a local checklist item is not provided, a written justification by a suitably qualified
    person
  level: must
