reference: planning-statement
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: NPPF; Cheshire East Statement of Community Involvement
source-text: Planning Statement including Statement of Community Involvement • All major development and
  major change of use applications
must-include:
- item: How the development accords with the Development Plan, SPDs and guidance, the NPPF and PPG
  level: must
- item: Details of pre-application consultation in line with the council's Statement of Community Involvement
  level: must
- item: 'Minerals: site description, designations and constraints; full description of the proposal (preliminary
    works, soils, phasing, mineral type and quantity, working practices and depths, water table and dewatering,
    stockpiles, transport, boundary treatment and mitigation, backfilling, restoration, imported materials,
    processing, drainage, community access); need and landbank contribution; geology and topography; why
    allocations can''t be developed; summaries of technical reports; cumulative effects'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
- item: 'Waste: description of the development and site (access, layout, existing uses, designations and
    constraints, environmental impacts); need, with reference to the waste hierarchy; site capacity, material
    origin and type, void space, fill rates, settlement and compaction; for variations, a summary of the
    changes and why; pre-application discussions; summary of reports'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 6; VC3 page 9; VC4 page 9. Includes the
  Statement of Community Involvement. All minerals and waste development needs one. Application types
  follow the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
