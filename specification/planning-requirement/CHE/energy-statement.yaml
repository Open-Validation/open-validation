reference: energy-statement
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Non-residential development comprising over 1,000 square metres.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD1, SE1 and SE8; Site Allocations and Development
  Policies Document (SADPD) policy ENV 7
source-text: 'Energy / Sustainability Statement for: • All major residential development • All non-residential
  development comprising over 1,000 square metres'
must-include:
- item: How the proposal meets energy efficiency and decentralised, renewable and/or low carbon energy
    standards
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 5. The minerals and waste climate change
  statement is in sustainability-statement. Application types follow the checklist matrix (Guidance Appendix
  01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
