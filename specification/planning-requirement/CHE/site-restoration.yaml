reference: site-restoration
local-authority: CHE
required-if:
  application-type:
    in:
    - mineral-app
    - mineral-extraction
    - waste-dev
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc3-minerals-validation-checklist-2024.pdf
policy: Cheshire Replacement Minerals Local Plan policy 41; Cheshire Replacement Waste Local Plan policy
  32; Cheshire East Local Plan Strategy policy SE10
source-text: 'Where not provided as part of other requirements listed in this validation checklist: •
  The scheme should demonstrate how the site is proposed to be restored.'
must-include:
- item: 'Restoration and aftercare plans: final contours on restoration (with gradients) extended at least
    250m outside the site; cross sections of restored areas; replacement soil depths; permanent water
    features and their marginal treatment; drainage on restoration; landscape restoration and planting
    proposals, habitats and public access'
  level: must
- item: 'Scheme: infill material type, sources and volumes, working methods, end use and the reason for
    it'
  level: must
- item: 'Where existing agricultural land is disturbed: soil resources, Agricultural Land Classification
    and intended restored grade'
  level: must
  required-if:
    condition:
      field: agricultural-land
      value: true
      description: The proposal disturbs existing agricultural land.
- item: Soil handling strategy (stripping, storage, replacement, plant and machinery)
  level: should
- item: Topographical survey of pre-development and proposed contours
  level: must
- item: Phasing plan showing progressive restoration
  level: must
  required-if: discretionary
- item: Plan for maintaining and monitoring the site for 5 years after final restoration
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC3 page 2; VC3 page 8; VC4 page 8. Same wording
  in the waste checklist (VC4).
review-status: unverified
field-status: {}
