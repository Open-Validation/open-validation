source-text: 'Location Plan at a scale of 1:1250 or 1:2500 for all Prior Approval Applications to show:
  • The direction of North • Application site edged red/other land owned by the applicant edged blue •
  Wherever possible, at least 2 named roads and surrounding buildings'
must-include:
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: The direction of North
  level: must
- item: Application site edged red (to the lawful planning unit/curtilage) and other land owned by the
    applicant edged blue
  level: must
- item: Wherever possible, at least 2 named roads and surrounding buildings
  level: should
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 1; Guidance page 7. A national requirement
  in every checklist; VC1 adds it as a local requirement for all prior approval applications. Application
  types follow the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
