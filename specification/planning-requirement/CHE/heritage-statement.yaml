reference: heritage-statement
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - approval-condition
        - demolition-con-area
        - lbc
        - mineral-app
        - mineral-extraction
        - waste-dev
    - any:
      - site:
          in:
          - conservation-area
          - listed-building
          - locally-listed-building
          - scheduled-monument
          - park-and-garden
          - battlefield
          description: Works in Conservation Areas, listed buildings and structures, locally listed buildings,
            scheduled monuments, historic parks and gardens and historic battlefields.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - conservation-area
          - listed-building
          - locally-listed-building
          - scheduled-monument
          - park-and-garden
          - battlefield
          - listed-building-setting
          description: Works in or in proximity to Conservation Areas, listed buildings and structures,
            locally listed buildings, scheduled monuments, historic parks and gardens and historic battlefields.
      - discretionary
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD2 and SE7
source-text: The development affects a designated or non-designated heritage asset or its setting • Includes
  works in Conservation Areas, listed buildings and structures, locally listed buildings, scheduled monuments,
  historic parks and gardens and historic battlefields
must-include:
- item: Significance of any heritage assets affected, including the contribution of their setting, proportionate
    to their importance
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 5; VC2 page 3. Non-designated heritage
  assets show as discretionary. Application types follow the checklist matrix (Guidance Appendix 01) plus
  the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
