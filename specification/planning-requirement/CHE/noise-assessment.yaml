reference: noise-assessment
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - approval-condition
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A residential use adjacent to an E(b), B2 or B8 use, a railway line, a busy road
            (motorway, dual carriageway, A road) or licensed premises/entertainment, or noise-sensitive
            development under the Manchester Airport flight path or in the Aviation Noise Contour Area.
      - condition:
          field: air-source-heat-pump
          value: true
          description: Air source heat pumps.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: air-source-heat-pump
        value: true
        description: An air source heat pump is proposed.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Likely to generate significant noise above background levels.
      - condition:
          field: hcv-movements
          value: true
          description: Regular movements of larger vehicles.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policy SE12; Site Allocations and Development Policies Document
  (SADPD) policy ENV 13
source-text: 'Where the proposal will result in a residential use adjacent to: • A use falling within
  Use Class E(b), B2 or B8 • A railway line • A busy road (motorway, dual carriageway and ‘A’ Roads) •
  A licensed premises or entertainment source • Noise sensitive development located under the flight path
  for Manchester Airport or within the Aviation Noise Contour Area • Air source heat pumps'
must-include:
- item: 'Usually informed by a site-specific noise survey: impact of the development on the existing environment
    and/or of existing uses on its occupiers, with mitigation'
  level: should
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 6; VC2 page 3; VC3 page 8. Application
  types follow the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
