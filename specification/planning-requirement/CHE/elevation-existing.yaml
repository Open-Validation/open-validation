reference: elevation-existing
local-authority: CHE
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Associated built development (buildings, extensions or alterations).
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and Proposed Elevations at a scale of 1:50 or 1:100 to show: • The works in relation
  to what is already there • All sides of the proposal (blank elevations should also be included)'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: All sides, including blank elevations
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 2. Only where there is an existing building;
  for minerals and waste only for associated built development.
review-status: unverified
field-status: {}
