reference: waste-management-plan
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more dwellings.
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD1, SD2 and SE11
source-text: 'Site Waste Management Plan when: • The development is for 50 or more dwellings'
must-include:
- item: Location of bin stores, enclosure materials, design and type, and proximity to the collection
    point
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 7; Guidance page 15. Application types
  follow the checklist matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
