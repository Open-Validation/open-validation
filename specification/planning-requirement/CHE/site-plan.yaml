reference: site-plan
local-authority: CHE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - mineral-app
    - mineral-extraction
    - waste-dev
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 1 original copy of all plans (unless submitted electronically) and drawings necessary to
  describe the subject of the application.
must-include:
- item: Site plan at 1:500 or 1:200 showing the direction of North
  level: must
- item: The development in relation to site boundaries and existing buildings on the site, with written
    dimensions
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: Position of all trees on the site and on adjacent land that could be affected by the development
  level: must
- item: Extent of any hard surfacing, and boundary treatment where proposed
  level: must
- item: Block plan at 1:100 or 1:200 showing site boundaries, buildings or structures on the other side
    of them, and the type and height of boundary treatment
  level: must
- item: 'Minerals and waste: trees to be retained and lost; weighbridges, wheel cleaning equipment and
    maximum stockpile extent; watercourses, culverts, ditches and ponds (with flow direction); underground
    services and overhead lines; existing contours within the site and at least 250m outside; areas of
    current/previous mineral working or waste disposal and land susceptible to subsidence; trial pits
    and boreholes; features of archaeological interest'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 1; VC3 page 1; VC4 page 1. For minerals
  and waste, the block plan is only for associated built development. Application types follow the checklist
  matrix (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
