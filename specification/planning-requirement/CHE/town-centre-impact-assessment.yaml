reference: town-centre-impact-assessment
local-authority: CHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Retail and leisure uses in edge-of-centre or out-of-centre locations.
      - discretionary
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Site Allocations and Development Policies Document (SADPD) policy RET 3
source-text: Retail and leisure uses in edge-of centre or out-of-centre locations, exceeding the floorspace
  thresholds set out in SADPD Policy RET 3, (including proposals to extend or vary the range of goods
  permitted to be sold for E(a) retail stores)
must-include:
- item: Sequential and impact tests, showing whether the impact on existing town and local centres' vitality
    and viability is significantly adverse
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 6. The floorspace thresholds are in SADPD
  policy RET 3, not in the list, so the size test shows as discretionary. Includes proposals to extend
  or vary the range of goods sold from E(a) retail stores. Application types follow the checklist matrix
  (Guidance Appendix 01) plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
