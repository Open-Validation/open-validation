reference: sustainability-statement
local-authority: CHE
required-if:
  application-type:
    in:
    - mineral-app
    - mineral-extraction
    - waste-dev
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc3-minerals-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD1, SE1 and SE8
source-text: 'The extent of information required to be submitted within this statement will be proportionate
  to the scale of the proposed development. It should provide information to demonstrate that:'
must-include:
- item: Energy management and resource efficiency as determining design factors, with a carbon reduction
    strategy or reduced whole-life greenhouse gas emissions
  level: must
- item: Water use and wastewater treatment minimised (e.g. SuDS)
  level: must
- item: The waste hierarchy applied at its highest level
  level: must
- item: Energy-conserving design of any on-site buildings
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: Associated built development (buildings, extensions or alterations).
- item: Location minimising road miles, including non-road transport
  level: must
- item: 'Where affecting or next to peat bog: carbon emissions not significantly increased and the bog
    not harmed'
  level: must
  required-if: discretionary
- item: Restoration and after use helping to mitigate or adapt to climate change (BNG, green/blue infrastructure)
  level: must
- item: Opportunities for renewable and low carbon energy considered and incorporated
  level: must
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC3 page 5; VC4 page 5. Minerals (VC3) and waste
  (VC4) checklists, same wording.
review-status: unverified
field-status: {}
