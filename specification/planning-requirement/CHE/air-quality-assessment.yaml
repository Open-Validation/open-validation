reference: air-quality-assessment
local-authority: CHE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - air-quality-management-area
          description: Within an Air Quality Management Area or within 500 metres of one.
      - condition:
          field: convenience-retail-floorspace
          operator: '>'
          value: 1000
          description: Food retail development over 0.2 ha (1,000 sq m gross floor space).
      - condition:
          field: office-floorspace
          operator: '>'
          value: 2500
          description: Office development over 0.8 ha (2,500 sq m gross floor space).
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1.0
          description: Housing development over 1.0 ha.
      - condition:
          field: dwelling-count
          operator: '>'
          value: 80
          description: Housing development over 80 units.
      - condition:
          field: traffic-movements-peak-hour
          operator: '>'
          value: 60
          description: An increase of more than 60 vehicle movements per hour.
      - condition:
          field: parking-spaces
          operator: '>'
          value: 300
          description: Significantly increasing car parking provision (more than 300 spaces).
      - condition:
          field: biomass-or-chp
          value: true
          description: Biomass or CHP.
      - condition:
          field: direct-air-emissions
          value: true
          description: Industrial installation.
      - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - any:
      - site:
          in:
          - air-quality-management-area
          description: Within an Air Quality Management Area or within 500 metres of one.
      - condition:
          field: traffic-movements-peak-hour
          operator: '>'
          value: 60
          description: An increase of more than 60 vehicle movements per hour.
      - condition:
          field: parking-spaces
          operator: '>'
          value: 300
          description: More than 300 parking spaces.
      - condition:
          field: biomass-or-chp
          value: true
          description: Biomass or CHP.
      - condition:
          field: direct-air-emissions
          value: true
          description: Industrial installation.
      - discretionary
source-url: https://www.cheshireeast.gov.uk/pdf/planning/validation-checklists/vc1-draft-general-validation-checklist-2024.pdf
policy: Cheshire East Local Plan Strategy policies SD2 and SE12; Site Allocations and Development Policies
  Document (SADPD) policy ENV 12
source-text: 'Air Quality Assessment for: • any development within Air Quality Management Areas (AQMA)
  or within 500 metres • food retail development >0.2HA (1000m2 gross floor space) • office development
  >0.8Ha (2500m2 gross floor space) • housing development >1.0 Ha or >80 units • development likely to
  lead to an increase of >60 vehicle movements per hour • development likely to result in increased traffic,
  congestion, or changes to vehicle speeds (new junctions, roundabouts etc) • development likely to significantly
  change the traffic composition • development significantly increasing car parking provision (>300 spaces
  or 25% increase) • development in close proximity (<100m) to busy roads / junctions • development likely
  to result in a significant change in air quality, or development of residential properties in an area
  of already poor air quality. • poultry establishments > 400,000 birds (mechanical ventilation) or 200,000
  (natural ventilation) or > 100,00 (Turkeys) and with relevant exposure within 100m of the unit. • biomass
  / CHP / Industrial Installation (see guidance under the biomass and clean air act pages)'
must-include:
- item: The change in air quality resulting from the development, and appropriate mitigation
  level: must
  source-text: All Air Quality Assessments should indicate the change in air quality resulting from the
    proposed development and outline appropriate mitigation measures as necessary.
confidence: medium
notes: From the council's list (adopted 11 March 2024), VC1 page 3; VC3 page 4. Traffic, congestion or
  speed changes, significant changes in traffic composition, a 25% parking increase, development within
  100m of busy roads, significant air quality change or homes in areas of poor air quality, and large
  poultry units (400,000/200,000/100,000 birds with exposure within 100m) are shown as discretionary because
  our fields can't express them. Application types follow the checklist matrix (Guidance Appendix 01)
  plus the minerals (VC3) and waste (VC4) checklists.
review-status: unverified
field-status: {}
