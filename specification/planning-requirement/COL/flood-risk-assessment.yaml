reference: flood-risk-assessment
local-authority: COL
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: In Flood Zone 1, on a site of more than 1 hectare.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: In Flood Zone 1, on a site of more than 1 hectare.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies DM23 and DM24; NPPF
source-text: Any application in Flood Zone 1 on a site of more than 1 hectare. All new development within
  Flood Zone 2 and 3.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including sustainable drainage systems (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 13. Listed as 'Flood Risk Assessment (FRA)'.
review-status: unverified
field-status: {}
