reference: air-quality-assessment
local-authority: COL
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: The site is in an Air Quality Management Area.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more homes in the Air Quality Action Plan area.
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: 500 square metres or more in the Air Quality Action Plan area.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
confidence: low
notes: 'From the audit (missing_requirement): ''AQMA; 10+ homes or 500 sqm in the AQAP area''. The rules
  have no field for the Air Quality Action Plan area, so the size thresholds are shown without it; check
  the list.'
review-status: unverified
field-status: {}
