reference: air-quality-assessment
local-authority: COL
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within a designated Air Quality Management Area.
  - discretionary
  - all:
    - site:
        in:
        - air-quality-action-plan-area
        description: Within the 'Air Quality Action Plan Area'.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more residential units.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 500
          description: 500 sq m or more of non-residential floorspace.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policy ENV5; Colchester Air Quality Action Plan
source-text: Any developments within the designated Air Quality Management Areas. Any application that
  generate additional traffic movements through an AQMA or introduces new receptors to the pollutants.
  Developments of 10 or more residential units or 500sqm of non-residential floorspace within the ‘Air
  Quality Action Plan Area’.
must-include:
- item: How a residential scheme (or other sensitive uses) will be accommodated in the area of significant
    air quality
  level: must
- item: Assessment methodology
  level: must
- item: Significance appraisal
  level: must
- item: Mitigation measures
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 9. Listed as 'Air Quality Impact Assessment'.
  The second trigger (applications that generate additional traffic through an AQMA or introduce new receptors)
  has no data field, so it shows as discretionary.
review-status: unverified
field-status: {}
