reference: location-plan
local-authority: COL
required-if:
  always: true
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications.
must-include:
- item: At a scale of 1:1250 or 1:2500, up to date, with the direction of north
  level: must
- item: At least two named roads, or an otherwise entirely clear location map that unmistakably identifies
    the exact boundaries of the site in relation to other navigable OS map features
  level: should
- item: All current surrounding buildings, roads and footpaths on land adjoining the site
  level: should
- item: A red line around all land required for the development
  level: should
- item: A blue line around all other land owned by the applicant close to or adjoining the site, in its
    entirety
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 5. The contents are introduced with 'Should
  include'.
review-status: unverified
field-status: {}
