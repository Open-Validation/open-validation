reference: archaeological-assessment
local-authority: COL
required-if:
  any:
  - site:
      in:
      - historic-environment-record
      description: On or affecting a known or possible archaeological site (Colchester Heritage Explorer
        / HER).
  - discretionary
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies ENV1 and DM16; NPPF Part 16
source-text: Applications which impact upon known or possible archaeological sites or where it is considered
  that there is good reason for remains to exist.
must-include:
- item: An assessment of the impact of the development, with any proposed mitigation measures
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 10. Listed as 'Archaeological Assessments'.
  'Where it is considered that there is good reason for remains to exist' is the council's judgement,
  so it shows as discretionary.
