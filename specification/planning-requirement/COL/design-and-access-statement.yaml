reference: design-and-access-statement
local-authority: COL
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a designated area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The proposal creates 100 square metres or more of floorspace.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
source-text: all Listed Building Consent applications
confidence: medium
notes: 'From the audit (wrong_app_type): required for all listed building consent applications and, including
  householder, in a designated area for 100 sqm or more.'
review-status: unverified
