reference: design-and-access-statement
local-authority: COL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (conservation area or World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 square metres or more of floorspace.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  Colchester Local Plan 2017-2033 policies DM12 and DM15
source-text: 'All major planning Applications Applications for one or more dwellinghouses in a designated
  area Applications for the provision of a building or buildings where the floor space created by the
  development is 100 square metres or more within a designated area All Listed Building Consent Applications
  ... Requirement applies unless the application is for: waste development, a change of use, engineering
  or mining operations or relates to an application to amend the conditions attached to a planning permission.'
must-include:
- item: The design principles and concepts applied to the amount of development proposed, its scale and
    the landscaping
  level: should
- item: How issues relating to access to the development have been dealt with, including lifetime homes
    and wheelchair accessible housing
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 6. Not needed for waste development, a change
  of use, engineering or mining operations, or an application to amend the conditions attached to a planning
  permission.
review-status: unverified
field-status: {}
