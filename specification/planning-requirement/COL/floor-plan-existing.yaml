reference: floor-plan-existing
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: The proposal creates new floorspace.
    - condition:
        field: floorspace-change
        value: true
        description: The proposal creates or amends floorspace.
    - condition:
        field: structural-alteration
        value: true
        description: The proposal alters an existing building.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications proposing new or amended floorspace and/or proposals to alter existing buildings
  (except outline applications).
must-include:
- item: At a scale of 1:50 or 1:100, with a scale bar or written dimensions showing the overall size of
    any new buildings or extensions
  level: must
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: must
- item: The layout of the existing building(s) as well as the proposed development
  level: must
- item: The entirety of any floor being altered
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 6. Listed as 'Floor Plans (Existing and Proposed)'.
  The list says all applications except outline; the types shown are the planning and listed building
  types it covers.
review-status: unverified
field-status: {}
