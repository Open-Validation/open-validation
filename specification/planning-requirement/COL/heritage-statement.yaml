reference: heritage-statement
local-authority: COL
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      description: Affects a designated heritage asset, or a non-designated asset such as a building on
        the Register of Buildings of Local Value.
  - discretionary
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policy DM16; NPPF Part 16
source-text: 'Applications which are likely to affect Pre-1900 structures including: - Designated heritage
  assets - Non designated heritage assets such as non- scheduled archaeological sites and Buildings on
  the Register of Buildings of Local Value - Applications for Listed Building Consent or demolition.'
must-include:
- item: A description of the asset and the aspect of it the proposal will affect
  level: must
- item: The importance and significance of the asset, evaluated, defined and assessed
  level: must
- item: Where relevant, photographs, phasing plans, historic photographs or drawings, historic maps and
    other relevant sources
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 14. The list asks for it for applications likely
  to affect pre-1900 structures, including non-scheduled archaeological sites. Whether a proposal affects
  such a structure has no data field, so that part shows as discretionary.
review-status: unverified
field-status: {}
