reference: transport-assessment
local-authority: COL
required-if:
  any:
  - ref: major-development
  - discretionary
  - all:
    - condition:
        field: staff-count
        operator: '>='
        value: 50
        description: 50 employees or more.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: A non-residential proposal.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: NPPF
source-text: All developments which are likely to generate significant amount of vehicle movement i.e.
  major ... developments. ... OR ... Any development likely to result ... in a material increase in the
  ... character of traffic entering the ... network. ... All non-residential proposals involving 50 employees
  or more
must-include:
- item: The existing conditions and development details
  level: should
- item: Predicted person trip generation and mode splits
  level: should
- item: Predicted residual vehicular trip generation based on proposed travel plan measures, and the distribution
    of residual vehicular trips
  level: should
- item: Junction capacity assessments and merge / diverge assessments at opening year and ten years after
    registration of application
  level: should
- item: Details of the proposed mitigation measures
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 20. Listed as 'Transport Assessment or Statement'.
  'Any development likely to result in a material increase in the character of traffic entering the network'
  is a judgement, so it shows as discretionary; ECC Highways advise on scope. The trigger column also
  lists 'All non-residential proposals involving 50 employees or more'. The contents are introduced with
  'are likely to include'.
review-status: unverified
field-status: {}
