      field: renewable-energy-development
      value: true
      description: Air source heat pumps, or solar photovoltaic or solar thermal panels.
  - condition:
      field: biomass-or-chp
      value: true
      description: Biomass plants, district / community heating and CHP plants.
  - condition:
      field: battery-energy-storage
      value: true
      description: Battery storage facilities.
