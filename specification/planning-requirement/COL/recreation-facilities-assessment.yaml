    field: loss-of-open-space
    value: true
    description: The proposal involves the loss of playing fields.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies DM2 and DM4
source-text: 'Where this involves the loss of playing fields then the criteria set out in Policy DM4 should
  be addressed in the Planning Statement including details should be provided of: - Alternative facilities
  to be created and their location - How the proposals comply with the Colchester Sports Facility Strategy
  - The existing provision in catchment and the net result on provision'
must-include:
- item: The criteria in policy DM4 addressed (in the Planning Statement)
  level: must
- item: Alternative facilities to be created and their location
  level: must
- item: How the proposals comply with the Colchester Sports Facility Strategy
  level: must
- item: The existing provision in the catchment and the net result on provision
  level: must
confidence: medium
notes: 'From the council''s list (published July 2024), page 12. From the ''Community Facilities Justification''
  row: for the loss of playing fields, these details go in the Planning Statement. The wider justification
  for the loss of any community facility has no matching id (see the unmapped list).'
