reference: roof-plan-existing
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - condition:
      field: roof-alteration
      value: true
      description: A roof would be created or altered by the proposed development.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/Validation_List_2017.pdf
source-text: Roof Plans Scale 1:100 or 1:200 with either written dimensions or a scale bar … Any application
  where a roof would be created or altered by the proposed development (except outline applications) Showing
  the shape of the roof, any roof features and details of the roofing materials and any features such
  as chimney positions or windows.
must-include:
- item: Scale 1:100 or 1:200, with written dimensions or a scale bar
  level: must
- item: The shape of the roof and any roof features
  level: must
- item: Details of the roofing materials and features such as chimney positions or windows
  level: must
confidence: low
notes: 'Audit (wrong_app_type): the workbook placed this under Outline, but outline applications are excluded
  ("Where a roof is created or altered (excludes outline)"). The rule can''t say "not outline", so it
  lists householder, full and reserved matters.'
review-status: unverified
field-status: {}
