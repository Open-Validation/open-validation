reference: roof-plan-proposed
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered.
    - condition:
        field: new-build
        value: true
        description: A new building (and so a new roof) is proposed.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
source-text: Any application where a roof would be created or altered by the proposed development (except
  outline applications).
must-include:
- item: At a scale of 1:100 or 1:200, with written dimensions or a scale bar
  level: must
- item: The shape of the roof, any roof features and the roofing materials
  level: must
- item: Features such as chimney positions, roof lights or dormer windows
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 7. Listed as 'Roof Plans'. Unlike the elevations
  and floor plans, the list does not ask for existing roof plans, so only the proposed roof plan is recorded.
review-status: unverified
field-status: {}
