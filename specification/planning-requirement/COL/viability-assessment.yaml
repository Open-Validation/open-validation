reference: viability-assessment
local-authority: COL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: No developer contributions, or a reduced level, are offered where policy requires
          them.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing policy is not met.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies SG7 and DM8; Essex Viability Protocol
source-text: Any major application (10 dwellings or more, over 1,000 square metres of non-residential
  floorspace, sites over 1Ha in size) where there are no developer contributions or a reduced level is
  being offered to mitigate the impact of the development where these are required in compliance with
  adopted policies and SPD’s.
must-include:
- item: An open book assessment of the viability of the proposal, made available for independent analysis
    by a consultant chosen by the council (at the applicant's cost)
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 8. Listed as 'Viability Statement'. The Affordable
  Housing Statement row (page 8) adds that if the affordable housing policy is not met, the application
  also needs a Viability Statement.
review-status: unverified
field-status: {}
