reference: land-contamination-assessment
local-authority: COL
required-if:
  any:
  - ref: major-development
  - condition:
      field: eia-development
      value: true
      description: Subject to the Environmental Impact Assessment regulations.
  - site:
      in:
      - contaminated-land
      description: Known contamination issues associated with the site (e.g. a former industrial use).
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policy ENV5; Environmental Protection Act 1990
source-text: Any major applications, applications subject to Environmental Impact Assessment regulations
  and small-scale extensions and development if there are known contamination issues associated with the
  site (e.g. If site had a former industrial use).
confidence: medium
notes: From the council's list (published July 2024), page 15. Applicants are advised to follow the 'Land
  Affected by Contamination' booklet and to speak to the Contaminated Land Officer.
review-status: unverified
field-status: {}
