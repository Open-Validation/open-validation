reference: lighting-assessment
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: floodlighting
      value: true
      description: External flood lighting is proposed.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policy DM15; NPPF
source-text: All applications, except householder proposals, where it is proposed to incorporate external
  flood lighting.
must-include:
- item: Proposed hours when the lighting would be switched on
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Schedule of the equipment in the design
  level: must
- item: Light levels and spillage
  level: must
- item: The size of the light fitting
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 16. Householder applications are excepted;
  the types shown are the other planning permission types.
review-status: unverified
field-status: {}
