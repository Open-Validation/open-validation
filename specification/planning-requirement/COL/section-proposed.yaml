reference: section-proposed
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels, is next to changing ground levels, or is a new
        building on a sloping site.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: Required for all applications (except outline) which involve a change in ground levels or
  where development is proposed next to changing ground levels. On all applications for new buildings
  on sloping sites.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: A cross section through the proposed site/building(s)
  level: must
- item: Where ground levels change, both existing and finished levels
  level: must
- item: Floor levels, building height and relationship to site boundaries
  level: must
- item: How proposed buildings relate to existing site levels and neighbouring development
  level: must
- item: Existing site levels and finished floor levels, related to a fixed datum point off site and to
    adjoining buildings
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 6. Listed as 'Site Sections (Existing and Proposed
  Finished Floor and Site Levels)'. The list adds that levels should also be taken into account in supporting
  statements, including Design and Access Statements.
review-status: unverified
field-status: {}
