reference: site-plan
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: building-works
      value: true
      description: The proposal extends a building (residential or non-residential) or creates new buildings.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications for extensions to buildings (both residential and non-residential) and for
  new buildings (except outline applications where siting and layout is a reserved matter).
must-include:
- item: At a scale of 1:200 or 1:500, with the direction of north and either a scale bar or written dimensions
  level: must
- item: All buildings, roads and footpaths on the site and immediately adjoining it
  level: should
- item: All site boundaries, with the type and height of boundary treatments (e.g. walls, fences, hedgerows)
  level: should
- item: All buildings adjacent to the site boundary, including neighbouring properties and their access
    arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site, and those visible on adjacent land that may have roots
    or canopy spread close to any built development proposed
  level: should
- item: The extent and type of any hard and soft surfacing
  level: should
- item: Any parking spaces
  level: should
- item: Existing trees shown on the block plan or drawings
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within or adjacent to the site that could influence or be affected
        by the development.
  source-text: Existing trees to be shown on BlockPlan / drawings
- item: The existing and proposed parking, cycle storage and access arrangements for vehicles and pedestrians
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: The proposal is likely to result in a loss or gain in parking provision.
  source-text: The existing and proposed parking and cycle storage and access arrangements for vehicles
    and pedestrians to be shown on the block/site plan.
confidence: medium
notes: From the council's list (published July 2024), page 5. Listed as 'Block Plan'. The general contents
  are introduced with 'Should include the following unless they would not influence or be affected by
  the proposed development'. Outline applications need one only where siting and layout are not reserved
  matters, so outline is in the list of types. The tree item comes from the 'Tree survey' row (page 21)
  and the parking item from the 'Parking and Access Arrangements' row (page 17), which also asks for a
  written justification of the parking proposed (see the unmapped list).
review-status: unverified
field-status: {}
