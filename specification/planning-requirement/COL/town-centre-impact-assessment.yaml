reference: town-centre-impact-assessment
local-authority: COL
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure developments over 2,500 square metres.
  - discretionary
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Other main town centre uses in an edge of centre or out of centre location.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the development plan.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies TC1, TC2, TC3, NC1, SG3, SG5 and SG6; NPPF
source-text: 'Applications for any of the following: 1) Retail and leisure developments over 2500 square
  metres. 2) Smaller retail and leisure likely to have a significant impact on smaller centres. 3) Applications
  for other main town centre uses when they are an edge of centre or out of centre location; and not in
  accordance with a development plan.'
must-include:
- item: Impact on existing, committed and planned public and private investment in centre(s) in the catchment
  level: must
- item: Impact on town centre vitality and viability, including consumer choice
  level: must
- item: Impact on allocated sites outside the town centre being developed in accordance with the development
    plan
  level: must
- item: Impact on trade/turnover both in the centre and the wider area
  level: must
- item: Any locally important impacts on centres
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 18. Listed as 'Retail or Leisure Impact Assessment'.
  Smaller retail and leisure schemes 'likely to have a significant impact on smaller centres' is a judgement,
  so it shows as discretionary.
review-status: unverified
field-status: {}
