reference: biodiversity-survey-report
local-authority: COL
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development involves an important habitat with protected species.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - national-nature-reserve
      - local-nature-reserve
      - local-wildlife-site
      description: On or affecting a site designated as important for nature conservation.
  - discretionary
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies ENV1 and CC1; Conservation of Habitats and Species Regulations
source-text: An ecological survey and assessment should ... be carried out. The proposed ... development
  may have a significant ... biodiversity impact, particularly where this ... involves an important habitat
  with protected ... species or sites designated as important for ... nature conservation. ... This includes
  refurbishment and ... conversion works which may impact species ... using the existing building including
  swifts or ... bats.
must-include:
- item: An assessment of the impact of the development on wildlife, with proposals for mitigation or compensation,
    including the protection of habitats and the provision of new habitats as part of a Biodiversity Net
    Gain strategy
  level: must
- item: An assessment of existing structures or potential natural habitats where they are to be removed
    or affected by the proposals
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 10. From the 'Biodiversity Net Gain, Survey
  and Reporting' row. The ecological survey is asked for where the development 'may have a significant
  biodiversity impact' (including refurbishment and conversion works that may affect bats or swifts),
  which is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
