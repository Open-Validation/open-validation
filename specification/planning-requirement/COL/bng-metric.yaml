notes: From the council's list (published July 2024), page 10. Listed under 'Biodiversity Net Gain, Survey
  and Reporting', which says 'All developers* must submit' a BNG statement, a habitat site plan, the metric,
  a draft BNG plan and a baseline assessment, or an Exemption Statement if exemption is claimed. In law
  only development subject to the biodiversity gain condition needs them (householder and other exempt
  applications are exempt), so the rule follows the law.
