reference: arboriculturist-report
local-authority: COL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are a number of trees on site which are proposed to be removed.
  - discretionary
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/Validation_List_2017.pdf
source-text: 'This should include: o Tree Survey o Tree Protection Plan o Arboricultural Method Statement
  (if development is taking place within the root protection area) c) Major applications where there are
  a number of trees on site which are proposed to be removed'
must-include:
- item: Tree Survey
  level: must
- item: Tree Protection Plan
  level: must
- item: Arboricultural Method Statement, if development is taking place within the root protection area
  level: must
confidence: low
notes: 'The 2017 excerpt gives only part c) of the trigger (major applications where a number of trees
  on site are proposed to be removed); the other cases are cut off and shown as officer discretion. From
  the audit (wrong_app_type): all applications, including householder, must show trees and answer question
  15 of the application form.'
review-status: unverified
field-status: {}
