reference: arboriculturist-report
local-authority: COL
required-if:
  any:
  - all:
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Preserved trees (TPO or Conservation Area) on or adjoining the site.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The preserved trees may be affected by the proposal.
  - all:
    - ref: major-development
    - condition:
        field: tree-removal
        value: true
        description: A number of trees on site are proposed to be removed.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policies ENV1, ENV3 and CC1; BS 5837:2012
source-text: Where there are trees, within or adjacent to a planning application site that could influence
  or be affected by proposed development.
must-include:
- item: Tree survey
  level: must
- item: Tree protection plan
  level: must
- item: Arboricultural method statement, if development is taking place within the root protection area
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Development within the root protection area of a tree.
confidence: medium
notes: From the council's list (published July 2024), page 21. Listed as 'Tree survey'. For all applications
  with trees, existing trees must be shown on the block plan (see site-plan) and question 15 of the form
  answered. An Arboricultural Statement in accordance with BS 5837 'will normally be required' where preserved
  trees (TPO or Conservation Area) on or adjoining the site may be affected, and for major applications
  where a number of trees are to be removed.
review-status: unverified
field-status: {}
