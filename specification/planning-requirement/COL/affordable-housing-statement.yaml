reference: affordable-housing-statement
local-authority: COL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more homes in the urban area.
  - all:
    - site:
        in:
        - rural-area
        description: The site is in the rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 or more homes in the rural area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A residential site of 0.5 hectares or more.
