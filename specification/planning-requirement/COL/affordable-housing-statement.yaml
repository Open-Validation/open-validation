reference: affordable-housing-statement
local-authority: COL
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more new residential properties.
    - condition:
        field: outside-urban-area
        value: false
        description: In a 'main' urban area (Colchester, Wivenhoe, Tiptree, West Mersea).
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 or more residential properties.
    - site:
        in:
        - designated-rural-area
        description: In a designated rural area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: An unknown number of units on a development area of 0.5 hectares or more.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Colchester Local Plan 2017-2033 policy DM8; Affordable Housing SPD 2023; Housing Act 1985 s.157
source-text: 'Applications for: 10 or more new residential properties in a “main” urban area (Colchester,
  Wivenhoe, Tiptree, West Mersea); or 5 or more residential properties in a designated rural area; or
  an unknown number of units where the development area comprises 0.5 Ha or more.'
must-include:
- item: How the applicant proposes to meet the affordable housing requirements of Local Plan policy DM8
  level: must
- item: Number and size of residential units
  level: should
- item: The mix of units (tenure)
  level: should
- item: Plans showing the location of units
  level: should
- item: If the policy has not been met, a full justification why not
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing policy is not met.
confidence: medium
notes: From the council's list (published July 2024), page 8. If the policy is not met, the application
  also needs a Viability Statement.
review-status: unverified
field-status: {}
