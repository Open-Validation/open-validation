reference: habitat-baseline
local-authority: COL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Environment Act 2021; Colchester Local Plan 2017-2033 policies ENV1 and CC1
source-text: site plan, drawn to an ... identified scale marked with ... the direction of north, ... showing
  on-site habitat ... existing on the date of ... application (or an earlier ... date), including any
  ... irreplaceable habitat
must-include:
- item: Drawn to an identified scale, marked with the direction of north
  level: must
- item: On-site habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
- item: The location of any onsite habitat included in the biodiversity calculations and of any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 10. Listed under 'Biodiversity Net Gain, Survey
  and Reporting', which says 'All developers* must submit' a BNG statement, a habitat site plan, the metric,
  a draft BNG plan and a baseline assessment, or an Exemption Statement if exemption is claimed. In law
  only development subject to the biodiversity gain condition needs them (householder and other exempt
  applications are exempt), so the rule follows the law. The list also asks for a 'BNG Baseline Assessment'.
