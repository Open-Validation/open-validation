reference: elevation-existing
local-authority: COL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new buildings.
    - condition:
        field: external-alterations
        value: true
        description: The proposal alters the exterior of an existing building.
source-url: https://cbccrmdata.blob.core.windows.net/noteattachment/CBC-planning-Colchester-City-Council-Scheme-of-Local-Validation-(SoLV)-2024-Scheme%20of%20Local%20Validation_List_July%202024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings
  (except outline applications).
must-include:
- item: At a scale of 1:50 or 1:100, with a scale bar and/or written dimensions showing the overall size
    of any new buildings or extensions, and annotations of any site level changes
  level: must
- item: All sides of the proposal and, where possible, the proposed building materials and the style,
    materials and finish of windows and doors
  level: must
- item: Where a proposed elevation adjoins or is close to another building or the boundary treatment,
    the relationship between the buildings/boundaries
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 6. Listed as 'Elevations (Existing and Proposed)'.
  The list says all applications except outline; the types shown are the planning and listed building
  types it covers.
review-status: unverified
field-status: {}
