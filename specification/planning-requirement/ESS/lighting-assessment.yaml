reference: lighting-assessment
local-authority: ESS
required-if:
  all:
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting.
    - all:
      - condition:
          field: external-lighting
          value: true
          description: A significant amount of external lighting.
      - discretionary
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        description: Adjacent to a listed building, or within or adjacent to a conservation area.
    - condition:
        field: protected-species
        value: true
        description: Adjacent to a roost, breeding or resting place of, or a habitat of importance to,
          a legally protected species.
    - site:
        in:
        - rural-area
        description: Within open countryside.
    - condition:
        field: near-watercourse
        value: true
        description: Alongside watercourses and habitats where there is a risk of impact on bats.
    - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: 'A lighting scheme is required for any application that includes floodlighting or a significant
  amount of external lighting where the proposed development would be: • Adjacent to a residential property.
  • Adjacent to a listed building. • Within or adjacent to a conservation area. • Adjacent to a roost,
  breeding or resting place of, of a habitat of importance to, a legally protected species (such as bats,
  badgers, barn owls and great crested newts). • Within open countryside. • Alongside watercourses and
  habitats, where there is a risk of impact on bats, especially light sensitive bats.'
must-include:
- item: The location, height, design, luminance and operation of the lighting
  level: should
- item: An overview of the lighting design, including maintenance factor and lighting standard applied
  level: should
- item: Justification for the proposed lighting design
  level: should
- item: A lighting drawing showing lux levels on the ground, angles of tilt and average lux (minimum and
    uniformity) for all external lighting
  level: should
- item: A contour plan of likely light spill, in the context of adjacent site levels
  level: should
- item: How light spill onto adjoining properties and highways has been minimised
  level: should
- item: Areas and features sensitive for bats, and lighting contour plans and specification showing bats
    will not be disturbed
  level: should
- item: Proposed hours of operation
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 54 of the Regulation 3 list (page 59 of the
  Minerals list; page 53 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Lighting Scheme'. 'Significant amount' of lighting is a judgment, and being adjacent to a residential
  property has no field, so both show as discretionary parts.
review-status: unverified
field-status: {}
