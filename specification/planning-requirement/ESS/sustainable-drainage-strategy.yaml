reference: sustainable-drainage-strategy
local-authority: ESS
required-if:
  ref: major-development
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for applications for major development ... A Sustainable drainage strategy is required
  to be submitted containing proportionate information on the proposed sustainable drainage systems, having
  regard to the nature and scale of the development proposed.
must-include:
- item: The existing and proposed surface water management arrangements, showing no increase in flood
    risk off-site
  level: should
- item: The existing surface water drainage arrangements and approximate existing run-off rates and volumes
    (if known)
  level: should
- item: Proposals for managing and discharging surface water using SuDS, accounting for climate change,
    and for restricting discharge rates
  level: should
- item: How the drainage hierarchy has been followed, with justification for the SuDS types and discharge
    method chosen
  level: should
- item: How SuDS are integrated with open space or green infrastructure, and the multifunctional benefits
    they provide
  level: should
- item: How run-off from the completed development will be prevented from causing an impact elsewhere
  level: should
- item: How the system is designed for maintenance and (where relevant) adoption, and plans for operation
    and maintenance over the lifetime of the development
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 60 of the Regulation 3 list (page 66 of the
  Minerals list; page 60 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Sustainable Drainage Systems (SuDs)'; the footnote defines major development as additional floorspace
  of 1,000 sq m or more or a site of 1 hectare or more, or as provided in the DMPO. The contents are things
  the strategy 'may need to address', so they are shown as should.
review-status: unverified
field-status: {}
