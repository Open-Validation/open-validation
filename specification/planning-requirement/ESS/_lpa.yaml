  status: current
submission-standards:
- item: Use PDF format for all documents
  level: should
- item: Keep individual file sizes small; give files accurate names that reflect their content
  level: should
- item: Separate drawings so they can be printed to the original scale on individual A4 or A3 sheets,
    rather than grouping drawings onto a single A2 or larger sheet
  level: should
- item: Use landscape format for drawings and indicate the sheet size and scale
  level: should
- item: Maximum 10MB per attachment (firewall limit); larger documents on portable media such as USB,
    marked with the Planning Portal reference
  level: must
- item: Submit applications online through the Planning Portal where possible; otherwise forms from the
    Planning Portal on portable media (such as USB)
  level: should
- item: Make clear on submission any personal, confidential or commercially sensitive information that
    should not be published
  level: should
