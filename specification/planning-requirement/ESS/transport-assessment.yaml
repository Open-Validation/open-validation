reference: transport-assessment
local-authority: ESS
required-if: discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: A Transport Statement/Assessment is required for all developments that generates significant
  amounts of traffic.
must-include:
- item: Commensurate with the scale of the development
  level: should
- item: The development and site layout, particularly transport access and layout across all modes
  level: should
- item: Neighbouring uses, amenity and character, and the functional classification of the nearby road
    network
  level: should
- item: Existing public transport provision and frequency, and proposed changes
  level: should
- item: The travel characteristics of the development across all modes
  level: should
- item: Trips from relevant committed development in the area
  level: should
- item: Current traffic flows on links and junctions within the study area, identifying critical links
    and junctions
  level: should
- item: Injury accident records near the site access for the most recent 3-year period (5 years in a high
    accident area)
  level: should
- item: Environmental impacts of transport, particularly near environmentally sensitive areas
  level: should
- item: Measures to improve accessibility, the parking strategy, ways to reduce the need to travel and
    measures to mitigate residual impacts
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 61-62 of the Regulation 3 list (page 67-68
  of the Minerals list; page 61-62 of the Waste list). Whether a development generates 'significant amounts
  of traffic' is a judgment, so the rule is discretionary. The contents are listed 'if relevant'.
review-status: unverified
field-status: {}
