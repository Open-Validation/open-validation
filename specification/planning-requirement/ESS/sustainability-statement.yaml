reference: sustainability-statement
local-authority: ESS
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: 'New residential development (Annex 1: Essex Housing applications).'
    - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications for major development ... and encouraged for minor applications
  which include new built development. ... The assessment should demonstrate how it is intended that the
  proposed development would achieve the highest levels of energy and water efficiency practical and viable
  and opportunities to incorporate sustainable design features have been maximised.
must-include:
- item: Measures to reduce the energy demand of the development beyond the minimum required by Building
    Regulations
  level: should
- item: Measures to limit the carbon consumed through implementation and construction (e.g. reusing on-site
    materials or sourcing materials locally)
  level: should
- item: Measures to use renewable or low carbon energy sources
  level: should
- item: Measures to optimise building design and layout for energy efficiency beyond the minimum requirements
    of Part L
  level: should
- item: Measures to reduce the potential impacts of flooding associated with the development
  level: should
- item: Measures to reduce water stress associated with the development
  level: should
- item: Measures to reduce air pollution associated with the development (if relevant)
  level: should
- item: 'For Essex Housing applications: how the development would achieve the highest practical and viable
    levels of energy and water efficiency and maximise sustainable design features'
  level: should
  required-if:
    application-type:
      in:
      - reg-3
confidence: medium
notes: From the council's list (published March 2025), page 35 of the Regulation 3 list (page 39 of the
  Minerals list; page 32 of the Waste list). The lists' 'Climate Change, Energy Statement, Renewable Energy,
  Sustainability Statement'. Required for major development and only encouraged for minor development
  with new buildings. Annex 1 of the Regulation 3 list (page 67, Essex Housing applications) also asks
  for a Sustainability Assessment without saying when, so that part shows as discretionary for residential
  Regulation 3 applications.
review-status: unverified
field-status: {}
