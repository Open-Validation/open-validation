reference: application-form
local-authority: ESS
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - waste-dev
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications by Article 7 of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015
must-include:
- item: All questions on the application form answered
  level: should
  source-text: All questions on the application form should be answered.
- item: Signed and dated
  level: should
  source-text: The form should be signed and dated.
- item: Essex County Council (ECC) named as the applicant
  level: should
  required-if:
    application-type:
      in:
      - reg-3
  source-text: ECC should be named as applicant.
- item: The Essex County Council minerals application form also completed and uploaded as a supporting
    document
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
  source-text: However, the Essex County Council minerals application form should also be completed and
    uploaded as a supporting document.
- item: The correct ownership certificate (A, B, C or D), with notice served on the owners of the site
    under article 13 of the DMPO
  level: must
  source-text: A notice to owners of the application site must be completed and served in accordance with
    article 13 of the Town and Country Planning (Development Management Procedure) (England) Order 2015.
- item: The agricultural holdings certificate, whether or not the site includes an agricultural holding,
    with all agricultural tenants notified before the application is submitted
  level: must
  source-text: This certificate is required whether or not the site includes an agricultural holding.
    All agricultural tenants must be notified prior to the submission of the application.
confidence: medium
notes: From the council's list (published March 2025), page 9, 12-13 of the Regulation 3 list (page 9,
  12 of the Minerals list; page 8, 11-12 of the Waste list). The county council decides minerals, waste
  and its own (Regulation 3) development and publishes one list for each, so 'all applications' is shown
  as those application types. Each list names the application form, certificates (ownership and agricultural
  holdings) and the correct fee as national requirements; the fee has no matching id (see the unmapped
  list). The Minerals and Waste lists say ownership notices must be served at least 21 days before the
  application is submitted.
review-status: unverified
