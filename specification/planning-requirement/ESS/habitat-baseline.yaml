reference: habitat-baseline
local-authority: ESS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment Act 2021)
source-text: Required by Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment
  Act 2021) for all applications for planning permission, unless the proposed development is exempt from
  BNG as set out within Planning Practice Guidance ‘Biodiversity Net Gain’ (dated 1 May 2024).
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: should
- item: Onsite habitat existing on the date of application (or proposed earlier date), including any irreplaceable
    habitat
  level: should
confidence: medium
notes: 'From the council''s list (published March 2025), page 16 of the Regulation 3 list (page 16 of
  the Minerals list; page 13 of the Waste list). The county council decides minerals, waste and its own
  (Regulation 3) development and publishes one list for each, so ''all applications'' is shown as those
  application types. Part of the BNG statement: ''Plan(s), drawn to an identified scale and showing the
  direction of North, showing onsite habitat existing on the date of application''. The rule follows the
  law (the biodiversity gain condition), so exempt applications are left out.'
review-status: unverified
field-status: {}
