reference: construction-management-plan
local-authority: ESS
required-if:
  any:
  - all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: new-build
        value: true
        description: New built development.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for applications which involve new built development. ... Required for all applications
  which propose to bring large plant onto the site or where access to the site is considered sensitive.
must-include:
- item: How on-site construction impacts will be managed, particularly on neighbouring properties, sensitive
    uses, biodiversity and the highway network
  level: should
- item: Timetable/programme of works
  level: should
- item: Parking of vehicles of site personnel, operatives and visitors
  level: should
- item: Loading and unloading, and storage, of plant and materials
  level: should
- item: Location of the contractor compound and facilities
  level: should
- item: Traffic management, vehicle routing, hours of operation, numbers of HGVs and design of delivery
    areas
  level: should
- item: Segregation and safe routing for pupils, staff and visitors
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: Segregation and safe routing for staff and visitors
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Boundary hoarding behind any visibility zones
  level: should
- item: Vehicle turning within the site so vehicles leave in forward gear
  level: should
- item: Suppression and control of dust during construction
  level: should
- item: Wheel and underbody washing facilities
  level: should
- item: A before and after condition survey of the highway near the site access, with repairs where necessary
  level: should
- item: Protection and management of existing trees, hedgerows, habitats and protected species during
    construction (fencing, method statements and timing of operations)
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 38 of the Regulation 3 list (page 41 of the
  Minerals list; page 35 of the Waste list). The Regulation 3 list asks for it for new built development;
  the Minerals and Waste lists ask for it where large plant would be brought onto the site or access is
  sensitive, which is a judgment, so that part shows as discretionary.
review-status: unverified
field-status: {}
