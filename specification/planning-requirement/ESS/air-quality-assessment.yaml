reference: air-quality-assessment
local-authority: ESS
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: biomass-or-chp
        value: true
        description: Biomass boilers, biomass or gas CHP.
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: 'Required for the following: • Major development. • Substantial earthworks or demolition.
  • Any development that could have a significant impact on air quality, either directly or indirectly.
  • Development within 1km of a sensitive area (e.g., Air Quality Management Area (AQMA) or an Air Quality
  Area of Concern (AQAC)). • Development that will have a significant impact on traffic in terms of volume
  or change of vehicle composition. • Development that will involve major road infrastructure changes.
  • Development that will introduce its own potentially polluting source. • Development that will involve
  significant dust emissions. ... Development involving biomass boilers, biomass or gas CHP (including
  connections to existing networks where the increased capacity is not already covered in an existing
  AQA).'
must-include:
- item: Undertaken by a competent person
  level: should
- item: Measures to reduce potential impacts to an acceptable level, proportionate to the scale and type
    of development
  level: should
- item: A review of air quality around the site using existing monitoring and/or modelling data
  level: should
- item: The impact on air quality during construction, with detailed mitigation for dust and emissions
    from plant and vehicles
  level: should
- item: The number of receptors exposed to poor air quality, shown on a map, with the significance of
    exposure quantified ('Air Quality Impact Significance Criteria – New Exposure')
  level: should
- item: An outline and justification of mitigation measures in the design, location and operation of the
    development
  level: should
- item: Air quality dispersion modelling data, where a detailed assessment is required
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2025), page 29-30 of the Regulation 3 list (page 32-33
  of the Minerals list; page 26-27 of the Waste list). Biomass boilers and CHP are named in the Minerals
  and Waste lists only. Most triggers are judgments ('significant impact', 'substantial earthworks', 'major
  road infrastructure changes'), so they show as discretionary next to major development. Being within
  1km of an AQMA or Air Quality Area of Concern is also a trigger; there is no distance field for it,
  so it sits in the discretionary part.
review-status: unverified
field-status: {}
