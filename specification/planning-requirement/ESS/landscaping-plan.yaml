reference: landscaping-plan
local-authority: ESS
required-if:
  condition:
    field: landscaping-works
    value: true
    description: New or replacement landscaping is proposed.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for applications where new or replacement landscaping is proposed.
must-include:
- item: Clearly legible drawings based on an accurate site survey
  level: should
- item: Final landscape schemes overlay the final development layout drawing
  level: must
  source-text: Final landscape schemes must overlay the final development layout drawing.
- item: A scale adequate for a detailed scheme (e.g. 1:500, 1:200, 1:100 or 1:50)
  level: should
- item: A north point, scale bar and a key to any symbols, using symbols rather than colour so it is legible
    in black and white
  level: should
- item: Development setting and character, site layout and the location of site access
  level: should
- item: Links to other developments and the wider landscape
  level: should
- item: Protection of established trees and landscape features
  level: should
- item: Potential impact on neighbouring properties and screening
  level: should
- item: Soft landscaping (trees, shrubs and other planting, turfing and seeding)
  level: should
- item: Hard landscaping (paving, street furniture, walling and fencing materials)
  level: should
- item: Biodiversity issues and habitat creation, and the sustainability of the scheme
  level: should
- item: Reinstatement of the site after completion of the works
  level: should
- item: Landscape management objectives, specification, maintenance and aftercare
  level: should
- item: Appointment of competent professionals (e.g. landscape architect and landscape contractor)
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 53 of the Regulation 3 list (page 58 of the
  Minerals list; page 52 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Landscape Scheme'.
review-status: unverified
field-status: {}
