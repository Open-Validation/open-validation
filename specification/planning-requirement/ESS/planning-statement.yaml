reference: planning-statement
local-authority: ESS
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - waste-dev
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications
must-include:
- item: An explanation of the principles behind and the justification for the development
  level: should
- item: A description of the site, its physical features and its surroundings
  level: should
- item: The site's existing use, planning designations and physical constraints
  level: should
- item: A full description of the scope of the development
  level: should
- item: Existing and proposed demand, expected annual tonnage and how the development would contribute
    towards the landbank
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: A full description of the scope of the proposed development (existing demand, projected
    future demand, expected annual tonnage, how the proposed development would contribute towards the
    landbank).
- item: Existing and proposed pupil and staff numbers (for school development)
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: An educational need statement (if relevant)
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: Site layout, buildings and existing and proposed external building materials
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - waste-dev
- item: The nature of the minerals to be extracted and the total tonnage/volume of mineral
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: The overburden to mineral ratio across the site
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: The anticipated silt percentage, if to be washed, and proposals for managing silt
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: Proposed restoration after-uses and aftercare management
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: A summary of the supporting and technical information submitted
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: The nature of waste materials to be imported, the end products to be generated and how residual
    materials would be disposed of
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
- item: Restoration after-uses and aftercare management for landfill proposals
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
- item: Existing and proposed employee numbers
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
- item: Boundary treatment
  level: should
- item: The topography and geology of the site
  level: should
- item: How the development accords with national and local plan policy
  level: should
- item: Any pre-application consultation (including community engagement) and any amendments made as a
    result
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 26 of the Regulation 3 list (page 26 of the
  Minerals list; page 23 of the Waste list). The county council decides minerals, waste and its own (Regulation
  3) development and publishes one list for each, so 'all applications' is shown as those application
  types. The statement should be commensurate with the scale of the development. Items marked with an
  application type are in only that list.
