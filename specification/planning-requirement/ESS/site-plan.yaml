reference: site-plan
local-authority: ESS
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - waste-dev
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications except Outline
must-include:
- item: At a scale of 1:500 or 1:200
  level: should
- item: Accurately shows the direction of north
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundary
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: The extent and type of any hardstanding
  level: should
- item: Boundary treatment, including walls or fencing, where this is proposed
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 20 of the Regulation 3 list (page 20 of the
  Minerals list; page 17 of the Waste list). The county council decides minerals, waste and its own (Regulation
  3) development and publishes one list for each, so 'all applications' is shown as those application
  types. The Minerals and Waste lists use the same wording. The lists' 'Site/Block Plan'; the national
  requirements on page 5 name it 'Block Plan'.
review-status: unverified
field-status: {}
