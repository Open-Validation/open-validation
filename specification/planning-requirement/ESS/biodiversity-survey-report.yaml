reference: biodiversity-survey-report
local-authority: ESS
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Protected Sites (SACs, SPAs, Ramsar Sites, SSSIs, Local Wildlife Sites and Special
        Roadside Verges) that the development could affect.
  - condition:
      field: protected-species
      value: true
      description: European or nationally protected species, or priority species, could be affected.
  - site:
      in:
      - priority-habitat
      description: Priority habitats could be affected.
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Conservation of Habitats and Species Regulations 2017; Wildlife & Countryside Act 1981; Protection
  of Badgers Act 1992
source-text: Required for all applications which have the potential to affect Protected Sites ... , European
  Protected Species ... , National Protected Species ... , Priority Habitats and Species ... Surveys and
  assessments may not be required if pre-application advice has been received from Natural England and/or
  Essex County Council’s ecologist confirming they do not consider the proposed development would have
  an impact on any designated sites.
must-include:
- item: 'Where the Biodiversity Checklist suggests protected or priority species are likely but they are
    absent: evidence of absence (e.g. a report from a suitably qualified and experienced person)'
  level: should
- item: 'A Preliminary Ecological Appraisal desk study: site information, designated sites within the
    zone of influence, species records, habitat information and distribution information'
  level: should
- item: A walkover survey (in most circumstances), or a clear statement that the site was not visited
    and the limitations that result
  level: should
- item: Habitat mapping using a published and recognised habitat classification
  level: should
- item: An assessment of the possible presence of protected or priority species and the importance of
    habitat features for them
  level: should
- item: Mapping of any stands of non-native invasive plant species
  level: should
- item: Any incidental sightings or field signs of priority or protected species
  level: should
- item: Information on badgers provided separately, so sett locations are not identified
  level: should
confidence: medium
notes: 'From the council''s list (published March 2025), page 32-34 of the Regulation 3 list (page 35-37
  of the Minerals list; page 29-31 of the Waste list). The lists'' ''Biodiversity Surveys and Assessments''
  (Minerals and Waste: ''Surveys and Reports''). ''Potential to affect'' is a judgment, so the rule keeps
  a discretionary part next to the named sites and species. The Biodiversity Checklist that goes with
  it has no matching id (see the unmapped list).'
review-status: unverified
field-status: {}
