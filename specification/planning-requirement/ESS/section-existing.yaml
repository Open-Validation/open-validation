reference: section-existing
local-authority: ESS
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: Existing or proposed site levels would impact on built development.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications where the existing or proposed site levels would impact on
  built development
must-include:
- item: At a scale of 1:50 or 1:100
  level: should
- item: A cross section(s) through the proposed building(s)
  level: should
- item: 'Where ground levels change: existing and finished levels, including details of foundations and
    eaves and how encroachment onto adjoining land is to be avoided'
  level: should
- item: How the proposed buildings relate to existing site levels and neighbouring development
  level: should
- item: Existing site levels and finished floor levels, related to a fixed datum point off site, with
    the proposals shown in relation to adjoining buildings
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 23 of the Regulation 3 list (page 23 of the
  Minerals list; page 20 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Existing and Proposed Site Sections (including finished floor and site levels)'.
review-status: unverified
field-status: {}
