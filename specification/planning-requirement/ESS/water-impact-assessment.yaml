reference: water-impact-assessment
local-authority: ESS
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: Dewatering is proposed.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - any:
      - condition:
          field: non-domestic-water-demand
          operator: '>'
          value: 20000
          description: New minerals development or an extension to a mineral site with unplanned non-domestic
            water requests of more than 20,000 litres per day.
      - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Minerals%20validation%20checklist%20March%202025.pdf
source-text: Required for applications for minerals and waste development where dewatering is proposed.
  ... Required for new minerals development or extensions to existing mineral sites for any unplanned
  non-domestic water requests which exceed 20,000 litres per day or where there is a cumulative impact
  from a significant number of smaller requests.
must-include:
- item: Topography and surface drainage, geology, borehole reports and any licensed and unlicensed abstractions
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: The natural water table, including its depth, source catchment areas and characteristics
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: The potential impact on any wetland Site of Special Scientific Interest, and that third parties
    will not be affected
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: Mitigation (such as recharging reservoirs) where public or private water supplies, water bodies
    or watercourses may be affected
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: Proposed methods of dewatering and of water disposal, and measures to control pollution of ground
    and surface water
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: Drainage and flood control measures, monitoring (including any settlement lagoons) and how surface
    water will be disposed of
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: How impairing drainage from adjoining areas and material entering open watercourses will be avoided
  level: should
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: 'For water demand: that capacity is available without unacceptable environmental impact, the cumulative
    impacts in the Water Resource Zone (prepared with the water company) and the mitigation measures'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
confidence: medium
notes: From the council's list (published March 2025), pages 55-56 and 73 of the Minerals list (page 50
  of the Waste list). Combines the Minerals and Waste lists' 'Hydrology/Hydrogeology Assessment' (where
  dewatering is proposed) and the Minerals list's 'Water Resources Assessment' (water demand); neither
  is in the Regulation 3 list. A cumulative impact from many smaller requests is a judgment, shown as
  discretionary. Works affecting an ordinary watercourse also need Land Drainage Act consent from the
  Lead Local Flood Authority.
review-status: unverified
field-status: {}
