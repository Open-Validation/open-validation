reference: viability-assessment
local-authority: ESS
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - ref: major-development
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: No developer contributions, or a reduced level, are offered to mitigate the impact
        of the development.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for major development where no developer contributions or a reduced level is being
  offered to mitigate the impact of the development.
must-include:
- item: An Open Book assessment of viability, made available for independent analysis by a consultant
    chosen by the Council at the applicant's cost
  level: must
  source-text: An Open Book assessment of the viability of the proposal must be provided and made available
    for independent analysis by a consultant chosen by the Council (at the applicant’s cost).
confidence: medium
notes: From the council's list (published March 2025), page 67 of the Regulation 3 list. Annex 1 of the
  Regulation 3 list (Essex Housing applications). The annex says other local requirements may apply to
  residential applications and to confirm them with the case officer.
review-status: unverified
field-status: {}
