reference: arboriculturist-report
local-authority: ESS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site, or on adjacent land (including street trees), that could influence
        or be affected by the development.
  - condition:
      field: tree-removal
      value: true
      description: Existing trees within the site would be removed.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: BS 5837:2012 Trees in relation to Design, Demolition and Construction
source-text: A tree survey is required for any development proposal which may potentially affect trees
  within a development site or on land adjacent to it that could influence or be affected by the proposed
  development, including street trees. A survey is also required if proposed development requires the
  removal of existing trees within the development site.
must-include:
- item: Prepared by a suitably qualified person in accordance with BS 5837:2012
  level: should
- item: A topographical survey showing the exact location of the trees
  level: should
- item: 'A survey schedule: reference number, species, height, stem diameter, branch spread, height of
    first significant branch and canopy, life stage, condition, BS 5837 category, remaining contribution
    and management recommendations'
  level: should
- item: 'An Arboricultural Impact Assessment: species, dimensions and quality of trees, trees removed
    for health reasons distinguished from those removed for the development, problems and mitigation,
    and replacement planting'
  level: should
- item: A Tree Constraints Plan showing retention categories and Root Protection Areas, overlaid with
    the proposed layout
  level: should
- item: A Tree Protection Plan showing protective fencing and ground protection, trees to be removed and
    trees needing remedial works
  level: should
- item: An Arboricultural Method Statement where construction would take place within the tree rooting
    area or pruning is required
  level: must
  source-text: An AMS is required where construction activity would take place within the tree rooting
    area or where pruning works are required.
confidence: medium
notes: From the council's list (published March 2025), page 64-66 of the Regulation 3 list (page 70-72
  of the Minerals list; page 64-66 of the Waste list). The Minerals and Waste lists use the same wording.
  The lists' 'Tree Survey, Arboricultural Impact Assessment, Arboricultural Method Statement'.
review-status: unverified
field-status: {}
