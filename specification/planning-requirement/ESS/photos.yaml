reference: photos
local-authority: ESS
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: Demolition of an existing building.
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for applications where the development would result in a significant change in the
  appearance of a building and/or landscape (including the demolition of an existing building). This includes
  development affecting Listed Buildings and Conservation Areas.
must-include:
- item: Photographs of the external appearance of the building(s) or area(s) in its current state
  level: should
- item: Photomontages showing the proposed change
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 25 of the Regulation 3 list (page 25 of the
  Minerals list; page 22 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Photographs and photomontages'. Whether a change in appearance is 'significant' is a judgment, so the
  rule is discretionary apart from demolition, which the lists name; the lists say this includes development
  affecting Listed Buildings and Conservation Areas. Computer generated images may also be helpful.
review-status: unverified
field-status: {}
