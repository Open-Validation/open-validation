reference: daylight-sunlight-assessment
local-authority: ESS
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - waste-dev
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for any application where there is potential adverse impact upon current levels
  of daylight/sunlight enjoyed by adjoining properties or buildings including associated gardens or amenity
  space.
must-include:
- item: Details of any site inspection, including the orientation of neighbouring buildings and their
    windows
  level: should
- item: Daylight availability in existing and proposed conditions
  level: should
- item: Analysis of how the development could cast shadows on neighbouring properties at different times
    of day and year
  level: should
- item: Recommended design changes or mitigation where the development falls short of daylight and sunlight
    standards
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 39 of the Regulation 3 list (page 36 of the
  Waste list). Not in the Minerals list. Whether there is a 'potential adverse impact' is a judgment,
  so the rule is discretionary.
review-status: unverified
field-status: {}
