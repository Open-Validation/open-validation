reference: land-contamination-assessment
local-authority: ESS
required-if:
  site:
    in:
    - contaminated-land
    description: Contaminated land and/or buildings or structures are known or suspected to exist.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for applications for development where contaminated land and/or buildings/structures
  are known or suspected to exist.
must-include:
- item: A proportionate risk assessment prepared by a competent person
  level: should
- item: The potential sources, pathways and receptors (pollutant/contaminant linkages) and an evaluation
    of the risks
  level: should
- item: As a minimum, a desk study and site walk-over
  level: must
  source-text: As a minimum a desk study and site walk-over will be required
confidence: medium
notes: From the council's list (published March 2025), page 37 of the Regulation 3 list (page 40 of the
  Minerals list; page 34 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Contaminated Land Assessment'. If the initial assessment does not show the risk can be reduced to an
  acceptable level, further investigation is needed before the application is decided.
review-status: unverified
field-status: {}
