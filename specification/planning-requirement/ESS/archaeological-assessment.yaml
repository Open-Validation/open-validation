reference: archaeological-assessment
local-authority: ESS
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: Within an Area of Archaeological Potential.
  - any:
    - condition:
        field: new-build
        value: true
        description: A new building.
    - condition:
        field: ground-disturbance
        value: true
        description: Disturbance of the ground.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications for development, within an Area of Archaeological Potential,
  that involves a new building or disturbance of the ground.
must-include:
- item: Consultation of the Essex Historic Environment Record (EHER)
  level: should
- item: Targeted documentary research, including relevant historic maps and documents
  level: should
- item: Details of a site visit (if applicable) to identify potential archaeology within the site
  level: should
- item: An assessment of identified archaeological assets within the site
  level: should
- item: Recommendations for further work (if necessary and appropriate)
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 31 of the Regulation 3 list (page 34 of the
  Minerals list; page 28 of the Waste list). The Minerals and Waste lists use the same wording.
review-status: unverified
field-status: {}
