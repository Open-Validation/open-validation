reference: noise-assessment
local-authority: ESS
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development (schools, residences, libraries, hospitals and other care
        facilities).
  - condition:
      field: near-noise-sensitive-use
      value: true
      description: Development within a noise sensitive area (residential properties, holiday accommodation,
        noise sensitive recreational activities).
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications which may have a potential noise impact and for development
  considered to be noise sensitive ... or development within a noise sensitive area
must-include:
- item: Measurement of existing noise levels at and around the site
  level: should
- item: Prediction of noise affecting the development, and of noise from the development affecting the
    existing area
  level: should
- item: Noise mitigation measures, protecting the development from existing noise or existing areas from
    a new noise source
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 55 of the Regulation 3 list (page 60 of the
  Minerals list; page 54 of the Waste list). The Minerals and Waste lists use the same wording. The lists'
  'Noise Impact Assessment'. Footnotes define noise-sensitive development and noise sensitive areas. 'May
  have a potential noise impact' is a judgment, shown as discretionary.
review-status: unverified
field-status: {}
