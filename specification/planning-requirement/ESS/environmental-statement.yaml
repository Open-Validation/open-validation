reference: environmental-statement
local-authority: ESS
required-if:
  condition:
    field: eia-development
    value: true
    description: Schedule 1 or Schedule 2 development under the 2017 EIA Regulations that may have significant
      effects on the environment.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Required for all applications proposing development included in Schedule 1 or Schedule 2
  of the 2017 Regulations which may have significant effects on the environment.
must-include:
- item: 'A description of the development: site, design, size and other relevant features'
  level: should
- item: A description of the likely significant effects on the environment
  level: should
- item: Features or measures to avoid, prevent, reduce and if possible offset likely significant adverse
    effects
  level: should
- item: The reasonable alternatives studied and the main reasons for the option chosen
  level: should
- item: A non-technical summary
  level: should
- item: Any additional information in Schedule 4 relevant to the development and the environmental features
    likely to be affected
  level: should
- item: Prepared by competent experts, with a statement of their relevant expertise or qualifications
  level: should
- item: Based on the most recent scoping opinion or direction, where one has been issued
  level: must
- item: The information reasonably required to reach a reasoned conclusion on the significant effects
  level: must
confidence: medium
notes: From the council's list (published March 2025), page 40 of the Regulation 3 list (page 44 of the
  Minerals list; page 39 of the Waste list). The Minerals and Waste lists use the same wording.
review-status: unverified
field-status: {}
