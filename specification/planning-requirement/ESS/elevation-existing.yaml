reference: elevation-existing
local-authority: ESS
required-if:
  condition:
    field: new-build
    value: true
    description: New built development is proposed.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications where new built development is proposed
must-include:
- item: At a scale of 1:50 or 1:100
  level: should
- item: The proposed works shown clearly in relation to what is already on site
  level: should
- item: All sides of the proposal, indicating where possible the proposed building materials and the style,
    materials and finish of windows and doors
  level: should
- item: Blank elevations, if only to show this is the case
  level: should
- item: 'Where a proposed elevation adjoins or is close to another building: the relationship between
    the buildings and the positions of the openings on each property'
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 21 of the Regulation 3 list (page 21 of the
  Minerals list; page 18 of the Waste list). The Minerals and Waste lists use the same wording.
review-status: unverified
field-status: {}
