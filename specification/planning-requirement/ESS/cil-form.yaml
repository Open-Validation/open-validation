reference: cil-form
local-authority: ESS
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: New residential or non-residential development creating net additional floorspace of
        100 square metres or more, in a CIL charging area.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Community Infrastructure Levy Regulations 2010
source-text: CIL only applies in areas where a local authority has consulted on, and approved, a charging
  schedule which sets out its levy rates and has published the schedule on its website. ... CIL may be
  payable on new residential and non-residential development which creates net additional floor space
  of 100 square metres or more.
must-include:
- item: CIL Additional Information Requirement Form (AIR/Form 1), to determine whether the development
    is liable
  level: should
- item: CIL Form 2 (Assumption of Liability), if the development is CIL liable
  level: should
  required-if:
    condition:
      field: cil-liable
      value: true
      description: The development is liable for CIL.
confidence: medium
notes: From the council's list (published March 2025), page 36 of the Regulation 3 list. In the Regulation
  3 list only. CIL applies only where the district or borough has a charging schedule.
review-status: unverified
field-status: {}
