reference: location-plan
local-authority: ESS
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - waste-dev
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required by Article 7 of the Town and Country Planning (Development Management Procedure)
  (England) Order 2015 for all applications except approval of details reserved by condition and non-material
  amendment applications.
must-include:
- item: Based on an up-to-date map (plans from the 1970s are not acceptable)
  level: should
- item: At a scale of 1:1250 or 1:2500
  level: should
- item: At least two named roads and surrounding buildings, numbered or named so the exact location is
    clear (one named road may be acceptable in rural locations)
  level: should
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
- item: Scaled to fit onto A4 or A3 paper
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: Be scaled to fit onto A4 or A3 paper.
- item: An arrow showing true north
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: Include an arrow showing true north.
confidence: medium
notes: From the council's list (published March 2025), page 11 of the Regulation 3 list (page 11 of the
  Minerals list; page 10 of the Waste list). The county council decides minerals, waste and its own (Regulation
  3) development and publishes one list for each, so 'all applications' is shown as those application
  types. The Minerals list says a site location plan is needed for all applications except non-material
  amendments and discharge of condition(s) applications. The last two items are in the Minerals and Waste
  lists only.
review-status: unverified
field-status: {}
