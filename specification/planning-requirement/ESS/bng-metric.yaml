reference: bng-metric
local-authority: ESS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment Act 2021)
source-text: Required by Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment
  Act 2021) for all applications for planning permission, unless the proposed development is exempt from
  BNG as set out within Planning Practice Guidance ‘Biodiversity Net Gain’ (dated 1 May 2024).
must-include:
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat on the date of application (or proposed earlier date), including the publication date of the
    metric used
  level: should
- item: 'Where an earlier date is proposed: that date and the reasons for proposing it'
  level: should
- item: 'Where activities carried out before the date of application caused a loss of onsite biodiversity
    value (degradation): the date immediately before, the pre-development value on that date, the completed
    metric and any supporting evidence'
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 16 of the Regulation 3 list (page 16 of the
  Minerals list; page 13 of the Waste list). The county council decides minerals, waste and its own (Regulation
  3) development and publishes one list for each, so 'all applications' is shown as those application
  types. The lists say 'all applications for planning permission' unless exempt; the rule follows the
  law (the biodiversity gain condition), so householder and other exempt applications are left out. The
  BNG statement itself (confirmation that the condition applies, degradation statement, irreplaceable
  habitat description) has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
