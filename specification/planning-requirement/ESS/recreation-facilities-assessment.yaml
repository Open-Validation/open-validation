reference: recreation-facilities-assessment
local-authority: ESS
required-if:
  any:
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - condition:
          field: loss-of-open-space
          value: true
          description: Loss of open space, sports or recreation facilities (including school playing fields)
            or green infrastructure.
      - condition:
          field: new-open-space
          value: true
          description: Provision of open space, sports or recreation facilities.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - ref: major-development
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space, sport and recreation.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for all applications that involve the loss, or provision of, open space, sports
  and recreation facilities (including school playing fields)/green infrastructure. ... Required for all
  major applications which propose a loss of open space, sport and recreation.
must-include:
- item: 'The facility to be lost: use, size and condition'
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: An assessment of the facilities to be retained against current standards
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: Justification of why the facility is no longer required
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: 'Where replacement facilities are provided: details including construction and future maintenance'
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: 'For school development affecting playing fields: existing and proposed summer and winter pitch
    layouts, with justification for the development and location'
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: That the open space is surplus, will be replaced by equivalent or better provision, or is for
    alternative sports and recreation provision whose need clearly outweighs the loss
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Harm to the character and openness of the local area
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Whether there is existing excess provision locally and that there will be no shortfall in the
    plan period
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: How the community will gain greater benefit from suitable alternative open space nearby
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: From the council's list (published March 2025), page 56 of the Regulation 3 list (page 61 of the
  Minerals list; page 56 of the Waste list). The Regulation 3 list's 'Open Space and Playing Field Assessment'
  (including playing fields under Schedule 4 of the DMPO, development on school playing fields and replacing
  grass with a hard or artificial surface); the Minerals and Waste lists' 'Open Space Assessment'. Source-text
  joins the Regulation 3 and Minerals/Waste wording.
review-status: unverified
field-status: {}
