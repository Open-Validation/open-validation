reference: flood-risk-assessment
local-authority: ESS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3, including minor development and change of use.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in Flood Zone 1.
    - site:
        in:
        - critical-drainage-area
        description: In an area within Flood Zone 1 with critical drainage problems.
    - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: 'Flood Risk Assessment Required for development: In Flood Zones 2 or 3 including minor development
  and change of use Of more than 1 hectare in Flood Zone 1 Of less than 1 hectare in Flood Zone 1, including
  a change of use in a development type to a more vulnerable class (e.g., from commercial to residential),
  which could be affected by sources of flooding other than rivers and the sea (e.g., surface water drains,
  reservoirs) In an area within Flood Zone 1 which has critical dra…'
must-include:
- item: A general summary of the proposed development, including a block plan of existing and proposed
    development, any change of use, the vulnerability classification and the expected lifetime of the
    development
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): ECC''s lists do not cover prior approvals. Small Flood Zone 1 sites at
  risk from other sources are shown as officer discretion.'
review-status: unverified
field-status: {}
