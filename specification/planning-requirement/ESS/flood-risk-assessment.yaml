reference: flood-risk-assessment
local-authority: ESS
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in Flood Zone 1.
  - site:
      in:
      - critical-drainage-area
      description: In Flood Zone 1 with critical drainage problems as notified by the Environment Agency.
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: 'Required for development: • In Flood Zones 2 or 3 including minor development ... and change
  of use ... • Of more than 1 hectare in Flood Zone 1 • Of less than 1 hectare in Flood Zone 1, including
  a change of use in a development type to a more vulnerable class (e.g., from commercial to residential),
  which could be affected by sources of flooding other than rivers and the sea (e.g., surface water drains,
  reservoirs) • In an area within Flood Zone 1 which has critical drainage problems as notified by the
  Environment Agency'
must-include:
- item: 'A description of the site: location plan, postal address and/or grid reference, current use,
    Flood Zone and any other sources of flooding now or in the future'
  level: should
- item: A summary of the development, including a block plan of existing and proposed development, any
    change of use, the vulnerability classification and the expected lifetime of the development
  level: should
- item: An assessment of flood risk from all sources, plus an allowance for climate change
  level: should
- item: The estimated flood level, taking account of climate change over the lifetime of the development
  level: should
- item: Finished floor levels
  level: should
- item: Flood resistance and resilience plans
  level: should
- item: Arrangements for surface water management
  level: should
- item: The number of future occupants and users, the likely pattern of occupancy and use, and measures
    to protect vulnerable people from flooding
  level: should
- item: Any residual risks after mitigation and how they will be managed to keep users safe over the lifetime
    of the development
  level: should
- item: The author and date of the assessment
  level: should
- item: How the Sequential Test has been applied (if required), with the name and location of the site
    and why it was chosen
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
- item: Evidence for the Exception Test where required (highly vulnerable development in Flood Zone 2,
    essential infrastructure in Flood Zone 3a or 3b, more vulnerable development in Flood Zone 3a)
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
confidence: medium
notes: 'From the council''s list (published March 2025), page 42-44 of the Regulation 3 list (page 45-47
  of the Minerals list; page 40-42 of the Waste list). The Minerals and Waste lists use the same wording.
  Footnotes: minor development means non-residential extensions of up to 250 sq m and development that
  does not increase the size of buildings; a change of use counts where it would introduce a more vulnerable
  use. Sites under 1 hectare in Flood Zone 1 need an FRA only if they could be affected by flooding from
  other sources (e.g. surface water drains, reservoirs), a judgment shown as discretionary. A Sequential
  Test is not needed for minor development or most changes of use.'
review-status: unverified
field-status: {}
