reference: site-restoration
local-authority: ESS
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - condition:
      field: ground-disturbance
      value: true
      description: Minerals or waste development that involves disturbance of the ground.
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Minerals%20validation%20checklist%20March%202025.pdf
source-text: Required for applications for minerals and waste development that involve disturbance of
  the ground.
must-include:
- item: The approach to restoration, including phasing and direction of working and progressive restoration
  level: should
- item: For each working phase, site layout plans showing enabling infrastructure, temporary and permanent
    mitigation measures, and the location of voids, stockpiles and waste materials
  level: should
- item: Cross sections showing the relative height of these within the wider site
  level: should
- item: The proposed restoration material and soils and the final landform, with existing and proposed
    contour plans and cross sections of ground levels and gradients
  level: should
- item: A landscape scheme showing the proposed land use, site access, vehicular and pedestrian routes,
    public rights of way and retained and new landscape features
  level: should
- item: 'For proposals affecting agricultural land: a statement of the existing and proposed Agricultural
    Land Classification'
  level: should
- item: Aftercare for at least 5 years, detailed in management and maintenance specifications and schedules
  level: should
- item: Enough detail to avoid pre-commencement conditions
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 65 of the Minerals list (page 59 of the Waste
  list). The lists' 'Restoration and Aftercare Scheme'; not in the Regulation 3 list.
review-status: unverified
field-status: {}
