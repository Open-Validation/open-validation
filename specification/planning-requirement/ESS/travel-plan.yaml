reference: travel-plan
local-authority: ESS
required-if: discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: Required for any proposed development which would generate significant amounts of traffic.
must-include:
- item: Specific outcomes, targets and measures, with clear monitoring and management arrangements
  level: should
- item: Benchmark travel data, including trip generation databases
  level: should
- item: The nature of the development and the forecast trips by all modes
  level: should
- item: Existing travel habits in the surrounding area
  level: should
- item: Proposals to reduce the need for travel to and from the site, and to improve public transport
    services
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 63 of the Regulation 3 list (page 69 of the
  Minerals list; page 63 of the Waste list). The Minerals and Waste lists use the same wording. 'Significant
  amounts of traffic' is a judgment, so the rule is discretionary.
review-status: unverified
field-status: {}
