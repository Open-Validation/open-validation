reference: heritage-statement
local-authority: ESS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      description: Within the curtilage of a listed building, in a conservation area (including demolition),
        or affecting a Scheduled Monument, a Registered Park and Garden, a locally listed heritage asset
        or the setting of a heritage asset.
  - discretionary
source-url: https://www.essex.gov.uk/sites/default/files/2025-03/Regulation%203%20validation%20checklist%20March%202025.pdf
source-text: 'Required for: • Applications for listed building consent. • Applications within the curtilage
  of a listed building. • Applications in conservation areas (including demolition). • Applications affecting
  Scheduled Monuments. • Applications affecting a Registered Park and Garden. • Applications affecting
  an archaeological site. • Applications affecting non-designated heritage assets, such as buildings included
  on the Council’s list of local heritage assets or those identified during the pre-application process.
  • Applications affecting the setting of a heritage asset (whether designated or non-designated).'
must-include:
- item: The significance of the heritage asset(s) affected, including any contribution made by setting
  level: should
- item: The principles of and justification for the proposed works
  level: should
- item: The impact of the proposal on the significance of the heritage asset(s)
  level: should
- item: The sources considered and the expertise consulted
  level: should
- item: The steps taken to avoid or minimise adverse impacts on significance
  level: should
- item: A mitigation strategy addressing any impacts on significance
  level: should
confidence: medium
notes: From the council's list (published March 2025), page 50-51 of the Regulation 3 list (page 53-54
  of the Minerals list; page 48-49 of the Waste list). The Minerals and Waste lists use the same wording.
  Applications affecting an archaeological site, or non-designated heritage assets identified during pre-application,
  are judged case by case, so the rule keeps a discretionary part. The statement should be proportionate
  to the importance of the asset.
review-status: unverified
field-status: {}
