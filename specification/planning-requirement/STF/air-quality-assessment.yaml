reference: air-quality-assessment
local-authority: STF
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within or adjacent to a designated Air Quality Management Area (AQMA).
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Air quality in Planning Practice Guidance
source-text: Any site within or adjacent to a designated Air Quality Management Area (AQMA) An application
  that could give rise to air quality concerns
must-include:
- item: The impact on air quality
  level: must
- item: Possible mitigation measures
  level: must
- item: The influence of air quality issues on the design of the development
  level: must
- item: Design details of windows and ventilation equipment
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 6. 'An application that could give rise to air
  quality concerns' is judged case by case, so it is shown as discretionary.
review-status: unverified
