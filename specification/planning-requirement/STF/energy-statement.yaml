reference: energy-statement
local-authority: STF
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Residential schemes of 5 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Non-residential schemes of 500 square metres or more.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies SD1, SD2
  and SD3
source-text: For residential schemes of [5 or more dwellings]. For non-residential schemes of [500 square
  metres or more]
must-include:
- item: How the scheme complies with Core Strategy policies SD1 (sustainable use of resources), SD2 (renewable
    and low-carbon energy) and SD3 (carbon-saving measures)
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 8. Called 'Energy/Sustainability Statement'.
  The thresholds are printed in square brackets in the list.
review-status: unverified
field-status: {}
