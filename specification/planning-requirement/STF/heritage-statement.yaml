reference: heritage-statement
local-authority: STF
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - park-and-garden
      - scheduled-monument
      - historic-environment-record
      description: Any part of the site is within or adjoins a listed building, conservation area, historic
        park or garden or scheduled ancient monument, or is of recognised archaeological interest.
  - application-type:
      in:
      - lbc
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies SD1, DC2,
  E3, TCR1 and DC1; NPPF paragraph 128
source-text: Where any part of the application site is within or adjoins a Listed Building, Conservation
  Area, historic park or garden or scheduled ancient monument or is of recognised archaeological interest.
  … A Heritage Statement is required for all applications affecting a heritage asset (see local list for
  content).
must-include:
- item: An explanation of the significance of the affected asset
  level: should
- item: An explanation of the impact of the proposals on that significance
  level: should
- item: How the impact on the heritage asset is avoided, minimised and mitigated
  level: should
- item: Opportunities looked for to better reveal or enhance significance
  level: should
- item: Justification of any harmful impacts
  level: should
- item: Drawings of the elevations and floor plans of any building or part of a building to be altered
    or demolished at 1:100 or 1:50, with photographs (unless included elsewhere in the application)
  level: should
  required-if:
    condition:
      field: external-alterations
      value: true
      description: A building or part of a building is proposed to be altered or demolished.
confidence: medium
notes: From the council's list (adopted March 2016), page 10. The 'Listed buildings and their settings'
  row (page 4) also says a Heritage Statement is required for all applications affecting a heritage asset,
  so listed building consent applications are included. The statement 'should include' the five stages,
  so they are shown as should; it must be proportionate. 'Recognised archaeological interest' is shown
  as an entry in the Historic Environment Record.
review-status: unverified
field-status: {}
