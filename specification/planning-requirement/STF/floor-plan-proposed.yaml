policy: Part 3 of The Town and Country Planning (Development Management Procedures) (England) Order 2015
source-text: All applications except where the proposal does not relate to a building e.g. a change of
  use to a parcel of land. Floor plans are not required for Agricultural Prior Notifications although
  these are recommended
must-include:
- item: Drawn to a recognised metric scale (e.g. 1:50 or 1:100)
  level: must
- item: One plan for each floor
  level: must
- item: The arrangement of rooms
  level: must
- item: Both existing and proposed changes shown
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 3. Called 'Existing and proposed floor plans,
  and existing and proposed roof plans'. 'All applications' is shown as the main application types plus
  the prior approval types other than agricultural prior notifications, which the list excludes; the list
  predates permission in principle. Not needed where the proposal does not relate to a building (e.g.
  a change of use of a parcel of land). Drawings should generally be black on white, avoiding low-contrast
  colours, hatching and artistic embellishment (see submission-standards). In conservation areas and next
  to them the council will not accept outline applications (page 5).
