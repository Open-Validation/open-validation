reference: flood-risk-assessment
local-authority: STF
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Development over 1 hectare (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Development over 1 hectare (Flood Zone 1).
  - all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
      - condition:
          field: footprint-increase
          value: true
          description: Extended ground cover.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies SD1, SD4
  and C3; Flood Risk and Coastal Change in Planning Practice Guidance
source-text: All development over 1 hectare in Flood Zone 1, and all applications for new buildings, changes
  of use, or extended ground cover, in Flood Zones 2 and 3, require the preparation of a Flood Risk Assessment
  (FRA)
confidence: medium
notes: From the council's list (adopted March 2016), page 9. The list gives no contents; it points to
  the Government's FRA guidance and says Staffordshire County Council advises on Flood Zones 1 and 2 and
  the Environment Agency on Zone 3.
review-status: unverified
field-status: {}
