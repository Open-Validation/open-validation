reference: design-and-access-statement
local-authority: STF
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Any part of the development is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: A building or buildings creating more than 100 square metres of floor space.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Part 3 of The Town and Country Planning (Development Management Procedures) (England) Order 2015
source-text: All major applications, all applications for listed building consent, and those where any
  part of the development is in a conservation area and comprises one or more dwelling houses or the provision
  of a building or buildings where the created floor space exceeds 100 square metres. Exemptions include
  applications for waste development, a material change of use, engineering or mining operations
must-include:
- item: Design principles and concepts applied
  level: must
- item: Context appraisal and how the design takes context into account
  level: must
- item: Access policy and use of local policies
  level: must
- item: Consultation on access
  level: must
- item: Specific issues affecting access and how they are addressed
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 6. Not needed for waste development, a material
  change of use, or engineering or mining operations (the national exemptions). The level of detail should
  be proportionate to the complexity of the application.
review-status: unverified
field-status: {}
