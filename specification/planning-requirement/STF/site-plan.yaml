reference: site-plan
local-authority: STF
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - s73
      - pa-extension
      - pa-storey
      - pa-demo-building
      - pa-demo-replace-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-amusements-to-dwh
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
  - all:
    - application-type:
        in:
        - non-material-amendment
    - condition:
        field: site-layout-change
        value: true
        description: Minor amendments to the site layout are proposed.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Part 3 of The Town and Country Planning (Development Management Procedures) (England) Order 2015
source-text: All applications except Agricultural Prior notifications or applications for non-material
  amendments (except where minor amendments to the site layout are proposed)
must-include:
- item: Drawn to a recognised metric scale (1:100 or 1:200) with a scale bar
  level: must
- item: Key dimensions
  level: must
- item: The direction of North
  level: must
- item: Original paper size and scale clearly marked
  level: must
- item: The relationship of the site to site boundaries and other buildings on and off the site, with
    roads, pathways etc
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 3. Called 'Existing and proposed block layout
  plan'. 'All applications' is shown as the main application types plus the prior approval types other
  than agricultural prior notifications, which the list excludes; the list predates permission in principle.
  Non-material amendments need one only where minor amendments to the site layout are proposed.
review-status: unverified
field-status: {}
