source-text: All applications except where the proposal does not relate to a building e.g. a change of
  use to a parcel of land, or where exemption is sought e.g. where no changes are proposed to a building
  (although existing elevations will still be required)
must-include:
- item: Drawn to a recognisable metric scale (e.g. 1:50 or 1:100)
  level: must
- item: Each elevation shown as it is now and with the proposed changes
  level: must
- item: The relationship with other buildings (e.g. if a semi-detached property)
  level: must
- item: Dimensions, if the plans are not to a recognisable scale
  level: should
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 4. Not needed where the proposal does not
  relate to a building. Existing elevations are still required where no changes are proposed to a building.
  ''All applications'' is shown as the main application types plus the prior approval types other than
  agricultural prior notifications, which the list excludes; the list predates permission in principle. '
