reference: sustainable-drainage-strategy
local-authority: STF
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings.
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies SD4 and
  DC1; Flood and Water Management Act 2010
source-text: All applications for development of more than 10 dwellings or equivalent non-residential
  or mixed development
must-include:
- item: Enough information for the council to consult Staffordshire County Council, as lead local flood
    authority, on the management of surface water
  level: must
- item: Enough information for the council to be satisfied that the proposed minimum standards of operation
    are appropriate
  level: must
- item: Clear arrangements for ongoing maintenance over the lifetime of the development
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 15. Called 'Sustainable Urban Drainage (SUDS)';
  continues on page 16. 'Equivalent non-residential or mixed development' has no threshold, so it is shown
  as discretionary.
review-status: unverified
field-status: {}
