submission-standards:
- item: Plans and drawings drawn to an identified scale; plans show the direction of North
  level: must
- item: A linear scale bar, particularly for electronic submissions
  level: should
- item: No drawings bearing the words 'Do Not Scale' (applications with them are made invalid)
  level: must
- item: Drawn material generally in black on a white background, avoiding low-contrast colours, hatching
    and artistic embellishment
  level: should
