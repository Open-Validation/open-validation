reference: land-contamination-assessment
local-authority: STF
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected.
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Ground works are proposed.
    - discretionary
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: sensitive-end-use
        value: true
        description: Vulnerable development (a sensitive end use such as housing, schools, allotments
          or playing fields).
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policy SD1; Part
  2A Environmental Protection Act 1990
source-text: 'All applications where contamination is known or suspected or the development is in the
  vicinity of such land and ground … works are proposed … For minor vulnerable development: where no contamination
  is suspected an environmental screening report is required. For non vulnerable development no report
  is required.'
must-include:
- item: An environmental screening report
  level: must
  required-if:
    all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: sensitive-end-use
        value: true
        description: Vulnerable development.
  source-text: 'For minor vulnerable development: where no contamination is suspected an environmental
    screening report is required.'
- item: A Phase 1 report
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Contamination is suspected or known.
  source-text: where contamination is suspected or known a Phase 1 report is required.
- item: Whether contamination exists, its nature and the risks it may pose
  level: should
- item: Whether the risks can be satisfactorily reduced to an acceptable level so the development may
    proceed and, if so, a draft methodology for achieving this
  level: should
- item: Any restrictions that should apply to the future use of the site
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 10. Continues on page 11. Development 'in the
  vicinity of' contaminated land where ground works are proposed has no set distance, so it is shown as
  discretionary. Vulnerable developments are those with a sensitive end use (housing, schools, allotments,
  playing fields etc).
review-status: unverified
field-status: {}
