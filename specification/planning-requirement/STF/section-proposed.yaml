reference: section-proposed
local-authority: STF
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change of floor level.
  - condition:
      field: new-build
      value: true
      description: The proposal involves new buildings.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
source-text: All applications involving a change of floor level and all applications involving new buildings
must-include:
- item: Drawn at 1:50 or 1:100
  level: must
- item: Both existing and finished levels
  level: must
- item: Details of foundations and eaves
  level: must
- item: The relationship to existing site levels and neighbouring development
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 4. Called 'Existing and proposed site sections
  and finished floor and site levels'.
review-status: unverified
field-status: {}
