reference: noise-assessment
local-authority: STF
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: A development that may be sensitive to noise.
  - condition:
      field: noise-generating-use
      value: true
      description: A development that may cause noise disturbance to adjacent buildings.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies SD2, SD4,
  C1 and R1; Noise Policy Statement for England (2010)
source-text: All applications for developments that may be sensitive to noise, and applications that may
  cause noise disturbance to adjacent buildings
must-include:
- item: Prepared by a suitably qualified acoustic engineer
  level: must
- item: Exposure to noise (of the development or of neighbouring properties)
  level: must
- item: Measures to mitigate the effects of noise
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 12. Called 'Noise Impact Assessment'.
review-status: unverified
field-status: {}
