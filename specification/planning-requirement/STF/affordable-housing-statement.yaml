reference: affordable-housing-statement
local-authority: STF
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: Site exceeds 0.5 hectares.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 15
      description: Net number of houses proposed exceeds 15.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies H1, H2,
  R2 and SS5; NPPF paragraphs 174 and 177
source-text: '[Size of site exceeds 0.5 hectares or net number of houses proposed exceeds 15]'
must-include:
- item: The total number of units and the number of affordable units
  level: must
- item: Bedrooms and numbers of dwellings by size to be affordable
  level: must
- item: Levels and types of affordability or tenure
  level: must
- item: Compliance with the requirements of the Homes and Communities Agency
  level: must
- item: Details of the Registered Social Landlord
  level: must
- item: Funding sources
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 6. The thresholds are printed in square brackets
  in the list. Contact the Strategic Housing Team.
review-status: unverified
field-status: {}
