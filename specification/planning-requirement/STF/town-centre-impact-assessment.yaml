reference: town-centre-impact-assessment
local-authority: STF
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or leisure development not in an existing town centre or not in accordance with
        the Core Strategy.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 square metres gross.
    - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies T1, TCR1,
  TCR2, E1, E3 and SS1; NPPF paragraphs 24-27
source-text: Required for all planning applications for retail and leisure developments over 2500 square
  metres gross, or any local floorspace threshold set by policy, that is not in an existing town centre
  or not in accordance with the Staffordshire Moorlands Core strategy Adopted March 2014
must-include:
- item: 'Impact test: the impact on existing investment within town centres'
  level: must
- item: 'Impact test: the impact on their vitality and viability'
  level: must
- item: 'Impact test: the impact on trade and turnover in the wider area'
  level: must
- item: 'Impact test: the appropriateness of the scale of the proposal'
  level: must
- item: 'Impact test: the cumulative effect of recent developments'
  level: must
- item: 'Impact test: town centre vulnerability'
  level: must
- item: 'Sequential test: whether sequentially preferable sites exist, and why they are not practicable
    in terms of availability, suitability and viability'
  level: must
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 16. Called ''Town centre uses: sequential
  test and impact test''; continues on page 17. ''Any local floorspace threshold set by policy'' is not
  stated in the list, so it is shown as discretionary.'
review-status: unverified
field-status: {}
