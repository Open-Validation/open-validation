reference: travel-plan
local-authority: STF
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 2500
      description: Non-residential development of 2,500 square metres or more.
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policy T1; NPPF paragraph
  36
source-text: All applications for developments that will generate significant amounts of transport movement
  e.g. non-residential development of [2500 square metres] or more.
must-include:
- item: A description of the location, size and type of organisation
  level: should
- item: The reason for the travel plan
  level: should
- item: Survey results, travel data, trip generation forecasts and public transport
  level: should
- item: Proposed measures, including costs
  level: should
- item: A timetable for implementation
  level: should
- item: Monitoring and review proposals
  level: should
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 18. Non-residential development of 2,500 sq
  m or more is given as an example (''e.g.'', in square brackets); other developments generating ''significant
  amounts of transport movement'' are judged case by case, and the need is agreed at pre-application stage:
  discretionary. The contents are what the plan will ''typically'' need to show, so they are shown as
  should.'
review-status: unverified
field-status: {}
