reference: location-plan
local-authority: STF
required-if:
  always: true
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Part 3 of The Town and Country Planning (Development Management Procedures) (England) Order 2015
source-text: On submission of all applications
must-include:
- item: The name of an adjacent road or roads
  level: should
- item: Drawn to an identified scale (preferably 1:1250 or 1:2500)
  level: must
- item: The direction of North
  level: must
- item: The application site edged clearly in red, including all land needed to carry out the development
    (for example access to the site from the public highway)
  level: must
- item: Other land in the ownership or control of the applicant that adjoins the site outlined in blue
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 3. Called 'Site location plan'. The preferred
  scales are 'preferably'; the road name is 'ideally', so both are shown as should.
review-status: unverified
field-status: {}
