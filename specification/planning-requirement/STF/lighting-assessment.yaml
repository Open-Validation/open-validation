reference: lighting-assessment
local-authority: STF
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policy C2; Light
  pollution in Planning Practice Guidance
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or a conservation area, or open countryside, where external
  lighting would be provided or made necessary by the development.
must-include:
- item: Details of external lighting
  level: must
- item: Hours of operation
  level: must
- item: A plan showing levels of illumination and the extent of light spillage
  level: must
- item: Prepared by a suitably qualified lighting engineer
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 12. Only publicly accessible developments 'in
  the vicinity of' residential property, a listed building, a conservation area or open countryside; there
  is no field for publicly accessible development and no set distance, so that part is discretionary.
review-status: unverified
field-status: {}
