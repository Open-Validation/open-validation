reference: waste-management-plan
local-authority: STF
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major development of 10 or more dwellings (waste storage and collection).
  - condition:
      field: new-build
      value: true
      description: New development or re-development (waste storage and collection).
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: 'Strategic development: 50 dwellings or more.'
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 10000
          description: 'Strategic development: 10,000 sq m or more of non-residential or mixed floorspace.'
    - discretionary
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policies SD1 and
  DC1; Environmental Protection Act 1990
source-text: May be required for strategic major applications i.e. those with 50 dwellings or more or
  10,000 square metres of commercial or mixed floorspace (this cannot now be mandatory but could be requested
  by the Council in relevant cases) … Applications for major developments i.e. for 10 or more dwellings,
  will be expected to demonstrate how refuse collection will be provided. … All applications for new development,
  residential conversion, … major extensions to existing buildings, re-developments, most … changes of
  use, especially those providing hospitality services
must-include:
- item: Refuse and recycling storage points, shown on scale drawings or covered in the application form
  level: must
- item: Refuse and recycling stored in an enclosed store
  level: should
- item: Enough storage space for waste and recyclable material for 14 days' output (7 days for commercial
    developments)
  level: must
- item: Access for collection
  level: must
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 19. Covers two rows: ''Waste Management Plan''
  (strategic major applications: ''May be required ... this cannot now be mandatory'', so discretionary)
  and ''Waste storage and collection plan'' (continues on page 20; the contents above come from it). Residential
  conversions, major extensions and ''most changes of use'' have no set threshold: discretionary.'
review-status: unverified
field-status: {}
