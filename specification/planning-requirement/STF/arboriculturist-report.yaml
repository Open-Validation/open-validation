reference: arboriculturist-report
local-authority: STF
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Semi-mature or mature trees within or immediately adjacent to the site (including where
        they will need to be removed).
  - all:
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: A Tree Preservation Order, or a site in a conservation area.
    - condition:
        field: tree-works
        value: true
        description: The proposal requires the removal of trees.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows protected by the Hedgerow Regulations 1997 would be removed or trimmed.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: BS 5837:2012 Trees in relation to design, demolition and construction
source-text: 'All applications where: … there are semi-mature or mature trees within or immediately adjacent
  to the application site … mature or semi-mature trees will need to be removed … there is a Tree Preservation
  Order or any proposal within a Conservation Area which requires the removal of trees … existing hedgerows
  protected by the Hedgerow Regulations 1997 would be removed or trimmed'
must-include:
- item: Prepared by a suitably qualified arboriculturalist
  level: must
- item: Survey and assessment in accordance with BS 5837:2012
  level: must
- item: Details of protection measures
  level: must
- item: Details of special foundations or techniques
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 18. Called 'Tree Survey/Arboricultural Statement'.
review-status: unverified
field-status: {}
