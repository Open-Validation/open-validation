reference: biodiversity-survey-report
local-authority: STF
required-if:
  any:
  - ref: major-development
  - condition:
      field: vacant-building
      value: true
      description: The proposal converts or demolishes redundant buildings.
  - condition:
      field: bmv-agricultural-land-loss
      operator: '>'
      value: 20
      description: Loss of more than 20 hectares of the best and most versatile agricultural land.
  - all:
    - application-type:
        in:
        - mineral-app
        - waste-dev
    - discretionary
  - condition:
      field: eia-development
      value: true
      description: The development needs an Environmental Impact Assessment.
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Section 40 of the Natural Environment and Rural Communities Act 2006; Staffordshire Moorlands
  Core Strategy Development Plan Document (March 2014) Policies C3, NE1 and SS6c
source-text: Major developments Applications that … propose the conversion or demolition of redundant
  buildings … may impact on wildlife and biodiversity or on sites of importance for nature conservation
  e.g. Sites of Special Scientific Interest, nature reserves, Staffordshire wildlife sites … involve the
  loss of more than 20 hectares of the best and most versatile agricultural land … are for minerals and
  waste developments where land will be restored to agriculture … need an Environmental Impact Assessment
must-include:
- item: Undertaken by a suitably qualified ecologist
  level: should
- item: The potential for protected species inhabiting the site or using it for recreational purposes
  level: must
- item: Protection of species during construction
  level: must
- item: Alternatives investigated where the habitat will be lost
  level: must
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 7. Called ''Biodiversity, ecosystems and green
  infrastructure (Survey and Report)''. Applications that ''may impact on wildlife and biodiversity or
  on sites of importance for nature conservation'' are judged case by case: discretionary. Minerals and
  waste developments are shown as discretionary because there is no field for ''land will be restored
  to agriculture'' (and they are decided by Staffordshire County Council). The list predates mandatory
  biodiversity net gain and has no BNG item.'
review-status: unverified
field-status: {}
