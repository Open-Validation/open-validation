reference: transport-assessment
local-authority: STF
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Staffordshire Moorlands Core Strategy Development Plan Document (March 2014) Policy T1
source-text: All major applications where there are likely to be significant transport implications
must-include:
- item: The measures to deal with the anticipated transport impacts and to improve accessibility and safety
    for all modes of travel, particularly walking, cycling and public transport
  level: must
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 17. Called ''Transport Assessment or Transport
  Statement''. Whether transport implications are ''significant'' is a judgement (Staffordshire County
  Council advises at pre-application stage whether an Assessment or Statement is needed, and a scoping
  study is required before submission), so it is shown as major and discretionary. The list quotes the
  former DfT guidance (2007) only for background: 50-80 units a statement, above 80 an assessment.'
