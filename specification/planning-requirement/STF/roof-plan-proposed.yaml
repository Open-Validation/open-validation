reference: roof-plan-proposed
local-authority: STF
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - s73
      - pa-extension
      - pa-storey
      - pa-demo-building
      - pa-demo-replace-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-amusements-to-dwh
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: The proposal changes the roofline.
    - all:
      - site:
          in:
          - conservation-area
          description: In a conservation area (or on a site next to its boundary).
      - condition:
          field: external-alterations
          value: true
          description: The proposal includes external alterations.
source-url: https://www.staffsmoorlands.gov.uk/media/271/Validation-guidance---National-and-local-list/pdf/gaValidation_guidance_-_National_and_local_lists_SMDC.pdf
policy: Part 3 of The Town and Country Planning (Development Management Procedures) (England) Order 2015
source-text: a roof plan to show any changes to the roofline … All applications must be in full and accompanied
  by detailed existing and proposed elevations, floor plans and roof plans.
must-include:
- item: Drawn to a recognised metric scale (e.g. 1:50 or 1:100)
  level: must
- item: Any changes to the roofline
  level: must
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 3. The floor plan row asks for ''a roof plan
  to show any changes to the roofline''; page 5 says that in conservation areas and on sites next to them
  all applications must have detailed existing and proposed roof plans, except a change of use with no
  external alterations. ''All applications'' is shown as the main application types plus the prior approval
  types other than agricultural prior notifications, which the list excludes; the list predates permission
  in principle. '
review-status: unverified
