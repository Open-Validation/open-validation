source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies TR3 and TR16; East Sussex County Council Travel Plans for
  development
source-text: 'A Travel Plan will be required for: Most major development, as specified by the Town and
  Country Planning (Development Management Procedure) (England) Order 2015, subject to the thresholds
  set by East Sussex County Council guidance; Any application where the proposed development is likely
  to generate significant traffic movements and have significant transport implications.'
must-include:
- item: How new occupiers or customers will use alternative means of travel not involving private vehicles
  level: should
- item: Targets and arrangements for monitoring
  level: should
confidence: medium
notes: 'From the council''s list (published October 2025), local list, page 64. Shown as discretionary:
  ''most'' major development, subject to East Sussex County Council thresholds not given in the list.
  The local list applies only to applications for planning permission and listed building consent (not
  to non-material amendments, approval of conditions, advertisement consent, lawful development certificates,
  prior approvals or TPO works), page 16.'
