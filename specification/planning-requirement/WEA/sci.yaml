reference: sci
local-authority: WEA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 200
      description: Residential development of more than 200 dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 4
      description: Residential site area of 4ha or more.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 10000
      description: More than 10,000 square metres of non-residential floor space.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 2
      description: Non-residential site area of 2ha or more.
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden District Council Statement of Community Involvement July 2020; Localism Act 2011
source-text: 'A Statement of Community Involvement (SCI) will be required for the following: Residential
  development of more than 200 dwellings or where the site area is 4ha or more; Any non-residential development
  providing more than 10,000 square metres of non-residential floor space or with a site area of 2ha or
  more; Other potentially controversial applications where the nature of the development is likely to
  attract significant local interest.'
must-include:
- item: How the applicant complied with the pre-application consultation in the Council's adopted Statement
    of Community Involvement, and how the community's views were sought and taken into account
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list (Pre-Application Engagement; Statement
  of Community Involvement), page 50, 57. Other potentially controversial applications are the council's
  discretion. Page 50 gives the non-residential threshold as 10,000 sq.m. or more. The local list applies
  only to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
review-status: unverified
