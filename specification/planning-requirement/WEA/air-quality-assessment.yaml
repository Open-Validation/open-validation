reference: air-quality-assessment
local-authority: WEA
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within, in close proximity to, or accessed through an Air Quality Management Area.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 500
      description: B8 storage and distribution use with a floorspace of 500m2 or more.
  - ref: major-development
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Core Strategy Local Plan 2013 Spatial Planning Objective SPO9; Air Quality and Emissions Mitigation
  Guidance for Sussex (2021)
source-text: 'An Air Quality Assessment will be required when a proposal, whether residential, commercial
  or of another type, has the potential to cause significant levels of air pollution, odour or any potential
  air quality matters. The submission of an Air Quality Assessment and an Emissions Mitigation Assessment
  will be required where development proposals consist of the following: Within, in close proximity to,
  or accessed through an Air Quality Management Area as defined by the local authority and indicated on
  the Department for Environment, Food and Rural Affairs'' interactive map which can be found here; In
  an area close to exceeding the Air Quality Objectives; B8 storage and distribution use class with a
  floorspace of 500m2 or more. This is included due to the transport-related movements usually associated
  with this use class; and All major development, as specified by the Town and Country Planning (Development
  Management Procedure) (England) Order 2015'
must-include:
- item: Follows the process in the 'Air Quality and Emissions Mitigation Guidance for Sussex'
  level: should
- item: An Emissions Mitigation Assessment
  level: must
  required-if:
    any:
    - site:
        in:
        - air-quality-management-area
        description: Within, near or accessed through an AQMA.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 500
        description: B8 with 500m2 or more.
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (published October 2025), local list (Air Quality Assessment & Emissions
  Mitigation Assessment), page 18-19. Sites near an AQMA or in an area close to exceeding the objectives,
  and other proposals that could cause significant air pollution or odour, are shown as the council's
  discretion. The list also says a statement showing the Sussex guidance has been consulted should be
  provided with all applications. The local list applies only to applications for planning permission
  and listed building consent (not to non-material amendments, approval of conditions, advertisement consent,
  lawful development certificates, prior approvals or TPO works), page 16.
