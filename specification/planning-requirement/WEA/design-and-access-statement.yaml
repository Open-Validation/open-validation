reference: design-and-access-statement
local-authority: WEA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: 'In a designated area: a Conservation Area or World Heritage Site.'
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement is required for certain types of planning applications. Applications
  for major development, as defined in Article 2 of the Town and Country Planning (Development Management
  Procedure (England) Order 2015; Applications for development in a designated area, where the proposed
  development consists of: one or more dwellings; or a building or buildings with a floor space of 100
  square metres or more. Applications for listed building consent.'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Shows the steps taken to appraise the context of the development and how the design takes that
    context into account
  level: must
- item: Explains the applicant's approach to access and how relevant Local Plan policies have been taken
    into account
  level: must
- item: Details any consultation on access and how its outcome informed the proposal, and how specific
    access issues have been addressed
  level: must
- item: 'For listed building consent: how the design principles take account of the building''s special
    architectural or historic importance, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent (unless the works only affect the interior): how access to the building
    has been dealt with, including alternative means of access considered'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Where planning and listed building consent applications are made in parallel: a single combined
    statement covering both'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published October 2025), section 1 (National List), page 7-8. Not needed
  for waste development, a material change of use, engineering or mining operations, or Section 73 applications
  to amend conditions.
review-status: unverified
field-status: {}
