reference: biodiversity-survey-report
local-authority: WEA
required-if:
  any:
  - all:
    - site:
        in:
        - ancient-woodland
        - special-protection-area
        - special-area-of-conservation
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Within Ancient Woodland, an SPA, SAC, SSSI, Local Nature Reserve, SNCI or County
          Wildlife Site.
    - condition:
        field: building-works
        value: true
        description: Not a change of use with no alterations.
  - condition:
      field: protected-species
      value: true
      description: May have an adverse impact on a protected species, UK Priority species or UK Priority
        habitat (NERC Act 2006 s41).
  - condition:
      field: demolition
      value: true
      description: Demolition or removal of buildings (Bat Survey; also a key development for the Biodiversity/Ecological
        Survey).
  - condition:
      field: wind-turbine
      value: true
      description: Installation and erection of wind turbines.
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies EN12, EN15 and EN29; Core Strategy Local Plan 2013 policy
  WCS12; Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017; Natural
  Environment and Rural Communities Act 2006
source-text: 'A Biodiversity/Ecological Survey and Report will be required for all planning applications
  (except change of use with no alterations) which is within or may have an effect on: Ancient Woodland;
  Special Protection Areas (SPA) including potential SPAs; Special Areas of Conservation (SAC) including
  candidate SACs; RAMSAR sites; Sites of Special Scientific Interest (SSSI); National and Local Nature
  Reserves; Sites of Nature Conservation Interest (SNCI); and County Wildlife Sites. A Biodiversity/Ecological
  Survey and Report will also be required for any application which may result in an adverse impact on
  a protected species, UK Priority species or UK Priority habitat (under Section 41 of the Natural Environment
  and Rural Communities (NERC) Act (2006)). Key developments include: Conversion of rural buildings (such
  as farm buildings); Demolition of buildings; Removal of trees and hedgerows; Development within 250m
  of a pond; Wind turbine applications. ... The submission of a Bat Survey will be required where development
  proposals consist of the following: Conversion, modification, demolition or removal of buildings. This
  is most applicable to agricultural buildings, buildings with weatherboarding and/or hanging tiles, historic/listed
  buildings, buildings located immediately adjacent to woodland and/or water; When the development affects
  building or structures with features suitable for bats. This could include alterations to roofs and/or
  lofts; The installation and erection of wind turbines; and Occasionally, applications for external lighting,
  specifically located on, or in the grounds of, churches, historic/listed buildings and green spaces
  (for example, playing fields).'
must-include:
- item: 'Where the site is within or likely to affect a designated site or priority habitat: a survey
    and assessment'
  level: must
- item: 'Where protected or priority species are reasonably likely to be present and affected: an ecological
    Phase 1/scoping report, plus any further surveys it identifies'
  level: should
- item: Mitigation, avoidance and/or compensation measures proposed where protected or priority species
    or habitats are present
  level: must
- item: Carried out by a suitably qualified ecological consultant, following the latest survey standards
    and Natural England's Standing Advice, at appropriate times of the year
  level: should
- item: 'Where European Protected Species are present and an offence would otherwise be committed: how
    the three derogation tests are met'
  level: should
- item: Information on badger setts in a separate document marked 'CONFIDENTIAL'
  level: should
- item: 'Bat Survey: the existing wildlife interest of the site and adjacent land and the possible impacts
    on them'
  level: should
- item: 'Householder Bat Survey where works affect: hanging tiles, timber cladding, weatherboarding or
    roof voids within 200m of woodland or water; pre-1960 buildings within 200m, or pre-1914 buildings
    within 400m, of woodland and/or water; pre-1914 buildings with gable ends, clay tile or slate roofs,
    hanging tiles or weatherboarding anywhere; structures with gaps around roof structures within 200m
    of woodland or water; or known current or historic bat use'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: 'Householder applications – A bat survey will be required where the proposed works will
    affect existing buildings or features with any of the following: Hanging tiles, timber cladding or
    weatherboarding, roof voids where the building is within 200m of woodland or water; Pre-1960 buildings
    or structures within 200m of woodland and/or water; Pre-1914 buildings or structures within 400m of
    woodland and/or water; Pre-1914 buildings with gable ends, traditional clay tile roofs or slate roofs,
    hanging tiles or weatherboarding regardless of location; Any structure with gaps around roof structures
    such as flashing, ridge tiles, fascia and soffit boards within 200m of woodland or water; Structures
    where there is known current or historic bat use.'
confidence: medium
notes: From the council's list (published October 2025), local list (Bat Survey; Biodiversity / Ecological
  Survey & Report), page 22-26. The list's Bat Survey and Biodiversity/Ecological Survey & Report are
  both filed here. Sites that may affect (but are not in) a designated site, Ramsar sites, National Nature
  Reserves, conversion or modification of buildings, works to buildings or structures with features suitable
  for bats (such as roofs and lofts), removal of trees and hedgerows, development within 250m of a pond,
  and external lighting near churches, listed buildings or green spaces are shown as the council's discretion.
  The list gives a table of survey seasons by species. The local list applies only to applications for
  planning permission and listed building consent (not to non-material amendments, approval of conditions,
  advertisement consent, lawful development certificates, prior approvals or TPO works), page 16.
