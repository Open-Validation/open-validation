        Notification Area.'
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policy EN19; Core Strategy Local Plan 2013 Spatial Planning Objective
  SPO2; Wealden Design Guide 2008 (adopted SPD) chapter 12
source-text: 'The submission of a Heritage Statement (1) will be required for any proposals which affect
  heritage assets (both designated and non-designated) and their setting. Specific applications will include:
  Proposals affecting any listed building, including development with the curtilage and setting of a listed
  building; Proposals affecting Scheduled Monuments and their setting; Proposals affecting the character
  and appearance of Conservation Areas and their setting; Proposals affecting registered parks and gardens
  and their setting; Proposals affecting registered battlefields; Proposals affecting protected wreck
  sites: Proposals affecting areas of known or suspected archaeological importance; and Proposals affecting
  unlisted buildings or structures of historic interest (including, but not limited to, locally listed
  heritage assets identified by the local planning authority).'
must-include:
- item: Description of the historic, cultural, aesthetic and archaeological significance of the heritage
    assets affected, and the contribution of their setting to that significance
  level: must
- item: 'For listed building consent: an analysis of the significance of archaeology, history and character
    of the building or structure'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: the principles of and justification for the works and their impact
    on the special character of the listed building, its setting, and the setting of adjacent listed buildings
    or other heritage assets'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published October 2025), local list (Heritage Statement (1) Assessment
  of Significance), page 39-40. Registered battlefields, protected wreck sites and unlisted buildings
  of historic interest are shown as the council's discretion (no field for them yet). The level of detail
  should be proportionate (flow chart at Appendix B, template at Appendix C). The local list applies only
  to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
