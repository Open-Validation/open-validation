reference: waste-management-plan
local-authority: WEA
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of a new dwelling.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New retail business; industrial, commercial or leisure uses, or other similar developments.
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies EN27, CS4 and CS5; East Sussex County Council Good Practice
  Guide for Refuse & Recycling Collections; Waste and Minerals Local Plan for East Sussex; National Planning
  Policy for Waste 2014
source-text: 'Refuse and recycling provision will be required for all development with waste arising and
  refuse collection/disposal requirements. This may include, but is not limited to, the following applications:
  Creation of a new dwelling; New retail business; Industrial, commercial or leisure uses, or other similar
  developments; and All major development, as specified by the Town and Country Planning (Development
  Management Procedure) (England) Order 2015 ... A Waste Minimisation Statement &/or a Waste Audit Statement
  will be required for: All major development, as specified by the Town and Country Planning (Development
  Management Procedure) (England) Order 2015.'
must-include:
- item: How, as part of the overall design, refuse and recycling will be stored and collected
  level: must
- item: That the proposal meets current waste and recycling requirements and is flexible to adapt to future
    needs
  level: must
- item: Provision to prevent litter from commercial premises
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Commercial premises.
- item: 'Major development, Waste Minimisation / Waste Audit Statement: sustainable procurement measures
    to minimise construction waste'
  level: should
  required-if:
    ref: major-development
- item: 'Major development: types and quantities of demolition and construction waste, and how it will
    be managed under the waste hierarchy'
  level: should
  required-if:
    ref: major-development
- item: 'Major development: types and quantities of operational waste, and how it will be managed under
    the waste hierarchy'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published October 2025), local list (Refuse & Recycling Provision; Waste
  Minimisation Statement &/or Waste Audit Statement), page 54, 69. Both list entries are filed here. Other
  development with waste arising is the council's discretion. Major development also needs a Refuse Vehicle
  Tracking Plan (unmapped). The local list applies only to applications for planning permission and listed
  building consent (not to non-material amendments, approval of conditions, advertisement consent, lawful
  development certificates, prior approvals or TPO works), page 16.
review-status: unverified
field-status: {}
