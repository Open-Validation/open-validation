reference: proposed-habitat-plan
local-authority: WEA
required-if:
  all:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition (BNG applies).
  - any:
    - ref: major-development
    - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Environment Act 2021; Schedule 7A, Town and Country Planning Act 1990; Biodiversity Gain (Town
  and Country Planning) (Consequential Amendments) Regulations 2024
source-text: 'Major development and applications providing significant onsite BNG: Same requirements listed
  above for all applications where BNG applies, plus A draft biodiversity gain plan (to include an annotated
  map showing indicative areas or proposed habitat enhancement/creation). It is recommended the DEFRA
  biodiversity gain plan template is used.'
must-include:
- item: A draft biodiversity gain plan with an annotated map showing indicative areas of proposed habitat
    enhancement or creation
  level: must
- item: Uses the DEFRA biodiversity gain plan template
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list (Biodiversity Net Gain), page 28.
  The list asks for a draft biodiversity gain plan; it is filed here as the closest id. 'Applications
  providing significant onsite BNG' is shown as the council's discretion (no field for it yet). The same
  applications need a draft habitat management and monitoring plan (unmapped). The local list applies
  only to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
