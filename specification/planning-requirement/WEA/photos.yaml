reference: photos
local-authority: WEA
required-if:
  any:
  - condition:
      field: biodiversity-gain-condition
      value: false
      description: The applicant believes the development is exempt from the biodiversity gain condition
        (including the de minimis exemption).
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
source-text: Photographs are useful to include in all applications, but are particularly important for
  retrospective applications and listed building consent applications. ... Site photographs to show its
  condition at the time of submitting the application. Photographs should be clear, include the whole
  site and should include any trees on site. This requirement for photographs also applies if you are
  claiming an exemption based on the de minimis threshold.
must-include:
- item: 'For a claimed BNG exemption (including de minimis): clear photographs of the whole site showing
    its condition at submission, including any trees'
  level: should
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: false
      description: The applicant believes the development is exempt from the biodiversity gain condition
        (including the de minimis exemption).
- item: 'Works to listed buildings: photographs of all areas of the building (internal and external) where
    works are proposed, cross-referenced to the drawings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Important views into, within and out of the Conservation Area, or towards and from the listed
    building
  level: should
  required-if:
    site:
      in:
      - conservation-area
      - listed-building
      description: In a conservation area or affecting a listed building.
confidence: medium
notes: From the council's list (published October 2025), local list (Biodiversity Net Gain; Photographs
  / Photomontages), page 29, 50. Photographs are required evidence for a claimed BNG exemption. Otherwise
  the list says they are 'not a policy requirement' but 'particularly important' for retrospective and
  listed building consent applications, so those show as the council's discretion. The local list applies
  only to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
