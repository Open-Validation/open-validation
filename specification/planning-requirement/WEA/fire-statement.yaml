reference: fire-statement
local-authority: WEA
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Fire Statement must be included for all applications for full planning permission which
  involve: provision of one or more relevant buildings, or development of an existing relevant building
  or development within the curtilage of a relevant building.'
must-include:
- item: On a form published by the Secretary of State (or a form substantially to the same effect), including
    the particulars specified or referred to in the form
  level: must
confidence: medium
notes: From the council's list (published October 2025), section 1 (National List), page 10. A relevant
  building contains 2 or more dwellings or educational accommodation and is 18m or more in height or 7
  or more storeys. Work to an existing relevant building, or in its curtilage, also needs one.
review-status: unverified
field-status: {}
