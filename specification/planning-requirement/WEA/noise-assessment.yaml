reference: noise-assessment
local-authority: WEA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Activities that may generate significant noise next to noise-sensitive uses, or high-noise
        uses such as noisy sports or industrial/commercial machinery.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development (hospitals, schools, residential, excluding householder)
        next to major noise sources.
  - condition:
      field: food-or-drink-use
      value: true
      description: Restaurants/cafes which may have potentially noisy extract systems.
  - condition:
      field: plant-equipment
      value: true
      description: Air conditioners/condensers and all applications for plant installation.
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: 'Wealden Local Plan 1998 saved policy EN27; Planning Noise Advice Document: Sussex'
source-text: 'A Noise Impact Assessment will be required for all development proposals that have the potential
  to cause adverse noise impacts, including: Any application for development or use that involves activities
  that may generate significant levels of noise adjacent to existing noise sensitive uses (for example,
  residential development, schools and hospitals); Proposals that generate high levels of noise such as
  noisy sports, industrial and/or commercial developments using noisy machinery, for example joinery workshops
  and refrigeration plant and equipment; Any application for noise sensitive development (for example,
  hospitals, schools and residential development (excluding householder development)) adjacent to major
  sources of noise, including roads, railways, commercial and/or industrial sources; Restaurants/cafes
  which may have potentially noisy extract systems; Air conditioners/condensers; and All applications
  for plant installation.'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The existing noise environment, noise sources from or affecting the development, and mitigation
    measures
  level: should
- item: 'New homes next to busy roads and other transport routes: follows PPG-Noise / ProPG so Good Acoustic
    Design is integrated from the outset'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: New residential development next to busy roads or other transport routes.
confidence: medium
notes: From the council's list (published October 2025), local list (Noise Impact Assessment), page 47.
  The local list applies only to applications for planning permission and listed building consent (not
  to non-material amendments, approval of conditions, advertisement consent, lawful development certificates,
  prior approvals or TPO works), page 16.
review-status: unverified
