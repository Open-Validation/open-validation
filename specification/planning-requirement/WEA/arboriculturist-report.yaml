reference: arboriculturist-report
local-authority: WEA
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on or adjacent (within 15m) to the proposed development, even if not protected.
  - site:
      in:
      - ancient-woodland
      description: Trees forming part of Ancient Woodland.
  - condition:
      field: veteran-trees
      value: true
      description: Ancient or veteran trees.
  - site:
      in:
      - tree-preservation-zone
      description: Trees protected by a Tree Preservation Order.
  - all:
    - site:
        in:
        - conservation-area
        description: Trees protected by their location in a Conservation Area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or next to the site.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies EN12 and EN13; Wealden Design Guide 2008 (adopted SPD)
  chapters 3 and 10; BS 5837:2012
source-text: 'A Tree Survey and associated Arboricultural Assessment will be required where trees are:
  On or adjacent (within 15m) to the proposed development (even if not protected); Form part of Ancient
  Woodland or are ancient or veteran trees; Protected by a Tree Preservation Order; or Protected by their
  location within a Conservation Area.'
must-include:
- item: Tree survey by a suitably qualified arboriculturist in full accordance with BS 5837:2012
  level: should
- item: Tree root protection zones clearly marked on a scale plan
  level: should
- item: How root protection, level changes, services and similar factors were considered in the design,
    with no significant adverse impact on important trees, and future pressure to prune or remove
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list (Tree Survey / Arboricultural Impact
  Assessment), page 65. The list also gives items to consider in an AIA (levels, surfacing, services,
  demolition, shading, construction access, storage, replacement planting, fauna). The local list applies
  only to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
review-status: unverified
field-status: {}
