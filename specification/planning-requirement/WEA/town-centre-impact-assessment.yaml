reference: town-centre-impact-assessment
local-authority: WEA
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses on sites outside town centres (new development, redevelopment,
      extensions, changes of use, or variations creating more floorspace or changing the goods sold).
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies BS3, BS4, BS7, BS8, BS9 and BS14; Core Strategy Local Plan
  2013 Spatial Planning Objectives SPO4, SPO6 and SPO7
source-text: 'A Retail Assessment will be required for planning applications which propose main town centre
  uses, on sites outside of town centres, including: New development; Redevelopment of existing facilities;
  Extensions to existing facilities; Changes of use involving development; Applications to vary or remove
  existing planning conditions, which would have the effect of creating additional floorspace e.g. mezzanine
  floor, or changing the range of goods sold; and Retail and Leisure development outside town centres
  which is not in accordance with the local plan, an assessment of development will be required for development
  over 2500m2 of gross floorspace (threshold as stated in para 89 of the NPPF).'
must-include:
- item: 'For retail and leisure over 2,500m2 gross outside town centres and not in accordance with the
    local plan: an impact assessment'
  level: must
  required-if:
    all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure development over 2,500m2 gross floorspace.
    - discretionary
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: should
- item: Impact on town centre vitality and viability, including local consumer choice and trade in the
    centre and wider retail catchment
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list (Retail Assessment – Town Centre Uses),
  page 55. 'Not in accordance with the local plan' is shown as the council's discretion. The local list
  applies only to applications for planning permission and listed building consent (not to non-material
  amendments, approval of conditions, advertisement consent, lawful development certificates, prior approvals
  or TPO works), page 16.
review-status: unverified
field-status: {}
