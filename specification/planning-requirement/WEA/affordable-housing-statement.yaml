reference: affordable-housing-statement
local-authority: WEA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 (net) or more dwellings.
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: Within an AONB (National Landscape).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 (net) or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A site of 0.5 hectares or more, regardless of the number of dwellings.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies HG5, HG11 and HG12; Affordable Housing Delivery Local Plan
  2016 policy AFH1
source-text: 'The submission of an Affordable Housing Statement will be required for the following development:
  Where a proposal is for 10 (net) or more dwellings; or Where a proposal is for 5 (net) or more dwellings
  within an AONB, or Where the proposal is on a site of 0.5 hectares or more regardless of the number
  of dwellings'
must-include:
- item: Number and mix of residential units, including numbers of habitable rooms or bedrooms and proposed
    number of occupants
  level: must
- item: Habitable floorspace of the proposed units
  level: must
- item: A plan showing the location of the units
  level: must
- item: Any different levels or types of affordability or tenure for different units, clearly and fully
    explained
  level: must
- item: Details of any Registered Social Landlords acting as partners, if determined
  level: must
- item: 'If an existing building is redeveloped: the size in m2 of the existing building and of the proposed
    development, including any remodelling'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: An existing building is being redeveloped.
- item: A viability appraisal if the proposal does not comply with policy
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published October 2025), local list, page 18. Affordable housing is required
  at 35% of the number of dwellings unless local policies say otherwise. The local list applies only to
  applications for planning permission and listed building consent (not to non-material amendments, approval
  of conditions, advertisement consent, lawful development certificates, prior approvals or TPO works),
  page 16.
review-status: unverified
field-status: {}
