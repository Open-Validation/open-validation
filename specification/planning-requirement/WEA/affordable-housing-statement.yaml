reference: affordable-housing-statement
local-authority: WEA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more net dwellings.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 or more net dwellings.
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: Within an AONB.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Sites of 0.5ha or more.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
source-text: 10 or more net dwellings; 5 or more within an AONB; or sites of 0.5ha+
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the NPPF definition of affordable housing instead of
  the thresholds. It also applies to outline applications.'
review-status: unverified
field-status: {}
