reference: planning-statement
local-authority: WEA
required-if:
  any:
  - ref: major-development
  - condition:
      field: involves-change-of-use
      value: true
      description: Changes of use.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Developments that do not accord with the development plan.
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: 'National Planning Practice Guidance: Planning obligations'
source-text: 'The submission of a Planning Statement will be required for all applications where the context
  and justification for a proposed development needs to be demonstrated. This may include, but is not
  limited to, the following applications: All major development, as specified by the Town and Country
  Planning (Development Management Procedure) (England) Order 2015; Changes of use; and Developments that
  do not accord with the development plan.'
must-include:
- item: Description of the site (access, existing uses, landscape, ecological and built features) and
    its surroundings, including relevant designations or constraints
  level: should
- item: Description of the proposed development and a summary of its impacts (activities, hours, phases,
    dimensions, appearance, vegetation affected, planting)
  level: should
- item: Reference to relevant national and development plan policies and guidance, and how the proposal
    accords with them
  level: should
- item: 'Where justification and need are material: why the applicant considers there is a valid need'
  level: should
  required-if: discretionary
- item: How the proposal meets the three dimensions of sustainable development and how negative effects
    are mitigated and positive effects enhanced
  level: should
- item: 'For variations of conditions / minor material amendments: what changes are proposed and why'
  level: should
  required-if:
    application-type:
      in:
      - s73
- item: Details of pre-application discussions and wider consultation with the community and statutory
    consultees
  level: should
- item: Summary of the conclusions and recommendations of reports submitted, and which are and are not
    being taken forward and why
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list, page 51-52. Other applications that
  need their context and justification shown are the council's discretion. It could include a Statement
  of Community Involvement. The local list applies only to applications for planning permission and listed
  building consent (not to non-material amendments, approval of conditions, advertisement consent, lawful
  development certificates, prior approvals or TPO works), page 16.
review-status: unverified
field-status: {}
