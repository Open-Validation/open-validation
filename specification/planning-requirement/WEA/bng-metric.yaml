reference: bng-metric
local-authority: WEA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition (BNG applies).
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Environment Act 2021; Schedule 7A, Town and Country Planning Act 1990; Biodiversity Gain (Town
  and Country Planning) (Consequential Amendments) Regulations 2024
source-text: 'a biodiversity metric showing the pre-development biodiversity value of the onsite habitat
  on the date of application; ... All applications where BNG applies: National Validation Requirements;
  A completed Wealden District Council BNG Statement (Appendix G); BNG Metric or Small Sites Metric'
must-include:
- item: Statutory Biodiversity Metric or Small Sites Metric showing the pre-development biodiversity value
    of the onsite habitat on the date of application
  level: must
- item: In an editable Excel format with macros enabled, not a PDF or screenshots
  level: should
- item: Includes draft post-development creation and enhancement values for habitat, hedge and watercourse
    units
  level: should
- item: 'Statutory Biodiversity Metric: undertaken by a suitably qualified professional ecologist able
    to identify and map UKHab habitat types'
  level: must
- item: 'Statutory Biodiversity Metric: accompanied by all condition assessments for every habitat parcel
    that needs a condition in the metric tool'
  level: must
- item: 'Small Sites Metric: undertaken by at least a ''competent person'' able to identify and map the
    UKHab habitat types it uses'
  level: must
- item: Statement confirming whether the biodiversity value of the onsite habitat is lower on the date
    of application because of activities carried out ('degradation')
  level: must
- item: Description of any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (published October 2025), section 1 (National List) and local list, page
  11-12, 27-28. Applicants must also say on the application form whether they believe the biodiversity
  gain condition applies, and if not why. The council's own BNG Statement (Appendix G) is listed in the
  unmapped requirements.
review-status: unverified
field-status: {}
