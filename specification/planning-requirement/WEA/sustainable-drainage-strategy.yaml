- item: Takes account of advice from the lead local flood authority (East Sussex County Council)
  level: should
- item: Appropriate proposed minimum operational standards, and maintenance arrangements for the lifetime
    of the development
  level: should
- item: Where possible, multifunctional benefits
  level: should
- item: Any area where the outfall involves a ditch, pipe or headwall included within the red line (with
    the correct notice and ownership certificate if not all owned by the applicant)
  level: should
- item: 'Major development: attenuates flows up to and including the 1 in 100 year plus 40% rainfall event,
    with an allowance for urban creep'
  level: should
  required-if:
