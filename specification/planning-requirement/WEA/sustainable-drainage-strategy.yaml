policy: Wealden Local Plan 1998 saved policies EN27 and CS2; CIRIA The SuDS Manual (C753, 2015); Flood
  and Water Management Act 2010
source-text: 'A Surface Water Drainage Strategy will be required for: All major development, as specified
  by the Town and Country Planning (Development Management Procedure) (England) Order 2015. All applications
  requiring new or changed foul or surface water drainage systems (for example, new buildings, extensions,
  increased hard surfacing and changed topography). ... Sustainable Drainage and Sustainable Urban Drainage
  Systems will be required for: All major development ... Minor development where new floorspace or hardstanding
  is proposed will be required to complete and submit a SuDS Decision Support Tool for Small Scale Development
  where the development is: In flood zone 2 or 3 In an area of groundwater flood risk In an area of surface
  water flood risk Householder development in urban areas where new floorspace or hardstanding is proposed
  will be required to complete and submit a SuDS Decision Support Tool for Small Scale Development where
  the development is: In flood zone 2 or 3 In an area of groundwater flood risk In an area of surface
  water flood risk'
must-include:
- item: 'Minor development with new floorspace or hardstanding in flood zone 2 or 3, or an area of groundwater
    or surface water flood risk: the completed SuDS Decision Support Tool for Small Scale Development'
