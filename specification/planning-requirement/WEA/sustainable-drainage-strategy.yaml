confidence: medium
notes: From the council's list (published October 2025), local list (Surface Water Drainage Strategy;
  Sustainable Drainage / SuDS) and Appendix D, page 59-61, 93. Both list entries are filed here. The list
  gives new buildings, extensions, more hard surfacing and changed topography as examples of needing new
  or changed drainage. Groundwater flood risk areas and the Pevensey Levels catchment are shown as the
  council's discretion (no map field yet). The strategy is in addition to any Flood Risk Assessment; the
  list recommends East Sussex County Council's pre-application advice. The local list applies only to
  applications for planning permission and listed building consent (not to non-material amendments, approval
  of conditions, advertisement consent, lawful development certificates, prior approvals or TPO works),
  page 16.
