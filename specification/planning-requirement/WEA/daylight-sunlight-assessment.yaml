policy: Wealden Local Plan 1998 saved policy EN27; BS 8206 Part 2 (2008)
source-text: A Daylight/Sunlight Assessment will be required for all applications where the development
  is likely to have an adverse impact on the current levels of daylight/sunlight enjoyed by adjacent properties
  or buildings, including associated gardens and amenity space.
must-include:
- item: Assessment of the impact on potential loss of daylight and sunlight
  level: should
- item: A plan of the extent of overshadowing
  level: should
confidence: medium
notes: 'From the council''s list (published October 2025), local list, page 33. Shown as discretionary:
  it depends on the likely impact, and the list says the need may only become clear after the officer''s
  site visit. The local list applies only to applications for planning permission and listed building
  consent (not to non-material amendments, approval of conditions, advertisement consent, lawful development
  certificates, prior approvals or TPO works), page 16.'
