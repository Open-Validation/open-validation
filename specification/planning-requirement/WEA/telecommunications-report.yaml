reference: telecommunications-report
local-authority: WEA
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications development, including prior approval under Part 16 of the GPDO.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: NPPF section 10
source-text: Telecommunication Information will be required for any application for telecommunications
  development (including for prior approval under Part 16 of the General Permitted Development Order).
must-include:
- item: A declaration that the equipment and installation fully comply with the ICNIRP requirements
  level: must
- item: Area of search
  level: must
- item: A map showing the site's relationship to schools and other telecommunications equipment nearby
  level: must
- item: Reasons for the choice of design
  level: must
- item: 'Technical information: frequency, modulation characteristics, power output and antenna height'
  level: must
- item: 'Technical justification: the purpose of the site and why this development is needed'
  level: must
- item: Alternative sites rejected and why, including existing masts, structures and buildings in the
    search area, or why none were considered
  level: must
- item: Visual impact assessment where relevant
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published October 2025), local list (Telecommunications Information),
  page 62. A tree survey and arboricultural assessment is also needed where significant trees could be
  affected.
review-status: unverified
field-status: {}
