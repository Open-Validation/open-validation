reference: lighting-assessment
local-authority: WEA
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Any development including floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting.
    - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies EN27 and EN29; ILP Guidance Note 01/20
source-text: A Lighting Assessment will be required for all applications for development where the development
  is likely to result in a material increase in levels of light pollution or likely to be visible off
  site (for example, light spill), particularly proposals involving floodlighting and lighting in rural
  areas.
must-include:
- item: A layout plan with beam orientation
  level: should
- item: A schedule of equipment, with technical specification designed to minimise or prevent nuisance
    from lighting
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list, page 46. Other external lighting
  (a significant amount, near homes, listed buildings, conservation areas or open countryside, or lighting
  that may affect bats) is shown as the council's discretion. The local list applies only to applications
  for planning permission and listed building consent (not to non-material amendments, approval of conditions,
  advertisement consent, lawful development certificates, prior approvals or TPO works), page 16.
review-status: unverified
field-status: {}
