reference: energy-statement
local-authority: WEA
required-if:
  ref: major-development
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policy EN1; Core Strategy Local Plan 2013 Spatial Planning Objectives
  SPO2, SPO7 and SPO9
source-text: 'The submission of an Energy Statement will be required where development proposals consist
  of the following: All major development, as specified by the Town and Country Planning (Development
  Management Procedure) (England) Order 2015.'
must-include:
- item: How overall energy use will be minimised and, if appropriate, how low and zero carbon energy sources
    are used
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list, page 34-35. The list says the statement
  'could' also give energy demand and carbon calculations, and proposals to cut carbon through design,
  decentralised energy and on-site renewables. The local list applies only to applications for planning
  permission and listed building consent (not to non-material amendments, approval of conditions, advertisement
  consent, lawful development certificates, prior approvals or TPO works), page 16.
