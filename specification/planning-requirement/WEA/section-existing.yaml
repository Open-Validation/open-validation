policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Full information should be submitted to demonstrate how any new building(s) will relate in
  scale, height and situation to neighbouring development, both on the site and outside it. This should
  normally be in the form of cross-sections and/or long sections drawn at a scale of 1:100 or 1:200 to
  show the proposal in context with adjoining or adjacent buildings.
must-include:
- item: Cross-sections and/or long sections at 1:100 or 1:200 showing the proposal in context with adjoining
    or adjacent buildings
  level: should
