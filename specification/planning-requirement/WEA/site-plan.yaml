reference: site-plan
local-authority: WEA
required-if: discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Most applications should include an existing block plan and a proposed block plan.
must-include:
- item: Scale typically 1:500 or 1:200, with the direction of North identified
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site; for a diversion, the existing and proposed
    route
  level: should
- item: Position of all trees on the site and on adjoining land
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing where proposed
  level: should
- item: If the site area is edged in red, it matches the Site Location Plan
  level: must
confidence: medium
notes: 'From the council''s list (published October 2025), section 1 (Additional Plans), page 9, 13. Shown
  as discretionary: the list says ''each application is assessed individually'' and that ''most applications''
  should include existing and proposed block plans. The ''should'' items apply unless they would not influence
  or be affected by the development.'
