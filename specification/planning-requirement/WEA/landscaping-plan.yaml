reference: landscaping-plan
local-authority: WEA
required-if:
  any:
  - ref: major-development
  - condition:
      field: landscaping-works
      value: true
      description: Soft and/or hard landscaping is to be undertaken.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies EN14 and EN27; Core Strategy Local Plan 2013 Spatial Planning
  Objective SPO13; Wealden Design Guide 2008 (adopted SPD) chapters 7 and 8
source-text: The submission of landscaping details will be required for All major development, as specified
  by the Town and Country Planning (Development Management Procedure) (England) Order 2015; and All applications
  for development where soft and/or hard landscaping is to be undertaken.
must-include:
- item: A plan of the proposed external works, hard and soft landscaping and other landscape features
    (trees and planting, flood management measures, roads and paths, fencing and walls, screening, noise
    bunds); can be on the proposed site plan
  level: should
- item: An evaluation of the importance of existing landscape features and how the proposal maintains
    and enhances the area and mitigates negative impacts
  level: should
- item: Measures to retain existing landscape features (e.g. important trees and hedges) or encourage
    natural regeneration
  level: should
- item: 'Planting specifications: soil preparation, planting method, spacing, seed types, species, stock
    size, protection/support, timing'
  level: should
- item: Evidence the ground is suitable for the planting scheme (soil type and condition)
  level: should
- item: Construction details and materials for landscape features such as hedge banks, walls, fencing
    and surfacing
  level: should
- item: Ongoing management of planting and landscaping, including replacement of failures and the aftercare
    period
  level: should
confidence: medium
notes: From the council's list (published October 2025), local list (Landscaping Details), page 45-46.
  The scheme should be proportionate to the size of the scheme and its impacts. Outline applications may
  give less detail, with full details at reserved matters or by condition. The local list applies only
  to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
review-status: unverified
field-status: {}
