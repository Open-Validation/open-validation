reference: viability-assessment
local-authority: WEA
required-if:
  any:
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: loss-of-use
        value: true
        description: Loss of, or reduction in, a community facility (leisure or entertainment venue, open
          space, pub, village shop, bank or Post Office), a tourist facility or employment space.
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Core Strategy Local Plan 2013 Spatial Planning Objectives SPO4 and SPO8; RICS guidance
source-text: 'A Viability and Marketing Statement will be required for: Any application for a change of
  use which involves the loss of, or a reduction in: A community facility (including a leisure or entertainment
  venue, open space, public house, village shop, bank or Post Office); A tourist facility; or Employment
  space. Any application for the conversion of an agricultural building to a residential use indicating
  the consideration of alternative uses; and Any application that involves or consists of the loss of
  a designated or non-designated heritage asset, on the grounds of redundancy and economic viable repair.'
must-include:
- item: 'Marketing evidence for the building or enterprise in its current use or use class: timing of
    the marketing'
  level: must
- item: Period and means of marketing (normally at least 12 months with an agent relevant to the type
    of building or use)
  level: must
- item: Asking price (normally with valuations from 3 relevant agents reflecting the current or other
    authorised uses)
  level: must
- item: Extent of land included and the nature of the interest marketed / terms of sale
  level: must
- item: 'Change of use of holiday accommodation: letting records and marketing for holiday purposes over
    at least one year'
  level: must
  required-if: discretionary
- item: 'Loss of village or town services or facilities: 2 years'' trading accounts and a survey of alternative
    services or facilities nearby'
  level: should
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Loss of village or town services or facilities.
- item: 'Conversion of a historic agricultural building: evidence of no agricultural need, and (for residential
    use) costings of conversion to employment or tourism uses, with costs (no purchase cost) and income
    including an annualised asset value'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published October 2025), local list (Viability & Marketing Statement),
  page 66-67. Conversion of agricultural buildings to homes, loss of heritage assets on grounds of redundancy,
  holiday accommodation, and other changes argued on viability grounds are shown as the council's discretion
  (no field yet). The list advises discussing the scope at pre-application stage. The local list applies
  only to applications for planning permission and listed building consent (not to non-material amendments,
  approval of conditions, advertisement consent, lawful development certificates, prior approvals or TPO
  works), page 16.
review-status: unverified
field-status: {}
