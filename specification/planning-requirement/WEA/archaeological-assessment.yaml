reference: archaeological-assessment
local-authority: WEA
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: Works affecting areas of known archaeological importance (Archaeological Notification
        Areas).
  - ref: major-development
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policy EN19; Core Strategy Local Plan 2013 Spatial Planning Objective
  SPO2; East Sussex County Council Sussex Archaeological Standards 2019
source-text: 'The submission of a Heritage Statement (2) will be required, unless the applicant has written
  advice from the County Archaeologist specifying the report is not required, where development proposals
  consist of the following: Works affecting areas of known archaeological importance or that have the
  potential to include heritage assets with archaeological interest; and All major development, as specified
  by the Town and Country Planning (Development Management Procedure) (England) Order 2015.'
must-include:
- item: As a minimum, the relevant Historic Environment Record (HER) consulted, with an HER consultation
    report where required
  level: should
- item: 'For development likely to have significant effects: a Desk-Based Assessment and/or the results
    of field evaluation'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published October 2025), local list (Heritage Statement (2) Archaeological
  Report), page 40-41. Not needed if the applicant has written advice from the County Archaeologist that
  it isn't required. Sites with potential for archaeological interest (outside a known area) are shown
  as the council's discretion. The local list applies only to applications for planning permission and
  listed building consent (not to non-material amendments, approval of conditions, advertisement consent,
  lawful development certificates, prior approvals or TPO works), page 16.
review-status: unverified
field-status: {}
