reference: cil-form
local-authority: WEA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development of one or more dwellings (including holiday lets), by new build
        or conversion, even under 100m2.
  - condition:
      field: residential-annexe
      value: true
      description: A residential annexe.
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 100
      description: Additional residential floorspace (extensions, loft conversions, outbuildings, conservatories,
        garages) of 100m2 or over.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 100
      description: Retail development with a floorspace of 100m2 or over.
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Core Strategy Local Plan 2013 policy WCS7; Wealden CIL Charging Schedule 2015; Community Infrastructure
  Levy Regulations
source-text: 'The following types of development will be liable to pay CIL and therefore will be required
  to submit the appropriate forms: Residential development of one or more dwellings (including holiday
  lets and residential annexes) through new build or conversion, even if the floorspace is less than 100m2;
  The creation of additional residential floorspace by way of house extensions, loft conversions and other
  ancillary buildings, for example outbuildings, conservatories and garages, if 100m2 or over (or less
  than 100m2 if it contributes to the creation of a new dwelling); and Retail development with a floorspace
  of 100m2 or over.'
must-include:
- item: 'Form 1: CIL Additional Information, completed before validation'
  level: must
- item: 'For major development: a list of all house types and their floor areas'
  level: should
  required-if:
    ref: major-development
- item: 'For major development: a list of any ancillary buildings (detached garages, car ports, etc.)
    and their floor areas'
  level: should
  required-if:
    ref: major-development
- item: 'For major development: a plan showing the location of each house type and any associated buildings'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published October 2025), local list (Community Infrastructure Levy), page
  32-33. In Wealden only residential and retail development pays CIL. Exemption and relief claim forms
  (Forms 7 to 10) are needed before determination, not for validation. The local list applies only to
  applications for planning permission and listed building consent (not to non-material amendments, approval
  of conditions, advertisement consent, lawful development certificates, prior approvals or TPO works),
  page 16.
review-status: unverified
field-status: {}
