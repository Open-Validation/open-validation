reference: location-plan
local-authority: WEA
required-if:
  always: true
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A 'site location plan' is a plan that shows the application site in relation to the surrounding
  area. The scale should typically be 1:1250 or 1:2500, and wherever possible the plan should be scaled
  to fit onto A4 or A3 size paper.
must-include:
- item: Scale typically 1:1250 or 1:2500, scaled to fit A4 or A3 paper wherever possible
  level: should
- item: Based on an up-to-date map, with the direction of North identified
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location clear (in remote rural
    areas a Grid Reference if roads cannot be shown)
  level: should
- item: Application site edged clearly with a solid red line
  level: should
- item: Red line includes ALL land needed to carry out the development (e.g. access from a public highway,
    visibility splays, landscaping, car parking, open areas around buildings, and land for outfall drainage
    such as ditches, pipes or headwalls)
  level: should
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
confidence: medium
notes: From the council's list (published October 2025), section 1 (National List), page 9.
review-status: unverified
field-status: {}
