reference: roof-plan-existing
local-authority: WEA
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: Any alteration to an existing roof, including rooflights or dormers.
  - all:
    - condition:
        field: new-build
        value: true
        description: New development.
    - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof plans are required for any proposed alteration to an existing roof (including installation
  of rooflights or dormers), or for any new development proposing a complex or unusual roof structure.
must-include:
- item: Clear labelling showing the direction of the roof slopes
  level: should
- item: Roofing material proposed and locations of any equipment to be installed on the roof
  level: should
confidence: medium
notes: From the council's list (published October 2025), section 1 (Additional Plans), page 15. 'A complex
  or unusual roof structure' on new development is shown as the council's discretion.
