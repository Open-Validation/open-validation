reference: recreation-facilities-assessment
local-authority: WEA
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space, or loss (or loss of use for sport) of a major sports facility.
  - site:
      in:
      - open-space
      description: Development on open space (public or private), or on or affecting a playing field or
        sports facility.
  - ref: major-development
  - discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies EN18, EN27, LR1, LR2, LR3, LR4, LR5 and LR7; Core Strategy
  Local Plan 2013 Spatial Planning Objective SPO11 and policy WCS13; Wealden Design Guide 2008 (adopted
  SPD) chapters 7 and 8; Sport England Playing Fields Policy
source-text: 'An Open Space Assessment will be required for any development that results in the loss and/or
  creation of open space. ... A Playing Field and/or Sports Provision Assessment will be required in cases
  where development might lead to: Loss of, or loss of use for sport of, any major sports facility; Applications
  on, or affecting, a playing field or sports facility; Proposals which lead to the loss of use for sport
  of a major body of water; Creation of a sports facility; Creation of a site for playing pitches; and
  Engineering operations in relation to the use for sport.'
must-include:
- item: Plans showing existing or proposed open space within or adjoining the site
  level: should
- item: That the land has been assessed and is surplus to requirements, or that lost open space is replaced
    by equivalent or better provision (quantity, quality and location)
  level: should
- item: 'For alternative sports or recreational provision: that the need for it outweighs the loss of
    the existing provision'
  level: must
  required-if: discretionary
- item: 'Playing fields: plans of existing and proposed marked pitches (winter and summer) with safety
    margins'
  level: should
  required-if:
    site:
      in:
      - open-space
      description: On or affecting a playing field.
- item: 'Playing fields: what the playing field is used for, when and by whom; the amount affected and
    whether usable'
  level: should
  required-if:
    site:
      in:
      - open-space
      description: On or affecting a playing field.
- item: 'Playing fields: a statement of need justifying the loss; alternative sites considered and why
    discounted; whether a Sport England policy exception is met'
  level: should
  required-if:
    site:
      in:
      - open-space
      description: On or affecting a playing field.
confidence: medium
notes: From the council's list (published October 2025), local list (Open Space Assessment; Playing Field
  / Sports Provision Assessment), page 48, 53-54. Both list entries are filed here. Creation of open space,
  sports facilities or pitches, engineering for sport and loss of a water body used for sport are shown
  as the council's discretion (no field yet). Major development is one of the list's examples. Consult
  Sport England early for playing fields. The local list applies only to applications for planning permission
  and listed building consent (not to non-material amendments, approval of conditions, advertisement consent,
  lawful development certificates, prior approvals or TPO works), page 16.
review-status: unverified
field-status: {}
