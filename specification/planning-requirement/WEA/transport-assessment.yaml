reference: transport-assessment
local-authority: WEA
required-if: discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Wealden Local Plan 1998 saved policies TR3 and TR16; East Sussex County Council guidance on Transport
  Assessments / Statements / Reports
source-text: 'Therefore, a TA, TS or TR will be required for: All developments that are likely to generate
  significant levels of movements to and from the site; Proposals which either by themselves or cumulatively
  with development of which the application is part, are likely to cause significant harm as a result
  of existing road capacity or safety problems in the area; Proposals that are likely to significantly
  increase pollution and/or noise as a result of traffic generation, or cause pollution levels in Air
  Quality Management Areas to exceed guideline levels; Proposals that would generate a material increase
  in traffic entering or using any motorways, trunk roads or other primary routes; and Proposals that
  would impact on the bus network.'
must-include:
- item: All existing and proposed commercial and residential vehicular and pedestrian movements to and
    from the site
  level: should
- item: Loading areas and arrangements for manoeuvring, servicing and parking
  level: should
- item: Existing transport conditions, how the development would affect them, and measures to overcome
    problems, including highway improvement works
  level: should
confidence: medium
notes: 'From the council''s list (published October 2025), local list (Transport Assessment, Statement
  or Report), page 63-64. Shown as discretionary: every trigger depends on ''significant'' or ''material''
  impact, and thresholds come from East Sussex County Council guidance, not the list. Ask National Highways
  early about trunk roads (A27, A259, A26, A21). The local list applies only to applications for planning
  permission and listed building consent (not to non-material amendments, approval of conditions, advertisement
  consent, lawful development certificates, prior approvals or TPO works), page 16.'
