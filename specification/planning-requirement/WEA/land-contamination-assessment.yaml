reference: land-contamination-assessment
local-authority: WEA
required-if:
  any:
  - all:
    - site:
        in:
        - contaminated-land
        description: Sites where contamination is known or suspected, or in the vicinity of such land.
    - condition:
        field: ground-disturbance
        value: true
        description: Ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development with a sensitive end use (a Preliminary Risk Assessment as a minimum, whatever
        the site history).
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: 'NPPF section 15; Environment Agency Land contamination: technical guidance'
source-text: A Land Contamination Assessment will be required for any application relating to sites where
  contamination is known or suspected, or the development is in the vicinity of such land, and ground
  works are proposed.
must-include:
- item: Carried out by a Competent Person (NPPF Annex 2)
  level: must
- item: A desk study listing current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Contamination known or suspected, or nearby.
- item: A preliminary conceptual site model (all pollutant linkages) and a preliminary risk assessment
    of them
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Contamination known or suspected, or nearby.
- item: 'For a sensitive end use: as a minimum a Preliminary Risk Assessment (PRA)'
  level: must
  required-if:
    condition:
      field: sensitive-end-use
      value: true
      description: Sensitive end use.
- item: A Site Investigation and Risk Assessment and Remediation Strategy, depending on the site and end
    use
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published October 2025), local list, page 44-45. The list gives examples:
  new buildings or ground works on land at risk of contamination (former industrial or commercial land,
  historic landfill), residential garden land, playing fields and quarries known to be heavily contaminated,
  and redevelopment of farm buildings. The local list applies only to applications for planning permission
  and listed building consent (not to non-material amendments, approval of conditions, advertisement consent,
  lawful development certificates, prior approvals or TPO works), page 16.'
review-status: unverified
field-status: {}
