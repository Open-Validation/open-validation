reference: elevation-existing
local-authority: WEA
required-if: discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In most cases, two separate sets of elevation drawings will be required, existing elevations
  showing the building as it is now and proposed elevations showing how the building will look, after
  the works have been carried out.
must-include:
- item: Drawn to a scale of 1:50 or 1:100, showing the proposed works in relation to what already exists
  level: should
- item: All sides of the proposal shown, including blank elevations
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each'
  level: should
  required-if: discretionary
- item: Details (windows, doors, etc.) match the floor plans
  level: must
confidence: medium
notes: 'From the council''s list (published October 2025), section 1 (Additional Plans), page 9, 13. Shown
  as discretionary: elevations are needed ''in most cases'' and each application is assessed individually.'
