reference: habitat-baseline
local-authority: WEA
required-if:
  any:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition (BNG applies).
  - condition:
      field: biodiversity-gain-condition
      value: false
      description: The applicant believes the development is exempt from the biodiversity gain condition
        (including the de minimis exemption).
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Environment Act 2021; Schedule 7A, Town and Country Planning Act 1990; Biodiversity Gain (Town
  and Country Planning) (Consequential Amendments) Regulations 2024
source-text: 'a plan showing onsite habitat existing on the date of application. ... Exempt development:
  Where an applicant believes that their development is exempt, the following evidence to justify exemption
  will be required. 1:500 site or block plan, with existing habitat annotated, using UKHab habitat classification,
  consistent with statutory BNG metric terminology.'
must-include:
- item: Onsite habitat existing on the date of application
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition (BNG applies).
- item: 'For a claimed exemption: a 1:500 site or block plan with existing habitat annotated using the
    UKHab classification, consistent with statutory BNG metric terminology'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: false
      description: The applicant believes the development is exempt from the biodiversity gain condition
        (including the de minimis exemption).
confidence: medium
notes: From the council's list (published October 2025), section 1 (National List) and local list, page
  11-12, 29. For a claimed exemption the list also asks for site photographs (see photos) and, for self-build
  or custom build, the council's Self/Custom Build Statement (Appendix H, unmapped).
