reference: floor-plan-existing
local-authority: WEA
required-if: discretionary
source-url: https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/Wealden-District-Council-Validation-Requirements-October-2025-1-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In most cases, two separate sets of floor plans will be required: existing floor plans showing
  the building as it is now and proposed floor plans showing how the building will look, after the works
  have been carried out.'
must-include:
- item: Drawn to a scale of 1:50 or 1:100
  level: should
- item: Layout of the building, including the location of all door and window openings
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Buildings or walls are to be demolished.
- item: New buildings shown in context with adjacent buildings, including property numbers where applicable
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: New buildings.
- item: 'For a change of use with internal physical changes: the existing use(s) and the extent and nature
    of the proposed change'
  level: should
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Change of use involving physical changes internally.
confidence: medium
notes: 'From the council''s list (published October 2025), section 1 (Additional Plans), page 9, 14. Shown
  as discretionary: floor plans are needed ''in most cases'' and each application is assessed individually.'
review-status: unverified
field-status: {}
