reference: biodiversity-survey-report
local-authority: TAM
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: semi-natural-habitat-impact
        value: true
        description: In areas of semi-natural habitat (including brownfield sites) above 25 sq m.
  - condition:
      field: protected-species
      value: true
      description: Protected species are known to be present.
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - special-area-of-conservation
      - special-protection-area
      description: Within or adjacent to a designated conservation site.
  - any:
    - condition:
        field: potential-roost-features
        value: true
        description: Development (including demolition) that could affect roosting bats or nesting birds.
    - condition:
        field: roof-space-room
        value: true
        description: Works within the roof space of an existing building.
    - condition:
        field: involves-change-of-use
        value: true
        description: The conversion of a building (e.g. a barn or mill).
    - condition:
        field: near-watercourse
        value: true
        description: Development adjacent to rivers, canals, streams or other large water bodies.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 15; UDP Policies N1a, N1b, N2, N3, N6 and N7; PfE Policy JP-G8
source-text: Major and minor development in areas of semi-natural habitat (including brownfield sites)
  above 25sqm; Where protected species are known to be present; If the proposal is within or adjacent
  to a designated conservation site
must-include:
- item: Bat and bird surveys by a suitably qualified ecologist (which may need a building and a post-emergence
    survey)
  level: must
  required-if:
    any:
    - condition:
        field: potential-roost-features
        value: true
        description: Development (including demolition) that could affect roosting bats or nesting birds.
    - condition:
        field: roof-space-room
        value: true
        description: Works within the roof space of an existing building.
    - condition:
        field: involves-change-of-use
        value: true
        description: The conversion of a building (e.g. a barn or mill).
    - condition:
        field: near-watercourse
        value: true
        description: Development adjacent to rivers, canals, streams or other large water bodies.
  source-text: Applications for development (including demolition) that would have the potential to affect
    roosting bats or nesting birds. Works within the roof space of an existing building The conversion
    fo a building (Eg Barn or Mill) All development adjacent to to rivers, canals streams or other large
    water body.
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 5, 9-10. Called
  'Ecology Survey' (an Ecological/Geological Survey and Assessment); the separate 'Bat & Bird Surveys'
  item (page 5) is folded in as a part. Existing environmental information may be available from the Greater
  Manchester Ecology Unit.
review-status: unverified
field-status: {}
