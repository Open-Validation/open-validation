reference: noise-assessment
local-authority: TAM
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Potentially noise generating development (pubs, clubs, takeaways, industrial/commercial
          uses, recreation).
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Near existing noise sensitive development (homes, schools, hospitals).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive uses near existing noise generating uses, classified roads, railways
        or in a noisy environment.
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Mixed use with noise generating uses.
    - condition:
        field: mixed-use
        value: true
        description: And noise sensitive uses.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Commercial applications with extractor or cooling units.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Near noise sensitive development.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 15; UDP Policy MW12
source-text: Potentially noise generating developments (i.e. pubs, clubs, takeaways, industrial/commercial
  uses, recreation) in the vicinity of existing noise sensitive developments - residential, schools and
  hospitals; Noise sensitive uses in the vicinity of existing noise generating uses, classified roads,
  railways or in areas with an existing noisy environment such as the city centre; Mixed use applications
  comprising both noise generating and noise sensitive uses; Commercial applications including extractor
  or cooling units in the vicinity of noise sensitive developments
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The existing noise environment, the noise sources from or affecting the development, and mitigation
  level: should
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 15. The method
  and scope should be agreed with Environmental Health first.
review-status: unverified
field-status: {}
