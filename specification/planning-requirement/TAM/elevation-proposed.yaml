reference: elevation-proposed
local-authority: TAM
required-if:
  any:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - hh
      - lbc
      - pa-build-agri-forest
      - advertising
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://tameside.gov.uk/planning/consultation/fullplanningconsent
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 3 copies (unless submitted electronically) of good quality drawings must be submitted which
  provide full information about site layout , internal arrangements and all elevations, both existing
  and proposed, and , where appropriate, a contextual drawing, e.g. the street scene.
must-include:
- item: 'For advertisements: the advertisement''s size, position on the land or building, materials, colours,
    height above ground and extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: 3 copies of good quality drawings must be submitted which provide full information about
    the advertisement showing its size, position on the land or building, materials to be used, colours,
    height above ground and extent of projection.
- item: 'For illuminated advertisements: full details of the method of illumination, including the colour'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated.
  source-text: If the advertisement is to be illuminated you must give full details of the method of illumination
    including the colour.
- item: 'For advertisements: plans showing the advertisements in context with adjacent buildings'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For agricultural prior notification: at a scale of not less than 1:100'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
confidence: medium
notes: From the council's 'Local List Full Applications' checklist (approved 23 July 2025). The full,
  outline, reserved matters, householder and listed building checklists ask for drawings of the site layout,
  internal arrangements and all elevations, existing and proposed; the section 73 checklist says plans
  'may be required'. The agricultural building prior notification checklist asks for existing and proposed
  elevations and floor plans at not less than 1:100. The advertisement checklist asks for drawings of
  the advertisement.
review-status: unverified
field-status: {}
