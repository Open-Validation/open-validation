reference: recreation-facilities-assessment
local-authority: TAM
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: The loss of open space, playing fields, sports and recreation facilities, bowling greens,
        allotments etc.
  - all:
    - ref: major-development
    - discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: UDP Policies OL4, OL6 and OL14; PfE Policy JP-G6
source-text: Development involving the loss of open space, playing fields, sports and recreation facilities,
  bowling greens, allotments etc. Major development which may place additional pressures on local open
  space and recreation facilities.
must-include:
- item: A statement of how the facility will be affected, when it was last used and by whom
  level: must
- item: A site plan clearly showing the layout of the existing facilities
  level: must
- item: A proposed site plan showing how the development is likely to affect the existing facilities
  level: must
- item: Details of replacement facilities and/or improvements where there is an identified local deficiency
  level: must
- item: Future management and maintenance arrangements for any proposed facilities
  level: must
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 15-16. Called 'Open
  Space Assessment'. Major development that 'may place additional pressures' is shown as discretionary.
review-status: unverified
field-status: {}
