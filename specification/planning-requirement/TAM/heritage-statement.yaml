reference: heritage-statement
local-authority: TAM
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building-setting
      - scheduled-monument
      description: Affecting the setting of a listed building or ancient monument.
  - site:
      in:
      - conservation-area
      description: Sites within a conservation area.
  - site:
      in:
      - locally-listed-building
      description: Involving or affecting non-designated heritage assets (buildings of notable local heritage
        value).
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: On or adjoining a site of archaeological interest.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: ground-disturbance
          value: true
          description: Ground disturbance.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: PfE Policy JP-P2; UDP Policies C2 to C10; NPPF Chapter 16
source-text: Applications for Listed Building Consent and Conservation Area Consent Applications affecting
  setting of a listed building or ancient monument Applications on sites located within a conservation
  area. Applications involving or affecting non-designated heritage assets (buildings of notable local
  heritage value) Any proposal on or adjoining a site of archaeological interest that includes new buildings
  or ground disturbance.
must-include:
- item: 'For listed building consent: a schedule of works; the significance of archaeology, history and
    character of the building; the principles of and justification for the works and their impact on the
    building, its setting and adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For demolition or significant alteration of an historic building: a structural survey and an
    archaeological assessment/building appraisal'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition or significant alteration of an historic building.
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 13. The listed
  building checklist also says a Heritage Statement must be submitted.
review-status: unverified
field-status: {}
