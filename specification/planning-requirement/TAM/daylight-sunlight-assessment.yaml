reference: daylight-sunlight-assessment
local-authority: TAM
required-if:
  any:
  - condition:
      field: tall-building
      value: true
      description: A new tall building at least 2 storeys above the prevailing local building height.
  - discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 12; UDP Policy MW12; Tameside Residential Design Guide policy RED5
source-text: All new tall building developments that is at least 2 storeys above the prevailing local
  building height All new developments where daylight and sunlight to existing sensitive uses within the
  vicinity would be affected by that development. Any development which is not compliant with policy RED5
  of the Tameside Residential Design Guide.
must-include:
- item: Prepared by a suitably qualified person
  level: should
- item: The potential for overshadowing and the effect on existing sensitive uses nearby, with any mitigation
  level: should
- item: Following the method in the latest edition of the BRE guide 'Site layout planning for daylight
    and sunlight'
  level: should
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 9. Where daylight
  and sunlight to existing sensitive uses 'would be affected', or a development does not comply with policy
  RED5, is shown as discretionary.
review-status: unverified
field-status: {}
