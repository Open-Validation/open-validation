reference: land-contamination-assessment
local-authority: TAM
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected due to the nature of the previous use of the site.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable.
    - discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 15; UDP Policies MW3, MW10 and MW12
source-text: Where contamination is known or suspected due to the nature of the previous use of the site
  or the proposed use would be particularly vulnerable
must-include:
- item: 'A Phase 1 study: desk study, site walkover and initial risk assessment'
  level: must
- item: A Phase 2 site investigation and risk assessment where the Phase 1 study reveals potential for
    contamination
  level: must
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 8. Not needed where
  the applicant shows the site was remediated, the remediation verified and the development will not undermine
  it. A particularly vulnerable proposed use is shown as discretionary. The householder checklist also
  asks for details of any works against land contamination risk (gas protection membranes, garden cover
  systems).
review-status: unverified
field-status: {}
