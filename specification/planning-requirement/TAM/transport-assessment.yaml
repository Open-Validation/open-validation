reference: transport-assessment
local-authority: TAM
required-if: discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 9; UDP Policies T11 and T14
source-text: 'Major traffic generating development proposals (as defined in Warrington Design Guidance
  Note DGN3: Transport Assessments) Proposals which either by themselves or cumulatively with development
  of which the application is part, is likely to cause significant harm as a result of existing road capacity
  or safety problems in the area Proposals that are likely to significantly increase pollution and/ or
  noise as a result of traffic generation; or cause pollution levels in Air Quality Management Areas to
  exceed guideline levels Proposals that would generate a material increase in traffic entering or using
  any motorways, trunk roads or other primary routes; and Proposals that would impact on the bus network'
must-include:
- item: How accessible the development is by all modes of transport
  level: should
- item: Whether the site access can accommodate the predicted traffic
  level: should
- item: Impacts on the wider highway network, including existing and proposed infrastructure
  level: should
- item: Transport impact mitigation measures
  level: should
- item: Measures to encourage walking, cycling and public transport
  level: should
confidence: medium
notes: 'From the council''s Validation Checklist July 2025 (approved 23 July 2025), page 18-19. Shown
  as discretionary: ''major traffic generating'' is defined by an outside guidance note (Warrington DGN3)
  and the other triggers (''likely to cause significant harm'', ''material increase'') have no thresholds.'
