reference: site-plan
local-authority: TAM
required-if:
  any:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://tameside.gov.uk/planning/consultation/fullplanningconsent
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 3 copies (unless submitted electronically) of good quality drawings must be submitted which
  provide full information about site layout , internal arrangements and all elevations, both existing
  and proposed, and , where appropriate, a contextual drawing, e.g. the street scene.
must-include:
- item: Clearly marked with unique reference numbers and clearly dimensioned, including dimensions to
    boundaries
  level: must
- item: Existing vehicular and pedestrian access points, proposed access points, visibility splays and
    gradients, and existing and proposed vehicle parking areas
  level: must
- item: Any proposal to close or divert an existing right of way, with the route of the diversion
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
- item: Existing site levels and proposed floor and site levels
  level: must
- item: Trees and shrubs to be removed or retained, and new landscaping including new trees and shrubs
  level: must
- item: All new boundary treatments such as fences and walls
  level: must
- item: Which building materials are to be used and where
  level: must
- item: Refuse storage and collection arrangements, where appropriate
  level: must
- item: How disabled people will be accommodated
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - lbc
- item: 'For listed building consent: a block plan at a scale of not less than 1:500 showing the site
    boundaries, all existing buildings and the new extensions and buildings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: 3 copies (unless submitted electronically) of a block plan to a scale of not less than
    1:500 must be submitted showing the boundaries of the site, the position of all existing buildings
    and the position of new extensions and buildings.
confidence: medium
notes: From the council's 'Local List Full Applications' checklist (approved 23 July 2025). The full,
  outline, reserved matters, householder and listed building checklists ask for drawings of the site layout,
  internal arrangements and all elevations, existing and proposed; the section 73 checklist says plans
  'may be required'. The drawing contents apply to all of the drawings.
review-status: unverified
field-status: {}
