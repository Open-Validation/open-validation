reference: town-centre-impact-assessment
local-authority: TAM
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside defined centres.
  - any:
    - all:
      - condition:
          field: settlement-type
          value: ashton-under-lyne
          description: Ashton under Lyne.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1750
          description: Above 1,750 sq m.
    - all:
      - condition:
          field: settlement-type
          value: denton
          description: Denton.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1250
          description: Above 1,250 sq m.
    - all:
      - condition:
          field: settlement-type
          value: hyde
          description: Hyde.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1250
          description: Above 1,250 sq m.
    - all:
      - condition:
          field: settlement-type
          value: droylsden
          description: Droylsden.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 750
          description: Above 750 sq m.
    - all:
      - condition:
          field: settlement-type
          value: stalybridge
          description: Stalybridge.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 750
          description: Above 750 sq m.
    - all:
      - condition:
          field: settlement-type
          value: hattersley
          description: Hattersley.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 750
          description: Above 750 sq m.
    - all:
      - condition:
          field: settlement-type
          value: mossley
          description: Mossley.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: Above 500 sq m.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 7; PfE Policy JP-P4; UDP Policy S3
source-text: 'Impact Assessment for retail and leisure developments outside of defined centres and above
  the following thresholds: Ashton under Lyne — 1,750sqm Denton — 1,250sqm Hyde — 1,250sqm Droylsden —
  7,50sqm Stalybridge — 7,50sqm Hattersley — 750sqm Mossley — 500sqm'
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment area
  level: should
- item: The impact on town centre vitality and viability, including local consumer choice and trade
  level: should
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 17-18. Called 'Retail
  Impact Assessment & Sequential Approach'. The list prints the Droylsden and Stalybridge thresholds as
  '7,50sqm', read here as 750 sq m (as for Hattersley).
review-status: unverified
field-status: {}
