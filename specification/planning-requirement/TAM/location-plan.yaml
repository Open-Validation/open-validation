reference: location-plan
local-authority: TAM
required-if:
  always: true
source-url: https://tameside.gov.uk/planning/consultation/fullplanningconsent
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 3 copies (unless submitted electronically) of a clear, scaled Ordnance Survey based location
  plan must be submitted with at least two (if practicable) named roads, the house numbers of all adjacent
  properties and the direction of north shown. The application site must be edged clearly with a red line
  and a blue line must be drawn around any other land owned by the applicant.
must-include:
- item: Clear, scaled and based on an Ordnance Survey map
  level: must
- item: At least two named roads (if practicable)
  level: must
- item: The house numbers of all adjacent properties
  level: must
- item: The direction of north
  level: must
- item: The application site edged clearly with a red line; a blue line around any other land owned by
    the applicant
  level: must
- item: 'For advertisements: the proposed position of the advertisement'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: the proposed position of the advertisement
- item: 'For hedgerow removal: a plan at a scale of not less than 1:2500 showing the location and length
    of the hedgerow to be removed and the existing ground levels'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: 3 copies (unless submitted electronically) of a plan at a scale of not less than 1:2500
    indicating the location and length of the hedgerow to be removed and the existing ground levels.
confidence: medium
notes: From the council's 'Local List Full Applications' checklist (approved 23 July 2025). Every per-type
  checklist asks for this location plan (3 copies unless submitted electronically).
review-status: unverified
field-status: {}
