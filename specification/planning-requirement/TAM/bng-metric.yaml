reference: bng-metric
local-authority: TAM
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the biodiversity gain condition (not exempt).
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: Environment Act 2021; PfE Policy JP-G8; Article 7 of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015
source-text: Major and minor development (excluding householder) in areas of semi-natural habitat (including
  brownfield sites) above 25sqm;
must-include:
- item: The pre-development biodiversity value of the on-site habitat on the date of application (or an
    earlier date), with the completed metric calculation tool, the publication date and version of the
    metric used
  level: must
- item: Where an earlier date is used, that date and the reasons for it
  level: must
- item: A statement whether the on-site value is lower because of degradation, and supporting evidence
    if so
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: 'From the council''s Validation Checklist July 2025 (approved 23 July 2025), page 5-6. Shown for
  applications subject to the biodiversity gain condition, as the law sets: the list names major and minor
  development (excluding householder) in semi-natural habitat above 25 sq m. Where an applicant believes
  the condition does not apply, a statement of reasons is required (listed as unmapped).'
review-status: unverified
field-status: {}
