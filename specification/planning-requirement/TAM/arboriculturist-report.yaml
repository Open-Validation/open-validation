reference: arboriculturist-report
local-authority: TAM
required-if:
  all:
  - any:
    - condition:
        field: building-works
        value: true
        description: Building work.
    - all:
      - condition:
          field: engineering-operations
          value: true
          description: An engineering operation.
      - condition:
          field: ground-disturbance
          value: true
          description: Involving ground excavation.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees located on or within 10m of the site.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: Town and Country Planning (Trees) Regulations 2012; UDP Policies N4 and N5; PfE Policy JP-G7
source-text: Any planning application for building work or an engineering operation involving ground excavation
  where three are trees located on or within 10m of the site.
must-include:
- item: Prepared in accordance with BS5837
  level: should
- item: Trees scheduled for removal clearly shown on the proposal plans
  level: should
- item: A Tree Constraints Plan showing root protection areas, and a Tree Protection Plan
  level: should
- item: 'For householder applications with excavation within 10m of trees: the position and spread of
    the trees on the plans, with species and approximate age'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 19. Called 'Tree
  Survey & Arboricultural Impact Assessment'. An Arboricultural Method Statement and/or Impact Statement
  may also be requested.
review-status: unverified
field-status: {}
