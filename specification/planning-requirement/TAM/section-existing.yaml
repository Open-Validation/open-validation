reference: section-existing
local-authority: TAM
required-if:
  any:
  - ref: major-development
  - condition:
      field: change-in-ground-levels
      value: true
      description: A sloping site.
  - all:
    - condition:
        field: engineering-operations
        value: true
        description: Engineering operations.
    - condition:
        field: site-level-change
        operator: '>'
        value: 0
        description: Involving a change in level.
  - application-type:
      in:
      - lbc
      - advertising
      - pa-build-agri-forest
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: UDP Policies C1 and H10
source-text: All major developments All proposals where there is a sloping site Engineering Operations
  involving a change in level
must-include:
- item: Changes in levels shown on a block plan with spot levels, finished floor levels and roof heights
    as appropriate
  level: should
- item: Finished floor levels and roof heights shown on elevations and on all cross sections
  level: should
- item: 'For advertisements: at a scale of not less than 1:100'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 18. Called 'Topographical
  Plan / Site Section'. The listed building, advertisement and agricultural building prior notification
  checklists also ask for sections (and the full, outline and householder checklists for existing site
  levels and proposed floor and site levels on the drawings).
review-status: unverified
field-status: {}
