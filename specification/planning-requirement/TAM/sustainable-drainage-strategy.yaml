reference: sustainable-drainage-strategy
local-authority: TAM
required-if:
  ref: major-development
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 14; UDP Policy U4; PfE Policy JP-S4
source-text: Major Developments
must-include:
- item: An assessment showing how the proposed SuDS would work and be maintained, with measures to avoid
    water contamination and safeguard groundwater supply
  level: should
- item: If SuDS are not possible, a statement explaining why
  level: should
- item: Where connecting to an existing drainage system, details of that system on the drawings
  level: should
- item: Full details of the phasing and long-term management and maintenance arrangements (including funding)
  level: should
- item: A foul drainage assessment where foul sewage is not disposed of to the public sewer
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Foul sewage disposal other than to the public sewer.
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 12-13. Called 'Foul
  & Surface Water Drainage Details (SUDS)'.
review-status: unverified
field-status: {}
