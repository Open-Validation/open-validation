reference: fire-statement
local-authority: TAM
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Development comprising of 2 or more dwellings or educational accommodation within a building
  which is 18m or more in height or 7 or more storeys.
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 11-12. The guidance
  repeats the national form contents.
review-status: unverified
field-status: {}
