reference: viability-assessment
local-authority: TAM
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: Section 106 planning obligations will not be met in full because of the scheme's viability.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF; UDP Policies H4, H5, H6 and T13
source-text: Any application where s106 planning obligations will not be met in full as a result of the
  schemes viability.
must-include:
- item: An open book approach showing development costs and revenue in detail
  level: should
- item: 'Where the applicant wants it kept confidential: a statement saying so and a redacted version
    for the public'
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: The applicant wants the information kept confidential.
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 20. The council
  has it independently reviewed at the applicant's cost; the scope should be agreed at pre-application
  stage.
review-status: unverified
field-status: {}
