reference: waste-management-plan
local-authority: TAM
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: Greater Manchester Joint Waste Development Plan Documents
source-text: All significant major applications
must-include:
- item: The amount and type of waste the site will generate
  level: must
- item: Measures to reduce, re-use and recycle waste, including on-site separation and treatment facilities
  level: must
- item: An assessment of the potential to re-use or adapt existing buildings (explaining why any demolished
    cannot be kept)
  level: must
- item: Design and layouts for sorting and storing recyclables, composting and waste collection
  level: must
- item: Measures to minimise raw materials and pollution
  level: must
- item: How residual waste will be disposed of and transported, during construction and beyond
  level: must
- item: Construction and design measures that minimise raw materials and encourage recycled or secondary
    materials
  level: must
- item: How the development will be monitored after completion
  level: must
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 20. 'Significant'
  major applications is not defined, so it is shown as major development and discretionary. The per-type
  checklists call it 'Site Waste Management Plan'.
review-status: unverified
field-status: {}
