reference: sustainability-statement
local-authority: TAM
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential schemes.
  - condition:
      field: involves-change-of-use
      value: true
      description: Non-residential schemes including changes of use.
  - all:
    - condition:
        field: residential-extension
        value: true
        description: Domestic extensions.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Above 100 sq m.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 14; PfE Policies JP-S2 and JP-S3
source-text: Residential development Non-residential schemes including changes of use Domestic extensions
  above 100sqm
must-include:
- item: How the development would minimise resource and energy consumption compared with the Building
    Regulations minimum
  level: should
- item: How it is located and designed to withstand the longer term impacts of climate change
  level: should
- item: How it would incorporate decentralised, renewable or low carbon energy sources sufficient to reduce
    carbon dioxide emissions
  level: should
- item: 'Follows the energy hierarchy: minimise demand, maximise efficiency, renewable energy, low carbon
    energy, other sources'
  level: should
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 10-11. Called 'Energy/Sustainability
  Statement'.
review-status: unverified
field-status: {}
