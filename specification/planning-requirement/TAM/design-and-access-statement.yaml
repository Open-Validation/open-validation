reference: design-and-access-statement
local-authority: TAM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: involves-change-of-use
          value: false
          description: The application is not a change of use.
      - condition:
          field: external-alterations
          value: true
          description: The proposal includes external alterations.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: The property is a listed building or is in a conservation area.
source-url: https://www.tameside.gov.uk/planning/local-list-full-applications
source-text: A Design and Access Statement must be submitted (unless the application is for a change of
  use with no external alterations)
confidence: medium
notes: 'Audit (wrong_app_type): the workbook filed this under prior approval; it is on the Full-applications
  list. From the audit: the Householder list also asks for a Design and Access Statement where the property
  is a listed building or in a conservation area. The workbook''s excerpt ran on into the disabled-access
  drawing rule (now under floor-plan-proposed).'
review-status: unverified
field-status: {}
