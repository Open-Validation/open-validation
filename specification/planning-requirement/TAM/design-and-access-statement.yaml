reference: design-and-access-statement
local-authority: TAM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Not a change of use with no external alterations.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: The property is a Listed Building or in a Conservation Area.
  - application-type:
      in:
      - lbc
source-url: https://tameside.gov.uk/planning/consultation/fullplanningconsent
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Design and Access Statement must be submitted (unless the application is for a change of
  use with no external alterations)
must-include:
- item: A Building for a Healthy Life assessment, answering each of the 12 considerations with a justification
    (or as a standalone document)
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential schemes (10 or more units).
  source-text: Major residential schemes (10 or more units)
- item: A response to the 10 characteristics of well-designed places in the National Design Guide
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 80
      description: Large scale major residential developments of 80+ dwellings.
  source-text: Large scale major residential developments of 80+ dwellings
confidence: medium
notes: From the council's 'Local List Full Applications' checklist (approved 23 July 2025). The householder
  checklist asks for one where the property is a Listed Building or in a Conservation Area; the listed
  building checklist always. The Building for a Healthy Life and National Design Guide assessments come
  from the guidance notes (pages 6-7), which say they go in the Design and Access Statement.
review-status: unverified
field-status: {}
