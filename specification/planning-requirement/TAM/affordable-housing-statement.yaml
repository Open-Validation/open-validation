reference: affordable-housing-statement
local-authority: TAM
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: Residential schemes of 10 or more units.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 5; UDP Policy H4; PfE Policy JP-H2
source-text: Residential schemes of 10 or more units.
must-include:
- item: Total number of all residential units proposed
  level: must
- item: The percentage of affordable housing
  level: must
- item: 'A schedule of accommodation: unit sizes (sqm) to NDSS standards, plot numbers of affordable units,
    proposed standard of accessibility and car parking space(s) per affordable unit'
  level: must
- item: A layout plan with each affordable unit highlighted, a key showing the proposed tenure and justification
    for the locations
  level: must
- item: Details of design and proposed quality standards of build
  level: must
- item: Details of any Registered Provider acting as a partner
  level: must
- item: Proposed ongoing housing management, i.e. transfer to a Registered Provider
  level: must
- item: Anticipated OMV and transfer value of each affordable property (if applicable)
  level: must
- item: Proposed phasing of delivery and occupation, on sites delivered over more than one phase
  level: must
- item: Arrangements to keep the provision affordable for first and future occupiers, or for the subsidy
    to be recycled for alternative affordable housing in the Borough
  level: must
- item: Where Vacant Building Credit is to be applied, it is included in the statement
  level: should
  required-if:
    condition:
      field: vacant-building
      value: true
      description: Vacant Building Credit is to be applied.
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 3-4. The guidance
  says policy requires 15% affordable housing on all sites. Where the full contribution cannot be met,
  a viability assessment is needed.
review-status: unverified
field-status: {}
