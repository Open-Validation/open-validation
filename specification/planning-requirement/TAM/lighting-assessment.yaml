reference: lighting-assessment
local-authority: TAM
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Artificial lighting is introduced.
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illumination or digital screens.
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: UDP Policy MW12
source-text: Proposals introducing artificial lighting into any sensitive context, normally close to residential
  development or sites of nature conservation value or which may impact on protected species or priority
  species; Applications for advertisement consent including proposals for illumination or use of digital
  screens.
must-include:
- item: Undertaken by a suitably qualified person
  level: must
- item: 'Details of the proposed lighting: lux contour plan, lighting hours and full equipment specification'
  level: should
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 14-15. A 'sensitive
  context' (normally near homes, nature sites or protected species) is shown as discretionary.
review-status: unverified
field-status: {}
