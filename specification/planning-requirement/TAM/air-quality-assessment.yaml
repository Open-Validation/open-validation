reference: air-quality-assessment
local-authority: TAM
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within or adjacent to an Air Quality Management Area.
  - discretionary
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 10; UDP Policy MW14
source-text: Sites within or adjacent to an Air Quality Management Area (AQMA) or where a development
  would result in air quality issues e.g. glass recycling, concrete works, sewage treatment works
must-include:
- item: Existing air quality, the likely impact of traffic or other emission sources, mitigation, public
    exposure to air pollution and measures to limit that exposure
  level: should
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 4. 'Where a development
  would result in air quality issues' is shown as discretionary. The scope and method should be agreed
  with TMBC Environmental Health first.
review-status: unverified
field-status: {}
