reference: planning-statement
local-authority: TAM
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Departures.
  - application-type:
      in:
      - s73
source-url: https://tameside.gov.uk/documents/d/guest/local-validation-requirements-july-2025-pdf
policy: NPPF Chapter 4
source-text: All major developments Departures Proposals to vary/remove a condition
must-include:
- item: The relevant national, regional and local policies and guidance, and how the development relates
    to them
  level: should
- item: Details of pre-application discussions
  level: should
- item: A summary of the other technical documents submitted
  level: should
- item: 'For a variation or removal of a condition: why the condition cannot be met or is no longer justified'
  level: should
  required-if:
    application-type:
      in:
      - s73
- item: 'For Gypsy, Traveller and Travelling Showpeople sites: how the applicant meets the planning definitions,
    the number of pitches and local need, pitch design, site management, and any business on the site'
  level: must
confidence: medium
notes: From the council's Validation Checklist July 2025 (approved 23 July 2025), page 16-17. The listed
  building checklist also asks for a supporting planning statement with a reasoned justification for the
  works.
review-status: unverified
field-status: {}
