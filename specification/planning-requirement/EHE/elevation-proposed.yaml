reference: elevation-proposed
local-authority: EHE
required-if:
  any:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - advertising
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - ldc
    - condition:
        field: external-alterations
        value: true
        description: The proposal has external changes (changes of use or certificates of lawfulness with
          no external changes are excluded).
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 43; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 (as amended)
source-text: All applications excluding applications for changes of use or certificates of lawfulness
  with no external changes and S73 applications.
must-include:
- item: Drawings at a scale of 1:50, 1:100 or 1:200
  level: must
- item: All relevant external parts, including side elevations
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings,
    with the relative positions of openings, parapets and levels on each property'
  level: should
- item: Structures to be demolished highlighted, and the relationship to neighbouring buildings
  level: must
- item: Blank elevations included for clarity
  level: should
- item: No 'do not scale' disclaimer and no applicant's name on the plans
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 4-5. N9. Not needed for s73 applications.
review-status: unverified
field-status: {}
