reference: design-and-access-statement
local-authority: EHE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floorspace created is 100 sq m or more (measured
            externally).
  - application-type:
      in:
      - lbc
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended),
  Part 3, Article 9; Planning (Listed Buildings and Conservation Areas) Regulations 1990 (as amended)
source-text: 'Required for: All major developments; developments in Conservation Area which consists of
  the provision of one or more dwellinghouses or the provision of a building or buildings where the floorspace
  created by the development is 100 square metres or more (measured externally). Where a planning application
  is submitted in parallel with an application for listed building consent, a single combined Design and
  Access Statement should address the requirements of both.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context of the development, and how the design takes that context
    into account
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation undertaken on access issues, and how its outcome has informed the development
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 3-4. N6. The listed building consent
  part comes from the national rule the list refers to (a combined statement for parallel planning and
  listed building applications). For major applications in the Harlow and Gilston Garden Town area the
  list points to L56 (HGGT Vision Assurance Statement), which 'can be submitted as a standalone statement
  or incorporated into a Design and Access Statement'.
review-status: unverified
field-status: {}
