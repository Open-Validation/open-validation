reference: roof-plan-existing
local-authority: EHE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - ldc
      - prior-approval
      - advertising
      - demolition-con-area
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: The application involves changes to roofs.
    - condition:
        field: new-build
        value: true
        description: The application is for a new building.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 43; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 (as amended)
source-text: All applications that involve changes to roofs or are for new building except S73 applications
must-include:
- item: Shape and materials of roofs at a scale of 1:50, 1:100 or 1:200
  level: must
- item: Proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: should
- item: No 'do not scale' disclaimer and no applicant's name on the plans
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 5. N10.
review-status: unverified
field-status: {}
