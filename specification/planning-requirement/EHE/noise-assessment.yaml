reference: noise-assessment
local-authority: EHE
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: New development with the potential to create noise (including air source heat pumps)
        affecting existing noise sensitive development.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development (residential, hospitals, schools) subject to noise from
        an existing use in the vicinity.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 185; Policy EQ2 East Herts District Plan 2018; BS 4142:2014+A1:2019
source-text: Where new development will have the potential to create noise (including for example air
  source heat pumps) which will have an impact on existing noise sensitive development (such as residential
  areas, hospitals and schools). … Where noise sensitive development (such as those listed above) would
  be developed in a location where it will be subject to noise from an existing use in the vicinity.
must-include:
- item: The existing ambient noise climate
  level: must
- item: Assessment of the existing and future noise climate, indicating any increase in predicted noise
    levels
  level: must
- item: Details of management procedures to reduce the impact of the operation, including noise from vehicles
  level: must
- item: Sound insulation details where a building needs insulation to contain noise generated within it
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 15. L21 'Noise and/or Vibration
  Impact Statement'. The minerals, road, landfill and waste triggers are for the County Council.
review-status: unverified
field-status: {}
