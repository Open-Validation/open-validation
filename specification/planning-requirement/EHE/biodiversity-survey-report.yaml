reference: biodiversity-survey-report
local-authority: EHE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - ecology-consultation-area
        description: The site is within the Ecology Consultation Area (East Herts Online Mapping).
    - any:
      - all:
        - application-type:
            in:
            - hh
        - condition:
            field: roof-alteration
            value: true
            description: A householder proposal which affects roofspace (e.g. dormers, extensions attaching
              to the main roof).
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 50
          description: A non-domestic extension of over 50 sq m floor area.
      - condition:
          field: new-build
          value: true
          description: Creation of new buildings.
      - condition:
          field: demolition
          value: true
          description: The proposal includes demolition of a building.
  - condition:
      field: protected-species
      value: true
      description: The proposal could negatively affect protected habitats or species, European protected
        species, or priority habitats or species.
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework paras 174, 179-182; Policies NE1, NE3 East Herts District Plan
  2018; BS 42020:2020
source-text: 'A survey and assessment is required if any of the following apply: … Major applications,
  … Specified proposals within the “Ecology Consultation Area” (see below) or … When proposals could result
  in a loss of biodiversity, negatively affect protected habitats or species, European protected species,
  or priority habitats or species. … Proposals within this area which will require an Ecology Survey and
  Assessment are: … Householders which affect roofspace (eg dormers, extensions attaching to main roof)
  … Non domestic extensions of over 50m2 floor area … Creation of new buildings … Those that include demolition
  of … a building'
must-include:
- item: Protected species surveys where there is a reasonable likelihood of their being present and affected
  level: must
- item: A Phase 1 habitat survey and, where necessary, a Phase 2 habitat survey
  level: must
- item: Compliant with BS 42020, by a trained ecologist to national survey standards; surveys up to date,
    ideally from the most recent survey season
  level: should
- item: A report on the potential impact on ecology or protected species, measures to reduce or mitigate
    it, and measures to improve or compensate
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: protected-species
        value: true
        description: Surveys suggest the presence of or impact on protected species.
    - discretionary
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 10. L11 'Ecological Survey & Assessment'.
  'Could result in a loss of biodiversity' has no test, so it shows as discretionary. L5 (Biodiversity
  Questionnaire, a screening form for all applications except adverts, lawful development certificates
  and non-material amendments) is listed as unmapped.
review-status: unverified
field-status: {}
