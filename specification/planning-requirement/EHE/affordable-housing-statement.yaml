reference: affordable-housing-statement
local-authority: EHE
required-if:
  any:
  - condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is proposed.
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Policy HOU3 East Herts District Plan 2018; Affordable Housing Supplementary Planning Document
  (2020)
source-text: All applications where affordable housing is proposed and/or meets the criteria for the provision
  of affordable housing specified in policy HOU3
must-include:
- item: 'For outline applications: the percentage of affordable housing, indicative dwelling mix of affordable
    homes and indicative tenure mix'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'For reserved matters or full applications: confirmation of the affordable housing mix'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Affordable and market housing unit numbers
  level: must
- item: The mix of units, including numbers of habitable rooms and/or bedrooms and/or floorspace
  level: should
- item: Plans showing the location/distribution of units and their habitable rooms and/or bedrooms and/or
    floorspace
  level: should
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 7. L2. The list does not repeat
  policy HOU3's thresholds, so 'meets the criteria ... specified in policy HOU3' shows as discretionary.
review-status: unverified
field-status: {}
