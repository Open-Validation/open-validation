reference: fire-statement
local-authority: EHE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: At least 18 metres tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: At least 7 storeys tall.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: The building contains more than one dwelling.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: Full/outline/reserved matters applications involving buildings that are at least 18 metres
  (or 7 storeys) tall containing more than one dwelling There are some exemptions - see guidance.
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect) with the
    particulars it specifies
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How fire safety policies in relevant local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 4. N7. There are some exemptions
  (see national guidance).
review-status: unverified
field-status: {}
