reference: air-quality-assessment
local-authority: EHE
required-if:
  any:
  - ref: major-development
  - condition:
      field: direct-air-emissions
      value: true
      description: Industrial activities with significant emissions to the atmosphere regulated by Environmental
        Permit.
  - site:
      in:
      - air-quality-management-area
      description: The site is in or near an Air Quality Management Area.
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework paras 174, 185, 186; Policy EQ4 East Herts District Plan 2018;
  East Herts Sustainability Supplementary Planning Document (2021)
source-text: All major applications. … Proposals that will significantly alter the traffic composition
  in an area such as heavy goods delivery traffic or industrial activities with significant emissions
  to the atmosphere regulated by Environmental Permit or introduction of a new school or public building
  close to an existing source of air pollution. … All Major applications and any minor applications in
  or near and Air Quality Management Area.
must-include:
- item: Current baselines in the area
  level: must
- item: Cumulative impact of known future developments in the area
  level: must
- item: Predicted future impact with and without the development, including mitigation, as statistics
    that can be compared with the air quality objectives
  level: must
- item: Undertaken in accordance with the air quality guidance in the East Herts Sustainability SPD
  level: should
- item: A dust suppression scheme showing how the impact of dust on the surrounding area will be minimised
  level: must
  required-if:
    condition:
      field: dust-generation
      value: true
      description: The application has the potential to generate increased dust.
- item: 'Where the development could result in an AQMA being designated or would undermine the air quality
    action plan: these issues addressed'
  level: must
  required-if: discretionary
- item: 'Air quality neutral assessment: the site''s NO2 and PM10 emissions from buildings and from transport
    compared with the buildings and transport benchmarks, with the data used (including plant emission
    data)'
  level: should
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: The site is in or near an Air Quality Management Area.
- item: Emissions assessment of the emissions produced and the mitigation applied
  level: should
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: The site is in or near an Air Quality Management Area.
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 6-7. L1 'Air Quality Impact Assessment'
  and L1(A) 'Air Quality Neutral Assessment'. Major developments 'should submit this air quality neutral
  assessment as part of an Air Quality Impact Assessment'; for minor applications in or near an AQMA it
  is the air quality neutral assessment. Whether a proposal will 'significantly alter the traffic composition'
  or puts a new school or public building close to a source of air pollution is a judgement, so that part
  shows as discretionary. The minerals and waste part is the County Council's.
review-status: unverified
field-status: {}
