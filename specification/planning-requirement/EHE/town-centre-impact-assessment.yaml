reference: town-centre-impact-assessment
local-authority: EHE
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail outside a Primary Shopping Area, or leisure, office and other development outside
        town centres, not in accordance with the District Plan.
  - any:
    - all:
      - condition:
          field: settlement-boundary
          value: bishops-stortford
          description: Within the settlement boundary of Bishop's Stortford.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1500
          description: Over 1,500 sq m gross floorspace.
    - all:
      - condition:
          field: settlement-boundary
          value: hertford
          description: Within the settlement boundary of Hertford.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1000
          description: Over 1,000 sq m gross floorspace.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Over 500 sq m gross floorspace elsewhere.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Policy RTC1 East Herts District Plan 2018; National Planning Policy Framework para 90
source-text: 'All applications for retail outside a Primary Shopping Area, and for leisure, office and
  other developments outside of town centres which are not in accordance with the policies of the District
  Plan and where the following thresholds are met: over 1,500sqm gross floorspace within the settlement
  boundary of Bishop’s Stortford; over 1,000sqm gross floorspace within the settlement boundary of Hertford;
  over 500sqm gross floorspace elsewhere.'
must-include:
- item: The cumulative effect of recent permissions and developments under construction and completed
  level: should
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
- item: Impact on town centre vitality and viability, including consumer choice and the comparison and
    convenience retail offer
  level: must
- item: Impact on allocated sites outside town centres
  level: must
- item: Impact on in-centre trade/turnover and trade in the wider area; for edge-of-centre sites, whether
    the scale is appropriate
  level: must
- item: Impact measured for up to five years from the application (up to ten years for major schemes)
  level: must
  source-text: The impact should be measured for up to five years from the time the application is made.
    For major schemes, the impact should be measured for up to ten years from the application.
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 18-19, 23-24. L27 'Retail and/or
  Leisure Impact Assessment' (the impact period comes from L42). The 'elsewhere' threshold applies outside
  Bishop's Stortford and Hertford.
review-status: unverified
field-status: {}
