reference: sustainability-statement
local-authority: EHE
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - advertising
      - prior-approval
      - demolition-con-area
  - all:
    - site:
        in:
        - harlow-gilston-garden-town
        description: The site is within the Harlow and Gilston Garden Town (HGGT) Joint Committee area.
    - ref: major-development
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Policies CC1, CC2, CC3, WAT4 East Herts District Plan 2018; for the checklist also DES4, TRA1,
  NE1, NE2, NE3, WAT5, EQ3, EQ4 and the Sustainability Supplementary Planning Document 2021
source-text: All applications except householders, certificates of lawfulness … All applications for new
  development for 1 or more residential dwellings or an increase in non-residential floorspace. … All
  major applications within the HGGT Joint Committee area
must-include:
- item: Water use, particularly where water scarcity is a local issue and for major development abstracting
    surface or groundwater
  level: must
- item: 'Energy consumption: renewable energy and fabric design to reduce energy needs and CO2 emissions'
  level: must
- item: 'Sustainable construction: recycled and locally-sourced building and landscaping materials'
  level: must
- item: 'Waste management: promoting resource efficiency'
  level: must
- item: A completed East Herts Sustainability Checklist covering energy and carbon reduction, climate
    change adaptation, water efficiency, pollution (air quality and light), biodiversity, sustainable
    transport and waste management, with answers explained and justified (not just 'yes', 'no' or 'not
    applicable')
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New development for 1 or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: An increase in non-residential floorspace.
- item: 'For outline applications: which checklist criteria are not applicable'
  level: should
  required-if:
    application-type:
      in:
      - outline
- item: HGGT checklist and sustainability statement as set out in the HGGT Sustainability Guidance and
    Checklist
  level: must
  required-if:
    all:
    - site:
        in:
        - harlow-gilston-garden-town
        description: The site is within the Harlow and Gilston Garden Town (HGGT) Joint Committee area.
    - ref: major-development
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 20-21, 27. L33 'Sustainability
  Statement/Appraisal' (all applications except householder and lawful development certificates; shown
  for the main other types), L33A 'Sustainability Checklist' and L57 'HGGT Sustainability Checklist &
  Statement'. The carbon reduction template (L48) is in energy-statement.
review-status: unverified
field-status: {}
