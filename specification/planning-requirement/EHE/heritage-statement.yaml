reference: heritage-statement
local-authority: EHE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - world-heritage-site
      description: Development affecting the historic environment (Listed Buildings, Conservation Areas,
        Scheduled Monuments, Historic Parks and Gardens, World Heritage Sites).
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework paras 189-190, 194-195, 199-205, 208; Policies HA1, HA3, HA4,
  HA7, HA8 East Herts District Plan 2018
source-text: All applications for listed building consent and for developments affecting the historic
  environment (Listed Buildings, Conservation Areas, Scheduled Monuments, Historic Parks and Gardens,
  World Heritage Sites).
must-include:
- item: Analysis of the special interest and significance of the heritage asset, including any contribution
    made by its setting
  level: must
- item: Assessment of the potential impact of the proposals on that special interest, significance and
    qualities
  level: must
- item: Level of detail proportionate to the asset's importance
  level: should
- item: The sources considered, the expertise consulted, and the steps taken to avoid or minimise adverse
    impacts on significance
  level: should
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 12. L14.
review-status: unverified
field-status: {}
