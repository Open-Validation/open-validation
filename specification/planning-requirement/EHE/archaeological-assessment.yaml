reference: archaeological-assessment
local-authority: EHE
required-if:
  any:
  - all:
    - condition:
        field: operational-development
        value: true
        description: Operational development.
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Area of Archaeological Significance.
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 194 and footnote 68; Policies HA1, HA3 East Herts District
  Plan 2018
source-text: Operational development in Areas of Archaeological Significance and/or where the development
  would have an impact upon a site which has, or has the potential to have, heritage assets with archaeological
  interest. These may include below ground archaeological remains, historic buildings and historic landscapes
  and gardens.
must-include:
- item: 'Desk-based assessment: existing archaeological and historic information about the site, including
    previous land uses, summarised in a report'
  level: must
- item: An assessment of the impact of the development on heritage assets, with an assessment of significance
  level: must
- item: Field evaluation (e.g. geophysical survey, test pits or trenches) discussed in advance with the
    County Council's Historic Environment team and carried out to its brief and an approved written scheme
    of investigation
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 8. L3 'Archaeological Desk-based
  Assessment/Field Evaluations'. Whether a site 'has the potential to have' heritage assets with archaeological
  interest is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
