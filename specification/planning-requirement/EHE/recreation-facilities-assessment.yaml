reference: recreation-facilities-assessment
local-authority: EHE
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of existing open space or existing indoor or outdoor sport and/or recreation facilities
        (including playing fields).
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Policy CFLR1 East Herts District Plan 2018; National Planning Policy Framework para 99; Open space,
  sport and recreation Supplementary Planning Document (2021)
source-text: All developments that may result in the loss or degradation of designated playing field space
  … All proposals which would result in the loss of existing open space or existing indoor or outdoor
  sport and/or recreation facilities (including playing fields)
must-include:
- item: Existing playing field space and the impact of the development on it, including proposed pitch
    provision
  level: must
  required-if: discretionary
- item: 'Justification: an assessment clearly showing the facility is no longer needed in its current
    form; or the loss would be replaced by enhanced provision in quantity and/or quality in a suitable
    location; or the development is for an alternative facility whose need clearly outweighs the loss'
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 17, 23. L25 'Playing Field Assessment'
  and L40 'Loss of Open Space, indoor or outdoor Sport and Recreation Facilities Assessment'. Whether
  a development 'may result in ... degradation' of playing fields is a judgement, so that part shows as
  discretionary.
review-status: unverified
field-status: {}
