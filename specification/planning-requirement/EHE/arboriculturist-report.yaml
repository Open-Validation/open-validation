reference: arboriculturist-report
local-authority: EHE
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Existing trees on the site or in close proximity to it.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 131; Policies DES2, DES3 East Herts District Plan 2018;
  BS 5837:2012
source-text: Where there are existing trees on a site or in close proximity to the site, and of particular
  importance where a proposal would impact on a Tree Preservation Order, trees in a Conservation Area,
  woodlands or any trees or tree groups that represent significant landscape features.
must-include:
- item: Comply with BS 5837 (Trees in relation to design, demolition and construction)
  level: must
- item: 'Typically: topographical survey, tree survey, tree constraints plan, arboricultural implications
    assessment, tree protection plan and arboricultural method statement'
  level: should
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 22. L36 'Tree Survey/Arboricultural
  Statement'.
