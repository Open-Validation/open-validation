reference: planning-statement
local-authority: EHE
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: 'Significant minor applications: 2 or more dwellings.'
  - all:
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1
        description: Large commercial development.
    - discretionary
  - site:
      in:
      - green-belt
      description: The site is in the Hertfordshire Green Belt.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework paras 43, 55-57, 137-151; East Herts District Plan 2018
source-text: All major applications and significant minor applications (2 or more dwellings, or large
  commercial) … All applications in the Hertfordshire Green Belt must provide a Green Belt Statement as
  part of the Planning Statement.
must-include:
- item: How the development accords with the development plan, SPDs, masterplans or development briefs,
    and national policy and guidance
  level: must
- item: 'Unless the development is entirely in accordance with the development plan: the need for it and
    justification for any departure from policy'
  level: must
- item: A Green Belt Statement, including very special circumstances if contrary to Green Belt policy
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: The site is in the Green Belt.
- item: S106 Heads of Terms
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: Heads of Terms and a Statement of Delivery as set out in the HGGT 'How To' Guide (Planning Obligations,
    Land Value Capture and Development Viability)
  level: must
  required-if:
    all:
    - ref: major-development
    - site:
        in:
        - harlow-gilston-garden-town
        description: The site is within the Harlow and Gilston Garden Town (HGGT) Joint Committee area.
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 16-17. L24. 'Large commercial'
  has no threshold, so it shows as discretionary. Heads of Terms are needed 'where relevant and for all
  major applications'.
review-status: unverified
field-status: {}
