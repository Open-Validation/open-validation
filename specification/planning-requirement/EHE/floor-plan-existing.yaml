reference: floor-plan-existing
local-authority: EHE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - ldc
    - prior-approval
    - advertising
    - demolition-con-area
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 43; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 (as amended)
source-text: All applications except S73 applications
must-include:
- item: Drawings at a scale of 1:50, 1:100 or 1:200
  level: must
- item: Each relevant floor or part floor, roof and means of access
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: Proposed plans shown in context with the site boundary and any existing adjacent buildings
  level: should
- item: 'For change of use: floor plans annotated to show the extent of the existing and proposed use'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
- item: No 'do not scale' disclaimer and no applicant's name on the plans
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 4. N8. The list says all applications
  except s73 ones; shown for the main application types other than s73.
review-status: unverified
field-status: {}
