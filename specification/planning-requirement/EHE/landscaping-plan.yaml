reference: landscaping-plan
local-authority: EHE
required-if:
  any:
  - condition:
      field: landscaping-works
      value: true
      description: The application includes some form of landscaping.
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Policy DES3 East Herts District Plan 2018; Hertfordshire Landscape Character Assessment
source-text: All planning applications that include some form of landscaping. … Where the proposal contains,
  or is likely to require, some form of landscaping to make it acceptable in planning terms. … Applications
  for full planning permission (apart from change of use) should be accompanied by a fully detailed scheme.
must-include:
- item: 'Proposed landform: existing and proposed contours/levels, including areas of cut and fill'
  level: must
- item: Layout of buildings and open spaces (including car parks) and areas of hard surfacing
  level: must
- item: Areas of new and retained planting, with protection measures during construction
  level: must
- item: Boundary treatments, vehicle and pedestrian access points, routes and circulation areas, services
    and other structures (refuse bins, lighting columns etc.)
  level: must
- item: 'A fully detailed scheme: hard and soft landscape construction details, planting plans and schedules
    (numbers, sizes, species, density, locations) and written specifications'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a change of use.
- item: Aftercare for at least 5 years, in management and maintenance specifications and schedules
  level: should
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 14. L18 'Landscape Scheme'. Whether
  a proposal 'is likely to require' landscaping is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
