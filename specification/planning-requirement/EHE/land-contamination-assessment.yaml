reference: land-contamination-assessment
local-authority: EHE
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Operational development or a change of use on land identified as contaminated land.
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive end use is proposed, such as housing or education.
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework paras 183, 184; Policy EQ1 East Herts District Plan 2018
source-text: Where operational development or a change of use is proposed on land which is identified
  as contaminated land, where there is potential for contamination to exist or where a sensitive end use
  is proposed such as housing or education
must-include:
- item: A risk assessment of the findings of a site investigation and the risks of developing the site
  level: must
- item: How unacceptable risks from contamination and land instability will be addressed through remediation
  level: must
- item: A risk assessment of landfill gas migration
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: On or within 250 metres of a former landfill site.
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 13-14. L16. 'Potential for contamination
  to exist' has no test, so it shows as discretionary.
review-status: unverified
field-status: {}
