reference: energy-statement
local-authority: EHE
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A residential net gain of 1 dwelling or more.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: An increase in non-residential floorspace.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Policy CC2 East Herts District Plan 2018; Sustainability Supplementary Planning Document 2021
  (Appendix B)
source-text: All full and reserved matters planning applications for new development that result in a
  residential net gain of 1 dwelling and above or an increase in non-residential floorspace
must-include:
- item: A carbon reduction template in line with Appendix B of the Sustainability SPD, applied to each
    unit or unit type
  level: must
- item: Target Emission Rate and Dwelling/Building Emission Rate from the Part L Building Regulations
    calculations, shown relative to current Part L
  level: must
- item: Samples or estimates of SAP calculations appended as evidence
  level: must
  required-if:
    ref: major-development
- item: SAP 10 carbon intensity figures
  level: should
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 25-26. L48 'Carbon reduction template'.
  The list says it should be included in the sustainable construction, energy and water statement.
review-status: unverified
field-status: {}
