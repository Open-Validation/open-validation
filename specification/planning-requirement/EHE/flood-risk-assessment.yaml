reference: flood-risk-assessment
local-authority: EHE
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - surface-water-flood-risk
      description: The site is at High Risk of surface water flooding in the national Risk of Flooding
        from Surface Water maps.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 1.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or greater.
  - site:
      in:
      - flood-risk-zone
      description: New development located in Flood Zone 2 or 3.
  - condition:
      field: more-vulnerable-use-change
      value: true
      description: Development including change of use to a more vulnerable class that could be affected
        by sources of flooding other than rivers and the sea.
  - site:
      in:
      - critical-drainage-area
      description: Development in Flood Zone 1 with a critical drainage problem as notified by the Environment
        Agency.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 167 and footnote 55; Policy WAT1 East Herts District Plan
  2018
source-text: All major applications … Where the site is shown to be at High Risk of surface water flooding
  in the national Risk of Flooding from Surface Water maps; … developments of 1 hectare or greater in
  Flood Zone 1; … new development located in Flood Zones 2 and 3; … development including change of use,
  to a more vulnerable class where they could be affected by sources of flooding other than rivers and
  the sea; … Any development within flood zone 1 which has a critical drainage problem as notified by
  the Environment Agency.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed taking
    climate change into account
  level: must
- item: Design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: How the sequential approach has been taken into account, with mitigation measures
  level: must
- item: Sequential test, for development other than minor development or changes of use (unless a caravan,
    camping chalet, mobile home or park home site)
  level: must
  required-if:
    all:
    - condition:
        field: minor-development
        value: false
        description: The development is not minor development.
    - condition:
        field: involves-change-of-use
        value: false
        description: The development is not a change of use.
- item: Exception test, for highly vulnerable development, more vulnerable development and essential infrastructure
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 10-11. L12. The exception test
  depends on the flood zone and vulnerability class, so it shows as discretionary.
review-status: unverified
field-status: {}
