submission-standards:
- item: All documents in PDF format; large documents too big to e-mail or submit on the Planning Portal
    sent on a USB memory stick (file sharing not accepted)
  level: must
- item: Each drawing or plan submitted as an individual PDF; combined drawings and plans not accepted
  level: must
- item: All plans have a linear scale bar
  level: should
- item: All plans have a unique drawing number and indicate the page size
  level: should
- item: No 'do not scale' disclaimer, and no applicant's name, on plans
  level: must
