reference: location-plan
local-authority: EHE
required-if:
  always: true
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications
must-include:
- item: Up to date map at a scale of 1:1250 or 1:2500
  level: must
- item: Application site boundary clearly edged with a red line, including all land required for the development
    (normally including land up to the edge of a public highway)
  level: must
- item: Other land within the control or ownership of the applicant, adjacent or close to the site, edged
    with a blue line
  level: should
- item: An arrow indicating the direction of North
  level: must
- item: At least two surrounding named roads
  level: must
- item: No 'do not scale' disclaimer and no applicant's name on the plans
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 3. N4.
review-status: unverified
field-status: {}
