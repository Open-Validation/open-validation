reference: sustainable-drainage-strategy
local-authority: EHE
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 169; Hertfordshire County Council (LLFA) validation list/SuDS
  proforma
source-text: Major applications and all development likely to significantly increase or change patterns
  of surface water run-off.
must-include:
- item: Detailed calculations of the greenfield and post-development run-off rates, discharge rate, attenuation
    volume and allowance for climate change
  level: must
- item: Ground investigation to prove the hydrological behaviour of the site
  level: must
- item: Infiltration testing to determine whether infiltration is feasible
  level: should
- item: 'If draining to a watercourse: its location and adequacy'
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: The site will drain to a watercourse.
- item: 'If connecting to a sewer is the only option: written agreement from the sewerage undertaker'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 20. L32 'Surface Water Drainage
  Strategy'. 'Likely to significantly increase or change patterns of surface water run-off' is a judgement,
  so that part shows as discretionary. This MHCLG id is retired but is the closest match.
review-status: unverified
field-status: {}
