reference: section-proposed
local-authority: EHE
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal involves a change in ground levels or is on a sloping site.
source-url: https://cdn-eastherts.onwebcurl.com/s3fs-public/2025-11/2025_11%20Joint%20Validation%20Checklist%20Herts%20CC%20EHDC.pdf
policy: National Planning Policy Framework para 43; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 (as amended)
source-text: DBC – All applications in cases where the proposals involve a change in ground levels or
  is on a sloping site
must-include:
- item: Drawings at a scale of 1:50, 1:100 or 1:200 with clearly labelled cross sections through the proposed
    buildings
  level: must
- item: Existing site levels and finished floor levels, related to a fixed datum point off site
  level: must
- item: The proposals in relation to adjoining buildings
  level: must
- item: No 'do not scale' disclaimer and no applicant's name on the plans
  level: must
confidence: medium
notes: From the council's list (Version 3, dated 5 December 2024), page 5. N11 'Existing and proposed
  sections and site levels'. This joint Hertfordshire checklist gives the district rule under 'DBC' (copied
  from Dacorum's version) and 'HCC - all major applications' for the County Council; the district rule
  is shown.
review-status: unverified
field-status: {}
