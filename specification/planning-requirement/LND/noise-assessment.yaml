reference: noise-assessment
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
    - any:
      - condition:
          field: plant-equipment
          value: true
          description: New plant.
      - condition:
          field: noise-generating-use
          value: true
          description: Uses that may create noise disturbance.
    - discretionary
  - all:
    - application-type:
        in:
        - pa-ecomms-network
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan Policy 7.15; Local Plan policy CS15
source-text: Planning applications involving new plant or uses that may create noise disturbance. Section
  73 variation of a condition including minor material alterations. … May be required for developments
  that could affect noise sensitive properties (e.g. residential or educational uses).
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 3.
  'Acoustic Report'. Shows as discretionary because the list says it 'May be required' where noise sensitive
  properties could be affected. The telecoms prior notification checklist lists it too ('May be required
  ...').
