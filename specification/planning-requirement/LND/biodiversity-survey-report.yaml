reference: biodiversity-survey-report
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: demolition
        value: true
        description: Demolition of existing buildings.
    - condition:
        field: new-build
        value: true
        description: New buildings.
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan Policy 7.19; Local Plan policy DM19.2
source-text: Planning permission for the demolition of existing buildings or construction of new buildings.
  … Survey of existing biodiversity on site, impact and proposed measures to protect and enhance biodiversity.
must-include:
- item: Survey of existing biodiversity on site
  level: must
- item: Impact of the proposal on biodiversity
  level: must
- item: Proposed measures to protect and enhance biodiversity
  level: must
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 3.
  The 2016 list predates statutory biodiversity net gain, so it asks for no BNG metric or habitat baseline.
review-status: unverified
field-status: {}
