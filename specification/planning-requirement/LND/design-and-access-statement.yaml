reference: design-and-access-statement
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - s73
        - hh
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses/flats.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floor space created is 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: Many planning and listed building applications and most applications within a Conservation
  Area must be accompanied by a Design and Access Statement. Information on when a D&AS is required is
  set out in the guidance note Design and Access Statement
must-include:
- item: Explains the design principles and concepts that have been applied to the development
  level: must
- item: Demonstrates how the proposed development's context has influenced the design
  level: must
- item: Explains the applicant's approach to access and how relevant Local Plan policies have been taken
    into account
  level: must
- item: States what, if any, consultation has been undertaken on access and what account has been taken
    of the outcome
  level: must
- item: Explains how any specific issues which might affect access to the development have been addressed
  level: must
- item: 'For listed building consent: how the design principles and concepts take account of the building''s
    special architectural or historic importance, the physical features that justify its listing, and
    its setting (items 3 to 6, on access, also needed where the work affects the exterior)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Residential schemes: indicative furniture layouts'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential schemes.
confidence: medium
notes: 'From the council''s list (published February 2016), full planning permission checklist, page 1.
  The householder checklist says: ''Required with applications within a Conservation Area or requiring
  listed building consent.'' When a statement is needed and what it must do come from the council''s linked
  guidance note ''Design and Access Statement'' (https://www.cityoflondon.gov.uk/assets/Services-Environment/design-and-access-statement.pdf):
  10 or more dwellings or 1,000 sq m or more of commercial floorspace; in a conservation area, one or
  more dwellings or 100 sq m or more of new floor space; and listed building consent.'
review-status: unverified
field-status: {}
