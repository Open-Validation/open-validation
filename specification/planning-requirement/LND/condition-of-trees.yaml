reference: condition-of-trees
local-authority: LND
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
  - all:
    - application-type:
        in:
        - notice-trees-in-con-area
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/validation-checklist-works-to-trees-with-a-preservation-order-february-2016.pdf
policy: Local Plan policy CS19; Open Spaces in the City of London SPG
source-text: 5. The reasons for carrying out the works including the condition of the trees and any alleged
  damage to property. … A report by a tree professional (arboriculturist) or other qualified person on
  the condition of all the trees and an arboricultural report and aboricultural method statement.
must-include:
- item: Report by a tree professional (arboriculturist) or other qualified person on the condition of
    all the trees
  level: must
- item: Arboricultural report and arboricultural method statement
  level: must
confidence: medium
notes: From the council's list (published February 2016), works to trees with a tree preservation order
  checklist, page 1. National list item 5. The works to trees in conservation areas checklist (https://www.cityoflondon.gov.uk/assets/Services-Environment/validation-checklist-works-to-trees-in-conservation-areas-february-2016.pdf)
  lists the same report under its local requirements ('Tree survey/Arboricultural implications'), which
  'may include' these items, so for that notice it shows as discretionary.
review-status: unverified
