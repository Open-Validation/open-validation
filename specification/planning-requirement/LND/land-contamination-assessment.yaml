reference: land-contamination-assessment
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: footprint-increase
        value: true
        description: An extension.
    - condition:
        field: upper-floor-extension
        value: true
        description: An extension above ground level, including at roof level.
  - site:
      in:
      - contaminated-land
      description: Site is known to be or is suspected of being contaminated.
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan Policy 5.21; Local Plan policy DM15.8
source-text: Planning permission for the construction of a new buildings or extensions. … Required if
  application site is known to be or is suspected of being contaminated.
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 6.
  The list points to the City of London Interactive Map.
review-status: unverified
field-status: {}
