reference: air-quality-assessment
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
    - ref: major-development
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: footprint-increase
          value: true
          description: An extension.
      - condition:
          field: upper-floor-extension
          value: true
          description: An extension above ground level, including at roof level.
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: biomass-or-chp
          value: true
          description: Proposes to use biomass or biofuel.
      - ref: major-development
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: London Plan policy 7.14; Local Plan policy DM15.6
source-text: For development that proposes to use biomass or biofuel or for major development (1000sq.m
  non-residential or 10 or more residential units). … Needed when the site is adjacent to a 'sensitive
  building' e.g. school or hospital. An assessment of the impact of the development on air quality. …
  Planning permission for major new buildings or extensions (1000sq.m non-residential or 10 or more residential
  units) including minor material alterations. … Demonstration that development is at least air quality
  neutral and mitigation if necessary.
must-include:
- item: 'Air Quality Neutral Assessment: demonstration that the development is at least air quality neutral,
    with mitigation if necessary'
  level: must
  required-if:
    all:
    - ref: major-development
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: footprint-increase
          value: true
          description: An extension.
      - condition:
          field: upper-floor-extension
          value: true
          description: An extension above ground level, including at roof level.
- item: 'Air Quality Impact Assessment: the impact of the development on air quality'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published February 2016), full planning permission checklist, page 3.
  Two rows: ''Air Quality Impact Assessment'' and ''Air Quality Neutral Assessment''. The impact assessment
  shows as discretionary because it is ''Needed when the site is adjacent to a ''sensitive building''
  e.g. school or hospital'', which no field records.'
review-status: unverified
field-status: {}
