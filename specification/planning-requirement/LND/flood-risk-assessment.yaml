reference: flood-risk-assessment
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
      - s73
      - hh
      - change-of-use
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In the Flood Risk Area shown on the Local Plan Policies Map B (as amended by the
          Strategic Flood Risk Assessment).
    - ref: major-development
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; Local Plan policy CS18
source-text: All planning applications … including change of use, removal … or variation of conditions
  and … minor material alterations. … Required for all planning … applications in the Flood Risk … Area
  shown on the Local Plan … Policies Map B (as amended by the Strategic Flood Risk Assessment) and for
  Major development elsewhere.
must-include:
- item: Sequential test evidence
  level: must
- item: Information set out in the Technical Guidance to the National Planning Policy Framework
  level: must
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 4.
  'Flood Risk Assessment and sequential test evidence'. The householder checklist has the same row (page
  3). The City's Flood Risk Area is its own mapped area (Policies Map B as amended by the Strategic Flood
  Risk Assessment), shown here with the flood-risk-zone designation.
review-status: unverified
field-status: {}
