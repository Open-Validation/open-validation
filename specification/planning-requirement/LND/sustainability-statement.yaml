reference: sustainability-statement
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
      - s73
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan policies on climate change; Local Plan policy CS15
source-text: Planning permission for new buildings or major extensions and removal or variation of a condition
  including minor material alterations. … Demonstration of sustainability standard to be achieved and
  minimisation of carbon emissions.
must-include:
- item: Sustainability standard to be achieved
  level: must
- item: Minimisation of carbon emissions
  level: must
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 8.
  'Sustainable development and climate change report'. 'Major extensions' has no threshold, so that part
  shows as discretionary.
review-status: unverified
field-status: {}
