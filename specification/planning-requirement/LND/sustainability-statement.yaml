reference: sustainability-statement
local-authority: LND
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
  - application-type:
      in:
      - s73
  - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
must-include:
- item: A comprehensive assessment of the energy demand of the proposed building, the energy efficiency
    measures and low and zero carbon technologies, and carbon offsetting where targets cannot be met
  level: must
