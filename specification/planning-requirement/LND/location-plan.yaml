reference: location-plan
local-authority: LND
required-if:
  application-type:
    in:
    - full
    - s73
    - hh
    - lbc
    - advertising
    - demolition-con-area
    - ldc
    - consent-under-tpo
    - non-material-amendment
    - pa-ecomms-network
    - notice-trees-in-con-area
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2. A location plan and a site plan are required. The site should be edged red; other land
  in the applicant’s ownership should be edged blue.
must-include:
- item: Site edged red
  level: must
- item: Other land in the applicant's ownership edged blue
  level: must
  required-if:
    application-type:
      in:
      - full
      - s73
      - hh
      - lbc
      - demolition-con-area
      - ldc
      - non-material-amendment
      - pa-ecomms-network
- item: Proposed position of the advertisement(s)
  level: should
  required-if:
    application-type:
      in:
      - advertising
  source-text: The site location plan should identify the proposed position of the advertisement(s).
- item: Precise area of land or building for which the Certificate of Lawfulness is sought clearly defined
  level: must
  required-if:
    application-type:
      in:
      - ldc
  source-text: It is important that the precise area of land or building for which … a Certificate of
    Lawfulness is sought is clearly defined on the … plan(s) accompanying the application.
confidence: medium
notes: From the council's list (published February 2016), national list of every checklist, page 1. The
  tree preservation order checklist asks for 'A location plan.' with the site edged red; the trees in
  a conservation area and dead or dangerous trees checklists list it under their local requirements. The
  approval of details checklist does not ask for one.
