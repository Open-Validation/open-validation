reference: archaeological-assessment
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
        - hh
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves ground works.
  - all:
    - application-type:
        in:
        - lbc
        - demolition-con-area
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan Policy 7.8; Local Plan policy CS12
source-text: Applications for planning permission or removal or variation of a condition (including minor
  material alterations) where the proposal involves ground works. … The information should include a desk
  based assessment, an assessment of the impact of the proposal, and where appropriate, on-site evaluation.
must-include:
- item: Desk based assessment
  level: should
- item: Assessment of the impact of the proposal
  level: should
- item: On-site evaluation
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 5.
  'Heritage Assets – Archaeological remains and Scheduled Ancient Monuments'. The householder checklist
  has the same row. The listed building consent and relevant demolition checklists list it without a ground
  works trigger, so for those types it shows as discretionary.
review-status: unverified
field-status: {}
