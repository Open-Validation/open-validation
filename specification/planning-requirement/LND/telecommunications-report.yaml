reference: telecommunications-report
local-authority: LND
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/validation-checklist-DPAR-for-telecommunications-equipment-february-2016.pdf
policy: NPPF; Local Plan policies CS10 and CS12
source-text: Information on the position, size, appearance and impact of equipment that is not provided
  elsewhere (eg on the standard application form). For mast and antenna development by mobile phone network
  operators a signed declaration confirming that the equipment and installation has been designed to be
  in full compliance with the requirements of the radio frequency public exposure guidelines of the International
  Commission on Non- … Ionizing Radiation Protection.
must-include:
- item: Position, size, appearance and impact of the equipment, where not given elsewhere
  level: must
- item: 'For mast and antenna development by mobile phone network operators: signed declaration of full
    compliance with the ICNIRP radio frequency public exposure guidelines'
  level: must
  required-if:
    condition:
      field: telecommunications-development
      value: true
      description: Mast and antenna development by a mobile phone network operator.
confidence: medium
notes: From the council's list (published February 2016), DPAR for telecommunications equipment checklist,
  page 2. 'Telecommunications Development supplementary information'.
review-status: unverified
