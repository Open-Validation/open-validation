reference: heritage-statement
local-authority: LND
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: The proposal affects a listed building or its setting.
  - site:
      in:
      - conservation-area
      description: The proposal affects a conservation area or its setting.
  - site:
      in:
      - world-heritage-site
      description: New buildings or major extensions that could affect the Tower of London World Heritage
        Site.
  - site:
      in:
      - park-and-garden
      description: The proposal affects a registered park and garden.
  - all:
    - site:
        in:
        - locally-listed-building
        description: The proposal affects a non-designated heritage asset.
    - condition:
        field: new-build
        value: true
        description: The proposal includes new buildings or extensions (including minor extensions).
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
confidence: medium
notes: 'From the audit (missing_requirement): the Full and Householder checklists have heritage items
  for Listed Buildings, Conservation Areas, the Tower of London World Heritage Site, St Paul''s Heights,
  Registered Parks and Gardens and Non-designated Assets; Grokbot captured none. St Paul''s Heights is
  listed separately as unmapped.'
review-status: unverified
field-status: {}
