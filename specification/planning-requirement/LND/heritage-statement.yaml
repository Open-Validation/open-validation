reference: heritage-statement
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          description: Redevelopment or alterations affecting a listed building or its setting.
      - site:
          in:
          - conservation-area
          description: Redevelopment or alterations affecting a conservation area or its setting.
      - site:
          in:
          - park-and-garden
          description: New buildings or alterations affecting a Registered Park or Garden.
      - all:
        - any:
          - condition:
              field: new-build
              value: true
              description: New buildings.
          - condition:
              field: footprint-increase
              value: true
              description: An extension.
          - condition:
              field: upper-floor-extension
              value: true
              description: An extension above ground level, including at roof level.
        - site:
            in:
            - locally-listed-building
            description: Affects a non-designated heritage asset.
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - discretionary
    - site:
        in:
        - world-heritage-site
        description: Could have an impact on views of the Tower of London or the Outstanding Universal
          Value of the World Heritage Site.
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan Policy 7.8; LVMF; Local Plan policy CS12
source-text: Planning permission for redevelopment or alterations affecting a listed building or its setting.
  … A description of the significance of the historic assets affected by the proposal and the contribution
  of their setting to that significance. The level of information should be proportionate to the importance
  of the heritage asset and be sufficient to give an understanding of the potential impact of the proposal
  on the significance of the heritage asset. This information is required with an assessment of the impact
  of the proposal and an explanation of the design concept. The assessment of significance and impact
  should be set out in the Design & Access Statement where one is required. … redevelopment or alterations
  affecting a conservation area or its setting. … Planning permission for new buildings or alterations
  affecting a Registered Park or Garden. … Planning permission for new buildings or extensions including
  minor extensions. … A description of the significance of the heritage asset affected and the impact
  of the proposal, set out in the Design & Access Statement where one is required. … Planning permission
  for new buildings or major extensions. … Impact assessment required if there could be an impact on views
  of the Tower of London or the Outstanding Universal Value of the World Heritage Site.
must-include:
- item: Description of the significance of the heritage assets affected and the contribution of their
    setting to that significance
  level: must
- item: Level of information proportionate to the importance of the heritage asset and enough to understand
    the potential impact on its significance
  level: should
- item: Assessment of the impact of the proposal
  level: must
- item: Explanation of the design concept
  level: must
- item: Assessment of significance and impact set out in the Design and Access Statement where one is
    required
  level: should
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 4-5.
  Rows 'Heritage Assets - Listed Buildings', '- Conservation Areas', '- Tower of London World Heritage
  Site', '- Registered Parks and Gardens' and '- Non-designated Assets'. The householder checklist has
  the listed building, conservation area and non-designated rows (pages 3-5); the listed building consent
  checklist requires it for 'Listed Building Consent.' (page 3) and the relevant demolition in a conservation
  area checklist for 'Relevant Demolition in a Conservation Area.' (page 2). The City is outside the Tower
  of London World Heritage Site, so that row (new buildings or 'major extensions' that could affect its
  views or Outstanding Universal Value) shows as discretionary in part; the world-heritage-site value
  here stands for its setting. The St Paul's Heights row is listed as unmapped.
