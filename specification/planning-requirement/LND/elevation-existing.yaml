reference: elevation-existing
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
        - hh
        - lbc
    - condition:
        field: building-works
        value: true
        description: Involves building work, alterations to buildings or open space.
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - demolition-con-area
  - all:
    - application-type:
        in:
        - approval-condition
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: CLG circular - Guidance on information requirements and validation; London Plan - Place Shaping
  policies; Local Plan Culture and Heritage, Environmental Sustainability and City Communities policies
source-text: Applications involving building work, alterations to buildings or open space or display of
  advertisements … Section 73 removal or variation of a condition including minor material alterations.
  … Plans should be proportionate to the nature and size of the proposal, drawn at an identified standard
  metric scale and titled and numbered. They should show clearly the proposed works in relation to what
  is already there, highlighting any structures to be demolished, changes to levels, relationship to neighbouring
  buildings and land, details of foundations and the appearance of new work including materials to be
  used.
must-include:
- item: Scale such as 1:50, 1:100 or 1:200
  level: should
- item: Proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished, changes to levels and the relationship to neighbouring buildings and land
  level: should
- item: Details of foundations and the appearance of new work, including materials to be used
  level: should
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 2.
  The full checklist covers existing and proposed elevations and sections in one row, and says elevations
  and sections are not needed for a change of use with no alterations or building work. The householder
  and listed building consent checklists also list 'Approval of details reserved by a condition', and
  the approval of details checklist asks for the drawings 'necessary to provide the information required
  by the condition(s)', so that part shows as discretionary. The advertisement consent checklist asks
  for existing and proposed elevations and drawings describing the advertisement(s). The relevant demolition
  in a conservation area checklist asks for existing elevations. The householder, listed building consent
  and other type checklists say their local items 'may include any of the following' and that applicants
  should discuss what is needed with planning officers.
review-status: unverified
field-status: {}
