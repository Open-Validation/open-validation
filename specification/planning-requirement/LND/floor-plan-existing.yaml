reference: floor-plan-existing
local-authority: LND
required-if:
  application-type:
    in:
    - full
    - hh
    - lbc
    - pa-ecomms-network
    - demolition-con-area
    - ldc
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: CLG circular - Guidance on information requirements and validation; London Plan - Place Shaping
  policies; Local Plan Culture and Heritage, Environmental Sustainability and City Communities policies
source-text: All applications. … Plans should be proportionate to the nature and size of the proposal,
  drawn at an identified standard metric scale and titled and numbered. They should show clearly the proposed
  works in relation to what is already there, highlighting any structures to be demolished. Applications
  for change of use must identify the area(s) involved but elevations and sections will not be needed
  if there are no alterations or building work.
must-include:
- item: Scale such as 1:50, 1:100 or 1:200
  level: should
- item: Proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: should
- item: 'For a change of use: the area(s) involved identified'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
- item: 'For a lawful development certificate: at a scale of 1:50 or 1:100, clearly defining the precise
    area of land, building or operations for which the Certificate of Lawfulness is sought'
  level: must
  required-if:
    application-type:
      in:
      - ldc
- item: 'For a lawful development certificate for a proposed use or development: details of the size,
    nature and appearance of any operational works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
  source-text: provide details of the size, nature and appearance of any operational works.
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 2.
  The householder, listed building consent and telecoms prior notification checklists ask for the same
  plans for all applications. The relevant demolition in a conservation area and lawful development certificate
  checklists ask for existing floor and roof plans only. The householder, listed building consent and
  other type checklists say their local items 'may include any of the following' and that applicants should
  discuss what is needed with planning officers.
review-status: unverified
field-status: {}
