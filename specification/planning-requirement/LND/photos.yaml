reference: photos
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
        - hh
        - lbc
    - any:
      - condition:
          field: demolition
          value: true
          description: Involves the demolition of an existing building.
      - site:
          in:
          - listed-building-setting
          - conservation-area
          description: Affects the settings of listed buildings or conservation areas.
  - all:
    - application-type:
        in:
        - full
        - s73
    - discretionary
  - application-type:
      in:
      - demolition-con-area
  - all:
    - application-type:
        in:
        - hh
        - lbc
        - advertising
        - ldc
        - approval-condition
        - consent-under-tpo
        - notice-trees-in-con-area
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: LVMF; Local Plan policies CS10, CS13, CS14
source-text: Planning permission for new buildings, extensions or alterations. Section 73 removal or variation
  of a condition including minor material alterations. … Should be provided where necessary to support
  the application. Required in support of large redevelopment schemes and where proposals would involve
  the demolition of an existing building or affect the settings of listed buildings or conservation areas.
  Useful to support applications for alterations to buildings including shopfronts.
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 7.
  'Photographs/Verified rendered montages'. 'Large redevelopment schemes' has no threshold and 'where
  necessary' is the officer's call, so those parts show as discretionary. The householder and listed building
  consent checklists require them where proposals involve demolition or affect the settings of listed
  buildings or conservation areas; the relevant demolition checklist requires them where proposals 'would
  involve the demolition of an existing building'. The advertisement checklist says annotated photographs
  'may be required'; the lawful development certificate and approval of details checklists 'where necessary';
  and the tree checklists say photographs 'are useful' to identify the tree(s), so those show as discretionary.
