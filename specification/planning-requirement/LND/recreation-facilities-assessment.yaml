reference: recreation-facilities-assessment
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - discretionary
  - site:
      in:
      - open-space
      description: Development within or neighbouring an open space.
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: NPPF; London Plan Policy 7.18; Local Plan policies CS15 and CS19
source-text: Planning permission for new buildings or major extensions. … If proposal is for development
  within or neighbouring an open space an assessment of the impact and provision of replacement space
  is required.
must-include:
- item: Assessment of the impact on the open space
  level: must
- item: Provision of replacement space
  level: must
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 6-7.
  'Open Space assessment'. 'Major extensions' has no threshold, so that part shows as discretionary.
review-status: unverified
field-status: {}
