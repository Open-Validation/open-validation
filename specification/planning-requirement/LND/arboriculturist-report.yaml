reference: arboriculturist-report
local-authority: LND
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - s73
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - discretionary
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Likely to affect trees within the application site or adjacent to the site, including
          street trees.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Likely to affect trees within the application site or adjacent to the site, including
          street trees.
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: Local Plan policy CS19; Open Spaces in City of London SPG
source-text: Planning permission for new buildings or major extensions. … Householder and removal or variation
  of a condition including minor material alterations. … Required if proposal is likely to affect trees
  within the application … site or adjacent to the site including street trees. This must include survey
  drawings showing the position of any existing trees and their canopy spread, trees to be felled and
  any pruning required during and after construction.
must-include:
- item: Survey drawings showing the position of any existing trees and their canopy spread
  level: must
- item: Trees to be felled
  level: must
- item: Any pruning required during and after construction
  level: must
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 8-9.
  'Tree survey/Arboricultural implications'. The householder checklist has the same row (page 5). 'Major
  extensions' has no threshold, so that part shows as discretionary.
review-status: unverified
field-status: {}
