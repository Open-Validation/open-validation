reference: waste-management-plan
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - discretionary
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: London Plan policy 5.17; Local Plan policy CS17
source-text: Planning permission for new buildings, changes of use or major extensions. … To be shown
  annotated on drawings.
must-include:
- item: Waste storage and recycling facilities shown annotated on the drawings
  level: must
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 9.
  'Waste storage and recycling facilities'. The householder checklist has the same row (page 5). 'Major
  extensions' has no threshold, so that part shows as discretionary.
review-status: unverified
field-status: {}
