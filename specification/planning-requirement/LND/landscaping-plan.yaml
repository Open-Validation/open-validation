reference: landscaping-plan
local-authority: LND
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - discretionary
  - any:
    - site:
        in:
        - open-space
        description: Open space is affected.
    - condition:
        field: new-open-space
        value: true
        description: Open space is provided.
source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
policy: Local Plan policies CS10 and CS19
source-text: Planning permission for new buildings or major extensions where open space is affected or
  provided. … Drawings showing any proposed landscaping including structures, paving types, plant species
  and drainage. This should follow the design concept in the Design and Access Statement.
must-include:
- item: Proposed landscaping including structures, paving types, plant species and drainage
  level: must
- item: Follows the design concept in the Design and Access Statement
  level: should
confidence: medium
notes: From the council's list (published February 2016), full planning permission checklist, page 6.
  'Landscaping details'. 'Major extensions' has no threshold, so that part shows as discretionary.
review-status: unverified
field-status: {}
