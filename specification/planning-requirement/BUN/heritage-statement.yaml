reference: heritage-statement
local-authority: BUN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - conservation-area
      - listed-building-setting
      - locally-listed-building
      - archaeological-priority-area
      description: Works to alter, demolish or extend a listed building or a building in a conservation
        area, affecting the setting of a listed building, a known or suspected archaeological site, or
        a non-designated heritage asset.
source-url: https://burnley.gov.uk/wp-content/uploads/2025/11/Burnley-Council-Adopted-Validation-Checklist-November-2025.pdf
source-text: 'Heritage Statement Required for all applications to: Alter, demolish, extend a listed building
  or a building within a conservation area'
must-include:
- item: A schedule of works affecting the asset, its site and setting
  level: must
- item: An assessment of the impact on the special interest and character of the asset, its site and setting,
    and that of any adjacent heritage assets
  level: must
- item: Justification for the proposals, with any mitigation measures proposed
  level: must
confidence: medium
