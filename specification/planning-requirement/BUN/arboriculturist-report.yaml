reference: arboriculturist-report
local-authority: BUN
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees and/or hedges within or adjacent to the site (including street trees) may be directly
      or indirectly affected by the development or its construction.
source-url: https://burnley.gov.uk/wp-content/uploads/2025/11/Burnley-Council-Adopted-Validation-Checklist-November-2025.pdf
source-text: Tree Survey/Arboricultural Implications Assessment Required for all developments affecting
  trees within or adjacent to the application site Where there are trees and/or hedges within or adjacent
  to the site (including street trees) which may be directly or indirectly affected by the development
  or its construction (such as by service runs, hardstanding's, walls or trenches for services), then
  a tree survey should be prepared by a suitably qualified arboriculturist.
must-include:
- item: Prepared by a suitably qualified arboriculturist
  level: should
- item: All trees and hedges on or adjacent to the site identified and annotated on the site/block plan
  level: should
