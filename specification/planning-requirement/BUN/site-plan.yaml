source-text: 'Householder: Site Plan/Block Plan Required for all applications This should: • Be at a scale
  of 1:500 or 1:200; • Show the direction of North; • Show the proposed development in relation to the
  site boundaries and other existing buildings on the site; and • Include written/annotated dimensions,
  including those to boundaries;


  Full planning: a proposed site plan at a scale where its distance from any development can be measured
  (such as 1:200 or in some cases, 1:100 may also be necessary).


  Change of use - prior approval: Site Plan/Block Plan (existing and proposed) Required for all applications,
  with the exception of change of use proposal where no external works are proposed.'
