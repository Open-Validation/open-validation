source-text: 'Full planning: Land Contamination Assessment 24 Validation Checklist November 2025 Required
  for all applications where: Contamination is known or suspected


  Minerals & waste (county): Land Contamination Assessment Required for all applications where: • Contamination
  is known or suspected • Development is proposed on previously developed land • Development is proposed
  within 250m of a current or former landfill site • The proposed use involves residential, schools or
  hospital development, allotments or other uses that are vulnerable to ground contamination In most cases
  a Phase I Desk Top Study (preliminary risk assessment) will be sufficient at the application stage.'
