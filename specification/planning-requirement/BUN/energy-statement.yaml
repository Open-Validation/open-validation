reference: energy-statement
local-authority: BUN
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential development of 1,000sqm gross floorspace or over.
source-url: https://burnley.gov.uk/wp-content/uploads/2025/11/Burnley-Council-Adopted-Validation-Checklist-November-2025.pdf
source-text: 'Required for: All major applications for residential development; All non-residential development
  with a gross floorspace of 1000sqm or over'
confidence: medium
notes: 'Audit (wrong_trigger): the Energy Efficiency Statement in the 2025 list.'
