reference: biodiversity-survey-report
local-authority: BUN
required-if:
  any:
  - site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Development impacting on the South Pennines SPA/SAC, a SSSI, Biological or Geological
        Heritage Sites or Wildlife Corridors.
  - condition:
      field: protected-species
      value: true
      description: Development likely to affect the habitat of protected or S41 species (including demolition,
        roof space works, removal of trees and hedgerows, alterations to watercourses and ponds).
source-url: https://burnley.gov.uk/wp-content/uploads/2025/11/Burnley-Council-Adopted-Validation-Checklist-November-2025.pdf
source-text: 'Biodiversity Survey and Report Required for developments which impact upon: European Sites
  of international importance: South Pennines Special Protection Area (SPA) and Special Area of Conservation
  (SAC)'
must-include:
- item: Bat surveys (where triggered by the checklist) carried out by an appropriately qualified and experienced
    ecologist, and by a licensed officer where a survey may disturb roosting bats
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The workbook's excerpt
  looks garbled; re-read the council's list. The householder checklist (2017) gives the same triggers;
  the excerpts were filed as 'Biodiversity Checklist'.
review-status: unverified
field-status: {}
