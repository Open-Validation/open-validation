reference: design-and-access-statement
local-authority: BUN
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Development within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building with new floorspace of 100 square metres or more.
source-url: https://burnley.gov.uk/wp-content/uploads/2022/03/2017-Planning-Application-Validation-Checklist-1st-November-2017_0.pdf
source-text: 'Design and Access Statements Required for: • All major applications • All development within
  a conservation area where the development is for one or more dwellings or for a building where the new
  floorspace is 100 square metres or more 6 • All applications for listed building consent Design and
  Access Statements are not required for applications to remove or modify conditions (material minor amendment
  applications under s73 of the Town and Country Planning Act; engineering or mining operations;'
confidence: medium
notes: The workbook's excerpt looks garbled; re-read the council's list. Rows from Advertisement consent,
  Change of use - prior approval, Variation of condition s73, Works to trees, Hazardous substances were
  dropped after the audit. The trigger wording is from the superseded 2017 PAVC; the 2025 list keeps the
  same exemption list (s73, engineering or mining, waste, change of use, adverts, works to trees, hazardous
  substances, prior approvals, non-material amendments).
