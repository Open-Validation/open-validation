reference: noise-assessment
local-authority: BUN
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal may impact on existing amenity (industrial processes, plant, machinery,
        traffic, music, late night activity).
  - condition:
      field: noise-sensitive-use
      value: true
      description: New occupiers (such as housing) would have lower amenity due to background noise.
source-url: https://burnley.gov.uk/wp-content/uploads/2025/11/Burnley-Council-Adopted-Validation-Checklist-November-2025.pdf
source-text: A noise assessment, carried out by a competent person, will be required where a proposal
  may impact on levels of existing amenities (such as from industrial processes, plant, machinery, traffic,
  music, late night activity) or would potentially lead to lower standards of amenity for new occupiers
  of the development (such as housing) due to existing levels of background noise.
must-include:
- item: Carried out by a competent person
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given.
review-status: unverified
field-status: {}
