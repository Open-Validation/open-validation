reference: arboriculturist-report
local-authority: WYC
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges on the site, or on adjacent land that could influence or be influenced
        by the development or matter to local landscape character.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedges on or next to the site that could influence or be influenced by the development.
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP22
source-text: with applications where there are trees/hedges on the proposed development site; and/or -
  with applications when there are trees or hedges on land adjacent to the proposed development site that
  could influence or be influenced by the proposed development or be important as part of the local landscape
  character.
must-include:
- item: Produced in line with BS5837:2012, showing how tree constraints on and next to the site are incorporated
    into the design and how retained trees will be kept undamaged
  level: must
- item: 'Tree survey drawing and schedule: species, size, age, condition, useful life expectancy and quality
    category of trees, groups and woodlands'
  level: must
- item: Arboricultural Constraints Plan showing Root Protection Areas and the above-ground (shade) and
    below-ground constraints of retained trees
  level: must
- item: 'Tree Protection Plan: a scale drawing by an arboriculturist of the final layout, tree retention
    and protection measures'
  level: must
- item: 'Arboricultural Method Statement: the measures to protect retained trees and the method for any
    works that could damage a tree'
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 1-2. The list is joint with Malvern Hills
  District Council. The list's 'Arboricultural Statement/Tree Survey'. It names no application types,
  so it applies to any application.
review-status: unverified
field-status: {}
