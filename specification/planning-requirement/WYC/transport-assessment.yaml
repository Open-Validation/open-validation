reference: transport-assessment
local-authority: WYC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: 'Dwelling houses: more than 50 units (Transport Statement; more than 80 units, Transport
        Assessment).'
  - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP4, SWDP11 and SWDP21; Worcestershire Local
  Transport Plan 4
source-text: The Worcestershire Local Transport Plan 4 – Highway Design Guide sets out thresholds when
  Transport Assessments will normally be required. These are as follows:- Applications for developments
  below these thresholds and that still have an impact on the local transport network will be required
  to provide a Transport Statement.
must-include:
- item: A Travel Plan with every Transport Assessment
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 19-21. The list is joint with Malvern Hills
  District Council. The thresholds table (page 20) is an image. For dwelling houses it sets a Transport
  Statement above 50 units and a Transport Assessment above 80. It also sets floorspace, bedroom, bed,
  student and resident thresholds for other uses that have no field here. The Council also weighs factors
  such as trip generation, existing transport use and cumulative impacts, and smaller schemes 'that still
  have an impact' need a Transport Statement, so the rule also shows as discretionary.
review-status: unverified
field-status: {}
