notes: From the council's list (published November 2025), page 14. The list is joint with Malvern Hills
  District Council. Exempt development (householder, de minimis, self-build and the other statutory exemptions)
  is outside the law, so the file uses biodiversity-gain-condition. The draft Biodiversity Gain Plan,
  the bespoke compensation strategy for irreplaceable habitats and the draft Habitat Management and Monitoring
