reference: travel-plan
local-authority: WYC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: More than 1,000 sq. metres of non-residential building floorspace.
  - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP4
source-text: SWDP policy SWDP4 states that Travel Plans will be required for all major development – that
  is for planning applications proposing 10 or more dwellings or more than 1,000 sq. metres of non-residential
  building floorspace. A Travel Plan is also required with all Transport Assessments.
must-include:
- item: Measures to reduce car travel and encourage cycling, walking and public transport, with agreed
    targets and monitoring
  level: must
- item: 'For town centre developments: how the needs of alternative powered vehicles have been considered'
  level: must
  required-if:
    site:
      in:
      - town-centre
      description: A town centre development.
confidence: medium
notes: From the council's list (published November 2025), page 21. The list is joint with Malvern Hills
  District Council. A Travel Plan is also needed with every Transport Assessment, whose need is partly
  discretionary, so that part shows as discretionary.
review-status: unverified
field-status: {}
