reference: daylight-sunlight-assessment
local-authority: WYC
required-if:
  any:
  - all:
    - condition:
        field: storey-count
        operator: '>='
        value: 3
        description: New buildings with three or more storeys (an example).
    - condition:
        field: adjoins-residential-property
        value: true
        description: On a site adjoining or close to existing residential properties.
  - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP21
source-text: With planning applications where there is a potential adverse impact upon the current levels
  of sunlight/daylighting enjoyed by adjoining properties and building(s). For example, for development
  proposals of new buildings with three or more storeys on sites adjoining or in close proximity to existing
  residential properties.
must-include:
- item: Follows the BRE guide 'Site layout planning for daylight and sunlight' (BR 209, 2022)
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 5. The list is joint with Malvern Hills
  District Council. A 'potential adverse impact' is a judgement and the three-storey case is an example,
  so it also shows as discretionary.
review-status: unverified
field-status: {}
