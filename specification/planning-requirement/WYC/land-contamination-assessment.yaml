reference: land-contamination-assessment
local-authority: WYC
required-if:
  all:
  - condition:
      field: new-build
      value: true
      description: Applications proposing new buildings.
  - any:
    - site:
        in:
        - contaminated-land
        description: The site is or has been used for purposes that may lead to ground contamination,
          has a history of a contamination incident, or is in an established buffer zone to a site known
          to be contaminated.
    - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP31
source-text: 'For all applications proposing new buildings where: - the development site is or has been
  used for purposes that may lead to ground contamination (eg. Industrial land, agricultural land where
  inappropriate spreading may have occurred); or - the site has a history of a contamination incident;
  or - the development site is within an established buffer zone to a site that is known to suffer from
  ground contamination (for example land where records held by the Council under Part 2A of the Environmental
  Protection Act 1990 indicates contamination is present).'
must-include:
- item: Whether the land is contaminated and, if so, whether it can be remediated
  level: must
- item: Where contamination is suspected, a Phase 1 assessment identifying and assessing the sources,
    pathways and receptors of ground pollution
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 10-11. The list is joint with Malvern Hills
  District Council. The list adds that 'The Council will consider whether an assessment is required depending
  upon the nature and known history of the site', so it also shows as discretionary.
review-status: unverified
field-status: {}
