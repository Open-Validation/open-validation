reference: flood-risk-assessment
local-authority: WYC
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Proposals of 1 hectare or greater in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Proposals of 1 hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: New development (including minor development and change of use) in Flood Zones 2 and
        3.
  - site:
      in:
      - critical-drainage-area
      description: New development in Flood Zone 1 with critical drainage problems (as highlighted by
        the Environment Agency).
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Development, including a change of use to a more vulnerable class.
    - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP28
source-text: In line with footnote 55, page 48 of the NPPF, a Flood Risk Assessment is required:- • with
  applications for proposals of 1 hectares or greater in flood zone 1; • with all application proposing
  new development (including minor development and change of use) in Flood Zones 2 and 3; • with all applications
  proposing new development within flood zone 1 which has critical drainage problems (as highlighted by
  the Environment Agency; … • with all applications proposing development (including minor development
  and change of use to a more vulnerable class) on land that may be subject to other sources of flooding.
must-include:
- item: Information showing the development complies with the sequential and exception tests in the NPPF
    and Planning Practice Guidance
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 7-8. The list is joint with Malvern Hills
  District Council. Land 'that may be subject to other sources of flooding' has no field, so that part
  shows as discretionary.
review-status: unverified
field-status: {}
