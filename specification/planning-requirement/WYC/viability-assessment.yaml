reference: viability-assessment
local-authority: WYC
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Housing where affordable housing (or a contribution in lieu) is required under SWDP15
        but is not proposed in full for viability reasons.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Obligations, contributions or features required by SWDP policies are not proposed for
        viability reasons.
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP7, SWDP15 and SWDP62
source-text: A viability assessment will be required with all planning application proposing:- - housing
  where under SWDP policy 15 affordable housing or a contribution in lieu of on-site affordable housing
  is required and for viability reasons the level of affordable housing contribution in lieu of on-site
  provision is not being proposed; or - any development that requires planning obligations, planning contributions
  or any feature under the terms of the SWDP policies, but where such obligations, contributions or features
  are not being proposed due to viability reasons.
must-include:
- item: Enough financial information to show why the scheme cannot support the affordable housing or infrastructure,
    on an open book basis (Gross Development Value, costs, land value, competitive return)
  level: must
- item: A quantity surveyor's cost assessment
  level: must
- item: Market evidence of sales rates and site values
  level: must
- item: A development and sales programme (if relevant)
  level: must
- item: Details of any exceptional development costs
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 22-23. The list is joint with Malvern Hills
  District Council. The applicant pays for the council's independent review.
review-status: unverified
field-status: {}
