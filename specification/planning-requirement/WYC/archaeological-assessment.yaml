reference: archaeological-assessment
local-authority: WYC
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: Affects a Scheduled Ancient Monument.
  - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP24
source-text: A desk-based assessment will be required where an initial assessment indicates the proposed
  development affects an archaeologically sensitive area (including a Scheduled Ancient Monument or non-designated
  sites of archaeological interest). … A field evaluation report will be required where the desk-based
  assessment demonstrates information that suggests further evaluation of the site is required prior …
  to the determination of the application before being submitted .
must-include:
- item: A field evaluation report where the desk-based assessment shows further evaluation is needed before
    determination
  level: must
  required-if: discretionary
- item: Evaluation carried out by an appropriate and qualified professional
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 4-5. The list is joint with Malvern Hills
  District Council. Whether a site is 'archaeologically sensitive' follows an initial assessment and can
  be checked with the Archaeology and Planning Advisor, so apart from Scheduled Monuments it shows as
  discretionary.
review-status: unverified
field-status: {}
