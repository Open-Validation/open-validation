reference: planning-statement
local-authority: WYC
required-if:
  condition:
    field: departure-from-development-plan
    value: true
    description: The application proposes development contrary to the development plan policies.
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016
source-text: Planning Statement setting out comments in support of proposals can be submitted with any
  planning application. However a statement will be required when an application proposes development
  contrary to the development plan policies.
must-include:
- item: Why the proposal complies with relevant development plan policies or, if not, why permission should
    be granted contrary to them
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 16. The list is joint with Malvern Hills
  District Council. It can be submitted with any application but is only required for proposals contrary
  to the development plan.
