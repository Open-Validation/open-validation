reference: biodiversity-survey-report
local-authority: WYC
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - national-nature-reserve
      - local-wildlife-site
      - local-nature-reserve
      description: Development that would affect a site designated for its biodiversity or geological
        value.
  - condition:
      field: protected-species
      value: true
      description: Likely to have an impact on wildlife and biodiversity (e.g. protected species).
  - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP22; Town and Country Planning Act 1990,
  Schedule 7A
source-text: Appropriate ecological information should be provided with applications that:- - … - propose
  development that would affect a site designated for its biodiversity or geological value; or - propose
  development that is likely to have an impact on wildlife and biodiversity.
must-include:
- item: Existing biodiversity interests on the land and on adjoining or nearby land that may be affected
  level: must
- item: Possible impacts on the biodiversity interests
  level: must
- item: Avoidance, mitigation and/or compensation measures
  level: must
- item: In most cases a Preliminary Ecological Appraisal (PEA) informing further survey needs
  level: should
- item: A Protected Species Survey and Assessment where protected species are likely to be affected
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species likely to be affected.
- item: Surveys by competent, suitably qualified persons at an appropriate time of year, in suitable weather,
    over sufficient time, using nationally recognised methods
  level: must
- item: Habitats, features and species present or likely, their extent, and a plan of their distribution
    and use
  level: must
- item: Direct and indirect impacts during and after construction, and where harm is likely how alternatives,
    avoidance, mitigation and compensation have been considered
  level: should
- item: Proposed enhancement works and likely changes to habitats or species numbers (net loss or gain)
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 12-14. The list is joint with Malvern Hills
  District Council. The list's 'Nature Conservation/Ecological Information'. Its examples (barn conversions,
  demolition, roof spaces, removal of mature trees, orchards, scrub and hedgerows, development near waterbodies)
  and Appendix 1 Table 1 (an image on pages 25-26) set out when surveys are needed, so beyond designated
  sites and protected species it shows as discretionary. The list's third bullet (BNG) is in the bng-metric,
  habitat-baseline and proposed-habitat-plan files.
review-status: unverified
field-status: {}
