reference: air-quality-assessment
local-authority: WYC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 100
      description: Residential development of 100 dwellings or more (an example of significantly affecting
        traffic).
  - condition:
      field: parking-spaces
      operator: '>'
      value: 100
      description: Retail, leisure, commercial or industrial development with more than 100 parking spaces
        (an example).
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Impacting on an Air Quality Management Area.
    - condition:
        field: hgv-movements-daily
        operator: '>='
        value: 25
        description: An increase of HGV movements of 25 annual average daily traffic.
  - condition:
      field: hgv-movements-daily
      operator: '>='
      value: 100
      description: An increase of 100 HGV movements elsewhere.
  - condition:
      field: direct-air-emissions
      value: true
      description: New point sources of air pollution (e.g. furnaces, extraction systems or biomass boiler
        schemes).
  - site:
      in:
      - air-quality-management-area
      description: New development that may impact an Air Quality Management Area, or exposes people in
        outdoor amenity space to existing air pollutants.
  - discretionary
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP31
source-text: Application proposals that impact upon air quality or are potential pollutants should be
  supported by an air quality assessment. Such statements will be required for:- development proposals
  that would significantly affect traffic in the immediate vicinity of the site or further afield e.g.
  residential development of 100 dwellings or more, retail/leisure/commercial/industrial development that
  incorporates more than 100 parking spaces; or … • development that results in significant additional
  large vehicle movements including HGV construction vehicles e.g. major road or infrastructure change
  or large vehicle depot such as bus station, lorry park or businesses that receive a large number of
  HGV’s. In this regard significant is where a proposal results in an increase of HGV movements of 25
  annual average daily traffic where impacting on an Air Quality Management Area or increase of 100 movements
  elsewhere; or • proposals that introduce new point sources of air pollution (e.g. furnaces, extraction
  systems or biomass boiler schemes);or • new residential and other development that includes outdoor
  amenity space that would expose people to existing sources of air pollutants (such as in Air Quality
  Management Areas); • any new development that may impact an existing Air Quality Management Area or
  other area of poor air quality.
confidence: medium
notes: From the council's list (published November 2025), page 3-4. The list is joint with Malvern Hills
  District Council. The 100 dwellings and 100 parking spaces figures are given as examples ('e.g.') of
  significantly affecting traffic, and 'other area of poor air quality' has no field, so the rule also
  shows as discretionary. The list gives no contents beyond pointing to GOV.UK and EPUK/IAQM guidance.
review-status: unverified
field-status: {}
