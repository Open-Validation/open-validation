reference: telecommunications-report
local-authority: WYC
required-if:
  any:
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.wychavon.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents%2FPlanning%2FMaking%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP26
source-text: All applications proposing telecommunications development, including applications for prior
  approval under part 24 of the Town and Country Planning (General Permitted Development) Order).
must-include:
- item: Outcome of consultations with organisations with an interest in the development
  level: must
- item: 'For an addition to an existing mast or base station, or a new one: a self-certified statement
    that cumulative exposure will not exceed ICNIRP guidelines'
  level: must
- item: 'For a new mast or base station: evidence on the possibility of erecting antennas on an existing
    building, mast or other structure, with the operational requirements and technical limitations'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new mast or base station.
confidence: medium
notes: From the council's list (published November 2025), page 19-20. The list is joint with Malvern Hills
  District Council.
review-status: unverified
