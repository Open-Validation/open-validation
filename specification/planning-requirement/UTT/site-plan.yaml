reference: site-plan
local-authority: UTT
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
source-url: https://www.uttlesford.gov.uk/media/11355/005-Outline-Some-Matters-Validation-Checklist/pdf/005_Outline_Some_Matters_Validation_Checklist.pdf?m=637829510532470000
source-text: 'Householder, Listed building consent: All applications – except for A block plan of the
  existing site (1:100, 200 or 500 scale – scale bar included on window replacements, drawing) which must
  show: shopfronts, advertisement.


  Outline: Block Plan Identifies the land to which the application relates (properties shown should be
  numbered or named to ensure that the exact location of the application site is clear) Is drawn to an
  identified metric scale (scale bar included on drawing) Shows the direction of North Site outlined in
  red with a blue line around any other land owned by the applicant which is close to or adjoining the
  application site Shows all the land necessary to carry out the development within the red outline –
  for


  Advertisement consent: All applications – except A block plan of the existing site (1:100, 200 or 500
  scale – scale bar included on for window replacements, drawing) which must show: shopfronts, advertisement.'
must-include:
- item: A block plan at 1:100, 1:200 or 1:500 with a scale bar
  level: must
confidence: medium
notes: '''All applications – except for window replacements, shopfronts, advertisement'' (the block plan
  text is interleaved across columns). Audit (wrong_app_type): the advertisement row came from the outline
  checklist.'
review-status: unverified
