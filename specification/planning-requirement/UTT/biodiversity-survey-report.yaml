reference: biodiversity-survey-report
local-authority: UTT
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: Any works to a roof (preliminary roost assessment for bats).
  - condition:
      field: demolition
      value: true
      description: Any proposed demolition works (preliminary roost assessment for bats).
  - discretionary
source-url: https://www.uttlesford.gov.uk/media/11354/004-Full-Planning-Validation-Checklist/pdf/004_Full_Planning_Validation_Checklist.pdf?m=638313180438070000
source-text: 'Householder: All Ecology reports shall meet the requirements of BS42020 and CIEEM’s Advice
  Note on the age of data – reports over 12 months old may need to be updated – see CIEEM Advice Note
  on the Lifespan of Ecological Reports & Surveys (April 2019 Justification NPPF A preliminary roost assessment
  for bats will be required for ANY works to a roof, and also for ANY proposed demolition works.


  Full planning, Listed building consent: and, where ecological reports recommend that further surveys
  may be necessary, the results of these surveys and details of any mitigation should also be provided
  prior to validation.'
must-include:
- item: A preliminary roost assessment for bats, for any works to a roof or any demolition
  level: must
- item: Reports meet BS42020 and CIEEM advice on the age of data (reports over 12 months old may need
    updating)
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Other cases follow
