reference: proposed-habitat-plan
local-authority: BRD
required-if:
  all:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
  - application-type:
      in:
      - full
      - reserved-matters
      - s73
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-biodiversity-geodiversity-survey-and-report/
policy: Schedule 7A of the Town and Country Planning Act 1990 (Environment Act 2021)
source-text: GIS habitat mapping of pre and post development habitats linked to the BNG Metric calculator.
  ... For outline applications, where the layout of a site and area of land available for provision of
  on-site habitats is not finalised, it is not necessary to submit a Statutory Metric completed for the
  post-development site.
must-include:
- item: GIS habitat mapping of post-development habitats, linked to the BNG metric
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Biodiversity/Geodiversity
  Survey and Report'. Biodiversity Net Gain section. Outline applications need a BNG strategy in the BNG
  report instead. Bradford's text says BNG 'applies to all planning applications unless an exemption applies';
  by law householder and other exempt applications are exempt, so this follows the biodiversity gain condition.
  If you think the development is exempt you must include a statement justifying why. The council also
  asks for a BNG report and a 30-year Biodiversity Plan (sent to unmapped).
review-status: unverified
field-status: {}
