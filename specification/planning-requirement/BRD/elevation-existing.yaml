reference: elevation-existing
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - ldc-prospective-use
      - pa-build-agri-forest
      - advertising
  - condition:
      field: building-works
      value: true
      description: New building work is proposed.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-elevations/
policy: Articles 7 and 39 of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015; Section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: All applications where new building work is proposed
must-include:
- item: Drawn at a scale of 1:50 or 1:100, showing the proposed works in relation to what is already there
  level: must
- item: All external sides of the proposal, including blank elevations
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Existing
  and proposed elevations'. Listed on the planning, major, householder, listed building, advertisement,
  lawful development (proposed) and agricultural prior approval checklists.
review-status: unverified
field-status: {}
