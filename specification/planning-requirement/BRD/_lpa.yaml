validation-list:
  url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/validation-checklist-planning-application/
  date: 2026-10-05
  date-basis: 'Bradford publishes its local list only as undated web pages: the index ''What to submit
    with your planning application'' (https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/national-and-local-validation-requirements/)
    links nine validation checklists (planning permission; major including minerals and waste; householder;
    listed building; advertisement; lawful development existing and proposed; agricultural and new-dwelling
    prior approvals), the ''Local requirements'' and ''National requirements'' pages and one page per
    requirement. No page shows a date. The site''s sitemap.xml gives lastmod 28 May 2026 for the index
    and the Crime Impact Statement page and 5 October 2026 for the Habitats Regulations Assessment page
    (the newest), so the list date is 5 October 2026; the content also cites the BCT 2024 bat guidelines
    and the Environment Agency''s surface water maps of 28 January 2025. Checked on 2026-11-06: no newer,
    draft or consultation list was found on the council''s planning pages, and MHCLG''s register (planning.data.gov.uk,
    local-area-requirements entity 20019) points to the same web checklists. The planning permission checklist
    is used as the list URL; each file''s source-url is the requirement page its wording comes from.'
  status: current
submission-standards:
- item: Every plan has an individual reference identifying the plan, its version number and date of production;
    amended plans follow the same reference format
  level: must
- item: Applications submitted electronically via the Planning Portal
  level: should
