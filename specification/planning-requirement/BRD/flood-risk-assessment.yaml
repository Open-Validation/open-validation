source-text: 'A Flood Risk Assessment must be submitted which includes: your site address a description
  of your development the estimated flood level for your development, taking into account the impacts
  of climate change over its lifetime details of the finished floor levels details of your flood resistance
  and resilience plans any supporting plans and drawings any other information the relevant standing advice
  tells you to include Further information Find out what flood zone you are in : Bradford District S'
