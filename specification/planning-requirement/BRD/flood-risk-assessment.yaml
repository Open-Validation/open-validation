reference: flood-risk-assessment
local-authority: BRD
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3 (including 3b).
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: Creates new floor space (external alterations that create no new floor space are
          excluded).
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3 (including 3b).
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more (in flood zone 1).
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more (in flood zone 1).
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-flood-risk-assessment/
policy: Bradford Core Strategy (2017) policy EN7; NPPF chapter 14
source-text: 'Sites of 1ha or more in Flood Zone 1 Development in flood zones 2 and 3 (including minor
  extensions with a footprint less than 250 square metres and also changes of use) Non householder developments
  in high and medium flood extents ... Householder development in flood zones 2, 3 and 3B (including sheds,
  garages and games rooms etc within the curtilage) Excluding proposals for: External alterations to buildings
  that create no new floor space'
must-include:
- item: 'Minor non-domestic extensions under 250 sq m in flood zones 2 and 3: a simple assessment following
    the Environment Agency''s Standing Advice for Minor Developments'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - condition:
        field: footprint-area
        operator: <
        value: 250
        description: A minor non-domestic extension with a footprint under 250 square metres.
- item: 'Householder: site address, description of the development, estimated flood level allowing for
    climate change, finished floor levels, flood resistance and resilience plans, supporting plans and
    drawings'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Flood
  Risk Assessment'. Also page 'Flood Risk Assessment (Householder)'. Larger proposals follow the Environment
  Agency's standing advice for vulnerable developments or its detailed FRA advice; the FRA forms part
  of any Environmental Statement.
review-status: unverified
field-status: {}
