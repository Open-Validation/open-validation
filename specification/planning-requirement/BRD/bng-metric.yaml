reference: bng-metric
local-authority: BRD
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-biodiversity-geodiversity-survey-and-report/
policy: Schedule 7A of the Town and Country Planning Act 1990 (Environment Act 2021)
source-text: 'If your development is not exempt, the following BNG information will be required at validation
  stage and should be prepared by a Suitably Experienced Ecologist:'
must-include:
- item: A completed draft of the Statutory BNG Metric calculator for pre and post development showing
    a 10% net gain, with all elements completed and trading rules met (unless otherwise agreed with the
    council)
  level: must
- item: Presence of any irreplaceable habitat identified in the metric
  level: must
- item: 'Outline applications: the post-development metric is not needed where layout and on-site habitat
    areas are not finalised'
  level: should
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Biodiversity/Geodiversity
  Survey and Report'. Biodiversity Net Gain section. Bradford's text says BNG 'applies to all planning
  applications unless an exemption applies'; by law householder and other exempt applications are exempt,
  so this follows the biodiversity gain condition. If you think the development is exempt you must include
  a statement justifying why. The council also asks for a BNG report and a 30-year Biodiversity Plan (sent
  to unmapped).
review-status: unverified
field-status: {}
