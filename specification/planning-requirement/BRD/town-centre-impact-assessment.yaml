reference: town-centre-impact-assessment
local-authority: BRD
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside of centres.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up-to-date plan.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 1500
        description: Greater than 1,500 sqm gross retail and/or leisure floorspace (the Bradford City
          Centre threshold, the highest).
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1000
          description: Greater than 1,000 sqm, for Keighley, Shipley, Bingley and Ilkley.
      - discretionary
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: Greater than 500 sqm, for District Centres.
      - discretionary
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: Greater than 200 sqm, for Local Centres.
      - discretionary
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-town-centre-uses-impact-assessment/
policy: Bradford Core Strategy (2017) policies SC4, EC1, EC2 and EC5; NPPF chapter 7
source-text: 'Applications for retail and leisure developments outside of centres, which are not in accordance
  with an up-to-date plan, will require an Impact Assessment where: The proposal provides greater than
  1,500 sqm gross retail and / or leisure floorspace for Bradford City Centre. The proposal provides greater
  than 1,000 sqm gross retail and / or leisure floorspace for Keighley, Shipley, Bingley and Ilkley. The
  proposal provides greater than 500 sqm gross retail and / or leisure floorspace for District Centres.
  The proposal provides greater than 200 sqm gross retail and / or leisure floorspace for Local Centres.'
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on town centre vitality and viability, including consumer choice and trade, up to five
    years from the application (ten years for major schemes whose full impact takes longer)
  level: must
- item: Scope agreed with the council before submission
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Town
  Centre Uses Impact Assessment'. Listed on the major checklist. The threshold depends on which centre
  is affected; above 1,500 sqm it applies whichever centre it is, below that which centre applies needs
  judgement, so those parts show as check.
review-status: unverified
field-status: {}
