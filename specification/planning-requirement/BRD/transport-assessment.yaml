reference: transport-assessment
local-authority: BRD
required-if:
  ref: major-development
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-transport-assessment/
policy: Bradford Core Strategy (2017) policies TR1 and TR4; NPPF chapter 9
source-text: A Transport Assessment is required for major development proposals likely to have significant
  transport implications. A Transport Statement is required for major development proposals which would
  have less than significant transport implications
must-include:
- item: Transport Assessment where transport implications are significant; a Transport Statement where
    it is agreed they are limited
  level: must
  required-if: discretionary
- item: Quantifies the travel characteristics of the development by all modes and the resulting impact
    on transport infrastructure
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Transport
  Assessments and Statements'. Every major proposal needs either an assessment or a statement; which one
  depends on its transport implications and pre-application scoping. Listed on the major checklist.
review-status: unverified
field-status: {}
