reference: lighting-assessment
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: external-lighting
      value: true
      description: Installation of external non-domestic lighting or floodlighting.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-lighting-assessment/
policy: Bradford Core Strategy (2017) policy EN8; NPPF chapter 15
source-text: All developments that involve proposals for the installation of external non domestic lighting
  and floodlighting
must-include:
- item: Hours of operation, light spillage, light levels and column heights
  level: must
- item: Layout plan showing beam orientation
  level: must
- item: Design and specification of the equipment
  level: must
- item: Expected impact on neighbouring homes, roads, listed buildings and conservation areas
  level: must
- item: Impact on protected or priority species and mitigation to maintain or enhance biodiversity
  level: must
- item: Measures to mitigate or compensate for the impacts
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Lighting
  Assessment'. Listed on the planning and major checklists.
review-status: unverified
field-status: {}
