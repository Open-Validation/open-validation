reference: viability-assessment
local-authority: BRD
required-if:
  all:
  - ref: major-development
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant wishes to show the site is unviable at the required level of planning
        obligations and policy requirements.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-planning-obligations-draft-heads-of-terms/
policy: 'Bradford Core Strategy (2017) policies ID2, ID3 and HO11; National Planning Practice Guidance:
  Viability'
source-text: 'Where an applicant wishes to demonstrate that a site is financially unviable at the level
  of planning obligations and policy requirements required, a suitably detailed Financial Viability Assessment
  must be submitted to support this claim. National Planning Practice Guidance: Viability provides guidance
  on the content of viability assessments. An application will not be considered as ‘valid’ unless a financial
  viability assessment has been submitted.'
must-include:
- item: 'Suitably detailed, following National Planning Practice Guidance: Viability'
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Planning
  Obligations Draft Heads of Term Statement'. Part of the heads of terms requirement for major developments
  (heads of terms sent to unmapped).
review-status: unverified
field-status: {}
