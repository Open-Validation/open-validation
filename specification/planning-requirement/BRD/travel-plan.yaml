reference: travel-plan
local-authority: BRD
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-travel-plan/
policy: Bradford Core Strategy (2017) policies TR1 and TR4; NPPF chapter 9
source-text: Major development proposals which likely to have significant transport implications such
  as schools and educational establishments, public buildings, employment retail and leisure uses and
  residential schemes including homes for the elderly or student accommodation. Developments where Air
  Quality Mitigation measures are required
must-include:
- item: How the transport implications will be managed to minimise environmental, social and economic
    impacts
  level: must
- item: Commitment by developers and occupiers to reduce single occupancy car trips, and mechanisms to
    maximise sustainable transport
  level: must
- item: SMART mode share and trip targets, with an implementation and monitoring strategy (WY Travel Plan
    Network for employment sites)
  level: must
- item: Measures if targets are not met, and a budget for measures
  level: must
- item: Travel plan co-ordinator, management arrangements and timetable; marketing and promotion activities
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Travel
  Plan'. Listed on the major checklist. Whether a major proposal has 'significant transport implications'
  or needs air quality mitigation needs judgement, so it shows as check.
review-status: unverified
field-status: {}
