reference: fire-statement
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/national-requirements-fire-statement/
policy: Article 9A of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'A Fire Statement must accompany an application for planning permission for development which
  involves: the provision of one or more relevant buildings, development of an existing relevant building
  or development within the curtilage of a relevant building Relevant buildings contain two or more dwellings
  or educational accommodation and meet the height condition of 18m or more in height, or 7 or more storeys.'
must-include:
- item: On the Fire Statement Form published by the Secretary of State
  level: must
- item: The fire safety principles, concepts and approach applied to each building; the site layout; emergency
    vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account was taken of it; how relevant local fire safety
    policies were taken into account
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'National Requirements -
  Fire Statement'. Outline applications are exempt, as are some changes of use (see the page).
review-status: unverified
field-status: {}
