reference: roof-plan-proposed
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
  - condition:
      field: building-works
      value: true
      description: New building work is proposed.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-roof-plan/
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; Section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: All applications where new building work is proposed
must-include:
- item: Drawn at a scale of 1:50 or 1:100, showing any roof that would be altered by the development
  level: must
- item: Roofing materials, vents and their location
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Roof
  Plan'. Listed on the planning, major, householder and listed building checklists. The page asks for
  one roof plan showing the altered roof, so no existing roof plan file is written.
review-status: unverified
field-status: {}
