reference: landscaping-plan
local-authority: BRD
required-if:
  all:
  - ref: major-development
  - condition:
      field: external-space
      value: true
      description: The proposal includes any external space.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-landscaping-scheme/
policy: Bradford Core Strategy (2017) policies EN4, DS2 and DS3; Landscape Character Assessment SPD; Homes
  and Neighbourhoods SPD
source-text: All major applications, including outline proposals, that include any external space must
  be accompanied by a landscape strategy plan (integrating tree planting) and a written landscape statement
  detailing the design approach proposed.
must-include:
- item: Landscape strategy plan integrating tree planting, and a written landscape statement on the design
    approach
  level: must
- item: Extent of existing and proposed planting areas and planting types; locations and types of new
    trees; hard surfacing; boundary treatments; earthworks and ground level changes
  level: must
- item: Planting plans with species, size, density, numbers and (for trees and some shrubs) root condition
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Landscaping
  Scheme'. Listed on the major checklist.
review-status: unverified
field-status: {}
