reference: noise-assessment
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: New noise or vibration sensitive uses (homes, residential institutions, hospitals,
          medical and educational establishments) next to major noise sources (roads, railways, industry,
          commerce, entertainment venues).
    - condition:
        field: noise-generating-use
        value: true
        description: Pubs, nightclubs, places of worship, day nurseries, sports halls and sports provision,
          industry with noisy machinery, wind turbines or other uses generating high noise or vibration.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-noise-assessment/
policy: Bradford Core Strategy (2017) policy EN8; NPPF chapter 15
source-text: New noise or vibration sensitive uses such as residential developments, residential institutions,
  hospitals, medical and educational establishments, adjacent to major sources of noise such as roads,
  railways, industrial and commercial (including existing entertainment venues) Proposals for public houses,
  nightclubs, places of workshop, day nurseries, sports halls, industrial developments using noisy machinery,
  indoor and outdoor sports provision, wind turbines, drinking establishments and nightclubs and other
  uses that generate high levels of noise or vibration
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Potential noise sources and their effect on local amenity and environmental receptors, particularly
    near designated sites
  level: must
- item: How the issues will be overcome, including sound insulation measures
  level: must
- item: Construction site noise controls following BS 5228
  level: must
  required-if: discretionary
- item: 'New dwellings near existing commercial or industrial buildings: evidence that future occupiers
    will not be disturbed by noise, vibration, dust, odours, fumes or lighting'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Planned dwellings near existing commercial or industrial buildings.
- item: 'New commercial/industrial buildings near existing noise-sensitive properties: noise impact assessment
    using BS 4142 or another method agreed with Environmental Health'
  level: must
  required-if:
    condition:
      field: near-noise-sensitive-use
      value: true
      description: Proposed commercial or industrial buildings close to existing noise-sensitive properties.
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Noise
  Assessment'. Listed on the planning and major checklists.
review-status: unverified
field-status: {}
