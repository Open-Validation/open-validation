reference: floor-plan-proposed
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - ldc-prospective-use
      - pa-build-agri-forest
  - any:
    - condition:
        field: building-works
        value: true
        description: New building work is proposed.
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use, even where no external work or alterations are carried out.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-floor-plans/
policy: Articles 7 and 39 of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015; Section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: All applications where new building work is proposed ... Existing and proposed floor plans
  are also required for changes of use where no external work or alterations are to be carried out.
must-include:
- item: Drawn at a scale of 1:50 or 1:100, explaining the proposal in detail
  level: must
- item: New buildings shown in context with adjacent buildings (including property numbers where applicable)
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Existing
  and proposed floor plans'. Listed on the same checklists as elevations (not advertisement).
review-status: unverified
field-status: {}
