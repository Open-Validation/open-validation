reference: arboriculturist-report
local-authority: BRD
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the application site (excluding changes of use where no building works are
        proposed).
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The site contains trees.
  - site:
      in:
      - tree-preservation-zone
      description: Protected trees on adjoining land within falling distance of the site.
  - condition:
      field: veteran-trees
      value: true
      description: Development within 15m of a veteran or ancient tree.
  - site:
      in:
      - ancient-woodland
      description: Development within 25m of ancient woodland, semi natural ancient woodland or ancient
        replanted woodland.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-tree-survey/
source-text: 'the application site Planning applications on sites in a conservation area containing trees
  and/or where protected trees on adjoining land which are within falling distance of the application
  site Planning applications where development is planned within 15m of a veteran or ancient tree Planning
  applications where development is planned within 25m of Ancient woodland, semi natural ancient woodland
  or ancient replanted woodland Excluding proposals for: Changes of use where no building works are p…'
must-include:
- item: A Tree Protection Plan showing how Root Protection Areas will be protected through fencing to
    the BS 5837 specifications, or by other means such as ground protection
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): the Tree Survey page is for planning applications near trees, not tree
  works. The start of the trigger is cut off in the excerpt. The audit says the householder checklist
  also lists a tree survey.'
review-status: unverified
field-status: {}
