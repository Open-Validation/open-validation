reference: air-quality-assessment
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - all:
      - ref: major-development
      - any:
        - condition:
            field: eia-development
            value: true
            description: An EIA is required and includes air quality and/or transport as a likely impact.
        - condition:
            field: traffic-aadt-increase
            operator: '>'
            value: 5
            description: Likely to increase traffic flows by more than 5% on roads with more than 10,000
              AADT (or change average speeds by more than 10 km/hr).
        - discretionary
    - condition:
        field: biomass-or-chp
        value: true
        description: Likely to give rise to significant point source emissions to air (biomass boilers,
          STOR, CHP or other combustion).
    - condition:
        field: dust-generation
        value: true
        description: Likely to give rise to significant fugitive emissions of particulate matter (quarrying,
          stone preparation, large-scale earth movement).
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: Introduces new relevant receptors (homes, health, nurseries, education, HMOs, some
            outdoor public areas).
      - site:
          in:
          - air-quality-management-area
          description: In an existing Air Quality Management Area and/or Clean Air Zone (exposure assessment).
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: Introduces new relevant receptors.
      - discretionary
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-air-quality-assessment/
policy: Bradford Core Strategy (2017) policies SC2, TR6 and EN8; West Yorkshire Air Quality and Emissions
  Technical Planning Guidance (WYLES)
source-text: 'Only developments classified as ‘major’ in the WYLES planning guidance (PDF) usually require
  a full Air Quality Impact Assessment and Damage Cost Calculation: Major developments where an EIA is
  required and includes air quality and/or transport as a specific likely impact. Major developments likely
  to increase traffic flows by more than 5% on roads with >10,000 AADT or change average speeds by > 10
  km/hr – likely to cause increased congestion and/or diversion of traffic to other areas Major developments
  where a transport assessment is required and HGV movements are =/> 10% of total trips Major highway
  infrastructure changes that will add, remove or replace major junctions, roundabouts, traffic lanes,
  cycle lanes, bus lanes etc. and/or cause long term diversion of traffic into other areas Applications
  likely to give rise to significant point source emissions to air, for example biomass boilers, Short
  Term Operating Reserve (STOR), Combined Heat and Power (CHP) and any other installations that involve
  combustion or other activity likely to give rise to significant quantities of NOx and/or particulate
  matter for example crematoria, pyrolysis plants etc. Applications likely to give rise to significant
  fugitive emissions of particulate matter for example quarrying, stone preparation, large scale earth
  movement /excavation etc. Applications where significant demolition and construction works are proposed.
  ... The following developments classified as "minor", "medium" and "major" in the WYLES planning guidance
  (PDF): Proposals that would introduce new relevant receptor points* into existing Air Quality Management
  Areas (AQMA(s)) and/or Clean Air Zone(s) (CAZ).'
must-include:
- item: Full justification of the WYLES classification (minor, medium or major), taking account of the
    size of the development and expected traffic generation
  level: must
  source-text: The planning application should include full justification of the classification taking
    into account the size of the development and expected traffic generation figures (where appropriate).
- item: 'For WYLES ''major'' developments: an Air Quality Impact Assessment and a Damage Cost Calculation'
  level: must
  required-if:
    ref: major-development
- item: 'For WYLES ''medium'' and ''major'' developments: a Low Emission Travel Plan'
  level: must
  required-if: discretionary
  source-text: Where required Low Emission Travel Plans should be provided with the application.
- item: 'Exposure assessment: shows that exposure reduction (orientation of buildings, habitable rooms
    and outdoor spaces away from roads and emission sources) was considered in the design'
  level: must
  required-if:
    condition:
      field: sensitive-end-use
      value: true
      description: Introduces new relevant receptors.
  source-text: Planning applications should demonstrate that exposure reduction has been taken into consideration
    when designing schemes.
- item: Details of all proposed emission mitigation measures
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Air
  Quality Assessment'. Also page 'Local Requirements - Exposure Assessment'. All applications creating
  new or additional vehicle trips or parking should first be screened against the WYLES guidance. The
  air quality assessment is on the major checklist; the exposure assessment is on the planning and major
  checklists. Major highway infrastructure changes, HGV movements of 10% or more of trips, significant
  demolition and construction, and new receptors near busy roads, point sources or dusty processes (other
  exposure triggers) need judgement, so they show as check.
review-status: unverified
field-status: {}
