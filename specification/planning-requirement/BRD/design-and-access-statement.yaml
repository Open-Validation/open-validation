reference: design-and-access-statement
local-authority: BRD
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - all:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: In a conservation area and/or Saltaire World Heritage Site.
      - all:
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings creating 100 square metres or more of floorspace.
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: In a conservation area and/or Saltaire World Heritage Site.
  - application-type:
      in:
      - lbc
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/national-requirements-design-and-access-statement-planning/
policy: Article 9 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'A Design and Access Statement must accompany the following types of application for outline
  or full planning permission: All major planning applications* Applications for the provision of one
  or more dwellings in a conservation area and/or Saltaire World Heritage Site Applications for the provision
  of a building or buildings where the floorspace created is 100 square metres or more in a conservation
  area and/or Saltaire World Heritage Site All Listed Building Consent applications This does not apply
  to applications for: A material change in the use of land or buildings, unless it involves operational
  development Section 73 Variation or Removal of condition application Mining and engineering operations'
must-include:
- item: Assessment of the character and physical features of the site and its surroundings, including
    any potential assets and constraints
  level: must
- item: Explanation of the design approach and principles, how they take account of that assessment and
    align with the District's design guidance
  level: must
- item: Description of any heritage assets affected, including the contribution of their setting, and
    how their character and distinctiveness is affected
  level: must
- item: Explanation of any other factors that influenced the design (planning policy, access policy, specific
    user requirements, etc.)
  level: must
- item: What consultation or pre-application discussions on design and access have taken place and what
    account was taken of them
  level: must
- item: How the scheme has evolved during the design process
  level: must
  required-if: discretionary
- item: Visual material such as photographs, sketches, cross-sections and diagrams, annotated to show
    their relevance
  level: should
- item: Crime impact assessment included and clearly identified, where one is required
  level: must
  required-if: discretionary
  source-text: For developments that also require a crime impact assessment, this should form part of
    the Design and Access Statement and be clearly identified.
- item: 'Listed building consent: how the design principles take account of the building''s special architectural
    or historic importance, its particular physical features that reflect its significance, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'National Requirements -
  Design and Access Statement (planning)'. Also page 'Design and Access Statement (listed building consent)'.
  Not needed for a material change of use without operational development, section 73 applications, or
  mining and engineering operations. Access issues are not needed for listed building works affecting
  only the interior. For minor proposals that also need a Heritage Statement a single combined document
  is recommended. 'Where relevant' items show as check.
review-status: unverified
field-status: {}
