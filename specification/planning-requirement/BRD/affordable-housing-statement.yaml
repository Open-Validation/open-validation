reference: affordable-housing-statement
local-authority: BRD
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Site area of 0.5 hectares or more.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-affordable-housing-statement/
policy: Bradford Core Strategy (2017) policy HO11; NPPF chapter 5
source-text: Developments of 10 or more dwellings, or the site has an area of 0.5 hectares or more
must-include:
- item: Total number of affordable dwellings, and their mix by house type and by tenure
  level: must
- item: Plans showing the location of affordable dwellings, with a schedule of bedrooms, accessibility
    category and unit size (GEA and GIA) of each
  level: must
- item: Basis of calculation of any service charges, ground rents or management fees
  level: must
- item: Summary of design, construction detail and equipping of the affordable dwellings, including curtilage
    design and access
  level: must
- item: Phasing of the development, including provision of the affordable dwellings
  level: must
- item: How the affordable dwellings will be transferred, managed, allocated and let, and details of any
    Registered Provider
  level: must
- item: 'Outline applications: a statement of intent on how affordable housing will be provided and whether
    the site will comply with the SPD'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Affordable
  Housing Statement'. Listed on the major checklist.
review-status: unverified
field-status: {}
