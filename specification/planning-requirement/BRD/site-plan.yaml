reference: site-plan
local-authority: BRD
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - s73
    - lbc
    - ldc-prospective-use
    - pa-build-agri-forest
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/national-requirements-site-plan-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Section 10
  of the Planning (Listed Buildings and Conservation Areas) Act 1990 (block plan)
source-text: A site plan must be submitted with all applications. ... All applications for listed building
  consent
must-include:
- item: At an identified standard metric scale (typically 1:200 or 1:500)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - ldc-prospective-use
      - pa-build-agri-forest
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads, public rights of way and footpaths on adjoining land, including access arrangements,
    and rights of way crossing the site
  level: should
- item: The position of all trees on the site and on adjacent land
  level: should
- item: The extent and type of any hard surfacing; boundary treatment including walls or fencing
  level: should
- item: 'Non-householder: existing and proposed access and parking arrangements, the proposed location
    of electric vehicle charging infrastructure and proposed refuse storage/recycling arrangements'
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
- item: Existing and proposed parking provision, or a statement that no parking is to be provided
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: The application affects existing parking or servicing arrangements or creates a need
        for additional parking or servicing.
  source-text: Existing and proposed parking provision should be clearly shown on the Site Plan. If no
    parking is to be provided, this should be stated.
- item: The proposed location of statutory electric vehicle recharging points, where these are required
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: Statutory electric vehicle recharging points are required (new or additional parking).
  source-text: Where statutory electric vehicle recharging points are required the proposed location of
    these should also be shown on the site plan.
- item: 'Householder: the position of all trees on the site and on adjoining land within falling distance
    of the proposed development'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal would affect trees on the site or trees on adjoining land within falling
          distance.
  source-text: The site plan must include the position of all trees on the application site and those
    on adjoining land which are within falling distance of the proposed development.
- item: 'Listed building consent (block plan): at a scale of 1:100 or 1:200, showing site boundaries,
    the type and height of boundary treatment where a change is proposed, and any building or structure
    on the other side of the boundaries where it could influence or be affected by the development'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: These should be drawn at a scale of 1:100 or 1:200 and show site boundaries; the type and
    height of boundary treatment (for example walls or fences) where a change is proposed; the position
    of any building or structure on the other side of such boundaries, where these could influence or
    be affected by the proposed development.
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'National requirements -
  site plan (non householder)'. Also pages 'Site Plan (Householder)', 'Block Plan (listed building consent)',
  'Parking Plan' and 'Tree Survey and Arboricultural Impact Assessment'. The 'should' items are needed
  'unless these would not influence or be affected by the proposed development'. Listed on the planning,
  major, householder, lawful development (proposed) and agricultural prior approval checklists; the listed
  building consent checklist asks for a block plan instead.
review-status: unverified
field-status: {}
