reference: biodiversity-survey-report
local-authority: BRD
required-if: discretionary
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-biodiversity-geodiversity-survey-and-report/
policy: Bradford Core Strategy (2017) policies EN2 and SC8; Wildlife and Countryside Act 1981; Conservation
  of Habitats and Species Regulations 2017
source-text: 'Planning applications that may affect natural or semi-natural habitats (including brownfield
  sites, parks and gardens) or protected and notable species including habitats and species of principal
  importance (as listed in Section 41 of the Natural Environment Rural Communities Act, 2006) and Biodiversity
  Action Plan habitats and species. ... Planning applications likely to affect a designated site including:
  Special Protection Area (SPA), Special Area of Conservation (SAC), Site of Special Scientific Interest
  (SSSI), Local Nature Reserve (LNR), Local Wildlife Site (LWS), Local Geological Site (LGS) or wildlife
  habitat network, and/or ancient woodland ... Planning applications where there is a reasonable likelihood
  of bats being found within or adjacent to the application site. ... Householder applications where there
  is a ''reasonable likelihood'' of bats being present within or adjacent to the application site.'
must-include:
- item: 'Preliminary Ecological Appraisal as a minimum: biodiversity value of the site, ecological constraints
    in the zone of influence, mapping of habitats and features that could support protected or notable
    species, and recommendations for further survey'
  level: must
- item: 'Ecological Impact Assessment where the proposal could affect protected or notable habitats or
    species, designated sites or the Habitat Network: impacts and significance of effects, avoidance,
    mitigation and enhancement measures with long-term management, and residual impacts'
  level: must
  required-if: discretionary
- item: Carried out in line with BS 42020:2013 by a Suitably Qualified Ecologist, at the right time of
    year, and up to date
  level: must
- item: Evidence of how the proposal will enhance the site for biodiversity (e.g. bat and bird boxes,
    habitat piles, refuges)
  level: should
- item: 'Bat survey: report submitted with the application (bat surveys cannot be conditioned); at least
    a Preliminary Bat Roost Assessment, by an ecologist with a Natural England licence, to the Minimum
    Standards for Bat Surveys in West Yorkshire'
  level: must
  required-if: discretionary
  source-text: If a survey is required, the survey report must be submitted with the application prior
    to validation. Bat surveys cannot be conditioned.
- item: 'Where bat roost potential is negligible or impacts can be avoided: a statement from a Suitably
    Experienced Ecologist'
  level: must
  required-if: discretionary
- item: 'South Pennine Moors Zone B (0-2.5 km): habitat survey (PEA or EcIA) assessing the site''s value
    as supporting habitat for SPA birds, with nocturnal foraging surveys where needed'
  level: must
  required-if:
    all:
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        description: Within 2.5 km of the South Pennine Moors SPA/SAC boundary (Zone B).
    - discretionary
  source-text: Applications in Zone B must be accompanied by a habitat survey presented in a Preliminary
    Ecological Appraisal (PEA) or Ecological Impact Assessment (EcIA) identifying the value of the site
    as supporting habitat to the SPA/SAC in terms of providing foraging habitat for the qualifying bird
    species (including assemblage species).
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Biodiversity/
  Geodiversity Survey and Report'. Also pages 'Bat survey', 'Bat Roost Potential Assessment Form and Bat
  Survey (Householder)' and 'Habitats Regulations Assessment and impact on South Pennine Moors'. Shows
  as check because every trigger depends on whether the proposal 'may affect' habitats, species or designated
  sites, or whether there is a 'reasonable likelihood' of bats (judged with the Bradford Bat Alert Layer
  and the West Yorkshire Bat Alert Layer Guidance). For householder works to large Georgian, Victorian
  or Edwardian houses, stone or brick farm buildings or any property in the Bat Alert layer, a Bat Roost
  Potential Assessment Form is required first (sent to unmapped). Zone B excludes entirely brownfield
  sites, farm or house curtilages, sites within 25m of a settlement boundary or main road, woodland and
  arable land.
