reference: heritage-statement
local-authority: BRD
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - s73
    - any:
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          description: Affects a conservation area, or a listed building, its curtilage or setting.
      - discretionary
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-heritage-statement/
policy: Bradford Core Strategy (2017) policy EN3; Planning (Listed Buildings and Conservation Areas) Act
  1990; NPPF chapter 16
source-text: Planning applications affecting a Conservation Area or its setting Planning applications
  affecting a listed building, its curtilage or setting Planning applications that affect the significance
  of any heritage asset, including its setting. Applications for Listed Building Consent ... Householder
  applications affecting a Conservation Area or its setting Householder applications that affect the significance
  of any heritage asset, including its setting. Householder applications affecting a listed building,
  its curtilage or setting
must-include:
- item: A description of the heritage asset and its setting
  level: must
- item: An assessment of the asset's significance (interior and exterior as relevant)
  level: must
- item: A clear and full explanation of how an understanding of the asset and its setting has informed
    the design
  level: must
- item: An assessment of the impact of the proposals
  level: must
- item: A statement of justification for the works, with any mitigation measures proposed
  level: must
- item: The relevant historic environment record consulted and assets assessed with appropriate expertise
  level: must
- item: 'Within a conservation area: how the proposals preserve or enhance its character, setting and
    appearance'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Development and/or demolition within a conservation area.
- item: 'Demolition in a conservation area: the contribution of the building to the area''s character
    and appearance, and justification for demolition'
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Includes demolition.
- item: 'Proposals affecting the setting of a heritage asset: identifies each asset and assesses the impact
    on its setting'
  level: must
  required-if: discretionary
- item: 'Listed building consent and householder works to a listed building: combined with the Design
    and Access Statement, with the title making this clear'
  level: should
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Householder application relating to a listed building.
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Heritage
  Statement'. Also pages 'Heritage Statement (householder)' and 'Heritage Statement (Listed Building Consent)'.
  Proposals that 'affect the significance of any heritage asset, including its setting' (and the setting
  of a conservation area) need judgement, so that part shows as check. Major applications, and applications
  without a Design and Access Statement, need a stand-alone Heritage Statement.
review-status: unverified
field-status: {}
