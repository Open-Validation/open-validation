reference: site-restoration
local-authority: BRD
required-if:
  application-type:
    in:
    - mineral-extraction
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-mineral-working-application/
policy: NPPF chapter 17
source-text: In addition to the above, Minerals planning applications must also include the following
  information.
must-include:
- item: Intended after-use(s), with detail of their nature and type
  level: must
- item: Use of soil materials in restoration, with phasing and timescale
  level: must
- item: Amounts, types and sources of any filling materials, and the need for any Environmental Protection
    Act 1990 licence
  level: must
  required-if:
    condition:
      field: landfill-development
      value: true
      description: Reclamation involves partial or complete filling with on-site or imported waste.
- item: Proposed drainage of the restored land and any permanent water areas
  level: must
- item: Details of aftercare and management
  level: must
- item: Drawings of landscaping and restoration, including the final levels of the restored site
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Additional
  requirements for Mineral Working Applications'. 'Restoration, aftercare and after-use' section. The
  rest of the minerals information (deposit, method, processing, transport, environmental effects, need,
  drawings) is sent to unmapped. The retired id site-restoration is used.
review-status: unverified
field-status: {}
