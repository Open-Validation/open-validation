reference: section-proposed
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - pa-build-agri-forest
  - condition:
      field: building-works
      value: true
      description: New building work is proposed.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-site-sections-floor-and-site-levels/
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; Section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: All applications where new building work is proposed
must-include:
- item: Drawn at a scale of 1:50 or 1:100, with cross section(s) through the proposed building(s)
  level: must
- item: 'Where ground levels change: existing and finished levels, including foundations and eaves, and
    how encroachment onto adjoining land is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: 'New buildings: existing site levels and finished floor levels related to a fixed datum point
    off site, and the proposals in relation to adjoining buildings'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The application involves new buildings.
- item: Design and location of any retaining walls
  level: should
- item: Where no changes to levels are proposed, the plans clearly state this
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Existing
  and proposed site sections and finished floor and site levels'. For householder proposals the levels
  may be evident from the floor plans and elevations, but on sloping sites the plans must show how the
  proposal relates to existing ground levels. Listed on the planning, major, householder, listed building
  and agricultural prior approval checklists.
review-status: unverified
field-status: {}
