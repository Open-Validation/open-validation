reference: sustainable-drainage-strategy
local-authority: BRD
required-if:
  ref: major-development
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-surface-water-drainage-details/
policy: 'Flood and Water Management Act 2014; Sustainable drainage systems: non-statutory technical standards;
  NPPF chapter 14'
source-text: All major planning applications
must-include:
- item: 'Existing drainage plan: nearest watercourses, public sewers and highway drainage, flood sources
    and extents, and existing peak runoff rates for 1:2, 1:30 and 1:100 plus climate change events'
  level: must
- item: 'Proposed drainage principles: finished levels, flood mitigation, a site drainage layout with
    sizing and location of components, design parameters, the agreed discharge rate and receptor, supporting
    calculations and choice of SuDS methods'
  level: must
- item: 'Geological assessment: topographical survey, underlying geology, infiltration rates, groundwater
    levels, nearest source protection zone and any contamination'
  level: must
- item: How exceedance events will be managed, with predicted flow paths
  level: must
- item: How the drainage design integrates with the public realm or green infrastructure
  level: must
- item: Maintenance management plan naming the responsible parties for the lifetime of the development
  level: must
- item: Drainage strategy for each phase (flow rates, storage and filter components)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Surface
  Water Drainage Details'. Listed on the major checklist. The retired id sustainable-drainage-strategy
  is used.
review-status: unverified
field-status: {}
