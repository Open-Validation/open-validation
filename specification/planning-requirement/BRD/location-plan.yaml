reference: location-plan
local-authority: BRD
required-if:
  always: true
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/national-requirements-location-plan/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include a location plan based on an up to date map of a metric scale
  of 1:1250 or 1:2500.
must-include:
- item: Based on an up-to-date map at a metric scale of 1:1250 or 1:2500
  level: must
- item: Scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from a public highway and visibility splays)
  level: must
- item: 'For householder proposals: the red line goes around the house and garden (domestic curtilage),
    not just the proposal'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Any other land owned by the applicant close to or adjoining the site edged in blue
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'National Requirements -
  Location Plan'. Listed on every application-type checklist.
review-status: unverified
field-status: {}
