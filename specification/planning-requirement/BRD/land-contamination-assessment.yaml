reference: land-contamination-assessment
local-authority: BRD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - contaminated-land
        description: Land known or suspected to be contaminated due to current or previous uses.
    - site:
        in:
        - near-landfill-site
        description: Within 150 metres of a landfill site.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-land-contamination-assessment-phase-i-report/
policy: Bradford Core Strategy (2017) policies DS5 and EN8; NPPF chapter 15
source-text: Proposals for new residential development, nursing homes, schools, nurseries, allotments,
  children’s play areas, playing fields and other vulnerable land uses on land known or suspected to be
  contaminated due to current or previous uses or within 150 metres of a landfill site ... Where contamination
  is suspected a Phase 1 Desk Study Report must be submitted with application for outline or full planning
  permission.
must-include:
- item: 'Phase 1 report by a competent person: desk study of historical and current records and maps for
    on-site and off-site sources of contamination'
  level: must
- item: Site walkover survey (layout, condition, visual or odorous evidence of contamination, vegetation
    distress)
  level: must
- item: Preliminary conceptual site model of potential pollutant linkages, with limitations, assumptions
    and uncertainties, giving a preliminary risk assessment
  level: must
- item: Phase 2 intrusive site investigation report and risk assessment (with the Phase 1 report), including
    remediation and verification recommendations if necessary
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - site:
        in:
        - contaminated-land
        description: Known or suspected to be contaminated to an extent that could adversely affect the
          development, or a Phase I report found contamination.
  source-text: Where contamination is suspected a Phase 2 Intrusive Site Investigation Report prepared
    by a competent person, as per the NPPF, must be submitted with applications for full planning permission.
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Land
  Contamination Assessment (Phase I Report)'. Also page 'Land Contamination Assessment (Phase II) Report
  and Risk Assessment'. The page lists both vulnerable uses (homes, schools, nurseries...) and low-vulnerability
  uses (offices, shops, industry, car parks...), so any new use on such land is covered. A sampling strategy
  should be agreed with the council before site investigation.
review-status: unverified
field-status: {}
