policy: Bradford Core Strategy (2017) policy EN3; NPPF chapter 16
source-text: Where a site on which development is proposed includes, or has the potential to include,
  heritage assets with archaeological interest, local planning authorities require developers to submit
  an appropriate desk-based assessment and, where necessary, undertake a field evaluation.
