- item: Appropriate desk-based assessment and, where necessary, a field evaluation
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 5 October 2026), page 'Local Requirements - Heritage
  Statement'. Section 'Applications affecting archaeological deposits' (also on the householder page).
  Whether a site has archaeological potential is for West Yorkshire Archaeology Advisory Service to advise,
  so it shows as check.
