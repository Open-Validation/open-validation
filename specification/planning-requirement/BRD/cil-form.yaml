reference: cil-form
local-authority: BRD
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development of 1 new dwelling or more.
  - all:
    - condition:
        field: use-class
        value: supermarket
        description: A supermarket (Use Class E).
    - condition:
        field: floorspace
        operator: '>'
        value: 2000
        description: Over 2000 sq m.
  - all:
    - condition:
        field: use-class
        value: retail-warehouse
        description: A retail warehouse (Use Class E).
    - discretionary
  - all:
    - any:
      - condition:
          field: residential-extension
          value: true
          description: A householder extension.
      - condition:
          field: residential-annexe
          value: true
          description: A residential annexe.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: A net increase of 100 square metres of gross internal floor space.
source-url: https://www.bradford.gov.uk/planning-and-building-control/national-and-local-validation-requirements/local-requirements-cil-form/
policy: Bradford CIL Charging Schedule; Community Infrastructure Levy Regulations 2010
source-text: Applications for residential development of 1 new dwelling or more Applications for supermarkets
  over 2000 sq m in size (Use Class E) Applications for Retail warehouses (Use Class E) central Bradford.
  All householder extensions/residential annexes where there is a net increase of 100 square metres of
  floor space (gross internal floor space).
must-include:
- item: On the council's Form 1 - CIL Additional Information Form
  level: must
confidence: medium
notes: 'From the council''s list (web pages, last updated 5 October 2026), page ''Local Requirements -
  Form 1: CIL Additional Information''. Retail warehouses are only listed for central Bradford, which
  isn''t defined on the page, so that part shows as check. Listed on the planning, major and householder
  checklists.'
review-status: unverified
field-status: {}
