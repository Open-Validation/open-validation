reference: heritage-statement
local-authority: HMF
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
    - any:
      - site:
          in:
          - archaeological-priority-area
          - listed-building
          - listed-building-setting
          - locally-listed-building
          - conservation-area
          description: The development is within an archaeological priority area or would affect a heritage
            asset such as a listed building.
      - all:
        - condition:
            field: demolition
            value: true
            description: The building works involve demolition.
        - site:
            in:
            - conservation-area
            description: The site is in a conservation area.
source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
source-text: 'Is the development within an archaeological priority area or would it affect a heritage
  asset such as a listed building? If yes, a heritage statement should be provided … Does the building
  works involve demolition? If yes: A heritage statement including photographs (if in a conservation area
  or where justification is required for the loss of a building in a conservation area)'
must-include:
- item: Photographs
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - condition:
        field: demolition
        value: true
        description: The building works involve demolition in a conservation area.
confidence: medium
notes: 'Audit (wrong_trigger, duplicate): the workbook quoted the demolition question and counted ''heritage
  statement including photographs'' twice (also as photos). The LBC checklist asks for a ''Heritage statement
  including photographs''.'
review-status: unverified
field-status: {}
