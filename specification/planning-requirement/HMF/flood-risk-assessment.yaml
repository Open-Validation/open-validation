reference: flood-risk-assessment
local-authority: HMF
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - lbc
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in Environment Agency Flood Zone 2 or 3, or a surface water flooding hotspot.
  - condition:
      field: ground-floor-or-basement
      value: true
      description: The proposal relates to a basement and/or ground floor level.
source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
source-text: Is your proposal within the Environmental Agency Flood zone 2 or 3 and relate to a basement
  and/or ground floor level? If yes, please provide the flood risk assessment (including all sources of
  surface water and sewer flooding).
must-include:
- item: All sources of flooding, including surface water and sewer flooding
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave no trigger. The minor/householder checklist adds surface
  water flooding hotspots.'
review-status: unverified
field-status: {}
