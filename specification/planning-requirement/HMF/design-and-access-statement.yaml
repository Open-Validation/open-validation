reference: design-and-access-statement
local-authority: HMF
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - lbc
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The proposal creates 100 square metres or more of floorspace.
    - site:
        in:
        - listed-building
        - conservation-area
        description: The proposal affects a listed building or a conservation area.
source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the next question (flood zone). From the audit: 1+
  dwellings, 100 sqm+, or affecting a listed building or conservation area.'
review-status: unverified
field-status: {}
