reference: land-contamination-assessment
local-authority: BRE
required-if:
  application-type:
    in:
    - outline
    - reserved-matters
    - full
    - change-of-use
    - s73
    - technical-details-consent
source-url: https://www.breckland.gov.uk/media/21489/Council-s-Local-List/pdf/Local_List_2026.pdf?m=1778086477433
source-text: Yes - vulnerability questionnaire for all developments and Site Investigation report for
  majors
must-include:
- item: Vulnerable Development (contamination) Questionnaire
  level: must
- item: Site Investigation report
  level: must
  required-if:
    any:
    - all:
      - application-type:
          in:
          - outline
          - full
      - ref: major-development
    - all:
      - application-type:
          in:
          - change-of-use
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: A change of use to residential.
confidence: medium
notes: 'From the audit (missing_requirement): ''Contaminated land documents'' column and note 8.'
review-status: unverified
field-status: {}
