reference: air-quality-assessment
local-authority: BRE
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - change-of-use
  - any:
    - site:
        in:
        - air-quality-management-area
        description: The site is in an Air Quality Management Area.
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more residential units.
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: A site of more than 0.5 hectares.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 0.5
            description: A site of more than 0.5 hectares.
        - condition:
            field: floorspace-non-residential
            operator: '>'
            value: 1000
            description: More than 1,000 square metres of other floorspace.
      - any:
        - condition:
            field: parking-spaces
            operator: '>'
            value: 10
            description: More than 10 parking spaces.
        - condition:
            field: biomass-or-chp
            value: true
            description: A centralised energy or combustion facility.
    - discretionary
source-url: https://www.breckland.gov.uk/media/21489/Council-s-Local-List/pdf/Local_List_2026.pdf?m=1778086477433
confidence: medium
notes: 'From the audit (missing_requirement): an Air Quality and Dust Impact Assessment for applications
  that may affect air quality. Note 9 requires screening for any site in an AQMA, for intensive farming
  (shown as officer discretion), or for 10+ units / more than 0.5ha / more than 1,000 sqm of other floorspace
  with more than 10 parking spaces or a centralised energy or combustion facility.'
review-status: unverified
field-status: {}
