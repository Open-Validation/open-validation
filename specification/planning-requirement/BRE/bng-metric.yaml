reference: bng-metric
local-authority: BRE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.breckland.gov.uk/media/21489/Council-s-Local-List/pdf/Local_List_2026.pdf?m=1778086477433
source-text: Biodiversity Net Gain (2) (BNG) Where applicants consider that the development would not
  be subject to the biodiversity gain condition, Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015 provides that the applicant must provide a statement as part
  of the planning application setting out the reasons why they believe this is the case.
must-include:
- item: Statutory Biodiversity metric (or BNG Metric) in Excel format
  level: must
  source-text: Statutory Biodiversity metric (or BNG Metric) in excel format
- item: A statement showing how the person who completed the metric meets the test of being a competent
    person
  level: must
  source-text: a statement should be submitted demonstrating how the person who has completed the metric
    meets the test of being a competent person
