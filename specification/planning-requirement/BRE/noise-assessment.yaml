reference: noise-assessment
local-authority: BRE
required-if:
  all:
  - application-type:
      in:
      - outline
      - full
      - change-of-use
  - any:
    - all:
      - ref: major-development
      - condition:
          field: noise-generating-use
          value: true
          description: A business, employment or commercial use.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New residential development close to employment areas.
source-url: https://www.breckland.gov.uk/media/21489/Council-s-Local-List/pdf/Local_List_2026.pdf?m=1778086477433
source-text: Yes for Majors business/employment commercial uses as well as new residential developments
  laying close to employment areas
confidence: medium
notes: 'Audit (wrong_trigger): from the list''s table. The list''s notes also ask for a noise assessment
  for residential and other noise-sensitive development near existing noise sources, mixed noise-generating
