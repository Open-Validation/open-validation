reference: flood-risk-assessment
local-authority: BRE
required-if:
  any:
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - full
        - change-of-use
        - s73
    - any:
      - ref: major-development
      - site:
          in:
          - flood-risk-zone
          description: The site is in an area of flood risk.
  - all:
    - application-type:
        in:
        - technical-details-consent
    - site:
        in:
        - flood-risk-zone
        description: The site is in an area of flood risk.
source-url: https://www.breckland.gov.uk/media/21489/Council-s-Local-List/pdf/Local_List_2026.pdf?m=1778086477433
policy: Breckland Local Plan ENV09
source-text: Yes for major applications or in areas of flood risk.
must-include:
- item: A Drainage Strategy including foul and surface water management
  level: should
  source-text: Any submitted Flood Risk Assessment (FRA) should include a Drainage Strategy including
    Foul and Surface Water Management.
- item: A statement of compliance with Policy ENV09, showing no increase in greenfield run-off and addressing
    Source Protection Zones and Critical Drainage Catchments
  level: must
confidence: medium
notes: 'Audit (wrong_trigger, duplicate): the list has one ''Flood Risk Assessment and Drainage Strategy''
  column. The ENV09 item is the audit''s summary of the list''s notes.'
review-status: unverified
field-status: {}
