reference: lighting-assessment
local-authority: BRE
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: External lighting in the vicinity of residential properties or other sensitive uses.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting in the vicinity of residential properties or other sensitive uses.
source-url: https://www.breckland.gov.uk/media/21489/Council-s-Local-List/pdf/Local_List_2026.pdf?m=1778086477433
source-text: 'Lighting assessment – Applications that include external lighting or floodlighting in the
  vicinity of residential properties or other sensitive uses should provide: Layout plan with beam orientation
  A schedule of the equipment Proposed hours of operation An isolux contour map showing light spillage
  to 1 lux Light levels Details of the measures such as hoods and cowls that will be included to mitigate
  and avoid glare.'
must-include:
- item: Layout plan with beam orientation
  level: should
- item: A schedule of the equipment
  level: should
- item: Proposed hours of operation
  level: should
- item: An isolux contour map showing light spillage to 1 lux
  level: should
- item: Light levels
  level: should
- item: Measures such as hoods and cowls to mitigate and avoid glare
  level: should
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The council's text
  says these applications 'should provide' the items listed.
review-status: unverified
field-status: {}
