source-text: Arboricultural Report – Where trees are present on, or within 15 metres of any form of development,
  a tree survey and arboricultural information must be submitted in accordance with BS5837:2012 – Trees
  in Relation to Design, Demolition and Construction to demonstrate how trees have been considered within
  the design and layout of the proposed development.
must-include:
