reference: proposed-habitat-plan
local-authority: DST
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Biodiversity Gain Requirements
  (Exemptions) Regulations 2024 as amended by the Biodiversity Gain (Town and Country Planning) (Amendments
  and Transitional Provisions) (England) Regulations 2026; Dorset Council BNG guidance
source-text: 'b. Plans and drawings to show where mitigation, compensation and BNG will be achieved. These
  must be to scale and include the different types of habitat. In addition to the national statutory requirement
  for an on-site baseline habitat plan, we require:'
must-include:
- item: An on-site post-intervention proposed habitat plan, with any significant on-site enhancements
    to be secured through a legal agreement shown clearly
  level: must
- item: On-site habitat shown within the red line of the application site
  level: must
- item: All the different habitats referred to in the submitted metric identified
  level: must
- item: Where relevant, an off-site post-intervention habitat plan identifying all the habitats in the
    submitted metric
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site biodiversity units are used.
- item: To scale, with a stated scale, scale bar and north arrow, and showing the different types of habitat
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 40-41. A Dorset
  local requirement (section 24). The list says BNG applies to all development unless exempt; by law householder
  and other exempt applications are outside it, so the rule is the biodiversity gain condition.
review-status: unverified
field-status: {}
