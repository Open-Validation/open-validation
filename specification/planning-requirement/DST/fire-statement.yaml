reference: fire-statement
local-authority: DST
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building with 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: A fire statement is required when the development proposed includes buildings that are 18
  metres or more in height or for a building that contains 7 or more storeys used for 2 or more dwellings
  or educational accommodation.
must-include:
- item: The fire safety design principles, concepts and standards applied to the development
  level: must
- item: Made on the form published by the Secretary of State, with all the information the form asks for
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 21. The list's wording
  could be read as 18 metres alone; the rule follows the law (DMPO article 9A), where the building must
  also contain two or more dwellings or educational accommodation.
review-status: unverified
field-status: {}
