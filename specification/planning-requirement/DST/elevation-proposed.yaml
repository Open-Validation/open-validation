reference: elevation-proposed
local-authority: DST
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings, structures or equipment.
  - condition:
      field: external-alterations
      value: true
      description: External alterations to existing buildings.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Proposed elevation plans are required for all applications involving new buildings, structures,
  or equipment, as well as external alterations to existing buildings.
must-include:
- item: Drawn at 1:50 or 1:100 (very large buildings can be drawn at a larger scale)
  level: must
- item: All sides of the proposed or affected buildings or structure, in relation to what is already there
  level: must
- item: Buildings or walls to be demolished clearly shown, ideally highlighted in a separate colour
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: All door and window openings, and blank elevations where there are none
  level: must
- item: The proposed building materials, and the style, materials and finish of windows and doors
  level: must
- item: 'Where the elevation adjoins or is near another building: the relationship between the buildings
    and the positions of openings on each property'
  level: must
  required-if: discretionary
- item: Not single line drawings
  level: must
- item: 'Street scene or contextual elevation, where required: height and outline of neighbouring buildings,
    position and size of windows and doors, differences in finished floor levels, metric dimensions of
    gaps between buildings, and the direction the street scene faces'
  level: must
  required-if: discretionary
  source-text: A street scene or contextual elevation drawing may be required to show how the proposed
    design fits into its surroundings, including nearby buildings.
- item: 'For listed building consent window replacement of historic windows: annotated elevation plans
    listing each window affected'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
  source-text: Window replacement of historic windows – annotated elevation plans listing each window
    affected
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 24, 26. Householder
  checklist (8 July 2026), page 3. Listed building consent checklist (8 July 2026), page 3-4. The street
  scene 'may be required'; the listed building consent window item applies 'when relevant to the proposal'.
  The joinery report that goes with it has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
