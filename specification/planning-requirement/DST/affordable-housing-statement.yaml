reference: affordable-housing-statement
local-authority: DST
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing development.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 5; Dorset Council adopted development plans and Dorset Local Plan (draft); affordable
  housing Supplementary Planning Documents; neighbourhood plans
source-text: Where national, local plan policies, supplementary planning documents or made neighbourhood
  plans require the provision of affordable housing, the applicant must address this issue and submit
  information concerning both the affordable housing and any market housing.
must-include:
- item: The numbers of residential units
  level: must
- item: The mix of units with numbers of habitable rooms and/or bedrooms, or the floor space of habitable
    areas of residential units
  level: must
- item: Plans showing the location of units, which are affordable, the tenure of each and their habitable
    rooms and/or bedrooms and/or floor space
  level: must
- item: A clear and full explanation of any different levels or types of affordability or tenure
  level: must
  required-if: discretionary
- item: Details of any Registered Social Landlords acting as partners
  level: should
- item: 'For an affordable housing exception site: why the development cannot be accommodated within an
    existing settlement, and evidence of the need for affordable housing'
  level: must
  required-if:
    condition:
      field: rural-exception-housing
      value: true
      description: An affordable housing exception site.
- item: Dorset Council's commuted sum calculator proforma, with supporting evidence, for small sites (9
    or less) where a commuted sum in lieu of affordable housing is agreed with the planning officer
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: A small site of 9 or fewer dwellings.
    - discretionary
  source-text: All applications for small sites (9 or less) and in circumstances where it is agreed with
    the planning officer that a commuted sum payment in lieu of the provision of affordable housing (in
    part or full) instead of on-site or off-site provision is accepted, we need the applicant to complete
    and submit the Dorset Council’s commuted sum calculator proforma. (For applications submitted 1 June
    2025).
- item: Draft heads of terms, a draft Section 106 agreement or unilateral undertaking, with up-to-date
    proof of land ownership
  level: should
confidence: medium
notes: 'From the council''s list (adopted 2 February 2026, v1.3 of 6 August 2026), page 29-30. The list
  gives no threshold of its own: it depends on what national and local policies, SPDs or neighbourhood
  plans require (it notes that a lower threshold of 5 units or fewer can apply in designated rural areas),
  so it shows as discretionary. Where a reduced affordable housing contribution is argued on viability,
  the council seeks independent advice and charges for it.'
review-status: unverified
field-status: {}
