reference: water-impact-assessment
local-authority: DST
required-if:
  all:
  - site:
      in:
      - nutrient-neutrality-area
      description: In a Natural England nutrient catchment (Poole Harbour SPA and Ramsar, River Avon SAC,
        River Axe SAC, Chesil and the Fleet SAC and SPA, Somerset Levels and Moors Ramsar), or a Wessex
        Water treatment works catchment that feeds into one.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A net gain in residential units.
    - condition:
        field: overnight-accommodation
        value: true
        description: 'Other overnight accommodation: residential institutions, tourism accommodation,
          specialist housing, or commercial or employment sites with overnight accommodation.'
    - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Conservation of Habitats and Species Regulations 2017
source-text: A nutrient neutrality statement is required for all applications which include any of the
  above listed development proposals within a catchment area to set out how mitigation is going to be
  achieved.
must-include:
- item: Undertaken by a competent person
  level: should
- item: Site location plan and description of the proposed development
  level: must
- item: Nutrient budget calculation using the relevant Natural England nutrient budget calculator for
    the catchment
  level: must
- item: A copy of the Excel calculator spreadsheet sent electronically, with screen shots of each stage
    in the statement
  level: must
- item: The proposed nutrient mitigation strategy, referring to the nutrient budget calculation
  level: must
- item: 'Where credits are to be bought from an accredited third-party scheme: the estimated cost of the
    credits'
  level: must
  required-if: discretionary
- item: Heads of Terms, where the mitigation strategy needs a S106 agreement
  level: should
  required-if: discretionary
  source-text: If the proposed mitigation strategy would necessitate a S106 agreement to secure it, then
    the applicant should submit Heads of Terms at validation of the application.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 67-69. Includes
  reserved matters and discharge of pre-commencement conditions, and prior approvals and certificates
  for permitted development giving new overnight accommodation. Intensification of agriculture, fish farming
  and watercress beds, and commercial or industrial development releasing nutrients are case by case,
  so they show as discretionary.
review-status: unverified
field-status: {}
