reference: air-quality-assessment
local-authority: DST
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within or adjoining an Air Quality Management Area.
  - all:
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        description: Directly affects a European or international site (SAC, SPA, Ramsar) or a Site of
          Special Scientific Interest.
    - discretionary
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 15; Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: For all applications for proposals that will generate significant dust, concentration of
  particulate matter less than 10 micrometres in diameter (PM10’s), fumes, bio- ... aerosols, vapours,
  odours or any other emissions to the air or for sites within or adjoining an Air Quality Management
  Area (AQMA) an air quality assessment will be required to be undertaken by a qualified specialist.
must-include:
- item: Focused on the issues specific to the proposal (dust, PM10s, odour, traffic pollution, bio-aerosols
    and other airborne pollutants)
  level: must
- item: 'For each issue: baseline conditions; relevant air quality concerns and known complaints; the
    scale and nature of emissions; the assessment methodology and modelling verification; activities generating
    dust, odour, fumes or PM10; sensitive locations and receptors and their distance; the basis for assessing
    significance; demolition and construction phase impact; mitigation and management measures; and monitoring
    arrangements'
  level: must
- item: A dust suppression scheme showing how the impact of dust on the surrounding area will be minimised,
    where significant increased dust could be generated (including during construction)
  level: must
  required-if: discretionary
- item: Prepared by a qualified specialist
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 31-33. Also required
  for any proposal that needs a transport assessment, and for agricultural, industrial or traffic projects
  releasing ammonia, nitrogen oxides, nitrogen or acid deposits or sulphur dioxide that could significantly
  affect a habitat site or SSSI (check Natural England's standing advice). 'Significant' emissions and
  the transport assessment link have no data field, so those parts show as discretionary. Construction
  dust is assessed in the construction management plan.
review-status: unverified
field-status: {}
