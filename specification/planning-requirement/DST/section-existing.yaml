reference: section-existing
local-authority: DST
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: Ground levels vary between the site and surrounding land, or across the site.
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: earthworks
      value: true
      description: Swimming pools, ponds, lakes or other engineering work.
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth, Christchurch, Poole
  and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy (2014); Bournemouth,
  Christchurch, Poole and Dorset Waste Plan (2019)
source-text: 'For all applications where: • ground levels vary between the site and surrounding land—or
  across the site itself especially when topography is important or existing buildings, mature vegetation,
  or distinctive features are on site; • The application involves new buildings, swimming pools, ponds,
  lakes, or other engineering work, and the plans must show how the development fits within the site and
  its relative levels compared to existing features.'
must-include:
- item: Existing and proposed levels, including finished floor levels as relevant, with contours if relevant
  level: must
- item: Cross sections drawn at 1:50 or 1:100 where possible, through the proposed building(s), land or
    features
  level: must
- item: Existing buildings or features clearly referenced, including relationships to adjoining and neighbouring
    developments
  level: must
- item: At least one off-site fixed and clearly identifiable datum point
  level: must
- item: 'Householder: where extension floor levels differ from the existing, especially on sloping sites,
    how the proposals relate to existing ground levels or where ground levels outside the extension would
    change'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Minerals and waste: existing and proposed sections in context with surrounding buildings, structures
    and topography, accurate in scale and height (e.g. 1:50 or 1:100)'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
- item: 'Minerals and waste: representative sections with existing and final restoration surface levels
    and likely settlement; for extraction, the maximum depth of excavation, the water table and quarry
    faces'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
- item: 'Mineral working: sections and borehole diagrams distinguishing topsoil, subsoil, overburden and
    mineral, with the characteristics and thickness of each, interbedded waste, underlying geology and
    the water table'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
- item: 'Minerals and waste: profiles and gradients of soil, overburden and tip mounds; finished floor
    and site levels; major dimensions; spot heights and levels related to OS datum'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 27-28, 74. Proposed
  plans should comply with national guidance on inclusive mobility. Minerals and waste items from section
  50.
review-status: unverified
field-status: {}
