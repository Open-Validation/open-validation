reference: site-restoration
local-authority: DST
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - waste-dev
    - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF; Bournemouth, Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset
  and Poole Minerals Strategy (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: All applications for permission for the winning and working of minerals (including S73 applications)
  (proportionate and specific to the development) and for waste involving landfill/land raising.
must-include:
- item: A statement and plans of the restored landscape (landform, land cover and features) and how it
    relates to the surrounding area and landscape character
  level: must
- item: How the proposals improve and connect with the green infrastructure network
  level: must
- item: Soil stripping, storage or direct replacement; filling operations (with HGV movements); restoration
    and aftercare
  level: must
- item: Projected contours and final levels, gradients and drainage, including water and geological features
    to be retained
  level: must
- item: Areas to be restored to agriculture, forestry and amenity (including nature conservation)
  level: must
- item: The phasing and timescale of working, restoration and aftercare
  level: must
- item: Methods of filling and types of fill, where appropriate
  level: must
  required-if: discretionary
- item: At least an outline aftercare strategy and a statement of the intended after use(s)
  level: must
- item: Depth and nature of topsoils, subsoils and overburden, and methods of stripping, transporting
    and restoring them, with total amounts and average thickness
  level: must
- item: 'Where water areas are created: depths and areas, hydrology, water quality, bank profiles, islands
    and margin planting'
  level: must
  required-if: discretionary
- item: Measures for managing emissions (gases and liquids)
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 84-86. The list's
  'Site reclamation scheme' (section 62), using the retired MHCLG id site-restoration. Waste applications
  need it when they involve landfill or land raising (no data field, so discretionary). The separate restoration
  and aftercare scheme (section 59) has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
