reference: location-plan
local-authority: DST
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - technical-details-consent
    - pip
    - lbc
    - change-of-use
    - advertising
    - prior-approval
    - ldc
    - mineral-extraction
    - mineral-app
    - extraction-oil-gas
    - waste-dev
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: The location plan must clearly show the application site in relation to its surroundings
  and be based on an up-to-date map drawn to a metric scale,
must-include:
- item: Based on an up-to-date map at a metric scale, typically 1:1250 or 1:2500 for most areas, or 1:5000
    for rural locations
  level: must
  source-text: 'be based on an up-to-date map drawn to a metric scale, typically: • 1:1250 or 1:2500,
    for most areas • 1:5000 for rural locations'
- item: Enough detail to identify the site clearly, such as at least two named roads (if possible) or
    nearby buildings
  level: must
  source-text: The plan must include enough detail to clearly identify the site, such as at least two
    named roads (if possible) or nearby buildings.
- item: The direction of North
  level: must
- item: 'Application site outlined in red, including all land needed to carry out the development: access
    to the site from the edge of the public highway, visibility splays, landscaping, car parking and open
    areas around buildings'
  level: must
  source-text: 'The red line must include all land necessary to carry out the proposed development including:
    • Access to the site from the edge of the public highway • Visibility splays • Landscaping • Car parking
    • Open areas around buildings'
- item: Only one red line boundary per submission, the same across all supporting documents (for example
    ecology surveys and reports)
  level: must
- item: Not drawn on a Land Registry plan (copyright)
  level: must
- item: 'For listed building consent: the building the application relates to clearly identified'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Applications for Listed Building Consent must clearly identify the building to which it
    relates.
- item: Any other land owned by or within the control of the applicant, close to or adjoining the site,
    outlined in blue
  level: should
  source-text: A blue line should be drawn around any other land owned by or within the control of the
    applicant, close to or adjoining the application site.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 17. Not required
  for Section 73 applications or non-material amendments (Section 96A). Digital copies of red line plans
  are encouraged for complex sites and major applications.
