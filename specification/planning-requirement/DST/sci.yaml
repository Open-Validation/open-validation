reference: sci
local-authority: DST
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Article 4, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Sections 61W and 61X, Town and Country Planning Act 1990; Dorset Council Statement of Community
  Involvement 2025
source-text: 'Applicants are encouraged to undertake pre application consultation with the local community
  for all major applications particularly:'
must-include:
- item: Details of consultation with neighbours to the site and the local community
  level: must
- item: Issues identified through the consultation
  level: must
- item: The response to these issues and how the proposal has been amended
  level: must
- item: If no consultation was carried out, the reasons why
  level: should
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 58-59. Consultation
  is 'encouraged' for major applications, particularly where a boundary is shared with a residential or
  sensitive use, for departures from the development plan, or for controversial development, so it shows
  as discretionary.
review-status: unverified
field-status: {}
