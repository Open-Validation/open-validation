reference: noise-assessment
local-authority: DST
required-if:
  all:
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: A use that may generate noise.
    - condition:
        field: plant-equipment
        value: true
        description: Air source heat pumps, air conditioning units or other plant that may generate noise.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 15; Noise Policy Statement for England; Dorset Council adopted development plans
  and Dorset Local Plan (draft); Bournemouth, Christchurch, Poole and Dorset Minerals Sites Plan (2019);
  Bournemouth, Dorset and Poole Minerals Strategy (2014); Bournemouth, Christchurch, Poole and Dorset
  Waste Plan (2019)
source-text: For all applications, including those for air source heat pumps and air conditioning units
  that may generate noise, either alone or in combination with other existing or proposed development,
  that may have an impact on sensitive receptors.
must-include:
- item: 'Air source heat pumps and air conditioning units on domestic properties: manufacturer''s sound
    power level data and calculations of sound pressure levels at neighbouring homes, taking account of
    mitigation'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: 'For air source heat pumps and air conditioning units on domestic properties a detailed
    noise assessment may not always be required but we require as a minimum: • manufacturers sound power
    level data and appropriate calculations indicating anticipated sound pressure levels at neighbouring
    domestic premises. These calculations should take into account any intended mitigation or attenuation
    measures.'
- item: 'Air source heat pumps and air conditioning units on domestic properties: location and size of
    the units shown on a scaled plan'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Non-domestic: prepared by a suitably qualified and competent acoustician'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
        - mineral-extraction
        - mineral-app
        - extraction-oil-gas
        - waste-dev
    - discretionary
- item: 'Non-domestic: baseline background noise levels; representative receptors and assessment locations;
    likely noise emissions during construction and operation and their effects; mitigation; cumulative
    effects; impact of residual noise increase, including on areas of tranquillity such as National Landscapes;
    ongoing noise management schemes'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
        - mineral-extraction
        - mineral-app
        - extraction-oil-gas
        - waste-dev
    - discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 55-56. Sensitive
  receptors include rural areas away from transport corridors, homes, schools, hospitals, parks, open
  access land, public open space, national trails and local recreational routes. Whether there 'may' be
  an impact has no data field, so it shows as discretionary. The domestic items use the householder type;
  the council may then ask for a detailed noise report.
review-status: unverified
field-status: {}
