reference: lighting-assessment
local-authority: DST
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External or free-standing lighting is proposed.
  - any:
    - all:
      - site:
          in:
          - dark-sky-area
          description: A dark sky area.
      - condition:
          field: outside-urban-area
          value: true
          description: In the open countryside.
    - site:
        in:
        - area-of-outstanding-natural-beauty
        - world-heritage-site
        description: In or affecting a National Landscape (formerly AONB) or World Heritage Site.
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        description: Directly affects a European or international site (SAC, SPA, Ramsar) or a Site of
          Special Scientific Interest.
    - condition:
        field: protected-species
        value: true
        description: Would affect a protected species.
    - site:
        in:
        - conservation-area
        - listed-building-setting
        description: Conservation areas or the setting of listed buildings, causing loss of amenity.
    - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 15; Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: For all applications that propose external or free-standing lighting • are in dark sky areas
  within the open countryside • that are in or would affect a National Landscape (formerly AONB) or World
  Heritage site; • that would spill light into a designated habitat or affect a protected species; • in
  urban/residential areas that are within the vicinity of residential property; conservation areas or
  the setting of listed buildings, that would cause loss of amenity; • that would spill light onto a transport
  network.
must-include:
- item: 'Technical specifications: a layout plan, light source locations and mounting heights, beam orientation
    and spread/light spill, design and intensity of fixtures, controls (movement sensors and/or timers)
    and hours of use'
  level: must
- item: How maximum energy efficiency is achieved
  level: should
- item: How the lighting design minimises any impact on bats
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 53-54. Lighting
  near residential property in urban areas and light spill onto a transport network have no data field,
  so those parts show as discretionary.
review-status: unverified
field-status: {}
