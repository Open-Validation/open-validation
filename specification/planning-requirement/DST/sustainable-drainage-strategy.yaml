reference: sustainable-drainage-strategy
local-authority: DST
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: footprint-increase
          value: true
          description: Increases the footprint of an existing building.
      - condition:
          field: hard-surfacing
          value: true
          description: Car parking or other hard standing or impermeable surface.
    - discretionary
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Sections 14 and 15; Defra non-statutory technical standards for sustainable drainage systems;
  CIRIA C753 The SuDS Manual; Dorset Council adopted development plans and Dorset Local Plan (draft);
  Bournemouth, Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole
  Minerals Strategy (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: For all applications for major development (where relevant to the development proposed) to
  enable the assessment of surface water and foul drainage. ... Where proposals seek to increase the footprint
  of an existing building, and/or the development of car parking or any other hard standing/impermeable
  surface that may increase flood risk downstream. Other applications where surface water or foul drainage
  may influence the development.
must-include:
- item: 'Current surface water drainage of the site: discharge routes, flow rates, volumes and any amenity
    and ecology benefits'
  level: must
- item: How run-off will be discharged as high up the drainage hierarchy as reasonably practicable (infiltration,
    surface water body, surface water sewer, combined sewer), with justification
  level: must
- item: The sustainable drainage system and how it meets the national SuDS standards, Dorset Council SuDS
    guidance and CIRIA C753, using open SuDS features
  level: must
- item: Maintenance arrangements for the lifetime of the development
  level: must
- item: Measures during construction so as not to increase flood risk
  level: must
- item: How pollution to surface water will be avoided
  level: must
- item: Justification where sustainable drainage is shown to be inappropriate
  level: must
  required-if: discretionary
- item: A design for biodiversity net gain considered as part of the SuDS design
  level: must
- item: 'In coastal margin and land instability areas: that surface water disposal will not cause or worsen
    unstable ground conditions'
  level: must
  required-if:
    site:
      in:
      - coastal-erosion-zone
      description: A coastal margin area or other area of land instability.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 60-62. The drainage
  assessment should be commensurate with the nature and scale of the development. Increases in footprint
  or hard surfacing are caught where they 'may increase flood risk downstream' (discretionary). For foul
  drainage without mains sewerage, the Environment Agency's Foul Drainage Assessment Form FDA1 is needed
  (no matching id; see the unmapped list).
review-status: unverified
field-status: {}
