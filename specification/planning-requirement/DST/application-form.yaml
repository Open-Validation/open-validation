reference: application-form
local-authority: DST
required-if:
  always: true
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: You must use the correct application form published by the Secretary of State.
must-include:
- item: All information required by the application form
  level: must
  source-text: You must Include all information required by the application form.
- item: The correct ownership certificate (A, B, C or D) completed, and Notice 1 served or published on
    any other owners and agricultural tenants
  level: must
  source-text: You must complete either certificate A, B, C or D on the application form.
- item: Certificate B (not A) with Notice 1 served on all the other flat owners, where the proposal relates
    to a flat in a building with other flats
  level: must
  required-if: discretionary
  source-text: Flats – if the proposal relates to a flat in a building with other flats, you will need
    to complete certificate B and serve Notice 1 on all the other flat owners providing you know who they
    are
- item: Certificate A not used where the access is not solely in the applicant's ownership, or the development
    will touch or overhang land owned by another person
  level: must
  source-text: You cannot complete certificate A where a proposal will touch, or overhang property or
    land owned by another person.
- item: 'For non-material amendments: question 4 (Eligibility) completed, and Notice 1 served on all other
    owners or tenants if the applicant is not the sole owner'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
  source-text: For Non Material Amendment applications (under Section 96A) please complete question 4
    on the application form Eligibility and if you are not the sole owner please serve Notice 1 on all
    other owners or tenants.
- item: Declaration signed and dated at the time of submission
  level: must
  source-text: Declaration signed and dated at the time of submission.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 15-16. Ownership
  certificates and the agricultural land declaration (section 2) are part of the form. The declaration
  item is from the householder and listed building consent checklists (page 1). Before choosing a certificate,
  check whether any of the land, including the access, is public highway. The application fee (section
  8) must also be paid before validation starts.
review-status: unverified
field-status: {}
