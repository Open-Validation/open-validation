reference: heritage-statement
local-authority: DST
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      - world-heritage-site
      description: Affects or could affect a designated or non-designated heritage asset (listed building,
        conservation area, scheduled monument, registered park and garden, locally listed building).
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Planning (Listed Buildings and Conservation Areas) Act 1990; NPPF Section 16; Dorset Council adopted
  development plans and Dorset Local Plan (draft); Bournemouth, Christchurch, Poole and Dorset Minerals
  Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy (2014); Bournemouth, Christchurch,
  Poole and Dorset Waste Plan (2019)
source-text: A heritage statement is required for all applications which affect, or have the potential
  to affect, a heritage asset.
must-include:
- item: A comprehensive, yet proportionate, explanation of the development, form, materials and national
    or local context of the affected building, archaeological or area-specific assets
  level: must
- item: Photographs of the existing site or building(s) and detailed photographs of the areas for proposed
    works, showing the context and the areas impacted
  level: must
- item: An analysis of the significance of any affected designated or non-designated heritage assets,
    including any contribution made by their setting
  level: must
- item: An assessment of the impact on the significance of all affected heritage assets, using the NPPF
    terms 'no harm', 'less than substantial harm' or 'substantial harm'
  level: must
- item: Where relevant, how the proposals avoid, minimise or mitigate harm to significance
  level: must
  required-if: discretionary
- item: Where relevant, how the proposals enhance or better reveal significance
  level: must
  required-if: discretionary
- item: 'Where works respond to specialist advice (e.g. rethatching, cob repairs, structural interventions,
    damp, window or door replacement): a copy of the technical report(s) and recommendations'
  level: should
  required-if: discretionary
- item: Relevant planning history that has affected the building, including outbuildings and curtilage
    listed buildings
  level: must
  source-text: Please discuss any relevant planning history which has affected the building.
- item: 'For demolition of a listed building, a curtilage listed building, or a building making a positive
    contribution to a conservation area: why the demolition is necessary'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition of a listed or curtilage listed building, or a positive building in a conservation
        area.
  source-text: Please justify why the demolition is necessary if you are applying for demolition of
- item: The sources of information consulted (e.g. Historic Environment Record, National Heritage List,
    conservation area appraisal, historic Ordnance Survey maps)
  level: should
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 44-46. Householder
  checklist (8 July 2026), page 4. Listed building consent checklist (8 July 2026), page 4-5. Heritage
  assets include designated assets, non-designated assets (locally listed buildings, buildings of local
  importance in conservation area appraisals and neighbourhood plans), unscheduled archaeological remains,
  and other historic buildings or features of significance; those without a data field show as discretionary.
  The householder checklist requires it when the property is in a conservation area, the proposal materially
  affects the setting of a listed, locally listed or other heritage asset, or it alters or extends a listed
  building. Planning history, demolition and sources come from the council's Heritage Assessment Guidance
  and Template (October 2026), which the list points to and which says the issues it covers must be in
  the assessment for the application to be valid. For listed building consent a full structural survey
  may also be needed.
review-status: unverified
field-status: {}
