reference: photos
local-authority: DST
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: Demolition of an existing building.
  - site:
      in:
      - conservation-area
      - listed-building
      description: Development affecting a Conservation Area or Listed Building.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Existing photographs should be provided if the proposal involves the demolition of an existing
  building or development affecting a Conservation Area or Listed Building.
must-include:
- item: Taken standing well back from the development, including context and reference points to show
    where they were taken from
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 56. For other proposals
  photographs and photomontages are useful background (discretionary). Heritage statements and listed
  building design and access statements also need photographs.
review-status: unverified
field-status: {}
