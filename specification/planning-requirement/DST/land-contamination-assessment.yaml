reference: land-contamination-assessment
local-authority: DST
required-if:
  site:
    in:
    - contaminated-land
    description: On or near land with past or present potentially contaminating uses.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 15; Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: For all applications on or near land that has had past or present potentially contaminating
  uses a land contamination assessment will be required.
must-include:
- item: 'Where contamination is suspected: at least a phase 1 survey based on desk-based research (historic
    maps etc.), a site walkover and an initial risk assessment of sources, pathways and receptors'
  level: must
- item: 'Where contamination is known: a phase 2 site investigation with a site-specific human health
    and environmental risk assessment and a written remediation scheme'
  level: must
  required-if: discretionary
- item: 'Phase 2: evidence the site is suitable for its new use, the effects of pollution on health, the
    natural environment or amenity, and that after remediation the land could not be determined as contaminated
    land under Part IIA of the Environmental Protection Act 1990'
  level: must
  required-if: discretionary
- item: 'Within 250 metres of a former landfill site: specific consideration of ground gas'
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: Within 250 metres of a former landfill site.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 46-47. An extended
  assessment may also be needed in line with national guidance. A phase 2 survey is needed before the
  application can be decided where contamination is known.
review-status: unverified
field-status: {}
