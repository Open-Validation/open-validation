reference: roof-plan-proposed
local-authority: DST
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: An existing roof is altered by the proposal.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Roof plans are needed for complex designs where the shape of the roof is relevant to the
  development proposal. ... Required when proposals involve a more complex roof design or where an existing
  roof is altered by the proposal.
must-include:
- item: The shape of the roof, with details such as dormer windows, rooflights, solar panels, chimneys
    and roofing materials
  level: must
- item: Can be drawn at a smaller metric scale than the floor plans
  level: should
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 27. Householder
  checklist (8 July 2026), page 3. Listed building consent checklist (8 July 2026), page 3. 'Complex designs
  where the shape of the roof is relevant' has no data field, so that part shows as discretionary.
review-status: unverified
field-status: {}
