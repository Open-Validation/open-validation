reference: arboriculturist-report
local-authority: DST
required-if:
  any:
  - all:
    - site:
        in:
        - tree-preservation-zone
        description: Trees protected by a Tree Preservation Order on or next to the site.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Protected trees would be directly or indirectly impacted by the development, demolition
          or construction.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges on or next to the site.
    - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: BS5837:2012; NPPF; Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: Where there are protected trees which are subject of a Tree Preservation Order on or adjacent
  to the site, which will either by (directly or indirectly) impacted by the development or its demolition
  or construction, the above information a) to d) will be required in all cases.
must-include:
- item: A topographical survey
  level: must
- item: A tree survey
  level: must
- item: An arboricultural impact assessment including a tree constraints plan
  level: must
- item: An arboricultural method statement including a tree protection plan
  level: must
- item: In line with the current British Standard BS5837 recommendations
  level: must
- item: 'Current: a survey done within the last 2 years can be reused unless anything has changed that
    might affect the development'
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 65-66. Without a
  Tree Preservation Order, the council 'may ask' for this information after seeing the tree plan, so that
  part shows as discretionary.
review-status: unverified
field-status: {}
