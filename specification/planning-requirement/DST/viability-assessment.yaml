reference: viability-assessment
local-authority: DST
required-if: discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: 'NPPF Section 4; Planning Practice Guidance: Viability; Dorset Council adopted development plans
  and Dorset Local Plan (draft)'
source-text: For all applications where there are viability issues which may prevent the delivery of proposed
  developments, required obligations, contributions or features. For renewable energy applications located
  within the National Landscapes (formerly AONB) where costs of forming a Grid connection outside the
  National Landscapes are ... cited as a prohibiting factor, provision of a viability assessment of forming
  a connection to the Grid will be necessary.
must-include:
- item: An 'open book' viability statement prepared in line with Planning Practice Guidance, in proportion
    to the scheme
  level: must
- item: Prepared by a mutually agreed independent assessor who is a suitably qualified practitioner
  level: should
- item: 'Renewable energy in a National Landscape where grid connection costs outside it are cited: a
    viability assessment of forming a grid connection'
  level: must
  required-if:
    all:
    - condition:
        field: renewable-energy-development
        value: true
        description: Renewable energy development.
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: Within a National Landscape (formerly AONB).
    - discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 57-58. Depends on
  whether you argue viability, so it shows as discretionary. It is reviewed by the District Valuer or
  another independent assessor at the applicant's cost.
review-status: unverified
field-status: {}
