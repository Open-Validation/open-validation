reference: design-and-access-statement
local-authority: DST
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended)
source-text: 'A design and access statement must be submitted with the following types of applications:
  • Outline or Full planning applications for a major development involving any one or more of the following:
  a. the provision of dwellings where – The number of dwellings to be provided is 10 or more; or the development
  is to be carried out on a site having an area of 0.5 hectares or more and the number of dwellings is
  not known; or b. the provision of a building or buildings where the floor space to be created by the
  development is 1,000 square metres or more; or c. development carried out on a site having an area of
  1 hectare or more. Outline or Full planning applications for development in a *designated area, where
  the proposed development consists of: d. one or more dwellings; or e. a building or buildings with a
  floor space of 100 square metres or more. * For the purposes of design and access statements, a designated
  area means a Conservation Area or a World Heritage Site. • An application for listed building consent.'
must-include:
- item: The design principles and context of the development, how the design takes this into account,
    and that it can be adequately accessed by the people who will use it, in particular those with protected
    characteristics
  level: must
- item: Details of any consultation undertaken and its outcome
  level: must
- item: Access mentioned in all cases, even if only to confirm there is no change to the existing arrangement
  level: must
  source-text: In all cases you must mention access, even if it is only to confirm that there is no change
    to the existing arrangement.
- item: 'For listed building consent: how the design concept has considered the special architectural
    or historic importance of the building, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Design and access statements for listed building applications must explain how the design
    concept has considered the special architectural or historic importance of the building, the physical
    features that justify the building being listed, and the buildings’ setting.
- item: 'For listed building consent: photographs of the context and specifics of the proposal'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 18-19. Not required
  for material changes of use, engineering operations, applications to vary or remove conditions, mining
  or waste proposals. Detail should be proportionate. The listed building consent checklist (page 4) allows
  it to be combined with the heritage statement as a single 'Design, Access and Heritage Statement'.
review-status: unverified
field-status: {}
