reference: archaeological-assessment
local-authority: DST
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 16; Dorset Council adopted development plans and Dorset Local Plan (draft)
source-text: In the case of a major development proposal or significant infrastructure works, an applicant
  may need to commission an Archaeological Desk- based Assessment, geophysical survey and/or trench evaluation
  and submit relevant conclusions as part of the heritage statement.
must-include:
- item: Conclusions submitted as part of the heritage statement
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 46. The list says
  an applicant 'may need' a desk-based assessment, geophysical survey and/or trench evaluation for major
  development or significant infrastructure works, so it shows as discretionary. Ask the council's Senior
  Archaeologist.
