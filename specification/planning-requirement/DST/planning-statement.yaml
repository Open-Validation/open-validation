reference: planning-statement
local-authority: DST
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - extraction-oil-gas
    - waste-dev
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Bournemouth, Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and
  Poole Minerals Strategy (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: 'The planning statement should set out the context and justification for the development,
  including:'
must-include:
- item: A description of the site (access, existing uses, landscape, ecological and built features) and
    its surroundings, including relevant designations
  level: must
- item: A description of the proposed development and a summary of its impacts (activities, hours of operation,
    phases, dimensions, appearance, vegetation affected, planting)
  level: must
- item: Relevant national and development plan policies and guidance, and how the proposal accords with
    them
  level: must
- item: 'Where need is a material consideration: why the applicant considers there is a valid need'
  level: must
  required-if: discretionary
- item: How the proposal meets the three dimensions of sustainable development, with mitigation of negative
    effects and enhancement of positive ones
  level: must
- item: 'For variations of conditions or minor material amendments: what changes are proposed and why'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Pre-application discussions and wider consultation with the community and statutory consultees
  level: must
- item: A summary of the conclusions and recommendations of specialist reports, saying which are taken
    forward and which are not, and why
  level: must
- item: 'Waste: how the facility drives waste up the waste hierarchy and meets the spatial strategy of
    the Waste Plan 2019; maximum annual capacity and the types, quantities and sources of waste; how it
    meets Dorset''s requirements (need shown if not consistent with the Waste Plan); operational and processing
    methods (for landfill, phasing and timeframes); residual materials; use of any energy produced; site
    management and monitoring'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 11, 70-71. For other
  applications the list says a planning statement isn't required to validate an application, though it
  is useful. For minerals and waste, other local list information can be included in the planning statement
  depending on scale.
review-status: unverified
field-status: {}
