reference: schedule-of-works
local-authority: DST
required-if:
  any:
  - condition:
      field: structural-demolition
      value: true
      description: Substantial demolition.
  - condition:
      field: agricultural-building-reuse
      value: true
      description: A barn conversion.
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  NPPF Section 5; Dorset Council adopted development plans and Dorset Local Plan (draft)
source-text: A structural survey and schedule of work will normally be required in support of an application
  if the proposal involves substantial demolition, for example, barn conversion applications or the proposed
  conversion or adaptation of historic buildings or major adaptations of non-historic buildings.
must-include:
- item: Clear details of the building fabric to be retained or lost
  level: must
- item: Details of precautions to safeguard the integrity of the building(s)
  level: must
- item: 'Listed building re-thatching: a structural survey of the roof and justification for wholesale
    replacement (and, for a change of thatching material, the information in Historic England''s advice)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
  source-text: Re-thatching works should include a structural survey of the roof and justification for
    wholesale replacement.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 24, 59-60. Listed
  building consent checklist (8 July 2026), page 4. Conversion or adaptation of historic buildings and
  major adaptations of non-historic buildings have no data field (discretionary). For listed building
  consent 'a full structural survey may be required' by a conservation-accredited structural engineer
  or building surveyor (page 46); the listed building consent checklist says to ask the conservation team
  if the proposal includes complete or substantial demolition or structural alterations.
review-status: unverified
field-status: {}
