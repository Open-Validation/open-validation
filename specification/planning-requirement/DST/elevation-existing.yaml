reference: elevation-existing
local-authority: DST
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: The proposal involves demolition.
  - condition:
      field: external-alterations
      value: true
      description: External alterations to an existing building.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Existing elevation plans are needed if a proposal involves demolition or changes to an existing
  building that include demolition and/or external alterations. For smaller alterations or extensions,
  this information can be included in the proposed elevation plans provided it is clear as to what exists
  and what is proposed.
must-include:
- item: Drawn at 1:50 or 1:100 (very large buildings can be drawn at a larger scale)
  level: must
- item: All sides of the affected buildings or structures
  level: must
- item: Buildings or walls to be demolished clearly shown, ideally highlighted in a separate colour
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: All door and window openings, and blank elevations where there are none
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 26. Householder
  checklist (8 July 2026), page 3. The householder and listed building consent checklists ask for all
  elevations where changes are proposed to any part of the exterior (including doors and windows). For
  smaller alterations or extensions the existing can be shown on the proposed elevations if it is clear
  what exists and what is proposed.
review-status: unverified
field-status: {}
