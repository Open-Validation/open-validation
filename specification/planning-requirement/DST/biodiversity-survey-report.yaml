reference: biodiversity-survey-report
local-authority: DST
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - outline
        - reserved-matters
        - technical-details-consent
        - lbc
    - condition:
        field: protected-species
        value: true
        description: The biodiversity checklist shows ecological information is needed (for example protected
          species or habitats could be affected).
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      description: Directly affects a European or international site (SAC, SPA, Ramsar) or a Site of Special
        Scientific Interest.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 15; Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations
  2017 (as amended); Natural Environment and Rural Communities Act 2006; Dorset Council adopted development
  plans and Dorset Local Plan (draft)
source-text: Where the application form/biodiversity checklist indicates that ecological information is
  required, this information must be submitted with the application at the validation stage.
must-include:
- item: Carried out at an appropriate time and month of the year, in suitable weather conditions, using
    nationally recognised survey guidelines and methods
  level: must
  source-text: Ecological surveys and reports must be carried out at an appropriate time and month of
    the year, in suitable weather conditions and using nationally recognised survey guidelines/methods
    for the subject.
- item: Undertaken by a competent person with suitable qualifications and experience
  level: must
- item: 'For development directly affecting a European or international site (SAC, SPA, Ramsar) or SSSI:
    an Ecological Impact Assessment (or Environmental Statement if EIA development)'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      description: Directly affects a European or international site (SAC, SPA, Ramsar) or a Site of Special
        Scientific Interest.
  source-text: An Ecological Impact Assessment, or Environmental Statement (if the development is confirmed
    as EIA development through the screening application), is required,
- item: The same red line boundary as the location plan
  level: must
- item: No more than 2 years old unless the competent person advises otherwise
  level: should
  source-text: Surveys/reports should be up-to-date and no more than 2 years old unless the competent
    person advises otherwise and must be undertaken at the appropriate time of year.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 9, 17, 36-38. Householder
  checklist (8 July 2026), page 5. Listed building consent checklist (8 July 2026), page 5. The biodiversity
  checklist (part of the Planning Portal form, or the v9-2024 checklist for paper applications; not for
  minerals and waste) says what surveys are needed; it has no matching id (see the unmapped list). Applications
  submitted without the surveys, where they cannot be done at that time of year, are closed as invalid.
  The Dorset Biodiversity Appraisal Protocol (DBAP) review, including a Biodiversity Plan for householder,
  listed building and barn conversions, is the council's preferred route but is a separate service. Mitigation
  for protected habitat sites (heathlands, Poole Harbour, New Forest) is secured through CIL or a legal
  agreement.
review-status: unverified
field-status: {}
