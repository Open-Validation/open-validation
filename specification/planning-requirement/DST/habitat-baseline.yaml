reference: habitat-baseline
local-authority: DST
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Biodiversity Gain Requirements
  (Exemptions) Regulations 2024 as amended by the Biodiversity Gain (Town and Country Planning) (Amendments
  and Transitional Provisions) (England) Regulations 2026
source-text: plan(s), drawn to an identified scale and showing the direction of North, showing onsite
  habitat existing on the date of application (or earlier proposed date), including any irreplaceable
  habitat (if applicable).
must-include:
- item: Drawn to an identified scale, with the direction of North (a stated scale, scale bar and north
    arrow)
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date), including any irreplaceable
    habitat
  level: must
- item: Where relevant, an off-site baseline habitat plan
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site biodiversity units are used.
  source-text: Where relevant, an off-site baseline habitat plan
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 21, 41. The list
  says BNG applies to all development unless exempt; by law householder and other exempt applications
  are outside it, so the rule is the biodiversity gain condition.
review-status: unverified
field-status: {}
