reference: sustainability-statement
local-authority: DST
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units, including change of use/conversion, replacement dwellings
          and holiday accommodation.
    - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-02-02-2026
source-text: 'Sustainability checklist and statement When it’s required For full planning applications,
  outline* and reserved matter applications, and applications for technical details consent, a completed
  checklist and sustainability statement is required for the following types of development: New residential/the
  creation of additional residential units including change of use/conversion, replacement dwellings and
  holiday accommodation including hotels.'
must-include:
- item: A completed sustainability checklist, answering the Yes/No column and the reasoning column where
    relevant
  level: must
confidence: medium
notes: 'Audit (wrong_app_type, duplicate): item 43 is limited to full, outline, reserved matters and technical
  details consent, not prior approval; the workbook entered it twice per sheet. The excerpt is cut after
  the first type of development, so the other types are shown as discretionary.'
review-status: unverified
field-status: {}
