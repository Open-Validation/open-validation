reference: sustainability-statement
local-authority: DST
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units, including by change of use or conversion, and replacement
          dwellings.
    - condition:
        field: overnight-accommodation
        value: true
        description: Holiday accommodation including hotels.
    - all:
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: New non-residential floorspace (commercial, office, storage and distribution, retail,
            industrial, waste, community, leisure, educational or agricultural).
      - any:
        - condition:
            field: new-build
            value: true
            description: New or replacement buildings.
        - condition:
            field: involves-change-of-use
            value: true
            description: A change of use to one of these uses.
        - condition:
            field: floorspace-increase-percent
            operator: '>'
            value: 10
            description: Extensions of over 10% additional gross internal floorspace.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 14; Dorset Council adopted development plans and Dorset Local Plan (draft); Dorset
  Council Planning for Climate Change - Interim Guidance and Position Statement; Interim Guidance Note
  - Sustainability statement and checklist
source-text: 'For full planning applications, outline* and reserved matter applications, and applications
  for technical details consent, a completed checklist and sustainability statement is required for the
  following types of development: • New residential/the creation of additional residential units including
  change of use/conversion, replacement dwellings and holiday accommodation including hotels. • New non-residential
  development including commercial, office, storage and distribution, retail, industrial, waste, community
  or leisure and educational development including extensions of over 10% additional gross internal floorspace
  including proposals for a change of use to any of these uses ... • New or replacement agricultural buildings
  • Mixed use development'
must-include:
- item: A completed sustainability checklist, answering the Yes/No column and the reasoning column where
    relevant
  level: must
- item: A sustainability statement where the checklist requires it, covering each checklist question and
    cross-referencing other assessments and documents
  level: must
- item: 'How sustainable design and construction have been considered: energy and carbon, waste, recycling,
    water, green infrastructure, sustainable drainage and pollution, sustainable materials, climate change
    adaptation and sustainable travel'
  level: must
- item: 'At outline: the checklist completed as fully as practicable, noting what will follow at reserved
    matters'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 62-64. Prior notification
  and permission in principle applications are exempt, and it does not apply to listed building consent
  or minerals applications. Householder applicants are encouraged (not required) to submit the checklist
  or cover climate change in a planning statement. Mixed use development is caught by the residential
  and non-residential parts. The 10% extension threshold uses a new field, floorspace-increase-percent.
review-status: unverified
field-status: {}
