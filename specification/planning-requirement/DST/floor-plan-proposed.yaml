reference: floor-plan-proposed
local-authority: DST
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The proposal creates new or extended floor space.
  - condition:
      field: involves-change-of-use
      value: true
      description: The proposal involves a change of use.
  - condition:
      field: building-works
      value: true
      description: The proposal alters existing buildings, including conversions.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-02-02-2026
source-text: Existing and proposed floor plans When it’s required For all applications proposing new or
  extended floor space, change of use and/or proposals to alter existing buildings including conversions.
must-include:
- item: Finished floor levels for new buildings, related to at least one off-site fixed and clearly identifiable
    datum point (non-householder applications only)
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
  source-text: For new buildings, the floor plan must include finished floor levels for the new building
    related to at least one-off site fixed and clearly identifiable datum point (this applies to non-householder
    applications only).
- item: Proposed changes marked on the plans
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: Section 73 and non-material amendment applications must mark proposed changes
confidence: medium
notes: 'Audit (wrong_app_type, missing_requirement): not prior approval; item 12 requires s73 and non-material
  amendment applications to mark proposed changes.'
review-status: unverified
field-status: {}
