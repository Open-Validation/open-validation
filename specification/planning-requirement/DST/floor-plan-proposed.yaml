reference: floor-plan-proposed
local-authority: DST
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: New or extended floor space, or alterations to existing buildings including conversions.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: For all applications proposing new or extended floor space, change of use and/or proposals
  to alter existing buildings including conversions.
must-include:
- item: Drawn at 1:50 or 1:100 (very large buildings can be drawn at a larger scale)
  level: must
- item: Buildings or walls to be demolished clearly shown, ideally highlighted in a separate colour
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: Shows the proposal in context with the existing building(s) on the property, the adjoining properties
    and their boundaries, and the internal floor layout with all existing and proposed openings (doors,
    windows)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - lbc
  source-text: Show the proposal in context to the existing building/s on the property and with the adjoining
    properties and their boundaries ... Show the internal floor layout of the proposal including all existing
    and proposed openings – for example doors, windows.
- item: 'For new buildings: finished floor levels related to at least one off-site fixed and clearly identifiable
    datum point (not householder applications)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
    - condition:
        field: new-build
        value: true
        description: A new building.
- item: New buildings shown in context with adjoining buildings, including property numbers
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building.
- item: 'For change of use: the existing and proposed use of each area clearly labelled'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
- item: Complies with national guidance on inclusive mobility
  level: should
- item: 'For listed building consent: wood burners in thatched buildings, with the fire surrounds shown
    on the floor plans'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 24-26. Householder
  checklist (8 July 2026), page 3. Listed building consent checklist (8 July 2026), page 3-4.
review-status: unverified
field-status: {}
