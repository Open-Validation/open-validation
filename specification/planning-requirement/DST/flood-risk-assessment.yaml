reference: flood-risk-assessment
local-authority: DST
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: The site is in Flood Zone 2, 3 or 3b, or an area at risk of surface water flooding.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site has an area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site has an area of 1 hectare or more.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/householder-checklist-29-04-2025
source-text: 'Flood Risk Assessment flood Risk zone 2, 3 or 3b an area at risk of surface water flooding
  an area at risk of ground water flooding as identified on the Ground Water Susceptibility of Flooding
  layer an area identified in the Councils’ Strategic Flood Risk Assessment (SRFA) at risk of flooding
  in the future … Note: If your site has an area of 1 hect…'
confidence: medium
notes: The list says 'For all applications*, a site-specific flood risk assessment (FRA) will be required
  for ... development on a site in Flood Zone 2 or 3 including householder, minor development and change
  of use'. Groundwater and SFRA future-risk areas have no field, so they are shown as discretionary. The
  1 hectare note is cut off in the excerpt.
