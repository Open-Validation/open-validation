reference: flood-risk-assessment
local-authority: DST
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood Zone 2 or 3 (including householder, minor development and change of use).
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site area of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site area of 1 hectare or more.
  - site:
      in:
      - surface-water-flood-risk
      description: At medium (1 in 100 year) or high (1 in 30 year) risk of surface water flooding.
  - site:
      in:
      - groundwater-flood-risk
      description: At risk of groundwater flooding (Dorset Explorer Ground Water Susceptibility to Flooding
        layer or the Environment Agency's Groundwater Warning Zone 2019).
  - site:
      in:
      - future-flood-risk
      description: Identified in a strategic flood risk assessment as at increased flood risk in future.
  - site:
      in:
      - critical-drainage-area
      description: In Flood Zone 1 with critical drainage problems notified by the Environment Agency.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 14; Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019); Dorset Council Level 1 Strategic
  Flood Risk Assessment (2023); Dorset Council Level 2 Strategic Flood Risk Assessment Weymouth (2023)
source-text: 'For all applications*, a site-specific flood risk assessment (FRA) will be required for
  the following development proposals: • development on a site in Flood Zone 2 or 3 including householder,
  minor development and change of use; • development on a site with an area of 1 hectare or more in a
  Flood Zone 1; • development on sites less than 1 ha in Flood Zone 1 where the application site could
  be affected by other sources of flooding including: I. a risk of surface water flooding – where that
  risk is medium (1 in 100 year) or high (1 in 30 year), and/or, II. a risk of ground water flooding as
  identified on Dorset Explorer’s Ground Water Susceptibility to Flooding layer, and/or ... III. a risk
  of ground water flooding as identified on the Environment Agency’s Groundwater Warning Zone 2019 and/or
  IV. flooding from surface water drains and/or V. reservoirs – where ‘dry day,’ ‘wet day’ and ‘fluvial
  contribution’ scenarios apply as defined on Environment Agency mapping. • development in areas identified
  in a strategic flood risk assessment as being at increased flood risk in future; • in an area within
  flood zone 1 which has critical drainage problems as notified by the Environment Agency;'
must-include:
- item: Risks from all sources of flooding to and from the development assessed, and how they will be
    controlled, managed and mitigated, taking the latest climate change allowances into account
  level: must
- item: Flood Risk Zone 3b defined, where relevant
  level: must
  required-if: discretionary
- item: Flood risks from other sources ranked as 'low', 'medium' or 'high' using the Flood Zone risk bandings,
    with justification for the ranking
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including SuDS, and safe access to and from the
    development in areas at risk of flooding
  level: must
- item: Part of the Environmental Statement where one is required
  level: must
  required-if:
    condition:
      field: eia-development
      value: true
      description: EIA development.
- item: A design for biodiversity net gain considered as part of the SuDS design
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 41-44. Householder
  checklist (8 July 2026), page 4. Householder first floor extensions over an existing footprint do not
  need an FRA. Flooding from surface water drains and reservoirs ('dry day', 'wet day' and 'fluvial contribution'
  scenarios) has no data field, so it shows as discretionary. Other development in Flood Zone 1 may need
  information under the Environment Agency's standing advice. The householder checklist lists Flood Zone
  2, 3 or 3b, surface water and groundwater flood risk and SFRA future risk, and says to ask the planning
  team if the site is 1 hectare or more. The sequential test has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
