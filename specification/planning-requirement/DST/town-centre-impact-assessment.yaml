reference: town-centre-impact-assessment
local-authority: DST
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail and leisure development outside town centres.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with an up-to-date development plan.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Exceeding 2,500 square metres of gross floor space.
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 7, paragraph 94; Dorset Council adopted development plans and Dorset Local Plan (draft)
source-text: For retail and leisure development proposals outside town centres, which are not in accordance
  with an up-to-date development plan, a retail impact assessment will be required, as set out in the
  National Planning Policy Framework 2024 paragraph 94, to proposals exceeding 2,500 square metres of
  gross-floor space.
must-include:
- item: The likely catchment area and nearby centres that are suitable locations for the scale and form
    of development, over an area of search agreed with the council
  level: must
- item: The availability, suitability and viability of alternative town centre sites and, where appropriate,
    edge of centre sites
  level: must
- item: Impact on town centre vitality and viability, including consumer choice and trade, up to 5 years
    from the application (up to 10 years for major schemes whose full impact takes longer)
  level: must
- item: Impact on existing, committed and planned public and private investment in town centres in the
    catchment
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 57. Impact assessments
  may also be needed for extensions, redevelopment or variations of conditions that would alter the effects
  of a development (discretionary). The applicant pays for the independent assessor's review.
review-status: unverified
field-status: {}
