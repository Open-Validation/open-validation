reference: coastal-change-assessment
local-authority: DST
required-if:
  site:
    in:
    - coastal-erosion-zone
    description: In an area of coastal instability or an indicative erosion zone identified in a Shoreline
      Management Plan.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Sections 14 and 15; Dorset Council adopted development plans and Dorset Local Plan (draft);
  West Dorset, Weymouth and Portland Local Plan Policy EN7 - Slope Instability Zones
source-text: 'For all applications, a ground stability or coastal erosion vulnerability report is required
  for proposals where there are known land stability issues, including: • in areas of coastal instability;
  ... indicative erosion zones identified in a Shoreline Management Plan;'
must-include:
- item: Prepared by a suitably qualified and experienced geotechnical specialist
  level: must
- item: Local geology, the land stability history of the site, site inspection, ground investigation,
    assessment of land stability risks, and mitigation measures
  level: must
- item: Whether the site is or could be made stable for the lifetime of the development, whether the development
    would threaten stability in the wider area, whether instability can be reduced to an acceptable level,
    and impacts on the character of the area, environmental designations and public rights of way
  level: must
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 48-49. This file
  covers the coastal part of the list's 'ground stability or coastal erosion vulnerability report'. The
  other triggers (slope instability zones, former mine or quarry workings, the No Surface Water Discharge
  Zone, land within 200 metres of cliffs or steep slopes) have no matching id (see the unmapped list).
  If you don't submit a report, you must show that surface water goes to existing piped systems, foundations
  are suitably designed and there is no significant filling or excavation.
review-status: unverified
field-status: {}
