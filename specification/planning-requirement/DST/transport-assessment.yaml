reference: transport-assessment
local-authority: DST
required-if: discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 9, paragraphs 115 and 118; Dorset Council adopted development plans and Dorset Local
  Plan (draft); Bournemouth, Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset
  and Poole Minerals Strategy (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: Transport assessments are required for all development proposals which will generate significant
  amounts of traffic or movements.
must-include:
- item: Coverage and detail that reflect the scale of the development and its transport implications
  level: must
- item: 'For smaller schemes (a transport statement): expected trip generation and implications for the
    highway network, access to public transport, expected impacts on parking, and car or cycle parking
    provision'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 64-65. 'Significant
  amounts of traffic' has no threshold in the list, so it shows as discretionary. A transport statement
  is a lighter-touch version where impacts are limited. Any proposal needing a transport assessment also
  needs an air quality assessment.
review-status: unverified
field-status: {}
