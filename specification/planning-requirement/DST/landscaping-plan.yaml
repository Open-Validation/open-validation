reference: landscaping-plan
local-authority: DST
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
    - discretionary
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Dorset Council adopted development plans and Dorset Local Plan (draft); North Dorset Local Plan
  Policies 4, 24 and 25; West Dorset, Weymouth and Portland Local Plan ENV1 and ENV10; Christchurch and
  East Dorset Local Plan HE2; Purbeck Local Plan Policy D; draft Dorset Local Plan ENV8; Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: All full applications for major development or where it is identified that the development
  proposals could have an impact on the landscape character and/or views and visual amenity. For outline
  and reserved matters applications when landscaping is a matter being applied for.
must-include:
- item: A plan of the proposed external works, including hard and soft landscaping and all other landscape
    features (trees and planting, flood management, roads and paths, fences and walls, screening, noise
    bunds); can be shown on the proposed site plan
  level: should
- item: An evaluation of the existing landscape features and how the proposal maintains and enhances the
    area and mitigates negative impacts
  level: should
- item: Measures to retain existing landscape features (e.g. important trees and hedges) or encourage
    natural regeneration
  level: should
- item: Planting specifications (soil preparation, planting method, spacing, seed types, species, stock
    size, protection and support, timing)
  level: should
- item: Evidence the ground is suitable for the planting scheme (soil type, volumes and condition)
  level: should
- item: Construction details and materials for landscape features (hedge banks, walls, fencing, surfacing)
  level: should
- item: Evidence planting is coordinated with street lighting and below-ground services
  level: should
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 52-53. Proportionate
  to the scheme; items are 'where relevant'. Possible landscape impact, and whether landscaping is a matter
  applied for at outline or reserved matters, have no data field, so those parts show as discretionary.
review-status: unverified
field-status: {}
