reference: protected-landscape-assessment
local-authority: DST
required-if:
  all:
  - site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within a National Landscape (formerly AONB).
  - discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: NPPF Section 15, paragraphs 189 and 190 and footnote 67; Countryside and Rights of Way Act 2000;
  Dorset Council adopted development plans and Dorset Local Plan (draft)
source-text: For major developments (described in footnote 67 of the National Planning Policy Framework)
  within a National Landscape.
must-include:
- item: The need for the development, including national considerations, and the impact of permitting
    or refusing it on the local economy
  level: must
- item: The cost of, and scope for, developing outside the designated area or meeting the need another
    way
  level: must
- item: Any detrimental effect on the environment, the landscape and recreational opportunities, and how
    far it could be moderated
  level: must
- item: Cross-references to relevant content in any LVIA
  level: should
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 51. 'Major development'
  here is the NPPF footnote 67 meaning, a matter of judgement for the decision maker rather than the usual
  size thresholds, so it shows as discretionary.
review-status: unverified
field-status: {}
