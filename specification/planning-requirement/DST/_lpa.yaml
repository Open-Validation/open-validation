submission-standards:
- item: Plans and drawings submitted as single PDF documents; JPGs and photographed plans and drawings
    are not acceptable because they cannot be accurately scaled
  level: must
- item: Drawn to an identified standard metric scale with a scale bar that matches the stated scale ratio
  level: must
- item: Provided at the scale indicated on the plan (e.g. a plan stating 1:100 @A3 is provided at A3 electronically)
  level: must
- item: Location and block plans based on an up-to-date map and showing North
  level: must
- item: '''Do not scale'' removed and replaced with wording that allows the council to scale from the
    drawing'
  level: must
- item: Each plan given a unique reference number and title
  level: must
- item: A revision number shown when a plan is revised
  level: should
- item: Legible, with clear labels and legends, and a clear distinction between existing features to be
    retained, features to be removed and proposed features
  level: must
- item: Single line drawings are not acceptable; drawings include full details of architectural features
    (e.g. frame widths and glazing bars on doors and windows, eaves and ridge details)
  level: must
- item: Personal details such as mobile numbers and e-mails removed from plans
  level: must
- item: Plans for Section 73 variations and non-material amendments mark all proposed changes
  level: must
- item: Plans taken from Dorset Explorer or other Dorset Council mapping web pages are not accepted (copyright)
  level: must
- item: Ordnance Survey based plans show the copyright and licence number
  level: must
- item: Permission obtained to use any plans or drawings submitted; drawings that appear to infringe copyright
    are not accepted
  level: must
- item: Confidential information referenced in the file name or clearly marked
  level: should
- item: Surveys, reports, assessments and appraisals undertaken by a competent person with suitable qualifications
    and experience
  level: must
- item: Surveys and reports up to date and no more than 2 years old unless the competent person advises
    otherwise
  level: should
- item: 'Paper submissions: forms, plans and documents sent as PDFs by e-mail to the relevant planning
    team, with a completed biodiversity checklist'
  level: should
- item: Plans prepared by a professional in most cases
  level: should
