reference: bng-metric
local-authority: DST
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Biodiversity Gain Requirements
  (Exemptions) Regulations 2024 as amended by the Biodiversity Gain (Town and Country Planning) (Amendments
  and Transitional Provisions) (England) Regulations 2026
source-text: A mandatory requirement to provide BNG applies to all types of development unless it has
  been granted a specific exemption.
must-include:
- item: The pre-development biodiversity value(s) on the date of application or an earlier proposed date
  level: must
- item: The earlier date and the reasons for proposing it, where an earlier date is used
  level: must
  required-if: discretionary
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat, with the publication date of the biodiversity metric used
  level: must
- item: A statement whether activities before that date have lost onsite biodiversity value ('degradation');
    if so the date before them, the value on that date, the completed metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: The statutory metric (the latest published national statutory metric) or the Small Sites Metric,
    depending on the application type
  level: must
  source-text: a. The Statutory Metric, the latest published national statutory Metric or Small Sites
    Metric – depending on the application type.
- item: Where available, indicative data on the biodiversity value of on-site post-development habitats
  level: should
- item: Where available, indicative data on the biodiversity value of off-site post-development habitats
  level: should
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site biodiversity units are used.
- item: Any other reports needed to complete the biodiversity assessments, such as supporting condition
    assessment sheets
  level: must
  required-if: discretionary
  source-text: d. Any other reports necessary to complete the biodiversity assessments such as supporting
    condition assessment sheets where relevant.
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 21, 39-41. The list
  says BNG applies to all development unless exempt; by law householder and other exempt applications
  are outside it, so the rule is the biodiversity gain condition. The national items (section 11) are
  the statutory information; the post-development data and other reports are Dorset's local additions
  (section 24). For permission in principle, BNG information is needed at the technical details stage.
  The Biodiversity Gain Statement and draft heads of terms have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
