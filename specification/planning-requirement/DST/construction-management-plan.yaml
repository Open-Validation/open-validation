reference: construction-management-plan
local-authority: DST
required-if: discretionary
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: 'NPPF; Planning Practice Guidance: Waste; Dorset Council adopted development plans and Dorset
  Local Plan (draft); Bournemouth, Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth,
  Dorset and Poole Minerals Strategy (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)'
source-text: 'For all applications when construction will result in a conflict, disturbance or significant
  impact on: • neighbours; • other road users; • sensitive wildlife designations; or • sensitive landscape
  designations.'
must-include:
- item: How on-site construction impacts will be managed, particularly on neighbours, sensitive uses,
    biodiversity and the highway network, with accompanying drawings
  level: must
- item: 'As appropriate: timetable of works; traffic management (routing, number, frequency and size of
    vehicles); days and hours of building operations and deliveries; loading, unloading and storage of
    plant and materials; contractor compound; boundary fencing or hoarding; protection of trees, hedgerows,
    habitats and protected species; parking for site personnel and visitors; wheel washing; dust control'
  level: should
- item: 'Where relevant: sustainable procurement to minimise construction waste, and the types and quantities
    of waste in the demolition, construction and operational phases and how they will follow the waste
    hierarchy'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 75-76. In the minerals
  and waste section but stated 'for all applications' where construction would cause conflict, disturbance
  or significant impact on neighbours, road users or sensitive wildlife or landscape designations; that
  has no data field, so it shows as discretionary. Public rights of way must stay open until closure or
  diversion is authorised.
review-status: unverified
field-status: {}
