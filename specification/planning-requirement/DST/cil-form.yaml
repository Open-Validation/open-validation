reference: cil-form
local-authority: DST
required-if:
  any:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
      - s73
      - change-of-use
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: residential-annexe
        value: true
        description: A householder application creating an annexe.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Community Infrastructure Levy Regulations 2010 (as amended); Dorset Council CIL Charging Schedules
source-text: To enable us to determine whether a development is CIL liable, the application must be accompanied
  by an Additional CIL Information form (CIL Form 1).
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 34-35. Not needed
  for householder applications (unless creating an annexe), certificates of lawfulness, listed building
  consent, demolition determinations, advertisement consent, agricultural prior notifications for new
  agricultural buildings, non-material amendments, outline permission or permission in principle. CIL
  applies to certain types of development in parts of the council's area.
review-status: unverified
field-status: {}
