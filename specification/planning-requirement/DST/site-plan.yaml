reference: site-plan
local-authority: DST
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - s73
      - non-material-amendment
      - change-of-use
      - advertising
      - prior-approval
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: operational-development
        value: true
        description: A certificate of lawfulness for operational development.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: footprint-increase
        value: true
        description: Listed building consent works that extend any part of the building.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  Purbeck Local Plan Policy H10
source-text: For all applications. Note – see also additional site and block plan requirements for minerals
  and waste applications
must-include:
- item: A detailed metric scale drawing, usually 1:500, 1:200 or 1:100 (or 1:1250, 1:2500 or 1:10,000
    for major sites of more than 1 hectare)
  level: must
  source-text: A detailed metric scale drawing, usually at scale 1:500, 1:200 or 1:100 for most applications
    or 1:1250 or 1:2500,1:10,000 for major sites more than 1ha
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and all other existing buildings on
    the site, in context with neighbouring land, properties and uses
  level: must
- item: 'For variations of condition or non-material amendments: the area of the amendment or change clearly
    identified'
  level: should
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
- item: Roads and footpaths, existing and proposed accesses, visibility splays, turning and parking, including
    cycle parking and storage, where they influence or are affected by the development
  level: must
  source-text: 'The site/block plan must also include the following if they influence or will be affected
    by the proposed development:'
- item: Public rights of way crossing or adjoining the site, where relevant
  level: must
- item: The extent and type of any hard surfacing, where relevant
  level: must
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: Boundary treatment, including walls or fencing, where relevant
  level: must
- item: Arrangements for storage and collection of waste and recycling, for new development and uses that
    produce domestic or commercial waste
  level: must
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: New development.
    - condition:
        field: involves-change-of-use
        value: true
        description: A new use.
- item: Existing and proposed contours, where relevant
  level: must
- item: Complies with national guidance on inclusive mobility
  level: should
- item: 'Purbeck Local Plan area: accessible and adaptable homes identified in line with Policy H10 (allocated
    sites: see the site policy for thresholds)'
  level: must
  required-if:
    all:
    - condition:
        field: former-district
        value: purbeck
        description: The site is in the adopted Purbeck Local Plan area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more homes.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: A site area greater than 0.5 hectares.
  source-text: For applications within the adopted Purbeck Local Plan area, site plans for developments
    of 10 or more homes or with a site area greater than 0.5 hectares should identify accessible and adaptable
    homes in accordance with Policy H10 of the
- item: 'Minerals: existing site and topographic survey (1:2500 to 1:100) with green infrastructure, levels,
    contours to OS datum, buildings, watercourses, public rights of way, overhead lines, roads, previous
    mineral working and trial pits and boreholes'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
- item: 'Minerals and waste: proposed working plans (1:2500 to 1:100) showing areas to be excavated (edged
    orange) and filled (hatched), features to remain undisturbed, soil and overburden storage, screening
    and landscaping, plant, stockpiles and buildings with maximum heights, fencing, method, direction
    and phasing of working with the duration of each phase, drainage and water discharges, the vehicular
    access route to the public highway, and measures for overhead lines, services and public rights of
    way'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
- item: 'Minerals: for underground mining, mine entries, areas likely to subside and areas left unworked;
    for oil and gas, the survey route, boreholes and wells and processing and distribution facilities'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
- item: 'Waste: existing site and topographic survey (1:2500 to 1:100), including any land used for waste
    management, deposits of waste, areas restored, related permissions and trial pits and boreholes'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Minerals and waste: proposed finished floor and site levels, contours and heights related to
    OS datum (1:50 or 1:100)'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
- item: 'Minerals and waste: detailed junction layouts with road width, construction, turning radii and
    visibility splays (1:50 or 1:100)'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
- item: 'Minerals and waste: restoration, aftercare and afteruse plan(s) (1:2500 to 1:100) with final
    contours (extended at least 250 metres beyond the site), soil depths and sources, water features,
    land drainage, trees and hedges to be retained and planted, boundary treatments and public access'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - extraction-oil-gas
        - waste-dev
    - discretionary
confidence: medium
notes: From the council's list (adopted 2 February 2026, v1.3 of 6 August 2026), page 24-25, 71-73. 'For
  all applications', so the types are the main planning ones; a certificate of lawfulness for operational
  development also needs a location plan, site/block plan and drawings (section 39, page 59). The listed
  building consent checklist (page 3) says block plans are not needed for internal alterations only, or
  external alterations only to the fabric of the existing building, but are needed if any part of the
  building is extended. The restoration plans apply 'where relevant'. The Purbeck item uses the former-district
  field (value purbeck).
review-status: unverified
