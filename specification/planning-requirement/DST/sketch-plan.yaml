reference: sketch-plan
local-authority: DST
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - hh
      - s73
      - mineral-extraction
      - mineral-app
      - extraction-oil-gas
      - waste-dev
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges on the site or on adjoining properties that are within falling distance,
        could influence the development, may be impacted during construction or are important to local
        landscape character.
source-url: https://www.dorsetcouncil.gov.uk/documents/d/guest/validation-national-and-local-list-06-08-2026
policy: BS5837:2012; Dorset Council adopted development plans and Dorset Local Plan (draft); Bournemouth,
  Christchurch, Poole and Dorset Minerals Sites Plan (2019); Bournemouth, Dorset and Poole Minerals Strategy
  (2014); Bournemouth, Christchurch, Poole and Dorset Waste Plan (2019)
source-text: 'As a minimum validation requirement, where there are trees or hedges on the application
  site or on adjoining properties which: • are within falling distance of your proposed development; •
  could influence the development; • maybe impacted on during construction; and/or • might be important
  as part of the local landscape character,'
must-include:
- item: The position of all these trees and hedges accurately marked on a scaled plan, normally the proposed
    site/block plan
  level: must
- item: Each tree or hedge with a reference number (such as T1, T2)
  level: must
- item: The species by common name
  level: must
- item: Stem diameter measured at 1.5 metres above ground level
  level: must
- item: Whether each is to be retained or removed
  level: must
confidence: medium
notes: 'From the council''s list (adopted 2 February 2026, v1.3 of 6 August 2026), page 65-66. Householder
  checklist (8 July 2026), page 4. The tree position plan uses the retired MHCLG id sketch-plan. Tree
  surveys and reports must be current: an old survey can be reused if done within the last 2 years and
  nothing has changed.'
review-status: unverified
field-status: {}
