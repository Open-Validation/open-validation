source-text: 'Householder: required Guidance Ecological impact assessment (ECIA) or preliminary ecological
  appraisal (pea) All development likely to affect: internationally and nationally designated sites European
  and nationally protected species priority habitats and species significant populations of national or
  local red list or notable species.


  Full planning, Listed building consent: A protected species survey and report is required where it is
  considered there is a reasonable likelihood of a protected species being present and affected by development.


  Reserved matters: potentially relevant Protected species survey report Required for: *All developments
