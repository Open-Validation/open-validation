reference: lighting-assessment
local-authority: GRY
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: All development where external lighting is proposed (unless agreement to conditions
        is made clear in the application).
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: An illuminated advert.
    - site:
        in:
        - rural-area
        description: In the countryside.
source-url: https://www.great-yarmouth.gov.uk/article/8484/Reserved-matters-application
