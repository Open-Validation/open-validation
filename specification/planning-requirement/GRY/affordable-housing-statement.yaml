reference: affordable-housing-statement
local-authority: GRY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major housing applications of 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential development on a site of 0.5 hectares or more.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.great-yarmouth.gov.uk/article/8520/Outline-planning-application
source-text: 'Full planning: required Guidance Affordable housing statement Major housing applications
  whether or not affordable housing is proposed (a major application is 10 or more dwellings, residential
  development on a site having an area of 0.5 hectares or more) to be included unless the site is within
  affordable housing sub-market 3 as defined in policy CS4 of the LPP1 (as modified by policy UCS4 of
  LPP2).


  Reserved matters: A2 sub paragraph f) Affordable housing statement Required for any reserved matters
  applications where the outline permission has included an obligation to provide affordable housing on
  site A short report setting out how the requirements to provide affordable housing (as detailed within
  planning obligations) are being taken into account through the design, layout and housing mix presented
  within the reserved matters details.'
confidence: low
notes: The excerpts state the triggers. Sites in affordable housing sub-market 3 (policy CS4/UCS4) are
  excluded below 15 dwellings (audit), which the rule can't express. For reserved matters, only where
  the outline permission included an obligation to provide affordable housing on site.
