reference: heritage-statement
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - battlefield
        - world-heritage-site
        - locally-listed-building
        description: Could affect a heritage asset, including its setting.
    - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application which could affect/impact
  a heritage asset including to its setting.
must-include:
- item: An assessment of the historical significance of the asset, including any contribution made by
    its setting
  level: must
- item: An assessment of the impact of the works on the significance of the asset, including changes in
    setting, and whether harm would be caused
  level: must
- item: How harm will be avoided and, only where this is not possible, the mitigation measures to be employed
  level: must
- item: Townscape drawings
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 18. The list calls this a 'Heritage Assessment'.
  It covers any heritage asset, so assets that are not designated show as discretionary. Each local item
  is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should be provided
  where relevant to the planning application' and that the planning officer decides what is needed to
  validate.
review-status: unverified
field-status: {}
