reference: biodiversity-survey-report
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any application which has the potential to impact ecology and/or biodiversity.
must-include:
- item: A preliminary ecological appraisal assessing the potential impact of the development on ecology
    and biodiversity
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 24. The list calls this a 'Preliminary Ecological
  Appraisal'. Whether a proposal could affect ecology or biodiversity is a judgement, so it shows as discretionary.
  Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should
  be provided where relevant to the planning application' and that the planning officer decides what is
  needed to validate.
review-status: unverified
field-status: {}
