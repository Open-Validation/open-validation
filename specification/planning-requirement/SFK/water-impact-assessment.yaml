reference: water-impact-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: ground-disturbance
      value: true
      description: Disturbance to the ground.
  - any:
    - site:
        in:
        - source-protection-zone
        description: The site is above a groundwater protection zone.
    - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application where this is disturbance
  to the ground and the site is above a groundwater protection zone. b) Any minerals, waste or County
  Council development planning application where there is disturbance to the ground that could affect
  the water table and the movement of water (under and around the site) or involves the use of materials
  and processes that could result in the pollution of the water environment.
must-include:
- item: A hydrology/hydrogeology assessment
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 19. The list calls this a 'Hydrology/Hydrogeology
  Assessment'. Ground disturbance that could affect the water table or the movement of water, or materials
  and processes that could pollute the water environment, are judgements, so they show as discretionary.
  Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should
  be provided where relevant to the planning application' and that the planning officer decides what is
  needed to validate.
review-status: unverified
field-status: {}
