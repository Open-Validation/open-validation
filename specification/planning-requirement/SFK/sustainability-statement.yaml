reference: sustainability-statement
local-authority: SFK
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: All minerals, waste and County Council development planning applications.
must-include:
- item: Details of any climate change mitigation or adaptation measures included in the proposal
  level: must
- item: Details of energy feedstock capacity and outputs, opportunities and benefits associated with the
    proposal
  level: must
- item: Assessment of the potential impacts on water resources and water efficiency
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 11. The list calls this a 'Climate Change Statement'.
  The list covers only the applications the county council decides (minerals, waste and the council's
  own Regulation 3 development), so 'all applications' is shown as those application types. Each local
  item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should be provided
  where relevant to the planning application' and that the planning officer decides what is needed to
  validate.
