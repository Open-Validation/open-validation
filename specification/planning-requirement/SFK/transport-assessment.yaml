source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application where the traffic
  or person(s) trip is significant in both volume and area of impact. ... Any minerals, waste or County
  Council development planning application where there would not be a major impact on the transport network
  but could have an impact at a local level on the immediate transport network.
confidence: medium
notes: From the council's list (published July 2025), page 27-28. The list has a Transport Assessment
  (where trips are significant in volume and area of impact) and a Transport Statement (where there is
  no major impact on the network but there could be a local impact); both are judgements, so they show
  as discretionary. Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local
  requirements 'should be provided where relevant to the planning application' and that the planning officer
  decides what is needed to validate.
