reference: design-and-access-statement
local-authority: SFK
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: In a designated area (world heritage site or conservation area).
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Building or buildings with floorspace of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These are required for major applications, applications for development in a designated area
  (world heritage site or conservation area) where the proposed development consists of a building or
  buildings with floor space of 100 square metres or more and applications for listed building consent.
confidence: medium
notes: 'From the council''s list (published July 2025), page 6. The list''s footnote 5 defines major applications
  as sites over 1 hectare or floorspace over 1,000 sq m, and all minerals and waste development. It also
  says: Applications to amend conditions attached to planning permissions do not need to be accompanied
  by a Design and Access Statement.'
