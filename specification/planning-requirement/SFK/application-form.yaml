reference: application-form
local-authority: SFK
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The national list sets out that any application for planning permission must be accompanied
  by: a) Completed Application Form'
must-include:
- item: 'Ownership certificates and agricultural land declaration: details of the ownership of the site,
    confirming that notice has been served on any other owners (and agricultural tenants)'
  level: must
  source-text: d) Ownership Certificates and Agricultural Land Declaration ... This provides certain details
    about the ownership of the application site and confirms that appropriate notice has been served on
    any other owners (and agricultural tenants).
confidence: medium
notes: From the council's list (published July 2025), page 5-6. The list covers only the applications
  the county council decides (minerals, waste and the council's own Regulation 3 development), so 'all
  applications' is shown as those application types. The application fee is also on the national list
  (see the unmapped list).
