reference: energy-statement
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Buildings proposed with a gross internal floorspace of 1,000 sq m or more.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Site area over 1 hectare.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Site area over 1 hectare.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: 'Any minerals, waste or County Council development planning application where: a) Buildings
  are proposed with a gross internal floorspace of 1,000m2 or more. b) The site area is over 1ha.'
must-include:
- item: How the development would be sustainably constructed in a manner that ensures energy efficiency
  level: must
- item: Measures to improve the efficiency of heating, cooling and lighting, including maximising daylight
    and passive solar gain through the orientation of buildings
  level: must
- item: How sustainable water management measures (e.g. sustainable drainage systems, green roofs, rainwater
    harvesting) have been considered and/or incorporated
  level: must
- item: How construction waste will be minimised, including designing out waste, selecting sustainable
    and efficient materials and reusing materials where possible
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 13. Each local item is headed 'Mandatory for';
  the list's paragraph 13 adds that local requirements 'should be provided where relevant to the planning
  application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
