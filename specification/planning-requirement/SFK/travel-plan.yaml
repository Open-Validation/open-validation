reference: travel-plan
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: County Council development planning applications that are likely to generate significant
  traffic and/or pedestrian movements.
must-include:
- item: A benchmark analysis of existing vehicle and pedestrian movements
  level: must
- item: Forecast level of trips by all modes of transport likely to be associated with the development
  level: must
- item: Proposals to enhance the use of existing or new sustainable transport routes and methods to the
    site
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 28. Only the county council's own development;
  whether it is likely to generate significant traffic or pedestrian movements is a judgement, so it shows
  as discretionary. Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local
  requirements 'should be provided where relevant to the planning application' and that the planning officer
  decides what is needed to validate.
review-status: unverified
field-status: {}
