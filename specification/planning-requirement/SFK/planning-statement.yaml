confidence: medium
notes: 'From the council''s list (published July 2025), page 23-24. The list has three items: ''Planning
  Statement (all developments)'' for full applications, variations of conditions, listed building consent
  and non-material amendments, and ''Planning Statement (minerals)'' and ''(waste)'', which add to it
  for full applications, variations of conditions and non-material amendments. Full applications are shown
  as the county council''s minerals, waste and Regulation 3 types; the minerals and waste items apply
  to variations and amendments of those permissions. Each local item is headed ''Mandatory for''; the
  list''s paragraph 13 adds that local requirements ''should be provided where relevant to the planning
  application'' and that the planning officer decides what is needed to validate.'
