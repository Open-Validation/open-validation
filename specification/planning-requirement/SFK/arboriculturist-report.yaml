reference: arboriculturist-report
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedgerows are proposed to be lost or could be affected by the development.
    - site:
        in:
        - tree-preservation-zone
        description: A tree preservation order within the site boundary.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: trees or hedgerows are proposed to be lost or have the potential to be affected by the development
must-include:
- item: An Arboricultural Method Statement, if an impact is identified
  level: must
  source-text: If an impact is identified, an Arboricultural Method statement will be required.
confidence: medium
notes: 'Audit (wrong_app_type): the list covers only minerals, waste and County Council (Regulation 3)
  development, not Full planning. Audit (wrong_trigger): the workbook quoted the consequence, not the
  trigger (trees or hedgerows lost or affected, or a TPO within the site).'
review-status: unverified
field-status: {}
