reference: arboriculturist-report
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are proposed to be lost or could be affected by the development, including
          through construction.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedgerows are proposed to be lost or could be affected by the development, including
          through construction.
    - site:
        in:
        - tree-preservation-zone
        description: A tree preservation order (TPO) within the application site boundary.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: 'Any minerals, waste or County Council development planning application where: a) trees or
  hedgerows are proposed to be lost or have the potential to be affected by the development, including
  through construction. b) There is a tree preservation order (TPO) within the application site boundary.'
must-include:
- item: An Arboricultural Impact Assessment setting out the development's impact on trees and hedgerows
  level: must
- item: Where an impact is identified, an Arboricultural Method Statement
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 10. Each local item is headed 'Mandatory for';
  the list's paragraph 13 adds that local requirements 'should be provided where relevant to the planning
  application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
