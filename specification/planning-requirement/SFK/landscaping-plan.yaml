reference: landscaping-plan
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: building-works
        value: true
        description: Built infrastructure is constructed, altered or extended.
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development requires biodiversity net gain (is not exempt).
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application which involved the
  construction, alteration or extension of built infrastructure. ... Any minerals, waste or County Council
  development planning application which requires biodiversity net gain (BNG) (e.g. it is not exempt from
  BNG).
must-include:
- item: 'Hard landscaping plan: drawings that clearly show the appearance and materials of any hard landscaping
    works'
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: Built infrastructure is constructed, altered or extended.
- item: 'Hard landscaping plan: existing and proposed materials'
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: Built infrastructure is constructed, altered or extended.
- item: 'Soft landscaping plan: schedule of proposed planting of trees, hedges, shrubs and grass'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development requires biodiversity net gain.
- item: 'Soft landscaping plan: details of any existing features to be retained'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development requires biodiversity net gain.
- item: 'Soft landscaping plan: boundary treatments'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development requires biodiversity net gain.
- item: 'Soft landscaping plan: planting specifications'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development requires biodiversity net gain.
- item: 'Soft landscaping plan: tree pit details where proposed in hard landscaping'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development requires biodiversity net gain.
- item: 'Soft landscaping plan: an appropriate scale'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development requires biodiversity net gain.
- item: Scale bar
  level: must
- item: The direction of north
  level: must
- item: A key
  level: must
- item: Dimensions in metres
  level: must
- item: A unique reference number, including revisions
  level: must
- item: The date the plan was drawn or amended
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 17, 26. The list has a separate 'Hard Landscaping
  Plan' (where built infrastructure is constructed, altered or extended) and 'Soft Landscaping Plan' (where
  the development is not exempt from biodiversity net gain); both are shown here, the parts quoted in
  that order. Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements
  'should be provided where relevant to the planning application' and that the planning officer decides
  what is needed to validate.
review-status: unverified
field-status: {}
