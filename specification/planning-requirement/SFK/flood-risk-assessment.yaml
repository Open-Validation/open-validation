reference: flood-risk-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: The site is over 1 hectare (in Flood Zone 1).
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 square metres or more of new floorspace.
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: near-watercourse
        value: true
        description: The site is within or adjacent to a floodplain or main river.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
confidence: medium
notes: From the audit (missing_requirement).
review-status: unverified
field-status: {}
