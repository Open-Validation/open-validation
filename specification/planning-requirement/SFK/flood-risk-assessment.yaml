reference: flood-risk-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Greater than 1 hectare (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Greater than 1 hectare (Flood Zone 1).
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: New floorspace of 1,000 sq m or more.
    - site:
        in:
        - flood-risk-zone
        description: Located in Flood Zone 2 or 3.
    - condition:
        field: near-watercourse
        value: true
        description: Within a floodplain or adjacent to a main river.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application which is greater than
  1 hectare and located in Flood Zone 1. b) Any minerals, waste or County Council development planning
  application where the new floorspace provided is 1,000sqm or more. c) Any minerals, waste or County
  Council development planning application located in Flood Zone 2 or 3. d) Any minerals, waste or County
  Council development application within a floodplain or adjacent to a main river.
must-include:
- item: The flood risk to, and resulting from, the development
  level: must
- item: The safety of the development for its lifetime
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 16. Each local item is headed 'Mandatory for';
  the list's paragraph 13 adds that local requirements 'should be provided where relevant to the planning
  application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
