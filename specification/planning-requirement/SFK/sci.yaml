notes: From the council's list (published July 2025), page 26. The list covers only the applications the
  county council decides (minerals, waste and the council's own Regulation 3 development), so 'all applications'
  is shown as those application types. Each local item is headed 'Mandatory for'; the list's paragraph
  13 adds that local requirements 'should be provided where relevant to the planning application' and
  that the planning officer decides what is needed to validate.
