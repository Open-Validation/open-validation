reference: air-quality-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Within an existing air quality management area (AQMA).
    - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: 'Any minerals, waste or County Council development planning application where: a) It has
  potential to cause significant levels of air pollution. b) It is within or close to an existing air
  quality management area (AQMA). c) The development could result in a designation of an AQMA.'
must-include:
- item: A description of baseline conditions and how these would change
  level: must
- item: Identification of relevant receptors
  level: must
- item: The assessment methodology
  level: must
- item: The basis for assessing impact and determining the significance of the impact
  level: must
- item: Construction and operational impacts
  level: must
- item: Mitigation measures
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 9. Being close to an AQMA, a potential to cause
  significant air pollution, or a risk of an AQMA being designated are judgements, so they show as discretionary.
  Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should
  be provided where relevant to the planning application' and that the planning officer decides what is
  needed to validate.
review-status: unverified
field-status: {}
