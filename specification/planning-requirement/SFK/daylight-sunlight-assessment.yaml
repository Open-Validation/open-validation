reference: daylight-sunlight-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council planning application that has the potential to adversely
  affect current levels of daylight/sunlight enjoyed by adjoining properties or buildings, including gardens
  or amenity space.
must-include:
- item: Existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties
  level: must
- item: Measures to mitigate the expected impact of the development
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 13. Whether a proposal could adversely affect
  daylight or sunlight is a judgement, so it shows as discretionary. Each local item is headed 'Mandatory
  for'; the list's paragraph 13 adds that local requirements 'should be provided where relevant to the
  planning application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
