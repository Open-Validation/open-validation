reference: sustainable-drainage-strategy
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: New floorspace of 1,000 sq m or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application which is considered
  a major development. b) Any minerals, waste or County Council development planning application where
  the new floorspace provided is 1,000sqm or more or the site is 1ha or more.
must-include:
- item: Flood Risk Assessment
  level: must
- item: Drainage strategy or statement including evidence to support the discharge method in accordance
    with the drainage hierarchy
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 27. The list's footnote 5 treats all minerals
  and waste development as major, so in practice every minerals and waste application needs one. Each
  local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should be
  provided where relevant to the planning application' and that the planning officer decides what is needed
  to validate.
review-status: unverified
field-status: {}
