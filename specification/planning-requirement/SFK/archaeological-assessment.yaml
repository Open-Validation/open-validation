reference: archaeological-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - historic-environment-record
        description: Within or in the vicinity of a site of archaeological significance identified on
          the Suffolk Historic Environment Record.
    - discretionary
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: 'Any minerals, waste or County Council development planning applications where: a) The proposed
  development site has known archaeological potential or that have potential to contain heritage assets
  with archaeological interest. b) Areas of known or suspected archaeological importance are within or
  the vicinity of site of archaeological significance as identified on the Suffolk Historic Environment
  Record. c) Are in areas of known high archaeological potential, such as river valleys, historic settlement
  cores, and in the vicinity of Scheduled Monuments.'
must-include:
- item: A desk-based assessment
  level: must
- item: Fieldwork such as geophysical surveys and trial trench evaluation
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 12. Known archaeological potential and areas
  of high archaeological potential (river valleys, historic settlement cores, the vicinity of Scheduled
  Monuments) are judgements, so they show as discretionary. Each local item is headed 'Mandatory for';
  the list's paragraph 13 adds that local requirements 'should be provided where relevant to the planning
  application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
