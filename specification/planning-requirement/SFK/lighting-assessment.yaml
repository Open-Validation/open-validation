reference: lighting-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: The proposed development includes lighting.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning applications where the proposed
  development includes lighting.
must-include:
- item: Existing light levels lux plan
  level: must
- item: Proposed light levels lux plan, including outside the development boundary
  level: must
- item: Layout plan
  level: must
- item: Manufacturers' specifications and equipment design
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 20. Each local item is headed 'Mandatory for';
  the list's paragraph 13 adds that local requirements 'should be provided where relevant to the planning
  application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
