reference: location-plan
local-authority: SFK
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All minerals, waste or County Council development planning applications.
must-include:
- item: Based on an up-to-date map
  level: should
- item: Scale of 1:1250 or 1:2500, scaled wherever possible to fit onto A4 or A3 paper
  level: must
- item: Application site edged with a red line, including all land needed to carry out the development
    (e.g. access from the site to the public highway, visibility splays, landscaping)
  level: must
- item: A blue line around any other land owned or controlled by the applicant, close to or adjoining
    the site
  level: must
- item: At least 2 named roads where possible
  level: must
- item: Surrounding buildings or landmarks, so the site can be clearly identified
  level: must
- item: Scale bar
  level: must
- item: The direction of north
  level: must
- item: A key
  level: must
- item: Dimensions in metres
  level: must
- item: A unique reference number, including revisions
  level: must
- item: The date the plan was drawn or amended
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 5, 25. The list covers only the applications
  the county council decides (minerals, waste and the council's own Regulation 3 development), so 'all
  applications' is shown as those application types. The local 'Site Location Plan' item (page 25) adds
  to the national list's location plan rules (page 5), which say the plan 'should' be based on an up-to-date
  map.
review-status: unverified
field-status: {}
