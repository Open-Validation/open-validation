reference: roof-plan-existing
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: building-works
      value: true
      description: Built infrastructure is constructed, altered or extended.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning application which involved the
  construction, alteration or extension of built infrastructure.
must-include:
- item: Scale of 1:50 or 1:100
  level: must
- item: Drawings that clearly show the appearance of any existing building and the proposed works
  level: must
- item: The shape of the roof, with details of materials, vents, solar panels etc.
  level: must
- item: Existing and proposed materials
  level: must
- item: Scale bar
  level: must
- item: The direction of north
  level: must
- item: A key
  level: must
- item: Dimensions in metres
  level: must
- item: A unique reference number, including revisions
  level: must
- item: The date the plan was drawn or amended
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 15. Each local item is headed 'Mandatory for';
  the list's paragraph 13 adds that local requirements 'should be provided where relevant to the planning
  application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
