reference: land-contamination-assessment
local-authority: SFK
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - site:
      in:
      - contaminated-land
      description: Known or suspected contamination, as identified by the District Council or Environment
        Agency.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any minerals, waste or County Council development planning applications where there is known,
  or suspected contamination as identified by the District Council or Environment Agency.
must-include:
- item: A Phase 1 preliminary risk assessment where contamination is suspected
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 11. The list says further investigations may
  be required depending on the results of the Phase 1 assessment. Each local item is headed 'Mandatory
  for'; the list's paragraph 13 adds that local requirements 'should be provided where relevant to the
  planning application' and that the planning officer decides what is needed to validate.
review-status: unverified
field-status: {}
