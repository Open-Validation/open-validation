reference: site-restoration
local-authority: SFK
required-if:
  all:
  - any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: temporary-development
          value: true
          description: A temporary waste facility.
  - condition:
      field: ground-disturbance
      value: true
      description: The development involves disturbance to the ground.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: Any application for minerals extraction or temporary waste facility that involves the disturbance
  to ground, except for applications which have no impact on the final restoration/aftercare of the site.
must-include:
- item: A restoration strategy including total volume and type of fill material required
  level: must
- item: Existing and proposed ground levels and gradients, including pre and post settlement contours
    referencing AOD
  level: must
- item: Details of long-term management, in line with the habitat monitoring management plan (if applicable)
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 8. The list calls this an 'Aftercare Plan'.
  Applications which have no impact on the final restoration or aftercare of the site are excepted. Each
  local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should be
  provided where relevant to the planning application' and that the planning officer decides what is needed
  to validate.
review-status: unverified
field-status: {}
