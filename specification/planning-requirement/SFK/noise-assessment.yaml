reference: noise-assessment
local-authority: SFK
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: An industrial process.
      - condition:
          field: plant-equipment
          value: true
          description: Equipment that can generate significant levels of noise, e.g. air source heat pumps,
            ventilation and refrigeration.
source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
source-text: 'Any minerals, waste or County Council development planning applications that: a) Are for
  an industrial process such as waste management or minerals extraction. b) Proposals include equipment
  that can generate significant levels of noise e.g. air source heat pumps, ventilation and refrigeration.'
must-include:
- item: A noise assessment in accordance with the relevant British Standard
  level: must
confidence: medium
notes: From the council's list (published July 2025), page 21. The list names waste management and minerals
  extraction as industrial processes, so minerals and waste applications are shown as always needing one.
  Each local item is headed 'Mandatory for'; the list's paragraph 13 adds that local requirements 'should
  be provided where relevant to the planning application' and that the planning officer decides what is
  needed to validate.
review-status: unverified
field-status: {}
