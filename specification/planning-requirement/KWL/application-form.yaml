reference: application-form
local-authority: KWL
required-if:
  always: true
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The information detailed below is required for every planning application.
must-include:
- item: The council's relevant application form(s), signed and dated with all relevant sections completed
  level: must
- item: The correct ownership certificate
  level: must
- item: A copy of the appropriate notices where Certificate B, C or D is completed
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate B, C or D is completed.
- item: The Agricultural Land Declaration
  level: must
- item: 'Flexible uses: a clear description of the development on the form'
  level: must
  required-if:
    condition:
      field: multiple-uses
      value: true
      description: The application proposes 'flexible uses' (a building used for a variety of purposes).
confidence: medium
notes: From the council's list (adopted July 2025), page 7.
review-status: unverified
field-status: {}
