reference: heritage-statement
local-authority: KWL
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - scheduled-monument
    - park-and-garden
    - battlefield
    - world-heritage-site
    description: Affects, or has the potential to affect, Designated Heritage Assets or their settings.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policy CS20
source-text: Development proposals on sites which affect or are considered to have the potential to affect
  Designated Heritage Assets or their settings.
must-include:
- item: The results of a check of the Historic Environment Record
  level: must
- item: Identification of relevant heritage assets and any designations
  level: should
- item: Schedule of works to the heritage asset(s)
  level: should
- item: Assessment of the heritage significance of the site or building(s)
  level: should
- item: Design principles of and justification for the works
  level: should
- item: The impact of the works on the significance of the asset(s), their features and setting, and adjacent
    assets' setting
  level: should
confidence: medium
notes: From the council's list (adopted July 2025), page 37-40. Heritage Impact Assessment; may be included
  in the Design and Access Statement.
review-status: unverified
field-status: {}
