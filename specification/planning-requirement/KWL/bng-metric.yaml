reference: bng-metric
local-authority: KWL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Planning permission, if granted, would be subject to the biodiversity gain condition
      (not exempt).
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS2, CS8; Environment Act 2021
source-text: 'All applications with the exception of: • Variations of existing planning permissions approved
  prior to 12 February 2024 • Developments below the threshold that does not impact a priority habitat
  and impacts less than 25sqm of onsite habitat or 5m of onsite linear habitat • Householder applications
  • Self and custom build applications consisting of no more than 9 dwellings on sites no larger than
  0.5ha and are exclusively for self or custom houses defined in Section 1(A1) of the Self-build and Custom
  Housebuilding Act 2015 • Applications fulfilling the purpose of a planning condition for another development
  for BNG • Permitted Development • Urgent crown developments • Development forming part of high-speed
  railway network.'
must-include:
- item: Statutory biodiversity metric calculation with both pre-development and post-development baseline
    habitats
  level: must
- item: Statutory biodiversity metric condition assessment spreadsheets
  level: must
- item: 'Minor applications: a Small Sites Metric completed by a competent person in accordance with BS
    8683:2021'
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor applications.
- item: 'If the Small Sites Metric is used: justification of why the development will not impact priority
    habitats and/or protected sites'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: The Small Sites Metric is used.
confidence: medium
notes: From the council's list (adopted July 2025), page 9, 67-71. The exemptions listed are the statutory
  ones, so the rule is the biodiversity gain condition. The draft biodiversity gain plan, draft habitat
  management and monitoring plan, Biodiversity Monitoring Fee heads of terms and the de minimis statement
  are in the unmapped list.
review-status: unverified
field-status: {}
