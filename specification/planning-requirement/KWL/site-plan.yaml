reference: site-plan
local-authority: KWL
required-if:
  always: true
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In most planning applications applicants are required to submit existing and proposed plans
  that show the site plan, floorplans, elevations and roof plans.
must-include:
- item: At an appropriate scale (including a scale bar), accurately to scale, showing the proposed works
    in relation to what is already there
  level: must
- item: Details of the existing building(s) and the proposed development; buildings or walls to be demolished
    clearly shown
  level: must
- item: Clearly identifies the extent of the works applied for
  level: must
- item: 'Flexible uses: layout plans (and if relevant elevations) for each use applied for'
  level: must
  required-if:
    condition:
      field: multiple-uses
      value: true
      description: The application proposes 'flexible uses'.
- item: A clearly marked north point
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 8. The list treats the site plan, with the location
  plan, as needed for every application ('In addition to the location plan and site plan, other plans
  must be submitted...').
review-status: unverified
field-status: {}
