reference: location-plan
local-authority: KWL
required-if:
  always: true
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The information detailed below is required for every planning application.
must-include:
- item: On an up-to-date Ordnance Survey map at a scale of 1:1250 or 1:2500
  level: must
- item: Clearly titled with a unique reference number
  level: should
- item: Where possible, at least two named roads, nearby land and properties
  level: should
- item: Application site edged clearly with a solid red line
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: must
- item: A clearly marked north point
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 8.
review-status: unverified
