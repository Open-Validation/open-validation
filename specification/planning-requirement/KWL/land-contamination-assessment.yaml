reference: land-contamination-assessment
local-authority: KWL
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Known or suspected to be affected by land contamination.
  - condition:
      field: industrial-site
      value: true
      description: Previously used for industrial purposes.
  - site:
      in:
      - near-landfill-site
      description: On or within 250 m of a landfill site.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development vulnerable to contamination (e.g. housing, schools, preschool nurseries).
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: saved Knowsley Replacement UDP policy ENV5
source-text: Where the development site is known or suspected to be affected by land contamination (e.g.
  has previously been used for industrial purposes or is on or within 250m of landfill site) and/ or all
  developments vulnerable to the effects of contamination (for example, residential housing, schools and
  preschool nurseries).
must-include:
- item: 'Undertaken by a suitably qualified person: likelihood, nature and risk of contamination and further
    measures needed'
  level: must
- item: As a minimum, a desk top study and site walk-over report
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 40. Land Contamination Desk Study.
review-status: unverified
field-status: {}
