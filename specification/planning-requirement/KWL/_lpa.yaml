  status: current
submission-standards:
- item: Documents produced electronically in PDF format
  level: should
- item: Plan scale and paper size no larger than needed to illustrate the proposals
  level: should
- item: All plans at an appropriate scale, including a scale bar, clearly showing the proposed works in
    relation to what is already there; plans not accurately to scale make the application invalid
  level: must
- item: Any location plan or site plan includes a clearly marked north point
  level: must
- item: 'Flexible-use applications: consistent documents, with technical documents (e.g. transport, air
    quality, noise) analysing each use applied for'
  level: must
- item: Hard copies posted to the council; applications handed to officers are not accepted
  level: must
