reference: town-centre-impact-assessment
local-authority: KWL
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or other main town centre uses outside town, district or local centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 sq m gross floorspace.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS4, CS6
source-text: Any retail and other main town centre uses (as defined in Appendix A of the Knowsley Local
  Plan Core Strategy) located outside of town, district or local centres over 1,000 sq. metres of gross
  floorspace
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
- item: Impact on town, district or local centre vitality and viability, including consumer choice and
    trade
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 47. Retail / Other Main Town Centre Uses Impact
  Assessment.
review-status: unverified
field-status: {}
