reference: affordable-housing-statement
local-authority: KWL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential site of 0.5 ha or more.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS2, CS15; Developer Contributions SPD
source-text: Major applications for new residential development of 15 or more dwellings or of sites 0.5
  ha or more in site area, including specialist and supported accommodation.
must-include:
- item: The number and mix of units of the proposed affordable homes, or how the required provision will
    be dealt with
  level: should
- item: 'If a commuted sum is proposed instead of on-site provision: detailed justification and the proposed
    amount calculated as in the Developer Contributions SPD'
  level: must
  required-if:
    condition:
      field: affordable-housing-commuted-sum
      value: true
      description: A commuted sum is proposed rather than on-site provision.
confidence: medium
notes: From the council's list (adopted July 2025), page 11-13. Includes specialist and supported accommodation.
review-status: unverified
field-status: {}
