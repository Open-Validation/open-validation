reference: viability-assessment
local-authority: KWL
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant proposes it cannot provide the full range of policy requirements (including
        affordable housing) for viability reasons.
  - condition:
      field: enabling-development
      value: true
      description: Enabling development is proposed to secure a key public benefit.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS15, CS27; Developer Contributions SPD
source-text: In instances where an applicant is proposing that they cannot provide the full range of policy
  requirements (including affordable housing), as meeting such requirements would render the proposal
  not economically viable. Or where enabling development is proposed that would not normally be approved,
  except for the fact that it would secure a key public benefit.
must-include:
- item: 'Enabling development: demonstration that it is required and necessary and the public benefit
    would not come forward without it'
  level: must
  required-if:
    condition:
      field: enabling-development
      value: true
      description: Enabling development is proposed.
confidence: medium
notes: From the council's list (adopted July 2025), page 58.
review-status: unverified
field-status: {}
