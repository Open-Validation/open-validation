reference: biodiversity-survey-report
local-authority: KWL
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      description: On or adjacent to designated nature conservation sites (including Local Wildlife Sites).
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Disturbance of wildlife habitats, including semi-natural open space.
  - condition:
      field: potential-roost-features
      value: true
      description: Buildings with bat roost potential.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS2, CS8
source-text: Any development on or adjacent to designated nature conservation sites (including Local Wildlife
  Sites) or developments which will result in the disturbance of wildlife habitats including semi-natural
  open space and buildings with bat roost potential.
must-include:
- item: Description of the proposal, desk study and field survey (extended Phase 1 habitat survey) and
    detailed species surveys as necessary
  level: must
- item: Evaluation of features, likely impacts, and mitigation, compensation and enhancement measures
    with clear, site-specific, deliverable prescriptions
  level: must
- item: Surveys at an appropriate time of year by suitably qualified ecologists, following published guidance
  level: should
- item: Surveys no more than 12 months old on submission
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 17-20. Preliminary Ecological Appraisal; a separate
  requirement from the BNG metric.
review-status: unverified
field-status: {}
