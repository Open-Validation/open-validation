reference: planning-statement
local-authority: KWL
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - green-belt
      description: Development within the Green Belt.
  - site:
      in:
      - strategic-allocation
      description: Sustainable Urban Extensions.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Departures from the development plan.
  - all:
    - site:
        in:
        - listed-building
        description: Relating to a Listed Building.
    - discretionary
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: All Knowsley Local Plan Core Strategy policies; all saved Knowsley Replacement UDP policies
source-text: All major applications (including change of use), development within the Green Belt and Sustainable
  Urban Extensions and departures from the development plan or whether the application is only acceptable
  ‘in the planning balance’ relating to any Listed Building.
must-include:
- item: The context and need for the development and an assessment of how it accords with national and
    local planning policies
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 46. Whether a listed building scheme is acceptable
  only 'in the planning balance' is a judgement, so discretionary.
review-status: unverified
field-status: {}
