reference: air-quality-assessment
local-authority: KWL
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: 'Stage 1 criteria: more than 10 residential units.'
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 500
        description: 'Stage 2 criteria: more than 500 AADT (annual average daily traffic) for light duty
          vehicles.'
  - discretionary
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS2, CS7
source-text: 'An air quality assessment may be required if the proposed development would exceed the stage
  1 criteria (more than 10 residential units) and/or stage 2 criteria (more than 500 AADT for light duty
  vehicles) as stated in the document Land-Use Planning & Development Control: Planning for Air Quality.'
must-include:
- item: Undertaken by a suitably qualified person, referring to the transport information it has had regard
    to
  level: must
- item: Data from the last 18 months unless clearly justified
  level: must
- item: 'If the developer considers an assessment is not required: justification'
  level: must
  source-text: If a developer considers that an AQ assessment is not required, then justification must
    be provided
confidence: medium
notes: From the council's list (adopted July 2025), page 13-14. The list says an assessment 'may be required'
  once the EPUK/IAQM criteria are exceeded, so it is discretionary within those thresholds.
review-status: unverified
field-status: {}
