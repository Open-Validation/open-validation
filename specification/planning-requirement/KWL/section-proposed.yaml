reference: section-proposed
local-authority: KWL
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels, or a sloping site.
  - condition:
      field: adjacent-ground-level-change
      value: true
      description: The site is at a different ground level to adjacent existing development.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policy CS19
source-text: Where a proposal involves a change in ground levels, is on a sloping site or the site is
  at a different ground level to adjacent existing development.
must-include:
- item: Existing and proposed site levels, including those to adjacent neighbours (for all new housing
    developments)
  level: must
- item: Spot levels, cross sections and a cut and fill plan
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 42. 'Levels survey information and cross sections'.
review-status: unverified
field-status: {}
