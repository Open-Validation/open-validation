reference: construction-management-plan
local-authority: KWL
required-if:
  all:
  - ref: major-development
  - condition:
      field: industrial-site
      value: false
      description: Not in an industrial estate.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS1, CS2, CS19
source-text: All applications for Major Development which are not in an industrial estate.
must-include:
- item: A CEMP Proforma
  level: must
- item: Dust control and suppression methods
  level: must
- item: Mitigation of noise and vibration from works and from any overnight temporary power generation
    or pumping plant
  level: must
- item: Control of mud leaving the site, with wheel washing location and type
  level: must
- item: Areas for storage of plant and materials; location of the site compound
  level: must
- item: Programme of works including phasing, deliveries and haul routes, traffic control, parking and
    temporary traffic management
  level: must
- item: Construction staff parking and construction working times
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 64-65. Construction Environmental Management
  Plan.
review-status: unverified
field-status: {}
