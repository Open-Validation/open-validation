reference: photos
local-authority: KWL
required-if:
  any:
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of an existing building.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  - site:
      in:
      - conservation-area
      description: Development affecting a Conservation Area.
  - site:
      in:
      - listed-building
      description: A Listed Building (including internal works).
  - all:
    - ref: major-development
    - site:
        in:
        - green-belt
        description: In the Green Belt.
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS2, CS19, CS20; saved Knowsley Replacement UDP policy
  DQ5
source-text: Where the proposal involves the demolition of an existing building in or development affecting
  a Conservation Area; a Listed Building (including internal works to a Listed Building) and all major
  developments in the Green Belt.
must-include:
- item: Photomontages at different times of year, with trees in leaf and bare
  level: should
- item: Photos of the heritage asset in its setting
  level: should
- item: 'Green Belt: coverage of the visual impact on openness'
  level: should
  required-if:
    all:
    - ref: major-development
    - site:
        in:
        - green-belt
        description: In the Green Belt.
- item: 'Works to protected trees: digital photographs of the existing tree(s)'
  level: should
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  source-text: Digital photographs of the existing tree(s) should be provided.
confidence: medium
notes: From the council's list (adopted July 2025), page 46, 60. 'Photographs & photomontages', plus the
  photographs asked for with works to protected trees (page 60).
review-status: unverified
field-status: {}
