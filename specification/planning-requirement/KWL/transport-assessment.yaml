reference: transport-assessment
local-authority: KWL
required-if: discretionary
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policy CS7; saved Knowsley Replacement UDP policy T8; Ensuring
  a Choice of Travel SPD
source-text: • Major traffic generating development proposals (as defined in table 8.1 of the Knowsley
  Replacement UDP) • Proposals which either by themselves or cumulatively with development of which the
  application is part of, is likely to cause significant harm as a result of existing road capacity or
  safety problems in the area • Proposals that are likely to significantly increase pollution and/ or
  noise as a result of traffic generation; or cause pollution levels in Air Quality Management Areas to
  exceed guideline levels • Proposals that would generate a material increase in traffic entering or using
  any motorways, trunk roads or other primary routes; and • Proposals that would impact on the bus network
must-include:
- item: All existing and proposed commercial and residential vehicular and pedestrian movements to and
    from the site
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking
  level: must
- item: Existing transport conditions, how the development would affect them, and measures to overcome
    problems including highway improvements
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 53-55. The thresholds for 'major traffic generating
  development' are in table 8.1 of the Replacement UDP, not in the list, and the other triggers are judgements
  ('significant', 'material'), so discretionary.
