reference: flood-risk-assessment
local-authority: KWL
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 1.
    - any:
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 1
            description: Site of 1 hectare or greater.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 1
            description: Site of 1 hectare or greater.
      - site:
          in:
          - critical-drainage-area
          description: Site under 1 hectare with critical drainage problems.
      - all:
        - condition:
            field: more-vulnerable-use-change
            value: true
            description: Site under 1 hectare with a change of use to a more vulnerable class (e.g. commercial
              to residential).
        - site:
            in:
            - surface-water-flood-risk
            description: Can be affected by flooding other than rivers and sea (e.g. surface water, drains
              or reservoirs).
  - site:
      in:
      - flood-risk-zone
      description: 'In Flood Zones 2 and 3: all new development, including minor developments and change
        of use.'
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: 'Knowsley Local Plan Core Strategy policy CS24; NPPF and Planning Practice Guidance: Flood Risk
  and Coastal Change'
source-text: 'Site Specific Flood Risk Assessment (FRA): In Flood Zone 1 when: - The site is 1 hectare
  or greater - The site is less than 1 hectare but has critical drainage problems - The site is less than
  1 hectare and includes the change of use of development type to a more vulnerable class (for example
  commercial to residential); where they can be affected by sources of flooding other than rivers and
  sea (e.g. surface water, drains or reservoirs). In Flood Zones 2 and 3 for all new development, including
  minor developments and change of use.'
confidence: medium
notes: From the council's list (adopted July 2025), page 23-29.
review-status: unverified
field-status: {}
