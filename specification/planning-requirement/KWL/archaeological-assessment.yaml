reference: archaeological-assessment
local-authority: KWL
required-if:
  site:
    in:
    - scheduled-monument
    - historic-environment-record
    description: On or adjacent to a heritage asset with archaeological interest (known, e.g. on the Historic
      Environment Record).
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policies CS2, CS20
source-text: Applications for development known to be on or adjacent to a heritage asset with archaeological
  interest.
must-include:
- item: 'A desk-based assessment and, where appropriate, a field evaluation by a suitably qualified person:
    nature, extent and significance of the archaeology and the impact on it'
  level: must
- item: 'Where remains are identified: how the design enables preservation in situ, or proposed excavation,
    recording, analysis and reporting'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted July 2025), page 14-16.
review-status: unverified
field-status: {}
