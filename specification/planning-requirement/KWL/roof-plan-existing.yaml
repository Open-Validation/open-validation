reference: roof-plan-existing
local-authority: KWL
required-if: discretionary
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In addition to the location plan and site plan, other plans must be submitted (dependent
  on the type of application and development proposed) to explain the proposal in detail.
must-include:
- item: At an appropriate scale (including a scale bar), accurately to scale, showing the proposed works
    in relation to what is already there
  level: must
- item: Details of the existing building(s) and the proposed development; buildings or walls to be demolished
    clearly shown
  level: must
- item: Clearly identifies the extent of the works applied for
  level: must
- item: 'Flexible uses: layout plans (and if relevant elevations) for each use applied for'
  level: must
  required-if:
    condition:
      field: multiple-uses
      value: true
      description: The application proposes 'flexible uses'.
confidence: medium
notes: From the council's list (adopted July 2025), page 8. The list says these are needed 'in most planning
  applications', 'dependent on the type of application and development proposed', without a test, so discretionary.
review-status: unverified
field-status: {}
