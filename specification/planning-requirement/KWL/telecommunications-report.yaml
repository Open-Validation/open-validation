reference: telecommunications-report
local-authority: KWL
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications equipment and mobile phone masts.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: saved Knowsley Replacement UDP policy ENV8
source-text: For all full planning applications for all telecommunications equipment and mobile phone
  masts
must-include:
- item: A statement that the proposal, when operational, will meet the ICNIRP guidelines
  level: must
- item: 'New base stations on non-established sites: a list of alternative sites considered'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new base station on a non-established telecoms site.
- item: 'Masts within 3 km of Liverpool John Lennon Airport: evidence of notification of the Civil Aviation
    Authority, the Secretary of State for Defence or the aerodrome operator'
  level: must
  required-if:
    condition:
      field: near-aerodrome
      value: true
      description: Within 3 km of Liverpool John Lennon Airport.
confidence: medium
notes: From the council's list (adopted July 2025), page 51-53.
review-status: unverified
field-status: {}
