reference: lighting-assessment
local-authority: KWL
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting.
    - condition:
        field: protected-species
        value: true
        description: The Preliminary Ecological Appraisal shows lighting may affect bat roosts or flight
          paths.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
must-include:
- item: Light pollution assessment
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): External Lighting / Floodlighting with a light pollution
  assessment - floodlighting schemes, or where a PEA shows lighting may affect bat roosts or flight paths.'
review-status: unverified
field-status: {}
