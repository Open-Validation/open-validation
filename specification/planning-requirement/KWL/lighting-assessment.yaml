reference: lighting-assessment
local-authority: KWL
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Schemes involving the provision of floodlighting.
  - condition:
      field: external-lighting
      value: true
      description: Lighting that a Preliminary Ecological Appraisal has identified may affect bat roosts
        or flight paths.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policy CS19; saved Knowsley Replacement UDP policy ENV3
source-text: Schemes involving the provision of floodlighting or where a Preliminary Ecological Appraisal
  has identified that lighting may affect bat roosts or flight paths.
must-include:
- item: Details of the floodlighting scheme
  level: must
- item: Light spillage shown on a site plan with lux levels at the boundary with neighbouring properties
  level: must
- item: Hours of illumination, light levels, column heights, specification and colour, treatment of lamps
    and luminaires
  level: must
- item: Impact on nearby dwellings and highways and mitigation (e.g. demountable columns, screening vegetation,
    planting and bunding)
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 21-23.
review-status: unverified
field-status: {}
