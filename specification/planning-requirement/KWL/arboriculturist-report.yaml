reference: arboriculturist-report
local-authority: KWL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or adjacent to the site.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or adjacent to the site.
    - site:
        in:
        - conservation-area
        - tree-preservation-zone
        description: Within a Conservation Area or in the vicinity of trees subject to a Tree Preservation
          Order.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Trees and New Development SPD; BS 5837:2012
source-text: All planning applications where there are trees either on or adjacent to the site (excluding
  householder developments not within a Conservation Area or in the vicinity of trees subject to a Tree
  Preservation Order)
must-include:
- item: A report/drawing in full accordance with BS 5837:2012
  level: must
- item: The number of trees impacted, their category and health
  level: must
confidence: medium
notes: From the council's list (adopted July 2025), page 57-58. Tree survey / arboricultural statement.
review-status: unverified
field-status: {}
