reference: noise-assessment
local-authority: KWL
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Development that would generate significant levels of noise or vibration.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use in proximity to a known noise source.
  - condition:
      field: engineering-operations
      value: true
      description: Development close to existing buildings where piling will be required.
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Knowsley Local Plan Core Strategy policy CS19; saved Knowsley Replacement UDP policy ENV2
source-text: Instances where the development would generate significant levels of noise or vibration,
  or it proposes a noise-sensitive use in proximity to a known noise source. A Vibration Assessment will
  be required for development close to existing buildings were piling will be required for their construction.
must-include:
- item: 'By a suitably qualified person: background noise climate, the noise source, the impact and mitigation'
  level: must
- item: Vibration assessment where piling is required close to existing buildings
  level: must
  required-if:
    condition:
      field: engineering-operations
      value: true
      description: Piling close to existing buildings.
confidence: medium
notes: From the council's list (adopted July 2025), page 42-43.
review-status: unverified
field-status: {}
