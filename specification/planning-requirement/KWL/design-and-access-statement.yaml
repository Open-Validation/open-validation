reference: design-and-access-statement
local-authority: KWL
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9
source-text: 'Design & Access Statements are a national requirement for certain types of development.
  These developments include; • Applications for major development, as defined in article 2 of the Town
  and Country Planning (Development Management Procedure (England) Order 2015; • Applications within a
  Conservation Area, where the proposed development consists of: • one or more dwellings; or • a building
  or buildings with a floor space of 100 square metres or more. • Applications for Listed Building consent.'
confidence: medium
notes: From the council's list (adopted July 2025), page 9.
review-status: unverified
field-status: {}
