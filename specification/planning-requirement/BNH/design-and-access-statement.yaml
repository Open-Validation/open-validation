reference: design-and-access-statement
local-authority: BNH
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - all:
      - site:
          in:
          - conservation-area
          description: The site is in a conservation area.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The floor space created is 100 sq m or more.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal provides one or more dwellings.
source-url: https://www.brighton-hove.gov.uk/planning/planning-applications/checklist-full-planning-applications
source-text: design and access statement if in a conservation area and floor space created is 100 sqm
  or more, or for the provision of one or more dwellings
confidence: medium
notes: From the council's list (published by August 2022; the web page is undated), 'Checklist for full
  planning applications', sections 'Single or 2 storey extension', 'Residential or commercial new build',
  'Residential conversion' and 'Commercial conversion'. The list calls it a national requirement.
review-status: unverified
field-status: {}
