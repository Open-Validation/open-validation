reference: cil-form
local-authority: BNH
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: footprint-increase
        value: true
        description: A single or two storey extension.
    - condition:
        field: upper-floor-extension
        value: true
        description: A single or two storey extension at upper floor level.
    - condition:
        field: new-build
        value: true
        description: Residential or commercial new build.
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use or a residential or commercial conversion.
source-url: https://www.brighton-hove.gov.uk/planning/planning-applications/checklist-full-planning-applications
source-text: CIL additional information form
confidence: medium
notes: From the council's list (published by August 2022; the web page is undated), 'Checklist for full
  planning applications', sections 'Single or 2 storey extension', both 'Commercial change of use' sections,
  'Residential or commercial new build', 'Residential conversion' and 'Commercial conversion'. The list
  calls it a local requirement. Not asked for windows and doors, shopfronts or general alterations.
