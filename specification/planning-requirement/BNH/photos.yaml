reference: photos
local-authority: BNH
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - all:
      - condition:
          field: storey-count
          operator: ==
          value: 2
          description: A two-storey extension.
      - condition:
          field: visible-from-highway
          value: true
          description: The extension is visible from a highway.
    - condition:
        field: shopfront
        value: true
        description: The proposal is a new or altered shopfront.
source-url: https://www.brighton-hove.gov.uk/planning/planning-applications/checklist-full-planning-applications
policy: Development Plan QD8, QD10, QD11, QD14, SPD02
source-text: adjoining elevations (photographs) - 2 storey, if visible from a highway; adjoining elevations
  (photographs) plus proposed sections
must-include:
- item: Photographs of the adjoining elevations
  level: must
confidence: medium
notes: From the council's list (published by August 2022; the web page is undated), 'Checklist for full
  planning applications', sections 'Single or 2 storey extension' and 'Shopfronts'.
review-status: unverified
field-status: {}
