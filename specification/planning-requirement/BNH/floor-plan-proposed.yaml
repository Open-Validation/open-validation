reference: floor-plan-proposed
local-authority: BNH
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-works
        value: true
        description: The proposal involves building works (extension, new build, conversion, shopfront
          or general alterations).
    - condition:
        field: involves-change-of-use
        value: true
        description: The proposal is a change of use, with or without alterations.
source-url: https://www.brighton-hove.gov.uk/planning/planning-applications/checklist-full-planning-applications
source-text: existing and proposed floor plans
confidence: medium
notes: From the council's list (published by August 2022; the web page is undated), 'Checklist for full
  planning applications', every section except 'Replacement or alterations to windows and doors'. The
  list calls them a national requirement.
review-status: unverified
field-status: {}
