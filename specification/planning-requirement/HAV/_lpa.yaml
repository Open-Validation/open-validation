  status: outdated
submission-standards:
- item: All text on plans and statements of a reasonable size (point 12) and in a clear font
  level: should
- item: Plans and drawings drawn to an identified scale and, for plans, showing the direction of north;
    a linear scale bar is also useful
  level: must
- item: Plans and drawings carry a unique reference number
  level: should
- item: One hard copy of all information (not originals) unless submitted electronically through the Planning
    Portal
  level: must
- item: A separate copy of any submitted document with signatures and all personal details removed, for
    publication
  level: must
- item: One proposal per application; alternative options cannot be submitted in the same application
  level: must
- item: 'Per-type checklists (listed building, advert, LDC and others): plans and drawings include a scale
    bar of at least 0-10 metres and show the paper size and key dimensions'
  level: should
- item: 'Per-type checklists: online drawings A3 or smaller, as PDF files, showing the print size and
    the scale at that size'
  level: should
- item: 'Per-type checklists: no .cad or .exe files and no zipped files'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot links Havering''s current list (Checklist 004, in use from 12 Sept 2022, revised for
    BNG in 2024). The 2024-03 date is metadata only, and the link covers non-householder applications
    only. The extraction contains many triggers taken from adjacent items (householder FRA and CIL, a
    flood sequential test that is really a retail test) and duplicate rows, and uses outdated outline/RM
    checklists. It misses about 18 Checklist 004 items, including affordable workspace, construction logistics,
    UGF, SCI and the sustainable design statement. Fixed 2026-11-05: every file was rewritten from the
    council''s latest list.'
