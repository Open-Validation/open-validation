reference: arboriculturist-report
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges on the site or on adjacent land that are potentially affected by
          the development or might be important as part of the local landscape character.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: trees
        description: The condition being removed or varied relates to tree retention or provision.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policy G7; Havering Local Plan 2016-2031 policies 27, 29 and 30
source-text: Where there are trees or hedges on the proposed development site or on land adjacent to the
  proposed development site that are potentially affected by the development proposal or might be important
  as part of the local landscape character.
must-include:
- item: Species, spread, height, position and condition of trees
  level: must
- item: Which trees are proposed to be felled
  level: must
- item: Which trees will be affected in any way by the development
  level: must
- item: The measures that will be used to protect retained trees during construction
  level: must
- item: Justification for removal of any protected or important trees
  level: must
- item: In line with BS 5837 and BS 8545, and Trees and Design Action Group and Arboricultural Association
    guidance
  level: must
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 31. Listed as 'Tree Survey/Arboricultural
  Method Statement'. Householder wording from Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001),
  page 14. (same wording). The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it.
review-status: unverified
field-status: {}
