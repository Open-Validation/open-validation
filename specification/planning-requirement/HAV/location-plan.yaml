reference: location-plan
local-authority: HAV
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - s73
    - hedgerow-removal
    - consent-under-tpo
    - notice-trees-in-con-area
    - pa-demo-building
    - pa-ecomms-network
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: Required for all applications
must-include:
- item: Shows the direction of north
  level: should
- item: Has a unique reference number
  level: should
- item: Based on an up-to-date Ordnance Survey map at an identified standard metric scale (typically 1:1250
    or 1:2500 for larger sites)
  level: should
- item: Shows sufficient named roads and/or buildings on land adjoining the application site
  level: should
- item: Application site boundaries and all land necessary to carry out the development (including access
    from the road) outlined in red
  level: should
- item: Any other land owned by the applicant close to or adjacent to the property outlined in blue
  level: should
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 5. Householder wording from Checklist
  001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 4. The other per-type checklists
  (listed building, advert, LDC, S73, reserved matters, hedgerow, tree works, demolition and telecoms
  prior notification) also ask for a location plan at 1:1250 or 1:2500 edged red; the conditions checklist
  (027) says it is optional. The list words every item as 'should'.
review-status: unverified
field-status: {}
