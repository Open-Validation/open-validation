reference: travel-plan
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 residential units or more (referable to the Mayor of London).
    - condition:
        field: building-height
        operator: '>'
        value: 30
        description: Development over 30 metres in height (referable to the Mayor of London).
    - site:
        in:
        - green-belt
        - metropolitan-open-land
        description: Development on Green Belt or Metropolitan Open Land (referable to the Mayor of London).
    - discretionary
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF paragraph 113; London Plan 2021 policy T4; Havering Local Plan 2016-2031 policy 23
source-text: All strategic … development proposals and for proposals likely to have significant transport
  … implications
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), pages 30-31. 'Significant transport
  implications' shows as discretionary; the list's examples are all schools and nurseries, higher and
  further education over 2,500 sq m, major retail and leisure, and stadia over 1,500 seats, and it says
  the need will normally be settled at pre-application stage. 'Strategic' means referable to the Mayor
  of London; the list's footnote names three criteria (150 units or more, over 30 metres high, Green Belt
  or Metropolitan Open Land) and says 'Refer to the order for the full criteria', so the rest of the Mayor
  of London Order 2008 shows as discretionary.
review-status: unverified
field-status: {}
