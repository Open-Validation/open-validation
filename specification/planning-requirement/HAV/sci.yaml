notes: From the council's list (Checklist 004, revised March 2024), page 28. Listed as 'Statement of Community
  Involvement'; it can be part of the Planning Statement. 'Environmentally sensitive sites' and 'known
  or anticipated public interest' show as discretionary. 'Majori' in the quote is the list's footnote
  marker (i) after 'Major', pointing to the standard definition of major development (10+ dwellings or
  0.5 ha; 1,000 sq m or 1 ha).
