reference: application-form
local-authority: HAV
required-if:
  always: true
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: Required for all applications
must-include:
- item: Completed Ownership Certificate (A, B, C or D as applicable), signed and dated
  level: must
- item: Agricultural Land Declaration, signed and dated
  level: must
- item: Where Ownership Certificate B, C or D is completed, the correct notice served on the owner(s)
    and/or published in a local newspaper
  level: must
- item: Data required by the Greater London Authority (London Planning Datahub) data standard
  level: must
- item: 'For outline applications: information about the proposed use or uses and the amount of development
    proposed for each use'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: Information about the proposed use or uses, and the amount of development proposed for
    each use, is necessary to allow consideration of an application for outline planning permission.
- item: 'For outline applications: the area or areas where access points to the development will be situated,
    even if access is a reserved matter'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: An application for outline planning permission must indicate the area or areas where access
    points to the development will be situated, even if access is a reserved matter.
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), pages 3, 7. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 2. Every per-type
  checklist on the council's page asks for the completed form (or, for prior notifications and conditions,
  a written description).
review-status: unverified
field-status: {}
