reference: planning-statement
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Change of use of more than 1000 square metres floorspace.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-hoarding
        value: true
        description: The proposal is for an advertisement hoarding.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF; London Plan 2021; Havering Local Plan 2016-2031
source-text: Required for all majori development proposals (including change of use of more than 1000
  square metres floorspace).
must-include:
- item: The main planning issues/impacts and the mitigation measures incorporated into the proposal
  level: must
- item: How the development accords with the policies of the Local Plan and any Supplementary Planning
    Documents
  level: should
- item: Details of any pre-application consultation carried out
  level: should
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), pages 27-28. Adverts: ''All hoarding
  proposals'' (Checklist 012, https://www.havering.gov.uk/downloads/file/176/checklist-012). ''Majori''
  in the quote is the list''s footnote marker (i) after ''Major'', pointing to the standard definition
  of major development (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).'
review-status: unverified
field-status: {}
