reference: design-and-access-statement
local-authority: HAV
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development within a conservation area or designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floor space created of 100 square metres or more.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
source-text: 'Major Development Development within conservation or designated areas involving: the provision
  of one or more dwelling houses; the provision of building or buildings where the floor space created
  by the development is 100 square metres or more.'
confidence: medium
notes: Checklist 001 (householder) asks for one in a Conservation Area where the proposal comprises more
  than 100 square metres floor space.
review-status: unverified
field-status: {}
