reference: design-and-access-statement
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: Development within a conservation area (the list says 'conservation or designated
              areas').
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: The provision of one or more dwelling houses.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Floor space created by the development is 100 square metres or more.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: Property within a conservation area.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: The proposal comprises more than 100 square metres floor space.
  - application-type:
      in:
      - lbc
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 9 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990; London Plan 2021
  policy D4; Havering Local Plan 2016-2031 paragraph 11.1.6
source-text: 'Required for: Major Developmenti … Development within conservation or designated areas involving:
  o the provision of one or more dwelling houses; o the provision of building or buildings where the floor
  space created by the development is 100 square metres or more.'
must-include:
- item: Level of detail proportionate to the complexity of the application
  level: should
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 4. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 3. Householder:
  ''Properties within a Conservation Area with a proposal which comprises more than 100 square metres
  floor space''. The listed building checklist (011, https://www.havering.gov.uk/downloads/file/163/checklist-011)
  and reserved matters checklist (023, https://www.havering.gov.uk/downloads/file/160/checklist-023.pdf)
  also ask for one. The list repeats the national DMPO contents, which are not copied here. ''Developmenti''
  carries the list''s footnote marker (i) for major development.'
review-status: unverified
field-status: {}
