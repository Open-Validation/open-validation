confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 29. Listed as ''Sustainable
  Design and Construction Statement''. Householder wording from Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001),
  page 14. Householder: ''Required where proposing extensive retrofit works to improve the environmental
  performance of the building''; shown as discretionary because ''extensive'' is a judgement. ''Majori''
  in the quote is the list''s footnote marker (i) after ''Major'', pointing to the standard definition
