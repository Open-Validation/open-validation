reference: recreation-facilities-assessment
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: loss-of-open-space
      value: true
      description: Development involving loss of park land (including greens, recreation grounds and play
        space), sports ground, allotment land or cemetery land.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policy S5; Havering Local Plan 2016-2031 policy 18
source-text: 'Development involving loss of: park land (including greens recreation grounds and play space)
  … sports ground … allotment land … cemetery land.'
must-include:
- item: Details of existing open space in the vicinity of the site
  level: must
- item: Details of any open space lost as a result of the development (in ha)
  level: must
- item: Details of the area of any open space proposed by the development (in ha)
  level: must
- item: Details of the type of open space provided by the development
  level: must
- item: Any necessary mitigation, which may include financial contributions to enhance routes to existing
    open space or improve the space
  level: must
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 26. Listed as 'Open Space Assessment'.
review-status: unverified
field-status: {}
