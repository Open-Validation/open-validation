reference: affordable-housing-statement
local-authority: HAV
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Development with capacity to provide 10 or more homes.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
source-text: Affordable Housing Statement Required for all majori applications. development where there
  is capacity to provide 10 or more homes, or where the site area is greater than London Plan - Policy
  H5 Local Plan – Policy 4 This should provide information about both the market housing and the affordable
  housing provision and should include details of the proposed tenure, unit mix and the design/size/location
  of the proposed on-site affordable housing.
must-include:
- item: Information on both the market housing and the affordable housing provision
  level: should
- item: Proposed tenure, unit mix and the design, size and location of the on-site affordable housing
  level: should
confidence: medium
notes: The council's trigger is cut off at the site-area threshold.
