reference: affordable-housing-statement
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: The site has capacity to provide 10 or more homes.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: The site area is greater than 0.5 hectares.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: residential-units
        description: The removal or variation of the condition would change the number or type of residential
          units on a site with capacity for 10 or more homes or over 0.5 hectares.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policy H5; Havering Local Plan 2016-2031 policy 4
source-text: Required for all majori applications. development where there is capacity to provide 10 or
  more homes, or where the site area is greater than … 0.5 hectares, or if the proposal is likely to require
  the provision of affordable housing
must-include:
- item: Information on both the market housing and the affordable housing provision
  level: must
- item: Proposed tenure, unit mix and the design, size and location of the on-site affordable housing
  level: must
- item: A financial viability assessment if the scheme is below the policy requirement
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The scheme is below the affordable housing policy requirement.
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), pages 12-13. 'If the proposal is likely
  to require the provision of affordable housing' shows as discretionary. The S73 branch comes from Checklist
  025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf), which asks for this only where
  the condition being removed or varied relates to it. 'Majori' in the quote is the list's footnote marker
  (i) after 'Major', pointing to the standard definition of major development (10+ dwellings or 0.5 ha;
  1,000 sq m or 1 ha).
review-status: unverified
field-status: {}
