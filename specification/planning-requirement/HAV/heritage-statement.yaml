reference: heritage-statement
local-authority: HAV
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - park-and-garden
      - scheduled-monument
      - conservation-area
      - archaeological-priority-area
      description: Within the curtilage of a listed building, registered park or scheduled monument, or
        in a conservation area or Archaeological Priority Area.
  - all:
    - ref: major-development
    - site:
        in:
        - conservation-area
        description: Major development within 50m of a conservation area.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
must-include:
- item: The significance of the heritage asset affected, including any contribution made by its setting
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s excerpts listed the contents, which are kept as must-include
  items. From the audit: the trigger is the curtilage of a listed building, park or scheduled monument,
  conservation areas or APAs, or major development within 50m of a conservation area; the LBC checklist
  says ''Heritage Statement Always Required''.'
review-status: unverified
field-status: {}
