reference: heritage-statement
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - listed-building
          - park-and-garden
          - scheduled-monument
          description: New development within the curtilage of a listed building, registered historic
            park or garden, or Scheduled Ancient Monument.
      - all:
        - condition:
            field: involves-change-of-use
            value: false
            description: Not only a change of use.
        - site:
            in:
            - conservation-area
            - archaeological-priority-area
            - listed-building-setting
            - scheduled-monument
            description: New development on land in a Conservation Area or an Archaeological Priority
              Area, or adjoining a Listed Building or Scheduled Ancient Monument.
      - all:
        - ref: major-development
        - condition:
            field: distance-to-conservation-area
            operator: <=
            value: 50
            description: Any part of the site is within 50 metres of the boundary of a Conservation Area.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        - listed-building
        description: The proposal affects a heritage asset, i.e. is in a Conservation Area or involves
          a Listed Building.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: historic-environment
        description: The condition being removed or varied relates to protection of the historic environment
          or archaeology.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF paragraph 194; London Plan 2021 policy HC1; Havering Local Plan 2016-2031 policy 28
source-text: 'Required for: All new development within the curtilage of a listed building, registered
  historic park or gardens, or Scheduled Ancient Monument. All new development (except change of use)
  on land that is in a Conservation Area or an Archaeological Priority Area or adjoins a Listed Building
  or Scheduled Ancient Monument. All majori development where any part of the site is within 50 metres
  of the boundary of a Conservation Area.'
must-include:
- item: The significance of the heritage asset affected, including any contribution made by its setting
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset, including whether it causes
    substantial harm or loss of significance
  level: must
- item: The sources considered and expertise consulted
  level: should
- item: The steps taken to avoid or minimise any adverse impacts on the significance of the asset
  level: should
- item: Detail proportionate to the importance of the asset (for less complex cases it may be a section
    of the Design and Access Statement)
  level: should
- item: 'Where there are major works and/or a number of alterations to a listed building (including repairs):
    a full schedule of the works with a method statement'
  level: must
  required-if:
    all:
    - site:
        in:
        - listed-building
        description: Works to a listed building.
    - discretionary
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 22. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 12. Householder:
  ''Required if proposal affects a heritage asset i.e. is in a Conservation Area or involves a Listed
  Building''. Listed building consent: ''Always Required'' (Checklist 011, https://www.havering.gov.uk/downloads/file/163/checklist-011).
  The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it. ''Majori'' in the
  quote is the list''s footnote marker (i) after ''Major'', pointing to the standard definition of major
  development (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).'
review-status: unverified
field-status: {}
