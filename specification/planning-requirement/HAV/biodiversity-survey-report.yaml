reference: biodiversity-survey-report
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - all:
        - ref: major-development
        - condition:
            field: involves-change-of-use
            value: false
            description: Not only a change of use.
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: Part of, or next to, a site designated for its biodiversity value such as SSSI,
            LNR or SINCs.
      - condition:
          field: protected-species
          value: true
          description: Site with a likelihood of protected and priority species (including species that
            use buildings to roost and nest).
      - site:
          in:
          - priority-habitat
          description: Part of, or next to, important habitats or other biodiversity features.
      - condition:
          field: geodiversity-interest
          value: true
          description: Part of, or next to, features of geological conservation importance.
      - condition:
          field: hedgerows-affected
          value: true
          description: Part of, or next to, a hedgerow.
      - condition:
          field: near-woodland
          value: true
          description: Part of, or next to, woodland.
      - condition:
          field: near-watercourse
          value: true
          description: Part of, or next to, any water course.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: protected-species
          value: true
          description: The proposal may affect wildlife and biodiversity, especially protected or priority
            (BAP) species, including species that use buildings to roost and nest (for example when a
            building is demolished).
      - discretionary
  - application-type:
      in:
      - hedgerow-removal
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: biodiversity
        description: The condition being removed or varied relates to biodiversity mitigation or protection.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Havering Local Plan 2016-2031 policy 30; London Plan 2021 policy G6; NPPF paragraph 180
source-text: 'All Majori development (except change of use), and all sites where proposed development
  is part of, or located next to: a site designated for its biodiversity value such as SSSI, LNR or SINCS
  … Sites with a likelihood of Protected and Priority Species (including species that use buildings to
  roost and nest) … Important Habitats or other Biodiversity Features … Features of Geological Conservation
  Importance … Hedgerow or woodland … Wildlife corridors … Any water course'
must-include:
- item: Information on the existing biodiversity interests and protected species, and any possible impacts
    on them
  level: must
- item: Details of any measures proposed to mitigate or compensate for the impacts
  level: must
- item: Surveys undertaken at the appropriate time of year
  level: should
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), pages 14-15. Wildlife corridors
  have no field, so they show as discretionary. Householder wording from Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001),
  page 10. Householder: ''Where the proposal may have an impact on wildlife and biodiversity especially
  where protected species may be affected ... Where there is a reasonable likelihood of legally protected
  or priority Biodiversity Action Plan (BAP) species present''; ''may have an impact'' shows as discretionary.
  The hedgerow removal checklist (021, https://www.havering.gov.uk/downloads/file/171/checklist-021) asks
  for one for all applications. The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it. ''Majori'' in the
  quote is the list''s footnote marker (i) after ''Major'', pointing to the standard definition of major
  development (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).'
review-status: unverified
field-status: {}
