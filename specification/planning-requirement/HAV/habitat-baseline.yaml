reference: habitat-baseline
local-authority: HAV
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Schedule 7A of the Town and Country Planning Act 1990 (inserted by Schedule 14 of the Environment
  Act 2021)
source-text: Required for all Majori applications. … Required for all Minor applications from 2 April
  2024.
must-include:
- item: A plan drawn to an identified scale showing the direction of north and the onsite habitat existing
    on the date of application (or an earlier date), including any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), pages 7-8. The list asks for a 'Biodiversity
  Net Gain Statement' for all major and (from 2 April 2024) minor applications; following the law, this
  applies where the general biodiversity gain condition applies (householder and other exempt applications
  are exempt). 'Majori' in the quote is the list's footnote marker (i) after 'Major', pointing to the
  standard definition of major development (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).
review-status: unverified
field-status: {}
