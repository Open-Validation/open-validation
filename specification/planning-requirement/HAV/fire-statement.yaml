reference: fire-statement
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
confidence: medium
notes: 'The excerpt is a garbled table (Article 9A: provision of, development of, or development in the
  curtilage of a relevant building); the rule uses the national definition of a relevant building. The
  London Plan fire statement for all major development is listed under unmapped.'
review-status: unverified
field-status: {}
