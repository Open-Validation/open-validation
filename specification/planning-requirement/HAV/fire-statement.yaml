reference: fire-statement
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: Contains two or more dwellings.
        - condition:
            field: educational-accommodation
            value: true
            description: Contains educational accommodation.
      - any:
        - condition:
            field: building-height
            operator: '>='
            value: 18
            description: 18m or more in height.
        - condition:
            field: storey-count
            operator: '>='
            value: 7
            description: 7 or more storeys.
    - ref: major-development
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 9A of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; London Plan 2021 policy D12
source-text: 'An application for planning permission for development which involves: the provision of
  one or more relevant buildings … development of an existing relevant building … development within the
  curtilage of a relevant building … All majori development proposals.'
must-include:
- item: 'For major development: the London Plan fire statement, which is a separate requirement from the
    national Gateway One fire statement'
  level: must
  required-if:
    ref: major-development
  source-text: The Mayor of London requires that a Fire Statement is submitted for all major development.
    This is a separate requirement from the National Gateway One Fire Statement.
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), pages 6, 18. Relevant buildings:
  two or more dwellings or educational accommodation, and 18m or more in height or 7 or more storeys (national).
  The London Plan fire statement is listed separately for all major development. ''Majori'' in the quote
  is the list''s footnote marker (i) after ''Major'', pointing to the standard definition of major development
  (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).'
review-status: unverified
field-status: {}
