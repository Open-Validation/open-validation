reference: land-contamination-assessment
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - contaminated-land
        description: Land which is known to be contaminated or where contamination is suspected for all
          or part of the site.
    - condition:
        field: sensitive-end-use
        value: true
        description: A proposed use that would be particularly vulnerable to the presence of contamination.
    - discretionary
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF paragraph 183; Havering Local Plan 2016-2031 policy 34
source-text: If the proposal involves land which is known to be contaminated or where contamination is
  suspected for all or part of the site or is for a proposed use that would be particularly vulnerable
  to the presence of contamination, or in a groundwater vulnerable area.
must-include:
- item: Carried out by a geotechnical or geo-environmental engineer
  level: must
- item: Sufficient to determine whether contamination exists, its nature, the risks it may pose and whether
    these can be reduced to an acceptable level
  level: must
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 23. 'Groundwater vulnerable area'
  has no field, so it shows as discretionary. The S73 checklist (025) also asks for one where the condition
  relates to contaminated land.
review-status: unverified
field-status: {}
