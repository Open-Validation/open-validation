required-if:
  application-type:
    in:
    - consent-under-tpo
source-url: https://www.havering.gov.uk/downloads/file/174/checklist-031.pdf
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: For applications involving works to trees subject to a Tree Preservation Order (TPO) Statement
  of reasons for the proposed work Evidence in support of the statement of reasons e.g. plans, photographs,
  report by a professional tree surgeon or details of any assistance or advice sought from a Local Planning
  Authority officer prior to submitting the application.
must-include:
- item: Statement of reasons for the proposed work
  level: must
- item: Evidence in support of the statement of reasons (for example plans, photographs, a report by a
    professional tree surgeon, or details of advice sought from a council officer)
  level: must
confidence: medium
notes: From the council's tree works checklist (Checklist 031, revised July 2022), page 2.
