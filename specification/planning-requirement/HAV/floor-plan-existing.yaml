reference: floor-plan-existing
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings are proposed (including extensions).
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use or conversion of the property to residential.
  - application-type:
      in:
      - lbc
      - reserved-matters
      - pa-build-agri-forest
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - any:
      - condition:
          field: building-works
          value: true
          description: The application relates to existing or proposed building works.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: layout
        description: The removal or variation of the condition would change the layout of the building.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 7(1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015
source-text: All proposals where new buildings are proposed (including extensions) or involving change
  of use or conversion of the property to residential
must-include:
- item: Shows the direction of north and has an accurate scale bar
  level: should
- item: Has a unique reference number
  level: should
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: should
- item: Proportionate to the nature and size of the proposal
  level: should
- item: Annotated where appropriate, including the extent and mix of uses
  level: should
- item: Shows the proposed works in relation to what is already there, with any structures to be demolished
    cross-hatched in red
  level: should
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 10. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 7. The list words
  the contents as ''should''. The listed building (011), reserved matters (023) and agricultural building
  prior notification (016) checklists ask for existing and proposed floor plans at 1:50 or 1:100 in every
  case. LDC branches: Checklist 014 (https://www.havering.gov.uk/downloads/file/175/checklist-14.pdf)
  asks for existing floor plans ''Where the application relates to existing building works or an existing
  use of a building'', Checklist 015 (https://www.havering.gov.uk/downloads/file/156/checklist-015.pdf)
  for existing and proposed floor plans where it relates to proposed building works or the proposed use
  of a building; the ''use of a building'' part shows as discretionary. The S73 branch comes from Checklist
  025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf), which asks for this only where
  the condition being removed or varied relates to it.'
review-status: unverified
field-status: {}
