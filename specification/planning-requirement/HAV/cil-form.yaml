reference: cil-form
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Proposed new build of 100 sq m or more (GIA).
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: At least one new dwelling.
  - application-type:
      in:
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: New build floorspace (including extensions) of 100 sq m or more (GIA).
  - all:
    - application-type:
        in:
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: The gross internal floor area of new buildings and/or extensions exceeds 100 square
            metres.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Community Infrastructure Levy Regulations 2010
source-text: 'All applications for: full/outline planning permission, with proposed new build of 100sqm+
  (GIA); full/outline planning permission, consisting of at least one new dwelling; the last reserved
  matters following an outline planning permission'
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 16. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 10. Householder:
  ''All householder applications for: which propose newbuild floorspace (including extensions) of 100sqm
  or more (GIA)''. S73: Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf).
  The list says ''the last reserved matters'' application; shown for all reserved matters.'
review-status: unverified
field-status: {}
