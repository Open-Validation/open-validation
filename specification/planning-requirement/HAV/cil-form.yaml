reference: cil-form
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Proposed new build of 100 sqm or more (GIA).
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: At least one new dwelling.
  - application-type:
      in:
      - reserved-matters
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
source-text: full/outline planning permission, with proposed new build of 100sqm+ (GIA); full/outline
  planning permission, consisting of at least one new dwelling; the last reserved matters following an
  outline planning permission
confidence: medium
notes: 'Audit (wrong_trigger): the householder row quoted a biodiversity sentence; Checklist 001 asks
  for the form for householder proposals creating 100 sqm or more (GIA). Reserved matters: the last reserved
  matters only.'
review-status: unverified
field-status: {}
