reference: viability-assessment
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential (or mixed use) planning application.
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The amount of affordable housing proposed falls below the quantum required by policy.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The tenure mix differs from that required by policy, or the development departs from
          other planning policy requirements due to viability.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policy H5; Havering Local Plan 2016-2031 policies 4, 5 and 13
source-text: 'A financial viability appraisal is required for all majori residential (or mixed use) planning
  applications where: the amount of affordable housing proposed falls below the quantum required by policy
  the tenure mix differs from that … required by policy … the proposed development departs from other
  planning policy requirements due to viability'
must-include:
- item: An executive summary of the key conclusions for the lay reader
  level: must
- item: A fully testable and editable electronic/software model showing the calculations and assumptions
    used
  level: must
- item: The applicant meets the cost of reviewing the appraisal, or provides a solicitor's undertaking
    to pay, for the application to be validated
  level: must
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), pages 32-33. Listed as 'Viability
  Appraisal'. 'Majori' in the quote is the list's footnote marker (i) after 'Major', pointing to the standard
  definition of major development (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).
review-status: unverified
field-status: {}
