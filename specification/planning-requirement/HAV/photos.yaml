reference: photos
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: Affecting the setting, character or appearance of a listed building or conservation
          area.
    - discretionary
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-hoarding
        value: true
        description: The proposal is for an advertisement hoarding.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF paragraph 130; Havering Local Plan 2016-2031 policies 26, 27 and 28
source-text: Required for all Majori applications Recommended for all applications involving external
  building works.
must-include:
- item: Photomontage or CGI images showing the existing condition and the proposed development from eye
    level within the existing street scene or from the public realm
  level: must
- item: CGI locations discussed and agreed with officers before submission; CGIs relate directly to the
    townscape assessment and any views analysis for tall buildings
  level: should
- item: 'For listed building consent: photographs showing the whole building and its setting and/or the
    particular section of the building affected'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Always Required - showing the whole building and its setting and/or the particular section
    of the building affected by the proposals.
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 11. Item ''CGI/Photomontages,
  Photographs & Contextual Drawings''. For other applications with external building works context photographs
  are only ''recommended'', so they are not shown as required. Householder (Checklist 001, https://www.havering.gov.uk/downloads/file/5747/checklist-001,
  page 8): ''May be required for all applications affecting the setting, character or appearance of a
  listed building or conservation area'', so it shows as discretionary. Listed building consent: Checklist
  011 (https://www.havering.gov.uk/downloads/file/163/checklist-011). Adverts: Checklist 012 (https://www.havering.gov.uk/downloads/file/176/checklist-012)
  asks for photographs/photomontages for ''All hoarding proposals''. ''Majori'' in the quote is the list''s
  footnote marker (i) after ''Major'', pointing to the standard definition of major development (10+ dwellings
  or 0.5 ha; 1,000 sq m or 1 ha).'
review-status: unverified
field-status: {}
