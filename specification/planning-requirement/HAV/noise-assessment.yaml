reference: noise-assessment
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise sensitive development, or development in a noise sensitive area (for example
            new homes next to a trunk road, motorway or railway).
      - condition:
          field: noise-generating-use
          value: true
          description: A use that raises issues of disturbance for adjoining occupiers (for example industrial,
            food and drink, nightclub, recreational and sporting uses).
      - condition:
          field: wind-turbine
          value: true
          description: Wind turbine development.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: noise
        description: The condition being removed or varied relates to noise attenuation or limitation
          of noisy activities/hours of operation.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policy D13; Havering Local Plan 2016-2031 policies 7, 13, 14, 34, 36 and 38
source-text: Required for any applications that raise issues of disturbance for adjoining occupiers or
  are considered noise sensitive developments or in noise sensitive areas.
must-include:
- item: Undertaken by a suitably qualified acoustician
  level: must
- item: An assessment of the existing background noise/vibration level over a 24 hour period
  level: must
- item: Predicted noise/vibration levels
  level: must
- item: Identification of any mitigation required to meet the required levels or provide the necessary
    protection
  level: must
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), pages 25-26. The list''s examples:
  new homes next to a trunk road, motorway or railway land; major residential development in town centres;
  industrial (B2), food and drink (A3, A4, A5), nightclub and new recreational and sporting uses; major
  retail (A1), storage (B8) and leisure; aviation and wind turbines. Whether a scheme ''raises issues
  of disturbance'' is a judgement, so the rest shows as discretionary. Householder wording from Checklist
  001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 13. (same wording). The S73
  branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it.'
review-status: unverified
field-status: {}
