reference: noise-assessment
local-authority: HAV
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: New residential development adjoining a trunk road, motorway or railway land, or major
        residential development in a designated town centre.
  - condition:
      field: noise-generating-use
      value: true
      description: Industrial (B2), food and drink, nightclub, or new recreational and sporting development.
  - discretionary
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
source-text: 'Examples of developments that require a Noise Impact Assessment are: All new residential
  development that adjoins a trunk road, motorway or railway land. All major residential development within
  designated town centres. All new development involving the following uses: industrial (Class B2) food
  and drink (Class A3, A4, A5) and nightclub new recreational and sporting development'
confidence: medium
notes: These are examples, so other cases are at officer discretion; Checklist 001 adds householder applications
  raising disturbance for neighbours or in noise-sensitive locations.
review-status: unverified
field-status: {}
