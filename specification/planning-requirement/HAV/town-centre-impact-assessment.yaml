reference: town-centre-impact-assessment
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: New, or extensions to existing, edge or out-of-centre uses.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the Local Plan.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 200
        description: Floorspace of 200 sq m or more.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: town-centre-use
        description: The condition being removed or varied restricts the use of a property outside designated
          town centres or at edge of centre.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF paragraphs 86-91; London Plan 2021 policy SD7; Havering Local Plan 2016-2031 policy 13
source-text: Required for all applications for new, or extensions to existing, edge or out-of-centre uses
  that are not in accordance with the Local Plan and where the development has a floorspace of 200 sq
  m or more.
must-include:
- item: Evidence that the sequential test is satisfied for town centre uses of 200 sq m or more outside
    town and local centres
  level: must
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 30. Listed as 'Town Centre Impact
  Assessment and Sequential Test'. The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it.
review-status: unverified
field-status: {}
