reference: archaeological-assessment
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - archaeological-priority-area
        description: Within an Archaeological Priority Zone (APZ) or Archaeological Priority Area (APA).
    - condition:
        field: ground-disturbance
        value: true
        description: Groundworks are proposed.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: Within an Archaeological Priority Area (APA).
        - condition:
            field: basement
            value: true
            description: New basements are proposed.
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: Within Tier 1 of an Archaeological Priority Area (APA).
        - condition:
            field: ground-disturbance
            value: true
            description: Groundworks are proposed.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: NPPF paragraph 194; Havering Local Plan 2016-2031 policy 28
source-text: An archaeological desk-based assessment is required for all applications where groundworks
  are proposed within an Archaeological Priority Zone (APZ) or Archaeological Priority Area (APA).
must-include:
- item: A desk-based assessment in line with the National Planning Policy Framework
  level: must
- item: 'Where the proposal includes new basements, extensions to basements or other extensive groundworks:
    the results of an archaeological evaluation'
  level: must
  required-if:
    any:
    - condition:
        field: basement
        value: true
        description: New or extended basements.
    - condition:
        field: earthworks
        value: true
        description: Other extensive groundworks.
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 14. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 9. Householder:
  ''where new basements are proposed within an Archaeological Priority Area (APA) or groundworks are proposed
  within Tier 1 of an Archaeological Priority Area (APA)''.'
review-status: unverified
field-status: {}
