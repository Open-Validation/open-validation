notes: From the council's list (Checklist 004, revised March 2024), page 13. 'Any development that could
  have a significant impact on air quality' shows as discretionary. 'Majori' in the quote is the list's
  footnote marker (i) after 'Major', pointing to the standard definition of major development (10+ dwellings
  or 0.5 ha; 1,000 sq m or 1 ha).
