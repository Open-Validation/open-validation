reference: air-quality-assessment
local-authority: HAV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policy SI1; Havering Local Plan 2016-2031 policy 33
source-text: Required for all majori applications. Any development that could have a significant impact
  on air quality, either directly or indirectly.
must-include:
- item: Shows the development is air quality neutral as a minimum (London Plan air quality neutral benchmarks)
  level: must
