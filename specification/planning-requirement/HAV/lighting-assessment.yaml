reference: lighting-assessment
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: external-lighting
          value: true
          description: External lighting is proposed.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-hoarding
        value: true
        description: An illuminated hoarding.
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: floodlighting
        description: The condition being removed or varied relates to floodlighting.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policies D8, D9, S5, HC6 and G6; Havering Local Plan 2016-2031 policy 34
source-text: Required for all development where external lighting is proposed or where the proposal involves
  areas of public access.
must-include:
- item: Equipment design
  level: must
- item: Column heights
  level: must
- item: Light levels
  level: must
- item: Layout plan with beam orientation and light maps
  level: must
- item: Hours of operation
  level: must
- item: Light spillage
  level: must
- item: Impact on nearby dwellings or roads
  level: must
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), page 24. ''Areas of public access''
  has no field, so it shows as discretionary. Adverts: ''All illuminated hoardings'' (Checklist 012, https://www.havering.gov.uk/downloads/file/176/checklist-012).
  The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it.'
review-status: unverified
field-status: {}
