reference: elevation-existing
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings are proposed (including extensions).
      - condition:
          field: external-alterations
          value: true
          description: External alterations are proposed.
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use or conversion of the property to residential.
  - application-type:
      in:
      - lbc
      - reserved-matters
      - advertising
      - pa-build-agri-forest
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - condition:
        field: building-works
        value: true
        description: The application relates to existing or proposed building works.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: appearance
        description: The removal or variation of the condition would change the appearance of the building.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 7(1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015
source-text: All proposals where new buildings (including extensions)/external alterations are proposed
  or involving change of use or conversion of the property to residential
must-include:
- item: Has an accurate scale bar
  level: should
- item: Has a unique reference number
  level: should
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: should
- item: Proportionate to the nature and size of the proposal
  level: should
- item: Annotated to show the make, type and colour of external materials
  level: should
- item: Annotated to show site levels, finished floor levels and roof levels (preferably as AOD)
  level: should
- item: Includes street elevations showing the proposal in relation to neighbouring buildings, including
    relative building heights
  level: should
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 10. Householder wording from
  Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 7. The list words
  the contents as 'should'. The listed building (011), reserved matters (023), advert (012) and agricultural
  building prior notification (016) checklists ask for existing and proposed elevations at 1:50 or 1:100
  in every case; LDC checklists 014 and 015 where the application relates to existing or proposed building
  works. The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it.
review-status: unverified
field-status: {}
