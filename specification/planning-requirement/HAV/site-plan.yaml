reference: site-plan
local-authority: HAV
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - pa-build-agri-forest
    - pa-road-agri-forest
    - pa-excavate-agri
    - pa-fish-struct
    - pa-demo-building
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: Article 7(1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015
source-text: Required for all applications
must-include:
- item: Shows the direction of north and has an accurate scale bar
  level: should
- item: Has a unique reference number
  level: should
- item: Shows the proposed development in relation to the site boundaries and other existing buildings
    on the site, with dimensions including those to the boundaries
  level: should
- item: At an identified standard metric scale (typically 1:100, 1:200 or 1:500 for larger sites)
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site and on adjacent land
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing, where proposed
  level: should
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 9. Householder wording from Checklist
  001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001), page 6. The listed building, advert,
  LDC, reserved matters, demolition and agricultural prior notification checklists also ask for a site
  plan (LDC checklists call it a site survey plan). The list words every item as 'should'.
review-status: unverified
field-status: {}
