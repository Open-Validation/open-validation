reference: landscaping-plan
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - all:
      - ref: major-development
      - condition:
          field: involves-change-of-use
          value: false
          description: Not only a change of use.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: landscaping
        description: The condition being removed or varied relates to landscaping.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policies G5, G6, D3 and D4; Havering Local Plan 2016-2031 policy 27
source-text: All majori development (except change of use).
must-include:
- item: Tree and plant species, sizes, numbers and planting densities
  level: should
- item: Any hard landscape or boundary treatment, including materials
  level: should
- item: Any features such as green walls and planted roofs
  level: should
- item: Levels, gradients and any earthworks required
  level: should
- item: Management and maintenance arrangements
  level: should
confidence: medium
notes: From the council's list (Checklist 004, revised March 2024), page 24. Listed as 'Landscaping Strategy'.
  The S73 branch comes from Checklist 025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf),
  which asks for this only where the condition being removed or varied relates to it. 'Majori' in the
  quote is the list's footnote marker (i) after 'Major', pointing to the standard definition of major
  development (10+ dwellings or 0.5 ha; 1,000 sq m or 1 ha).
review-status: unverified
field-status: {}
