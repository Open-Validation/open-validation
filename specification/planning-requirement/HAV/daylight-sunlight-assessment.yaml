reference: daylight-sunlight-assessment
local-authority: HAV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - all:
        - ref: major-development
        - condition:
            field: new-build
            value: true
            description: New buildings are proposed (including extensions).
      - all:
        - ref: major-development
        - condition:
            field: involves-change-of-use
            value: true
            description: Change of use to provide new dwellings.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: daylight-sunlight
        description: The condition being removed or varied relates to protection of daylight/sunlight.
source-url: https://www.havering.gov.uk/downloads/file/5748/checklist-004
policy: London Plan 2021 policies D6 and D9; Havering Local Plan 2016-2031 policy 7
source-text: All majori new development (including change of use to provide new dwellings). … Any application
  where there is a potential adverse impact upon the current levels of sunlight/daylight enjoyed by adjoining
  properties or building(s), including associated gardens or amenity space
must-include:
- item: 'Prepared in line with the BRE guide ''Site layout planning for daylight and sunlight: a guide
    to good practice'' (BR 209, 2022 edition)'
  level: must
confidence: medium
notes: 'From the council''s list (Checklist 004, revised March 2024), pages 16-17. ''Potential adverse
  impact'' shows as discretionary. Householder wording from Checklist 001 (https://www.havering.gov.uk/downloads/file/5747/checklist-001),
  page 11. Householder: the ''potential adverse impact'' wording only. The S73 branch comes from Checklist
  025 (https://www.havering.gov.uk/downloads/file/161/checklist-025.pdf), which asks for this only where
  the condition being removed or varied relates to it. ''Majori'' in the quote is the list''s footnote
  marker (i) after ''Major'', pointing to the standard definition of major development (10+ dwellings
  or 0.5 ha; 1,000 sq m or 1 ha).'
review-status: unverified
field-status: {}
