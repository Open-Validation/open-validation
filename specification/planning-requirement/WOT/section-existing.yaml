policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All planning applications. The following will be required: Existing and proposed sections
  Existing and proposed site sections, site levels and finished floor levels should be submitted to show
  different floor heights to ground levels and to demonstrate adequate head height in basements, lofts
  etc. Heights must be clearly legible.'
