reference: viability-assessment
local-authority: WOT
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: For viability reasons, affordable housing cannot be provided in line with policy DM3.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Worthing Local Plan 2020-2036 (adopted 2023) policy DM3
source-text: In exceptional circumstances, if for viability reasons affordable housing cannot be provided
  in line with the requirements contained within policy DM3 of the Worthing Local Plan, a financial viability
  review including itemised cost plan must be provided.
must-include:
- item: Financial viability review including an itemised cost plan
  level: must
- item: Provided in electronic format by a RICS registered surveyor, ideally using Existing Use Value
    and methodology in Argus
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 8 (Affordable Housing Statement
  and Viability Report), page 18-19. The report will be published and reviewed by a third party at the
  applicant's expense.
review-status: unverified
field-status: {}
