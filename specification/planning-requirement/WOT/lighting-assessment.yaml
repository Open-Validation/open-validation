reference: lighting-assessment
local-authority: WOT
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting (e.g. floodlights or security lighting).
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: 'NPPF Chapter 15; Planning Practice Guidance: Light Pollution; ILP Guidance Note 01/21; Worthing
  Local Plan 2020-2036 (adopted 2023) policy DM22'
source-text: Required for all applications which would involve the provision of significant external lighting
  (e.g. floodlights or security lighting) that may have an adverse impact on residential amenity, the
  character of the open countryside, the South Downs National Park International Dark Skies Reserve or
  a heritage asset
must-include:
- item: Light spillage, hours of illumination, light levels and column heights
  level: must
- item: Specification and colour, and treatment for lamps and luminaires
  level: must
- item: The need for full horizontal cut-off; no distraction to the highway
  level: must
- item: Levels of impact on nearby dwellings
  level: must
- item: Use of demountable columns, retention of screening vegetation, and use of planting and bunding
    to contain lighting effects
  level: must
- item: Impact on visual amenity, local character and distinctiveness, neighbouring amenity, heritage
    assets if present, and nature conservation, and how those effects will be mitigated
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 26 (Lighting Assessment), page
  35-36. Whether lighting is 'significant' and 'may have an adverse impact' is shown as 'check'.
review-status: unverified
field-status: {}
