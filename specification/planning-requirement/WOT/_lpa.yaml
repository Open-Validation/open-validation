submission-standards:
- item: Documents in PDF or Open Document Format
  level: must
- item: Plans clearly state the paper size and scale, and are scalable
  level: must
- item: All plans to a recognised scale, with a unique reference number, scale bar, written scale and
    north arrow
  level: must
- item: Individual documents no larger than 5MB; larger documents split into sensibly labelled chapters
  level: must
- item: Plans sent by email in .pdf format, maximum 10MB per file (larger files by We-Transfer or Drop
    Box)
  level: must
- item: Floor plans, sections and elevations no larger than A3 to enable printing
  level: should
- item: Personal or sensitive data not included; where unavoidable, both original and redacted versions
    provided
  level: must
- item: Amended drawings marked with a new revision letter or number
  level: must
