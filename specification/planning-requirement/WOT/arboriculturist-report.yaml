reference: arboriculturist-report
local-authority: WOT
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development near trees or hedges, within or adjacent to the site or in a Conservation
        Area, likely to affect them or their root protection areas.
  - site:
      in:
      - tree-preservation-zone
      description: Pruning or felling of trees with a Tree Preservation Order.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapters 12 and 15; Worthing Local Plan 2020-2036 (adopted 2023) policy DM19
source-text: 'Required for all applications involving: Development in proximity to trees where development
  is likely to affect the trees/ hedges including their root protection areas. The pruning of trees with
  a Tree Preservation Order. The felling or pruning of trees/hedges or works likely to affect trees or
  hedges either within or adjacent to the site (including their Root Protection Areas) or in a Conservation
  Area.'
must-include:
- item: Tree survey and Arboricultural Statement produced by a qualified arboriculturist
  level: must
- item: Accurate survey of the location and size of the trees/hedgerow, with classification
  level: must
- item: Root protection areas identified, and the likely impact of development
  level: must
- item: Which trees/hedgerows are to be retained and how they will be protected during construction
  level: must
- item: Follows BS 5837:2012 Trees in Relation to Construction
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Common invalidation reasons and requirement
  44 (Tree Survey and arboricultural method statement), page 8, 50-51. Page 8 also asks for an Arboricultural
  Statement where trees on the site are within falling distance of the development.
review-status: unverified
field-status: {}
