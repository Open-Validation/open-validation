reference: fire-statement
local-authority: WOT
required-if:
  all:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'For new buildings which: contain two or more dwellings or educational accommodation meet
  the height condition of being 18m or more in height, or 7 or more storeys'
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How any fire safety policies in relevant local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 18 (Fire Statement), page 26-27.
review-status: unverified
field-status: {}
