reference: fire-statement
local-authority: WOT
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A new building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A new building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
confidence: medium
notes: 'From the audit (missing_requirement): new buildings with 2+ dwellings or educational accommodation
  that are 18 m+ or 7+ storeys.'
review-status: unverified
