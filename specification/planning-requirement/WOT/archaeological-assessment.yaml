reference: archaeological-assessment
local-authority: WOT
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: A historic indication of heritage assets of archaeological interest on the site (for
        example a West Sussex Archaeological Notification Area).
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 16; Worthing Local Plan 2020-2036 (adopted 2023) policies DM23 and DM24; Worthing
  Conservation and Heritage Guide 2023
source-text: All developments where there is a historic indication of heritage assets of archaeological
  interest on the site should submit an appropriate desk-based assessment and, where necessary, a field
  evaluation. Threshold Criteria are detailed in the West Sussex Threshold Guidance.
must-include:
- item: An appropriate desk-based assessment
  level: must
- item: A field evaluation, where necessary
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 23 (Historic Environment Record),
  page 32-33. Shown with 'check' because the thresholds are in West Sussex County Council's threshold
  guidance, not in the list.
review-status: unverified
field-status: {}
