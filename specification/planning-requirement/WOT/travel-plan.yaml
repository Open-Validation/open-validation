reference: travel-plan
local-authority: WOT
required-if: discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 9; Worthing Local Plan 2020-2036 (adopted 2023) policy DM15; West Sussex Waste Local
  Plan policy W18
source-text: All developments that require either a Transport Assessment or Transport Statement
must-include:
- item: Specific required outcomes, targets and measures, with clear future monitoring and management
    arrangements
  level: must
- item: Additional measures to offset unacceptable impacts if targets are not met
  level: should
- item: Addresses all journeys resulting from the development by anyone who may need to visit or stay
  level: should
- item: Benchmark travel data, including trip generation databases
  level: must
- item: The nature of the development and the forecast level of trips by all modes
  level: must
- item: Existing travel habits in the surrounding area
  level: must
- item: Proposals to reduce the need for travel to and from the site by all modes, and provision of improved
    public transport services
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirements 41 and 43 (Travel Plans), page
  47, 49-50. Needed whenever a Transport Assessment or Transport Statement is, so it is shown as 'check'
  like them; a Transport Assessment must include a full Travel Plan.
