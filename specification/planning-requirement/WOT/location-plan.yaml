reference: location-plan
local-authority: WOT
required-if:
  always: true
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All
must-include:
- item: Based on an up-to-date map at 1:1250 or 1:2500
  level: must
- item: Direction of north
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact site location clear
  level: must
- item: At least two road names, if possible; for rural sites without a second road, nearby landmarks
    and public rights of way in or next to the site
  level: should
- item: Site edged in red, including all land needed to carry out the development and a link to the public
    highway
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged blue
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Common invalidation reasons and requirement
  2 (Location Plan), page 6, 14.
review-status: unverified
field-status: {}
