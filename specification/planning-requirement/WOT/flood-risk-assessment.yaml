reference: flood-risk-assessment
local-authority: WOT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Sites of 1 hectare or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Sites of 1 hectare or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: All new development (including minor development and change of use) in Flood Zones
        2 and 3.
  - all:
    - site:
        in:
        - future-flood-risk
        - surface-water-flood-risk
        description: Land at increased flood risk in future, or subject to other sources of flooding identified
          by the Strategic Flood Risk Assessment.
    - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 14; Worthing Local Plan 2020-2036 (adopted 2023) policy DM20
source-text: 'A site-specific Flood Risk Assessment must be submitted with planning applications for:
  sites of 1 hectare or greater in Flood Zone 1; all new development (including minor development and
  change of use) in Flood Zones 2 and 3; development that would introduce a more vulnerable class on land
  at increased flood risk in future or subject to other sources of flooding identified by the Strategic
  Flood Risk Assessment.'
must-include:
- item: Demonstrates that flood risk is not increased elsewhere
  level: must
- item: The nature of the flood risk
  level: must
- item: Access and safety of occupiers/users of the site during a flood event
  level: must
- item: Flood risk sequential test, unless the development meets the exceptions set out in the NPPF
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      - future-flood-risk
      - surface-water-flood-risk
      description: Sites known to be at risk now or in the future from any form of flooding.
  source-text: The flood risk sequential test will also need to be undertaken for sites in areas known
    to be at risk now or in the future from any form of flooding unless development meets the exceptions
    set out in the NPPF.
- item: Follows national planning guidance and West Sussex County Council's approach
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Common invalidation reasons and requirement
  19 (Flood Risk Assessment), page 7, 28. Whether development 'would introduce a more vulnerable class'
  on land at future or other flood risk is shown as 'check'. The FRA should be proportionate to the scale,
  nature and location of the development.
review-status: unverified
field-status: {}
