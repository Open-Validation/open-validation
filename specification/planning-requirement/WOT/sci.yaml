reference: sci
local-authority: WOT
required-if:
  any:
  - ref: major-development
  - condition:
      field: telecommunications-development
      value: true
      description: Planning applications for telecommunications equipment.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Section 18, Planning and Compulsory Purchase Act 2004; NPPF Chapter 3; Worthing and Adur Joint
  Statement of Community Involvement (April 2024)
source-text: Required for all major applications as well as planning applications for telecommunications
  equipment.
must-include:
- item: The steps and processes used to secure community involvement, including the relevant dates
  level: must
- item: The extent of the area of consultation, including a list of properties and businesses contacted
  level: must
- item: A list of interest groups or other bodies and organisations contacted
  level: must
- item: A summary of all the comments received and issues raised
  level: must
- item: A clear description of amendments made as a result of the comments, and why other comments have
    not resulted in changes
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Before submitting a Planning Application
  and requirement 36 (Statement of Community Involvement), page 4, 42.
review-status: unverified
