reference: affordable-housing-statement
local-authority: WOT
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 5; Worthing Local Plan 2020-2036 (adopted 2023) policies DM1 and DM3
source-text: Only applications for 10+ dwellings will need to provide a proportion of affordable housing
  ... A statement setting out the affordable housing to be provided on site must be submitted for planning
  applications of 10 or more residential units (as per the thresholds in the NPPF).
must-include:
- item: The affordable housing to be provided on site
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 8 (Affordable Housing Statement
  and Viability Report), page 18-19. Policy DM3 asks for 20% affordable housing for flats on previously
  developed land, 30% for houses on previously developed land and 40% on greenfield land.
