reference: sustainable-drainage-strategy
local-authority: WOT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Sites over 1 ha.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Sites over 1 ha.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Sites of 1 hectare or greater (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Sites of 1 hectare or greater (Flood Zone 1).
    - site:
        in:
        - flood-risk-zone
        description: All new development (including minor development and change of use) in Flood Zones
          2 and 3.
    - all:
      - site:
          in:
          - future-flood-risk
          - surface-water-flood-risk
          description: Land at increased flood risk in future, or subject to other sources of flooding
            identified by the Strategic Flood Risk Assessment.
      - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 14; Worthing Local Plan 2020-2036 (adopted 2023) policies DM16, DM19 and DM20
source-text: A SuDS is required for sites over 1 ha or as part of a Flood Risk Assessment, where one is
  required.
must-include:
- item: A detailed site plan
  level: must
- item: Proposed SuDS measures with their design and calculations
  level: must
- item: A management plan for future maintenance
  level: must
- item: Follows the SuDS hierarchy and delivers multi-functional benefits
  level: should
- item: Designed in accordance with the National Standards for sustainable drainage systems and CIRIA
    C753 (The SuDS Manual)
  level: must
- item: Hydrogeological risk assessment, particularly where infiltration is proposed
  level: should
  required-if:
    site:
      in:
      - source-protection-zone
      description: Site in a Groundwater Source Protection Zone (SPZ1).
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 38 (Sustainable Drainage Systems),
  page 43-44. Needed wherever a Flood Risk Assessment is.
review-status: unverified
field-status: {}
