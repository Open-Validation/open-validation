reference: planning-statement
local-authority: WOT
required-if:
  always: true
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapters 5, 6, 7, 10, 15, 16 and 17
source-text: Required for all applications (proportionate and specific to the development).
must-include:
- item: How the Local Plan, the NPPF, other relevant guidance and the local context have been considered
  level: must
- item: Description of the site (including access) and its surroundings
  level: must
- item: Details of any relevant planning history
  level: must
- item: Description of the proposed development, including (where relevant) dimensions, design/appearance,
    hours of operation, vegetation affected, planting, land raising/excavation, fencing, lighting, parking,
    changes to accesses and HGV movements
  level: must
- item: Any historic, ecological, landscape or other designations
  level: must
- item: Historic/existing land uses
  level: must
- item: Consideration of relevant national guidance, development plan policies and other relevant guidance
  level: must
- item: Details of community engagement undertaken and how it has influenced the proposal (particularly
    for major proposals)
  level: must
- item: 'For S73 applications: what amendments are proposed and why'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: 'For S96A non-material amendments: a list of the proposed changes and why they have been made'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
- item: 'For development within site allocations: how the development responds to the requirements of
    the site allocation'
  level: must
  required-if:
    condition:
      field: site-allocation
      value: true
      description: The site is within a local plan site allocation.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Other application types and requirement
  30 (Planning Statement), page 10, 38-39. Applications to remove or vary conditions are 'encouraged'
  to include a covering letter and/or Planning Statement (page 10).
review-status: unverified
field-status: {}
