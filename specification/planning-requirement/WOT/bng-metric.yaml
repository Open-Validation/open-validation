reference: bng-metric
local-authority: WOT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The application is subject to the mandatory biodiversity gain condition (minor and major
      development).
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Environment Act 2021, Part 6; Biodiversity Gain Requirements (Exemptions) Regulations 2024; Worthing
  Local Plan 2020-2036 (adopted 2023) policy DM18; Biodiversity Technical Report (2025)
source-text: 'All applications for minor and major development (applications made under Section 73 of
  the Town and Country Planning Act 1990 (as amended), i.e. to vary the conditions of an existing planning
  permission where the original planning permission was not subject to the requirement for statutory Biodiversity
  Net Gain are not required to provide BNG). ... All applications subject to the mandatory BNG condition
  will be required to provide: BNG metric or small sites metric;'
must-include:
- item: BNG metric or small sites metric
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 11 (Biodiversity Net Gain),
  page 21. The same applications need a BNG Strategy Statement (unmapped), and where appropriate a draft
  Biodiversity Gain Plan and draft Habitat Management and Maintenance Plan (unmapped); phased development
  needs a draft Overall Biodiversity Gain Plan, and any proposed planning obligation should be submitted
  in draft.
review-status: unverified
field-status: {}
