reference: daylight-sunlight-assessment
local-authority: WOT
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major development that involves new dwellings.
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 11; Worthing Local Plan 2020-2036 (adopted 2023) policy DM5
source-text: Required for all major applications that would affect light to adjoining premises. For major
  developments that involve new dwellings an assessment of internal daylight levels will also be required.
  For smaller developments on constrained sites, a daylight and sunlight study may be requested. This
  should be set out within any pre-application advice.
must-include:
- item: Carried out in accordance with BRE guidelines (BR 209, 2022 edition)
  level: must
- item: Assessment of internal daylight levels
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 13 (Daylight/Sunlight and Overshadowing
  Assessment), page 23. Whether a major scheme 'would affect light to adjoining premises', and smaller
  constrained sites, are shown as 'check'.
review-status: unverified
field-status: {}
