reference: sustainability-statement
local-authority: WOT
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: new-build
        value: true
        description: New build housing.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 2; Worthing Local Plan 2020-2036 (adopted 2023) policies SP2, DM16, DM17 and DM21;
  Worthing Planning and Climate Change Checklist (December 2023)
source-text: 'Required for all major developments: Above 10 housing units Above 1000 sqm of commercial
  floorspace And: All new build housing'
must-include:
- item: Demonstrates that the minimum standards are met and where possible exceeded
  level: must
- item: How the development has taken measures to mitigate and adapt to the effects of climate change
  level: must
- item: How the development has considered the energy hierarchy and the heating and cooling hierarchy
  level: must
- item: How sustainable design and construction measures have been incorporated
  level: must
- item: How any potential flood risk will be mitigated
  level: must
- item: How the development will protect and enhance the Borough's natural capital and biodiversity assets
  level: must
- item: SAP calculations
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New housing development.
- item: BREEAM Very Good or Excellent for major non-residential development
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Major non-residential development.
- item: Renewable and low carbon energy equipment meeting at least 10% of predicted total energy requirements
    (after CO2 reductions from energy efficiency)
  level: should
- item: Energy Performance Certificate A rating sought for new build housing (minimum expectation B)
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: New build housing.
- item: Energy Performance Certificate 'B' rating for non-domestic properties, including conversions
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-domestic floorspace.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 16 (Energy/Sustainability Statement),
  page 25-26. The list calls it an Energy and Sustainability Statement. It describes major development
  as 'above 10 housing units' and 'above 1000 sqm of commercial floorspace'; the standard major development
  definition is shown.
review-status: unverified
field-status: {}
