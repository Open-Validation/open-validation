reference: land-contamination-assessment
local-authority: WOT
required-if:
  any:
  - all:
    - condition:
        field: previously-developed-land
        value: true
        description: Development on brownfield land.
    - discretionary
  - site:
      in:
      - near-landfill-site
      description: New development within 250 metres of current or former landfill sites.
  - condition:
      field: sensitive-end-use
      value: true
      description: A particularly sensitive end use (for example residential development, schools, day
        nurseries, care homes or hospitals).
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 11; Worthing Local Plan 2020-2036 (adopted 2023) policy DM22
source-text: 'Required for: All development on brownfield land where contamination could be an issue due
  to the previous use of the site (or adjacent land) New development within 250 metres of current or former
  landfill sites Where the end use would be particularly sensitive (for example residential development,
  schools, day nurseries, care homes or hospitals)'
must-include:
- item: Preliminary risk assessment
  level: should
- item: All previous uses of the site and surrounding sites
  level: should
- item: Potential contaminants associated with those uses
  level: should
- item: A conceptual model of the site indicating sources, pathways and receptors
  level: should
- item: Potential risks arising from contamination at the site
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 24 (Land Contamination Assessment),
  page 33-34. Whether contamination 'could be an issue' on brownfield land is shown as 'check'. The list
  says applications 'should, where appropriate' include a preliminary risk assessment, so its contents
  are 'should'.
review-status: unverified
field-status: {}
