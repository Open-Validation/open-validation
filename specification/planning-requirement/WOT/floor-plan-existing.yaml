reference: floor-plan-existing
local-authority: WOT
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - ldc
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All planning applications. The following will be required: Existing and proposed floor plans
  (1:50 or 1:100 at A3)'
must-include:
- item: Drawn at 1:50 or 1:100 at A3
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Other application types and requirement
  7 (Additional Plans and Drawings), page 9, 18. The list says 'All planning applications'; it is written
  for full applications and the drawings it names are shown for every planning application type as written.
  Lawful development certificate applications should also include existing and proposed floor plans (page
  9). Larger home extension prior approvals are only 'encouraged' to include floor plans and elevations,
  so they are not shown as required.
