reference: transport-assessment
local-authority: WOT
required-if: discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 9; Worthing Local Plan 2020-2036 (adopted 2023) policy DM15; West Sussex Waste Local
  Plan policy W18
source-text: The thresholds contained within Appendix B of DfT Guidance on Transport Assessments are used
  to determine whether a Transport Assessment is required. However, the Local Highways Authority may request
  a Transport Assessment for schemes even where these thresholds aren’t met depending on the site specifics
  or development specifics. ... A Transport Statement is required for all smaller developments outside
  of those listed in Appendix B of the DfT Guidance on Transport Assessments.
must-include:
- item: Reflects the scale of the development and its transport implications; the site's accessibility
    by all modes and the likely modal split
  level: must
- item: Junction capacity modelling where any junction may see 30 or more additional movements in any
    hour
  level: must
- item: Swept path tracking for all vehicles; visibility; access proposals; any off-site highway improvements
  level: must
- item: Design Audit where more complex junctions or changes to junctions are proposed
  level: must
  required-if: discretionary
- item: Trip generation; internal layout detail (if full application); parking provision assessment
  level: must
- item: Road Safety Audit and Designer's Response
  level: must
- item: Measures to improve access by public transport, walking and cycling, address parking need and
    mitigate transport impacts
  level: must
- item: A full Travel Plan
  level: must
- item: Adequate access for emergency and service vehicles, including bin collection
  level: must
- item: 'Transport Statement (smaller developments): the transport aspects of the application and the
    proposed measures to improve access by public transport, walking and cycling, address parking need
    and mitigate transport impacts'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirements 41 (Transport Assessment) and
  42 (Transport Statement), page 46-49. Shown as 'check' because the thresholds are in Appendix B of the
  DfT guidance, not in the list, and the highway authority may ask for an assessment below them. The 'must
  show' items for a Transport Assessment come from the list; a Transport Statement is the lighter version
  for smaller schemes.
review-status: unverified
field-status: {}
