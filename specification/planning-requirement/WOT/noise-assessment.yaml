reference: noise-assessment
local-authority: WOT
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Raises issues of potential noise disturbance to occupants of nearby existing buildings.
    - discretionary
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development close to existing sources of noise (e.g. railway, major
        roads, industrial sites).
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Installation of an air source heat pump (ASHP).
    - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: 'NPPF Chapter 15; Worthing Local Plan 2020-2036 (adopted 2023) policy DM22; Planning Practice
  Guidance: Noise; Planning Noise Advice Document Sussex (Nov 2023)'
source-text: Required for all applications that raise issues of potential noise disturbance to the occupants
  of nearby existing buildings, and for developments that are considered to be noise sensitive and which
  are close to existing sources of noise (e.g. railway, major roads, industrial sites).
must-include:
- item: Undertaken by a suitably qualified acoustician in accordance with relevant guidance
  level: must
- item: The existing (baseline) noise environment
  level: must
- item: Noise-sensitive receptors
  level: must
- item: Likely noise impacts
  level: must
- item: Proposed mitigation measures
  level: must
- item: Residual noise impacts post-mitigation
  level: must
- item: Noise survey and assessment methodologies clearly set out
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirements 10 (Air Source Heat Pumps)
  and 27 (Noise Impact Assessment), page 20, 36-37. Whether a proposal raises noise disturbance issues
  is shown as 'check'. For air source heat pumps, domestic installations should follow the MCS 020 (March
  2025) screening; if it is met, no further noise assessment is needed, so ASHPs are shown as 'check'.
review-status: unverified
field-status: {}
