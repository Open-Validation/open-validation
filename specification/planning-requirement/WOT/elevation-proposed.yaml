reference: elevation-proposed
local-authority: WOT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: external-alterations
        value: true
        description: External alterations are proposed.
  - application-type:
      in:
      - advertising
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning (Control of Advertisements) (England) Regulations 2007
source-text: 'All planning applications. The following will be required: Existing and proposed elevations
  (1:50 or 1:100)'
must-include:
- item: Drawn at 1:50 or 1:100
  level: must
- item: No larger than A3, to enable printing
  level: should
- item: 'For advertisements: details of each advertisement as set out in the application form, including
    lighting levels'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Other application types and requirement
  7 (Additional Plans and Drawings), page 9-10, 18. The list says 'All planning applications'; it is written
  for full applications and the drawings it names are shown for every planning application type as written.
  Advertisement applications should include elevation drawings and sections (page 10).
review-status: unverified
field-status: {}
