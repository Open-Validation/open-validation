reference: design-and-access-statement
local-authority: WOT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a World Heritage Site or Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: A building or extension over 100 sq m.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for development proposals which entail the: Provision of 10 or more dwellings or
  site area exceeds 0.5ha Erection of buildings/extensions over 1000sqm Where site area is 1ha or greater
  (excluding minerals & waste development) Applications for listed building consent In World Heritage
  Site or Conservation Area: Provision of 1 or more dwellings Building/extension over 100sqm'
must-include:
- item: The design principles behind the development, with a justification of the proposal and how the
    site and its context influenced the design
  level: must
- item: How the proposal is accessible and convenient for all potential users, including road, rail and
    bus networks
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 5 (Design & Access Statement),
  page 16. The checklist table on page 12 ticks the DAS as 'Mandatory for all applications', but the entry
  itself lists the triggers shown here (the major development thresholds, listed building consent, and
  1+ dwellings or over 100 sq m in a World Heritage Site or Conservation Area). The statement may be proportionate
  to the scale and sensitivity of the proposal.
review-status: unverified
field-status: {}
