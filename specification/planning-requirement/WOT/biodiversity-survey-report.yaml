reference: biodiversity-survey-report
local-authority: WOT
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - ancient-woodland
      description: Within, adjacent to or could impact upon a SSSI, a Local Wildlife Site, Local Geological
        Site/RIGS, Local Nature Reserve or Ancient Woodland (e.g. Whitebeam Woods).
  - condition:
      field: protected-species
      value: true
      description: Development that could affect protected or notable species or habitats.
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Part 15; Worthing Local Plan 2020-2036 (adopted 2023) policy DM18; Biodiversity Technical
  Report (2025)
source-text: 'Development within/ adjacent to or that could impact upon: nationally designated area (SSSI);
  locally designated area (e.g. Local Wildlife Site, (LWS), Local Geological Site/RIGS, Local Nature Reserve)
  or an area of Ancient Woodland i.e. Whitebeam Woods. Development that could affect protected or notable
  species or habitats. These could also include (but are not limited to): proposals on brownfield sites,
  applications involving works to or demolition of an existing building or roofs; proposals that involve
  the removal of trees, scrub or hedgerows; proposals affecting watercourses; proposals within 500m of
  a pond.'
must-include:
- item: Preliminary Ecological Appraisal (PEA) report
  level: must
- item: Up to date, comprehensive information on protected/notable species and habitats recorded in the
    area, and on any areas designated for their ecological importance on or next to the site
  level: must
- item: Ecological surveys as appropriate
  level: must
  required-if: discretionary
- item: A full assessment of the likely effects of the development
  level: must
- item: Avoidance or mitigation measures, if applicable
  level: must
- item: Information to support any proposals for mitigation/compensation measures
  level: must
- item: Enhancement measures
  level: must
- item: Species-specific Phase 2 survey where protected species are identified
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species are identified.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 14 (Ecological Appraisal), page
  23-24. The list's examples of development that could affect protected species (brownfield sites, works
  to or demolition of buildings or roofs, removal of trees, scrub or hedgerows, watercourses, within 500m
  of a pond) are 'not limited to', so they are shown as 'check'. Some surveys are seasonal.
review-status: unverified
field-status: {}
