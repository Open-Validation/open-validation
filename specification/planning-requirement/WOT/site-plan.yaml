reference: site-plan
local-authority: WOT
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - ldc
    - lbc
    - advertising
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Worthing Local
  Plan 2020-2036 (adopted 2023) policy DM15
source-text: 'All planning applications. The following will be required: Block plan (1:500 or 1:200)'
must-include:
- item: Block plan at 1:500 or 1:200
  level: must
- item: Existing and proposed block plans at 1:200 showing parking provision
  level: must
  required-if:
    application-type:
      in:
      - full
  source-text: Required for all full planning applications which should be accompanied by existing and
    proposed block plans to a scale of 1:200 showing parking provision.
- item: 'For advertisements: the location of the advertisement(s)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Other application types, requirement 7 (Additional
  Plans and Drawings) and requirement 28 (Parking Provision), page 9-10, 18, 37. The list says 'All planning
  applications'; it is written for full applications and the drawings it names are shown for every planning
  application type as written. A site plan is also asked for with lawful development certificate, listed
  building consent and advertisement applications (pages 9-10). Parking provision should normally follow
  West Sussex County Council's parking standards; an on-street parking capacity survey may be required
  where on-site provision is below them.
