policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: An environmental statement is required for developments likely to have a significant effect
  on the environment, based on their nature, size, or location. This is mandatory for projects listed
  in Schedule 1 of the Environmental Impact Assessment Regulations 2017 and for projects in Schedule 2
  if they meet specific thresholds and are likely to cause significant effects.
