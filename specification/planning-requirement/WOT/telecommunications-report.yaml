reference: telecommunications-report
local-authority: WOT
required-if:
  any:
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development (mast and antenna development).
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 10; Worthing Local Plan 2020-2036 (adopted 2023) policy DM14; Code of Best Practice
  on Mobile Phone Network Development
source-text: Required for all telecommunications development ... Planning applications and prior notifications
  for mast and antenna development will require a supporting statement setting out the operational need/
  requirements, area of search, details of the proposed structure and technical justification, including
  an analysis of alternative sites and a summary of public consultation that has been undertaken.
must-include:
- item: Operational need/requirements and area of search
  level: must
- item: Details of the proposed structure and technical justification, including an analysis of alternative
    sites
  level: must
- item: A summary of public consultation undertaken
  level: must
- item: Signed declaration that the equipment and installation meets the ICNIRP radio frequency public
    exposure guidelines
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 39 (Telecommunications Development),
  page 44-45.
review-status: unverified
field-status: {}
