reference: heritage-statement
local-authority: WOT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Development within or adjoining a Conservation Area.
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a change of use.
  - site:
      in:
      - scheduled-monument
      - park-and-garden
      description: In or immediately adjacent a scheduled Ancient Monument or a site on the Register of
        Parks and Gardens.
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: Affecting any known or suspected archaeological site.
  - all:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - locally-listed-building
        description: 'Heritage assets: statutory listed buildings or buildings on the council''s Local
          List.'
    - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 16; Worthing Local Plan 2020-2036 (adopted 2023) policies DM23 and DM24; Worthing
  Conservation and Heritage Guide 2023
source-text: 'Required for: All applications for Listed Building Consent. All development within or adjoining
  a Conservation Area (except changes of use) Applications in or immediately adjacent a scheduled Ancient
  Monument or a site on the Register of Parks and Gardens All applications affecting any known or suspected
  archaeological sites. Applications whose scale or nature could impact on heritage assets (designated
  and non- designated i.e statutory listed buildings or those which are on the Council’s Local List'
must-include:
- item: Describes the proposed works or development, including scale, height, construction methods, materials
    and design
  level: must
- item: Analyses the potential impact on the asset's significance, including any loss of or damage to
    key features or its setting
  level: must
- item: Justifies the proposed works, explaining why they are necessary or desirable
  level: must
- item: Explains the measures to minimise or prevent any harm to the heritage asset
  level: must
- item: Describes how the works will preserve, enhance or increase awareness of the heritage asset
  level: must
- item: Explains the rationale for any loss or change to the asset's features or fabric, if necessary
  level: must
- item: Takes account of the Conservation Area Appraisal
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within a designated Conservation Area.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), Other application types and requirement
  22 (Heritage Statement), page 9, 30-32. Whether a proposal's scale or nature could impact on a listed
  or locally listed building is shown as 'check'. Listed building consent applications need a heritage
  statement as a minimum (page 9).
review-status: unverified
field-status: {}
