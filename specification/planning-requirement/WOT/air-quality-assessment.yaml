reference: air-quality-assessment
local-authority: WOT
required-if: discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapters 9 and 15; Worthing Local Plan 2020-2036 (adopted 2023) policies SP3, DM15 and DM22;
  Local Plan Air Quality Inputs (Oct 2024)
source-text: Required where the proposal may potentially have a significant impact on air quality either
  by emitting air quality pollutants, by introducing receptors to areas where there are existing sources
  of air quality pollutants, or by exposing existing receptors to new or increased levels of pollutants.
must-include:
- item: Follows the process on the council's Air Quality and Planning Advice for Developers webpage
  level: must
- item: Evidence that key sources of air pollution in the scheme have been identified and action taken
    to minimise emissions of PM2.5 and its precursors
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 9 (Air Quality Assessment),
  page 19. Shown as 'check' because 'may potentially have a significant impact' is a judgement. In or
  near an Air Quality Management Area, applicants should contact the council's Environmental Health Officer.
