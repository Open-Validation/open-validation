reference: landscaping-plan
local-authority: WOT
required-if:
  any:
  - site:
      in:
      - strategic-allocation
      description: A Strategic Site in the Worthing Local Plan.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: The proposal involves the loss or removal of existing trees.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 15; Worthing Local Plan 2020-2036 (adopted 2023) policy SS1 d) iii); Worthing Landscape
  and Ecology Study (2017)
source-text: 'Required for: All Strategic Sites ... Where development proposals involve the loss or removal
  of existing trees, a proposed landscape scheme should be provided demonstrating replacement tree planting
  on the site ideally on a greater than 1:1 basis or as a minimum demonstrating no net loss of trees.'
must-include:
- item: Landscape Plan with a short statement outlining the soft and hard landscaping
  level: must
- item: Details of ground/soil preparation
  level: must
- item: Arrangements for management and maintenance, and funding arrangements
  level: must
- item: Landscape materials in keeping with the character of the area
  level: must
- item: Replacement tree planting on the site, ideally more than 1:1, or at least no net loss of trees
  level: should
  required-if:
    condition:
      field: loss-of-habitat-features
      value: true
      description: The proposal involves the loss or removal of existing trees.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 25 (Landscaping and Green Infrastructure
  Details), page 34-35. The list says a landscape scheme 'should' be provided where trees are lost or
  removed.
review-status: unverified
field-status: {}
