reference: town-centre-impact-assessment
local-authority: WOT
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main Town Centre Uses outside of town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Leisure and office development exceeding 2,500 sq m of floorspace.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 500
      description: Retail of 500 sq m of floorspace or more.
source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
policy: NPPF Chapter 7; PPG Town Centre and Retail (2014); Worthing Local Plan 2020-2036 (adopted 2023)
  policies DM13 and SS3
source-text: 'A Sequential Test is required for all ‘Main Town Centre Uses’ outside of town centres. An
  Impact Assessment is required where: an application for leisure and office development exceeds 2,500
  sq m of floorspace An application for retail is 500 sqm of floorspace or more'
must-include:
- item: 'Sequential test: whether town centre sites have been considered; justification for an edge or
    out of centre location; scope for flexibility in format and/or scale; evidence that there are no suitable
    sequentially preferable locations'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main Town Centre Uses outside of town centres.
- item: 'Impact assessment: impact on existing, committed and planned public and private investment in
    centres in the catchment, and on town centre vitality and viability, including local consumer choice
    and trade, up to 5 years from submission (10 years for major schemes)'
  level: must
  required-if:
    any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Leisure and office development exceeding 2,500 sq m of floorspace.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 500
        description: Retail of 500 sq m of floorspace or more.
confidence: medium
notes: From the council's list (in effect from 1 April 2026), requirement 40 (Town Centre Uses - Sequential
  Test and Impact Assessment), page 45-46.
review-status: unverified
field-status: {}
