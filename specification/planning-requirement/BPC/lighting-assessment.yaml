reference: lighting-assessment
local-authority: BPC
required-if:
  any:
  - ref: major-development
  - condition:
      field: floodlighting
      value: true
      description: The scheme involves the provision of floodlighting.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements are proposed.
  - discretionary
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: Lighting Assessment For major developments; or schemes involving the provision of floodlighting;
  or where the lighting from the proposal would result in a material impact.
must-include:
- item: A layout plan with beam orientation
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Where illuminated advertisements are proposed, we will need layout plan with beam orientation
    and a schedule of the equipment in the design of the sign and will also need to know when the sign
    is switched on.
- item: A schedule of the equipment in the design of the sign
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: When the sign is switched on
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: low
notes: '"Where the lighting from the proposal would result in a material impact" is shown as officer discretion.
  The advert items are from the advertisement consent checklist. The audit couldn''t read this council''s
  list, so its contents weren''t checked.'
review-status: unverified
field-status: {}
