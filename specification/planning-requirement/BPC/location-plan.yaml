reference: location-plan
local-authority: BPC
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - lbc
    - advertising
    - ldc
    - s73
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: 'Scale: Must be of a scale of 1:1250 (scaled to fit A4 or A3 paper) with a scale bar, north
  pointer and showing a minimum of two named roads and surrounding buildings. … For all applications,
  whether for residential, rural, or commercial developments, it is vital to show the site’s access to
  roads that link to the public highway and that this is included on the plan itself.'
must-include:
- item: Scale of 1:1250 (scaled to fit A4 or A3 paper) with a scale bar and north pointer
  level: must
- item: A minimum of two named roads and surrounding buildings
  level: must
- item: Application site edged clearly with a continuous red line
  level: should
- item: 'Red line includes the entire proposal site: land needed for access, car parking, gardens and
    other outbuildings such as garages'
  level: must
- item: The site's access to roads that link to the public highway
  level: must
- item: Red line includes the pavement to the highway where the proposal needs work to the pavement (for
    example a dropped kerb)
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: The proposal needs work to the pavement, for example a dropped kerb.
- item: Blue line around any other land owned or controlled by the applicant close to or adjoining the
    site
  level: should
- item: 'Complies with copyright law: no Land Registry plans or unlicensed Ordnance Survey maps'
  level: must
confidence: medium
notes: From the council's list (updated October 2026), page 9-10. Appendix 2 (pages 31-37) lists it for
  householder, planning permission, outline, listed building consent, advertisement, lawful development
  certificate and Section 73 applications (at 1:1250 or 1:2500).
review-status: unverified
field-status: {}
