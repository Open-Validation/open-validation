reference: water-impact-assessment
local-authority: BPC
required-if:
  all:
  - site:
      in:
      - nutrient-neutrality-area
      description: In the catchment of the River Avon or Poole Harbour.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A net gain in residential units.
    - condition:
        field: overnight-accommodation
        value: true
        description: 'Other additional overnight accommodation: residential institutions, tourism accommodation,
          specialist housing, or commercial, industrial or employment sites with overnight accommodation.'
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: Conservation of Habitats and Species Regulations 2017
source-text: Development located within the catchment of the River Avon or the Poole Harbour catchment
  and proposes additional overnight accommodation will need to mitigate the impact of such development.
  … The Nutrient Neutrality Statement should include; • details of arrangements for managing wastewater
  and surface water arising from the development; • a nutrient budget calculation for nitrogen made using
  the Natural England nutrient calculator for Poole Harbour (the latest calculator is currently May 2024);
  and • details (including how this mitigation will be delivered and secured in perpetuity) of the mitigation
  proposed to offset nutrient loading.
must-include:
- item: Arrangements for managing wastewater and surface water arising from the development
  level: should
- item: A nutrient budget calculation using the relevant, up-to-date Natural England nutrient calculator
    (River Avon SAC or Poole Harbour; for Poole Harbour a nitrogen budget)
  level: should
- item: The mitigation proposed to offset nutrient loading, including how it will be delivered and secured
    in perpetuity
  level: should
confidence: medium
notes: From the council's list (updated October 2026), page 18-19, 32. The list calls it a 'Nutrient Neutrality
  Statement'. It includes reserved matters, technical details consent and discharge of pre-commencement
  conditions.
review-status: unverified
field-status: {}
