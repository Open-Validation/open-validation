reference: coastal-change-assessment
local-authority: BPC
required-if:
  site:
    in:
    - coastal-erosion-zone
    description: In the Coastal Vulnerability Zone, a Coastal Change Management Area or the Cliff and
      Chine Stability Consultation Zone.
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: BCP Local Plan; Flooding and Coastal Change Background Paper
source-text: Proposals within these above zones must be supported with a Coastal Vulnerability Assessment.
  This comprises and form (see Section 5.4 & Appendix A - ) which must be completed and signed.
must-include:
- item: The council's Coastal Vulnerability Assessment template, completed and signed
  level: must
- item: A Geotechnical Appraisal Report appended, following the requirements in Annex A1, with its declaration
    form
  level: must
  source-text: Please provide a Geotechnical Appraisal Report appended to this Coastal Vulnerability Assessment
    that follow the requirements provided in Annex A1.
confidence: medium
notes: From the council's list (updated October 2026), page 22-23, 43-52. The list's 'Coastal Vulnerability
  Zone (CVZ), Coastal Change Management Area, Cliff and Chine Stability Consultation Zone' entry. A site
  also in a flood risk area needs a Flood Risk Assessment as well. The Geotechnical report listed on page
  25 is part of this assessment.
