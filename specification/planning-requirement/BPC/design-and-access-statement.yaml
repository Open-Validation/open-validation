reference: design-and-access-statement
local-authority: BPC
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Design and Access Statement is required for the below applications; • Major Planning Applications
  • Applications in a Conservation Area AND o 1 or more dwellings o Building(s) with a floor space of
  100sqm or more • Applications for Listed Building Consent
confidence: medium
notes: From the council's list (updated October 2026), page 14.
review-status: unverified
field-status: {}
