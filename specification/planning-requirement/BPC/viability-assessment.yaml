reference: viability-assessment
local-authority: BPC
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more new or additional units of residential accommodation.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: 9 or fewer units on a site of 0.5 hectares or more.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The Affordable Housing Statement says the scheme cannot viably provide affordable housing.
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: Where 10 or more new or additional units of residential accommodation will be created or
  where 9 or less units are proposed and the site area is 0.5 hectares or more. Where it is stated in
  the Affordable Housing Statement that the scheme cannot viably provide affordable housing then the submission
  must be accompanied by a • Viability Assessment. • Payment of the initial appropriate fee for independent
  external assessment.
must-include:
- item: Accompanied by payment of the initial fee for independent external assessment
  level: must
confidence: medium
notes: From the council's list (updated October 2026), page 15. The list calls it 'Viability assessment
  plus payment of external assessor fee'.
review-status: unverified
field-status: {}
