reference: affordable-housing-statement
local-authority: BPC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more new or additional units of residential accommodation.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: 9 or fewer units on a site of 0.5 hectares or more.
  - discretionary
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: Where 10 or more new or additional units of residential accommodation will be created or
  where 9 or less units are proposed and the site area is 0.5 hectares or more, or as set out in the relevant
  local plan.
must-include:
- item: Whether or not the scheme would provide affordable housing
  level: must
- item: On site or as a contribution
  level: must
- item: Mix
  level: must
- item: Tenure
  level: must
- item: 'Where viability is not to be independently assessed or the fee not paid: a statement that the
    applicant understands the proposal would not accord with development plan policies and is likely to
    be considered unfavourably'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The scheme is argued not to be able to viably provide affordable housing.
confidence: medium
notes: From the council's list (updated October 2026), page 15. 'Or as set out in the relevant local plan'
  points to thresholds in the three former area local plans that the list doesn't give, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
