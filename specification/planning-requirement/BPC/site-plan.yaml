reference: site-plan
local-authority: BPC
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - lbc
    - advertising
    - ldc
    - s73
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: 'Block Plan/Site Plan Scale and orientation: Must be a Scale 1:500 or 1:200 accurately showing:
  a) The direction of North b) The proposed development in relation to the site boundaries and other existing
  buildings on the site, with written dimensions to the boundaries c) An accurate and annotated scale
  bar'
must-include:
- item: Scale of 1:500 or 1:200
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions to the boundaries
  level: must
- item: An accurate and annotated scale bar
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site and on adjacent land
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing, where proposed
  level: should
confidence: medium
notes: From the council's list (updated October 2026), page 10-11. Items d) to h) are 'Details to include
  where relevant', so they show as 'should'. Appendix 2 (pages 31-37) lists it for householder, planning
  permission, outline, listed building consent, advertisement, lawful development certificate and Section
  73 applications.
review-status: unverified
field-status: {}
