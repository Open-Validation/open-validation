reference: flood-risk-assessment
local-authority: BPC
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Flood Zone 1 and over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Flood Zone 1 and over 1 hectare.
  - site:
      in:
      - future-flood-risk
      description: Located within the future flood risk zones.
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: National Planning Policy Framework section 14
source-text: If the site is in the; • Environment Agency’s Flood Zone 1 and over 1 ha, or in Flood Zones
  2 or 3 and/or • Located within the future flood risk zones (LINK). … Any FRA should clearly demonstrate
  mitigation measures and link to drainage strategy where appropriate.
must-include:
- item: Mitigation measures, clearly demonstrated
  level: should
- item: Link to the drainage strategy
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (updated October 2026), page 20, 31-37. Appendix 2 adds that for householder
  applications it is proportionate to the scale of the development. The Flooding Sequential Test has no
  matching id and is listed as unmapped.
review-status: unverified
field-status: {}
