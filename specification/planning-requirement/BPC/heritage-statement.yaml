      - listed-building
      - listed-building-setting
      - conservation-area
      - park-and-garden
      - locally-listed-building
      - scheduled-monument
      - archaeological-priority-area
      description: The proposal affects a listed building, conservation area, registered park and garden,
        locally listed building, scheduled monument or archaeological site (including adjacent sites).
  - application-type:
      in:
      - lbc
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: National Planning Policy Framework section 16
source-text: For any proposal affecting a listed building, conservation area, registered park and garden,
  locally listed building, scheduled monument or archaeological site, Historic park and gardens, regardless
  of the type of application (i.e. householder, advertisement, outline, full planning)
