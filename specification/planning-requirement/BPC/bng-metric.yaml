reference: bng-metric
local-authority: BPC
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the general biodiversity gain condition (not exempt).
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: Environment Act 2021; Town and Country Planning Act 1990 Schedule 7A
source-text: The statutory (official) biodiversity metric calculation tool must be used in order to demonstrate
  that you have calculated the number of biodiversity units for existing habitat or habitat enhancements
  in accordance with the statutory biodiversity metric. If your development has to meet mandatory biodiversity
  net gain (BNG) requirements, it will need to use the metric tool.
must-include:
- item: Up-to-date Statutory Biodiversity Metric (or Small Sites Metric where allowed) completed by a
    competent person, except small developments using the Small Sites Metric
  level: must
- item: All existing habitats at baseline, the existing habitats to be retained or enhanced, and any new
    habitats to be created
  level: must
- item: Completed Condition Assessment forms for each existing habitat given a 'condition' in the metric
    (when using the Statutory Biodiversity Metric)
  level: must
- item: Submitted as an Excel document
  level: must
confidence: medium
notes: 'From the council''s list (updated October 2026), page 9, 12-13, 53. Contents from the list''s
  BNG Checklist (page 53). Applies to applications that would be subject to the statutory biodiversity
  gain condition: householder and other exempt applications are exempt by law. The BNG Statement form
  the list asks for with all applications except householder, prior approval and lawful development certificate
  applications, the draft Habitat Management and Monitoring Plan and the Landscape and Ecological Management
  Plan have no matching id and are listed as unmapped.'
