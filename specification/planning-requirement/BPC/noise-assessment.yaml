reference: noise-assessment
local-authority: BPC
required-if:
  all:
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: The development would raise issues of disturbance by noise.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: To the occupants of nearby residential buildings.
    - condition:
        field: noise-sensitive-use
        value: true
        description: The development is noise sensitive.
  - discretionary
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: Where the development would raise issues of disturbance by noise to the occupants of nearby
  residential buildings, and for developments that are noise sensitive
confidence: medium
