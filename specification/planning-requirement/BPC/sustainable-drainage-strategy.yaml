reference: sustainable-drainage-strategy
local-authority: BPC
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: A new building.
    - condition:
        field: footprint-increase
        value: true
        description: Increases the footprint of an existing building.
    - condition:
        field: hard-surfacing
        value: true
        description: Development of car parking and/or any other hard standing or impermeable surface.
  - discretionary
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: 'If the proposal is for a new building, to increase the footprint of an existing building
  and/or the development of car parking and/or any other hard standing/impermeable surface. The information
  submitted should include: • Details of the sustainable urban drainage system, for example, the soakaway
  system to be used • the drainage points and channels / routes shown on an application plans/drawings'
must-include:
- item: Details of the sustainable urban drainage system, for example the soakaway system to be used
  level: should
- item: The drainage points and channels or routes shown on the application plans and drawings
  level: should
- item: A statement giving details of the proposed provision for maintenance
  level: must
- item: Any soakaway at least 5 metres away from the building
  level: must
- item: Details of a drainage system other than soakaways
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (updated October 2026), page 25. The list calls it ''Drainage/SUDS'';
  filed under MHCLG''s retired Sustainable Drainage Strategy id. Within 200m of the cliffs soakaways are
  not suitable and details of a drainage system are needed; there is no field for distance to the cliffs,
  so that item shows as discretionary. Listed under ''Other documents that may be requested during determination
  of the application'', so it is not needed to validate the application: shown as the list''s trigger
  plus ''discretionary'' (only if the officer asks for it).'
review-status: unverified
