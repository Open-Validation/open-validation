source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: Whilst this is only a validation requirement for Mineral and Waste schemes, they are a helpful
  tool for officers in the assessment of planning applications more generally. … A planning statement
  can provide an overview and explanation of a proposal. It can include an assessment of how the proposed
  development accords with relevant national, local and Neighbourhood Plan planning policies.
