reference: town-centre-impact-assessment
local-authority: BPC
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: A main town centre use outside the town centre.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m of gross floorspace.
  - discretionary
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: National Planning Policy Framework section 7
source-text: If the proposal is for a main town centre use outside of the Town Centre use over 2,500m2
  of gross floorspace, an Impact assessment is required. … If the development proposal could harm the
  vitality and viability of existing shopping centres e.g. town centres
must-include:
- item: The impact of the proposal on existing, committed and planned public and private investment in
    a centre or centres in the catchment area of the proposal
  level: should
- item: The impact of the proposal on town centre vitality and viability, including local consumer choice
    and trade in the town centre and the wider retail catchment (as applicable to the scale and nature
    of the scheme)
  level: should
confidence: medium
notes: From the council's list (updated October 2026), page 21, 26. Covers the 'Main Town Centre use impact
  assessment' (page 21) and the 'Retail Impact Assessment' (page 26), which may be requested during determination
  where a proposal could harm existing shopping centres, so that part shows as discretionary.
review-status: unverified
field-status: {}
