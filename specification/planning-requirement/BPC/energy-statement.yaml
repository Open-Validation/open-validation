reference: energy-statement
local-authority: BPC
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: poole
        description: The application falls to be considered under the Poole Local Plan.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: 1,000 sq m of non-residential floor space.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 'Elsewhere: 10 or more dwellings.'
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 'Elsewhere: 1,000 sq m of non-residential floor area.'
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
policy: Poole Local Plan policy PP37
source-text: For applications that fall to be considered under the Poole Local Plan all proposals for
  the creation of new dwellings or 1000m2 of non-commercial floor space. Elsewhere if the proposal is
  for 10 or more dwellings or 1000m2 of non-residential floor area.
must-include:
- item: How the proposal complies with Poole Local Plan policy PP37
  level: should
- item: 'How the proposal would get a proportion of future energy use from renewable sources: at least
    10% for 1-10 homes (net) or under 1,000 sq m (net) commercial floor space; at least 20% for 11 or
    more homes or over 1,000 sq m commercial floor space'
  level: should
- item: Any renewable energy source that is development shown on the plans
  level: must
- item: A BREEAM pre-assessment for non-residential schemes
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: A non-residential scheme.
confidence: medium
notes: From the council's list (updated October 2026), page 18. The list calls it an 'Energy and Resource
  Statement (Poole residential and commercial developments)'. 'Non-commercial floor space' in the Poole
  part is read as non-residential, as in the rest of the entry.
review-status: unverified
field-status: {}
