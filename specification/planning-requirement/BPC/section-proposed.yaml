reference: section-proposed
local-authority: BPC
required-if:
  any:
  - condition:
      field: basement
      value: true
      description: Excavation for a basement.
  - condition:
      field: change-in-ground-levels
      value: true
      description: Excavation is proposed beyond that needed for foundations (for example a swimming pool),
        changing ground levels.
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: Where excavation is proposed (beyond that required for foundations). These must include datum
  points where ground levels are shown. … Provided for schemes including swimming pools. These must be
  dimensioned (1:50 or 1:100) with a scale bar. Where ground levels around the pool are to be changed,
  then a levels plan must be included.
must-include:
- item: Datum points where ground levels are shown
  level: must
- item: Dimensioned, at 1:50 or 1:100, with a scale bar
  level: must
- item: A levels plan where ground levels around a swimming pool are to be changed
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Ground levels around the pool are to be changed.
confidence: medium
notes: From the council's list (updated October 2026), page 11. Covers the list's 'Ground levels, existing
  and proposed (as datum points)' and 'Section Plans'; Appendix 2 asks for 'Ground levels and section
  plans (existing and proposed)' if excavation, for example basements or pools, is proposed.
