confidence: medium
notes: 'From the council''s list (updated October 2026), page 24, 40, 61. The list''s ''Badger, Bat or
  Barn Owl Survey'' and its ''Bat Survey: Validation requirements'' flow chart; Appendix 2 asks for a
  ''Bat survey if criteria is met'' with most application types. Buildings within the Canford Cliffs,
  Lilliput, Branksome Chine, Branksome Woods and Broadstone areas also qualify; there is no field for
  those areas, so that part shows as discretionary. The Planning Application Biodiversity Checklist has
  no matching id and is listed as unmapped.'
