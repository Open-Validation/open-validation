reference: biodiversity-survey-report
local-authority: BPC
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: An existing Dorset Environmental Records Centre (DERC) badger, bat roost or barn owl
        record for the site or a building or structure on it.
  - all:
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of a dwelling, outbuilding (excluding sheds) or other building.
      - condition:
          field: roof-alteration
          value: true
          description: Alters a building's roof or eaves (excluding flat roofs).
      - condition:
          field: external-alterations
          value: true
          description: Alters walls and/or a roof with existing cracks or crevices, or weatherboarding
            or hanging tiles.
    - any:
      - condition:
          field: protected-species
          value: true
          description: The building is in or next to an existing DERC record for bats.
      - condition:
          field: near-woodland
          value: true
          description: Immediately adjacent to woodland.
      - condition:
          field: near-watercourse
          value: true
          description: Immediately adjacent to water.
      - site:
          in:
          - open-space
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: Immediately adjacent to open space such as parks, golf courses, cemeteries, agricultural
            fields and railway embankments, including nationally and locally protected sites (SSSIs, SNCIs,
            Local Nature Reserves).
      - discretionary
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: 'Does the application include any building, or structure in any locality: • with an existing
  Dorset Environmental Records Centre (DERC) badger, bat roost, or barn owl record? • Or, falls within
  the parameters set out in the flow chart in appendix - Bat Survey: Validation requirements … Preliminary
  Roost Assessment (Bat Survey phase 1) is required for validation'
must-include:
- item: Preliminary Roost Assessment (bat survey phase 1)
  level: must
