source-text: To help speed up the processing of planning applications, all householder applications shall
  be submitted with photos of the site and its surroundings.
must-include:
- item: Front, sides and rear elevation of the host building
  level: must
- item: The frontage with both adjacent dwellings or buildings in the shot
  level: must
- item: The rear elevation with both adjacent dwellings or buildings in shot
  level: must
- item: Photo(s) clearly showing the whole rear garden
  level: must
