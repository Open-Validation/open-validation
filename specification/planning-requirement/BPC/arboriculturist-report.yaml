source-text: 'Full planning: An Arboricultural Method Statement (AMS) that follows the guidance set out
  in sections 6 and 7 of BS5837:2012 Trees in relation to design, demolition and construction – Recommendations
  is required.


  Listed building consent: Biodiversity/Ecological Survey and Report Tick Tree Survey/Arboricultural Impact
  Assessment and Method Appraisal Further guidance about the requirements listed above can be found in
  the Planning Advice Note for Applicants/Agents: Information required when submitting an application.


  Demolition in cons area: Risk Assessment Tree Survey/Arboricultural Impact Assessment and Method Appraisal
  Further guidance about the requirements listed above can be found in the Planning Advice Note for Applicants/Agents:
  Information required when submitting an application.


  Works to trees: Photographs Report by a professional arboriculturist or other suitably qualified person
  Tick'
