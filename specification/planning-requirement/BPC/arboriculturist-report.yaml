reference: arboriculturist-report
local-authority: BPC
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: A tree is within falling distance of any proposed work.
  - site:
      in:
      - tree-preservation-zone
      description: There is a Tree Preservation Order.
  - site:
      in:
      - conservation-area
      description: The application site is within a conservation area.
source-url: https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
source-text: If any tree is within falling distance of any proposed work; if there is a Tree Preservation
  Order (TPO); or the application site is within a Conservation Area. An Arboricultural Method Statement
  (AMS) that follows the guidance set out in sections 6 and 7 of BS5837:2012 Trees in relation to design,
  demolition and construction – Recommendations is required.
must-include:
- item: An Arboricultural Method Statement following sections 6 and 7 of BS5837:2012
  level: must
- item: All measures needed to fully protect retained trees from demolition (if applicable) to completion
    of development, including landscaping
  level: must
confidence: medium
notes: From the council's list (updated October 2026), page 22, 31-37. The list calls it 'Tree Survey/
  Arboricultural Impact Assessment/ Method Statement'. Appendix 2 words the trigger as 'if the proposals
  are likely to impact trees (including TPOs), / if the development is within falling distance of a tree'.
review-status: unverified
field-status: {}
