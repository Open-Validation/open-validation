source-text: 'Full planning: would be Community Infrastructure Levy (CIL) Liable, the application will
  also need to include a CIL Additional Information Form (CIL Form 1).


  Lawful development cert: the development Community Infrastructure Levy (CIL) Liable, the scheme would
  be CIL liable, even if it is confirmed to be Permitted Development via the Certificate of Lawfulness
  application.


  Change of use - prior approval: The Community Infrastructure Levy (CIL) Additional Information Form
  and CIL Form 2 are required: For all proposals seeking the creation of new or additional floorspace
  for, or a change of use, to a use that is CIL liable and above the floorspace limits set out below:
  2.16.2.'
