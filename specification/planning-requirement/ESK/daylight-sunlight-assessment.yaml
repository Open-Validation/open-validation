source-text: Although not required for most applications, a Daylight/Sunlight Assessment will also be
  required for situations where the proposed building(s) is of a size, mass, form and/or location that
  is likely to adversely impact upon the current levels of daylight and/or sunlight to habitable rooms
  of adjacent dwellings and/or the private amenity areas located immediately to the rear of the properties.
