reference: arboriculturist-report
local-authority: ESK
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: There are trees on or overhanging the site that could be impacted by the development.
source-url: https://www.eastsuffolk.gov.uk/sites/default/files/2025-12/Local%20Validation%20Guidance%20Chapter%2012.pdf
source-text: 'Full planning: An Arboricultural Assessment and Tree Survey will be required where there
  are trees on or overhanging the site and they could be impacted by the development.


  Variation of condition s73: An arboricultural assessment and tree survey will need to be submitted as
  part of the application.'
must-include:
- item: An Arboricultural Method Statement (tree protection measures, schedules of tree work and long-term
    maintenance proposals)
  level: should
  source-text: An Arboricultural Method Statement should also be provided that sets out the information
    regarding the measures to be taken to protect the trees shown to be retained on the submitted drawings,
    schedules of any necessary tree work, and proposals for long-term maintenance.
