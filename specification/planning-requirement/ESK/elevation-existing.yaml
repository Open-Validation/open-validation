source-text: 'Householder, Change of use - prior approval: and proposed elevations of the dwellinghouse,
  and (ii)the position and dimensions of the proposed windows.


  Full planning: Proposed Floor Plans (existing floorplan drawings will also be required for conversions,
  see further guidance below) A Land Contamination Assessment Phase 1, Tier 1 must be submitted (and in
  cases where contamination risk is identified through the Tier 1, a Tier 2 would also be required).


  Outline: and Proposed Floor Plans Existing and Proposed Roof Plans (where works are proposed to the
  roof) Proposals that include the provision of renewable energy equipment and/or air conditioning equipment
  will need to include details on the Proposed Elevational drawings, and Proposed Block Plan/Site Layout
  Plan as applicable, as outlined in Solar Power, air source heat pumps, Biomass Boilers and other renewables.


  Lawful development cert: and building floor plans should also be submitted, annotated to show the existing
  uses.


  Variation of condition s73: require the elevations and floorplans for plot 3, and there would be no
  requirement for the elevations or floor plans for other plots within the scheme unless they are also
  changing and there would be no need for a revised block plan etc unless the position or footprint of
  the building were also proposed to be altered.


  Non-material amendment: o Proposed Floor Plans (if the external elevations are changing e.g. altering
  the size of location of a door, this will also alter the floor plans) Please note: submitted plans must
  be drawn to scale, and a photograph of a plan is not acceptable, as the process results in the photograph
  showing an image which is not at the same scale as that stated in the image.'
