source-text: 'Householder, Change of use - prior approval: expected on Block Plan/Site Layout Plans and
  Elevational Plans is not provided in the above regulations but is provided at a local level.


  Full planning: and Proposed Block Plan/Site Layout Plans – the proposed version can be indicative if
  an application for outline planning permission, but will need to be the actual proposal if an application
  for full planning permission - If the application is for full planning permission, Elevational Plans
  will be required.


  Outline: and Proposed Block Plan/Site Layout Plans (if the scheme includes the formation of a new access
  or alterations to an existing details of this will need to be shown on the block plan, along with the
  parking arrangements) - Proposed Elevational Plans (except for outline applications) (and existing elevational
  drawings will also be required for conversions, see further guidance below) - Proposed Streetscene(s),
  showing any ground level changes and with any existing dwellings on either side to provi


  Advertisement consent: on the block plan and/or the to scale drawings of the advertisements/signs.


  Lawful development cert: However, a to scale block plan would still be required and in such cases the
  photographs would need to be fully annotated with full accurate dimensions of the outbuilding in metric.


  Variation of condition s73: a revised block plan etc unless the position or footprint of the building
  were also proposed to be altered.'
