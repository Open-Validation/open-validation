reference: recreation-facilities-assessment
local-authority: ESK
required-if:
  any:
  - site:
      in:
      - open-space
      description: Development on open space, in public or private ownership.
  - condition:
      field: loss-of-open-space
      value: true
      description: The proposal would result in the loss of open space.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: A residential development of 5 or more dwellings.
  - discretionary
source-url: https://www.eastsuffolk.gov.uk/sites/default/files/2025-12/Local%20Validation%20Guidance%20Chapter%206.pdf
source-text: facilities An Open Space Assessment would be required if the proposal would result in the
  loss or creation of open space, and/or a residential development of 5 or more dwellings which is likely
  to generate demand for access to and use of open space and recreation facilities and/or development
  on open space, whether that is in public or private ownership.
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The creation of open
