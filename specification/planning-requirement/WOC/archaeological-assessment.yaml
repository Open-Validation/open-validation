reference: archaeological-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - notice-trees-in-con-area
  - any:
    - site:
        in:
        - scheduled-monument
        description: Affects a Scheduled Ancient Monument.
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP6 and SWDP24
source-text: A Desk-based Assessment will be required where an initial assessment indicates the proposed
  development affects an archaeologically sensitive area (including a Scheduled Ancient Monument or non-designated
  sites of archaeological interest). … A Field Evaluation Report will be required where the Desk-based
  Assessment demonstrates information that suggests further evaluation of the site is required prior to
  the determination of the application before being submitted.
must-include:
- item: A Field Evaluation Report where the desk-based assessment shows further evaluation is needed
  level: must
  required-if: discretionary
- item: Evaluation carried out by an appropriate and qualified professional
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 12-13. Figure 7 (pages 58-61) 'may be required'
  for Householder, Full PP & COU, Outline, Reserved Matters, Listed Building Consent, Works to trees in
  a conservation area or subject to a TPO. Whether a site is 'archaeologically sensitive' follows an initial
  assessment and can be checked with the Conservation Team, so apart from Scheduled Monuments it shows
  as discretionary.
review-status: unverified
field-status: {}
