  notes: 'Grokbot''s link is the council''s current list (Local Validation Document, November 2022, still
    linked from the ''Making a planning application'' page). The extraction misses five local requirements
    (Glint and Glare, Employment Site Assessment, Retail Impact, Water Management, Ventilation/Extraction),
    records Householder as having no local requirements, puts nearly everything under Full planning even
    though the document has an application-type matrix, and has several triggers copied from the wrong
    section. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
