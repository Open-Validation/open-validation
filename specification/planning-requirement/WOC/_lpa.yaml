  status: outdated
submission-standards:
- item: Apply online via the Planning Portal where possible; otherwise supply electronically produced
    documentation
  level: should
- item: Maximum single file size 10 MB; maximum 25 MB for all documents together
  level: must
- item: PDF is the recommended file format
  level: should
- item: Drawings specify the printing page size for the scale, are correctly orientated for on-screen
    display, and include a scale bar and key dimensions
  level: must
- item: Location and site plans have a north point
  level: must
- item: Documents and drawings have a meaningful title and date, with drawings given a unique plan reference;
    revised versions clearly named to show the change
  level: must
- item: Scanned documents at least 200 dpi (black and white) or 100 dpi (colour)
  level: must
- item: Photographs in PDF format and no larger than 15 cm x 10 cm
  level: must
- item: Plans and drawings must not contain the phrase 'Do not scale' or similar disclaimers
  level: must
- item: Plans at an appropriate metric scale (1:50, 1:100, 1:200 or 1:500), with linear scale bars, dated
    and showing the original paper size
  level: must
- item: Plans A4 or A3 wherever possible
  level: should
- item: Information clear enough not to be compromised when scanned (faint lines are unacceptable)
  level: must
- item: No personal details (names) on drawings
  level: should
- item: Plans taken from the council's mapping web pages (with the council watermark or licence number)
    are not accepted
  level: must
audit:
