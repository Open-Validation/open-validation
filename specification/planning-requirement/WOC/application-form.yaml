    58 … Introduction This document is designed to help ensure that your application is valid when we
    receive it and the application contains the minimum amount of information necessary to determine the
    application. The document relates to the current planning policies applicable to Worcester City Council
    and aims to explain why the relevant supporting information is necessary and what it should contain.
    The checklist is set out into two main parts: Part One sets out the national list of requirements
    which are mandatory for all planning applications. Part Two sets out Worcester City Council’s local
    list Above all, the checklist aims to: • assist in ensuring that your application is valid when submitted;
    • ensure that all applications can be dealt with effectively and efficiently; • respond positively
    to best practice advice issued by government; and, • ensure that Worcester City Council complies with
    legislation in relation to planning applications. It is recommended that the content of technical
    documents supporting your application be informed by pre-application discussions with us, and by reference
    to our planning policies and guidance, particularly Supplementary Planning Documents. The content
    and detail of the supporting information we require should be proportionate to the scale of the development.
    If you are in any doubt about this, please do talk to us further before preparing and submitting your
    application or contact the team via email at planning@worcester.gov.uk If the information required
    is not submitted with your application, it will not be valid, and therefore will not progress towards
    a decision. Before submitting your application Please read this document carefully before completing
    your application form and submitting your application. If you intend to apply for large-scale development
    or for a complex proposal, or if you are in any doubt about a specific issue, you should agree these
    matters with us through our pre-application advice service. Information on the pre- application advice
    service provided by the Council is viewable at Planning Advice - Worcester City Council Please remember
    also that planning permission, listed building and advertisement consents may not be the only permissions
    or consents you need from Worcester City Council. Other consents include building regulations, licensing,
    and food safety. More information on these and other consents and services of the Council are available
    on our website www.worcester.gov.uk … Once you have submitted your application Upon receipt of your
    application, we will crosscheck the information submitted against national planning application requirements,
    together with Worcester City Council’s local requirements, as set out in this document. If all the
    required information is included, your application will be “valid’’ and it will then progress towards
    a decision. If your application is invalid (because you have submitted insufficient information or
    an incorrect application fee), we will write to you to tell you what you need to do to make it valid
    and would request information is submitted to planning@worcester.gov.uk. You must then submit the
    required information in a timely manner to ensure that your application can progress to a decision.
    If, within 28 days, you do not provide us with the information we require, we will not be able to
    deal with your application and it will be treated as Withdrawn. Thereafter, if you wish to progress
    with your plans you will need to submit your application to us again as we do not keep any documents
    relating to Withdrawn applications. Our Local Validation Checklist has been the subject of a six-week
    public and stakeholder consultation period. All responses received have been fully considered and
    taken into account before adopting the checklist. Part One: National Validation Requirements Applicants
    are encouraged to apply online via the Planning Portal. Where this is not possible Applicants should
    apply direct to the Council and supply documentation which has been produced electronically. This
    applies whether the application is made on-line or a paper application is submitted. . This facilitates
    the transfer of information to consultees and for the public to view planning proposals on-line with
    the greatest efficiency. It would be appreciated if the scale of the plans and paper size is no larger
    than is required to illustrate the proposals. It is advised that where possible use A3 drawings and
    avoid multiple images on larger sizes. Standards for online submissions The national standards for
    on-line submission of electronic planning documents are as follows: • Maximum single file size is
    10 Mbytes; • Maximum 25 Mbytes file size (the sum of all document file sizes). Where these maxima
    are exceeded, please contact the Development Management Section to discuss alternative file transfer.
    • Portable Document Format (PDF) is the recommended file format to ensure that they are accessible
    to consultees; • All drawings shall specify the printing page size for which the scale applies; •
    All drawings shall be correctly orientated for on-screen display • All drawings shall include a scale
    bar and key dimensions; • All drawings that include location plans or site plans to have a ‘north
    point’ • All documents and drawings shall be given a meaningful title and dated with drawings given
    a unique plan reference. For example: Block • Plan drawing v1A.pdf or Design and access statement
    28102013.pdf. • Scanned documents must be a minimum of 200 dots per inch (dpi) resolution for black
    and white and 100 dpi for colour; • All photographs in PDF file format and no larger than 15 cm x
    10 cm … In addition: • Updated or revised versions of plans or documents should be clearly named to
    show a change so that the new documents can be easily identified when uploaded. For example, Block
    Plan drawing v1B.pdf or Design and Access Statement 30102013.pdf. • Plans and drawings must not contain
    the phrase ‘Do not scale’. Guidance for ensuring plan quality The drawings must- whether hand drawn
    or using computer aided design software be of sufficient standard for us to administer the application
    sufficiently and for members of the public as well as consultees to understand the scheme being proposed.
    This relies on clarity and quality of the drawing but all the necessary technical information to be
    relayed. As a minimum, plan should have the following: • Always date and include the original paper
    size, scale bar, at least one key dimension and North sign, where appropriate, on plans and drawings
    • Clear and legible drawing style which reflects the proposed building and changes • Each plan titled
    to reflect the content and whether existing or proposed • The scale of the drawing clearly shown Other
    suggestions It is preferred that the materials used and proposed within the scheme are labelled for
    clarity. Photographs are often useful in aiding context and understanding of the site. These can be
    annotated or titled to show what they are demonstrating, and how they support the application. On
    schemes for heritage sites and where applicable other schemes, it can be useful to use colour coding
    to explain changes in the built form and/or to reflect changes. Often, this is best supported by relevant
    labelling. Further suggestions regarding what should be included to support your application is set
    out in Part Three of this document. … Information Required – National Planning Application Requirements
    i. Completed form • Including a signed ownership and agricultural holdings certificate (either A,
    B, C or D) and declaration Where Ownership Certificates B, C or D have been completed Evidence of
    notice as required by Article 13 of the Town and Country Planning (Development Management Procedure)
    (England) Order 2015'
