reference: viability-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
  - any:
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The applicant proposes that the full range of policy requirements cannot be provided
          for viability reasons.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Affordable housing below policy requirements for viability reasons.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP7, SWDP15 and SWDP62; Developer Contributions
  SPD (2018)
source-text: In instances where an applicant is proposing that they cannot provide the full range of policy
  requirements (including affordable housing), as meeting such requirements would render the proposal
  not economically viable.
must-include:
- item: Enough evidence to assess the scheme in line with RICS practice and the NPPF
  level: must
- item: A quantity surveyor's cost assessment
  level: must
- item: Market evidence of sales rates and site values
  level: must
- item: A development and sales programme (if relevant)
  level: must
- item: Details of any exceptional development costs
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 38. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline. The applicant pays for the council's independent review.
review-status: unverified
field-status: {}
