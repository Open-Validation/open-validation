reference: flood-risk-assessment
local-authority: WOC
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - flood-risk-zone
          description: Development in Flood Zones 2 and 3.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: 'In Flood Zone 1: sites of 1 hectare or more.'
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: 'In Flood Zone 1: sites of 1 hectare or more.'
      - site:
          in:
          - critical-drainage-area
          description: Land identified by the Environment Agency as having critical drainage problems.
      - site:
          in:
          - future-flood-risk
          description: Land identified in a strategic flood risk assessment as being at increased flood
            risk in future.
      - all:
        - condition:
            field: more-vulnerable-use-change
            value: true
            description: Development would introduce a more vulnerable use.
        - discretionary
  - all:
    - application-type:
        in:
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
    - site:
        in:
        - flood-risk-zone
        description: In a flood zone.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP28
source-text: 'In line with footnote 55, page 48 of the NPPF (2021), a Flood Risk Assessment is required
  when: • A site-specific flood risk assessment should be provided for all development in Flood Zones
  2 and 3. • In Flood Zone 1, an assessment should accompany all proposals involving: sites of 1 hectare
  or more; land which has been identified by the Environment Agency as having critical drainage problems;
  • land identified in a strategic flood risk assessment as being at increased flood risk in future; or
  land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use.'
must-include:
- item: Information showing the development complies with the sequential and exception tests, where they
    apply
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 17-18. Figure 7 (pages 58-61) marks it
  required for Householder, Full PP & COU, Outline, Reserved Matters and 'may be required' for Prior Approval
  for COU Part 3. Figure 7 says 'Y if in relevant flood zone'. Land 'that may be subject to other sources
  of flooding' has no field, so that part shows as discretionary. Minor development and changes of use
  are not subject to the sequential or exception tests but still need an FRA.
review-status: unverified
field-status: {}
