reference: sustainable-drainage-strategy
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
  - condition:
      field: drainage-alterations
      value: true
      description: The development results in waste or surface water to be drained.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP29 and SWDP30
source-text: For all applications that result in waste or surface water to be drained.
must-include:
- item: That site drainage and runoff will be managed sustainably, mimicking the natural drainage network
  level: must
- item: How the drainage system protects water quality and secures long-term maintenance
  level: should
- item: 'For housing: water consumption, to show compliance with SWDP30'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing proposals.
