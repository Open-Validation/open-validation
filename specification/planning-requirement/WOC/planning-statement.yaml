reference: planning-statement
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - condition:
        field: departure-from-development-plan
        value: true
        description: Development contrary to the development plan policies.
    - ref: major-development
    - site:
        in:
        - green-belt
        description: Development within the Green Belt.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016
source-text: Planning Statement setting out comments in support of proposals can be submitted with any
  planning application. A statement will be required when an application proposes development contrary
  to the development plan policies, for all major applications (including change of use), and development
  within the Green Belt.
must-include:
- item: Why the proposal complies with relevant development plan policies or, if not, why permission should
    be granted contrary to them
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 30. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline, Reserved Matters. Major applications include major changes of use.
review-status: unverified
field-status: {}
