reference: travel-plan
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: Residential developments of 50 dwellings or more (mandatory, with Personalised Travel
          Planning).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 'Major development: 10 or more dwellings (SWDP4).'
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: 'Major development: more than 1,000 sq. metres of non-residential floorspace (SWDP4).'
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP4
source-text: The provision of a Travel Plan, including Personalised Travel Planning is mandatory for all
  residential developments of 50 dwellings or more. … SWDP policy SWDP4 states that Travel Plans will
  be required for all major development – that is for planning applications proposing 10 or more dwellings
  or more than 1,000 sq. metres of non- residential building floorspace.
must-include:
- item: Measures to reduce car travel and encourage cycling, walking and public transport, with agreed
    targets and monitoring
  level: must
- item: 'For town centre developments: how the needs of alternative powered vehicles have been considered'
  level: must
  required-if:
    site:
      in:
      - town-centre
      description: A town centre development.
confidence: medium
notes: From the council's list (published November 2022), page 35-36. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline. Developments under 50 dwellings produce a 'Welcome Pack' instead, and there
  are no Local Highway Authority travel planning requirements for five or fewer dwellings. A Travel Plan
  is also needed with every Transport Assessment, so that part shows as discretionary.
review-status: unverified
field-status: {}
