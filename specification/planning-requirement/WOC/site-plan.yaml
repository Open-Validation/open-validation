source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed block plan at a scale of 1:200 or 1:500
must-include:
- item: Scale 1:200 or 1:500, with the direction of north and a linear scale bar
  level: must
- item: Existing structures, boundary treatments, trees etc. on the site
  level: must
- item: 'Proposed: the development in relation to the site boundaries and other existing buildings, and
    any adjacent buildings, roads or footpaths'
  level: must
- item: Any trees or hedges affected by the development
  level: must
- item: Any new boundary walls or fencing
  level: must
- item: Existing or proposed parking areas and any other hard surfacing
  level: must
- item: Visibility splays (if appropriate)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published November 2022), page 9. Figure 7 (pages 58-61) marks it required
  for Householder, Full PP & COU, Outline, Reserved Matters, Telecommunications, Advert Consent, LDC Existing,
  LDC Proposed, Non-material Amendment, Removal or Variation of condition, Discharge of conditions, Prior
  Approval of larger home extensions & additional storeys, Prior notification Agricultural or Forestry,
  Prior Approval for COU Part 3, Demolition in a Cons. Area and 'may be required' for Listed Building
  Consent. Figure 7 also has 'Existing site plan' and 'Proposed site plan' rows for most of the same types;
  the text describes an 'Existing and proposed block plan'.
