reference: elevation-existing
local-authority: WOC
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - pa-ecomms-network
        - advertising
        - ldc-existing-use
        - ldc-prospective-use
        - non-material-amendment
        - s73
    - condition:
        field: building-works
        value: true
        description: Extensions, external alterations or new buildings.
  - application-type:
      in:
      - pa-storey
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: a) Existing and proposed elevations at a scale of 1:50 or 1:100 Required for any extensions,
  external alterations, or new buildings.
must-include:
- item: Scale 1:50 or 1:100
  level: must
- item: All existing and proposed elevations affected shown and labelled (e.g. North Elevation), including
    blank elevations
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors
  level: should
- item: Semi-detached or terraced properties shown as such
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 9. Figure 7 (pages 58-61) marks it required
  for Householder, Full PP & COU, Telecommunications, Advert Consent, LDC Existing, LDC Proposed, Non-material
  Amendment, Removal or Variation of condition, Prior Approval of larger home extensions & additional
  storeys and 'may be required' for Listed Building Consent. For prior approval it is needed 'when there
  are additional storeys only'.
review-status: unverified
field-status: {}
