reference: energy-statement
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: New development over 100 sq. metres gross.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more dwellings.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP27
source-text: With planning applications for new development over 100 sq. metres gross, or one or more
  dwellings.
must-include:
- item: How the development meets SWDP Policy 27 and incorporates renewable and low carbon energy facilities
    to generate at least 10% of predicted energy requirements
  level: must
- item: 'Full and reserved matters applications: evidence of predicted regulated energy use and the energy
    generated by the renewable/low carbon measures'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'Outline applications: a broad explanation of how SWDP27 will be met'
  level: should
  required-if:
    application-type:
      in:
      - outline
- item: Evidence of considering a decentralised energy and heating network, or why it is not practical
    or viable
  level: should
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: 100 or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 10000
        description: Non-residential development of more than 10,000 sq. metres.
- item: If the 10% requirement is not met, why, with evidence (e.g. a Viability Assessment)
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 16. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Reserved Matters. Figure 7 leaves outline grey, but the text says what an outline
  application's Energy Statement should contain, so outline is included.
review-status: unverified
field-status: {}
