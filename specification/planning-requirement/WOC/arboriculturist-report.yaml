reference: arboriculturist-report
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on the site, or on adjacent land that could influence or be influenced by the
          development or matter to local landscape character.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedges on or next to the site that could influence or be influenced by the development.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP22
source-text: with applications where there are trees/hedges on the proposed development site; and/ or
  • with applications when there are trees or hedges on land adjacent to the proposed development site
  that could influence or be influenced by the proposed development or be important as part of the local
  landscape character. Please note- this includes householder schemes
must-include:
- item: Produced in line with BS5837:2012, showing how tree constraints are incorporated into the design
    and how retained trees will be kept undamaged
  level: must
- item: 'Tree survey drawing and schedule: species, size, age, condition, useful life expectancy and quality
    category'
  level: must
- item: Arboricultural Constraints Plan showing Root Protection Areas and above- and below-ground constraints
  level: must
- item: Tree Protection Plan by an arboriculturist
  level: must
- item: Arboricultural Method Statement
  level: must
- item: Photographs of the tree and its setting, where the tree is on private land or not publicly accessible
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published November 2022), page 36-37. Figure 7 (pages 58-61) 'may be required'
  for Householder, Full PP & COU, Outline. The list's 'Tree Survey/Arboricultural Statement'.
review-status: unverified
field-status: {}
