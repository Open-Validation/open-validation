reference: biodiversity-survey-report
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - national-nature-reserve
        - local-wildlife-site
        - local-nature-reserve
        description: Development that would affect a site designated for its biodiversity or geological
          value.
    - condition:
        field: protected-species
        value: true
        description: Likely to have an impact on wildlife and biodiversity (e.g. protected species).
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP5 and SWDP22; Natural Environment and
  Rural Communities Act 2006, section 40
source-text: 'Appropriate ecological information should be provided with applications that: - • propose
  development that would affect a site designated for its biodiversity or geological value; or • propose
  development that is likely to have an impact on wildlife and biodiversity.'
must-include:
- item: Habitat surveys by suitably qualified ecologists at the appropriate time of year
  level: must
- item: Habitats, features and species present or likely, their extent, and a plan of their distribution
    and use
  level: must
- item: Direct and indirect impacts during and after construction on designated sites, priority habitats,
    geological features and protected/notable species
  level: must
- item: Where harm is likely, how alternatives, avoidance, mitigation and compensation have been considered
  level: should
- item: Proposed enhancement works and likely changes to habitats or species numbers (net loss or gain)
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 25-26. Figure 7 (pages 58-61) marks it
  required for Householder and 'may be required' for Full PP & COU, Outline, Reserved Matters. For householders
  Figure 7 says 'Y if relevant ecology on the site'. The list's 'Nature Conservation/Ecological Information'.
  Its examples (barn conversions, demolition, roof spaces, removal of mature trees, orchards, scrub and
  hedgerows, development near waterbodies) and Figure 1 (page 41) set out when surveys are needed, so
  beyond designated sites and protected species it shows as discretionary. The list predates mandatory
  biodiversity net gain and has no BNG requirement.
review-status: unverified
field-status: {}
