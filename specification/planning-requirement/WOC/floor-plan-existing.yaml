reference: floor-plan-existing
local-authority: WOC
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - pa-ecomms-network
        - advertising
        - ldc-existing-use
        - ldc-prospective-use
        - non-material-amendment
        - s73
    - condition:
        field: building-works
        value: true
        description: Extensions or new buildings.
  - application-type:
      in:
      - pa-extension
      - pa-storey
      - pa-build-agri-forest
      - pa-road-agri-forest
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: b) Existing and proposed floor plans at a scale of 1:50 or 1:100 Required for any extensions
  or new buildings.
must-include:
- item: Scale 1:50 or 1:100
  level: must
- item: All existing and proposed uses of rooms and any additional floor space
  level: should
- item: Buildings or walls to be demolished clearly shown
  level: should
- item: New buildings shown in relation to adjacent buildings
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 9-10. Figure 7 (pages 58-61) marks it required
  for Householder, Full PP & COU, Telecommunications, Advert Consent, LDC Existing, LDC Proposed, Non-material
  Amendment, Removal or Variation of condition, Prior Approval of larger home extensions & additional
  storeys, Prior notification Agricultural or Forestry, Prior Approval for COU Part 3 and 'may be required'
  for Listed Building Consent.
review-status: unverified
field-status: {}
