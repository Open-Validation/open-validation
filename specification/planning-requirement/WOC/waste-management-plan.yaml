policy: SWDP33
source-text: 'Refuse storage and collection details Policy Drivers South Worcestershire Development Plan
  2016 Policy SWDP33 National Planning Policy Framework When required New dwellings including apartments
  schemes, change of use applications, retail, and industrial development What is required For residential
  units Storage areas for individual waste bins should consider the following criteria: Waste bins should
  be accommodated within the curtilage of each property and should not be stored on the highway.'
