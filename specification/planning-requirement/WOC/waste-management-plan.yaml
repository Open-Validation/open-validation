reference: waste-management-plan
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings, including apartment schemes.
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use applications.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 0
        description: Retail development.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 0
        description: Industrial development.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP33
source-text: New dwellings including apartments schemes, change of use applications, retail, and industrial
  development
must-include:
- item: 'Residential: bin storage within each property''s curtilage (not on the highway), identified on
    plans with hard-standing collection points, no more than 20 metres from the external door'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential units.
- item: 'Residential: collection crews moving 2-wheeled bins no more than 15 metres at gradients of no
    more than 1 in 12, or a risk assessment for collection points where kerbside collection is not available'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential units.
- item: Capacity and safe storage for refuse and recycling containers at the collection area
  level: must
- item: Access arrangements and the distance for the refuse lorry to the collection area
  level: must
- item: Refuse collection details for commercial activity
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 0
        description: Retail development.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 0
        description: Industrial development.
confidence: medium
notes: From the council's list (published November 2022), page 30-31. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Reserved Matters. The list's 'Refuse storage and collection details'; Appendix 5
  (pages 51-56) gives container and storage specifications.
review-status: unverified
field-status: {}
