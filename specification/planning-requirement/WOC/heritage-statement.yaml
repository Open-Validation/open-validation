reference: heritage-statement
local-authority: WOC
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - reserved-matters
        - advertising
        - demolition-con-area
    - any:
      - site:
          in:
          - scheduled-monument
          - listed-building
          - listed-building-setting
          - park-and-garden
          - battlefield
          - conservation-area
          - locally-listed-building
          description: Affects the significance (including setting) of a scheduled monument, listed building,
            registered park and garden, registered battlefield, conservation area or locally listed building.
      - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP6 and SWDP24
source-text: Any planning application or application seeking listed building consent which affects the
  significance of a designated or non-designated heritage asset, including its setting.
must-include:
- item: A Historic Environment Record search
  level: must
- item: Identification and description of all heritage assets that may be affected, with an assessment
    of their significance going beyond quoting the list description or HER entry
  level: must
- item: The impact of the development on the heritage asset(s) and their setting
  level: must
- item: A mitigation strategy where necessary
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 20-22. Figure 7 (pages 58-61) marks it
  required for Listed Building Consent and 'may be required' for Full PP & COU, Reserved Matters, Advert
  Consent, Demolition in a Cons. Area. Other non-designated heritage assets, including sites of archaeological
  interest, have no field, so the rule also shows as discretionary.
review-status: unverified
field-status: {}
