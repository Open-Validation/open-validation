source-text: Therefore, we require every application that requires a Heritage Statement to include a Historic
  Environment Record search. 20 Local Validation Document - November 2022 The Heritage Statement should
  include the following as a minimum. a) identify and describe the heritage asset Identify and describe
  all the heritage assets that may be affected by the proposed development, with an assessment of their
  heritage significance.
