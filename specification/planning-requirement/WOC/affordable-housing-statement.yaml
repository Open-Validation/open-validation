reference: affordable-housing-statement
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP15
source-text: Where a development plan policy (having regard to national planning policy guidance) requires
  the provision of affordable housing or a contribution in lieu of affordable housing on a particular
  site.
must-include:
- item: Number of residential units, mix of units and proposed tenure, for the affordable and the open
    market housing
  level: must
- item: Any different levels or types of affordability or tenure clearly and fully explained
  level: should
- item: Where a financial contribution in lieu is proposed, that proposal and why it is acceptable
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 11. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline, Reserved Matters. The list does not give the SWDP15 thresholds, so it shows
  as discretionary.
