reference: lighting-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - reserved-matters
  - any:
    - all:
      - condition:
          field: external-lighting
          value: true
          description: Artificial external lighting.
      - discretionary
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP21 and SWDP25
source-text: 'With applications that propose development including artificial external lighting that may:
  - • materially alter light levels outside the application site; or • affect residential amenities, impact
  on visual amenities, highway/ railway safety or natural environment Also, a Lighting Assessment will
  be required with all planning application proposing floodlighting.'
must-include:
- item: Details of the external lighting and the hours it will be switched on
  level: must
- item: A lighting layout plan with beam orientation and a schedule of the equipment
  level: must
- item: Lighting levels and how the lighting may affect local amenity, intrinsically dark landscapes,
    nature conservation and highway/railway safety
  level: must
- item: Vertical illuminance and luminaire intensity at the nearest sensitive receptors, with reference
    to ILP Guidance Note 01/20
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 25. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Reserved Matters. Whether lighting 'may' alter light levels or affect amenity is
  a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
