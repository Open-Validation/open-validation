  extensions & additional storeys, Prior Approval for COU Part 3, Demolition in a Cons. Area and 'may
  be required' for Listed Building Consent. A simple roof plan may be combined with the proposed block
  plan. Figure 7 has one 'Roof plans' row (existing and proposed).
