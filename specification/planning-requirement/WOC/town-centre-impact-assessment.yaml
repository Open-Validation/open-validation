reference: town-centre-impact-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in a centre identified under SWDP10 (including retail or
        leisure over 1,000 sq. metres net outside those centres).
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP10
source-text: 'Such assessments are required with any planning application proposing: • any development
  for main town centre use (see definition in NPPF) that is not in a centre identified under policy SWDP10;
  or • any retail or leisure development with over 1,000 sq. metres (net) of new floorspace and on sites
  outside the centres defined under SWDP policy 10.'
must-include:
- item: Compliance with the sequential test (NPPF)
  level: must
- item: That the scale of development is appropriate to the location
  level: must
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Retail or leisure development of over 1,000 sq. metres.
- item: Impact on town centre vitality and viability up to five years ahead (ten for major schemes), including
    the cumulative impact of built or permitted schemes
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Retail or leisure development of over 1,000 sq. metres.
confidence: medium
notes: From the council's list (published November 2022), page 31. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline. The list's 'Retail and Centres Impact Assessment'.
review-status: unverified
field-status: {}
