reference: daylight-sunlight-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: storey-count
          operator: '>='
          value: 3
          description: New buildings with three or more storeys (an example).
      - condition:
          field: adjoins-residential-property
          value: true
          description: On a site adjoining or near existing residential properties.
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP21
source-text: With planning applications where there is a potential adverse impact upon the current levels
  of sunlight/daylighting enjoyed by adjoining properties and building(s). For example, for development
  proposals of new buildings with three or more storeys on sites adjoining or near existing residential
  properties.
must-include:
- item: Follows the BRE guide 'Site layout planning for daylight and sunlight'
  level: should
confidence: medium
notes: From the council's list (published November 2022), page 13. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline, Reserved Matters. A 'potential adverse impact' is a judgement and the three-storey
  case is an example, so it also shows as discretionary.
review-status: unverified
field-status: {}
