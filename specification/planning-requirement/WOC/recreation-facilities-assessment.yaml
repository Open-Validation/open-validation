reference: recreation-facilities-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: The proposal would lose recreational buildings or land, without an improved or equivalent
          replacement facility, and is not for recreational and/or community purposes related to that
          use.
    - condition:
        field: affects-playing-field
        value: true
        description: Likely to prejudice the use, or lead to the loss of use, of land being used as a
          playing field.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP38; Sport England Playing Fields Policy
source-text: 'An Open Space Assessment will therefore be required with all applications that propose the
  loss of recreational buildings or land and where: - • an improved or an equivalent replacement facility
  is not proposed; or • the development is not for recreational and/or community purposes related to the
  use of the open space or recreational buildings. If it is likely to prejudice the use, or lead to the
  loss of use, of land being used as a playing field'
must-include:
- item: The impact of the development on the need for recreational facilities and open space around the
    site
  level: must
- item: 'Where playing fields change or are lost: a written statement of the Sport England Playing Pitch
    Policy exceptions that apply, with supporting information'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Changes to or loss of playing fields.
confidence: medium
notes: From the council's list (published November 2022), page 28-29. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline, Reserved Matters. The list's 'Open Space/Recreational Facilities Assessment'.
review-status: unverified
field-status: {}
