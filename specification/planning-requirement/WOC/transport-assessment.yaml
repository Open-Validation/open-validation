reference: transport-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 50
        description: 'Dwelling houses: more than 50 units (Transport Statement; more than 80, Transport
          Assessment).'
    - condition:
        field: departure-from-development-plan
        value: true
        description: Development not in conformity with the adopted development plan.
    - condition:
        field: traffic-movements-peak-hour
        operator: '>='
        value: 30
        description: 30 or more two-way vehicle movements in any hour.
    - condition:
        field: traffic-movements-daily
        operator: '>='
        value: 100
        description: 100 or more two-way vehicle movements per day.
    - condition:
        field: parking-spaces
        operator: '>='
        value: 100
        description: 100 or more parking spaces.
    - site:
        in:
        - air-quality-management-area
        description: Within or adjacent to an Air Quality Management Area.
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP4 and SWDP21; Worcestershire Local Transport
  Plan 4 – Streetscape Design Guide
source-text: 'The Worcestershire Local Transport Plan 4 – Streetscape Design Guide sets out thresholds
  for when a Transport Assessment (TA) or Transport Statement (TS) will normally be required. These are
  as follows: - … In addition to the above development thresholds, other considerations for when a Transport
  Assessment is required are set out below. Any development that is not in conformity with the adopted
  development plan. Any development generating 30 or more two-way vehicle movements in any hour. • Any
  development generating 100 or more two-way vehicle movements per day. • Any development proposing 100
  or more parking spaces. • Any development that is likely to increase accidents or conflicts among motorised
  users and non-motorised users, particularly vulnerable road users such as children, disabled and elderly
  people. • Any development generating significant freight or HGV movements per day, or significant abnormal
  loads per year. • Any development proposed in a location where the local transport infrastructure is
  inadequate. – for example, substandard roads, poor pedestrian/cycle facilities and inadequate public
  transport provisions. • Any development proposed in a location within or adjacent to an Air Quality
  Management Area (AQMA).'
must-include:
- item: Prepared in line with the NPPF and the PPG 'Travel Plans, Transport Assessments and Statements'
  level: must
- item: A Travel Plan with every Transport Assessment
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 34-35. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline. The thresholds table (page 34) sets a Transport Statement / Transport Assessment
  above set sizes for each use (e.g. dwelling houses >50 / >80 units, B2 >2,500 / >4,000 sqm GFA, B8 >3,000
  / >5,000 sqm, hotels >75 / >100 bedrooms, food retail >250 / >800 sqm); only the dwellings figure has
  a field. The other uses, accident risk, significant freight or HGV movements and inadequate local infrastructure
  show as discretionary.
review-status: unverified
field-status: {}
