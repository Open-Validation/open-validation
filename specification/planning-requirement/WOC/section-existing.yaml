reference: section-existing
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - pa-ecomms-network
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: Significant remodelling of the land profile or a change in site levels.
    - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: d) Site survey and finished floor level plans Where the development involves significant
  remodelling of land profile or a change in site levels is proposed. Alternatively, any application which
  could potentially impact, through varying levels, on residential amenity.
must-include:
- item: Drawings at 1:50, 1:100 or 1:200 showing a cross section through the proposed building or site
  level: must
- item: Existing and finished levels (contours, spot levels or cross or long sections as appropriate)
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 10. Figure 7 (pages 58-61) marks it required
  for Householder, Full PP & COU, Outline, Reserved Matters, Telecommunications and 'may be required'
  for Listed Building Consent. Figure 7's 'Site Survey and Finished Floor Level Plans'. Any application
  that 'could potentially impact, through varying levels, on residential amenity' also needs them, which
  is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
