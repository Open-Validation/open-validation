source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location plan at a scale of 1:1250 or 1:2500
must-include:
- item: Scale 1:1250 or 1:2500, with a linear scale bar
  level: must
- item: Up-to-date and Ordnance Survey based, showing the direction of North and two road names if possible
  level: must
- item: A red outline around the application site and all land necessary to carry out the development
    (e.g. access from a public highway), which does not distort the boundary or make it illegible
  level: must
- item: A blue outline around other land owned by the applicant
  level: must
- item: Covers a large enough area for the location to be easily found
  level: must
- item: Not a Land Registry document unless accompanied by proof of purchase
  level: must
- item: OS copyright and licence number shown on an Ordnance Survey based plan
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 8. Figure 7 (pages 58-61) marks it required
  for Householder, Full PP & COU, Outline, Reserved Matters, Listed Building Consent, Telecommunications,
  Advert Consent, LDC Existing, LDC Proposed, Non-material Amendment, Removal or Variation of condition,
  Discharge of conditions, Prior Approval of larger home extensions & additional storeys, Prior notification
  Agricultural or Forestry, Prior Approval for COU Part 3, Demolition in a Cons. Area, Works to trees
  in a conservation area or subject to a TPO, Works to trees subject to a TPO.
review-status: unverified
