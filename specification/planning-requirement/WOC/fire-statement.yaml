reference: fire-statement
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A fire statement is necessary when the proposed development would contain two or more dwellings
  or educational accommodation and meet the height condition of 18m or more in height, or seven or more
  storeys.
confidence: medium
notes: From the council's list (published November 2022), page 9. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline, Reserved Matters.
review-status: unverified
field-status: {}
