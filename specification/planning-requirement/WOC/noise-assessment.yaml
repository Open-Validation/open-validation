reference: noise-assessment
local-authority: WOC
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - reserved-matters
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: 'New development that may create additional noise: industrial (B2) uses, HGV turning/loading/unloading
            areas, noisy external plant and equipment, or user noise outside daylight hours.'
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: In an area where noise sensitive development (homes, hostels, hotels) already exists.
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: New noise sensitive development (homes, hostels, hotels).
      - discretionary
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP31; Noise Policy Statement for England
source-text: 'Noise Assessments will be required to be provided with planning applications proposing:
  - new development that may create additional noise in areas where noise sensitive development already
  exists; and • new noise sensitive development in areas that already experiences significant noise levels.
  In this regard, development that may create additional noise would include: - • development in which
  industrial (Use Class B2 uses) would take place; • development that incorporates HGV turning, loading,
  and unloading areas (such as large retail developments); • development that incorporates external plant
  and equipment that generates noise; • development that may result in noise associated with the users
  of the proposal, particular outside daylight hours e.g., night clubs, event venues. Noise sensitive
  development will include residential properties, hostels, and hotels.'
must-include:
- item: Undertaken by a suitably competent and qualified acoustician
  level: must
- item: Baseline monitoring
  level: must
- item: Predictions (supported by source data)
  level: must
- item: Full details and specification of mitigation
  level: must
- item: An assessment of the potential impact on residential receptors in accordance with current standards
    (BS8233:2014, BS4142:2014+A1:2019 where appropriate)
  level: must
confidence: medium
notes: From the council's list (published November 2022), page 27. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Reserved Matters. The list's 'Noise Impact Assessment'. Whether an area 'already
  experiences significant noise levels' has no field, so that part shows as discretionary.
review-status: unverified
field-status: {}
