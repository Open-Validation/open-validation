reference: telecommunications-report
local-authority: WOC
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development.
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP26
source-text: All applications proposing telecommunications development, including applications for prior
  approval under part 24 of the Town and Country Planning (General Permitted Development) Order).
must-include:
- item: A statement/declaration that the proposal, when operational, will meet the ICNIRP guidelines
  level: must
- item: For new base stations on non-established telecoms sites, a list of alternative sites considered
  level: must
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new base station on a non-established telecoms site.
- item: 'Full planning applications: evidence of consultation with local schools and day nurseries'
  level: must
  required-if:
    application-type:
      in:
      - full
confidence: medium
notes: From the council's list (published November 2022), page 33. Figure 7 (pages 58-61) 'may be required'
  for Full PP & COU, Outline. Figure 7 leaves the Telecommunications column grey, but the text includes
  prior approval applications, so those are shown too. The section ends with a bare heading 'Photographs/Photomontages'
  and no wording.
review-status: unverified
field-status: {}
