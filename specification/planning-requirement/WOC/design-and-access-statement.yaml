reference: design-and-access-statement
local-authority: WOC
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.worcester.gov.uk/component/fileman/?view=file&routed=1&name=Local%20Validation%20Document%20-%20Nov%202022%20Final%20version.pdf&folder=PDF%20Documents%2FPlanning%2FPlanning%20Advice&container=fileman-files
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'Required for: • Applications for major development, as defined in article 2 of the Town
  and Country Planning (Development Management Procedure (England) Order 2015; • Applications for development
  in a conservation area where the proposed development consists of: - one or more dwellings; or - a building
  or buildings with a floor space of 100 square metres or more. • Applications for listed building consent.
  • Applications to amend the conditions attached to a planning permission do not need to be accompanied
  by a Design and Access Statement.'
confidence: medium
notes: From the council's list (published November 2022), page 8. Figure 7 (pages 58-61) marks it required
  for Full PP & COU, Outline, Reserved Matters, Listed Building Consent. Material changes of use and engineering
  operations do not need one, nor do applications to amend conditions.
review-status: unverified
field-status: {}
