reference: sustainable-drainage-strategy
local-authority: DAR
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - source-protection-zone
      description: Any development in a Source Protection Zone.
  - condition:
      field: footprint-increase
      value: true
      description: The development increases site coverage with buildings.
  - condition:
      field: hard-surfacing
      value: true
      description: The development increases site coverage with hard surfaces.
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policies M2 and M4
source-text: Major development; any development in a Source Protection Zone; developments that will increase
  site coverage with buildings and hard surfaces
confidence: medium
notes: 'From the council''s list (published July 2026), Table 2 (local requirements), page 7. The list''s
  footnote 1 defines major development as 10 or more dwellings (or a site of 0.5 ha or more if the number
  is unknown), or 1,000 sq m of floorspace or a site of 1 ha for other uses: the national definition,
  so it is shown as major-development. The separate ''Foul Sewage and Surface Water Drainage Strategy''
  (page 4) has no id (see DAR-unmapped.csv).'
