source-text: Major developments where there is a potential adverse impact upon the current levels of sunlight/
  daylight enjoyed by adjoining properties, including associated gardens or amenity space; applications
  where the application site itself is subject to potential adverse impact from adjoining buildings or
  features or where one part of the development is affected by another part of the same development
confidence: medium
