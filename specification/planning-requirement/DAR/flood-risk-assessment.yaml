reference: flood-risk-assessment
local-authority: DAR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Any development in Flood Zones 2 & 3.
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Sites over 1 hectare in Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Sites over 1 hectare in Zone 1.
  - condition:
      field: near-watercourse
      value: true
      description: Sites near rivers, lakes, or other water features.
  - site:
      in:
      - critical-drainage-area
      description: Areas with critical drainage problems.
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policy M4
source-text: Any development in Flood Zones 2 & 3, as defined by Environment Agency and set out in the
  EA standing advice Sites over 1 hectare in Zone 1; Sites near rivers, lakes, or other water features;
  areas with critical drainage problems
must-include:
- item: Identification of Flood Zone 3b where relevant
  level: must
  source-text: Flood Risk Assessment to include identification of Food Zone 3b where relevant
confidence: medium
notes: From the council's list (published July 2026), Table 2 (local requirements), page 4. The list's
  'Food Zone 3b' is read as Flood Zone 3b.
review-status: unverified
field-status: {}
