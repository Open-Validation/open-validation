reference: town-centre-impact-assessment
local-authority: DAR
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside the network of Retail Centres (Table 10 Dartford Local Plan) on the Policies
        Map.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 0
      description: A net gain in floorspace dedicated to main town centre uses.
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policy M18
source-text: Outside of the network of Retail Centres (Table 10 Dartford Local Plan) on the Policies Map
  a sequential site assessment is required for proposals for a net gain in floorspace that is dedicated
  to main town centre uses. Proposed gains of 280sqm and more floorspace proposed to be main town centre
  uses outside of the network of Retail centres must also be accompanied by a full retail impact assessment.
must-include:
- item: A sequential site assessment
  level: must
- item: A full retail impact assessment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 280
      description: Gains of 280 sq m or more of main town centre use floorspace.
  source-text: Proposed gains of 280sqm and more floorspace proposed to be main town centre uses outside
    of the network of Retail centres must also be accompanied by a full retail impact assessment.
- item: Produced consistent with government guidance
  level: should
  source-text: Assessments should be produced consistent with government guidance.
confidence: medium
notes: From the council's list (published July 2026), Table 2 (local requirements), page 7. Listed as
  'Town Centre Uses/Retail Sequential Test and Retail Impact Assessment'. The separate Bluewater retail
  or leisure impact assessment (policy M21) is in DAR-unmapped.csv, as there is no field for the Bluewater
  location.
review-status: unverified
field-status: {}
