reference: bng-metric
local-authority: DAR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Not exempt from the biodiversity gain condition (Schedule 7A, Town and Country Planning
      Act 1990).
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Schedule 7A, Town and Country Planning Act 1990; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 as amended; Adopted Dartford Local Plan Policy M14
source-text: Applications that are not exempt from the requirement for a biodiversity gain condition under
  Schedule 7A (Biodiversity Gain in England) of the Town and Country Planning Act 1990 (as amended). Except
  where Statutory Biodiversity Credits are proposed.
must-include:
- item: The completed biodiversity metric calculation tool or tools showing the calculation of the biodiversity
    value of the onsite habitat, and the biodiversity value or values
  level: must
- item: The publication date of the biodiversity metric calculation tool or tools used
  level: must
- item: Complete, showing both baseline and post completion calculations (indicative if outline)
  level: must
confidence: medium
notes: From the council's list (published July 2026), Table 1 (national requirements) and Table 2 (local
  requirements), page 2-3. Table 1 lists the national BNG information (items a-d); Table 2 asks for the
  complete metric with baseline and post-completion figures. Not needed where Statutory Biodiversity Credits
  are proposed (no field for this exception).
review-status: unverified
field-status: {}
