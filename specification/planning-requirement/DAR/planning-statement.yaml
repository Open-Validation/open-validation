  - discretionary
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Wide range of adopted Dartford Local Plan Polices
source-text: Major developments which raise a wide range of planning issues, including justification of
  “very special circumstances” regarding Green Belt
must-include:
- item: Justification of very special circumstances, for Green Belt development
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: In the Green Belt.
confidence: medium
notes: 'From the council''s list (published July 2026), Table 2 (local requirements), page 6. The list''s
  footnote 1 defines major development as 10 or more dwellings (or a site of 0.5 ha or more if the number
  is unknown), or 1,000 sq m of floorspace or a site of 1 ha for other uses: the national definition,
  so it is shown as major-development. Whether a major development ''raises a wide range of planning issues''
  is a judgement, so that part is discretionary.'
