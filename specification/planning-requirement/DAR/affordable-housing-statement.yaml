reference: affordable-housing-statement
local-authority: DAR
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: Residential development of 15 or more dwellings.
    - condition:
        field: outside-urban-area
        value: false
        description: In the urban area.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Ten or more dwellings.
    - any:
      - condition:
          field: outside-urban-area
          value: true
          description: Located south of the A2 (outside the urban area).
      - site:
          in:
          - green-belt
          description: Within the Green Belt.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Any residential development of 0.5 ha or more.
  - condition:
      field: affordable-housing-led
      value: true
      description: A site proposed and justified in principle on the basis of delivering dwellings that
        are all rented affordable housing meeting priority local requirements.
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policy M7
source-text: Residential development of 15 or more dwellings in the urban area; ten or more dwellings
  located south of the A2 and/or within the Green Belt; any residential development of 0.5ha or more in
  size or; any site proposed and justified in principle on the basis of delivering dwellings that are
  all rented affordable housing meeting priority local requirements.
confidence: medium
notes: From the council's list (published July 2026), Table 2 (local requirements), page 3. The list sets
  the urban area against land south of the A2, so 'south of the A2' is shown as outside the urban area.
  Housing-only thresholds, so only residential site area.
review-status: unverified
field-status: {}
