reference: affordable-housing-statement
local-authority: DAR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Residential development of 15 or more dwellings in the urban area.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Ten or more dwellings.
    - site:
        in:
        - green-belt
        description: Located south of the A2 and/or within the Green Belt.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Any residential development of 0.5ha or more in size.
  - discretionary
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Dartford Local Plan Policy M7
source-text: Affordable Housing Statement Adopted Dartford Local Plan Policy M7 Residential development
  of 15 or more dwellings in the urban area; ten or more dwellings located south of the A2 and/or within
  the Green Belt; any residential development of 0.5ha or more in size or; any site proposed and justified
  in principle on the basis of delivering dwellings that are all rented affordable housing meeting priority
  local requirements.
confidence: medium
notes: '"South of the A2" can''t be expressed as a designation, so 10+ dwellings there is only caught
  through the Green Belt branch. Sites justified as all rented affordable housing are shown as officer
  discretion.'
review-status: unverified
field-status: {}
