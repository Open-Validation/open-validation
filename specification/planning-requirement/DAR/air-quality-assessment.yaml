required-if:
  any:
  - ref: major-development
  - site:
      in:
      - air-quality-management-area
      description: Within or adjacent to an Air Quality Management Area.
  - discretionary
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policy M2
source-text: Major developments and other potentially polluting and traffic generating development or
  for developments within or adjacent to an Air Quality Management Area.
confidence: medium
notes: 'From the council''s list (published July 2026), Table 2 (local requirements), page 3. The list''s
  footnote 1 defines major development as 10 or more dwellings (or a site of 0.5 ha or more if the number
  is unknown), or 1,000 sq m of floorspace or a site of 1 ha for other uses: the national definition,
  so it is shown as major-development. ''Other potentially polluting and traffic generating development''
  has no threshold, so it is shown as discretionary.'
