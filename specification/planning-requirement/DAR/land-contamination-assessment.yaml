reference: land-contamination-assessment
local-authority: DAR
required-if:
  any:
  - discretionary
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
    - any:
      - site:
          in:
          - near-landfill-site
          description: Within 250m of a former landfill site.
      - site:
          in:
          - contaminated-land
          description: Within 250m of other potentially contaminated land.
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policy M2
source-text: Any redevelopment in relevant locations, in particular where the proposed use is sensitive;
  residential development if the site is within 250m of a former landfill site or other potentially contaminated
  land
must-include:
- item: Usually a desktop assessment; an investigation in particularly sensitive areas such as former
    landfill sites
  level: must
  source-text: (usually desktop. Investigation in particularly sensitive areas such as former landfill
    sites)
confidence: medium
notes: From the council's list (published July 2026), Table 2 (local requirements), page 5. 'Redevelopment
  in relevant locations' names no locations, so it is shown as discretionary. Gas from landfill sites
  (within 50m) is a separate requirement with no id (see DAR-unmapped.csv).
review-status: unverified
field-status: {}
