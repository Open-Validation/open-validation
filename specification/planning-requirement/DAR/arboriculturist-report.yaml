reference: arboriculturist-report
local-authority: DAR
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Existing trees/hedgerows which may be affected by development or construction activity.
  - site:
      in:
      - ancient-woodland
      description: Within 30 metres of the stem of any tree within Ancient Woodland.
  - condition:
      field: veteran-trees
      value: true
      description: Within 30 metres of the stem of a tree likely to be categorised as a veteran tree.
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policies M1 and M14
source-text: Development of sites where there are existing trees/hedgerows which may be affected by development
  or construction activity will be within 30 metres of the stem of any tree within Ancient Woodland or
  likely to be categorised as a veteran tree
confidence: medium
notes: From the council's list (published July 2026), Table 2 (local requirements), page 8. Listed as
  'Tree Survey and Arboricultural Implications Report'.
review-status: unverified
field-status: {}
