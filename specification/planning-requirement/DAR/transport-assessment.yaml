reference: transport-assessment
local-authority: DAR
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policies M15 and M16
source-text: A Transport Statement is required for smaller developments which are likely to generate vehicle
  movements which may have a significant impact on the local road network or surrounding area. E.g. schools
  and nurseries and some community uses including places of worship. ... A Transport Assessment is usually
  required for major developments but a Transport Statement may be acceptable as an alternative subject
  to agreement with the highway authority(s).
must-include:
- item: Sufficient information for an assessment of the highways and traffic impact of the development
    to be made
  level: must
  source-text: This should include sufficient information such that an assessment as to the highways and
    traffic impact arising from the proposed development can be made and, where required, a parking management
    plan.
- item: A parking management plan, where required
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published July 2026), Table 2 (local requirements), page 8. The list''s
  footnote 1 defines major development as 10 or more dwellings (or a site of 0.5 ha or more if the number
  is unknown), or 1,000 sq m of floorspace or a site of 1 ha for other uses: the national definition,
  so it is shown as major-development. Smaller developments ''likely to generate vehicle movements which
  may have a significant impact'' have no threshold, so they are shown as discretionary.'
review-status: unverified
field-status: {}
