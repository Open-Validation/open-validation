reference: biodiversity-survey-report
local-authority: DAR
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - site-of-special-scientific-interest
      description: In a Site of Special Scientific Interest (SSSI) and/or within a 200m buffer.
  - site:
      in:
      - special-protection-area
      description: In a Special Protection Area (SPA).
  - site:
      in:
      - special-area-of-conservation
      description: In a Special Area of Conservation (SAC).
  - condition:
      field: protected-species
      value: true
      description: Protected species are likely to be found.
  - discretionary
source-url: https://www.dartford.gov.uk/downloads/file/2857/local-list-of-validation-requirements-for-planning-applications
policy: Adopted Dartford Local Plan Policy M14
source-text: Major developments; non-major developments in a site of Special Scientific Interest (SSSI)
  and/or within a 200m buffer; in a Special Protection Area (SPA); in Special Area of Conservation (SAC)
  or any other relevant or sensitive locations or where protected species are likely to be found.
confidence: medium
notes: 'From the council''s list (published July 2026), Table 2 (local requirements), page 3. The list''s
  footnote 1 defines major development as 10 or more dwellings (or a site of 0.5 ha or more if the number
  is unknown), or 1,000 sq m of floorspace or a site of 1 ha for other uses: the national definition,
  so it is shown as major-development. ''Any other relevant or sensitive locations'' is shown as discretionary.'
review-status: unverified
