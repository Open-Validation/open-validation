reference: waste-management-plan
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New retail, commercial or agricultural development.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: All applications for new residential or retail/commercial/agricultural development.
must-include:
- item: 'Where bin stores are needed: location, elevations and materials of a bin store suitable for wheeled
    or euro bins'
  level: must
- item: 'Bin stores designed and sited to minimise impact: inside the building or behind the building
    line where possible'
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 21 (Refuse Disposal
  Details), page 17.
review-status: unverified
field-status: {}
