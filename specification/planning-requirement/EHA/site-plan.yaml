reference: site-plan
local-authority: EHA
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Other plans or drawings necessary to describe the subject of the application including:
  Block plan (scale 1:500 or 1:200) – to show the footprint of the proposal and detailing any changes
  to the existing boundary treatment.'
must-include:
- item: Scale 1:500 or 1:200
  level: must
- item: Footprint of the proposal
  level: must
- item: Any changes to the existing boundary treatment
  level: must
- item: Written dimensions to boundaries
  level: must
  required-if: discretionary
  source-text: Written dimensions to boundaries are required in some circumstances to assist with the
    understanding of the development and its relationship to neighbouring properties.
- item: Dimensions of the distance of the proposal to key boundaries (householder applications)
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Dimensions of the distance of the proposal to key boundaries on the block plan (householder
    applications only).
- item: Proposed block plan includes neighbouring properties
  level: must
  source-text: Proposed block plans should include neighbouring properties.
- item: Existing and proposed block plans include any existing outbuildings
  level: must
  source-text: Existing and proposed block plans should include any existing outbuildings.
confidence: medium
notes: From the council's list (published May 2024), Part I (National Requirements) and Part II (Local
  Requirements) item 2 (Additional Plans), page 5-6. The list calls it a block plan. Written dimensions
  to boundaries show as discretionary because they are needed only 'in some circumstances'.
