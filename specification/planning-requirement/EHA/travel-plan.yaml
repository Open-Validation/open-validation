reference: travel-plan
local-authority: EHA
required-if:
  any:
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 1000
      description: Food and non-food retail, including extensions, creating 1,000 sq m or more gross floorspace.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Other leisure uses F1(e), F2(b), F2(c) and F2(d) (excluding stadia) of 1,000 sq m or
        more gross floorspace.
  - condition:
      field: office-floorspace
      operator: '>='
      value: 2500
      description: E(g) floorspace of 2,500 sq m or more.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: B2 floorspace of 2,500 sq m or more.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 2500
      description: B8 floorspace of 2,500 sq m or more.
  - condition:
      field: floorspace
      operator: '>='
      value: 2500
      description: Higher and further education establishments of 2,500 sq m or more gross floorspace.
  - discretionary
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: 'All planning applications for: Food and non-food retail, including extensions, where the
  gross floorspace created is greater than 1,000m2 or more Cinema and conference facilities Other leisure
  F1(e), F2(b), F2(c) and F2(d) uses (excluding stadia) where the gross floorspace is 1000m2 or more E(g),
  B2, B8 floorspace and higher and further education establishments, where the gross floorspace is 2500m2
  or more, Stadia of 1500 or more seats, Other service developments such as hospitals, and Smaller traffic
  attracting developments in rural areas.'
must-include:
- item: A draft travel plan with a package of measures to widen travel choices by all modes and cut unnecessary
    car use
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 26, page 20. Cinemas,
  conference facilities, stadia and hospitals have no field yet, and 'smaller traffic attracting developments
  in rural areas' is a judgement, so they show as discretionary.
review-status: unverified
field-status: {}
