reference: elevation-proposed
local-authority: EHA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the outside of a building.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevations (scale 1:100 or 1:50) – as necessary to clearly show the
  proposed works in relation to what is already there.
must-include:
- item: Scale 1:100 or 1:50
  level: must
- item: Where a proposed elevation adjoins or is close to another building, the relationship between the
    two buildings
  level: should
- item: Measurements of the proposal (width, depth, ridge height, eaves) (householder applications)
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Measurements (width, depth, ridge height, eaves) of the proposal on the elevation plans
    (householder applications only).
- item: 'For larger home extension prior notifications and householder lawful development certificates:
    states that proposed materials match the existing'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
      - ldc-prospective-use
  source-text: Elevation plans for Prior Notification for larger homes proposals and Householder Lawful
    Development Certificate applications should specify that proposed materials match the existing.
confidence: medium
notes: From the council's list (published May 2024), Part I (National Requirements) and Part II (Local
  Requirements) item 2 (Additional Plans), page 5-6.
review-status: unverified
field-status: {}
