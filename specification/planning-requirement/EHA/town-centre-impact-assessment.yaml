reference: town-centre-impact-assessment
local-authority: EHA
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Main town centre uses (as defined in the NPPF) not in an existing centre.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with an up-to-date Local Plan.
  - all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m of retail, leisure and/or office development outside town centres.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with an up-to-date Local Plan.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: Applications for main town centre uses as defined in the NPPF that are not in an existing
  centre and are not in accordance with an up-to-date Local Plan Applications for over 2,500 m2 of retail,
  leisure and/or office development outside town centres, which are not in accordance with an up-to-date
  Local Plan.
must-include:
- item: A sequential assessment (main town centre uses not in an existing centre)
  level: must
- item: An impact assessment (over 2,500 sq m of retail, leisure and/or office development outside town
    centres)
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 sq m outside town centres.
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 24 (Town Centre
  Uses Statement), page 18.
review-status: unverified
field-status: {}
