reference: flood-risk-assessment
local-authority: EHA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development proposals (including extensions) in Flood Zones 2 and 3.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.easthants.gov.uk/media/4751/download?inline
source-text: Flood Risk Assessment All development proposals (including extensions), in Flood Zones 2
  and 3 … Flood Risk Assessment Where the condition relates to a flooding issue, including levels
must-include:
- item: The risks of all forms of flooding to and from the development, identified and assessed
  level: should
- item: How these flood risks will be managed, taking climate change into account
  level: should
confidence: medium
notes: For s73 applications, only where the condition relates to a flooding issue. The workbook's other
  rows had no trigger.
review-status: unverified
field-status: {}
