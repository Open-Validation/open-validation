reference: flood-risk-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site area of more than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site area of more than 1 hectare.
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3 (all development, including extensions).
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use to a more vulnerable use class (e.g. commercial to residential).
    - discretionary
  - site:
      in:
      - critical-drainage-area
      description: In an area with critical drainage problems notified by the Environment Agency.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: Development proposals with a site area of more than 1 hectare in Flood Zone 1 All development
  proposals (including extensions), in Flood Zones 2 and 3 Sites of less than 1 ha in flood zone 1 where
  the proposed development includes the change of use to a more vulnerable Use Class (for example from
  commercial to residential), where they could be affected by sources of flooding other than rivers and
  the sea (for example ground water, surface water, drains or reservoirs). Sites in an area within flood
  zone 1 which has critical drainage problems as notified by the Environment Agency (currently the Environment
  Agency has not designated any “areas with critical drainage problems” in East Hampshire District).
must-include:
- item: Risks of all forms of flooding to and from the development identified and assessed
  level: should
- item: How the flood risks will be managed, taking climate change into account
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 11, page 12. A
  change of use to a more vulnerable use shows as discretionary because it depends on whether the site
  could be affected by other sources of flooding.
review-status: unverified
field-status: {}
