reference: affordable-housing-statement
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Ten or more additional dwellings.
  - condition:
      field: rural-exception-housing
      value: true
      description: The application is for rural exceptions housing.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: 'East Hampshire District Local Plan: Joint Core Strategy (2014) policies CP13 and CP14'
source-text: All sites which result in ten or more additional dwellings; All planning applications for
  “rural exceptions” housing
must-include:
- item: The number of additional units
  level: must
- item: How the requirements of Joint Core Strategy policies CP13 or CP14 are to be met
  level: must
- item: Plans showing the location of all affordable units and their number of habitable rooms and/or
    bedrooms and/or floor space
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
  source-text: Plans showing the location of all affordable units and their number of habitable rooms
    and/or bedrooms and/or the floor space of the affordable units (not required for outline applications)
- item: A clear and full explanation where different levels or types of affordability or tenure are proposed
    for different units
  level: must
- item: Details of any Registered Providers acting as partners in the development
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 3, page 6-7.
review-status: unverified
field-status: {}
