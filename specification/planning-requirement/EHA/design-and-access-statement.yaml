reference: design-and-access-statement
local-authority: EHA
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 100
          description: More than 100 sq m of non-residential floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Article 3A, Planning (Listed Buildings and Conservation Areas) Regulations 1990
source-text: 'A Design and Access Statement must accompany applications for both outline and full planning
  permission for: Major development: 10 or more dwellings or creation in excess of 1000 sq m of non-residential
  floor space; The provision of one or more dwellings or creation in excess of 100 sq m of non-residential
  floor space in a conservation area. Applications for listed building consent'
confidence: medium
notes: From the council's list (published May 2024), Part I (National Requirements), page 4.
review-status: unverified
field-status: {}
