reference: lighting-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: External lighting for sports pitches, maneges, car parks or garage forecourts.
  - all:
    - ref: major-development
    - condition:
        field: outside-urban-area
        value: true
        description: Residential or commercial development in the countryside.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: 'All applications for: External lighting systems associated with sports pitches, maneges,
  car parks and garage forecourts Any major residential or commercial development in the countryside'
must-include:
- item: Technical specification
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Schedule of equipment
  level: must
- item: Intended hours of illumination
  level: must
- item: Sky glow (%) and source intensity, with measurements in lux
  level: must
- item: Prepared by a recognised independent consultant
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 15, page 14.
review-status: unverified
field-status: {}
