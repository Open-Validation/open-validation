reference: heritage-statement
local-authority: EHA
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: Potential to affect the significance (including the setting) of a known heritage asset.
  - site:
      in:
      - archaeological-priority-area
      description: In an area of archaeological potential.
  - all:
    - ref: major-development
    - site:
        in:
        - conservation-area
        description: In or immediately adjacent to a conservation area.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: 'East Hampshire District Local Plan: Second Review (saved policies) policies HE4 to HE19'
source-text: Where an application has the potential to affect the significance (including the setting)
  of affects a known heritage asset or is in an area of archaeological potential and for major developments
  in or immediately adjacent to a conservation area
must-include:
- item: Level of detail proportionate to the assets' importance
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 12, page 13. See
  the council's Heritage Statement Guidance.
review-status: unverified
field-status: {}
