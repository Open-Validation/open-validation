reference: heritage-statement
local-authority: EHA
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - archaeological-priority-area
      description: The application could affect the significance (including the setting) of a known heritage
        asset, or is in an area of archaeological potential.
  - all:
    - ref: major-development
    - site:
        in:
        - conservation-area
        description: Major development in or immediately adjacent to a conservation area.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: Householder applications in a conservation area.
