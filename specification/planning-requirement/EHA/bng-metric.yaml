reference: bng-metric
local-authority: EHA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition (not exempt).
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications for planning permission, unless exempt, must deliver 10% biodiversity net gain
  over the pre-development value of the site. Applications must provide all of the minimum information
  set out in set out in in Article 7 ... including: ... a completed statutory biodiversity metric'
must-include:
- item: Completed by a competent person with specialist knowledge of habitat types and conditions, such
    as an ecologist
  level: should
confidence: medium
notes: 'From the council''s list (published May 2024), Part I (National Requirements), page 5. Uses the
  biodiversity gain condition: householder and other exempt applications are exempt by law. If you think
  the site is exempt, submit a statement explaining why. The list also asks for a Biodiversity Statement
  explaining how the mitigation hierarchy was followed (not an MHCLG id, so recorded as unmapped).'
review-status: unverified
field-status: {}
