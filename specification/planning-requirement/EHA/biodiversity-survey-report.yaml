reference: biodiversity-survey-report
local-authority: EHA
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Likely to adversely impact an internationally, nationally or locally designated nature
        conservation site (SAC, SPA, SSSI, Local Nature Reserve or SINC).
  - site:
      in:
      - priority-habitat
      description: Likely to adversely impact a priority habitat type.
  - condition:
      field: protected-species
      value: true
      description: Protected and/or notable species may be present and adversely impacted.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: 'East Hampshire District Local Plan: Joint Core Strategy (2014) policy CP21'
source-text: 'A Preliminary Ecological Appraisal, Ecological Impact Assessment and/or Species specific
  surveys will be required for: Any application likely to adversely impact an internationally, nationally
  or locally designated nature conservation site e.g. Special Area of Conservation (SAC), Special Protection
  Area (SPA), Site of Special Scientific Interest (SSSI), Local Nature Reserve (LNR) and/or a Site of
  Interest for Nature Conservation (SINC); Any application likely to adversely impact a priority habitat
  ... Any application where there is potential for protected and/or notable ... to be present and adversely
  impacted by the proposal.'
must-include:
- item: Preliminary Ecological Appraisal (PEA) where the Biodiversity Checklist or other sources indicate
    biodiversity features may be present and impacted
  level: must
- item: Ecological Impact Assessment and further species surveys where the PEA finds habitats of conservation
    significance in the zone of influence, or protected or notable species likely to be adversely affected
  level: must
  required-if: discretionary
- item: How the mitigation hierarchy has been applied, with any mitigation, compensation and enhancement
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 7A (Ecological
  Assessment), page 8-9. The further assessment and surveys show as discretionary because they depend
  on what the PEA finds. The council's Biodiversity Checklist helps set the scope (recorded as unmapped).
review-status: unverified
field-status: {}
