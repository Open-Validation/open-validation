reference: air-quality-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 100
      description: More than 100 dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 10000
      description: More than 10,000 sq m of new floorspace.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of Use Class B2 floorspace.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 300
      description: More than 300 new parking spaces.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: Development in excess of 100 dwellings or 10,000m2 new floor space Development falling within
  Use Class B2 with floor space of 1000m2+ Where > 300 new parking spaces are proposed.
must-include:
- item: Predicted concentration of pollutants of concern at appropriate dates and sensitive locations
  level: should
- item: Predicted change in air quality and the spatial impact of the change
  level: should
- item: Measures to prevent or minimise impact, where significant impacts or increased exposures are likely
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 5, page 8. Assessments
  should be proportionate to the risk posed by the development.
review-status: unverified
field-status: {}
