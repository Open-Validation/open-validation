reference: arboriculturist-report
local-authority: EHA
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: New building work within 15 metres of a tree subject to a tree preservation order,
        on the site or on adjoining land.
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The development is within 15m of, or involves the loss of, trees in the conservation
          area.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: 'Tree survey/ arboricultural implications An arboricultural impact appraisal (AIA) is required
  for any new building work (including construction of access drive, patios and the laying of drains/services)
  that comes within 15 metres of: A tree the subject of a tree preservation order, either within the application
  site or on adjoining land or…'
confidence: medium
notes: The excerpt is cut off; the householder checklist adds 'or involves the loss of trees which are
  covered by a tree preservation order or are within a conservation area'. The workbook also put it under
  Works to trees by keyword.
