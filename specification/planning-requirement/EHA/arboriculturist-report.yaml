reference: arboriculturist-report
local-authority: EHA
required-if:
  any:
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: New building work (including access drives, patios, drains and services) within 15
          metres of the tree.
    - site:
        in:
        - tree-preservation-zone
        description: A tree subject to a tree preservation order, on the site or on adjoining land.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: New building work (including access drives, patios, drains and services) within 15
          metres of the tree.
    - site:
        in:
        - conservation-area
        description: A tree that stands within a conservation area.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: 'East Hampshire District Local Plan: Second Review (saved policies) policy C6; BS 5837:2012'
source-text: 'An arboricultural impact appraisal (AIA) is required for any new building work (including
  construction of access drive, patios and the laying of drains/services) that comes within 15 metres
  of: A tree the subject of a tree preservation order, either within the application site or on adjoining
  land or A tree that stands within a conservation area.'
must-include:
- item: A tree survey and finalised tree retention/removal plan (including for outline applications)
  level: must
- item: Retained trees and root protection areas shown on the proposed layout
  level: should
- item: Produced by a suitably qualified/experienced arboriculturist, in line with BS 5837:2012
  level: must
- item: How tree constraints informed the design, and all possible conflicts between the development and
    existing trees
  level: should
- item: Arboricultural Method Statement with a tree protection plan, where work will be within the root
    protection area of protected trees
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 27 (Tree Survey/Arboricultural
  Impact Appraisal/Arboricultural Method Statement), page 20-21. The method statement shows as discretionary
  because it depends on whether work falls within a root protection area.
review-status: unverified
field-status: {}
