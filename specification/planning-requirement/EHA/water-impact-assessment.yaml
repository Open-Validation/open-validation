reference: water-impact-assessment
local-authority: EHA
required-if:
  all:
  - site:
      in:
      - nutrient-neutrality-area
      description: In the Solent catchment (southern parishes served by Budds Farm Wastewater Treatment
        Works) or the River Itchen catchment (parts of Ropley, Medstead, Bentworth, Four Marks and Wield
        parishes).
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New housing.
    - discretionary
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: New housing schemes and other proposals which include a net gain in overnight accommodation
  or development which has a high volume of water use will need to demonstrate nutrient or phosphorus
  neutrality.
must-include:
- item: A site-specific nutrient budget calculation, using Natural England's most up to date budget calculator
  level: must
- item: A Habitats Regulations Assessment including, as applicable, a mitigation strategy, with enough
    information for the council to carry out an Appropriate Assessment
  level: must
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 7D (Nutrient Neutrality),
  page 10-11. Nitrate neutrality for the Solent catchment, phosphate neutrality for the River Itchen catchment.
  Other overnight accommodation and high water use show as discretionary because there is no field for
  them.
review-status: unverified
field-status: {}
