reference: location-plan
local-authority: EHA
required-if:
  always: true
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: ALL applications must include a location plan based on an up-to-date map.
must-include:
- item: At an identified standard metric scale (typically 1:1250 or 1:2500)
  level: must
- item: Scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Sufficient roads (normally two) and/or buildings on adjoining land to make the exact location
    clear
  level: should
- item: The direction of North
  level: must
- item: Ordnance Survey based plans annotated with the licence number (no more than 1 year old), or marked
    as surveyed
  level: must
- item: Application site clearly edged in red, including all land needed for the development (e.g. access
    from a public highway, visibility splays, landscaping, car parking, open areas around buildings)
  level: should
- item: Any other land owned by the applicant close to or adjoining the site edged in blue
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part I (National Requirements), page 4.
review-status: unverified
field-status: {}
