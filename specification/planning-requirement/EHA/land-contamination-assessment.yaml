reference: land-contamination-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: New development of more than 10 dwellings.
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected to exist.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of an existing or former landfill site listed by the Environment
          Agency.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Part 2A, Environmental Protection Act 1990
source-text: Any new development of dwellings, greater than 10 units Any site where contamination is known/suspected
  to exist Excluding householder application, any site within 250 metres of an existing or former landfill
  site listed by the Environment Agency.
must-include:
- item: At least an environmental desk study and site 'walkover' survey report
  level: must
- item: Not just environmental searches (these do not count as a desk study)
  level: must
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 13, page 13-14.
review-status: unverified
field-status: {}
