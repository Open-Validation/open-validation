reference: land-contamination-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: New development of dwellings, greater than 10 units.
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected to exist on the site.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of an existing or former landfill site listed by the Environment
          Agency (excluding householder applications).
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: Land Contamination Assessment When required i) Any new development of dwellings, greater
  than 10 units ii) Any site where contamination is known/suspected to exist iii) Excluding householder
  application, any site within 250 metres of an existing or former landfill site listed by the Environment
  Agency.
confidence: medium
notes: 'Audit (wrong_app_type): not a householder item, not for standalone listed building consent, and
  EHDC is not the minerals and waste authority. The application types on the landfill case are our reading
  of ''excluding householder application''.'
review-status: unverified
field-status: {}
