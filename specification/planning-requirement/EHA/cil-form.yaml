reference: cil-form
local-authority: EHA
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: Net additional floorspace over 100 sq m (gross internal area).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Net increase of 1 or more dwellings.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 100
      description: More than 100 sq m of new or additional retail or hotel floorspace.
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use to residential (C3).
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: Net additional floor space over 100sqm (gross internal area) Net increase of 1 or more dwellings
  (even if less than 100sqm) Development in excess of 100sqm of new/additional retail floor space or hotel
  space Change of use to residential C3.
must-include:
- item: 'CIL Form 1: Additional Information'
  level: must
- item: 'CIL Form 2: Assumption of Liability'
  level: must
- item: The relevant form for any Self-Build Exemption, Charitable Relief or Social Housing Relief claimed
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 9, page 11-12.
review-status: unverified
field-status: {}
