reference: transport-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: Residential development above 50 units.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 1000
      description: Retail uses above 1,000 m2.
  - discretionary
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: 'Transport Assessment When required Any proposal that would lead to significant transport
  implications as set out in guidance produced by Hampshire County Council, i.e. development above the
  following thresholds: i) Residential development: 50 units ii) B2 and E(g) uses: 2,500m2 iii) B8 uses:
  5,000m2 iv) Retail uses: 1,000m2 v) Education uses: 2,500m2 vi) Health uses: 2,500m2 vii) Care establishments:
  500m2 or 5 bedrooms viii) Leisure, stadia or ice rinks: All (1,500 seats) ix) Leisure, other: 1,…'
confidence: medium
notes: Thresholds from the Hampshire County Council guidance; the other use-class thresholds (B2/E(g),
  B8, education, health, care, leisure) are shown as officer discretion. Not a standalone LBC item.
review-status: unverified
field-status: {}
