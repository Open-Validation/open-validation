reference: transport-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: Residential development above 50 units.
  - condition:
      field: office-floorspace
      operator: '>'
      value: 2500
      description: E(g) uses above 2,500 sq m.
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 2500
      description: B2 uses above 2,500 sq m.
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 5000
      description: B8 uses above 5,000 sq m.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 1000
      description: Retail uses above 1,000 sq m.
  - condition:
      field: floorspace
      operator: '>'
      value: 2500
      description: Education or health uses above 2,500 sq m.
  - condition:
      field: floorspace
      operator: '>'
      value: 500
      description: Care establishments above 500 sq m, or commercial development not in the other categories
        above 500 sq m.
  - condition:
      field: bedroom-count
      operator: '>'
      value: 5
      description: Care establishments above 5 bedrooms.
  - condition:
      field: floorspace
      operator: '>'
      value: 1000
      description: Other leisure uses above 1,000 sq m.
  - discretionary
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: 'Any proposal that would lead to significant transport implications as set out in guidance
  produced by Hampshire County Council, i.e. development above the following thresholds: Residential development:
  50 units B2 and E(g) uses: 2,500m2 B8 uses: 5,000m2 Retail uses: 1,000m2 Education uses: 2,500m2 Health
  uses: 2,500m2 Care establishments: 500m2 or 5 bedrooms Leisure, stadia or ice rinks: All (1,500 seats)
  Leisure, other: 1,000m2 Commercial development not falling in the above categories: 500 m2'
must-include:
- item: A non-technical summary
  level: should
- item: Proposed modal split
  level: should
- item: Proposed development and assessment year
  level: should
- item: Existing transport conditions, including existing traffic flows
  level: should
- item: Effect of the travel plan
  level: should
- item: Traffic impact compared to the existing site use in future years
  level: should
- item: Servicing, loading areas and arrangements, and manoeuvring, servicing and parking of vehicles
  level: should
- item: Proposed measures to reduce traffic impact and improve accessibility other than by car
  level: should
- item: Impact on pedestrians, cyclists, traffic and people with disabilities
  level: should
- item: Assessment of accident records
  level: should
- item: 'For major proposals: accessibility by all modes, the likely split of journeys, and measures to
    improve access by public transport, walking and cycling, reduce parking need and mitigate impacts'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 25, page 19. Stadia
  and ice rinks (all, or 1,500 seats) show as discretionary because there is no field for them. For small
  schemes the assessment can simply outline the transport aspects.
review-status: unverified
field-status: {}
