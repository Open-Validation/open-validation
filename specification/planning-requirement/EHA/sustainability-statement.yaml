reference: sustainability-statement
local-authority: EHA
required-if:
  condition:
    field: floorspace
    operator: '>'
    value: 0
    description: Additional floorspace (not just a change of use) for residential or overnight accommodation
      (C1-C4), commercial (E), industrial or storage and distribution (B2, B8) or community (F1, F2) use.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: 'East Hampshire District Local Plan: Joint Core Strategy (2014) policies CP24 and CP29; Climate
  Change and Sustainable Construction SPD'
source-text: Any application for additional floorspace (i.e. aside from change of use) for residential
  use or overnight accommodation (Use Classes C1-C4). Any application for additional floorspace (i.e.
  aside from change of use) for commercial use (Use Class E). Any application for additional floorspace
  (i.e. aside from change of use) for industrial or storage & distribution use (Use Classes B2 & B8).
  Any application for additional floorspace (i.e. aside from change of use) for community purposes (Use
  Classes F1 & F2).
must-include:
- item: Completed Sustainability Checklist (Appendix 4 of the Climate Change and Sustainable Construction
    SPD) or equivalent information in a Sustainability Report
  level: must
confidence: medium
notes: 'From the council''s list (published May 2024), Part II (Local Requirements) item 8 (Climate Change
  Adaptation and Mitigation: Sustainability Checklist), page 11.'
review-status: unverified
