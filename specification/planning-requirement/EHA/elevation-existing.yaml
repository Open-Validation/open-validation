reference: elevation-existing
local-authority: EHA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the outside of a building.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevations (scale 1:100 or 1:50) – as necessary to clearly show the
  proposed works in relation to what is already there.
must-include:
- item: Scale 1:100 or 1:50
  level: must
- item: Where a proposed elevation adjoins or is close to another building, the relationship between the
    two buildings
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part I (National Requirements), page 5. Needed 'as
  necessary' to show the works against what is there.
review-status: unverified
field-status: {}
