reference: recreation-facilities-assessment
local-authority: EHA
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: The development involves the loss of playing fields or major sporting facilities.
source-url: https://www.easthants.gov.uk/media/4745/download?inline
policy: 'East Hampshire District Local Plan: Joint Core Strategy (2014) policy CP17'
source-text: Any development that involves the loss of playing fields or major sporting facilities.
must-include:
- item: What facilities exist or last existed, when they were last used and by whom
  level: must
- item: What formal sports provision is proposed, including any replacement facilities
  level: must
- item: Size of the playing field and how much of it is affected (in hectares or square metres)
  level: must
  required-if:
    site:
      in:
      - open-space
      description: The application specifically involves playing fields.
- item: Existing site plan showing the winter and summer pitch layout, including safety margins, at a
    minimum 1:1250 scale
  level: must
  required-if:
    site:
      in:
      - open-space
      description: The application specifically involves playing fields.
- item: Proposed site plan showing the likely impact of new buildings and works on the pitch layout, including
    any realignment
  level: must
  required-if:
    site:
      in:
      - open-space
      description: The application specifically involves playing fields.
- item: Any information on alternative sport and recreational provision
  level: must
  required-if:
    site:
      in:
      - open-space
      description: The application specifically involves playing fields.
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 20 (Playing Fields
  and Sporting Facilities Assessment), page 16-17.
review-status: unverified
field-status: {}
