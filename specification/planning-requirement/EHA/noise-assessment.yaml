reference: noise-assessment
local-authority: EHA
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development close to existing sources of noise or vibration (e.g. major
        roads, railway lines, industry).
  - condition:
      field: noise-generating-use
      value: true
      description: B2 use, motor sports or motor hobbies (e.g. model aeroplane flying), or clay pigeon
        shooting.
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines (except where permitted development applies).
source-url: https://www.easthants.gov.uk/media/4745/download?inline
source-text: Developments considered to be noise sensitive and which are close to existing sources of
  noise or vibration, e.g. major roads, railway lines and industrial developments All applications for
  B2 use Any application for motor sports or motor hobbies, e.g. model aeroplane flying Any application
  for clay pigeon shooting Any application for wind turbines (except where permitted development applies).
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: Potential sources of noise/vibration and their effect on local amenity
  level: should
- item: How adverse impacts will be mitigated and reduced to a minimum
  level: should
confidence: medium
notes: From the council's list (published May 2024), Part II (Local Requirements) item 16 (Noise Impact
  Assessment), page 15.
review-status: unverified
field-status: {}
