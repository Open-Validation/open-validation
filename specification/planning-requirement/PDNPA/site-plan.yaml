reference: site-plan
local-authority: PDNPA
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - s73
    - reserved-matters
    - lbc
    - advertising
    - non-material-amendment
    - ldc
source-url: https://www.peakdistrict.gov.uk/__data/assets/pdf_file/0028/180946/Local_validation_list_guidance_Aug_2026.pdf
source-text: L1.1 Site / block plans (existing and proposed) A site / block plan is necessary for most
  applications to show proposed changes on the site so they can be assessed and understood and in relation
  to neighbouring properties.
must-include:
- item: An identified metric scale (e.g. 1:200 or 1:500, or as appropriate)
  level: must
- item: A drawing reference number and title
  level: should
- item: A scale bar or other annotated measurement so scale can be verified
  level: should
- item: The direction of North
  level: should
- item: The proposed development in relation to the site boundaries, with written dimensions including
    those to the boundaries
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatment including walls or fencing, where proposed
  level: should
- item: Connection points for foul and surface waters and any culverted watercourses within the site (where
    known)
  level: should
- item: The position and extent of any playing fields or sports facilities
  level: should
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type):
  L1.1 applies to the types listed (2025 matrix). The must-include items are the Authority''s wording
  (''A site plan must be drawn at an identified metric scale … should include a drawing reference number
  and title and should accurately show: …''), including items g)-j), which the workbook had filed under
  the tree survey.'
