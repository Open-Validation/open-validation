source-text: 'Roof plans must be drawn at an identified metric scale (1:50 or 1:100 as appropriate), the
  drawings must clearly show all parts of the roof and include a drawing reference number and title and
  show: a) a scale bar or other annotated measurement so scale can be verified; b) clearly show proposed
  works in relation to what is already there; c) position of roof windows, balconies, chimneys and any
  other architectural features; d) relationship with any adjacent buildings and structures.'
