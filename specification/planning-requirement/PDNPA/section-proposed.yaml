reference: section-proposed
local-authority: PDNPA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new buildings.
    - condition:
        field: change-in-ground-levels
        value: true
        description: Significant engineering operations and changes to levels.
    - discretionary
source-url: https://www.peakdistrict.gov.uk/__data/assets/pdf_file/0028/180946/Local_validation_list_guidance_Aug_2026.pdf
source-text: Cross-sections and ground levels (existing and proposed) Cross-sections and ground levels
  are required for applications proposing new buildings or any significant extension to existing buildings
  or other development proposing significant engineering operations and changes to levels so that they
  can be assessed and understood.
