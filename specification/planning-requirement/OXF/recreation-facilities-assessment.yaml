reference: recreation-facilities-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - open-space
        description: The site is within or adjoining designated or proposed open space/playing fields,
          common land or village greens.
    - condition:
        field: loss-of-open-space
        value: true
        description: The proposal involves the loss of playing fields.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 103-108; Sport England Playing Fields Policy
  and Guidance
source-text: Planning applications where the site is within or adjoining an area of designated or proposed
  open space/playing fields, common land or village greens. Any application involving the loss or provision
  of playing fields should be supported by evidence of a district wide Playing Pitch Strategy.
must-include:
- item: Plans showing existing or proposed open space or playing field land within or adjoining the site
  level: must
- item: 'Where playing field is lost: its extent, the area in hectares lost and the area of replacement
    playing field, with plans'
  level: must
- item: Evidence of a district wide Playing Pitch Strategy where playing fields are lost or provided
  level: must
- item: Any independent assessment showing the land or buildings are surplus, with a needs assessment
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 37-38 and the checklists
  on pages 54-72. The council calls it an Open Space/Playing Field Assessment. The minerals (3.1), waste
  (3.2) and county development (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
