reference: landscaping-plan
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: landscaping-works
        value: true
        description: The proposal contains some form of landscaping.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 174, 176, 177 and 185; National Planning
  Policy for Waste, Appendix B
source-text: Any planning application where the proposal contains, or is likely to require, some form
  of landscaping to make it acceptable in planning terms. Some form of landscaping is expected for most
  application types. A Landscape Masterplan/Landscape Strategy drawing will be required for most applications,
  a detailed Planting Plan is required where new planting is proposed.
must-include:
- item: Landscape Masterplan/Landscape Strategy drawing with contextual information and notes on the rationale
    (views, screening, habitat creation)
  level: must
- item: Trees/mature vegetation to be retained and removed, and types of new planting
  level: must
- item: Changes in level, including finished ground levels or contours, and drainage details
  level: must
- item: Means of enclosure, car parking layouts, vehicle and pedestrian access and circulation, and hard
    surfacing materials
  level: must
- item: Structures and ancillary objects (interpretation boards, bird hides, refuse bins, lighting columns
    etc.)
  level: must
- item: Long-term maintenance and management
  level: must
- item: 'Planting Plan: existing vegetation to be retained and its protection during construction; plant
    species/seed mixes, sizes, densities and ground preparation; management/maintenance guidance'
  level: must
  required-if:
    condition:
      field: landscaping-works
      value: true
      description: New planting is proposed.
- item: The contribution the scheme makes to biodiversity and green infrastructure
  level: should
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 33-35 and the checklists
  on pages 54-72. The council calls it a Landscaping Scheme. A proposal 'likely to require' landscaping
  is shown as discretionary. The minerals (3.1), waste (3.2) and county development (3.3) checklists use
  the same wording.
review-status: unverified
field-status: {}
