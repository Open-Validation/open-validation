reference: arboriculturist-report
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within, on the boundary or close to the site could be affected by the development.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 131, 174 and 180; BS5837:2012; Hedgerow Regulations
  1997
source-text: All planning applications where there are trees within, on the boundary or in close proximity
  to the site that could be affected by the proposed development.
must-include:
- item: 'Tree survey to BS5837:2012: positions of all trees of 75mm stem diameter at 1.5 m on, next to
    or overhanging the site, canopy spread, shrub masses and hedges, other relevant features, and tree
    categories'
  level: must
- item: 'Arboricultural Impact Assessment: impact on trees and root protection areas, trees to be removed
    and retained and tree work needed, services, construction and future-use impacts; ancient and veteran
    trees noted'
  level: must
- item: CAVAT valuation and compensation where development adversely affects trees on the highway
  level: must
  required-if: discretionary
- item: Proposals for replacing long-term tree canopy cover where trees are lost
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 50-51 and the checklists
  on pages 54-72. The council calls it a Tree/Hedgerow Survey / Arboricultural Statement. Where trees
  are retained, an Arboricultural Method Statement and Tree Protection Plan must be agreed before commencement.
  The minerals (3.1), waste (3.2) and county development (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
