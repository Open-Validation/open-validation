reference: waste-management-plan
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: demolition
        value: true
        description: The development involves demolition.
    - condition:
        field: earthworks
        value: true
        description: The development involves excavation of the site.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy for Waste; Waste Management Plan for England 2021
source-text: All planning applications where waste will be generated on site. … Where proposed new development
  involves the demolition or excavation of the site, proposals should be supported by a plan which identifies
  the volume and type of material to be removed from the site and explores the opportunities for the recovery,
  reuse of material on the site, the circular economy and how any offsite disposal of waste material will
  be managed.
must-include:
- item: Volume and type of material to be removed from the site
  level: must
- item: Opportunities for recovery and reuse of material on site and the circular economy
  level: must
- item: How any offsite disposal of waste material will be managed
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 52 and the checklists
  on pages 54-72. The council calls it a Waste Minimisation Statement. Other cases where waste is generated
  on site are shown as discretionary. The minerals (3.1), waste (3.2) and county development (3.3) checklists
  use the same wording.
review-status: unverified
field-status: {}
