reference: water-impact-assessment
local-authority: OXF
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - any:
      - condition:
          field: dewatering-or-abstraction
          value: true
          description: Dewatering of mineral workings is proposed.
      - discretionary
  - all:
    - application-type:
        in:
        - waste-dev
        - reg-3
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraph 224; National Planning Policy for Waste, Appendix
  B
source-text: Mineral planning applications where dewatering is proposed or proposals affect the water
  table. … Waste planning applications where proposals affect the water table. … Planning applications
  proposals affect the water table.
must-include:
- item: Technical information including the calculated extent and volumes of dewatering
  level: must
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: The natural water table including its depth, source catchment areas and characteristics
  level: must
- item: Evidence that third parties will not be affected by dewatering, and mitigation where public or
    private water supplies, water bodies or watercourses would be affected
  level: must
- item: Methods of dewatering and water disposal, pollution control for ground and surface water, drainage
    and flood control measures and monitoring
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 29-30 and the checklists
  on pages 54-72. The council calls it a Hydrological Assessment. 'Proposals that affect the water table'
  has no matching field, so it is shown as discretionary.
review-status: unverified
field-status: {}
