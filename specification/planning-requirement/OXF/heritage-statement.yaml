reference: heritage-statement
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - scheduled-monument
        - park-and-garden
        - battlefield
        - world-heritage-site
        - listed-building
        - conservation-area
        - locally-listed-building
        description: Likely to affect a Scheduled Monument, Registered Park or Garden, Registered Battlefield,
          World Heritage Site (Blenheim Palace), Listed Building or Conservation Area, or a locally listed
          building.
    - site:
        in:
        - listed-building-setting
        description: Likely to affect the setting of a listed building or other heritage feature.
    - condition:
        field: hedgerows-affected
        value: true
        description: A hedge is to be removed or moved or would be affected by the proposal.
    - condition:
        field: structural-demolition
        value: true
        description: The proposal involves substantial demolition of an existing building.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 202 and 207-221; National Planning Policy
  for Waste, Appendix B
source-text: Where a proposal is likely to affect or impact on a nationally important site including those
  designated as a Scheduled Monument; Park or Garden; Registered Battlefield; World Heritage Site (Blenheim
  Palace); Listed Building/ structure or Conservation Area, or the setting of any of these features whether
  designated or not; as well as non-designated archaeological assets, locally listed buildings, non-designated
  archaeological assets and other areas of known or potential archaeological asset; … Where known archaeological
  features or remains; historic buildings or structures or historic landscapes are either on or adjacent
  to the application site, or their setting may be affected; … Where a hedge is to be removed or moved
  or would be affected by the proposal; and … Where a proposal involves substantial demolition of an existing
  building.
must-include:
- item: Historic Environment Record consulted as a minimum
  level: must
- item: 'For sites adjacent to a listed building or in or next to a conservation area: the impact on the
    character and appearance of the area'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 27-29 and the checklists
  on pages 54-72. The council asks for one Heritage and Archaeological Statement; the archaeological parts
  are in archaeological-assessment. Historic buildings or landscapes on or next to the site that are not
  designated are shown as discretionary. The minerals (3.1), waste (3.2) and county development (3.3)
  checklists use the same wording.
review-status: unverified
field-status: {}
