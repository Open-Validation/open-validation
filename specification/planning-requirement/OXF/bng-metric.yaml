reference: bng-metric
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the general biodiversity gain condition.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Environment Act 2021; Town and Country Planning Act 1990, section 90A and Schedule 7A
source-text: Those planning applications where development is subject to the general biodiversity net
  gain requirements. … Biodiversity Net Gain Requirements All applications.
must-include:
- item: Statement on whether the applicant believes the biodiversity gain condition applies
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed metric calculation tool showing the calculations and the publication date
    and version of the metric
  level: must
- item: Completed metric submitted as the calculator spreadsheet, not a 'snapshot' or summary, showing
    a measurable net gain of at least 10% across all unit types (area, and where relevant hedgerow and
    watercourse units), onsite and offsite
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
  required-if: discretionary
- item: Statement on whether the onsite value is lower because of activities carried on ('degradation'),
    with supporting evidence if so
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
- item: Copies of habitat condition assessment sheets for baseline and proposed habitats
  level: must
- item: Steps taken to minimise the adverse effect of the development on the biodiversity of the onsite
    habitat and any other habitat
  level: must
- item: Arrangements for compensation for any impact on irreplaceable habitats
  level: must
- item: How the biodiversity gain hierarchy will be followed, with reasons where it is not
  level: must
- item: How improvements to biodiversity have been integrated into the design
  level: must
- item: How Oxfordshire's Conservation Target Areas and/or the Local Nature Recovery Strategy and other
    wider objectives have been taken into account
  level: must
- item: The relevant date for calculating the pre-development biodiversity value
  level: must
- item: 'Off-site gain: location of the off-site areas, plans of baseline habitats and enhancements, the
    biodiversity value of the gain, the landowner''s agreement in principle to a legal agreement, and
    draft heads of terms for a section 106 agreement'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site biodiversity gain is to be allocated to the development.
- item: 'Where biodiversity credits are to be bought: the value of the credits'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 10-19 and the checklists
  on pages 54-72. The checklists ask for a Biodiversity Net Gain Plan where development is subject to
  the general biodiversity gain condition, and list the local 'Biodiversity Net Gain Requirements' for
  'All applications'; householder and other exempt applications are exempt by law, so it is shown for
  developments subject to the condition. If you think the condition doesn't apply, say why on the application
  form. For phased development a draft Overall Biodiversity Gain Plan is asked for instead.
review-status: unverified
field-status: {}
