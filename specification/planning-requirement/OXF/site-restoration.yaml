reference: site-restoration
local-authority: OXF
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - waste-dev
        - reg-3
    - condition:
        field: landfill-development
        value: true
        description: Landfill or land-raising proposals.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 187, 193, 196 and 224; National Planning
  Practice Guidance – Restoration and Aftercare of Minerals Sites
source-text: All planning applications for mineral extraction … All planning applications for mineral
  extraction, landfill or land-raising proposals.
must-include:
- item: Type and source of the material the site would be infilled with, and sources and volumes (including
    tonnage) of restoration materials
  level: must
- item: Working methods and timescales, and HGV movements
  level: must
- item: End use of the site (e.g. agriculture, woodland or habitat creation) and the reason for the choice
  level: must
- item: 'Where existing agricultural land is disturbed: soil resources, Agricultural Land Classification,
    intended restored grade and a soil handling strategy'
  level: must
  required-if: discretionary
- item: Restoration plan showing site boundary, context, proposed contours, habitats, public rights of
    way/open spaces, land uses, planting, features, plant specification and notes on implementation and
    management
  level: must
- item: Phasing plan showing progressive restoration
  level: must
  required-if: discretionary
- item: Topographical survey of pre-development and proposed contours, with ground contours on completion
    and at the end of aftercare to show settlement
  level: must
- item: Aftercare management plan for 5 years after final restoration (the first 5 years of a 30-year
    Habitat Management and Monitoring Plan for BNG), with monitoring and updating arrangements
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 12-14 and the checklists
  on pages 54-72. The council calls it an Aftercare and Restoration Scheme. The minerals checklist asks
  for it for mineral extraction; the waste and county development checklists for mineral extraction, landfill
  or land-raising.
review-status: unverified
field-status: {}
