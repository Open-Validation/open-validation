reference: lighting-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: The application proposes external lighting.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 196 and 198; National Planning Policy for
  Waste, Appendix B
source-text: Where planning applications propose external lighting.
must-include:
- item: Details of external lighting, including the proposed hours of operation and the means of control
  level: must
- item: Type of lighting (manufacturer), light source, colour temperature (not more than 3000 K), mounting
    height, power rating, maintenance factor and beam angles/geometry
  level: must
- item: Drawings/lighting calculations showing the spread of light and that it does not extend beyond
    the site boundaries
  level: must
- item: Impact on sensitive biodiversity features, landscape and dark skies where relevant
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 38-40 and the checklists
  on pages 54-72. The council calls it an Outdoor Lighting/Floodlighting Scheme (including a lighting
  design calculation and ecology assessment). The minerals (3.1), waste (3.2) and county development (3.3)
  checklists use the same wording.
review-status: unverified
field-status: {}
