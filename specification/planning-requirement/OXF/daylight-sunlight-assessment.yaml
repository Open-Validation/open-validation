reference: daylight-sunlight-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: BS8206 Part 2
source-text: All planning applications where there is a potential adverse impact upon the current levels
  of sunlight /daylighting enjoyed by adjoining properties and buildings.
must-include:
- item: Consideration of new features such as tree planting whose impact may take time to develop
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 21 and the checklists
  on pages 54-72. A 'potential adverse impact' has no threshold, so it is shown as discretionary. The
  minerals (3.1), waste (3.2) and county development (3.3) checklists use the same wording.
