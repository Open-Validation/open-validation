reference: sustainable-drainage-strategy
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: hard-surfacing
        value: true
        description: The application creates new or extended impermeable areas.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 164, 181 and 182; Non-statutory technical
  standards for sustainable drainage systems
source-text: 'Applications for development of a new site, or amended site layout … Applications involving
  the creation of new or extended impermeable areas should be supported by a drainage strategy which includes:'
must-include:
- item: Discharge rates and discharge volumes
  level: must
- item: Maintenance and management of SuDS features
  level: must
- item: Sizing of features (attenuation volume) and infiltration in accordance with BRE365
  level: must
- item: Detailed drainage layout with pipe numbers, and network drainage calculations
  level: must
- item: Climate change and opportunities to enhance biodiversity taken into account
  level: should
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 45-46 and the checklists
  on pages 54-72. The checklists call it a Drainage Strategy, for 'development of a new site, or amended
  site layout'; there are no fields for those, so they are shown as discretionary. The minerals (3.1),
  waste (3.2) and county development (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
