reference: sustainability-statement
local-authority: OXF
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 157 and 158
source-text: All planning applications.
must-include:
- item: How energy minimisation and carbon dioxide reduction will be incorporated
  level: must
- item: Climate change mitigation or adaptation measures, and how the development is adapted to severe
    weather events
  level: must
- item: Water use, energy efficiency and generation (predicted energy demand and renewable sources), sustainable
    construction (with the origin of natural materials), waste management and resource efficiency
  level: must
- item: Effects on green infrastructure
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 46-47 and the checklists
  on pages 54-72. The council calls it a Sustainability/Climate Change Statement (Appraisal). Non-domestic
  buildings are encouraged to reach BREEAM 'Very Good' and a CEEQUAL award. The minerals (3.1), waste
  (3.2) and county development (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
