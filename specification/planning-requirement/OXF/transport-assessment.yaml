reference: transport-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: parking-spaces
        operator: '>='
        value: 1
        description: Additional parking is proposed.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 109-114; National Planning Policy for Waste,
  Appendix B
source-text: All planning applications where there is likely to be a significant impact upon the existing
  transport network, and/or where additional parking is proposed.
must-include:
- item: 'For small schemes: a Transport Statement outlining the transport aspects, including parking provision'
  level: must
- item: 'For larger proposals: a Transport Assessment showing how traffic impact will be mitigated and
    managed, accessibility by all modes and the likely split of journeys'
  level: must
  required-if: discretionary
- item: Access proposals with adequate visibility splays for the 85th percentile speed, and access/egress
    and management of construction traffic
  level: must
- item: Vehicle swept path analysis showing large vehicles (refuse and delivery vehicles for built development)
    entering, turning and leaving in forward gear
  level: must
- item: 'For minerals and waste sites with many lorry movements: a route in line with the Oxfordshire
    Lorry Route Map'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Wheel washing facilities where mud or dust could be deposited on the highway
  level: must
  required-if: discretionary
- item: Material quantities in tonnes rather than cubic metres
  level: must
- item: Drawings of proposed highway works as separate drawings in separate files
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 47-49 and the checklists
  on pages 54-72. A 'significant impact upon the existing transport network' is shown as discretionary.
  The minerals (3.1), waste (3.2) and county development (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
