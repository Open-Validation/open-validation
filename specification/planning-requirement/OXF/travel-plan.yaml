reference: travel-plan
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraph 118
source-text: All planning applications that have the potential for significant traffic and travel-related
  implications. … A Travel Plan is always needed for a new school.
must-include:
- item: How the transport implications will be managed, and a strategy for implementation
  level: must
- item: A plan coordinator, management arrangements (e.g. a steering group) and the development timetable
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 49-50 and the checklists
  on pages 54-72. 'Significant traffic and travel-related implications' is not defined, so shown as discretionary;
  the list says a Travel Plan is always needed for a new school (no matching field). The minerals (3.1),
  waste (3.2) and county development (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
