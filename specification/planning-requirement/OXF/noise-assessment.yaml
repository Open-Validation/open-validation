reference: noise-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal is likely to generate noise above background levels that may harm the
          nearest noise-sensitive property or use of land (including nature conservation).
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise-sensitive development that needs protection itself.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 187, 198 and 224; National Planning Policy
  for Waste, Appendix B
source-text: All planning applications where the proposal is likely to generate a noise level above background
  noise levels which may have a detrimental impact on the nearest noise sensitive property or other development
  or use of land (including nature conservation). … or are considered to be a noise sensitive development
  that need protection themselves, should be supported by a Noise Impact Assessment prepared by a suitably
  qualified acoustician.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Existing ambient noise climate and a survey of pedestrian and vehicle numbers in and around the
    premises
  level: should
- item: Existing and future noise climate due to the development, with any increase in predicted noise
    levels
  level: should
- item: Management procedures to reduce the impact on the locality, including noise from vehicles
  level: should
- item: Sound insulation details where the building needs to contain noise generated inside it
  level: must
  required-if: discretionary
- item: Consideration of tranquillity where relevant
  level: should
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 36-37 and the checklists
  on pages 54-72. Where the development generates no significant noise, a statement to that effect in
  the supporting statement may be enough. The minerals (3.1), waste (3.2) and county development (3.3)
  checklists use the same wording.
review-status: unverified
field-status: {}
