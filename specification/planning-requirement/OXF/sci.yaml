reference: sci
local-authority: OXF
required-if:
  any:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Revised Oxfordshire Statement of Community Involvement 2020; National Planning Policy Framework
  (2024) paragraphs 39-46
source-text: All planning applications which meet the definition set out in the section. … All planning
  applications.
must-include:
- item: How the applicant has complied with the pre-application consultation requirements in the County
    Council's adopted Statement of Community Involvement
  level: must
- item: How the views of the local community have been sought and taken into account
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 43 and the checklists
  on pages 54-72. The waste and county development checklists ask for it for all planning applications.
  The minerals checklist asks for it where the application meets the table in Part Two (a new quarry,
  or an extension of 25 hectares with 250,000 tpa or more); there are no fields for these, so minerals
  are shown as discretionary.
review-status: unverified
