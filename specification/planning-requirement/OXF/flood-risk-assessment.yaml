reference: flood-risk-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development, including change of use, of 1 hectare or greater (Flood Zone 1).
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Development, including change of use, of 1000m2 gross floor space or greater (Flood
          Zone 1).
    - site:
        in:
        - flood-risk-zone
        description: Development, including change of use, located in Flood Zone 2 or 3.
    - condition:
        field: near-watercourse
        value: true
        description: Development proposals that may affect watercourses, flood defences or off-site flood
          mitigation.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 170-182; National Planning Policy for Waste,
  Appendix B
source-text: Development including change of use of 1 hectare or greater or 1000m2 gross floor space or
  greater, in Flood Zone 1 and all proposals, including change of use, for Development located in Flood
  Zones 2 and 3. … Where development proposals may affect watercourses, flood defences or off-site flood
  mitigation. … Where the proposed development may be subject to other sources of flooding. … Where the
  Environment Agency, Internal Drainage Board and/or other bodies have indicated that there may be drainage
  problems or concerns that need addressing.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed taking
    climate change into account
  level: must
- item: The Sequential Test (and the Exception Test where needed)
  level: should
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 23-24 and the checklists
  on pages 54-72. Other sources of flooding and drainage concerns raised by the Environment Agency or
  Internal Drainage Board are shown as discretionary. The minerals (3.1), waste (3.2) and county development
  (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
