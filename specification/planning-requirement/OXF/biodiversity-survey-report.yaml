reference: biodiversity-survey-report
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-wildlife-site
        description: Potential impact on a designated site (SPA, SAC, Ramsar, SSSI, NNR, Local Wildlife
          Site, LNR and similar).
    - condition:
        field: protected-species
        value: true
        description: Potential impact on protected species.
    - site:
        in:
        - priority-habitat
        description: Potential impact on priority habitats.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017; Natural
  Environment and Rural Communities Act 2006, section 40; BS42020
source-text: Those planning applications when there is a potential impact on designated sites, protected
  species or habitats, or where a biodiversity survey is required.
must-include:
- item: A data search from the Thames Valley Environmental Records Centre (TVERC), not the NBN Gateway
    or Magic, unless agreed otherwise with a planning officer
  level: must
- item: Surveys by competent persons with suitable ecological qualifications, at an appropriate time of
    year and in suitable weather, using nationally recognised methods, to the standards in BS42020
  level: must
- item: What species/habitats are involved and the population level or habitat area likely to be affected
  level: must
- item: The impact on protected or notable species/priority habitat, whether it is necessary or acceptable,
    how the mitigation hierarchy has been applied and whether a Natural England licence is needed
  level: must
- item: Evaluation of the biodiversity/geodiversity importance of the site and surrounds
  level: must
- item: Assessment of all direct and indirect impacts (noise, light, vibration, dust, pollution, dewatering
    and other hydrological impacts), short and long term
  level: must
- item: Avoidance, mitigation and/or compensation measures, restoration and enhancement details, and after-care
    and long-term management
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 15-16, 22-23 and 72-85
  (Appendices 1-4). Appendix 2 gives the trigger list of designated sites, priority habitats and other
  features. Where a 'biodiversity survey is required' otherwise, it is shown as discretionary. The county
  development checklist calls it a Biodiversity and geological conservation report.
review-status: unverified
field-status: {}
