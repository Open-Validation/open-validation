reference: section-proposed
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels or is on a sloping site.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In cases where a proposal involves a change in ground levels or is on a sloping site, drawings
  at a 1:50, 1:100 or 1:200 scale should be submitted showing a cross section through the proposed building
  or site to include details of foundations and eaves and how encroachment onto adjoining land is to be
  avoided.
must-include:
- item: At 1:50, 1:100 or 1:200, a cross section through the proposed building or site with details of
    foundations and eaves and how encroachment onto adjoining land is avoided
  level: must
- item: Existing and finished levels (contours, spot levels or cross or long sections), related to Ordnance
    Survey Datum or a clear, permanent local datum
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 11-12. The list calls
  them Existing and Proposed Site Sections and Finished Floor and Site Levels.
review-status: unverified
field-status: {}
