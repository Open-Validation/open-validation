review-status: unverified
validation-list:
  url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
  date: '2025-03-31'
  date-basis: 'Council''s ''Making a planning application'' page: ''An updated Local List of Information
    Requirements for Validation of Planning and Related Applications (The Local List) was published in
    April 2025, following a decision taken by the Planning and Regulation Committee on 31 March 2025''
    and ''The next review is due in 2027''; the page links this PDF as the ''Validation checklist for
    planning applications submitted to us''. Cover: ''March 2025'' (PDF modified 2 April 2025). Despite
    ''Proposed'' in the file name, it is the adopted list. It covers minerals, waste and county (Regulation
    3) development. Page numbers in the requirement notes are the printed page numbers (the PDF page is
    one more). Page: https://www.oxfordshire.gov.uk/residents/environment-and-planning/planning/make-planning-application/making-planning-application'
  status: current
submission-standards:
- item: File names of documents and plans match the document/plan title as it appears on the document
  level: must
- item: Maximum single file size 10 MB; maximum 25 MB in total
  level: must
- item: PDF is the recommended file format
  level: should
- item: Drawings saved in a single layer, correctly orientated for on-screen display, and specifying the
    printing page size for which the scale applies
  level: must
- item: All drawings include a scale bar and key dimensions
  level: must
- item: Documents and drawings named in accordance with RIBA naming conventions
  level: must
- item: Scanned documents at least 200 dpi (black and white) or 100 dpi (colour)
  level: must
- item: Photographs in PDF format and no larger than 15 cm x 10 cm
  level: must
- item: 'Paper applications: the original and at least 3 additional paper copies of the forms, plans and
    documents'
  level: must
- item: Plans drawn to an identified scale, clearly and logically titled, showing North, with a unique
    reference number and dated
  level: must
- item: Plans not marked 'Do not scale'; plans not drawn to scale are not accepted unless clearly stated
    to be solely illustrative
  level: must
- item: Plans scaled to fit A4 or A3 paper (unless agreed otherwise), each with a title, scale, legend,
    units of measurement, north arrow if relevant and a unique reference number
  level: must
- item: Drawings of proposed highway works supplied as separate drawings in separate files and referenced
    in the Transport Statement/Assessment
  level: must
- item: Updated or replacement plans and documents clearly labelled as a new version (e.g. Revision A),
    with the changes listed or identified
  level: should
- item: Scale of plans and paper size no larger than needed; avoid unnecessary blocks of colour
  level: should
