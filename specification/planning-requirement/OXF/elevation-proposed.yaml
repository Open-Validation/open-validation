reference: elevation-proposed
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In addition to the location plan and site plan, other plans should be submitted (dependent
  on the type of application and development proposed) to explain the proposal in detail.
must-include:
- item: Drawn at 1:50 or 1:100, showing the proposed works in relation to what is already there
  level: must
- item: Clearly titled, with a unique reference number, signed and dated
  level: must
- item: All sides of the proposal shown with orientations labelled (not just front, side and rear), including
    blank elevations
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors
  level: must
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 11 and the checklists
  on pages 54-72. The checklists ask for 'Other Plans' for all applications other than section 73/73A,
  conditions and non-material amendment applications; which plans depend on the type of application and
  development, so they are shown as discretionary.
review-status: unverified
field-status: {}
