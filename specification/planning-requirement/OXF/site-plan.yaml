reference: site-plan
local-authority: OXF
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications other than Section 73/73A applications, for detailed submissions pursuant
  to planning conditions and non-material amendment applications.
must-include:
- item: At 1:200 or 1:500 for most built development, or 1:1250 or 1:2500 for minerals and waste development
    or other development over 1 ha
  level: must
- item: Clearly titled, with a unique reference number, and dated
  level: should
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees and other structural vegetation such as hedgerows on the site and on
    adjacent land
  level: must
- item: Location, type and extent of notable features such as ponds and veteran trees
  level: must
- item: Extent and type of any hard surfacing, and proposed boundary treatment including walls or fencing
  level: must
- item: Block plan at 1:100 or 1:200 showing site boundaries, the type and height of boundary treatment,
    and any building or structure on the other side of the boundaries
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 9-11 and the checklists
  on pages 54-72. The block plan is one of the 'other plans' submitted depending on the type of application
  and development, so it is shown as discretionary. The minerals (3.1), waste (3.2) and county development
  (3.3) checklists use the same wording.
review-status: unverified
field-status: {}
