reference: archaeological-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - scheduled-monument
        - archaeological-priority-area
        description: Likely to affect a Scheduled Monument, non-designated archaeological assets or areas
          of known or potential archaeological interest.
    - condition:
        field: hedgerows-affected
        value: true
        description: A hedge is to be removed or moved or would be affected by the proposal.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 202 and 207-221; Oxfordshire County Council
  Archaeological Planning Guidance
source-text: as well as non-designated archaeological assets, locally listed buildings, non-designated
  archaeological assets and other areas of known or potential archaeological asset; … Where known archaeological
  features or remains; historic buildings or structures or historic landscapes are either on or adjacent
  to the application site, or their setting may be affected; … Where a proposal involves the disturbance
  of ground or raising of ground levels where there may be archaeological remains, as may be specified
  in pre- application advice; … Where significant infrastructure works are proposed, where there may be
  archaeological remains, as may be specified in pre-application advice; … Where a hedge is to be removed
  or moved or would be affected by the proposal; and
must-include:
- item: Historic Environment Record consulted as a minimum
  level: must
- item: 'Where the site has archaeological interest: a desk-based assessment to Chartered Institute for
    Archaeologists standards, with a written scheme of investigation agreeing its scope'
  level: must
- item: Field evaluation (e.g. geophysical survey, test pits or trenches) where needed to complete the
    assessment, with an agreed written scheme of investigation
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 27-29 and the checklists
  on pages 54-72. Part of the council's Heritage and Archaeological Statement. Ground disturbance and
  significant infrastructure works where archaeology 'may be specified in pre-application advice' are
  shown as discretionary. The minerals (3.1), waste (3.2) and county development (3.3) checklists use
  the same wording.
review-status: unverified
field-status: {}
