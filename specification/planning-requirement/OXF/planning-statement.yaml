reference: planning-statement
local-authority: OXF
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Practice Guidance - Validation Requirements
source-text: All planning applications other than section 73/73A applications should include this supporting
  document. … All applications should include this supporting document.
must-include:
- item: How the development accords with the development plan, supplementary planning documents, masterplans
    or briefs, national policy and guidance, with justification for any departure from policy (including
    very special circumstances in the Green Belt)
  level: must
- item: 'Minerals and waste: site description and designations, planning history, reasons for the location
    and alternatives, minerals and quantities, depth of extraction, waste sources, treatment, capacity
    and throughput'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Minerals and waste: hours of operation, maximum daily vehicle movements, plant and equipment,
    biodiversity requirements or exemptions, external lighting, site preparation, method of working and
    timescale'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Minerals and waste: soil handling, dust and litter, noise, mud on the highway, vermin and birds,
    levels, landfill gas and leachate, odour, phasing, surface water, staff and visitor numbers, parking,
    amenity impacts and buffer zones'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Minerals and waste: restoration and aftercare proposals with financial provision, and whether
    the site is in a Mineral Safeguarded Area or Mineral Consultation Area'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Other development: site description and designations, planning history, reasons for the location
    and alternatives, pupil numbers for education development, staff and visitor numbers, parking, and
    amenity impacts with mitigation'
  level: must
  required-if:
    application-type:
      in:
      - reg-3
- item: 'Landfill and/or mining waste: type, tonnages, source (with distances), likely yearly tonnages
    and HGV movements of imported material (here or in the Environmental Statement)'
  level: must
  required-if:
    condition:
      field: landfill-development
      value: true
      description: The application includes landfill and/or mining waste.
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 30-31, 43-45 and the
  checklists on pages 54-72. The council calls it a Supporting Planning Statement. Part Two says all full
  planning applications for new development; the minerals and waste checklists exclude section 73/73A
  applications.
review-status: unverified
field-status: {}
