reference: land-contamination-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - contaminated-land
        description: Reason to suspect contamination of the site or neighbouring land due to previous
          operations (e.g. former industrial uses or mineral tips).
    - site:
        in:
        - near-landfill-site
        description: On or within 250 metres of a former landfill site.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraphs 16 and 197
source-text: All planning applications where there is reason to suspect contamination of the application
  site or neighbouring land due to previous operations e.g. the existence of former industrial uses, the
  presence of former landfill sites, the presence of former mineral tips.
must-include:
- item: 'A preliminary risk assessment: a desk study, walkover site reconnaissance and a conceptual model
    of pollutant linkages (sources, pathways and receptors)'
  level: must
- item: A risk assessment of landfill gas migration
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: On or within 250 metres of a former landfill site.
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 30 and the checklists
  on pages 54-72. The minerals (3.1), waste (3.2) and county development (3.3) checklists use the same
  wording.
review-status: unverified
field-status: {}
