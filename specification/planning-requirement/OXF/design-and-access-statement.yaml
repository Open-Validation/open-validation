reference: design-and-access-statement
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: Any part of the development is in a Conservation Area or World Heritage Site.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The provision of one or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings where the floor space created is 100m2 or more.
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A Design and Access Statement (DAS) must accompany planning applications for: … Applications
  for major development (where the site area is 1ha or more or the new floorspace to be created would
  be 1,000m2 or more); … where any part of the development is in a designated area (A Conservation Area
  or a World Heritage Site) development consisting of— … A statement will not be required for: … (b) engineering
  or mining operations; … (d) development which is waste development.'
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 8. Shown for county
  development (Regulation 3) only, because the list says no statement is needed for section 73 applications,
  engineering or mining operations, material changes of use or waste development.
review-status: unverified
field-status: {}
