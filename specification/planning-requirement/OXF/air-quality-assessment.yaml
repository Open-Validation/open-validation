reference: air-quality-assessment
local-authority: OXF
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - air-quality-management-area
        description: The site is within or adjoining an Air Quality Management Area.
    - discretionary
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: National Planning Policy Framework (2024) paragraph 199
source-text: All planning applications when the site is within or adjoining an Air Quality Management
  Area or when a sensitive ecological site will be affected, or when there would be a significant increase
  in traffic generation.
must-include:
- item: Assessment of adverse effects on air quality, including on human health and sensitive ecological
    habitats, sites and species, during construction and operation
  level: must
- item: A scheme showing how the development will limit its impact on the surrounding environment
  level: must
- item: A dust suppression scheme where the development could generate increased dust
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 14-15 and the checklists
  on pages 54-72. Effects on a sensitive ecological site and a 'significant increase in traffic generation'
  are shown as discretionary. The minerals (3.1), waste (3.2) and county development (3.3) checklists
  use the same wording.
review-status: unverified
field-status: {}
