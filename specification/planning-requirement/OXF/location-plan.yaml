reference: location-plan
local-authority: OXF
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications other than Section 73/73A applications, for detailed submissions pursuant
  to planning conditions and non-material amendment applications.
must-include:
- item: Based on an up to date Ordnance Survey map at a suitable metric scale proportionate to the size
    of the development
  level: must
- item: Clearly titled, with a unique reference number, and dated
  level: should
- item: At least two named roads and surrounding buildings, with properties numbered or named, so the
    exact location is clear
  level: should
- item: Application site edged clearly with a solid red line, including all land needed to carry out the
    development (e.g. access from a public highway, visibility splays, landscape treatment, car parking
    and open areas around buildings)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the application
    site
  level: must
confidence: medium
notes: From the council's list (adopted 31 March 2025, published April 2025), page 9 and the checklists
  on pages 54-72. The red and blue lines may instead be shown on the site plan if the location plan's
  scale cannot show them accurately. The minerals (3.1), waste (3.2) and county development (3.3) checklists
  use the same wording.
review-status: unverified
field-status: {}
