reference: design-and-access-statement
local-authority: SWD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          description: Within a conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building with floorspace of 100 sq m or more.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Design and Access Statement for all major development and for development within a conservation
  area consisting of one or more dwellings or a building with floor space of 100 square metres or more
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 5 'Non-householder checklist'. It is in the 'Applications may also require' list
  of the non-householder checklists (full, outline and reserved matters, including with listed building
  consent or advertisement consent).
review-status: unverified
field-status: {}
