reference: design-and-access-statement
local-authority: SWD
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
confidence: medium
notes: 'From the audit (missing_requirement): all major, and in a conservation area 1+ dwellings or 100
  sqm+.'
review-status: unverified
field-status: {}
