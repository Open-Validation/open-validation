reference: cil-form
local-authority: SWD
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - ldc-existing-use
  - any:
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: Development of new floorspace, including residential extensions.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The creation of a new dwelling (of any size).
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: Conversion of a building.
      - condition:
          field: vacant-building
          value: true
          description: The building is no longer in use.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: A Community Infrastructure Levy Additional Information form for all applications for development
  of floor space (including residential extensions, for the creation of a new dwellings (of any size),
  or for the conversion of a new building no longer in use)
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 2 'Checklist for certificates of lawfulness'; page 3 'Householder consent checklist';
  page 5 'Non-householder checklist'. On the householder, non-householder, planning permission + advertisement
  and lawful development certificate (existing) checklists.
review-status: unverified
field-status: {}
