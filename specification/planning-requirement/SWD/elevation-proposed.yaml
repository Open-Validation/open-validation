source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: existing and proposed elevations at a scale of 1:50 or 1:100 to show the external changes
  … elevations (1:50 or 1:100) where appropriate … advertisement drawings at a scale of 1:20 or 1:50 showing
  advert size, siting, materials, colours, height above ground, extent of projection, fixing details and
  methods and levels of illumination … an appropriate drawing and/or details to describe the development
  including proposed elevations
must-include:
- item: At a scale of 1:50 or 1:100, showing the external changes
  level: must
- item: Building materials, finish of doors and windows and relationship to adjoining buildings
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: A listed building.
- item: Advertisement drawings at a scale of 1:20 or 1:50 showing advert size, siting, materials, colours,
    height above ground, extent of projection, fixing details and methods and levels of illumination
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Non-material amendments: clearly identifies the amendment'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 2 'Checklist for certificates of lawfulness'; page 3 'Householder consent checklist';
  page 4 'Checklist for listed buildings'; page 5 'Non-householder checklist'; page 6 'Checklist for prior
  notifications'. The advertisement drawings are kept here (no separate id). Telecommunications prior
  notifications need a drawing and/or details including proposed elevations.
