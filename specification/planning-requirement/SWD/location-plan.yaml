policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: a Site Location Plan identifying the land to which the application relates. It should be
  based on an up-to-date map at a scale of 1:1250 or 1:2500. The site should be edged in red and sufficient
  roads and buildings should be identified. It must include all land necessary to carry out the development
  including access from a public highway, landscaping, car parking and open areas. Other land owned or
  controlled by the applicant should be edged in blue. … a plan at an appropriate scale 1:2500 showing
  the location and length of the hedgerow (s) to be removed
must-include:
- item: Based on an up-to-date map at a scale of 1:1250 or 1:2500
  level: should
- item: The site edged in red, with sufficient roads and buildings identified
  level: should
- item: All land necessary to carry out the development, including access from a public highway, landscaping,
    car parking and open areas
  level: must
- item: Other land owned or controlled by the applicant edged in blue
  level: should
- item: 'Hedgerow removal: at 1:2500, showing the location and length of the hedgerow(s) to be removed'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 2 'Checklist for certificates of lawfulness'; page 3 'Householder consent checklist';
  page 4 'Checklist for listed buildings'; page 5 'Non-householder checklist'; page 6 'Checklist for prior
  notifications'. Every checklist except approval of details reserved by condition and tree works asks
  for it; for hedgerow removal it is a 1:2500 plan of the hedgerow.
