reference: noise-assessment
local-authority: SWD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: The proposal could affect noise sensitive properties.
      - discretionary
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal involves activities that may generate significant levels of noise.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
source-text: A Noise Impact Assessment for proposals that could affect noise sensitive properties and/or
  involve activities that may generate significant levels of noise
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 5 'Non-householder checklist'. 'Could affect noise sensitive properties' has no
  threshold, so that part is discretionary. It is in the 'Applications may also require' list of the non-householder
  checklists (full, outline and reserved matters, including with listed building consent or advertisement
  consent).
review-status: unverified
field-status: {}
