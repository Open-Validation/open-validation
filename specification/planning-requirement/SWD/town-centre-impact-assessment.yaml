source-text: A Retail Impact Assessment for all major retail development … A Town Centre Uses Impact Assessment
  for proposals for town centre uses to demonstrate accordance with the requirements of the National Planning
  Policy Framework
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 5 'Non-householder checklist'. Combines the Retail Impact Assessment (all major
  retail development) and the Town Centre Uses Impact Assessment ('to demonstrate accordance with' the
  NPPF, which sets no single threshold, so discretionary). It is in the 'Applications may also require'
  list of the non-householder checklists (full, outline and reserved matters, including with listed building
  consent or advertisement consent).
