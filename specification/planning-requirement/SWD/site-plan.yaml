source-text: a Block Plan at a scale of 1:100 or 1:200 or 1:500 identifying the position of the development.
  The plan should include written dimensions of the development to the site boundaries and other existing
  buildings, access arrangements, public rights of way, position of trees, hard surfacing and boundary
  treatments. … a site plan showing the location of all tree(s) and relevant site features … plans identifying
  the proposed road showing landscaping details
