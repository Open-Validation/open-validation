policy: Conservation of Habitats and Species Regulations 2017; Environment Act 2021
source-text: An Ecological Impact Assessment report if the proposal will have an impact on wildlife and
  biodiversity. … a Biodiversity Survey (Phase 1 Habitat Survey) if the proposal is likely to have an
  impact on wildlife and biodiversity … full ecological assessment including mitigation measures
must-include:
- item: 'Hedgerow removal: mitigation measures'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 5 'Non-householder checklist'. 'Impact on wildlife and biodiversity' has no threshold,
  so discretionary. It is in the 'Applications may also require' list of the non-householder checklists
  (full, outline and reserved matters, including with listed building consent or advertisement consent).
  The planning permission + advertisement checklist calls it a Biodiversity Survey (Phase 1 Habitat Survey);
  hedgerow removal always needs a full ecological assessment.
