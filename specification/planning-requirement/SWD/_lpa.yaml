  date-basis: 'Undated web pages: ''Checklists for planning applications'' (7 pages: advertisements, lawful
    development certificates, householder, listed buildings, non-householder, prior notifications and
    heritage statements), read 2026-11-06. No page gives a ''last updated'' date and the site''s sitemap
    has no lastmod. The newest dated reference is the Planning Guarantee change for applications submitted
    on or after 6 December 2023; the prior notification checklist still cites the 1995 General Permitted
    Development Order. The checklists are still the only list linked from the council''s planning application
    pages, and planning.data.gov.uk points to the same pages. Without a date it cannot be shown to be
    less than 2 years old, so it is marked outdated. The non-householder page (planning permission) is
    used as the list URL; each file''s source-url is the page its wording comes from.'
  status: outdated
