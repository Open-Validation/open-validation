reference: heritage-statement
local-authority: SWD
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - archaeological-priority-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The proposal has the potential to impact on a heritage asset, such as a listed building,
        conservation area or archaeological features.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/7
source-text: Where a development proposal has the potential to impact on a heritage asset, such as a listed
  building, conservation area or archaeological features, a Heritage Statement should be submitted with
  the planning application.
confidence: medium
notes: The audit says it is also on the non-householder checklist (heritage assets affected) and, as a
  Heritage Impact Assessment, on the householder checklist where the dwelling is listed.
review-status: unverified
field-status: {}
