reference: heritage-statement
local-authority: SWD
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      description: The proposal is in or affects a heritage asset (designated, or identified by the council
        including local listing).
  - condition:
      field: listed-building-setting
      value: true
      description: The proposal affects the setting of a heritage asset.
  - all:
    - application-type:
        in:
        - demolition-con-area
    - site:
        in:
        - conservation-area
        description: Relevant demolition within a conservation area.
  - discretionary
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
policy: NPPF; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: A Heritage Statement if the proposal affects heritage assets … a Heritage Impact Assessment
  to provide detailed information on the affected part of the Listed Building, with an explanation of
  how the impact relates to the significance of the Listed Building as a whole … Information must be submitted
  with any application for Planning Permission (PP) or Listed Building Consent (LBC) in or affecting Heritage
  Assets. It is also required where development proposals affect the setting of heritage assets. Applications
  for relevant demolition within conservation areas should also include the supporting evidence and justification.
  … A Heritage Statement may also be requested if the council identifies the building or site as a non-designated
  heritage asset during the pre-application or application process.
must-include:
- item: The nature, extent and significance of the asset and its setting, detailed enough to assess the
    impact of the proposals on that significance and setting
  level: should
- item: An analysis of significance and the principles and justification for the works and their impact
    on significance
  level: must
- item: Evidence of having consulted the Wiltshire and Swindon Historic Environment Record (HER) and the
    National Heritage List, as a minimum
  level: must
- item: 'Listed buildings: detailed information on the affected part of the listed building, explaining
    how the impact relates to the significance of the listed building as a whole'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: A listed building.
- item: Reference to statutory legislation and relevant national and local planning policies to justify
    the proposals
  level: must
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 3 'Householder consent
  checklist'; page 4 'Checklist for listed buildings'; page 5 'Non-householder checklist'; page 7 'Heritage
  statements'. The listed building checklists (householder, non-householder and listed building consent)
  call it a Heritage Impact Assessment; the 'Heritage statements' page says both names mean the same requirement,
  so they are kept in one file. A statement may also be asked for where the council identifies a non-designated
  heritage asset, shown as discretionary.
review-status: unverified
field-status: {}
