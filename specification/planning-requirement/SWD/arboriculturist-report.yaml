reference: arboriculturist-report
local-authority: SWD
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal is likely to affect trees within the site or on adjacent land.
  - application-type:
      in:
      - hedgerow-removal
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
source-text: A Tree Survey and/or Arboricultural Statement if the proposal is likely to affect trees within
  the application site or on land adjacent to the site … a Tree Survey (Woody species) and Arboricultural
  Implications report
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 5 'Non-householder checklist'. It is in the 'Applications may also require' list
  of the non-householder checklists (full, outline and reserved matters, including with listed building
  consent or advertisement consent). The hedgerow removal checklist asks for a tree survey (woody species)
  and arboricultural implications report.
