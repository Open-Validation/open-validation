reference: flood-risk-assessment
local-authority: SWD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Environment Agency Flood Zones 2 and 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or over.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or over.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
policy: NPPF
source-text: A Flood Risk Assessment for all developments in Flood Risk Zones 2 and 3 as defined by the
  Environment Agency, or any development of 1 hectare or over
confidence: medium
notes: From the council's list (undated web pages, read 6 November 2026), page 1 'Checklist for display
  advertisements'; page 5 'Non-householder checklist'. It is in the 'Applications may also require' list
  of the non-householder checklists (full, outline and reserved matters, including with listed building
  consent or advertisement consent).
review-status: unverified
field-status: {}
