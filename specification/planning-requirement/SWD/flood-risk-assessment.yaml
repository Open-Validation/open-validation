reference: flood-risk-assessment
local-authority: SWD
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
source-url: https://www.swindon.gov.uk/info/20268/planning_applications/493/checklists_for_planning_applications/5
confidence: medium
notes: From the audit (missing_requirement).
review-status: unverified
field-status: {}
