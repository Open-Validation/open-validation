source-text: 'Householder: Block Plans: existing and proposed at 1:500 scale Floor Plans: existing and
  proposed, including roof plans, at 1:50 or 1:100 scale Elevations: existing and proposed at 1:50 or
  1:100 scale.


  Listed building consent, Lawful development cert: in blue 2 Block Plans Existing and proposed at a scale
  of 1:500 Floor Plans Existing and proposed, including roof, and showing finished floor and site levels
  at 1:50 Demolition Plans – required where removal of walls, floors, staircases (or parts of those building
  elements) is proposed at 1:50 External elevations Existing and proposed at 1:50.


  Advertisement consent: Block Plans: existing and proposed at 1:500 scale (showing the position of the
  proposed adverts in relation to the highway/footpath/street furniture etc) Elevations: existing and
  proposed at 1:50 or 1:100 scale Advertisement drawing(s) at 1:50 or 1:100 scale, and 1:20 where detailed
  design is required, showing the size, siting, materials and colours, height above ground level, extent
  of projection, and details of any illumination (including method, colour and intensity), where applicable.


  Change of use - prior approval: Proposed site plan This must indicate the site and show the proposed
  development and any existing enlargement of the original dwellinghouse to which the enlarged part will
  be joined;'
