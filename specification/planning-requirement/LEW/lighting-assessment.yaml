source-text: 'Full planning: A lighting assessment ensuring that any lighting needed to contribute to
  a safer environment is balanced against the need to be sensitive to the surrounding area, avoiding excessive
  lighting and the potential for light pollution and protecting residential amenity and biodiversity.


  Advertisement consent: Lighting details All applications for illuminated adverts (internal and external
  illumination) What is required? The following information is required: a statement of compliance, with
  evidence, to relevant guidance notes produced by the Lighting Engineers and/or Chartered Institution
  of Building Services Engineers, for the reduction of light pollution. the proposed hours of operation
  of the illuminated elements Statutory Basis, Development Plan, National Policy and/or Guidance The NPPF
  policies'
