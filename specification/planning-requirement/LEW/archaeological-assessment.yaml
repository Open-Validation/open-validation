reference: archaeological-assessment
local-authority: LEW
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: The site is in an Archaeological Priority Area.
  - any:
    - condition:
        field: basement
        value: true
        description: The proposal includes new or extended basements.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves excavation.
source-url: https://lewisham.gov.uk/-/media/services/planning/planning-validation/1-planning-permission-for-major-applications.pdf
source-text: 'Householder: Archaeological Desk Based Assessment (DBA) Applications in Archaeological Priority
  Areas that propose new or extended basements and or excavation A desk based archaeological assessment
  is required at a minimum to understand the likelihood of the discovery or destruction of non-designated
  heritage assets of archeological interest and will inform the need for applications of archaeological
  conditions to a permission.


  Full planning: by an Archaeological Statement, which should be London Borough of Lewisham Validation
  Checklist 27 submitted as part of the Heritage Statement and refer to any relevant information in the
  Greater London Historic Environment Record (GLHER).'
