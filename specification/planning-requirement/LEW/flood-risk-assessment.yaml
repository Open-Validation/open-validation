reference: flood-risk-assessment
local-authority: LEW
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: The site is in flood zone 2 or 3, or at surface water flood risk (for householders,
        where the ground floor footprint is altered).
source-url: https://lewisham.gov.uk/-/media/services/planning/planning---sela-lee-liam/validationpdfs2022/1-major-applications-local-list.pdf
source-text: Sites of 1ha+ in Flood Zone 1; all proposals in Flood Zones 2 or 3 or at surface water flood
  risk … [Householder] Flood Risk Assessment Form All proposals to alter the ground floor floorprint,
  located in Flood Zone 2 or 3 or if the site is subject to Surface Water Flood Risk as designated by
  the Environment Agency (even if in Flood Zone 1.
confidence: low
notes: 'Audit (other): the workbook used the draft 2026 trigger (''all major developments within Flood
