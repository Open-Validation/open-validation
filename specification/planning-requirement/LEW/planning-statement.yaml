reference: planning-statement
local-authority: LEW
source-url: https://lewisham.gov.uk/-/media/services/planning/planning-validation/1-planning-permission-for-major-applications.pdf
source-text: 'Full planning: required, the Planning Statement should provide an overview of the exercise
  and demonstrate the acceptability of the approach and proposed loss.assessment, or that fail to address
  the adopted Development Plan, will not be considered valid.


  Variation of condition s73: Planning Statement All applications Clear and convincing justification (alongside
  any supporting evidence) setting out why the amendment is necessary, and why it is considered to be
  ‘minormaterial’ in the context of the planning permission as a whole and any approved amendment(s) under
  s.96a (non-material), or other amendments previously granted planning permission under s.73 Relevant
  NPPG on CIL NPPG Dependent on the amendment(s) proposed.


  Non-material amendment: Planning Statement Clear and convincing justification (alongside any supporting
  evidence) setting out why the amendment is necessary, and why it is considered to be ‘non-material’
  in the context of the planning permission as a whole and any approved ‘non material’ amendment(s) under
  s.96a and/or ‘minor material’ amendments under s.73.'
