reference: town-centre-impact-assessment
local-authority: WRT
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A town centre use located outside town, district or local centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: Over 500 square metres of gross floor space.
source-url: https://www.warrington.gov.uk/sites/default/files/2023-10/Adopted%20Validation%20Checklist%20-%20June%202020%20%28amended%20Sept%2023%29.pdf
policy: SN5
source-text: 'SN5 Any town centre uses including commercial, retail or leisure uses located outside of
  town, district or local centres over 500 square metres of gross floor space This assessment should include:
  • • • a sequential test the impact of the proposal on existing, committed and planned public and private
  investment in a centre or centres in the catchment area of the proposal; and the impact of the proposal
  on the vitality and viability of adjacent centres, including local consumer choice and trade,'
must-include:
- item: A sequential test
  level: must
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment area
  level: must
- item: The impact on the vitality and viability of adjacent centres, including local consumer choice
    and trade
  level: must
confidence: medium
