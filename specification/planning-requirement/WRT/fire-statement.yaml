reference: fire-statement
local-authority: WRT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://warrington-lb.councilplatform.com/sites/default/files/2024-04/Adopted%20Validation%20Checklist%20-%2028-3-24.pdf
source-text: Any application (excluding outline apps) that would result in two or more dwellings or educational
  accommodation and…
confidence: medium
notes: 'Audit (wrong_app_type): the source expressly excludes outline applications.'
review-status: unverified
field-status: {}
