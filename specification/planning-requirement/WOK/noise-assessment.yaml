reference: noise-assessment
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Development would be considered a noise sensitive development.
      - condition:
          field: noise-generating-use
          value: true
          description: Development may lead to noise disturbance of adjoining occupiers.
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Development would be considered a noise sensitive development or may lead to noise disturbance
  of adjoining occupiers
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 14, 52 (Full Planning Approval; Document
  Descriptions). For outline applications the list asks for documents 'As per Full Planning Approval requirements
  however in acknowledgement that some matters may be reserved' (page 26), so outline is included; for
  reserved matters it asks for 'anything required to consider with matters previously reserved' (page
  28). For Technical Details Consent it is needed 'If required because of the permission in principle'
  (page 32), shown as discretionary.
review-status: unverified
field-status: {}
