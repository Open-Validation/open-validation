reference: floor-plan-proposed
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - lbc
      - ldc-proposed-work-lb
      - technical-details-consent
      - pa-storey
      - cho-commercial-to-dwh
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floor-layout-change
        value: true
        description: The change results in changes to the floor plans of the original proposal.
  - all:
    - application-type:
        in:
        - reserved-matters
        - non-material-amendment
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Plans – Existing and Proposed Floor All applications ... If the change to the development
  results in changes to the floor plans of the original proposal ... Plans – Proposed Floor All applications
  as applicable*
must-include:
- item: Scale 1:50 or 1:100 (or 1:200 if necessary)
  level: must
- item: The proposed works shown clearly in relation to what is already there
  level: must
- item: The whole building (for example the full terrace, the full pair of semi-detached dwellings or
    the full block); 'handed' plans and buildings split across separate plans are not accepted
  level: must
- item: 'New residential units: room furniture shown, to demonstrate the accommodation is of an appropriate
    size'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential units.
  source-text: Floor plans should also identify room furniture in order to demonstrate that the living
    accommodation is of an appropriate size.
- item: 'Class MA prior approval: the total floor space in square metres of each dwellinghouse, the dimensions
    and proposed use of each room, the position and dimensions of windows, doors and walls, and the elevations
    of the dwellinghouses'
  level: must
  required-if:
    application-type:
      in:
      - cho-commercial-to-dwh
  source-text: A floor plan indicating the total floor space in square metres of each dwelling house,
    the dimensions and proposed use of each room, the position and dimensions of windows, doors and walls,
    and the elevations of the dwelling houses
- item: 'Extending upwards prior approvals: an identified scale, north point, dimensions and proposed
    use of each room, and the position and dimensions of windows, doors and walls'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  source-text: A plan showing the proposed floor plans of the development with an identified scale, north
    point, dimensions and proposed use of each room, the position and dimensions of windows, doors and
    walls
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10-38, 54 (Validation by Application Type;
  Plans). For non-material amendments only 'as applicable', shown as discretionary; reserved matters likewise.
review-status: unverified
field-status: {}
