reference: viability-assessment
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Planning obligations including affordable housing would potentially make the scheme
          unviable.
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Provision of planning obligations including affordable housing would potentially make a scheme
  unviable
must-include:
- item: Existing Use Value supported by an independent valuation
  level: must
- item: Land acquisition price and the basis of its purchase; salient terms of acquisition; purchase process;
    purchase costs including legal and agency fees
  level: must
- item: Estimated sales values with independent supporting evidence, including a schedule of unit sizes
  level: must
- item: Marketing/disposal costs and fees
  level: must
- item: Estimated construction costs supported by tender costs or a QS schedule, with a specified contingency,
    contract-related fees and itemised 'abnormals'; itemised preliminary costs
  level: must
- item: Professional fees under each heading; S106/CIL costs as advised by the council
  level: must
- item: Financing rate and evidence of financing terms
  level: must
- item: Estimated profit, with contextual information on the developer's target returns
  level: must
- item: Value/cost of the affordable housing provision, where relevant, with tenure assumptions and calculation
    of any commuted sum
  level: must
- item: Supported by an appropriate cashflow analysis (if a standard model is used)
  level: must
- item: Agreement to pay the fee for an independent review of the appraisal
  level: must
- item: Prepared on the basis that it will be made public; an executive summary where details are commercially
    sensitive
  level: should
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 13, 59-60 (Full Planning Approval; Document
  Descriptions). The list calls it 'Economic Viability Appraisal'. Other planning obligations that could
  make a scheme unviable show as discretionary. For outline applications the list asks for documents 'As
  per Full Planning Approval requirements however in acknowledgement that some matters may be reserved'
  (page 26), so outline is included; for reserved matters it asks for 'anything required to consider with
  matters previously reserved' (page 28).
review-status: unverified
field-status: {}
