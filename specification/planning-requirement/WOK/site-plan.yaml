reference: site-plan
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - non-material-amendment
      - lbc
      - ldc-existing-use
      - ldc-proposed-work-lb
      - advertising
      - technical-details-consent
      - pa-extension
      - cho-commercial-to-dwh
      - pa-storey
      - pa-ecomms-network
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: site-layout-change
        value: true
        description: The change to the development results in changes to the site layout.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Plan – Site All applications ... If the change to the development results in changes to the
  site layout ... A plan indicating the site and showing the proposed development
must-include:
- item: Scale 1:500 (or 1:200 if necessary), indicated in writing or with a scale bar
  level: must
- item: The site boundaries and the position of buildings or structures adjacent to the site that could
    be affected
  level: must
- item: The development hatched, preferably in red (fences, walls or adverts can be shown by a line)
  level: should
- item: 'Advertisement consent: the location of each advertisement'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Plan – Site (showing location of each advertisement)
- item: 'Class AA and extending upwards prior approvals: an identified scale and north point'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  source-text: A plan indicating the site and showing the proposed development with an identified scale
    and north point
confidence: medium
notes: 'From the council''s list (adopted 5 September 2025), page 10-41, 54 (Validation by Application
  Type; Plans). For prior approvals this is the national ''plan indicating the site and showing the proposed
  development'' (agricultural: ''a plan indicating the site''). For outline applications the list asks
  for documents ''As per Full Planning Approval requirements however in acknowledgement that some matters
  may be reserved'' (page 26), but outline applications need parameter plans instead, listed as unmapped;
  for reserved matters it asks for ''anything required to consider with matters previously reserved''
  (page 28).'
review-status: unverified
field-status: {}
