reference: arboriculturist-report
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        description: Impact on trees protected by a Tree Preservation Order within or adjacent to the
          site.
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Impact on trees within or adjacent to the site (including street trees).
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Managing Development Delivery (MDD) Local Plan Policy CC03
source-text: Development would have an impact on trees protected by a Tree Preservation Order (TPO) within
  or adjacent to the site ... Development would have an impact on trees within or adjacent to the site
must-include:
- item: Which trees are to be retained, and the means of protecting them during construction
  level: must
- item: Prepared by a qualified arboriculturist, referring to best standard practice (British Standards
    guidance)
  level: should
- item: Reference to landscaping and detailed landscaping proposals following from the design concept
    in the Design and Access Statement, if required
  level: should
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10, 12, 46-47 (Householder; Full Planning
  Approval; Document Descriptions). The list calls it 'Arboricultural Assessment' or 'Arboricultural Statement/Tree
  Survey'. For householder applications only trees protected by a TPO count (changed in the 2025 review).
  For outline applications the list asks for documents 'As per Full Planning Approval requirements however
  in acknowledgement that some matters may be reserved' (page 26), so outline is included; for reserved
  matters it asks for 'anything required to consider with matters previously reserved' (page 28).
review-status: unverified
field-status: {}
