reference: sustainable-drainage-strategy
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development (1-9 houses or up to 999 sq m of new floorspace).
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Managing Development Delivery (MDD) Local Plan Policy CC10
source-text: Surface Water Drainage Strategy Development is ‘major development’ or ‘minor development’
must-include:
- item: How surface water will be managed following construction
  level: must
- item: Design details (including proposed materials) of surface water management systems / SuDS
  level: should
- item: A feasibility assessment of using SuDS (can be in a FRA or the surface water drainage strategy)
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 15, 57-58, 62 (Full Planning Approval;
  Document Descriptions; footnote xiv). The list calls it 'Surface Water Drainage Strategy'. For outline
  applications the list asks for documents 'As per Full Planning Approval requirements however in acknowledgement
  that some matters may be reserved' (page 26), so outline is included; for reserved matters it asks for
  'anything required to consider with matters previously reserved' (page 28). For Technical Details Consent
  it is needed 'If required because of the permission in principle' (page 32), shown as discretionary.
review-status: unverified
field-status: {}
