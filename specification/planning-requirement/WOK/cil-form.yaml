reference: cil-form
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - pa-extension
      - cho-commercial-to-dwh
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Development greater than 100 sq m in area.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: The change results in new build floor space.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Community Infrastructure Levy Regulations 2010
source-text: CIL Additional Information Form All applications ... If development is greater than 100m2
  in area ... If the change to the development results in new build floor space
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 7, 10-38, 48 (Using the list; Validation
  by Application Type). The list says to submit the form whenever an application is potentially CIL liable,
  even if the development would be exempt (page 7); outline applications are marked potentially liable.
  Not for permission in principle.
review-status: unverified
field-status: {}
