reference: cil-form
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: The variation creates new floorspace.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Over 100 square metres.
  - application-type:
      in:
      - pa-extension
      - pa-storey
      - cho-commercial-to-dwh
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: All applications
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type, missing_requirement): the workbook quoted the change log.
  Required for all householder and full applications (outline as per full); for s73 if new floorspace;
  for proposed LDCs over 100 m2; and for prior approvals under Class A, MA, AA and the new-storey classes.
  The prior approval types are mapped from those class names.'
review-status: unverified
