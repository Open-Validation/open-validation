reference: lighting-assessment
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: external-lighting
      value: true
      description: Development proposing external lighting.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Development proposing external lighting
must-include:
- item: Details of the external lighting and the proposed hours when it would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 14, 52 (Full Planning Approval; Document
  Descriptions). For outline applications the list asks for documents 'As per Full Planning Approval requirements
  however in acknowledgement that some matters may be reserved' (page 26), so outline is included; for
  reserved matters it asks for 'anything required to consider with matters previously reserved' (page
  28).
review-status: unverified
field-status: {}
