reference: town-centre-impact-assessment
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Development is for retail use and the site is outside town/village centres.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use of a site within a town/village centre.
      - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Managing Development Delivery (MDD) Local Plan Policy TB16; Core Strategy Policy CP13
source-text: Development is for retail use and site is outside town/village centres or change of use of
  site within town/village centres
must-include:
- item: 'Out of centre: proposed job numbers as full-time equivalents'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside town/village centres.
- item: 'Out of centre: a sequential test applied to sites outside centres'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside town/village centres.
- item: 'Out of centre: proposed floor space totals'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside town/village centres.
- item: 'Out of centre: any community benefits'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside town/village centres.
- item: 'Change of use from retail or offices in a town centre to a non-town-centre use: evidence the
    use is no longer required, including marketing for a period of up to six months'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Change of use from retail or offices within a town centre.
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 14, 55 (Full Planning Approval; Document
  Descriptions). The list calls it 'Retail Impact Assessment' / 'Retail/Office Impact Assessment'. There
  is no field for a site being inside a town or village centre, so a change of use there shows as discretionary.
  For outline applications the list asks for documents 'As per Full Planning Approval requirements however
  in acknowledgement that some matters may be reserved' (page 26), so outline is included; for reserved
  matters it asks for 'anything required to consider with matters previously reserved' (page 28).
review-status: unverified
field-status: {}
