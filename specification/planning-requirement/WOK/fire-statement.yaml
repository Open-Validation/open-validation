reference: fire-statement
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Part 3, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Fire Statement for development which: - Proposes a new or makes an alteration to a ''relevant
  building'' as defined in the ''DMPO'' part 3.'
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 12, 20, 29 (Full, Variation/Removal of
  condition and EIA applications). The 'relevant building' test (two or more dwellings or educational
  accommodation, and 18 m or 7 storeys) is the DMPO definition the list refers to.
review-status: unverified
field-status: {}
