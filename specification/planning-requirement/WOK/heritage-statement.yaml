reference: heritage-statement
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - listed-building
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - world-heritage-site
        description: Site is within a designated heritage asset or includes designated heritage assets
          of any scale (e.g. any building or park).
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Site is within a designated heritage asset or includes designated heritage assets of any
  scale (e.g. any building or park) ... Heritage Statement All applications
must-include:
- item: The overall significance of the building, conservation area, neighbouring heritage assets and
    setting, identifying what is of high, medium and low significance and how the building has changed
    over time
  level: should
- item: An assessment of the potential impact of the proposal on that significance (can be a table)
  level: should
- item: Each heritage feature affected, with its age, design and quality
  level: should
- item: The significance of each feature, and the proposed works and their impact on it
  level: should
- item: Justification for the works, or mitigation measures to limit harm
  level: should
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10, 13, 22, 50-51 (Householder; Full Planning
  Approval; Listed Building Consent; Document Descriptions). The description also expects a statement
  for an area of special character, a building of traditional local character or a local historic park
  and garden, or the setting of any of these; the application-type tables name only designated assets.
  For outline applications the list asks for documents 'As per Full Planning Approval requirements however
  in acknowledgement that some matters may be reserved' (page 26), so outline is included; for reserved
  matters it asks for 'anything required to consider with matters previously reserved' (page 28). For
  Technical Details Consent it is needed 'If required because of the permission in principle' (page 32),
  shown as discretionary.
review-status: unverified
field-status: {}
