reference: telecommunications-report
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Full telecommunications approval.
  - all:
    - application-type:
        in:
        - pa-ecomms-network
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Telecommunications Development Statement All applications ... Evidence that the requirements
  of the GDPO have been met if they apply to the circumstance
must-include:
- item: Details of the area of search
  level: must
- item: Details of any consultation undertaken
  level: must
- item: Appraisal of suitable sites
  level: must
- item: Details of the proposed structure and technical justification
  level: must
- item: A signed declaration that the equipment and installation fully meets ICNIRP requirements
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 30, 41, 58 (Full Telecommunications Approval;
  Prior Determination Telecommunications; Document Descriptions). For the 56-day prior approval the national
  requirement is evidence that the GPDO requirements are met 'if they apply', shown as discretionary.
