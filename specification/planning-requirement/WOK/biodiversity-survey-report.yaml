reference: biodiversity-survey-report
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - all:
        - condition:
            field: minor-development
            value: true
            description: Minor development (1-9 houses or up to 999 sq m of new floorspace).
        - condition:
            field: protected-species
            value: true
            description: Would potentially impact protected species.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - lbc
    - condition:
        field: protected-species
        value: true
        description: Any part of the site falls within a suitable bat roosting area (council's planning
          constraints map).
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Works affecting an existing roof, including soffits and fascia boards.
      - condition:
          field: external-alterations
          value: true
          description: Works to cladding, hanging tiles or weatherboard.
      - condition:
          field: demolition
          value: true
          description: Demolition.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Managing Development Delivery (MDD) Local Plan paragraph 3.116; EC Habitats Directive 1992
source-text: Development is 'major development' or if 'minor development' where it would potentially impact
  protected species ... If any part of the site falls within suitable bat roosting area and development
  includes any works affecting an existing roof (including soffits and fascia boards) or cladding, hanging
  tiles or weatherboard or demolition ... Site is within badger sett consultation zone
must-include:
- item: 'Bat survey: a daylight bat survey/report completed in the last 12 months by a licensed ecologist
    (not the applicant or agent)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - lbc
    - condition:
        field: protected-species
        value: true
        description: Any part of the site falls within a suitable bat roosting area (council's planning
          constraints map).
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Works affecting an existing roof, including soffits and fascia boards.
      - condition:
          field: external-alterations
          value: true
          description: Works to cladding, hanging tiles or weatherboard.
      - condition:
          field: demolition
          value: true
          description: Demolition.
- item: Badger survey
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
  source-text: 'Site is within badger sett consultation zone (NB: this data is not publicly available
    and therefore we will inform you at the point of validation if this survey is required)'
- item: Follows the CIEEM Guidelines for Preliminary Ecological Appraisal 2017
  level: should
confidence: medium
notes: 'From the council''s list (adopted 5 September 2025), page 10, 12-13, 22, 47 (Householder, Full
  Planning Approval, Listed Building Consent; Document Descriptions). The list''s ''Biodiversity Report'',
  ''Bat Survey'' and ''Badger Survey'' rows are shown together (the list says the report may incorporate
  a bat survey). The badger sett zone is not public, so the council tells applicants at validation: shown
  as discretionary. For outline applications the list asks for documents ''As per Full Planning Approval
  requirements however in acknowledgement that some matters may be reserved'' (page 26), so outline is
  included; for reserved matters it asks for ''anything required to consider with matters previously reserved''
  (page 28). For Technical Details Consent it is needed ''If required because of the permission in principle''
  (page 32), shown as discretionary.'
review-status: unverified
field-status: {}
