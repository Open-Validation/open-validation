reference: affordable-housing-statement
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: A net increase of 5 dwellings or more.
    - all:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.16
          description: Site area greater than 0.16 hectares.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential dwellings are proposed.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Development is for a net increase of 5 dwellings or more or site area is greater than 0.16
  hectares and residential dwellings are proposed
must-include:
- item: The numbers of residential units
  level: should
- item: Mix of units, with numbers of habitable rooms and/or bedrooms or the floor space of habitable
    areas
  level: should
- item: Garden area or public open space
  level: should
- item: Plans showing the location of units and their number of habitable rooms and/or bedrooms, and/or
    floor space
  level: should
- item: 'Where different levels or types of affordability or tenure are proposed for different units:
    a clear and full explanation'
  level: should
- item: Details of any Registered Social Landlords acting as partners
  level: should
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 12, 46 (Full Planning Approval; Document
  Descriptions). For outline applications the list asks for documents 'As per Full Planning Approval requirements
  however in acknowledgement that some matters may be reserved' (page 26), so outline is included; for
  reserved matters it asks for 'anything required to consider with matters previously reserved' (page
  28).
review-status: unverified
field-status: {}
