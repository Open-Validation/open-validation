reference: energy-statement
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Managing Development Delivery (MDD) Local Plan Policies CC05 and NRM11; Sustainable Design and
  Construction SPD (May 2010)
source-text: Energy Statement Development is “major development” ... Development is ‘major’
must-include:
- item: The predicted energy demand of the development and how far it meets current energy efficiency
    standards
  level: should
- item: A 10% reduction in carbon emissions, and at least 10% of expected energy demand from decentralised,
    renewable or low carbon sources
  level: should
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 13, 28, 49-50, 61-62 (Full Planning Approval;
  Approval of Reserved Matters; Document Descriptions; footnotes iv and xiii). New in the 2025 review
  for major full applications. It may be combined with the Sustainability Statement. For outline applications
  the list asks for documents 'As per Full Planning Approval requirements however in acknowledgement that
  some matters may be reserved' (page 26), so outline is included; for reserved matters it asks for 'anything
  required to consider with matters previously reserved' (page 28).
