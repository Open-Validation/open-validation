reference: land-contamination-assessment
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - contaminated-land
        description: Site is known or suspected to be contaminated.
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: greenfield-site
        value: true
        description: Green field site (to check whether historical use causes contamination concerns).
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Site is known or suspected to be contaminated ... Site is known or suspected to be contaminated
  or green field site
must-include:
- item: Enough information to determine the existence or otherwise of contamination, its nature, the risks
    it may pose and whether/how they can be satisfactorily mitigated
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10, 14, 51-52 (Householder; Full Planning
  Approval; Document Descriptions). For outline applications the list asks for documents 'As per Full
  Planning Approval requirements however in acknowledgement that some matters may be reserved' (page 26),
  so outline is included; for reserved matters it asks for 'anything required to consider with matters
  previously reserved' (page 28). For Technical Details Consent it is needed 'If required because of the
  permission in principle' (page 32), shown as discretionary.
review-status: unverified
field-status: {}
