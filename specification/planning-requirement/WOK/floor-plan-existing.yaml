reference: floor-plan-existing
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - lbc
      - ldc-proposed-work-lb
      - technical-details-consent
      - pa-storey
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floor-layout-change
        value: true
        description: The change results in changes to the floor plans of the original proposal.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Plans – Existing and Proposed Floor All applications ... If the change to the development
  results in changes to the floor plans of the original proposal
must-include:
- item: Scale 1:50 or 1:100 (or 1:200 if necessary)
  level: must
- item: The proposed works shown clearly in relation to what is already there
  level: must
- item: The whole building (for example the full terrace, the full pair of semi-detached dwellings or
    the full block); 'handed' plans and buildings split across separate plans are not accepted
  level: must
- item: 'New residential units: room furniture shown, to demonstrate the accommodation is of an appropriate
    size'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential units.
  source-text: Floor plans should also identify room furniture in order to demonstrate that the living
    accommodation is of an appropriate size.
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10-37, 54 (Validation by Application Type;
  Plans). Includes Full Telecommunications Approval (page 30) and the Class AA prior approval (page 37).
  The council's 'What documents you need to submit' page adds that change of use applications need existing
  and proposed floor plans even with no internal alterations.
review-status: unverified
field-status: {}
