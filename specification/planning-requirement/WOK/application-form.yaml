reference: application-form
local-authority: WOK
required-if:
  always: true
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Completed application form ... Combined ownership certificates and agricultural land declaration
must-include:
- item: Combined ownership certificates and agricultural land declaration
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - lbc
      - ldc-existing-use
      - advertising
      - pip
      - technical-details-consent
- item: 'Advertisement consent: details of each advertisement'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Completed application form with details of each advertisement
- item: 'Agricultural prior approval: a description of the materials to be used'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
  source-text: Description of materials to be used
- item: 'Class MA prior approval: a statement specifying the net increase in dwellinghouses'
  level: must
  required-if:
    application-type:
      in:
      - cho-commercial-to-dwh
  source-text: A statement specifying the net increase in dwellinghouses proposed by the development
- item: 'Extending upwards prior approvals: a written statement of the number of new dwellinghouses and
    those in the building before the development, and a list of all the addresses of the flats in the
    existing block'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  source-text: A written statement identifying the number of new dwelling houses in addition to the number
    of dwelling houses in the building prior to the development
- item: 'Tree works: a full clear specification of the works for each tree, and a statement of reasons
    for the proposed work (vague terms such as ''cut-back'', ''lop'' or ''trim'' are not enough)'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  source-text: A full clear specification of the works to be carried out ... A statement of reasons for
    the proposed work
- item: 'Approval of details reserved by condition: a letter confirming the condition numbers to be discharged
    (a standard form is optional)'
  level: must
  required-if:
    application-type:
      in:
      - approval-condition
  source-text: Letter confirming request to discharge condition numbers relating to planning application
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10-45 (Validation by Application Type).
  The application form is a national requirement for almost every type; for modification or discharge
  of a S106 obligation the list asks for it locally (page 44). A demolition prior approval also needs
  a statement that the site notice has been displayed (listed as unmapped).
review-status: unverified
field-status: {}
