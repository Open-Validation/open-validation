reference: location-plan
local-authority: WOK
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - ldc-prospective-use
    - s73
    - lbc
    - ldc-existing-use
    - ldc-proposed-work-lb
    - advertising
    - pip
    - technical-details-consent
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Plan – Location ... All applications – red line must be the same as original application
must-include:
- item: Based on an up-to-date map (preferably OS based)
  level: must
- item: Direction of north (arrow or compass)
  level: must
- item: Scale 1:1250 or 1:2500 (for larger sites), indicated in writing or with a scale bar
  level: must
- item: Scaled to fit onto A4 paper
  level: must
- item: Two named roads (in most circumstances)
  level: must
- item: The application site edged with an unbroken and continuous red line, including all land necessary
    for the development (access from a public highway, visibility splays, landscaping, car parking, open
    areas around buildings)
  level: must
- item: An unbroken and continuous blue line around any other land owned by the applicant close to or
    adjoining the site
  level: must
- item: 'Variation or removal of a condition: the red line the same as the original application'
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: All applications – red line must be the same as original application
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10-32, 53-54 (Validation by Application
  Type; Plans). It is also the only local requirement for pre-application advice (page 17). Prior approvals
  instead need 'a plan indicating the site' (see site plan).
review-status: unverified
field-status: {}
