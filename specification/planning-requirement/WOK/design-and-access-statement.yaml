reference: design-and-access-statement
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: Residential development of over 10 dwellings (including conversions).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 100
        description: Non-residential development over 100 square metres.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
confidence: medium
notes: 'Audit (wrong_app_type): for Full applications the Design and Access Statement appears only among
  the national requirements. Outline applications need a Design and Access Statement or Sustainability
  Statement for residential over 10 dwellings (incl. conversions) or non-residential over 100 m2.'
review-status: unverified
field-status: {}
