reference: design-and-access-statement
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Floor space created greater than 100 sq m.
  - all:
    - application-type:
        in:
        - outline
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 100
        description: Non-residential development over 100 sq m floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Core Strategy
  Policy CP1; Managing Development Delivery (MDD) Local Plan Policies CC04 and CC05
source-text: 'Design and Access Statement for development which is: - ''major development'' (excluding
  material change of use) - When the site is in a Conservation Area and development is for one or more
  dwelling houses or the floor space created is greater than 100m2 (excluding material change of use)
  ... Listed building consent applications must also include a DAS.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: How the development's context has influenced the design
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access have been addressed
  level: must
- item: Proportionate to the complexity of the application, but not long
  level: should
- item: 'Outline: a framework showing how the proposal will meet Core Strategy Policy CP1, MDD Policies
    CC04 and CC05 (as clarified by the Climate Change Interim Policy Position Statement) and the Sustainable
    Design and Construction SPD (a Sustainability Statement may be submitted instead)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - outline
    - any:
      - ref: major-development
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 100
          description: Non-residential development over 100 sq m floorspace.
  source-text: All residential development of more than 10 dwellings (major development) – including conversions,
    subdivisions and changes of use.; all non-residential development over 100m2 floorspace.
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 12, 26-27, 29, 48-49 (Full, Outline and
  EIA applications; Document Descriptions). Not for a material change of use, waste development, engineering
  or mining operations. For outline applications the local list also asks for a statement setting out
  the sustainability framework for major residential development (including conversions) and non-residential
  development over 100 sq m.
review-status: unverified
field-status: {}
