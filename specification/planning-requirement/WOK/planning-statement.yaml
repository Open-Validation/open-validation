reference: planning-statement
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - s73
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - listed-building
        - conservation-area
        description: The advert impacts a listed building or is in a Conservation Area.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Planning Statement All applications ... All applications – to explain the reasoning for removing
  or varying condition ... Advert impacts a listed building or is located within a Conservation Area
must-include:
- item: How the development accords with relevant national and local policies and supplementary guidance
  level: must
- item: Reference to relevant site history
  level: must
- item: A supporting document/plan list
  level: must
- item: 'Variation or removal of a condition: the reasoning for removing or varying the condition'
  level: must
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 14, 20, 25, 53 (Full Planning Approval;
  Variation/Removal of condition; Advertisement Consent; Document Descriptions). For outline applications
  the list asks for documents 'As per Full Planning Approval requirements however in acknowledgement that
  some matters may be reserved' (page 26), so outline is included; for reserved matters it asks for 'anything
  required to consider with matters previously reserved' (page 28).
review-status: unverified
field-status: {}
