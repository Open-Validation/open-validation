reference: roof-plan-existing
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: new-build
        value: true
        description: Development includes new buildings.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: Works to the roof of the building are proposed.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Development includes new buildings ... Works to roof of building are proposed
must-include:
- item: Scale 1:50 or 1:100 (or 1:200 if necessary)
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 14, 22, 54 (Full Planning Approval; Listed
  Building Consent; Plans).
review-status: unverified
field-status: {}
