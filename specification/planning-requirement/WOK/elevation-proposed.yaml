reference: elevation-proposed
local-authority: WOK
required-if:
  any:
  - application-type:
      in:
      - hh
      - ldc-prospective-use
      - lbc
      - ldc-proposed-work-lb
      - advertising
      - technical-details-consent
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: building-works
        value: true
        description: Not where a change of use is the only form of development.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: external-alterations
        value: true
        description: The change results in changes to the elevations of the original proposal.
  - all:
    - application-type:
        in:
        - reserved-matters
        - non-material-amendment
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Plans – Existing and Proposed Elevation All applications ... All applications (except where
  a change of use is the only form of development) ... If the change to the development results in changes
  to the elevations of the original proposal ... Plans – Proposed Elevations All applications as applicable*
must-include:
- item: Scale 1:50 or 1:100 (or 1:200 if necessary)
  level: must
- item: The proposed works shown clearly in relation to what is already there
  level: must
- item: Every elevation the proposal affects, no matter how minor (unaffected elevations may be left out
    only where this is clear)
  level: must
- item: Proposed building materials and details of adjoining buildings when in close proximity
  level: should
- item: 'Advertisement consent: details of each advertisement; for illuminated adverts the level of luminance/wattage'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Plans - Existing and Proposed Elevations (showing details of each advertisement - for illuminated
    adverts detail means level of luminance/wattage)
- item: 'Class AA prior approval: the position and dimensions of the proposed windows, with an identified
    scale'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
  source-text: A plan showing the position and dimensions of the proposed windows with an identified scale
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10-38, 54 (Validation by Application Type;
  Plans). For non-material amendments only 'as applicable' (for example not for a change of materials),
  shown as discretionary; reserved matters likewise.
review-status: unverified
field-status: {}
