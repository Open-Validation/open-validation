reference: bng-metric
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development (1-9 houses or up to 999 sq m of new floorspace).
  - application-type:
      in:
      - outline
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Schedule 7A, Town and Country Planning Act 1990
source-text: Development is 'major development' or 'minor development' ... Biodiversity Net Gain Information
  (applicable from November 2023 for major development and April 2024 for minor development) All applications
must-include:
- item: A baseline assessment using the Defra Statutory Metric or the Small Sites Metric (if the site
    qualifies)
  level: must
- item: A strategy to achieve at least 10% net gain on the baseline
  level: must
- item: A statement on degradation
  level: must
- item: A statement on whether irreplaceable habitat is present
  level: must
- item: The date proposed for the baseline assessment
  level: must
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 13, 26, 48 (Full and Outline Planning
  Approval; Document Descriptions). For outline applications a baseline calculation and a strategy for
  10% gain; reserved matters can then provide the detailed on-site plan. For Technical Details Consent
  it is needed 'If required because of the permission in principle' (page 32), shown as discretionary.
review-status: unverified
field-status: {}
