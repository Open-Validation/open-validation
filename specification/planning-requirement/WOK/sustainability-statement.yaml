reference: sustainability-statement
local-authority: WOK
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings, including replacement dwellings involving substantial or complete
          demolition of the existing house.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 100
        description: Any non-residential development over 100 sq m of floorspace.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Sustainable Design and Construction SPD (May 2010); Core Strategy Policy CP1; Managing Development
  Delivery (MDD) Local Plan Policies CC04 and CC05
source-text: Residential development involving the creation of new dwellings (including replacement dwellings
  where this involves substantial or complete demolition of the existing house). Any non- residential
  development over 100sqm of floorspace.
must-include:
- item: The sustainability principles of the development, including positive environmental, social and
    economic considerations
  level: should
- item: The predicted energy demand and the degree to which the development meets current energy efficiency
    standards
  level: should
- item: The elements of the scheme that address sustainable development issues (e.g. appraising renewable
    energy sources, water resource management)
  level: should
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 15, 28, 57 (Full Planning Approval; Approval
  of Reserved Matters; Document Descriptions). It can be combined with the Energy Statement. For outline
  applications it may be submitted instead of the sustainability section of the Design and Access Statement
  but is not mandatory.
review-status: unverified
field-status: {}
