reference: flood-risk-assessment
local-authority: WOK
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pa-flats-de-blocks
        - pa-flats-de-comm
        - pa-flats-terr-comm
        - pa-flats-terr-dwh
        - pa-flats-de-dwh
        - pa-demo-replace-dwh
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: 1 hectare or greater in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: 1 hectare or greater in Flood Zone 1.
      - site:
          in:
          - flood-risk-zone
          description: New development, including household or small commercial extensions (under 250
            sq m), in Flood Zones 2, 3a and 3b.
      - site:
          in:
          - critical-drainage-area
          description: Land in a designated critical drainage area notified by the Environment Agency.
      - site:
          in:
          - future-flood-risk
          description: Land identified in a strategic flood risk assessment as being at increased flood
            risk in the future.
      - discretionary
  - all:
    - application-type:
        in:
        - technical-details-consent
    - discretionary
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
policy: Managing Development Delivery (MDD) Local Plan Policies CC09 and CC10
source-text: Required for development proposals of 1 hectare or greater area in Flood Zone 1 and for all
  proposals for new development, including household or small commercial extensions (under 250 sq.m),
  in Flood Zones 2, 3a and 3b as designated by the Environment Agency; land in a designated critical drainage
  area which has been notified to the Local Planning Authority by the Environment Agency; land identified
  in a strategic flood risk assessment as being at increased flood risk in the future; or land that may
  be subject to other sources of flooding, where its development would introduce a more vulnerable use.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including SuDS
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: A Sequential or Exception Test, where required
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3.
    - discretionary
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 11, 14-15, 38, 56 (Householder; Full Planning
  Approval; Prior Notification extending upwards; Document Descriptions). The list calls it 'Site Specific
  Flood Risk Assessment'. Land that may be subject to other sources of flooding, where development would
  introduce a more vulnerable use, shows as discretionary. For outline applications the list asks for
  documents 'As per Full Planning Approval requirements however in acknowledgement that some matters may
  be reserved' (page 26), so outline is included; for reserved matters it asks for 'anything required
  to consider with matters previously reserved' (page 28). For Technical Details Consent it is needed
  'If required because of the permission in principle' (page 32), shown as discretionary.
review-status: unverified
field-status: {}
