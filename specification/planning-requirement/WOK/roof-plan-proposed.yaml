reference: roof-plan-proposed
local-authority: WOK
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: Complex roof forms would be created, or roof works are proposed.
  - condition:
      field: new-build
      value: true
      description: New buildings.
source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Existing and Proposed Roof Plans for any complex roof forms that would be created or new
  buildings at a scale of 1:50, 1:100 (or 1:200 if necessary). "Handed" plans are not acceptable - Dimensioned
  drawings such as existing and proposed floor plans must show the whole building, for example the full
  length of a terrace, the full pair of semi-detached dwellings or the full block of flats or commercial
  floorspace etc.
must-include:
- item: Scale of 1:50 or 1:100 (or 1:200 if necessary)
  level: must
confidence: medium
