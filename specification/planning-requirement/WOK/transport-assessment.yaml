confidence: medium
notes: From the council's list (adopted 5 September 2025), page 15, 58 (Full Planning Approval; Document
  Descriptions). A Transport Assessment or Statement where the development has significant transport implications;
  there is no measurable trigger, so it shows as discretionary. For outline applications the list asks
  for documents 'As per Full Planning Approval requirements however in acknowledgement that some matters
  may be reserved' (page 26), so outline is included; for reserved matters it asks for 'anything required
  to consider with matters previously reserved' (page 28). For Technical Details Consent it is needed
  'If required because of the permission in principle' (page 32), shown as discretionary.
