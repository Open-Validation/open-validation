source-url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
source-text: Development would impact daylight/sunlight levels of adjoining properties
confidence: medium
notes: From the council's list (adopted 5 September 2025), page 10, 13, 48 (Householder; Full Planning
  Approval; Document Descriptions). The description says it may be needed where development breaches the
  Borough Design Guide and harms neighbours' daylight/sunlight; there is no measurable trigger, so it
  shows as discretionary. For outline applications the list asks for documents 'As per Full Planning Approval
  requirements however in acknowledgement that some matters may be reserved' (page 26), so outline is
  included; for reserved matters it asks for 'anything required to consider with matters previously reserved'
  (page 28).
