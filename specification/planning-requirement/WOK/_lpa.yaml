  url: https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
  date: 2025-09-05
  date-basis: 'introduction: ''re-adopted by the Council by an Individual Executive Member Decision on
    5th September 2025'' (cover dated 8th September 2025; amended April 2026 to add Technical Details
    Consent; due a review by 7th September 2027)'
  status: current
submission-standards:
- item: Individual file size not greater than 10 MB; no .zip or .exe files
  level: must
- item: All documents in single layer PDF format with the correct orientation
  level: must
- item: Plans drawn to a metric scale, indicated in writing or with a scale bar (a scale bar is preferable)
  level: must
- item: Plans must not include 'Do Not Scale' or any signatures
  level: must
- item: Documents of a suitable standard for different platforms/web browsers
  level: must
- item: 'No ''handed'' plans: dimensioned drawings such as floor plans show the whole building, not split
    across separate plans'
  level: must
- item: Each plan has a description title and is individually numbered, with a revision number if altered
  level: must
- item: Plans no larger than A3
  level: must
- item: 'Paper applications: one copy of the documentation, electronically wherever possible'
  level: should
- item: Surveys completed by an appropriately qualified person within the last 12 months
  level: must
- item: Plans named using the suggested protocol (e.g. 'Site Plan [plan number] Rev A')
  level: should
