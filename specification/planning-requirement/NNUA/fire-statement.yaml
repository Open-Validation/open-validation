reference: fire-statement
local-authority: NNUA
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The building is 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The building has 7 or more storeys.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: 'Completing the application form is just part of the process , we will also need: … Fire
  statements'
confidence: medium
notes: From the council's 'Make a planning application' web page (last updated 22 July 2026); the council
  publishes no local validation list for planning applications. The page links to the government's 'Fire
  safety and high-rise residential buildings' guidance; the trigger is the statutory one in DMPO article
  9A.
review-status: unverified
field-status: {}
