reference: water-impact-assessment
local-authority: NNUA
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - discretionary
source-url: https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf
source-text: Where the development has the potential to impact upon hydrology and hydrogeology, including
  an impact on ground and surface water.
must-include:
- item: 'Minerals and waste: Geological conditions and the behaviour of surface and ground water for the
    site and surrounding area'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: Geological conditions and the behaviour of surface water and ground water should be assessed
    for the site and surrounding area.
- item: 'Minerals and waste: Type, quantities and means of storage/disposal of surface water run-off,
    with scale plans of drainage arrangements'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: A surface water drainage assessment should include a description of the type, quantities
    and means of storage/disposal of any surface water run-off. Scale plans of drainage arrangements should
    also be provided.
- item: 'Minerals and waste: Mitigation proposals for impacts on hydrology/hydrogeology'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: the assessment of these potential impacts shall include mitigation proposals.
confidence: medium
notes: From the council's minerals and waste local validation list (Northamptonshire County Council's
  'Local Validation List for County Matter Planning Applications', PDF dated 30 October 2019, still linked
  by the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16, 35. Called 'Hydrological and Hydrogeological Assessment'; 'potential to impact' is a judgement,
  so discretionary. Minerals and waste applications only; the 2019 list is more than two years old.
review-status: unverified
field-status: {}
