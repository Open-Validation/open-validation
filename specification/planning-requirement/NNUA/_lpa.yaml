  date-basis: 'No local validation list for planning applications: checked 6 November 2026, the council''s
    ''Make a planning application'' section (https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application,
    last updated 22 July 2026) links only its own guidance pages: ''Supporting documents and reports''
    (this url, last updated 19 May 2023) and ''Plan and drawing requirements'' (https://www.northnorthants.gov.uk/planning-and-building-control/make-planning-application/plan-and-drawing-requirements,
    last updated 30 December 2022). The files are written from those pages. No former-district (Corby,
    East Northamptonshire, Kettering, Wellingborough) list is linked, and the old district domains are
    refused by the egress proxy. The council''s minerals and waste ''Local Validation List - Minerals
    and Waste Applications'' (https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf,
    linked from https://www.northnorthants.gov.uk/minerals-and-waste-planning/make-waste-development-application,
    page updated 30 July 2026) could not be fetched: the host minerals-waste-planning.northnorthants.digital
    is refused by the egress proxy.'
  status: not-found
submission-standards:
- item: All plans and drawings drawn to an appropriate metric scale, with all relevant dimensions of the
    key elements written on them (height, length, width and, if relevant, distance from the site boundary)
  level: must
- item: Scale stated with the sheet size (e.g. 1:100 at A1 or 1:200 at A3)
  level: must
- item: Vertical and horizontal scale bars
  level: should
- item: No 'Do not scale' or 'Not to scale' statements on drawings
  level: must
- item: Electronic documents unprotected so that personal data can be redacted
  level: must
- item: Individual documents no larger than 20MB
  level: must
- item: Supporting documents in electronic format; multiple or split documents named in sequence (e.g.
    01 Introduction, 02 Site Plan)
  level: should
- item: 'Hard-copy submissions: only one original of any form, plans and documents'
  level: must
