reference: flood-risk-assessment
local-authority: NNUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Proposals of 1 hectare or greater (in Flood Zone 1).
      - site:
          in:
          - flood-risk-zone
          description: Flood Zones 2, 3a and 3b.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
policy: National Planning Policy Framework; Environment Agency flood risk standing advice
source-text: 'Other documents you may need to provide, depending on the application: … Flood risk assessment
  … Proposals of 1 hectare or greater in Flood Zone 1 and all proposals for new development located in
  Flood Zones 2, 3a and 3b designated by the Environment Agency shall be accompanied by an FRA.'
must-include:
- item: 'Minerals and waste: Flood risk from all sources (including surface water and groundwater) to
    the development and to others, taking climate change into account'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Proposals of 1 hectare or greater (in Flood Zone 1).
      - site:
          in:
          - flood-risk-zone
          description: Flood Zones 2, 3a and 3b.
  source-text: The FRA will be required to demonstrate how flood risk from all sources of flooding (including
    surface water and groundwater) to the development itself and flood risk to others will be managed
    now, taking climate change into account.
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Flood risk assessment''.
  Listed under ''Other documents you may need to provide, depending on the application'', with no trigger,
  so shown as discretionary. Minerals and waste applications: from the council''s minerals and waste local
  validation list (Northamptonshire County Council''s ''Local Validation List for County Matter Planning
  Applications'', PDF dated 30 October 2019, still linked by the council as its local requirements list;
  https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16, 34. The minerals and waste part of source-text is from that list.'
