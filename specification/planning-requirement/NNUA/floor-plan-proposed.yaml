reference: floor-plan-proposed
local-authority: NNUA
required-if:
  condition:
    field: building-works
    value: true
    description: Storeys or buildings are to be built or altered.
source-url: https://www.northnorthants.gov.uk/planning-and-building-control/make-planning-application/plan-and-drawing-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These should show the existing and proposed elevations and floor plans of each storey to
  be built or altered. Partial elevations and floor plans are not acceptable as your proposal needs to
  be considered in relation to the whole of the existing building
must-include:
- item: Normally at 1:50 or 1:100
  level: should
- item: Existing and proposed drawings, of the whole existing building (partial elevations and floor plans
    are not acceptable)
  level: must
- item: New works clearly identified, showing all openings
  level: should
- item: Door and window positions identical on the elevations and floor plans
  level: must
confidence: medium
notes: From the council's 'Plan and drawing requirements' web page (last updated 30 December 2022); the
  council publishes no local validation list for planning applications.
review-status: unverified
field-status: {}
