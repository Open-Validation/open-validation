reference: recreation-facilities-assessment
local-authority: NNUA
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Existing open space or recreational land is likely to be affected.
    - condition:
        field: affects-playing-field
        value: true
        description: Existing sports or recreational buildings or land are likely to be affected.
source-url: https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf
source-text: Where existing open space, sports and recreational buildings and land are likely to be impacted
  upon or altered as a result of a development proposal.
must-include:
- item: 'Minerals and waste: Whether the open space, buildings or land are surplus to requirements'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: loss-of-open-space
          value: true
          description: Existing open space or recreational land is likely to be affected.
      - condition:
          field: affects-playing-field
          value: true
          description: Existing sports or recreational buildings or land are likely to be affected.
  source-text: An assessment to demonstrate whether the land or buildings are surplus to requirement should
    therefore be submitted for consideration.
confidence: medium
notes: From the council's minerals and waste local validation list (Northamptonshire County Council's
  'Local Validation List for County Matter Planning Applications', PDF dated 30 October 2019, still linked
  by the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 17, 39. Called 'Playing Fields and Recreational Facilities Assessment'. Minerals and waste applications
  only; the 2019 list is more than two years old.
