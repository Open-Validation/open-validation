reference: design-and-access-statement
local-authority: NNUA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The application is for one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The application is for building(s) with a floor space of 100 square metres or more.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
source-text: A Design and Access Statement is required if you are making an application for a 'major'
  development or listed building consent or the site is in a conservation area and the application is
  for one or more dwellings, or building(s) with a floor space of 100sqm or more
confidence: medium
notes: 'Audit (wrong_app_type): the workbook placed this only under Listed building consent.'
review-status: unverified
field-status: {}
