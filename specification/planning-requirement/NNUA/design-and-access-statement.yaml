reference: design-and-access-statement
local-authority: NNUA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) with a floor space of 100sqm or more.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: New buildings creating over 100 sq m of floorspace.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: A Design and Access Statement is required if you are making an application for a 'major'
  development or listed building consent or the site is in a conservation area and the application is
  for one or more dwellings, or building(s) with a floor space of 100sqm or more … Applications for Minerals
  and Waste developments which include new buildings where over 100m2 of floor space is created that are
  either ancillary or related to an after use, will need to be accompanied by a Design and Access Statement.
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Minerals and waste applications:
  from the council''s minerals and waste local validation list (Northamptonshire County Council''s ''Local
  Validation List for County Matter Planning Applications'', PDF dated 30 October 2019, still linked by
  the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 32. The minerals and waste part of source-text is from that list.'
review-status: unverified
field-status: {}
