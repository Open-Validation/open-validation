reference: design-and-access-statement
local-authority: NNUA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) with a floor space of 100sqm or more.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: A Design and Access Statement is required if you are making an application for a 'major'
  development or listed building consent or the site is in a conservation area and the application is
  for one or more dwellings, or building(s) with a floor space of 100sqm or more
confidence: medium
notes: From the council's 'Supporting documents and reports' web page (last updated 19 May 2023); the
  council publishes no local validation list for planning applications.
review-status: unverified
field-status: {}
