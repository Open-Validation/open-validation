reference: planning-statement
local-authority: NNUA
required-if:
  any:
  - discretionary
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
source-text: 'Other documents you may need to provide, depending on the application: … Supporting planning
  statement … The Planning Statement, which is listed first, is required in respect of all planning applications.'
must-include:
- item: 'Minerals and waste: Describes the proposed development, its context and why it is considered
    necessary and justified'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: A Planning Statement should be submitted, which clearly describes the proposed development,
    and identifies the context and why it is considered necessary and justified.
- item: 'Minerals and waste: Details of consultations with the planning authority, consultation bodies
    and the wider community before submission, and how they shaped the proposal'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: It should also include details of any consultations with the relevant Planning Authority,
    consultation bodies and wider community/statutory consultees undertaken prior to submission. The Statement
    should explain if and how this has shaped the proposed development.
- item: 'Minerals and waste: How the development accords with the relevant national and local planning
    policies (NPPF, National Planning Policy for Waste, Minerals and Waste Local Plan for Northamptonshire),
    referencing the policies'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: A key part of the Statement is to explain how the proposed development is in accordance
    with the relevant national and local planning policies.
- item: 'Minerals and waste: Facts and figures on the size and scale of the proposal and associated activities;
    refers to the plans and summarises the findings of the technical reports'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: It should also include a description of the development proposed including facts and figures
    relating to the size and scale of the proposal and associated activities. It should refer to the plans
    and drawings submitted in support of the application and briefly outline the supporting information
    which is being submitted, and summarise the findings in the technical reports and assessments from
    the list of local requirements.
- item: 'Minerals and waste: Large temporary developments (e.g. mineral workings, landfilling): a Working
    Scheme for the phased working and restoration of the site'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: temporary-development
        value: true
        description: A large development of a temporary nature, e.g. mineral workings or landfilling.
  source-text: For large developments of a temporary nature (e.g. mineral workings, landfilling operations)
    the Planning Statement should describe a Working Scheme for the phased restoration and working of
    the site.
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Supporting planning
  statement''. Listed under ''Other documents you may need to provide, depending on the application'',
  with no trigger, so shown as discretionary. Minerals and waste applications: from the council''s minerals
  and waste local validation list (Northamptonshire County Council''s ''Local Validation List for County
  Matter Planning Applications'', PDF dated 30 October 2019, still linked by the council as its local
  requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15, 30. The list also asks for a planning statement with section 73 variations, demolition prior
  notifications and lawful development certificates for minerals and waste sites (pages 21-26); those
  can''t be told apart from ordinary applications by type, so they aren''t shown. The minerals and waste
  part of source-text is from that list.'
review-status: unverified
field-status: {}
