reference: arboriculturist-report
local-authority: NNUA
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The property has any trees.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within or adjacent to the site that could be affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within or adjacent to the site that could be affected.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
policy: BS 5837
source-text: 'Tree Survey : If your property has any trees … Tree survey or arboricultural implications
  … Required where there are trees and hedgerows within the application site or on land adjacent to it
  that could influence or be affected by the development'
must-include:
- item: 'Minerals and waste: Which trees and hedgerows are to be lost or retained, and how they will be
    protected during construction'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within or adjacent to the site that could be affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within or adjacent to the site that could be affected.
  source-text: Information and plans will be required on which trees and hedgerows are to be lost/retained
    and the means of protecting them during construction works.
- item: 'Minerals and waste: Prepared by a suitably qualified or competent person'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within or adjacent to the site that could be affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within or adjacent to the site that could be affected.
  source-text: This information should be prepared by a suitably qualified or competent person.
- item: 'Minerals and waste: Survey, Tree Protection Plan and Arboricultural Method Statement to BS 5837:2012'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within or adjacent to the site that could be affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within or adjacent to the site that could be affected.
  source-text: Full guidance on the survey information, Tree Protection Plan and Arboricultural Method
    Statement that should be provided with an application is set out in
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Called a Tree Survey (and,
  in the other documents list, ''Tree survey or arboricultural implications''). Minerals and waste applications:
  from the council''s minerals and waste local validation list (Northamptonshire County Council''s ''Local
  Validation List for County Matter Planning Applications'', PDF dated 30 October 2019, still linked by
  the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16, 35. Called ''Hedgerow Survey / Tree Protection Plan / Arboricultural Impact Assessment''. The
  minerals and waste part of source-text is from that list.'
