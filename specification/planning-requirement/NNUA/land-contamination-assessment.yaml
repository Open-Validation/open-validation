  - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected.
      - condition:
          field: sensitive-end-use
