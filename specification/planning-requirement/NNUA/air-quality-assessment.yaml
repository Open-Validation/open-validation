reference: air-quality-assessment
local-authority: NNUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
source-text: 'Other documents you may need to provide, depending on the application: … Air quality assessment
  … All proposals that impact air quality through air emissions, including odour, dust, bio-aerosol and
  potential pollutants.'
must-include:
- item: 'Minerals and waste: Scale and nature of emissions, potential impact on people and the environment,
    and measures to prevent or minimise them'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: The Assessment should identify the scale and nature of emissions from the proposal, the
    potential impact on people and the environment in the area, and the proposed measures to prevent or
    minimise those impacts.
- item: 'Minerals and waste: Existing local air quality and impact against the National Ambient Air Quality
    Standards, any breach of standards and any effect on Air Quality Management Areas'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: It will need to explain the impact of the proposed development upon existing air quality
    with reference to National Ambient Air Quality Standards (NAAQS) for the relevant emissions under
    consideration. The AQA should explain whether the proposed development would be in any breaches of
    air quality standards, and if it affected any Air Quality Management Areas (AQMA).
- item: 'Minerals and waste: A scheme of management and mitigation'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: The AQA should outline a scheme of management and mitigation
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Air quality assessment''.
  Listed under ''Other documents you may need to provide, depending on the application'', with no trigger,
  so shown as discretionary. Minerals and waste applications: from the council''s minerals and waste local
  validation list (Northamptonshire County Council''s ''Local Validation List for County Matter Planning
  Applications'', PDF dated 30 October 2019, still linked by the council as its local requirements list;
  https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15, 31. ''All proposals that impact air quality'' has no measurable test, so the minerals and waste
  branch is discretionary. The minerals and waste part of source-text is from that list.'
review-status: unverified
field-status: {}
