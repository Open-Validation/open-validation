source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
source-text: 'Other documents you may need to provide, depending on the application: … Transport assessment
  and statement … Where the proposed development has increased transport/traffic implications. A Transport
  Assessment is required for developments with significant increased traffic movements and a Transport
  Statement for all other applications.'
must-include:
- item: 'Minerals and waste: Maximum and average daily HGV movements generated by the development'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
