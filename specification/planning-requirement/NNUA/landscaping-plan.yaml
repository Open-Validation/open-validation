source-text: 'Other documents you may need to provide, depending on the application: … Landscaping details
  … Where development includes landscaping or would benefit from landscaping including screening bunds
  and, tree, hedgerow and shrub planting. Proposals for landscaping, and its long term maintenance and
  management should follow from the design concept in the Design and Access Statement (if submitted).'
