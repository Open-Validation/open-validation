  source-text: The scheme of landscaping and tree planting submitted should give detail of inter alia
    ground contours, screening mounds, grass mixtures and the number, species, heights on planting and
    positions of all trees and shrubs.
- item: 'Minerals and waste: Long-term maintenance and landscape management (5 year minimum)'
  level: must
  required-if:
