confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Landscaping details''.
  Listed under ''Other documents you may need to provide, depending on the application'', with no trigger,
  so shown as discretionary. Minerals and waste applications: from the council''s minerals and waste local
  validation list (Northamptonshire County Council''s ''Local Validation List for County Matter Planning
  Applications'', PDF dated 30 October 2019, still linked by the council as its local requirements list;
  https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16, 36. ''Would benefit from landscaping'' is a judgement, so that part is discretionary. The minerals
  and waste part of source-text is from that list.'
