reference: noise-assessment
local-authority: NNUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
source-text: 'Other documents you may need to provide, depending on the application: … Noise assessment
  … Proposals that have the potential to increase noise levels or alter the characteristics of noise,
  and cause noise amenity disturbance to sensitive receptors.'
must-include:
- item: 'Minerals and waste: Measurements of existing ambient and background noise at the site and the
    nearest noise-sensitive receptors'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: Developments that generate noise which could impact on sensitive receptors are required
    to undertake a Noise Assessment to provide sufficient measurements of existing ambient and background
    noise levels at site, and the nearest appropriate noise sensitive receptors.
- item: 'Minerals and waste: Sources and levels of noise emissions and predicted levels at the nearest
    sensitive receptors'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: The Assessment should provide details on sources/levels of noise emissions as a result
    of the proposed development and predict the noise levels at the nearest sensitive receptors.
- item: 'Minerals and waste: Proposals for noise management and mitigation'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  source-text: Proposals for management and mitigation of noise
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Noise assessment''.
  Listed under ''Other documents you may need to provide, depending on the application'', with no trigger,
  so shown as discretionary. Minerals and waste applications: from the council''s minerals and waste local
  validation list (Northamptonshire County Council''s ''Local Validation List for County Matter Planning
  Applications'', PDF dated 30 October 2019, still linked by the council as its local requirements list;
  https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16, 37. ''Potential to increase noise levels'' is a judgement, so discretionary. The minerals and
  waste part of source-text is from that list.'
review-status: unverified
field-status: {}
