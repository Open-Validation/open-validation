reference: site-restoration
local-authority: NNUA
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: Waste disposal (landfill or infilling).
source-url: https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf
source-text: Where, therefore, application for these activities are submitted to the Council, they should
  be supported by proposals for restoring land to an acceptable condition and for ensuring that it can
  be used for an appropriate use thereafter.
must-include:
- item: 'Minerals and waste: Plans showing the phasing of working and restoration, and final restoration
    plans showing final land form and landscaping'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: true
          description: Waste disposal (landfill or infilling).
  source-text: Plans showing the phasing of working and restoration, and final restoration plans showing
    final land form and landscaping proposals are required to be
- item: 'Minerals and waste: An aftercare scheme where the land is to be reclaimed to a standard suitable
    for a beneficial use'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: true
          description: Waste disposal (landfill or infilling).
  source-text: Aftercare schemes are required for proposals where the land is to be reclaimed to a standard
    suitable for a beneficial use.
confidence: medium
notes: From the council's minerals and waste local validation list (Northamptonshire County Council's
  'Local Validation List for County Matter Planning Applications', PDF dated 30 October 2019, still linked
  by the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 41. Called 'Restoration and Aftercare Statement/Plans'; it is in the list's guidance and its Appendix
  A checklist, not in the 'When Required' table. The id is MHCLG's retired site restoration plan. Minerals
  and waste applications only; the 2019 list is more than two years old.
