reference: site-plan
local-authority: NNUA
required-if:
  any:
  - condition:
      field: residential-extension
      value: true
      description: Extending a house.
  - condition:
      field: outbuilding
      value: true
      description: Erecting buildings within the garden curtilage.
  - condition:
      field: new-build
      value: true
      description: New development.
  - discretionary
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
source-url: https://www.northnorthants.gov.uk/planning-and-building-control/make-planning-application/plan-and-drawing-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: block plan (or site plan) is required if you are extending your house or erecting buildings
  within your garden curtilage … This may be required in addition to a location plan. … Full applications
  / … some Section 73a
must-include:
- item: At a scale appropriate to the site and development (normally 1:500 or 1:200)
  level: must
- item: A 'North' point
  level: must
- item: The new works in relation to the site boundaries, neighbouring properties, other existing buildings
    and features such as trees within or adjacent to the site
  level: should
- item: New buildings in context with adjacent buildings, including property numbers or names where applicable,
    and roads and footpaths adjoining the site
  level: should
- item: On-site access, parking and turning arrangements and facilities for cycle parking
  level: should
- item: Vehicle access visibility splays at the highway boundary
  level: should
- item: The species, position and spread of all trees within 12 metres of any proposed building works
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including all heights and materials
  level: should
- item: Provision for the storage and collection of waste and recyclables
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: Applications for new developments.
- item: 'Minerals and waste: At an appropriate scale (1:100 or 1:200), showing the site boundaries'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: The plan should be at an appropriate scale (1:100 or 1:200) showing any site boundaries.
- item: 'Minerals and waste: All major dimensions, in particular heights and distances to boundaries or
    key features'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: major dimensions, in particular heights, distance to boundaries or key features,
- item: 'Minerals and waste: A scale and a north point; where applicable a drawing name/title and drawing/revision
    number'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  source-text: include a scale and a North … point; and where applicable, a drawing name/title and drawing/revision
    number.
confidence: medium
notes: 'From the council''s ''Plan and drawing requirements'' web page (last updated 30 December 2022);
  the council publishes no local validation list for planning applications. Called the block plan or site
  layout. Needed for house extensions and buildings in the garden; the council''s other page says it ''may
  be required in addition to a location plan'', so other cases are discretionary. Minerals and waste applications:
  from the council''s minerals and waste local validation list (Northamptonshire County Council''s ''Local
  Validation List for County Matter Planning Applications'', PDF dated 30 October 2019, still linked by
  the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 14. Called ''Block Plan of the Site'' (full applications and some section 73a applications). The
  minerals and waste part of source-text is from that list.'
review-status: unverified
field-status: {}
