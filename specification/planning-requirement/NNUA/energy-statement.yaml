    non-renewable resources and generates carbon savings'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - ref: major-development
    - discretionary
  source-text: Major applications should be supported by a statement explaining how a development proposal
    seeks to address these key issues and how it will contribute to reducing the use of nonrenewable resources
    and generate carbon savings.
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Sustainability
  appraisal and energy statement''. Listed under ''Other documents you may need to provide, depending
  on the application'', with no trigger, so shown as discretionary. Minerals and waste applications: from
  the council''s minerals and waste local validation list (Northamptonshire County Council''s ''Local
  Validation List for County Matter Planning Applications'', PDF dated 30 October 2019, still linked by
  the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 17, 40. Called ''Renewable Energy and Climate Change Assessment''; major applications, with the
  ''likely to have impact'' part discretionary. The minerals and waste part of source-text is from that
  list.'
