reference: heritage-statement
local-authority: NNUA
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      description: The property is in, or adjacent to, a conservation area, or is, or is adjacent to,
        a listed building.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - site:
        in:
        - listed-building
        - listed-building-setting
        - scheduled-monument
        - battlefield
        - park-and-garden
        - archaeological-priority-area
        description: Listed buildings and their settings, scheduled monuments and their settings, registered
          battlefields, historic parks and gardens and their settings, or an area of archaeological interest.
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
policy: National Planning Policy Framework
source-text: 'Heritage Impact Assessment : This is needed if your property is in, or adjacent to, a conservation
  area or your property is, or adjacent to, a listed building … Proposals impacting upon listed buildings
  and their settings, Scheduled Ancient Monuments and their settings, registered battlefields, historic
  parks and gardens and their settings ,and the disturbance of ground within an area of archaeological
  interest.'
must-include:
- item: 'Minerals and waste: Plans showing historic features on or next to the site (listed buildings/structures,
    historic parks, gardens and battlefields)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - site:
        in:
        - listed-building
        - listed-building-setting
        - scheduled-monument
        - battlefield
        - park-and-garden
        - archaeological-priority-area
        description: Listed buildings and their settings, scheduled monuments and their settings, registered
          battlefields, historic parks and gardens and their settings, or an area of archaeological interest.
  source-text: Plans should be included showing historic features that may exist on or adjacent to the
    application site including listed buildings/structure, historic parks, gardens and historic battlefields.
- item: 'Minerals and waste: The significance of the heritage asset, the features (including setting)
    contributing to it, and mitigation proposed'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - site:
        in:
        - listed-building
        - listed-building-setting
        - scheduled-monument
        - battlefield
        - park-and-garden
        - archaeological-priority-area
        description: Listed buildings and their settings, scheduled monuments and their settings, registered
          battlefields, historic parks and gardens and their settings, or an area of archaeological interest.
  source-text: The Assessment should include an explanation of the significance of the heritage asset,
    the features (including where necessary within the setting) that contribute towards the significance,
    and mitigation measures proposed as part of the development.
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Called a Heritage Impact Assessment
  (MHCLG''s current id for it is heritage-statement). Minerals and waste applications: from the council''s
  minerals and waste local validation list (Northamptonshire County Council''s ''Local Validation List
  for County Matter Planning Applications'', PDF dated 30 October 2019, still linked by the council as
  its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16, 35. The minerals and waste part of source-text is from that list.'
