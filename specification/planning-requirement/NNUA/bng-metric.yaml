reference: bng-metric
local-authority: NNUA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not householder
      or de minimis).
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application
policy: Environment Act 2021; Biodiversity Net Gain explanatory notes
source-text: All applications (except householder applications such as extensions, and de minimis habitats)
  will need to complete a Biodiversity Net Gain metric
must-include:
- item: Covers the application site
  level: must
- item: The full version of the metric, completed by a competent person, including the condition statements
  level: must
  source-text: The metric must be completed by a competent person and the full version must be submitted
    with the planning application including the condition statements.
- item: Off-site assessments use the full statutory metric (the small sites metric is not used outside
    the development area)
  level: must
  source-text: The small sites metric must not be used for assessing biodiversity outside the development
    area. All off-site assessments require the full statutory biodiversity metric.
confidence: medium
notes: From the council's 'Make a planning application' web page (last updated 22 July 2026); the council
  publishes no local validation list for planning applications. The council's exceptions (householder
  and de minimis) are the statutory exemptions, so the file uses the biodiversity gain condition. Metric
  contents are from the council's Biodiversity Net Gain explanatory note (version 1.1, February 2024;
  https://cms.northnorthants.gov.uk/media/8631/download), paragraphs 4.2-4.3, linked from the page; it
  also asks for a draft biodiversity gain plan or a 'statement of intent in respect of BNG' (no MHCLG
  id, so listed as unmapped).
review-status: unverified
field-status: {}
