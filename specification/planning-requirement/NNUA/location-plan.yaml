reference: location-plan
local-authority: NNUA
required-if:
  always: true
source-url: https://www.northnorthants.gov.uk/planning-and-building-control/make-planning-application/plan-and-drawing-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This is needed to identify the property so that everyone knows which house is applying for
  planning permission. … Location plans These are always required for planning applications.
must-include:
- item: Not a Land Registry plan; Ordnance Survey-based plans carry the OS copyright statement
  level: must
- item: Application site (including access to the adopted highway) edged in red, including all land needed
    for the development (access from a public highway, visibility splays, landscaping, car parking and
    open areas around buildings)
  level: must
- item: 'For a new or altered access: all the area needing work, including any dropped kerb, inside the
    red line'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: The application is for a new or altered access.
- item: Any adjoining land in which the applicant has an interest edged in blue
  level: should
- item: At a scale appropriate to identify the site (in most cases an Ordnance Survey-based map at 1:1250
    or 1:2500)
  level: must
- item: A4, or A3 for larger sites
  level: should
- item: Based on an up-to-date map
  level: should
- item: A North point
  level: should
- item: Surrounding buildings
  level: should
- item: Ideally two named roads
  level: should
confidence: medium
notes: From the council's 'Plan and drawing requirements' web page (last updated 30 December 2022); the
  council publishes no local validation list for planning applications. 'Always required' is from the
  council's 'Ordnance survey location and block plans' page (https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/ordnance-survey-location-and-block,
  last updated 1 January 2024).
review-status: unverified
field-status: {}
