      field: building-works
      value: true
      description: Storeys or buildings are to be built or altered.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
source-url: https://www.northnorthants.gov.uk/planning-and-building-control/make-planning-application/plan-and-drawing-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These should show the existing and proposed elevations and floor plans of each storey to
  be built or altered. Partial elevations and floor plans are not acceptable as your proposal needs to
  be considered in relation to the whole of the existing building … For all buildings, structures, and
  plant to clearly show proposed design, appearance and materials in relation to what is already there.
  Where legible this should be scaled to fit A4 or A3 size.
must-include:
- item: Normally at 1:50 or 1:100
  level: should
- item: Existing and proposed drawings, of the whole existing building (partial elevations and floor plans
    are not acceptable)
  level: must
- item: New works clearly identified, showing all openings
  level: should
- item: Door and window positions identical on the elevations and floor plans
  level: must
- item: 'Minerals and waste: For all buildings, structures and plant: proposed design, appearance and
    materials shown in relation to what is already there'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
  source-text: For all buildings, structures, and plant to clearly show proposed design, appearance and
    materials in relation to what is already there.
- item: 'Minerals and waste: Scaled to fit A4 or A3 where legible'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
