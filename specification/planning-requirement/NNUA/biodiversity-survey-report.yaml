reference: biodiversity-survey-report
local-authority: NNUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
source-text: 'Other documents you may need to provide, depending on the application: … Biodiversity survey
  and report … Where there is a reasonable likelihood that a proposed development would have impacts on
  wildlife and biodiversity'
must-include:
- item: 'Minerals and waste: Where protected species are likely to be present: presence/absence surveys
    by a suitably qualified ecologist'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: protected-species
        value: true
        description: Protected species are likely to be present.
  source-text: Where there is a likelihood of protected species present, an application will need to include
    surveys by a suitably qualified Ecologist for presence or absence of those species.
confidence: medium
notes: 'From the council''s ''Supporting documents and reports'' web page (last updated 19 May 2023);
  the council publishes no local validation list for planning applications. Listed as ''Biodiversity survey
  and report''. Listed under ''Other documents you may need to provide, depending on the application'',
  with no trigger, so shown as discretionary. The ''Make a planning application'' page also points to
  the council''s Biodiversity SPD checklist and the Wildlife Assessment Check to find out which surveys
  are needed. Minerals and waste applications: from the council''s minerals and waste local validation
  list (Northamptonshire County Council''s ''Local Validation List for County Matter Planning Applications'',
  PDF dated 30 October 2019, still linked by the council as its local requirements list; https://minerals-waste-planning.northnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15, 33. Called ''Ecological Impact Assessment/Survey and/or Protected Species Survey''; ''reasonable
  likelihood'' is a judgement, so discretionary. The minerals and waste part of source-text is from that
  list.'
