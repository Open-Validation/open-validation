reference: site-plan
local-authority: MDB
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - demolition-con-area
    - change-of-use
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
must-include:
- item: Site layout at 1:100 showing neighbouring buildings and windows
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Two site survey plans at 1:200, of existing and proposed features
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Block plan at 1:500
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
      - change-of-use
confidence: medium
notes: 'From the audit (missing_requirement): required plans in Sections 1 (Householder), 2 (Full), 4
  (Listed Building and Conservation Area Consent) and 5 (Change of use).'
review-status: unverified
field-status: {}
