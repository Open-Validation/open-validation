reference: site-plan
local-authority: MDB
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - demolition-con-area
    - change-of-use
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
source-text: HOUSEHOLDER APPLICATIONS ... Existing and proposed site layout at a scale of not less than
  1:100. ... FULL PLANNING APPLICATION ... Site survey plan to a scale of not less than 1:200 showing
  existing features of the site ... LISTED BUILDING AND CONSERVATION AREA CONSENT ... Block Plans to a
  scale not less than 1:500 showing the boundaries of the site ... FULL PLANNING APPLICATION FOR CHANGE
  OF USE WITHOUT EXTERNAL BUILDING WORKS ... Block plan of the site to a scale of not less than 1:500
must-include:
- item: 'Householder: existing and proposed site layout at not less than 1:100, showing all buildings
    and structures, gardens, open spaces and car parking in the context of adjacent buildings, including
    the location of any windows'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Full applications, and changes of use with external works: site survey plans at not less than
    1:200 showing existing features (walls, trees, buildings and other structures) and proposed features
    (e.g. landscaping)'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - change-of-use
      - condition:
          field: external-alterations
          value: true
          description: The proposal involves external alterations to the building.
- item: 'Listed building and conservation area consent: block plan at not less than 1:500 showing the
    site boundaries, all existing buildings and the position of new extensions and buildings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
- item: 'Change of use without external works: block plan at not less than 1:500'
  level: must
  required-if:
    application-type:
      in:
      - change-of-use
confidence: medium
notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: householder (page
  1), full (pages 1-2), listed building and conservation area consent (pages 3-4), change of use without
  external works (page 4), change of use with external works (page 4).'
review-status: unverified
field-status: {}
