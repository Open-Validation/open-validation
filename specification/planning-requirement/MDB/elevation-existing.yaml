  BUILDING WORKS ... Existing and proposed elevations to a scale of not less than 1:50
must-include:
- item: At a scale of not less than 1:50
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - all:
      - application-type:
          in:
          - change-of-use
      - condition:
          field: external-alterations
          value: true
          description: The proposal involves external alterations to the building.
