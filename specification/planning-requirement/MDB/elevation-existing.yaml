confidence: medium
notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: householder (page
  1), full (pages 1-2), listed building and conservation area consent (pages 3-4), change of use with
  external works (page 4). For certificates of lawfulness the checklist says the evidence ''may include''
  ''Existing and Proposed extensions (for all proposed building works) to a scale not less than 1:100''
