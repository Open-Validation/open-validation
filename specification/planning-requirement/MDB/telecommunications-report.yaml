reference: telecommunications-report
local-authority: MDB
required-if:
  all:
  - application-type:
      in:
      - prior-approval
      - full
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
  - discretionary
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
policy: Part 24 of Schedule 2 of the Town & Country Planning (General Permitted Development) Order 1995
  (as amended)
source-text: 'PRIOR NOTIFICATION PROCEDURE ... Telecommunications ... it is recommended that the following
  information is also submitted in order to assist with the processing of the application:'
must-include:
- item: A signed declaration that the equipment and installation fully complies with the ICNIRP requirements
  level: should
- item: Site type (micro or macro), area of search, and whether the Council's mast register and/or the
    industry site database has been checked for suitable sites
  level: should
- item: Details of annual rollout and pre-application discussions with the Council
  level: should
- item: Details and written comments of all consultations, including any with a school or further education
    college, and with the CAA, Secretary of State for Defence or aerodrome operator if relevant
  level: should
- item: Details of the proposed structure (type, dimensions, height of existing building, equipment housing
    size and materials)
  level: should
- item: A map showing the site's relationship to schools and other telecommunication equipment nearby
  level: should
- item: The reasons for the choice of design
  level: should
- item: Technical information (frequency, modulation characteristics, power output, antenna height) and
    technical justification for the site
  level: should
- item: Alternative sites rejected (including existing masts, structures and buildings in the search area)
    with reasons, or an explanation if none were considered
  level: should
- item: Visual impact assessment and acoustic report where relevant
  level: should
confidence: medium
notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: prior notification
  (pages 5-6). The list covers prior approval under Part 24 of the 1995 GPDO and the council''s planning
  application forms, and says the information is ''recommended'', so the items are ''should'' and the
  rule is discretionary. The GPDO reference is out of date (telecoms is now Part 16 of the 2015 GPDO).'
review-status: unverified
field-status: {}
