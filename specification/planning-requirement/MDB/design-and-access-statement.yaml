reference: design-and-access-statement
local-authority: MDB
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - outline
        - lbc
        - demolition-con-area
        - change-of-use
        - prior-approval
    - discretionary
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
source-text: 'HOUSEHOLDER APPLICATIONS ... Design Statement (including details of proposed materials to
  be used for walls, roofs, windows, doors, hardstanding and boundary treatments) - only required if within
  a conservation area ... FULL PLANNING APPLICATION ... Design Statement ... Access Statement ... OUTLINE
  PLANNING APPLICATION ... Design Statement Access Statement ... LISTED BUILDING AND CONSERVATION AREA
  CONSENT ... Design statement including the type colour, make and name of all materials to be used both
  internally and externally, including roofing and the surfacing of car parking areas etc ... In addition
  to the above, the following information may also be required for all changes of use application: ...
  Sustainability Appraisal Access Statement ... PRIOR NOTIFICATION PROCEDURE ... Design Statement Access
  Statement'
must-include:
- item: 'Householder: details of the proposed materials for walls, roofs, windows, doors, hardstanding
    and boundary treatments'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Listed building and conservation area consent: the type, colour, make and name of all materials
    used internally and externally, including roofing and the surfacing of car parking areas'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
confidence: medium
notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: householder (page
  1), full (pages 1-2), outline (pages 2-3), listed building and conservation area consent (pages 3-4),
  all changes of use (pages 4-5), prior notification (pages 5-6). The checklist lists a Design Statement
  and an Access Statement separately; both are filed here. For householders the design statement is ''only
  required if within a conservation area''. The checklist lists this under ''the following information
  may also be required'' with no trigger, so it shows as discretionary within those application types.'
review-status: unverified
field-status: {}
