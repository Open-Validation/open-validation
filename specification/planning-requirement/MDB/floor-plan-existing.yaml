reference: floor-plan-existing
local-authority: MDB
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - demolition-con-area
      - change-of-use
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: involves-change-of-use
        value: true
        description: The certificate involves the use of a building.
    - discretionary
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
source-text: HOUSEHOLDER APPLICATIONS ... Existing and proposed floor plans at a scale of not less than
  1:100 ... FULL PLANNING APPLICATION ... Existing and proposed floor plans at a scale of not less than
  1:50 ... LISTED BUILDING AND CONSERVATION AREA CONSENT ... Building Plans to a scale not less than 1:100
  including plans of each floor where works are proposed ... FULL PLANNING APPLICATION FOR CHANGE OF USE
  WITHOUT EXTERNAL BUILDING WORKS ... Existing and proposed floor plans at a scale of not less than 1:100
  ... FULL PLANNING APPLICATION FOR CHANGE OF USE WITH EXTERNAL BUILDING WORKS ... Existing and proposed
  floor plans at a scale of not less than 1:50 ... CERTIFICATE OF LAWFULNESS ... Existing and Proposed
  floor plans (for all applications involving use of a building) to a scale not less than 1:100
must-include:
- item: At a scale of not less than 1:50
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - change-of-use
      - condition:
          field: external-alterations
          value: true
          description: The proposal involves external alterations to the building.
- item: At a scale of not less than 1:100
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
        - lbc
        - demolition-con-area
        - ldc
    - all:
      - application-type:
          in:
          - change-of-use
      - condition:
          field: external-alterations
          value: false
          description: No external works.
- item: 'Listed building and conservation area consent: plans of each floor where works are proposed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
confidence: medium
notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: householder (page
  1), full (pages 1-2), listed building and conservation area consent (pages 3-4), change of use without
  external works (page 4), change of use with external works (page 4), certificate of lawfulness (pages
  6-7). For certificates of lawfulness the checklist says the evidence ''may include'' floor plans for
  applications involving the use of a building, so that part is discretionary.'
review-status: unverified
field-status: {}
