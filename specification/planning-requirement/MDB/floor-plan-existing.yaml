reference: floor-plan-existing
local-authority: MDB
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - demolition-con-area
    - change-of-use
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
must-include:
- item: Floor plans at 1:100
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Floor plans at 1:50
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Plans at 1:100 of each floor where works are proposed
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
- item: Floor plans at 1:100 (change of use with no external works) or 1:50 (change of use with external
    works such as a flue or new windows)
  level: must
  required-if:
    application-type:
      in:
      - change-of-use
confidence: medium
notes: 'Audit (wrong_app_type): the workbook''s Householder row was Certificate of Lawfulness text ("Existing
  and Proposed floor plans (for all applications involving use of a building) to a scale not less than
  1:100", which the checklist says "may" be included). From the audit (missing_requirement): the scales
  above are from Sections 1, 2, 4, 5 and 6.'
