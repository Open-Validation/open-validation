source-text: 'FULL PLANNING APPLICATION ... Listed building and Conservation Area appraisal ... LISTED
  BUILDING AND CONSERVATION AREA CONSENT ... Heritage Statement which analyses the significance of archaeology,
  history, and character of the building/ structure, the principles of and justification for the proposed
  works and their impact ... In addition to the above, the following information may also be required
  for all changes of use application: ... Listed building and Conservation Area appraisal'
