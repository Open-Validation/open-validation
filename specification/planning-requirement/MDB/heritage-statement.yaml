notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: full (pages 1-2),
  listed building and conservation area consent (pages 3-4), all changes of use (pages 4-5). Full and
  change of use applications: ''Listed building and Conservation Area appraisal''; listed building and
  conservation area consent: ''Heritage Statement''. The checklist lists this under ''the following information
