reference: planning-statement
local-authority: MDB
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
      - change-of-use
      - prior-approval
      - ldc
  - discretionary
source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
source-text: 'HOUSEHOLDER APPLICATIONS ... Supporting Planning Statement ... FULL PLANNING APPLICATION
  ... Supporting Planning Statement ... OUTLINE PLANNING APPLICATION ... Supporting Planning Statement
  ... LISTED BUILDING AND CONSERVATION AREA CONSENT ... Supporting Planning Statement including reasoned
  justification for the proposed works ... In addition to the above, the following information may also
  be required for all changes of use application: ... Supporting Planning Statement ... PRIOR NOTIFICATION
  PROCEDURE ... Supporting Planning Statement ... CERTIFICATE OF LAWFULNESS ... Supporting Planning Statement
  (to include statement of grounds on which the Certificate is sought)'
must-include:
- item: 'Listed building and conservation area consent: a reasoned justification for the works, which
    may include a structural survey or other analysis of the character or appearance of the conservation
    area'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - demolition-con-area
- item: 'Certificate of lawfulness: the grounds on which the certificate is sought'
  level: must
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: 'From the council''s list (undated; PDF last modified 4 July 2023), sections: householder (page
  1), full (pages 1-2), outline (pages 2-3), listed building and conservation area consent (pages 3-4),
  all changes of use (pages 4-5), prior notification (pages 5-6), certificate of lawfulness (pages 6-7).
  The checklist lists this under ''the following information may also be required'' with no trigger, so
  it shows as discretionary within those application types.'
