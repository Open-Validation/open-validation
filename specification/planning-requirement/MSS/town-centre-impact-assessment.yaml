reference: town-centre-impact-assessment
local-authority: MSS
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside town centres, not in accordance with an up-to-date Local
        Plan.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 500
      description: More than 500 square metres gross of main town centre floorspace.
source-url: https://www.midsussex.gov.uk/media/wjunxol1/form-9_planningapplicationchecklist_outlinewithsomereservedmatters.pdf
source-text: 'Full planning: Town Centre Impact Assessment When is this required? A Town Centre Impact
  Assessment, to include a sequential test, is required for proposals that include creation of floorspace
  exceeding 500m2 gross of main town centre uses (as defined in the NPPF), outside of town centres which
  are not in accordance with an up-to-date Local Plan.


  Outline: (July 2018) Town Centre Impact Assessment - for development that include creation of floorspace
  exceeding 500sq m gross of main town centre uses (as defined in the NPFF), outside of town centres which
  are not in accordance with up-todate Local Plan.


  Reserved matters: (July 2018) Town Centre Impact Assessment - for development that include creation
  of floorspace exceeding 500sq m gross of main town centre uses (as defined in the NPPF), outside of
  town centres which are not in accordance with an upto-date Local Plan.'
must-include:
- item: A sequential test
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Rows from Listed building
  consent, Advertisement consent, Demolition in cons area were dropped after the audit.
