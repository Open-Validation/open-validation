reference: town-centre-impact-assessment
local-authority: MSS
required-if:
  all:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: More than 500 m² gross of main town centre uses (as defined in the NPPF).
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside town centres, and not in accordance with an up-to-date Local Plan.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP2
source-text: A Town Centre Impact Assessment, to include a sequential test, is required for proposals
  that include creation of floorspace exceeding 500m2 gross of main town centre uses (as defined in the
  NPPF), outside of town centres which are not in accordance with an up-to-date Local Plan.
must-include:
- item: A sequential test
  level: must
- item: Impact on existing, committed and planned public and private investment in a centre or centres
    in the catchment area
  level: should
- item: Impact on town centre vitality and viability, including local consumer choice and trade in the
    town centre and wider area
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 33.
review-status: unverified
field-status: {}
