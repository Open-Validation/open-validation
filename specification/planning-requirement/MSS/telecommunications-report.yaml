source-text: 'Full planning: This information is required for applications for mast and antenna development
  by mobile phone network operators as set out in section 10 of the National Planning Policy Framework
  What should this include? Details of the outcome of consultations with organisations with an interest
  in the proposed development, in particular with the relevant body where a mast is to be installed near
  a school or college or within a statutory safeguarding zone surrounding an aerodrome or technical site,


  Outline: Telecommunication Development - Supplementary Information required for mast and antennae development
  by mobile phone network operators as set out in section 10 of the National Planning Policy Framework
  (July 2018) Town Centre Impact Assessment - for development that include creation of floorspace exceeding
  500sq m gross of main town centre uses (as defined in the NPFF), outside of town centres which are not
  in accordance with up-todate Local Plan.


  Reserved matters: Telecommunication Development - Supplementary Information required for mast and antennae
  development by mobile phone network operators as set out in section 10 of the National Planning Policy
  Framework (July 2018) Town Centre Impact Assessment - for development that include creation of floorspace
  exceeding 500sq m gross of main town centre uses (as defined in the NPPF), outside of town centres which
  are not in accordance with an upto-date Local Plan.'
