reference: telecommunications-report
local-authority: MSS
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Mast and antenna development by mobile phone network operators.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP23
source-text: This information is required for applications for mast and antenna development by mobile
  phone network operators as set out in section 10 of the National Planning Policy Framework
must-include:
- item: Outcome of consultations with organisations with an interest, in particular the relevant body
    where a mast is near a school or college or within a statutory safeguarding zone around an aerodrome
    or technical site
  level: must
- item: 'For an addition to an existing mast or base station: a self-certified statement that cumulative
    exposure, when operational, will not exceed ICNIRP guidelines'
  level: must
- item: 'For a new mast or base station: evidence that erecting antennas on an existing building, mast
    or other structure has been explored, and a self-certified statement that ICNIRP guidelines will be
    met'
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 31. The list calls it Supplementary Information
  for Telecommunications Development.
review-status: unverified
field-status: {}
