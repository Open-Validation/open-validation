reference: land-contamination-assessment
local-authority: MSS
required-if:
  site:
    in:
    - contaminated-land
    description: Land that may be affected by contamination, including but not limited to fuel filling
      stations, gas works, landfills, industrial sites and barn conversions.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: A Land Contamination Assessment will be required for applications for development on land
  that may be affected by contamination including, but not limited to, fuel filling stations, gas works,
  landfills, industrial sites, barn conversions.
must-include:
- item: As a minimum, a desk study report by a suitably qualified consultant, including a site walkover,
    a conceptual site model and a risk assessment
  level: must
- item: Intrusive site investigation, depending on the results of the desk study
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published September 2026), page 20.
review-status: unverified
field-status: {}
