reference: affordable-housing-statement
local-authority: MSS
required-if: discretionary
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP31; Affordable Housing SPD (July 2018)
source-text: An Affordable Housing Statement will be required when the proposed residential development
  is above the relevant threshold as set out in Policy DP31 of the Mid Sussex District Plan 2014-2031.
must-include:
- item: Number and mix of proposed residential units, including property type, number of bedrooms and
    proposed number of occupants
  level: should
- item: Habitable floor space of each proposed unit
  level: should
- item: Proposed number of each tenure, based on 75% Social or Affordable Rent and 25% Intermediate homes
  level: should
- item: Details of the Registered Partner who will take over the affordable units, if this has been determined
  level: should
- item: 'Where an existing building is being redeveloped: the size in m² of the existing building and
    of the proposed development, including any remodelling'
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 4. Shown as discretionary because the
  threshold is set in policy DP31, which the list doesn't state. Where the policy can't be met a Viability
  Appraisal is also needed.
review-status: unverified
field-status: {}
