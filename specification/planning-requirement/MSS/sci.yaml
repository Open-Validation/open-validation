reference: sci
local-authority: MSS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Residential development of 50 units or more.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential site of 0.5 ha (5,000 m²) or more when the number of units is unknown.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Commercial development of 1,000 m² or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Commercial site of 1 ha (10,000 m²) or more.
  - condition:
      field: wind-turbine
      value: true
      description: Onshore windfarms.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: 'A Statement of Community involvement is required for applications that include: Residential
  development of 50 units or more or a site area of 0.5 hectares (5000m2) or more when the numbers of
  units are unknown Commercial development of 1,000m2 or more or a site area of 1 hectare (10,000m2) or
  more. Onshore windfarms'
must-include:
- item: How the views of the local community have been sought and taken into account in forming the proposals,
    proportionate to the scale and impact
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 29. It 'may include' reports of discussions
  with District, Town or Parish Councils, public exhibition feedback and leafleting.
review-status: unverified
field-status: {}
