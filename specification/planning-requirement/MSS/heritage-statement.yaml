reference: heritage-statement
local-authority: MSS
required-if:
  any:
  - &id001
    application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building-setting
      description: The application affects the setting of a Listed Building.
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - condition:
        field: demolition
        value: true
        description: The application includes demolition of buildings.
  - site:
      in:
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      description: Development other than change of use within or adjacent to a scheduled monument or
        registered park or garden, or in an Archaeological Notification Area.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policies DP34 and DP35
source-text: 'A Heritage Statement will be required for: All applications for listed building consent.
  Applications affecting the setting of a Listed Building Planning applications that include demolition
  of buildings within a Conservation Area. All applications for development other than change of use in
  areas that are within or adjacent to scheduled monuments, registered parks and gardens, or is located
  within an Archaeological Notification Area.'
must-include:
- item: Description of any heritage assets affected, including any contribution made by their setting,
    proportionate to the assets' importance
  level: must
- item: The relevant historic environment record (held by West Sussex County Council) consulted, and the
    heritage assets assessed using appropriate expertise where necessary
  level: must
- item: 'For listed building consent: an analysis of the significance of the archaeology, history and
    character of the building/structure'
  level: must
  required-if: *id001
- item: 'For listed building consent: the principles of justification for the works and their impact on
    the special character of the listed building or structure, its setting, and the setting of adjacent
    listed buildings'
  level: must
  required-if: *id001
confidence: medium
notes: From the council's list (published September 2026), page 18-19. Change of use is excluded from
  the scheduled monument, park and garden and Archaeological Notification Area trigger. The Archaeological
  Desk-Based Assessment is in archaeological-assessment.yaml; the Historic Environment Record search is
  in the unmapped list.
review-status: unverified
field-status: {}
