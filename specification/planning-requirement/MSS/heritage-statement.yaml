reference: heritage-statement
local-authority: MSS
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      description: The application affects the setting of a listed building, or the site is in or next
        to a scheduled monument, registered park or garden, or Archaeological Notification Area.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: 'Heritage Statement and Archaeological Assessment When is this required? A Heritage Statement
  will be required for: All applications for listed building consent. … Applications affecting the setting
  of a Listed Building'
must-include:
- item: An Archaeological Desk-Based Assessment
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: The site is in or next to an Archaeological Notification Area.
  source-text: commission an Archaeological Desk-Based Assessment and submit the results.
confidence: medium
notes: 'Audit (missing_requirement): the workbook applied it only to LBC. From the audit: also demolition
  in conservation areas, sites in or next to scheduled monuments, registered parks and gardens or Archaeological
  Notification Areas, and householder works affecting the setting of a listed building.'
