reference: sustainable-drainage-strategy
local-authority: MSS
required-if:
  any:
  - condition:
      field: non-mains-drainage
      value: true
      description: A commercial proposal relying on non-mains drainage.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A residential development creating a new or replacement dwelling.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 250
      description: Residential development where alterations are greater than 250 m².
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential development with a site area of 0.5 ha (5,000 m²) or more.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Other development creating 1,000 m² or more of floor area.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Other development with a site area of 1 ha (10,000 m²) or more.
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Development within Flood Zones 2 or 3, or within areas at risk of surface water flooding.
  - condition:
      field: drainage-alterations
      value: true
      description: Development involving alterations to the existing sewerage system or creation of a
        new drainage system.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP41
source-text: 'A Foul Sewage and Surface Water Drainage Strategy will normally be required for: Commercial
  proposals relying on non-mains drainage; Residential developments where a new dwelling or replacement
  dwelling is created; Residential development where alterations are greater than 250m² and/or where the
  site area is 0.5ha (5,000m²) or more; Other development where the floor area to be created is 1,000m²
  or greater; Other development where the site area is 1ha (10,000m²) or greater; Development within Flood
  Zones 2 or 3, or within areas at risk of surface water flooding; Development involving alterations to
  the existing sewerage system or creation of a new drainage system.'
must-include:
- item: Existing drainage arrangements and existing connection points
  level: should
- item: Existing and proposed drainage plans
  level: should
- item: Existing and proposed impermeable areas
  level: should
- item: Existing surface water flow routes and drainage constraints
  level: should
- item: Proposed foul and surface water drainage strategy
  level: should
- item: Proposed discharge locations and discharge rates
  level: should
- item: Scale plans, cross-sections/elevations and specifications where required
  level: should
- item: Finished levels and design exceedance routes where relevant
  level: should
- item: Management and maintenance arrangements
  level: should
- item: 'Where connecting to an existing drainage network: details of the existing system shown on the
    drawings'
  level: should
- item: 'Where infiltration is the sole means of disposal with no secondary discharge route: site-specific
    BRE365 infiltration testing'
  level: should
- item: 'Where a non-mains foul drainage system is proposed: how it complies with the Environment Agency''s
    General Binding Rules'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: A non-mains foul drainage system is proposed.
confidence: medium
notes: From the council's list (published September 2026), page 15-17. The list calls it a Foul Sewage
  and Surface Water (Drainage) Assessment, covering foul as well as surface water drainage. The strategy
  should apply the drainage hierarchy and meet Approved Document H, the national SuDS standards and the
  CIRIA SuDS Manual (C753); see also sections C and D of the council's Flood Risk and Drainage Information
  Checklist. The comment markers [AR2.1] [AR2.2] left in the PDF are omitted.
review-status: unverified
field-status: {}
