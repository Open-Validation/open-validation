reference: site-plan
local-authority: MSS
source-url: https://www.midsussex.gov.uk/media/u4spd3vw/form-39_planningapplicationchecklist_variationcondition.pdf
source-text: 'Householder, Listed building consent: Block/Site Plan (at a scale of 1:200 or 1:500) highlighting
  the proposed development in relation to the site boundaries and other existing buildings on the site.


  Full planning: Block plan o A plan of the existing site which must include the area of works marked
  in red and/or labelled. o Recommended scale 1:500. o The site boundary must be clearly marked in red
  and include all land necessary to carry out the development, including access from the public highway.


  Outline: September 2024 2 VALIDATION CHECKLIST Block/Site plan (1:200 or 1:500) showing the area or
  areas in which the access point(s) will be situated From 12th February 2024 for all Major Applications


  Reserved matters: September 2022 1 VALIDATION CHECKLIST If Yes to Appearance Block Plan (scale 1:200)
  showing the details location of buildings, routes and open spaces included in the development.


  Advertisement consent: Block/Site Plan (at a scale of 1:200 or 1:500) plan must show the proposed advertisement
  in relation to the site boundaries Existing and Proposed elevations (at scale 1:50/1:100) showing advertisement
  size, siting, materials and colours to be used and how they are fixed, height above ground, extent of
  projection and details of method and colour(s) of illumination if applicable.


  Lawful development cert: APPLICATIONS Block/Site Plan (at a scale of 1:200 or 1:500) highlighting the
  proposed development in relation to the site boundaries and other existing buildings on the site.


  Change of use - prior approval: Existing and proposed block plan of the site (scale 1:100, 1:200 or
  1:500) Floor Plans which are drawn to an identified scale (1:50/1:100) Indicating the dimensions and
  proposed use of each room, the position and dimensions of windows, doors and walls YES N/A     
   LOCAL REQUIREMENTS YES N/A Such information as may be necessary to enable the Local Planning Authority
  to determine: Transport and highways impacts of the development


  Demolition in cons area: Show direction of North.  Block/Site Plan (at a scale of 1:200 or 1:500) highlighting
  the proposed development in relation to the site boundaries and other existing buildings on the site.


  Variation of condition s73: Where appropriate block plan at 1:200 or 1:500 showing site boundaries.'
