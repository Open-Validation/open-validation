reference: planning-statement
local-authority: MSS
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - s73
    - lbc
    - advertising
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: A planning statement is required for all applications except those for trees, householders,
  and minor alterations to commercial premises.
must-include:
- item: The context and need for the development, and an assessment of how it accords with relevant national,
    regional and local planning policies
  level: should
- item: 'Airport safeguarding: a statement demonstrating that aerodrome safeguarding requirements have
    been considered, covering the heights of buildings/structures and cranes (Obstacle Limitation Surfaces,
    CNS equipment and Instrument Flight Procedures), features that could attract birds hazardous to aviation,
    lighting near the airport, wind turbines, solar panel glint and glare, and venting and flaring of
    gas'
  level: should
  required-if: discretionary
  source-text: Airport Safeguarding, where relevant. A statement demonstrating that Aerodrome Safeguarding
    requirements have been taken into consideration where appropriate
- item: How the development accords with the Objectives and Actions of the AONB Management Plan and, where
    relevant, the High Weald Housing Design Guide
  level: should
  required-if:
    site:
      in:
      - area-of-outstanding-natural-beauty
      description: Development within, or affecting the setting of, the High Weald National Landscape.
confidence: medium
notes: From the council's list (published September 2026), page 27. Tree and householder applications
  are excluded; the remaining main types are listed. 'Minor alterations to commercial premises' are also
  excluded but can't be told apart by type. Airport safeguarding shows as discretionary ('where relevant').
review-status: unverified
field-status: {}
