reference: lighting-assessment
local-authority: MSS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - condition:
        field: external-lighting
        value: true
        description: The application provides or alters floodlighting, or includes external lighting.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements are proposed.
source-url: https://www.midsussex.gov.uk/media/qgnnfyvr/form-12_planningapplicationchecklist_advert.pdf
source-text: A lighting assessment will be required for applications for the provision or alteration of
  floodlighting, or any other planning applications other than householder that include external lighting.
  … Lighting Assessment (where illuminated advertisements are proposed)
must-include:
- item: Confirmation of the means of illumination (external/internal, static/intermittent) and level of
    illumination
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: Illuminated advertisements are proposed.
- item: Colour(s) of illumination, if applicable
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: Illuminated advertisements are proposed.
- item: A schedule of the proposed equipment, including proposed heights of fixings and details of any
    shielding
  level: must
  source-text: a schedule of the proposed equipment in the design, including proposed heights of fixings
    and details of any shielding.
confidence: medium
notes: 'Rows from Householder, Listed building consent, Demolition in cons area were dropped after the
  audit. Audit (wrong_app_type): not for householder applications; the advert-only checklist adds the
  illuminated-advert trigger.'
review-status: unverified
field-status: {}
