reference: lighting-assessment
local-authority: MSS
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The provision or alteration of floodlighting.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - condition:
        field: external-lighting
        value: true
        description: A planning application (other than householder) that includes external lighting.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policies DP29 and DP38
source-text: A lighting assessment will be required for applications for the provision or alteration of
  floodlighting, or any other planning applications other than householder that include external lighting.
must-include:
- item: Details of external lighting, including the position of all proposed lighting
  level: should
- item: Technical specifications of the lighting, including isolux, power, lumen output, colour temperature
    and CCT
  level: should
- item: Obtrusive lighting calculations (including upward light ratio)
  level: should
- item: Proposed hours when the lighting would be switched on, and the method of control
  level: should
- item: A layout plan showing vertical and horizontal illuminance
  level: should
- item: A schedule of the proposed equipment, including heights of fixings and details of any shielding
  level: should
- item: A statement demonstrating that aerodrome safeguarding requirements have been taken into consideration
  level: should
- item: Baseline conditions, including any existing lighting or nearby lighting providing useful ambient
    light
  level: should
- item: The Environmental Zone light calculations the scheme is designed to conform to, following the
    advice in the Management Plan
  level: should
  required-if:
    site:
      in:
      - area-of-outstanding-natural-beauty
      description: Development within, or affecting the setting of, the High Weald National Landscape.
- item: A lighting design strategy for the impact on biodiversity (light sensitive species)
  level: should
  required-if: discretionary
  source-text: Where relevant, a lighting design strategy for the impact on biodiversity (light sensitive
    species)
confidence: medium
notes: From the council's list (published September 2026), page 22. Householder applications are excluded
  from the external lighting trigger. The contents are introduced with 'should be accompanied by a lighting
  plan / lighting assessment, including'.
review-status: unverified
field-status: {}
