reference: recreation-facilities-assessment
local-authority: MSS
required-if:
  site:
    in:
    - open-space
    description: Development on school playing fields or public areas, e.g. parks.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP24
source-text: An Open Space Assessment is required for applications for development on school playing fields
  or public areas, e.g. parks.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: should
- item: Demonstration that the land has been assessed and is surplus to requirements, or that the open
    space lost is replaced by equivalent or better provision in quantity, quality and location
  level: should
- item: 'If the proposal is for alternative sports or recreational provision: that the need for it outweighs
    the loss of the existing provision'
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 25. The list calls it an Open Space Assessment.
review-status: unverified
field-status: {}
