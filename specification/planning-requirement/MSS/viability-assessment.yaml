reference: viability-assessment
local-authority: MSS
required-if: discretionary
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policies DP20 and DP31; Development Viability SPD (July 2018);
  Affordable Housing SPD (July 2018)
source-text: 'A Viability Appraisal will be required for: Those applications which are non-policy compliant
  in respect of financial contributions to the provision of infrastructure and/or Affordable Housing.'
must-include:
- item: In a standardised and accessible format, with full supporting evidence for the inputs and assumptions
    used (as detailed in the Development Viability SPD)
  level: must
- item: Details of discussions with Registered Providers to inform the value of affordable housing assumed
  level: should
- item: 'Prepared for publication on the planning register: redaction only in exceptional circumstances,
    with full justification of the harm to the public interest'
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 40. Shown as discretionary because it
  depends on whether the scheme meets policy on infrastructure contributions and affordable housing.
review-status: unverified
