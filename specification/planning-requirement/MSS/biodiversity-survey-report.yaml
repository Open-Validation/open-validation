reference: biodiversity-survey-report
local-authority: MSS
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected species, or species of conservation concern (including Species of Principal
        Importance under section 41 of the NERC Act 2006), within or next to the site may be affected.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - local-wildlife-site
      description: Designated nature conservation sites (including those of geological conservation importance)
        within or next to the site may be affected.
  - site:
      in:
      - priority-habitat
      description: Habitats of conservation value (including Habitats of Principal Importance under section
        41 of the NERC Act 2006) within or next to the site may be affected.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policies DP37 and DP38
source-text: 'An Ecological Impact Assessment Report is required for a proposed development on which there
  is a reasonable likelihood that the features listed below that are within or adjacent to the application
  site, may be affected: Protected species Species of conservation concern including those listed as Species
  of Principal Importance in England under Section 41 of the Natural Environment and Rural Communities
  (NERC) Act 2006 Designated nature conservation sites (including those of geological conservation importance)
  Habitats of conservation value, including those listed as Habitats of Principal Importance in England
  under Section 41 of the Natural Environment and Rural Communities (NERC) Act 2006'
must-include:
- item: Prepared by suitably experienced and qualified ecologists / wildlife specialists (e.g. CIEEM members)
  level: must
- item: Surveys and report accord with BS 42020:2013 and CIEEM best practice guidance
  level: must
- item: Existing biodiversity interests and the possible impacts on them
  level: should
- item: Bat and Owl survey and mitigation plan
  level: should
  required-if: discretionary
  source-text: When the demolition, alteration or conversion of older buildings or rural buildings is
    proposed, the report should include a Bat and Owl survey and mitigation plan.
confidence: medium
notes: From the council's list (published September 2026), page 7-8. The list calls it an Ecological Impact
  Assessment Report. A Preliminary Ecological Appraisal is enough on its own only where it shows no further
  surveys are needed. The bat and owl item shows as discretionary because 'older buildings' isn't defined.
review-status: unverified
field-status: {}
