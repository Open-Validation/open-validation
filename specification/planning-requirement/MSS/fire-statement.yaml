reference: fire-statement
local-authority: MSS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A relevant building 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A relevant building with 7 or more storeys.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: The building is multi-occupied residential (2 or more dwellings).
source-url: https://www.midsussex.gov.uk/media/wjunxol1/form-9_planningapplicationchecklist_outlinewithsomereservedmatters.pdf
source-text: Fire Statement Form When is this required? Full planning applications for development that
  includes a “relevant building” or is within the curtilage of a relevant building.
confidence: medium
notes: The council's page describes relevant buildings as 'multi-occupied residential buildings of 18m
  or more in height, or 7 or more storeys'.
review-status: unverified
field-status: {}
