reference: fire-statement
local-authority: MSS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
  - condition:
      field: battery-energy-storage
      value: true
      description: The application is for a Battery Energy Storage System.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: 'Full planning applications for development that includes a “relevant building” or is within
  the curtilage of a relevant building. A relevant building is a building that: contains 2 or more dwellings
  or educational accommodation, and is 18m or more in height or 7 or more storeys. For applications for
  Battery Energy Storage Systems a statement will be required'
must-include:
- item: 'For Battery Energy Storage Systems: the human and environmental receptors for smoke, contamination
    and other materials from potential fires, and a comprehensive plan for mitigating receptor risk, including
    battery management safety, emergency fire service access and water supply'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: The application is for a Battery Energy Storage System.
confidence: medium
notes: From the council's list (published September 2026), page 10. Development within the curtilage of
  a relevant building also needs one.
review-status: unverified
field-status: {}
