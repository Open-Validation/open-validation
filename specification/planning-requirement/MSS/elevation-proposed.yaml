  Full planning: Existing elevations o Drawings showing each side of the existing building that will be
  altered as part of the application as it stands prior to the applied forworks. o This will be required
  for all cases where an existing building is being altered or removed. o Where the building adjoins a
  neighbouring structure, the existing elevation must include enough of the neighbouring property to clearly
  show the arrangement. o Recommended scales: 1:50, 1:100


  Outline: Floor Plans at a scale of 1:50 or1:100 If NO please provide: Block/Site Plan (at a scale of
  1:200 or 1:500) showing the approximate location of buildings, routes and open spaces included in the
  development.


  Reserved matters: Existing and Proposed Elevations (at a scale of 1:50 or 1:100) Existing and Proposed
