reference: transport-assessment
local-authority: MSS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Residential development of 50 units or more (Transport Statement for 50-80 units, Transport
        Assessment for more than 80).
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1500
      description: Use class E(g) (Business) development of 1,500 m² or more (Transport Statement for
        1,500-2,500 m², Transport Assessment above 2,500 m²).
  - discretionary
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP21
source-text: 'A Transport Assessment is generally required for: Residential development of more than 80
  units. Commercial Development falling within use class E(g) (Business) resulting in over 2500m2 floor
  space. A Transport Statement is generally required for: Residential development of up to 50 - 80 units.
  Commercial Development falling within use class E(g) (Business) resulting in 1500m2 – 2500m2 floor space.'
must-include:
- item: Accessibility to the site by all modes of transport
  level: should
- item: Likely modal split of journeys to and from the site, including a trip generation assessment using
    TRICS or an equivalent method
  level: should
- item: Technical drawings of the proposed access and off-site highway works with visibility splays, and
    swept path tracking (e.g. car, refuse collection, fire appliance) showing vehicles can access, turn
    on site and exit in a forward gear
  level: should
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new access is proposed.
- item: Proposed measures to improve access by public transport, walking and cycling, to reduce the need
    for parking and mitigate transport impact
  level: should
- item: A Design Audit of proposed highway works, stating the design guidance used, how the design complies
    and any departures from standards
  level: should
- item: A Stage 1 Road Safety Audit and Designers Response, only where required under WSCC Safety Audit
    policy
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published September 2026), page 34-35. The thresholds are 'for guidance
  purposes', and other development (such as food retail, general industrial and hotels) may also need
  one (DfT guidance Appendix B), so there is a discretionary part. The E(g) floorspace thresholds use
  the general non-residential floorspace field.
review-status: unverified
field-status: {}
