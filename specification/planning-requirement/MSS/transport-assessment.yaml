reference: transport-assessment
local-authority: MSS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Residential development of 50 or more units (Transport Statement 50-80; Transport Assessment
        80+).
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1500
      description: E(g) floorspace of 1,500 square metres or more (Transport Statement 1,500-2,500; Transport
        Assessment over 2,500).
source-url: https://www.midsussex.gov.uk/media/wjunxol1/form-9_planningapplicationchecklist_outlinewithsomereservedmatters.pdf
source-text: Transport Assessment and Transport Statement – A transport assessment is required for residential
  development of 80 or more units.
confidence: medium
notes: 'Audit (wrong_trigger): from the audit, TA for more than 80 dwellings or more than 2,500 sqm E(g);
  TS for 50-80 dwellings or 1,500-2,500 sqm.'
review-status: unverified
field-status: {}
