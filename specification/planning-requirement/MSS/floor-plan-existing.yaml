reference: floor-plan-existing
local-authority: MSS
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: An existing building is being altered.
  - condition:
      field: demolition
      value: true
      description: An existing building or structure is being removed (demolished).
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: This will be required for all cases where an existing building is being altered or removed.
  Floorplans will be required for any buildings or structures that are to be demolished as part of the
  application.
must-include:
- item: Layout of the existing arrangement of the building(s), showing all doors and openings
  level: should
- item: Clear labelling of the existing use of each room/area
  level: must
- item: Recommended scales 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 2. Only where there is an existing building.
review-status: unverified
field-status: {}
