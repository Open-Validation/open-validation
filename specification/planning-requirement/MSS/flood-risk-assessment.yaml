reference: flood-risk-assessment
local-authority: MSS
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zones 2 or 3 (including Flood Zone 3b).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: In Flood Zone 1 with a site area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: In Flood Zone 1 with a site area of 1 hectare or more.
  - site:
      in:
      - future-flood-risk
      description: In 'Flood Zones plus Climate Change' on the flood map for planning, or shown by the
        council's SFRA to be at increased risk of flooding during its lifetime.
  - site:
      in:
      - surface-water-flood-risk
      description: The flood map for planning shows the site at risk of flooding from surface water, now
        or in future.
  - site:
      in:
      - critical-drainage-area
      description: In an area with critical drainage problems.
  - discretionary
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
source-text: 'A Flood Risk Assessment (FRA) will be required for all developments (including minor development
  and changes of use) proposed: in Flood Zones 2 or 3 or see flood map for planning within Flood Zone
  3b within Flood Zone 1 with a site area of 1 hectare or more within ‘Flood Zones plus Climate Change’,
  showing it is at increased risk of flooding from rivers or sea in future – see flood map for planning
  with Flood Zone 1 and the flood map for planning shows it is at risk of flooding from surface water,
  now or in future in areas with critical drainage problems within Flood Zone 1 where the LPA’s strategic
  flood risk assessment (SFRA) shows it will be at increased risk of flooding during its lifetime that
  increases the vulnerability classification and may be subject to sources of flooding other than rivers
  or sea’'
must-include:
- item: Identification and assessment of all forms of flooding to and from the development (and their
    interactions), showing how the risks will be managed so the development stays safe for its lifetime
    without increasing flood risk elsewhere, with the impact of climate change considered
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Proposed management of surface water, including the use of Sustainable Drainage Systems (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: Application of the sequential test, and exception test, where relevant
  level: must
- item: A statement demonstrating that the SuDS scheme would not increase the bird strike risk to the
    airport
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 11-12. The last trigger (a change that
  increases the vulnerability classification where the site 'may be subject to' other sources of flooding)
  shows as discretionary. The Sequential and Exception Test (pages 13-14) is in the unmapped list.
review-status: unverified
field-status: {}
