reference: air-quality-assessment
local-authority: MSS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - air-quality-management-area
        description: The site is within, or in relevant proximity to, an Air Quality Management Area.
    - ref: major-development
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 500
        description: B8 storage and distribution use with a floorspace of 500 m² or more.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex Site Allocations DPD policy SA38
source-text: 'Excluding Householder, Advertisement, Tree and Listed Building applications an Air Quality
  Assessment may be required for: All applications within, or in relevant proximity, to an Air Quality
  Management Area. Major development, as defined by Town and Country Planning (Development Management
  Procedure) Order (England) 2015 B8 storage and distribution use class with a floorspace of 500m2 or
  more'
must-include:
- item: An emissions mitigation assessment as per the latest Air quality and emissions mitigation guidance
    for Sussex
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 5. The list excludes householder, advertisement,
  tree and listed building applications; the planning-permission types are listed instead. The list says
  'may be required'.
review-status: unverified
field-status: {}
