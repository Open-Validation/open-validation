reference: travel-plan
local-authority: MSS
required-if:
  any:
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: 'Transport Assessment: residential development of more than 80 units.'
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 2500
        description: 'Transport Assessment: use class E(g) (Business) development resulting in over 2,500
          m² floor space.'
  - any:
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: 'Transport Statement: residential development of 50 to 80 units.'
      - condition:
          field: dwelling-count
          operator: <=
          value: 80
          description: 'Transport Statement: residential development of 50 to 80 units.'
    - all:
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1500
          description: 'Transport Statement: use class E(g) (Business) development of 1,500 to 2,500 m².'
      - condition:
          field: floorspace-non-residential
          operator: <=
          value: 2500
          description: 'Transport Statement: use class E(g) (Business) development of 1,500 to 2,500 m².'
  - discretionary
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP21; West Sussex County Council Development Travel
  Plans Policy
source-text: As a rule, a Travel Plan Statement is required for sites where a Transport Statement is required,
  and full Travel Plan is required for sites where a Transport Assessment is required.
must-include:
- item: Background information about the site, including any relevant travel information (e.g. staff travel
    surveys)
  level: should
- item: A nominated Travel Plan Co-ordinator, with contact details
  level: should
- item: Measures, information and incentives to encourage use of non-car modes and car sharing (for residential
    developments, a £150 voucher offered to each dwelling)
  level: should
- item: Measures and incentives to reduce the need to travel in the first place
  level: should
- item: 'Full Travel Plan: how it will be monitored, in accordance with the TRICS UK Standard Methodology'
  level: should
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: 'Transport Assessment: residential development of more than 80 units.'
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 2500
        description: 'Transport Assessment: use class E(g) (Business) development resulting in over 2,500
          m² floor space.'
- item: 'Full Travel Plan: a target 12-hour weekday vehicle trip rate 10% lower (rural) or 15% lower (urban)
