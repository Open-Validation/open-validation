notes: From the council's list (published September 2026), page 36-37. A Travel Plan Statement goes with
  a Transport Statement and a full Travel Plan with a Transport Assessment, using the same thresholds.
  The exact thresholds are in West Sussex County Council's Development Travel Plans Policy (available
  on request), so there is a discretionary part.
