reference: archaeological-assessment
local-authority: MSS
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: The proposal is within an Archaeological Notification Area.
  - site:
      in:
      - scheduled-monument
      - historic-environment-record
      description: The application affects heritage assets with an archaeological interest.
  - discretionary
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policies DP34 and DP35
source-text: For all applications affecting heritage assets with an archaeological interest, or for proposals
  which are located within a pre-defined area of Archaeological Notification Area or represent significant
  infrastructure works, an applicant will need to commission an Archaeological Desk-Based Assessment and
  submit the results.
must-include:
- item: Results of an Archaeological Desk-Based Assessment
  level: must
- item: Field evaluation report
  level: must
  required-if: discretionary
  source-text: Where such Assessment is inconclusive or indicates that a proposed development might detrimentally
    impact upon the archaeological significance of a site, the applicant may be required to carry out
    field evaluation and a report on the findings may be required to accompany the planning application.
confidence: medium
notes: From the council's list (published September 2026), page 18. Part of the council's Heritage Statement
  and Archaeological Assessment section. 'Significant infrastructure works' isn't defined, so that part
  shows as discretionary, as does the field evaluation.
review-status: unverified
field-status: {}
