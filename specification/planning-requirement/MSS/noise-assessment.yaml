reference: noise-assessment
local-authority: MSS
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development raises issues of disturbance by noise to the occupants of nearby existing
        buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development (e.g. residential, offices, hospitals, schools) sited close
        to existing sources of noise.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP29
source-text: 'Applications for developments that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and for developments that are considered to be noise sensitive, and which
  are proposed to be sited close to existing sources of noise. This may include, but is not limited to:
  Residential Developments Offices Hospitals Schools'
must-include:
- item: A report by a qualified acoustician
  level: should
- item: Background noise surveys of sufficient length and at appropriate times to be representative
  level: should
- item: 'Prepared with regard to ProPG: Planning & Noise 2017'
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 24. Air source heat pump applications
  may need an MCS 020 assessment.
review-status: unverified
field-status: {}
