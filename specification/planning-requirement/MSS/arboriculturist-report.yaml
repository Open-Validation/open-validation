reference: arboriculturist-report
local-authority: MSS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within 15 metres of the development.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Trees are to be removed as part of the development.
source-url: https://www.midsussex.gov.uk/media/3zpdrohh/validation-criteria-local-list.pdf
policy: Mid Sussex District Plan 2014-2031 policy DP37
source-text: 'A Tree Report will be required for: Applications where there are trees within 15 metres
  of the development Applications where trees are to be removed as part of the development.'
must-include:
- item: Prepared by a qualified arboriculturist as an Arboricultural Impact Assessment and Method Statement,
    including a Tree Protection Plan
  level: must
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: 'For applications within a 13 km radius of the aerodrome: a statement that aerodrome safeguarding
    requirements have been taken into consideration'
  level: must
- item: Tree survey detail as required by BS 5837:2012
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 38. The list calls it a Tree Report.
review-status: unverified
field-status: {}
