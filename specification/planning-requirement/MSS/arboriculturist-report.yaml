reference: arboriculturist-report
local-authority: MSS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within 15m of the development, or within or adjacent to the site that
        could be affected.
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.midsussex.gov.uk/media/gyahlxbj/form-1_planningapplicationchecklist_householder.pdf
source-text: 'Householder, Outline, Listed building consent, Advertisement consent, Demolition in cons
  area: Tree Survey/Report - for applications where there are trees within 15m of the development.


  Full planning: Guidance The tree survey should include such detail as required by British Standard 5837
  (2012) Trees in relation to design, demolition, and construction – recommendations.


  Reserved matters: VALIDATION CHECKLIST Tree Survey/Report - for applications where there are trees within,
  or on land adjacent to, the application site that could influence or be affected by the development.


  Change of use - prior approval: Tree Survey/Report: for applications where there are trees within 15m
  of development.'
must-include:
- item: Detail as required by BS 5837 (2012)
  level: should
confidence: medium
notes: 'From the audit (missing_requirement): the Tree Report trigger (trees within 15m or trees to be
  removed) also applies to tree applications.'
