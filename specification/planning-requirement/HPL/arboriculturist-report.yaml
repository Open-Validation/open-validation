source-text: Tree Survey and/or Statement of Arboricultural Impact of Development Wherever there are trees
  are on or close to a development that may be affected arboricultural information is needed in support
  of the application to allow the council to consider the direct and indirect effects that the proposal
  may have on the trees as a material planning consideration in line with BS5837:2012 Trees in relation
  to design, demolition and construction – recommendations.
