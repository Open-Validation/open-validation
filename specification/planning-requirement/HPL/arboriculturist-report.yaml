reference: arboriculturist-report
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - hh
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the site, trees on neighbouring land that overhang it, trees within 20 metres
        of the proposal with soft ground between, or within 10 metres with hard ground between.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies NE1, QP4; Trees and Development Guidelines Supplementary
  Planning Document
source-text: 1. Trees on the development site 2. Trees on neighbouring land that overhang the property
  3. Trees within 20 metres of the proposal with soft ground between (Grass, soil, paving stones, footpaths,
  etc.) 4. Trees within 10 metres of proposal with hard ground between (Concrete, houses, roads etc.)
must-include:
- item: All such trees plotted on the block plan, labelled with species, diameter at 1.5 metres and root
    protection area (12 times the diameter)
  level: must
- item: 'Tree Survey to BS 5837:2012: species, height, diameter at breast height, branch spread at the
    4 cardinal points, age class, condition, remaining contribution and category'
  level: must
  required-if: discretionary
- item: Tree Retention/Removal Plan
  level: must
  required-if: discretionary
- item: 'Arboricultural Impact Assessment: effects of tree losses, damaging activities near retained trees,
    future constraints'
  level: must
  required-if: discretionary
- item: 'Tree Protection Plan on the proposed layout: type of protection, exclusion zones, ground protection'
  level: must
  required-if: discretionary
- item: Arboricultural Method Statement for any operations within the root protection area (or crown spread
    if greater)
  level: must
  required-if: discretionary
- item: 'Tree Planting Plan: species, stock size, location, planting method and 5 years'' maintenance'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 33 (Tree Survey and/or Statement
  of Arboricultural Impact of Development), page 67. Listed in Appendix 2 checklists 1 (full), 2 (outline
  and reserved matters), 3 (listed building and conservation area consent), 5 (householder). Plotting
  the trees lets the council decide whether more arboricultural information is needed; the further documents
  'may be required', so discretionary.
review-status: unverified
field-status: {}
