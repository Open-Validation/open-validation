reference: design-and-access-statement
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - hh
  - any:
    - ref: major-development
    - application-type:
        in:
        - lbc
    - all:
      - site:
          in:
          - world-heritage-site
          - conservation-area
          description: In World Heritage Sites or a conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The provision of one or more dwellinghouse.
        - condition:
            field: floorspace
            operator: '>'
            value: 100
            description: A building (or extension) where the proposed floor space is more than 100 square
              metres.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications for major development as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015; • The provision of dwellinghouses where - (i)
  the number of dwellinghouses to be provided is 10 or more; or (ii) the development is to be carried
  out on a site having an area of 0.5 hectares or more • The provision of a building or buildings where
  the floor space to be created by the development is 1,000 square metres or more; • Development carried
  out on a site having an area of 1 hectare or more (excluding minerals, mining or waste development applications)
  • In World Heritage Sites or a conservation area; i. the provision of one or more dwellinghouse ii.
  the provision of a building (or extension) where the proposed floor space is more than 100 square metres;
  • Applications for listed building consent • Applications for waste development, a material change of
  use, engineering or mining operations do not need to be accompanied by a Design and Access Statement.
must-include:
- item: A description of any heritage asset affected, including any contribution made by its setting,
    and the contribution of the development to local character and distinctiveness
  level: must
- item: Reference to the Residential Design Guide (2019), with a focus on Building for a Healthy Life
    and Nationally Described Space Standards
  level: should
- item: May include a Heritage Statement, where appropriate
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 6 (Design and Access Statement),
  page 11. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent), 5 (householder). Waste development, material changes of use, and engineering
  or mining operations don't need one; nor do sites of 1 ha or more for minerals, mining or waste development.
  The national contents (design principles, context, access policy and consultation; for listed building
  consent, the building's special interest, features and setting) also apply.
review-status: unverified
field-status: {}
