reference: noise-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Applications that raise issues of disturbance.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive developments.
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policy QP6
source-text: 'A noise impact assessment prepared by a suitably qualified acoustician should support applications
  that raise issues of disturbance, or are considered to be noise sensitive developments. A noise survey/sound
  insulation details may be required for the following types of application: • Changes of use to restaurants,
  snack bars, cafes, nightclubs, hot food takeaways, places of worship, church halls, clinics, health
  centres, crèches, day nurseries, consulting rooms, cinemas, music, concert halls, dance, sports halls,
  swimming baths, skating rinks, gymnasiums, other indoor and outdoor sports and leisure uses, bingo halls
  and casinos; • New residential development adjacent to classified roads (including trunk roads), or
  adjacent to railway lines or existing industrial uses (except Class B1); • New residential development
  near to licensed premises and cultural venues; • New industrial development close to existing residential
  development. • Minerals and waste development • Energy generation development'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Potential sources of noise and their effect on local amenity and environmental receptors (particularly
    near designated sites)
  level: must
- item: How the developer intends to overcome these issues
  level: must
- item: Vibration survey for development next to a railway line
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 22 (Noise Assessment), page 50.
  Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters). A noise survey or sound
  insulation details 'may be required' for the listed types (noisy changes of use, homes near classified
  roads, railways, industry, licensed premises or venues, industry near homes, minerals and waste, energy
  generation), so discretionary alongside the two clear triggers.
review-status: unverified
