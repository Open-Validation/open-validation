reference: archaeological-assessment
local-authority: HPL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline
        - reserved-matters
        - hh
    - any:
      - site:
          in:
          - scheduled-monument
          description: Scheduled Monuments and development in their vicinity.
      - site:
          in:
          - historic-environment-record
          description: Sites on the Hartlepool Historic Environment Record and development in their vicinity.
      - site:
          in:
          - archaeological-priority-area
          description: Sites with the potential to include heritage assets with archaeological interest.
      - discretionary
  - all:
    - application-type:
        in:
        - lbc
        - demolition-con-area
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies HE2, QP4, QP6
source-text: Planning applications that may affect the significance of any heritage asset, including its
  setting. • This will include Scheduled Monuments, sites on the Hartlepool Historic Environment Record
  and development in the vicinity of such sites, and sites with the potential to include heritage assets
  with archaeological interest.
must-include:
- item: 'Archaeological Desk Based Assessment by an experienced professional archaeologist: heritage assets
    affected and their significance, proportionate to their importance, with recommendations for further
    work'
  level: must
- item: Informed by a search of the Tees Archaeology HER (records obtained directly from Tees Archaeology,
    not the online HER)
  level: must
- item: Archaeological Evaluation (fieldwalking, earthwork or geophysical survey, trial trenching) by
    experienced professional archaeologists, agreed with Tees Archaeology, where the desk based assessment
    can't fully assess significance or impact
  level: must
  required-if: discretionary
- item: Archaeological Building Assessment by an experienced professional archaeologist or buildings historian,
    where a structure of heritage interest is identified but significance or impact can't be fully assessed
    (not for listed buildings or buildings in a conservation area)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 11 (Archaeological Assessments),
  page 20. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent), 5 (householder). 'May affect the significance of any heritage asset'
  is discretionary; for listed building and conservation area consent the checklist says 'May be required
  please ask before submission' (discretionary). Early discussion with Tees Archaeology is advised.
review-status: unverified
field-status: {}
