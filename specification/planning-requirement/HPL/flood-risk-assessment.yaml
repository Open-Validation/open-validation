reference: flood-risk-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - hh
  - any:
    - site:
        in:
        - critical-drainage-area
        - flood-risk-zone
        - surface-water-flood-risk
        - reservoir-flood-risk
        description: Within a critical drainage area, Flood Zones 2 & 3, or areas affected by 'flood risk
          from surface water' or 'flood risk from reservoirs'.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development on sites of 1ha or greater.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development on sites of 1ha or greater.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: Development or changes of use to a more vulnerable class.
      - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies CC1, CC2, QP6
source-text: 'All planning applications for: • Development within a local authority’s own identified critical
  drainage area, Flood Zones 2 & 3 or areas affected by ‘flood risk from surface water’ or ‘flood risk
  from reservoirs’; https://flood-map-for-planning.service.gov.uk/ • Development on sites of 1ha or greater;
  • Development or changes of use to a more vulnerable class that may be subject to other sources of flooding'
must-include:
- item: 'Residential and non-residential extensions under 250 square metres in a critical drainage area
    or Flood Zones 2 and 3: a simple flood risk assessment'
  level: should
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
- item: 'Zone 1: existing flood risk from localised sources and impact on run off rates; SuDS design measures
    to mitigate run off'
  level: should
  required-if: discretionary
- item: 'Zone 2: existing flood risk from all sources and potential impact on flood risk (high level);
    mitigation measures and their impact (floor levels, ground levels, evacuation routes, SuDS)'
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Flood Zone 2.
- item: 'Zone 3: existing flood risk from all sources (flood depth, flow routes, velocity, defence failure);
    potential impact on flood risk; mitigation measures and their impact (floor levels, ground levels,
    evacuation routes, SuDS)'
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Flood Zone 3.
- item: 'Sequential testing statement: written statement of the area of search; map of all other sites
    considered in lower flood risk areas; why those sites aren''t reasonably available'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zones 2 and 3.
    - condition:
        field: new-build
        value: true
        description: New development (not householder extensions, non-residential extensions under 250
          sq. metres or renewable energy proposals).
  source-text: Applications for new development in Flood Zones 2 and 3 should contain a sequential testing
    statement (except for householder extensions, non-residential extensions of less than 250sq. metres
    or renewable energy proposals)
- item: Exception test, where the sequential test is passed but the development is vulnerable
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 14 (Flood Risk and Drainage Assessments),
  page 31. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 5 (householder).
  Changes of use to a more vulnerable class need one where they 'may be subject to other sources of flooding'
  (a judgement, so discretionary). The council points to the Environment Agency's FRA template and checklist.
review-status: unverified
field-status: {}
