reference: biodiversity-survey-report
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - hh
  - any:
    - all:
      - any:
        - condition:
            field: demolition
            value: true
            description: Demolition (including in part).
        - condition:
            field: building-works
            value: true
            description: Modification of buildings or structures.
      - any:
        - condition:
            field: agricultural-building-reuse
            value: true
            description: Permanent agricultural buildings.
        - condition:
            field: potential-roost-features
            value: true
            description: Buildings with weather boarding, wooden cladding and/or hanging tiles within
              200 metres of woodland or water; pre-1980 buildings within 200 metres and pre-1919 buildings
              within 400 metres of woodland or water; buildings/structures within or immediately adjacent
              to woodland and/or water; bridges, aqueducts and viaducts.
        - condition:
            field: underground-structures
            value: true
            description: Tunnels, mines, kilns, ice houses, adits, military fortifications, air raid shelters,
              cellars and similar underground structures.
        - condition:
            field: protected-species
            value: true
            description: Buildings known to support roosting bats.
    - all:
      - condition:
          field: floodlighting
          value: true
          description: Floodlighting.
      - condition:
          field: near-woodland
          value: true
          description: Within 50 metres of woodland, water or hedgerows / lines of trees with an obvious
            connection to woodland or water.
    - condition:
        field: veteran-trees
        value: true
        description: Works to fell or lop veteran trees, trees with obvious cracks, holes and cavities,
          or trees with a diameter greater than a metre at chest height.
    - all:
      - ref: major-development
      - any:
        - condition:
            field: distance-to-pond
            operator: <=
            value: 500
            description: Within 500 metres of the perimeter of a pond.
        - condition:
            field: near-watercourse
            value: true
            description: Within 200 metres of rivers, streams, canals, lakes or other aquatic habitats
              such as wetlands.
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor proposals.
      - any:
        - condition:
            field: distance-to-pond
            operator: <=
            value: 100
            description: Within 100 metres of a pond.
        - condition:
            field: near-watercourse
            value: true
            description: Adjacent to rivers, streams, canals, lakes or other aquatic habitats such as
              wetlands.
    - condition:
        field: wind-turbine
        value: true
        description: Proposals for wind turbines.
    - site:
        in:
        - special-protection-area
        - ramsar
        - special-area-of-conservation
        - site-of-special-scientific-interest
        - local-wildlife-site
        - local-nature-reserve
        - wildlife-corridor
        - priority-habitat
        description: Affecting an SPA/Ramsar site, SAC, SSSI, Local Wildlife Site, Local Nature Reserve,
          Wildlife Corridor, or priority habitats and species.
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the biodiversity gain condition.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies NE1, NE2, NE3, NE4, NE5, NE6, NE7, QP6
source-text: 'Applications that involve modification / demolition (including in part) of the following
  must provide a protected species survey, assessment and mitigation report unless an exception applies:
  … Applications that include the following must provide a protected species survey, assessment and mitigation
  report unless an exception applies: … Applications affecting any of the following must provide an ecological
  survey assessment and mitigation report, unless an exception applies: … An Ecological Impact Assessment
  Report containing the following information (L);'
must-include:
- item: Following CIEEM guidelines and BS 42020:2013
  level: must
- item: Potential direct and indirect impacts, during and after construction, on designated sites, priority
    habitats and species and other biodiversity features found
  level: must
- item: Any Wildlife and Countryside Act Schedule 9 invasive species, and how they will be dealt with
  level: must
- item: Alternative designs or locations; how adverse effects will be avoided, mitigated or compensated;
    whether there will be a net loss or net gain for biodiversity
  level: must
- item: Plans showing wildlife habitats and features and the location of protected habitats and/or species
    in relation to the development
  level: should
- item: Detailed specialist survey where protected or priority species are known or reasonably likely
    (including species not detectable at that time of year); full eDNA results appended if used
  level: must
- item: Surveys by competent people (names, qualifications and licence details given), at the correct
    time of year (dates given), in suitable weather, using recognised methods
  level: must
- item: 'Ecological Impact Assessment Report: designated sites on and near the site; baseline habitats
    and links off site (Statutory Biodiversity Metric for major applications); baseline priority species;
    desktop wildlife records search; adverse impacts and agreed measures following the mitigation hierarchy;
    biodiversity enhancement measures; all mitigation agreed by the applicant and marked ''Final'''
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 12 (Ecological Survey Assessment
  (& Mitigation Report & Protected Species Survey Assessment & Mitigation Report) and BNG), page 23. Listed
  in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 5 (householder). The Ecological
  Impact Assessment Report is a local requirement for development subject to the biodiversity gain condition.
  A survey may be waived if the council confirms in writing at pre-application stage that it isn't needed,
  or if a suitably qualified ecologist's reasoned risk assessment shows no protected species are present
  or affected.
review-status: unverified
field-status: {}
