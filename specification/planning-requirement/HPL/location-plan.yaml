reference: location-plan
local-authority: HPL
required-if:
  always: true
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a location plan based on an up-to-date map.
must-include:
- item: 'Identified standard metric scale: 1:1250, or 1:2000 or 1:2500 for larger or more rural sites'
  level: should
- item: Enough roads (at least 2 road names) and/or buildings on adjoining land to make the exact location
    clear
  level: should
- item: Application site edged clearly in red, with the direction of north
  level: should
- item: All land needed to carry out the development within the red line, e.g. access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings
  level: should
- item: Blue line around any other land owned or controlled by the applicant, close to or adjoining the
    site
  level: must
- item: Linear scale bar
  level: should
- item: '''Do not scale'' removed and replaced with wording allowing the council to scale from the drawing'
  level: should
- item: Provided at the paper size and scale stated on the plan (e.g. 1:1250 @A4 provided at A4)
  level: should
- item: Not copied from Ordnance Survey plans without authorisation, and not from Google Maps or similar
    platforms
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 2 (Location Plan), page 9. Listed
  in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building and conservation
  area consent), 4 (advertisement), 5 (householder).
review-status: unverified
field-status: {}
