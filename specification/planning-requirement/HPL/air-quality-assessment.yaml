reference: air-quality-assessment
local-authority: HPL
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is in an Air Quality Management Area.
    - condition:
        field: traffic-aadt-increase
        operator: '>='
        value: 5
        description: The development would lead to a minimum 5% increase in traffic within the AQMA.
  - condition:
      field: biomass-or-chp
      value: true
      description: The proposal includes biomass boilers or CHP plant.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
source-text: Where a development would lead to a minimum 5% increase in traffic within an Air Quality
  Management Area (AQMA)
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave contact details. From the audit: s9 also covers biomass
  boilers or CHP plant.'
review-status: unverified
field-status: {}
