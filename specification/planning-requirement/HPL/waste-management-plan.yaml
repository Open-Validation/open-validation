  Policy RUR4: Equestrian Development Other Guidance Landscape Institute’s Technical Guidance Note (TGN)
  02/2019 Residential Visual Amenity Assessment; https://www.landscapeinstitute.org/technical-resource/rvaa/
  21. Marketing Information When is this required? Planning applications for: • Conversion to residential
  use of rural buildings, including outside the development limits as defined on the policies map; • Changes
  of use within any of the Retail and Commercial areas as delineated/defined in the Hartlepool Local Plan
  policies map where the use proposed is not aligned with the relevant policy for that location within
  the Hartlepool Local Plan; • Non B1 (Business), B2 (General Industrial) and B8 (Storage or Distribution)
  uses on land allocated for such purposes in the development plan; • Demolition of listed and locally
  listed buildings and buildings in conservation areas. • Removal of restrictive agricultural occupancy
  conditions. With regard to the first three bullet points marketing information may not always be required
  and the need for such evidence should be clarified with the Local Planning Authority at pre-application
  stage including the scope of the marketing exercise and timescales. What information is required? It
  should be demonstrated that the property/land has been advertised for sale or lease on the open market
  for uses appropriate to the use allocated in the development plan. Details of the marketing and all
  offers received, if applicable, should be submitted along with a written assessment. It is expected
  that in most instances, marketing will have been undertaken for a minimum of 12 months (again, in certain
  instances, a period of 6 months may be appropriate but advice should be sought from the LPA through
  pre-application advice). Policy Background Government policy or guidance: • National Planning Policy
  Framework • National Planning Practice Guidance – paragraph 016 in Conserving and enhancing the historic
  environment Adopted Hartlepool Local Plan (2018) Policies: Policy RUR2: New Dwellings Outside of Development
  Limits Policy HE4: Listed Buildings and Structures Policy HE5: Locally Listed Buildings and Structures
  Policy HE7: Heritage at Risk Policies RC1-18 (inclusive): Retail and Commercial Development Other Information;
  HBC New Dwellings Outside of Development Limits SPD - Adopted Version 2015; https://www.hartlepool.gov.uk/downloads/file/424/new_dwellings_outside_of_development_limits_
  spd_-_adopted_version_2015 22. Noise Assessment When is this required? A noise impact assessment prepared
  by a suitably qualified acoustician should support applications that raise issues of disturbance, or
  are considered to be noise sensitive developments. A noise survey/sound insulation details may be required
  for the following types of application: • Changes of use to restaurants, snack bars, cafes, nightclubs,
  hot food takeaways, places of worship, church halls, clinics, health centres, crèches, day nurseries,
  consulting rooms, cinemas, music, concert halls, dance, sports halls, swimming baths, skating rinks,
  gymnasiums, other indoor and outdoor sports and leisure uses, bingo halls and casinos; • New residential
  development adjacent to classified roads (including trunk roads), or adjacent to railway lines or existing
  industrial uses (except Class B1); • New residential development near to licensed premises and cultural
  venues; • New industrial development close to existing residential development. • Minerals and waste
  development • Energy generation development In addition, a vibration survey may be required if a development
  is proposed adjacent to a railway line. What information is required? A noise impact assessment prepared
  by a suitably qualified acoustician should support applications that raise issues of disturbance or
  are considered to be noise sensitive developments. Sound insulation details may be required for the
  types of application named in the above list. The Noise Impact Assessment should outline the potential
  sources of noise generation, and how these may have a negative effect on local amenity and environmental
  receptors particularly on sites in close proximity to nationally and internationally designated sites.
  The assessment should also outline how the developer intends to overcome these issues. For developments
  likely to be affected by noise associated with the strategic road network, please contact Highways England
  for details of its noise assessment requirements. Policy Background Government policy or guidance: •
  National Planning Policy Framework – Section 15. Conserving and enhancing the natural environment •
  National Planning Practice Guidance – Noise section Adopted Hartlepool Local Plan (2018) Policies: Policy
  QP6: Technical Matters 23. Nitrate Pollution of the Teesmouth & Cleveland Coast SPA/Ramsar site When
  is this required? A Nutrient Neutrality assessment should be prepared by a competent person, with the
  relevant experience for applications that are likely to increase the input of nitrate and/or phosphate
  into the River Tees catchment area. A Nutrient Neutrality assessment is required for the following types
  of ‘in scope’ applications: • New dwellings, student accommodation, care homes, tourism attractions
  and tourist accommodation and permitted development (which gives rise to new overnight accommodation)
  and agriculture and industrial plans and projects that have potential to release additional nitrogen
  and or phosphorous into the system. • Other types of business or commercial development, not involving
  overnight accommodation, will generally not need to be included in the assessment unless they have other
  (non-sewerage) water quality implications. What information is required? A Nutrient Neutrality assessment
  should be prepared by a competent person, with the relevant experience for applications that are likely
  to increase the input of nitrate and/or phosphate into the River Tees catchment area. i) If you are
  proposing to bring forward ‘in scope’ development where foul water from a development (or foul and surface
  water) discharges to the Seaton Carew or Billingham WWTW and the development is below the EiA thresholds,
  and you intend to incorporate SuDS within the development you will need to submit a Nutrient Neutrality
  Statement. This statement should include: • Location of development in relation to the River Tees catchment;
  • Details of proposed application; • Details of the current land use (please show where there is a difference
  in land use over the last 10 years); • Details of how foul and surface water drainage will be disposed
  of; • Details of any proposed SuDS incorporated in the development ii) If you are proposing to bring
  forward in scope development which exceeds the EiA thresholds, or which does not discharge to the Seaton
  Carew or Billingham WWTW, or does not incorporate SuDS you will need to complete and submit the Nutrient
  Neutrality Budget Calculator for the Tees catchment. You will also need to submit a Nutrient Neutrality
  Statement with the calculator results. This Statement should include: • Location of development in relation
  to the River Tees catchment; • Details of proposed application; • Details of the current land use (please
  show where there is a difference in land use over the last 10 years); • Details of how foul and surface
  water drainage will be disposed of; • Details of the nitrate budget calculation including a table of
  key findings; • Details of any mitigation if appropriate; and • Overall justification of the proposed
  land use and number of dwellings. The completion of the Nutrient Neutrality Budget Calculator and the
  Nutrient Neutrality Statement should be carried out by a competent person with the relevant experience.
  If the results show no increase in nitrates, subject to the LPA’s verification, no mitigation is required,
  please submit nitrates calculator results with your application. If the results show an increase in
  nitrates, mitigation needs to be considered and secured. If mitigation cannot be achieved on site or
  off site through alternative owned landholdings within the river catchment of the development site,
  you would be advised not to submit the application. The LPA cannot determine the application favourably
  with no mitigation secured. The calculator and up to date guidance/details can be found at https://www.hartlepool.gov.uk/planning/nitrates-teesmouth-cleveland-coast-spa-ramsar
  Mitigation proposals can be discussed with Natural England via the link on the same page. Policy Background
  Government policy or guidance: • National Planning Policy Framework – Section 15. Conserving and enhancing
  the natural environment • National Planning Practice Guidance – Appropriate Assessment; Natural Environment;
  and Strategic Environmental Assessment and Sustainability Appraisal Adopted Hartlepool Local Plan (2018)
  Policies: Policy SUS1: The Presumption in Favour of Sustainable Development Policy NE1: Natural Environment
  Policy NE2: Green Infrastructure Other Information: Hartlepool Borough Council website on Nutrient Neutrality.
  including the Budget Calculator and associated guidance- https://www.hartlepool.gov.uk/planning/nitrates-teesmouth-cleveland-coast-
  spa-ramsar The Conservation of Habitats and Species Regulations 2017 - https://www.legislation.gov.uk/uksi/2017/1012/contents/made
  24. Open Space Assessment When is this required? All planning applications for development on existing
  open space. Open space can be taken to mean all open space of public value, including not just land,
  but also areas of water such as rivers, canals, lakes and reservoirs, that can offer important opportunities
  for sport and recreation and can also act as a visual amenity. What information is required? Proposals
  should be accompanied by plans (to scale and also including area measurements), showing any areas of
  existing or proposed open space within or adjoining the application site. Planning permission is not
  normally given for the development of existing open spaces that local communities need. In the absence
  of a robust and up-to-date assessment by a local authority, an applicant for planning permission may
  seek to demonstrate through an independent assessment that the land and buildings are surplus to local
  requirements. Any such evidence should accompany the planning application. Policy Background Government
  policy or guidance: • National Planning Policy Framework – Section 8. Promoting healthy and safe communities
  and Annex 2 Glossary. • National Planning Practice Guidance - Open space, sports and recreation facilities,
  public rights of way and local green space section Adopted Hartlepool Local Plan (2018) Policies: Policy
  QP5: Safety and Security Policy QP6: Technical Matters Policy NE2: Green Infrastructure Other Information:
  Hartlepool Green Infrastructure Supplementary Planning Document 2014. https://www.hartlepool.gov.uk/info/20209/local_plan/312/local_plan_planning_policy
  25. Planning Obligations – Draft Head of Terms When is this required? Applications for planning permission
  where the local authority have indicated at pre-application stage that a Section 106 agreement would
  be necessary. Please seek clarification from the Local Planning Authority. What information is required?
  Planning obligations (Section 106 agreements) are private agreements negotiated between Local Planning
  Authorities and persons with an interest in a piece of land that seek to address various planning issues
  such as affordable housing, public open space provision, highway works or landscape and nature conservation
  mitigation. To make the planning application process quicker, it is expected that a draft head of terms
  will be submitted along with the application and the ownership and contact details necessary for the
  planning obligation to be progressed. Please seek pre-application advice from the Local Planning Authority
  for further details on what contributions would be required. Policy Background Government policy or
  guidance: • National Planning Policy Framework – Section 4. Decision Making • National Planning Practice
  Guidance – Planning obligations section Adopted Hartlepool Local Plan (2018) Policies: Policy QP1: Planning
  Obligations Other Information; Planning Obligations SPD Nov 2015; https://www.hartlepool.gov.uk/downloads/file/907/planning_obligations_spd_nov_2015
  26. Planning Statement When is this required? A Planning Statement is required for all Major and Non-Major
  planning applications (except those for trees and householder applications) including small dwelling
  sites, changes of use, proposals in sensitive locations (for example beyond the development limits)
  to assist in allowing the applicant to explain/justify the proposals in further detail. What information
  is required? A supporting Planning Statement provides the opportunity for the applicant to present the
  case for the proposal. The Planning Statement should include; • Identify the context and need for a
  proposed development and include an assessment of how the proposed development relates to relevant national
  and local planning policies (those of the Hartlepool Local Plan and the Hartlepool Rural Neighbourhood
  Plan) and relevant SPDs and other supporting documents. • Where applications relate to new dwellings
  in the open countryside, the Planning Statement should explicitly reference and consider the ‘tests’
  of the Council’s ‘New Dwellings outside of Development Limits Supplementary Planning Document’ • It
  may also include details of consultations with the Local Planning Authority and wider community/statutory
  consultees undertaken prior to submission. This can be in the form of a Statement of Community Involvement
  (SCI; see Item 26). • The Planning Statement can also include information on employment creation as
  well as economic and regeneration benefits. Applicants can also submit an Economic Statement to highlight
  the economic benefits of a scheme if they so wish but this would not be required for validation purposes.
  • It may include reference to any ecological features present (or not present) on site and reference
  any accompanying supporting surveys The Planning Statement can also be merged with/include a Sustainability
  Statement (see Item 24). The LPA strongly encourages applications relating to residential developments
  to provide and incorporate an assessment of the scheme against Nationally Described Space Standards
  as well as providing a Building For a Healthy Life Assessment. Policy Background Government policy or
  guidance: • National Planning Practice Guidance – Section 4 Decision Making • Residential Design Guide
  Supplementary Planning Document (2019) • Building For a Healthy Life Assessment https://www.udg.org.uk/publications/othermanuals/building-healthy-life
  Adopted Hartlepool Local Plan (2018) Policies: Policy SUS1: The Presumption in Favour of Sustainable
  Development Policy QP6: Technical Matters New Dwellings Outside of Development Limits SPD - Adopted
  Version 2015 https://www.hartlepool.gov.uk/downloads/file/424/new_dwellings_outside_of_development_limits_
  spd_-_adopted_version_2015 27. Statement of Community Involvement When is this required? A Statement
  of Community Involvement (SCI) would be required for some major development applications as advised
  at pre-application stage by the Local Planning Authority. Further advice can be found in the SCI document
  itself. Although not always required, the LPA encourages developers to undertake pre-application discussions
  and community involvement. The LPA urges developers to involve the community as early as possible in
  the process of the application and allow the community to help shape the proposal. What information
  is required? A SCI will explain how the applicant has complied with the requirements for pre-application
  consultation set out in the Local Planning Authority’s Statement of Community Involvement and seek to
  demonstrate that the views of the local community have been sought and taken into account in the formulation
  of development proposals. Policy Background Government policy or guidance: • National Planning Practice
  Guidance – Consultation and pre-decision matters section Adopted Hartlepool Local Plan (2018) Policies:
  Policy QP6: Technical Matters Area specific requirements and further information: Hartlepool Statement
  of Community Involvement (2019); https://www.hartlepool.gov.uk/downloads/file/4844/statement_of_community_involvement_-
  _adopted_september_2019 28. Structural Survey When is this required? All applications that involve:
  • The change of use or conversion of rural buildings (e.g. barn conversions), including those on safeguarded
  land; • The demolition, or proposals that may affect the structural integrity, of a building or structure
  in a Conservation Area; • Any listed or locally listed building or structure, where works are proposed
  that involve demolition or would affect the structural integrity of the building or structure. Please
  seek pre-application advice from the Local Planning Authority for further details on when this would
  be required. What information is required? A full structural engineers survey by a suitably qualified
  professional. This should include each of the following where appropriate: • General description and
  age of building; • Condition - structural integrity, foundations, damp proofing, walls, joinery, timbers,
  roof structure and roof covering; • Assessment of repairs necessary to ensure retention of the building;
  • Assessment of structural and other alterations necessary to implement the proposed conversion; • Assessment
  of percentage of building that needs to be rebuilt - including walls and timbers; • Opinion as to the
  suitability of building for proposed conversion; • Photographs are often helpful but not essential;
  • A schedule of works necessary to preserve the building; • A schedule of works necessary to carry out
  the applicant’s proposals (including those necessary to meet building regulation approval). Policy Background
  Government policy or guidance: • National Planning Policy Framework – Section 15. Conserving and enhancing
  the natural environment Adopted Hartlepool Local Plan (2018) Policies: Policy QP6: Technical Matter
  29. Sustainability Statement When is this required? All major planning applications. What information
  is required? A Sustainability Statement must be submitted with all major planning applications (and
  where appropriate other types of application as set out in section 26). The statement must outline how
  the proposed development will be designed and built to achieve high energy efficiency and how on site
  renewable energy provision will be incorporated. All developments, where feasible and viable, will be
  expected to 1) Ensure that the layout, building orientation, scale and form minimises energy consumption
  and makes the best use of solar gain, passive heating and cooling, natural light and natural ventilation.
  2) Ensure that green infrastructure is used appropriately to assist in ensuring energy efficiency. 3)
  Incorporate sustainable construction and drainage methods. The Sustainability Statement can be incorporated
  into the Design and Access statement, Planning Statement or any other supporting document as appropriate.
  Without such information it could be difficult to understand how development will contribute to reducing
  its impact on climate change and how a development would mitigate against any impacts. The statement
  should include an outline strategy to reduce Co2 emissions to include building design and materials,
  energy demand reduction, and renewable energy supply and generation Policy Background Government policy
  or guidance: • National Planning Policy Framework – Section 14. Meeting the challenge of climate change,
  flooding and coastal change • National Planning Practice Guidance – Climate change section Adopted Hartlepool
  Local Plan (2018) Policies: Policy CC1: Climate Change Policy QP6: Technical Matters Policy QP7: Energy
  Efficiency Policy SUS1: The Presumption in Favour of Sustainable Development 30. Telecommunications
  Development Statement When is this required? Planning applications for mast and antenna development
  by mobile phone network operators. What information is required? Telecommunications applications will
  need to be accompanied by: • Area of search; • Details of the proposed structure; • Technical justification;
  • Evidence of mast sharing; • Details of any consultation undertaken; • A signed declaration that the
  equipment and installation has been designed to comply with the requirements of the radio frequency
  (RF) public exposure guidance of the International Commission on Non-Ionizing Radiation Protection (ICNIRP).
  Policy Background Government policy or guidance: National Planning Policy Framework - Section 10. Supporting
  high quality infrastructure Adopted Hartlepool Local Plan (2018) Policies: Policy INF5: Telecommunications
  Area specific requirements and further information: Code of Best Practice on Mobile Network Development
  in England (Mobile Operators Association) (2016) http://www.mobileuk.org/cms-assets/documents/259876-147086.code-of-best-practice-2016-
  edition-pub 31. Town Centre Use Assessment (Sequential Test and Impact Assessment) When is this required
  and what information should be supplied? Paragraph 87 of NPPF states that local planning authorities
  should apply a sequential test to planning application for main town centre uses that are not in an
  existing centre and not in accordance with an up-to-date Local Plan. Paragraph 94 of NPPF states that
  when assessing applications for retail, leisure and office development outside of town centres, which
  are not in accordance with an up-to-date Local Plan, local planning authorities should require an impact
  assessment if the development is over a proportionate locally set threshold. Policy RC1 of the Hartlepool
  Local Plan (2018) states that: • Proposals for main town centre uses, not located within a designated
  centre • Proposals for main town centre uses, within a local centre, with a floor area of 300m² or above.
  • Proposals for main town centre uses, within an edge of centre or retail and leisure parks, with a
  floor area of below 250m2 Will be required to provide a robust sequential test • Proposals for retail,
  leisure and office development located in local centres, with a floor area of 300m² or above • Proposals
  for retail, leisure and office development with a floor area of 200m² or above, not located in the Town
  Centre or a local centre, Will be required to provide a robust impact assessment Main Town Centre uses
  are: • Retail development (including warehouse clubs and factory outlet centres); • Leisure, entertainment
  facilities, and the more intensive sport and recreation uses (including cinema, restaurants, drive through
  restaurants, bars and pubs, night clubs, casinos, health and fitness centres, indoor bowling centres
  and bingo halls); • Offices; • Arts, culture and tourism development (including theatres, museums, galleries
  and concert halls, hotel and conference facilities. The following tables set out the thresholds for
  when a sequential test and an impact assessment will be required in line with the Council’s adopted
  Local Plan Policies; Robust Sequential Test Required? Proposals for main town centre uses Yes*. Refer
  to Policy RC1 of the Local Plan not located within a designated (2018). centre Proposals for main town
  centre Yes**, if proposal has a floor area of 300m2 uses within a local centre or above. Refer to Policy
  RC1 of the Local Plan (2018). Proposals for main town centre Yes***, if proposal has a floor area of
  250m2 uses within an edge of centre or or below. Refer to Policy RC1 of the Local retail and leisure
  parks Plan (2018). *The test must consider all of the Borough’s designated centres and follow the sequential
  hierarchy. Where it is established that no suitable sites are available within the designated centres,
  an alternative acceptable location may be a location accessible by a choice of means of transport and/or
  which offers significant regeneration benefits. ** The test must consider all of the Borough’s designated
  centres and follow the sequential hierarchy. Where it is established that no suitable designated centres
  are available to accommodate the proposals, an alternative centre, accessible by a choice of transport
  and/or which offers significant regeneration benefits, may be acceptable. ***The test must consider
  all of the Borough’s designated centres and follow the sequential hierarchy. Where it is established
  that no suitable designated centres are available to accommodate the proposals, an alternative centre,
  accessible by a choice of transport and/or which offers significant regeneration benefits, may be acceptable.
  Robust Impact Assessment Required? Proposals for retail, leisure and office Yes*, if floor area exceeds
  300m2 or above. development local in local centres Refer to Policy RC1 of the Local Plan (2018). Proposals
  for retail, leisure and office Yes**, if floor area exceeds 200m2 or above. development not located
  in the Town Refer to Policy RC1 of the Local Plan Centre or a local centre (2018). * In some instances
  it may be necessary to assess the impact of the proposal on the Town Centre, other designated centres
  and village businesses and community facilities. Proposals which would undermine Town Centre vitality
  and viability will not be permitted. **In some instances it may be necessary to assess the impact of
  the proposal on the Town Centre and other designated centres. Proposals which would undermine Town Centre
  vitality and viability will not be permitted. The sequential approach should not be applied to applications
  for small scale rural offices or other small scale rural development. Policy Background Government policy
  or guidance: • National Planning Policy Framework – Section 7. Ensuring the vitality of town centres
  • National Planning Practice Guidance – Ensuring the vitality of town centres section – paragraphs 001,
  006, 008, 010, 011, 013 and 015 to 018 Adopted Hartlepool Local Plan (2018) Policies: Policy QP6: Technical
  Matters Policy RC1: Retail and Commercial centre Hierarchy Policy RC2: The Town Centre Policy RC3: Innovation
  and Skills Quarter Policy RC4: Avenue Road / Raby Road Edge of Town Centre Area Policy RC5: The Brewery
  and Stranton Edge of Town Centre Area Policy RC6: East of Stranton Edge of Town Centre Area Policy RC7:
  Lynn Street Edge of Town Centre Area Policy RC8: Mill House Edge of Town Centre Area Policy RC9: Park
  Road West Edge of Town Centre Area Policy RC10: West Victoria Road Edge of Town Centre Area Policy RC11:
  York Road South Edge of Town Centre Area Policy RC12: The Marina Retail and Leisure Park Policy RC13:
  West of Marina Way Retail and Leisure Park Policy RC14: Trincomalee Wharf Retail and Leisure Park Policy
  RC15: Tees Bay Retail and Leisure Park Policy RC16: The Local Centres Policy RC17: Late Night Uses Area
  Policy RC18: Hot Food Takeaway Policy Policy RC19: Main Town Centre Uses on Employment Land Policy RC20:
  Business Uses in the Home Policy RC21: Commercial Uses in Residential Areas 32. Transport Assessments
  & Statements, Travel Plans, Parking & Highways When is this required? For new development, changes of
  use of buildings or land and alterations to existing buildings, the transportation and accessibility
  outcomes of development needs to be set out as part of your planning application. This information is
  used to assess the suitability of the development and to ensure it is in accordance with policy and
  other related guidance. Where a new development is likely to have significant transportation implications,
  a Transport Assessment (TA) and Travel Plan (TP) should be prepared. In some instances a simplified
  report in the form of a Transport Statement (TS) may be sufficient, which can be incorporated into the
  Design & Access Statement where applicable. These documents are used to determine whether the impact
  of the development is acceptable. The scale and type of development will normally determine the requirement
  for a TS, TA or TP, and the relevant thresholds can be found on the link below to the Council’s Transport
  Assessments and Travel Plans Supplementary Planning Document. Please seek pre-application advice from
  the Local Planning Authority for definitive advice on the scope of these documents in order to avoid
  abortive work. What information is required? A Transport Statement should cover matters such as trip
  generation resulting from the development, improvements to site accessibility, car parking provision
  and internal vehicular circulation, traffic impacts of servicing requirements and the net level of change
  over any current development within the site. A Transport Assessment should quantify and assess the
  impact of the proposals on traffic movement and highway safety, quantify and assess how the development
  could be accessed by alternative transport modes and how such alternative modes would be promoted and
  provide details of any proposals for access or transport improvements. This may need to include Road
  Safety Audits (summary stage 1 and 2). A Travel Plan is a long term management strategy which aims to
  increase sustainable travel to a site through positive actions. It is set out in a document that is
  reviewed regularly. The starting point is a Transport Assessment which shows what the issues are. There
  are a number of types of travel plan: • Full Travel Plan; • Interim Travel Plan; • Framework Travel
  Plan; • Travel Plan Statement; • Area Wide Travel Plan (for a defined geographic area). Where applicable,
  the contents of these should include: • Site location plan (strategic and local context); • Site audit
  to include transport links, transport issues, barriers to non-car use and possible improvements to encourage
  sustainable modes; • Travel surveys – include example of distributed survey, means of distribution,
  number distributed, number of responses, results and analysis etc; • Clearly defined objectives, targets
  and indicators; • Details of committed measures, timetable for implementing, marketing proposals and
  budget; • Travel Plan Coordinator - definition of role, contact details etc. • Monitoring plan and mitigation
  proposals if targets not reached. Parking and servicing requirements Parking and servicing need to be
  considered as an important part of any scheme. Car parking provision needs to be at an appropriate level
  to cater for the development and visitors whilst taking into account the location, circumstances in
  the surrounding area, nature of the development, sustainability, impact on residential amenity and highway
  safety, and the availability of public transport. Servicing requirements need to be fully considered
  so they are not a danger or inconvenience. Information on parking and servicing can be combined within
  the Transport Assessment or Transport Statement where required or provided in a supporting document
  and/or annotated plans. Information that may be sought includes: • Setting out the rationale for the
  approach to parking provision (car, cycle, disabled and motorcycle provision); • Car parking accumulation
  information; • Car parking layout plan; • Cycle parking layout plan; • Servicing plan covering deliveries,
  refuse collection and taxi pick up and drop off (Auto tracks may be required in some instances); • Parking
  and servicing management plan; • Existing and proposed Traffic Regulation Orders Plan for a defined
  area; • Details of Car Club and Electric Charging Point Facilities. Applications for those changes of
  use to apartments and HMOs which claim they are for social housing requiring lower levels of parking
  provision, will need to be supported with suitable evidence. Policy Background Government policy or
  guidance: • National Planning Policy Framework – Section 9. Promoting sustainable transport National
  Planning Practice Guidance – Travel plans, transport assessments and statements in decision-taking section.
  Adopted Hartlepool Local Plan (2018) Policies: Policy INF2: Improving Connectivity in Hartlepool Policy
  QP3: Location, Accessibility, Highway Safety and Parking Policy QP4: Layout and Design of Development
  Policy QP5: Safety and Security Policy QP6: Technical Matters Area specific requirements and further
  information: Transport Assessments and Travel Plans Supplementary Planning Document; https://www.hartlepool.gov.uk/downloads/file/395/spd_travel_plan_jan_2010
  Tees Valley Design Guide and Specification for Residential and Industrial Estates; https://www.hartlepool.gov.uk/downloads/file/1128/highway-design-guide
  33. Tree Survey and/or Statement of Arboricultural Impact of Development Wherever there are trees are
  on or close to a development that may be affected arboricultural information is needed in support of
  the application to allow the council to consider the direct and indirect effects that the proposal may
  have on the trees as a material planning consideration in line with BS5837:2012 Trees in relation to
  design, demolition and construction – recommendations. A good topographical survey will inform if trees
  are present and/or close to the site. When is this required? 1. Trees on the development site 2. Trees
  on neighbouring land that overhang the property 3. Trees within 20 metres of the proposal with soft
  ground between (Grass, soil, paving stones, footpaths, etc.) 4. Trees within 10 metres of proposal with
  hard ground between (Concrete, houses, roads etc.) If trees are located as mentioned above then all
  trees should be plotted on the block plan: labelled with species, diameter at 1.5 metres from ground
  level and the root protection area of 12 times the diameter marked on. This will provide the relevant
  information for the council to decide if more arboricultural information is needed. What information
  may be required? • Tree Survey – in line with BS5837:2012 Trees in relation to design, demolition and
  construction – recommendations. Must include: Species, height, diameter at breast height, branch spread
  at the 4 cardinal points, age class, condition, remaining contribution and category rating. • Tree Retention/Removal
  Plan – identification of which trees are to be retained and which trees are to be removed as part of
  the proposal. • Arboricultural Impact Assessment – assessment of the effects of any tree losses required
  to implement design, potentially damaging activities in the vicinity of retained tree and any future
  above and below ground constraints. • Tree Protection Plan – a plan for the protection of any trees
  that are to be retained shown on a proposed layout that shows the type of protection, exclusion zones
  and any ground protection measures. This should be adequate enough to protect from the proposed works
  above and below ground. • Arboricultural Method Statement - Any operations, including access, proposed
  within the RPA (or crown spread where this is greater) should be described within an arboricultural
  method statement, in order to demonstrate that the operations can be undertaken with minimal risk of
  adverse impact on trees to be retained. • Tree Planting Plan – Tree planting plans should include species
  to be planted, size of stock, location, planting method and future maintenance covering a period of
  5 years post planting. Policy Background Government policy or guidance: National Planning Policy Framework
  – Section 12. Achieving well-designed places and Section 15 Conserving and enhancing the natural environment.
  Adopted Hartlepool Local Plan (2018) Policies: Policy QP6: Technical Matters Policy NE1: Natural Environment
  Policy NE7: Landscaping along main transport corridors British standards: • BS5837:2012 Trees in relation
  to design, demolition and construction – recommendations • BS3998:2010 Tree work – recommendations •
  BS3936 1992 Nursery Stock – Part 1: Specification for trees and shrubs • BS8545:2014 Trees: from nursery
  to independence in the landscape – recommendations Area specific requirements and further information:
  • Paragraph 4.2.4 of BS 5837: 2012 ‘Trees in relation to construction - Recommendations’ offers advice
  on how to identify trees on adjacent land that could influence the development; • Sections 4 to 6 of
  BS 5837: 2012 contain detailed guidance on survey information and plans that should be provided. Using
  the methodology set out in the Standard should help to ensure that development is suitably integrated
  with trees and that potential conflicts are avoided; • Sections 7 and 8 of BS 5837: 2012 contain detailed
  guidance on protecting trees that are to be retained both within and outside the proposed site that
  could be affected by the development. Area specific requirements and further information: • Trees and
  Development Guidelines Supplementary Planning Document; https://www.hartlepool.gov.uk/downloads/file/191/trees_and_development_guidelines_spd
  • Hartlepool Local Development Framework – Trees and development guidelines • Trees and Design Action
  Group – First steps in trees and new developments • Trees and Design Action Group – Trees, planning
  and development: A guide for delivery – Section 1 and 2 • Trees and Design Action Group – Trees in hard
  landscapes, a guide for delivery • Trees and Design Action Group – Tree species selection for green
  infrastructure: A guide for specifiers 34. Ventilation / Extraction Details When is this required? Planning
  applications where ventilation or extraction equipment is to be installed, including those for the sale
  or preparation of cooked food, launderettes, and significant retail, business, industrial or leisure
  developments. Where a hot food takeaway or restaurant or pub is proposed close to an existing residential
  property, details of extraction facilities will normally be required for validation purposes What information
  is required? Details of the position and design of ventilation and extraction equipment. This may include
  technical specification including an acoustic assessment of the extraction system, noise mitigation
  measures and odour abatement techniques where required. Elevation drawings showing the size, location
  and external appearance of plant and equipment will also be required, drawn to a scale of 1:50 or 1:100
  (in line with requirement 8). Policy Background Government policy or guidance: • National Planning Policy
  Framework – Section 15. Conserving and enhancing the natural environment • National Planning Practice
  Guidance – Noise section Adopted Hartlepool Local Plan (2018) Policies: Policy QP6: Technical Matters
  35. Waste Audit When is this required? • Applications for major development as defined in article 2
  of the Town and Country Planning (Development Management Procedure (England) Order 2015; • The provision
  of dwellinghouses where – (i) the number of dwellinghouses to be provided is 10 or more; or (ii) the
  development is to be carried out on a site having an area of 0.5 hectares or more • The provision of
  a building or buildings where the floor space to be created by the development is 1,000 square metres
  or more; • Development carried out on a site having an area of 1 hectare or more (excluding minerals,
  mining or waste development applications) • The winning and working of minerals or the use of land for
  mineral-working deposits • Waste development'
