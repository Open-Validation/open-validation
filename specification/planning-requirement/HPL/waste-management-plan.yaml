source-text: 'Applications for major development as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015; • The provision of dwellinghouses where - (i)
  the number of dwellinghouses to be provided is 10 or more; or (ii) the development is to be carried
  out on a site having an area of 0.5 hectares or more • The provision of a building or buildings where
  the floor space to be created by the development is 1,000 square metres or more; • Development carried
  out on a site having an area of 1 hectare or more (excluding minerals, mining or waste development applications)
  • In World Heritage Sites or a conservation area; i. the provision of one or more dwellinghouse ii.
  the provision of a building (or extension) where the proposed floor space is more than 100 square metres;
  • Applications for listed building consent • Applications for waste development, a material change of
  use, engineering or mining operations do not need to be accompanied by a Design and Access Statement.
  What information is required? A Design and Access Statement sets out the design principles and concepts
  that have been applied to the development and how issues relating to access to the development have
  been dealt with. For Planning Applications they must: • Explain the design principles and concepts that
  have been applied to the development; • Demonstrate the steps taken to appraise the context of the development
  and how the design of the development takes that context into account; • Explain the policy adopted
  as to access, and how policies relating to access in relevant local development documents have been
  taken into account; • State what, if any, consultation has been undertaken on issues relating to access
  to the development and what account has been taken of the outcome of any such consultation; and • Explain
  how any specific issues which might affect access to the development have been addressed. • Provide
  a description of any heritage asset affected, including any contribution made by their setting and the
  contribution made by the development to local character and distinctiveness For Listed Building Consent
  applications they must: • Explain how the design principles and concepts that have been applied to the
  works take account of: o The special architectural or historic importance of the building; o The particular
  physical features of the building that reflect and illustrate the significance of the building ; o The
  building’s setting. Where appropriate a Design and Access Statement may also include a Heritage Statement
  (see requirement 15). Alongside the submission of a Design and Access Statement and a Planning Statement
  (see section 26 below) the LPA expects developers to consider and incorporate reference to the Residential
  Design Guide (2019) with a greater focus on Building for A Healthy Life and Nationally Described Space
  Standards within their application submissions. Outline Planning Applications An outline planning application
  is a means of establishing the principle of a proposed development without having to supply all of the
  details. The grant of outline planning permission will then be conditional upon the subsequent approval
  of details of ‘reserved matters’ – as defined below. The Government has set down the minimum level of
  information that must be submitted with outline applications, as follows:- • Use – the use or uses proposed
  for the development and any distinct development zones within the application site. • Amount of development
  – the amount of development for each use. • Indicative access points – an area or areas in which access
  point or points to the site will be situated. An outline application may also contain details and seek
  approval of one or more of the reserved matters, but at least one must be reserved for later approval.
  It should be noted that for an outline application it is necessary to indicate access points on the
  submitted plans even if access will be a reserved matter. An applicant can choose to submit details
  of any of the reserved matters as part of an outline application. Unless the applicant has indicated
  that those details are submitted “for illustrative purposes only” (or has otherwise indicated that they
  are not formally part of the application), the LPA must treat them as part of the development in respect
  of which the application is being made; the LPA cannot reserve that matter by condition for subsequent
  approval. If the LPA considers that an outline application ought not to be considered separately from
  all or any of the reserved matters, the LPA must, within the period of 1 month beginning with the date
  of receipt of the application, notify the applicant that they are unable to determine it unless further
  details are submitted, specifying the further details they require. Reserved Matters Applications Reserved
  matters are defined by the Government as follows:- • Layout – the way in which buildings, routes and
  open spaces are provided within the development and their relationship to buildings and spaces outside
  the development. • Scale – the height, width and length of each building proposed in relation to its
  surroundings. • Appearance – the aspects of a building or place which determine the visual impression
  it makes. This includes the external built form of the development, its architecture, materials, decoration,
  lighting, colour and texture. • Access – the accessibility to and within the site for vehicles, cycles
  and pedestrians in terms of the positioning and treatment of access and circulation and how these fit
  into the surrounding network. • Landscaping – this is the treatment of private and public space to enhance
  or protect the amenities of the site through hard and soft measures. This may include, for example,
  planting of trees or hedges, screening by fences or walls, the formation of banks or terraces, or the
  layout of gardens, courts or squares. (N.B) For applications for approval of reserved matters pursuant
  to outline permissions where the outline application was submitted prior to 10 August 2006, the relevant
  reserved matters are siting, design, external appearance, means of access and the landscaping of the
  site.) Biodiversity Net Gain Regulations introduced on the 12th February 2024 and 2nd April 2024 include
  national (N) and local (L) validation requirements in respect to mandatory Biodiversity Net Gain (see
  associated HBC web page https://www.hartlepool.gov.uk/planning/biodiversity-net-gain These are outlined
  below in section 11. Fire Statement There is a requirement for a Fire Statement which applies to certain
  types of high rise buildings. Further information and details of such requirements can be viewed at
  section 12. LOCAL VALIDATION REQUIREMENTS 7. Plans – Site Plan/Block Plan (Existing and Proposed) All
  applications should include existing and proposed site or block plans at a standard metric scale (typically
  1:200 or 1;500) based on an up-to-date map. The application site should be edged clearly with a red
  line on the site plan/block plan and show the direction of north (as required by the DMPO [as amended],
  2015). A Site Plan/Block Plan should also include; • a linear scale bar • ‘Do not scale’ should be removed
  and replaced with other suitable wording allowing the LPA to scale from the drawing • Provided at the
  scale indicated on the plan i.e. if the plan states 1:200 @A3 the plan must be provided at A3 (electronically
  and/or hard copy). An existing site plan should accurately show: • The footprint of all existing buildings
  on site with written dimensions and distances to the site boundaries. The following information should
  also be shown, unless these would not influence or be affected by the proposed development; • All the
  buildings, roads and footpaths on land adjoining the site including access arrangements; • All public
  rights of way crossing or adjoining the site; • The position of all existing trees on the site, and
  those on adjacent land labelled with species, diameter at 1.5 metres from ground level and the root
  protection area of 12 times the diameter marked on (See Section 33). • The extent and type of any hard
  surfacing; • Boundary treatment including the type and height of walls or fencing. A proposed site plan
  should accurately show: • The footprint of the proposed development (where applicable) and all buildings
  to be retained with written dimensions and distances to the site boundaries. The following information
  should also be shown, unless these would not influence or be affected by the proposed development: •
  All the buildings, roads and footpaths on land adjoining the site including access arrangements; • All
  public rights of way crossing or adjoining the site; • ·The position of all trees to be retained labelled
  with species, diameter at 1.5 metres from ground level and the root protection area of 12 times the
  diameter marked on and any proposed tree planting (See Section 33). • The extent and type of any hard
  surfacing; • Boundary treatment including the type and height of walls or fencing. For residential development
  schemes of 10 or more dwellings, a Separation Distances Block/Site Plan shall be provided to demonstrate
  the scheme’s compliance with the required separation distances of Hartlepool Local Plan Policy QP4 and
  the Council’s Residential Design Guide SPD (2019). Such distances are applied between proposed dwellings
  themselves and between the proposed dwellings and existing neighbouring properties. 8. Application Plans/Drawings
  When is this required? • Elevation plan drawings should be submitted for all applications where external
  alterations are proposed; • Floor plan drawings, Site Sections and Site Levels should be submitted for
  applications where this would be expected to add to the understanding of the proposal; • Roof plan drawings
  should be submitted where there is an alteration to an existing roof or otherwise where this is expected
  to add to the understanding of the proposal. What information is required? (a) Existing and Proposed
  Elevations The drawings of the elevations should be at a scale of 1:50, 1:75 or 1:100 and all external
  sides of the proposal must be shown, along with the proposed building materials and the style, materials
  and finish of windows and doors where possible. Where a proposed elevation adjoins another building/structure
  or is in close proximity the drawing should clearly show the relationship between the two buildings/structures
  and detail the positions of any openings on each property. Proposed blank elevations must also be included,
  if only to show that this is in fact the case (or where appropriate, a ‘through-section’ drawing provided).
  (b) Existing and Proposed Floor Plans The submitted drawings should be at a scale of 1:50, 1:75 or 1:100
  and should explain the proposal in detail. Where existing buildings or walls are to be demolished, these
  should be clearly shown. The proposed development should be shown in context with the site boundary
  and any existing adjacent buildings including property numbers/names where appropriate. (c) Existing
  and Proposed Site Sections and Site Levels (where applicable) Section drawings should be drawn at a
  scale of 1:50, 1:75 or 1:100 showing how the proposed development relates to existing site levels and
  adjacent land (with levels related to a fixed datum point off site). (d) Roof Plan A roof plan is used
  to show the shape of the roof, its location, and specifying the roofing material to be used, and should
  be drawn to a scale of 1:50, 1:75 or 1:100. For applications for window and door replacements to a building
  classed as a heritage asset (for example listed buildings, locally listed buildings, buildings within
  a conservation area): Cross sections through the existing and proposed window or door (either looking
  through a side profile or a ‘top down’ section, or both) should be provided to show the context of how
  the existing window or door, and how the proposed replacement window, will sit within the existing opening
  or within an existing feature. This is required to show and understand any increase in depth, the opening
  mechanism and the retention or loss of any other existing details, for example how a replacement window
  would sit on the stone cill of a bay window or how it would sit within a reveal. Cross sections should
  be drawn to an appropriate, smaller scale, usually 1:1, 1:5, 1;10 or 1;20. Other supporting details
  will also assist where uPVC windows are proposed for example the manufacturers specification/brochure
  of the windows (where multiple options are shown, the chosen proposal should be identified). Photos
  of existing windows and opening mechanisms will also assist but will not override the requirement for
  the ‘sections’. For applications for advertisement consent only: The following should be submitted:
  • Where multiple adverts are proposed a site plan to a scale of either 1:100, 1:200 or 1;500 showing
  the direction of north, all buildings on site, and the position of the advert(s) with written dimensions
  and distances to the site boundaries as a minimum; • Plans of the advert(s) to a scale of 1:50, 1:75
  or 1:100 showing their size, position on buildings or land, height above ground level, extent of projection,
  sections, materials, colours and method of fixing; • Details of means of illumination where applicable,
  with section through advertisement and method of illumination. • Advertisement consent applications
  may also include existing and proposed photomontages to supplement scaled plans. Other Requirements
  for all Drawings; All drawings (floor plans, elevations, roof plans etc.) should also; • include a linear
  scale bar • ‘Do not scale’ should be removed and replaced with other suitable wording allowing the LPA
  to scale from the drawing • Provided at the scale indicated on the plan i.e. if the plan states 1:100
  @A1 the plan must be provided at A1 (electronically and/or hard copy). 9. Air Quality Assessment When
  is this required? The following criteria are provided to help establish when an air quality assessment
  is likely to be considered necessary, but they are by no means exhaustive: • Where a development would
  lead to a minimum 5% increase in traffic within an Air Quality Management Area (AQMA) or 10% elsewhere;
  • Where the Average Annual Daily Traffic (AADT) would exceed 10,000 vehicles (or 5,000 if narrow and
  congested); • Where a development would increase the number of Heavy Goods Vehicle journeys by more
  than 200 per day; • Where there would be an increase of 50 parking spaces within an AQMA or 100 spaces
  elsewhere; • Major development (greater than 10 dwellings/1,000 square metres floorspace) within or
  adjacent to an AQMA; • Development in excess of 100 dwellings or 10,000 square metres floorspace (or
  an equivalent combination); • Where a development would include Biomass boilers or a Combined Heat and
  Power Plant; • Proposals for industrial processes where there are direct emissions to the air. If further
  details or clarification are required on whether an air quality assessment is required please contact
  the Local Planning Authority or HBC Environmental Protection on 01429 284024 What information is required?
  The purpose of an air quality assessment is to demonstrate the likely changes in air quality or exposure
  to air pollutants, as a result of a proposed development. There are three basic steps in an assessment:
  • Assess the existing air quality in the study area (existing baseline); • Predict the future air quality
  without the development in place (future baseline); • Predict the future air quality with the development
  in place (with development). The report should also contain the following information: • Relevant details
  of the proposed development; • Description of the relevant air quality standards and objectives; • Details
  of the assessment methodology and input data including: traffic data; emissions data; meteorological
  data; baseline pollutant concentrations; other relevant parameters; • Results of the modelling assessment
  and an assessment of the significance of the result; • Summary of the assessment results, which should
  include: impacts of construction phase of development; impact that change in emissions will have on
  ambient air quality concentrations; any exceedance of air quality objectives or worsening of air quality;
  a verification of the model outputs; any impacts upon sensitive ecological habitats vulnerable to deposition
  from increased emissions • For developments with a potential impact on the strategic highway road network
  Highway England should be contacted Where a local authority has adopted an Air Quality Action Plan or
  Air Quality Strategy, the assessment should detail whether any of the actions contained within these
  will be directly compromised or rendered ineffective by the development. Policy Background Government
  Policy or Guidance • National Planning Policy Framework (NPPF) – Section 15. Conserving and enhancing
  the natural environment • National Planning Practice Guidance – Air Quality Section • Natural England’s
  Standing Advice for ‘Air pollution and development: advice for local authorities’ https://www.gov.uk/guidance/air-pollution-and-development-advice-for-local-authorities
  Adopted Hartlepool Local Plan (2018) Policies: EMP4: Specialist Industries CC1: Minimising and adapting
  to climate change QP6: Technical Matters Area specific requirements and further information: • Development
  Control: Planning for Air quality - 2010 update (Environmental Protection UK) https://www.gov.uk/government/publications/2010-to-2015-government-policy-environmental-
  quality/2010-to-2015-government-policy-environmental-quality 10. Agricultural Land Classification Report
  When is this required? Any development on land that is currently or last in use for agriculture. What
  information is required? A Statement setting out the agricultural land classification and whether the
  proposals would involve the loss of any Best and Most Versatile (BMV) agricultural land (Class 1, 2
  or 3a). A Survey may also be required where necessary (further advice is contained within the Natural
  England guidance (Guide to assessing development proposals on agricultural land) in the link below.
  Policy Background Government Policy or Guidance National Planning Policy Framework – Section 15 Conserving
  and enhancing the natural environment National Guidance – Natural Environment Reference ID8 https://www.gov.uk/guidance/natural-
  environment Natural England Guidance - Guide to assessing development proposals on agricultural land
  (including survey requirements) https://www.gov.uk/government/publications/agricultural-land-assess-proposals-for-
  development/guide-to-assessing-development-proposals-on-agricultural-land Natural England Guidance -
  Agricultural Land Classification https://publications.naturalengland.org.uk/publication/6257050620264448
  Agricultural Land Classification detailed Post 1988 ALC survey https://publications.naturalengland.org.uk/category/6249382855835648
  Natural England Guidance - Provisional Agricultural Land Classification (ALC) (England); https://naturalengland-defra.opendata.arcgis.com/datasets/Defra::provisional-agricultural-land-
  classification-alc-england/about Adopted Hartlepool Local Plan (2018) Policies: HLP Policy RUR1 - Development
  in the rural area HLP Policy NE1 – Natural environment 11. Archaeological Assessments When is this required?
  • Planning applications that may affect the significance of any heritage asset, including its setting.
  • This will include Scheduled Monuments, sites on the Hartlepool Historic Environment Record and development
  in the vicinity of such sites, and sites with the potential to include heritage assets with archaeological
  interest. • A basic copy of the HER is available for viewing on the Tees Archaeology website https://teesarchaeology.com/historical-environmental-record-her/
  • Early discussion should take place with Tees Archaeology to determine if an Archaeological Assessment
  is required What Information is required? There are two stages in assessing the archaeological impact
  of a development, Desk Based Assessment and if required either Archaeological Evaluation and/or Archaeological
  Building Assessment. 1. Archaeological Desk Based Assessment An Archaeological Desk Based Assessment
  should include details of any heritage assets affected by the development and an assessment of their
  significance, it should be produced by an experienced professional archaeologist. The level of detail
  should be proportionate to the assets’ importance and sufficient to understand the impact of the proposal
  on their significance. It should make recommendations for any further work. A search of the Tees Archaeology
  HER should be conducted to inform the Desk Based Assessment. Tees Archaeology should be contacted directly
  for complete and up to date records within the search area; the online HER is not to be used for the
  preparation of planning documents. Further information about the purpose and contents of a Desk Based
  Assessment can be found on the website of the Chartered Institute for Archaeologists:- http://www.archaeologists.net/codes/cifa
  Where there is insufficient information to properly assess the significance of the heritage asset or
  the impact of the proposal on it then an Archaeological Evaluation or Archaeological Building Assessment
  will be required. 2. Archaeological Evaluation An Archaeological Evaluation will be required where there
  is insufficient information to allow an Archaeological Desk Based Assessment to fully assess the significance
  of a heritage asset or the impact of the proposal on it, or where a site has the potential to include
  heritage assets with archaeological interest. Archaeological Evaluation can include fieldwalking, earthwork
  survey, geophysical survey and/or trial trenching. It must be carried out by experienced professional
  archaeologists. The intent of archaeological evaluation is to define the character, extent, quality
  and preservation of any archaeological remains and allow an assessment of their significance. • The
  requirement for some form of archaeological evaluation may be set out in the Desk Based Assessment or
  • May arise from discussion of the Desk Based Assessment with Tees Archaeology The nature and extent
  of any Archaeological Evaluation will be agreed with Tees Archaeology. 3. Archaeological Building Assessment
  An Archaeological Building Assessment will be required where a structure of heritage interest is identified
  in the Archaeological Desk Based Assessment but where there is insufficient information to fully assess
  the significance of a heritage asset or the impact of the proposal on it. This is a programme of work
  to establish the character, history, dating, form and archaeological development of a specified building,
  structure or complex and its setting. It must be undertaken by an experienced professional archaeologist
  or buildings historian. This does not apply to Listed Buildings or buildings in a Conservation Area.
  These would fall under the requirement for a Heritage Statement. • The requirement for some form of
  archaeological building assessment may be set out in the Desk Based Assessment or • May arise from discussion
  of the Desk Based Assessment with Tees Archaeology The type and extent of any Archaeological Building
  Assessment will be agreed with Tees Archaeology Applicants are advised to discuss proposals with a planning
  officer or Tees Archaeology if they are uncertain of any requirements. Policy Background Government
  policy or guidance: • National Planning Policy Framework – Section 16. Conserving and Enhancing the
  Historic Environment • National Planning Practice Guidance – Conserving and enhancing the historic environment
  section. • Historic England Good Practice in Planning Notes 1,2 and 3; https://historicengland.org.uk/advice/planning/planning-system/
  • Historic England Advice Note 17; https://historicengland.org.uk/images-books/publications/planning-archaeology-advice-note-17
  Adopted Hartlepool Local Plan (2018) Policies: HE2: Archaeology QP4: Layout and Design of Development
  QP6: Technical Matters Area specific requirements and further information: • Rosie Banens, Archaeologist
  (Planning), Tees Archaeology, Sir William Gray House, Clarence Road, Hartlepool, TS24 8BT Email rosie.banens@hartlepool.gov.uk
  | Tel 01429 523457 | https://teesarchaeology.com/historical-environmental-record-her/ 12. Ecological
  Survey Assessment (& Mitigation Report & Protected Species Survey Assessment & Mitigation Report) and
  Biodiversity Net Gain Requirements The planning authority has a duty to consider the conservation of
  biodiversity when determining a planning application. This includes having regard to the safeguard of
  designated sites and species protected under the Wildlife and Countryside Act 1981 (amended), the Conservation
  of Habitats and Species Regulations 2017 (amended) the Badger Act 1992 and Hedgerow Regulations 1997
  as well as to safeguard designated sites and habitats and species of Principal Importance under Section
  41 of the Natural Environment and Rural Communities Act (2006). When could either of these be required?
  Protected species are defined here as species which have protection under the Conservation of Habitats
  and Species Regulations and the Wildlife and Countryside Act, which in Hartlepool includes all species
  of typical bat, otter, great crested newt, water vole, barn owl and others. Applications that involve
  modification / demolition (including in part) of the following must provide a protected species survey,
  assessment and mitigation report unless an exception applies: • Permanent agricultural buildings; •
  Buildings with weather boarding, wooden cladding and/or hanging tiles within 200 metres of woodland
  or water; • Pre-1980 buildings within 200 metres of woodland or water and pre-1919 buildings within
  400 metres of woodland or water; buildings/structures of any age within or immediately adjacent to woodland
  and/or water; • Tunnels, mines, kilns, ice houses, adits, military fortifications, air raid shelters,
  cellars and similar underground ducts and structures; • Bridges, aqueducts and viaducts; • Buildings
  known to support roosting bats. Applications that include the following must provide a protected species
  survey, assessment and mitigation report unless an exception applies: • Floodlighting within 50 metres
  of woodland, water or hedgerows / lines of trees with an obvious connection to woodland or water; •
  Works to fell or lop veteran trees, trees with obvious cracks, holes and cavities, or trees with a diameter
  greater than a metre at chest height; • Major proposals within 500 metres of the perimeter of a pond,
  or 200 metres of rivers, streams, canals, lakes or other aquatic habitats such as wetlands; • Minor
  proposals within 100 metres of a pond or adjacent to rivers, streams, canals, lakes or other aquatic
  habitats such as wetlands; • Proposals for wind turbines. Applications affecting any of the following
  must provide an ecological survey assessment and mitigation report, unless an exception applies: • An
  Internationally or European protected sites or candidate sites: Special Protection Area (SPA)/Ramsar
  Site, Special Area of Conservation (SAC) – Habitats Regulations Assessment (HRA) required. • Site of
  Special Scientific Interest (SSSI); • Local Wildlife Sites (LWS); • Local Nature Reserve (LNR) • Wildlife
  Corridors; • Habitats and species of Principal Importance (‘Priority’) as defined in Section 41 of the
  Natural Environment and Rural Communities Act 2006 and the Priority habitats and species in the Tees
  Valley, (Biodiversity Action Plan (BAP)). Exceptions: A survey assessment & mitigation report may be
  waived if: • Following consultation at the pre-application stage, it is confirmed in writing by the
  Council that a survey/report is not required; • A reasoned risk assessment, undertaken by a suitably
  qualified ecologist, is submitted demonstrating that no protected species are present, or that none
  would be adversely affected by the proposal. Please seek pre-application advice from the Local Planning
  Authority for clarification on when a survey assessment and mitigation report or a HRA screening would
  be required. What information is required? Where a development has the potential to impact on protected
  sites, priority habitats or species, appropriate surveys and assessments will be required with the application.
  Reports should adhere to Chartered Institute of Ecology and Environmental Management (CIEEM) guidelines
  and the British Standard BS 42020:2013 Biodiversity: Code of Practice for planning and development.
  The survey assessment must identify and describe potential impacts from the proposal likely to harm
  designated sites, priority habitats, priority species and/or their habitats and other listed biodiversity
  features identified by the survey (these should include both direct and indirect effects both during
  construction and afterwards) where harm is likely. Survey assessment must also record any W&C Act Schedule
  9 invasive species and how the report show how they will be dealt with as part of the application. The
  report must include detail regarding alternative designs or locations, how adverse effects will be avoided,
  how unavoidable impacts will be mitigated or reduced and how the impacts that cannot be avoided or mitigated
  will be compensated. The assessment should indicate if there will be a net loss or a net gain for biodiversity.
  Appropriate, accompanying plans should show any wildlife habitats or features and the location of protected
  habitats and/or species to the development. Where protected or priority species are known or have a
  reasonable likelihood of occurring, a detailed survey and assessment must be carried out by a specialist
  (species which are not detectable due to the time of year and are not in the biological record database,
  but never the less could reasonably expected to occur, must be included). Species surveys cannot be
  conditioned as the findings could impact upon the design of the scheme. The use of eDNA sampling techniques
  for assessing great crested newt presence/ absence in ponds may be appropriate. If this technique is
  used, the full set of results should be appended to the report. The application may require an in-combination
  assessment of species, if the species is impacted by multiple applications, for example breeding farmland
  birds. Failure to provide information regarding priority species and habitats at the outset can significantly
  delay the processing of your planning application. Depending on the results of the initial survey, further
  surveys may be required. The results from these may require design and layout changes to accommodate
  impacts that have not been addressed in the original proposal. BNG Requirements Regulations introduced
  on the 12th February 2024 include national (N) and local (L) validation requirements for Biodiversity
  Net Gain (see associated HBC web page https://www.hartlepool.gov.uk/info/20222/planning/1238/biodiversity_net_gain.
  These are outlined below. The most up to date Statutory Biodiversity Metric tool for calculating biodiversity
  losses and gains should be used for all major applications in order to assess habitats to the nationally
  agreed standard. The Small Sites Metric (Statutory Biodiversity Metric) is a simplified version of the
  Statutory Biodiversity Metric. It has been specifically been designed for use on small development sites
  where the project chooses to do so. Such sites are defined (for the purposes of this Small Sites Metric)
  as small sites where certain criteria are met (primarily non ‘major’ residential and non-residential
  development). For further information, see the link at the bottom of this section. Where applicants
  consider that development would not be subject to the general Biodiversity Gain Plan Condition the regulations
  provide that the applicant must provide a statement as part of their application setting out why they
  believe this is the case. An applicant would be expected in this statement to set out what exemption(s)
  or transitional provision(s) apply to the development. In some cases, the exemption or transitional
  provision will be evident as they relate to the type of permission: the planning application form for
  household development already includes a pre- populated statement. In other cases, evidence may need
  to be provided. This evidence requirement would apply to the ‘self-build’ BNG exemption (under the Self-build
  and Custom Housebuilding Act 2015) where the following requirements apply at validation stage; 1. The
  description of the development in the application forms should refer to self-build where all the units
  will be self build and not just a percentage of them. 2. A supporting statement should be included with
  the application to show it meets the Regulations including demonstration that the BNG ‘condition’ does
  not apply. 3. A statement should be included that the initial owner has had primary input to the final
  design and layout and demonstrate how. 4. A planning obligation within a s106 legal agreement (or other
  appropriate legal agreement) would be required and would provide that the dwelling(s) is to be occupied
  as the principal residence of the individual commissioning it amongst other provisions. These would
  be individuals or associations of individuals. This could form part of a Draft Heads of Terms (see section
  25 below). (Where not already done so in due course, planning application forms will be issued which
  will include relevant biodiversity net gain questions which will allow space for this statement) (N).
  Where development would be subject to the general Biodiversity Gain Plan Condition, the application
  must be accompanied by minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015: • a statement as to whether the applicant believes that
  planning permission, if granted, would be subject to the biodiversity gain condition (N); • the pre-development
  biodiversity value of the onsite habitat on the date of application (or an earlier date) including the
  completed Statutory Biodiversity Metric Calculation Tool (the biodiversity metric) used showing the
  calculations, the publication date and version of the biodiversity metric used to calculate that value
  (N); • where the applicant wishes to use an earlier date, the proposed earlier date and the reasons
  for proposing that date (N); • a statement confirming whether the biodiversity value of the onsite habitat
  is lower on the date of application (or an earlier date) because of the carrying on of activities (‘degradation’)
  in which case the value is to be taken as immediately before the carrying on of the activities, and
  if degradation has taken place supporting evidence of this (N); • a description of any irreplaceable
  habitat (as set out in column 1 of the Schedule to the Biodiversity Gain Requirements (Irreplaceable
  Habitat) Regulations [2024]) on the land to which the application relates, that exists on the date of
  application, (or an earlier date) (N); and • a plan, drawn to an identified scale which must show the
  direction of North, showing onsite habitat existing on the date of application (or and earlier date),
  including any irreplaceable habitat (N). In addition, the following local validation requirements should
  be adhered to: • a draft Habitat Management and Monitoring Plan as part of the application which sets
  out the proposals for long term maintenance of habitats to be secured through planning condition or
  planning obligation (L); • where off-site biodiversity gains are proposed applicants are encouraged
  to provide the local planning authority with draft heads of terms clearly setting out the obligations
  that they are likely to be bound by in a section 106 agreement or conservation covenant, should permission
  be granted (L); • An Ecological Impact Assessment Report containing the following information (L); •
  Up to date information on national and local designated sites on and close to the application site.
  • A baseline assessment of habitats on site and links to nearby habitats off site (using the Statutory
  Biodiversity Metric for major applications); • A baseline assessment of Priority species present or
  likely to be present on the site and adjacent to the red line boundary; • Desktop local wildlife records
  searches covering an appropriate distance from the centre of the site • Assessment of likely adverse
  impacts and the agreed remedial measures following the mitigation hierarchy (avoid, mitigate, compensate).
  • Biodiversity enhancement measures. • All mitigation measures must be agreed by the applicant and the
  Report must be marked ‘Final’. Surveys and supporting information outlined above should be undertaken
  by competent persons with suitable qualifications and experience (with names and qualifications provided,
  and where relevant Licence details of the ecologist completing the surveys) and must be carried out
  at the correct time of year (with the date undertaken given), as well as in suitable weather conditions
  using recognised survey methodologies and guidelines; some surveys can only take place at certain times
  of the year. Further information on appropriate survey methods can be found in Guidance on Survey Methodology
  published by the Chartered Institute of Ecology and Environmental Management (CIEEM) (https://www.cieem.net/general-survey-advice)
  as well as British Standard BS 42020:2013 Biodiversity - Code of practice for planning and development.
  Discharging the Biodiversity Gain Plan Condition The regulations apply a pre-commencement condition
  to all in scope development this will require a Biodiversity Gain Plan to be submitted and approved
  by the Local Planning Authority prior to the commencement of development. It is treated as a discharge
  of condition application and attracts the same fee. A discharge of conditions application form should
  be used. The following content of a Biodiversity Gain Plan is required for standard development which
  is not to proceed in phases. Where planning permission is granted that has the effect of permitting
  development in phases, there are different requirements for the Biodiversity Gain Plan (please see Planning
  Practice Guidance link below). Under paragraph 14(2) of Schedule 7A a Biodiversity Gain Plan must include
  the following matters: • information about the steps taken or to be taken to minimise the adverse effect
  of the development on the biodiversity of the on-site habitat and any other habitat • the pre-development
  biodiversity value of the on-site habitat • the post-development biodiversity value of the on-site habitat
  • any registered off-site biodiversity gain allocated to the development and the biodiversity • value
  of that gain in relation to the development; and • any biodiversity credits purchased for the development
  In addition, under Articles 30C(2) and 30C(4) of The Town and Country Planning (Development Management
  Procedure) (England) Order 2015 the following specified matters are required, where development is not
  to proceed in phases: • name and address of the person completing the Plan, and (if different) the person
  submitting the Plan • the reference number of the planning permission to which the plan relates; • a
  description of the development to which the plan relates • the completed Statutory Biodiversity Metric
  Calculation Tool, stating the version of the biodiversity metric used and showing the calculation of
  the pre-development and post- development biodiversity value • a description of arrangements for maintenance
  and monitoring of habitat enhancement to which paragraph 9(3) of Schedule 7A to the 1990 Act applies
  (habitat enhancement which must be maintained for at least 30 years after the development is completed)
  • (in cases where there is no irreplaceable habitat on the development site) how the biodiversity gain
  hierarchy will be followed and where to the extent any actions in that hierarchy are not followed, the
  reason for that • the relevant date for the purposes of calculating the pre-development biodiversity
  value of onsite habitats • pre-development and post-development plans — • showing the location of onsite
  habitat; • drawn to an identified scale and showing the direction of North; and • in relation to any
  part of the development for which planning permission is granted where the onsite habitat of that part
  is irreplaceable habitat arrangements for compensation for any impact the development has on the biodiversity
  of the irreplaceable habitat There is a standard Biodiversity Gain Plan template available to complete
  which brings together many of these matters into one document. See link below; https://www.gov.uk/government/publications/biodiversity-gain-plan
  A Biodiversity Gain Plan must be submitted no earlier than the day after the relevant planning permission
  has been granted. Once approved it cannot be amended however a new Biodiversity Gain Plan can be submitted
  to the planning authority for approval. When submitting this it should be made clear that the intention
  is that the new plan will supersede any previously approved plan. Where an application is phased, additional
  requirements will apply which will be clarified in due course. In the meantime, draft guidance including
  national information and validation requirements can be viewed here; https://www.gov.uk/guidance/draft-biodiversity-net-gain-planning-practice-guidance
  Habitats Regulations Assessment (HRA) Where a development could impact upon an Internationally or European
  Protected Site or candidate site a HRA will be required. This includes housing developments which have
  an indirect impact on Sites through off-site recreational disturbance caused by house owners. The HRA
  is an overall assessment process, which involves four stages, including screening and Appropriate Assessment.
  The process seeks to identify and mitigate any potential ‘likely significant effects’ (LSE) which may
  impact upon the designated site, either alone or in-combination with other plans and projects. The Council
  runs a Coastal Mitigation Project to which financial contributions can be made to mitigate LSE. For
  further details please contact the Local Planning Authority at pre-application stage. Policy Background
  Government policy or guidance: • National Planning Policy Framework – Section 15: Conserving and enhancing
  the natural environment • National Planning Practice Guidance – Natural Environment section Adopted
  Hartlepool Local Plan (2018) Policies: Policy NE1: Natural Environment Policy NE2: Green Infrastructure
  Policy NE3: Green Wedges Policy NE4: Ecological Networks Policy NE5: Playing Fields Policy NE6: Protection
  of Incidental Open Space Policy NE7: Landscaping along main transport corridors QP6: Technical Matters
  Area specific requirements and further information: HBC BNG Guidance Page; https://www.hartlepool.gov.uk/info/20222/planning/1238/biodiversity_net_gain
  Government Guidance on BNG; https://www.gov.uk/guidance/biodiversity-net-gain The Statutory Biodiversity
  Metric user guide and calculation tool can be found from the following link; https://www.gov.uk/government/publications/statutory-biodiversity-metric-tools-and-guides
  The Small Sites Metric (Statutory Biodiversity Metric) user guide and calculation tool can be found
  from the following link; https://www.gov.uk/government/publications/statutory-biodiversity-metric-tools-and-guides
  Natural England website https://www.gov.uk/government/organisations/natural-england CIEEM Website: Guide
  to Ecological Surveys and Their Purpose https://cieem.net/resource/guide-to-ecological-surveys-and-their-purpose/
  13. Fire Statement – High Rise Residential Buildings When is this required? Fire statements support
  the consideration of information on fire safety matters, as they relate to land use planning. They are
  a national requirement for all planning applications that: • Contain two or more dwelling or educational
  accommodation; and • Meet the height condition of 18m or more in height, or 7 or more storeys. “Dwellings”
  includes flats, and “educational accommodation” means residential accommodation for the use of students
  boarding at a boarding school or in later stages of education (for definitions see article 9A(9) of
  the Town and Country Planning Development Management (England) Procedure Order 2015 as amended by article
  4 of the 2021 Order. What information is required? Fire statements must include information about (not
  exhaustive list): • The principles, concepts and approach relating to fire safety that have been applied
  to each building in the development; • The site layout; • Emergency vehicle access and water supplies
  for firefighting purposes; • What, if any, consultation has been undertaken on issues relating to the
  fire safety of the development; and what account has been taken of this; and • How any policies relating
  to fire safety in relevant local development documents have been taken into account. Fire statements
  will be required to include information on the entire development as set out on the plan which identifies
  the land to which the application relates. The Secretary of State has provided a form which can be used
  as a fire statement, although a form of similar effect may be accepted; https://www.gov.uk/government/publications/planning-
  application-forms-templates-for-local-planning-authorities Policy Background Government Policy and Guidance:
  • National Planning Policy Framework - Section 8. Promoting healthy and safe communities • National
  Planning Practice Guidance – Fire safety and high-rise residential buildings Adopted Hartlepool Local
  Plan (2018) Policies: Policy QP5: Safety and Security Policy QP6: Technical Matters 14. Flood Risk and
  Drainage Assessments Flood Risk Assessment When is this required? All planning applications for: • Development
  within a local authority’s own identified critical drainage area, Flood Zones 2 & 3 or areas affected
  by ‘flood risk from surface water’ or ‘flood risk from reservoirs’; https://flood-map-for-planning.service.gov.uk/
  • Development on sites of 1ha or greater; • Development or changes of use to a more vulnerable class
  that may be subject to other sources of flooding (see relevant section of National Planning Practice
  Guidance on Flood Risk and Coastal Change - https://www.gov.uk/guidance/flood-risk-and-coastal-change/
  What information is required? For both residential extensions and non-residential extensions of less
  than 250 square metres in a local authority identified critical drainage area and Flood Risk Zones 2
  and 3, a simple flood risk assessment is required. Further advice, including updated advice from the
  Environment Agency in August 2025, can be obtained using the links below: The EA guidance directs users
  to the Planning Portal which includes guidance on ‘What to include in your flood risk assessment’ -
  https://www.planningportal.co.uk/permission/commercial-developments/understanding-and- assessing-flood-risk/your-flood-risk-assessment
  This in turn advises that an FRA should contain the information set out in the site-specific flood risk
  assessment checklist; https://www.gov.uk/guidance/flood-risk-and-coastal-change#Site-Specific-Flood-Risk-Assessment-
  checklist-section + https://www.gov.uk/guidance/flood-risk-assessment-for-planning-applications National
  flood risk standing advice for local planning authorities; https://www.gov.uk/guidance/flood-risk-assessment-local-planning-authorities
  + Standing Advice for Minor Extensions; https://www.gov.uk/guidance/flood-risk-assessment-standing-advice#advice-for-minor-extensions
  Environment Agency Flood Risk Assessment Template + Guidance (2025); https://ecab.planningportal.co.uk/uploads/ea/Environment-Agency_Flood-Risk-Assessment-
  Template_Guidance.pdf + https://view.officeapps.live.com/op/view.aspx?src=https%3A%2F%2Fecab.planningportal.co.uk%2
  Fuploads%2Fea%2FEnvironment-Agency_Flood-Risk-Assessment- Template.docx&wdOrigin=BROWSELINK Otherwise,
  a Flood Risk Assessment should identify and assess the risks of all forms of flooding to and from the
  development and demonstrate how these flood risks will be managed, taking climate change into account.
  A Flood Risk Assessment should include the following information: Zone 1 • Existing flood risk to the
  site from localised sources & impact of development upon run off rates; • Design measures proposed to
  mitigate run off rates (SUDS). Zone 2 • Existing flood risk to the site from all sources & potential
  impact of development upon flood risk only (High level assessment only); • Design measures proposed
  to mitigate risk of flooding, and their impact (details should include floor levels, ground levels,
  evacuation routes, SUDS. Zone 3 • Existing flood risk to the site from all sources (e.g. flood depth,
  flow routes, flood velocity, defence failure); • Potential impact of development upon flood risk; •
  Design measures proposed to mitigate risk of flooding, and their impact (details should include floor
  levels, ground levels, evacuation routes, SUDS). Applications for new development in Flood Zones 2 and
  3 should contain a sequential testing statement (except for householder extensions, non-residential
  extensions of less than 250sq. metres or renewable energy proposals) which should demonstrate to the
  local authority that there are no reasonably available alternative sites where the proposed development
  could be sited within an area of lower flood risk. It is recommended that applicants consider and apply
  the sequential approach prior to the submission of a full application to avoid unnecessary costs due
  to planning permission being refused. The applicant needs to submit the following evidence to allow
  the local authority to consider the sequential test: • A written statement explaining the area of search;
  • A map identifying all other sites considered within lower areas of flood risk; • A written statement
  explaining why the alternative sites listed within lower areas of flood risk are not reasonably available.
  However, if the sequential test is passed there are still some vulnerable types of development that
  should not normally be allowed in Flood Zones 2 and 3 unless there are exceptional circumstances. These
  circumstances are established by using the Exception Test. More information on this can be found in
  the guidance links at the bottom of this section. For the exception test to be passed it has to satisfy
  each of the following three tests: • It must be demonstrated that the proposed development provides
  significant wider sustainability benefits to the community that outweighs flood risk; • The development
  must be on previously developed land; • A Flood Risk Assessment submitted with the application must
  demonstrate that the development will be safe without increasing flood risk elsewhere and where possible
  reduce flood risk overall. Policy Background Government policy or guidance: • National Planning Policy
  Framework – Section 14. Meeting the challenge of climate change, flooding and coastal change • National
  Planning Practice Guidance – Flood Risk and Coastal Change section • Environment Agency Standing Advice
  Development and Flood Risk https://www.gov.uk/guidance/flood-risk-and-coastal-change#Site-Specific-Flood-Risk-Assessment-
  checklist-section + https://www.gov.uk/guidance/flood-risk-assessment-for-planning-applications Adopted
  Hartlepool Local Plan (2018) Policies: CC1: Minimising and adapting to climate change CC2: Reducing
  and mitigating flood risk QP6: Technical Matters Area Specific requirements and further information:
  • Scott Parkes, HBC Consultancy Manager Email scott.parkes@hartlepool.gov.uk Surface Water Drainage
  Assessment When is this required? All major development as set out in the Town and Country Planning
  (Development Management Procedure) (England) Order 2015. A basic surface water drainage strategy may
  be required for certain non-major applications with further advice set out below. What information is
  required? To ensure the Local Planning Authority (LPA) can determine an application in a timely manner,
  and for the Lead Local Flood Authority (LLFA) to be able to fulfil its role as a statutory consultee,
  it is necessary for sufficient surface water drainage information to be submitted in support of an application.
  In addition to any requirement for a Flood Risk Assessment (FRA), the following information with regard
  to surface water drainage must be submitted as part of a major planning application. All design development
  should be in accordance with the following documents: Non Statutory technical standards for sustainable
  drainage systems March 2015 Link: https://www.gov.uk/government/publications/sustainable-drainage-systems-non-statutory-
  technical-standards LASOO Non Statutory technical standards for sustainable drainage systems Practice
  Guidance Link: http://www.lasoo.org.uk/non-statutory-technical-standards-for-sustainable-drainage Information
  needs to be submitted to evidence all surface water shall be managed for the development. The drainage
  hierarchy is: 1. Infiltration 2. Watercourse 3. Surface water sewer 4. Combined sewer It requires infiltration
  systems to be investigated before controlled attenuation discharge to watercourse is considered. Only
  then if these forms of flood attenuation are not possible should developments consider surface water
  and eventually combined sewer means of surface water drainage. For greenfield developments, the peak
  runoff rate from the development to any highway drain, sewer or surface water body for the 1 in 1 year
  rainfall event and the 1 in 100 year rainfall event should never exceed the peak greenfield runoff rate
  for the same event. For developments which were previously developed, the peak runoff rate from the
  development to any drain, sewer or surface water body for the 1 in 1 year rainfall event and the 1 in
  100 year rainfall event must be as close as reasonably practicable to the greenfield runoff rate from
  the development for the same rainfall event, but should never exceed the rate of discharge from the
  development prior to redevelopment for that event. 1. Infiltration If the development discharges to
  an existing soakaway, evidence that it has sufficient capacity to cater for any additional flow must
  be submitted. Evidence which verifies the condition of the soakaway may also be requested. Where new
  infiltration assets are proposed, percolation tests should be undertaken in accordance with the testing
  method set down in BRE 365. The results of such tests should be included in the Drainage Assessment.
  Infiltrations systems must be designed with sufficient capacity to accommodate a critical rainfall event
  of 1:100 year + 40% allowance for climate change. Supporting calculations should be included in the
  Drainage Assessment and form part of the planning application. 2. Discharge to watercourse The existing
  greenfield run off rate for the site should be calculated. Attenuation systems should be designed to
  accommodate a critical rainfall event of 1:100 year + 40% allowance for climate change. Written consent,
  in principal, must be obtained from either the EA or LLFA if the point of discharge is to an ordinary
  watercourse or main river. Supporting calculations should be included in the Drainage Assessment 3.
  Discharge to sewer It should be noted that in most circumstances surface water is not permitted to be
  connected to the public combined or foul sewers. Only where there is no other feasible option will this
  be considered and where it can be proved that all other options have been explored. Evidence will need
  to be submitted which confirms the outcome of the other investigations undertaken and reasons why discharge
  to the sewer is the only feasible option. Written evidence from Northumbrian Water Ltd. or the owner
  of the sewer will also be required that confirms that the proposed development can be connected to the
  water sewer network. Confirmation of the agreed discharge rate must be supplied. For all approaches
  to drainage the following will be required: • Drainage design statement – This should outline how the
  development will comply with the DEFRA non statutory technical standards, Planning Practice Guidance
  (ID: 7-051- 20150323- ID: 7-086-20150323. and The SuDS Manual (C753). • Detailed design drawings - layout
  of drainage network, details of drainage features including SUDS components (if applicable), inlets
  and outlets and flow controls. • Detailed infiltration assessment of SUDS infiltration components (if
  applicable). • Construction details and planning including phasing of development and Construction Management
  Plan (refer to CIRIA guidance – Construction Method Statements RP992/22 or update) and The SuDS Manual
  (C753). • SUDS Management Plan should set out ownership and management of SUDS components and maintenance
  requirements over the lifetime of the development. This should include the maintenance plan setting
  minimum standards of maintenance over the lifetime, integrating with other green infrastructure and
  long term funding plan (including annual charges and replacement of SUDS) (refer to CIRIA guidance on
  maintenance plan RP992/21 or update) and The SuDS Manual (C753). • Details of the proposed management
  and maintenance of the drainage system. Minor Applications - Surface Water Drainage Strategy A basic
  surface water drainage strategy (or drainage statement) for a non-major application should demonstrate
  how a development will manage surface water runoff to prevent increased flood risk, typically using
  Sustainable Drainage Systems (SuDS). The strategy must show that post- development runoff will not exceed
  pre-development (greenfield) rates, or be at a rate that adversely affects flood risk if not possible.
  It should outline SuDS techniques, infiltration trenches, or attenuation tanks, and include site plans
  showing how runoff is managed from roofs, roads, and car parks. The requirement for this will be based
  on individual site characteristics and the nature of the development proposed. Policy Background Government
  policy or guidance: • National Planning Policy Framework – Section 14. Meeting the challenge of climate
  change, flooding and coastal change • National Planning Practice Guidance – Flood Risk and Coastal Change
  section • SUDS technical standards https://www.gov.uk/government/publications/sustainable-drainage-systems-non-statutory-
  technical-standards Adopted Hartlepool Local Plan (2018) Policies: CC1: Minimising and adapting to climate
  change CC2: Reducing and mitigating flood risk QP6: Technical Matters Area specific requirements and
  further information: Scott Parkes, HBC Consultancy Manager Email scott.parkes@hartlepool.gov.uk Tees
  Valley Authorities Local Standards for Suitable Drainage; https://www.hartlepool.gov.uk/info/20226/flooding/615/tees_valley_authorities_local_standards_for
  _suitable_drainage Please note that beyond the basic advice provided at the One Stop Shop service, for
  detailed advice on section 14 (above and below), the above team offers a chargeable service for further
  detailed engineering pre-application advice. For more information please contact the Hartlepool Borough
  Council consultancy? department. Foul Water Drainage Assessment When is this required? All major development
  as set out in the Town and Country Planning (Development Management Procedure) (England) Order 2015.
  What information is required? Confirmation that capacity exists both on and off site in the sewerage
  network to serve the proposed development. Where capacity does not exist the assessment should include
  information on what infrastructure needs to be upgraded and how this upgrade will be delivered. If an
  application proposes to connect a development to the existing drainage system then details of the existing
  system should be shown on the application drawing(s). Where the development involves the disposal of
  trade waste or the disposal of foul sewage effluent other than to the public sewer, then a fuller foul
  drainage assessment will be required including details of the method of storage, treatment and disposal.
  A foul drainage assessment should include a full assessment of the site, its location and suitability
  for storing, transporting and treating sewage. Where connection to the mains sewer is not practical,
  then the foul/non-mains drainage assessment (FDA1 Form) will be required to demonstrate why the development
  cannot connect to the public mains sewer system and show that the alternative means of disposal are
  satisfactory including percolation tests. If the proposed development results in any changes/replacement
  to the existing system or the creation of a new system, scale plans of the new foul drainage arrangements
  will also need to be provided. This will include a location plan, cross sections/elevations and specification.
  Policy background Government policy or guidance: National Planning Policy Framework – Section 14. Meeting
  the challenge of climate change, flooding and coastal change National Planning Practice Guidance – Flood
  Risk and Coastal Change section Foul drainage assessment form (FDA1); https://www.gov.uk/government/publications/foul-drainage-assessment-form-fda1
  Adopted Hartlepool Local Plan (2018) Policies: CC1: Minimising and adapting to climate change CC2: Reducing
  and mitigating flood risk QP6: Technical Matters Area Specific requirements and further information:
  Northumbrian Water Limited Water Developer Services on telephone number 0345 733 5566 or visit www.nwl.co.uk/buisness/dev-water-mains-and
  services 15. Health Impact Assessment When is this required? The Health Impact Assessment (HIA) checklist
  is required for a planning application for major development of 50 or more dwellings. The HIA checklist
  aims to assist applicants/developers in embedding health as early as possible in the design process
  since this is often simpler than modifying designs in response to consultation. The checklist is not
  an exhaustive list but includes frequent or important planning application consultation comments regarding
  health. Other policies relevant to health are still applicable. For Outline Applications, locations
  of facilities and layout may not have been determined. However, there should be an indication on the
  checklist that the health issues have been considered (e.g. sufficient green space and facilities are
  allocated) to ensure that subsequent Reserved Matters Applications can positively answer the checklist
  questions. What information is required? Completion of the HIA “Checklist” with: • A response of Yes,
  No, N/A or uncertain to each question • Where an answer is not “Yes”, a comment on: o Why the question
  is not applicable to this development (e.g. no flats included) o Why an answer is “uncertain” (note
  Public Health are happy to clarify information) o Why an answer is “No” and any mitigations or alternatives
  Applicants/Developers may also wish to comment on anything they feel is relevant or where some aspects
  are included in the development but not others. Link to HIA ‘checklist’ https://www.hartlepool.gov.uk/downloads/download/541/health-impact-assessment-hia-
  developers-checklist Policy Background Government Policy or Guidance • National Planning Policy Framework
  (NPPF) • National Planning Practice Guidance Adopted Hartlepool Local Plan (2018) Policies: SUS1: The
  Presumption in Favour of Sustainable Development LS1: Locational Strategy INF2: Improving Connectivity
  in Hartlepool QP3: Location, Accessibility, Highway Safety and Parking QP4: Layout and Design of Development
  Policy NE1: Natural Environment Policy NE2: Green Infrastructure Policy NE3: Green Wedges Policy NE4:
  Ecological Networks Policy NE5: Playing Fields Policy NE6: Protection of Incidental Open Space Public
  Health and Wellbeing page; https://www.hartlepool.gov.uk/health-wellbeing 16. Heritage Statement When
  is this required? A Heritage Statement is required for: • Listed Building Consent applications; • Planning
  applications for developments within or otherwise affecting conservation areas; including demolition,
  and where the proposal would materially affects its appearance; • Planning applications that may affect
  the significance of any heritage asset, including its setting for example Locally Listed Buildings.
  • This will also include Scheduled Monuments, sites on the Hartlepool Historic Environment Record (HER)
  and development in the vicinity of such sites, and sites with the potential to include heritage assets.
  What information is required? A Heritage Statement could form part of a more comprehensive Design and
  Access Statement (see also requirement 14), where this is also needed. A Heritage Statement will describe
  the significance of any heritage assets affected, including any contribution made by their setting.
  The level of detail should be proportionate to the assets’ importance and no more than is sufficient
  to understand the potential impact of the proposal on their significance. As a minimum the relevant
  historic environment record (HER) should have been consulted and the heritage assets assessed using
  appropriate expertise, where necessary. For details of Hartlepool’s Conservation Areas, the associated
  character appraisals and management plans can be viewed here; https://www.hartlepool.gov.uk/info/20065/conservation/97/conservation_areas/1
  A list of Hartlepool’s Locally Listed Buildings can be viewed here; https://www.hartlepool.gov.uk/info/20065/conservation/1174/locally_listed_buildings
  The National Heritage List for England (NHLE) is the only official, up to date, register of all nationally
  protected historic buildings and sites in England - listed buildings, scheduled monuments, protected
  wrecks, registered parks and gardens, and battlefields. Details can be viewed on Historic England’s
  NHLE webpage; https://historicengland.org.uk/advice/hpg/heritage-assets/nhle/ + https://historicengland.org.uk/listing/the-list/
  Although a basic version of the HER can be viewed on the following link - https://teesarchaeology.com/historical-environmental-record-her/
  – the online HER is not to be used for the preparation of planning documents, and Tees Archaeology should
  be contacted directly for complete and up to date records within the search area. Works to a Listed
  Building Applications for Listed Building Consent may need to, as appropriate, include some or all of
  the following elements within the Heritage Statement: • A schedule of works to the listed building,
  and an analysis of the impact of these works on the significance of the archaeology, history, architecture
  and character of the building/structure along with a statement explaining the justification for the
  proposed works and principles which inform the methodology proposed for their implementation; • Contextual
  and detailed photographs of the buildings/structure as existing to illustrate any features which are
  proposed to be altered or removed; • Where reinstatement of lost or damaged features is proposed historic
  evidence to support the detail of reinstatement should be provided where possible i.e. historic plans
  or photographs; • For any alterations, replacement, or installation of features such as windows, doors
  and shopfronts, elevation plans and sectional drawings to a scale of 1:20 or less. Further details of
  features such as architrave, cills, horns, glazing bars, lintels, transom, mullions, panelling, mouldings,
  meeting rails etc. may need to be at a scale of 1:5 or less; • A detailed specification for all proposed
  materials including, where appropriate samples; • Photomontages illustrating the proposed works in context.
  Planning Applications for development within conservation areas or works to a locally listed building
  or structure For developments including or solely for demolition, the statement should assess the contribution
  that the building in question makes to the character and appearance of the conservation area and provide
  justification for demolition. For planning applications within conservation areas or impacting on a
  locally listed building, the statement should address how the proposal has been designed to have regard
  to the character and/or appearance of the conservation area or locally listed building and to explain
  how the proposal enhances or preserves the character or appearance of the conservation area or locally
  listed building. Appropriate photographs should accompany the appraisal. Applications affecting the
  setting of heritage assets For applications impacting on the setting of heritage assets a written statement
  that includes plans showing historic features that may exist on or adjacent to the application site
  including listed buildings and structures, locally listed buildings and structures, historic parks and
  gardens, historic battlefields and scheduled ancient monuments. An analysis of the significance of archaeology,
  history and character of the building/structure, the principles of and justification for the proposed
  works and their impact on the special character of the heritage asset, its setting and the setting of
  adjacent heritage assets may be required. The scope and degree of detail necessary in the appraisal
  will vary according to the particular circumstances of each application. Applicants are advised to discuss
  proposals with a planning officer and/or a conservation officer before any application is made. Policy
  Background Government policy or guidance: • National Planning Policy Framework – Section 16. Conserving
  and Enhancing the Historic Environment • National Planning Practice Guidance – Conserving and enhancing
  the historic environment section • Historic England Advice Note 12 on Statements of Heritage Significance-
  https://historicengland.org.uk/images-books/publications/statements-heritage-significance-advice- note-12/
  • Historic England Advice Notes 1 – 10 https://historicengland.org.uk/advice/planning/planning-system/
  Adopted Hartlepool Local Plan (2018) Policies: Policy QP4: Layout and Design of Development Policy QP6:
  Technical Matters Policy HE1: Heritage Assets Policy HE2: Archaeology Policy HE3: Conservation Areas
  Policy HE4: Listed Buildings and Structures Policy HE5: Locally Listed Buildings and Structures Policy
  HE6: Historic Shopping Parades Policy HE7: Heritage at Risk 17. Land Contamination Assessment When is
  this required? Subject to prior pre-application discussions, all new development with a sensitive end
  use (including dwellings, allotments, schools, nurseries, playgrounds, hospitals and care homes) require
  a minimum of a Phase 1 Land Contamination Assessment (often referred to as a Preliminary Risk Assessment)
  to be submitted. Also subject to pre-application discussions, new development on land that has been
  identified on the public register as being contaminated or land that is adjacent to, a Phase 1 Assessment
  will be required as a minimum. What information is required? The Phase 1 Land Contamination Assessment
  should include a desktop study, site walkover and a conceptual site model. The purpose of a Phase 1
  Land Contamination Assessment is to establish the previous uses of the land under consideration or land
  adjacent to, and to initially identify potential sources of contamination, receptors and pathway that
  could be risks to human health, surface or ground waters, buildings or protected species (the receptors).
  As part of the desktop study and site walkover it is important to identify all past uses of the site,
  and adjacent or nearby sites, since pollutants have the potential to travel away from the source, depending
  on the geology, groundwater and surface water of the area. The desktop study and the site walkover should
  be the first stages of any site assessment and should enable a ''conceptual site model'' of the site
  to be produced that provides a clear interpretation of all plausible pollutant linkages at the site.
  Off-site sources and receptors should also be considered. The Phase 1 Land Contamination Assessment
  compiled following the completion of the conceptual model will determine whether a Phase 2 Intrusive
  Site Investigation is required. Where significant contamination is known or is likely to be present,
  it may be necessary to carry out some site investigations before the submission of an application, as
  significant contamination may limit the allowable land uses. Some sites which are potentially contaminated
  may also be of archeological interest and therefore co-ordination is desirable to prevent site investigation
  in relation to the former adversely affecting the latter. Please seek pre-application advice from the
  Local Authority (HBC Engineering Consultancy) to address potential pollution matters early in the planning
  process. For further details on contamination and site investigation reports please contact; Scott Parkes,
  HBC Consultancy Manager Email scott.parkes@hartlepool.gov.uk Policy Background Government policy or
  guidance: • National Planning Policy Framework – Section 15. Conserving and enhancing the natural environment
  • National Planning Practice Guidance – Land affected by contamination section Adopted Hartlepool Local
  Plan (2018) Policies: Policy QP6: Technical Matters Policy NE1: Natural Environment Area specific requirements
  and further information: If you require any information or advice about contaminated land please ring
  01429 523207. https://www.hartlepool.gov.uk/info/20213/contaminated_land/94/contaminated_land The Council
  maintains a register of contaminated land and regularly inspects and determines land that may be contaminated
  and takes necessary remediation action. Occupiers or their representatives can request information from
  Hartlepool Borough Council about the historic and current condition of the land, however there may be
  a charge for this service. • Environment Agency website: https://www.gov.uk/government/collections/land-contamination-technical-guidance
  18. Landscaping Details When is this required? Planning applications (except those for the change of
  use or alteration to an existing building), where landscaping would be a significant consideration in
  the assessment of the application. What information is required? The submitted scheme shall, as applicable,
  include: existing trees, shrubs and other landscape features (indicating which are to be retained and
  which removed); planting plans, specifications and schedules; existing and proposed levels and contours;
  means of enclosure, walls, retaining walls and boundary treatment; paving and other surface treatment
  including car parking and circulation layouts; items of landscape furniture, equipment, storage, signage,
  and lighting; services and drainage; location of site cabins and compounds. The location of any watercourse
  and associated landscaping as existing and proposed should also be shown. These details should be cross-referenced
  with the Design and Access statement where submitted. Existing trees and other vegetation of amenity
  value should, wherever possible, be retained in new developments and will need to be protected during
  the construction of the development. Landscape schemes should aim to prioritise native species of local
  provenance in their design where they lie in rural areas. Policy Background Government policy or guidance:
  • National Planning Policy Framework – Section 12. Achieving well-designed and beautiful places. Adopted
  Hartlepool Local Plan (2018) Policies: Policy NE1: Natural Environment Policy NE2: Green Infrastructure
  Policy NE3: Green Wedges Policy NE4: Ecological Networks Policy NE5: Playing Fields Policy NE6: Protection
  of Incidental Open Space Policy NE7: Landscaping along main transport corridors Policy QP4: Layout and
  Design of Development Policy QP5: Safety and Security Policy QP6: Technical Matters Area specific requirements
  and further information: Trees and Development Guidelines Supplementary Planning Document; https://www.hartlepool.gov.uk/downloads/file/191/trees_and_development_guidelines_spd
  19. Lighting Impact Assessment When is this required? A lighting impact assessment, prepared by a suitably
  qualified person, should support applications that raise issues of disturbance, or are considered to
  be light sensitive developments. A light survey and any associated mitigation details may be required
  for the following types of application: • New or replacement Flood Lights or security lighting • Significant
  external lighting installations particularly in sensitive locations like the open countryside, near
  residential dwellings, or heritage assets. • New industrial development close to existing residential
  development. • Development near designated wildlife sites where permanent lighting is proposed • Lighting
  proposals adjacent to the strategic road network and main roads What information is required? A lighting
  impact assessment prepared by a suitably qualified person should support applications that raise issues
  of disturbance or are considered to be light sensitive developments. Light insulation/mitigation details
  may be required for the types of application named in the above list. The assessment should be prepared
  in line with the Institute of Lighting Professionals'' Guidance Note for the Reduction of Obtrusive
  Light’ (2021). The Light Impact Assessment should outline the potential sources of light generation
  and light spillage, hours of illumination, lighting specification and how these may have a negative
  effect on local amenity and environmental receptors particularly on sites in close proximity to nationally
  and internationally designated sites. The assessment should also outline how the developer intends to
  overcome these issues including details of lighting covers, cowling and any other mitigation measures.
  For developments likely to be affected by light associated with the strategic road network, please contact
  Highways England for details of its lighting assessment requirements. Policy Background Government policy
  or guidance: • National Planning Policy Framework – Section 15. Conserving and enhancing the natural
  environment • National Guidance – Light Pollution https://www.gov.uk/guidance/light-pollution Adopted
  Hartlepool Local Plan (2018) Policies: Policy QP4: Layout and Design of Development Policy QP6: Technical
  Matters Other Guidance The Institute of Lighting Professionals'' Guidance Note for the Reduction of
  Obtrusive Light’ (2021). 20. Local Landscape Visual Assessment (LVA) + Residential Visual Amenity Assessment
  When is this required? Planning applications where the location of the development would be a significant
  consideration in the assessment of the application. Such developments include, but are not limited to,
  housing schemes (larger schemes or schemes in rural or sensitive areas), industrial and commercial schemes
  involving large structures, renewable energy schemes not covered by EIAs, and engineering or other operations
  likely to result in an impact on landscape character and views. What information is required? The provision
  of a Landscape Visual Assessment to determine the likely impact of a development on the landscape and
  associated views may be required for certain applications. This would be for applications of sufficient
  scale, mass or visual impact in locations where landscape character and views are considerations but
  where a full Landscape and Visual Impact Assessment as part of an Environmental Impact Assessment is
  not necessary. Such developments include, but are not limited to, housing schemes (larger schemes or
  schemes in rural or sensitive areas), industrial and commercial schemes involving large structures,
  renewable energy schemes not covered by EIAs, and engineering or other operations likely to result in
  an impact on landscape character and views. The purpose of a local Landscape Visual Assessment is to
  ensure that such issues have been considered as part of the application and to provide a clear evidence
  base for the decision making process. A local LVA would require the determination of key viewpoints
  in agreement with the local authority and provision of basic photomontage type information to convey
  the likely impacts of the development from the various viewpoints. The perceived visual impact from
  each viewpoint should also be assessed and provided within the LVA submission. Any mitigation measure
  deemed necessary should also be included. In addition to a local LVA and in some instances for developments
  such as solar farms, on shore wind proposals and other large scale developments, a Residential Visual
  Amenity Assessment (RVAA) may be required to consider and evaluate any potential effects on outlook/the
  visual amenity experienced in and around residential properties. This will be considered on a case by
  case basis. Where required, such Assessments should be carried out in accordance with the Landscape
  Institute’s Technical Guidance Note (TGN) 02/2019 Residential Visual Amenity Assessment. Policy Background
  Government policy or guidance: • National Planning Policy Framework – Section 12. Achieving well-designed
  places Adopted Hartlepool Local Plan (2018) Policies: Policy NE1: Natural Environment Policy NE2: Green
  Infrastructure Policy NE3: Green Wedges Policy NE4: Ecological Networks Policy NE6: Protection of Incidental
