reference: heritage-statement
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - advertising
  - any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - conservation-area
        description: Developments within or otherwise affecting conservation areas, including demolition.
    - site:
        in:
        - locally-listed-building
        - listed-building-setting
        - scheduled-monument
        - historic-environment-record
        description: May affect the significance of any heritage asset, including its setting (for example
          Locally Listed Buildings, Scheduled Monuments, sites on the Hartlepool HER and development in
          their vicinity).
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies QP4, QP6, HE1, HE2, HE3, HE4, HE5, HE6, HE7
source-text: 'A Heritage Statement is required for: • Listed Building Consent applications; • Planning
  applications for developments within or otherwise affecting conservation areas; including demolition,
  and where the proposal would materially affects its appearance; • Planning applications that may affect
  the significance of any heritage asset, including its setting for example Locally Listed Buildings.
  • This will also include Scheduled Monuments, sites on the Hartlepool Historic Environment Record (HER)
  and development in the vicinity of such sites, and sites with the potential to include heritage assets.'
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting,
    proportionate to their importance
  level: must
- item: As a minimum, the relevant Historic Environment Record consulted and the assets assessed using
    appropriate expertise where necessary
  level: must
- item: 'Listed building consent, as appropriate: schedule of works with analysis of impact and justification;
    contextual and detailed photographs; historic evidence for reinstatement; elevations and sections
    of windows, doors and shopfronts at 1:20 or less (details at 1:5 or less); materials specification
    (samples where appropriate); photomontages'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
- item: 'Demolition in a conservation area: the building''s contribution to the character and appearance
    of the area and justification for demolition'
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Developments including or solely for demolition.
- item: 'In conservation areas or affecting a locally listed building: how the design has regard to, and
    preserves or enhances, its character or appearance, with appropriate photographs'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      - locally-listed-building
      description: Within a conservation area or impacting on a locally listed building.
- item: 'Affecting the setting of heritage assets: a written statement with plans of historic features
    on or next to the site; analysis of significance, justification and impact may be required'
  level: should
  required-if:
    site:
      in:
      - listed-building-setting
      description: Impacting on the setting of heritage assets.
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 16 (Heritage Statement), page
  40. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building and
  conservation area consent), 4 (advertisement). Planning applications that 'may affect the significance
  of any heritage asset' are partly a judgement, so discretionary. It can form part of the Design and
  Access Statement.
review-status: unverified
field-status: {}
