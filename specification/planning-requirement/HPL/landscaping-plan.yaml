reference: landscaping-plan
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - hh
  - all:
    - condition:
        field: involves-change-of-use
        value: false
        description: Not for a change of use.
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies NE1-NE7, QP4, QP5, QP6
source-text: Planning applications (except those for the change of use or alteration to an existing building),
  where landscaping would be a significant consideration in the assessment of the application.
must-include:
- item: 'As applicable: existing trees, shrubs and landscape features (retained and removed); planting
    plans, specifications and schedules; existing and proposed levels and contours; means of enclosure
    and boundary treatment; paving and surfacing including parking and circulation; landscape furniture,
    equipment, storage, signage and lighting; services and drainage; site cabins and compounds'
  level: must
- item: Any watercourse and associated landscaping, existing and proposed
  level: should
- item: Cross-referenced with the Design and Access Statement where one is submitted
  level: should
- item: Native species of local provenance prioritised in rural areas
  level: should
  required-if:
    site:
      in:
      - rural-area
      description: In rural areas.
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 18 (Landscaping Details), page
  45. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building and
  conservation area consent), 5 (householder). Only where landscaping would be a significant consideration,
  so discretionary; not for changes of use or alterations to an existing building.
review-status: unverified
field-status: {}
