reference: lighting-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - advertising
  - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies QP4, QP6
source-text: 'A lighting impact assessment, prepared by a suitably qualified person, should support applications
  that raise issues of disturbance, or are considered to be light sensitive developments. A light survey
  and any associated mitigation details may be required for the following types of application: • New
  or replacement Flood Lights or security lighting • Significant external lighting installations particularly
  in sensitive locations like the open countryside, near residential dwellings, or heritage assets. •
  New industrial development close to existing residential development. • Development near designated
  wildlife sites where permanent lighting is proposed • Lighting proposals adjacent to the strategic road
  network and main roads'
must-include:
- item: Prepared by a suitably qualified person, in line with the Institute of Lighting Professionals'
    Guidance Note for the Reduction of Obtrusive Light (2021)
  level: must
- item: Sources of light and light spillage, hours of illumination, lighting specification, and effects
    on local amenity and environmental receptors (particularly near designated sites)
  level: must
- item: How the issues will be overcome, including lighting covers, cowling and other mitigation
  level: must
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 19 (Lighting Impact Assessment),
  page 46. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 4 (advertisement).
  Needed for applications that 'raise issues of disturbance' or are light sensitive; a light survey 'may
  be required' for new floodlights or security lighting, significant external lighting in sensitive locations,
  industry near homes, permanent lighting near wildlife sites and lighting next to main roads. All judgements,
  so discretionary.
review-status: unverified
field-status: {}
