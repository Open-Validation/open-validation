policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor plan drawings, Site Sections and Site Levels should be submitted for applications where
  this would be expected to add to the understanding of the proposal;
must-include:
- item: At 1:50, 1:75 or 1:100, explaining the proposal in detail
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: The proposal in context with the site boundary and adjacent buildings, with property numbers/names
    where appropriate
  level: should
- item: Linear scale bar; 'Do not scale' replaced with wording allowing the council to scale; provided
    at the stated paper size and scale
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 8 (Application Plans/Drawings),
  page 15. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent), 4 (advertisement), 5 (householder). Needed where they would add to the
  understanding of the proposal, so discretionary.
