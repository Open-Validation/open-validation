reference: travel-plan
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policy QP3; Transport Assessments and Travel Plans Supplementary
  Planning Document
source-text: Where a new development is likely to have significant transportation implications, a Transport
  Assessment (TA) and Travel Plan (TP) should be prepared.
must-include:
- item: 'Where applicable: site location plan; site audit of transport links, issues, barriers to non-car
    use and improvements; travel surveys with results and analysis; objectives, targets and indicators;
    committed measures, timetable, marketing and budget; Travel Plan Coordinator; monitoring plan and
    mitigation if targets are missed'
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 32 (Transport Assessments & Statements,
  Travel Plans, Parking & Highways), page 64. Listed in Appendix 2 checklists 1 (full), 2 (outline and
  reserved matters). The thresholds are in the council's Transport Assessments and Travel Plans SPD, which
  isn't part of the list, so the need is shown as discretionary ('likely to have significant transportation
  implications').
review-status: unverified
field-status: {}
