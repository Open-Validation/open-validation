reference: planning-statement
local-authority: HPL
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - all:
    - application-type:
        in:
        - lbc
        - demolition-con-area
        - advertising
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018); Hartlepool Rural Neighbourhood Plan
source-text: A Planning Statement is required for all Major and Non-Major planning applications (except
  those for trees and householder applications) including small dwelling sites, changes of use, proposals
  in sensitive locations (for example beyond the development limits) to assist in allowing the applicant
  to explain/justify the proposals in further detail.
must-include:
- item: The context and need for the development, and an assessment against national and local policies
    (Hartlepool Local Plan, Hartlepool Rural Neighbourhood Plan) and relevant SPDs
  level: must
- item: 'For new dwellings in the open countryside: the tests of the New Dwellings outside of Development
    Limits SPD'
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - condition:
        field: outside-urban-area
        value: true
        description: In the open countryside (outside development limits).
- item: Consultations with the council, community and statutory consultees before submission
  level: should
- item: 'For residential development: an assessment against Nationally Described Space Standards and a
    Building For a Healthy Life Assessment'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 26 (Planning Statement), page
  55. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building and
  conservation area consent), 4 (advertisement), 5 (householder). Not for tree or householder applications
  (the householder checklist only refers to note 26). Listed building, conservation area and advertisement
  checklists mark it 'Yes / No', so discretionary there.
review-status: unverified
field-status: {}
