reference: site-plan
local-authority: HPL
required-if:
  always: true
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications should include existing and proposed site or block plans at a standard metric
  scale (typically 1:200 or 1;500) based on an up-to-date map.
must-include:
- item: Standard metric scale (typically 1:200 or 1:500), based on an up-to-date map
  level: should
- item: Application site edged clearly in red, with the direction of north
  level: should
- item: Linear scale bar; 'Do not scale' replaced with wording allowing the council to scale; provided
    at the stated paper size and scale
  level: should
- item: 'Existing: footprint of all existing buildings with written dimensions and distances to the site
    boundaries'
  level: should
- item: 'Proposed: footprint of the proposed development and buildings to be retained, with written dimensions
    and distances to the site boundaries'
  level: should
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    on adjoining land including access; public rights of way; hard surfacing; boundary treatment with
    type and height'
  level: should
- item: 'Unless they would not influence or be affected by the development: existing trees on and next
    to the site (and on the proposed plan, retained trees and new planting) labelled with species, diameter
    at 1.5 m and the root protection area (12 times the diameter)'
  level: should
- item: Separation Distances Block/Site Plan showing compliance with Local Plan Policy QP4 and the Residential
    Design Guide SPD (2019)
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development schemes of 10 or more dwellings.
  source-text: For residential development schemes of 10 or more dwellings, a Separation Distances Block/Site
    Plan shall be provided to demonstrate the scheme’s compliance with the required separation distances
    of Hartlepool Local Plan Policy QP4 and the Council’s Residential Design Guide SPD (2019).
- item: 'For multiple adverts: site plan at 1:100, 1:200 or 1:500 with north, all buildings on site, and
    the position of the advert(s) with written dimensions and distances to the site boundaries'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Where multiple adverts are proposed a site plan to a scale of either 1:100, 1:200 or 1;500
    showing the direction of north, all buildings on site, and the position of the advert(s) with written
    dimensions and distances to the site boundaries as a minimum;
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 7 (Plans - Site Plan/Block Plan
  (Existing and Proposed)), page 14. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved
  matters), 3 (listed building and conservation area consent), 4 (advertisement), 5 (householder).
review-status: unverified
field-status: {}
