reference: roof-plan-proposed
local-authority: HPL
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: There is an alteration to an existing roof.
  - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof plan drawings should be submitted where there is an alteration to an existing roof or
  otherwise where this is expected to add to the understanding of the proposal.
must-include:
- item: Shape and location of the roof and the roofing material, at 1:50, 1:75 or 1:100
  level: should
- item: Linear scale bar; 'Do not scale' replaced with wording allowing the council to scale; provided
    at the stated paper size and scale
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 8 (Application Plans/Drawings),
  page 15. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent), 4 (advertisement), 5 (householder). Otherwise needed where it would
  add to the understanding of the proposal (discretionary).
review-status: unverified
