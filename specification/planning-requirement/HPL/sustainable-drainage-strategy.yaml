reference: sustainable-drainage-strategy
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - hh
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies CC1, CC2, QP6
source-text: All major development as set out in the Town and Country Planning (Development Management
  Procedure) (England) Order 2015. A basic surface water drainage strategy may be required for certain
  non-major applications with further advice set out below.
must-include:
- item: Evidence for managing all surface water following the drainage hierarchy (infiltration, watercourse,
    surface water sewer, combined sewer)
  level: must
  required-if:
    ref: major-development
- item: 'Peak runoff for the 1 in 1 and 1 in 100 year events: not above greenfield rates (greenfield sites),
    or as close as practicable to greenfield and never above the existing rate (previously developed sites)'
  level: must
  required-if:
    ref: major-development
- item: 'Infiltration: evidence of capacity of any existing soakaway; BRE 365 percolation test results
    for new infiltration; design for 1:100 year + 40% climate change, with calculations'
  level: must
  required-if:
    ref: major-development
- item: 'Discharge to watercourse: greenfield run off rate; attenuation for 1:100 year + 40%; written
    consent in principle from the EA or LLFA; calculations'
  level: must
  required-if:
    ref: major-development
- item: 'Discharge to sewer: evidence other options were explored and why the sewer is the only feasible
    option; written confirmation from Northumbrian Water (or sewer owner) of connection and the agreed
    discharge rate'
  level: must
  required-if:
    ref: major-development
- item: Drainage design statement showing compliance with the DEFRA non-statutory technical standards,
    PPG and The SuDS Manual (C753)
  level: must
  required-if:
    ref: major-development
- item: 'Detailed design drawings: drainage network layout, SuDS components, inlets, outlets and flow
    controls; detailed infiltration assessment where applicable'
  level: must
  required-if:
    ref: major-development
- item: Construction details and planning, including phasing and Construction Management Plan
  level: must
  required-if:
    ref: major-development
- item: 'SuDS Management Plan: ownership, management and maintenance over the lifetime, with long term
    funding; details of management and maintenance of the drainage system'
  level: must
  required-if:
    ref: major-development
- item: 'Non-major: basic surface water drainage strategy showing post-development runoff no higher than
    pre-development (greenfield) rates, the SuDS techniques, and site plans of how runoff from roofs,
    roads and car parks is managed'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 14 (Flood Risk and Drainage Assessments
  (Surface Water Drainage Assessment)), page 34. Listed in Appendix 2 checklists 1 (full), 2 (outline
  and reserved matters), 5 (householder). For non-major applications a basic strategy 'may be required'
  depending on the site and development (discretionary). Uses MHCLG's retired sustainable-drainage-strategy
  id. The foul water drainage assessment (major development) is in the unmapped list.
review-status: unverified
field-status: {}
