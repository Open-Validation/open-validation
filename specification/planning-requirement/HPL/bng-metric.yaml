reference: bng-metric
local-authority: HPL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7; Environment
  Act 2021
source-text: Where development would be subject to the general Biodiversity Gain Plan Condition, the application
  must be accompanied by minimum information
must-include:
- item: Statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed Statutory Biodiversity Metric Calculation Tool showing the calculations,
    and its publication date and version
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
  required-if: discretionary
- item: Statement on whether the onsite biodiversity value is lower because of activities carried on ('degradation'),
    with supporting evidence if so
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
- item: Statutory Biodiversity Metric used for all major applications; the Small Sites Metric may be used
    for small sites
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 12 (Ecological Survey Assessment
  and Biodiversity Net Gain Requirements), page 3. Listed in Appendix 2 checklists 1 (full), 2 (outline
  and reserved matters), 5 (householder). Shown with the biodiversity gain condition, which is what the
  law exempts (householder and other exempt development); the householder checklist refers to note 12
  for BNG.
review-status: unverified
field-status: {}
