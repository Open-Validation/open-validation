reference: recreation-facilities-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - site:
      in:
      - open-space
      description: Development on existing open space (including areas of water).
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies NE2, NE5, NE6
source-text: All planning applications for development on existing open space.
must-include:
- item: Plans to scale, with area measurements, of existing or proposed open space within or adjoining
    the site
  level: must
- item: Any independent assessment that the land and buildings are surplus to local requirements
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 24 (Open Space Assessment), page
  53. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters).
review-status: unverified
field-status: {}
