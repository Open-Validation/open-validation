reference: application-form
local-authority: HPL
required-if:
  always: true
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All of the relevant questions should be responded to, or the words “Not Applicable” or N/A
  should be inserted for clarity.
must-include:
- item: Every relevant question answered, or marked 'Not Applicable' or N/A
  level: must
- item: 'Paper applications: the original form plus one copy, with two sets of all plans and information'
  level: must
- item: Householder applications on the householder application form
  level: must
- item: Hazardous substance consent applications on a form provided by the council
  level: must
  required-if:
    application-type:
      in:
      - haz-substance-consent
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 1 (Completed Application Form),
  page 8. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent), 4 (advertisement), 5 (householder). For electronic applications a typed
  signature is acceptable.
review-status: unverified
field-status: {}
