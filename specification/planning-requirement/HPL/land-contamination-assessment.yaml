reference: land-contamination-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: New development with a sensitive end use (including dwellings, allotments, schools,
          nurseries, playgrounds, hospitals and care homes).
    - site:
        in:
        - contaminated-land
        description: Land identified on the public register as being contaminated, or land adjacent to
          it.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policies QP6, NE1
source-text: Subject to prior pre-application discussions, all new development with a sensitive end use
  (including dwellings, allotments, schools, nurseries, playgrounds, hospitals and care homes) require
  a minimum of a Phase 1 Land Contamination Assessment (often referred to as a Preliminary Risk Assessment)
  to be submitted. Also subject to pre-application discussions, new development on land that has been
  identified on the public register as being contaminated or land that is adjacent to, a Phase 1 Assessment
  will be required as a minimum.
must-include:
- item: At least a Phase 1 Land Contamination Assessment (Preliminary Risk Assessment) with a desktop
    study, site walkover and conceptual site model
  level: must
- item: All past uses of the site and of adjacent or nearby sites; potential sources, pathways and receptors;
    off-site sources and receptors
  level: must
- item: Whether a Phase 2 Intrusive Site Investigation is required
  level: must
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 17 (Land Contamination Assessment),
  page 43. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters).
review-status: unverified
field-status: {}
