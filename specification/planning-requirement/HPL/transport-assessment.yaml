reference: transport-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policy QP3; Transport Assessments and Travel Plans Supplementary
  Planning Document
source-text: Where a new development is likely to have significant transportation implications, a Transport
  Assessment (TA) and Travel Plan (TP) should be prepared. In some instances a simplified report in the
  form of a Transport Statement (TS) may be sufficient, which can be incorporated into the Design & Access
  Statement where applicable.
must-include:
- item: 'Transport Statement: trip generation, site accessibility improvements, car parking and internal
    circulation, servicing traffic impacts, and net change over current development on the site'
  level: should
- item: 'Transport Assessment: impact on traffic movement and highway safety; access by alternative modes
    and how they will be promoted; access or transport improvements; Road Safety Audits (summary stage
    1 and 2) if needed'
  level: should
- item: 'Parking and servicing information as sought: rationale for parking provision (car, cycle, disabled,
    motorcycle), parking accumulation, car and cycle parking layout plans, servicing plan (deliveries,
    refuse, taxis), parking and servicing management plan, Traffic Regulation Orders plan, car club and
    EV charging'
  level: should
  required-if: discretionary
- item: 'For changes of use to apartments and HMOs claiming lower parking for social housing: suitable
    evidence'
  level: must
  required-if:
    condition:
      field: hmo-creation
      value: true
      description: Change of use to apartments or HMOs claiming social housing parking levels.
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 32 (Transport Assessments & Statements,
  Travel Plans, Parking & Highways), page 64. Listed in Appendix 2 checklists 1 (full), 2 (outline and
  reserved matters). The thresholds are in the council's Transport Assessments and Travel Plans SPD, which
  isn't part of the list, so the need is shown as discretionary ('likely to have significant transportation
  implications').
review-status: unverified
field-status: {}
