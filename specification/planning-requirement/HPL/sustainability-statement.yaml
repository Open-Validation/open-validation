reference: sustainability-statement
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policy CC1
source-text: All major planning applications. … A Sustainability Statement must be submitted with all
  major planning applications (and where appropriate other types of application as set out in section
  26).
must-include:
- item: How the development will be designed and built to achieve high energy efficiency, and how on-site
    renewable energy will be incorporated
  level: must
- item: 'Outline strategy to reduce CO2 emissions: building design and materials, energy demand reduction,
    renewable energy supply and generation'
  level: should
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 29 (Sustainability Statement),
  page 59. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent). Other types of application 'where appropriate' are discretionary. It
  can be part of the Design and Access Statement or Planning Statement.
review-status: unverified
field-status: {}
