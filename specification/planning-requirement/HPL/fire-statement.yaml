reference: fire-statement
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18m or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9A;
  Hartlepool Local Plan (2018) Policies QP5, QP6
source-text: 'They are a national requirement for all planning applications that: • Contain two or more
  dwelling or educational accommodation; and • Meet the height condition of 18m or more in height, or
  7 or more storeys.'
must-include:
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and how it was taken into account
  level: must
- item: How local fire safety policies have been taken into account
  level: must
- item: Information on the entire development within the application site
  level: must
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 13 (Fire Statement - High Rise
  Residential Buildings), page 30. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters).
  Outline applications are exempt by law.
review-status: unverified
field-status: {}
