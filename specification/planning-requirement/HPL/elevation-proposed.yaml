reference: elevation-proposed
local-authority: HPL
required-if:
  condition:
    field: external-alterations
    value: true
    description: External alterations are proposed.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevation plan drawings should be submitted for all applications where external alterations
  are proposed;
must-include:
- item: At 1:50, 1:75 or 1:100, showing all external sides of the proposal
  level: must
- item: Proposed building materials, and the style, materials and finish of windows and doors where possible
  level: should
- item: 'Where adjoining or close to another building: the relationship between the two and the positions
    of openings on each'
  level: should
- item: Blank elevations included (or a through-section where appropriate)
  level: must
- item: Linear scale bar; 'Do not scale' replaced with wording allowing the council to scale; provided
    at the stated paper size and scale
  level: should
- item: 'For advertisement consent: plans of the advert(s) at 1:50, 1:75 or 1:100 showing size, position
    on buildings or land, height above ground, projection, sections, materials, colours and method of
    fixing; means of illumination with a section, where applicable'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Plans of the advert(s) to a scale of 1:50, 1:75 or 1:100 showing their size, position on
    buildings or land, height above ground level, extent of projection, sections, materials, colours and
    method of fixing; • Details of means of illumination where applicable, with section through advertisement
    and method of illumination.
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 8 (Application Plans/Drawings),
  page 15. Listed in Appendix 2 checklists 1 (full), 2 (outline and reserved matters), 3 (listed building
  and conservation area consent), 4 (advertisement), 5 (householder).
review-status: unverified
field-status: {}
