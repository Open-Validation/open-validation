reference: town-centre-impact-assessment
local-authority: HPL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - all:
      - site:
          in:
          - local-centre
          description: Located in local centres.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 300
          description: Retail, leisure and office development with a floor area of 300m² or above.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Not located in the Town Centre or a local centre.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 200
          description: Retail, leisure and office development with a floor area of 200m² or above.
source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
policy: Hartlepool Local Plan (2018) Policy RC1
source-text: Proposals for retail, leisure and office development located in local centres, with a floor
  area of 300m² or above • Proposals for retail, leisure and office development with a floor area of 200m²
  or above, not located in the Town Centre or a local centre, Will be required to provide a robust impact
  assessment
must-include:
- item: Where necessary, the impact on the Town Centre and other designated centres (and, for local centres,
    village businesses and community facilities)
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (updated December 2025), Appendix 1 note 31 (Town Centre Use Assessment
  (Sequential Test and Impact Assessment)), page 61. Listed in Appendix 2 checklists 1 (full), 2 (outline
  and reserved matters). The sequential test is in the unmapped list.
review-status: unverified
field-status: {}
