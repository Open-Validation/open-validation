reference: design-and-access-statement
local-authority: LIC
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings with 100 sq m or more of floorspace.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: A building or buildings with 100 sq m or more of floorspace.
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications for major development2 ... Applications for development in a conservation area,
  where the proposed development consists of one or more dwellings; or a building or buildings with a
  floor space of 100 square metres or more. ... Applications for listed building consent. ... Required
  for applications for development in a conservation area, where the proposed development consists of
  a building or buildings with a floor space of 100 square metres or more. ... Required for all listed
  building consents
confidence: medium
notes: From the council's list (adopted May 2024, in force 20 May 2024), Full Applications list page 2;
  Householder Applications list page 1; Listed Building Consent Applications list page 1. Wording from
  the Householder Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Householder%20Applications%20Validation%20List.pdf),
  the Listed Building Consent Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Listed%20Building%20Consent%20Applications%20Validation%20List.pdf)
  as quoted. The '2' after 'major development' is the list's footnote marker (major development as defined
  in article 2 of the DMPO). The Outline list has the same wording as the Full list.
review-status: unverified
field-status: {}
