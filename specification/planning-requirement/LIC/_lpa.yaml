  url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
  date: '2024-05-20'
  date-basis: 'The joint Central Lincolnshire Local Validation Lists (Full, Householder, Listed Building
    Consent, Outline; PDFs created 13-14 May 2024) adopted by City of Lincoln, North Kesteven and West
    Lindsey after a late-2023 consultation; North Kesteven''s checklists page (https://www.n-kesteven.gov.uk/planning-building/planning/planning-applications/planning-application-checklists)
    says they ''came into effect Monday 20 May 2024''. The lists carry no date themselves. A revised set
    (''Full Applications Validation List 2026'' and three others, PDFs created 30 April 2026) was consulted
    on from 11 May to 7 June 2026; the joint consultation page (https://www.central-lincs.org.uk/consultations/local-validation-list-review-consultation-11-may-2026,
    checked 2026-11-06) says ''The proposed Local Validation Lists are not adopted and do not currently
    apply'' and that the existing adopted lists remain in force, and North Kesteven''s checklists page
    says the same. City of Lincoln''s ''Submit a planning application'' page (https://www.lincoln.gov.uk/planning/planning-applications/3)
    does say updated lists ''were adopted by West Lindsey District Council on 24 August 2026'', but no
    adoption notice or adopted 2026 list is published, West Lindsey''s own page still shows the 2024 list,
    and the 2026 PDFs sit in a ''2026-08'' upload folder only because the joint website was migrated then
    (2023 documents are in the same folder). Rechecked 2026-11-06: Lincoln''s page (now headed ''Current
    adopted Local Validation Lists (in force)'') links its ''Consultation Summary Report'' to the joint
    consultations page (https://www.central-lincs.org.uk/consultations), which publishes no report and
    says the authorities ''are currently reviewing all representations received and preparing a consultation
    summary report'' and ''Until any revised Local Validation Lists are formally adopted, the current
    adopted Local Validation Lists remain in force''. City of Lincoln''s committee papers (https://democratic.lincoln.gov.uk/)
    hold no report or decision on the validation lists: the agendas and minutes of the Executive (16 June
    to 13 October 2026), Council (21 July, 8 and 22 September 2026), Planning Committee (8 July, 5 August
    and 2 September 2026; 24 June, 30 September and 28 October cancelled) and Policy Scrutiny Committee
    (9 June and 6 October 2026; 11 August cancelled) were read, and its decisions register has no decision
    titled ''validation'' from 2023 to 2026. North Kesteven''s and West Lindsey''s committee sites (democracy.n-kesteven.gov.uk,
    democracy.west-lindsey.gov.uk) answer every request with the councils'' own firewall page (''Request
    Rejected''), so their papers, including any West Lindsey decision of 24 August 2026, could not be
    read.'
  status: outdated
submission-standards:
- item: All plans and drawings drawn to the identified scale, with a linear scale bar; plans show the
    direction of north
  level: must
- item: Plans annotate key dimensions, as a minimum the external length, width and height (eaves and ridge)
    of buildings and structures, and the separation distances between the buildings and structures closest
    to the site boundary and the boundary itself
  level: must
- item: All measurements in metres
  level: must
- item: Applications made on the standard national form, with the correct planning fee
  level: must
