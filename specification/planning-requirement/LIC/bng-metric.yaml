reference: bng-metric
local-authority: LIC
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the statutory biodiversity gain condition (not exempt).
  - all:
    - application-type:
        in:
        - outline
    - condition:
        field: layout-reserved-matter
        value: false
        description: Layout is not a reserved matter (it is decided at outline stage).
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: Central Lincolnshire Local Plan (2023) policy S61; Environment Act 2021 (biodiversity gain condition)
source-text: Biodiversity Net Gain Metric (Pre and post development) [Excel Format] CLLP Policy S61 unless
  exempt from statutory BNG ... CLLP Policy S61 where the layout is not a reserved matter, unless exempt
  from statutory BNG.
must-include:
- item: Pre and post development metric in Excel format
  level: must
- item: Including the Statutory Condition Assessment Sheets in Excel format
  level: must
confidence: medium
notes: 'From the council''s list (adopted May 2024, in force 20 May 2024), Full Applications list page
  3; Outline Applications list page 4. Wording from the Outline Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Outline%20Applications%20Validation%20List.pdf)
  as quoted. Shown with the biodiversity gain condition (''unless exempt from statutory BNG''): householder
  and other exempt applications are exempt by law. For outline applications only where layout is not a
  reserved matter (Outline list, Category 3).'
review-status: unverified
