reference: archaeological-assessment
local-authority: LIC
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
  - discretionary
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: Central Lincolnshire Local Plan (2023) policy S57; National Planning Policy Framework (December
  2023) paragraph 200
source-text: Where a site on which development is proposed includes, or has the potential to include,
  heritage assets with archaeological interest, local planning authorities should require developers to
  ... submit an appropriate desk-based assessment and, where necessary, a field evaluation. ... Archaeological
  Assessment CLLP Policy S57
must-include:
- item: An appropriate desk-based assessment and, where necessary, a field evaluation
  level: must
confidence: medium
notes: From the council's list (adopted May 2024, in force 20 May 2024), Full Applications list page 4.
  Category 3; the matrix marks it 'Where Required'. 'Has the potential to include ... archaeological interest'
  names no mapped area, so it is shown as discretionary. The Householder and Outline lists also ask for
  'Any other report/survey from the Central Lincolnshire ‘full’ validation checklist relevant to the scale,
  nature and location of development', so householder and outline applications are included as discretionary.
