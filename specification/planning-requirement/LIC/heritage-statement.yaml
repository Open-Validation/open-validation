reference: heritage-statement
local-authority: LIC
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
    - any:
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          - scheduled-monument
          - park-and-garden
          - locally-listed-building
          description: A heritage asset (designated, or identified by the council including local listing)
            or its setting is affected.
      - discretionary
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: National Planning Policy Framework (December 2023) paragraph 200
source-text: In determining applications, local planning authorities should require an applicant to describe
  the significance of any heritage assets affected, including any contribution made by their setting.
must-include:
- item: Describes the significance of the heritage assets affected, including any contribution made by
    their setting, in proportionate detail
  level: must
- item: The relevant historic environment record consulted, and the heritage assets assessed using appropriate
    expertise where necessary
  level: must
  source-text: As a minimum the relevant historic environment record should have been consulted and the
    heritage assets assessed using appropriate expertise where necessary.
confidence: medium
notes: From the council's list (adopted May 2024, in force 20 May 2024), Full Applications list page 4;
  Householder Applications list page 2; Listed Building Consent Applications list page 2; Outline Applications
  list page 3. Wording from the Householder Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Householder%20Applications%20Validation%20List.pdf),
  the Listed Building Consent Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Listed%20Building%20Consent%20Applications%20Validation%20List.pdf),
  the Outline Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Outline%20Applications%20Validation%20List.pdf)
  as quoted. Category 3. The Listed Building Consent matrix marks it 'Required'; the Full, Outline and
  Householder matrices 'Where Required'. The list's definition of a heritage asset includes non-designated
  assets, so a discretionary branch is kept.
review-status: unverified
field-status: {}
