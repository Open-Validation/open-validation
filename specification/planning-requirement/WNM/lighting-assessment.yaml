reference: lighting-assessment
local-authority: WNM
required-if:
  condition:
    field: external-lighting
    value: true
    description: New or replacement external lighting, excluding advertisement consent applications.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy EP3
source-text: If the application involves new or replacement external lighting, excluding advertisement
  consent applications.
must-include:
- item: A description of the significance of the heritage asset with reference to the relevant historic
    record
  level: should
- item: Hours of operation
  level: should
- item: Light spillage (Isolux) diagrams
  level: should
- item: Light levels
  level: should
- item: Column heights
  level: should
- item: Layout plan with beam orientation and light maps
  level: should
- item: Equipment design
  level: should
- item: Impact on nearby dwellings, wildlife, habitat or roads, and use of planting to mitigate effects
  level: should
confidence: medium
notes: From the council's list (adopted 5 February 2026), Other Documents, page 30, 47. Not for advertisement
  consent applications. The heritage asset item is listed by the council among the lighting details, as
  printed.
review-status: unverified
field-status: {}
