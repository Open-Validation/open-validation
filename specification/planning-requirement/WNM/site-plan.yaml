reference: site-plan
local-authority: WNM
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
      - demolition-con-area
      - pa-extension
      - pa-storey
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All applications.
must-include:
- item: Recommended scale 1:200 or 1:500
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: should
- item: Direction of north
  level: should
- item: 'Unless they would not influence or be affected by the development: all buildings, roads and footpaths
    on adjoining land, including access arrangements'
  level: should
- item: 'Unless they would not influence or be affected by the development: all public rights of way crossing
    or adjoining the site'
  level: should
- item: 'Unless they would not influence or be affected by the development: the position of all trees
    on the site and on adjacent land'
  level: should
- item: 'Unless they would not influence or be affected by the development: the extent and type of any
    hard surfacing (and appropriate drainage details)'
  level: should
- item: 'Unless they would not influence or be affected by the development: the boundary treatment, including
    walls or fencing where proposed'
  level: should
- item: 'Unless they would not influence or be affected by the development: parking arrangements'
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: 'Larger home extension prior approval: the site and the proposed development (and any existing
    enlargement of the original house it will join)'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Additional storeys prior approval: drawn to an identified scale, showing the direction of north,
    the site and the proposed development'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
- item: 'Agricultural and forestry prior approval: a plan indicating the site'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
confidence: medium
notes: From the council's list (adopted 5 February 2026), Local Validation Requirements (Plans), householder
  guide and other application types, page 14-15, 34-35, 40-41, 43. Application types follow the quick
  check list (page 43), which marks the site/block plan as always required except for certificates of
  lawfulness ('sometimes'), plus the prior approvals that ask for a site plan. Parking arrangements are
  not in the householder version.
review-status: unverified
field-status: {}
