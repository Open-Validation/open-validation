reference: landscaping-plan
local-authority: WNM
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: Minor development proposals, excluding change of use.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy NR3
source-text: Major and minor development proposals, excluding change of use.
must-include:
- item: Planting of trees and shrubs, surface materials, boundary screen walls and fences
  level: must
- item: Materials
  level: should
- item: Species
  level: should
- item: Tree and plant sizes, numbers and planting densities
  level: should
- item: Levels, gradients and any earthworks required
  level: should
- item: Timing of the implementation of the scheme
  level: should
- item: Proposals for long-term maintenance and landscape management
  level: should
- item: Cross-reference with the SuDS Strategy and the Biodiversity Net Gain assessment, where applicable
  level: should
confidence: medium
notes: From the council's list (adopted 5 February 2026), Trees, Landscape and Ecology, page 25-26, 48.
  The list calls it 'Landscaping Scheme'. Changes of use are excluded.
