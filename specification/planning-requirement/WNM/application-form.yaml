reference: application-form
local-authority: WNM
required-if:
  always: true
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All applications.
must-include:
- item: All sections and questions answered
  level: must
- item: The declaration signed and dated
  level: must
- item: Full contact details of the applicant and/or agent (where appropriate)
  level: must
- item: The relevant ownership certificate A, B, C or D completed
  level: must
- item: 'Larger home extension prior approval: a written description giving how far the enlargement extends
    beyond the rear wall of the original house, its maximum height and, where it joins an existing enlargement,
    these for the total enlargement; the addresses of any adjoining premises; the developer''s contact
    address (and email address if content to receive communications electronically)'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Additional storeys prior approval: a written description of the proposed development, including
    details of any works proposed'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
- item: 'Agricultural and forestry prior approval: a written description of the development and the materials
    to be used'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
- item: 'Tree works: the tree type and its condition; a description of the intended works and the reasons
    for them'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: 'Tree works: an accurate, clear pruning specification for each tree, stating current height and
    spread and the dimensions to remain after pruning (or average branch length) in metres; reductions
    stated as percentages are not accepted'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: 'Modification or discharge of a S106 agreement: the applicant''s name and address; the address
    or location of the land and the applicant''s interest in it; enough information to identify the planning
    obligation; the applicant''s reasons for the modification or discharge'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
confidence: medium
notes: From the council's list (adopted 5 February 2026), National Validation Requirements, householder
  guide and other application types, page 6-7, 32-33, 40-42. A fee is also required for most applications
  (a national requirement, not a document).
review-status: unverified
field-status: {}
