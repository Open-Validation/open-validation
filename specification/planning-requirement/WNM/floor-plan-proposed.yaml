reference: floor-plan-proposed
local-authority: WNM
required-if:
  any:
  - condition:
      field: involves-change-of-use
      value: true
      description: All change of use applications.
  - condition:
      field: building-works
      value: true
      description: Operational development (building works and engineering operations) is proposed.
  - application-type:
      in:
      - hh
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All change of use applications. All applications where operational development (building
  works and engineering operations) is proposed.
must-include:
- item: Recommended scale 1:50 or 1:100
  level: should
- item: Unique drawing number reference
  level: must
- item: Floor plans labelled clearly as existing and proposed
  level: should
- item: The use of each room annotated
  level: must
- item: Door and window openings
  level: must
- item: Walls to be demolished highlighted, and existing and proposed distinguished if shown on the same
    plan
  level: must
- item: 'Green Belt: floor area calculations (on the plans or in a supporting document) giving the original
    size and the existing and proposed floor areas'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: Proposals in the Green Belt.
  source-text: Floor area calculations are required for proposals in the Green Belt (either annotated
    on the plans or in a supporting document) and should detail the original size, and existing and proposed
    calculations.
- item: 'Green Belt: volume calculations'
  level: must
  required-if:
    all:
    - site:
        in:
        - green-belt
        description: In the Green Belt.
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor applications.
  source-text: Volume calculations are also required for minor and major applications in the Green Belt.
confidence: medium
notes: From the council's list (adopted 5 February 2026), Local Validation Requirements (Plans) and householder
  guide, page 15, 35-36, 43. The householder guide says 'Always.' for householder applications.
review-status: unverified
field-status: {}
