reference: heritage-statement
local-authority: WNM
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - locally-listed-building
      - scheduled-monument
      - listed-building-setting
      description: Within a conservation area, a listed building (including curtilage), a locally listed
        building, a scheduled monument, or the setting of a heritage asset.
  - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy HE1
source-text: Required if the works are within a conservation area or the property is a Listed Building
  (including curtilage), a Locally Listed Building or affects any heritage asset or their setting (a heritage
  asset also includes scheduled monuments).
must-include:
- item: A description of the significance of the heritage asset, with reference to the relevant historic
    record, including any contribution made by its setting
  level: should
- item: The impact of the proposed works on the significance of the asset
  level: should
- item: How the proposed development protects/enhances the heritage asset
  level: should
- item: How the development responds to the scale, proportions, height, massing, historic building lines,
    pattern of historic development, use, design, detailing and materials of the heritage asset
  level: should
- item: How the proposal seeks good/exceptional design that integrates with and contributes positively
    to the heritage asset
  level: should
- item: 'Where any harm is caused: full justification, setting out the degree of harm, alternatives considered
    to avoid it and any public (including heritage) benefits'
  level: should
- item: 'Listed building works: how the proposal retains the integrity and significance of the building
    as a whole'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'Listed building works: the location and hierarchy of rooms'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'Listed building works: historic floor levels'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'Listed building works: the structure of the building, including foundations'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'Listed building works: fabric and features such as original staircases, original roof structures
    and other features of significance'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
confidence: medium
notes: From the council's list (adopted 5 February 2026), National Validation Requirements and householder
  guide, page 10-12, 37-38, 47. A heritage asset that is not designated (affected by the works or in whose
  setting they lie) is shown as the council's discretion. The statement can be included in the Design
  and Access Statement. The quick check list marks it as always required for listed building works and
  CA/listed building demolition.
review-status: unverified
field-status: {}
