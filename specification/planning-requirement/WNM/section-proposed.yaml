reference: section-proposed
local-authority: WNM
required-if:
  any:
  - ref: major-development
  - condition:
      field: change-in-ground-levels
      value: true
      description: Operational development is proposed which would change land levels.
  - condition:
      field: earthworks
      value: true
      description: Engineering works are proposed.
  - condition:
      field: basement
      value: true
      description: All basement proposals.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All major developments and where operational development is proposed which would change land
  levels. Where engineering works is proposed. All basement proposals. ... These may be required when
  you are proposing a loft extension or when your proposal involves land level changes.
must-include:
- item: Recommended scale 1:20, 1:50 or 1:100
  level: should
- item: Unique drawing number reference
  level: must
- item: Window positions and head heights
  level: must
confidence: medium
notes: From the council's list (adopted 5 February 2026), Local Validation Requirements (Plans) and householder
  guide, page 17, 36-37, 44. The list has one 'Cross Sections' row. For householder applications it says
  sections 'may be required' for a loft extension, so that part shows as discretionary.
review-status: unverified
field-status: {}
