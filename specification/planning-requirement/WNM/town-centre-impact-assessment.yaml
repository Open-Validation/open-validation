reference: town-centre-impact-assessment
local-authority: WNM
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure developments over 2,500 sq m gross floorspace.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Any retail, leisure or office proposal outside a town centre.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF)
source-text: Required for all retail and leisure developments over 2,500 sqm gross floor space, and any
  retail, leisure, office proposal outside of Town Centre
must-include:
- item: Any assessment required by the Development Plan
  level: should
- item: The impact on existing, committed and planned public and private investment in a centre or centres
    in the catchment area
  level: should
- item: The impact on town centre vitality and viability, including local consumer choice and trade in
    the town centre and wider area
  level: should
confidence: medium
notes: From the council's list (adopted 5 February 2026), Statements/Assessments, page 20, 48. The list
  calls it 'Retail Impact Assessment'.
review-status: unverified
field-status: {}
