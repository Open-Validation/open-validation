reference: air-quality-assessment
local-authority: WNM
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy EP2
source-text: Major applications. Excluded are reserved matters applications where an assessment has been
  submitted and considered at outline stage. However, if material circumstances have changed since the
  grant of outline permission, then an updated assessment would be required.
must-include:
- item: Carried out by a suitably qualified environmental scientist
  level: should
- item: An Emissions Mitigation Assessment (EMA) detailing the avoidance and mitigation measures to be
    implemented
  level: should
confidence: medium
notes: From the council's list (adopted 5 February 2026), Environmental Protection, page 26-27, 46. The
  list also says an assessment 'will be required where' the development could introduce new point sources
  of air pollution, existing air quality may affect it, it could significantly affect traffic, construction
  could affect a neighbouring site sensitive to air quality, or biodiversity is affected; these have no
  thresholds and show as the council's discretion. Not needed at reserved matters if assessed at outline,
  unless circumstances have changed.
review-status: unverified
field-status: {}
