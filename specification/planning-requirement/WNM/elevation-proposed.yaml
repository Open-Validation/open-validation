reference: elevation-proposed
local-authority: WNM
required-if:
  any:
  - all:
    - condition:
        field: building-works
        value: true
        description: Operational development (building works and engineering operations) is proposed.
    - condition:
        field: external-alterations
        value: true
        description: Changes to the external appearance are proposed.
  - application-type:
      in:
      - hh
      - pa-storey
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All applications where operational development (building works and engineering operations)
  is proposed. If no changes to the external appearance are proposed, then only existing elevations will
  be required.
must-include:
- item: Recommended scale 1:50 or 1:100
  level: should
- item: Unique drawing number reference
  level: must
- item: Each elevation annotated
  level: must
- item: Door and window openings
  level: must
- item: 'Additional storeys prior approval: drawn to an identified scale, showing the position and dimensions
    of the proposed windows'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
confidence: medium
notes: From the council's list (adopted 5 February 2026), Local Validation Requirements (Plans), householder
  guide and other application types, page 16, 36, 41, 44. The householder guide says 'Always.'.
review-status: unverified
field-status: {}
