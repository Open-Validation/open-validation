reference: biodiversity-survey-report
local-authority: WNM
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Sites likely to affect protected species.
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      description: Likely to affect, located within or abutting a local, county, national or internationally
        designated site of nature conservation.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy NR2
source-text: All applications, including householder, on sites that are likely to affect protected species,
  and/or, likely to affect/is located within or abuts a local, county, national or internationally designated
  site of nature conservation.
must-include:
- item: Phase I Habitat Survey
  level: must
- item: Extended Phase I and Phase II surveys
  level: must
  required-if: discretionary
  source-text: (& an Extended Phase I and a Phase II in certain circumstances) will be required.
confidence: medium
notes: From the council's list (adopted 5 February 2026), Trees, Landscape and Ecology and householder
  guide, page 24-25, 39, 46. The list calls it 'Habitats Survey/Ecology Report'. Extended Phase I and
  Phase II surveys 'in certain circumstances' show as discretionary.
review-status: unverified
field-status: {}
