  level: must
- item: 'Electronic submissions: page size matches the size and scale the plan is noted as drawn to'
  level: must
- item: All documents and plans capable of being accessed by the recipient and legible in all material
    respects
  level: must
- item: One copy of each document or plan (electronic), or one hard copy of the form, plans and supporting
    documents
  level: must
- item: Each plan has a unique drawing number reference
  level: must
