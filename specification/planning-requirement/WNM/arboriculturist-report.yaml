reference: arboriculturist-report
local-authority: WNM
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site or on its edge likely to be affected by the development, including
      for householder applications.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Borough Local Plan (BLP) Policy NR3
source-text: Any application where there are trees within the site or on the edge of the site likely to
  be affected by the development. This will include householder applications, minors and majors.
must-include:
- item: Compliant with BS5837:2012 'Trees in relation to design, demolition and construction – Recommendations'
  level: must
- item: Includes an Arboricultural Impact Assessment, an Arboricultural Method Statement and a Tree Protection
    Plan
  level: must
- item: Prepared by a qualified arboriculturist with professional indemnity insurance
  level: should
- item: Trees on or immediately adjacent to the development shown accurately on a scaled site/block plan,
    with species, position and canopy spread
  level: should
confidence: medium
notes: From the council's list (adopted 5 February 2026), Trees, Landscape and Ecology and householder
  guide, page 23-24, 38-39, 44. The list calls it 'Tree Survey, Arboricultural Impact Assessment, Arboricultural
  Method Statement, Tree Protection Plan'. It is required if 'yes' is ticked on the application form;
  the report is needed for trees over 75 mm diameter within influencing distance of the development.
review-status: unverified
field-status: {}
