reference: transport-assessment
local-authority: WNM
required-if:
  any:
  - ref: major-development
  - discretionary
  - all:
    - application-type:
        in:
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
    - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy IF2
source-text: Where a proposal has a significant transport implication. All major development proposals.
  ... Require the necessary plans and documentation to support the submission, as relevant. The list includes,
  amongst other things, Flood Risk Assessment, Transport Assessment, Noise Assessment, Land Contamination
  Assessment.
must-include:
- item: Coverage and scale reflect the scale of the development and the extent of its transport implications
  level: should
- item: A draft travel plan, if required
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 5 February 2026), Transport, page 21, 49. The list has one 'Transport
  Assessment and Travel Plan' row. 'A significant transport implication' is shown as the council's discretion.
  For Part 3 prior approvals (changes of use) the list asks for this 'as relevant' (page 41), shown as
  the council's discretion.
review-status: unverified
field-status: {}
