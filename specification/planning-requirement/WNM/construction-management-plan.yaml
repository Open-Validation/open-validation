reference: construction-management-plan
local-authority: WNM
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial proposals, including changes of use.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Environmental Protection Act 1990
source-text: Major developments for new dwellings and commercial proposals, including changes of use
must-include:
- item: Scope of works (including measures for traffic management)
  level: should
- item: Access arrangements
  level: should
- item: Loading and unloading of plant and materials
  level: should
- item: Storage of plant and materials
  level: should
- item: Boundary hoarding behind any visibility zones of construction traffic routing
  level: should
- item: Proposed working hours
  level: should
- item: Means to prevent deposition of mud on the highway
  level: should
- item: Work programme
  level: should
- item: How biodiversity designations will be protected
  level: should
  required-if: discretionary
  source-text: Where appropriate, details on how to protect biodiversity designations
confidence: medium
notes: From the council's list (adopted 5 February 2026), Transport, page 22, 46. The list calls it 'Construction
  Environmental Management Plan' (CEMP).
review-status: unverified
field-status: {}
