reference: roof-plan-proposed
local-authority: WNM
required-if:
  any:
  - all:
    - condition:
        field: building-works
        value: true
        description: Operational development (building works and engineering operations) is proposed.
    - condition:
        field: external-alterations
        value: true
        description: Changes to the external appearance are proposed.
  - application-type:
      in:
      - hh
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All applications where operational development (building works and engineering operations)
  is proposed. If no changes to the external appearance are proposed, then only existing roof plan will
  be required.
must-include:
- item: Recommended scale 1:50, 1:100 or 1:200
  level: should
- item: Unique drawing number reference
  level: must
- item: Key features of the roof such as chimney, parapet, railings and rooflights
  level: must
confidence: medium
notes: From the council's list (adopted 5 February 2026), Local Validation Requirements (Plans) and householder
  guide, page 16, 36, 44. The householder guide says 'Always.'.
review-status: unverified
field-status: {}
