reference: design-and-access-statement
local-authority: WNM
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Any part of the development is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floorspace of 100 sq m or more.
  - application-type:
      in:
      - demolition-con-area
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: 'Only the following: Major development, both full and outline. Listed Building Consent applications.
  Where any part of the development is in a conservation area and the development is for one or more dwellings,
  or a building(s) with a floorspace of 100sqm or more.'
must-include:
- item: Proportionate to the complexity of the application
  level: should
- item: Computer Generated Images (in the statement or as standalone plans)
  level: must
  required-if:
    ref: major-development
  source-text: As part of the Design and Access Statement/or standalone plans, Computer Generated Images
    are required for major development proposals.
- item: Information to demonstrate compliance with Policy HO2 (accessible and adaptable M4(2) and wheelchair
    accessible M4(3) homes)
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 20
      description: 20 or more dwellings.
  source-text: All applications for 20 or more dwellings ... Appropriate Information/Section in Design
    & Access Statement to demonstrate compliance with Policy HO2
confidence: medium
notes: From the council's list (adopted 5 February 2026), National Validation Requirements, Other Documents,
  householder guide and quick check list, page 8, 31, 37-38, 45. The householder guide says a statement
  is needed in a conservation area only if the floor area of the proposal exceeds 100 sq m. The quick
  check list (page 45) marks it as always required for CA/listed building demolition, so that type is
  included. Accessible and adaptable dwellings details are a separate row on page 31 that the list says
  go in the statement.
review-status: unverified
field-status: {}
