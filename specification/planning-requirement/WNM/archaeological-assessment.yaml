reference: archaeological-assessment
local-authority: WNM
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: Sites within an Area of High Archaeological Potential.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.4
      description: Sites in excess of 0.4 hectares.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.4
      description: Sites in excess of 0.4 hectares.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy HE1
source-text: Required for sites within an Area of High Archaeological Potential or sites in excess of
  0.4 hectares.
confidence: medium
notes: From the council's list (adopted 5 February 2026), Other Documents, page 29-30, 46. The list calls
  it 'Archaeological Desk Based Assessment'.
review-status: unverified
field-status: {}
