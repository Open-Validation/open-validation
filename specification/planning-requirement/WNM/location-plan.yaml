reference: location-plan
local-authority: WNM
required-if:
  always: true
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Development Management Procedure Order (DMPO) 2015, as amended
source-text: All applications.
must-include:
- item: Based on an Ordnance Survey map within the last 12 months, with the appropriate OS copyright licence
    number
  level: must
- item: Scale 1:1250 or 1:2500
  level: must
- item: Fits onto A4 or A3 paper wherever possible
  level: should
- item: Direction of north
  level: must
- item: At least two named roads (where possible)
  level: must
- item: All the surrounding buildings, roads and footpaths on land adjoining the site
  level: must
- item: A red line around all land required for the development (including access to the public highway,
    where relevant)
  level: must
- item: A blue line around all other land owned by the applicant close to or adjoining the site
  level: must
- item: 'Modification or discharge of a S106 agreement: a map identifying the land to which the obligation
    relates'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
  source-text: A map identifying the land to which the obligation relates.
confidence: medium
notes: From the council's list (adopted 5 February 2026), National Validation Requirements and householder
  guide, page 7-8, 34, 42. The list prints the scale as '1.1250'.
review-status: unverified
field-status: {}
