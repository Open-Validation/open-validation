reference: affordable-housing-statement
local-authority: WNM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: A net gain of 10 residential units or more.
      - condition:
          field: housing-floorspace
          operator: '>'
          value: 1000
          description: More than 1,000 sq m of residential floorspace.
      - all:
        - site:
            in:
            - designated-rural-area
            description: Designated rural areas (BLP policy HO3, footnote 14).
        - condition:
            field: dwelling-count
            operator: '>='
            value: 5
            description: Between five and nine dwellings.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Borough Local Plan (BLP) Policy HO3
source-text: Only outline and full applications where there is a net gain of 10 residential units or more
  than 1,000 sqm of residential floorspace (Note – this also includes private retirement homes, sheltered
  accommodation and Extra Care Schemes within Use Class C3). If material circumstances have changed since
  the grant of an outline permission, then an updated AH statement at Reserved Matters stage. Will also
  be required within designated rural areas as defined in BLP policy HO3 (footnote 14) for development
  of between five and nine dwellings.
confidence: medium
notes: From the council's list (adopted 5 February 2026), Statements/Assessments, page 19, 46. Includes
  C3 retirement homes, sheltered and extra care housing. At reserved matters stage it is needed only if
  circumstances have changed, shown as discretionary.
review-status: unverified
field-status: {}
