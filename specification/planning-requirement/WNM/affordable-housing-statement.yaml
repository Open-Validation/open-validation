reference: affordable-housing-statement
local-authority: WNM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: A net gain of 10 or more units.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Over 1,000 square metres of residential floorspace.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 to 9 dwellings in designated rural areas.
      - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: BLP Policy HO3
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the workbook quoted the Marketing Exercise policy references
  and put it under Full only. From the audit: net gain of 10+ units or over 1,000 sqm of residential floorspace,
  or 5-9 dwellings in designated rural areas; outline and full.'
review-status: unverified
field-status: {}
