reference: waste-management-plan
local-authority: WNM
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: All new residential developments, excluding a replacement dwelling.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Commercial developments, including changes of use.
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Borough Local Plan (BLP) Policies QP3 and IF2
source-text: All new residential developments, excluding replacement dwelling, and commercial developments,
  including changes of use.
must-include:
- item: Arrangements and space for the storage and collection of recycling and refuse on site, shown on
    the plans
  level: must
- item: A collection and management strategy
  level: must
confidence: medium
notes: From the council's list (adopted 5 February 2026), Transport, page 23, 50. The list calls it 'Waste
  Management, Storage and Collection Strategy'.
review-status: unverified
field-status: {}
