reference: planning-statement
local-authority: WNM
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Minor applications for new residential development.
  - application-type:
      in:
      - non-material-amendment
  - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
source-text: All major applications, including full or outline. However, if material circumstances have
  changed since the grant of outline permission, then an updated assessment may be required. Minor applications
  for new residential development. Other applications may require a statement where there is a change
  of use or Green Belt justification.
must-include:
- item: Justifies the scheme in relation to national and local policy (may be a covering letter or detailed
    document)
  level: should
- item: Information on commercial activities, including anticipated staffing levels, site visitors and
    proposed hours of operation
  level: should
- item: 'Green Belt: very special circumstances arguments (where applicable)'
  level: should
  required-if:
    site:
      in:
      - green-belt
      description: Green Belt proposals.
- item: 'Non-material amendment: a supporting statement explaining the changes'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
  source-text: Supporting Statement to explain the changes.
confidence: medium
notes: From the council's list (adopted 5 February 2026), Statements/Assessments, householder guide and
  other application types, page 18, 39, 40. Other applications (change of use, Green Belt justification;
  for householders 'rarely required', for example to justify the use of rooms) show as the council's discretion.
  The list says other statements (needs assessment, crime prevention, economic, health impact, fire statement
  over seven storeys or 18 m, marketing, inclusive design, basement impact) can be appended where applicable.
review-status: unverified
field-status: {}
