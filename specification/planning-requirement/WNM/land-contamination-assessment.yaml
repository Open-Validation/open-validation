reference: land-contamination-assessment
local-authority: WNM
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contaminated land is suspected.
  - all:
    - application-type:
        in:
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
    - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: Part 2A, Environmental Protection Act 1990
source-text: Required where contaminated land is suspected. ... Require the necessary plans and documentation
  to support the submission, as relevant. The list includes, amongst other things, Flood Risk Assessment,
  Transport Assessment, Noise Assessment, Land Contamination Assessment.
must-include:
- item: Determines the existence or otherwise of contamination, its nature and the risks it poses, and
    whether these can be satisfactorily reduced to an acceptable level and by what means
  level: should
- item: Prepared by a competent professional
  level: must
confidence: medium
notes: From the council's list (adopted 5 February 2026), Environmental Protection and other application
  types, page 27, 41, 46. For Part 3 prior approvals (changes of use) the list asks for this 'as relevant'
  (page 41), shown as the council's discretion.
review-status: unverified
field-status: {}
