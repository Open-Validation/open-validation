reference: noise-assessment
local-authority: WNM
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential development or a sensitive use adjacent to a noise generating use such
        as industrial estates, major highways or rail lines.
  - condition:
      field: noise-generating-use
      value: true
      description: Potential noise generation that could affect its environs.
  - condition:
      field: plant-equipment
      value: true
      description: Plant or machinery that could affect its environs.
  - all:
    - application-type:
        in:
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
    - discretionary
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policies EP4 and QP3
source-text: All applications proposing residential development or a sensitive use adjacent to noise generating
  use such as industrial estates, major highways or rail lines; or an application proposing potential
  noise generation (e.g. plant or machinery) that could affect its environs. ... Require the necessary
  plans and documentation to support the submission, as relevant. The list includes, amongst other things,
  Flood Risk Assessment, Transport Assessment, Noise Assessment, Land Contamination Assessment.
must-include:
- item: Carried out by a suitably qualified person
  level: should
confidence: medium
notes: From the council's list (adopted 5 February 2026), Environmental Protection and other application
  types, page 27-28, 41, 48. For Part 3 prior approvals (changes of use) the list asks for this 'as relevant'
  (page 41), shown as the council's discretion.
review-status: unverified
field-status: {}
