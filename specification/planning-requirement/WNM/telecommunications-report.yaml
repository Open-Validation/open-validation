reference: telecommunications-report
local-authority: WNM
required-if:
  any:
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications applications.
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.rbwm.gov.uk/sites/default/files/2026-03/planning_national_and_local_validation_requirements_policy_20260304.pdf
policy: National Planning Policy Framework (NPPF); Borough Local Plan (BLP) Policy IF7
source-text: Only for telecommunications applications.
must-include:
- item: Outcome of any consultation with the local community, including nearby schools and colleges
  level: must
- item: Area of any search and sequential test
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification and information about the proposed development
  level: must
- item: 'Addition to an existing mast or base station: a statement self-certifying that cumulative exposure,
    when operational, will not exceed ICNIRP guidelines'
  level: must
  required-if: discretionary
- item: 'New mast or base station: evidence that erecting antennas on an existing building, mast or other
    structure was explored, and a statement self-certifying that ICNIRP guidelines will be met when operational'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 5 February 2026), Other Documents, page 31, 49. The two ICNIRP
  items depend on whether the proposal adds to an existing mast or is a new one; there is no field for
  that, so they show as discretionary.
review-status: unverified
field-status: {}
