reference: section-existing
local-authority: BOL
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development (below the major development thresholds).
    - any:
      - condition:
          field: new-build
          value: true
          description: The erection of new buildings.
      - condition:
          field: footprint-increase
          value: true
          description: Extensions of buildings.
  - condition:
      field: residential-extension
      value: true
      description: A house extension (not a rear extension of up to 4 metres at a terraced house).
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-P1 Sustainable Places
source-text: • All Major Development and Minor Development that would result in the erection of any new
  buildings or extensions of buildings • House Extensions (unless one of the exemptions below applies)
must-include:
- item: Existing and proposed site sections and finished floor and site levels at a scale of 1:50 or 1:100
  level: must
- item: Any existing residential property within 21 metres of any part of the new building or extension
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 82. 'Levels / Sections'. Not required for
  house extensions at terraced houses up to 4 metres projection, or where a brief statement confirms no
  level difference of more than 1 metre with any property within 21 metres. Instead of levels you can
  give a written justification that levels are not material; if it is missing or not accepted the application
  is likely to be returned.
review-status: unverified
field-status: {}
