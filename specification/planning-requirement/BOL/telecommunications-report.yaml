reference: telecommunications-report
local-authority: BOL
required-if:
  any:
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-C2 Digital Connectivity
source-text: • All proposals for telecommunications development, including Prior Notification applications
  under Part 24 of the Schedule 2 of the Town & Country Planning (General Permitted Development) Order
  1995 (as amended)
must-include:
- item: A signed declaration that the equipment and installation fully comply with ICNIRP requirements
  level: must
- item: Alternative sites rejected and why, including existing masts, structures and other buildings in
    the search area
  level: must
- item: Site type, area of search, structure details and dimensions, design reasons and technical information
    (frequency, modulation, power output, antenna height)
  level: should
- item: Technical justification, mast register check, pre-application and consultation details
  level: should
- item: A map showing the site in relation to schools and other telecommunications equipment nearby
  level: should
- item: Visual impact assessment where relevant
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 112. 'Telecommunications Justification'.
  The first two items are the minimum; the rest are recommended.
review-status: unverified
field-status: {}
