local-authority: BOL
name: Bolton Metropolitan Borough Council
region: North West
type: Metropolitan borough
review-status: unverified
validation-list:
  url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
  date: '2024-12-05'
  date-basis: 'audit: Adopted 05 December 2024 (Council approval 27 November 2024)'
  status: current
submission-standards:
- item: All plans and drawings accurately drawn to a conventional metric scale (such as 1:50 or 1:100)
    and true to the stated scale
  level: must
- item: A scale bar or dimensions on plans and drawings
  level: should
- item: No disclaimers such as 'not to scale' or 'do not scale' (except on perspective drawings)
  level: must
- item: A title box on each plan stating the address and proposal, the drawing title, the date, the scale
    and the drawing number, with revisions clearly identified
  level: should
- item: Where supporting documents contain personal or sensitive information, a redacted copy for publication
    and an unredacted copy
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 11
  notes: Grokbot's link is the current Bolton Local Validation Checklist 2024+ (adopted 5 Dec 2024), though
    the date is recorded as 1 Dec. The extraction mixes in the superseded 2022 draft. It wrongly shows
    no householder or LBC-specific requirements, misses the Green Belt Justification, Public Art and House
    Extension Justification items, and many triggers are navigation fragments or policy prose.
