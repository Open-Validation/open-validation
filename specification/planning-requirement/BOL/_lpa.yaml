local-authority: BOL
name: Bolton Metropolitan Borough Council
region: North West
type: Metropolitan borough
review-status: unverified
validation-list:
  url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
  date: '2024-12-05'
  date-basis: 'cover: ''Local Validation Checklist 2024+ Adopted 05 December 2024 Council Approval 27
    November 2024''. The council''s ''What do I need to submit?'' page (https://www.bolton.gov.uk/planning-applications-guidance/planning-7/2)
    links this checklist on 2026-11-06 and says it was ''updated and adopted on 5 December 2024, replacing
    the version we adopted in January 2023''; the planning downloads page lists no newer list and no consultation
    or adoption notice for a newer one was found.'
  status: current
submission-standards:
- item: All plans and drawings accurately drawn to a conventional metric scale (such as 1:50 or 1:100)
    and true to the stated scale
  level: must
- item: A scale bar or dimensions on plans and drawings
  level: should
- item: No disclaimers such as 'not to scale' or 'do not scale' (except on perspective drawings)
  level: must
- item: Measured dimensions on floor plans and elevation drawings
  level: should
- item: Where homes are within 25 metres of a proposed new building, the window-to-window or window-to-elevation
    interfaces shown
  level: should
- item: A title box on each plan stating the address and proposal, the drawing title, the date, the scale
    and the drawing number, with revisions clearly identified
  level: should
- item: Plans based on Ordnance Survey maps carry the appropriate Ordnance Survey copyright notice
  level: must
- item: Files named with the description of the document first (e.g. 'Site Location Plan 22 Acacia Avenue
    Bolton DWG 01-99-99-99-xx-01 rev D')
  level: must
- item: Where supporting documents contain personal or sensitive information (signatures, personal email
    addresses and phone numbers, payments), a redacted copy for publication and an unredacted copy
  level: should
- item: Files over the Planning Portal size limit reduced or split; if not possible, sent by WeTransfer
  level: should
- item: Each supporting document less than 10MB if sent by email
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current Bolton Local Validation Checklist 2024+ (adopted 5 Dec 2024),
    though the date is recorded as 1 Dec. The extraction mixes in the superseded 2022 draft. It wrongly
    shows no householder or LBC-specific requirements, misses the Green Belt Justification, Public Art
    and House Extension Justification items, and many triggers are navigation fragments or policy prose.
    Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
