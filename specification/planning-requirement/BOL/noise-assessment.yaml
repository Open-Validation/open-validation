reference: noise-assessment
local-authority: BOL
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: 'A potentially noise generating use: B2, B8, evening economy uses, E(a) retail over
        100 sq m, E(d), E(f), F2(c) or sui generis uses such as taxi businesses, scrap yards or waste
        disposal.'
  - condition:
      field: noise-sensitive-use
      value: true
      description: 'A noise sensitive use: residential (including conversion, subdivision and HMOs), new
        schools and hospitals.'
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential use.
    - site:
        in:
        - town-centre
        description: Within the Bolton town centre sub areas or the local centres of Blackrod, Farnworth,
          Horwich, Little Lever, Kearsley and Westhoughton.
  - all:
    - condition:
        field: mixed-use
        value: true
        description: A mixed use proposal.
    - condition:
        field: noise-generating-use
        value: true
        description: Includes noise generating uses.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Includes noise sensitive uses.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Extractor or cooling units or air source heat pumps.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of noise sensitive uses.
  - condition:
      field: night-time-operation
      value: true
      description: Would operate or involve any activities between 11pm and 7am.
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Bolton Core Strategy Policy CG4
source-text: '• All potentially noise generating developments including: o Class B2 Industrial o Class
  B8 Storage and Distribution o Evening economy uses such as pubs, clubs, bars, takeaways, casinos, cinemas,
  theatres and public performance o Class E(a) retail with more than 100 square metres floorspace o Class
  E(d) fitness, indoor sport and recreation o Class E(f) day nursery, creche and day centres o Class F2(c)
  outdoor sport and recreation o Other sui generis uses such as taxi business, scrap yards, minerals,
  vehicle breaking, waste disposal All the above developments will require a Noise Impact Assessment unless
  a robust justification and evidence is provided to demonstrate why a Noise Impact Assessment is not
  necessary in this instance as there are no sensitive uses nearby that are capable of being affected
  by the proposed development • All proposed noise sensitive uses including o Residential uses, including
  conversion, subdivision and houses in multiple occupancy o New schools and hospitals All the above developments
  will require a Noise Impact Assessment unless a robust justification and evidence is provided to demonstrate
  why a Noise Impact Assessment is not necessary in this instance as there are no potential noise generating
  uses nearby that are capable of affecting the proposed development • Proposed new residential uses within
  the boundaries of the Bolton town centre sub areas or within the local centres of Blackrod, Farnworth,
  Horwich, Little Lever, Kearsley and Westhoughton, as shown on the Allocations Map • Mixed use proposals
  comprising both noise generating and noise sensitive uses • Proposals that would involve the use of
  extractor or cooling units or air source heat pumps in the vicinity of noise sensitive uses • Proposals
  that would operate or involve any activities between the hours of 11pm and 7am'
must-include:
- item: Takes account of BS 8233:2014, BS 5228:2009 and BS 4142:2014+A1:2019
  level: must
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The existing noise environment, the potential noise sources and any mitigation; mitigation clearly
    shown on the plans
  level: should
- item: Sound power/pressure levels and likely resulting noise levels at the nearest noise sensitive properties
    for all noise-producing equipment and activities
  level: should
- item: Existing background noise levels at the relevant times
  level: should
- item: Where noise generating plant or equipment will be located
  level: should
- item: Delivery times and opening hours for commercial premises in noise sensitive areas
  level: should
- item: Full sound insulation details, entrances/exits and car parking for development adjoining (including
    below or above) homes
  level: should
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 86-88. The noise generating and noise sensitive
  triggers do not apply where robust justification and evidence show there are no sensitive uses (or noise
  sources) nearby. The list says the criteria cannot be exhaustive, so a discretionary part is included.
  Not required for house extensions.
review-status: unverified
field-status: {}
