reference: land-contamination-assessment
local-authority: BOL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - condition:
        field: new-build
        value: true
        description: New-build development.
    - condition:
        field: sensitive-end-use
        value: true
        description: Residential, schools or hospitals.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: sensitive-end-use
        value: true
        description: To residential, a school or a hospital.
    - condition:
        field: industrial-site
        value: true
        description: The land has previously been used for industrial purposes.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: A school or hospital.
    - condition:
        field: footprint-increase
        value: true
        description: An extension.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policies JP-S1, JP-S4.6 and JP-G3.6
source-text: • All Major Development • All Minor Development involving newbuild residential, schools or
  hospitals • Changes of use to residential, school or hospitals where the land has previously been used
  for industrial purposes • Extensions to schools or hospitals
must-include:
- item: 'A Phase 1 Preliminary Risk Assessment: desk top study, site reconnaissance, conceptual model
    and preliminary risk assessment, and recommendations for further investigation'
  level: must
- item: Carried out by or under the direction of a suitably qualified competent person; commercial internet
    searches are not enough
  level: must
- item: Conducted in accordance with Land Contamination Risk Management guidance
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 39-40. Not required for house extensions.
review-status: unverified
field-status: {}
