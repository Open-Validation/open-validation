reference: fire-statement
local-authority: BOL
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: • Buildings that are 18 metres or more in height, or 7 or more storeys - and • contain two
  or more dwellings or educational accommodation
must-include:
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How fire safety policies in relevant local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 56. A national requirement, included in
  the list for clarity.
review-status: unverified
field-status: {}
