reference: travel-plan
local-authority: BOL
required-if:
  any:
  - condition:
      field: convenience-retail-floorspace
      operator: '>'
      value: 800
      description: 'Food retail (E(a)): more than 800 square metres.'
  - condition:
      field: comparison-retail-floorspace
      operator: '>'
      value: 1500
      description: 'Non-food retail (E(a)): more than 1500 square metres.'
  - all:
    - condition:
        field: use-class
        value: E(c)
        description: Financial and professional services (E(c)).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 2500
        description: more than 2500 square metres.
  - condition:
      field: class-eg-floorspace
      operator: '>'
      value: 2500
      description: 'Business, office, light industrial (E(g)): more than 2500 square metres.'
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 4000
      description: 'General industrial (B2): more than 4000 square metres.'
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 5000
      description: 'Storage and distribution (B8): more than 5000 square metres.'
  - all:
    - condition:
        field: use-class
        value: F1(a)/F1(f)
        description: Schools (F1(a)) and places of worship (F1(f)).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 800
        description: more than 800 square metres.
  - all:
    - condition:
        field: use-class
        value: E(e)/E(f)
        description: Other non-residential institutions (E(e) and E(f)).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: more than 1000 square metres.
  - all:
    - condition:
        field: use-class
        value: E(d)
        description: Assembly and leisure (E(d)).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1500
        description: more than 1500 square metres.
  - all:
    - condition:
        field: use-class
        value: C2
        description: 'Residential institutions: hospitals, nursing homes (C2).'
    - condition:
        field: bedroom-count
        operator: '>'
        value: 50
        description: More than 50 beds.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: 'Dwelling houses (C3): more than 80 units.'
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in conformity with the adopted Development Plan (departure).
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-C8; Accessibility, Transport and Safety SPD
source-text: The thresholds for Transport Statements, Transport Assessments and Travel Plans are set out
  in the Accessibility, Transport and Safety SPD and are summarised below, updated for the 2020 changes
  to the Use Classes Order. Note that the thresholds apply equally to new buildings, conversions and extensions.
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 117-119. A Travel Plan goes with a Transport
  Assessment above the upper threshold of each use class, and for departures. The thresholds table (pages
  117-118) applies equally to new buildings, conversions and extensions. Not required for house extensions,
  or where evidence shows the impact on vehicle movements or parking would be zero. The rows on accidents
  and conflicts with vulnerable road users, significant freight or HGV movements and inadequate local
  transport infrastructure have no measurable threshold, so they are shown as discretionary.
review-status: unverified
