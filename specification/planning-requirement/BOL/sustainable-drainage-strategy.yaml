reference: sustainable-drainage-strategy
local-authority: BOL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 dwellings or more.
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 square metres or more of new floorspace.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Bolton Core Strategy Policy CG2.2(c); Places for Everyone Policy JP-S4
source-text: • All Major Development • All Minor Development within Flood Zones 2 and 3 • All Minor Development
  for 5 dwellings or more or creating 500 square metres or more new floorspace (Policy CG2.2(c), Bolton’s
  Core Strategy)
must-include:
- item: The completed NW SuDS Pro-Forma, with all the evidence it lists
  level: must
- item: A robust justification if the SuDS do not deliver multifunctional benefits
  level: must
  required-if: discretionary
- item: Evidence of engagement with the hierarchy of surface water discharge options
  level: must
- item: The maintenance standard and management arrangements for the lifetime of the development, and
    how they will be implemented
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 110. 'SuDS Drainage Strategy'. Not required
  for house extensions.
review-status: unverified
field-status: {}
