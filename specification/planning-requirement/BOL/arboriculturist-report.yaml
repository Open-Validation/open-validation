reference: arboriculturist-report
local-authority: BOL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site or within 10 metres of the red edge with a stem diameter greater
          than 75mm at 1.5 metres above ground.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedges within the site.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-G7 Trees and Woodland
source-text: • All development (including house extensions) where there are trees within the site or within
  10 metres of the red edge of the site with a stem diameter of greater than 75mm when measured at 1.5
  metres above ground level • All development (including house extensions) where there are hedges within
  the site
must-include:
- item: To the standards of BS5837:2012, with a baseline tree survey (including hedges), a Tree Constraints
    Plan and an assessment of the impact on those trees and hedges
  level: must
- item: A Mitigation Planting Plan based on the '2 for 1' principle of PfE Policy JP-G7.12
  level: must
  required-if:
    condition:
      field: tree-removal
      value: true
      description: The assessment shows trees need to be removed.
- item: A Tree Protection Plan (BS5837:2012 section 5.5) within the assessment
  level: must
  required-if: discretionary
- item: An Arboricultural Method Statement
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 122-123. Not required for advertisement
  consent, lawful development certificates, larger home extension notifications, listed building consent,
  permission in principle or prior approval. Instead, a letter from a qualified arborist can confirm there
  are no trees or hedges of merit that could be affected; applications with neither are returned. The
  Tree Protection Plan and Method Statement are needed when the assessment shows protection or a precautionary
  approach is needed (discretionary).
review-status: unverified
field-status: {}
