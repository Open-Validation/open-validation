reference: lighting-assessment
local-authority: BOL
required-if:
  any:
  - condition:
      field: external-space
      value: true
      description: External communal areas such as parking, loading areas or amenity space with an area
        greater than 50 square metres.
  - condition:
      field: use-class
      value: F2(c)
      description: Development for outdoor recreation and sport.
  - condition:
      field: floodlighting
      value: true
      description: Development proposing floodlights.
  - condition:
      field: near-watercourse
      value: true
      description: Within 10 metres of a main river or body of open water.
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Within 10 metres of a SSSI or a Site of Biological Importance.
  - site:
      in:
      - green-belt
      description: Development within the Green Belt.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-P1 Sustainable Places
source-text: • Development with external communal areas such as parking, loading areas, amenity space
  with an area greater than 50 square metres • Development for outdoor recreation and sport • Development
  proposing floodlights • Development within 10 metres of a main river, body of open water, SSSI or an
  SBI • Development within the Green Belt
must-include:
- item: The type of light fixing (for example wall mounted or free-standing columns, wattage and manufacturer)
  level: must
- item: A site layout showing the lighting units and the illumination and spread as LUX levels, including
    outside the site, with the nearest residential properties shown
  level: must
- item: The proposed hours of use
  level: must
- item: Measures to limit the spread of light, such as cowls or angled heads
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 84. Instead, you can confirm in writing
  that no lighting will be installed (a condition may be imposed). Not required for house extensions.
review-status: unverified
field-status: {}
