reference: viability-assessment
local-authority: BOL
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: Residential development (including conversions) of 15 or more units.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The contributions required by the Developer Contributions SPD will not be met in
          full.
  - condition:
      field: energy-policy-shortfall
      value: true
      description: The applicant relies on viability to show it is not possible to comply with PfE Policy
        JP-S2 (carbon and energy).
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Bolton Core Strategy Policy IPC1; Developer Contributions SPD; Places for Everyone Policy JP-S2
source-text: • Draft Heads of Terms of a Section 106 agreement, showing that the contributions required
  by the Developer Contributions SPD will be partially met, together with a Viability Assessment justifying
  the shortfall and an agreement in principle (subject to a quote) to pay the cost of the viability assessment
  being independently assessed
must-include:
- item: An agreement in principle (subject to a quote) to pay for the viability assessment to be independently
    assessed
  level: must
confidence: medium
notes: 'From the council''s list (adopted 5 December 2024), page 95, 107. Planning obligations (outside
  Bolton town centre): for 15 or more units you must give either draft Heads of Terms meeting the SPD
  contributions in full, or Heads of Terms for part with a Viability Assessment, or a Viability Assessment
  showing why none can be met; otherwise the application is returned. A Viability Assessment is also one
  of three ways to meet the Carbon & Energy requirement. Heads of Terms are in the unmapped list.'
review-status: unverified
field-status: {}
