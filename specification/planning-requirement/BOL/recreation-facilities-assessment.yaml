reference: recreation-facilities-assessment
local-authority: BOL
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss, or partial loss, of existing open space (including informal open space), sports
        and recreational buildings and land (including playing fields).
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policies JP-G6 and JP-P7; Bolton Core Strategy Policy CG1.4; NPPF paragraph
  103
source-text: • All Major Development and Minor Development that would result in the loss, or partial loss,
  of existing open space (including informal open space), sports and recreational buildings and land (including
  playing fields)
must-include:
- item: A Needs and Opportunities Assessment showing that the open space, buildings or land is surplus,
    or will be replaced by equivalent or better provision, or that the development is for alternative
    sports and recreation provision whose benefits clearly outweigh the loss
  level: must
- item: How Objectives 8 and 9, paragraphs 8.49 to 8.52 and Policies JP-G6 and JP-P7 of Places for Everyone,
    and Core Strategy Policy CG1.4, have been taken into account
  level: must
- item: Follows Sport England guidance if the site is used for sport
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 92.
review-status: unverified
field-status: {}
