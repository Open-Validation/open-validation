reference: energy-statement
local-authority: BOL
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development (below the major development thresholds).
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: Creates new floorspace.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use, by conversion or subdivision.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates new dwellings.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policies JP-S2 and JP-S3
source-text: • All Major Development and Minor Development that creates new floorspace • All changes of
  use that create new dwellings, either by conversion or subdivision
must-include:
- item: A Carbon and Energy Statement showing how PfE Policies JP-S2 and S3 have been complied with, OR
    a robust justification why compliance is not practicable, OR a Viability Assessment (see viability-assessment)
  level: must
- item: Does not reserve most consideration of these issues to the Building Regulations stage
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 107-108. 'Sustainability – Carbon & Energy
  Statement'. Applications that meet the criteria without one of the three elements are invalid. Not required
  for house extensions.
review-status: unverified
field-status: {}
