reference: bng-metric
local-authority: BOL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Schedule 7A of the Town and Country Planning Act 1990 (as inserted by Schedule 14 of the Environment
  Act 2021); Places for Everyone Policy JP-G8
source-text: • All Major and Minor Development that does not benefit from one of the exemptions to the
  requirements for Biodiversity Net Gain • Alternatively, if an exemption is claimed, the reason for the
  exemption must be stated on the application form and evidence provided to demonstrate the exemption
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The completed metric calculation tool showing the pre-development biodiversity value on the date
    of application (or proposed earlier date), with the publication date of the metric used
  level: must
- item: 'Where an earlier date is proposed: that date and the reasons for it'
  level: must
  required-if: discretionary
- item: A statement on any activities before that date that lost onsite biodiversity value ('degradation'),
    with the date before them, the value on that date, the completed metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
- item: A draft Biodiversity Gain Plan
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 34-35. The list asks for this from 'All
  Major and Minor Development' that is not exempt; by law householder and other exempt applications are
  exempt, so this follows the biodiversity gain condition. If you claim an exemption, give the reason
  on the application form with evidence, or the application is returned as invalid.
review-status: unverified
field-status: {}
