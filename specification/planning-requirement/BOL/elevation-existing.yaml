reference: elevation-existing
local-authority: BOL
required-if:
  condition:
    field: external-alterations
    value: true
    description: The proposal changes one or more elevations of an existing building.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
source-text: All elevations of proposed development must be shown, with corresponding existing elevation
  drawings. For applications that propose no changes to any elevations, and clearly state that this is
  the case, elevation drawings are not required
must-include:
- item: Measured dimensions
  level: should
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 20. One of the general rules that apply
  to every application. Existing elevations are needed to match each proposed elevation; none are needed
  where the application clearly states that no elevation changes.
review-status: unverified
field-status: {}
