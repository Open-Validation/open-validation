reference: habitat-baseline
local-authority: BOL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Schedule 7A of the Town and Country Planning Act 1990 (as inserted by Schedule 14 of the Environment
  Act 2021); Places for Everyone Policy JP-G8
source-text: • plan(s), drawn to an identified scale and showing the direction of North, showing onsite
  habitat existing on the date of application (or earlier proposed date), including any irreplaceable
  habitat (if applicable)
must-include:
- item: Drawn to an identified scale, showing the direction of North
  level: must
- item: Onsite habitat on the date of application (or earlier proposed date), including any irreplaceable
    habitat
  level: must
- item: A UK Hab map
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 34-35. The list asks for this from 'All
  Major and Minor Development' that is not exempt; by law householder and other exempt applications are
  exempt, so this follows the biodiversity gain condition. If you claim an exemption, give the reason
  on the application form with evidence, or the application is returned as invalid.
review-status: unverified
