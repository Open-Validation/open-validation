reference: town-centre-impact-assessment
local-authority: BOL
required-if:
  all:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: A retail or leisure use (including changes of use) of more than 2,500 square metres
        (including ancillary storage).
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside Bolton's allocated Shopping Areas (Bolton Town Centre, Local Town Centres,
        District Centres, Local Shopping Centres).
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: NPPF paragraphs 90 to 95
source-text: • All developments (including changes of use) for a retail or leisure use that involve more
  than 2,500 square metres of floor space (including ancillary storage etc.) and are proposed outside
  of any of Bolton’s allocated Shopping Areas (Bolton Town Centre, Local Town Centres, District Centres,
  Local Shopping Centres) as defined on the Allocations Plan
must-include:
- item: Takes account of the Government's guidance on sequential and impact assessments
  level: should
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 115. The Sequential Assessment (main town
  centre uses over 250 sq m outside the shopping areas) is in the unmapped list.
review-status: unverified
field-status: {}
