reference: heritage-statement
local-authority: BOL
required-if:
  any:
  - site:
      in:
      - conservation-area
      description: All development (including house extensions and partial or total demolition) within
        a conservation area.
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-P2 Heritage; area based policies of Bolton's Core Strategy (RAx,
  OAx)
source-text: • All development (including house extensions and partial or total demolition) within a Conservation
  Area • All applications for Listed Building Consent • All applications affecting the setting of a Listed
  Building or a Conservation Area
must-include:
- item: A description of the character and significance of any heritage assets likely to be affected
  level: must
- item: A description of the proposal and how it has been designed to respond to its heritage context
  level: must
- item: An assessment of the likely impact on the character and significance of the affected heritage
    assets
  level: must
confidence: medium
notes: 'From the council''s list (adopted 5 December 2024), page 69-70. Applications ''affecting the setting
  of a Listed Building or a Conservation Area'' are shown as discretionary: the list says it is difficult
  to describe when a development affects a setting and advises pre-application advice. The level of detail
  should be proportionate.'
review-status: unverified
