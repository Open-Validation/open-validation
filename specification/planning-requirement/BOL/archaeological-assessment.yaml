reference: archaeological-assessment
local-authority: BOL
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: Excavation or the construction of new buildings.
  - all:
    - ref: major-development
    - condition:
        field: former-textile-mill
        value: true
        description: Conversion or change of use of a building formerly used by the textile industry (typically
          'mills'), or substantial demolition, excavation or new buildings within its curtilage.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - any:
      - site:
          in:
          - conservation-area
          description: Within a conservation area.
      - site:
          in:
          - listed-building
          description: Within the curtilage of a listed building.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: Excavation or the construction of new buildings.
  - all:
    - site:
        in:
        - scheduled-monument
        description: Within 100 metres of one of Bolton's 4 scheduled monuments.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: Excavation or the construction of new buildings.
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-P2 Heritage
source-text: • All Major Development that would result in demolition, excavation or the construction of
  new buildings • All Major Development involving the conversion or change of use of a building formerly
  used by the textile industry (typically “mills”) or that would result in substantial demolition, excavation
  or the construction of new buildings within the curtilage of one of these buildings • All Minor Development
  within a Conservation Area or within the curtilage of a Listed Building that would result in demolition,
  excavation or the construction of new buildings • Development within 100 metres of one of Bolton’s 4
  Scheduled Monuments (site at Arley Hall, Ringley Old Bridge, Chequerbent Embankment and a round cairn
  280m west of Old Harpers Farm, Horwich) that would result in demolition, excavation or the construction
  of new buildings • Cases where Archaeological Assessment has been recommended at the pre-application
  stage Alternatively, evidence can be provided that the site is not likely to be archaeologically sensitive
  or that the proposed development is not likely to have any impact on archaeological significance, either
  by written confirmation from Greater Manchester Archaeological Advisory Service or evidence of consultation
  with the Historic Environment Record
must-include:
- item: A Written Scheme of Investigation carried out by a competent professional, following Chartered
    Institute for Archaeologists standards and guidance
  level: should
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 31-32. 'Recommended at the pre-application
  stage' is shown as discretionary. Instead of an assessment, you can give evidence (written confirmation
  from the Greater Manchester Archaeological Advisory Service, or of consultation with the Historic Environment
  Record) that the site is not archaeologically sensitive.
review-status: unverified
field-status: {}
