reference: planning-statement
local-authority: BOL
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Development that is not in accordance with the Development Plan (departures).
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: NPPF paragraphs 41 to 43; Bolton Council's Statement of Community Involvement
source-text: • All Major Development • Development that is not in accordance with the Development Plan
  (Departures) • Cases where a Planning Statement has been recommended at the pre-application stage
must-include:
- item: 'Policy context: how the proposal accords with the development plan and other material considerations'
  level: must
- item: 'Validation requirements: works methodically through the checklist, with a robust justification
    where a threshold is met but the information is not given'
  level: must
- item: 'Recommendations adopted: how the recommendations of the submitted documents have been adopted,
    with justification where not'
  level: must
- item: 'Community involvement: the outcome of any consultation, or a robust justification where none
    took place'
  level: must
- item: 'Pre-application engagement: how advice has been taken into account, or justification where it
    was not sought or followed'
  level: must
- item: Planning history of the site, including previous applications and present and previous uses
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 98-99. 'Recommended at the pre-application
  stage' is discretionary. Strongly recommended, but not compulsory, for minor development; for house
  extensions a brief statement on the House Extensions SPD is recommended.
review-status: unverified
field-status: {}
