reference: transport-assessment
local-authority: BOL
required-if:
  any:
  - condition:
      field: convenience-retail-floorspace
      operator: '>='
      value: 250
      description: 'Food retail (E(a)): at least 250 square metres.'
  - condition:
      field: comparison-retail-floorspace
      operator: '>='
      value: 800
      description: 'Non-food retail (E(a)): at least 800 square metres.'
  - all:
    - condition:
        field: use-class
        value: E(c)
        description: Financial and professional services (E(c)).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: at least 1000 square metres.
  - condition:
      field: class-eg-floorspace
      operator: '>='
      value: 1500
      description: 'Business, office, light industrial (E(g)): at least 1500 square metres.'
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: 'General industrial (B2): at least 2500 square metres.'
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 3000
      description: 'Storage and distribution (B8): at least 3000 square metres.'
  - all:
    - condition:
        field: use-class
        value: F1(a)/F1(f)
        description: Schools (F1(a)) and places of worship (F1(f)).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 250
        description: at least 250 square metres.
  - all:
    - condition:
        field: use-class
        value: E(e)/E(f)
        description: Other non-residential institutions (E(e) and E(f)).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: at least 500 square metres.
  - all:
    - condition:
        field: use-class
        value: E(d)
        description: Assembly and leisure (E(d)).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: at least 500 square metres.
  - all:
    - condition:
        field: use-class
        value: C2
        description: 'Residential institutions: hospitals, nursing homes (C2).'
    - condition:
        field: bedroom-count
        operator: '>='
        value: 30
        description: At least 30 beds.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 'Dwelling houses (C3): at least 50 units.'
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in conformity with the adopted Development Plan (departure).
  - condition:
      field: traffic-movements-peak-hour
      operator: '>='
      value: 30
      description: 30 or more two-way vehicle movements in any hour.
  - condition:
      field: traffic-movements-daily
      operator: '>='
      value: 100
      description: 100 or more two-way vehicle movements per day.
  - condition:
      field: parking-spaces
      operator: '>='
      value: 100
      description: 100 or more parking spaces.
  - site:
      in:
      - air-quality-management-area
      description: Within or adjacent to an Air Quality Management Area (Transport Statement).
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-C8; Accessibility, Transport and Safety SPD
source-text: The thresholds for Transport Statements, Transport Assessments and Travel Plans are set out
  in the Accessibility, Transport and Safety SPD and are summarised below, updated for the 2020 changes
  to the Use Classes Order. Note that the thresholds apply equally to new buildings, conversions and extensions.
must-include:
- item: A Transport Statement between the lower and upper thresholds; a Transport Assessment above the
    upper thresholds and for the non-use-class triggers marked 'Transport Assessment'
  level: must
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 117-119. Covers both Transport Statements
  and Transport Assessments. The thresholds table (pages 117-118) applies equally to new buildings, conversions
  and extensions. Not required for house extensions, or where evidence shows the impact on vehicle movements
  or parking would be zero. The rows on accidents and conflicts with vulnerable road users, significant
  freight or HGV movements and inadequate local transport infrastructure have no measurable threshold,
  so they are shown as discretionary.
review-status: unverified
field-status: {}
