reference: biodiversity-survey-report
local-authority: BOL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Inside or within 50 metres of a Site of Special Scientific Interest or a Site of
          Biological Importance (Allocations Plan).
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - any:
      - condition:
          field: near-watercourse
          value: true
          description: Inside or within 10 metres of a canal.
      - site:
          in:
          - green-corridor
          - flood-risk-zone
          description: Inside or within 10 metres of a Green Corridor or Flood Zones 2 and 3 (Allocations
            Plan).
  - all:
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: roof-alteration
          value: true
          description: Works to the roof of a building (including houses).
    - condition:
        field: potential-roost-features
        value: true
        description: The site or building has features Natural England's standing advice links with bats
          (little artificial light, close to woodland or water, uneven roof tiles, cracks and crevices,
          hanging tiles or timber cladding...).
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policies JP-G2 and JP-G8
source-text: • All Major Development (alternatively, for developments and sites where the potential for
  ecological impacts is low, a letter can be provided from a competent ecologist confirming that in their
  professional opinion, the impact on ecological considerations is likely to be very low, together with
  the reasons for their view) • Minor development inside or within 50 metres of a Site of Special Scientific
  Interest or a Site of Biological Importance, as shown on the Allocations Plan • Minor development inside
  or within 10 metres of a Canal, a Green Corridor or Flood Zones 2 and 3 as shown on the Allocations
  Plan • Cases where Ecological Assessment or a survey for protected species has been recommended at the
  pre-application stage
must-include:
- item: A Preliminary Ecological Appraisal following best practice guidance (for example CIEEM's)
  level: should
confidence: medium
notes: 'From the council''s list (adopted 5 December 2024), page 46-47. For major development where ecological
  impacts are likely to be low, a letter from a competent ecologist giving reasons can be provided instead.
  ''Recommended at the pre-application stage'' is discretionary, and the list says the criteria cannot
  be exhaustive, so a survey may also be asked for after submission. The bat part comes from the ''Special
  Advice Relating to Bats'' (pages 46-47): ''A bat survey should be provided for development that would
  involve demolition or works to the roof of a building (including houses) in one of these types of location.'''
review-status: unverified
field-status: {}
