reference: landscaping-plan
local-authority: BOL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - condition:
        field: new-build
        value: true
        description: Would result in a new building.
    - any:
      - site:
          in:
          - town-centre
          - regeneration-area
          description: Within Bolton Town Centre or a Renewal Area (RA1 Inner Bolton, RA2 Farnworth, RA3
            Breightmet).
      - condition:
          field: classified-road
          value: true
          description: The site fronts a classified road.
      - site:
          in:
          - conservation-area
          description: Within a conservation area.
  - discretionary
source-url: https://www.bolton.gov.uk/downloads/file/4686/local-validation-checklist
policy: Places for Everyone Policy JP-S1 Sustainable Places; Bolton Core Strategy RA1.16
source-text: • All Major Development • All Minor Development within Bolton Town Centre or within a Renewal
  Area (RA1 Inner Bolton, RA2 Farnworth, RA3 Breightmet) that would result in a new building • All Minor
  Development on sites that front a Classified Road that would result in a new building • All Minor Development
  within a Conservation Area that would result in a new building
must-include:
- item: A full detailed hard and soft landscape scheme
  level: must
- item: North point and drawing scale
  level: must
- item: Existing and proposed ground levels (spot heights, contours and sections as appropriate) and any
    proposed retaining structures
  level: must
- item: Existing vegetation and other hard and soft landscape features, what will be retained or removed,
    and how they will be protected during construction
  level: must
- item: Proposed surface treatment and means of enclosure; car parking layouts; vehicle and pedestrian
    access and circulation areas; hard surfacing materials, structures and ancillary objects
  level: must
- item: How proposed and existing services above and below ground have been taken into account
  level: must
- item: 'A Landscape Management Plan: areas of management responsibility, long-term design objectives,
    maintenance schedules, and a commitment to replace dead or defective planting for at least 5 years'
  level: must
- item: Improvements to Biodiversity Net Gain
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
- item: 'Topsoil: proposed depths, quality of imported topsoil, and soil additives'
  level: must
- item: 'Planting details: accurate plant names, sizes, numbers, densities and planting methods for trees,
    shrubs, bulbs, wildflowers and herbaceous plants; staking, tree pits and protection for trees'
  level: must
- item: Grass seeding (supplier, seed type and sowing rate) and turfing (supplier, quality and method
    of laying)
  level: must
- item: References to current relevant British Standards
  level: should
confidence: medium
notes: From the council's list (adopted 5 December 2024), page 77-80. A landscape scheme 'may also be
  requested' for other sites (main road frontages, near public rights of way, or affecting the setting
  of a listed building or registered park), shown as discretionary. The Landscape Visual Impact Assessment
  for major development in the Green Belt is in the unmapped list.
review-status: unverified
field-status: {}
