reference: archaeological-assessment
local-authority: NEA
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves disturbance of the ground.
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: Within historic cores, including Newark's Historic Core, as defined on the Allocations
          and Development Management DPD maps.
    - all:
      - condition:
          field: site-allocation
          value: true
          description: An allocated site.
      - discretionary
    - site:
        in:
        - scheduled-monument
        description: In close proximity to a Scheduled Ancient Monument.
    - site:
        in:
        - battlefield
        description: In close proximity to the Battlefield at East Stoke.
    - condition:
        field: church-curtilage
        value: true
        description: In close proximity to church yards.
    - site:
        in:
        - historic-environment-record
        description: Containing or close to known undesignated archaeological remains on the Nottinghamshire
          Historic Environment Record.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Planning Practice Guidance
source-text: 'Statements will be required for all proposals involving the disturbance of ground within
  an area of known archaeological interest. This includes: - • Sites within historic cores, including
  Newark’s Historic Core, as defined by the Newark and Sherwood District Council’s adopted Allocations
  and Development Management DPD maps • Certain allocated sites, as defined by the Newark and Sherwood
  District Council’s adopted Allocations and Development Management DPD • Sites in close proximity to
  a Scheduled Ancient Monument • Sites in close proximity to the Battlefield at East Stoke • Sites in
  close proximity to church yards • Sites containing or close to known undesignated archaeological remains
  as identified on the Nottinghamshire Historic Environment Record'
must-include:
- item: Carried out by a suitably qualified person (accredited by the Chartered Institute for Archaeologists
    or equivalent)
  level: must
- item: An appropriate desk-based assessment
  level: must
- item: A field evaluation where necessary
  level: must
  required-if: discretionary
- item: Plans showing historic features, listed buildings and structures, registered parks and gardens,
    registered battlefields and scheduled ancient monuments
  level: must
- item: An analysis of the archaeological, historic and character significance, with the principles of
    and justification for the proposed work
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 12. Part 3 item 5. Only 'certain' allocated
  sites need one (the DPD says which), so that part is 'discretionary'. 'Close to church yards' is shown
  with the church-curtilage field.
review-status: unverified
field-status: {}
