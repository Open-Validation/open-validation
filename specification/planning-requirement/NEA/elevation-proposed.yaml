reference: elevation-proposed
local-authority: NEA
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to the exterior of existing buildings, including changes of use with external
        alterations.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications proposing new buildings or alterations to the exterior of existing
  buildings, including changes of use where external alterations are proposed.
must-include:
- item: Drawn to an appropriate metric scale (for example 1:50 or 1:100), annotated with the scale and
    paper size (e.g. 1:50 paper size A3), or with an appropriate scale bar
  level: must
- item: The proposed works in relation to what is already there and the height of buildings above ground
    level
  level: must
- item: The proposed building materials and the style, materials and finish of windows and doors
  level: must
- item: Any blank elevations
  level: must
- item: 'Where an elevation joins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: must
- item: The same orientation and scale as the existing elevations
  level: must
- item: Individual drawing numbers and, where applicable, revision numbers
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 7-8. Part 2 'Proposed Elevations'.
review-status: unverified
field-status: {}
