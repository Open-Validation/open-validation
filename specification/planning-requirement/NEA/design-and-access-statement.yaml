reference: design-and-access-statement
local-authority: NEA
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a Conservation Area (the designated area in the district).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floor space created of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and Access Statements are required for: (a) development which is major development;
  or (b) development in a designated area [in our District this means a Conservation Area] where the proposed
  development consists of: (i) the provision of one or more dwellinghouses; or (ii) the provision of a
  building or buildings where the floor space created by the development is 100 square metres or more;
  or (iii) applications for listed building consent.'
must-include:
- item: The design principles and concepts applied to the development
  level: should
- item: The steps taken to appraise the context and how the design takes it into account
  level: should
- item: The policy adopted as to access, and how access policies in local development documents have been
    taken into account
  level: should
- item: Any consultation on access and how its outcome has been taken into account
  level: should
- item: How any specific issues which might affect access have been addressed
  level: should
- item: 'For listed building consent: the design principles applied to scale, layout and appearance; the
    significance of the heritage assets affected and the contribution of their setting; any consultation
    and how it informed the works; and how access issues have been addressed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Where planning and listed building consent applications are made in parallel, a single combined
    statement
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 3-4. Part 1 'Design and Access Statement'
  and 'Design and Access Statements for Listed Buildings'.
review-status: unverified
field-status: {}
