reference: daylight-sunlight-assessment
local-authority: NEA
required-if: discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: BRE guidance
source-text: Required for major applications where there is a potential adverse impact upon the current
  levels of sunlight/daylight enjoyed by adjoining properties or buildings, including associated gardens
  or amenity space. Applications where the application site itself is subject to potential adverse impact
  from adjoining buildings or features or where one part of the development is affected by another part
  of the same development.
must-include:
- item: A daylight, vertical sky component, sunlight availability and shadow study
  level: must
- item: Uses BRE guidance
  level: should
- item: The existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties
  level: must
- item: Measures to mitigate the expected impact
  level: must
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), page 18. Part 3 item 14. Shown as ''discretionary'':
  it depends on a ''potential adverse impact'', for major applications and for sites affected by adjoining
  buildings.'
