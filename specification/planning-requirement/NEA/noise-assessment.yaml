reference: noise-assessment
local-authority: NEA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Developments with the potential to generate noise (e.g. industrial units, external
        air conditioning/ventilation, workshops, nurseries, nightclubs, pubs, restaurants, schools, outdoor
        sports facilities).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Development next to an existing noise source (e.g. an industrial site, a busy road
        or railway line).
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Relevant British Standards and good practice guidance
source-text: Proposed developments that have the potential to generate noise, for example, industrial
  units, installation of external air conditioning and ventilation / exhaust system / flue units, workshops,
  day nurseries, nightclubs, public houses, restaurants/takeaways, schools/colleges, outdoor sports facilities
  etc. • Proposed developments located next to an existing noise source, for example, next to an industrial
  site, a busy road, or railway line.
must-include:
- item: Existing background noise levels measured over 24 hours, including cumulative levels of existing
    units
  level: must
- item: Proposed noise levels, including cumulative levels of all proposed units
  level: must
- item: Proposed noise mitigation measures
  level: must
- item: The manufacturer's specification of any equipment to be installed, altered or replaced
  level: must
- item: The method used and examples of the calculations and assumptions
  level: must
- item: Completed by a qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 31. Part 3 item 27.
review-status: unverified
field-status: {}
