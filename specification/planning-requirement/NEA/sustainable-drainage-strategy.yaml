reference: sustainable-drainage-strategy
local-authority: NEA
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: National Planning Practice Guidance; Building Regulations Approved Document H
source-text: • All major applications • Applications that could increase flood risk on site or elsewhere
must-include:
- item: A metric scaled plan of the existing site and a scaled topographical level survey to metres above
    ordnance datum
  level: must
- item: Scaled plans of the proposed layout identifying the footprint of the area being drained
  level: must
- item: Existing and proposed controlled discharge rates for 1 in 1 year and 1 in 100 year events (with
    climate change), based on the greenfield runoff rate
  level: must
- item: The proposed attenuation storage volume
  level: must
- item: Proposed SuDS measures with a design statement on managing surface water close to its source
  level: must
- item: Geological information including borehole logs, depth to water table and/or infiltration test
    results
  level: must
- item: Overland flow routes for exceedance events
  level: must
- item: A drainage hierarchy assessment explaining why any options were discounted
  level: must
- item: A management plan for maintenance and adoption for the lifetime of the development
  level: must
- item: 'For major development connecting foul drainage to the public sewer: the impact on the public
    sewer infrastructure'
  level: must
  required-if:
    ref: major-development
- item: 'For non-mains foul drainage: a Foul Drainage Assessment Form; a percolation test for treatment
    plants (unless draining to a watercourse); a full impact assessment for septic tanks and cesspools'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: The proposal uses a non-mains foul drainage system.
- item: 'Near or affecting an open watercourse or culvert: a plan showing its location and the impact
    of surface water discharge downstream'
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: Close to or affecting an open watercourse or culvert.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 18-20. Part 3 item 15, 'Drainage (SuDS) -
  Surface Water Drainage, and Foul Drainage'. 'Could increase flood risk' is a judgement, so that part
  is 'discretionary'. The list notes there are no designated critical drainage areas in the district.
review-status: unverified
field-status: {}
