reference: application-form
local-authority: NEA
required-if:
  always: true
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Always required: • Application Form'
must-include:
- item: Description as accurate and concise as possible, including only the elements that need permission
  level: should
- item: For listed building applications, a detailed description of the works
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: For changes of use, the use it is changing from and to (with the use classes if known)
  level: should
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use.
- item: Where development has already taken place, the words 'retention of'
  level: should
  required-if:
    condition:
      field: retrospective
      value: true
      description: Development has already taken place.
- item: For a revision of an earlier approved scheme, this made clear with the earlier reference
  level: should
  required-if:
    condition:
      field: amends-approved-plans
      value: true
      description: The application revises an earlier approved scheme.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 1, 49-57. Part 1 'Application Forms' and Part
  4, which lists the application form as always required for every application type.
review-status: unverified
field-status: {}
