reference: transport-assessment
local-authority: NEA
required-if: discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Planning Practice Guidance; Nottinghamshire County Council Highway Design Guide
source-text: 'All developments that generate significant amounts of transport movement should be supported
  by a Transport Statement or Transport Assessment. This includes: - • Those sites identified within the
  Amended Core Strategy (March 2019) or Allocations & Development Plan Document (July 2013) [ or as may
  be amended] • Sites near to environmental designations or sensitive areas (such as Special Protection
  Area) • Cumulative impact of multiple development.'
must-include:
- item: 'Scope to consider: the development and access across all modes; neighbouring uses and road network;
    existing public transport; travel characteristics; committed development trips; current traffic flows;
    accident records; environmental impacts; accessibility measures; parking; mitigation'
  level: should
- item: An assessment against Active Travel England's planning application toolkit criteria
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 dwellings or more.
    - condition:
        field: floorspace
        operator: '>='
        value: 7500
        description: 7,500 sq m of floorspace or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 5
        description: Site area of 5 hectares or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 5
        description: Site area of 5 hectares or more.
- item: An assessment of bus stop infrastructure, including bus stop locations and walk distances with
    isochrone plans against the County Highway Design Guide
  level: must
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), page 39-40. Part 3 item 39. Shown as ''discretionary'':
  ''significant amounts of transport movement'' (including allocated sites, sites near sensitive areas
  such as the SPA, and cumulative impact) has no numeric threshold in the list.'
review-status: unverified
field-status: {}
