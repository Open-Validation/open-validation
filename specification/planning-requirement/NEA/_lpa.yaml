submission-standards:
- item: Plans drawn to an appropriate metric scale (for example 1:50 or 1:100), annotated accordingly
    and including the paper size (e.g. 1:50 paper size A3), or drawn with the appropriate scale bar
  level: must
- item: Drawings include individual drawing numbers and, where applicable, revision numbers
  level: must
- item: Applications submitted electronically via the Planning Portal where possible (forms can also be
    sent by post or email)
  level: should
- item: 'Invalid applications: the information must be supplied within 21 working days, then a further
    7 working days, or the application and fee (minus an administration fee of at least £25 or 10%) are
    returned'
  level: must
