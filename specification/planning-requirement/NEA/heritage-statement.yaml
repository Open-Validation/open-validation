reference: heritage-statement
local-authority: NEA
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: Sites within the setting of a listed building, or in or within the setting of a conservation
        area, a scheduled ancient monument or a registered park and garden.
  - site:
      in:
      - locally-listed-building
      description: Affecting non-designated heritage assets (including local listing).
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Historic England Good Practice Advice
source-text: 'All applications affecting heritage assets and/or their setting. A heritage asset is defined
  as “A building, monument, site, place, area, or landscape identified as having a degree of significance
  meriting consideration in planning decisions, because of its heritage interest. Heritage asset includes
  designated heritage assets and assets identified by the local planning authority (including local listing).”
  A Heritage Impact Assessment will always be required for the following as they relate to designated
  heritage assets: • Listed building consent applications • Planning permission applications for sites
  within the setting of a listed building • Planning permission applications for sites/buildings in or
  within the setting of a conservation area • Planning permission applications for sites in or within
  the setting of a scheduled ancient monument • Planning permission applications for sites in or within
  the setting of registered parks and gardens • Planning permission for relevant demolition in a conservation
  area.'
must-include:
- item: A description of the significance of the heritage asset and/or its setting, proportionate to its
    significance and the potential impact
  level: must
- item: How the significance (including setting) will be affected, the site's contribution, avoidance
    or mitigation of harm, and enhancement opportunities
  level: must
- item: 'For larger scale schemes: written by a suitably qualified person, with the author''s name and
    qualifications'
  level: must
  required-if: discretionary
- item: Alterations or replacement of doors and windows shown on separate plans at 1:10, 1:5 or 1:1
  level: must
  required-if:
    condition:
      field: openings-alteration
      value: true
      description: Alterations to or replacement of doors and windows.
- item: Addresses archaeological impacts where buried archaeology could be disturbed
  level: must
  required-if:
    condition:
      field: ground-disturbance
      value: true
      description: Potential to disturb buried archaeology.
- item: The Historic Environment Record consulted, and colour photographs of the areas affected
  level: should
- item: 'Where substantial harm to a designated asset would result: evidence of marketing showing no viable
    use, and that conservation by grant-funding or charitable/public ownership is not possible'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 26-29. Part 3 item 23, 'Heritage Impact Assessments
  (including desk based Archaeological reports)'. Shown as heritage-statement.
review-status: unverified
field-status: {}
