reference: habitat-baseline
local-authority: NEA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is not exempt from the general biodiversity gain condition.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All development proposals that are not exempt from the general biodiversity condition (Exempt
  Development)
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
- item: The red line boundary and the baseline habitat parcels in a GIS or CAD file, with parcel reference
    numbers matching the metric baseline sheets where possible (local requirement)
  level: must
  source-text: 'The following are also required in a GIS file formator in CAD file format: a) The planning
    application red line boundary; and b) The baseline habitat parcels. The attributes table for this
    file should where possible contain a field for parcel reference numbers, and these references should
    be used within the submitted Statutory Biodiversity Metric baseline sheets.'
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 5, 13. Part 1 'Biodiversity Net Gain' (item
  6) and Part 3 item 7. Shown for applications subject to the biodiversity gain condition, as the law
  sets.
review-status: unverified
field-status: {}
