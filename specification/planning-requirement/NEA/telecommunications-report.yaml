reference: telecommunications-report
local-authority: NEA
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications development.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (General Permitted Development) (England) Order 2015, Part 16
source-text: Telecommunications supporting information
must-include:
- item: Confirmation that the development is by or on behalf of a telecommunications code system operator
  level: must
- item: Evidence that the use of an existing mast, building or structure has been considered
  level: must
- item: A statement that the base station will meet ICNIRP guidelines
  level: must
- item: The frequency and modulation characteristics and power output in relation to the antenna
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 38, 70. Part 3 item 36 (no trigger given)
  and Part 5, which lists 'Telecommunications supporting information' as always required for telecoms
  requiring planning permission.
review-status: unverified
