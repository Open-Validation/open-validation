reference: air-quality-assessment
local-authority: NEA
required-if:
  any:
  - condition:
      field: eia-development
      value: true
      description: Proposals requiring an Environmental Impact Assessment.
  - condition:
      field: direct-air-emissions
      value: true
      description: Industrial installations.
  - condition:
      field: biomass-or-chp
      value: true
      description: Biomass boilers or combined heat and power plants.
  - condition:
      field: traffic-aadt-increase
      operator: '>'
      value: 5
      description: Traffic flows will increase by more than 5% on roads with less than 10,000 annual average
        daily trips.
  - condition:
      field: dust-generation
      value: true
      description: Significant demolition or construction works.
  - discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Air Quality and Emissions Mitigation Guidance for Developers (2021)
source-text: Proposals likely to have an impact on air quality e.g., those requiring an Environmental
  Impact Assessment (EIA), industrial installations, biomass boilers, combined heat and power plants,
  where traffic flows will increase by more than 5% on roads with less than 10,000 annual average daily
  trips, where significant demolition or construction works are proposed etc.
must-include:
- item: Proportionate to the development and the level of air quality concern; scope best agreed with
    the council's Environmental Health Officers before commissioning
  level: should
- item: 'Could include: baseline conditions and how they could change; air quality concerns; assessment
    and modelling verification methods; sensitive locations; basis for assessing significance; construction
    phase impact; acceptable mitigation'
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 11. Part 3 item 4. The listed cases are examples
  ('e.g.', 'etc.'), so 'discretionary' is added for other proposals likely to affect air quality.
review-status: unverified
field-status: {}
