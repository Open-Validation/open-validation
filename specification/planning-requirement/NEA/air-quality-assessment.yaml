reference: air-quality-assessment
local-authority: NEA
required-if:
  any:
  - condition:
      field: eia-development
      value: true
      description: The proposal requires an Environmental Impact Assessment.
  - condition:
      field: biomass-or-chp
      value: true
      description: Biomass boilers or combined heat and power plants.
  - condition:
      field: traffic-aadt-increase
      operator: '>'
      value: 5
      description: Traffic flows will increase by more than 5% on roads with less than 10,000 annual average
        daily trips.
  - condition:
      field: earthworks
      value: true
      description: Significant demolition or construction works are proposed.
  - discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
source-text: 'Air Quality Assessment Threshold/Trigger An air quality assessment based on current best
  practice is required for: Proposals likely to have an impact on air quality e.g., those requiring an
  Environmental Impact Assessment (EIA), industrial installations, biomass boilers, combined heat and
  power plants, where traffic flows will increase by more than 5% on roads with less than 10,000 annual
  average daily trips, where significant demolition or construction works are proposed etc.'
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Industrial installations
  and other proposals likely to affect air quality ('etc.') are shown as officer discretion.
