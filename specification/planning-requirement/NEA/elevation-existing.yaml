reference: elevation-existing
local-authority: NEA
required-if:
  any:
  - condition:
      field: external-alterations
      value: true
      description: Alterations to the exterior of existing buildings, including changes of use with external
        alterations.
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - site:
        in:
        - green-belt
        - conservation-area
        description: Within the Green Belt or a Conservation Area.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications proposing alterations to the exterior of existing building(s),
  including changes of use where external alterations are proposed and proposals for demolition within
  the Green Belt or Conservation Area.
must-include:
- item: Drawn to an appropriate metric scale (for example 1:50 or 1:100), annotated with the scale and
    paper size (e.g. 1:50 paper size A3), or with an appropriate scale bar
  level: must
- item: What is already there and the height of building(s) above ground level
  level: must
- item: The existing building materials and the style, materials and finish of windows and doors
  level: must
- item: Any blank elevations
  level: must
- item: The same orientation and scale as the proposed elevations
  level: must
- item: Individual drawing numbers and, where applicable, revision numbers
  level: must
- item: 'For a change of use with no external changes: a statement that no external changes are proposed'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Change of use.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 7. Part 2 'Existing Elevations'.
review-status: unverified
field-status: {}
