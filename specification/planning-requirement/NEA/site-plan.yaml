reference: site-plan
local-authority: NEA
required-if:
  always: true
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy of the site plan (or block plan) should accompany any application.
must-include:
- item: At a standard scale, e.g. 1:200 or 1:500
  level: must
- item: The direction north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: The position and crown spread of all trees (to scale) within the site or within falling distance
    of it, where applicable
  level: must
- item: 'Unless they would not influence or be affected by the development: sufficient buildings and/or
    roads on adjoining land including access arrangements; public rights of way crossing or adjoining
    the site; the extent and type of any hard surfacing; boundary treatments including walls or fencing
    where proposed'
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 6. Part 2 'Site Plan (or block plan)'. Part
  4 lists a block plan as always required for most application types (not for lawful development certificates
  for existing use).
review-status: unverified
field-status: {}
