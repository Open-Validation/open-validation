reference: affordable-housing-statement
local-authority: NEA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more new residential units.
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 1000
      description: 1000 sq m or more residential floor area.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Allocations and Development Management DPD Policy DM8 (as cited by the list)
source-text: Where the proposal provides 11 or more new residential units or where 1000sqm or more residential
  floor area is proposed
must-include:
- item: The mix of private and affordable units, with numbers of habitable rooms and/or bedrooms
  level: must
- item: A clear explanation of any different levels or types of affordability or tenure for different
    units
  level: must
- item: Where the affordable housing is not policy compliant, a viability statement
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing proposed is not policy compliant.
- item: The location of the affordable units and their habitable rooms/bedrooms and/or floor space shown
    on the floor plans
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 9. Part 3 item 1.
review-status: unverified
field-status: {}
