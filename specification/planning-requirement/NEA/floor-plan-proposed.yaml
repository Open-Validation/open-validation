reference: floor-plan-proposed
local-authority: NEA
required-if:
  condition:
    field: building-works
    value: true
    description: New buildings and/or alterations or extensions.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications proposing new buildings and/or alterations/extensions.
must-include:
- item: Drawn to an appropriate metric scale (for example 1:50 or 1:100), annotated with the scale and
    paper size (e.g. 1:50 paper size A3), or with an appropriate scale bar
  level: must
- item: The proposed works in relation to what is already there and the height of buildings above ground
    level
  level: must
- item: The relationship between buildings
  level: must
- item: 'For change of use with internal alterations: the proposed layout of rooms'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Change of use with internal alterations.
- item: The same orientation and scale as the existing floor plans
  level: must
- item: Individual drawing numbers and, where applicable, revision numbers
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 7. Part 2 'Proposed Floor Plans'. The list
  says the contents apply 'where applicable'.
review-status: unverified
field-status: {}
