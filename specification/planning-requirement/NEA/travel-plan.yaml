reference: travel-plan
local-authority: NEA
required-if: discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Planning Practice Guidance; Nottinghamshire County Council travel plan guidance
source-text: Travel Plans need to be proportionate to the type of development they are supporting as set
  out above.
must-include:
- item: Specific outcomes, targets and measures, with monitoring and management arrangements
  level: must
- item: Evaluates benchmark travel data, forecast trips by all modes, existing travel habits, proposals
    to reduce travel and improved public transport
  level: should
- item: An assessment against Active Travel England's planning application toolkit criteria
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 dwellings or more.
    - condition:
        field: floorspace
        operator: '>='
        value: 7500
        description: 7,500 sq m of floorspace or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 5
        description: Site area of 5 hectares or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 5
        description: Site area of 5 hectares or more.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 40-41. Part 3 item 40. The list gives no trigger
  of its own; it says a travel plan goes with a transport statement/assessment, so it is 'discretionary'.
review-status: unverified
field-status: {}
