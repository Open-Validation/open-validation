reference: viability-assessment
local-authority: NEA
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The applicant does not consider the scheme viable with the policy requirements and/or
      planning obligations.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: National planning guidance on viability; RICS guidance
source-text: Where applicants do not consider that development schemes would be viable in relation to
  the policy requirements and/or planning obligations made of them, a viability assessment justifying
  the reasons for this must accompany the planning application.
must-include:
- item: Reflects the national guidance approach, including standardised inputs
  level: must
- item: Gross and net internal floor areas; land purchase price (with proof), market value and purchase
    date; normal and abnormal development costs (with proof of abnormals); why full costs were not reflected
    in the purchase price; expected sale prices; intended profit levels
  level: must
- item: 'For affordable housing: the amount (%) that could be provided against a diminishing scale of
    profit levels'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing is affected.
- item: Prepared on the basis that it will be made publicly available; an executive summary
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 46-47. Part 3 item 43, 'Viability and Marketing
  Statements'. A separate fee covers the council's independent review. The marketing evidence part is
  listed as unmapped.
review-status: unverified
field-status: {}
