reference: recreation-facilities-assessment
local-authority: NEA
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Development that will result in the loss of open space.
  - condition:
      field: affects-playing-field
      value: true
      description: Applications involving the loss of playing fields.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Sport England Playing Fields Policy
source-text: An Open Space Statement is required for all developments that will result in the loss of
  open space
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: must
- item: 'For loss of playing fields: the information in Sport England''s table (consultation notice, existing
    and proposed site plans, supporting statements, and the items for the relevant policy exceptions)'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Loss of playing fields.
- item: 'Where the development generates a requirement for open space: its location in the layout, layout
    details, timescale, maintenance proposals and draft s106 heads of terms'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 33-34. Part 3 item 29, 'Open Space Statement'.
  Open space provision for new development depends on the policy thresholds (item 30), so that item is
  'discretionary'.
review-status: unverified
field-status: {}
