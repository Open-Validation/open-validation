reference: construction-management-plan
local-authority: NEA
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Nottinghamshire County Council Highway Design Guide
source-text: All major developments that generate significant numbers of construction transport movements,
  large vehicles and/or large loads within rural areas or require access provision along rural roads should
  be supported by a draft Construction Management Plan. Such developments include solar farms.
must-include:
- item: 'Insofar as known: number and frequency of vehicles each day/week; size of vehicles; routes from
    A-classified roads; hours and days of delivery; measures to manage these; construction access'
  level: should
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), page 15. Part 3 item 12. Shown as major development
  plus ''discretionary'': whether it generates ''significant'' construction traffic in rural areas is
  a judgement.'
review-status: unverified
field-status: {}
