reference: landscaping-plan
local-authority: NEA
required-if:
  all:
  - condition:
      field: landscaping-works
      value: true
      description: Hard or soft landscaping is proposed.
  - discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF
source-text: Where hard or soft landscaping is proposed. In a number of cases these can be dealt with
  by way of a planning condition once planning permission has been granted. However, if a scheme is particularly
  sensitive from either an ecological or visual point of view, then these may be required at the validation
  stage.
must-include:
- item: Metric scale 1:500 for layout plans and 1:200 or 1:100 for planting schemes
  level: must
- item: For residential development, plot numbers identified
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: A topographical survey with spot levels, contours, structures, existing trees (Root Protection
    Areas), significant vegetation, services and easements
  level: must
- item: A planting plan with positions, species, density, size at maturity, guards, weed control, slope
    stabilisation and protective measures
  level: must
- item: Management plans with objectives and aftercare maintenance
  level: must
- item: 'Hard landscaping details: surfacing, footways, boundary walls/fences, retaining walls, protective
    measures, lighting, street furniture, special features, refuse storage, utility routes, sub-stations'
  level: must
- item: Tree lined streets
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 30-31. Part 3 item 26. Shown with 'discretionary'
  because the list says landscaping is often conditioned and only needed at validation where the scheme
  is particularly sensitive.
review-status: unverified
field-status: {}
