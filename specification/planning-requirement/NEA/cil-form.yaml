reference: cil-form
local-authority: NEA
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: New build gross internal area exceeds 100 sq m.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A new house or flat of any size.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Community Infrastructure Levy Regulations 2010; Newark and Sherwood CIL Charging Schedule
source-text: CIL may be payable on development which creates net additional floor space, where the gross
  internal area of new build exceeds 100 square metres. This includes development permitted by a ‘general
  consent’ (including permitted development). The 100 square metre limits does not apply to new houses
  or flats, and a charge can be levied on a single house or flat of any size, unless it is built by a
  ‘self-builder’.
must-include:
- item: '''Form 1 - Community Infrastructure Levy (CIL) - Additional Information'' completed, even if
    a self-build exemption will be claimed later'
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 14-15. Part 3 item 11. The list says the council
  will not invalidate an application for lack of this form, but its completion will assist.
review-status: unverified
field-status: {}
