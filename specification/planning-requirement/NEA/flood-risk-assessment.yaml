  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The development is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
