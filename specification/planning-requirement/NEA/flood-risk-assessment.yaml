reference: flood-risk-assessment
local-authority: NEA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zones 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Less than 1 ha in flood zone 1 with a change of use to a more vulnerable class (for
          example commercial to residential).
    - site:
        in:
        - surface-water-flood-risk
        - reservoir-flood-risk
        description: Could be affected by sources of flooding other than rivers and sea (for example surface
          water drainage, reservoirs).
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; National Planning Practice Guidance; Environment Agency standing advice
source-text: • in flood zones 2 or 3 including minor development and change of use • more than 1 hectare
  (ha) in flood zone 1 • less than 1 ha in flood zone 1, including a change of use in development to a
  more vulnerable class (for example from commercial to residential), where they could be affected by
  sources of flooding other than rivers and sea (for example surface water drainages, reservoirs)
must-include:
- item: 'For developments covered by Environment Agency standing advice: site address; description of
    the development; flood risk from all sources with a climate change allowance; estimated flood level;
    finished floor levels; flood resistance and resilience plans; supporting plans and drawings'
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Flood zones 2 or 3.
- item: Considers information from the relevant Neighbourhood Plan
  level: should
- item: The sequential test and, if needed, the exception test
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 23-25. Part 3 item 20. Part 4 calls it 'Flood
  Risk Standing Advice' where the footprint in flood zones 2 or 3 is under 250 sq m.
review-status: unverified
field-status: {}
