reference: land-contamination-assessment
local-authority: NEA
required-if:
  any:
  - all:
    - condition:
        field: site-allocation
        value: true
        description: An allocated site.
    - discretionary
  - site:
      in:
      - contaminated-land
      description: A former or proposed land use on the council's lists of potentially contaminative uses
        (for example mining, heavy industry, gasworks, garages and petrol forecourts, landfill, farms,
        made ground, allotments).
  - condition:
      field: industrial-site
      value: true
      description: Former industrial use of the land.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: A Guide to Developing Land within Nottinghamshire
source-text: Certain allocated sites – see Newark and Sherwood District Council’s adopted Allocations
  and Development Management DPD for further information www.newark-sherwooddc.gov.uk/adm/ • Certain proposed
  land uses or development on sites where there may be the potential for contamination due to the former
  use of the land.
must-include:
- item: 'For the higher-risk former or proposed uses listed (e.g. mining, smelting, heavy engineering,
    gasworks, oil, chemicals, landfill, scrap yards, petrol forecourts): a quantitative risk assessment'
  level: must
- item: 'For the medium-risk uses listed (e.g. other industries, made ground, known fill, hospitals, vehicle
    repair garages, dry cleaners, allotments): a preliminary risk assessment, site walkover and bill of
    quantities'
  level: must
- item: 'For bombed land, burial sites and garages used for car parking: a preliminary risk assessment
    and site walkover'
  level: must
- item: A Phase I preliminary risk assessment covering site history, walkover, environmental setting and
    a conceptual site model, with recommendations for any intrusive investigation
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 15-18. Part 3 item 13, 'Contamination Survey'.
  Only 'certain' allocated sites need one at validation, so that part is 'discretionary'. The list gives
  detailed Phase I-III contents from 'A Guide to Developing Land within Nottinghamshire'.
review-status: unverified
field-status: {}
