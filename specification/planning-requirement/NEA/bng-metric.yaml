reference: bng-metric
local-authority: NEA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is not exempt from the general biodiversity gain condition.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015, as amended by the Biodiversity Gain (Town and Country Planning) (Modification and Amendments)
  (England) Regulations 2024
source-text: All development proposals that are not exempt from the general biodiversity condition (Exempt
  Development)
must-include:
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), with the completed metric calculation tool showing the calculations and the publication
    date and version of the metric used
  level: must
- item: Where an earlier date is used, the proposed earlier date and the reasons for it
  level: must
- item: A statement confirming whether the onsite biodiversity value is lower because of degradation and,
    if so, supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: Completed draft post-intervention sheets on the submitted Statutory Biodiversity Metric (local
    requirement, within the BNG Strategy)
  level: must
  source-text: Completed draft post-intervention sheets on the submitted Statutory Biodiversity Metric;
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 5, 13. Part 1 'Biodiversity Net Gain' (items
  2-5) and Part 3 item 7. The statement whether the applicant believes the BNG condition applies (item
  1) is asked of all planning applications. Shown for applications subject to the biodiversity gain condition,
  as the law sets. The local Biodiversity Net Gain Strategy (item 7) is listed as unmapped.
review-status: unverified
field-status: {}
