reference: town-centre-impact-assessment
local-authority: NEA
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Located outside of a defined centre.
  - any:
    - all:
      - condition:
          field: near-named-town
          value: true
          description: In the Newark Urban Area.
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 400
          description: Retail of 400 sq m (gross) or more in the Newark Urban Area.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 350
        description: Retail of 350 sq m (gross) or more in the rest of the district.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: Leisure and office development of 2,500 sq m (gross) or more.
    - discretionary
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: NPPF; Allocations and Development Management DPD Policy DM11; Amended Core Strategy (March 2019)
  Core Policy 8
source-text: 'Impact Assessment is required for: • Proposed retail development which is located outside
  of a defined centre and has a gross floorspace equalling or exceeding the levels below; - • Newark Urban
  Area - 400 sqm. (gross) • Rest of the District - 350 sqm. (gross) • Proposed leisure and office development
  which is located outside of a defined centre and has a gross floorspace equalling or exceeding 2,500
  sqm. (gross) 38 | P a g e • Proposed leisure and office development which is located outside of a defined
  centre and has a gross floorspace of less than 2,500 sqm. (gross) where specifically requested by the
  Local Planning Authority.'
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment
  level: must
- item: The impact on town centre vitality and viability, including consumer choice and trade, up to 5
    years from the application (10 years for major schemes not fully realised in 5)
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 38-39. Part 3 item 38, 'Town Centre Uses Assessment'
  (impact part). The 350 sq m threshold applies outside the Newark Urban Area. Leisure and office schemes
  under 2,500 sq m need one only where the council asks, so 'discretionary' is included. The Sequential
  Assessment is listed as unmapped.
review-status: unverified
field-status: {}
