reference: biodiversity-survey-report
local-authority: NEA
required-if:
  any:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is not exempt from the general biodiversity gain condition.
  - condition:
      field: potential-roost-features
      value: true
      description: Works to buildings with potential for roosting bats (see Appendix A), including householder
        applications.
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Barns and other buildings/structures with potential for protected species.
  - site:
      in:
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-nature-reserve
      - local-wildlife-site
      description: Immediately adjacent to, or within, a statutory or non-statutory designated nature
        conservation site.
  - condition:
      field: near-watercourse
      value: true
      description: Works within or immediately adjacent to running water (dykes, streams, rivers).
  - condition:
      field: pond-on-or-near-site
      value: true
      description: Works within or immediately adjacent to standing open water (ponds and lakes).
  - all:
    - condition:
        field: tree-works
        value: true
        description: Works to trees.
    - condition:
        field: protected-species
        value: true
        description: Trees known, or suspected, to house protected species.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Wildlife legislation; NPPF
source-text: All applications for development that is not exempt from the general biodiversity condition
  (Exempt development). 1. Except for the need for ecology surveys in relation to bats and buildings,
  most householder applications are unlikely to affect priority habitats or protected species other than
  bats and would not require an EcIA. Guidance regarding interpretation of the need for ecology surveys
  in relation to bats and buildings, including dwellings, is provided in a separate Advisory Note which
  can be accessed at Appendix A. 2. Applications relating to barns and other buildings/structures have
  the potential to affect protected species, primarily bats, but also protected and/or notable birds like
  barn owl and swift. Appendix A. provides guidance in relation to bats, and preliminary assessments for
  roosting bats will usually include an assessment for potential impacts on birds. 3. All applications
  immediately adjacent to, or within (including partially) the boundary of, a site afforded a nature conservation
  designation. This includes statutory designated sites (Special Area of Conservation, Sites of Special
  Scientific Interest and Local Nature Reserves), and non-statutory designated Local Wildlife Sites. 4.
  All applications not falling within the above categories involving works within, or immediately adjacent
  to standing open water (i.e., ponds and lakes), or running water (i.e., dykes, streams, rivers). 5.
  Proposals involving works to trees known, or suspected, to house protected species.
must-include:
- item: Carried out by a suitably competent ecologist, with surveys at the correct time of year using
    best practice guidance, and within their valid lifespan
  level: must
- item: Prepared in accordance with current UK best practice guidelines for Ecological Impact Assessment
  level: should
- item: Considers the possible potential Special Protection Area and Natural England's advice note on
    nightjar and woodlark in the Sherwood Forest region
  level: should
- item: 'For bats in buildings and trees: a Preliminary Bat Roost Assessment by a suitably competent ecologist
    (Appendix A), with any nocturnal surveys it shows are needed'
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: The works could affect roosting bats.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 20-21, 71-74. Part 3 item 16, 'Ecological
  Impact Assessment (EcIA)', and Appendix A (Preliminary Bat Roost Assessments). The list says precise
  triggers are hard to define; pre-application advice is encouraged where unsure. A Preliminary Ecological
  Appraisal should not normally be submitted on its own.
