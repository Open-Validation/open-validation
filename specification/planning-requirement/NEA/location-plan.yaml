reference: location-plan
local-authority: NEA
required-if:
  always: true
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy of the location plan must accompany every application for planning permission.
must-include:
- item: Based on an up-to-date Ordnance Survey map
  level: should
- item: At a scale of 1:1250 (1:2500 for a very large site, 1:5000 acceptable in a rural area), scaled
    to fit onto A4 or A3 paper where possible
  level: should
- item: The application site outlined in red, and any adjoining or nearby land owned by the applicant
    outlined in blue
  level: must
- item: The red line includes all land needed to carry out the development (e.g. access from the public
    highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: A north arrow
  level: must
- item: At least two adjacent road names, and properties numbered or named so the exact location is clear
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 3. Part 1 'Location Plan'. Part 4 lists the
  location plan as always required for each type.
review-status: unverified
field-status: {}
