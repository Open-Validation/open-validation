reference: environmental-statement
local-authority: NEA
required-if:
  condition:
    field: eia-development
    value: true
    description: Schedule 1 projects, or Schedule 2 projects judged likely to give rise to significant
      environmental effects.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Proposals listed in Schedule 1 of the Regulations ‘Schedule 1 projects’ require an EIA in
  every case 2. Proposals listed in Schedule 2 of the Regulations ‘Schedule 2 projects’ require an EIA
  only if the project in question is judged likely to give rise to significant environmental effects.
  Schedule 3 provides further guidance for when assessing whether Schedule 2 projects require and EIA.
must-include:
- item: The information in Schedule 4 of the Regulations
  level: must
- item: Prepared by competent experts
  level: must
- item: A statement from the developer outlining the relevant expertise or qualifications of the experts
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 21-23. Part 3 item 18. The list also sets
  out screening and scoping opinion requests.
review-status: unverified
field-status: {}
