reference: arboriculturist-report
local-authority: NEA
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees may be affected, including trees on adjacent land or highways.
  - site:
      in:
      - ancient-woodland
      description: Ancient Woodlands or existing woodlands.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: BS 5837:2012; NPPF
source-text: A tree survey should accompany all applications where trees may be affected by the proposed
  development. This includes trees on adjacent land or highways in addition to Ancient Woodlands or existing
  woodlands
must-include:
- item: A tree survey to BS 5837:2012, proportionate to the development and trees affected
  level: must
- item: Tree locations identified on a scaled plan
  level: must
- item: A Tree Constraints Plan, a Tree Protection Plan and an Arboricultural Impact Assessment
  level: must
- item: 'For each tree over 75mm diameter: species, height, stem diameter at 1.5m, Root Protection Area,
    canopy spread at four compass points, age class, condition, life expectancy, amenity value and BS
    category'
  level: must
- item: A full schedule of tree works, disposal of arisings and protection of retained trees
  level: must
- item: All surveyed trees tagged on site
  level: must
- item: 'For ancient woodland or veteran trees: wholly exceptional reasons, a compensation strategy and
    the listed impact assessment'
  level: must
  required-if:
    any:
    - site:
        in:
        - ancient-woodland
        description: Ancient woodland.
    - condition:
        field: veteran-trees
        value: true
        description: Veteran trees.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 42-43. Part 3 item 41, 'Tree Surveys'. Where
  unsure whether trees are affected, the list asks at least for a 1:200 or 1:500 site plan showing trees
  within falling distance.
review-status: unverified
field-status: {}
