reference: lighting-assessment
local-authority: NEA
required-if:
  condition:
    field: floodlighting
    value: true
    description: The proposal involves floodlighting.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
source-text: All proposals involving floodlighting.
must-include:
- item: A report written by a suitably qualified person
  level: must
- item: Survey of the surrounding night environment, critical viewpoints, existing lighting conditions
    and baseline measurements
  level: must
- item: Task lighting levels, environmental light control limits and new lighting design quality objectives
  level: must
- item: Calculated task working areas, overspill areas, obtrusive light into property, viewed source intensities
    with glare assessment and direct upward light ratio
  level: must
- item: Comparison with baseline values and the designer's critique of final design constraints
  level: must
- item: Viewpoint visualisation and a virtual walkthrough of the illuminated site
  level: must
- item: Schedules of model reflection factors and of luminaire mounting heights and aiming angles
  level: must
- item: A layout plan with beam orientation
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 23. Part 3 item 19, 'External Lighting Details'.
review-status: unverified
field-status: {}
