reference: section-proposed
local-authority: NEA
required-if:
  any:
  - condition:
      field: engineering-operations
      value: true
      description: Engineering operations.
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
  - condition:
      field: adjacent-ground-level-change
      value: true
      description: Ground levels outside the application site are noticeably different.
source-url: https://www.newark-sherwooddc.gov.uk/sites/default/files/2026-01/Planning-Application-Validation-Checklist-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications proposing engineering operations and/or on any development
  where there is a change is ground levels or where ground levels outside of the application site are
  noticeably different.
must-include:
- item: Existing and proposed site levels and finished floor levels at an appropriate metric scale (e.g.
    1:50 or 1:100) or with a scale bar, including cross sections where relevant, with levels related to
    a fixed datum point off site
  level: must
- item: The proposal in relation to adjoining buildings that may be affected
  level: must
- item: Section drawings identifying existing and proposed ground levels, with a plan showing where the
    cross sections are taken
  level: must
- item: Existing and proposed buildings within and adjacent to the site, with finished floor and ridge
    levels
  level: must
- item: Where applicable, the volume of material (e.g. soil) to be removed and where it would be re-deposited
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 8. Part 2 'Sections / Finished Floor Levels'.
  For householder development levels may be evident from the floor plans and elevations.
review-status: unverified
field-status: {}
