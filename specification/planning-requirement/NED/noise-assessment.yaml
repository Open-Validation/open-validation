reference: noise-assessment
local-authority: NED
required-if:
  any:
  - ref: major-development
  - condition:
      field: noise-generating-use
      value: true
      description: The development would generate significant levels of noise or vibration in relation
        to residential and commercial properties.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use in proximity to a known noise source.
source-url: https://www.ne-derbyshire.gov.uk/documents/ne-validation-local-list-pdf-908kb/download
source-text: Requirement 2.18 Noise Impact Assessment When is this required? Type of application/location
  All “Major” development and in all instances where the development would generate significant levels
  of noise or vibration in relation to residential and commercial properties, or it proposes a noisesensitive
  use in proximity to a known noise source.
