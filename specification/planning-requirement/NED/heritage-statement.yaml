source-text: 'Heritage impact assessment or ‘heritage statement’: for smaller scale works (householder
  and similar scale) it is often not necessary to submit a formal archaeological survey to accompany a
  planning application, although if the application is on or adjacent to a designated heritage asset (Scheduled
  Monument, Listed Building etc) a brief and targeted professional archaeological assessment might be
  required.'
