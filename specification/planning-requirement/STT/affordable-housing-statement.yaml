reference: affordable-housing-statement
local-authority: STT
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The development creates one or more new dwellings.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: affordable-housing-proposed
        value: true
        description: The development includes affordable dwellings.
    - condition:
        field: market-housing-proposed
        value: true
        description: The development includes market dwellings.
  - condition:
      field: housing-type
      value: student
      description: Purpose built student accommodation.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs- 61-71 Policy SD2 – Strategic Development Needs, Policy SD3 – Housing Strategy
  and Policy H4 – Meeting Housing Needs
source-text: Major housing developments; Developments of 2 or more affordable and market dwellings in
  relation to Part M Optional Technical Standards (see Local Plan policy H4.9); Purpose Built Student
  Accommodation.
must-include:
- item: The total number of residential units, and the mix (house type, habitable rooms/bedrooms and floor
    space of habitable areas), preferably as an excel/csv file
  level: should
- item: The number of custom and self build homes, with evidence they meet the definition
  level: should
- item: Floor plans showing the location of units and their habitable rooms/bedrooms and/or floor space
  level: should
- item: The number, percentage, type and location of M4(2) and M4(3) dwellings, and how the development
    complies with the Part M optional technical standards
  level: should
- item: 'Affordable housing: the tenure of all affordable homes, the Registered Provider, rental and service
    charges, marketing and communication strategy, and a delivery programme'
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: The development includes affordable housing.
- item: 'Affordable housing: a commitment to at least eight weeks'' notice of completions, and to manage
    discounted market sale homes (including First Homes) so they stay affordable in perpetuity'
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: The development includes affordable housing.
- item: 'Affordable housing: a colour coded site plan showing property types and tenures dispersed across
    the development'
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: The development includes affordable housing.
- item: 'Student accommodation: character and appearance, neighbours'' living conditions, standard of
    accommodation, adaptable internal layout, access to education and local facilities, and fit with regeneration
    (River Tees Corridor)'
  level: must
  required-if:
    condition:
      field: housing-type
      value: student
      description: Purpose built student accommodation.
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 11-12, row 18 (local: Housing Statement).
  The list''s ''Housing Statement'' covers housing mix, Part M optional standards, the Affordable Housing
  Statement and student accommodation; it is filed here as the closest id. The Part M trigger refers to
  Local Plan policy H4.9. The list doesn''t define major development here (row 27 spells out the national
  definition), so it is shown as major-development.'
review-status: unverified
field-status: {}
