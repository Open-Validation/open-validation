reference: land-contamination-assessment
local-authority: STT
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: The site could be affected by a former potentially contaminative land use.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be a 'vulnerable user' as defined in Appendix 1A and 1B of the
        YALPAG Planning Guidance (Version 12.2, July 2023).
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs- 187,196,197 Policy ENV5 – Preserve, Protect and Enhance Ecological Networks,
  Biodiversity and Geodiversity and Policy ENV7 – Ground, Air, Water, Noise and Light Pollution
source-text: Where the development site could be affected by a former potentially contaminative land use
  or the proposed use would be a "vulnerable user" as defined in Appendix 1A and 1B of the YALPAG Planning
  Guidance - Version 12.2, July 2023. A Screening Assessment Form must be completed for small developments,
  such as one house.
must-include:
- item: Phase 1 (Preliminary Risk Assessment), and where required Phase 2 (site investigation and risk
    assessment), Phase 3 (remediation strategy) and Phase 4 (verification), each approved before the next
  level: must
- item: A Screening Assessment Form for small developments, such as one house
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: ==
      value: 1
      description: A small development such as one house.
  source-text: A Screening Assessment Form must be completed for small developments, such as one house.
- item: A gas risk assessment (phases 1-4)
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: Within 250 metres of an existing or former landfill site.
- item: Prepared by a competent person, demonstrated within the report
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 18-19, row 32 (local: Land Contaminatio
  n Assessment/ Screening Assessment Form).'
review-status: unverified
field-status: {}
