reference: arboriculturist-report
local-authority: STT
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within or immediately adjacent to the site (within 10 m of the boundary) that could
      influence or be affected by the development.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraph - 187 SD5 – Natural , Built and Historic Environment, SD8 – Sustainable Design
  Principles and ENV5 – Preserve, Protect and Enhance Ecological Networks, Biodiversity and Geodiversity
source-text: Where there are any trees, within or immediately adjacent to a planning application site
  that could influence or be affected by a proposed development. This must include all trees on the site
  and within 10m of the site boundary (generally this shall not include small hedges, shrubs or young
  trees less than 10cm trunk diameter).
must-include:
- item: 'Tree survey and tree quality assessment: location, quality and retention value of trees'
  level: should
- item: Tree constraints plan, including root protection areas
  level: should
- item: Arboricultural impact assessment
  level: should
- item: 'Arboricultural method statement: all tree works and how development avoids harm to trees'
  level: should
- item: 'Tree protection plan: the location of protective barriers and other measures protecting root
    protection areas and crowns'
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 15, row 24 (local: Arboricultural Survey,
  Impact Assessment, Method Statement and Tree Protection Plan). The list says ''some or all'' of the
  five parts may be required, so they show as ''should''. Generally excludes small hedges, shrubs and
  young trees under 10 cm trunk diameter; needed whether or not trees are protected.'
review-status: unverified
field-status: {}
