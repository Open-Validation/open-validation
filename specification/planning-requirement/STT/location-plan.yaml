reference: location-plan
local-authority: STT
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - demolition-con-area
    - lbc
    - advertising
    - ldc
    - prior-approval
    - consent-under-tpo
    - pip
    - change-of-use
    - notice-trees-in-con-area
    - technical-details-consent
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended)
source-text: All applications except variation of a condition (section 73 application)/discharge of condition
  and a non- material amendment.
must-include:
- item: Based on an up-to-date Ordnance Survey map
  level: should
- item: At a scale of typically 1:1250 or 1:2500, scaled to fit A4 or A3 paper wherever possible
  level: should
- item: Enough roads (usually 2 road names) and/or buildings on adjoining land to make the exact location
    clear
  level: should
- item: The direction of North and a scale bar
  level: must
- item: The application site edged clearly in red, including all land needed for the development (such
    as access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 6, row 8 (national: Site Location Plan).'
review-status: unverified
field-status: {}
