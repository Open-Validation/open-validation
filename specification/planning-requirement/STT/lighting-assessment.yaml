reference: lighting-assessment
local-authority: STT
required-if:
  all:
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlights.
    - condition:
        field: external-lighting
        value: true
        description: Significant external lighting, such as security lighting.
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraph - 191
source-text: Applications for developments which would involve the provision of significant external lighting
  (e.g. floodlights or security lighting) that may have an adverse impact on residential amenity, the
  character of the open countryside or a heritage asset.
must-include:
- item: Light spillage, hours of illumination, light levels, column heights, specification and colour
  level: must
- item: Treatment of lamps and luminaires, full horizontal cut off, no distraction to the highway, and
    lighting covers or cowling
  level: must
- item: Impact on nearby dwellings, demountable columns, screening vegetation, planting and bunding
  level: must
- item: Effects on visual amenity, local character, neighbouring amenity, heritage assets and nature conservation,
    and how they will be mitigated
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 24, row 44 (local: Lighting Assessment).
  Shown as discretionary within external lighting because it applies only to lighting ''that may have
  an adverse impact'' on residential amenity, the open countryside or a heritage asset.'
review-status: unverified
field-status: {}
