reference: roof-plan-existing
local-authority: STT
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: The proposal alters a roof.
  - condition:
      field: new-build
      value: true
      description: The proposal creates a new roof (a new building or extension).
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended)
source-text: Required where a roof would be created or altered by the proposed development.
must-include:
- item: The shape of the roof, the roofing materials and features such as chimney positions or windows
  level: must
- item: At a scale of 1:100 or 1:200 with a scale bar and the direction of North
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 8, row 13 (local: Roof Plans - Existing
  and Proposed). A simple roof plan may be combined with the proposed block plan.'
review-status: unverified
field-status: {}
