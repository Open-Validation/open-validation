reference: planning-statement
local-authority: STT
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is a departure from, or contrary to, the development plan.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF (2024) Adopted Stockton on Tees Local Plan (2019)
source-text: All major applications Proposals seeking a departure from or being contrary to the development
  plan
must-include:
- item: The context and need for the development, and its principles and justification
  level: must
- item: How the development accords with national and local planning policies and supplementary planning
    documents
  level: must
- item: 'Any regeneration benefits: new jobs created or supported, floor space totals for each use (where
    known), community benefits, pre-application advice and relevant regeneration strategies'
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 10, row 16 (local: Planning Statement).
