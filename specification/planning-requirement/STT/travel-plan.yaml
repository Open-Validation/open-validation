  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraph - 109-11, 118 Policy SD6 – Transport and Infrastructure Strategy, Policy SD8 –
  Sustainable Design Principles and Policy TI1 – Transport Infrastructure
source-text: All major developments; If it is deemed necessary by the Highways, Transport and Design Manager.
must-include:
- item: Benchmark travel data, including trip generation databases
  level: should
- item: The nature of the development and the forecast level of trips by all modes
