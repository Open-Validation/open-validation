reference: bng-metric
local-authority: STT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Not exempt from the biodiversity gain condition (Schedule 7A, Town and Country Planning
      Act 1990).
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (as inserted by Schedule 14 of the Environment
  Act 2021).
source-text: All major planning applications, excluding exempt development. ... The application must be
  accompanied by the minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015, which are included in the planning application form.
must-include:
- item: 'Biodiversity Statement: whether the applicant believes the biodiversity gain condition would
    apply, and if not, the reasons for that belief'
  level: must
- item: How the biodiversity gain requirement is to be met, with details showing that the proposed significant
    on-site enhancements, off-site contributions or statutory biodiversity credits are appropriate and
    sufficient
  level: must
- item: Any risk associated with the proposed on-site enhancements or off-site contributions
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 4, row 4 (national: Biodiversity Net Gain
  Strategy). The list asks for a ''Biodiversity Net Gain Strategy'' (a biodiversity statement, the Article
  7 minimum BNG information given on the application form, how the gain will be met and its risks) and
  names ''All major planning applications, excluding exempt development''. In law the Article 7 information
  (including the completed metric) is needed for every application that is not exempt from the biodiversity
  gain condition, so the rule follows the law (biodiversity-gain-condition). The strategy document itself
  is in STT-unmapped.csv.'
review-status: unverified
field-status: {}
