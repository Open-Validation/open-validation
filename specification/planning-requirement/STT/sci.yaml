reference: sci
local-authority: STT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 30
      description: 30 or more residential units.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 10000
      description: 10,000 sq m or more of non-residential floor space.
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs- 40 - 41
source-text: 'Applications within the earliest stage of the process proposing: 30 or more residential
  units. 10,000 square metres of non- residential floor space or any application which may be considered
  to be of a controversial* nature.'
must-include:
- item: Who was involved in the community engagement and the methods used to engage the community
  level: must
- item: The measures taken to ensure an inclusive, community-wide view
  level: must
- item: How the scheme developed as a result of community engagement, and why any community views were
    not reflected
  level: must
- item: How feedback was given to the community, and any arrangements for on-going engagement
  level: must
- item: How the applicant has complied with the pre-application consultation advocated in the Council's
    adopted Statement of Community Involvement
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 9-10, row 15 (local: Statement of Community
  Involvement (SCI)). Only at the earliest stage of the process (the council''s consultation response
  says the wording was changed to make clear when an SCI is needed, after a developer asked about reserved
  matters and section 73). ''Controversial'' applications also need one, which shows as discretionary:
  the list defines them as departures from the development plan, EIA development, waste or minerals development,
  demolition of a dwelling for more intensive redevelopment, sites over 1 ha where the principle isn''t
  established, smaller housing schemes that are part of a wider contiguous housing site, industrial or
  storage buildings over 50,000 sq m, buildings over 25,000 sq m, applications with a traffic or retail
  impact assessment, and any the LPA thinks are likely to be controversial.'
review-status: unverified
field-status: {}
