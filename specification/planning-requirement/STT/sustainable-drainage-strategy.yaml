reference: sustainable-drainage-strategy
local-authority: STT
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - critical-drainage-area
      description: Flood zone 1 with critical drainage problems notified by the Environment Agency or
        identified by the Local Authority.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs 170-182 Planning Practice Guidance Flood Risk and Coastal Change Policy SD5 -
  Natural, Built and Historic Environment Policy ENV4 - Reducing and Mitigating Flood Risk Non-Statutory
  Technical Standards For Sustainable Drainage (Best Practice Guidance) LASOO Non- Statutory Technical
  Standards for Sustainable Drainage
source-text: 'Surface water drainage details including Sustainable Urban Drainage (SuDS) details will
  be required for all major development: Residential developments of 10 or more dwellings or a site of
  0.5 hectares or greater. Non-residential development of 1,000 sqm or more and a site of 1 hectare or
  more. In an area within flood zone 1 which has critical drainage problems as notified by the Environment
  Agency or identified by the Local Authority.'
must-include:
- item: Outline drainage strategy/statement and sketch layout plan
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: Conceptual SuDS design (interception, treatment, conveyance, peak flow and volume control storage,
    exceedance routes) with a preliminary layout of SuDS and outline hydraulic calculations
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: Detailed drainage strategy with a full hydraulic model including calculations
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Topographical survey (existing and proposed levels), identifying the blue/green corridor
  level: must
- item: Natural flow paths for surface water runoff on a plan, where appropriate
  level: should
- item: Evidence of third-party agreement for final discharge
  level: must
- item: A drainage masterplan for large, phased developments (phasing, discharge and storage, and responsibility
    for construction, maintenance and adoption)
  level: must
- item: Discharge arrangements (temporary and permanent) and connections to watercourses and sewers
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Maintenance access, a completed CIRIA SuDS Manual design assessment checklist for each SuDS feature,
    and a detailed maintenance and management plan
  level: must
  required-if:
    application-type:
      in:
      - full
- item: State, performance and ownership of existing surface water drainage, and any consents needed for
    off-site works
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Detailed layout, flood and drainage design drawings (each SuDS feature), structural, hydraulic
    and ground investigations, and landscaping drawings including SuDS features
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Construction phasing plan and a surface water management construction plan
  level: must
  required-if:
    application-type:
      in:
      - full
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 16-17, row 27 (local: Sustainable Urban
  Drainage Systems). The list defines major development as 10 or more dwellings or a site of 0.5 ha, or
  1,000 sq m of non-residential floorspace or a site of 1 ha (the national definition), so it shows as
  major-development. The Lead Local Flood Authority encourages early engagement; the level of detail varies
  with the size of the development and flood risk.'
review-status: unverified
field-status: {}
