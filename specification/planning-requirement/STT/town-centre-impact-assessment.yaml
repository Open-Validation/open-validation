reference: town-centre-impact-assessment
local-authority: STT
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development greater than 2,500 sq m.
  - condition:
      field: convenience-retail-floorspace
      operator: '>'
      value: 500
      description: Convenience retail greater than 500 sq m.
  - condition:
      field: comparison-retail-floorspace
      operator: '>'
      value: 1000
      description: Comparison retail greater than 1,000 sq m.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Other main town centre uses in an edge of centre or out of centre location.
  - condition:
      field: departure-from-development-plan
      value: true
      description: The application is not in accordance with the development plan.
  - condition:
      field: evening-economy-use
      value: true
      description: A proposal for an evening economy use.
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs - 90-95 Policy SD2 – Strategic Development Needs, Policy SD4 - Economic Growth
  Strategy, EG2 – Managing Centres, EG3 – Protecting Centres, EG6 - Small Scale Facilities and SD8 - Sustainable
  Design Principles
source-text: All retail and leisure developments greater than 2500 square metres; Convenience retail proposals
  greater than 500 sqm, comparison retail propsals greater than 1000 sqm and all retail and leisure developments
  likely to have a significant impact on existing centres; Applications for other main town centre uses
  when they are an edge of centre or out of centre location; Applications not in accordance with a development
  plan; Proposals for evening economy uses.
must-include:
- item: Proportionate evidence that the proposal does not harm the vitality or viability of the relevant
    centre
  level: should
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: should
- item: Impact on town centre vitality and viability, including consumer choice, and on trade/turnover
    in the centre and wider area
  level: should
- item: Impact on allocated sites outside the town centre
  level: should
- item: If in or on the edge of the town centre, whether it is of appropriate scale; any locally important
    impacts
  level: should
- item: Evidence that the development does not cause an over-concentration of uses in a centre or area
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 12, row 19 (local: Retail or Leisure Impact
  Assessment). ''All retail and leisure developments likely to have a significant impact on existing centres''
  shows as discretionary.'
review-status: unverified
field-status: {}
