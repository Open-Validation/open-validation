reference: transport-assessment
local-authority: STT
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraph - 109-111, 118 Policy SD6 – Transport and Infrastructure Strategy, Policy SD8 –
  Sustainable Design Principles and Policy TI1 – Transport Infrastructure
source-text: All major developments should be accompanied by a Transport Assessment; Minor developments
  where substantial transport movements are expected should be accompanied by a Transport Statement; Non–residential
  development that generates significant amounts of traffic should be accompanied by a Transport Statement.
must-include:
- item: Accessibility of the site by all modes and the likely modal split of journeys
  level: should
- item: Proposed measures to improve access by public transport, walking and cycling, reduce the need
    for parking and mitigate transport impacts
  level: should
- item: The proposed site layout, particularly transport access across all modes
  level: should
- item: The existing road network and public transport provision, and proposed changes
  level: should
- item: Trip generation of the development across all modes, and trips from committed development in the
    area (likely to proceed within 3 years)
  level: should
- item: Current traffic flows on links and junctions in the study area, with critical links and junctions
  level: should
- item: Injury accident records near the site access for the last 3 years (5 years in a high accident
    area)
  level: should
- item: Associated environmental impacts of transport, particularly near air quality management areas
    or noise sensitive areas
  level: should
- item: Parking facilities in the area and the parking strategy of the development, with a parking stress
    survey
  level: should
- item: Measures to mitigate the residual impacts of the development
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 13-14, row 22 (local: Transport Assessments
  and Statements). Major development needs a Transport Assessment. Minor developments ''where substantial
  transport movements are expected'' and non-residential development ''that generates significant amounts
  of traffic'' need a Transport Statement: no threshold, so discretionary. Where the assessment shows
  more than 500 AADT car or 100 AADT HGV movements, an air quality assessment is needed (see air-quality-assessment).
  The list doesn''t define major development here (row 27 spells out the national definition), so it is
  shown as major-development.'
review-status: unverified
field-status: {}
