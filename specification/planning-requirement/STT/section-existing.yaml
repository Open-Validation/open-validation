reference: section-existing
local-authority: STT
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: adjacent-ground-level-change
      value: true
      description: The development is proposed next to changing ground levels.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended)
source-text: Required for all applications which involve a change in ground levels or where development
  is proposed next to changing ground levels.
must-include:
- item: Existing and proposed finished ground levels
  level: must
- item: Floor levels, building height and the relationship to site boundaries
  level: must
- item: 'On sloping sites: how the proposal relates to existing ground levels where these may be modified'
  level: must
- item: At a scale of 1:50 or 1:100, with written dimensions, the direction of North and a scale bar
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 8, row 12 (local: Site Sections, Finished
  Floor and Site Levels - Existing and Proposed). Row 12 covers site sections, finished floor and site
  levels, existing and proposed.'
review-status: unverified
field-status: {}
