reference: recreation-facilities-assessment
local-authority: STT
required-if:
  any:
  - condition:
      field: affects-playing-field
      value: true
      description: The application would affect existing playing fields.
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs 103 - 108 Policy TI2 - Community Infrastructure
source-text: 'Applications which would: affect existing playing fields; lead to the creation or loss of
  major sporting facilities; be for new housing creating sport and recreation demands.'
must-include:
- item: The extent of playing field area to be lost, and the reasons for the location and alternatives
    considered
  level: must
- item: Proposed changes to indoor and outdoor sports facilities on the site, including ancillary facilities
  level: must
- item: Current and recent users of the playing field and the nature and extent of their use
  level: must
- item: How the development fits any relevant assessment of need or sports strategy, and how it benefits
    sport
  level: must
- item: Specification of ancillary facilities (e.g. sports lighting) and of any artificial grass pitch,
    with the reason for the surface type
  level: must
- item: 'How any replacement playing field and facilities will be delivered (with timescale) and achieve
    equivalent or better quality: performance of the existing area, programme of works and a management
    and monitoring plan'
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 21, row 38 (local: Playing Fields / Loss
  of Sports Facilities Statement). The list''s Playing Fields / Loss of Sports Facilities Statement. Creating
  or losing ''major sporting facilities'' (not defined) and ''new housing creating sport and recreation
  demands'' show as discretionary.'
review-status: unverified
field-status: {}
