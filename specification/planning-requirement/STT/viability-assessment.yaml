reference: viability-assessment
local-authority: STT
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: Section 106 planning obligations (affordable housing, highways, play space, ecology,
      art, schools etc.) are not proposed to be met in full.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs - 56-59 Policy SD7- Infrastructure Delivery and Viability and Policy H4 – Meeting
  Housing Needs
source-text: Any application where s106 planning obligations are not proposed to be met in full, including
  the policy requirement for affordable housing provision, contributions towards highways, play space,
  ecology/biodiversity, art, schools etc.
must-include:
- item: The number and mix of residential units, with the number of habitable units
  level: should
- item: The floor space of habitable areas of residential units
  level: should
- item: Plans showing the location of the affordable units, the number of habitable rooms or bedrooms
    and the floor space of each unit
  level: should
- item: An explanation of any different levels or types of affordable tenure proposed
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 11, row 17 (local: Viability Statement).
  The council prefers the Government''s Development Appraisal Tool.'
review-status: unverified
field-status: {}
