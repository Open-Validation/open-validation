reference: noise-assessment
local-authority: STT
required-if:
  any:
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
  - condition:
      field: plant-equipment
      value: true
      description: Air conditioning units, ventilation/extraction systems or plant/machinery.
  - condition:
      field: noise-generating-use
      value: true
      description: Licensed premises, or industrial, commercial and manufacturing processes.
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The development creates one or more new dwellings.
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs- 187, 198, 199 Policy SD5 - Natural, Built and Historic Environment and Policy
  ENV7 – Ground, Air, Water, Noise and Light Pollution
source-text: All applications for - -Wind turbines; -Air conditioning units; -Ventilation/Extraction systems;
  -Plant/Machinery; -Developments close to road/ rail (BS8233/ WHO, BS6472:2008) -Construction of major
  developments (BS5228 Parts 1 and 2) likey to cause significant noise and vibration. -Licensed premises
  -New Road(DMRB LA111) -New major housing estate (DMRB LA111, BS8233, BS5228) -Industrial, commercial
  and manufacturing processes (BS4142) -Any application which in the opinion of the local planning authority,
  has the potential to generate significant noise and disturbance*.
must-include:
- item: Existing background noise levels measured over 24 hours, at times likely to show the worst case
  level: must
- item: Proposed noise levels, including cumulative levels of all proposed units
  level: must
- item: Proposed measures to reduce noise, and mitigation where necessary
  level: must
- item: The manufacturer's specification of any equipment to be installed, altered or replaced
  level: must
- item: The method used, with example calculations and assumptions
  level: must
- item: Prepared by a suitably qualified acoustician, showing sufficient sound insulation or other mitigation
    to protect adjacent residents
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 19-20, row 34 (local: Noise Impact Assessment/
  Vibration Assessment). The new major housing estate trigger shows as major development with dwellings.
  Development close to roads or railways, construction of major developments likely to cause significant
  noise and vibration, new roads, and any application the LPA thinks may generate significant noise and
  disturbance show as discretionary (no thresholds). The list also names the standards to use (BS8233,
  BS4142, BS5228, BS6472, ProPG, DMRB LA111).'
review-status: unverified
field-status: {}
