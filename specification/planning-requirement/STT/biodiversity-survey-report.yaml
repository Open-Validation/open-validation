reference: biodiversity-survey-report
local-authority: STT
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      description: 'Development on areas designated for biodiversity interest: SSSI, Sites of Nature Conservation
        Interest or Local Nature Reserves.'
  - discretionary
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs - 187-195 Policy ENV5 – Preserve, Protect and Enhance Ecological Networks, Biodiversity
  and Geodiversity Policy ENV6 - Green Infrastructure, Open Space, Green Wedges and Agricultural Land.
source-text: Development on areas designated for the biodiversity interest, including Sites of Special
  Scientific Interest (SSSI), Sites of Nature Conservation Interest (SNCI) and Local Nature Reserves (LNR);
  Proposals which in the opinion of the Local Planning Authority may affect protected species.
must-include:
- item: The existing biodiversity interest and possible impacts
  level: must
- item: Information supporting any mitigation and/or compensation measures proposed
  level: must
- item: Plans of significant wildlife habitats or features and the location of habitats of any protected
    species
  level: should
- item: Protected species, potential impacts and mitigation proposals; a wildlife survey where legally
    protected species or their habitats are likely to be affected
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), pages 15-16, row 25 (local: Preliminary Ecological
  Appraisal/ Ecological Impact Assessment). The list''s Preliminary Ecological Appraisal / Ecological
  Impact Assessment. Proposals ''which in the opinion of the Local Planning Authority may affect protected
  species'' show as discretionary. Sites of Nature Conservation Interest are shown as local-wildlife-site.'
review-status: unverified
field-status: {}
