reference: fire-statement
local-authority: STT
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation (such as classrooms).
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 3, Article 9A, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended)
source-text: Applications to build or convert ‘High Rise’ building(s) of 18m in height or more or 7 storeys
  or more containing or proposing to contain either 2 or more dwellings OR educational accommodation (such
  as classrooms). An application within the curtilage of a relevant ‘High Rise’ building.
must-include:
- item: On the form published by the Secretary of State (or one substantially to the same effect), with
    the particulars it specifies
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 5, row 6 (national: Fire Statement). Follows
  the national rule. Applications within the curtilage of a relevant high-rise building also need one
  (no separate field). Not needed where a change of use means the building would no longer be a relevant
  building.'
review-status: unverified
field-status: {}
