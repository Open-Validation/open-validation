reference: fire-statement
local-authority: STT
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
source-text: Applications to build or convert 'High Rise' building(s) of 18m in height or more or 7 storeys
  or more containing or proposing to contain either 2 or more dwellings OR educational accommodation (such
  as classrooms).
confidence: medium
review-status: unverified
field-status: {}
