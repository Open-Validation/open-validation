reference: air-quality-assessment
local-authority: STT
required-if:
  any:
  - ref: major-development
  - condition:
      field: traffic-movements-daily
      operator: '>'
      value: 500
      description: More than 500 AADT car movements (shown by the transport assessment).
  - condition:
      field: hgv-movements-daily
      operator: '>'
      value: 100
      description: More than 100 AADT HGV movements (shown by the transport assessment).
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs- 110, 187, 199 Policy ENV7 - Ground, Air, Water, Noise and Light Pollution
source-text: All major developments ... If the transport assessment demonstrates there will be more than
  500AADT car movements and/or more than 100AADT HGV movements then an Air Quality Assessment is required
must-include:
- item: A description of baseline conditions and how these could change
  level: must
- item: Relevant air quality concerns and sensitive locations
  level: must
- item: The assessment methods, any requirements for verifying air quality modelling, and the basis for
    assessing the significance of impacts
  level: must
- item: Construction phase impact, and/or mitigation measures
  level: must
- item: 'Where triggered by traffic: NO2, PM2.5 and PM10 levels with and without the development, compared
    with national objectives, using council monitoring data and at least three months of baseline site
    measurements, following IAQM guidance'
  level: must
  required-if:
    any:
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 500
        description: More than 500 AADT car movements.
    - condition:
        field: hgv-movements-daily
        operator: '>'
        value: 100
        description: More than 100 AADT HGV movements.
  source-text: The report should compare the total levels of NO2, PM2.5 and PM10 both with and without
    the proposed development and compare the findings against the national air quality objectives.
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 20, row 35 (local: Air Quality and Emissions
  Statement). Row 35 asks for an Air Quality and Emissions Statement for all major developments; row 22
  (Transport Assessments, pages 13-14) asks for an Air Quality Assessment where the transport assessment
  shows more than 500 AADT car or 100 AADT HGV movements. The list doesn''t define major development here
  (row 27 spells out the national definition), so it is shown as major-development.'
review-status: unverified
field-status: {}
