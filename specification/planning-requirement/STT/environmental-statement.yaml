reference: environmental-statement
local-authority: STT
required-if:
  condition:
    field: eia-development
    value: true
    description: Schedule 1 development, or Schedule 2 development over the thresholds or criteria in
      the 2017 EIA Regulations.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Town and Country Planning (Environmental lmpact Assessment) Regulations 2017
source-text: If the project is listed in Schedule 1 an Environmental Impact Assessment is required in
  every case; If a proposed project is listed in the first column in Schedule 2 of the 2017 Regulations
  and exceeds the relevant thresholds or criteria set out in the second column (sometimes referred to
  as ‘exclusion thresholds and criteria’)
must-include:
- item: 'A description of the proposed development: the site, design, size and other relevant features'
  level: must
- item: A description of the likely significant effects of the development on the environment
  level: must
- item: A description of the features or measures envisaged to avoid, prevent, reduce and if possible
    offset likely significant adverse effects
  level: must
- item: A description of the reasonable alternatives studied and the main reasons for the option chosen
  level: must
- item: A non-technical summary
  level: must
- item: A statement from the developer outlining the relevant expertise or qualifications of the competent
    experts who prepared it
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 5, row 5 (national: Environmental Impact
  Statement). Applicants are encouraged to seek a screening opinion first.'
review-status: unverified
field-status: {}
