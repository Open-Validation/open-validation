reference: site-plan
local-authority: STT
required-if:
  always: true
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended) NPPF Paragraphs - 109 – 114 Policy SD8 – Sustainable Design Principles and Policy
  TI1 – Transport Infrastructure
source-text: 'All applications. There may be exceptions for applications seeking variation of a condition
  (section 73 application)/discharge of condition and non-material amendment depending on nature of the
  change. Any householder application affecting the existing parking arrangements or the provision of
  additional bedrooms. All applications likely to result in either of the following should show parking
  arrangements: -a loss or gain in parking provision on site; -an increase in parking demand; -a change
  to vehicular /pedestrian access.'
must-include:
- item: 'Existing site plan: the footprint of all existing buildings, with written dimensions and distances
    to the site boundaries'
  level: should
- item: 'Proposed site plan: the footprint of the proposed development and all buildings to be retained,
    with written dimensions and distances to the site boundaries'
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all proposed trees and those to be retained on the site, and those on adjacent
    land
  level: should
- item: The extent and type of any hard surfacing, and boundary treatment including the type and height
    of walls or fencing
  level: should
- item: Existing and proposed parking arrangements, with the dimensions of the spaces, secure cycle parking
    (location and size) and pedestrian access; a justification for any spaces smaller than the adopted
    Parking Standards
  level: should
  required-if:
    any:
    - condition:
        field: parking-change
        value: true
        description: A loss or gain in parking provision on site, or a change to existing parking arrangements.
    - condition:
        field: bedroom-increase
        value: true
        description: A householder proposal that provides additional bedrooms (more parking demand).
    - condition:
        field: new-vehicle-access
        value: true
        description: A change to vehicular or pedestrian access.
  source-text: 'Any householder application affecting the existing parking arrangements or the provision
    of additional bedrooms. All applications likely to result in either of the following should show parking
    arrangements: -a loss or gain in parking provision on site; -an increase in parking demand; -a change
    to vehicular /pedestrian access.'
- item: At a scale of 1:200 or 1:500, up to date, with the direction of north and a scale bar
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 7, row 9 (local: Site / Block Plan Existing
  and Proposed). ''All applications''; the list says there may be exceptions for section 73, discharge
  of condition and non-material amendment applications depending on the change.'
review-status: unverified
field-status: {}
