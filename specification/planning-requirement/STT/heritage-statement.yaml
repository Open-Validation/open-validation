reference: heritage-statement
local-authority: STT
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      description: The proposal affects a listed building.
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
must-include:
- item: Archaeology
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the audit (missing_requirement): item 40 Heritage Statement including archaeology, for listed
  buildings, LBC, conservation area demolition and conservation area schemes of 1+ dwelling.'
review-status: unverified
field-status: {}
