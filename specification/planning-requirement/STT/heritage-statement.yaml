reference: heritage-statement
local-authority: STT
required-if:
  any:
  - site:
      in:
      - listed-building
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The application relates to a listed building or other heritage asset.
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition within a conservation area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The development creates one or more new dwellings.
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs - 167, 202 – 221 Policy SD5 - Natural, Built and Historic Environment, Policy
  SD8 – Sustainable Design Principles, Policy HE1 – Conservation and Enjoyment of the Historic Environment
  and Policy HE2 – Conserving and Enhancing Stockton’s Heritage Assets
source-text: Any application in relation to a listed building or other heritage asset; Demolition within
  a conservation area; Listed building consent; Applications within a conservation area, which consist
  of one or more dwellings.
must-include:
- item: 'For listed buildings: a schedule of works'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Listed building.
- item: The heritage assets affected and their significance, including the contribution made by their
    setting (archaeology, history and character)
  level: must
- item: The principles of and justification for the works and their impact on the special character of
    the asset, its setting and the setting of adjacent listed buildings or conservation areas
  level: must
- item: The historic environment record consulted as a minimum, with assets assessed using appropriate
    expertise where necessary
  level: must
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 22, row 40 (local: Heritage Statement (including
  Archaeology)). Heritage assets are as defined in Local Plan policy HE2 (points 6-9); the designations
  listed here are the usual ones. Detail should be proportionate to the asset''s importance.'
review-status: unverified
field-status: {}
