reference: flood-risk-assessment
local-authority: STT
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in flood zone 2, 3 or 3b, including minor development and change of
        use.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or more in flood zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or more in flood zone 1.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: A change of use to a more vulnerable class (for example commercial to residential).
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: The site could be affected by sources of flooding other than rivers and the sea.
  - site:
      in:
      - critical-drainage-area
      description: Flood zone 1 with critical drainage problems notified by the Environment Agency or
        identified by the Local Authority.
  - site:
      in:
      - future-flood-risk
      description: Flood zone 1 where the SFRA shows a future risk of flooding from rivers or the sea.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: NPPF Paragraphs- 170-182 Policy SD5 - Natural, Built and Historic Environment and Policy ENV4
  - Reducing and Mitigating Flood Risk Planning Practice Guidance Flood Risk and Coastal Change
source-text: All development in flood zone 2, 3 or 3b including minor development and change of use. All
  development 1 hectare or greater in flood zone 1. less than 1 ha in flood zone 1, including a change
  of use in development type to a more vulnerable class (for example from commercial to residential),
  where they could be affected by sources of flooding other than rivers and the sea (for example surface
  water drains, reservoirs). In an area within flood zone 1 which has critical drainage problems as notified
  by the Environment Agency or identified by the Local Authority. Development in flood zone 1 where the
  SFRA shows it will be at risk of flooding from rivers or sea in the future.
must-include:
- item: Identify and assess the risks of all forms of flooding to and from the development
  level: must
- item: How flood risks will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems including SuDS, and safe access to and from the
    development in areas at risk of flooding
  level: must
- item: Sequential Test (and Exception Test where needed)
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3.
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 16, row 26 (local: Flood Risk Assessment).
  Follows the government''s site-specific flood risk assessment checklist. Reservoir flood risk, also
  named, has no separate designation.'
review-status: unverified
field-status: {}
