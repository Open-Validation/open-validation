reference: flood-risk-assessment
local-authority: STT
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in flood zone 2, 3 or 3b, or in a critical drainage area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in flood zone 1).
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
confidence: medium
notes: 'From the audit (missing_requirement): item 26, flood zones 2/3/3b, 1ha+ in flood zone 1, and critical
  drainage areas.'
review-status: unverified
field-status: {}
