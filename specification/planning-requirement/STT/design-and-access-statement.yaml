reference: design-and-access-statement
local-authority: STT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The development creates one or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 2, Article 9, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended), Planning (Listed Buildings and Conservation Areas) Regulations 1990 National Planning
  Policy Framework (NPPF), Paragraphs 137 - 139, 167
source-text: 'Required in the following circumstances - Applications for major development. Applications
  for development in a conservation area, where the proposed development consists of: one or more dwellings;or
  a building or buildings with a floor space of 100 square metres or more. Applications for listed building
  consent.'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development, and how the design takes that context
    into account
  level: must
- item: 'For listed building consent: how the design principles have taken account of the building''s
    special architectural or historic importance, the physical features that justify its listing, and
    its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 6, row 7 (national: Design and Access Statement).
  A single combined statement can serve a planning application and a listed building consent application
  submitted together. Row 46 asks for the Design Process Checklist or Building for a Healthy Life assessment
  for major housing, which may sit within this statement.'
review-status: unverified
field-status: {}
