reference: floor-plan-existing
local-authority: STT
required-if:
  any:
  - condition:
      field: floorspace-change
      value: true
      description: The proposal creates new or amended floor space.
  - condition:
      field: building-works
      value: true
      description: The proposal alters existing buildings.
source-url: https://moderngov.stockton.gov.uk/documents/s16360/Appendix%201%20Local%20and%20National%20Information%20requirements.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure)(England) Order
  2015 (as amended)
source-text: All applications proposing new or amended floor space and/or proposals to alter existing
  buildings.
must-include:
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: should
- item: At a scale of 1:50 or 1:100, with written dimensions showing the overall size of any new buildings
    or extensions, the direction of North and a scale bar
  level: should
confidence: medium
notes: 'From the council''s list (approved 5 March 2025), page 7, row 11 (local: Floor Plans - Existing
  and Proposed). Two floor plans are required, one existing and one proposed.'
review-status: unverified
field-status: {}
