reference: transport-assessment
local-authority: WFUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - discretionary
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: Eden Local Plan policies DEV3 and DEV4; Barrow Borough Local Plan policy I5; Cumbria Minerals
  and Waste Local Plan 2015-2030 policy DC1
source-text: Transport Assessment and Statement The scope and level of detail in a transport assessment
  or statement will vary from site to site but the following should be considered when settling the scope
  of the proposed assessment. ... For minor developments, a Transport Statement (TS) should be sufficient
  which will outline the aspects of the scheme which may impact upon transport but will generally contain
  less technical data. A Transport Assessment (TA) will be required where a proposal will result in significant
  implications for the highway network and significant additional numbers of vehicle movements. The need
  for either a TS or TA is considered on each individual case,
must-include:
- item: The proposed development and site layout (especially access and layout for all modes); neighbouring
    uses and the nearby road network; existing public transport
  level: should
- item: Travel characteristics and movements by all modes; trips from committed development; current traffic
    flows and critical links and junctions
  level: should
- item: Injury accident records near the site access (three years, or five in a high accident area); environmental
    impacts of transport; accessibility improvements; parking; measures to reduce the need to travel and
    mitigate residual impacts
  level: should
- item: 'Minerals and waste: proportionate to the scale, with impacts, modal split and measures to improve
    access by public transport, walking and cycling; scope agreed with the council early'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 81. The list sets out the scope of a Transport
  Assessment or Statement but not when one is needed, so it shows as ''check''. Minerals and waste: the
  council''s Local Validation Requirements for Minerals & Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 42. A TA is needed for significant highway implications; otherwise case by case (''check'').'
review-status: unverified
