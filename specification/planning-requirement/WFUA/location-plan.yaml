reference: location-plan
local-authority: WFUA
required-if:
  always: true
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
source-text: 'Site Location Plan • Use up-to-date Ordnance Survey-based plan • Scale: 1:1250 (or 1:2500
  for large/remote sites) ... • Fit A4 or A3 paper, show North direction • Include nearby properties,
  postal numbers, and at least two named roads • Edge application site in red including all land needed
  for access, drainage, visibility splays, landscaping, parking, open areas • Edge adjacent land under
  applicant''s control in blue • Complete Certificate B if land within red line is not owned by applicant'
must-include:
- item: Up-to-date Ordnance Survey-based plan at 1:1250 (or 1:2500 for large or remote sites), fitting
    A4 or A3 paper, showing the North direction
  level: must
- item: Nearby properties, postal numbers and at least two named roads
  level: must
- item: Application site edged in red, including all land needed for access, drainage, visibility splays,
    landscaping, parking and open areas
  level: must
- item: Adjacent land under the applicant's control edged in blue
  level: must
- item: 'If a new non-mains foul drainage system is proposed: its position, with any soakaways and pipework,
    within the red line'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: A new non-mains foul drainage system is proposed.
  source-text: If a new non-mains foul drainage system is proposed, its position together with any associated
    soakaways and pipework must be shown within the application site (the red line) on the site location
    plan.
confidence: medium
notes: From the council's list (updated January 2026), page 60. From 'Plans & Drawings'. Certificate B
  is needed if land in the red line is not the applicant's. The non-mains drainage item is from 'Foul
  and Surface Water Drainage Assessment' (page 31).
