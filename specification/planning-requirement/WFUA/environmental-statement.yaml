reference: environmental-statement
local-authority: WFUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
  - condition:
      field: eia-development
      value: true
      description: Schedule 1 development, or Schedule 2 development likely to have significant environmental
        effects (EIA Regulations 2017).
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017; Cumbria Minerals
  and Waste Local Plan 2015-2030 policies SP15 and DC16
source-text: An EIA is required to accompany all applications for Schedule 1 developments and may be required
  for some Schedule 2 developments.
must-include:
- item: The likely significant effects on the environment and proposed mitigation, with the information
    in Schedule 4 of the Regulations
  level: must
confidence: medium
notes: 'Minerals and waste: the council''s Local Validation Requirements for Minerals & Waste Developments
  (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 19. The main list has no EIA item (national rules apply to other applications).'
review-status: unverified
field-status: {}
