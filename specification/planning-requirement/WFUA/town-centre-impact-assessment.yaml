source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies CS7.5 and DM23; Eden Local Plan policy EC7; Barrow Borough
  Local Plan policies R4, R7, R8, R9, R10 and R11
source-text: 'Retail: In order to ensure existing centres remain a focus for retail, a Sequential Test
  is required alongside planning applications for changes of use to retail outside of a town centre. ...
  Office: A Sequential Test is required alongside planning applications for new office developments outside
  of a town centre. ... The sequential test will be applied to proposed developments for main town centre
  uses which are not within an existing town centre as defined on the policies map. The sequential approach
  will not be applied to development for small scale rural offices or other small scale rural development.
  ... Policy DM23 – Retail Uses Outside of Town Centres • 2000 square metres gross floor space outside
  the town centre of Kendal • 1000 square metres gross floor space outside the town centre of Ulverston
  • 500 square metres outside the town centres of Grange- over-Sands, Kirkby Lonsdale and Milnthorpe'
must-include:
- item: 'Sequential test: evidence that no sites are available (now or within a reasonable timescale)
    in sequentially preferable locations, or that available units there are unsuitable and/or unviable'
  level: must
- item: 'Impact assessment: justification of the need and scale, the impact on the vitality of existing
    town centres and wider retail catchment, the availability of sites closer to a centre, and the impact
    on public and private investment in centres in the catchment'
  level: must
confidence: medium
notes: From the council's list (updated January 2026), page 70. Covers 'Sequential Test for Main Town
  Centre Uses' and 'Town Centre Retail and Leisure Impact Assessment' (page 79). The impact thresholds
  are those the list quotes from South Lakeland policy DM23 (policy column); for the Eden and Barrow areas
  the list gives no threshold, so impact assessments there show as 'check'.
