reference: affordable-housing-statement
local-authority: WFUA
required-if: discretionary
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies CS6.3, DM14 and AS03; Eden Local Plan policy HS1; Barrow Borough
  Local Plan policy H14
source-text: An affordable housing statement should specify what is being proposed with regard to affordable
  housing and should provide a justification for the amount and type proposed.
must-include:
- item: The total number of all residential units, and the number of affordable units with numbers of
    bedrooms and property types across all tenures
  level: should
- item: Plans showing the location of the units
  level: should
- item: The levels or types of affordability or tenure proposed for different units, explained in line
    with policy
  level: should
- item: How the affordable units will be managed, and any registered providers acting as development partners
  level: should
- item: A report from an independent chartered surveyor with market valuations for each affordable unit
  level: should
confidence: medium
notes: From the council's list (updated January 2026), page 4. The thresholds are left to the former districts'
  policies and guidance (South Lakeland Affordable Housing Guidance Note, Eden Housing SPD, Barrow Affordable
  Housing & Developer Contributions SPD) and are not stated in the list, so it shows as 'check'.
