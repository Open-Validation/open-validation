reference: air-quality-assessment
local-authority: WFUA
required-if:
  any:
  - condition:
      field: parking-spaces
      operator: '>='
      value: 50
      description: 50 or more new parking spaces.
  - all:
    - site:
        in:
        - air-quality-management-area
        description: In an Air Quality Management Area.
    - condition:
        field: parking-spaces
        operator: '>'
        value: 25
        description: More than 25 new parking spaces in an AQMA.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: Residential development of more than 80 units.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1.0
      description: Residential development of more than 1.0ha site area.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 2500
      description: Industrial or commercial development with a floor space over 2,500m2.
  - condition:
      field: direct-air-emissions
      value: true
      description: Industrial or commercial development with the potential for emissions to air (B1 1,500m2,
        B2 2,500m2, B8 3,000m2), or a prescribed process under the Environmental Permitting Regulations.
  - all:
    - site:
        in:
        - air-quality-management-area
        description: In an Air Quality Management Area.
    - condition:
        field: sensitive-end-use
        value: true
        description: Sensitive development (residential, school, healthcare etc.).
  - condition:
      field: traffic-aadt-increase
      operator: '>='
      value: 2
      description: A change in traffic volume of 2% of the annual average daily traffic (1% within an
        AQMA).
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - condition:
          field: direct-air-emissions
          value: true
          description: Emissions to air such as dust from extraction or blasting, odour, stack emissions,
            biological treatment sites, or a high level of new traffic emissions.
      - site:
          in:
          - air-quality-management-area
          description: Inside or adjacent to an air quality management area (AQMA).
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy DM7; Eden Local Plan policy ENV7; Barrow Borough Local Plan policy
  DS2; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP13, DC2 and DC5
source-text: 'Any development meeting the following criteria will normally be required to complete a full
  air quality assessment in order to predict the impact of the development on air quality and health:
  • if the development provides 50 or more new parking spaces or more than 25 in an AQMA (Air Quality
  Management Area) • residential development of more than 80 units or more than 1.0ha site area • industrial
  or commercial development with a floor space over 2,500m2 ... For any application that will result in:
  • emissions to air such as dust from extraction/blasting or other operational processes; odour; stack
  emissions; biological treatment sites; a high level of new traffic emissions in the local area. • where
  development is proposed inside or adjacent to an air quality management area (AQMA).'
must-include:
- item: An executive summary; clear, easy to read and jargon free
  level: must
- item: 'Minerals and waste: existing baseline data and a modelling assessment, with any monitoring locations
    agreed with the council before submission'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 8. Only the clearest of the list''s criteria
  are written out; the others (coach or lorry parks, sensitive development near a prescribed process,
  busy roads over 10,000 vehicles a day, speed or HGV changes, major phased redevelopment, street canyons)
  and its ''examples of proposed development likely to need an air quality statement'' show as ''check''.
  Minerals and waste: the council''s Local Validation Requirements for Minerals & Waste Developments (August
  2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 3.'
review-status: unverified
field-status: {}
