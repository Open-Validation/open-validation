reference: air-quality-assessment
local-authority: WFUA
required-if:
  any:
  - condition:
      field: parking-spaces
      operator: '>='
      value: 50
      description: The development provides 50 or more new parking spaces.
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is in an Air Quality Management Area.
    - condition:
        field: parking-spaces
        operator: '>'
        value: 25
        description: More than 25 new parking spaces.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: Residential development of over 80 units.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Residential development on a site over 1.0 hectare.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
source-text: 'a full air quality assessment in order to predict the impact of the development on air quality
  and health: if the development provides 50 or more new parking spaces or more than 25 in an AQMA (Air
  Quality Management Area)'
confidence: medium
notes: The residential branch (over 80 units or 1.0ha) is from the audit (item 36). Applies to all types,
  not only Full planning.
review-status: unverified
field-status: {}
