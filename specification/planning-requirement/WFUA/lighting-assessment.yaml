reference: lighting-assessment
local-authority: WFUA
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting (including equestrian related development) in the vicinity of residential
        property, a listed building or conservation area, ecologically sensitive areas or watercourses,
        where external lighting would be provided or made necessary.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - condition:
        field: external-lighting
        value: true
        description: External lighting with potential to impact on neighbouring property or the visual
          amenity of the area (including dark skies).
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy DM19
source-text: All proposals, including equestrian related development, involving floodlighting in the vicinity
  of residential property, a listed building or a conservation area, ecologically sensitive areas or watercourses,
  ... where external lighting would be provided or made necessary by the development. ... When proposals
  involve external lighting which has potential to impact on either neighbouring property, or on the visual
  amenity of the area (including on dark skies). Installation of ... external lighting on buildings may
  only require submission of details with the application for consideration. Where more significant new
  lighting is proposed, such a floodlighting, or lighting on car parks, open land or yards a Lighting
  Assessment prepared by a suitably qualified lighting engineer will be required.
must-include:
- item: Hours of operation; an isolux contour map showing light spillage to 1 lux; column heights with
    a layout plan and beam orientation; a schedule of equipment
  level: must
- item: Measures such as hoods and cowls to avoid glare; impact on nearby dwellings or roads and planting
    to mitigate it
  level: must
- item: Impact on protected species, in particular bats, and proposed mitigation
  level: must
- item: 'Minerals and waste: type and location of lighting including lux levels, hours, light spill assessment
    for nearby properties and the wider setting, less intrusive options and measures to reduce light pollution'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 27. External Lighting Assessment; highway
  street lighting details are not needed. Minerals and waste: the council''s Local Validation Requirements
  for Minerals & Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 30.'
review-status: unverified
field-status: {}
