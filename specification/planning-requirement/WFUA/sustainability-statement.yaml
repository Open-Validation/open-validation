reference: sustainability-statement
local-authority: WFUA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New homes.
  - condition:
      field: new-build
      value: true
      description: New business and commercial development, or infrastructure projects.
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies CS8.7 and DM2; Eden Local Plan policies DEV1 and ENV6; Barrow
  Borough Local Plan policies C5 and DS2; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP13,
  SP15, DC2, DC13 and DC22
source-text: 'A Climate Change Statement will be required for proposals for new homes, business and commercial
  development and infrastructure projects, it should include and answer: ... Required for all minerals
  and waste management development proposals.'
must-include:
- item: 'Answers to the list''s questions: sustainable transport; re-use of land and buildings and sustainable
    materials; renewable and low carbon energy; biodiversity net gain and green/blue infrastructure; risks
    from local climate change impacts and adaptation; the waste hierarchy and recycling space; energy
    conservation through design and layout'
  level: must
- item: 'Former South Lakeland area: the specific measures in Appendix 1 of the Development Management
    Policies DPD'
  level: must
  required-if:
    condition:
      field: former-district
      value: south-lakeland
      description: The site is in the former South Lakeland area.
  source-text: Does the development include the specific measures listed in Appendix 1 of the Development
    Management Policies DPD (2MB / 119 pages) to help respond to the climate emergency? This point only
    applies to South Lakeland District Council legacy area only
- item: 'New commercial buildings of more than 1000 sq. m.: meeting the BREEAM ''very good'' standard,
    showing how local policy targets can be met'
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: New commercial buildings of more than 1000 sq m.
- item: 'Minerals and waste: proportionate information showing energy management and resource efficiency,
    minimised water use, the waste hierarchy, energy-conserving buildings, minimised ''road miles'', no
    harm to peat bog, climate-resilient restoration and after use, and renewable energy opportunities'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 15. Climate Change Statement. Minerals and
  waste: the council''s Local Validation Requirements for Minerals & Waste Developments (August 2025),
  https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 9.'
review-status: unverified
field-status: {}
