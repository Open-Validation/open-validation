reference: planning-statement
local-authority: WFUA
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with the current development plan.
  - discretionary
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
source-text: 'When required: • Major applications (10 or more dwellings, 1000 square metres non-domestic
  floor space or site area one hectare or more • Applications not in accordance with the current development
  plans It is also strongly recommended that a planning statement is submitted where any complex planning
  issues are raised. ... Required for all development. It must provide a detailed description of the proposed
  development and an assessment of how the scheme fits ... with relevant national and local planning policy
  will be required.'
must-include:
- item: Local context, the need for the development, how it accords with national, regional and local
    policy, any emerging policies, and other material considerations
  level: should
- item: The planning balance, showing the social, economic and environmental benefits and how they outweigh
    any negatives
  level: should
- item: 'Minerals and waste: a detailed description of the development and an assessment against national
    and local policy'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 65. Strongly recommended where complex planning
  issues arise, which shows as ''check''. Minerals and waste: the council''s Local Validation Requirements
  for Minerals & Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 37.'
review-status: unverified
field-status: {}
