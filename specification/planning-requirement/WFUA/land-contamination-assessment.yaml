reference: land-contamination-assessment
local-authority: WFUA
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: The land is known or suspected to be contaminated.
  - all:
    - condition:
        field: near-landfill-site
        value: true
        description: The site is close to land known or suspected to be contaminated.
    - condition:
        field: ground-disturbance
        value: true
        description: Ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: The end user is sensitive to contamination (housing, schools, nurseries, hospitals,
        open space, children's play areas, allotments, potable groundwater).
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - site:
          in:
          - contaminated-land
          description: Likely land contamination from past uses, or the development disturbing existing
            contamination.
      - site:
          in:
          - near-landfill-site
          description: Close to an existing landfill site (usually within 250 metres).
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy DM7; Eden Local Plan policy ENV8; Barrow Borough Local Plan policy
  C4; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP16 and DC21
source-text: 'Where the land is known or suspected to be contaminated or where the development site is
  close to such land and ground works are proposed. Where the end user of the development is considered
  to be sensitive to contamination (for example: housing, schools, nurseries, hospitals, open space, children''s
  play areas, allotments and highly sensitive groundwater used for potable supply). ... there is a likelihood
  of land contamination from past uses of the land or as a result of the new development disturbing existing
  contamination • past or present uses which could lead to land contamination may include industry activity,
  chemical and fuel storage, treat and disposal of waste and sites located close to existing landfill
  sites (usually within 250 metres)'
must-include:
- item: 'As a minimum for validation: a Stage One desk study, site walkover and preliminary risk assessment'
  level: must
  source-text: For validation purposes a Stage One desk study, site walkover and preliminary risk assessment
    is the minimum requirement.
- item: 'Minerals and waste: a Phase 1 desktop survey (site history; sources, pathways and receptors),
    prepared by a competent and qualified person'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
  source-text: A Phase 1 report will be required to validate the planning application.
confidence: medium
notes: 'From the council''s list (updated January 2026), page 21. The list''s ''near-landfill-site'' stands
  in for land close to contaminated land; it gives long lists of uses likely or possibly to cause contamination.
  Minerals and waste: the council''s Local Validation Requirements for Minerals & Waste Developments (August
  2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 29.'
review-status: unverified
field-status: {}
