reference: landscaping-plan
local-authority: WFUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - application-type:
        in:
        - waste-dev
        - mineral-app
        - mineral-extraction
    - condition:
        field: landscaping-works
        value: true
        description: Landscape planting or screening is part of the proposals.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy DM4; Eden Local Plan policy ENV2; Barrow Borough Local Plan policy
  DS6; Cumbria Minerals and Waste Local Plan 2015-2030 policies DC18 and DC22
source-text: 'Full or applications for Reserved Matters: Information provided should include where appropriate:
  ... • topographical site survey plan drawn to a recognised metric scale, showing spot levels, contours,
  existing structures, walls, fences etc. • details of proposed boundary treatments, including materials,
  height, location • information on any surplus materials to be taken off site, or fill material to be
  imported • existing trees and other soft landscape features to be retained, and methods of protection
  during construction • details of all existing and proposed hard landscape materials, and their location
  • species, numbers (or planting density), distribution and sizes of proposed new planting and mixes
  for grass and wild flora seeding • the location of any existing or proposed underground or overhead
  services which could affect existing or proposed planting • any areas which are required for adoption
  by the Council ... Required for all proposals for full planning permission. Details of any proposed
  landscape planting should be included on the submitted Site Plans. Where landscape planting/screening
  is integral to the development proposals (for example, as identified within a LVIA report) then a detailed
  landscape strategy will also be required.'
must-include:
- item: 'Full and reserved matters: a topographical site survey to a metric scale (spot levels, contours,
    existing structures, walls, fences)'
  level: should
- item: 'Full and reserved matters: proposed boundary treatments (materials, height, location); surplus
    material to go off site or fill to be imported'
  level: should
- item: 'Full and reserved matters: existing trees and soft landscape to be retained, with protection
    during construction; existing and proposed hard landscape materials'
  level: should
- item: 'Full and reserved matters: species, numbers (or density), distribution and sizes of new planting
    and seed mixes; underground or overhead services affecting planting; areas for adoption'
  level: should
- item: All plans drawn to an identified metric scale
  level: must
- item: 'Minerals and waste: details of landscape planting on the site plans; where planting or screening
    is integral, a detailed landscape strategy with existing features to be retained, new planting with
    size and species, and protection and maintenance'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 45. Landscape and Planting Schemes. The
  list says what to include ''where appropriate'' but not when a scheme is needed, so it shows as ''check''.
  Minerals and waste: the council''s Local Validation Requirements for Minerals & Waste Developments (August
  2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 28.'
