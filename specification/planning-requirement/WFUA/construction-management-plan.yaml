reference: construction-management-plan
local-authority: WFUA
required-if:
  any:
  - discretionary
  - ref: major-development
  - site:
      in:
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      - ramsar
      description: Within or would affect a site of ecological importance (SAC, SSSI, County Wildlife
        Site, Ramsar site, Geo-Conservation Site, Limestone Pavement Area).
  - condition:
      field: near-watercourse
      value: true
      description: The site is within or close to a site that drains to a watercourse.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies DM4 and DM7; Eden Local Plan policies DEV2, ENV1, ENV8 and
  ENV9; Barrow Borough Local Plan policies C3b and DS2
source-text: 'When a proposed development is within or would affect a site of ecological importance: •
  Special Area of Conservation (SAC) • Site of Special Scientific Interest (SSSI) • County Wildlife Site
  (CWS) • Ramsar Site • Geo-Conservation Sites (formerly RIGs) • Limestone Pavement Area (LPA) ... • site
  is within or close to a site that drains to a watercourse ... CEMPs will be required in relation to
  all developments constituting Major Development.'
must-include:
- item: Covers all phases of the development and all contractors or sub-contractors
  level: must
- item: Timing, schedule and phasing of works; hours of working; sediment and pollution control; parking,
    loading/unloading and storage areas; security hoarding; wheel-washing
  level: must
- item: Measures to control dust, dirt, noise and vibration; recycling or disposal of construction and
    demolition waste; access and haul routes; use and storage of chemicals and oils; control of invasive
    species; mitigation for residential properties near construction compounds
  level: must
- item: Complaints procedure, site logbook, 24-hour emergency contact, how the plan is communicated, accurate
    plans and OS maps, and special methods for dusty, noisy or vibrating activities (e.g. piling)
  level: must
- item: 'CEMP: proportionate to the scale and risk of the development, stating how the level of detail
    was set, with responsibilities under legislation and for environmental mitigation during construction'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (updated January 2026), page 19. Covers the list's Construction Management
  Plan (CMP), whose 'when required' is not stated (so 'check'), and the Construction and Environmental
  Management Plan (CEMP), required for major development and for sites of ecological importance or draining
  to a watercourse. Geo-Conservation Sites and Limestone Pavement Areas have no designation id, so they
  are named in the description only.
review-status: unverified
field-status: {}
