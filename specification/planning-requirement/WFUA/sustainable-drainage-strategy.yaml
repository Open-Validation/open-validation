reference: sustainable-drainage-strategy
local-authority: WFUA
required-if:
  any:
  - ref: major-development
  - condition:
      field: new-build
      value: true
      description: Residential, commercial and industrial development (Sustainable Drainage System).
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: In Flood Zone 2 or 3, or Flood Zone 1 in an Area with Critical Drainage Problems.
  - condition:
      field: adjoins-highway
      value: true
      description: Sites adjacent to areas at risk of flooding, and development adjoining a highway.
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies CS8.8, DM6 and AS12; Eden Local Plan policies DEV2, ENV1 and
  ENV9; Cumbria Minerals and Waste Local Plan 2015-2030 policies DC19 and DC20
source-text: major developments (10 dwellings or more, 1.0 hectare or more, 1000 square metres or more)
  a site specific drainage strategy is required ... all residential, commercial and industrial development
  should include an appropriate Sustainable Drainage System (SuDS) ... • all major applications and all
  applications in areas at risk from flooding (Flood Zones 2 or 3) or sites within Flood Zone 1 in an
  Area with Critical Drainage Problems (ACDA) as notified by the Environment Agency • sites adjacent to
  areas at risk of flooding and applications where development adjoins a highway
must-include:
- item: A full investigation of the surface water hierarchy, with evidence why preferable options were
    discounted
  level: must
- item: 'For sites forming part of a wider development: how the drainage relates to a master drainage
    strategy for the whole site'
  level: must
- item: 'Surface water scheme: scaled plans of the existing site and proposed layout with the drained
    area; a topographical level survey (AOD); controlled discharge rates for 1 in 1 and 1 in 100 year
    (plus climate change) events based on greenfield runoff; storage volume'
  level: must
- item: 'Surface water scheme: proposed SuDS with a design statement; geological and infiltration information;
    flood and drainage design drawings; hydraulic calculations; third party agreement to discharge; overland
    flow routes'
  level: must
- item: 'Surface water scheme: a management plan for maintenance and adoption for the development''s lifetime;
    construction phasing; current system capacity and discharge rate; adoption details; finished floor
    levels'
  level: must
- item: 'Minerals and waste: drainage arrangements with evidenced capacity allowing for climate change;
    surface water type, quantities and storage/disposal; runoff not exceeding the undeveloped site''s
    up to the 1 in 100 year plus climate change storm; no impact on neighbouring land; scale plans'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 75. Surface Water Drainage / Drainage Strategy
  / Scheme / SuDS. In other cases applicants should say why a drainage strategy is not needed. Uses the
  new field adjoins-highway. Minerals and waste: the council''s Local Validation Requirements for Minerals
  & Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 14. The foul drainage parts of both lists have no id (unmapped).'
review-status: unverified
field-status: {}
