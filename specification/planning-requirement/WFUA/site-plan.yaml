reference: site-plan
local-authority: WFUA
required-if: discretionary
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
source-text: 'Site Layout Plan (Block Plan) - Scale: 1:200 or 1:500 • Show North direction • Clearly identify
  proposed building footprint (hatched/coloured) • Include written dimensions and distances to boundaries
  • Show all buildings, roads, footpaths on adjoining land • Show public footpaths/bridleways crossing
  or adjoining the site • Show positions of trees on or near the site • Show hard surfacing and boundary
  treatments • Identify any buildings to be demolished'
must-include:
- item: Scale 1:200 or 1:500, with the North direction
  level: must
- item: Proposed building footprint clearly identified (hatched or coloured), with written dimensions
    and distances to boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, and public footpaths or bridleways crossing
    or adjoining the site
  level: must
- item: Positions of trees on or near the site; hard surfacing and boundary treatments; any buildings
    to be demolished
  level: must
confidence: medium
notes: 'From the council''s list (updated January 2026), page 61. From ''Plans & Drawings: Plan Submission
  Requirements''. The list sets out what each plan must show, not when it is needed (the national rules
  apply), so the trigger shows as ''check''.'
