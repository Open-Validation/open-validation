policy: Eden Local Plan policy COM2; Barrow Borough Local Plan policy HC10
source-text: 'Required for the following types of application/development: • all major applications that
  generate a need for open space • applications that propose the loss or relocation of existing open space'
confidence: medium
notes: From the council's list (updated January 2026), page 59. Open Space Assessment. 'new-open-space'
