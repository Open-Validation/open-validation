reference: recreation-facilities-assessment
local-authority: WFUA
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: new-open-space
        value: true
        description: Major application that generates a need for open space.
  - condition:
      field: loss-of-open-space
      value: true
      description: Proposes the loss or relocation of existing open space.
