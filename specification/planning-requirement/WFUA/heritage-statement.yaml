reference: heritage-statement
local-authority: WFUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      - locally-listed-building
      description: Within the curtilage or affecting the setting of a listed building; in or affecting
        the setting of a conservation area; affecting a scheduled ancient monument, registered park or
        garden, archaeological site or non-designated heritage asset, or their setting.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - scheduled-monument
          - park-and-garden
          - battlefield
          description: Impact on a designated heritage asset or its setting.
      - discretionary
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies CS8.6 and DM3; Eden Local Plan policy ENV10; Barrow Borough
  Local Plan policies HE1 and HE2; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP15 and DC17
source-text: 'A Heritage Statement of Significance and Impact will be required for the following: • applications
  for listed building consent • applications within the curtilage of a listed building, and those that
  affect its setting • applications in a conservation area and those that affect its setting • applications
  affecting a scheduled ancient monument and those that affect its setting ... • applications affecting
  a registered park or garden of special historic interest and those that affect its setting • applications
  affecting an archaeological site and those that affect its setting • applications affecting a non-designated
  heritage asset, and those that affect its setting. ... Required for any proposal which will impact upon:
  • a designated heritage asset, or its setting. A designated heritage asset is a listed building, scheduled
  monument, conservation area, registered park and garden, and registered battlefield. • archaeological
  assets, whether designated or not, or has the potential to impact upon currently unknown archaeological
  assets'
must-include:
- item: 'Three parts: an assessment of heritage significance, an assessment of impact, and a justification
    and mitigation strategy, proportionate to the works and the asset'
  level: must
- item: 'Minerals and waste: identifies and describes heritage assets in or near the site, considers direct
    and setting impacts, and shows how impacts were avoided or minimised'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 40. Heritage Statement of Significance and
  Impact. Minerals and waste: the council''s Local Validation Requirements for Minerals & Waste Developments
  (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 24. Impact on archaeological assets, including unknown ones, shows as ''check''.'
