source-text: 'A Heritage Statement of Significance and Impact will be required for the following: applications
  for listed building consent applications within the curtilage of a listed building, and those that affect
  its setting applications in a conservation area and those that affect its setting applications affecting
  a scheduled ancient monument and those that affect its setting applications affecting a registered park
  or garden of special historic interest and those that affect its setting a…'
