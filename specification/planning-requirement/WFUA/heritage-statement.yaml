reference: heritage-statement
local-authority: WFUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: The application is within the curtilage or setting of a listed building, in or affecting
        the setting of a conservation area, or affects a scheduled ancient monument or registered park
        or garden.
