reference: biodiversity-survey-report
local-authority: WFUA
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: Greenfield development (typically agricultural or amenity land).
    - condition:
        field: protected-species
        value: true
        description: The development could affect rare, protected or notable species or habitats.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - local-wildlife-site
      description: Development within or adjacent to an SSSI, SPA, Ramsar Site, SAC, Site of Biological
        or Geological Importance, National Nature Reserve, County Wildlife Site or RIGS.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
source-text: … is required for all major applications and for greenfield development (typically agricultural
  or amenity land) that could directly or indirectly affect rare, protected, or notable species or habitats
  … Development within or adjacent to a Site of Special Scientific Interest (SSSI), Special Protection
  Area (SPA), Ramsar Site, Special Area of Conservation (SAC), Site of Biological or Geological Importance,
  National Nature Reserve, County Wildlife Site, or Regionally Important Geological/Geomorphological Site
  (RIGS)
must-include:
- item: For proposals removing trees, scrub or hedgerows or altering watercourses, the species present,
    potential impacts on them and proposed mitigation
  level: must
  source-text: Any proposal involving the removal of trees, scrub, or hedgerows, or altering watercourses,
    must include details of species present, potential impacts on those species, and proposed mitigation
    measures.
confidence: medium
notes: 'Audit (wrong_app_type): some small householder proposals in designated sites need it too. The
  designated-site wording is from the council tab (January 2026 list).'
review-status: unverified
field-status: {}
