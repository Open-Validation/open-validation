reference: biodiversity-survey-report
local-authority: WFUA
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: Greenfield development (typically agricultural or amenity land).
    - condition:
        field: protected-species
        value: true
        description: Could directly or indirectly affect rare, protected or notable species or habitats.
  - condition:
      field: demolition
      value: true
      description: Demolition of a building.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversion of a building (e.g. barn conversion).
  - condition:
      field: potential-roost-features
      value: true
      description: Works to bridges, viaducts, tunnels, mines, kilns, cellars and underground structures;
        buildings known to support roosting bats; development affecting the roof space of a building.
  - condition:
      field: near-watercourse
      value: true
      description: Works near watercourses, wetlands, ponds and/or wooded areas.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Works to trees or hedgerows.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - ramsar
      - special-area-of-conservation
      - national-nature-reserve
      - local-wildlife-site
      - ancient-woodland
      description: Within or adjacent to an SSSI, SPA, Ramsar site, SAC, Site of Biological or Geological
        Importance, National Nature Reserve, County Wildlife Site, RIGS or Wildlife Trust reserve, or
        involving Ancient Woodland.
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - special-protection-area
          - ramsar
          - special-area-of-conservation
          - national-nature-reserve
          - local-wildlife-site
          description: Likely to adversely impact on a designated site.
      - condition:
          field: protected-species
          value: true
          description: Likely to affect protected or priority species or habitats, or other important
            biodiversity or geological features.
      - condition:
          field: potential-roost-features
          value: true
          description: Modification, conversion, demolition or removal of buildings and structures of
            the kinds listed (agricultural buildings, pre-1960 buildings near woodland or water...); tunnels,
            mines, bridges and similar.
      - condition:
          field: external-lighting
          value: true
          description: Lighting of churches or listed buildings, or floodlighting, within 50 metres of
            woodland, water or connected hedgerows or lines of trees.
      - condition:
          field: hedgerows-affected
          value: true
          description: Works affecting woodland, or hedgerows or lines of trees connected to woodland
            or water.
      - condition:
          field: veteran-trees
          value: true
          description: Felling or lopping of veteran trees, trees with cracks, holes or cavities, or trees
            over 1m diameter at chest height.
      - condition:
          field: geodiversity-interest
          value: true
          description: Works affecting gravel pits, quarries, natural cliff faces, or rock outcrops with
            crevices or caves.
      - all:
        - ref: major-development
        - condition:
            field: near-watercourse
            value: true
            description: Within 500 metres of a pond, or 200 metres of rivers, streams, canals, lakes
              or other aquatic habitats.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies CS8.4, DM4 and AS04; Eden Local Plan policies ENV1 and ENV2;
  Barrow Borough Local Plan policy N3; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP15 and
  DC16
source-text: 'A biodiversity assessment (also referred to as an ecological assessment or nature conservation
  assessment) is required for all major applications and for greenfield development (typically agricultural
  or amenity land) that could directly or indirectly affect rare, protected, or notable species or habitats
  ... A protected species survey and assessment should be submitted where the proposed development involves:
  • Demolition of a building • Conversion of a building (e.g., barn conversion) • Works to bridges, viaducts,
  tunnels, mines, kilns, cellars, and underground ducts or structures • Works near watercourses, wetlands,
  ponds, and/or wooded areas • Buildings known to support roosting bats • Development affecting the roof
  space of a building ... An ecological survey should be submitted where the proposed development involves:
  • Works to trees or hedgerows • Development of overgrown sites • Development within or adjacent to a
  Site of Special Scientific Interest (SSSI), Special Protection Area (SPA), Ramsar Site, Special Area
  of Conservation (SAC), Site of Biological or Geological Importance, National Nature Reserve, County
  Wildlife Site, or Regionally Important Geological/Geomorphological Site (RIGS) • Wildlife Trust reserves
  • Sites involving Ancient Woodland ... Required where a development proposal is likely to adversely
  impact on designated sites (a designated site is as defined on the Natural England website www.magic.gov.uk),
  protected or priority species or habitats, or other important biodiversity or geological features that
  may be affected.'
must-include:
- item: Species surveys undertaken at the correct time of year and completed reports submitted with the
    application (surveys cannot be conditioned)
  level: must
  source-text: Surveys cannot be conditioned; therefore, completed survey reports must be submitted with
    the application before validation.
- item: 'For removal of trees, scrub or hedgerows, or altering watercourses: the species present, potential
    impacts on them and proposed mitigation'
  level: must
  required-if:
    any:
    - condition:
        field: tree-removal
        value: true
        description: Removal of trees, scrub or hedgerows.
    - condition:
        field: watercourse-culverting
        value: true
        description: Altering watercourses.
  source-text: Any proposal involving the removal of trees, scrub, or hedgerows, or altering watercourses,
    must include details of species present, potential impacts on those species, and proposed mitigation
    measures.
- item: 'Minerals and waste: a comprehensive habitats and/or species survey, assessment and mitigation
    report identifying likely impacts; where harm is likely, evidence assessing the impact and addressing
    long-term maintenance and management'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
- item: 'Minerals and waste: biodiversity issues addressed in accordance with BS 42020:2013'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
- item: 'Minerals and waste, where a European site may be affected: enough information to inform a Habitats
    Regulations Assessment (a shadow HRA is advised)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 12. Biodiversity Assessment (protected species
  survey and/or ecological survey). Development of overgrown sites has no field and, like some smaller
  applications, including certain householder proposals in designated sites or green gaps or affecting
  overgrown land, ''may also require'' one, which shows as ''check''. Minerals and waste: the council''s
  Local Validation Requirements for Minerals & Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 3. The lists don''t ask for a biodiversity net gain metric (the council''s separate BNG guidance
  page is not part of them).'
