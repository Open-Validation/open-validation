reference: waste-management-plan
local-authority: WFUA
required-if:
  any:
  - condition:
      field: hmo-creation
      value: true
      description: HMOs.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1
      description: Commercial development.
  - ref: major-development
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - condition:
          field: ground-disturbance
          value: true
          description: Site excavation.
      - condition:
          field: demolition
          value: true
          description: Demolition of buildings and structures.
      - condition:
          field: new-build
          value: true
          description: Large new development.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: Barrow Borough Local Plan policies EC3 and H7
source-text: 'When required: • HMO’s • commercial • major developments (10 dwellings or more, 1.0 hectare
  or more, 1000 square metres or more) ... Required for proposals involving site excavation or demolition
  of buildings and structures or large new development.'
must-include:
- item: The provision made for storage of waste and recycling, and how it aids collection by the waste
    collection authority
  level: must
- item: The location of waste storage and recycling facilities clearly identified on the plans
  level: must
- item: 'Minerals and waste (site waste management plan): waste arising with estimated quantity, proportion
    retained on site and disposal method; opportunities for re-use and recovery; reference to the waste
    hierarchy'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 92. Waste Management Statement (refuse and
  recycling storage). Minerals and waste: the council''s Local Validation Requirements for Minerals &
  Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 39. Site Waste Management Plan. ''Large'' new development is not defined.'
review-status: unverified
field-status: {}
