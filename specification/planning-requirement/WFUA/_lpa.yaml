    used for the minerals and waste branches of the files. Published within the last two years, so current.'
  status: current
submission-standards:
- item: All plans submitted in PDF format
  level: must
- item: Plans match the paper size drawn to (for example A4, A3, A2), state the scale and original paper
    size (for example 1:100 @ A3) and include a scale bar
  level: must
- item: '''Do Not Scale'' replaced with clear wording such as ''Scale for planning only'''
  level: must
- item: Plans clear and accurate; eaves and foundations near boundaries shown at a scale not less than
    1:20
  level: must
- item: Each plan has a unique reference number; clear, descriptive file names (for example 'Proposed
    Elevations – Drawing 102A.pdf')
  level: must
- item: Accurate geographical coordinates where there is no postcode
  level: must
- item: No signatures, email addresses or phone numbers on plans
  level: must
- item: EIA or major applications may require paper copies of plans and documents
  level: should
- item: 'Amended plans: a plan number, title and date, with a revision reference (e.g. Rev A) and changes
    annotated in red; amended documents in ''clean'' and ''tracked changes'' versions'
  level: must
audit:
