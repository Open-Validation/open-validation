reference: noise-assessment
local-authority: WFUA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Potential to generate noise (e.g. industrial units, external air conditioning units,
        workshops, day nurseries, nightclubs, places of worship, pubs, restaurants/takeaways, schools/colleges,
        outdoor sports facilities).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Located next to an existing noise source (e.g. an industrial site, a busy road or railway
        line).
  - condition:
      field: piling
      value: true
      description: Noisy construction methods such as piling may be necessary.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Likely to generate significant noise above background levels (commonly minerals
            applications).
      - condition:
          field: hcv-movements
          value: true
          description: Regular movements of larger vehicles.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: Barrow Borough Local Plan policies H7 and EC3; Cumbria Minerals and Waste Local Plan 2015-2030
  policy DC3
source-text: 'A noise impact and sound insulation assessment should accompany applications for: • proposed
  developments that have the potential to generate noise, for example: Industrial units, installation
  of external air conditioning units, workshops, day nurseries, nightclubs, places of worship, public
  houses, restaurants/takeaways, • schools/colleges or outdoor sports facilities • proposed developments
  located next to an existing noise source, for example, next to an industrial site, a busy road, or railway
  line • developments where noisy construction methods may be necessary, such as piling ... Any development
  which is likely to generate significant noise above background levels or regular movements of larger
  vehicles. It would commonly be required with minerals applications due to the nature of that operation,
  but could equally apply to noise associated with construction of new buildings, or the introduction
  of a ... new/more intensive activity near to sensitive receptors.'
must-include:
- item: Existing background noise levels measured over 24 hours (including cumulative levels of existing
    units) and proposed noise levels (cumulative)
  level: must
- item: Measures to reduce noise, the manufacturer's specification of equipment, and the method, calculations
    and assumptions used
  level: must
- item: Carried out by suitably qualified professionals
  level: must
- item: 'Minerals and waste: baseline noise climate at operating times, activities that could cause unacceptable
    noise, mitigation, and monitoring and reporting proposals'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 55. Noise Impact Assessment. Uses the new
  field piling. Minerals and waste: the council''s Local Validation Requirements for Minerals & Waste
  Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 33.'
review-status: unverified
field-status: {}
