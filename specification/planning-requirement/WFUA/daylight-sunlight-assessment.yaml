reference: daylight-sunlight-assessment
local-authority: WFUA
required-if:
  any:
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - discretionary
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: Barrow Borough Local Plan policies H7 and H16
source-text: 'When required: • Applications where there is potential to result in a significant loss of
  daylight or sunlight to adjoining properties including associated gardens and amenity space. • Applications
  for residential development where there is doubt that there will be sufficient daylight/sunlight to
  serve proposed residents. Requests for this information will be proportionate to the nature and scale
  of the development proposals and will only be requested where the Local Planning Authority consider
  it relevant, necessary, and material to the application in question. ... Required in circumstances where
  there is a potential adverse impact upon the current levels of sunlight/daylight enjoyed by adjoining
  properties or building(s), including associated gardens or amenity space, then applications may also
  need to be accompanied by a daylight/sunlight assessment.'
must-include:
- item: 'Following BRE BR209 (2022): enough information to assess sunlight to windows and to open spaces
    and gardens of adjacent properties, with shadow paths shown on a block plan'
  level: must
  source-text: Shadow paths should be demonstrated on a block plan (to an appropriate scale) showing the
    adjacent properties in relation to the proposed development.
confidence: medium
