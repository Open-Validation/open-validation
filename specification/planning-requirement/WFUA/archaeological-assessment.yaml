reference: archaeological-assessment
local-authority: WFUA
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: Within an area of known archaeological interest.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves disturbance of ground.
  - discretionary
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policies DM3 and CS8.6; Eden Local Plan policy ENV10; Barrow Borough
  Local Plan policies HE1, HE2 and HE6
source-text: Assessments will be required for all proposals involving the disturbance of ground within
  an area of known archaeological interest. ... A desk-based archaeological assessment and/or field evaluation
  may be necessary if an application site includes (or has the potential to include) or affect heritage
  assets with archaeological interest (designated or not).
must-include:
- item: Plans showing historic features, listed buildings and structures, historic parks and gardens,
    historic battlefields and scheduled ancient monuments; an analysis of significance; and the principles
    of and justification for the proposed work
  level: must
confidence: medium
notes: From the council's list (updated January 2026), page 11. Archaeological Evaluation and Impact Assessment.
  A desk-based assessment and/or field evaluation 'may be necessary' where the site has, or could have,
  heritage assets with archaeological interest, which shows as 'check'.
review-status: unverified
field-status: {}
