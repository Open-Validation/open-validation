reference: energy-statement
local-authority: WFUA
required-if:
  ref: major-development
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy CS8.7; Barrow Borough Local Plan policies C5, C6 and DS2
source-text: 'An Energy Statement will be required for all major applications, although we would encourage
  all applicants to consider how they can make their developments more energy efficient. A major application
  consists of: • 10 or more units of residential accommodation • new commercial development of 1,000 square
  metres or more • change of use of 1,000 square metres or more • site area exceeding 0.5 hectares where
  it is not known how many dwellings are to be created • development site area is 1 hectare or more'
must-include:
- item: The energy efficiencies to be made throughout the development
  level: must
confidence: medium
notes: From the council's list (updated January 2026), page 27. The list spells out major development
  (10 or more homes, 1,000 sq m commercial or change of use, 0.5ha where the number of homes is unknown,
  or 1ha).
