policy: Barrow Borough Local Plan policy I5
source-text: 'Where a proposed development is likely to generate significant amounts of movement or where
  it forms part of a category of development for which sustainable travel planning is required by local
  or national policy. This typically includes: • Major non-residential developments with significant staff,
  visitor, or customer travel demand. • Residential developments above a threshold defined in local planning
  policy (e.g., 50 or more dwellings). • Educational facilities (schools, colleges, universities). • Healthcare
  facilities (hospitals, health centres). • Leisure, retail, or employment sites above relevant floor
  space or trip generation thresholds. • Any development where a Transport Assessment or Transport Statement
  identifies the need for a Travel Plan. ... For development proposals likely to generate significant
  travel movements a Travel Plan will be required to demonstrate how travel generated by the development
  (including during construction/development phase if appropriate) and in particular how use of sustainable
  transport options will be encouraged.'
must-include:
- item: Identifies the travel demand generated; sets out measures to promote sustainable modes; establishes
    targets for reducing car travel
  level: must
- item: Arrangements for monitoring, reporting and reviewing progress; a Travel Plan Co-ordinator where
    applicable; a timetable for implementation and review
  level: must
- item: Submitted alongside any Transport Assessment or Transport Statement
  level: must
  source-text: Where a Transport Assessment or Transport Statement is required, the GTP should be submitted
    alongside it.
confidence: medium
