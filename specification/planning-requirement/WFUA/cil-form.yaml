reference: cil-form
local-authority: WFUA
required-if:
  all:
  - condition:
      field: former-district
      value: south-lakeland
      description: The site is in the former South Lakeland area.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings for domestic residence or holiday lets, including conversion or change
          of use to a new dwelling.
    - condition:
        field: residential-annexe
        value: true
        description: Annexes (a separate dwelling unit within a curtilage).
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Extensions near to or over 100 sq m.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1
        description: Large supermarkets or retail warehouses.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: Community Infrastructure Levy Regulations 2010; South Lakeland CIL Charging Schedule
source-text: 'The types of applications which may be liable for CIL and require a Form 1 (additional information)
  to be submitted are: • New dwellings for domestic residence, holiday lets. • Conversion/change of use
  to a new dwelling e.g. barn, shop, office to residential. This applies to both SL and CU applications.
  • Annexes (separate dwelling unit within a curtilage) e.g. granny flats, Extensions near to/over 100sqm
  • Large supermarkets/retail warehouse'
confidence: medium
notes: From the council's list (updated January 2026), page 17. CIL Form 1 (additional information). 'This
  applies to South Lakeland District Council legacy area only' (item heading). 'Large' supermarkets is
  not defined; the retail condition is only a pointer.
review-status: unverified
field-status: {}
