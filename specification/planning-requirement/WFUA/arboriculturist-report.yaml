reference: arboriculturist-report
local-authority: WFUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - outline-all
        - outline-some
        - reserved-matters
        - s73
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site, or on adjacent land within 15 metres of the boundary, that
          could influence or be affected by the development.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Likely to affect trees within or adjacent to the site.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy DM4; Eden Local Plan policy ENV2; Cumbria Minerals and Waste
  Local Plan 2015-2030 policy DC16
source-text: Where there are trees or hedgerows on the site or within 15 metres of the boundary of the
  site. ... A tree survey must be submitted where there are trees within a proposed planning application
  site, or on land adjacent to an application site that could influence or be affected by the development.
  ... Required for any development proposal which is likely to affect trees within and adjacent to the
  development site, either directly by loss or damage, ... or indirectly by developing in close proximity
  to trees and therefore potentially reducing their lifespan.
must-include:
- item: Prepared by a qualified arboriculturist to BS 5837:2012, saying which trees are to be removed
    and retained and how retained trees will be protected
  level: must
- item: 'A topographical survey plan with the exact tree locations, and a schedule giving for each tree
    or group: reference number, common name, height, stem diameter (BS 5837 Annex C), branch spread at
    four points, first branch and canopy height, life stage, condition, retention category (U, A-C), remaining
    contribution in years and preliminary management recommendations'
  level: must
- item: A Tree Constraints Plan showing the Root Protection Area of each tree (a full survey may not be
    needed in some cases)
  level: should
- item: A Tree Protection Plan showing buildings, retained trees with RPAs and crown spreads, protective
    fencing (with construction details), storage areas, drainage runs, roads, accesses and other features
    affecting trees
  level: must
- item: An Arboricultural Method Statement where construction or hard surfacing is within an RPA or retained
    trees could be harmed
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Construction or hard surfacing within the Root Protection Area of a retained tree.
- item: 'Minerals and waste: by qualified persons to the latest BS 5837, with a full arboricultural impact
    assessment, justification for felling and constraints plans with crown spreads'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (updated January 2026), page 85. Tree Surveys and Hedgerow Surveys; the
  list says a tree survey ''may be needed'' for householder, full, outline, reserved matters and section
  73 applications. Hedgerow assessments have no id (unmapped). Minerals and waste: the council''s Local
  Validation Requirements for Minerals & Waste Developments (August 2025), https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-08/Local%20Validation%20Requirements%20for%20Minerals%20%26%20Waste%20Developments%20%28accessible%20August%202025%29.pdf,
  page 43.'
review-status: unverified
field-status: {}
