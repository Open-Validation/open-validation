reference: viability-assessment
local-authority: WFUA
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing provision is below the policy requirement.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The developer considers a S.106 agreement not financially viable, or wishes to make
        reduced payments.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
policy: South Lakeland Local Plan policy CS6.3; Eden Local Plan policy HS1; Barrow Borough Local Plan
  policies H14 and I1
source-text: A financial viability report / appraisal will be required where the affordable housing provision
  is below the policy requirement. ... If the developer considers that it is not financially viable to
  enter into a S.106 Agreement or that they wish to make reduced payments, a financial viability assessment
  must be submitted.
must-include:
- item: Gross and net internal floor areas; land purchase price with proof, date of purchase and estimated
    market value of the site
  level: must
- item: Schedules of normal and abnormal development costs, proof of abnormal costs, and why full costs
    were not reflected in the purchase price
  level: must
- item: Expected sale prices and dates of sale, and intended profit levels
  level: must
- item: 'For affordable housing: the percentage of affordable housing that could be provided against a
    diminishing scale of profit levels, up to 100% affordable housing'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing provision is below the policy requirement.
confidence: medium
notes: From the council's list (updated January 2026), page 4. From 'Affordable Housing Statement' and
  'Heads of Terms (Section 106)' (page 34). A separate fee is payable for the council's independent review.
review-status: unverified
field-status: {}
