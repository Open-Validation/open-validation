reference: sci
local-authority: WFUA
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Classified as a departure from the current development plan.
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - any:
      - ref: major-development
      - condition:
          field: eia-development
          value: true
          description: Accompanied by an Environmental Statement.
source-url: https://www.westmorlandandfurness.gov.uk/sites/default/files/2025-12/Local%20Planning%20Validation%20Requirements%20%E2%80%93%20Updated%20January%202026.pdf
source-text: When the development is judged by the case officer to be locally significant. When the development
  is classified as a departure from the current development plan. When the proposal falls into the definition
  of a major application. ... Required for all major development proposals and those accompanied by Environmental
  Statements.
must-include:
- item: 'Minerals and waste: details of the consultation (who, what information, events), a summary of
    responses and how they were taken into account'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
