reference: heritage-statement
local-authority: CHI
required-if:
  site:
    in:
    - listed-building
    - archaeological-priority-area
    - conservation-area
    - scheduled-monument
    - park-and-garden
    description: The development is within the curtilage of or directly affects a listed building; is
      within an area of recognised archaeological importance; is within or in the setting of a conservation
      area; or directly affects or is within the setting of a scheduled monument or a Registered Historic
      Park or Garden.
source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
source-text: 'A Heritage statement is required for the following development which would: 1) be within
  the curtilage of, or directly affecting, a Listed Building 2) be within an area of recognised archaeological
  importance 3) be within a Conservation Area 4) be within the setting of a Conservation Area, 5) directly
  affect or be within the setting of a scheduled monument, and 6) directly affect or be within the setting
  of a Registered Historic Park or Garden.'
confidence: medium
notes: 'Audit (wrong_app_type, missing_requirement): the workbook had this only under listed building
  consent, but it applies to planning applications too, including householder work.'
review-status: unverified
field-status: {}
