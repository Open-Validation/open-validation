reference: arboriculturist-report
local-authority: CHI
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: New building work (including access drives, patios and drains or services) comes within
        15 metres of a tree.
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: The tree has a tree preservation order (on the site or on adjoining land) or lies within
        a conservation area.
source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
source-text: 'TREE SURVEY/ARBORICULTURAL IMPLICATIONS & METHOD STATEMENT When required An arboricultural
  impact appraisal (AIA) is required for any new building work (including construction of access drive,
  patios and the laying of drains/services) that comes within 15 metres of: 1) A tree the subject of a
  tree preservation order, either within the application site or on adjoining land, or 2) A tree that
  lies within a conservation area.'
confidence: medium
notes: 'Audit (wrong_app_type): triggered by new building work near trees, not by tree works applications.
  The audit names householder and full planning; most Part II items also apply to outline.'
review-status: unverified
field-status: {}
