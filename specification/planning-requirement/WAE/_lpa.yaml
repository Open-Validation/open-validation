submission-standards:
- item: No single file larger than 10 MB
  level: must
- item: Drawings, documents and photographs in PDF format
  level: should
- item: All drawings saved as a single layer
  level: must
- item: Printed page size matches the drawing settings
  level: should
- item: Drawings correctly orientated for on-screen display (north to the top of the page for maps)
  level: must
- item: Scanned documents at least 200 dpi for black and white and 100 dpi for colour
  level: must
- item: All drawings include a scale bar
  level: must
- item: Photographs no larger than 15 cm x 10 cm
  level: must
- item: Files named to RIBA conventions or Plain English alternatives, including the format (e.g. 'Floor
    Plans as Existing.pdf')
  level: should
- item: Sensitive data (car number plates, faces, signatures, bank details) redacted; where the information
    is needed, a redacted and a non-redacted copy
  level: should
