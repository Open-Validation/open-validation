reference: application-form
local-authority: WAE
required-if:
  always: true
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: A completed form is always required for the applications where this is not a statutory requirement
  but is recommended (one copy of all application documents must be supplied if submitted by post).
must-include:
- item: Every section of the form completed; where a section or question is not relevant, the form says
    so
  level: must
- item: The relevant certificate of ownership (A, B, C or D) completed, signed and dated; only one certificate
    completed
  level: must
  source-text: Always required (where the certificate of ownership is included within the application
    form). The relevant certificate must be completed, signed, and dated (part of application form). Only
    one certificate should be completed.
- item: 'Certificate B or C: the notice to owners completed and sent to all known owners'
  level: must
  source-text: The notice to owners must also be completed and sent to all known owners.
- item: 'Certificate C or D: the notice to unknown owners published in a local newspaper'
  level: must
  source-text: The notice to unknown owners needs to be published in a local newspaper.
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 8. Items
  1 (Application Forms) and 1.a (Certificate of Ownership), both marked National. The matrix marks the
  form mandatory for every application type.
review-status: unverified
