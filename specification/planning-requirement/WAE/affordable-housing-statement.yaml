reference: affordable-housing-statement
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - any:
    - all:
      - site:
          in:
          - designated-rural-area
          description: In a designated rural area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 6
          description: A net increase of 6 dwellings or more.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: A net increase of 11 dwellings or more.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Combined gross floorspace of more than 1000 sq m.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
policy: 'Waverley Local Plan Part 1: Strategic Policies and Sites, policy AHN1'
source-text: 'Where Local Plan policies apply details of affordable housing provision. The Council will
  require a minimum provision of 30% affordable housing on all housing developments where at least one
  of the following applies: In designated rural areas, developments for a net increase of 6 dwellings
  or more. In non-designated rural areas, developments for a net increase of 11 dwellings or more. Developments
  that have a combined gross floorspace of more than 1000 sqm.'
must-include:
- item: 'The affordable and market housing: location, floor space and number of habitable rooms'
  level: must
- item: Any Registered Providers acting as partners in the development
  level: should
- item: A clear and full explanation where different levels or types of affordability or tenure are proposed
    for different units
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 19. Item
  16, marked Local. Policy AHN1 is named in item 24 (Planning Obligations) for affordable housing. Application
  types follow the list's 'Requirement by Application Type' matrix, which marks each type 'Mandatory'
  or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
