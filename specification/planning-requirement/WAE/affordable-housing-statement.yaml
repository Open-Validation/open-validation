reference: affordable-housing-statement
local-authority: WAE
required-if:
  any:
  - all:
    - site:
        in:
        - designated-rural-area
        description: The site is in a designated rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 6
        description: A net gain of 6 or more dwellings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: A net gain of 11 or more dwellings.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: More than 1,000 square metres of housing floorspace.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
confidence: medium
notes: 'From the audit (missing_requirement): item 16, net 6+ dwellings in designated rural areas, 11+
  elsewhere, or >1,000 sqm.'
review-status: unverified
field-status: {}
