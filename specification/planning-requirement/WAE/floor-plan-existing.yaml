reference: floor-plan-existing
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - approval-condition
      - ldc-prospective-use
      - demolition-con-area
  - condition:
      field: building-works
      value: true
      description: Operational development (building works and engineering operations) is proposed.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: All applications where operational development (building works and engineering operations)
  is proposed.
must-include:
- item: At a scale of 1:100 or 1:50
  level: should
- item: Accurately shows the proposed works in relation to what is already there
  level: must
- item: Plans named and numbered with corresponding document titles
  level: should
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 12. Item
  5d (Existing and Proposed Floorplans), marked National. The rest of the 'What is required?' text repeats
  the elevations wording (all sides, materials, windows and doors) and is not listed here. Application
  types follow the list's 'Requirement by Application Type' matrix, which marks each type 'Mandatory'
  or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
