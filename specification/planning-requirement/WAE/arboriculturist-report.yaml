reference: arboriculturist-report
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - approval-condition
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Demolition, building or engineering operations (including foundations, level changes
        and service or utility runs) may affect trees on the site or on adjoining land, especially protected
        trees or trees in a Conservation Area.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Sites carrying out demolition, building or engineering operations (including the excavation
  of foundations, any changes in level and service or utility runs) where these may affect trees both
  on-site or on adjoining land, especially sites and neighbouring properties containing trees protected
  by Tree Preservation Orders and/or Conservation Areas. Householder applications should show all trees
  within 10 metres of the development.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: 'Householder applications: all trees within 10 metres of the development'
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: 'Minor and major applications: a Tree Survey and Arboricultural Impact Assessment, including tree
    protection measures'
  level: must
  required-if:
    any:
    - &id001
      ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development.
- item: Prepared by a person with relevant expertise in trees in relation to construction
  level: should
  required-if:
    any:
    - *id001
    - condition:
        field: minor-development
        value: true
        description: Minor development.
- item: Survey, tree protection plan and impact assessment following the current BS5837
  level: should
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 14. Item
  7 (Tree Survey/Arboricultural implications), marked Local. Application types follow the list's 'Requirement
  by Application Type' matrix, which marks each type 'Mandatory' or 'Possibly required dependent on the
  proposal'.
review-status: unverified
field-status: {}
