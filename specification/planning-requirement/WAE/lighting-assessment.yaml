reference: lighting-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
      - advertising
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Applications or advertisements where external lighting would be provided or made necessary
  by the development.
must-include:
- item: Details of the external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: Light spillage, intensity and strength shown on a contour map with lux levels
  level: must
- item: Details of any lighting columns and equipment
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 6 and 21. Item
  22, marked Local. The matrix marks full, outline, reserved matters and discharge of condition; advertisements
  are added because the text names them.
review-status: unverified
field-status: {}
