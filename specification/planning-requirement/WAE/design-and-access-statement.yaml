reference: design-and-access-statement
local-authority: WAE
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building or buildings with floorspace of 100 sq m or more.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Major development (defined as development of 10 or more dwellings (or 0.5 hectares for residential
  development where the number of dwellings is unknown) for the creation of more than a 1,000 sq m of
  floor space and where the site is greater than 1 hectare). Development in a designated area (World Heritage
  Site or Conservation area) where the proposed development consists of either one or more dwellings or
  a building or buildings with floor space of 100 sq m or more. Applications for listed building consent.
must-include:
- item: 'Listed building consent: how the statement has taken account of the building''s special architectural
    or historic importance'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: the physical features that justify its listing (with details of the
    listing)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: the building''s setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 15. Item
  8, marked National. The other contents the list gives are the national ones (design principles, context,
  access policy and consultation), so they are not repeated.
review-status: unverified
field-status: {}
