reference: fire-statement
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 m or more high.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Required where a building has a height of 18m or more, or 7 or more storeys, whichever is
  reached first AND contains 2 or more dwellings or educational accommodation.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect), with the particulars
    it asks for
  level: must
- item: The fire safety principles, concepts and approach applied to each building, and the site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How local development document policies on fire safety have been considered
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 18. Item
  14 (Fire Safety Statement), marked National. Application types follow the list's 'Requirement by Application
  Type' matrix, which marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
