reference: environmental-statement
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: eia-development
      value: true
      description: Development of a type listed in Schedule 2 of the EIA Regulations that needs an Environmental
        Statement.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: An Environmental Statement (ES) must be undertaken for development that fall within the types
  listed in Schedule 2 of the Regulations. Where an applicant is uncertain if a development proposal requires
  an ES you should seek a Screening Opinion from the Council before submitting the planning application.
  If agreed that an ES is required, you should then seek a Scoping Opinion and submit the Environmental
  Statement alongside the planning application.
must-include:
- item: Scope as agreed in the Scoping Opinion
  level: must
- item: At least 2 hard copies of the ES and the Non-Technical Summary, with 2 copies on CD-ROM
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 6 and 22. Item
  26, marked National. Application types follow the list's 'Requirement by Application Type' matrix, which
  marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
