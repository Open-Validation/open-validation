reference: heritage-statement
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - approval-condition
      - demolition-con-area
  - any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - locally-listed-building
        - archaeological-priority-area
        - scheduled-monument
        - park-and-garden
        description: Within or adjacent to a Conservation Area, or affecting a heritage asset or its setting
          (Listed Buildings, Buildings of Local Merit, Areas or Sites of High Archaeological Potential,
          County Sites of Archaeological Importance, Scheduled Ancient Monuments, Registered Parks and
          Gardens).
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Applications for Listed Building Consent either directly related to, or impacting on, the
  setting of Listed assets. Applications within, or adjacent to, a conservation area; - excluding advertisement
  applications and changes of use with no alterations to elevations. Heritage assets including - Listed
  Buildings, Conservation Areas, Buildings of Local Merit, Areas or Sites of High Archaeological Potential,
  County Sites of Archaeological Importance, Scheduled Ancient Monuments, Registered Parks and Gardens.
must-include:
- item: Identifies the heritage assets and shows how the proposals preserve or enhance their significance
  level: must
- item: 'Listed building consent: a schedule of works to the listed building(s)'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: analysis of the significance of the archaeology, history and character
    of the building or structure'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: the principles of and justification for the works and their impact on
    the building''s special character, its setting and the setting of adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Relevant demolition in a conservation area: a structural survey if appropriate, an analysis of
    the character and appearance of the building, and the principles of, justification for and impact
    of the demolition on the area'
  level: should
  required-if:
    application-type:
      in:
      - demolition-con-area
- item: 'Proposals affecting the setting of heritage assets: plans showing historic features on or next
    to the site (listed buildings and structures, historic parks and gardens, historic battlefields, scheduled
    ancient monuments)'
  level: should
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 16. Item
  9, marked National. The listed building, demolition and setting items are what the list says 'may be
  required', so they show as 'should'. The schedule of works is part of this statement in Waverley's list,
  not a separate document. Changes of use with no alterations to elevations are excluded. Application
  types follow the list's 'Requirement by Application Type' matrix, which marks each type 'Mandatory'
  or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
