reference: location-plan
local-authority: WAE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - prior-approval
    - approval-condition
    - ldc-existing-use
    - ldc-prospective-use
    - demolition-con-area
    - pa-ecomms-network
    - advertising
    - hedgerow-removal
    - pip
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: 'All applications with the following exceptions: Works to Trees; Variation of Condition applications;
  Non-material amendments; Prior Approval applications – although a plan suitable to identify the site
  is still required.'
must-include:
- item: Up-to-date Ordnance Survey based plan at an appropriate scale, usually 1:1250 or 1:2500
  level: must
- item: At least two named roads and all surrounding buildings or land
  level: must
- item: The application site (the whole planning unit) edged clearly with a continuous red line, including
    all land needed to carry out the development (access from a public highway, visibility splays, landscape,
    car parking and open areas around the building)
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
- item: A north point and the scale clearly identified
  level: must
- item: OS Crown copyright licence number
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 10. Item
  5a, marked National. The matrix marks it mandatory for every type, but the text excludes works to trees,
  section 73 and non-material amendments, so those types are left out. Prior approvals are kept because
  a plan identifying the site is still required.
review-status: unverified
field-status: {}
