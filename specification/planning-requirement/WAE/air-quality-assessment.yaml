reference: air-quality-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - site:
      in:
      - air-quality-management-area
      description: Inside, or adjacent to, an Air Quality Management Area.
  - any:
    - condition:
        field: biomass-or-chp
        value: true
        description: Combined heat and power plant or biomass boilers.
    - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Applications that generate pollutants or increased traffic emissions or combined heat and
  power plant/ biomass boilers where the development is proposed inside, or adjacent to an Air Quality
  Management Area (AQMA).
must-include:
- item: Enough information to allow full consideration of the proposal's impact on the area's air quality
  level: must
  required-if: discretionary
  source-text: Where the grant of planning permission would conflict with, or render unworkable, elements
    of the local authority’s Air Quality Action Plan
- item: Prepared by a suitably qualified person
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 19. Item
  18, marked Local. 'Generate pollutants or increased traffic emissions' has no threshold, so that part
  shows as discretionary. Application types follow the list's 'Requirement by Application Type' matrix,
  which marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
