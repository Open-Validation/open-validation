reference: sustainable-drainage-strategy
local-authority: WAE
required-if:
  any:
  - &id001
    ref: major-development
  - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: 'Sustainable Drainage Statement: Major applications - (10 or more dwellings or 1,000 sq.
  m. of floor space, 1 ha site areas). For Householder and other minor extensions within Flood Risk Zones
  2 and 3 a completed Flood Matrix is required. Surface Water Drainage Strategy - SuDS Proforma: A surface
  water drainage strategy is required for all scales of development where surface water will be created
  or affected.'
must-include:
- item: Complies with the principles in the NPPG
  level: must
  required-if: *id001
- item: A foul drainage strategy, as part of the statement or separately
  level: must
  required-if: *id001
- item: 'Householder applications: the means of and changes to surface water drainage shown on the submitted
    plans'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Other applications: how the surface water scheme follows the drainage hierarchy'
  level: must
- item: 'Other applications: pre-development and post-development runoff rates, with storm water storage
    calculations'
  level: must
- item: 'Other applications: discharge location(s) and drainage calculations supporting the design'
  level: must
- item: 'Other applications: drawings of the proposed surface water drainage scheme, with sub-catchment
    breakdown where applicable'
  level: must
- item: 'Other applications: maintenance and management plan for the lifetime of the development, including
    future adoption'
  level: must
- item: 'Other applications: the completed drainage (SuDS) proforma'
  level: must
- item: Sustainable drainage systems shown on all relevant plans
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 13-14. Items 6a
  (Sustainable Drainage Statement, National) and 6b (Surface Water Drainage Strategy - SuDS Proforma,
  Local), which both map to this id. 'Where surface water will be created or affected' has no measurable
  test, so that part shows as discretionary. The Flood Matrix for householder and minor extensions in
  flood zones 2 and 3 is under flood-risk-assessment. The matrix has no row for 6a or 6b.
review-status: unverified
field-status: {}
