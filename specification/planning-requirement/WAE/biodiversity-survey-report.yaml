reference: biodiversity-survey-report
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - approval-condition
  - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Where the checklist indicates a potential impact on biodiversity interests you must provide
  further surveys or information assessing this impact. Where the requirement for Surveys is indicated
  these are required prior to registration of the application.
must-include:
- item: Information on existing biodiversity interest and possible impacts on it
  level: must
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
  required-if: discretionary
  source-text: Where proposals are being made for mitigation and/or compensation measures information
    to support these proposals will be needed.
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 9. Item 4
  (Biodiversity Checklist, Local). The checklist is required for all applications except change of use
  with no operational development, section 73, listed building, certificates of lawfulness and advertisements;
  surveys are needed only where the completed checklist says so, which is why the rule is discretionary.
  All recommended surveys are needed to determine the application, but it can be registered on the initial
  set. Application types follow the list's 'Requirement by Application Type' matrix, which marks each
  type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
