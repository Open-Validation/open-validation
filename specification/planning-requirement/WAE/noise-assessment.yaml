reference: noise-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - any:
    - condition:
        field: plant-equipment
        value: true
        description: Mechanical and electrical building services plant or equipment such as flues, air
          handling units / air conditioning, extraction, air source heat pumps and combustion appliances.
    - condition:
        field: noise-generating-use
        value: true
        description: Development that may cause noise pollution.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development close to existing noise sources.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Applications which involve the installation of mechanical and electrical building services
  plant or equipment such as flues, air handling units / air conditioning, extraction, air source heat
  pumps and combustion appliances. Development that may cause noise pollution or noise sensitive development
  close to existing noise sources should also provide information.
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: The existing noise environment
  level: must
- item: The potential noise sources or activities of the development, or the noise sources likely to affect
    noise sensitive development
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 6 and 21. Item
  23, marked National. Application types follow the list's 'Requirement by Application Type' matrix, which
  marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
