reference: roof-plan-proposed
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - approval-condition
      - ldc-prospective-use
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: The proposal includes dormer windows.
    - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: All applications where there are complex interaction of roof forms or dormer windows.
must-include:
- item: The shape of the roof at an appropriate scale, usually 1:50 or 1:100
  level: should
- item: Details such as the material, vents and their location, if possible
  level: should
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 12. Item
  5e (Roof Plan), marked National. The list asks for a roof plan, not existing and proposed ones. 'Complex
  interaction of roof forms' has no clear test, so it shows as discretionary. Application types follow
  the list's 'Requirement by Application Type' matrix, which marks each type 'Mandatory' or 'Possibly
  required dependent on the proposal'.
review-status: unverified
field-status: {}
