reference: section-proposed
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - approval-condition
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The site, or the site and surrounding land, are at variable levels.
    - condition:
        field: roof-alteration
        value: true
        description: The proposal involves a roof extension or installation of rooflights or windows.
    - condition:
        field: earthworks
        value: true
        description: Significant ground works or level changes, such as swimming pools or retaining walls.
  - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: 'May be required where: a site or site and surrounding land are at variable levels; the proposal
  involves a roof extension or installation of rooflights or windows; Works involving significant ground
  works or level changes, such as swimming pools or retaining walls.'
must-include:
- item: How the proposals relate to existing ground levels, or where ground levels outside the extension
    would be modified
  level: must
- item: Drawn to an identified scale or showing metric measurements
  level: should
- item: Accurately labelled and numbered
  level: should
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 12. Item
  5f (Sections Plan), marked National. The list says sections 'may be required' in these cases, so the
  rule is discretionary within them. Application types follow the list's 'Requirement by Application Type'
  matrix, which marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
