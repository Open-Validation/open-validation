reference: recreation-facilities-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Proposals adversely affecting or leading to the loss of existing open space, such
          as playing fields.
    - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Proposals for residential development (conversions or new build) which will need to make
  provision for new open space. Proposals adversely affecting or leading to the loss of existing open
  space, such as playing fields.
must-include:
- item: Plans showing any existing or proposed open space within or adjoining the site
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 6 and 22. Item
  27 (Open Space Assessment), marked Local. Which residential schemes 'need to make provision for new
  open space' isn't defined in the list, so that part shows as discretionary. Application types follow
  the list's 'Requirement by Application Type' matrix, which marks each type 'Mandatory' or 'Possibly
  required dependent on the proposal'.
review-status: unverified
field-status: {}
