reference: town-centre-impact-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure, office, art, culture or tourism development outside the defined town
        centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 1000
      description: 1000 sq m or more of floorspace.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
policy: 'Waverley Local Plan Part 1: Strategic Policies and Sites, policy TCS1'
source-text: Development consisting of Retail / Leisure / Office / Art / Culture and Tourism outside defined
  area for Town Centres. Not required for developments consisting of a Change of Use or new build if less
  than 1000 sqm floor space outside Policy TCS1 areas.
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 6 and 23. Item
  30 (Town Centre Uses), marked Local. Application types follow the list's 'Requirement by Application
  Type' matrix, which marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
