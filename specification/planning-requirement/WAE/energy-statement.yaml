reference: energy-statement
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - prior-approval
      - s73
  - condition:
      field: new-build
      value: true
      description: Applications for new buildings.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Applications for new buildings.
must-include:
- item: Calculates and benchmarks the energy performance of the new buildings using the Standard Assessment
    Procedure (SAP)
  level: must
- item: The Dwelling Emission Rate (DER) compared with the Target Emission Rate (TER) in the Building
    Regulations
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 7 and 26. Item
  38, marked Local. Application types follow the list's 'Requirement by Application Type' matrix, which
  marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
