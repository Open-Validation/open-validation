reference: site-plan
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - approval-condition
      - ldc-existing-use
      - ldc-prospective-use
      - demolition-con-area
      - pa-ecomms-network
      - advertising
      - hedgerow-removal
      - pip
  - any:
    - condition:
        field: footprint-increase
        value: true
        description: The proposal changes the footprint of buildings on the site.
    - condition:
        field: parking-change
        value: true
        description: The proposal changes parking on the site.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: 'All applications with the following exceptions: Non-Material Amendment applications (unless
  required to show changes in site); Where no change is proposed to the footprint of buildings or parking
  on the site.'
must-include:
- item: At a scale of 1:500 or 1:200
  level: should
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, easily identifiable
  level: must
- item: Written dimensions to boundaries where within 2 metres and there are immediate neighbours
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees with amenity value within felling distance, or within 10 metres of the
    development
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 4 and 11. Item
  5b (Block (Site) Plan), marked National. Non-material amendments need one only to show changes in the
  site, so that type is left out. Application types follow the list's 'Requirement by Application Type'
  matrix, which marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
