reference: land-contamination-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - condition:
      field: new-build
      value: true
      description: New development or redevelopment is proposed.
  - site:
      in:
      - contaminated-land
      description: Land known to be, or suspected to be, affected by contamination.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Required for Planning applications where new, or redevelopment is proposed or on land that
  is known to be, or suspected to be, affected by contamination.
must-include:
- item: Enough information to determine whether contamination exists, its nature, the risks it may pose
    and whether these can be reduced to acceptable levels
  level: must
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 19. Item
  17, marked Local. The wording is read as new development or redevelopment on land known or suspected
  to be contaminated. Application types follow the list's 'Requirement by Application Type' matrix, which
  marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
