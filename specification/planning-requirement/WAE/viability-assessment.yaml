reference: viability-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Where Policy exceptions are made on financial grounds.
must-include:
- item: A full financial appraisal showing why policy cannot be met
  level: must
- item: Published as a public document unless explicit justification is given for not doing so
  level: must
- item: A written undertaking by the applicant to pay for independent scrutiny of the appraisal
  level: must
- item: 'Cross-subsidy rural housing schemes: shows the market housing is the minimum needed to deliver
    the affordable element'
  level: should
  required-if: discretionary
- item: 'Proposals in conflict with the Development Plan: viability information on the infrastructure/affordable
    homes showing deliverability'
  level: should
  required-if:
    condition:
      field: departure-from-development-plan
      value: true
      description: The proposal conflicts with the Development Plan.
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 7 and 25. Item
  33 (Financial Appraisal), marked Local. Shown as discretionary because it depends on whether policy
  exceptions are sought on financial grounds. Application types follow the list's 'Requirement by Application
  Type' matrix, which marks each type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
