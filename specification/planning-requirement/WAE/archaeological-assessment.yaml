reference: archaeological-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
      - approval-condition
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: In an Area of High Archaeological Potential.
      - condition:
          field: ground-disturbance
          value: true
          description: The application involves disturbance of the ground.
    - all:
      - any:
        - ref: major-development
        - condition:
            field: ground-disturbance
            value: true
            description: Significant ground disturbance.
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.4
            description: Site area greater than 0.4 ha.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 0.4
            description: Site area greater than 0.4 ha.
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Non householder applications involving the disturbance of ground within an Area of High Archaeological
  Potential. Applications for Major development or significant ground disturbance with a site area greater
  than 0.4 ha not in an area/site already defined as High Archaeological Potential.
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 5 and 17. Item
  10 (Archaeological Report), marked National. It can be part of the Heritage Statement or a separate
  report. Application types follow the list's 'Requirement by Application Type' matrix, which marks each
  type 'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
