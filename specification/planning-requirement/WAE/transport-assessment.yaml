reference: transport-assessment
local-authority: WAE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.waverley.gov.uk/portals/0/documents/services/planning-and-building/planning-applications-and-enforcement/planning%20applications/validation%20lists/validation%20v12.pdf
source-text: Where the proposed development has significant transport implications, for example Major
  applications.
must-include:
- item: Access by all modes of transport to and from the site
  level: should
- item: Measures to improve access by public transport, walking and cycling to mitigate transport impacts
  level: should
confidence: medium
notes: From the council's list (approved November 2022, last updated July 2023), pages 6 and 20. Item
  19, marked National. 'Significant transport implications' beyond major development shows as discretionary.
  Application types follow the list's 'Requirement by Application Type' matrix, which marks each type
  'Mandatory' or 'Possibly required dependent on the proposal'.
review-status: unverified
field-status: {}
