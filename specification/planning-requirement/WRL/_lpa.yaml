  date: 2025-05
  date-basis: 'cover: ''LOCAL VALIDATION CHECKLIST Adopted May 2025'' (the PDF was re-saved 16 July 2025
    with the title ''Local Validation Checklist July 2025''). On 2026-11-06 the council''s ''Planning
    application forms and checklists'' page (https://www.wirral.gov.uk/planning-and-building/planning/planning-application-forms-and-checklists),
    headed ''Development Management Validation Checklist May 2025'', linked only this checklist and sets
    out the national requirements itself; no newer list or consultation was found.'
  status: current
submission-standards:
- item: Drawings at an appropriate metric scale (most commonly 1:50 or 1:100; 1:100 or 1:200 for site
    plans and sections) with a linear scale bar
  level: must
- item: Each drawing has a unique drawing number and title
  level: must
- item: No disclaimer that the plan should not be scaled, unless worded to exclude the planning decision
    and enforcement process
  level: must
- item: Location plan scaled to A4 or A3
  level: should
- item: Applications sent by post or email incur a small extra fee; applying online through the Planning
    Portal is recommended
  level: should
