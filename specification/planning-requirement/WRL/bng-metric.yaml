reference: bng-metric
local-authority: WRL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Applications subject to the biodiversity gain condition.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
policy: Environment Act 2021
source-text: All applications subject to the biodiversity gain condition.
must-include:
- item: Statutory biodiversity metric with pre-development baseline and post-development habitats, stating
    the qualifications and experience of the person completing it
  level: must
- item: Statutory metric condition assessment spreadsheets (full statutory metric only; small sites metric
    exempt)
  level: must
  required-if:
    condition:
      field: minor-development
      value: false
      description: The full statutory metric is used.
- item: Pre-development biodiversity value on the date of application or an earlier proposed date, with
    the metric publication date
  level: must
- item: 'Where an earlier date is proposed: the date and reasons'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: An earlier date is proposed.
- item: Statement on any degrading activities before the application date, with the date before them,
    the value then, calculations and evidence
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 6-7. Wirral lists both the national requirements
  and its local additions. The draft Biodiversity Gain Plan, draft Habitat Management and Monitoring Plan
  and the national BNG statement are in the unmapped list.
review-status: unverified
field-status: {}
