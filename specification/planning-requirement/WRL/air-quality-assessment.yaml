reference: air-quality-assessment
local-authority: WRL
required-if: discretionary
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: Any Application where it is considered that the proposed development would have a significant
  impact on air quality or would result in a sensitive end use being in proximity to a source of air pollution
  that may affect the health and amenity of future users.
must-include:
- item: Carried out by a suitably qualified consultant, demonstrating the author's competency
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 4. Both triggers are judgements ('considered',
  'significant', 'in proximity'), so discretionary. May form part of an Environmental Statement.
review-status: unverified
field-status: {}
