reference: elevation-existing
local-authority: WRL
required-if:
  always: true
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All applications
must-include:
- item: Drawn to an appropriate metric scale, most commonly 1:50 or 1:100, with a linear scale bar
  level: must
- item: A unique drawing number and title
  level: must
- item: No disclaimer that the plan should not be scaled, unless worded to exclude the planning decision
    and enforcement process
  level: must
- item: Proposed works clearly identified in relation to what is already there
  level: must
- item: Existing and proposed external materials, and the appearance and materials of windows and doors
    where appropriate
  level: must
- item: All elevations of a building (including blank ones) shown in full; no partial elevations
  level: must
- item: The relationship with attached buildings
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 13. Elevation Drawings – Existing and Proposed.
review-status: unverified
field-status: {}
