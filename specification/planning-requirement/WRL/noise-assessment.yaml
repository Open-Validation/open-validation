reference: noise-assessment
local-authority: WRL
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals that generate high levels of noise or vibration (industrial, noisy sports,
        pubs, nightclubs etc).
  - all:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Commercial or entertainment uses.
    - condition:
        field: plant-equipment
        value: true
        description: Externally mounted extract, ventilation, heating/cooling or similar equipment.
  - all:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Commercial or entertainment uses.
    - condition:
        field: adjoins-residential-property
        value: true
        description: In premises sharing a party wall or ceiling with residential uses.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New noise or vibration sensitive uses (eg housing) adjacent to major sources of noise.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: 'All applications where one or more of the following apply: Proposals that generate high
  levels of noise or vibration such as industrial developments using noisy machinery (eg joinery workshops,
  refrigeration plant & equipment), noisy sports, public houses, nightclubs etc Proposals for commercial
  or entertainment uses which involve externally mounted extract, ventilation, heating/cooling, or similar
  equipment. Proposals for commercial or entertainment uses in premises sharing a party wall or ceiling
  with residential uses. New noise or vibration sensitive uses (eg housing) adjacent to major sources
  of noise such as major roads, railways, industrial and commercial sites and premises (including existing
  entertainment venues)'
must-include:
- item: Prepared by a suitably qualified acoustic consultant to the relevant British Standard
  level: must
- item: The existing noise environment, noise sources from or affecting the development, and mitigation
  level: must
- item: 'Development adjoining (including above or below) homes: sound insulation, entrances/exits and
    car parking; for pubs and clubs, the smoking area'
  level: must
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: Immediately adjoins residential premises.
confidence: medium
notes: From the council's list (adopted May 2025), page 26-27. Noise and Vibration Impact Assessment.
review-status: unverified
field-status: {}
