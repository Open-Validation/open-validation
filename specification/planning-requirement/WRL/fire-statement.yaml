reference: fire-statement
local-authority: WRL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - change-of-use
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Relevant buildings contain two or more dwellings or educational accommodation and meet the
  height condition of 18m or more in height, or 7 or more storeys.
must-include:
- item: On the standard form from www.gov.uk
  level: must
confidence: medium
notes: 'From the council''s list (adopted May 2025), page 15-16. Exempt: outline applications, section
  73 applications, and changes of use that stop a building being relevant or don''t create one. Includes
  development of, or within the curtilage of, an existing relevant building.'
review-status: unverified
field-status: {}
