reference: floor-plan-existing
local-authority: WRL
required-if:
  always: true
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All Applications
must-include:
- item: Drawn to an appropriate metric scale, most commonly 1:50 or 1:100, with a linear scale bar
  level: must
- item: A unique drawing number and title
  level: must
- item: No disclaimer that the plan should not be scaled, unless worded to exclude the planning decision
    and enforcement process
  level: must
- item: Proposed works in relation to what is already there, site boundaries and any attached or adjacent
    neighbouring buildings
  level: must
- item: Any walls or buildings to be demolished
  level: must
- item: All existing and proposed window and door openings, aligned with the elevations
  level: must
- item: The direction of north
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 29. Floor and Roof Plan Drawings – Existing and
  Proposed.
review-status: unverified
field-status: {}
