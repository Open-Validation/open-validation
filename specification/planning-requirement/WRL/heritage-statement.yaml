reference: heritage-statement
local-authority: WRL
required-if:
  site:
    in:
    - world-heritage-site
    - scheduled-monument
    - listed-building
    - listed-building-setting
    - protected-wreck-site
    - park-and-garden
    - battlefield
    - conservation-area
    - locally-listed-building
    - historic-environment-record
    description: Within a World Heritage Site or buffer zone, Scheduled Monument, Protected Wreck Site,
      Registered Park and Garden, registered battlefield or Conservation Area, or contains or affects
      the setting of a Listed Building, Registered Park and Garden, Conservation Area or non-designated
      heritage asset (HER or Local List).
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: 'All applications where one or more of the following apply: The application site is within
  a World Heritage Site or its buffer zone The application site is within a Scheduled Monument, The application
  site contains a Listed Building or otherwise affects the setting of a Listed Building, The application
  site is within a Protected Wreck Site, The application site is within a Registered Park and Garden or
  otherwise affects the setting of a Registered Park and Garden, The application site is within a registered
  battlefield, The application site is within a Conservation Area or otherwise affects the setting of
  a Conservation Area. The application site contains a non-designated heritage asset (or is within the
  setting of a non- designated heritage asset) identified within the Merseyside Historic Environment Record
  (HER) or identified on a Local List.'
must-include:
- item: The significance of any heritage asset affected, including its setting (for World Heritage Sites,
    the Statement of Outstanding Universal Value)
  level: must
- item: The potential impact of the development on that significance, proportionate to the asset's importance
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 19-20. Historic Environment Impact Assessment
  (previously known as Heritage Statements).
review-status: unverified
field-status: {}
