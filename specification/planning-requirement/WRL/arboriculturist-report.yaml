reference: arboriculturist-report
local-authority: WRL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - change-of-use
    - any:
      - condition:
          field: new-build
          value: true
          description: Erection of new buildings.
      - condition:
          field: footprint-increase
          value: true
          description: Extension of existing buildings.
      - condition:
          field: hard-surfacing
          value: true
          description: New or extended hardstanding.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site that would be affected.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site that would be affected.
    - discretionary
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
policy: BS 5837:2012
source-text: All applications comprising the erection of new buildings or the extension of existing buildings,
  and/or the formation of new hardstanding or the extension of existing hardstanding, where there are
  trees either within the site and/or adjacent to the site that would be affected by the proposed development.
must-include:
- item: Carried out by a qualified arboricultural consultant in accordance with BS 5837:2012
  level: must
- item: Tree Survey, with schedule and plan
  level: must
- item: Arboricultural Impact Assessment, with Tree Constraints Plan
  level: must
- item: Arboricultural Method Statement, with Tree Protection Plan
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 4-5. For householder and other very minor development
  the site plan is used to screen whether arboricultural information is needed, so discretionary for householder
  applications.
review-status: unverified
field-status: {}
