reference: flood-risk-assessment
local-authority: WRL
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zones 2 and 3.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 1.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Sites of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Sites of 1 hectare or more.
      - site:
          in:
          - critical-drainage-area
          description: Land identified by the Environment Agency as having critical drainage problems.
      - site:
          in:
          - future-flood-risk
          description: Land identified in a strategic flood risk assessment as at increased flood risk
            in future.
      - all:
        - condition:
            field: more-vulnerable-use-change
            value: true
            description: Development would introduce a more vulnerable use.
        - site:
            in:
            - surface-water-flood-risk
            description: Land that may be subject to other sources of flooding.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: 'A site-specific flood risk assessment should be provided for all development in Flood Zones
  2 and 3. In flood zone 1 and assessment should accompany all applications involving: - Sites of 1 hectare
  or more. - Land which has been identified by the Environment Agency as having critical drainage problems.
  - land identified in a strategic flood risk assessment as being at increased flood risk in future. -
  land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use.'
must-include:
- item: How flood risk will be managed over the development's lifetime, taking climate change and users'
    vulnerability into account
  level: must
- item: Whether the development is affected by current or future flooding from any source and whether
    it increases flood risk elsewhere
  level: must
- item: Whether proposed measures are appropriate
  level: must
- item: Evidence for the Sequential Test and, if applicable, the Exception Test
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted May 2025), page 17. To include the Sequential and Exception Tests
  'where relevant'.
review-status: unverified
field-status: {}
