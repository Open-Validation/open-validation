reference: section-existing
local-authority: WRL
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Replacement of a building, or erection of new building(s).
  - condition:
      field: change-in-ground-levels
      value: true
      description: Existing ground level variance across the site of 1 m or greater.
  - condition:
      field: site-level-change
      operator: '>='
      value: 1000
      description: A proposed ground level change of 1 m or greater (excavation or build-up).
  - condition:
      field: adjacent-ground-level-change
      value: true
      description: An existing or proposed level change of 1 m or more between the site and neighbouring
        land.
  - discretionary
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: Where the proposed development involves the replacement of a building, or the erection of
  a new building(s). Any application where there is an existing ground level variance across the site
  of 1 metre or greater. Any application where it is proposed to introduce a ground level change across
  any part of the site of 1 metre or greater, whether this is by excavation or build-up of ground levels.
  Any application where there is an existing or proposed level change of 1 metre or greater between the
  application site and any neighbouring land.
must-include:
- item: Drawn to an appropriate metric scale, most commonly 1:100 or 1:200, with a linear scale bar
  level: must
- item: A unique drawing number and title
  level: must
- item: No disclaimer that the plan should not be scaled, unless worded to exclude the planning decision
    and enforcement process
  level: must
- item: Site levels plans show the direction of north
  level: must
- item: Cross section(s) through existing and proposed buildings and/or the site, extending beyond the
    boundaries to show adjoining land and buildings
  level: must
- item: Site levels plans show existing and proposed ground levels and finished floor levels related to
    a fixed point outside the red line
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 30-31. Section Drawings and Site Levels Plans.
  Below 1 m, 'at officer discretion' where needed to assess amenity impact, so discretionary. A compliant
  topographic survey is accepted as the existing site levels plan.
review-status: unverified
field-status: {}
