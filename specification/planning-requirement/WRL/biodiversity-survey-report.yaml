reference: biodiversity-survey-report
local-authority: WRL
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      description: The site is within or adjacent to a designated nature conservation site.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Loss of, or disturbance to, existing natural or semi-natural habitat.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - change-of-use
    - any:
      - condition:
          field: near-woodland
          value: true
          description: Sites containing mature trees or adjacent to areas of woodland.
      - condition:
          field: potential-roost-features
          value: true
          description: Complete or partial demolition of buildings, or significant alteration to roof
            space.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: near-woodland
          value: true
          description: Mature trees on site.
      - condition:
          field: potential-roost-features
          value: true
          description: Demolition or significant roof space alteration.
    - discretionary
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: 'All Major applications. Any minor or householder application where one or more of the following
  applies: i) The site is within or adjacent to a designated nature conservation site. ii) The development
  will result in the loss of, or disturbance to, existing natural, or semi-natural habitat. iii) Development
  on sites containing mature trees or adjacent to areas of woodland. iv) Development involving the complete
  or partial demolition of existing buildings, or where there is to be significant alteration to existing
  roof space.'
must-include:
- item: A desktop study of protected species and habitat records, and a site walkover mapping habitats
    and assessing suitability for protected species
  level: must
- item: Recommended mitigation and any further surveys
  level: should
- item: Carried out by a suitably qualified ecologist, stating the author's qualifications and experience
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 11-12. Preliminary Ecological Appraisal. For householder
  and very minor development with mature trees, demolition or roof works, the case officer may first ask
  for photographs and decide case by case, so that part is discretionary. Further surveys are not needed
  for validation.
review-status: unverified
field-status: {}
