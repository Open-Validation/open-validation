reference: application-form
local-authority: WRL
required-if:
  always: true
source-url: https://www.wirral.gov.uk/planning-and-building/planning/planning-application-forms-and-checklists
policy: Town and Country Planning Act 1990 section 65(5); Town and Country Planning (Development Management
  Procedure) (England) Order 2015 article 14
source-text: You need to fill out the correct planning application form.
must-include:
- item: Accurately describes the proposed development, answers all questions clearly, signed and dated
  level: must
- item: A signed and dated Ownership Certificate A, B, C or D, covering land giving access from the public
    highway and where development abuts, crosses or overhangs the boundary
  level: must
- item: 'Certificate B or C: landowners notified with the appropriate notice'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate B or C is used.
confidence: medium
notes: From the council's 'Planning application forms and checklists' page. National requirement from
  the council's 'Planning application forms and checklists' page (https://www.wirral.gov.uk/planning-and-building/planning/planning-application-forms-and-checklists),
  read 2026-11-06.
review-status: unverified
field-status: {}
