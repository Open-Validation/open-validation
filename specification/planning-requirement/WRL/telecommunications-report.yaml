reference: telecommunications-report
local-authority: WRL
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Electronic communications development.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All planning applications for electronic communications development
must-include:
- item: Outcome of consultations with interested organisations, in particular the relevant body where
    a mast is near (within 100 m of) a school or college, or within an aerodrome, technical site or explosives
    storage safeguarding zone
  level: must
- item: 'Addition to an existing mast or base station: self-certification that cumulative exposure will
    not exceed ICNIRP guidelines'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: true
      description: An addition to an existing mast or base station.
- item: 'New mast or base station: evidence that sharing an existing building, mast or structure was explored,
    and self-certification that ICNIRP guidelines will be met'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new mast or base station.
confidence: medium
notes: From the council's list (adopted May 2025), page 12. Electronic Communications Development Evidence
  Statement.
review-status: unverified
field-status: {}
