reference: photos
local-authority: WRL
required-if:
  any:
  - site:
      in:
      - listed-building
      description: Full or partial demolition, extension or alteration of a listed building, or development
        within its curtilage.
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - locally-listed-building
        - historic-environment-record
        description: A non-designated heritage asset (local list or HER), or within its curtilage.
    - any:
      - condition:
          field: demolition
          value: true
          description: Full or partial demolition.
      - condition:
          field: external-alterations
          value: true
          description: Alteration or extension.
  - all:
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
    - condition:
        field: new-build
        value: true
        description: Erection of a new building(s).
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All planning applications that include the full or partial demolition of a listed building,
  its extension or other alteration, whether external or internal, or development within the curtilage
  of a listed building. All application for listed building consent.
must-include:
- item: Comprehensive photographs of the existing appearance of parts to be demolished, altered or extended,
    including doors and windows to be replaced
  level: must
- item: Numbered photographs with a key plan (on scaled floor/site plans) showing location and direction
    of view
  level: must
- item: Internal photographs only where the building is a listed building
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: A listed building.
- item: 'Conservation areas: the existing building and curtilage (or the empty site) and the site''s context
    from the street and nearby public vantage points'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within a Conservation Area.
confidence: medium
notes: From the council's list (adopted May 2025), page 27-28. Photographic Survey; also for works to
  non-designated heritage assets and new buildings in conservation areas.
review-status: unverified
field-status: {}
