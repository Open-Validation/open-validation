reference: land-contamination-assessment
local-authority: WRL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
  - any:
    - site:
        in:
        - contaminated-land
        description: Known or suspected to be affected by land contamination.
    - condition:
        field: previously-developed-land
        value: true
        description: Previously developed land.
    - condition:
        field: sensitive-end-use
        value: true
        description: An end use vulnerable to contamination, such as housing or a nursery/school.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: Any application (except householder applications) where the application site is known to
  be, or suspected to be, affected by land contamination (such as previously developed land), or where
  the application proposes an end use vulnerable to land contamination such as residential development
  or nursery/school development.
must-include:
- item: A preliminary risk assessment by a suitably qualified and experienced person, naming authors and
    reviewers and their competencies
  level: must
- item: Purpose and aims; site description with a detailed site plan; historical maps and aerial photographs;
    past and present uses of the site and surroundings
  level: must
- item: 'Environmental setting: geology, hydrology, hydrogeology, topography; coal and extractive workings;
    waste and landfill; abstractions, discharges, pollution incidents, IPPC, radon; drainage, services
    and underground structures'
  level: must
- item: Review of previous contamination studies or remediation; site walkover; access or investigation
    restrictions
  level: must
- item: A conceptual site model with sources, pathways, receptors and potential unacceptable risks; recommendations
    and conclusions
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 20-22.
review-status: unverified
field-status: {}
