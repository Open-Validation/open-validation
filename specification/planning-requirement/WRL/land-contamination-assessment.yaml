reference: land-contamination-assessment
local-authority: WRL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: The site is known to be, or suspected to be, affected by land contamination (such
          as previously developed land).
    - condition:
        field: sensitive-end-use
        value: true
        description: An end use vulnerable to land contamination, such as residential or nursery/school
          development.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: 29 Land Contamination Assessment Any application (except householder applications) where
  the application site is known to be, or suspected to be, affected by land contamination (such as previously
  developed land), or where the application proposes an end use vulnerable to land contamination such
  as residential development or nursery/school development. … A preliminary risk assessment (PRA) must
  be undertaken and prepared by a suitably qualified and experienced person
must-include:
- item: A preliminary risk assessment (PRA), prepared by a suitably qualified and experienced person
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): item 29 excludes householder applications. The excerpt''s two columns
  are separated above without changing the words.'
review-status: unverified
field-status: {}
