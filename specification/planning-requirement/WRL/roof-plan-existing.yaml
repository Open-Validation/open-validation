reference: roof-plan-existing
local-authority: WRL
required-if:
  condition:
    field: complex-roof-design
    value: true
    description: The roof form is not obvious from the elevations, or there are hidden roof elements.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: Where the existing and/or proposed roof form is not obvious from the elevation drawing or
  where there are hidden roof elements, The suite of plan drawings provided must include existing and
  proposed roof plans in accordance with the above requirements.
must-include:
- item: Drawn to an appropriate metric scale, most commonly 1:50 or 1:100, with a linear scale bar
  level: must
- item: A unique drawing number and title
  level: must
- item: No disclaimer that the plan should not be scaled, unless worded to exclude the planning decision
    and enforcement process
  level: must
- item: Proposed works in relation to what is already there, site boundaries and any attached or adjacent
    neighbouring buildings
  level: must
- item: Any walls or buildings to be demolished
  level: must
- item: All existing and proposed window and door openings, aligned with the elevations
  level: must
- item: The direction of north
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 29.
review-status: unverified
field-status: {}
