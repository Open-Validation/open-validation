reference: energy-statement
local-authority: WRL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
  - condition:
      field: new-build
      value: true
      description: Erection of a new building or buildings.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All applications (except householder applications) proposing the erection of a new building
  or buildings.
must-include:
- item: 'How the energy hierarchy (fabric first, passive design and landscaping) has been implemented,
    in the order: minimise demand, maximise efficiency, renewable, low carbon, other sources, on-site
    then off-site offsetting'
  level: must
- item: 'Within the Birkenhead Heat Network Demand Assessment Area: connection to the network, or why
    it is not suitable or feasible'
  level: must
  required-if:
    condition:
      field: district-heating-network
      value: true
      description: Within the Birkenhead Heat Network Demand Assessment Area.
- item: 'Not connected but suitable for a future network: how the design is ''district heating ready'''
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted May 2025), page 13-14. Can be included in a Planning Statement.
review-status: unverified
field-status: {}
