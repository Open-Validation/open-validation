reference: affordable-housing-statement
local-authority: WRL
required-if:
  any:
  - condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing (as defined in NPPF Annex 2) is being proposed.
  - discretionary
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
policy: Wirral Local Plan (10% or 20% affordable housing depending on location)
source-text: 'All applications where affordable housing (as defined by Annex 2: Glossary of the National
  Planning Policy Framework) is being proposed or is otherwise required under national or local planning
  policy.'
must-include:
- item: Location, size, number of bedrooms and proposed tenure of the affordable housing, with site plans
    showing its location and distribution
  level: must
- item: A summary of discussions with the council's Housing team and Registered Providers, naming any
    RP that has agreed to purchase units
  level: must
- item: 'Off-site provision or a commuted sum: robust justification'
  level: should
  required-if:
    condition:
      field: affordable-housing-commuted-sum
      value: true
      description: Off-site provision or a commuted sum in lieu of on-site provision is proposed.
- item: 'Vacant Building Credit: full evidence'
  level: should
  required-if:
    condition:
      field: vacant-building
      value: true
      description: Vacant Building Credit is to be used.
- item: 'Less than the policy-compliant level (10% or 20%): detailed reasons, with a viability appraisal'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A policy-compliant level of affordable housing is not proposed.
confidence: medium
notes: From the council's list (adopted May 2025), page 2-3. Where affordable housing is 'otherwise required'
  by policy, the thresholds are in the Local Plan, not the list, so that part is discretionary. Can be
  included in a Planning Statement.
review-status: unverified
field-status: {}
