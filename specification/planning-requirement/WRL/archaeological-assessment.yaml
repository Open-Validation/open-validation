reference: archaeological-assessment
local-authority: WRL
required-if:
  site:
    in:
    - scheduled-monument
    - historic-environment-record
    description: Affects heritage assets of archaeological interest, designated or non-designated, or
      is within a scheduled monument.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All applications affecting heritage assets of archaeological interest, whether designated
  or non-designated, All applications within a scheduled ancient monument.
must-include:
- item: Likely survival and significance of buried evidence, significance of historic buildings/structures/earthworks,
    contribution to historic landscape character, and impact on assets and their setting
  level: must
- item: 'As a minimum: archaeological and historical context research; geological and topographic context
    (desk-based deposit model where appropriate); a site walk-over; a report assessing significance and
    effects'
  level: must
- item: Carried out by a suitably qualified historic environment consultant
  level: must
confidence: medium
notes: From the council's list (adopted May 2025), page 5-6. Archaeological Desk Based Assessment.
review-status: unverified
field-status: {}
