reference: site-plan
local-authority: WRL
required-if:
  always: true
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All applications
must-include:
- item: Drawn to an appropriate metric scale, most commonly 1:100 or 1:200, with a linear scale bar
  level: must
- item: A unique drawing number and title
  level: must
- item: No disclaimer that the plan should not be scaled, unless worded to exclude the planning decision
    and enforcement process
  level: must
- item: The direction of north
  level: must
- item: A note saying whether enlarged from Ordnance Survey data or drawn from a measured survey
  level: must
- item: Existing footprint to be demolished and proposed footprint clearly identified
  level: must
- item: Existing and proposed development dimensioned, with distances to site boundaries
  level: must
- item: Footprint of buildings attached to or adjacent to the site
  level: must
- item: All existing trees on the site, marked retained or removed; adjacent trees whose canopy or root
    protection area oversails the site; proposed tree planting
  level: must
- item: Public Rights of Way crossing or immediately adjacent to the site
  level: must
- item: Roads and footways on adjacent land with points of access
  level: must
- item: Site boundaries with boundary type and height annotated
  level: must
- item: 'Parking: location, number and size of bays (including EV charging) and cycle parking, against
    the parking standards'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - change-of-use
    - condition:
        field: parking-change
        value: true
        description: Vehicle and/or cycle parking is provided within the site.
- item: 'Servicing/delivery vehicles on site: access, egress, turning and parking with swept path diagrams'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - change-of-use
    - condition:
        field: new-vehicle-access
        value: true
        description: Servicing/delivery vehicles need to access and manoeuvre within the site.
confidence: medium
notes: From the council's list (adopted May 2025), page 27, 31-33. Site Plans – Existing and Proposed,
  with the parking and servicing details the list says the proposed site plan should show (page 27).
review-status: unverified
field-status: {}
