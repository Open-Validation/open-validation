reference: waste-management-plan
local-authority: WRL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
  - condition:
      field: waste-storage-facilities
      value: true
      description: Refuse and recycling storage on site and/or refuse vehicle access to the site is required.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All applications (except householder applications) where refuse and recycling storage will
  be required on site and/or where refuse and recycling vehicle access will be required to the site.
must-include:
- item: A plan showing on-site refuse and recycling storage and the collection point(s) (on the site plan
    for minor applications)
  level: must
- item: 'Major applications: a separate refuse and recycling management plan'
  level: must
  required-if:
    ref: major-development
- item: 'Where a collection vehicle must enter: a swept path layout showing safe access, manoeuvring and
    exit'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A refuse collection vehicle will need to access the site.
confidence: medium
notes: From the council's list (adopted May 2025), page 29-30. Refuse and Recycling Management Strategy.
review-status: unverified
field-status: {}
