reference: landscaping-plan
local-authority: WRL
required-if:
  any:
  - all:
    - ref: major-development
    - application-type:
        in:
        - full
        - outline
  - condition:
      field: new-open-space
      value: true
      description: Minor development providing landscaped spaces accessible to users or visitors (including
        communal or shared residential spaces, not private gardens).
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Applications subject to the biodiversity gain condition.
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: All major applications (whether in full or outline)
must-include:
- item: 'Outline with landscaping reserved: a statement of the landscaping strategy, with areas of landscaping
    identified on layout plans'
  level: must
  required-if:
    condition:
      field: landscaping-reserved-matter
      value: true
      description: Landscaping is a reserved matter.
- item: 'Full applications (and outline where landscaping is considered): full details on suitably scaled
    landscape plans'
  level: must
  required-if:
    condition:
      field: landscaping-reserved-matter
      value: false
      description: Landscaping is not reserved.
- item: 'Biodiversity net gain: a draft Landscape and Planting Plan'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Applications subject to the biodiversity gain condition.
  source-text: iv) Draft Landscape and Planting Plan,
confidence: medium
notes: From the council's list (adopted May 2025), page 6-7, 22-23. Draft Landscape Plans, plus the draft
  Landscape and Planting Plan in the BNG row.
review-status: unverified
field-status: {}
