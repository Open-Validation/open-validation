reference: town-centre-impact-assessment
local-authority: WRL
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses not in an existing centre or in accordance with the Local Plan's
        locational policies.
  - discretionary
source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
source-text: An Impact Assessment is required in addition to a Sequential Test for all Main Town Centre
  Uses (as defined within the National Planning Policy Framework) that are not in an existing centre or
  in accordance with locational policies of the Wirral Local Plan and where the floorspace of the development
  is above the locally set floorspace threshold set out in the Wirral Local Plan
confidence: medium
notes: From the council's list (adopted May 2025), page 23-24. The floorspace threshold is set in the
  Local Plan, not in the list, so the size part is discretionary. The sequential test is in the unmapped
  list.
review-status: unverified
field-status: {}
