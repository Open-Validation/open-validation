reference: location-plan
local-authority: WRL
required-if:
  always: true
source-url: https://www.wirral.gov.uk/planning-and-building/planning/planning-application-forms-and-checklists
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Location plan The location plan should:'
must-include:
- item: Based on an up-to-date map at 1:1250 or 1:2500, scaled to A4 or A3
  level: should
- item: Clearly titled with a unique reference number
  level: should
- item: At least two named roads if possible, and surrounding buildings and properties
  level: should
- item: Development site marked with a red line including all land necessary (access from a public highway,
    visibility splays, landscaping, car parking, open areas around buildings)
  level: should
- item: Any other land owned by the applicant near the site marked with a blue line
  level: should
confidence: medium
notes: From the council's 'Planning application forms and checklists' page. National requirement from
  the council's 'Planning application forms and checklists' page (https://www.wirral.gov.uk/planning-and-building/planning/planning-application-forms-and-checklists),
  read 2026-11-06.
