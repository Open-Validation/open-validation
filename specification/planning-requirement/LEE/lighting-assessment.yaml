    field: external-lighting
    value: true
    description: External lighting (commercial, recreational, security or floodlighting) is proposed or
      required.
source-url: https://www.lewes-eastbourne.gov.uk/media/2927/Appendix-Local-Validation-List-2021-Lewes-District-Council/pdf/Appendix_-_Local_Validation_List_2021_-_Lewes_District_Council.pdf?m=1689259391927
source-text: Applications for development where external lighting (including commercial uses, recreational
  uses, security lighting and floodlighting) is proposed or required to sustain the development will be
  required to be accompanied by details of external lighting and the proposed hours when the lighting
  would be switched on.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
