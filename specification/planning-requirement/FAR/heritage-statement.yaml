reference: heritage-statement
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - lbc
    - any:
      - discretionary
      - site:
          in:
          - conservation-area
          description: Development within a Conservation Area.
      - site:
          in:
          - listed-building
          - listed-building-setting
          description: Development affecting a Listed Building either directly or its setting.
  - all:
    - site:
        in:
        - strategic-allocation
        description: The site is within the Welborne Plan policy boundary.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: Where historical features may be affected; or Development within a Conservation Area; or
  Development affecting a Listed Building either directly or its setting. ... Initial or outline planning
  applications shall be accompanied by a heritage strategy and an historic environment management plan
must-include:
- item: 'For proposals affecting designated and/or non-designated heritage assets or their setting: a
    written statement on the significance of affected assets, supported by plans and photographs showing
    historic features on or adjacent to the site'
  level: must
- item: Analysis of the significance of the affected asset(s), including the contribution of their setting,
    the principles of and justification for the works, and their impact on significance
  level: should
- item: 'For listed building consent (or works affecting locally listed buildings): a written statement
    of the impact on the building''s special architectural and historic interest and historic fabric'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - locally-listed-building
        description: Works affecting a locally listed building.
- item: 'For listed building consent: a detailed schedule of proposed works, relevant historical information
    and an assessment of the impact on the overall character of the building or structure'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For Welborne: a heritage strategy and historic environment management plan setting out how heritage
    assets will be assessed, their significance, how they will be preserved and enhanced, how they have
    influenced layout and design, and how archaeological finds and results will be recorded and presented'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: 'From the council''s list (adopted 28 March 2025), page 1 (single web page), Local Information
  Requirements table, row ''Heritage Statement (including designated and non-designated heritage assets)''.
  ''Where historical features may be affected'' is shown as discretionary. Listed for full, outline, full
  with listed building consent, and listed building consent applications. Also the Welborne ''Heritage
  Strategy'' row. A structural survey ''may be required'' for works physically affecting historic properties
  (not a separate requirement here). Welborne: ''initial planning application(s)'' has no field, so that
  part is shown as discretionary within the Welborne boundary (the land already has outline permission
  P/17/0266/OA).'
review-status: unverified
field-status: {}
