reference: town-centre-impact-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses proposed at edge of centre or out of centre locations.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 500
      description: The floorspace exceeds 500 square metres.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Retail Impact Assessment Required for the following types of applications where main town
  centre uses are proposed and the floor exceeds 500 square metres: Full planning applications (including
  change of use) Outline planning applications When: Where proposed at edge of centres and out of centre
  locations'
confidence: medium
notes: Rows from Change of use - prior approval were dropped after the audit.
review-status: unverified
field-status: {}
