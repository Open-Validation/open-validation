reference: town-centre-impact-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: Main town centre uses with floorspace exceeding 500 square metres.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Proposed at an edge of centre or out of centre location.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
policy: National Planning Policy Framework
source-text: 'Required for the following types of applications where main town centre uses are proposed
  and the floor exceeds 500 square metres: Full planning applications (including change of use) Outline
  planning applications When: Where proposed at edge of centres and out of centre locations'
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on town centre vitality and viability, including local consumer choice and trade in the
    town centre and wider retail catchment
  level: must
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Retail Impact Assessment'.
review-status: unverified
field-status: {}
