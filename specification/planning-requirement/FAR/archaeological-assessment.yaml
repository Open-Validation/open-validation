reference: archaeological-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: The development involves the disturbance of ground on a previously undeveloped
            site.
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: The site is over 0.5 hectares.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 0.5
            description: The site is over 0.5 hectares.
    - site:
        in:
        - archaeological-priority-area
        description: The site is within an area of archaeological significance on Hampshire's Historic
          Environment Record.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Archaeological Desk Based Assessment Required for the following types of applications: Full
  planning applications Outline planning applications Full planning application with listed building consent
  When: The development involves the disturbance of ground on previously undeveloped sites of over 0.5
  hectares or is within an area of archaeological significance as shown on Hampshire County Council''s
  Historic Environment Record .'
confidence: medium
notes: Rows from Listed building consent were dropped after the audit.
review-status: unverified
field-status: {}
