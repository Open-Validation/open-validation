reference: archaeological-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: greenfield-site
          value: true
          description: A previously undeveloped site.
      - condition:
          field: ground-disturbance
          value: true
          description: The development disturbs the ground.
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: Site of over 0.5 hectares.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 0.5
            description: Site of over 0.5 hectares.
    - site:
        in:
        - historic-environment-record
        description: Within an area of archaeological significance shown on Hampshire County Council's
          Historic Environment Record.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: The development involves the disturbance of ground on previously undeveloped sites of over
  0.5 hectares or is within an area of archaeological significance as shown on Hampshire County Council's
  Historic Environment Record .
must-include:
- item: Results of an assessment of existing archaeological information, where commissioned
  level: should
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Archaeological Desk Based Assessment'. Listed as required for full and outline applications
  (including full applications with listed building consent). Standards follow the Chartered Institute
  for Archaeologists' guidance.
review-status: unverified
field-status: {}
