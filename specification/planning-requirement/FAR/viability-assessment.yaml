reference: viability-assessment
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The proposal is not fully policy compliant on affordable housing.
  - site:
      in:
      - strategic-allocation
      description: An application at Welborne that includes a reduced or delayed provision of infrastructure.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
policy: Welborne Plan (2015)
source-text: In the event that the proposal is not fully policy compliant, then a viability assessment
  must be submitted with the application. ... Any application(s) for Welborne that include a reduced or
  delayed provision of infrastructure.
must-include:
- item: 'For Welborne: a site-wide viability assessment, supported by detailed evidence justifying any
    reduction or delay in the provision of infrastructure'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Affordable Housing Statement'. Also the 'Site Wide Viability Assessment' row of the 'Applications
  at Welborne' table (only where a Welborne application includes reduced or delayed infrastructure).
review-status: unverified
field-status: {}
