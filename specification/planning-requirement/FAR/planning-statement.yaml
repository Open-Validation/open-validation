source-text: 'Planning Statements Required for the following types of *major applications: Full planning
  applications Outline applications A planning statement should clearly explain the proposed development,
  an analysis of the site and local context, demonstrate its compliance with relevant national and local
  planning policies and standards and justify why the application should be approved, including site analysis,
  design considerations, and community engagement.'
