reference: noise-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Noise generating development such as Class B2 uses located near noise sensitive areas
          (residential, and Solent Waders and Brent Geese Strategy sites).
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development (e.g. housing, nursing home) located near a potential
          source of noise.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: Noise generating development such as Class B2 Uses are located near to noise sensitive areas
  i.e. residential and Solent Waders and Brent Geese Strategy Sites; and all noise sensitive developments
  e.g., housing, nursing home etc., located near to a potential sources of noise e.g. licensed premises,
  busy urban road, motorway, industrial site.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Noise Assessment'.
review-status: unverified
field-status: {}
