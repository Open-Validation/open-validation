reference: noise-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Noise generating development (such as Class B2) near noise sensitive areas (residential,
          Solent Waders and Brent Geese Strategy sites).
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development (housing, nursing homes) near a potential source of noise.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Noise Assessment Required for the following types of *major applications: Full planning
  applications Outline planning applications When: Noise generating development such as Class B2 Uses
  are located near to noise sensitive areas i.e. residential and Solent Waders and Brent Geese Strategy
  Sites; and all noise sensitive developments e.g., housing, nursing home etc., located near to a potential
  sources of noise e.g. licensed premises, busy urban road, motorway, industrial site.'
confidence: medium
notes: 'Audit (wrong_trigger): Noise Assessment applies only to major full/outline applications.'
review-status: unverified
field-status: {}
