reference: flood-risk-assessment
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: Development at ground level in Flood Risk Zones 2 and 3.
    - condition:
        field: ground-floor-or-basement
        value: true
        description: The development is at ground level.
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
    - any:
      - site:
          in:
          - flood-risk-zone
          description: All development within Flood Risk Zones 2 and 3.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Sites of 1 hectare or more in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Sites of 1 hectare or more in Flood Zone 1.
      - site:
          in:
          - critical-drainage-area
          description: Land identified by the Environment Agency as having critical drainage problems.
      - site:
          in:
          - future-flood-risk
          description: Land identified in a strategic flood risk assessment as being at increased flood
            risk in the future.
      - discretionary
  - all:
    - site:
        in:
        - strategic-allocation
        description: The site is within the Welborne Plan policy boundary.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Householder applications When: Development is at ground level in Flood Risk Zones 2 and
  3 And Full planning applications for *major development Outline planning applications for *major development
  When: All development within Flood Risk Zones 2 & 3 Sites of 1 hectare or more in area in Flood Risk
  Zone 1 Land which is been identified by the Environment Agency as having critical drainage problems
  Land identified in a strategic flood risk assessment as being at increased flood risk in the future
  Land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use.'
must-include:
- item: Applies the risk-based approach to the sequential and exception tests in the Planning Practice
    Guidance
  level: must
- item: Identifies and assesses the risks of all forms of flooding to and from the development and how
    they will be managed, taking climate change into account
  level: should
- item: Design of surface water management systems including sustainable drainage systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: 'For Welborne: a site-specific flood risk assessment showing the development will not increase
    flood risk on the Welborne site or elsewhere'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: 'From the council''s list (adopted 28 March 2025), page 1 (single web page), Local Information
  Requirements table, row ''Flood Risk Assessment''. ''Land that may be subject to other sources of flooding,
  where its development would introduce a more vulnerable use'' is shown as discretionary. Also the Welborne
  ''Flood Risk Assessment'' row. Welborne: ''initial planning application(s)'' has no field, so that part
  is shown as discretionary within the Welborne boundary (the land already has outline permission P/17/0266/OA).'
review-status: unverified
field-status: {}
