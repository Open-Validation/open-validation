reference: flood-risk-assessment
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: Ground-floor development in Flood Zone 2 or 3.
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
    - any:
      - site:
          in:
          - flood-risk-zone
          description: The site is in Flood Zone 2 or 3.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the workbook quoted a sentence about environmental statements.
  From the audit: householder (ground-floor development in Flood Zones 2/3) and major full/outline, with
  Flood Zone 2/3 and 1 ha triggers.'
review-status: unverified
field-status: {}
