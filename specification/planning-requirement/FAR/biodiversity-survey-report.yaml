reference: biodiversity-survey-report
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - special-protection-area
          - special-area-of-conservation
          description: The development may affect a nationally designated habitat.
      - site:
          in:
          - local-wildlife-site
          description: The development may affect a locally designated nature conservation habitat.
      - condition:
          field: protected-species
          value: true
          description: The development may have an impact on a protected species.
      - site:
          in:
          - priority-habitat
          description: The development may have an impact on notable habitats.
  - all:
    - site:
        in:
        - strategic-allocation
        description: The site is within the Welborne Plan policy boundary.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'A biodiversity survey and report is likely to be needed where: any development that may
  affect a nationally designated habitat. ... any development that may affect a locally designated nature
  conservation habitat. ... any development that may have an impact on a protected species any development
  that may have an impact on notable habitats ... Initial planning application(s) for Welborne.'
must-include:
- item: Where a phase 1 survey (preliminary ecological assessment) identifies that a further survey is
    necessary, that survey carried out and submitted with the application
  level: must
- item: Information on existing biodiversity interests and possible impacts on them, and information supporting
    any mitigation and/or compensation measures
  level: should
- item: Where appropriate, plans indicating significant wildlife habitats or features and the location
    of habitats of protected species
  level: should
- item: Carried out by qualified ecologists meeting CIEEM's Competencies for Species Survey
  level: should
- item: 'For Welborne: information on all potential impacts on existing biodiversity interests'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: 'From the council''s list (adopted 28 March 2025), page 1 (single web page), Local Information
  Requirements table, row ''Ecological Assessment''. Also the Welborne ''Ecological Assessment'' row.
  The Hampshire Biodiversity Information Centre checklist can be used to decide whether surveys are needed.
  Welborne: ''initial planning application(s)'' has no field, so that part is shown as discretionary within
  the Welborne boundary (the land already has outline permission P/17/0266/OA).'
review-status: unverified
field-status: {}
