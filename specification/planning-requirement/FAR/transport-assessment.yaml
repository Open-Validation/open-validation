reference: transport-assessment
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
    - discretionary
  - site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: Where the development has significant transport implications. The detail of the TA should
  reflect the scale of the development and the extent of the transport implications of the proposal. ...
  Planning application(s) for all or part of Welborne
must-include:
- item: 'For major proposals: accessibility to the site by all modes of transport and the likely modal
    split of journeys'
  level: should
- item: Proposed measures to improve access by public transport, walking and cycling, to reduce parking
    need and to mitigate transport impacts
  level: should
- item: 'For Welborne (Transport Framework incorporating a Public Transport Plan): how high quality public
    transport (including Bus Rapid Transit extension), travel planning, southward-facing access via the
    A32 and M27 junction 10, phasing linked to transport infrastructure, and mitigation of traffic and
    environmental impacts will be achieved'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Transport Assessment (TA)'. 'Significant transport implications' is shown as discretionary
  within major full/outline applications. Also the Welborne 'Transport Framework (incorporating a Public
  Transport Plan) and Transport Assessment' row (all Welborne applications).
review-status: unverified
field-status: {}
