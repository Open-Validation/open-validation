reference: sustainability-statement
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
policy: Fareham Local Plan 2037 policies CC2, CC3, CC4, NE1, NE2, NE6, NE9, NE10 and D4
source-text: 'Required for the following types of *major applications: Full planning applications Outline
  planning applications Reserved matter applications'
must-include:
- item: How the development will mitigate and adapt to climate change, with specific reference to policies
    CC2, CC3, CC4, NE1, NE2, NE6, NE10, NE9 and D4
  level: must
- item: Green and blue infrastructure incorporated into the design (e.g. biodiversity net gain, sustainable
    drainage systems)
  level: should
- item: Higher water efficiency standards (above Building Regulations)
  level: should
- item: Sustainably sourced materials reused and used
  level: should
- item: Energy efficiency integrated into the design
  level: should
- item: Renewable and low carbon technologies incorporated
  level: should
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Climate Change Statement'. The council calls this a Climate Change Statement.
review-status: unverified
field-status: {}
