reference: affordable-housing-statement
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10 or more units.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site of 0.5 hectares or more.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Affordable Housing Statement Required for: Full planning applications Outline planning applications
  In the event that the proposal is not fully policy compliant, then a viability assessment must be submitted
  with the application.'
must-include:
- item: A viability assessment, if the proposal is not fully policy compliant
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook had no threshold. From the audit: 10+ units, sites of 0.5
  ha+, allocated housing sites, or larger parcels that could take 10+ units (the last two are shown as
  officer discretion).'
review-status: unverified
field-status: {}
