reference: affordable-housing-statement
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential schemes of 10 units and above.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Residential schemes with a site area of 0.5 hectares or more.
    - site:
        in:
        - strategic-allocation
        description: The site is part of an allocated housing site.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
policy: Affordable Housing Supplementary Planning Document
source-text: Residential schemes of 10 units and above or; Residential schemes which have a site area
  of 0.5 hectares or more or; If the site is part of an allocated housing site; or The application is
  part of a larger area of land which combined with the application site is at least 0.5 hectares in area
  or is capable of accommodating 10 or more units.
must-include:
- item: 'Information about both the affordable and any market housing: numbers of units, mix of units
    with numbers of habitable rooms and/or bedrooms or floor space, and plans showing the location of
    units'
  level: should
- item: Clear explanation of any different levels or types of affordability or tenure proposed for different
    units
  level: should
- item: Details of any registered social landlords acting as partners in the development
  level: should
- item: An affordable housing plan, with the details set out in the Affordable Housing SPD
  level: should
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Affordable Housing Statement'. 'Part of a larger area of land which combined ... is at least
  0.5 hectares ... or is capable of accommodating 10 or more units' needs an officer's judgement, so it
  is shown as discretionary. 'Allocated housing site' is shown with the strategic-allocation designation.
review-status: unverified
field-status: {}
