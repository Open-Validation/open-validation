reference: sustainable-drainage-strategy
local-authority: FAR
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - critical-drainage-area
        description: The site is located within a critical drainage area.
  - all:
    - site:
        in:
        - strategic-allocation
        description: The site is within the Welborne Plan policy boundary.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Required for the following types of applications: All *major applications And Householder
  applications Full planning applications Outline planning applications When: The site is located within
  a critical drainage area. ... A comprehensive SuDS Strategy showing the principles of delivery, future
  management and maintenance across Welborne, shall be prepared and submitted with the initial planning
  applications.'
must-include:
- item: The level of information and detail specified in the Lead Local Flood Authority's checklist
  level: must
confidence: medium
notes: 'From the council''s list (adopted 28 March 2025), page 1 (single web page), Local Information
  Requirements table, row ''Drainage Strategy''. The page lists all major applications, ''And'' householder,
  full and outline applications, followed by ''When: The site is located within a critical drainage area'';
  read here as all majors plus those types in a critical drainage area. Also the Welborne ''Flood Risk
  Assessment'' row (SuDS Strategy). Welborne: ''initial planning application(s)'' has no field, so that
  part is shown as discretionary within the Welborne boundary (the land already has outline permission
  P/17/0266/OA).'
review-status: unverified
field-status: {}
