reference: recreation-facilities-assessment
local-authority: FAR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - open-space
          description: The proposed development is on existing public open space.
      - condition:
          field: loss-of-open-space
          value: true
          description: The application involves the loss or partial loss of playing fields.
  - all:
    - site:
        in:
        - strategic-allocation
        description: The site is within the Welborne Plan policy boundary.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: Where the proposed development is on existing public open space. ... The application involves
  the loss/partial loss of playing fields. ... Initial planning application(s) for Welborne.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the application
    site
  level: should
  required-if:
    site:
      in:
      - open-space
      description: Development on existing public open space.
- item: Playing Field Checklist containing all the information in Annex B (Information Requirements) of
    Sport England's playing fields policy and guidance
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss or partial loss of playing fields.
- item: 'For Welborne (Open Space and Green Infrastructure Strategy): the location, quantity, nature and
    quality standards of each type of on-site green infrastructure, with changing, storage and parking
    facilities where appropriate'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
- item: 'For Welborne: specifications for layout and construction of facilities, parking, floodlighting
    (where appropriate) and boundary treatment'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: 'From the council''s list (adopted 28 March 2025), page 1 (single web page), Local Information
  Requirements table, row ''Open Space Assessment''. Also the ''Playing Field Checklist'' row and the
  Welborne ''Open Space and Green Infrastructure Strategy'' row. Full applications include change of use.
  Welborne: ''initial planning application(s)'' has no field, so that part is shown as discretionary within
  the Welborne boundary (the land already has outline permission P/17/0266/OA).'
review-status: unverified
field-status: {}
