reference: cil-form
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - s73
      - outline
      - reserved-matters
  - any:
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Residential or retail development over 100 square metres (including extensions and
          annexes).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Any new dwelling, even if less than 100 square metres.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Community Infrastructure Levy Form 1 (Additional Information Form) Required for the following
  types of applications: Householder planning applications Minor planning applications Major planning
  applications Section 73 planning applications Outline planning applications Reserved matters planning
  applications When: All residential or retail development over 100 square metres (including extensions
  and annexes) All new dwellings even if less than 100 square metres.'
must-include:
- item: CIL Form 2 (Assumption of Liability), for any chargeable development
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): CIL Form 2 (Assumption of Liability) is also required for
  any chargeable development, for the same application types.'
review-status: unverified
field-status: {}
