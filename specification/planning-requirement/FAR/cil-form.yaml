reference: cil-form
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - s73
      - outline
      - reserved-matters
  - any:
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 100
        description: Residential development over 100 square metres (including extensions and annexes).
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 100
        description: Retail development over 100 square metres.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: All new dwellings, even if less than 100 square metres.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
