reference: land-contamination-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - any:
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a currently licensed or historic landfill site.
    - site:
        in:
        - contaminated-land
        description: The land is known to be contaminated.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: All sites within 250 metres of a currently licensed or historic landfill site or where former
  uses may have contaminated land and/or the land is known to be contaminated.
must-include:
- item: Sufficient information to determine the existence or otherwise of contamination, its nature, the
    risks it may pose and whether these can be reduced to an acceptable level
  level: should
- item: Assessment of the risks to humans, buildings and services, ground and surface water and the environment,
    based on preliminary findings
  level: should
- item: Consideration of site history, site usage, geology/hydrogeology/hydrology, ecology and archaeology,
    proximity to waste facilities or hazardous gases, site walkover findings and previous investigations
  level: should
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Contamination Assessment'. 'Where former uses may have contaminated land' is shown as discretionary.
review-status: unverified
field-status: {}
