reference: land-contamination-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - site:
      in:
      - contaminated-land
      - near-landfill-site
      description: Within 250 metres of a currently licensed or historic landfill site, or former uses
        may have contaminated the land, or the land is known to be contaminated.
