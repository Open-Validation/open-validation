reference: sci
local-authority: FAR
required-if:
  all:
  - ref: major-development
  - any:
    - application-type:
        in:
        - full
        - outline
    - all:
      - application-type:
          in:
          - reserved-matters
      - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Required for the following types of *major applications: Full planning applications Outline
  planning applications Reserved matters where local interest in them is known to exist or is reasonably
  foreseeable. When a revised planning application is submitted following a refusal, or an amended planning
  application is submitted making substantial changes to a previously approved scheme, further community
  consultation must be undertaken.'
must-include:
- item: How the applicant has consulted with the local community (including exhibitions in publicly accessible
    local locations, unless agreed otherwise with the council in advance)
  level: must
- item: Details of the views expressed by the local community
  level: must
- item: How those views have been taken into account in the formulation of the proposals
  level: must
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Community Consultation Statement'. Reserved matters only 'where local interest in them is
  known to exist or is reasonably foreseeable', shown as discretionary.
review-status: unverified
field-status: {}
