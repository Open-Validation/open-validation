reference: landscaping-plan
local-authority: FAR
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline
        - condition:
            field: landscaping-works
            value: true
            description: Outline applications where landscaping is to be considered.
  - all:
    - site:
        in:
        - strategic-allocation
        description: The site is within the Welborne Plan policy boundary.
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Required for the following types of *major applications: Full planning applications Outline
  planning applications where landscaping to be considered ... Structural landscaping schemes must identify
  how the existing landscape features on and around the site can be strengthened'
must-include:
- item: Proposals for long term maintenance and landscape management
  level: should
- item: Detailed landscaping proposals that follow from the design concept in the design and access statement
  level: should
- item: 'For Welborne (structural landscaping): how existing landscape features on and around the site
    will be strengthened'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
- item: 'For Welborne: response to areas of high landscape quality to the north and east and to long distance
    views from Portsdown Hill and across the site from the south'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
- item: 'For Welborne: a detailed phasing and management plan, bringing forward structural planting in
    early phases'
  level: should
  required-if:
    site:
      in:
      - strategic-allocation
      description: The site is within the Welborne Plan policy boundary.
confidence: medium
notes: 'From the council''s list (adopted 28 March 2025), page 1 (single web page), Local Information
  Requirements table, row ''Landscaping Scheme (Detailed)''. Also the Welborne ''Landscaping Scheme (Structural)''
  row. Welborne: ''initial planning application(s)'' has no field, so that part is shown as discretionary
  within the Welborne boundary (the land already has outline permission P/17/0266/OA).'
review-status: unverified
field-status: {}
