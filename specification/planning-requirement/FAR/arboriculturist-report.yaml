reference: arboriculturist-report
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees on the site that may be affected by the proposed development.
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: The trees are subject to a TPO or within a Conservation Area.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
policy: BS5837:2012 Trees in relation to design, demolition and construction
source-text: There are trees on the site that are subject to a TPO or within a Conservation Area and may
  be affected by the proposed development.
must-include:
- item: Which trees are to be retained and the means of protecting them during construction works
  level: must
- item: Prepared by a qualified arboriculturist
  level: should
- item: Survey information, protection plan and method statement following BS5837:2012
  level: should
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Tree Survey / Arboricultural Assessment'.
review-status: unverified
field-status: {}
