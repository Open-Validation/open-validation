reference: lighting-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
  - ref: major-development
  - any:
    - condition:
        field: external-lighting
        value: true
        description: Significant external lighting is proposed (flood lighting, lit car parking, new street
          lighting).
    - discretionary
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: 'Lighting Assessment Required for the following types of *major applications: Full planning
  applications When: Significant external lighting is proposed, i.e. flood lighting, lit areas of car
  parking, new street lighting Sites are next to areas of woodland.'
confidence: medium
notes: Sites next to areas of woodland are shown as officer discretion (no field for it).
review-status: unverified
field-status: {}
