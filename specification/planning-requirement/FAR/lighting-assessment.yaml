reference: lighting-assessment
local-authority: FAR
required-if:
  all:
  - application-type:
      in:
      - full
  - ref: major-development
  - any:
    - condition:
        field: external-lighting
        value: true
        description: Significant external lighting is proposed, i.e. flood lighting, lit areas of car
          parking, new street lighting.
    - condition:
        field: near-woodland
        value: true
        description: The site is next to areas of woodland.
source-url: https://www.fareham.gov.uk/planning/applications_and_advice/localrequireddocs.aspx
source-text: Significant external lighting is proposed, i.e. flood lighting, lit areas of car parking,
  new street lighting Sites are next to areas of woodland.
must-include:
- item: Details of external lighting and the proposed hours when the lighting would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (adopted 28 March 2025), page 1 (single web page), Local Information Requirements
  table, row 'Lighting Assessment'.
review-status: unverified
field-status: {}
