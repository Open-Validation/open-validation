reference: telecommunications-report
local-authority: CHO
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: The application includes telecommunications development.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: 'Applications incorporating telecommunications shall be accompanied by:'
must-include:
- item: Layout plan (1:100 or 1:200) showing the position of the structure
  level: must
- item: Elevation plan (1:50 or 1:100) showing the height and design of the structure
  level: must
- item: Section through the structure (1:10 or 1:20) showing its width
  level: must
- item: Elevation and layout plan (1:100 or 1:200) of associated equipment
  level: must
- item: Certificate or statement of compliance with ICNIRP guidelines, with a diagram of the beam of greatest
    intensity
  level: must
- item: Existing and proposed coverage maps
  level: must
- item: Alternative sites rejected (including existing masts, structures and buildings), with the justification
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local List item 32, page 28.
review-status: unverified
field-status: {}
