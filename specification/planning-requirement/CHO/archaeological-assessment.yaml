reference: archaeological-assessment
local-authority: CHO
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: In an area known to have archaeological interest.
  - all:
    - application-type:
        in:
        - pa-demo-building
    - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: Any development which is situated within an area of known to have archaeological interest
  shall be accompanied by an Archaeological Assessment which sets out a programme of archaeological work,
  including a scheme of investigation. … Confirmation from an accredited archaeologist/ Lancashire County
  Council Archaeology section that the demolition will not adversely impact on any items of archaeological
  significance at / adjacent to the site.
must-include:
- item: A programme of archaeological work, including a scheme of investigation
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: In an area known to have archaeological interest.
- item: 'For prior approval of demolition: confirmation from an accredited archaeologist or Lancashire
    County Council Archaeology that the demolition will not adversely affect items of archaeological significance
    at or next to the site'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (published December 2024), Local List items 6 and 36, page 16, 30. The
  demolition confirmation is shown as the council's discretion (it applies where archaeology could be
  affected).
review-status: unverified
field-status: {}
