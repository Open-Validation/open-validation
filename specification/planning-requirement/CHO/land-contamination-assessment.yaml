reference: land-contamination-assessment
local-authority: CHO
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: There is reason to suspect contamination of land, controlled waters, property or ecological
        systems (e.g. former industrial uses or infilled ground).
  - condition:
      field: sensitive-end-use
      value: true
      description: A particularly sensitive end use, such as a day nursery or housing likely to be used
        by families with children.
source-url: https://chorley.gov.uk/downloads/file/1505/validation-checklist-refresh-2024
source-text: Land Contamination Assessment Where there is reason(s) to suspect contamination of land,
  controlled waters, property or ecological systems (such as the existence of former industrial uses,
  infilled ground, or other indications of potential contamination) and for particularly sensitive end-uses
  such as a day nursery or housing likely to be used by families with children, a planning application
  shall be accompanied by either a Desk study or a Land Contamination Assessment.
