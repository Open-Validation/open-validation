reference: land-contamination-assessment
local-authority: CHO
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Reason to suspect contamination (e.g. former industrial uses or infilled ground).
  - condition:
      field: sensitive-end-use
      value: true
      description: Particularly sensitive end uses such as a day nursery or family housing.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: Where there is reason(s) to suspect contamination of land, controlled waters, property or
  ecological systems (such as the existence of former industrial uses, infilled ground, or other indications
  of potential contamination) and for particularly sensitive end-uses such as a day nursery or housing
  likely to be used by families with children, a planning application shall be accompanied by either a
  Desk study or a Land Contamination Assessment.
must-include:
- item: A desk study of readily available records assessing previous uses of the site and their potential
    for contamination
  level: must
- item: 'Where contamination potential is confirmed: an assessment of ground contamination identifying
    the type, nature and extent of contamination, risks to receptors and potential for migration within
    and beyond the site'
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Potential for contamination confirmed.
- item: 'Where contamination potential is confirmed: remediation proposals with an implementation timetable
    and monitoring proposals'
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Potential for contamination confirmed.
confidence: medium
notes: From the council's list (published December 2024), Local List item 21, page 24.
review-status: unverified
field-status: {}
