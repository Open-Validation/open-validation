reference: waste-management-plan
local-authority: CHO
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New residential or commercial development.
  - all:
    - condition:
        field: waste-storage-facilities
        value: true
        description: Development to existing properties affecting refuse and recycling storage.
    - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: Planning applications for new residential and commercial development along with developments
  to existing properties that will result in inadequate refuse and recycling storage and collection facilities
  will be required to be accompanied by a Waste Management Strategy.
confidence: medium
notes: From the council's list (published December 2024), Local List item 27 (Waste Management Strategy),
  page 27. For existing properties it is needed where the development would leave inadequate refuse and
  recycling storage and collection (the council's judgement).
