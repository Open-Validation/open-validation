reference: application-form
local-authority: CHO
required-if:
  always: true
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; section 65(5)
  of the Town and Country Planning Act 1990
source-text: A completed standard application form is required which is available to complete online.
  … All applications for planning permission except for approval of reserved matters must include the
  appropriate certificate of ownership.
must-include:
- item: The appropriate ownership certificate (A, B, C or D)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - lbc
  source-text: An ownership certificate A, B, C or D must be completed stating the ownership of the application
    site.
- item: 'Where Certificate B, C or D is completed: the required notice served and/or publicity carried
    out before the application is made'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate B, C or D is completed.
- item: The correct fee, where one is needed; an application without the fee is treated as invalid
  level: must
  source-text: Any application which is submitted without a fee will be treated as invalid until a fee
    is received.
confidence: medium
notes: From the council's list (published December 2024), National List items 1, 3, 4 and 5, page 5-6.
  Fees cannot be paid by cheque.
review-status: unverified
field-status: {}
