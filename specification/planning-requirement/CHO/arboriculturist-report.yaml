reference: arboriculturist-report
local-authority: CHO
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The proposal could affect trees on or next to the site.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: For proposals which have the potential to impact on trees (either within the application
  site or adjacent to the application site) the planning application shall be accompanied by a Tree Survey.
  … Sufficient evidence to support the case for works to trees protected by a TPO in the form of a report
  from a qualified expert or diagnostic information
must-include:
- item: A plan of all trees and vegetation on or next to the site, with species, height and canopy diameter
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Planning application affecting trees.
- item: Which trees and vegetation will be retained, and which are to be removed, with justification
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Planning application affecting trees.
- item: A tree constraints plan, a tree retention plan and a root protection plan to BS 5837:2012
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Planning application affecting trees.
- item: 'For works to TPO trees: a report from a qualified expert or diagnostic information supporting
    the case for the works'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
confidence: medium
notes: From the council's list (published December 2024), Local List items 25 (Tree Survey) and 26 (Tree
  Works), page 26. Failure to give enough evidence for TPO works may mean the application is invalidated,
  rejected or refused.
review-status: unverified
field-status: {}
