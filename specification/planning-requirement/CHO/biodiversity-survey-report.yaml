reference: biodiversity-survey-report
local-authority: CHO
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development might affect protected species.
  - site:
      in:
      - priority-habitat
      description: The development might affect priority habitats.
  - site:
      in:
      - local-wildlife-site
      description: The development might affect a Biological Heritage Site.
  - site:
      in:
      - ancient-woodland
      description: The development might affect Ancient Woodland or its buffer zone.
  - site:
      in:
      - site-of-special-scientific-interest
      description: The development is likely to affect an SSSI (Appendix C, Table 2).
  - site:
      in:
      - park-and-garden
      description: The development is likely to affect a Historic Park and Garden (Appendix C, Table 2).
  - condition:
      field: geodiversity-interest
      value: true
      description: The development is likely to affect a Geological Heritage Site.
  - condition:
      field: near-woodland
      value: true
      description: The development might affect woodland areas.
  - condition:
      field: pond-on-or-near-site
      value: true
      description: The development might affect a water body or pond.
  - condition:
      field: near-watercourse
      value: true
      description: The development might affect a ditch or similar feature, or is in or within 200 m of
        rivers, streams, canals, lakes or reed beds.
  - condition:
      field: potential-roost-features
      value: true
      description: Conversion, modification or demolition of buildings of the kinds listed in Appendix
        C, Table 1 (traditional farm buildings, pre-1914 buildings, buildings near woodland or water).
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting of churches, listed buildings or green space within 50 m of woodland,
        water or hedgerows.
  - condition:
      field: tree-removal
      value: true
      description: Felling, removal or lopping of woodland, old and veteran trees or mature trees with
        holes, cracks or ivy.
  - condition:
      field: hedgerows-affected
      value: true
      description: Felling or removal of field hedgerows or lines of trees connected to woodland or water.
  - condition:
      field: wind-turbine
      value: true
      description: Wind farm developments or single wind turbines.
  - all:
    - application-type:
        in:
        - pa-demo-building
    - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Central Lancashire Biodiversity and Nature Conservation SPD; Conservation (Natural Habitats &c.)
  Regulations 1994
source-text: An ecological assessment and/or wildlife survey shall be submitted for all proposals where
  the development of the site might affect protected species and/or habitats, Biological Heritage Sites,
  Ancient Woodland, woodland areas, any water body, pond ditch, or other similar feature. … If the application
  involves any of the development proposals shown in Table 1 (Column 1), a protected species survey and
  assessment must be submitted with the application. … If the application is likely to affect any of the
  designated sites, priority habitats or biodiversity features listed in Table 2 a survey and assessment
  for the relevant
must-include:
- item: Details of the appointed ecologist, to show their competence
  level: must
- item: Confirmation that surveys were undertaken or updated within the last 3 years
  level: must
- item: A detailed method for the assessment or survey
  level: must
- item: Detailed results and an evaluation of the ecological interest
  level: must
- item: An assessment of likely impacts
  level: must
- item: Proposals to avoid, mitigate or compensate for ecological impacts
  level: must
- item: 'For developments affecting European Protected Species (e.g. bats, otters, great crested newts):
    information addressing the three licensing tests of the Habitats Regulations'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: European Protected Species may be affected.
- item: 'Protected species survey: which species are present and their numbers, and a map of their distribution
    and use of the area'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species may be present.
- item: 'Where harm is likely: how alternatives were considered and how effects will be avoided, mitigated
    or compensated'
  level: must
- item: 'Designated sites and priority habitats: the habitats and features present, their extent, and
    a map of their distribution on an appropriate scale plan, with the likely change in priority habitat
    area'
  level: must
- item: 'For prior approval of demolition: bat surveys, or confirmation from a licensed ecologist that
    the demolition will not adversely affect protected species'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
  source-text: Bat surveys or the confirmation from a licenced Ecologist that the demolition will not
    adversely impact on protected species
confidence: medium
notes: From the council's list (published December 2024), Local List item 5, item 36 and Appendix C, page
  15, 30, 41-47. Surveys must be by competent people at an appropriate time of year (Appendix C, Table
  3). Exceptions apply where the council or Natural England has confirmed in writing that no survey is
  needed, or evidence shows species are absent. For prior approval of demolition the bat survey can be
  replaced by an ecologist's confirmation, so it is shown as the council's discretion.
review-status: unverified
field-status: {}
