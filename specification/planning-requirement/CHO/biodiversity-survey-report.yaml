reference: biodiversity-survey-report
local-authority: CHO
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development might affect protected species.
  - site:
      in:
      - priority-habitat
      - local-wildlife-site
      - ancient-woodland
      description: The development might affect habitats, Biological Heritage Sites, Ancient Woodland
        or woodland areas.
  - condition:
      field: near-watercourse
      value: true
      description: The development might affect any water body, pond, ditch or similar feature.
source-url: https://chorley.gov.uk/downloads/file/1505/validation-checklist-refresh-2024
source-text: Ecological Assessments & Wildlife Surveys An ecological assessment and/or wildlife survey
  shall be submitted for all proposals where the development of the site might affect protected species
  and/or habitats, Biological Heritage Sites, Ancient Woodland, woodland areas, any water body, pond ditch,
  or other similar feature.
