reference: viability-assessment
local-authority: CHO
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The scheme would be contrary to policy for financial reasons (e.g. a reduced affordable
        housing contribution).
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The applicant believes affordable housing provision would make the scheme unviable.
  - application-type:
      in:
      - mod-discharge-s106
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Central Lancashire Core Strategy; Central Lancashire Affordable Housing SPD (October 2012); section
  106BA, Town and Country Planning Act 1990
source-text: Any application submitted which would be contrary to policy due to the specific financial
  considerations of the scheme (i.e. a reduced affordable housing contribution) will be required to be
  supported by a financial viability assessment … If the applicant believes provision of affordable housing
  will have a negative effect on the viability of the scheme they will need to submit a viability assessment
  … Evidence that the affordable housing element of the existing Section 106 agreement means that the
  scheme is unviable in the form of relevant viability evidence.
must-include:
- item: Value of the land (2 or 3 different estate agents' valuations)
  level: must
- item: Abnormal development costs
  level: must
- item: Construction costs
  level: must
- item: Price a registered social landlord will pay for the units (for affordable housing)
  level: must
- item: Open market value of the dwellings or of the development
  level: must
- item: Developer return
  level: must
- item: Details of the proposed obligations or specific elements of the scheme included
  level: must
- item: 'For affordable housing: the percentage of affordable units the site can accommodate'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less affordable housing than policy requires.
- item: Accords with the RICS guidance note 'Financial viability in planning' (GN 94/2012)
  level: must
- item: 'May include three scenarios: no obligations, fully policy-compliant, and as proposed'
  level: should
- item: 'For section 106BA applications: clear, up-to-date evidence, usually an open book review of the
    most recently agreed viability appraisal'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
confidence: medium
notes: From the council's list (published December 2024), Local List items 13, 16 and 40, page 19, 21,
  31.
review-status: unverified
field-status: {}
