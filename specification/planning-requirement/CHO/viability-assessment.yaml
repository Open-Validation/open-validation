source-text: 'Financial Viability Assessment Any application submitted which would be contrary to policy
  due to the specific financial considerations of the scheme (i.e. a reduced affordable housing contribution)
  will be required to be supported by a financial viability assessment containing the following information:
  Value of the land (2/3 different estate agents valuations)'
must-include:
- item: Value of the land (2 or 3 different estate agents' valuations)
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Needed where an
  application is contrary to policy for financial reasons (e.g. reduced affordable housing). From the
  audit (missing_requirement): S106BA applications to modify affordable housing obligations need viability
  information (item 40).'
