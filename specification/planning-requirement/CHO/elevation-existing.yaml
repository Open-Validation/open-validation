reference: elevation-existing
local-authority: CHO
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following plans are required to support planning applications (except where the application
  is made pursuant to section 73 (determination of applications to develop land without conditions previously
  attached) or section 73A(2)(c) (planning permission for development already carried out) of the 1990
  Act(a)). The plans should be provided at the stated scale including the paper size (i.e. 1:500 at A1)
  in digital format and should accurately show the direction of North (where appropriate):'
must-include:
- item: Drawn at a scale of 1:50 or 1:100, showing the proposed works in relation to what is already there
  level: should
- item: All sides of the proposal, including blank elevations
  level: must
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each'
  level: should
- item: The dimensions of the proposal annotated onto the plan
  level: should
- item: 'For new shopfronts: elevations of the existing and proposed shopfront'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: The application is for a new shopfront.
  source-text: Applications for new shopfronts shall be accompanied by a section plan detailing the projection
    of any signage, canopies and roller shutters along with elevational plans detailing the existing and
    proposed shopfront.
confidence: medium
notes: From the council's list (published December 2024), National List item 2e and Local List item 31,
  page 4, 28.
review-status: unverified
field-status: {}
