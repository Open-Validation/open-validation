reference: air-quality-assessment
local-authority: CHO
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: In or near an Air Quality Management Area.
  - condition:
      field: traffic-aadt-increase
      operator: '>='
      value: 5
      description: A cumulative significant impact of traffic generation (an increase of traffic flow
        of 5%).
  - condition:
      field: parking-spaces
      operator: '>'
      value: 300
      description: More than 300 additional parking spaces.
  - condition:
      field: hcv-movements
      value: true
      description: Coach and lorry parking is to be provided.
  - condition:
      field: direct-air-emissions
      value: true
      description: Potentially significant emissions to air from sources other than traffic.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: New exposure of sensitive receptors to an existing source.
    - discretionary
  - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Chorley Council Air Quality Review and Assessments
source-text: 'Where a proposed development meets the following criterion an Air Quality Assessment will
  be required: • The development is in or near an Air Quality Management Area; • There is a cumulative
  significant impact of traffic generation (an increase of traffic flow of 5%); or • This is a significant
  number (>300 spaces) of additional parking, or • coach and lorry parking is to be provided; or • there
  is already a recognised congestion or air quality problem in the area; or • there will potentially be
  significant emissions to the air from sources other than traffic; or • there is the introduction of
  new exposure to sensitive receptors form an existing source.'
confidence: medium
notes: From the council's list (published December 2024), Local List item 35, page 29. 'Near' an AQMA,
  an existing congestion or air quality problem and new exposure of sensitive receptors are shown as the
  council's discretion. Coach and lorry parking is shown with the HGV movements field.
review-status: unverified
field-status: {}
