reference: affordable-housing-statement
local-authority: CHO
required-if: discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Central Lancashire Core Strategy; Central Lancashire Affordable Housing SPD (October 2012)
source-text: For housing schemes which require an element of affordable housing the planning submission
  will be required to detail how the required percentage of affordable housing will be achieved on site,
  the tenure of the proposed affordable units, the number of bedrooms of the proposed affordable units.
must-include:
- item: How the required percentage of affordable housing will be achieved on site
  level: must
- item: The tenure of the proposed affordable units
  level: must
- item: The number of bedrooms of the proposed affordable units
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local List item 16, page 21. The list does not
  say which housing schemes require affordable housing (it notes 30% is sought in urban areas, 35% in
  rural areas and 100% on rural exception sites), so it is shown as the council's discretion.
