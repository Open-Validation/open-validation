reference: noise-assessment
local-authority: CHO
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal is likely to generate noise.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Close to noise sensitive areas (e.g. residential areas).
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development within an area of noisy development (e.g. next to a railway
          line).
    - discretionary
  - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Noise Action Plan and Environmental Noise Mapping for the Preston Agglomeration
source-text: Proposals for which are likely to generate noise located close to noise sensitive areas (e.g.
  close to residential areas) are required to be accompanied by a Noise Impact Assessment. … Similarly,
  proposals for noise sensitive developments within areas of noisy development (e.g. adjacent to a railway
  line) will be required to detail measures to protect the new development from noise. … Any proposed
  development in the top priority areas will require site specific environmental noise assessment and
  appropriate noise reduction measures.
must-include:
- item: The levels of noise expected to be created and methods of mitigating any impact
  level: must
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: The proposal is likely to generate noise.
- item: 'For noise sensitive development in noisy areas: measures to protect the new development from
    noise'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development in a noisy area.
- item: 'In Noise Action Plan top priority areas: a site-specific environmental noise assessment with
    noise reduction measures'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published December 2024), Local List item 22, page 24-25. 'Areas of noisy
  development' and the Noise Action Plan top priority areas have no map field here, so they are shown
  as the council's discretion.
review-status: unverified
field-status: {}
