reference: landscaping-plan
local-authority: CHO
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New housing schemes.
  - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: For certain proposals, including new housing schemes, the following plans will be required
  to enable a full assessment of the proposals. … Landscape plan- including full details of all existing
  trees and those to be removed, all existing and/ or proposed ground cover planting, size, species, density
  and position of proposed trees and details of all existing and proposed hardstanding/parking areas.
must-include:
- item: All existing trees and those to be removed
  level: must
- item: All existing and proposed ground cover planting
  level: must
- item: Size, species, density and position of proposed trees
  level: must
- item: All existing and proposed hardstanding and parking areas
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local List item 28 (Additional Plans), page
  27. 'Certain proposals' other than new housing schemes are shown as the council's discretion. Materials,
  boundary treatment and street scene plans are in the unmapped list.
review-status: unverified
field-status: {}
