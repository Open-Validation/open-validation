reference: lighting-assessment
local-authority: CHO
required-if:
  condition:
    field: external-lighting
    value: true
    description: The application includes new external lighting.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: Planning applications which include new external lighting shall be accompanied by a Lighting
  Assessment.
must-include:
- item: Plans showing the location of the lighting
  level: should
- item: Site survey, including the District Ambient Brightness Category
  level: should
- item: Calculations of glare, intensity and spill, with recommendations to control them
  level: should
- item: Risk assessment of crime and disorder and the impact on light sensitive premises
  level: should
- item: Schedule of installation
  level: should
- item: Equipment design, used to determine aim, glare and overspill
  level: must
- item: Measured luminance of the proposed scheme
  level: should
- item: Hours of illumination
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local List item 33, page 28-29.
review-status: unverified
field-status: {}
