reference: flood-risk-assessment
local-authority: CHO
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of one hectare or more (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of one hectare or more (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: Planning applications for development proposals of one hectare or greater in Flood Zone 1
  and all proposals for new developments located in Flood Zones 2 and 3, should be accompanied by a Flood
  Risk Assessment (FRA). … For householder applications located within a Flood Risk Zone, the planning
  application shall be accompanied by a simple flood risk assessment using the Standing Advice.
must-include:
- item: 'For householder applications in a flood risk zone: a simple flood risk assessment using the Environment
    Agency standing advice'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In a flood risk zone.
confidence: medium
notes: From the council's list (published December 2024), Local List item 20, page 24.
review-status: unverified
field-status: {}
