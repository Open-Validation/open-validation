reference: flood-risk-assessment
local-authority: CHO
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3 (householder sites in a flood zone need a simple FRA
        using the Standing Advice).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more in Flood Zone 1.
source-url: https://chorley.gov.uk/downloads/file/1505/validation-checklist-refresh-2024
source-text: For householder applications located within a Flood Risk Zone, the planning application shall
  be accompanied by… a simple flood risk assessment using the Standing Advice.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave only the householder Standing Advice line; the list also
  requires an FRA for sites of 1ha+ in Flood Zone 1 and all development in Flood Zones 2 and 3.'
review-status: unverified
