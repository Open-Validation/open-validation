reference: design-and-access-statement
local-authority: CHO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a conservation area or World Heritage Site.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellinghouses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings creating 100 square metres or more of floor space.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In accordance with the DMPO Design and Access Statement will be required to accompany: In
  all areas: • major development 1 • development is in a designated area2 consisting of- (i) the provision
  of one or more dwellinghouses; or (ii) the provision of a building or buildings where the floor space
  created by the development is 100 square metres or more.'
must-include:
- item: Explains the design principles and concepts applied to the development
  level: must
- item: Shows the steps taken to appraise the context of the development and how the design takes that
    context into account
  level: must
- item: Explains the policy adopted as to access, and how access policies in local development documents
    have been taken into account
  level: must
- item: States what consultation, if any, has been undertaken on access and what account has been taken
    of it
  level: must
- item: Explains how any specific issues which might affect access have been addressed
  level: must
- item: 'For outline applications: the amount of development for each use, how it is distributed across
    the site and how it relates to its surroundings (in the design and access statement or planning statement)'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: 'Amount: cannot be reserved within an outline application. The amount of development proposed
    for each use, how this will be distributed across the site and how the proposal relates to the site’s
    surroundings should be explained in any design and access statement or planning statement.'
- item: 'For outline applications with landscaping or appearance reserved: the principles that will inform
    the future landscaping scheme and the intended appearance'
  level: should
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (published December 2024), National List item 6 and Local List item 2,
  page 6-7, 11. Not required for section 73 applications, engineering or mining operations, a material
  change of use, or waste development.
review-status: unverified
field-status: {}
