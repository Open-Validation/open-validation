reference: location-plan
local-authority: CHO
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following plans are required to support planning applications (except where the application
  is made pursuant to section 73 (determination of applications to develop land without conditions previously
  attached) or section 73A(2)(c) (planning permission for development already carried out) of the 1990
  Act(a)). The plans should be provided at the stated scale including the paper size (i.e. 1:500 at A1)
  in digital format and should accurately show the direction of North (where appropriate):'
must-include:
- item: Based on an up-to-date map at a scale of 1:1250 or 1:2500
  level: must
- item: At least two named roads and the surrounding buildings, numbered or named so the site is clearly
    identified
  level: should
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published December 2024), National List item 2a, page 3. Plans are not
  needed with section 73 or 73A(2)(c) applications.
review-status: unverified
field-status: {}
