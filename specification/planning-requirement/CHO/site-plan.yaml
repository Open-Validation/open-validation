reference: site-plan
local-authority: CHO
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following plans are required to support planning applications (except where the application
  is made pursuant to section 73 (determination of applications to develop land without conditions previously
  attached) or section 73A(2)(c) (planning permission for development already carried out) of the 1990
  Act(a)). The plans should be provided at the stated scale including the paper size (i.e. 1:500 at A1)
  in digital format and should accurately show the direction of North (where appropriate):'
must-include:
- item: Drawn at a scale of 1:500 or 1:200, with the direction of North
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: The extent and type of any hardstanding
  level: should
- item: Boundary treatment, including walls or fencing where proposed
  level: should
- item: Block plan at 1:100 or 1:200 showing site boundaries, the type and height of boundary treatment,
    and the position of any building or structure on the other side of the boundaries
  level: must
  source-text: A block plan of the site is required at a scale of 1:100 or 1:200 showing any site boundaries,
    the type and height of boundary treatment (e.g. walls, fences etc), the position of any building or
    structure on the other side of such boundaries.
- item: 'For outline applications: the location point of the access(es), even if access is a reserved
    matter'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: 'Access: the location point of the access(es) are required to be indicated on the site
    plan, even if access is to be a reserved matter.'
confidence: medium
notes: From the council's list (published December 2024), National List item 2b-2c and Local List item
  2, page 3-4, 11-12.
