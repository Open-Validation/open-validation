reference: heritage-statement
local-authority: CHO
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      description: Involves a listed building or conservation area, or affects the setting of a heritage
        asset.
  - discretionary
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: For planning applications which involve Heritage Assets, including but not limited to, Listed
  Buildings, Conservation Areas or where the setting of heritage assets would be affected, a Heritage
  Statement will be required.
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
- item: An assessment of the impact of the proposal on their significance
  level: must
- item: The relevant historic environment record consulted, and the assets assessed using appropriate
    expertise where necessary
  level: must
- item: The sources considered and the expertise consulted
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local List item 7, page 16. Other heritage assets
  ('including but not limited to') are shown as the council's discretion. Applications cannot be validated
  where the impact on heritage assets cannot be understood.
review-status: unverified
field-status: {}
