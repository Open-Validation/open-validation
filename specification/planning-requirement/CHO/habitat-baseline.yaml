source-text: 'In England, biodiversity net gain is mandatory under a statutory framework introduced by
  Schedule 7A of the Town and Country Planning Act 1990 (as inserted by the Environment Act 2021). BNG
  is mandatory for major development from 12th February 2024 and for small sites from 2nd April 2024.
  Some development types will be exempt, further information on exemptions and submission requirements
  can be found here:'
confidence: medium
notes: 'From the council''s list (published December 2024), National List item 8, page 8. The list says
  BNG is mandatory for major development from 12 February 2024 and small sites from 2 April 2024, and
  points to the council''s BNG planning policy page for exemptions and submission requirements; it lists
  no contents itself. Shown with the biodiversity gain condition, as the law sets: householder and other
  exempt applications are exempt. The pre-development habitat plan is part of the statutory BNG information.'
