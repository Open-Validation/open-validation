reference: fire-statement
local-authority: CHO
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://chorley.gov.uk/downloads/file/1505/validation-checklist-refresh-2024
source-text: Fire Safety Statement Required for all applications proposing relevant buildings The provision
  of one or more relevant buildings; or Development of an existing relevant building;
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. 'Required for all
