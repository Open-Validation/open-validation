reference: fire-statement
local-authority: CHO
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications proposing relevant buildings The provision of one or more relevant
  buildings; or Development of an existing relevant building; … Or development within the curtilage of
  a relevant building.
must-include:
- item: On the form published by the Secretary of State, with the particulars it specifies
  level: must
confidence: medium
notes: From the council's list (published December 2024), National List item 7, page 7-8. A relevant building
  contains two or more dwellings or educational accommodation and is 18 m or more high or has 7 or more
  storeys.
review-status: unverified
field-status: {}
