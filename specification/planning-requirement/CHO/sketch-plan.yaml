reference: sketch-plan
local-authority: CHO
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: A sketch plan clearly identifying the trees subject to the application (the plan should also
  identify other trees on the site clearly marked that they are not subject to the application). The sketch
  plan should include the site boundaries, the adjacent properties (including house names/ numbers), distances
  between the trees and nearby features on the site, an arrow indicating north, the position of the trees
  in relation to nearby buildings and the individual trees/ groups of trees should be numbered. (please
  see appendix A for a suitable example).
must-include:
- item: The trees subject to the application, individually numbered (or groups numbered), with other trees
    on the site marked as not part of the application
  level: must
- item: Site boundaries and adjacent properties (with house names or numbers)
  level: must
- item: Distances between the trees and nearby features, and the position of the trees in relation to
    nearby buildings
  level: must
- item: An arrow indicating north
  level: must
- item: 'Where individual trees in a woodland or group cannot be identified: their approximate location'
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local List item 26 and Appendix A, page 26,
  33. Photographs can also be used to identify the trees.
review-status: unverified
field-status: {}
