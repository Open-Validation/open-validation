reference: condition-of-trees
local-authority: CHO
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: tree-condition-reasons
      value: true
      description: The works are justified by the trees' condition, defects, pests, diseases or fungi.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: The presence and impact of pests, diseases or fungi that require work to be carried out to
  the trees should be described in written evidence or diagnostic information from an arboriculturist
  or other appropriate expert. Arboricultural evidence must be provided to support applications that suggest
  the tree has defects that may be of concern to the future or future safe retention of the tree of parts
  of the tree.
must-include:
- item: Full details of the condition of the trees
  level: must
- item: Written evidence or diagnostic information from an arboriculturist or other appropriate expert
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local List item 26 (Tree Works), page 26.
review-status: unverified
field-status: {}
