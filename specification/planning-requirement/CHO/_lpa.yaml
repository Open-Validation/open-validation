- item: Plans provided in digital format at the stated scale including the paper size (e.g. 1:500 at A1),
    showing the direction of North where appropriate
  level: should
- item: The dimensions of the proposal annotated onto the submitted plans
  level: should
- item: 'Where a local list item is not provided: a written justification of why it is not appropriate'
  level: should
