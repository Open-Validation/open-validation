source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: 'National Planning Practice Guidance: Transport evidence bases in plan making and decision taking'
source-text: 'Where developments will have the potential to have transport implications, the planning
  application shall be accompanied by a Transport Statement or a Transport Assessment and Travel Plan
  (dependent on the type and size of the development). Planning applications for the following types and
  size of developments shall include either a Transport Statement or Travel Assessment and Travel Plan:
  … Any development which it is considered would have a significant impact on the highway network'
