reference: town-centre-impact-assessment
local-authority: CHO
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses not in an existing centre and not in accordance with an up-to-date
      Local Plan.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
source-text: A sequential assessment will be required for main town centre uses that are not in an existing
  centre and are not in accordance with an up-to-date Local Plan. … Applications for retail, office and
  leisure development outside of town centres, which are not in accordance with an up-to-date Local Plan,
  will be required to be supported by an impact assessment if the development is over 2,500 sq m.
must-include:
- item: 'Sequential test: sites assessed for availability, suitability and viability, with all in-centre
    options assessed before less central sites'
  level: must
- item: 'Sequential test: that there are no town centre sites to accommodate the development'
  level: must
- item: 'For edge-of-centre proposals: flexibility on scale, format, car parking and disaggregation'
  level: must
- item: 'Impact assessment for retail, office and leisure development over 2,500 sq m: impact on existing,
    committed and planned investment in centres in the catchment'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail, office or leisure development over 2,500 sq m.
- item: 'Impact assessment: impact on town centre vitality and viability, including consumer choice and
    trade, up to five years ahead (ten years for major schemes whose full impact takes longer)'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail, office or leisure development over 2,500 sq m.
confidence: medium
notes: From the council's list (published December 2024), Local List item 34 (Sequential Test and Impact
  Assessment), page 28-29. The sequential approach does not apply to small-scale rural offices or other
  small-scale rural development.
review-status: unverified
field-status: {}
