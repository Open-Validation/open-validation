reference: section-proposed
local-authority: CHO
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: new-build
      value: true
      description: The application involves new buildings.
  - condition:
      field: shopfront
      value: true
      description: The application is for a new shopfront.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings should
  be submitted to show both existing and finished levels … This will be required for all applications
  involving new buildings. … Applications for new shopfronts shall be accompanied by a section plan detailing
  the projection of any signage, canopies and roller shutters
must-include:
- item: Drawn at a scale of 1:50 or 1:100, with a cross section through the proposed building(s)
  level: should
- item: 'Where ground levels change: existing and finished levels, including foundations and eaves, and
    how encroachment onto adjoining land is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: Existing site levels and finished floor levels, related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The application involves new buildings.
- item: 'For new shopfronts: a section showing the projection of any signage, canopies and roller shutters'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: The application is for a new shopfront.
confidence: medium
notes: From the council's list (published December 2024), National List item 2f and Local List item 31,
  page 4-5, 28. For householder development the levels may be evident from the floor plans and elevations.
review-status: unverified
field-status: {}
