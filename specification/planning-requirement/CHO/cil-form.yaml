reference: cil-form
local-authority: CHO
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: 100 sq m or more gross internal area of new floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings (including annexes), by conversion or new build.
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Chorley CIL Charging Schedule
source-text: 'Applications which fall within the definition of chargeable development (please see below)
  will be required to provide a CIL contribution. Planning applications must be accompanied by a CIL Form
  1 which can be downloaded through the planning portal website: … Minor development with a gross internal
  area (GIA) or less than 100 sqm (prior to deduction of converted or demolished existing floorspace)
  - measured on all accessible floors, is generally automatically exempt from the levy. However, where
  minor development will result in a whole new dwelling (including annexes) via conversion or new build,
  it is liable for the levy regardless of size.'
must-include:
- item: CIL Form 1
  level: must
- item: 'For prior approval applications: Form 5 Notice of Chargeable Development'
  level: should
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: 'When a development is granted by way of general consent (i.e. a prior approval application)
    the application should be accompanied by the following form:'
confidence: medium
notes: From the council's list (published December 2024), Local List item 12, page 18-19. The thresholds
  come from the list's note on CIL exemptions. Every application for planning permission must also include
  a schedule of built development (see the unmapped list).
review-status: unverified
