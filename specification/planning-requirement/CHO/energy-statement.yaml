reference: energy-statement
local-authority: CHO
required-if:
  all:
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Non-residential units of 500 sq m or more.
  - any:
    - application-type:
        in:
        - full
        - reserved-matters
    - all:
      - application-type:
          in:
          - outline
      - ref: major-development
source-url: https://forms.chorleysouthribble.gov.uk/chorley-council/downloads/file/1505/Validation-Criteria-for-planning-applications-december-2024
policy: Central Lancashire Core Strategy (2012) Policy 27
source-text: All planning applications for non-residential units of 500 sq metres or more must be accompanied
  by an Energy Efficiency/Resource Conservation Statement. The Statement will not be required for outline
  planning applications apart from those for major schemes.
must-include:
- item: How the requirements of Policy 27 are met (minimum BREEAM 'Very Good', or 'Excellent' where possible
    in urban areas)
  level: must
- item: 'For outline applications with layout details: how the principles of passive solar design have
    been considered in the layout'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - outline
    - ref: major-development
confidence: medium
notes: From the council's list (published December 2024), Local List item 4 (Energy Efficiency / Resource
  Conservation Statement), page 14. Domestic microgeneration equipment and wind turbines need a manufacturer's
  specification and plans (see the unmapped list).
review-status: unverified
field-status: {}
