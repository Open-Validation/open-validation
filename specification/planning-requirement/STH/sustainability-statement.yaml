reference: sustainability-statement
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: 1 or more residential units.
    - condition:
        field: overnight-accommodation
        value: true
        description: Other forms of overnight accommodation, including hotels.
    - condition:
        field: hmo-occupancy-increase
        value: true
        description: An increase in occupation of a House in Multiple Occupation (HMO).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: Non-residential development of 500 sq m or more floor area.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: Saved LDF Core Strategy Policy CS20 (Tackling and Adapting to Climate Change)
source-text: 'The Sustainability Checklist should be completed for all planning applications, whether
  new build or conversion, for the following: 1 or more residential unit and/or other forms of overnight
  accommodation (including hotels); and; Increases in occupation for a House in Multiple Occupation (HMO);
  and All non-residential applications of 500sq.m or more floor area'
must-include:
- item: The council's Sustainability Checklist, completed
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 27. New build or conversion. The Nitrogen
  Budget calculation listed under the same heading is recorded separately (no matching requirement id).
review-status: unverified
field-status: {}
