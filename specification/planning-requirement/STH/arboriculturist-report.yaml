reference: arboriculturist-report
local-authority: STH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Protected trees (with a Tree Preservation Order), including off-site trees whose
            canopy overhangs the site, to be lost or affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows to be lost or affected by the development and its construction.
      - all:
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Trees of amenity value that may be affected.
        - discretionary
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees proposed to be lost or affected by the development.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows to be lost or affected by the development and its construction.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: Required for all applications where protected trees – those with a Tree Preservation Order)
  or hedgerows are proposed to either be lost or affected by the development and its construction (including
  those off site trees where the canopy overhangs the site). ... Householder Development Required for
  all applications where trees or hedgerows are proposed to be lost or would be affected by the development
must-include:
- item: Tree survey following BS 5837 (2012), Trees in Relation to Design, Demolition and Construction
  level: should
confidence: medium
notes: 'From the council''s list (published September 2026), page 6-7, 29. The list calls it Tree Survey/Arboricultural
  Method Statement. Other trees of amenity value show as discretionary: the list says the council ''often''
  needs a survey for them.'
review-status: unverified
field-status: {}
