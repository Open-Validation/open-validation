reference: arboriculturist-report
local-authority: STH
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedgerows (including overhanging off-site canopies) are to be lost or would
        be affected.
  - site:
      in:
      - tree-preservation-zone
      description: Protected (TPO) trees would be affected.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: Required for all applications where trees or hedgerows are proposed to be lost or would be
  affected
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the workbook quoted only ''carry out a tree survey.'';
  it also applies to householder applications.'
review-status: unverified
field-status: {}
