reference: roof-plan-existing
local-authority: STH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings with a pitched roof form.
      - condition:
          field: roof-alteration
          value: true
          description: Extensions or alterations to existing roof forms.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: storey-count
          operator: '>='
          value: 2
          description: Extensions of 2 or more storeys.
      - condition:
          field: roof-alteration
          value: true
          description: All roof alterations.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: Required for all planning applications involving new buildings with pitched roof form and
  extensions/alterations to existing roof forms Householder Development Required for all planning applications
  involving 2 or more storey extensions, and all roof alterations
must-include:
- item: Scale 1:50 or 1:100
  level: must
- item: A scale bar, key dimensions and a north point
  level: must
- item: The shape of the roof, the materials and any vents, openings or additions such as solar panels
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 6, 26.
review-status: unverified
field-status: {}
