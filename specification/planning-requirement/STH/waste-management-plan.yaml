reference: waste-management-plan
local-authority: STH
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: Residential Design Guide Supplementary Planning Document (2006)
source-text: All planning applications. Applications should show where the bin storage will be situated
  on the proposed Block Plan, and elevational details of any storage and/or form of enclosure (which should
  be secure and lockable).
must-include:
- item: Where the bin storage will be, shown on the proposed block plan
  level: must
- item: Elevations of any bin storage and/or enclosure, which should be secure and lockable
  level: must
- item: A Refuse Management Plan explaining how refuse will be dealt with, with a plan of the proposed
    collection point, where the Residential Design Guide carry distances are not met or private collection
    is proposed
  level: must
  required-if: discretionary
  source-text: If the application doesn't meet the carry distances set out in the Council's approved 'Residential
    Design Guide' Supplementary Planning Document (2006), or are proposing some form of private collection,
    a 'Refuse Management Plan' should be provided
confidence: medium
notes: From the council's list (published September 2026), page 25. 'All planning applications' on the
  full, outline and reserved matters checklists; not on the householder checklists. The Refuse Management
  Plan shows as discretionary because it depends on whether the design guide's carry distances are met.
review-status: unverified
field-status: {}
