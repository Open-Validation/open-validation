reference: bng-metric
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development would be subject to the general biodiversity gain condition.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value(s) on the date of application or an earlier proposed date
  level: must
- item: The earlier date and the reasons for proposing it, where an earlier date is used
  level: must
  required-if: discretionary
- item: The completed metric calculation tool, including the publication date of the biodiversity metric
    used
  level: must
- item: A statement whether activities before that date lost onsite biodiversity value ('degradation')
    and, if so, the date, the earlier value, the completed metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 18-20. On the full and outline checklists.
  Where you think the biodiversity gain condition does not apply, you must give a statement saying why.
  The council also encourages (good practice, not a validation requirement) explaining how the 10% uplift
  will be provided.
review-status: unverified
field-status: {}
