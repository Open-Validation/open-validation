reference: transport-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 sq m or more non-residential/commercial floorspace.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy TR6
source-text: Needed for all developments proposing 50+ residential units and/or 1,000sq.m or more non-residential/commercial
  floorspace.
must-include:
- item: Following the Department for Transport's guidance
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 28. Best practice, not a validation requirement,
  for major residential schemes of 10-49 units; a Travel Plan with the TA is best practice. Transport
  Statements and car parking stress surveys (1-49 units) are best practice only, so they have no file.
review-status: unverified
field-status: {}
