reference: heritage-statement
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        - locally-listed-building
        - scheduled-monument
        - archaeological-priority-area
        description: Development works involving a heritage asset, such as a Listed Building, Conservation
          Area, Locally Listed Building or a site with archaeological interest.
    - discretionary
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy HE5
source-text: Required for all development works involving a heritage asset.
must-include:
- item: A description of the heritage asset and its setting
  level: should
- item: An assessment of its significance
  level: should
- item: An explanation of the design concept for the proposed development
  level: should
- item: A description of the impact of the proposed development
  level: should
- item: Photographs
  level: should
confidence: medium
notes: 'From the council''s list (published September 2026), page 5, 24. The list prints the policy as
  ''NPPF (20206) Policy HE5''. Heritage assets the council has identified beyond those listed (the list
  says ''such as'') show as discretionary. Archaeology: see archaeological-assessment.'
review-status: unverified
field-status: {}
