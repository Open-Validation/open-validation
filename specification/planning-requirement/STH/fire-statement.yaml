reference: fire-statement
local-authority: STH
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: Fire Statements must be submitted on a form published by the Secretary of State (or a form
  to a similar effect that contains the particulars specified or referred to in the Form)
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt omits the ''relevant building'' trigger (2+ dwellings or educational
  accommodation, 18m+ or 7+ storeys).'
review-status: unverified
field-status: {}
