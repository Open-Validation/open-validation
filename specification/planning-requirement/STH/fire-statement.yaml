reference: fire-statement
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings (including flats).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (as amended by the 2021 Order)
source-text: Relevant buildings contain two or more dwellings or educational accommodation, and meet the
  height of 18m or more, or 7 or more storeys.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for fire fighting
  level: must
- item: Any consultation on fire safety and how it has been taken into account
  level: must
- item: How fire safety policies in relevant local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 22.
review-status: unverified
field-status: {}
