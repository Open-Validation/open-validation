reference: town-centre-impact-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m or more of retail, leisure and/or office (Class E) floorspace.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside a defined City, Town, District or Local Centre.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy TC4
source-text: Required for applications of 2,500sq.m or more retail, leisure and/or office development
  (Class E) outside of a defined City, Town, District or Local Centre.
must-include:
- item: Impact on existing, committed and public investment in neighbouring centres within the catchment
  level: must
- item: Impact on the vitality and viability of nearby centres, including local consumer choice and trade
  level: must
- item: Likely impact up to 5 years from the date of application
  level: must
- item: Extended to 10 years for major schemes whose full impact will not be realised in 5 years
  level: must
  required-if:
    all:
    - ref: major-development
    - discretionary
  source-text: For those major schemes where the full impact will not be realised in 5 years, the assessment
    should be extended to 10 years from the date that the application is made.
confidence: medium
notes: From the council's list (published September 2026), page 26. The list calls it a Retail Impact
  Assessment (RIA).
review-status: unverified
field-status: {}
