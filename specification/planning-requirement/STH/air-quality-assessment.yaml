reference: air-quality-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: Inside or adjacent to a designated Air Quality Management Area (AQMA).
    - site:
        in:
        - site-of-special-scientific-interest
        - special-protection-area
        - special-area-of-conservation
        description: Inside or within 200m of any statutory designated nature conservation site.
    - condition:
        field: direct-air-emissions
        value: true
        description: An energy facility or industrial processes with direct emissions into the air.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: All MAJOR development applications (10+ dwellings/1,000sq.m non-residential). All development,
  excluding householder development, inside or adjacent to any designated Air Quality Management Area
  (AQMA) ... All development, excluding householder development, inside or within 200m of any statutory
  designated nature conservation site ... All development involving an energy facility or industrial processes
  where there are direct emissions into the air
confidence: medium
notes: From the council's list (published September 2026), page 20. Not on the householder checklists.
review-status: unverified
field-status: {}
