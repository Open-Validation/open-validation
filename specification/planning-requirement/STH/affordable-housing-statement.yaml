reference: affordable-housing-statement
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy DM5
source-text: For schemes that include 10 or more residential units, and that provide policy compliant
  levels of affordable housing (either on-site or as an off-site contribution) with information detailing
  the affordable housing offer set out in the Statement.
must-include:
- item: The affordable housing offer (on-site or as an off-site contribution)
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 20. Listed with Viability Assessments
  under one heading.
review-status: unverified
field-status: {}
