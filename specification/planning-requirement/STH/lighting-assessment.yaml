reference: lighting-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Lighting for sports facilities, Multi-Use Games Areas or golf driving ranges.
    - all:
      - condition:
          field: external-lighting
          value: true
          description: Large areas of lighting, such as illuminated advertising boards, security lighting,
            or car parking and pedestrian routes.
      - discretionary
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: 'Required for all proposals involving large areas of lighting including, but not limited
  to: Sports facilities; Multi-Use Games Areas; Illuminated advertising boards; Security lighting; Golf
  driving ranges; and Car parking and associated pedestrian routes'
confidence: medium
notes: From the council's list (published September 2026), page 25, 59. Other lighting shows as discretionary
  because 'large areas' is not defined. The advertisement-only checklist lists it as best practice, not
  a validation requirement.
review-status: unverified
field-status: {}
