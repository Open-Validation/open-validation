reference: flood-risk-assessment
local-authority: STH
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
must-include:
- item: Minimum flood details for householder extensions and outbuildings (finished floor levels, flood
    level, Environment Agency Flood Warning sign-up)
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the SuDS sentence. From the audit: all proposals in
  flood zones 2/3 and sites of 1ha+ in flood zone 1; householders give minimum flood details.'
review-status: unverified
field-status: {}
