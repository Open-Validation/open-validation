reference: telecommunications-report
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy CO2
source-text: Required for all telecommunications developments in accordance with details set out within
  Appendices E and F of the Code of Best Practice on Mobile Development in England (2013)
must-include:
- item: Site details
  level: must
- item: Pre-application checklist for site selection
  level: must
- item: Proposed development information
  level: must
- item: Technical justification
  level: must
- item: Site selection process information
  level: must
- item: ICNIRP certification
  level: must
- item: Site location plan at 1:2500
  level: must
- item: Site layout plan at 1:500
  level: must
- item: A clear differentiation between existing and proposed equipment
  level: must
- item: Elevations at a minimum of 1:100, including proposed colour
  level: must
- item: Roof plan at 1:100
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 28, 110. The prior notification checklist
  for telecommunications code operators lists it as best practice, not a validation requirement. Expected
  noise impacts are best practice too.
review-status: unverified
field-status: {}
