reference: noise-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential development likely to be affected by existing noise and/or activity.
    - all:
      - ref: major-development
      - condition:
          field: noise-generating-use
          value: true
          description: Likely to generate noise and/or activity.
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals including industrial and/or commercial development, recreational and sporting
          activity, late night activity, landfill waste disposal, or gym or leisure facilities within
          residential accommodation.
    - condition:
        field: plant-equipment
        value: true
        description: Air source heat pumps, or externally located plant on commercial premises (e.g. refrigeration,
          ventilation).
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: 'Required for: All residential development where it is likely to be affected by existing
  noise and/or activity; All MAJOR development applications (10+ dwellings/1,000sq.m non-residential)
  where it is likely to generate or be affected by existing noise and/or activity; Proposals to include
  road traffic, railway, aircraft, military aerodromes, helicopters/heliports, industrial and/or commercial
  development, recreational and sporting activity, late night activity and landfill waste disposal sites,
  gym or leisure facilities within residential accommodation, air source heat pumps, and externally located
  plant on commercial premises (e.g. refrigeration, ventilation etc)'
confidence: medium
notes: From the council's list (published September 2026), page 25. Not on the householder checklists,
  even for air source heat pumps.
review-status: unverified
field-status: {}
