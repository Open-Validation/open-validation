reference: sci
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 sq m of non-residential floorspace.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: Southampton City Council Statement of Community Involvement ('Involving You in Planning')
source-text: 'An SCI is formally required for all applications proposing: 50+ residential units 1,000sq.m
  of non residential floorspace'
confidence: medium
notes: From the council's list (published September 2026), page 26-27. Recommended as best practice (not
  a validation requirement) for other residential major development (10+ dwellings).
review-status: unverified
field-status: {}
