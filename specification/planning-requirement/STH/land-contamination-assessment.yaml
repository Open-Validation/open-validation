reference: land-contamination-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected to exist at the site.
      - condition:
          field: sensitive-end-use
          value: true
          description: A vulnerable use such as residential.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
      - condition:
          field: sensitive-end-use
          value: true
          description: To a more sensitive land use.
    - condition:
        field: ground-disturbance
        value: true
        description: Significant excavation is required, including piling.
    - site:
        in:
        - near-landfill-site
        description: Within 250m of a currently licensed or historic landfill site.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy P2
source-text: 'Required for: for all MAJOR development applications (10+ dwellings/1,000sq.m non-residential);
  and for all sites regardless of development size where contamination is known or suspected to exist
  at the site, and the application proposes a vulnerabe use such as residential; and any change of use
  to a more SENSITIVE land use; and any proposal where significant excavation is required; including piling
  work; and development proposals within 250m of a currently licensed or historic landfill site'
must-include:
- item: A 'Main Investigation' as described in BS10175 where the Preliminary Investigation recommends
    one
  level: must
  required-if: discretionary
  source-text: A 'Main Investigation' as described in BS10175:11 is required when recommended by the Preliminary
    Investigation due to the potential for land contamination to affect the proposed development.
- item: Not an environmental search (these are not accepted for validation)
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 21-22. The Main Investigation shows as
  discretionary because it depends on the Preliminary Investigation's findings.
review-status: unverified
field-status: {}
