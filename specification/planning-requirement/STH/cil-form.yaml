reference: cil-form
local-authority: STH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - cho-commercial-to-dwh
        - pa-extension
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m or more new floorspace in former Class A1-A5 (now part Class E), C3, C4
            and/or sui generis residential use.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings, of any size or by conversion/change of use.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Over 100 sq m of additional floorspace (gross internal area), including extensions,
          annexes and outbuildings.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: Required for development that proposes 100sq.m or more new floorspace in former Class A1-A5
  (now part Class E), C3, C4 and/or sui generis residential use and/or where development involves the
  creation of one or more new dwellings irrespective of size or as a result of a conversion/change of
  use. Also applicable to s.73 applications to vary an existing planning permission and prior approval.
  Householder Development Where the proposed development will add over 100sq.m of additional floorspace
  (measured as GROSS Internal Area) to the dwelling including extensions, annexes and outbuildings
confidence: medium
notes: From the council's list (published September 2026), page 4, 21, 103-106. The CIL Planning Application
  Additional Information Requirement Form. Also on the prior approval checklists for office/retail to
  dwellings and larger home extensions.
review-status: unverified
field-status: {}
