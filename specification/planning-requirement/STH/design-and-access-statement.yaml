reference: design-and-access-statement
local-authority: STH
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Any part of the development is within a designated area such as a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 sq m or more of floorspace.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: 'Design & Access Statement if it relates to an application for planning permission for either:
  (a) A MAJOR development as per the definition; or (b) Where any part of the development is within a
  designated area such as a Conservation Area and comprises: One or more dwellings; or The provision of
  a building or buildings where the floorspace created by the development is 100sq.m or more'
confidence: medium
notes: From the council's list (published September 2026), page 3, 18. The householder checklists ask
  for one only in a designated area where the floorspace created is 100 sq m or more.
review-status: unverified
field-status: {}
