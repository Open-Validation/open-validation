reference: location-plan
local-authority: STH
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - advertising
    - outline
    - reserved-matters
    - ldc
    - prior-approval
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: A plan which identifies the land to which the application relates drawn to an identified
  scale with the direction of North shown with the application site outlined
must-include:
- item: Drawn to an identified scale, with the direction of North
  level: must
- item: Application site edged clearly in red, including all land needed to carry out the development
    (for example access from a public highway, visibility splays, landscaping, car parking, refuse storage
    and open areas around buildings, including gardens)
  level: should
- item: Any other land owned by the applicant, close to or adjoining the site, outlined in blue
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 3, 18. Listed under national requirements
  on every checklist except variation of condition, non-material amendment and discharge of condition.
  For lawful development certificates and prior approvals to dwellings the plan must also show the proposed
  development.
review-status: unverified
field-status: {}
