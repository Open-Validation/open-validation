reference: section-existing
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels or is on an existing sloping site.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
source-text: In all cases where a proposal involves a change in ground levels or is on an existing sloping
  site
must-include:
- item: Existing and proposed works in relation to the finished site levels, including finished floor
    levels
  level: should
- item: A scale bar, key dimensions and a north point
  level: should
- item: Details of any additional means of enclosing the site
  level: should
confidence: medium
notes: From the council's list (published September 2026), page 6, 26. The list calls them Site Sections
  – Existing & Proposed, including finished floor and site levels.
review-status: unverified
field-status: {}
