reference: viability-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The affordable housing offer does not meet policy requirements, justified on viability
          grounds.
    - discretionary
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy DM5
source-text: For all applications that include 10 or more residential units where the proposal does not
  meet policy requirements or developer contributions, and this is being justified on viability grounds,
  a detailed Viability Assessment is required to be submitted with the planning application alongside
  the fee for an independent review.
must-include:
- item: Submitted with the fee for an independent review
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 20. A shortfall in other policy requirements
  or developer contributions argued on viability shows as discretionary. The assessment will be made public,
  and the applicant is expected to pay the costs of independent verification.
review-status: unverified
field-status: {}
