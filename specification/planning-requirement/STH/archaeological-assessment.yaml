reference: archaeological-assessment
local-authority: STH
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves ground disturbance.
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: A site identified as being of archaeological interest, particularly in Local Areas
            of Archaeological Potential 1-15.
      - discretionary
    - all:
      - ref: major-development
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.25
            description: Site over 0.25 hectares.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 0.25
            description: Site over 0.25 hectares.
    - discretionary
    - site:
        in:
        - scheduled-monument
        description: Works to scheduled monuments.
source-url: https://www.southampton.gov.uk/media/fgvnzbbg/1app-2026-170926.pdf
policy: NPPF (2026) policy HE5
source-text: 'In the following cases planning applications involving ground disturbance shall be submitted
  with a HS that include an appropriate archaeological desk-based assessment and, where necessary, a field
  evaluation: Development affecting any site identified as being of archaeological interest (during the
  pre-application) where ground disturbance is proposed, particularly in Local Areas of Archaeological
  Potential 1-15; Major development sites over 0.25 hectares in the rest of the city; Significant infrastructure
  works; and Works to scheduled monuments (which will also require separate Schedule Monument Consent)'
must-include:
- item: An archaeological desk-based assessment, as part of the Heritage Statement
  level: must
- item: A field evaluation, where necessary
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published September 2026), page 5, 24. Sites identified as of archaeological
  interest at pre-application stage and 'significant infrastructure works' show as discretionary.
review-status: unverified
field-status: {}
