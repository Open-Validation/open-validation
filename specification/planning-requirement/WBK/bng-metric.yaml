source-text: 'The Environment Act 2021 (legislation.gov.uk) sets a 10% Biodiversity Net Gain (BNG) as
  a minimum requirement in planning except for the following types of developments: permitted development
  under the Town and Country Planning (General Permitted Development) Order 2015 (as amended);'
