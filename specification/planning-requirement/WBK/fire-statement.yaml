reference: fire-statement
local-authority: WBK
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.westberks.gov.uk/media/35216/Local-List-of-Documents/pdf/Local_List_Doc_09.18.pdf?m=638041068525170000
source-text: Fire Statements A fire statement is required when the development proposed includes buildings
  that are 18 metres or more in height or for a building that contains 7 or more storeys used for 2 or
  more dwellings or educational accommodation.
