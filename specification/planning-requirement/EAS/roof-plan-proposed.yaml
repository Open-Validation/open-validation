reference: roof-plan-proposed
local-authority: EAS
required-if:
  any:
  - application-type:
      in:
      - full
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: The proposal impacts or alters a roof.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: YES where proposal impacts roof ... Depends on Matters Reserved ... Where any roof is being
  altered.
must-include:
- item: Scale 1:50 or 1:100
  level: must
  source-text: Roof plan. 1:50 or 1:100
- item: Accurately drawn to scale, consistent between existing and proposed, with a metric scale bar,
    the paper size it relates to and at least one dimension
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Accurately drawn to the chosen scale and consistency between the existing and proposed
    plans and must show a metric scale bar with paper size to which this relates and at least one dimension
- item: The shape of the roof, including any areas cut away or proposed to be used for balconies, and
    the location of rooflights
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: The shape of the roof, including any areas cut-away or proposed to be used for balconies;
    or to identify location of rooflights.
confidence: medium
notes: 'From the council''s list (published May 2018), sheet ''Full LVL'', row 7; Householder Validation
  Checklist (September 2015), page 3. Always required for full applications; for householder applications
  only where the proposal impacts the roof. ''Depends on Matters Reserved'' is shown as discretionary:
  it depends on which reserved matters are applied for, and we have no field for that.'
