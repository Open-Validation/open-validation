reference: site-plan
local-authority: EAS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - demolition-con-area
    - lbc
    - advertising
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: YES Should indicate proposal within the context of the whole site.
must-include:
- item: Scale 1:500
  level: must
  source-text: Block Plan. Scale 1:500
- item: Indicates the proposal within the context of the whole site
  level: should
- item: Scale 1:500, 1:200 or 1:100 with a metric scale bar
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: 1:500 / 1:200 / 1:100 (must show a metric scale bar)
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Dimensions and visibility splays of any new vehicular access
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-vehicle-access
        value: true
        description: A new vehicular access is proposed.
confidence: medium
notes: From the council's list (published May 2018), sheet 'Full LVL', row 4; Householder Validation Checklist
  (September 2015), page 2. The list calls it a 'Block Plan'; the householder checklist calls it 'Site
  Plan / Block Plan'.
review-status: unverified
field-status: {}
