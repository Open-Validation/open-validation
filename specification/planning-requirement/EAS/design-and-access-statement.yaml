reference: design-and-access-statement
local-authority: EAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - demolition-con-area
        - lbc
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m or more of floorspace created.
      - condition:
          field: dwelling-count
          operator: '>'
          value: 1
          description: More than 1 dwelling proposed.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Eastbourne Core Strategy Local Plan 2013 Policy D8; Eastbourne Borough Plan 2007 (saved policies)
  Policies UHT1 and UHT10
source-text: Yes if floorspace created is 100sqm or more or more than 1 dwelling proposed. ... If Design
  is not reserved ... Depends on Matters Reserved
confidence: medium
notes: 'From the council''s list (published May 2018), sheet ''Full LVL'', row 16. Not required for a
  plain householder application, but required (on the same thresholds) for a householder application with
  relevant demolition in a conservation area or with listed building consent. The list only covers listed
  building consent and relevant demolition in a conservation area together with a householder or full
  application; they are written as the lbc and demolition-con-area types. Outline: ''If Design is not
  reserved''; reserved matters: ''Depends on Matters Reserved''. Both are shown as discretionary because
  we have no field for which matters are reserved.'
review-status: unverified
field-status: {}
