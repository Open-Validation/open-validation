reference: section-existing
local-authority: EAS
required-if:
  all:
  - application-type:
      in:
      - hh
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The development and/or the plot is on a steep incline or decline.
    - condition:
        field: new-vehicle-access
        value: true
        description: A new vehicular access is proposed.
    - condition:
        field: basement
        value: true
        description: Development is proposed below ground level.
    - condition:
        field: roof-space-room
        value: true
        description: Development is proposed within roof slopes (sections show head height).
source-url: https://www.lewes-eastbourne.gov.uk/planning-application-process/validation-checklists
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where the development and/or your plot is on a steep incline/decline - Where a new vehicular
  access is proposed - Where any development is proposed below ground level - Where development is proposed
  within roof slopes to show head height
must-include:
- item: Scale 1:100, 1:50 or 1:20
  level: must
  source-text: 1:100, 1:50 or 1:20
- item: Accurately drawn to scale, consistent between existing and proposed, with a metric scale bar,
    the paper size it relates to and at least one dimension
  level: must
- item: Existing and proposed site levels and finished floor levels, related to a defined datum point
  level: must
  source-text: The existing and propose site levels, and finished floor levels, with levels related to
    a defined datum point
- item: A cross section of any new vehicular access with its dimensions and visibility splays
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new vehicular access is proposed.
  source-text: If proposing a new vehicular access please include a cross section with the dimensions
    and visibility splays of the new access shown
confidence: medium
notes: From the council's Householder Validation Checklist (Version 1.1, September 2015), page 3-4. Site
  sections are not in the Excel list; they come from the householder checklist only.
review-status: unverified
field-status: {}
