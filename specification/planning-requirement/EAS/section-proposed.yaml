reference: section-proposed
local-authority: EAS
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The development and/or the plot is on a steep incline or decline.
  - condition:
      field: new-vehicle-access
      value: true
      description: A new vehicular access is proposed.
  - condition:
      field: basement
      value: true
      description: Development is proposed below ground level.
  - condition:
      field: roof-alteration
      value: true
      description: Development is proposed within roof slopes (to show head height).
