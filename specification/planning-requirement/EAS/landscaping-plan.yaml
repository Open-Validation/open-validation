reference: landscaping-plan
local-authority: EAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - discretionary
      - condition:
          field: trees-on-or-near-site
          value: true
          description: The proposal affects trees.
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Eastbourne Borough Plan 2007 (saved policies) Policy UHT7
source-text: Yes if Major application ... If Landscaping not reserved ... If Landscaping Reserved and/or
  proposal affects trees
confidence: medium
notes: From the council's list (published May 2018), sheet 'Full LVL', row 25. The list calls it 'Landscaping
  details'. Outline ('If Landscaping not reserved') and reserved matters ('If Landscaping Reserved') are
  shown as discretionary because we have no field for which matters are reserved.
review-status: unverified
