reference: heritage-statement
local-authority: EAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - advertising
    - site:
        in:
        - listed-building
        - scheduled-monument
        - conservation-area
        - archaeological-priority-area
        description: The application involves a listed building or scheduled monument, or the site is
          in a conservation area or an Archaeological Notification Area.
  - application-type:
      in:
      - demolition-con-area
      - lbc
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Eastbourne Core Strategy Local Plan 2013 Policies D10 and D10A; Eastbourne Borough Plan 2007 (saved
  policies) Policy UHT17
source-text: Any application which involves a listed building, scheduled monument or falls within a conservation
  or an archaeological notification area will be required to submit a completed Heritage Statement form
  AND unless minor will also be required to submit a HER Consultation report ... YES as informed and supplemented
  by HER Statement as refered to below ... When within an ANA and ground being broken
must-include:
- item: A completed Heritage Statement form
  level: must
- item: An Assessment of Significance, informed and supplemented by the HER statement
  level: must
  required-if:
    application-type:
      in:
      - demolition-con-area
      - lbc
  source-text: YES as informed and supplemented by HER Statement as refered to below
- item: A HER (Historic Environment Record) Consultation report, unless the proposal is minor
  level: must
  required-if:
    any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: Site is in an Archaeological Notification Area.
      - condition:
          field: ground-disturbance
          value: true
          description: Ground is being broken.
    - discretionary
  source-text: unless minor will also be required to submit a HER Consultation report ... When within
    an ANA and ground being broken
confidence: medium
notes: 'From the council''s list (published May 2018), sheet ''Full LVL'', rows 12, 21, 22; Householder
  Validation Checklist (September 2015), page 4. Joins three rows of the list: Heritage Statement, Assessment
  of Significance (householder or full with relevant demolition in a conservation area, or with listed
  building consent) and HER Report (''When within an ANA and ground being broken''). ''Unless minor''
  is not defined, so the HER report is also shown as discretionary. The list only covers listed building
  consent and relevant demolition in a conservation area together with a householder or full application;
  they are written as the lbc and demolition-con-area types. The ''Full LVL'' matrix says NO for advertisement
  consent, but the ''Advertisement Consent'' sheet lists the Heritage Statement and HER Report, so advertisements
  are included. Not required for reserved matters. The householder checklist asks for a Heritage Statement
  ''where property is situated within an Archaeological Notification Area''.'
