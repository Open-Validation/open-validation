reference: heritage-statement
local-authority: EAS
required-if:
  site:
    in:
    - listed-building
    - scheduled-monument
    - conservation-area
    - archaeological-priority-area
    description: The application involves a listed building or scheduled monument, or the site is in a
      conservation area or an Archaeological Notification Area.
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Saved Policy UHT17 of the Borough Plan 2007
source-text: Any application which involves a listed building, scheduled monument or falls within a conservation
  or an archaeological notification area will be required to submit a completed Heritage Statement form
  AND unless minor will also be required to submit a HER Consultation report.
must-include:
- item: The completed Heritage Statement form
  level: must
- item: A HER (Historic Environment Record) Consultation report, unless the application is minor
  level: must
- item: An Assessment of Significance, informed and supplemented by the HER statement
  level: must
