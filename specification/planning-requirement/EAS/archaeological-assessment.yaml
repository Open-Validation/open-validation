reference: archaeological-assessment
local-authority: EAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: dwelling-count
        operator: '>'
        value: 5
        description: Over 5 dwellings are proposed.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - archaeological-priority-area
        description: Site is in an Archaeological Notification Area.
    - condition:
        field: ground-disturbance
        value: true
        description: The advertisement involves ground works.
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
source-text: If over 5 dwellings proposed, full archaeological assessment such as a desk based assessment
  or archaeological evaluation will be required. ... If includes ground works in an Archeological Notification
  Area
must-include:
- item: A full archaeological assessment, such as a desk-based assessment or an archaeological evaluation
  level: must
confidence: medium
notes: From the council's list (published May 2018), sheet 'Full LVL', row 11. The row links to the county
  map of Archaeological Notification Areas and says to contact county.archaeology@eastsussex.gov.uk to
  discuss if required, but the cell itself sets only the 'over 5 dwellings' trigger, so that is what we
  show. Householder columns read 'See Heritage Statement section'. Not required for reserved matters.
review-status: unverified
field-status: {}
