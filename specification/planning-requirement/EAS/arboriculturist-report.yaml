reference: arboriculturist-report
local-authority: EAS
required-if:
  all:
  - application-type:
      in:
      - hh
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: A protected tree (TPO) is affected by the proposal.
    - all:
      - site:
          in:
          - conservation-area
          description: The site is in a conservation area.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: A tree in the conservation area is affected by the proposal.
