reference: arboriculturist-report
local-authority: EAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on the site or on adjoining land.
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - discretionary
      - condition:
          field: trees-on-or-near-site
          value: true
          description: The proposal affects trees.
