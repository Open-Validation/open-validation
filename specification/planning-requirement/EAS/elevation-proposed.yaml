reference: elevation-proposed
local-authority: EAS
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - lbc
      - advertising
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.lewes-eastbourne.gov.uk/media/2934/Eastbourne-Validation-List/excel/Eastbourne_Validation_List.xlsx?m=638248564889130000
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevations. Scale 1:50 or 1:100 ... Depends on Matters Reserved ...
  YES and/or Schedule of Advertisements ... When new outbuildings are proposed, all elevations of the
  new outbuilding are required.
must-include:
- item: Scale 1:50 or 1:100
  level: must
- item: Accurately drawn to scale, consistent between existing and proposed, with a metric scale bar,
    the paper size it relates to and at least one dimension
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Accurately drawn to the chosen scale and consistency between the existing and proposed
    plans and must show a metric scale bar with paper size to which this relates and at least one dimension
- item: All elevations of any new outbuilding
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: outbuilding
        value: true
        description: A new outbuilding is proposed.
  source-text: When new outbuildings are proposed, all elevations of the new outbuilding are required.
confidence: medium
notes: 'From the council''s list (published May 2018), sheet ''Full LVL'', row 6; Householder Validation
  Checklist (September 2015), page 2-3. ''Depends on Matters Reserved'' is shown as discretionary: it
  depends on which reserved matters are applied for, and we have no field for that. For advertisement
  consent the list reads ''YES and/or Schedule of Advertisements'', so a schedule of advertisements may
  be given with or instead of elevations.'
