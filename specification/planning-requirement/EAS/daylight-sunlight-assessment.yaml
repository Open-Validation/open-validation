reference: daylight-sunlight-assessment
local-authority: EAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: storey-count
          operator: '>='
          value: 6
          description: 6 storeys.
      - condition:
          field: building-height
          operator: '>'
          value: 18
          description: More than 18 m high.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
