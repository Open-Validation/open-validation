reference: arboriculturist-report
local-authority: HAL
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on the site, or on adjacent land (including street trees), that could influence
      or be affected by the development.
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: Where there are trees within the application site, or on land adjacent to it that could influence
  or be affected by development (including street trees), information will be required detailing which
  trees are to be retained and on the means of protecting these trees during construction works. This
  information should be prepared by a qualified arboriculturist and accompany any planning application.
must-include:
- item: Which trees are to be retained
  level: must
- item: The means of protecting retained trees during construction works
  level: must
- item: Prepared by a qualified arboriculturist
  level: should
- item: Survey information, tree protection plan and method statement following the current BS5837 'Trees
    in relation to construction - Recommendations'
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.26 Tree Survey, page 12. Continues
  on page 13. The list dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO,
  the 1999 EIA Regulations, the Halton UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
