reference: arboriculturist-report
local-authority: HAL
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: There are trees within the site, or on land adjacent to it, that could influence or be
      affected by development (including street trees).
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: 3.26 Tree Survey Where there are trees within the application site, or on land adjacent to
  it that could influence or be affected by development (including street trees), information will be
  required detailing which trees are to be retained and on the means of protecting these trees during
  construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: The means of protecting the retained trees during construction works
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): not Full planning only; the trigger applies to any application, including
  householder.'
review-status: unverified
field-status: {}
