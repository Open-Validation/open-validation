reference: flood-risk-assessment
local-authority: HAL
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - all:
    - site:
        in:
        - critical-drainage-area
        description: In a designated critical drainage area.
    - discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Halton Unitary Development Plan policy PR16 Development and Flood Risk
source-text: A Flood Risk Assessment (FRA) will be required for development proposals of 1 hectare or
  more in Flood Zone 1 and for all proposals for new development located in Flood Zones 2 and 3 as designated
  by the Environment Agency. A FRA will also be required, in some instances for minor development, if
  it is in a designated critical drainage area.
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development
  level: should
- item: Shows how these flood risks will be managed, taking climate change into account
  level: should
- item: Identifies opportunities to reduce the probability and consequences of flooding
  level: should
- item: The design of Sustainable Drainage Systems (SUDS)
  level: should
- item: Safe access to and from development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.6, page 8. Must-include from page 9.
  Minor development in a critical drainage area is needed only 'in some instances', so that part shows
  as discretionary. The list dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995
  GDPO, the 1999 EIA Regulations, the Halton UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
