reference: floor-plan-proposed
local-authority: HAL
required-if:
  always: true
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008)
source-text: The following information is required to validate all applications. It should be noted that
  if any of these requirements are not included then the application is invalid. ... These should also
  be drawn to a scale of 1:50 or 1:100 and should explain the proposal in detail. Where existing buildings
  or walls are to be demolished these should be clearly shown. The drawings submitted should show details
  of the existing building(s) as well as those for the proposed development.
must-include:
- item: At a scale of 1:50 or 1:100, explaining the proposal in detail
  level: must
- item: New buildings shown in context with adjacent buildings (including property numbers where applicable)
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 2.4.4, page 4. The list puts this under
  '2.0 National Requirements', which it says are 'required to validate all applications'; it names no
  exceptions, so the file says always. The national rules on when this document is needed still apply.
  The list dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA
  Regulations, the Halton UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
