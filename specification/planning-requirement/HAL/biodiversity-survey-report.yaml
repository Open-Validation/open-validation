reference: biodiversity-survey-report
local-authority: HAL
required-if:
  any:
  - discretionary
  - condition:
      field: protected-species
      value: true
      description: The proposal may affect protected species (e.g. demolition of older buildings or roof
        spaces, removal of trees, scrub or hedgerows, or alterations to watercourses).
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: Where a proposed development may have possible impacts on wildlife and biodiversity, information
  should be provided on existing biodiversity interests and possible impacts on them to allow full consideration
  of those impacts. ... Certain proposals which might include work such as the demolition of older buildings
  or roof spaces, removal of trees, scrub, hedgerows or alterations to water courses may affect protected
  species and will need to provide information on them.
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: must
- item: Information supporting any mitigation and/or compensation measures proposed
  level: must
- item: Where appropriate, plans showing significant wildlife habitats or features and the location of
    habitats of protected species
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.3, page 7. Section continues on page
  8. 'May have possible impacts' has no clear test, so it shows as discretionary. The list also says applications
  in the countryside affecting areas designated for their biodiversity interests are likely to include
  assessments of impacts and long-term management proposals. The list dates from 2008 and cites guidance
  since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP); the council's
  website no longer publishes it.
review-status: unverified
field-status: {}
