reference: environmental-statement
local-authority: HAL
required-if:
  condition:
    field: eia-development
    value: true
    description: The development requires Environmental Impact Assessment.
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 1999
source-text: The Town and Country Planning (Environmental Impact Assessment) Regulations 1999 set out
  the circumstances in which an Environmental Impact Assessment is required. Where an EIA is required,
  Schedule 4 to the regulations sets out the information that should be included in the Environmental
  Statement.
must-include:
- item: The information set out in Schedule 4 to the EIA Regulations
  level: must
confidence: medium
notes: 'From the council''s list (adopted 18 August 2008), section 3.5, page 8. The list adds: ''If an
  Environmental Impact Assessment is not required, we may still require environmental information to be
  provided.'' The 1999 Regulations have been replaced by the 2017 Regulations. The list dates from 2008
  and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton
  UDP); the council''s website no longer publishes it.'
