reference: transport-assessment
local-authority: HAL
required-if: discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: Planning Policy Guidance 13 Transport advises that a Transport Assessment (TA) should be
  submitted as part of any planning application where the proposed development has significant transport
  implications.
must-include:
- item: Coverage and detail reflecting the scale of the development and the extent of its transport implications
  level: should
- item: 'For major proposals: accessibility to the site by all modes of transport and the likely modal
    split of journeys to and from the site'
  level: should
  required-if:
    ref: major-development
- item: Proposed measures to improve access by public transport, walking and cycling, to reduce the need
    for parking and to mitigate transport impacts
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.24, page 12. 'Significant transport
  implications' has no threshold, so discretionary. PPG13 was replaced by the NPPF. The list dates from
  2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the
  Halton UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
