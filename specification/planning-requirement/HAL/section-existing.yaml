reference: section-existing
local-authority: HAL
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: new-build
      value: true
      description: The proposal involves new buildings.
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008)
source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings should
  be submitted to show both existing and finished floor levels to include details of foundations and eaves
  and how encroachment onto adjoining land is to be avoided. ... Such plans should show existing site
  levels and finished floor levels (with levels related to a fixed datum point off site) and also show
  the proposals in relation to adjoining buildings. This will be required for all applications involving
  new buildings.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Existing site levels, related to a fixed datum point off site
  level: must
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 2.4.5, page 4. For householder development
  the list says levels may be evident from floor plans and elevations, but on sloping sites or where ground
  levels outside the extension would change it will be necessary to show how proposals relate to existing
  ground levels. The list dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO,
  the 1999 EIA Regulations, the Halton UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
