reference: air-quality-assessment
local-authority: HAL
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Inside or adjacent to an Air Quality Management Area.
  - discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Halton Unitary Development Plan policy PR1 Air Quality
source-text: Where the development is proposed inside, or adjacent to an air quality management area (AQMA)
  or where the development could in itself result in the designation of an AQMA or where the grant of
  planning permission would conflict with, or render unworkable, elements of a local authority’s air quality
  action plan, applications should be supported by such information as is necessary to allow full consideration
  of the impact of the proposal. Where Air Quality Management Areas cover regeneration areas developers
  should provide an air quality assessment as part of their planning application.
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.1, page 7. Development that could itself
  lead to an AQMA being designated, or that would conflict with the air quality action plan, has no clear
  test, so that part shows as discretionary. The list dates from 2008 and cites guidance since replaced
  (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP); the council's website no longer
  publishes it.
