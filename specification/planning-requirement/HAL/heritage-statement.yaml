confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.9, page 9. Every case says the statement
  'may be required', so it shows as discretionary within these application types and places. The list
  also says a structural survey may be required for listed building consent. Conservation area consent
  was abolished in 2013 (now planning permission for relevant demolition in a conservation area). The
  list dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations,
  the Halton UDP); the council's website no longer publishes it.
