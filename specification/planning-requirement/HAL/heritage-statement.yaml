reference: heritage-statement
local-authority: HAL
required-if:
  all:
  - any:
    - application-type:
        in:
        - lbc
        - demolition-con-area
    - site:
        in:
        - conservation-area
        description: Within or adjacent to a conservation area.
  - discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: For applications for listed building consent a written statement, that includes a schedule
  of ... works to the listed building(s), an analysis of the significance of archaeology, history and
  character of the building/structure, the principles of and justification for the proposed works and
  their impact on the special character of the listed building or structure, its setting and the setting
  of adjacent listed buildings may be required. ... For applications for conservation area consent a written
  statement that includes a structural survey, an analysis of the character and appearance of the building/structure,
  the principles of and justification for the proposed demolition and its impact on the special character
  of the area may be required. For applications within or adjacent to a conservation area, an assessment
  of the impact of the development on the character and appearance of the area may be required.
