    refers only to ''the validation checklist for each form'' on the Planning Portal, the site search
    for ''validation'', ''checklist'' and ''local list'' found no other list, the moderngov document search
    found no later validation report, and planning.data.gov.uk entity 20296 points to this same appendix.
    Pages 2-7, 12 and 14 of the PDF have no text layer (outlined text). More than two years old, so outdated.'
