reference: land-contamination-assessment
local-authority: HAL
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on the site.
  - discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Halton Unitary Development Plan policy PR14 Contaminated Land
source-text: Applications may be required to be accompanied by a report that has assessed the contamination
  on the site. ... Where contamination is known or suspected then the information should be provided with
  the application to determine whether the application can proceed.
must-include:
- item: Possible remediation measures
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.19 Site Investigations (Contaminated
  Land Report), page 11. Otherwise 'may be required', so discretionary. The list dates from 2008 and cites
  guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP); the
  council's website no longer publishes it.
review-status: unverified
field-status: {}
