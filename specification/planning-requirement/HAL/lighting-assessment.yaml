reference: lighting-assessment
local-authority: HAL
required-if:
  condition:
    field: external-lighting
    value: true
    description: External lighting would be provided or made necessary by a publicly accessible development
      in the vicinity of residential property, a listed building or conservation area, or open countryside.
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: 3.11 Lighting Assessment Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a listed building or conservation area, or open countryside,
  where external lighting would be provided or made necessary by the development, should be required to
  be accompanied by details of external lighting and the proposed hours when the lighting would be switched
  on.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): not listed building consent. The ''publicly accessible development near
  homes, heritage assets or countryside'' part can''t be expressed as a field and is in the description.'
review-status: unverified
field-status: {}
