reference: lighting-assessment
local-authority: HAL
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or conservation area, or open countryside, where external lighting
  would be provided or made necessary by the development, should be required to be accompanied by details
  of external lighting and the proposed hours when the lighting would be switched on. These details shall
  include a layout plan with beam orientation and a schedule of the equipment in the design.
must-include:
- item: Details of external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.11, page 9. The list limits this to
  publicly accessible developments 'in the vicinity of' residential property, a listed building, a conservation
  area or open countryside; 'in the vicinity' has no distance, so that part shows as discretionary. The
  list dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations,
  the Halton UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
