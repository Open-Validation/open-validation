reference: design-and-access-statement
local-authority: HAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a material change of use of land and buildings (unless it also involves operational
          development).
    - condition:
        field: engineering-operations
        value: false
        description: Not engineering or mining operations.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - national-park
        - site-of-special-scientific-interest
        - conservation-area
        - area-of-outstanding-natural-beauty
        - world-heritage-site
        description: Any part of the dwellinghouse or its curtilage is in a National Park, SSSI, conservation
          area, AONB, World Heritage Site or the Broads.
  - application-type:
      in:
      - lbc
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008) article
  4C; Planning (Listed Buildings and Conservation Areas) Regulations 1990, regulation 3A
source-text: 'A Design and Access Statement must accompany applications for both outline and full planning
  permission unless they relate to one of the following: A material change of use of land and buildings,
  (unless it also involves operational development); Engineering or mining operations; Householder developments.
  However, statements are required for householder applications where any part of a dwelling house or
  its curtilage falls within one of the following designated areas: National Park Site of special scientific
  interest Conservation area Area of outstanding natural beauty World Heritage Site The Broads ... Applications
  for listed building consent will also be required to be accompanied by a Design and Access Statement.'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: How issues relating to access to the development have been dealt with
  level: must
- item: Levels taken into account
  level: should
- item: The special architectural or historic interest of the building
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The particular physical features of the building that justify its designation as a listed building
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The building's setting
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (adopted 18 August 2008), section 2.6, page 5. Levels: section 2.4.5,
  page 4. The rule is the 2008 national rule; since 2013 the national requirement (DMPO 2015 article 9)
  is narrower (major development, and in designated areas one or more dwellings or 100 sq m or more),
  so most of this rule no longer applies in law. The list dates from 2008 and cites guidance since replaced
  (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP); the council''s website no
  longer publishes it.'
review-status: unverified
field-status: {}
