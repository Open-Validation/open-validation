reference: noise-assessment
local-authority: HAL
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development raises issues of disturbance by noise to the occupants of nearby existing
        buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development is noise sensitive and close to existing sources of noise.
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: Applications for developments that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and for developments that are considered to be noise sensitive and which
  are close to existing sources of noise should be supported by a noise assessment prepared by a suitably
  qualified acoustician.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.12, page 9. The list dates from 2008
  and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton
  UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
