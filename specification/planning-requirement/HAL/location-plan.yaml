reference: location-plan
local-authority: HAL
required-if:
  always: true
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008)
source-text: All applications must include copies of a location plan based on an up to date map, on a
  scale of 1:1250 or 1:2500.
must-include:
- item: Based on an up to date map at a scale of 1:1250 or 1:2500 (other scales accepted in exceptional
    circumstances, e.g. if the site covers a wider area)
  level: must
- item: Exact location of the site clear, with names of roads/properties where applicable
  level: should
- item: Application site clearly marked with a red line (no other colour accepted), including all land
    needed to carry out the development, e.g. access from a public highway, car parking, open areas around
    buildings and visibility splays
  level: must
- item: Any other land owned by the applicant that adjoins or is close to the site outlined in blue
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 2.2, page 3. The list dates from 2008
  and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton
  UDP); the council's website no longer publishes it.
review-status: unverified
field-status: {}
