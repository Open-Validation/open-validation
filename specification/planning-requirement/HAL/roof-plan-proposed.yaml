reference: roof-plan-proposed
local-authority: HAL
required-if: discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008)
source-text: A roof plan is used to show the shape of the roof and should be drawn at a scale smaller
  than the scale used for the floor plans (e.g. 1:50 or 1:100). Details such as the roofing material and
  their location are typically specified on the roof plan.
must-include:
- item: The shape of the roof
  level: must
- item: Roofing materials and their location
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 2.4.6, page 4. The list describes a roof
  plan but does not say when one is needed, so it shows as discretionary. The list dates from 2008 and
  cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP);
  the council's website no longer publishes it.
