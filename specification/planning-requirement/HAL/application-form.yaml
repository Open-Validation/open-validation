reference: application-form
local-authority: HAL
required-if:
  always: true
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008)
source-text: The following information is required to validate all applications. It should be noted that
  if any of these requirements are not included then the application is invalid. ... There will be a new
  application form from 6 April 2008, which is known as 1APP. This will mean one application form will
  be made available electronically, which will be used for all applications. The application form has
  to be completed in its entirety.
must-include:
- item: Completed in its entirety
  level: must
- item: The appropriate certificate of ownership (A, B, C or D) completed
  level: must
- item: Notice to owners of the application site completed and served (Article 6 of the GDPO)
  level: must
- item: Agricultural holdings certificate completed (whether or not the site includes an agricultural
    holding)
  level: must
confidence: medium
notes: 'From the council''s list (adopted 18 August 2008), section 2.1, page 3. Ownership certificate,
  notice to owners and agricultural holdings certificate: sections 2.5 to 2.5.2, pages 4-5; the list says
  the agricultural holdings certificate is not required for reserved matters, renewal of temporary permission,
  discharge or variation of condition, tree preservation order or advertisement applications. The list
  dates from 2008 and cites guidance since replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations,
  the Halton UDP); the council''s website no longer publishes it.'
