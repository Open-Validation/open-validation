reference: planning-statement
local-authority: HAL
required-if: discretionary
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
source-text: A planning statement identifies the context and need for a proposed development and includes
  an assessment of how the proposed development accords with relevant national, regional and local planning
  policies. It may also include details of consultations with the local planning authority, the community,
  statutory consultees that were undertaken prior to submitting an application.
must-include:
- item: The context and need for the proposed development
  level: must
- item: An assessment of how the development accords with relevant national, regional and local planning
    policies
  level: must
- item: Details of pre-application consultations with the local planning authority, the community and
    statutory consultees
  level: should
confidence: medium
notes: From the council's list (adopted 18 August 2008), section 3.15, page 11. The list does not say
  when a planning statement is needed, so discretionary. The list dates from 2008 and cites guidance since
  replaced (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP); the council's website
  no longer publishes it.
review-status: unverified
