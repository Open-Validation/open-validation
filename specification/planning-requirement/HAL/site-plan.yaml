reference: site-plan
local-authority: HAL
required-if:
  always: true
source-url: https://moderngov.halton.gov.uk/documents/s6473/Appendix%20a.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as amended 2008)
source-text: 'The following information is required to validate all applications. It should be noted that
  if any of these requirements are not included then the application is invalid. ... Three copies, plus
  the original, of the site plan are required, unless submitted electronically. The site plan should be
  accurate and provided at 1:500 or 1:200 scale and should show the following:'
must-include:
- item: Accurate, at a scale of 1:500 or 1:200
  level: must
- item: The direction North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All the buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way (footpath, bridleway, restricted byway or byway open to all traffic)
  level: must
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: Boundary treatment including walls or fencing where this is proposed
  level: must
- item: 'Block plan information: site boundaries, the type and height of boundary treatment (walls, fences
    etc) and the position of any building or structure on the other side of those boundaries; if shown
    on one plan with the site plan (at 1:200), the plan states it is for both'
  level: must
confidence: medium
notes: 'From the council''s list (adopted 18 August 2008), section 2.4.1, page 3. Block plan: section
  2.4.2, page 4. The list puts this under ''2.0 National Requirements'', which it says are ''required
  to validate all applications''; it names no exceptions, so the file says always. The national rules
  on when this document is needed still apply. The list dates from 2008 and cites guidance since replaced
  (PPS/PPG notes, the 1995 GDPO, the 1999 EIA Regulations, the Halton UDP); the council''s website no
  longer publishes it.'
review-status: unverified
field-status: {}
