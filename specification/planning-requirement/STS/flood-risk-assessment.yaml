reference: flood-risk-assessment
local-authority: STS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zone 2 or 3.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more in Flood Zone 1.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more in Flood Zone 1.
source-url: https://www.staffordshire.gov.uk/sites/default/files/2026-03/A-to-Z-Planning-Guide-Latest-update-17-July-2017.pdf
confidence: medium
notes: 'From the audit (missing_requirement): FRA for 1ha+ in Flood Zone 1 and new development in Flood
  Zones 2/3. The SuDS drainage strategy for all major development is unmapped.'
review-status: unverified
field-status: {}
