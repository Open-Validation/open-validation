reference: biodiversity-survey-report
local-authority: STS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
      - pa-demo-building
  - any:
    - condition:
        field: protected-species
        value: true
        description: Possible impact on protected species.
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
    - condition:
        field: roof-alteration
        value: true
        description: The proposal involves roof works.
    - condition:
        field: loss-of-habitat-features
        value: true
        description: The proposal involves tree or hedge removal.
    - discretionary
source-url: https://www.staffordshire.gov.uk/sites/default/files/2026-03/A-to-Z-Planning-Guide-Latest-update-17-July-2017.pdf
confidence: medium
notes: 'From the audit (missing_requirement): Biodiversity/Geodiversity Survey and Report where there
  is a possible impact on biodiversity/geodiversity (officer discretion) or protected species, including
  demolition, roof works and tree/hedge removal. Also on Checklist 3 (demolition prior notification).'
review-status: unverified
field-status: {}
