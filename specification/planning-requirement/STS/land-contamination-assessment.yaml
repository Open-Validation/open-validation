reference: land-contamination-assessment
local-authority: STS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - contaminated-land
        - coal-mining-high-risk-area
        description: Contamination or instability is known or suspected, or the site is in a Coal Authority
          high-risk area.
    - condition:
        field: sensitive-end-use
        value: true
        description: A vulnerable use.
source-url: https://www.staffordshire.gov.uk/sites/default/files/2026-03/A-to-Z-Planning-Guide-Latest-update-17-July-2017.pdf
confidence: medium
notes: 'From the audit (missing_requirement): Land Contamination and Land/Slope Stability, including a
  Coal Mining Risk Assessment.'
review-status: unverified
field-status: {}
