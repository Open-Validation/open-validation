submission-standards:
- item: All applications require scale bars; plans required as a national requirement or under Part A
    produced to a recognised scale with a scale bar
  level: must
- item: Drawings accurately titled, with drawing numbers (and, where relevant, a revision number identifying
    the change and date), a scale and scale bars
  level: should
- item: Plans to be determined must not be labelled preliminary, illustrative, draft, for information
    only or do not scale (unless 'do not scale' is followed by 'for planning purposes only')
  level: should
- item: The direction of north shown on plans
  level: must
- item: Plans and documents not submitted in booklet form
  level: must
- item: Preferred plan size A1
  level: should
- item: 'File types: plans and documents .pdf; photographs .jpg, .jpeg, .tif, .tiff or .pdf'
  level: must
- item: Individual files no larger than 10 MB
  level: should
