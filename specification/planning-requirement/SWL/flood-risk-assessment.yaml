reference: flood-risk-assessment
local-authority: SWL
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2, 3 or 3b.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area or an area of increased future flood risk in
        the SFRA.
source-url: https://swale.gov.uk/planning-and-regeneration/planning-permission/validation-checklist/local-requirements
source-text: A Flood Risk Assessment (FRA) will be required for development proposals of 1 hectare or
  greater in Flood Zone 1 and for all proposals for new development located in Flood Zones 2 and 3 as
  designated by the Environment Agency.
must-include:
- item: A sequential assessment, for relevant development in flood zones 2 and 3
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3.
  source-text: A Sequential Assessment (to allow the LPA to do a sequential test) should be provided for
    relevant development (as defined in the NPPF and NPPG on flooding in Flood Zones 2 and 3).
- item: An exception test, if required
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook omitted the critical drainage area and SFRA increased-risk
  triggers of the current A5 (also householder).'
review-status: unverified
field-status: {}
