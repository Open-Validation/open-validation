reference: transport-assessment
local-authority: SWL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres or more of floorspace.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.25
      description: A site of 0.25 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 0.25
      description: A site of 0.25 hectares or more.
source-url: https://swale.gov.uk/planning-and-regeneration/planning-permission/validation-checklist/local-requirements
must-include:
- item: A full Transport Assessment (rather than a Transport Statement)
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 40
        description: 40 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 2500
        description: 2,500 square metres or more gross floorspace.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted NPPF glossary text. From the audit: Transport Assessment
  for 40+ dwellings or 2,500 sqm+; Transport Statement for 10-39 dwellings, 1,000-2,499 sqm or 0.25 ha+
  (B8/B9).'
review-status: unverified
field-status: {}
