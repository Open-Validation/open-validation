reference: affordable-housing-statement
local-authority: HIN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 dwellings or more (urban areas of Hinckley, Burbage, Barwell and Earl Shilton).
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more dwellings.
    - site:
        in:
        - rural-area
        description: In the rural areas.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Core Strategy Policy 15
source-text: If your proposal is for 15 dwellings or more within the urban areas or Hinckley, Burbage,
  Barwell and Earl Shilton. ... Planning practice guidance states that affordable housing cannot be sought
  upon developments of 10 or less and therefore affordable housing is required if you are developing 11
  or more dwellings within the rural areas.
must-include:
- item: The mix of private and affordable units, with numbers of bedrooms, the floor space of habitable
    areas and how many people each property can house
  level: must
- item: A clear and full explanation of any different levels or types of affordability or tenure for different
    units
  level: must
- item: The location of the affordable units, and their habitable rooms and/or bedrooms and/or floor space,
    shown on the floor plans
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 15, item 5a.
review-status: unverified
field-status: {}
