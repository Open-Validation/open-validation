reference: schedule-of-works
local-authority: HIN
required-if:
  all:
  - site:
      in:
      - listed-building
      description: The site is or contains a listed building.
  - any:
    - condition:
        field: structural-alteration
        value: true
        description: Structural alterations.
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM11, DM12, DM13; Heritage Statement
  Guidance
source-text: Structural alterations to a listed building or demolition of a listed building
must-include:
- item: 'Where any part of the building is removed (including ceilings, partitions, fixtures and fittings):
    the location, extent and character of the items on the existing elevations, plans and sections, cross
    referenced to the schedule of works'
  level: must
- item: 'Where major repair works are proposed: a supplementary schedule of works and method statement
    explaining the principle of the proposal'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2019), page 21, item 7f. The repair works item shows
  as 'check' because 'major' is not defined.
review-status: unverified
field-status: {}
