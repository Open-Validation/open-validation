reference: design-and-access-statement
local-authority: HIN
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: 'In a designated area: a world heritage site or a conservation area.'
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9
source-text: Applications for major development ... Applications for development in a designated area*,
  where the proposed development consists of o One or more dwellings; or o A building or buildings with
  a floor space of 100 square metres or more ... Applications for listed building consent ... *For the
  purposes of design and access statements, a designated area means a world heritage site or a ... conservation
  area.
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development, and how the design takes that context
    into account
  level: must
- item: The applicant's approach to access and how relevant local plan policies have been taken into account
  level: must
- item: Any consultation on access issues, and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access have been addressed
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 3, item 1e.
review-status: unverified
field-status: {}
