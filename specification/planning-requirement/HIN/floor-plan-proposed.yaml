reference: floor-plan-proposed
local-authority: HIN
required-if:
  always: true
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12, DM18, DM23;
  Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Existing and proposed floor plans ... All applications
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For roof terraces: the nearest windows on the immediately adjoining properties'
  level: must
  required-if:
    condition:
      field: raised-platform
      value: true
      description: The proposal includes a roof terrace.
- item: 'For shop fronts: if the proposal affects access to the upper floors in any way, ground floor
    plans showing separate access to upper floors'
  level: must
  required-if:
    all:
    - condition:
        field: shopfront
        value: true
        description: The proposal is for a new or altered shopfront.
    - discretionary
- item: 'For plant, flues, ventilation, extraction or air conditioning: equipment, ducting and acoustic
    enclosures or screening, and the location of neighbouring windows cross referenced to the acoustic
    report'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
confidence: medium
notes: From the council's list (published January 2019), page 5, 6, 8, 11 and 12, item 2b, 2d, 3b, 4a,
  4b and 4f. Required for all applications. The shop front upper-floor access item shows as 'check' because
  it depends on whether access to the upper floors is affected.
review-status: unverified
field-status: {}
