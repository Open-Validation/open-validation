reference: roof-plan-existing
local-authority: HIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
      - s73
  - condition:
      field: roof-alteration
      value: true
      description: Roof extension or dormer windows, or other change to the roof.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12; Town and Country
  Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Existing and proposed roof plans ... All applications involving alterations to the roof layout
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 9, item 3e. In the section for applications
  other than householder; the householder section has no roof plan requirement.
review-status: unverified
field-status: {}
