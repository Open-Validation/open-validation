reference: floor-plan-existing
local-authority: HIN
required-if:
  always: true
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12; Town and Country
  Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Existing and proposed floor plans ... All applications
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For demolition of a listed building: the location and extent of demolition shown by labelling
    or hatching'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
confidence: medium
notes: 'From the council''s list (published January 2019), page 5 and 8, item 2b and 3b. Required for
  all applications: the householder section says ''All applications'' and the other section ''All applications
  including change of use''.'
review-status: unverified
field-status: {}
