reference: biodiversity-survey-report
local-authority: HIN
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Likely to affect protected species or species of principal importance.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - local-wildlife-site
      - priority-habitat
      description: Likely to affect designated sites or priority habitats.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM6
source-text: Where a proposed development is likely to affect species protected under the Wildlife and
  Countryside Act 1981 (as amended), the Conservation of Habitats and Species Regulations 2010 , the Protection
  of Badgers Act 1992, and / or species of principal importance listed under Section 41 of the Natural
  Environment and Rural Communities Act 2006 the applicant should ... submit an up to date protected species
  survey and assessment where a proposed development is likely to affect designated sites and priority
  habitats, the applicant must submit an Ecological/Geologic al survey and assessment.
must-include:
- item: Undertaken by competent persons with suitable qualifications and experience, at an appropriate
    time of year, in suitable weather, using nationally recognised survey methods
  level: must
- item: Which species are present, and their numbers (may be approximate)
  level: must
- item: Their distribution and use of the area, site, structure or feature (for example feeding, shelter
    and breeding)
  level: must
- item: The potential impacts likely to harm the protected species or their habitats, direct and indirect,
    during construction and afterwards
  level: must
- item: 'Where harm is likely: alternatives considered, how adverse effects will be avoided, mitigated
    or compensated, how species numbers are likely to change, and how habitats will be enhanced, restored
    or added to'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2019), page 30-31, item 8r. The list names no particular
  designated sites, so the usual ecological designations are used.
review-status: unverified
field-status: {}
