reference: noise-assessment
local-authority: HIN
required-if:
  any:
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: The proposed use is in the vicinity of an existing noise source.
    - discretionary
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal could generate noise (including vibration).
    - discretionary
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10
source-text: 'If your proposal is in the vicinity of an existing noise source and that noise source has
  the potential to impact on the use proposed or If your proposal has the potential to generate noise
  and that noise has the potential to impact on existing noise sensitive uses Note: Noise includes vibration.'
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: Mitigation measures, if required to meet current noise guidelines
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 26, item 8h. Shown as 'check' alongside
  each trigger because the list depends on whether the noise 'has the potential to impact'.
review-status: unverified
field-status: {}
