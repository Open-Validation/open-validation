reference: section-existing
local-authority: HIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - s73
    - any:
      - condition:
          field: building-works
          value: true
          description: The proposal involves building work.
      - condition:
          field: external-alterations
          value: true
          description: The proposal involves alterations to buildings.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: Roof extension or dormer windows, or other change to the roof.
  - condition:
      field: shopfront
      value: true
      description: The proposal is for a new or altered shopfront.
  - condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
  - application-type:
      in:
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: structural-alteration
        value: true
        description: Structural alterations.
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12, DM23; Town
  and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: 'Existing and proposed sections ... All applications involving building work, alterations
  to buildings or display of advertisements ... For roof extensions and dormers: ... Submit existing and
  proposed sections through the roof'
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
confidence: medium
notes: From the council's list (published January 2019), page 6, 9, 11, 12, item 2d, 3d, 4a-4f. Other
  (non-householder) applications (3d) need them for building work, alterations and advertisements; householder
  applications only for roof extensions and dormers (2d). Shop fronts (4a), plant (4b), advertisements
  (4c), listed building consent with floors, ceilings or staircases altered (4e) and lawful development
  certificates for proposed works (4f) also ask for sections. For non-material amendments the list asks
  for drawings 'where necessary', so that part shows as 'check'.
review-status: unverified
field-status: {}
