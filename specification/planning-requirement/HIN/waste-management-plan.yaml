reference: waste-management-plan
local-authority: HIN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (new dwellings).
  - ref: major-development
  - condition:
      field: food-or-drink-use
      value: true
      description: Development for A3, A4 or A5 uses (restaurants and cafes, drinking establishments,
        hot food takeaways).
  - condition:
      field: waste-storage-facilities
      value: true
      description: New development needing new storage or recycling facilities.
  - discretionary
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10
source-text: All residential development and other applications that will have an impact on the generation
  of waste, including major applications and development for A3, A4 and A5 uses. ... All new development
  which would result in the need for new or storage or recycling facilities
must-include:
- item: A scaled plan showing the location of bin stores
  level: must
- item: Details of the materials, design and type of enclosure
  level: must
- item: Elevations of the enclosure with dimensions
  level: must
  required-if:
    condition:
      field: waste-storage-facilities
      value: true
      description: New storage or recycling facilities.
confidence: medium
notes: From the council's list (published January 2019), page 10 and 28, item 3i and 8m. The list calls
  it a 'site waste management plan' (8m) and also asks for a bin stores/recycling facilities plan (3i).
  'Other applications that will have an impact on the generation of waste' shows as 'check'. 'Residential
  development' is read as development that creates dwellings.
review-status: unverified
field-status: {}
