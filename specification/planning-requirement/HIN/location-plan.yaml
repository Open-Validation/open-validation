reference: location-plan
local-authority: HIN
required-if:
  always: true
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Site location plan ... All ... A site location plan at a scale of either 1:1250 or 1:2500
  which identifies the site and the surrounding area and shows at least two roads and the north point.
must-include:
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: Identifies the site and the surrounding area, with at least two roads and the north point
  level: must
- item: Site outlined in red, including all land needed to carry out the development (for example access
    from a public highway, visibility splays, car parking and open areas around buildings)
  level: must
- item: Any other land owned by the applicant outlined in blue
  level: must
- item: Ordnance Survey based plans purchased for this purpose or used under licence; not copies of plans
    made for other purposes, such as title deeds
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 2-3, item 1d.
review-status: unverified
field-status: {}
