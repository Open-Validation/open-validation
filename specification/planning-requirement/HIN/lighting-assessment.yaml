reference: lighting-assessment
local-authority: HIN
required-if:
  any:
  - discretionary
  - all:
    - any:
      - condition:
          field: external-lighting
          value: true
          description: External lighting.
      - condition:
          field: floodlighting
          value: true
          description: Floodlighting.
    - discretionary
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM7
source-text: If your proposal is in the vicinity of an existing light source and that light source has
  the potential to impact on the use proposed or If your proposal involves the installation of floodlighting
  or other ... external lighting and that lighting has the potential to impact on existing light sensitive
  uses
must-include:
- item: Hours of operation
  level: must
- item: Light spillage and light levels
  level: must
- item: Column heights
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Equipment design
  level: must
- item: Mitigation measures, if required to meet current light guidelines
  level: must
confidence: medium
notes: 'From the council''s list (published January 2019), page 25, item 8g. Shown as ''check'': both
  triggers depend on whether the light ''has the potential to impact'', which the list leaves to judgement
  (contact Environmental Health).'
review-status: unverified
field-status: {}
