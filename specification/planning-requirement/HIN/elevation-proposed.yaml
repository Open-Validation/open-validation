reference: elevation-proposed
local-authority: HIN
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building work.
  - condition:
      field: external-alterations
      value: true
      description: The proposal involves alterations to buildings.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12, DM23; Town
  and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Existing and proposed elevations ... All applications involving building work, alterations
  to buildings or display of advertisements
must-include:
- item: Drawn at the scale the list gives ('a minimum scale of 1:500, or 1:100')
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: must
- item: The relationship to neighbouring buildings
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For roof extensions and dormers: elevations of the whole property, not just the roof and upper
    floor(s)'
  level: must
  required-if:
    condition:
      field: roof-alteration
      value: true
      description: Roof extension or dormer windows, or other change to the roof.
- item: 'For roof terraces: the nearest windows on the immediately adjoining properties, and the materials
    and measurements of the means of enclosure and any privacy screens'
  level: must
  required-if:
    condition:
      field: raised-platform
      value: true
      description: The proposal includes a roof terrace.
- item: 'For shop fronts with ATMs: details of height (for disabled access) and of any illuminated adverts'
  level: must
  required-if:
    all:
    - condition:
        field: shopfront
        value: true
        description: The proposal is for a new or altered shopfront.
    - discretionary
- item: 'For plant, flues, ventilation, extraction or air conditioning: equipment, ducting and acoustic
    enclosures or screening, and the location of neighbouring windows cross referenced to the acoustic
    report'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
- item: 'For illuminated advertisements: the method, type and colour of illumination, whether externally
    or internally lit, the type of lighting and the size of light fittings'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
- item: 'For listed building consent: proposed internal elevations affected by the works, at scale 1:50'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For a lawful development certificate with roof lights or dormers: how far roof lights project
    from the roof slope and the distance from the original eaves to the bottom of any dormer, measured
    on the drawings, and any cladding annotated'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: roof-alteration
        value: true
        description: Roof extension or dormer windows, or other change to the roof.
confidence: medium
notes: From the council's list (published January 2019), page 6, 8, 11, 12, item 2c, 2d, 3c, 4a-4f. Householder
  applications (2c) need them for building work and alterations; other applications (3c) also for advertisements.
  For non-material amendments the list asks for drawings showing the amendment 'where necessary', so that
  part shows as 'check'. The ATM item shows as 'check' because the list has no separate trigger for ATMs.
review-status: unverified
field-status: {}
