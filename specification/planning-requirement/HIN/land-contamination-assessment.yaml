reference: land-contamination-assessment
local-authority: HIN
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: Land which could potentially be contaminated as a result of current or historic use.
  - any:
    - condition:
        field: building-works
        value: true
        description: The proposal involves building work.
    - condition:
        field: involves-change-of-use
        value: true
        description: The proposal significantly changes the use of the land.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM7
source-text: If your proposal is to re-develop or significantly change the use of a piece of land which
  could potentially be contaminated as a result of current or historic use
must-include:
- item: A Phase 1 contaminated land assessment
  level: must
- item: A Phase 2 assessment with a remediation strategy, where the Phase 1 assessment says one is needed
  level: must
  required-if: discretionary
- item: A validation report for any remediation completed
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2019), page 23, item 8c.
review-status: unverified
field-status: {}
