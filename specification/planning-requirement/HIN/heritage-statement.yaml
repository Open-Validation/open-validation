reference: heritage-statement
local-authority: HIN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - battlefield
      - locally-listed-building
      - archaeological-priority-area
      description: The application affects a listed building or its setting, a conservation area, a scheduled
        monument, a registered battlefield, a locally listed building, or archaeological remains in an
        area of archaeological potential, or their settings.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM11, DM12, DM13; Heritage Statement
  Guidance
source-text: 'All listed building consent applications and applications which impact on the setting of
  listed buildings. All applications which affect the following heritage assets and their settings: ...
  Conservation areas ... Scheduled monuments ... Registered battlefields ... Locally listed buildings
  (Non- designated heritage assets) ... Archaeological remains and works that are located in an area of
  archaeological potential'
must-include:
- item: The significance of the heritage asset affected
  level: must
- item: The contribution the setting of the heritage asset makes to its significance (where relevant)
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset
  level: must
- item: The sources considered and the expertise consulted
  level: must
- item: The steps taken to avoid or minimise any adverse impacts on the significance of the building
  level: must
- item: 'Where works to a listed building would cause substantial harm or total loss of significance:
    a method statement and justification'
  level: must
  required-if:
    all:
    - site:
        in:
        - listed-building
        description: The site is or contains a listed building.
    - any:
      - condition:
          field: structural-alteration
          value: true
          description: Structural alterations.
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
    - discretionary
  source-text: If the proposed works would cause substantial harm or total loss of significance to the
    building provide a method statement and justification
confidence: medium
notes: From the council's list (published January 2019), page 19-20, item 7a and 7e. The information can
  be in the design and access statement where one is required. If archaeology is the only heritage issue
  and the archaeological assessment covers it, a separate heritage statement is not needed (item 8a).
  The 'statement of justification' (7e) is added as an item; it shows as 'check' because it depends on
  whether the harm is substantial.
review-status: unverified
field-status: {}
