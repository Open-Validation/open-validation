reference: site-plan
local-authority: HIN
required-if:
  always: true
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12; Town and Country
  Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Site plan/block plan ... All
must-include:
- item: At an identified standard metric scale (1:500 or 1:200)
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries
  level: must
- item: All the buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
  required-if: discretionary
- item: All public rights of way crossing or adjoining the site
  level: must
  required-if: discretionary
- item: The position of all trees on the site and on adjacent land
  level: must
  required-if: discretionary
- item: The extent and type of any hard surfacing
  level: must
  required-if: discretionary
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
  required-if: discretionary
- item: 'For a hard standing: permeable materials confirmed, or the drawings show how rainwater is directed
    to a lawn or border to drain naturally within the site'
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: The proposal involves laying a hard standing.
  source-text: If your proposal involves laying a hard standing then you must confirm the proposal materials
    are permeable or show on your drawings how the rainwater is directed to a lawn or border to drain
    naturally within the boundaries of the site
- item: 'Where access is a reserved matter: where access points to the development would be'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: Where access is a reserved matter there is a requirement to indicate where access points
    to the development would be situated.
confidence: medium
notes: From the council's list (published January 2019), page 5, 7, 8, 10 and 14, item 2a, 2f, 3a, 3j
  and 4i. The same site plan rules appear for householder (2a) and other applications (3a). The adjoining-land,
  rights of way, trees, hard surfacing and boundary items show as 'check' because the list says they 'may
  be required, unless these would not influence or be affected by the proposed development'. The hardstanding
  rule (2f, 3j) asks for it on the drawings; the outline access rule (4i) does not name a drawing, so
  it is put here.
review-status: unverified
field-status: {}
