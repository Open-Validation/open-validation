reference: photos
local-authority: HIN
required-if:
  any:
  - all:
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
  - all:
    - site:
        in:
        - listed-building
        description: The site is or contains a listed building.
    - any:
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
      - condition:
          field: internal-works
          value: true
          description: Internal works to a listed building.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM11, DM12, DM13
source-text: If the proposal involves the demolition of an existing building in a conservation area or
  a listed building [including internal works to a listed building]
must-include:
- item: Dated and numbered photographs, cross referenced to the drawings, showing the building, its surrounding
    area and the areas where works are proposed
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 20, item 7b.
review-status: unverified
field-status: {}
