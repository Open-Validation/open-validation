reference: elevation-existing
local-authority: HIN
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building work.
  - condition:
      field: external-alterations
      value: true
      description: The proposal involves alterations to buildings.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM11, DM12; Town and Country
  Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Existing and proposed elevations ... All applications involving building work, alterations
  to buildings or display of advertisements
must-include:
- item: Drawn at the scale the list gives ('a minimum scale of 1:500, or 1:100')
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For demolition of a listed building: the location and extent of demolition shown by labelling
    or hatching'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
- item: 'For listed building consent: existing internal elevations affected by the works, at scale 1:50'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2019), page 6, 8, 12, item 2c, 3c, 4d, 4e and 4f. Householder
  applications (2c) need them for building work and alterations; other applications (3c) also for advertisements.
  For non-material amendments the list asks for drawings showing the amendment 'where necessary', so that
  part shows as 'check'. Existing elevations only where there is an existing building.
review-status: unverified
field-status: {}
