reference: arboriculturist-report
local-authority: HIN
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site or on adjacent sites, including street trees.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM12
source-text: If there are trees within the application site or on adjacent sites including street trees
must-include:
- item: Species, spread, roots and position of trees
  level: must
- item: Which trees are to be felled and which retained
  level: must
- item: Which trees will be affected by the development, and the measures to protect them during construction
  level: must
- item: 'In line with BS5837:2012: a tree survey, a tree constraints plan, an arboricultural implications
    assessment, and an arboricultural method statement with a tree protection plan'
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 31, item 8s.
review-status: unverified
field-status: {}
