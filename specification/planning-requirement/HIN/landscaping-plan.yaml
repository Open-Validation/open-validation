reference: landscaping-plan
local-authority: HIN
required-if:
  condition:
    field: external-space
    value: true
    description: The application includes external space.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM10, DM12
source-text: All applications that include external space must be accompanied by a detailed scheme for
  landscaping
must-include:
- item: Trees to be removed not shown; retained existing trees clearly differentiated from those proposed
  level: must
- item: Planting of trees and/or shrubs, surface materials, boundary screen walls and fences
  level: must
- item: Materials, species, tree and plant sizes, numbers and planting densities
  level: must
- item: Levels, gradients and any earthworks
  level: must
- item: Proposed timing of implementation
  level: must
- item: Proposals for long-term maintenance and landscape management
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 31-32, item 8s.
review-status: unverified
field-status: {}
