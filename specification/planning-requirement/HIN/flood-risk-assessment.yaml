reference: flood-risk-assessment
local-authority: HIN
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of one hectare or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of one hectare or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM7
source-text: Planning applications for development proposals of one hectare or greater in Flood Zone 1
  and all development proposals located in Flood Zones 2 and 3 should be accompanied by a Flood Risk Assessment.
confidence: medium
notes: From the council's list (published January 2019), page 24, item 8e. The list says the assessment
  should be proportionate to the degree of flood risk and to the scale, nature and location of the development.
review-status: unverified
