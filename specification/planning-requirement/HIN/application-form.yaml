reference: application-form
local-authority: HIN
required-if:
  always: true
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Application form ... All ... This part of the application form must be signed to either confirm
  the land to which the application relates is not part of an agricultural holding; or if it is that you
  have notified any tenants ... One of the ownership certificates must be signed.
must-include:
- item: 'Agricultural holding certificate signed: the land is not part of an agricultural holding, or
    any tenants have been notified'
  level: must
- item: One of the ownership certificates (A, B, C or D) signed
  level: must
- item: Certificate B where part of the proposal overhangs or forms a party wall on a neighbour's land
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Part of the proposal overhangs or forms a party wall on a neighbour's land.
  source-text: (If part of your proposal overhangs or forms a party wall on your neighbours land you are
    required to submit certificate B)
confidence: medium
notes: From the council's list (published January 2019), page 2, item 1a-1c. The list's source-text joins
  the 'All' cell with the certificate rows (1b, 1c).
