reference: archaeological-assessment
local-authority: HIN
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: In an area of archaeological potential.
  - condition:
      field: ground-disturbance
      value: true
      description: A new building or the disturbance of ground.
source-url: https://www.hinckley-bosworth.gov.uk/download/downloads/id/6017/validation_requirements.pdf
policy: Site Allocations and Development Management Policies DPD policies DM11, DM13
source-text: If your proposals involve a new building or the disturbance of ground within an area of archaeological
  potential
must-include:
- item: An archaeological desk-based assessment and a field evaluation report, to a brief agreed with
    Leicestershire County Council Archaeology
  level: must
- item: A written statement with plans showing historic features, listed buildings and structures, historic
    parks and gardens, historic battlefields and scheduled ancient monuments
  level: must
- item: An analysis of significance, the principles of and justification for the works, and the impact
    on the special character of any listed building and its setting
  level: must
confidence: medium
notes: From the council's list (published January 2019), page 22, item 8a.
review-status: unverified
field-status: {}
