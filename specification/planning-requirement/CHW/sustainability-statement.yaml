reference: sustainability-statement
local-authority: CHW
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new-build dwellings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 40
      description: Other development creating more than 40 square metres of new-build floorspace.
source-url: https://www.cheshirewestandchester.gov.uk/residents/planning-and-building-control/planning/apply-for-planning-permission/what-to-submit-with-your-application
source-text: 'New-build dwellings: Sustainable Housing Statement and Sustainable Construction Checklist
  … All other development: Sustainable Construction Checklist if creating more than 40sqm new-build floorspace
  … BREEAM assessment for major development*'
must-include:
- item: Sustainable Housing Statement
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The proposal includes new-build dwellings (C3).
- item: Sustainable Construction Checklist
  level: must
- item: BREEAM assessment
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'Audit (missing_requirement): sustainable construction information. Householder development needs
  neither the statement nor the checklist. The BREEAM assessment applies to major development in the ''all
  other development'' column.'
review-status: unverified
field-status: {}
