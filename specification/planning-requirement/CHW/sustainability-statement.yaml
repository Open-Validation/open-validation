reference: sustainability-statement
local-authority: CHW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: new-build
          value: true
          description: New-build dwellings (one or more new-build houses/flats in use class C3).
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
    - condition:
        field: floorspace
        operator: '>'
        value: 40
        description: All other development creating more than 40 sq m of new-build floorspace.
source-url: https://www.cheshirewestandchester.gov.uk/residents/planning-and-building-control/planning/apply-for-planning-permission/what-to-submit-with-your-application
policy: Cheshire West and Chester Local Plan (Part Two) Land Allocations and Detailed Policies policy
  DM 4
source-text: 'New-build dwellings (one or more new-build houses/flats in use class C3) ... Required: Sustainable
  Housing Statement Sustainable Construction Checklist ... Sustainable Construction Checklist if creating
  more than 40sqm new-build floorspace ... BREEAM assessment for major development*'
must-include:
- item: A completed Sustainable Construction Checklist
  level: must
- item: 'New-build dwellings (including replacement dwellings): a Sustainable Housing Statement showing
    how the design responds to each level of the Council''s Energy Hierarchy, which CO2/energy measures
    were considered and chosen, renewable technologies, scope for district heating, and whether the 110
    litres per person per day water standard will be met'
  level: must
  required-if:
    all:
    - condition:
        field: new-build
        value: true
        description: New-build dwellings (one or more new-build houses/flats in use class C3).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more dwellings.
  source-text: all proposals for new-build dwellings (including replacement dwellings) must also provide
    a Sustainable Housing Statement, which outlines how the proposed development complies with the requirements
    of policy DM 4.
- item: 'Major non-residential development and residential institutions (such as care homes and halls
    of residence): information on how the proposal will achieve BREEAM ''Excellent'' (evidence of registration
    with the BREEAM certification body and a Pre-Assessment Estimator or Interim Certificate, or a reasoned
    justification/viability assessment if not)'
  level: must
  required-if:
    any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: ==
          value: 0
          description: Non-residential (no new dwellings).
    - condition:
        field: use-class
        value: residential-institution
        description: Residential institutions such as care homes and halls of residence.
  source-text: Major development (a new building or buildings of 1,000 square metres or more; or where
    the proposed floorspace is not known (e.g. in an application for outline permission) development carried
    out on a site having an area of 1 hectare or more), comprising anything other than new-build dwellings
    or a change of use, must also provide information demonstrating how the proposal meets the BREEAM
    ‘Excellent’ standard. ... For the avoidance of doubt, developments for residential institutions such
    as care homes and halls of residence must complete the sustainable construction checklist and must
    provide information demonstrating how the proposal will achieve the BREEAM ‘Excellent’ standard.
confidence: medium
notes: From the council's list (web page published 5 August 2025), 'Minimum local supporting information'
  table. The page says local supporting information is not automatically required for prior approval,
  listed building consent, lawful development certificates, householder development, or non-residential
  development creating less than 40 sq m of new-build floorspace. Change of use is excluded. Document
  contents come from the council's Sustainable Construction guidance note (updated June 2022), pages 7-11.
  The 'Sustainable construction information requirements' page linked from the list (an online form on
  my.cheshirewestandchester.gov.uk, read 2026-11-06) asks for the checklist for all non-householder development
  creating 40 sq m 'or more' (and outline applications where floorspace is not known), slightly wider
  than the list's 'more than 40sqm'; the rule follows the list. It also says residential institutions
  such as care homes and halls of residence must complete the checklist and show how they will achieve
  BREEAM 'Excellent' (it doesn't say only when major), so they are added to the BREEAM item. Major development
  uses the page's own definition (10+ dwellings excluding conversions, 0.5 ha residential if unknown,
  1,000 sq m, or 1 ha).
review-status: unverified
field-status: {}
