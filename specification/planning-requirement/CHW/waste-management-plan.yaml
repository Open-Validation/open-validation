confidence: medium
notes: 'From the council''s list (web page published 5 August 2025): its ''Hot food takeaway requirements''
  page (planningpolicy.cheshirewestandchester.gov.uk, read 2026-11-06), linked from the list for the full
  requirements, says ''you will need to submit the following information to support your application''.
  The council''s Hot Food Takeaways guidance note (July 2025), section 1, says this applies to all hot
  food takeaway applications, including mixed uses with a takeaway, new uses and variations to existing
  conditions, so no application type is listed. The list asks for a site plan showing waste storage; it
  is filed as the waste management plan (how waste will be stored) because CHW''s list has no general
  site plan requirement. The guidance note (paragraph 1.7) gives the waste storage requirement without
  citing a policy, so none is shown.'
