reference: design-and-access-statement
local-authority: BOS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for: • all major developments, and; • development within a conservation area involving
  one or more dwelling or a building or buildings with a floor space of 100 square metres or more. … Design
  and Access Statements accompanying applications for listed building consent must include'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'Listed building consent: how the design takes account of the special architectural or historic
    importance of the building, the physical features that justify its listing, and the impact on its
    significance including its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: the approach to access, alternative means of access considered, and
    any consultation undertaken and how it informed the works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 5-6. Part 1 (national
  requirements). Listed building consent shown as a type because the list sets out what a statement accompanying
  such an application must include.
review-status: unverified
field-status: {}
