reference: bng-metric
local-authority: BOS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain (Town and Country Planning) (Modifications and Amendments) (England) Regulations
  2024); Environment Act 2021; Local Plan for Bolsover District (2020) policies SS1, SC3 and SC9
source-text: (Required for development where the applicant believes that planning permission if granted
  would be subject to the biodiversity gain condition)
must-include:
- item: A fully completed metric, even if based on a draft post-development plan, in the interactive Excel
    format
  level: must
  required-if:
    any:
    - condition:
        field: habitat-units-affected
        operator: '>'
        value: 5
        description: The development affects more than 5 units of habitat.
    - condition:
        field: medium-high-distinctiveness-habitat
        value: true
        description: The development affects any amount of habitat of medium to high distinctiveness.
  source-text: Fully completed metric, even if based on draft post-development plan and subject to change.
    The metric should be in the interactive Excel format.
confidence: medium
notes: 'From the council''s list (adopted 16 April 2025, in force 1 June 2025), page 6, 9. Part 1 item
  8 (national BNG information) and Part 2 item 1 (local: the post-development metric where more than 5
  habitat units or medium-high distinctiveness habitat is affected). Exempt development (including householder
  applications and self-build) is exempt by law, so the rule follows the biodiversity gain condition.'
review-status: unverified
field-status: {}
