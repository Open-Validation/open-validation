reference: location-plan
local-authority: BOS
required-if:
  always: true
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan should be based on an up-to-date map. The scale should typically be 1:1250
  or 1:2500, but wherever possible the plan should be scaled to fit onto A4 or A3 size paper. A location
  plan should identify sufficient roads and/or buildings on land adjoining the application site to ensure
  that the exact location of the application site is clear. The application site should be edged clearly
  with a red line on the location plan. It should include all land necessary to carry out the proposed
  development (e.g. land required for access to the site from a public highway, visibility splays, landscaping,
  car parking and open areas around buildings). A blue line should be drawn around any other land owned
  or controlled by the applicant, close to or adjoining the application site.
must-include:
- item: Based on an up-to-date map
  level: should
- item: Scale typically 1:1250 or 1:2500, scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: Blue line around any other land owned or controlled by the applicant close to or adjoining the
    site
  level: should
