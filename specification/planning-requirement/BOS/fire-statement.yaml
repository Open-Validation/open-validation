reference: fire-statement
local-authority: BOS
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of 7 or more storeys.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys,
  must be accompanied by a Fire Statement completed by an expert.
must-include:
- item: Completed by an expert
  level: must
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 7. Part 1 (national
  requirements). The rule follows the national one (relevant buildings with two or more dwellings or educational
  accommodation).
review-status: unverified
field-status: {}
