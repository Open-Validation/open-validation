reference: proposed-habitat-plan
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
  - any:
    - condition:
        field: habitat-units-affected
        operator: '>'
        value: 5
        description: The development affects more than 5 units of habitat.
    - condition:
        field: medium-high-distinctiveness-habitat
        value: true
        description: The development affects any amount of habitat of medium to high distinctiveness.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Environment Act 2021; Local Plan for Bolsover District (2020) policies SS1, SC3 and SC9
source-text: 'Where the applicant believes that planning permission, if granted, would be subject to the
  biodiversity gain condition and where it effects more than 5 units of habitat or any amount of habitat
  of medium – high distinctiveness, the following should be submitted:'
must-include:
- item: Indicative Biodiversity Gain Plan with proposals for achieving at least 10% net gain
  level: must
- item: What onsite gains are feasible and any requirement for offsite gains
  level: must
- item: Where legal agreements are necessary to secure gains
  level: must
- item: Provisions for future management and monitoring
  level: must
- item: Consideration of the mitigation hierarchy (avoid-mitigate-compensate) and the BNG hierarchy (onsite
    gains > offsite gains > statutory credits)
  level: must
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 9. Part 2 item 1, 'Indicative
  Post Development Biodiversity Gain Plan' (Minor, Other, Major and Large Scale Major). Exempt development
  (including householder applications and self-build) is exempt by law, so the rule follows the biodiversity
  gain condition. The list marks each item with the application types it applies to (Householder; Minor,
  Major and Large Scale Major, shown here as full, outline and reserved matters; 'Other' = changes of
  use, advertisement consent and listed building consent).
review-status: unverified
field-status: {}
