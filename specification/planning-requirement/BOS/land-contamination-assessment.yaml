reference: land-contamination-assessment
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
  - any:
    - site:
        in:
        - contaminated-land
        description: Built development on a site known or suspected to be contaminated.
    - condition:
        field: industrial-site
        value: true
        description: The site has previously been in use for industrial processes.
    - condition:
        field: previously-developed-land
        value: true
        description: Developing on made ground that has previously been developed.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policies SC2 and SC14
source-text: Applications proposing built development on sites known or suspected to be contaminated (for
  example, which have been previously in use for industrial processes, or includes developing on made
  ground that has previously been developed) will need to be accompanied by a “Phase 1” Desk Top Study.
must-include:
- item: A Phase 1 Desk Top Study
  level: must
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 19. Part 2 item 9 (Minor,
  Other, Major and Large Scale Major). The list marks each item with the application types it applies
  to (Householder; Minor, Major and Large Scale Major, shown here as full, outline and reserved matters;
  'Other' = changes of use, advertisement consent and listed building consent).
review-status: unverified
field-status: {}
