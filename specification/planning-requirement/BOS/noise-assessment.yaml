reference: noise-assessment
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: Potentially noise generating development (such as pubs, clubs, industrial units,
            children's homes).
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: In the vicinity of existing noise sensitive development (such as housing).
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise sensitive use in the vicinity of existing noise generating uses (such as
            major roads and railways).
      - discretionary
    - all:
      - condition:
          field: mixed-use
          value: true
          description: Mixed use application.
      - condition:
          field: noise-generating-use
          value: true
          description: Proposes noise generating development.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Proposes noise sensitive development.
    - all:
      - condition:
          field: plant-equipment
          value: true
          description: Commercial application including extractor or cooling units.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: In the vicinity of noise sensitive development.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policies SC3 and SC11
source-text: '(To be carried out by suitably qualified acousticians). This should outline the existing
  noise environment, the potential noise sources from the development or the noise sources likely to affect
  the development, together with any mitigation measures. … Required for: • Potentially noise generating
  developments (such as pubs, clubs, industrial units, children’s homes) in the vicinity of existing noise
  sensitive developments (such as housing). • Noise sensitive uses in the vicinity of existing noise generating
  uses (such as major roads and railways). • Mixed use applications proposing both noise generating and
  noise sensitive … developments. • Commercial applications including extractor or cooling units in the
  vicinity of noise sensitive development. For applications involving the creation of children’s homes
  outside of a C3 class use and/or that have more than 5 bedrooms will require a statement of purpose
  and management plan, which sets out how any noise nuisance will be minimised and how complaints will
  be processed and dealt with will need to be submitted alongside any assessment.'
must-include:
- item: Carried out by suitably qualified acousticians
  level: must
- item: The existing noise environment
  level: must
- item: The potential noise sources from the development, or the noise sources likely to affect it
  level: must
- item: Any mitigation measures
  level: must
- item: 'Children''s homes outside a C3 class use and/or with more than 5 bedrooms: a statement of purpose
    and management plan setting out how noise nuisance will be minimised and how complaints will be dealt
    with'
  level: must
  required-if:
    all:
    - condition:
        field: childrens-home
        value: true
        description: Creation of a children's home.
    - any:
      - condition:
          field: bedroom-count
          operator: '>'
          value: 5
          description: More than 5 bedrooms.
      - discretionary
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 20-21. Part 2 item
  12, 'Noise / Nuisance Impact Assessment' (Minor, Other, Major and Large Scale Major). Noise sensitive
  uses near existing noise sources show as 'check' because the list names no distance; a children's home
  outside use class C3 shows as 'check' for the same reason (no field for 'outside C3'). The list marks
  each item with the application types it applies to (Householder; Minor, Major and Large Scale Major,
  shown here as full, outline and reserved matters; 'Other' = changes of use, advertisement consent and
  listed building consent).
review-status: unverified
field-status: {}
