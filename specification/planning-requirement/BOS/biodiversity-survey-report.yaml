reference: biodiversity-survey-report
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
  - any:
    - condition:
        field: potential-roost-features
        value: true
        description: Buildings, structures, underground structures or trees that could provide roosting
          opportunities for bats.
    - condition:
        field: floodlighting
        value: true
        description: Flood lighting of buildings, menages or green space close to habitats that bats tend
          to use.
    - all:
      - condition:
          field: wind-turbine
          value: true
          description: A wind farm proposal.
      - discretionary
    - condition:
        field: loss-of-habitat-features
        value: true
        description: Loss of existing foraging habitats such as fields, hedgerows, scrub or woodland.
    - condition:
        field: hedgerows-affected
        value: true
        description: Severance of commuting features such as hedgerow networks, or proposals affecting
          field hedgerows or lines of trees with connectivity to woodland or water.
    - condition:
        field: near-woodland
        value: true
        description: Proposals affecting woodland.
    - all:
      - ref: major-development
      - condition:
          field: distance-to-pond
          operator: <=
          value: 500
          description: Major proposals within 500 m of a pond.
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development (1-9 dwellings, under 1,000 sq m, or a site under 1 ha).
      - condition:
          field: distance-to-pond
          operator: <=
          value: 250
          description: Minor proposals within 250 m of a pond.
    - condition:
        field: near-watercourse
        value: true
        description: Proposals affecting or within 30 m of rivers, streams, canals, lakes or other aquatic
          habitats.
    - condition:
        field: derelict-site
        value: true
        description: Proposals affecting derelict land (brownfield sites).
    - condition:
        field: greenfield-site
        value: true
        description: Development on previously undeveloped (greenfield) land.
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - national-nature-reserve
        - local-nature-reserve
        - local-wildlife-site
        description: On, adjacent to or affecting internationally, nationally or locally designated biodiversity
          sites.
    - condition:
        field: geodiversity-interest
        value: true
        description: Affecting designated geodiversity sites.
    - condition:
        field: protected-species
        value: true
        description: Affecting buildings, structures, features or locations where protected or priority
          species are known to be present.
    - site:
        in:
        - priority-habitat
        description: Priority habitats known to be present.
    - discretionary
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations; Protection
  of Badgers Act 1992; NERC Act 2006; Environment Act 2021; Local Plan for Bolsover District (2020) policies
  SS1, SC3 and SC9
source-text: 'Bat survey(s) should be undertaken if a development proposal is likely to negatively affect
  bats or their: - roost habitats - foraging habitats - commuting habitats … the development site includes
  buildings or other built structures, underground structures or trees that could provide roosting opportunities
  for bats … the proposals include flood lighting of buildings, menages or green space close to habitats
  that bats tend to use … the proposals are close to water bodies, quarries or natural cliff faces … it
  is a wind farm proposal close to a site designated for bats or close to habitats that bats use for commuting
  and foraging … there will be a loss of existing foraging habitats, such as fields, hedgerows, scrub
  or woodland e.g. for a major housing development … there will be severance of commuting features, such
  as extensive hedgerow networks or woodland … A site survey by a suitably qualified ecologist is required
  for: • Proposals affecting woodland, or field hedgerows and/or lines of trees with obvious connectivity
  to woodland or water bodies. • Major proposals within 500m of a pond or Minor proposals within 250m
  of pond. • Proposals affecting or within 30m of rivers, streams, canals, lakes, or other aquatic habitats.
  • Proposals affecting ‘derelict’ land (brownfield sites), allotments and railway land. • Development
  on previously undeveloped (Greenfield) land. • Proposed development on, adjacent to or otherwise affecting
  internationally, nationally or locally designated biodiversity or geodiversity sites. • Proposed development
  affecting any buildings, structures, feature or locations where protected, or priority species or habitats
  are known to be present.'
must-include:
- item: Site survey by a suitably qualified ecologist
  level: must
- item: The habitats on site (UKHabs)
  level: must
- item: The suitability of the site for protected species, species of conservation concern or species
    listed in the Derbyshire Local Nature Recovery Strategy
  level: must
- item: The results of all further species surveys recommended by the Preliminary Ecological Appraisal
  level: must
- item: An assessment of the impact of the development and the measures needed to address impacts (avoidance,
    mitigation and compensation)
  level: must
- item: Unless impacts are very low, the Preliminary Ecological Appraisal developed into an Ecological
    Impact Assessment (EcIA)
  level: should
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 9-12. Part 2 items
  2 (Bat Survey and Assessment) and 3 (Preliminary Ecological Appraisal or Ecological Impact Assessment),
  both for Minor, Other, Major and Large Scale Major. Shown partly as 'check' because the list says bats
  may be present from distribution records, names sites close to water bodies, quarries or cliffs, wind
  farms near bat sites, allotments and railway land (no field for these), and says its lists are not exhaustive.
  The list marks each item with the application types it applies to (Householder; Minor, Major and Large
  Scale Major, shown here as full, outline and reserved matters; 'Other' = changes of use, advertisement
  consent and listed building consent).
review-status: unverified
field-status: {}
