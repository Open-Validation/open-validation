reference: recreation-facilities-assessment
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - condition:
      field: affects-playing-field
      value: true
      description: Loss of, or development likely to prejudice, a playing field (including school playing
        fields).
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policies ITCR5, ITCR7 and ITCR8
source-text: 'All applications that involve the loss of, or development likely to prejudice a playing
  field(s) including school ‘playing fields’ shall be accompanied by the following information: … Developments
  involving the loss of a playing field and/or a sports facility should be accompanied by the following
  information:'
must-include:
- item: A plan showing the development in relation to the affected playing field
  level: must
- item: A statement of how the development will impact on the existing playing field and any mitigation
    needed so as not to prejudice its ongoing use
  level: must
- item: A ball strike assessment where the development would be next to a sports field or facility
  level: must
- item: 'Where a playing field or sports facility would be lost: details of it (dimensions, condition
    and size)'
  level: should
- item: 'Where a playing field or sports facility would be lost: justification of why it is no longer
    required'
  level: should
- item: 'Where alternative facilities are provided to compensate: how the development will benefit sport'
  level: should
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 26. Part 2 item 19,
  'Playing Field Impact Assessment' (Minor, changes of use, Major and Large Scale Major). The list marks
  each item with the application types it applies to (Householder; Minor, Major and Large Scale Major,
  shown here as full, outline and reserved matters; 'Other' = changes of use, advertisement consent and
  listed building consent).
review-status: unverified
field-status: {}
