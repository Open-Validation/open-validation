reference: site-plan
local-authority: BOS
required-if:
  always: true
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Must be drawn to an identified scale and, in the case of plans, must show the direction of
  North. As a minimum this must include a block plan (to a scale of 1:500 or larger where appropriate).
  Block plans are more detailed than location plans. Their main purpose is to identify the detail of the
  development, to identify the building or land to which the application relates and any access requirements.
must-include:
- item: A block plan at a scale of 1:500 or larger where appropriate
  level: must
- item: Drawn to an identified scale, showing the direction of North
  level: must
- item: The detail of the development, the building or land to which the application relates and any access
    requirements
  level: should
confidence: medium
notes: 'From the council''s list (adopted 16 April 2025, in force 1 June 2025), page 5. Part 1, item 5
  (''Any other plans, drawings and information necessary to describe the development''): the list says
  that as a minimum this must include a block plan.'
