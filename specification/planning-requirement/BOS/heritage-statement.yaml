reference: heritage-statement
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - world-heritage-site
        - battlefield
        description: Development that affects a designated heritage asset.
    - all:
      - site:
          in:
          - locally-listed-building
          description: A non-designated heritage asset that may be harmed.
      - discretionary
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policies SC16, SC17, SC18, SC19, SC20 and SC21
source-text: A Statement of Significance and Heritage Impact Assessment will be required for all development
  that affects a designated heritage asset. … Where a heritage asset may be harmed then all applications
  should be accompanied by a Heritage Impact Assessment. All heritage assets include Conservation Areas,
  Scheduled Monuments, Listed Buildings, Registered Parks and Gardens, as well as non-designated heritage
  assets.
must-include:
- item: A statement of the significance of the historic building or area
  level: should
- item: Details of the proposed works, item by item
  level: should
- item: How the proposed works will impact on the significance of the historic building or area
  level: should
- item: As a minimum, a check of the Local Development Plan, the Historic Environment Record, statutory
    and local lists, the National Monuments Record and the Heritage Gateway
  level: should
- item: Enough detail to assess the harm to significance, including to the asset's setting, and how the
    application will avoid or minimise any harm
  level: should
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 5, 13-14. Part 2 item
  6 (Householder, Minor, Other, Major and Large Scale Major); the Part 1 Design and Access Statement section
  adds that all applications where a heritage asset (designated or non-designated) may be harmed need
  a Heritage Impact Assessment; a non-designated asset shows as 'check' because it turns on whether it
  'may be harmed'. The list marks each item with the application types it applies to (Householder; Minor,
  Major and Large Scale Major, shown here as full, outline and reserved matters; 'Other' = changes of
  use, advertisement consent and listed building consent).
review-status: unverified
field-status: {}
