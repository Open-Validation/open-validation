reference: town-centre-impact-assessment
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development in an edge-of-centre or out-of-centre location.
  - any:
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: Over 200 m² of net retail or leisure floorspace.
      - condition:
          field: distance-to-local-centre
          operator: <=
          value: 500
          description: Within 500 m of a local centre.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 280
          description: Over 280 m² of net retail or leisure floorspace.
      - condition:
          field: distance-to-town-centre
          operator: <=
          value: 500
          description: Within 500 m of the town centre boundaries.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Over 500 m² of net retail and leisure floorspace across the remainder of the district.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policy WC5
source-text: 'Applications for retail and leisure development in edge-of-centre or out-of-centre locations
  which include: a) Over 200m2 of net retail or leisure floorspace within 500m of local centres b) Over
  280m2 of net retail or leisure floorspace within 500 metres of the town centre boundaries, and c) Over
  500m2 of net retail and leisure floorspace across the remainder of the district.'
must-include:
- item: A sequential assessment of the availability of sites in the main town centres and other centres
    identified in the Local Plan before edge of centre and out of centre sites
  level: must
- item: Details of the availability of sites closer to a centre and the reasons they were discounted
  level: must
- item: Evidence that there are no sequentially preferable sites
  level: should
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 26-27. Part 2 item
  20, 'Sequential Test and Retail or Leisure Impact Assessment' (Minor, changes of use, Major and Large
  Scale Major). Floorspace uses the town centre use field for the list's 'net retail or leisure floorspace'.
  The list marks each item with the application types it applies to (Householder; Minor, Major and Large
  Scale Major, shown here as full, outline and reserved matters; 'Other' = changes of use, advertisement
  consent and listed building consent).
review-status: unverified
field-status: {}
