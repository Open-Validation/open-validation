reference: habitat-baseline
local-authority: BOS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain (Town and Country Planning) (Modifications and Amendments) (England) Regulations
  2024)
source-text: (Required for development where the applicant believes that planning permission if granted
  would be subject to the biodiversity gain condition) … a plan showing the location, on the date referred
  to in paragraph (i)(aa) or (bb) (as applicable), of— (aa)the onsite habitat included in the calculations
  referred to in paragraph (i), and (bb)any irreplaceable habitat.
must-include:
- item: The onsite habitat included in the biodiversity metric calculations, on the baseline date
  level: must
- item: Any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 6-7. Part 1 item 8
  (national BNG information). Exempt development (including householder applications and self-build) is
  exempt by law, so the rule follows the biodiversity gain condition.
review-status: unverified
field-status: {}
