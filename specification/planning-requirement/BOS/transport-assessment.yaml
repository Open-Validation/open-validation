reference: transport-assessment
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 800
        description: Retail over 800 m².
    - condition:
        field: office-floorspace
        operator: '>'
        value: 1500
        description: Offices and R&D over 1,500 m².
    - all:
      - condition:
          field: hotel-development
          value: true
          description: Hotels.
      - condition:
          field: bedroom-count
          operator: '>'
          value: 75
          description: Over 75 bedrooms.
    - all:
      - condition:
          field: use-class
          value: non-residential-institution
          description: Non-residential institutions.
      - condition:
          field: floorspace
          operator: '>'
          value: 500
          description: Over 500 m².
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Financial and professional services.
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Over 1,000 m².
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 2500
        description: General industry over 2,500 m².
    - all:
      - condition:
          field: use-class
          value: residential-institution
          description: Residential institutions.
      - condition:
          field: bedroom-count
          operator: '>'
          value: 30
          description: Over 30 bedrooms.
    - all:
      - condition:
          field: use-class
          value: leisure
          description: Leisure.
      - condition:
          field: floorspace
          operator: '>'
          value: 500
          description: Over 500 m².
    - all:
      - condition:
          field: use-class
          value: restaurant-cafe
          description: Cafes and restaurants.
      - condition:
          field: floorspace
          operator: '>'
          value: 300
          description: Over 300 m².
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 3000
        description: Warehousing over 3,000 m².
    - condition:
        field: dwelling-count
        operator: '>'
        value: 50
        description: More than 50 dwellings.
    - all:
      - condition:
          field: use-class
          value: drinking-establishment
          description: Drinking establishments.
      - condition:
          field: floorspace
          operator: '>'
          value: 300
          description: Over 300 m².
    - all:
      - condition:
          field: use-class
          value: hot-food-takeaway
          description: Hot food takeaways.
      - condition:
          field: floorspace
          operator: '>'
          value: 250
          description: Over 250 m².
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: 6C's Design Guide; Manual for Streets; Local Plan for Bolsover District (2020) policies SS1 and
  ITCR10
source-text: 'All applications that exceed the following adopted 6 C’s Design Guidance Thresholds: • Retail
  800m2 • Offices and R&D > 1500m2 • Hotels > 75 Bedrooms • Non-residential institutions > 500m2 • Financial
  & Professional Services > 1000m2 • General Industry > 2500m2 • Residential institutions > 30 Bedrooms
  • Leisure > 500m2 • Cafes/Restaurants > 300m2 • Warehousing > 3000m2 • Dwellings > 50 dwellings • Drinking
  establishments > 300m2 • Hot food takeaways > 250m2'
must-include:
- item: An evaluation of the potential transport impacts of the proposal
  level: must
- item: How it encourages sustainable travel, lessens traffic generation and its impacts, reduces carbon
    emissions, improves road safety and reduces the need for new road capacity
  level: should
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 22-23. Part 2 item
  14 (Minor, changes of use, Major and Large Scale Major). The list writes 'Retail 800m2' without a '>'
  sign; the lead-in says applications that exceed the thresholds. The list marks each item with the application
  types it applies to (Householder; Minor, Major and Large Scale Major, shown here as full, outline and
  reserved matters; 'Other' = changes of use, advertisement consent and listed building consent).
review-status: unverified
field-status: {}
