reference: affordable-housing-statement
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10 units or more.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policies II1, ITCR5, ITCR7 and LC2
source-text: 'All applications for residential development of 10 units or more. The statement should include
  provision for contributions towards education, health, library, improvements to sports facilities on
  and off-site and any other infrastructure requirements arising from the development and the mechanisms
  for delivery. In addition to the aforementioned requirements, all applications for residential development
  of 25 units or more will also be required to make provisions for the following: ⦁ Affordable Housing
  (Local Plan Policy LC2) ⦁ New Green Space & play provision (Local Plan Policy ITCR5).'
must-include:
- item: Provision for contributions towards education, health, library, improvements to sports facilities
    on and off-site and any other infrastructure arising from the development
  level: must
- item: The mechanisms for delivery
  level: must
- item: Affordable housing (Local Plan policy LC2)
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 25
      description: Residential development of 25 units or more.
- item: New green space and play provision (Local Plan policy ITCR5)
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 25
      description: Residential development of 25 units or more.
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 21-22. Part 2 item
  13, 'Affordable Housing and Developer Contributions Statement' (Major and Large Scale Major). For other
  forms of development the list says infrastructure needs are considered under policy II1. The list marks
  each item with the application types it applies to (Householder; Minor, Major and Large Scale Major,
  shown here as full, outline and reserved matters; 'Other' = changes of use, advertisement consent and
  listed building consent).
