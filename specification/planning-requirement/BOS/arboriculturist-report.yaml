reference: arboriculturist-report
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - advertising
      - lbc
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: The site includes or is next to trees protected by a Tree Preservation Order.
    - all:
      - site:
          in:
          - conservation-area
          description: The site is within a conservation area.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: There are trees on or next to the site.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: BS5837:2012; Local Plan for Bolsover District (2020) policies SS1, SC3 and SC10
source-text: 'Required where application sites include or are located adjacent to trees protected by Tree
  Preservation Orders (TPOs) or within a conservation area. All surveys / assessments should be carried
  out by a competent professional in accordance with British Standard BS5837:2012 and should include (where
  applicable):'
must-include:
- item: Carried out by a competent professional in accordance with BS5837:2012
  level: must
- item: Survey of all trees likely to be impacted, with categorisation results in a schedule (BS5837:2012
    sections 4.4 - 4.6)
  level: should
- item: Trees clearly identified as retained or removed (including trees on adjacent land with canopies
    or RPAs encroaching onto the site)
  level: should
- item: Specifications for all proposed management works to retained trees
  level: should
- item: Assessment of the probable impacts between the trees and the development (BS5837:2012 section
    5.3.4)
  level: should
- item: Root protection areas (RPA) and construction exclusion zones
  level: should
- item: Exclusion zone protective barriers, with precise locations and specification
  level: should
- item: Position of all new underground services in relation to RPAs
  level: should
- item: Specification and installation method statement for any new structure, hardstanding, underground
    service or works access within RPAs
  level: should
- item: Method statements for all other construction operations which impact on trees
  level: should
- item: Positions and specification of all new tree planting (BS8545:2014 as appropriate)
  level: should
- item: Reinstatement and ground preparation for new tree planting and soft landscaping
  level: should
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 25. Part 2 item 18,
  'Tree Survey/Arboricultural Impact Assessment' (all types). The list says the contents apply 'where
  applicable', so they show as 'should'. The list marks each item with the application types it applies
  to (Householder; Minor, Major and Large Scale Major, shown here as full, outline and reserved matters;
  'Other' = changes of use, advertisement consent and listed building consent).
review-status: unverified
field-status: {}
