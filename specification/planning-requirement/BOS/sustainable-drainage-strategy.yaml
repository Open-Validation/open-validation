reference: sustainable-drainage-strategy
local-authority: BOS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        description: Development with surface water drainage in an area at risk of flooding, such as flood
          zones 2 or 3, or at risk of surface water flooding.
source-url: https://committees.bolsover.gov.uk/documents/s27228/Appendix+2.pdf
policy: Local Plan for Bolsover District (2020) policy SC7
source-text: A Sustainable Drainage Strategy will be required if the application is for major development
  with surface water drainage or development with surface water drainage in an area at risk of flooding
  such as flood zones 2 or 3, or at risk of surface water flooding.
confidence: medium
notes: From the council's list (adopted 16 April 2025, in force 1 June 2025), page 13. Part 2 item 5 (Minor,
  Major and Large Scale Major). The list marks each item with the application types it applies to (Householder;
  Minor, Major and Large Scale Major, shown here as full, outline and reserved matters; 'Other' = changes
  of use, advertisement consent and listed building consent).
review-status: unverified
field-status: {}
