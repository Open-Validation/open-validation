reference: site-plan
local-authority: ROT
required-if:
  always: true
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The site plan should be at an appropriate scale (typically 1.200 or 1.500) for the development
  proposed and should accurately show the direction of North and the proposed development in relation
  to the site boundaries and other existing buildings. The site plan should also show the following, unless
  these would NOT influence or be affected by the proposed development; all the buildings, roads and footpaths
  adjoining the site including access arrangements, all public rights of way, the position of all trees
  on the site and those on the adjacent land, the extent and type of any hard surfacing and any boundary
  treatment.
must-include:
- item: At an appropriate scale (typically 1:200 or 1:500)
  level: must
- item: Direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings
  level: must
- item: Buildings, roads and footpaths adjoining the site, including access arrangements
  level: should
- item: All public rights of way
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing, and any boundary treatment
  level: should
confidence: medium
notes: From the council's list (published May 2026), section 12, page 6. The 'should' items are needed
  'unless these would NOT influence or be affected by the proposed development'.
