validation-list:
  url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
  date: 2026-05
  date-basis: 'Cover: ''May 2026''; running header ''Planning Application Validation Checklist 2026''
    (PDF created 1 July 2026). Checked 2026-11-06: it is the only list on the council''s Local Validation
    Requirements download page (https://www.rotherham.gov.uk/downloads/download/230/local-validation-requirements),
    alongside a Word copy of the same; no newer version or consultation found. MHCLG''s register still
    links the older ''Validation of planning applications policy'' (file 1621). Published within two years,
    so current.'
  status: current
submission-standards:
- item: Maximum single or combined file size of 15 MB (the sum of all document file sizes)
  level: must
- item: All drawings include a scale bar and key dimensions, and state the paper size and scale (for example
    1:1250 at A3)
  level: must
- item: Plans and drawings must not carry 'not to scale' disclaimers (they will not be considered)
  level: must
- item: Each plan and drawing labelled with the site address, drawing title, scale, date and drawing number,
    with any revisions clearly identified
  level: should
- item: Drawings submitted electronically in PDF format, to allow accurate measurement
  level: should
- item: Photographs submitted in PDF format
  level: should
- item: 'Paper submissions: one paper copy of the application form, plans and all local list documents'
  level: must
- item: Personal data in supporting documents kept to a minimum; documents with unnecessary and significant
    personal data (e.g. on every page) must be revised before validation
  level: must
- item: Where a local list item is not provided, a short written justification of why it is not appropriate
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is Rotherham''s current Validation Checklist 2026 (approved 1 April 2026, published
    May 2026), but its date is taken from file metadata. The extraction misses BfHL, Open Space, Geology
    and SCA items, places coal mining under Householder, omits the Heritage Statement for listed building
    consent, and has several cross-wired triggers. Fixed 2026-11-05: every file was rewritten from the
    council''s latest list.'
