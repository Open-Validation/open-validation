reference: landscaping-plan
local-authority: ROT
required-if:
  all:
  - ref: major-development
  - condition:
      field: external-space
      value: true
      description: The development includes external space.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline
      - condition:
          field: landscaping-reserved-matter
          value: false
          description: Landscaping is not reserved.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Rotherham Local Plan Green Infrastructure and Landscape policies
source-text: 'All full applications or outline applications where landscaping is not reserved for major
  development that include any external space (residential applications for 10 or more houses and/or on
  sites of 0.5 hectares or more, non-residential applications for 1000 square metres or more gross floorspace
  and/or 1 hectare or more) should be accompanied by a landscaping scheme comprising as a minimum the
  following information:'
must-include:
- item: Landscape Strategy or Landscape Masterplan in outline or sketch form, showing the principles and
    the amount of land for green infrastructure and landscape treatment
  level: must
- item: Green infrastructure mitigation, landscape and visual mitigation, hard and soft landscaping and
    SuDS features shown as part of the design
  level: should
- item: Green Infrastructure Delivery Plan where the site is within or immediately adjacent to an existing
    Green Infrastructure corridor
  level: must
  required-if: discretionary
- item: Plans to a suitable scale showing existing site boundaries, features and levels
  level: must
- item: Existing planting and other features of landscape, amenity or conservation interest, with those
    to be retained and removed
  level: must
- item: Screening on or adjacent to the site that the development would benefit from
  level: must
- item: Any changes to existing ground levels, with ground preparation and top soiling
  level: must
- item: Constraints to planting (site utilities and services, highway visibility requirements)
  level: must
- item: Intended uses and treatment of external spaces, and the position and general type of planting
  level: must
- item: How the landscape / green infrastructure features will be managed in future
  level: must
- item: Prepared by a competent person such as a qualified landscape architect
  level: should
confidence: medium
notes: From the council's list (published May 2026), section 31, page 16. Major is defined in the list
  as 10 or more houses and/or 0.5 ha or more, or 1,000 sq m or more and/or 1 ha. 'Within or immediately
  adjacent to' a green infrastructure corridor has no mapped field here, so the delivery plan item shows
  as discretionary.
review-status: unverified
field-status: {}
