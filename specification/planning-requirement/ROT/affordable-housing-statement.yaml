reference: affordable-housing-statement
local-authority: ROT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 units or more.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: Site greater than 0.5 hectares.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Rotherham Local Plan Policy CS27 (Housing Mix and Affordability); Affordable Housing SPD8
source-text: 'Required for all residential developments of: • 11 units or more or sites greater than 0.5
  hectares in size. • Developments of 11 to 15 units should provide either affordable housing on site
  or a contribution to off-site provision, the amount to be agreed with the Rotherham Affordable Housing
  Officer.'
must-include:
- item: Total number of all residential units proposed
  level: must
- item: Percentage of affordable housing units proposed and how this relates to Policy CS27 and the Affordable
    Housing SPD8
  level: must
- item: 'Schedule of all accommodation (private sale, rent and affordable) with, for each unit: tenure
    and justification, number of bedrooms, size (sq m), plot numbers of affordable units, proposed standard
    of accessibility, how affordable units meet Nationally Described Space Standards, and car parking
    per affordable unit'
  level: must
- item: Confirmation that the proposals meet Future Home Standards
  level: must
- item: Layout plan with each affordable unit highlighted and a key showing tenure, with justification
    for the locations agreed with the Affordable Housing Officer
  level: must
- item: Details of design and proposed quality standards of build
  level: must
- item: Details of any Registered Provider acting as a partner in the development
  level: must
- item: Proposed ongoing housing management (transfer to a Registered Provider on RMBC's Framework or
    the Council)
  level: must
- item: Anticipated OMV and transfer value of each affordable property (if applicable)
  level: must
- item: Proposed phasing of delivery and occupation, for sites delivered over more than one phase
  level: must
  required-if: discretionary
- item: Arrangements to keep the provision affordable for first and future occupiers, or to recycle the
    subsidy within the Borough
  level: must
confidence: medium
notes: From the council's list (published May 2026), section 20, page 9.
review-status: unverified
field-status: {}
