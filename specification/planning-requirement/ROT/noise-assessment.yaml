reference: noise-assessment
local-authority: ROT
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development will raise issues of disturbance by noise to occupants of nearby existing
        buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise sensitive development close to existing sources of noise.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Extractors, air conditioning/refrigeration, compressor units or air source heat pumps.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of noise sensitive developments, including residential properties.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: Where developments will raise issues of disturbance by noise to the occupants of nearby existing
  buildings, and for developments that are considered to be noise sensitive and are close to existing
  sources of noise, they shall be supported by a noise assessment prepared by a suitably qualified acoustician.
  • Applications including extractors or air conditioning/refrigeration, compressor units and air source
  heat pumps in the vicinity of noise sensitive developments (including but not limited to residential
  properties).
must-include:
- item: Existing noise environment
  level: must
- item: Potential noise sources from the development, or noise sources likely to affect it
  level: must
- item: Mitigation measures
  level: must
- item: Prepared by a suitably qualified and competent acoustician
  level: must
confidence: medium
notes: From the council's list (published May 2026), section 35, page 20.
review-status: unverified
field-status: {}
