reference: site-investigation
local-authority: ROT
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected.
  - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: Where the Phase 1 Study reveals that there is potential for contamination, a Phase 2 Site
  Investigation & Risk Assessment will also be required. The content of this should follow the checklist
  in the YHPAC Technical Guide and include recommendations for remediation.
must-include:
- item: Follows the checklist in the YHPAC Technical Guide, with recommendations for remediation
  level: must
confidence: medium
notes: From the council's list (published May 2026), section 26, page 13. Needed when the Phase 1 study
  shows potential contamination, which only the study can tell, so it shows as discretionary. Remediation
  and verification (phases 3 and 4) are left to conditions.
review-status: unverified
field-status: {}
