reference: recreation-facilities-assessment
local-authority: ROT
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of allocated or incidental green/open space.
  - condition:
      field: new-open-space
      value: true
      description: Open space/greenspace required as part of a new development (Policy SP37 and SPD13).
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Rotherham Local Plan Sites and Policies Policy SP37; Developer Contributions SPD13
source-text: Where there is a loss of allocated or incidental Green/open space; or • Open Space/Greenspace
  is required as part of a new development in line with Sites and Policies Policy SP37 and the Developer
  Contributions SPD13.
must-include:
- item: Current and recent recreational use of the site
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
- item: Other open space and/or recreational facilities in the locality, with a plan
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
- item: Explanation that facilities are best kept by redeveloping a small part, or adequate replacement
    can be provided in no less convenient location, or retention isn't necessary
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
- item: Precise location of the open space in the overall layout (normally on the site layout plans)
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: New open space.
- item: Layout of the open space with fixed equipment, boundary treatment, access and planting
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: New open space.
- item: Timescale for completing the open space and making it available
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: New open space.
- item: Future maintenance proposals (draft s106 heads of terms if transferred to the Council or met by
    a financial arrangement)
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: New open space.
confidence: medium
notes: From the council's list (published May 2026), section 36, page 20.
review-status: unverified
field-status: {}
