reference: cil-form
local-authority: ROT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates a new dwelling (C3), by new build or conversion (not sub-division of an existing
        dwelling with no increase in floor area).
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 100
      description: Creates net additional residential floor space of 100 sqm or more.
  - condition:
      field: hmo-creation
      value: true
      description: Creates a new HMO (Use Class C4 or sui generis).
  - condition:
      field: retirement-housing
      value: true
      description: Creates new retirement living accommodation.
  - condition:
      field: convenience-retail-floorspace
      operator: '>'
      value: 370
      description: Creates a supermarket (shops above 370 sqm gross internal floorspace).
  - condition:
      field: comparison-retail-floorspace
      operator: '>'
      value: 1100
      description: Creates retail warehouses/retail parks (stores above 1,100 sqm gross internal floorspace,
        including mezzanines).
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Rotherham CIL Charging Schedule; CIL Regulations
source-text: A completed CIL form 1 is required at validation stage.
confidence: medium
notes: From the council's list (published May 2026), section 24, page 11.
review-status: unverified
field-status: {}
