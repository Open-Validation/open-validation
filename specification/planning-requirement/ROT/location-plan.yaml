reference: location-plan
local-authority: ROT
required-if:
  always: true
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a location plan based on an up-to date map.
must-include:
- item: At an identified standard metric scale (typically 1:1250 or 1:2500), scaled to fit A4 or A3 paper
    wherever possible
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location clear
  level: must
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: Direction of north
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: must
confidence: medium
notes: From the council's list (published May 2026), section 11, page 6.
review-status: unverified
field-status: {}
