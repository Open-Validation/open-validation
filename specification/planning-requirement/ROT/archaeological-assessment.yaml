reference: archaeological-assessment
local-authority: ROT
required-if:
  any:
  - ref: major-development
  - condition:
      field: archaeological-scoping-site
      value: true
      description: Identified in the Council's Archaeological Scoping Studies as having 'major', 'potential'
        or 'uncertain' archaeological objections to development.
  - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Rotherham Local Plan Policy SP 43
source-text: All major applications, or larger applications • All sites identified as part of the Council’s
  Archaeological Scoping Studies evidence base as having ‘major,’ ‘potential’ or ‘uncertain’ archaeological
  objections to development (in accordance with Policy SP 43)
must-include:
- item: 'Sites previously scoped for the Council: the results of an archaeological field evaluation (e.g.
    field-walking, geophysical survey or trial trenching) as identified in the Local Plan'
  level: must
  required-if:
    condition:
      field: archaeological-scoping-site
      value: true
      description: Site scoped in the Archaeological Scoping Studies.
- item: 'Sites not previously scoped: the results of a desk-based archaeological assessment (and building
    appraisal where a historic building is affected)'
  level: must
- item: 'Where the desk-based assessment finds archaeological potential: the results of an archaeological
    field evaluation report'
  level: must
confidence: medium
notes: From the council's list (published May 2026), section 19, page 9. 'Larger applications' isn't defined,
  so it shows as discretionary. The council advises discussing proposals with the South Yorkshire Archaeology
  Service first.
review-status: unverified
field-status: {}
