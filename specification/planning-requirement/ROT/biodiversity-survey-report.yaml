reference: biodiversity-survey-report
local-authority: ROT
required-if:
  any:
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Barn conversions.
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a barn, rural building or historic building, or close to protected
          habitats.
    - discretionary
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Development that will illuminate or cause light spill onto a building, mature tree,
          woodland, hedge, pasture, watercourse, water body, tree line or known bat roost.
    - discretionary
  - condition:
      field: hedgerows-affected
      value: true
      description: Proposals affecting woodland or field hedgerows and/or lines of trees with obvious
        connectivity to woodland or water bodies.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - ancient-woodland
      description: May impact directly or indirectly a protected site (SAC, SPA, SSSI, Local Wildlife
        Site, Local Nature Reserve, Ancient Woodland and others).
  - condition:
      field: protected-species
      value: true
      description: Any site where there is known protected species present.
  - condition:
      field: potential-roost-features
      value: true
      description: Demolition or works to buildings and/or trees (Preliminary Roost Assessment).
  - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations; Protection
  of Badgers Act 1992; Natural Environment and Rural Communities Act 2006 section 41
source-text: Barn conversions • Demolition work for any barn, rural building, historic building or in
  close proximity to protected habitats • Development that will illuminate/cause light spill onto a building,
  mature tree, woodland, field hedge, pasture, watercourse, water body, tree line or known bat roost •
  Development of land with areas of semi-natural habitat (including brownfield sites but not including
  minor developments unless there are issues for particular species/habitats • Proposals affecting woodland
  or field hedgerows and/or lines of trees with obvious connectivity to woodland or water bodies • Proposals
  involving the removal or impacts on meadows, development affecting any natural habitat • Proposals affecting
  gravel pits or quarries and natural cliff faces, crevices or caves • Developments that may impact directly
  or indirectly (via watercourse or air pollution) a protected site (Special Area of Conservation, Special
  Protection Area, Site of Special Scientific Interest, Sites of Importance for Nature Conservation, Local
  Wildlife Site, Regional Geological Sites, Local Nature Reserve, Special Verge, Ancient Woodland) • Any
  site where there is known protected species present
must-include:
- item: Preliminary Ecological Appraisal / Ecological Impact Assessment (where appropriate) and any secondary
    surveys needed, with proportionate mitigation, enhancement or compensation
  level: must
- item: By competent persons with suitable qualifications and experience, at an appropriate time of year
    (or justified if sub-optimal), using nationally recognised methods
  level: must
- item: How the mitigation hierarchy (avoid, mitigate, compensate) has been applied
  level: must
- item: Desk study data from Rotherham Biological Records Centre and other relevant sources (any omission
    justified)
  level: must
- item: 'Demolition/works to buildings or trees: Preliminary Roost Assessment by a qualified bat worker,
    plus any secondary bat surveys it recommends, all submitted with the application'
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Works to buildings and/or trees.
- item: SSSI Impact Risk Zone check as a rapid initial assessment of impacts on statutory designated sites
  level: must
- item: Badger reports marked confidential, or sensitive information redacted
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Badgers present.
- item: Willow tit surveys where suitable habitat is near Dearne Valley Wetland SSSI parcels
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      description: Suitable habitat in proximity of Dearne Valley Wetland SSSI parcels.
confidence: medium
notes: 'From the council''s list (published May 2026), section 27, page 14. Details from Appendix 1 (Guidance
  for applicants: Ecology) and its Tables 1 and 2. Triggers with no stated test (semi-natural habitat,
  meadows or any natural habitat, gravel pits, quarries, cliffs or caves, and lighting or demolition near
  habitats) show as discretionary. The appendix lists exceptions, e.g. where the council has confirmed
  in writing at pre-application stage that no surveys are needed.'
review-status: unverified
field-status: {}
