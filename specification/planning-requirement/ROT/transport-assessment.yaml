reference: transport-assessment
local-authority: ROT
required-if: discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: 'Supplementary Planning Document: Transport Assessments, Travel Plans and Parking Standards (June
  2021)'
source-text: A Transport Assessment (TA) should be submitted as part of any planning application where
  the proposed development has significant transport implications.
must-include:
- item: Coverage and detail reflecting the scale of the development and its transport implications
  level: must
- item: 'Major proposals: accessibility by all modes, likely modal split, measures to improve access by
    public transport, walking and cycling, to reduce parking need and to mitigate transport impacts'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published May 2026), section 44, page 24. The list points to national
  guidance for thresholds and asks for one where there are 'significant transport implications', so it
  shows as discretionary.
