reference: lighting-assessment
local-authority: ROT
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External illumination, e.g. security lighting, car-park lighting or floodlighting of
        sports facilities.
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - condition:
        field: outside-urban-area
        value: true
        description: In open countryside.
    - condition:
        field: protected-species
        value: true
        description: The lighting scheme is likely to impact on protected species.
    - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: An application that includes proposals for external illumination (e.g. security lighting
  of buildings and open areas, car-park lighting, floodlighting of sports facilities) and where the development
  site is in the vicinity of residential property, a listed building or a conservation area, or is in
  open countryside, or where it is likely that the lighting scheme will impact on protected species the
  applicant must provide a lighting impact assessment.
must-include:
- item: Layout plan of all light fixtures, beam orientation and spread with specified lux levels, including
    the design maintained average horizontal illuminance and predicted vertical illuminance at windows
    of nearby properties
  level: must
- item: Elevational details showing the position of the lighting units
  level: must
- item: Detailed performance specification of the equipment
  level: must
- item: Proposed times the lighting will be in use
  level: must
- item: Measures to minimise or eliminate glare and stray light beyond the site boundary
  level: must
- item: Impact on adjoining uses, protected species and the locality, with mitigation measures
  level: must
- item: Provided by an appropriately qualified practitioner
  level: should
confidence: medium
notes: From the council's list (published May 2026), section 34, page 19. 'In the vicinity of residential
  property' has no distance, so it shows as discretionary.
review-status: unverified
field-status: {}
