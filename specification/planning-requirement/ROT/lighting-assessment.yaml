reference: lighting-assessment
local-authority: ROT
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: The proposal includes external illumination (security lighting, car-park lighting,
        floodlighting of sports facilities).
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: The site is in the vicinity of a listed building or a conservation area.
    - site:
        in:
        - rural-area
        description: The site is in open countryside.
    - condition:
        field: protected-species
        value: true
        description: The lighting scheme is likely to impact on protected species.
    - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: 'Lighting Assessment Required for: o An application that includes proposals for external
  illumination (e.g. security lighting of buildings and open areas, car-park lighting, floodlighting of
  sports facilities) and where the development site is in the vicinity of residential property, a listed
  building or a conservation area, or is in open countryside, or where it is likely that the lighting
  scheme will impact on protected species the applicant must provide a lighting impact assessment.'
confidence: medium
notes: 'Audit (wrong_app_type): the workbook filed this under listed building consent. ''In the vicinity
  of residential property'' is shown as officer discretion.'
review-status: unverified
field-status: {}
