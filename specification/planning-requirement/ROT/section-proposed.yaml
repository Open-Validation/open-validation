  28 Rotherham Metropolitan Borough Council Planning Application Validation Checklist 2026 1 General Planning
  Application Validation Checklist 1. Introduction The National Planning Policy Framework (NPPF updated
  in 2024) states that “Local planning authorities should publish a list of their information requirements
  for applications for planning permission. These requirements should be kept to the minimum needed to
  make decisions and should be reviewed at least every two years. Local planning authorities should only
  request supporting information that is relevant, necessary, and material to the application in question”
  (para.45) This Policy sets out what “minimum” requirements applicants need to submit to enable the proper
  validation and determination of applications. This will ensure that applications are “fit for purpose”
  and minimise the need for the submission of information at a later stage. This in turn will enable the
  Local Authority to provide an efficient planning service and help to achieve targets for the determination
  of planning applications. 2. Pre-Application Advice Rotherham Council offers an effective and efficient
  pre-application service. All applicants/agents are encouraged to seek pre-application advice. This is
  particularly relevant for larger, more complex, or potentially controversial proposals. This should
  help applicants identify the information and details that need to be submitted with their application.
  Such an approach can help minimise delays later in processing the application and identify whether other
  consents may be required. The Council will not entertain significant amendments to schemes once they
  have been submitted. The NPPF also encourages pre-application discussions; it states early engagement
  has the potential to improve the efficiency and effectiveness of the planning application system. Such
  discussions should also involve local communities where relevant. For more information on the pre-application
  service, please use this link below: https://www.rotherham.gov.uk/planning-applications/get-advice-planning-proposals/4
  There is a charge for providing pre-application advice and the fee for this service depends on the scale
  of development. Further information on pre application fees can be found on the Council’s website: Planning
  applications – Rotherham Metropolitan Borough Council 3. Validation Procedure All applications received
  by Rotherham Council will be checked against the Statutory national information requirements, and the
  Local information requirements (Local List). Most minor applications will be reviewed to ensure they
  are complete and incorporate adequate information to validate the submission within 3 to 5 working days
  from the date of receipt and most major applications within 10 working days. Rotherham Metropolitan
  Borough Council Planning Application Validation Checklist 2026 2 4. Invalid Applications Where an application
  is submitted but deemed invalid under the requirements of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015, applicants will be informed in writing and details given
  of the information which is needed to make the application valid. Where an application is not accompanied
  by information required by our local list, applicants should provide a short-written justification with
  the application as to why it is not appropriate in the particular circumstances. Some of the validation
  criteria will only become apparent once a site visit has been carried out (e.g. the presence of trees
  on site). This may result in an apparently valid application being declared invalid at a later stage
  of the process, so it is important that all questions on the application form are answered correctly,
  and information is accurate and up to date. In circumstances where an applicant does not agree with
  our requirement for an item, they should discuss the point of concern with us. Where an item specified
  in the local list has not been provided, or discussions fail to resolve the point of concern, there
  is a procedure in the Development Management Procedure Order to resolve such disputes (using an Article
  12 Notice, which may be submitted at any time during the course of the application) explaining why the
  information requested is not required in the particular circumstances of their application. The Council
  will consider any written justification and either agree that the information is not required and validate
  the application or invalidate the application where it can be demonstrated that the additional information
  is necessary to determine the application. If the dispute cannot be resolved the applicant has the right
  of appeal against non- determination on grounds of invalidity once the 8/13 weeks (16 weeks subject
  to Environmental Impact Assessments) determination period, starting with the date of receipt of the
  application, has elapsed. The Planning Inspectorate will determine these cases, the inspector will consider
  both the dispute regarding invalidity and the merits of the application itself. 5. Electronic Submissions
  The preferred method of receiving applications is electronically and should be submitted via the Planning
  Portal at www.planningportal.gov.uk or to development.management@rotherham.gov.uk The national standards
  for online submission of electronic planning documents are as follows: Maximum single or combined file
  size is 15 Megabytes file size (the sum of all document file sizes). All drawings shall include a scale
  bar and key dimensions, paper size and scale (for example 1:1250 at A3) to allow for electronic scaling/measuring.
  All plans and supporting documents should be clearly labelled. All photographs should be submitted in
  PDF file format. Rotherham Metropolitan Borough Council Planning Application Validation Checklist 2026
  3 6. Paper Submissions If you are unable to submit your planning application electronically the Council
  will require one paper copy of the planning application form, a copy of all the above plans and one
  paper copy of all the documents required as part of the Local Information Requirements (Local list)
  7. Information Required for Planning Applications There are two parts to the requirements for the validation
  of planning applications: Part One relates to the Statutory National Requirements relating to all application
  types; Part Two is the Local Information Requirements (Local list) which differs for different application
  types/scales of development. Rotherham Metropolitan Borough Council Planning Application Validation
  Checklist 2026 4 PART ONE: STATUTORY NATIONAL REQUIREMENTS The Town and Country Planning (Development
  Management Procedure) (England) Order 2015 requires the following forms, plans, and information to be
  submitted with all applications unless otherwise stated. The requirements are as below: 8. Planning
  Application Forms Planning applications should be made on the relevant planning application form and
  submitted electronically via the Planning Portal or at development.management@rotherham.gov.uk The standard
  (1APP) application form should be used for all applications. All planning application forms are available
  to download at the Planning Portal. All forms must be signed and dated with all relevant sections completed.
  9. Fee The Planning Portal’s websites sets out the current fee schedule and exemptions. The Planning
  Portal’s fee calculator can be used to calculate the correct fee. For information on how to pay the
  planning application fee please refer to the Council’s website at the link below: https://www.civicaepay.co.uk/RotherhamEstore/estore/default/Catalog/Index?newSe
  arch=False 10. Elevations, Cross Sections and Floor Plans Submitting detailed plans is one of the key
  elements of a valid application. Therefore, it is essential that the drawings are clear and accurate
  and of a suitable standard.'
