reference: design-and-access-statement
local-authority: ROT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with 100 square metres or more of floor space.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement (DAS) must accompany the following applications: • All applications
  for major development (as defined in Article 2 of the Town and Country Planning (Development Management
  Procedure) (England) Order 2015; or • If within a designated area (Conservation Area or World Heritage
  Site) for development consisting of one or more dwellings or a building or buildings with a floor space
  of 100 square metres or more.'
must-include:
- item: Building for a Healthy Life assessment, responding to and expanding on its 12 considerations
  level: should
  required-if:
    any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: A site area in excess of 0.5 ha.
  source-text: The Building for a Healthy Life Assessment should be incorporated into the Design and Access
    Statement. The assessment should respond to and expand upon the 12 considerations set out in Building
    for a Healthy Life.
confidence: medium
notes: 'From the council''s list (published May 2026), section 16, page 7. The Building for a Healthy
  Life item comes from section 23 (page 11): ''All major residential development (full and outline)''
  and ''A site area in excess of 0.5 Ha''.'
review-status: unverified
field-status: {}
