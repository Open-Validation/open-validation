reference: design-and-access-statement
local-authority: ROT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The development consists of one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floorspace of 100 square metres or more.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: 'Design and Access Statement A Design and Access Statement (DAS) must accompany the following
  applications: All applications for major development (as defined in Article 2 of the Town and Country
  Planning (Development Management Procedure) (England) Order 2015; or If within a designated area (Conservation
  Area or World Heritage Site) for development consisting of one or more dwellings or a building or buildings
  with a floor space of 100 square metres or more.'
confidence: medium
review-status: unverified
field-status: {}
