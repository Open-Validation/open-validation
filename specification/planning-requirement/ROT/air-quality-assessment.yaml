reference: air-quality-assessment
local-authority: ROT
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within, adjacent to or impacting on an Air Quality Management Area.
  - all:
    - condition:
        field: direct-air-emissions
        value: true
        description: Certain industrial processes, e.g. waste recycling, sewage treatment works, furnace
          or combustion processes.
    - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: All sites within, adjacent or impacting on Air Quality Management Areas (AQMA) or where a
  development would result in air quality issues such as certain industrial processes for example waste
  recycling, sewage treatment works, furnace, or combustion processes.
must-include:
- item: Existing air quality and the impact of additional emissions from the development (such as traffic
    emissions)
  level: must
- item: Action to mitigate air quality impact and public exposure to air pollution
  level: must
- item: Scope and methodology discussed and approved by RMBC Regulatory Services beforehand
  level: should
confidence: medium
notes: From the council's list (published May 2026), section 22, page 11. Whether a development 'would
  result in air quality issues' is a judgement, so the industrial-process trigger is shown with 'discretionary'.
review-status: unverified
field-status: {}
