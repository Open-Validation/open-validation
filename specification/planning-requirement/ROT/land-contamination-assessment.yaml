reference: land-contamination-assessment
local-authority: ROT
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected due to the nature of the previous use of the site.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable.
    - discretionary
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: Any Minor/Major application where contamination is known or suspected due to the nature of
  the previous use of the site or the proposed use would be particularly vulnerable.
must-include:
- item: Phase 1 Desk Study, Site Walkover and Initial Risk Assessment, following the YHPAC Technical Guide
  level: must
- item: Not needed if evidence shows the site was previously remediated, the remediation verified, and
    the development won't undermine it
  level: should
- item: 'Minor/householder applications without a phase 1 report: sufficient evidence that contamination
    is unlikely due to previous uses'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published May 2026), section 26, page 13. A particularly vulnerable proposed
  use on a site with no known contamination is a judgement, so it shows with 'discretionary'. Scope is
  best agreed with the Contaminated Land Officer.
review-status: unverified
field-status: {}
