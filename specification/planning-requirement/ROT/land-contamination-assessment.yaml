reference: land-contamination-assessment
local-authority: ROT
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected due to the previous use of the site.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be particularly vulnerable to contamination.
source-url: https://www.rotherham.gov.uk/downloads/file/5034/local-validation-requirements-word-
source-text: 'Householder: Where minor/householder applications are not supported by a phase 1 desk study
  report and/or phase II site investigation report and if required a remediation/method statement, sufficient
  evidence should be provided to indicate that there is no contamination likely to be present on the site,
  due to the previous uses.


  Full planning: Contaminated Land Assessment Required for: ◦ Any Minor/Major application where contamination
  is known or suspected due to the nature of the previous use of the site or the proposed use would be
  particularly vulnerable.'
confidence: medium
notes: '''Any Minor/Major application where contamination is known or suspected due to the nature of the
  previous use of the site or the proposed use would be particularly vulnerable.'' Minor and householder
  applications without a desk study must give enough evidence that contamination is unlikely.'
