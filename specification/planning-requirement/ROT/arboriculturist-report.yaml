reference: arboriculturist-report
local-authority: ROT
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges on the site, or on adjacent land, that could influence or be affected
        by the development (including street trees).
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: BS5837 'Trees in relation to construction'; Trees SPD
source-text: When there are trees and hedges on an application site, or on land adjacent to it that could
  be influenced or be affected by the development (including street trees), information will be required
  on which trees/hedges are to be retained and on the means of protecting them during construction works.
  This information should be prepared by a qualified arboriculturist.
must-include:
- item: Which trees/hedges are to be retained and how they will be protected during construction
  level: must
- item: Utility statement showing routes planned to avoid damage to trees/hedges
  level: must
- item: 'Tree survey details for each tree: reference number on the survey plan, species (common and scientific),
    height, stem diameter at 1.5 m, branch spread at the four cardinal points, crown clearance, age class,
    physiological and structural condition, preliminary management recommendations, estimated remaining
    contribution, and R or A to C category'
  level: must
- item: Root protection areas, tree constraints plan, construction exclusion zones and tree protection
    plan
  level: must
- item: Arboricultural implication assessment and arboricultural method statement
  level: must
- item: Existing and proposed contours and levels
  level: must
- item: 'Works to protected trees (TPO or conservation area): report by a tree professional with replacement
    planting details (species, numbers, positions, preparation, size, support, irrigation and maintenance)'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (published May 2026), section 45, page 25. Where felling or tree works
  may affect a protected species, a survey by an ecologist is strongly advised.
review-status: unverified
field-status: {}
