reference: application-form
local-authority: ROT
required-if:
  always: true
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The standard (1APP) application form should be used for all applications. All planning application
  forms are available to download at the Planning Portal. All forms must be signed and dated with all
  relevant sections completed.
must-include:
- item: Signed and dated, with all relevant sections completed
  level: must
- item: Ownership certificate A, B, C or D completed (also for listed building consent and conservation
    area consent for demolition)
  level: must
- item: Notice to all owners completed and served in accordance with Article 11 of the DMPO, where needed
  level: must
- item: Agricultural land declaration signed (certifying any agricultural tenants have been notified,
    or that there are none)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
      - change-of-use
confidence: medium
notes: From the council's list (published May 2026), section 8, 13 and 14, page 5. The agricultural land
  declaration isn't needed for reserved matters, renewal of temporary permission, discharge or variation
  of conditions, tree preservation orders, conservation area consent for demolition, listed building consent,
  lawful development certificates, agricultural or forestry prior notification, non-material amendments
  or advertisement consent. The fee (section 9) is also a national requirement.
review-status: unverified
field-status: {}
