reference: fire-statement
local-authority: ROT
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for relevant buildings which: • Contain two or more dwellings or educational accommodation
  and • Meet the height condition of 18m or more in height, or 7 or more storeys'
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect), with the particulars
    it asks for
  level: must
- item: Fire safety principles, concepts and approach applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and how it has been taken into account
  level: must
- item: How fire safety policies in local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (published May 2026), section 28, page 14.
review-status: unverified
field-status: {}
