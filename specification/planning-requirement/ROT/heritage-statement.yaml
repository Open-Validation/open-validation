reference: heritage-statement
local-authority: ROT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building-setting
      - scheduled-monument
      description: Affects the setting of a listed building or ancient monument.
  - site:
      in:
      - conservation-area
      description: Within or adjacent to the Conservation Area.
  - site:
      in:
      - locally-listed-building
      description: Affects a site on the local heritage list.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: Applications for Listed Building Consent. • Applications affecting setting of a listed building
  or ancient monument. Rotherham Metropolitan Borough Council Planning Application Validation Checklist
  2026 18 • Applications on sites located within or adjacent to the Conservation Area. • Applications
  affecting sites on the local heritage list.
must-include:
- item: 'Listed building consent: a schedule of works; analysis of the significance of archaeology, history
    and character of the building; the principles of and justification for the works; and their impact
    on the listed building, its setting and adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Planning permission in conservation areas: a structural survey; analysis of the character and
    appearance of the building; the principles of and justification for the proposed demolition; and its
    impact on the character of the area'
  level: should
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Demolition is proposed.
confidence: medium
notes: From the council's list (published May 2026), section 33, page 18. The contents items are 'likely
  to be required', so they are 'should'; detail varies case by case, so discuss with the Conservation
  Officer.
review-status: unverified
field-status: {}
