reference: flood-risk-assessment
local-authority: ROT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater.
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Development or change of use to a more vulnerable class.
    - discretionary
  - site:
      in:
      - critical-drainage-area
      description: The Environment Agency, Internal Drainage Board and/or other bodies have indicated
        there may be drainage problems.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: Planning applications for development proposals of 1 hectare or greater in Flood Zone 1 and
  all proposals for new development located in Flood Zones 2 and 3 shall be accompanied by an Flood Risk
  Assessment.
must-include:
- item: The risks of all forms of flooding to and from the development identified and assessed
  level: must
- item: How the flood risks will be managed, taking climate change into account
  level: must
- item: 'Major development in Flood Zone 1: opportunities to reduce the probability and consequences of
    flooding'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published May 2026), section 29, page 15. Also needed where the development
  or a change to a more vulnerable class 'may be subject to other sources of flooding', a judgement shown
  as discretionary, or where drainage problems have been indicated.
review-status: unverified
field-status: {}
