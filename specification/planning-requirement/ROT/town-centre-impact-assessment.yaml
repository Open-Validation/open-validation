reference: town-centre-impact-assessment
local-authority: ROT
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses in edge of centre or out of centre locations (Sequential Test).
  - all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Proposed floorspace exceeds 500 sqm (Impact Test).
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside a defined centre.
source-url: https://www.rotherham.gov.uk/downloads/file/5033/local-validation-requirements-pdf-
source-text: A Sequential Test will be required for any main town centre uses ( in edge of centre or out
  of centre locations. • An Impact Test will be required if the proposed floorspace exceeds 500sqm.
must-include:
- item: 'Sequential Test: evidence that there are no more central sites for the development'
  level: must
- item: 'Sequential Test: evidence that the location(s) are accessible'
  level: must
- item: 'Impact assessment: the need for the development, evidence of appropriate scale, and no unacceptable
    impacts on existing centres'
  level: must
  required-if:
    any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Retail or leisure development of over 500 square metres gross floorspace.
    - discretionary
confidence: medium
notes: From the council's list (published May 2026), section 39, page 22. A smaller development 'likely
  to have a significant impact on a smaller centre' also needs the impact assessment, a judgement shown
  as discretionary.
review-status: unverified
field-status: {}
