reference: fire-statement
local-authority: ECA
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://eastcambs.gov.uk/sites/default/files/2026-07/Validation%20Document%20for%20web%20proof%20links%20%284%29.pdf
source-text: 'Fire Statements … Only required for the following: … Proposals that include creation, development
  of existing or in the curtilage of a ‘relevant building’.'
confidence: medium
notes: 'Audit (wrong_trigger, other): the excerpt was mixed with the Drawings entry. A ''relevant building''
  is the national definition (18m+ or 7+ storeys with 2+ dwellings or educational accommodation). This
  is a Section 3 national requirement.'
review-status: unverified
field-status: {}
