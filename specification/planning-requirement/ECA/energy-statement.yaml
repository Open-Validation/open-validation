reference: energy-statement
local-authority: ECA
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Buildings of 1,000 square metres or more gross external.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Residential development of 5 or more units.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential sites of 0.5 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Any site of 1 hectare or more.
