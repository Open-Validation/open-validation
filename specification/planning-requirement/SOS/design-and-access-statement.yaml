reference: design-and-access-statement
local-authority: SOS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: In a designated area (a World Heritage Site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: '• Applications for major development. • Applications for development in a designated area,
  where the proposed development consists of: • • one or more dwellings; or • a building or buildings
  with a floor space of 100 square metres or more. Applications for listed building consent. For the purposes
  of Design and Access Statements, a designated area means a World Heritage Site or a conservation area.
  Applications for waste development, a material change of use, engineering or mining operations do not
  need to be accompanied by a Design and Access Statement. Applications to amend the conditions attached
  to a planning permission do not need to be accompanied by a Design and Access Statement.'
must-include:
- item: Level of detail proportionate to the complexity of the application
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 10. N4. Not needed for waste development, a
  material change of use, engineering or mining operations, or applications to amend conditions. The list
  points to GOV.UK guidance for the national contents.
review-status: unverified
field-status: {}
