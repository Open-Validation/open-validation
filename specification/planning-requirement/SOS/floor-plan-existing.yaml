reference: floor-plan-existing
local-authority: SOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - condition:
      field: building-works
      value: true
      description: New or amended floorspace, or alterations to existing buildings.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new or amended floorspace and/or proposals to alter existing buildings
  (except outline applications).
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Existing and proposed buildings in context with adjacent buildings (including property numbers
    where applicable)
  level: must
- item: Any existing walls or buildings to be demolished highlighted
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 14. L3. The list excludes outline applications;
  the rule shows the other application types that can include building works (householder, full, reserved
  matters, listed building consent).
review-status: unverified
field-status: {}
