- item: Relates to the whole site, where a Travel Plan is needed because existing and proposed development
    together reach the threshold
  level: should
confidence: medium
notes: 'From the council''s list (published July 2023), page 29-31. L29 includes a Travel Plan Statement
  and L30 a Travel Plan, at the Appendix 1 thresholds. Travel Plans may also be needed below the thresholds
  (lower parking, parking stress or congestion, significant traffic impact, mixed-use or phased development,
  extensions), shown as discretionary; requirements should be agreed at pre-application stage. Appendix
  1 (page 35) sets the thresholds: Transport Statement from hotels of 50 bedrooms, C2 of 50 students or
  30 hospital beds, 20 dwellings, 1,500 sq m of business E(g) or financial services E(c), 2,500 sq m B2,
  3,000 sq m B8, 800 sq m food retail, non-food retail or food/drink, and all school/nursery developments;
  Transport Assessment from 100 bedrooms, 150 students or 50 beds, 50 dwellings, 2,500 sq m E(g)/E(c),
  4,000 sq m B2, 5,000 sq m B8, 1,000 sq m food retail, 1,500 sq m non-food retail, 2,500 sq m food/drink,
  and any new school or higher/further education facility. For other uses the council asks to be contacted,
  shown as discretionary.'
