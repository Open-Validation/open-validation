reference: travel-plan
local-authority: SOS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 20
      description: 20 or more dwellings (Travel Plan Statement with a Transport Statement; Travel Plan
        with a Transport Assessment from 50).
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 2500
      description: 2,500 square metres or more of business floorspace.
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
confidence: medium
notes: 'Audit (duplicate, wrong_trigger): the workbook repeated the Transport Statement row. L29 Transport
  Statement includes a Travel Plan Statement and L30 Transport Assessment includes a Travel Plan, so the
  same Appendix 1 thresholds apply.'
review-status: unverified
field-status: {}
