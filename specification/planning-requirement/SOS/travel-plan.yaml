reference: travel-plan
local-authority: SOS
required-if:
  any:
  - any:
    - all:
      - condition:
          field: hotel-development
          value: true
          description: Hotel (C1).
      - condition:
          field: bedroom-count
          operator: '>='
          value: 50
          description: 50 bedrooms or more.
    - all:
      - condition:
          field: use-class
          value: residential-education
          description: Residential institution (C2) with students.
      - condition:
          field: residential-capacity
          operator: '>='
          value: 50
          description: 50 or more students.
    - all:
      - condition:
          field: use-class
          value: hospital-nursing-home
          description: Residential institution (C2) with hospital beds.
      - condition:
          field: residential-capacity
          operator: '>='
          value: 30
          description: 30 or more hospital beds.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 20
        description: Residential development (C3) of 20 dwellings or more.
    - all:
      - condition:
          field: use-class
          value: business
          description: Business development E(g).
      - condition:
          field: floorspace
          operator: '>='
          value: 1500
          description: 1500 sq m or more.
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Financial services E(c).
      - condition:
          field: floorspace
          operator: '>='
          value: 1500
          description: 1500 sq m or more.
    - all:
      - condition:
          field: use-class
          value: general-industrial
          description: General industrial development B2.
      - condition:
          field: floorspace
          operator: '>='
          value: 2500
          description: 2500 sq m or more.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 3000
        description: Storage and distribution (B8) of 3000 sq m or more.
    - condition:
        field: convenience-retail-floorspace
        operator: '>='
        value: 800
        description: Food retail E(a) of 800 sq m or more.
    - condition:
        field: comparison-retail-floorspace
        operator: '>='
        value: 800
        description: Non-food retail E(a) of 800 sq m or more.
    - all:
      - any:
        - condition:
            field: use-class
            value: restaurant-cafe
            description: Food/drink E(b).
        - condition:
            field: use-class
            value: hot-food-takeaway
            description: Food/drink (sui generis).
        - condition:
            field: use-class
            value: drinking-establishment
            description: Food/drink (sui generis).
      - condition:
          field: floorspace
          operator: '>='
          value: 800
          description: 800 sq m or more.
    - condition:
        field: use-class
        value: school-nursery
        description: Any school or nursery development (education F1(a); creche, day nursery or day centre
          E(f)).
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: 'Travel Plans may also be required in specific circumstances for developments below the thresholds
  shown in table above. For example: • Where a development is seeking to rely upon a Travel Plan to justify
  a lower level of parking than required by local planning policy. • Where a development is proposed in
  a sensitive area of parking stress, or traffic congestion.'
