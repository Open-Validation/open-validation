reference: town-centre-impact-assessment
local-authority: SOS
required-if:
  all:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail, leisure or office development over 2,500 sq m.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside the town centre (the Town Centre Primary Shopping Area on the Policies Map).
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: Retail, leisure or office developments over 2500sqm outside the town centre (the area shown
  as the “Town Centre Primary Shopping Area” on the Policies Map included in the emerging Southend Central
  Area Action Plan).
must-include:
- item: The reasons for the chosen site in the context of the NPPF Sequential Test
  level: must
- item: The impact on town centre vitality and viability, and on other centres
  level: must
- item: The impact on any Local Plan allocated sites outside the town centre
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 26. L22 'Retail, Leisure or Office Sequential
  Test and Impact Assessment'.
review-status: unverified
field-status: {}
