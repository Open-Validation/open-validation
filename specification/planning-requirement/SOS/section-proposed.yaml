reference: section-proposed
local-authority: SOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change in ground levels, development next to changing ground levels, or a sloping
          site.
    - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'For any application (except outline applications) where: • A change in ground levels is
  involved or where development is proposed next to changing ground levels. • The development is on a
  sloping site or where ground levels are a critical issue in terms of the design.'
must-include:
- item: Cross section(s) through the existing and proposed building(s) at a scale of 1:50 or 1:100
  level: must
- item: How the development relates to existing and finished floor and site levels, with levels related
    to a fixed datum point off site
  level: must
- item: The relationship of the development to site boundaries and neighbouring buildings
  level: must
- item: Existing and proposed foundations and eaves, where a change is proposed
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 15. L5 'Existing and Proposed Sections (including
  existing and finished floor and site levels)'. Whether ground levels are 'a critical issue in terms
  of the design' is a judgment, shown as discretionary. The list excludes outline applications; the rule
  shows the other application types that can include building works (householder, full, reserved matters,
  listed building consent).
review-status: unverified
field-status: {}
