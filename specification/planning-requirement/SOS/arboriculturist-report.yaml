reference: arboriculturist-report
local-authority: SOS
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within or adjacent to the site that could influence or be affected by the development.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: All tree work applications and any application where there are trees, within or adjacent
  to a site that could influence or be affected by the proposed development.
must-include:
- item: All trees shown on the Site Plan
  level: should
- item: An Arboricultural Statement in accordance with BS5837
  level: should
- item: A comprehensive survey of all existing trees
  level: should
- item: Trees to be removed or retained, and proposed works to existing trees
  level: should
- item: Replacements, where applicable
  level: should
- item: How retained trees will be protected during development
  level: should
- item: An Arboricultural Method Statement, if development takes place within the root protection area
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 18. L9 'Arboricultural/ Tree Survey'. Check
  for Tree Preservation Orders before any work begins. A report from a qualified person is needed to fell
  preserved trees because of alleged structural damage (see structural-damage).
review-status: unverified
field-status: {}
