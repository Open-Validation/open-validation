reference: viability-assessment
local-authority: SOS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: Residential development exceeding 10 units.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: Residential development exceeding 1,000 sq m gross internal area.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007) policies CP6 and CP8, Development Management DPD (2015), SPD1,
  SPD2
source-text: For all residential development that exceeds 10 units or a gross floorspace of 1,000 square
  metres (gross internal area).
must-include:
- item: A financial viability assessment using the residual valuation method, fully supported with evidence
  level: must
- item: An executive summary setting out gross development value, benchmark land value including landowner
    premium, costs and return to developer
  level: must
  source-text: An executive summary must set out the gross development value, benchmark land value including
    landowner premium, costs (as set out in national guidance where applicable) and return to developer.
- item: The executive summary refers back to the viability assessment that informed the plan and summarises
    what has changed
  level: should
- item: The proposed developer contributions and how they compare with policy requirements
  level: should
- item: Prepared on the basis that it will be made publicly available (at least an executive summary,
    other than in exceptional circumstances)
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 33. L32. A written undertaking to cover the
  cost of independent financial advice is likely to be required where the council needs to assess viability.
review-status: unverified
field-status: {}
