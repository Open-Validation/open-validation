reference: flood-risk-assessment
local-authority: SOS
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - site:
      in:
      - critical-drainage-area
      description: In flood zone 1 with critical drainage problems as notified by the Environment Agency.
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: 'You need to do a flood risk assessment for developments within one of the following categories:
  • In flood zone 2 or 3 including minor development and change of use; • more than 1 hectare (ha) in
  flood zone 1; • less than 1 ha in flood zone 1, including a change of use in development type to a more
  vulnerable class (for example from commercial to residential), where they could be affected by sources
  of flooding other than rivers and the sea (for example surface water drains, reservoirs); and in an
  area within flood zone 1 which has critical drainage problems as notified by the Environment Agency.'
must-include:
- item: An assessment of the risks of all forms of flooding to and from the development and how they will
    be managed, taking climate change into account
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: The ability of the scheme to include SuDS as part of the surface water drainage strategy
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: Evidence that the Sequential and Exception Tests have been met, where required
  level: must
  source-text: Evidence that demonstrates, that where required, the Sequential and Exception Test of the
    NPPG have been met.
confidence: medium
notes: From the council's list (published July 2023), page 23. L15 'Flood Risk Assessment (including Drainage
  Strategy)'. Sites under 1 hectare in flood zone 1 need an FRA only if they could be affected by other
  sources of flooding, a judgment shown as discretionary.
review-status: unverified
field-status: {}
