reference: location-plan
local-authority: SOS
required-if:
  always: true
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: Scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Shows the direction of North
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: must
- item: A linear scale bar
  level: must
  source-text: the Council requires a linear scale bar to be included on all plans, to ensure accurate
    electronic scaling and measuring.
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 9. N3.
review-status: unverified
field-status: {}
