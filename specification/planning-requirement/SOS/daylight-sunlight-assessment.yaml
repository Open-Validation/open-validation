reference: daylight-sunlight-assessment
local-authority: SOS
required-if:
  any:
  - discretionary
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential development (10 or more dwellings).
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: a) Applications where there may be a potential adverse impact on current levels of sunlight
  and daylight or increased overshadowing of adjoining properties or buildings, including associated gardens
  or amenity space. Applications for any major residential development to assess the internal daylight
  conditions of new residential units and the overshadowing of proposed amenity space.
must-include:
- item: Diagrammatic and technical information on how the development will affect neighbours' sunlight,
    daylight and overshadowing in all four seasons
  level: must
  required-if: discretionary
- item: Diagrammatic and technical information on daylight and overshadowing in the new residential units
    and their amenity space
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential development (10 or more dwellings).
confidence: medium
notes: From the council's list (published July 2023), page 22. L14. A 'potential adverse impact' is a
  judgment, shown as discretionary. Major residential development is 10 or more dwellings (the list's
  definition, page 6).
review-status: unverified
field-status: {}
