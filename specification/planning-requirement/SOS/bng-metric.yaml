reference: bng-metric
local-authority: SOS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: The Environment Act 2021 and related secondary legislation, policy and guidance
source-text: 'From 1 November 2023: For all major applications, a statement should be submitted to demonstrate
  that the proposed development will deliver at least 10% net gain increase from the pre-development biodiversity
  value, calculated using the most current published version of the Biodiversity Metric produced by Natural
  England. From 1 April 2024: All developments will be subject to the above requirement, unless specifically
  exempted by secondary legislation, policy and guidance,'
must-include:
- item: The pre-development biodiversity value
  level: must
- item: The proposed approach to enhancing biodiversity on-site
  level: must
- item: Any proposed off-site biodiversity enhancements (including statutory credits) planned or arranged
    for the development
  level: must
- item: Calculated with the most current published Biodiversity Metric, following CIRIA/CIEEM/IEMA best
    practice principles
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 20. L10b. The list was written before the statutory
  biodiversity gain condition began (major from 12 February 2024, others from 2 April 2024) and uses the
  planned dates; the rule follows the law (the biodiversity gain condition), so householder and other
  exempt applications are left out. The statement itself has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
