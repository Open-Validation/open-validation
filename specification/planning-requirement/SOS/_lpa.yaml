validation-list:
  url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
  date: 2023-07
  date-basis: 'Cover: ''Local List of Planning Validation Requirements July 2023''; PDF last modified
    23 August 2023. It is the only document on the council''s Local Validation List page (https://www.southend.gov.uk/downloads/download/258/revision_of_the_local_validation_list),
    which the Make a planning application page (https://www.southend.gov.uk/make-planning-application/make-planning-application-2)
    links as the Local List of Planning Validation Requirements, checked 2026-11-06. The council''s planning
    policy consultations page shows no live consultation; the Your Say Southend consultation site (yoursay.southend.gov.uk)
    could not be reached from this research environment. Over 2 years old, so outdated. Page numbers in
    the requirement notes are the list''s printed page numbers.'
  status: outdated
submission-standards:
- item: All plans drawn to an identified standard metric scale, titled according to their content, labelled
    with the original size of the document and scale (e.g. 1:100 @ A1), on a white background with dark,
    preferably black, ink
  level: must
- item: A linear scale bar on all plans, for accurate electronic scaling and measuring
  level: must
- item: 'Paper applications: 3 copies of the application form, plans, drawings and information (4 including
    the original set); not needed for electronic submissions'
  level: must
- item: For major/complex applications, additional sets of documents (including a USB memory stick version)
    may be requested
  level: should
- item: Where the applicant considers an item is not needed, this is set out clearly in the application
  level: should
- item: Confidential documents clearly marked, with the reason for the sensitivity
  level: should
- item: Amended plans clearly identify the changes from the original proposal and come with a list of
    all submitted and superseded drawing numbers
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot links the current July 2023 list (still the latest published), but dates it March 2023
    from PDF metadata. Its extraction is weak: about 14 local requirements are missing, several triggers
    are garbled or taken from other items (e.g. Noise uses the lighting text), Householder/LBC/Works to
    trees are wrongly shown as having no local requirements, and elevations are wrongly placed under Outline.
    Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: March 2026 LGR decision for Essex, Southend-on-Sea and Thurrock WITHDRAWN 7 Sep
