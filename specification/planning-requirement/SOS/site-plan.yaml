reference: site-plan
local-authority: SOS
required-if:
  condition:
    field: footprint-change
    value: true
    description: The footprint of the building(s) on site would change.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except where there is no proposed change to the footprint of the building(s)
  on site, or the application is for outline planning permission. For applications for outline planning
  permission, the block plan will only need to show the relevant level of detail as required under article
  5(3) of the Development Management Procedure Order 2015 (as amended).
must-include:
- item: At a scale of 1:500 or 1:200
  level: must
- item: Direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written dimensions including those to the boundaries
  level: must
- item: Existing and proposed parking, cycle storage and vehicle/pedestrian access arrangements
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements, unless they
    would not influence or be affected by the development
  level: must
- item: All public rights of way crossing or adjoining the site, unless they would not influence or be
    affected by the development
  level: must
- item: The position of all trees on the site and on adjacent land, unless they would not influence or
    be affected by the development
  level: must
- item: The extent and type of any hard surfacing and soft landscaping
  level: must
- item: The type and height of boundary treatments (e.g. walls, fences)
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 13. L1 'Existing and Proposed Block (Site)
  Plan'. For outline applications the block plan only needs the detail required under article 5(3) of
  the DMPO.
review-status: unverified
field-status: {}
