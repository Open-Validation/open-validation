reference: planning-statement
local-authority: SOS
required-if:
  any:
  - ref: major-development
  - condition:
      field: loss-of-use
      value: true
      description: Loss of employment premises/land, or loss of retail in a protected frontage.
  - condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing.
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of sport/leisure/recreation facilities or green/open space.
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: DMPO, Technical Housing Standards (2015), NPPF, NPPG, Core Strategy (2007), Development Management
  DPD (2015)
source-text: 'For all applications involving major development, and any other application that involves
  a key policy consideration such as: • Loss of employment premises/land • Affordable housing. • Loss
  of retail in a protected frontage. • Loss of sport/leisure/recreation facilities or green/open space.
  Community benefits such as regeneration or job creation.'
must-include:
- item: A full explanation of the proposal, including any relevant background or site history
  level: must
- item: How the proposal accords with national planning policy, Technical Housing Standards, the Local
    Plan and any other supplementary planning guidance, development briefs or corporate policy guidance
  level: must
- item: The context and need for the development, including justification for any change of use (e.g.
    marketing evidence for the loss of a protected use) where appropriate
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 17. L7 'Supporting Planning Statement'. The
  key policy considerations are examples ('such as'), so the rule keeps a discretionary part next to the
  ones named; community benefits such as regeneration or job creation have no field.
review-status: unverified
field-status: {}
