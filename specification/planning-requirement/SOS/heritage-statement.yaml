reference: heritage-statement
local-authority: SOS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      description: Affecting a listed building, Conservation Area or Scheduled Monument.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: For any application affecting a listed building, Conservation Area or Scheduled Monument.
must-include:
- item: A detailed schedule of the proposed work
  level: should
- item: A Structural Survey for significant work
  level: should
  required-if: discretionary
- item: The significance of the archaeology, history and character of the building/structure or area
  level: should
- item: The principles of and justification for the works, their impact on the special interest, and any
    mitigation
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 24. L18.
review-status: unverified
field-status: {}
