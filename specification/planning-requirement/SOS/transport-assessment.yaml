reference: transport-assessment
local-authority: SOS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 20
      description: 20 or more dwellings (Transport Statement 20-49; Transport Assessment 50+).
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 2500
      description: 2,500 square metres or more of business floorspace (Transport Assessment).
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
source-text: Transport Statement (including Travel Plan Statement) … A transport statement will be required
  for development with relatively small transport implications as set out in Appendix 1.
confidence: medium
notes: 'Audit (wrong_trigger): the L30 Transport Assessment (significant transport implications) was missing.
  From the audit, Appendix 1 thresholds include residential Transport Statement 20-49 dwellings, Transport
  Assessment 50+ dwellings, 100+ hotel bedrooms and 2,500+ sqm business. The rest of Appendix 1 is shown
  as officer discretion.'
review-status: unverified
field-status: {}
