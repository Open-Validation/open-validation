reference: elevation-existing
local-authority: SOS
required-if:
  all:
  - any:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
    - all:
      - application-type:
          in:
          - outline-some
      - discretionary
  - any:
    - condition:
        field: new-build
        value: true
        description: A new building.
    - condition:
        field: external-alterations
        value: true
        description: Alterations to the exterior of existing buildings.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new building or alterations to the exterior of existing buildings
  (except outline applications where ‘appearance’ is reserved).
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: All sides of the proposal
  level: must
- item: The proposed works in relation to what is already there
  level: must
- item: The relationship between the site and any adjoining buildings in close proximity
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 14. L2. Outline applications are excluded where
  appearance is reserved; for outline applications with some matters reserved it depends on whether appearance
  is reserved, so that part shows as discretionary.
review-status: unverified
field-status: {}
