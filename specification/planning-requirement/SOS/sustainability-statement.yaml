reference: sustainability-statement
local-authority: SOS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Additional residential units.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Additional commercial units.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015) policy DM2, SPD1 Design &
  Townscape Guide
source-text: All new development that creates additional residential and/or commercial units
must-include:
- item: Sustainable design and construction measures showing the development will be energy efficient
    (using the energy hierarchy) and resource efficient, in line with DM DPD policy DM2 (as relevant)
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 28. L26. 'Additional commercial units' is shown
  as new non-residential floorspace.
review-status: unverified
field-status: {}
