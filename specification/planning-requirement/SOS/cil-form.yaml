reference: cil-form
local-authority: SOS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates a new dwelling of any size.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: Creates 100 sq m or more of new build floorspace (before deducting floorspace to be
        demolished) in buildings people normally go into.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: The Community Infrastructure Levy Regulations 2010 (as amended)
source-text: 'Any application for development that: • Creates a new dwelling of any size; or • creates
  100sqm or more of new build floorspace (before making any deductions for existing floorspace that is
  to be demolished); and involves new buildings or floorspace into which people normally go.'
must-include:
- item: Completed ‘CIL Additional Information Requirement Form’
  level: must
- item: The CIL Assumption of Liability and any claims for exemption or relief (advisable, not a validation
    requirement)
  level: should
confidence: medium
notes: From the council's list (published July 2023), page 21. L12.
review-status: unverified
field-status: {}
