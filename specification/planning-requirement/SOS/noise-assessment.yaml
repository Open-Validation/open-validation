reference: noise-assessment
local-authority: SOS
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive uses in proximity to significant noise sources (such as a railway line,
        main road, MOD testing area, service yard, industrial development or substantial car park).
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: NPPF, NPPG, Core Strategy (2007), Development Management DPD (2015)
source-text: Where noise may have a significant impact on existing or proposed residential amenity e.g.
  bar/nightclub use; or where noise sensitive uses are in proximity to significant noise sources such
  as a railway line, main road, MOD testing area, service yard, industrial development or substantial
  car park.
must-include:
- item: A report by a suitably qualified person assessing the noise impact on existing and proposed properties,
    with any mitigation
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 25. L20 'Noise Impact Assessment/ Acoustic
  Report'. 'Significant impact' is a judgment, shown as discretionary.
review-status: unverified
field-status: {}
