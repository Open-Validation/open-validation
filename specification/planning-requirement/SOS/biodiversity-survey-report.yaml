reference: biodiversity-survey-report
local-authority: SOS
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: The development will affect a protected wildlife site (SAC, SPA, Ramsar, SSSI, Marine
        Conservation Zone, or a locally protected nature reserve, wildlife site or geological site).
  - condition:
      field: protected-species
      value: true
      description: Likely significant impact on protected species, habitats or biodiversity.
  - discretionary
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: The Conservation of Habitats and Species Regulations 2010 (as amended), NPPF, NPPG, Core Strategy
  (2007), Development Management DPD (2015)
source-text: 'Where the development will affect protected wildlife sites: • Special Area of Conservation
  (SAC) • Special Protection Areas (SPA) • Ramsar Wetland • Site of Special Scientific Interest (SSSI)
  • Marine Conservation Zone (MCZ) • Locally protected site (nature reserve, wildlife site, geological
  site) Or where the development is likely to have a significant impact on protected species, habitats
  or biodiversity.'
must-include:
- item: Information allowing the development to be assessed under the relevant legislation
  level: must
- item: An assessment of the impact on protected species, habitats or biodiversity, with any mitigation
    measures
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 19. L10a. Marine Conservation Zones have no
  site value yet, and 'significant impact' is a judgment, so the rule keeps a discretionary part.
review-status: unverified
field-status: {}
