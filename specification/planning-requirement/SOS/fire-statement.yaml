reference: fire-statement
local-authority: SOS
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.southend.gov.uk/downloads/file/5405/local-validation-list-document-2023
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications for relevant buildings (“relevant buildings”) will be required to complete a
  Fire Statement Form in accordance with Article 9A of The Town and Country Planning (Development Management
  Procedure) (England) Order 2015 (DMPO) Relevant buildings are new buildings, existing buildings to be
  refurbished or development within the curtilage of an existing building that is 18 metres or more in
  height or 7 or more storeys, and contain either two or more dwellings, or educational accommodation.
must-include:
- item: On the form published by the Secretary of State, or a form substantially to the same effect
  level: must
confidence: medium
notes: From the council's list (published July 2023), page 12. N7 (Planning Gateway One).
review-status: unverified
field-status: {}
