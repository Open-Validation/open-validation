reference: bng-metric
local-authority: SLF
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/biodiversity-net-gain-assessment/
source-text: All major developments; Any development of a site which supports a habitat of principle importance.
must-include:
- item: Calculated using the biodiversity metric published by Natural England
  level: must
confidence: medium
notes: 'From the council''s list (undated web pages, read 2026-11-06; the ''Apply for planning permission''
  page calling it the council''s adopted validation checklist was last updated 30 October 2026), page
  ''Biodiversity net gain assessment''. The page asks for a net gain assessment for all major developments
  and any development of a site supporting a habitat of principal importance, and says new minor developments
  should still show a proportionate gain without running the assessment. The page predates mandatory biodiversity
  net gain, so the rule follows the law: the metric is needed where the statutory biodiversity gain condition
  applies (householder and other exempt applications are exempt). It can be included in the biodiversity
  survey and report.'
