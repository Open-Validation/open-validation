reference: arboriculturist-report
local-authority: SLF
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Development could affect existing trees, including trees on adjacent land or highways.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/tree-survey/
source-text: All applications where development could affect existing trees. This includes trees on adjacent
  land or highways.
must-include:
- item: All the information required by BS 5837:2012 (or any later update)
  level: must
- item: 'Tree constraints plan: all existing trees over 75 mm diameter at 1.5 m above ground within, overhanging
    or next to the site (with reference numbers); existing buildings and structures; hard surfaces; watercourses;
    ground levels; existing hedges with their woody species and features'
  level: must
- item: Smaller trees (under 75 mm diameter) indicated on the plan
  level: should
- item: 'Tree schedule: species, height, stem diameter at 1.5 m, root protection area, canopy spread to
    the four compass points, age class, condition, life expectancy'
  level: must
- item: Full schedule of tree works, including trees to be removed and remedial works, disposal of arisings
    and precautions to protect root protection areas and retained trees
  level: must
- item: Existing and proposed amenity value, and British Standard retention category (colour coded)
  level: must
- item: 'Tree protection plan: the tree constraints information, the proposed development outlined, trees
    to be retained/removed, temporary protective fencing or ground protection, site compound with parking
    and materials storage, and wildlife features'
  level: must
- item: All plans to scale with a scale bar
  level: must
- item: Plans on A3 paper where possible
  level: should
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Tree
  survey'. Salford calls it a 'Tree survey'. If unsure whether trees are affected, the minimum is a site
  plan at 1:200 or 1:500 showing the development, tree trunks and crown spreads, after which a tree survey
  may be requested.
review-status: unverified
field-status: {}
