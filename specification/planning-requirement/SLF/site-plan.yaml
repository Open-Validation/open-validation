source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/statutory-national-validation-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The site layout plan should be at a standard scale. For example, 1:200 or 1:500 and, as
  a minimum, should include: A north arrow; The proposed development in relation to the site boundaries
  and other existing buildings on or adjacent to the site, as well as written dimensions including those
  to the boundaries; and The position and crown spread of all trees (to scale) within the application
  site or within falling distance of the application site; Details of any proposed boundary treatments
  and hard surfacing; Any public rights of way which may cross or run adjacent to the site; Parking and
  access arrangements.'
