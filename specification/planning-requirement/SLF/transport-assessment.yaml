source-text: Land use Unit measure Transport statement Transport assessment and travel plan Food retail
  Gross floor area >250 <800sq.m >800sq.m Non-food detail Gross floor area >800 <1500sq.m >1500sq.m Financial
  and professional services Gross floor area >1000 <2500sq.m >2500sq.m Restaurants and cafes Gross floor
  area >300 <2500sq.m >2500sq.m Drinking establishments Gross floor area >300 <600sq.m >600sq.m Hot food
  takeaway Gross floor area >250 <500sq.m >500sq.m Business Gross floor area >1500 <2500sq.m >2500sq.m
  General industrial Gross floor area >2500 <4000sq.m >4000sq.m Storage or distribution Gross floor area
  >3000 <5000sq.m >5000.sq.m Hotels Bedroom >75 <100 bedrooms >100 bedrooms Hospitals and nursing homes
  Beds >30 <50 beds >50 beds Residential education Students >50 <150 students >150 students Institutional
  hostels Residents >250 <400 students >400 students Dwelling houses Unit >50 <80 units >80 units Non-residential
  institutions Gross floor area >500 <1000sq.m >1000sq.m Assembly and leisure Gross floor area >500 <1500sq.m
  >1500sq.m Any development which is considered would have a significant impact on the highway network.
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Transport
  assessments, transport statements and travel plans'. A transport statement is needed above the lower
  threshold for each land use in the page's table, and a transport assessment (with a travel plan) above
  the upper one. The table's upper bound for one band is the lower bound of the next, so each condition
  uses 'more than'. Its typos are kept in the quote ('Non-food detail' for non-food retail; 'students'
  for hostel residents). Any other development that would have a significant impact on the highway network
  is discretionary. Contents follow national guidance on GOV.UK.
