reference: air-quality-assessment
local-authority: SLF
required-if:
  any:
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Introduces a new relevant receptor (a sensitive end use such as residential or a
          school).
    - any:
      - site:
          in:
          - air-quality-management-area
          description: In the Air Quality Management Area.
      - discretionary
  - condition:
      field: dust-generation
      value: true
      description: An activity associated with significant sources of dust or odours (for example mineral
        development, waste handling, construction and demolition).
  - application-type:
      in:
      - mineral-extraction
      - waste-dev
  - condition:
      field: environmental-permit
      value: true
      description: An activity that requires an Environmental Permit.
  - all:
    - condition:
        field: direct-air-emissions
        value: true
        description: One or more substantial combustion processes (for example standby emergency generators,
          energy centres, shipping, waste incineration or biomass plant).
    - discretionary
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: Residential development of 10 or more dwellings (the page says 'greater than 10
            or more').
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: Residential development above 0.5 ha site area where the number of dwellings is
            unknown.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: More than 1,000 m² of floor space for all other uses.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Other uses on a site area greater than 1 ha.
    - discretionary
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/air-quality-assessment/
source-text: 'Any development which introduces any of the following: A new relevant receptor (for example,
  a sensitive end use such as residential, school and so on) into an area of relatively poor air quality,
  for example the Air Quality Management Area or an area where there is a source of odour and/or dust
  that may affect health and amenity for future occupants of the development (regardless of scale[*]).
  An activity associated with significant sources of dust or odours (for example all mineral development,
  waste handling construction and demolition). An activity that requires an Environmental Permit. Have
  one or more substantial combustion processes where there is a risk of impacts at relevant receptors,
  including combustion plant associated with standby emergency generators (typically associated with centralised
  energy centres), shipping, waste incineration or biomass plant. In addition, an air quality assessment
  will be required if any of the indicative criteria in ''A'' below apply, together with any of the criteria
  in ''B'' Criteria - A Residential development greater than 10 or more dwellings or development above
  0.5 ha (site area) where the number is unknown. More than 1000 m2 of floor space for all other uses
  or a site area greater than 1 ha. Criteria - B The development is likely to create or result in a significant
  change in traffic flows. [*] The development will involve the realignment of roads, ie changing the
  proximity of receptors to traffic lanes, where the change is 5m or more and the road is within an AQMA.
  The development will introduce a new junction or remove an existing junction near to relevant receptors.
  Introduce or change a bus station. Have an underground car park with an extraction system and more than
  100 vehicle movements per day Indicative criteria for requiring an air quality assessment [*] Significant
  is considered to be: a change of Light duty Vehicles (<3.5T) flows of more than 100 AADT (annual average
  daily traffic) within or adjacent to an AQMA or more than 500 AADT elsewhere OR The development is likely
  to result in a significant change in Heavy Duty Vehicle (>3.5T) flows of more than 25 AADT within or
  adjacent to an AQMA OR More than 100 AADT elsewhere.'
must-include:
- item: Likely changes in air quality or exposure to air pollution caused by the development, against
    health-based statutory and proposed air quality standards and objectives
  level: must
- item: The existing air quality in the study area (existing baseline)
  level: must
- item: Predicted future air quality without the development (future baseline)
  level: must
- item: Predicted future air quality with the development
  level: must
- item: The significance of the effect of any impacts identified
  level: must
- item: The cumulative impact of developments
  level: must
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Air
  quality assessment'. A new receptor in an area of 'relatively poor air quality' other than the AQMA
  (for example near a source of odour or dust) is discretionary. 'Substantial' combustion processes 'where
  there is a risk of impacts' are discretionary. The size criteria in 'A' trigger an assessment only together
  with a criterion in 'B' (a significant change in traffic flows as the page defines it in AADT, road
  realignment of 5 m or more in an AQMA, a new or removed junction near receptors, a new or changed bus
  station, or an underground car park with extraction and more than 100 vehicle movements a day); no field
  captures the 'B' criteria, so that branch shows as discretionary. Applicants are advised to scope the
  assessment with Environmental Health first.
review-status: unverified
field-status: {}
