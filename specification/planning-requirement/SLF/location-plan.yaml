reference: location-plan
local-authority: SLF
required-if:
  always: true
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/statutory-national-validation-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site location plan is required to show the location of the site and to identify any other
  sites, which may be in the same ownership.
must-include:
- item: At a scale of 1:1250 (a smaller scale such as 1:2500 only where a very large site cannot be shown
    on a single sheet)
  level: must
- item: Scaled to fit onto A4 or A3 paper where possible, based on an up-to-date map
  level: should
- item: Application site outlined with a continuous red line, including all land needed to carry out the
    development (access from a public highway, visibility splays, landscaping, car parking and open areas
    around buildings)
  level: must
- item: Blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: must
- item: A north arrow
  level: must
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Statutory
  national validation requirements'.
review-status: unverified
