reference: land-contamination-assessment
local-authority: SLF
required-if:
  any:
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed end use is sensitive to contamination (for example allotments, residential
          use, schools, some commercial premises).
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
  - all:
    - site:
        in:
        - contaminated-land
        description: The land is known or suspected of being contaminated.
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - hh
        - change-of-use
    - discretionary
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/land-contamination-assessment/
source-text: 'A stage 1 preliminary risk assessment (PRA) should be carried out if any of the following
  apply: The proposed end use of the development is considered sensitive to contamination (for example,
  allotments, residential use, schools, some commercial premises) The land is known or suspected of being
  contaminated There is no evidence to show the land is free of contamination Proposals may create new
  pollution linkages If the site poses a potentially significant risk to the proposed use, then a full
  site investigation is required to be submitted with any application. The need for a PRA for householder
  applications, or applications for change of use which do not include operational development will be
  determined on a case by case basis.'
must-include:
- item: Prepared by a suitably qualified and experienced person in line with relevant guidance, with the
    authors' and reviewers' competencies identified
  level: must
- item: Purpose and aims of the study
  level: must
- item: Site description with a detailed site plan showing the site location, extent and boundary
  level: must
- item: Review of historical information, including historical maps and aerial photographs if available
  level: must
- item: Past and present uses of the site and surrounding area, with associated hazards and potential
    contamination sources
  level: must
- item: 'Appraisal of the environmental setting: geology, hydrology (including flood risk), hydrogeology
    and topography; coal workings and other extractive industries; waste management and landfill sites;
    water abstractions and discharges, pollution incidents, IPPC Part A and B, and radon; drainage, services,
    tunnels and underground structures'
  level: must
- item: Review of any previous contamination studies or remediation works
  level: must
- item: Site walkover survey, and any site access or investigation restrictions
  level: must
- item: 'Conceptual site model and preliminary risk assessment: potential sources, pathways and receptors,
    contaminant linkages and potential unacceptable risks'
  level: must
- item: Recommendations and conclusions, including site investigation proposals if required
  level: must
- item: A full site investigation where the site poses a potentially significant risk to the proposed
    use
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Land
  contamination assessment'. Where there is 'no evidence to show the land is free of contamination' or
  the proposal 'may create new pollution linkages' the trigger is discretionary, and for householder applications
  and changes of use without operational development the need is decided case by case.
review-status: unverified
field-status: {}
