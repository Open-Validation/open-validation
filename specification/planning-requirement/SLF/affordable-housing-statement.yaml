reference: affordable-housing-statement
local-authority: SLF
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Residential development on a site over 1 hectare, whatever the number of dwellings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 25
      description: Housing developments of 25 or more dwellings.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/affordable-housing-statement/
source-text: Residential development on sites over 1 hectare in area, irrespective of the number of dwellings;
  Housing developments of 25 or more dwellings.
must-include:
- item: The number of affordable residential units
  level: must
- item: The mix of affordable units by house type (dwelling, apartment)
  level: must
- item: The mix of affordable units by tenure (social rent/shared ownership) and size (number of bedrooms
    and gross floor space)
  level: must
- item: Plans showing the location of the affordable units, with a schedule of accommodation giving the
    net internal floor area and bedrooms for each plot
  level: must
- item: How the affordable units will be managed, allocated and let to meet need, with the Registered
    Provider's details where one is involved
  level: must
- item: How the affordable homes will remain affordable in perpetuity
  level: must
- item: 'For outline applications where the provision cannot be specified in detail: a statement of intent
    on how affordable housing will be provided and whether the site will comply with the SPD'
  level: should
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Affordable
  housing statement'.
review-status: unverified
field-status: {}
