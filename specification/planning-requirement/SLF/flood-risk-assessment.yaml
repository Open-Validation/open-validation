reference: flood-risk-assessment
local-authority: SLF
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Operational development on a site of 1 hectare or more (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Operational development on a site of 1 hectare or more (Flood Zone 1).
  - all:
    - site:
        in:
        - critical-drainage-area
        description: The site is in a Critical Drainage Area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: The site is over 0.5 hectares.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.5
          description: The site is over 0.5 hectares.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/flood-risk-assessment/
source-text: Any operational development of 1ha or above in Low Flood Risk Zone 1 … Development proposals
  on sites over 0.5 hectares in size located within Critical Drainage Areas
confidence: medium
notes: 'From the audit (missing_requirement): any development in Flood Zone 3 or Flood Zone 2; any operational
  development of 1ha or more in Flood Zone 1; sites over 0.5ha in Critical Drainage Areas. Householder
  schemes in Flood Zones 2 and 3 are included (audit issue 7).'
review-status: unverified
field-status: {}
