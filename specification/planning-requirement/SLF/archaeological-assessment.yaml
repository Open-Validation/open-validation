reference: archaeological-assessment
local-authority: SLF
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: An area of archaeological interest/potential.
  - discretionary
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/heritage-assessment/
source-text: 'A separate archaeological assessment may be required in special circumstances. In such cases
  the applicant will need to provide appropriately detailed information to enable the city council to
  make a proper assessment including:'
must-include:
- item: An understanding of the nature, relative importance and physical extent of the archaeological
    interest, through desk-based assessment, field evaluation, basic appraisal or recording, as required
  level: must
- item: Consideration of proposed uses with no or minimal impact on the significance of the asset
  level: must
- item: How the scheme avoids or minimises impact through design (for example foundations that span sensitive
    areas)
  level: must
confidence: medium
notes: 'From the council''s list (undated web pages, read 2026-11-06; the ''Apply for planning permission''
  page calling it the council''s adopted validation checklist was last updated 30 October 2026), page
  ''Heritage assessment''. Discretionary: needed only ''in special circumstances''.'
review-status: unverified
field-status: {}
