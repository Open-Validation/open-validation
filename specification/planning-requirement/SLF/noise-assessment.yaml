reference: noise-assessment
local-authority: SLF
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals that generate high levels of noise or vibration, such as industrial developments
        using noisy machinery, noisy sports, public houses or nightclubs.
  - all:
    - any:
      - condition:
          field: class-e-floorspace
          operator: '>='
          value: 1
          description: A commercial use.
      - condition:
          field: entertainment-leisure-use
          value: true
          description: An entertainment use.
    - condition:
        field: plant-equipment
        value: true
        description: Externally mounted extract equipment.
  - all:
    - any:
      - condition:
          field: class-e-floorspace
          operator: '>='
          value: 1
          description: A commercial use.
      - condition:
          field: entertainment-leisure-use
          value: true
          description: An entertainment use.
    - condition:
        field: adjoins-residential-property
        value: true
        description: In premises sharing a party wall or ceiling with residential uses.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New noise or vibration sensitive uses (for example housing) next to major sources of
        noise such as roads, railways, industrial and commercial uses (including existing entertainment
        venues).
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/noise-impact-assessment/
source-text: Proposals that generate high levels of noise or vibration such as industrial developments
  using noisy machinery (eg joinery workshops, refrigeration plant & equipment), noisy sports, public
  houses, nightclubs etc Proposals for commercial or entertainment uses which involve externally mounted
  extract equipment Proposals for commercial or entertainment uses, in premises sharing a party wall or
  ceiling with residential uses New noise or vibration sensitive uses (eg housing) adjacent to major sources
  of noise such as roads, railways, industrial and commercial (including existing entertainment venues)
must-include:
- item: Description of the site and surrounding area
  level: must
- item: Description of the use and its noise emissions
  level: must
- item: Noise and/or vibration survey details and full results
  level: must
- item: Noise/vibration assessment criteria to the relevant British Standard
  level: must
- item: Subjective description of noise/vibration sources
  level: must
- item: Assessment and calculations
  level: must
- item: Construction and demolition phase assessment
  level: must
- item: Conclusions and details of mitigation required
  level: must
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Noise
  impact assessment'. Salford calls it a 'Noise impact assessment'.
review-status: unverified
field-status: {}
