reference: elevation-existing
local-authority: SLF
required-if:
  all:
  - condition:
      field: external-alterations
      value: true
      description: The application proposes external alterations.
  - discretionary
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/statutory-national-validation-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed floor plans, elevations and roof plans - clearly marked with the correct
  scale and annotated appropriately, (for example, existing first floor plan, proposed south elevation).
  All elevations, of a building, must be included even if it abuts an adjacent property/building and will
  therefore not be seen. Where the proposal involves alterations at roof level, then existing and proposed
  roof plans should also be provided. Applications that do not propose any external alterations are not
  required to provide elevation or roof plans.
must-include:
- item: Clearly marked with the correct scale and annotated (for example 'proposed south elevation')
  level: must
- item: All elevations of the building, even where it abuts an adjacent property or building and will
    not be seen
  level: must
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Statutory
  national validation requirements'. Applications with no external alterations do not need elevations.
  Otherwise the page says detailed drawings 'may include' elevations depending on the application, so
  the rest shows as discretionary.
