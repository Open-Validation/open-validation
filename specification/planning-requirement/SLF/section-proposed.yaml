policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed site sections and levels plans including finished floor levels. For
  more complex schemes or development where there is significant change in level then sections and existing
  and proposed levels plans will be required to support the application. Sectional drawings should be
  to a scale of 1:50 or 1:100 and should include details of the alterations of the levels and demonstrate
  how the proposal sits within the site, in particular showing the levels between existing and proposed
  development and relationship to adjoining sites. The drawings should include spot levels, finished floor
  levels and access gradients where appropriate. Sectional drawings are also required for all applications
  for advertisement consent and should include a section through the proposed signage indicating the depth
  and fixing techniques of any signage where attached to a building or structure and details of any internal
  or external illumination.
