reference: viability-assessment
local-authority: SLF
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The developer considers it is not financially viable to enter into an agreement, or can
      only make reduced payments from those the council seeks.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/planning-obligations-pro-forma-statement/
source-text: Where a developer considers that it is not financially viable to enter into an agreement,
  or that they can only make reduced payments from that sought by the city council, then a clear and robust
  unredacted financial viability assessment, to include an executive summary, will be required. An application
  will not be considered as ‘valid’ unless a financial viability assessment has been submitted.
must-include:
- item: Clear, robust and unredacted
  level: must
- item: An executive summary
  level: must
- item: Executive summary sets out the gross development value, benchmark land value including landowner
    premium, costs and return to developer
  level: should
- item: 'Prepared having regard to the RICS professional standards and guidance ''Financial viability
    in planning: conduct and reporting'''
  level: should
- item: Any claim for exemption from publication on grounds of commercial sensitivity identifies the information
    considered sensitive and why, with robust justification, before the application is submitted
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: The applicant claims an exemption from publication on grounds of commercial sensitivity.
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Planning
  obligations pro forma statement'. The assessment will be published like other application documents.
  If an applicant changes position after validation and no longer offers contributions, the application
  is invalidated until a viability appraisal is submitted. Further contents are set out in the Planning
  obligations pro forma statement (a Word form downloadable from the council's website).
review-status: unverified
field-status: {}
