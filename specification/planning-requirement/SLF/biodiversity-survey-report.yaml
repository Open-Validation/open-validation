reference: biodiversity-survey-report
local-authority: SLF
required-if:
  any:
  - site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      description: Within or adjacent to a European site (SPA or SAC), a Site of Special Scientific Interest,
        a Site of Biological Importance or a Local Nature Reserve.
  - site:
      in:
      - wildlife-corridor
      description: Within or adjacent to a wildlife corridor area of search or natural green space.
  - condition:
      field: potential-roost-features
      value: true
      description: Works within the roof space of an existing building.
  - condition:
      field: demolition
      value: true
      description: The demolition of a building.
  - condition:
      field: involves-change-of-use
      value: true
      description: The conversion of a building (for example a barn or mill conversion).
  - condition:
      field: underground-structures
      value: true
      description: Alterations or works to cellars, bridges, culverts, large stone walls, caves or mines.
  - condition:
      field: derelict-site
      value: true
      description: The site is a quarry or derelict land.
  - condition:
      field: near-watercourse
      value: true
      description: Adjacent to a river, canal, stream, ditch or other large water body.
  - condition:
      field: distance-to-pond
      operator: <=
      value: 250
      description: Within 250 m of a natural pond or reservoir.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: The development results in works to trees or scrub.
  - condition:
      field: hedgerows-affected
      value: true
      description: Development affecting or adjacent to hedgerow.
  - condition:
      field: near-woodland
      value: true
      description: Development affecting or adjacent to woodland.
  - condition:
      field: invasive-species
      value: true
      description: Invasive species are present on the site.
  - condition:
      field: external-lighting
      value: true
      description: Lighting of churches and listed buildings, or floodlighting of green space within 50
        m of woodland or water.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - priority-habitat
        description: Within a locally significant area of national and/or local priority habitat, or a
          habitat identified in the Greater Manchester Biodiversity Action Plan.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/biodiversity-survey-and-reports/
source-text: 'All development within or adjacent to a designated site: European sites - special protection
  area of birds and special areas of conservation Sites of special scientific interest Sites of biological
  importance Local nature reserve All applications within or adjacent to a wildlife corridor area of search
  or natural green space Any application involving: Works within the roof space of an existing building
  The demolition of a building The conversion of a building (eg barn or mill conversion) Alterations or
  works to cellars, bridges, culverts, large stone walls, caves or mines All applications on a quarry
  or derelict land All development adjacent to a river, canal, stream, ditch or other large water body
  All development within 250m of a natural pond or reservoir Development which results in works to trees
  or scrub Development affecting or adjacent to hedgerow or woodland Development sites where invasive
  species are present Proposals involving lighting of churches and listed buildings or flood lighting
  of green space within 50m of woodland or water Non-householder development within ‘a locally significant
  area of national and /or local priority habitat’ Development within habitats identified in the Greater
  Manchester Biodiversity Action Plan (BAP)'
must-include:
- item: The impacts of the development on any wildlife or biodiversity interests, including a habitat
    survey to 'Phase 1' standard or more
  level: must
- item: Mitigation measures proposed, including how existing natural assets will be protected during construction
  level: must
- item: How the development will enhance biodiversity, any mitigation/compensation measures, and proposals
    for long-term maintenance and management
  level: must
- item: Plans showing the location of any significant wildlife habitats or features and of any species
    protected under the Wildlife and Countryside Act 1981, the Conservation of Habitats and Species Regulations
    2017 or the Protection of Badgers Act
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Biodiversity
  survey and reports'. The priority habitat trigger is for non-householder development only (the BAP habitat
  trigger has no such limit; both are shown with the planning application types). Plans of habitats and
  protected species are asked for 'where appropriate'.
review-status: unverified
field-status: {}
