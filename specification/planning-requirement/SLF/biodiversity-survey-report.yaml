reference: biodiversity-survey-report
local-authority: SLF
required-if:
  any:
  - site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: The site is within or adjacent to a European site (SPA or SAC), SSSI, Site of Biological
        Importance, Local Nature Reserve, wildlife corridor area of search or natural green space.
  - condition:
      field: demolition
      value: true
      description: The proposal involves the demolition of a building.
  - condition:
      field: involves-change-of-use
      value: true
      description: The proposal involves the conversion of a building.
  - discretionary
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/biodiversity-survey-and-reports/
source-text: 'European sites - special protection area of birds and special areas of conservation Sites
  of special scientific interest Sites of biological importance Local nature reserve All applications
  within or adjacent to a wildlife corridor area of search or natural green space Any application involving:
  Works within the roof space of an existing building; The demolition of a building; The conversion of
  a building...'
confidence: medium
notes: 'Audit (wrong_trigger): the tab text stopped at ''Any application involving:''. From the audit,
  the other triggers are works in roof spaces; works to cellars, bridges, culverts, large stone walls,
  caves or mines; quarry or derelict land; development next to a river, canal or other water body; within
  250m of a natural pond or reservoir; works to trees or scrub; hedgerow or woodland; invasive species;
  lighting of churches or listed buildings; floodlighting within 50m of woodland or water; non-householder
  development in priority habitat; and Greater Manchester BAP habitats. These can''t all be expressed
  as fields, so they are covered by ''discretionary''. Applies to householder roof-space works and demolition.'
review-status: unverified
field-status: {}
