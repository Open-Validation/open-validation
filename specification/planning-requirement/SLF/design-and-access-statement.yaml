reference: design-and-access-statement
local-authority: SLF
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/statutory-national-validation-requirements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and access statements are required for: All major planning applications as defined
  in article 2 of the Town and Country Planning (Development management Procedure (England) Order 2015
  Applications in conservation areas where the proposed development consists of: one or more dwelling
  houses; or a building(s) with a floor space of 100 square metres or more Applications for listed building
  consent'
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Statutory
  national validation requirements'. The page adds that waste development, material changes of use, engineering
  or mining operations and applications to amend conditions do not need one, and that a single combined
  heritage and design and access statement can be submitted where planning permission and listed building
  consent are sought together.
review-status: unverified
field-status: {}
