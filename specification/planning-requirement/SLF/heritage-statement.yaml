reference: heritage-statement
local-authority: SLF
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: Alterations to a listed building, or applications affecting its setting.
  - site:
      in:
      - conservation-area
      description: Within or affecting the setting of a conservation area.
  - site:
      in:
      - locally-listed-building
      description: Alterations to, or affecting the setting of, a locally listed heritage asset.
  - site:
      in:
      - park-and-garden
      description: Within or affecting the setting of a historic park or garden.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In, or next to and able to affect, an area of archaeological interest/potential defined
          in Salford's Historic Environment Record.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves disturbance of ground.
  - all:
    - ref: major-development
    - discretionary
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/heritage-assessment/
source-text: 'Any development which alters, or affects the setting of, a heritage asset including: Applications
  that involve alterations to a listed building Applications that would affect the setting of a listed
  building Applications within or affecting the setting of a conservation area Applications that involve
  alterations to a locally listed heritage asset Applications that would affect the setting of a locally
  listed heritage asset Applications within or affecting the setting of a historic park or garden Applications
  in areas of archaeological interest, or ones that may be adjacent to and could affect them (archaeological
  assessment)'
must-include:
- item: The significance of the designated heritage assets, and of those of local significance, that may
    be affected
  level: must
- item: The impact of the proposal on that significance, with any justification or proposed mitigation
  level: must
- item: Any plans, computer generated images or photographs needed to show the impact on the setting of
    the designated heritage asset(s)
  level: must
- item: Structural plans and supporting structural reports where full or partial demolition of a designated
    heritage asset is proposed because it is structurally unsound
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Full or partial demolition of a designated heritage asset on the grounds that it is
        structurally unsound.
- item: A method statement for the proposed works, if known
  level: should
- item: 'Listed buildings: the purpose and need for the alterations and why the chosen option was adopted
    over alternatives; a statement of significance (historical, archaeological and architectural interest);
    the design principles and concepts applied; how the proposals minimise impacts on layout and architectural
    features'
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'Setting of a listed building or conservation area: the design principles and concepts applied;
    a statement of significance; how the proposals preserve and enhance its character'
  level: must
  required-if:
    site:
      in:
      - listed-building-setting
      - conservation-area
      description: Affects the setting of a listed building or a conservation area.
- item: 'Historic parks or gardens: the design principles and concepts applied, and a statement of significance
    of the park or garden'
  level: should
  required-if:
    site:
      in:
      - park-and-garden
      description: Within or affecting the setting of a historic park or garden.
- item: 'Areas of archaeological interest: the results of any written scheme of investigation or investigative
    works commissioned before submission'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Heritage
  assessment'. Salford calls it a 'Heritage assessment'. In areas of archaeological interest the statement
  is needed where ground is disturbed; other major development or significant infrastructure works where
  archaeological remains may survive 'as may be specified in pre-application advice' are discretionary.
review-status: unverified
field-status: {}
