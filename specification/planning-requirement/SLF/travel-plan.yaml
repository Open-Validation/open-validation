reference: travel-plan
local-authority: SLF
required-if:
  any:
  - all:
    - condition:
        field: use-class
        value: food-retail
        description: Food retail.
    - condition:
        field: floorspace
        operator: '>'
        value: 800
        description: 'Food retail: more than 800 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: non-food-retail
        description: Non-food retail.
    - condition:
        field: floorspace
        operator: '>'
        value: 1500
        description: 'Non-food retail: more than 1500 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: financial-professional-services
        description: Financial and professional services.
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: 'Financial and professional services: more than 2500 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: restaurant-cafe
        description: Restaurants and cafes.
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: 'Restaurants and cafes: more than 2500 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: drinking-establishment
        description: Drinking establishments.
    - condition:
        field: floorspace
        operator: '>'
        value: 600
        description: 'Drinking establishments: more than 600 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Hot food takeaway.
    - condition:
        field: floorspace
        operator: '>'
        value: 500
        description: 'Hot food takeaway: more than 500 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: business
        description: Business.
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: 'Business: more than 2500 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: general-industrial
        description: General industrial.
    - condition:
        field: floorspace
        operator: '>'
        value: 4000
        description: 'General industrial: more than 4000 m² gross floor area.'
  - all:
    - condition:
        field: use-class
        value: storage-distribution
        description: Storage or distribution.
    - condition:
        field: floorspace
        operator: '>'
