        description: 'Hospitals and nursing homes: more than 50 beds, students or residents.'
  - all:
    - condition:
        field: use-class
        value: residential-education
        description: Residential education.
    - condition:
        field: residential-capacity
        operator: '>'
        value: 150
        description: 'Residential education: more than 150 beds, students or residents.'
  - all:
    - condition:
        field: use-class
        value: institutional-hostel
