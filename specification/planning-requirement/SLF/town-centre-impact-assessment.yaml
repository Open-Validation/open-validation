reference: town-centre-impact-assessment
local-authority: SLF
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: A main town centre use (new build, extension or change of use) neither in an existing
      centre nor in accordance with an up to date plan.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/town-centre-use-sequential-assessments-and-impact-assessments/
source-text: A sequential assessment is required for planning applications for all main town centre uses
  (new build, extensions and changes of use) which are neither in an existing centre nor in accordance
  with an up to date plan. Impact assessment An impact assessment is required for planning applications
  for retail and leisure development over 2500m2 of gross floorspace outside town centres which are not
  in accordance with an up to date plan.
must-include:
- item: 'Sequential assessment: proportionate and appropriate for the development'
  level: must
- item: 'Sequential assessment: the catchment area of the development'
  level: must
- item: 'Sequential assessment: sequentially preferable sites/premises in the catchment, having regard
    to suitability, viability and availability'
  level: must
- item: 'Sequential assessment: scope for flexibility in the format and scale of the development'
  level: must
- item: 'Impact assessment (retail and leisure development over 2,500 m² gross outside town centres):
    the scope of the assessment; the impact on all town centres that may be affected, including in neighbouring
    authorities; impact assessed like-for-like for the sector'
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail development over 2,500 m² gross floorspace.
    - all:
      - condition:
          field: entertainment-leisure-use
          value: true
          description: Leisure development.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 2500
          description: Over 2,500 m² gross floorspace.
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Town
  centre use sequential assessments and impact assessments'. One file covers both the sequential assessment
  and the impact assessment; the impact assessment is a must-include item for retail and leisure development
  over 2,500 m² outside town centres not in accordance with an up to date plan.
