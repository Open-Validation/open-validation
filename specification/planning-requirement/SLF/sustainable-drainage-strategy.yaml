reference: sustainable-drainage-strategy
local-authority: SLF
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 (medium risk) or Flood Zone 3 (high risk).
  - all:
    - condition:
        field: operational-development
        value: true
        description: Operational development.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: A site of 1 ha or above (in Flood Zone 1).
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: A site of 1 ha or above (in Flood Zone 1).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Residential development of 5 or more dwellings (except a change of use where no increase
        in permeable area is proposed).
  - all:
    - site:
        in:
        - critical-drainage-area
        description: In a Critical Drainage Area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: A site over 0.5 hectares.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.5
          description: A site over 0.5 hectares.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/drainage-strategy/
source-text: Any development proposals in High Flood Risk Zone (Zone 3) Any development proposals in Medium
  Flood Risk Zone (Zone 2) Any operational development of 1ha or above in Low Flood Risk Zone 1 Residential
  development of 5 or more dwellings (except a change of use where no increase in permeable area is proposed)
  Development proposals on sites over 0.5 hectares in size located within ‘Critical Drainage Areas’
must-include:
- item: 'For all major applications: the completed North West SuDS proforma'
  level: must
  required-if:
    ref: major-development
- item: Any constraints affecting the development
  level: should
- item: Topographical survey of the site, including levels and sections of any adjacent watercourses upstream
    and downstream of the discharge point
  level: should
- item: How the indicative drainage design meets the Flood Risk Assessment requirements (where an FRA
    is required)
  level: should
- item: Existing utilities plan (if applicable)
  level: should
- item: Impermeable areas estimate; infiltration testing, existing runoff rates and storage volume estimates;
    permissible peak flow rate; allowance for climate change
  level: should
- item: SuDS components and their integration with any masterplan and green infrastructure, including
    phasing, plot discharge and storage constraints, and who will construct, maintain, adopt and manage
    the system
  level: should
- item: Flow controls; SuDS/drainage layouts and design calculations showing compliance with the non-statutory
    technical standards for sustainable drainage systems
  level: should
- item: Public health and safety, maintenance liabilities, and ecology and water quality implications
  level: should
- item: A viability assessment where surface water is to discharge to a public sewer
  level: should
- item: Consultation with United Utilities and the Environment Agency where relevant
  level: should
- item: 'Full applications: final design calculations for peak flow, volume control and greenfield/brownfield
    runoff; existing and proposed site sections and levels; long and cross sections of the drainage system;
    SuDS plan with sub-catchments; proposed connections to watercourses and sewers; operation of any mechanical
    features; exceedance flood plan for the 1 in 100 year storm; access arrangements; construction details'
  level: should
  required-if:
    application-type:
      in:
      - full
- item: 'Full applications: a SuDS Design Statement, a SuDS Management Plan (operation, maintenance and
    long-term funding) and a health and safety risk assessment for water features'
  level: should
  required-if:
    application-type:
      in:
      - full
- item: 'Reserved matters: a detailed drainage strategy updating the outline strategy with the detailed
    design and layout of the drainage system'
  level: should
  required-if:
    application-type:
      in:
      - reserved-matters
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Drainage
  strategy'. Salford calls it a 'Drainage strategy'. The contents are written as 'should be presented'
  and 'not an exhaustive list', so they are 'should' except the North West SuDS proforma, which 'must
  be completed' for major applications. Environment Agency standing advice should also be followed.
review-status: unverified
field-status: {}
