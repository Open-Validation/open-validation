reference: recreation-facilities-assessment
local-authority: SLF
required-if:
  site:
    in:
    - open-space
    description: Development affecting sports pitches and facilities, indoor and outdoor sports facilities,
      parks and country parks, children's play areas, allotments, natural green spaces, nature reserves
      or public amenity spaces.
source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/local-information-requirements/sports-and-open-space-impact-assessment/
policy: Salford Greenspace Strategy Supplementary Planning Document
source-text: 'Any development that affects: Sports pitches and facilities Indoor and outdoor sports facilities
  Parks and country parks Children’s play areas Allotments Natural green spaces Nature reserves Public
  amenity spaces'
must-include:
- item: How the facility will be affected by the development, when it was last used and by whom
  level: must
- item: Site plan clearly showing the layout of the existing facilities
  level: must
- item: Proposed site plan showing how the development is likely to affect the existing facilities
  level: must
- item: Details of any replacement facilities and/or improvements to existing facilities
  level: must
confidence: medium
notes: From the council's list (undated web pages, read 2026-11-06; the 'Apply for planning permission'
  page calling it the council's adopted validation checklist was last updated 30 October 2026), page 'Sports
  and open space impact assessment'. Salford calls it a 'Sports and open space impact assessment'.
review-status: unverified
field-status: {}
