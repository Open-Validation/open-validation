reference: air-quality-assessment
local-authority: BUR
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Inside or adjacent to an Air Quality Management Area (AQMA).
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: Council's Air Quality Action Plan
source-text: 'A) Air Quality – To cover where a development because of its scale and nature is likely
  to have significant impacts on air quality particularly where such impact is likely to be particularly
  important, for example as follows: • Where the development is being proposed inside or adjacent to an
  Air Quality Management Area (AQMA) • Where it could in itself, result in the designation of an AQMA
  • Where a development would conflict with or render unworkable elements of the Council’s Air Quality
  Action Plan.'
must-include:
- item: 'Waste: the change in air quality from the development and appropriate mitigation'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: 'From the council''s list (published March 2026), local criteria all developments checklist (March
  2026), item 9A, page 8. Development that could itself result in an AQMA being designated, or conflict
  with the Air Quality Action Plan, has no measurable trigger: discretionary. The waste checklist lists
  air quality assessments as additional information where appropriate.'
review-status: unverified
field-status: {}
