reference: land-contamination-assessment
local-authority: BUR
required-if:
  all:
  - condition:
      field: new-build
      value: true
      description: New development.
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: A sensitive end use (e.g. residential, nurseries, schools).
    - site:
        in:
        - contaminated-land
        description: Land which has the potential to be affected by contamination.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - waste-dev
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: C) Contaminated Land – For all new development with a sensitive end use (e.g. residential,
  nurseries, schools) a minimum of a Preliminary Risk Assessment (PRA) will be required regardless of
  the history of the site, contaminated or otherwise. Also, for all new developments on land which has
  the potential to be affected by contamination a PRA will be required as a minimum.
must-include:
- item: A Preliminary Risk Assessment (PRA) as a minimum
  level: must
- item: A Site Investigation and Risk Assessment and Remediation Strategy, depending on the site, end
    use and potential for contamination
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 9C, page 8-9. Not required for householder applications (though precautionary measures may
  be needed within 250m of a known landfill site, and the householder checklist may ask for details of
  gas protection or garden cover measures).
review-status: unverified
field-status: {}
