reference: design-and-access-statement
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - lbc
      - mineral-app
      - waste-dev
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The development is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Over 100 square metres of floorspace.
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: A design and access statement will be required in all cases.
must-include:
- item: Appropriate photographs
  level: should
  source-text: Any Design and Access Statement or Conservation Area Appraisal should be accompanied by
    appropriate photographs.
confidence: medium
notes: 'Audit (wrong_app_type): the Householder and Reserved matters rows were a heritage-section fragment.
  Item 1 requires a DAS for major development, listed building consent and conservation area development
  of one or more dwellings or over 100m2; the waste checklist ("in all cases", quoted) applies to waste
  applications.'
review-status: unverified
field-status: {}
