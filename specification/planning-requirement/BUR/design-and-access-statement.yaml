reference: design-and-access-statement
local-authority: BUR
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Floor space created exceeds 100 sq m.
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Town & Country Planning (General Development Procedure) (England) Order 2015 Article
  9 sets out the requirements for a Design and Access Statement. These should genuinely adds value to
  the application. This includes major development, listed building consents and developments in conservation
  areas where one or more dwellings are proposed or the floor space to be created would exceed 100m2.
must-include:
- item: Accompanied by appropriate photographs
  level: must
  source-text: Any Design and Access Statement or Conservation Area Appraisal should be accompanied by
    appropriate photographs.
- item: 'Wind turbines: use, amount, layout (with the proximity of nearest properties annotated to scale),
    scale (height, blade length, number of blades, output, power connections), landscaping, appearance,
    access and inclusive access'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
confidence: medium
notes: 'From the council''s list (published March 2026), local criteria all developments checklist (March
  2026), item 1, page 1. Photographs: item 6, page 5. Wind turbine contents: wind turbine checklist, page
  1.'
review-status: unverified
field-status: {}
