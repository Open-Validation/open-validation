reference: biodiversity-survey-report
local-authority: BUR
required-if:
  any:
  - site:
      in:
      - local-wildlife-site
      - green-corridor
      description: Within or adjacent to Sites of Biological Importance, Local Nature Reserves and Wildlife
        Links and Corridors.
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Proposals that qualify for BNG under the national thresholds.
  - condition:
      field: demolition
      value: true
      description: Proposals to demolish or remove a building.
  - condition:
      field: roof-alteration
      value: true
      description: Proposals to remove a roof or roof space.
  - condition:
      field: tree-removal
      value: true
      description: Proposals to remove trees or scrub.
  - condition:
      field: hedgerows-affected
      value: true
      description: Proposals to remove hedgerows.
  - condition:
      field: watercourse-culverting
      value: true
      description: Proposals to alter water courses.
  - condition:
      field: protected-species
      value: true
      description: Sites with known protected or priority species and habitats.
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 'Thresholds: • Proposals on sites within or adjacent to Sites of Biological Importance, Local
  Nature Reserves and Wildlife Links and Corridors as identified in the adopted Plan. • Proposals that
  qualify for BNG requirements as specified within National validation thresholds. • Proposals to demolish
  or remove a building, roof or roof space, remove trees, scrub, and hedgerows or alter water courses
  will need to include information on species present and potential impacts and the mitigation for such
  impacts. In respect of sites with known protected or priority species and habitats.'
must-include:
- item: The impacts on protected flora and fauna and the mitigation for them
  level: must
- item: 'For demolition, roof, tree, scrub, hedgerow or watercourse works: the species present, potential
    impacts and mitigation'
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - condition:
        field: roof-alteration
        value: true
        description: Roof works.
    - condition:
        field: tree-removal
        value: true
        description: Tree or scrub removal.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedgerow removal.
    - condition:
        field: watercourse-culverting
        value: true
        description: Watercourse alteration.
- item: 'Wind turbines: at least a desk based study, covering nesting birds, bats, hedgerows and other
    wildlife'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 13, page 11-12. 'Ecology Assessment'. The householder checklist lists an ecological assessment
  'where protected species may be affected' as may be needed.
review-status: unverified
field-status: {}
