reference: habitat-baseline
local-authority: BUR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: Environment Act 2021; GMCA Biodiversity Net Gain guidance
source-text: • Raw baseline habitat data in UKhab survey format; (this may be presented within accompanying
  documents e.g. Preliminary Ecological Appraisals or separate habitat report); • Pre and Post development
  habitat maps (showing areas of loss and retention)
must-include:
- item: Raw baseline habitat data in UKHab survey format (may be within a Preliminary Ecological Appraisal
    or separate habitat report)
  level: must
- item: A pre-development habitat map showing areas of loss and retention
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 13, page 12. Bury's local BNG criteria are shared across Greater Manchester. The list ties
  BNG to the national validation thresholds; by law householder and other exempt applications are exempt,
  so this follows the biodiversity gain condition.
