reference: telecommunications-report
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications equipment.
source-url: https://www.bury.gov.uk/asset-library/prior-approval-telecommunications-equipment-march-2024.pdf
source-text: '2 copies of the supporting statements including: • ICNIRP certificate • Evidence of the
  need for the facility • Evidence of alternative locations, areas of search/coverage requirements and
  alternative solutions Yes/No • Map showing relationship to schools and other telecommunications equipment
  in the vicinity'
must-include:
- item: ICNIRP certificate
  level: must
- item: Evidence of the need for the facility
  level: must
- item: Evidence of alternative locations, areas of search/coverage requirements and alternative solutions
  level: must
- item: Map showing the relationship to schools and other telecommunications equipment nearby
  level: must
- item: A statement confirming the application follows the DCMS Code of practice for wireless network
    development in England
  level: must
- item: Consultation with schools, statement of community involvement, photographs and montage, tree survey,
    heritage appraisal or visual impact assessment
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's telecommunications prior approval checklist (19 March 2024), page 1 (the main
  list is the local criteria checklist published March 2026). The last item lists information that 'may
  be needed'.
review-status: unverified
field-status: {}
