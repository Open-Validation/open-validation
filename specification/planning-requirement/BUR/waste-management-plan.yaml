reference: waste-management-plan
local-authority: BUR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The creation of new dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New business, retail, food, pub and restaurant, industrial, leisure or similar uses.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 'Thresholds: • All proposals involving the creation of new dwellings or new business, retail,
  food, pub and restaurant uses, industrial or leisure or other similar developments; and • And other
  developments if specified in pre-application advice.'
must-include:
- item: Facilities for the storage and collection of refuse, including recycling facilities and access
    for refuse collection vehicles
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 17, page 14. 'Refuse Disposal Details'.
review-status: unverified
field-status: {}
