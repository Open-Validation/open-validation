reference: location-plan
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - hh
      - advertising
      - pa-ecomms-network
      - waste-dev
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
source-url: https://www.bury.gov.uk/asset-library/householder-applications-validation-checklist-march-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2 copies of an Ordnance Survey based location plan.
must-include:
- item: At a scale of 1:1250 or 1:2500, with the direction of North
  level: must
- item: At least two named roads (if practicable) and surrounding buildings, named and numbered
  level: must
- item: Application site edged red (including land needed for access to the adopted highway); other land
    owned edged blue
  level: must
- item: 'For wind turbines: all development, ancillary equipment and access to an adopted highway inside
    the red edge, and the position of public roads, footpaths and bridleways'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
- item: 'For waste development: red line includes land for access from a public highway, visibility splays,
    landscaping, car parking and open areas around buildings'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 2 copies (householder, advertisement and telecommunications checklists)
  level: should
  required-if:
    application-type:
      in:
      - hh
      - advertising
      - pa-ecomms-network
confidence: medium
notes: From the council's householder checklist (19 March 2024), page 1 (the main list is the local criteria
  checklist published March 2026). The same location plan wording is in the advertisement and telecommunications
  checklists (page 1), the wind turbine checklist (page 1) and the waste checklist (item 6, page 2). The
  local criteria checklist relies on the national requirements for other application types.
review-status: unverified
field-status: {}
