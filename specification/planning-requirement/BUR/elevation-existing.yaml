reference: elevation-existing
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - hh
      - pa-ecomms-network
      - waste-dev
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: Advertisements on buildings.
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
source-url: https://www.bury.gov.uk/asset-library/householder-applications-validation-checklist-march-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2 copies of the existing and proposed relevant elevations at a scale of not less than 1:100
must-include:
- item: At a scale of not less than 1:100 (1:50 or 1:100 for waste and wind turbines)
  level: must
confidence: medium
notes: From the council's householder checklist (19 March 2024), page 1 (the main list is the local criteria
  checklist published March 2026). Also the advertisement (advertisements on buildings), telecommunications,
  waste (item 9) and wind turbine checklists. Existing elevations only where there is an existing building.
review-status: unverified
field-status: {}
