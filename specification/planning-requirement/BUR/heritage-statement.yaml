reference: heritage-statement
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - locally-listed-building
      description: The development is in or affects a conservation area, the setting of a listed building
        or scheduled monument, or a non-designated heritage asset.
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: Heritage Statements/ Listed Building Character Assessment/Conservation Area Appraisal/Non
  Designated Heritage Assets In line with Paragraph 200 of the National Planning Policy Framework applicants
  are required to describe the significance of any heritage assets affected, including any contribution
  made by their setting.
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
confidence: medium
notes: 'Audit (missing_requirement): item 6 also applies to full applications, not only LBC and householder.'
review-status: unverified
field-status: {}
