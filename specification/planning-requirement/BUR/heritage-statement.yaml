reference: heritage-statement
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - locally-listed-building
      description: Works to a non-designated heritage asset.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - conservation-area
      description: Involves a listed building, or may affect the setting of a listed building, scheduled
        monument or conservation area (statement of impact).
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: NPPF paragraph 200
source-text: Applications for listed building consent and planning applications for works to Non Designated
  Heritage Assets will be required to be accompanied by a heritage statement.
must-include:
- item: Describes the significance of the heritage assets affected, including their setting, proportionate
    to their importance; the historic environment record consulted as a minimum
  level: must
- item: 'Listed buildings: the design principles and concepts applied, how access and fabric have been
    considered (except interior-only works), and how scale, layout and appearance take account of the
    building''s special interest, physical features and setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Conservation areas (planning applications other than change of use): a contextual Conservation
    Area Appraisal showing how the proposal has regard to, and preserves or enhances, the character or
    appearance of the area (may form part of the Design and Access Statement)'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within or affecting the setting of a conservation area.
  source-text: A contextual Conservation Area Appraisal will be required for applications for planning
    permission (apart from change of use) on sites within conservation areas or affecting the setting
    of a conservation area.
- item: 'A statement of significance: what is significant and how the proposals affect it, including whether
    the scheme could be adjusted to leave the significance unharmed'
  level: must
- item: Reflects 'A Charter for English Heritage Advisory Services' (Historic England)
  level: should
- item: Appropriate photographs with a Conservation Area Appraisal
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Conservation Area Appraisal.
confidence: medium
notes: 'From the council''s list (published March 2026), local criteria all developments checklist (March
  2026), item 6, page 4-5. ''Heritage Statements/ Listed Building Character Assessment/Conservation Area
  Appraisal/Non Designated Heritage Assets''. Also: ''Any proposals that involve a Listed Building or
  may affect the setting of a Listed Building, scheduled monument or conservation area will be required
  to be accompanied by a statement of any impact.'' The householder checklist lists the same statements
  as ''may be needed''.'
review-status: unverified
field-status: {}
