reference: energy-statement
local-authority: BUR
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use applications.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: 'Places for Everyone Policy JP-S2: Carbon and Energy'
source-text: 'Threshold: • All “major” developments • All new buildings – minor developments excluding
  householder development. • Change of use applications • And other developments if specified in pre-application
  advice.'
confidence: medium
