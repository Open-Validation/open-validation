reference: site-plan
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - hh
      - pa-ecomms-network
      - waste-dev
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: freestanding-advert
        value: true
        description: Advertisements to be erected on land.
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
source-url: https://www.bury.gov.uk/asset-library/householder-applications-validation-checklist-march-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2 copies of the existing and proposed site layout or block plan (where changes are proposed)
  at a scale of 1:100 or 1:200.
must-include:
- item: 'Householder: at 1:100 or 1:200, existing and proposed, with the direction of north'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Householder: all buildings and structures, boundaries, gardens, walls, hedges and fences, open
    spaces, roads, footpaths, access and car parking spaces (dimensioned), existing and proposed'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Householder: position of all trees on adjoining land; hard and soft landscaping; adjacent houses
    with the location of any windows; bin storage'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Householder: the position and spread of any tree within two metres of the development''s canopy
    spread'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development within two metres of the canopy spread of any tree.
  source-text: For householder applications, any proposals involving development within two metres of
    the canopy spread of any tree(s) should indicate the position and spread of the tree(s) on the application
    plans;
- item: 'Advertisements on land: at 1:100, 1:200 or 1:500 with the same details (north, buildings and
    boundaries, trees on adjoining land, landscaping, adjacent windows)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Telecommunications: siting and layout with dimensions at 1:100, 1:200 or 1:500, north, surroundings,
    trees, landscaping, adjacent windows and the dimensioned position of any free-standing equipment'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: 'Waste: at 1:500 or 1:200, north, the development in relation to site boundaries with written
    dimensions, existing topographical study plan, adjoining buildings, roads and access, species/position/spread
    of trees within 12 metres of building works, hard surfacing and boundary treatment'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Wind turbines: at 1:500 or 1:250, the turbine and ancillary equipment, with a six figure easting
    and northing grid reference'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
confidence: medium
notes: From the council's householder checklist (19 March 2024), page 1 (the main list is the local criteria
  checklist published March 2026). Also from the advertisement (page 1), telecommunications (page 1),
  waste (item 7, pages 2-3) and wind turbine (page 1) checklists, and local criterion 14 (page 13) for
  trees near householder works.
review-status: unverified
field-status: {}
