reference: elevation-proposed
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - hh
      - pa-ecomms-network
      - waste-dev
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: Advertisements on buildings.
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
source-url: https://www.bury.gov.uk/asset-library/householder-applications-validation-checklist-march-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2 copies of the existing and proposed relevant elevations at a scale of not less than 1:100
must-include:
- item: At a scale of not less than 1:100 (1:50 or 1:100 for waste and wind turbines)
  level: must
- item: 'Householder: shown in a street scene context if raising the ridge height'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: height-change
        value: true
        description: The proposal raises the ridge height.
- item: 'Advertisements: drawings at not less than 1:100 showing size, siting, materials, colour, height
    above ground, extent of projection and the method and colours of illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Drawings at a scale of not less than 1:100 showing –
- item: 'Waste: all sides including blank elevations, proposed materials and window and door finishes
    where possible, and the relationship and openings where adjoining or close to another building'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Wind turbines: the turbine(s) and ancillary equipment at 1:100 or 1:50'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
confidence: medium
notes: From the council's householder checklist (19 March 2024), page 1 (the main list is the local criteria
  checklist published March 2026). Also the advertisement, telecommunications, waste (item 9, page 3)
  and wind turbine checklists.
review-status: unverified
field-status: {}
