reference: noise-assessment
local-authority: BUR
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Development that could lead to a noise nuisance to nearby occupiers and/or amenity
          users.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Nearby occupiers or amenity users.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Development close to a permanent source of noise, e.g. a main road or motorway.
  - application-type:
      in:
      - waste-dev
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: B) Noise – For developments that could lead to a noise nuisance to nearby occupiers and/or
  amenity users and for development close to a permanent source of noise e.g. a main road or motorway.
must-include:
- item: Sound insulation covered in the supporting statement for changes of use under, over or next to
    homes, or noise sensitive uses next to noise sources, or noisy uses next to noise sensitive uses
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use of premises under, over or adjacent to residential development, or
        next to noise sources/sensitive uses.
- item: 'Waste: a Noise Impact Statement by a suitably qualified acoustician'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Wind turbines: site specific noise survey by a suitably qualified person showing compliance with
    ETSU-R-97 (manufacturer''s standard data is not enough), and a shadow flicker report for properties
    within 10 times the turbine height'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 9B, page 8. 'Nearby' and 'close to' are not defined, so the list's advice to seek pre-application
  advice is shown as discretionary. Compulsory for waste applications unless agreed in writing (waste
  checklist item 12, page 3); required for wind turbines (wind turbine checklist, page 2).
review-status: unverified
field-status: {}
