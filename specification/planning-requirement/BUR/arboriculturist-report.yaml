reference: arboriculturist-report
local-authority: BUR
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New development.
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Sites containing significant tree cover or individual specimen trees, or trees
            subject to Bio-diversity Net Gain proposals.
      - site:
          in:
          - tree-preservation-zone
          description: Trees subject to a Tree Preservation Order.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 'Thresholds: • All applications involving new development on sites containing significant
  tree cover, or individual specimen trees, or trees which are the subject of a Tree Preservation Order
  or subject to Bio-diversity Net Gain proposals; • For householder applications, any proposals involving
  development within two metres of the canopy spread of any tree(s) should indicate the position and spread
  of the tree(s) on the application plans; • All applications for tree works proposals made under the
  Town & Country Planning (Tree Preservation)(England) Regulations 2012.'
must-include:
- item: Undertaken by or under a qualified arboriculturalist in accordance with BS 5837
  level: must
- item: Positions of all trees of 75mm stem diameter at 1.5 metres within the site and adjoining or overhanging
    it, with canopy spread; shrub masses and hedges; other relevant features (banks, slopes, walls, fences,
    water features)
  level: must
- item: Species and location of trees, categorised by the BS 5837 method
  level: must
- item: Works proposed, with justification and details of replacement mitigation
  level: must
- item: An Ordnance Survey location plan at 1:1250 and a site plan at 1:200 (or as appropriate) identifying
    the trees
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 14, page 12-13. 'Tree Surveys and Tree Works Proposals'. The list cites BS 5837:2005. For
  householder works within two metres of a tree canopy, the trees go on the plans instead (see site-plan).
review-status: unverified
field-status: {}
