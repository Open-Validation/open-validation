reference: flood-risk-assessment
local-authority: BUR
required-if:
  any:
  - application-type:
      in:
      - mineral-app
      - waste-dev
  - site:
      in:
      - flood-risk-zone
      description: Flood Zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: A site over 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: A site over 1 hectare in Flood Zone 1.
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 11 Flood Risk Assessments - A flood risk assessment will be required in all cases.
confidence: medium
notes: 'Audit (wrong_trigger): from the audit (item 11(a)), Flood Zones 2/3 including minor development
  and change of use, sites over 1ha in Flood Zone 1, certain Flood Zone 1 changes to more vulnerable uses
  (officer discretion), and critical drainage areas. The quoted text is the waste checklist''s.'
review-status: unverified
field-status: {}
