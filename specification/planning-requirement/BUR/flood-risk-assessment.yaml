reference: flood-risk-assessment
local-authority: BUR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: A change of use to a more vulnerable class (e.g. commercial to residential).
    - site:
        in:
        - surface-water-flood-risk
        description: Could be affected by sources of flooding other than rivers and the sea (e.g. surface
          water drains, reservoirs).
  - site:
      in:
      - critical-drainage-area
      description: Flood zone 1 with critical drainage problems notified by the Environment Agency.
  - application-type:
      in:
      - waste-dev
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: NPPF Chapter 14
source-text: 'Thresholds: Development within in flood zone 2 or 3 including minor development and change
  of use; • Development of more than 1 hectare (ha) in flood zone 1; • Development of less than 1 hectare
  in flood zone 1, including a change of use in development type to a more vulnerable class (eg from commercial
  to residential), where they could be affected by sources of flooding other than rivers and the sea (eg,
  surface water drains, reservoirs) • in an area within flood zone 1 which has critical drainage problems
  as notified by the Environment Agency'
must-include:
- item: Addresses flood risk to both property and people, proportionate to the degree of flood risk
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 11, page 9. Required in all cases for waste applications (waste checklist item 11, page
  3).
review-status: unverified
field-status: {}
