reference: archaeological-assessment
local-authority: BUR
required-if:
  any:
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Development involving the disturbance of ground.
    - any:
      - ref: major-development
      - site:
          in:
          - historic-environment-record
          description: Where archaeological remains may survive as identified in the Sites and Monuments
            Register.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: NPPF paragraph 200
source-text: 'Thresholds: • Development involving the disturbance of ground in areas that are the subject
  of major development proposals or significant infrastructure works, where archaeological remains may
  survive, or where archaeological remains may survive as identified in the Sites and Monuments Register.
  • And other developments if specified in pre-application advice.'
must-include:
- item: A desk-based assessment and, where necessary, a field evaluation, where the site includes or may
    include heritage assets with archaeological interest
  level: must
  source-text: developers are required to submit an appropriate desk-based assessment and, where necessary,
    a field evaluation.
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 6 and 12, page 4, 11. Significant infrastructure works 'where archaeological remains may
  survive', and pre-application cases, are discretionary.
review-status: unverified
field-status: {}
