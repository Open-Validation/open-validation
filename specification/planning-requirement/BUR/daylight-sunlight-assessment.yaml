reference: daylight-sunlight-assessment
local-authority: BUR
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: storey-count
        operator: '>='
        value: 4
        description: Four or more storeys in height, where adjoining other developed land.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 'Threshold: • All applications involving new buildings of four or more storeys in height,
  where adjoining other developed land, • Situations where the application site is itself subject to significant
  shading from adjoining buildings or trees. • And other developments if specified in pre-application
  advice.'
must-include:
- item: The impact on adjoining properties, including gardens or amenity space, in respect of daylight
    and sunlight
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 4, page 3. 'Sunlighting/Daylighting Assessment'. Sites that are themselves subject to significant
  shading, and cases specified in pre-application advice, are discretionary.
review-status: unverified
field-status: {}
