reference: photos
local-authority: BUR
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-app
        - waste-dev
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition of an existing building.
  - site:
      in:
      - conservation-area
      - listed-building
      description: Development affecting a conservation area or listed building.
source-url: https://www.bury.gov.uk/asset-library/waste-planning-applications-validation-checklist-march-2024.pdf
source-text: Photographs should be provided if the proposal involves the demolition of an existing building
  or development affecting a conservation area or listed building.
confidence: medium
notes: Any Design and Access Statement or Conservation Area Appraisal should be accompanied by appropriate
  photographs (item 6).
