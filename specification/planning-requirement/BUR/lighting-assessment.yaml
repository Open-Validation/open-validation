reference: lighting-assessment
local-authority: BUR
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: Publicly accessible development near homes, a listed building, a conservation area
        or open countryside, or where external lighting would be provided or made necessary and may have
        long range views.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 'Thresholds: • All proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a Listed Building or a Conservation Area, or open countryside,
  or where external lighting would be provided or made necessary by the development, that may have long
  range views of the lighting. • And other developments if specified in pre-application advice.'
must-include:
- item: The external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment
  level: must
- item: A lighting diagram showing the intensity of illumination
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 18, page 14-15. 'External Lighting Details'.
review-status: unverified
field-status: {}
