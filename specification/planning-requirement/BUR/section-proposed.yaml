reference: section-proposed
local-authority: BUR
required-if:
  application-type:
    in:
    - waste-dev
source-url: https://www.bury.gov.uk/asset-library/waste-planning-applications-validation-checklist-march-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 10 Section drawings drawn at a scale of 1:50 or 1:100 or as appropriate showing a cross section(s)
  through the proposed building(s). In all cases where a proposal involves a change in ground levels,
  illustrative drawings should be submitted to show both existing and finished levels. On sloping sites,
  full information is required concerning alterations to levels, the way in which a proposal sits within
  the site and in particular the relative levels between existing and proposed buildings. The drawings
  may take the form of contours, spot levels or cross or long sections as appropriate.
must-include:
- item: At 1:50 or 1:100 or as appropriate, through the proposed building(s)
  level: must
- item: Existing and finished levels where ground levels change; on sloping sites, how the proposal sits
    within the site and relative levels of existing and proposed buildings
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels or the site slopes.
confidence: medium
notes: From the council's waste planning applications checklist (19 March 2024), page 3 (the main list
  is the local criteria checklist published March 2026). Compulsory requirement 10 for waste applications.
  Levels for other applications (local criterion 21) are in the unmapped list.
