source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: 'Places for Everyone Policy JP-C8: Transport Requirements for New Developments'
source-text: A Transport Assessment will be required for developments likely to have significant transport
  impacts. It should quantify and assess the impact of the proposals on traffic movement and highway safety;
  the availability of alternative transport modes and how alternative modes would be promoted, including,
  where appropriate, green travel plans; and providing details of any proposals for access or transport
  improvements. A Transport Statement will be required when the development is expected to generate relatively
  low numbers of trips or traffic flows with minor transport impacts. Its purpose would be to cover matters
  such as trip generation resulting from the development, improvements to site accessibility, car parking
  provision and internal vehicular circulation, traffic impacts of servicing requirements and the net
  level of change over any current development within the site.
must-include:
- item: 'Transport Assessment: the impact on traffic movement and highway safety, alternative transport
    modes and how they would be promoted (including green travel plans where appropriate), and any access
    or transport improvements'
  level: must
- item: 'Transport Statement: trip generation, site accessibility improvements, car parking and internal
    circulation, servicing traffic and the net change over current development'
  level: must
- item: The impact of the proposal on Holcroft Moss (PfE Policy JP-C8), for every application needing
    a Transport Assessment
  level: must
  source-text: all applications that require a Transport Assessment will need to consider the impact of
    the proposal on Holcroft Moss
- item: 'Waste: all existing and proposed vehicle and pedestrian movements, loading, manoeuvring, servicing
    and parking areas'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: 'From the council''s list (published March 2026), local criteria all developments checklist (March
  2026), item 7 and 32, page 5-7, 18-19. The floor area thresholds table: a Transport Statement above
  the first figure and a full Transport Assessment above the second (food retail 250/800 sq m, non-food
  800/1,500, financial 500/2,500, E(g) 500/2,500, B2 500/4,000, B8 500/5,000, C1 30/100 beds, C3 10/80
  units, F1 500/1,000, F2 500/1,500). ''Seek Advice'' rows (restaurants, drinking establishments, other
  commercial premises), accidents, significant freight movements and inadequate infrastructure are discretionary,
  and the list says the requirements are not exhaustive. Compulsory for waste applications (waste checklist
  item 13, page 3).'
