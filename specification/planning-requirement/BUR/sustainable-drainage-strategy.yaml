reference: sustainable-drainage-strategy
local-authority: BUR
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (below the major development thresholds).
    - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: NPPF / NPPG; Non-Statutory Technical Standards for sustainable drainage systems
source-text: Planning applications for major development shall be accompanied by a site-specific drainage
  strategy or statement that demonstrates that the drainage scheme proposed is in compliance with the
  both the NPPF / NPPG and the Non- Statutory Technical Standards. SuDS will also apply to minor developments
  but the levels of information shall be commensurate with the scale of the scheme
must-include:
- item: Shows the drainage scheme complies with the NPPF/NPPG and the Non-Statutory Technical Standards,
    and how the hierarchy of drainage techniques and run-off destinations has been considered
  level: must
- item: 'Outline: a drainage statement with an outline drainage assessment (topography and existing flow
    routes, drains, sewers and watercourses; geology and soils; initial scoping of flood risk) and an
    indicative drainage strategy (preliminary SuDS proposals, outfall locations, discharge rates, on-site
    storage)'
  level: must
  required-if:
    application-type:
      in:
      - outline
      - outline-all
      - outline-some
- item: 'Full and reserved matters: a site plan with exceedance flow routes and catchments; a drainage
    layout (SuDS, sewers, drains, watercourses); a site investigation report (boreholes or trial pits,
    infiltration testing, GIR, GDR); flow calculations and storm simulation for 1 in 1, 1 in 2, 1 in 30
    and 1 in 100 year + 30% climate change'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 11(b) and Appendix 1, page 9-11, 20-25. SuDS 'will also apply to minor developments but
  the levels of information shall be commensurate with the scale of the scheme', so minor development
  is discretionary.
review-status: unverified
field-status: {}
