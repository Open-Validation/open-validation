reference: affordable-housing-statement
local-authority: BUR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 25
      description: Applications providing 25 or more dwellings.
  - condition:
      field: affordable-housing-proposed
      value: true
      description: The proposal specifically provides for affordable housing.
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: Development Control Policy Guidance Note 5 – Affordable Housing Provision in New Residential Developments
source-text: 'Threshold: • All applications providing 25 or more dwellings, • Other cases where the proposal
  specifically provides for affordable housing.'
must-include:
- item: What provision is made for affordable housing, including size and tenure of units and arrangements
    with social housing providers
  level: must
- item: 'Where vacant building credit is claimed: when the building was last used and why it is vacant,
    its condition, the period of non-use, any intervening use and the owner''s intentions, and whether
    it was made vacant for redevelopment or has an extant or recent permission'
  level: must
  required-if:
    condition:
      field: vacant-building
      value: true
      description: The application claims vacant building credit.
- item: The affordable housing pro-forma, where a s106 Agreement on affordable housing is intended
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 3, page 2-3.
review-status: unverified
field-status: {}
