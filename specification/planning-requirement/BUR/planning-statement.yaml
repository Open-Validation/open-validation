reference: planning-statement
local-authority: BUR
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Developments not in accordance with the development plan.
  - condition:
      field: wind-turbine
      value: true
      description: An application for one or more wind turbines.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: National planning guidance, the development plan and adopted Supplementary Planning Guidance
source-text: 'Threshold: • All “major” developments • Developments not in accordance with the development
  plan • And other developments if specified in pre-application advice.'
must-include:
- item: How the proposal relates in policy terms to national planning guidance, the development plan and
    adopted Supplementary Planning Guidance (and emerging Local Plan and SPDs)
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 1, page 1. 'Supporting Planning Policy Statement'. 'If specified in pre-application advice'
  is discretionary. The wind turbine checklist also asks for a Planning Statement; the waste checklist
  lists one as additional information 'where appropriate'.
review-status: unverified
field-status: {}
