reference: sci
local-authority: BUR
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: An application for one or more wind turbines.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>='
          value: 3
          description: 3 or more turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 20
          description: Any turbine with a hub height over 20m.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
policy: NPPF paragraph 41
source-text: 'This will be required where proposals are likely to generate significant public interest
  and the statement shall include the views of the local community, and where appropriate the views of
  Statutory Consultees have been sought and taken into account in the formulation of development proposals.
  Thresholds: • All major planning applications • And other developments if specified in pre-application
  advice.'
must-include:
- item: The views of the local community and, where appropriate, statutory consultees, and how they were
    taken into account in formulating the proposals
  level: must
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 19, page 15. Pre-application cases are discretionary. Community engagement is also required
  for wind turbines ('To be carried out for 3 or more turbines OR any turbine with a hub height which
  exceeds 20m', wind turbine checklist page 3); the telecommunications checklist lists an SCI as may be
  needed.
review-status: unverified
field-status: {}
