reference: landscaping-plan
local-authority: BUR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a change of use only.
  - discretionary
source-url: https://www.bury.gov.uk/asset-library/local-criteria-all-developments-validation-checklist.pdf
source-text: 'Thresholds: • Applications for full planning permission (apart from change of use) should
  preferably be accompanied by a fully detailed scheme, as above. There is a minimum requirement for proposals
  to indicate the intended landscape structure, which should be cross-referenced with the design and access
  statement.'
must-include:
- item: As a minimum, the intended landscape structure, cross-referenced with the Design and Access Statement
  level: must
- item: Finished ground levels or contours; means of enclosure; car parking layouts; vehicle and pedestrian
    access and circulation; hard surfacing, structures and ancillary objects
  level: should
- item: Existing and proposed services above and below ground
  level: should
- item: Planting plans, written specifications and plant schedules (species, sizes, numbers or densities)
  level: should
- item: Existing vegetation to be retained and how it will be protected during construction
  level: should
- item: Maintenance details
  level: should
- item: Consistent with Bio-diversity Net Gain proposals
  level: should
confidence: medium
notes: From the council's list (published March 2026), local criteria all developments checklist (March
  2026), item 15, page 13-14. 'Hard and Soft Landscaping Details'. A fully detailed scheme is 'preferably'
  provided (should); the minimum is the intended landscape structure. Householder applications where the
  proposal is particularly prominent or loses significant landscape features, cases specified at pre-application,
  and waste applications ('where appropriate') are discretionary.
review-status: unverified
field-status: {}
