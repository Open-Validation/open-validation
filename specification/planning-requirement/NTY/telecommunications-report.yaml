reference: telecommunications-report
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - condition:
      field: telecommunications-development
      value: true
      description: Mast and antenna development by a mobile phone network operator.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) DM7.11
source-text: Planning applications for mast and antenna development by mobile phone network operators.
must-include:
- item: Area of search
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification
  level: must
- item: Evidence of alternative sites selection, including opportunities for mast sharing
  level: must
- item: Outcome of consultations, in particular with the relevant body where a mast is near a school or
    college
  level: must
- item: Evidence that the infrastructure is not expected to cause significant and irremediable interference
    with other electrical equipment, air traffic services or instrumentation operated in the national
    interest
  level: must
- item: Evidence that the site is the most sustainable option and would not harm local character, visual
    amenity or heritage assets
  level: must
- item: A signed declaration that the equipment and installation comply with the ICNIRP radio frequency
    public exposure guidance
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 73 of the PDF edition (North Tyneside publishes
  the same text as a web page). Note 32 of the list. The outline checklist marks it 'No' for outline applications.
review-status: unverified
field-status: {}
