reference: roof-plan-proposed
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - demolition-con-area
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: The proposal alters an existing roof.
    - discretionary
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
source-text: Roof Plans should be submitted where there is an alteration to an existing roof or otherwise
  where this is expected to add to the understanding of the proposal.
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is requested and agreed)
  level: must
- item: Shape of the roof, its location and the proposed facing materials
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 16 of the PDF edition (North Tyneside publishes
  the same text as a web page). Note 10(d) of the list. The list asks for both existing and proposed roof
  plans. Shown as discretionary as well, because they are also needed 'where this is expected to add to
  the understanding of the proposal'.
review-status: unverified
field-status: {}
