reference: flood-risk-assessment
local-authority: NTY
required-if:
  any:
  - all:
    - site:
        in:
        - critical-drainage-area
        description: The site is in a critical drainage area identified in the strategic flood risk assessment.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: The site is more than 0.5 hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.5
          description: The site is more than 0.5 hectare.
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3 (including householder and other minor development
        and change of use).
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: 'A Flood Risk Assessment (FRA) will be required for all planning applications for: Development
  on sites of more than 0.5 hectare within a local authority''s own identified critical drainage area
  (as identified within the strategic flood risk assessment) Development in Flood Zones 2 and/or 3 including
  householder and other minor development and change of use; …'
confidence: low
notes: 'Audit (wrong_app_type): the prior approval row is dropped, because the ''change of use'' wording
  refers to planning applications. The Gateshead audit quotes Note 17: ''A simple FRA is needed for householder
  extensions in Flood Zones 2 and 3''. The list goes on to further cases not extracted. The audit couldn''t
  read this council''s list, so its contents weren''t checked.'
review-status: unverified
