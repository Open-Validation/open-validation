reference: arboriculturist-report
local-authority: NTY
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - demolition-con-area
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on site, or canopies of trees on adjacent land overhanging the site, likely
          to be impacted by the development.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: A tree protected by a Tree Preservation Order is on site or overhangs it, or the
          site is in a conservation area.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) DM5.9
source-text: Applications where trees are present on site, or where the canopies of trees on adjacent
  land overhang the application site, where those trees are potentially or likely to be impacted by the
  proposed development. … Where a tree protected by a Tree Preservation Order is on site or where the
  canopies of protected trees on adjacent land overhang the site, or where the site is in a conservation
  area
must-include:
- item: Title states the document is/includes a Tree Report/Plan, no more than 12 months old
  level: must
- item: 'TPO trees or conservation area: age class, physiological and structural condition, preliminary
    management recommendations, estimated remaining contribution in years and BS5837:2012 category grading'
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: A tree is protected by a Tree Preservation Order or the site is in a conservation area.
- item: 'Householder: tree survey, Arboricultural Impact Assessment, Arboricultural Method Statement and
    Tree Protection Plan in accordance with BS 5837:2012'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published January 2025), page 86-87, 106-107 of the PDF edition (North
  Tyneside publishes the same text as a web page). Note 35 of the list (Tree Survey and/or Statement of
  Arboricultural Implications of Development) and the householder checklist (Tree Survey / Protection
  Plan).
review-status: unverified
field-status: {}
