reference: elevation-existing
local-authority: NTY
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - lbc
        - demolition-con-area
    - condition:
        field: external-alterations
        value: true
        description: External alterations are proposed.
  - application-type:
      in:
      - advertising
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
source-text: Elevation plans are required for all applications where external alterations are proposed;
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is required and agreed)
  level: must
- item: All external sides of the proposal shown
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: 'Where the elevation adjoins or is close to another building or structure: the relationship between
    the two and the positions of any openings on each property'
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 16 of the PDF edition (North Tyneside publishes
  the same text as a web page). Note 10(a) of the list (Application Plans).
review-status: unverified
field-status: {}
