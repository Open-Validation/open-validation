reference: planning-statement
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: 100 dwellings or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 10000
        description: At least 10,000 sq m of commercial/retail development.
    - all:
      - ref: major-development
      - condition:
          field: departure-from-development-plan
          value: true
          description: A departure from the development plan.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) S1.4
source-text: All planning applications for 100 dwellings or more or where a minimum of 10,000 sq. metres
  of commercial/retail development would be created, or major planning applications that would constitute
  a departure from the development plan.
must-include:
- item: Title states whether the documents is/includes a planning statement (it can be part of the Design
    and Access Statement)
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 65 of the PDF edition (North Tyneside publishes
  the same text as a web page). Note 27 of the list.
review-status: unverified
field-status: {}
