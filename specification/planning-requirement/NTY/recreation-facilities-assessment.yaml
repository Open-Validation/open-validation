reference: recreation-facilities-assessment
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - open-space
      description: Development on existing open space, sports and recreational buildings and land, including
        playing fields.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) S5.1, DM5.2, DM5.3
source-text: All planning applications for development on existing open space, sports and recreational
  buildings and land, including playing fields.
must-include:
- item: Title states whether the documents is/includes an open space and/or playing pitch assessment (it
    can be part of the Design and Access Statement or Planning Statement)
  level: must
- item: Plans to scale, with area measurements, showing any existing or proposed open space within or
    adjoining the site
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 62 of the PDF edition (North Tyneside publishes
  the same text as a web page). Note 25 of the list (Open Space Assessment, including playing fields and
  recreational buildings).
review-status: unverified
field-status: {}
