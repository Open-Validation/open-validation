reference: heritage-statement
local-authority: NTY
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      description: The proposal is in or affects a conservation area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The proposal affects a designated or non-designated heritage asset.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: 'Heritage Statement When is this required? A Heritage Statement is required for: Listed Building
  Consent applications; … Other applications in conservation areas, including demolition'
must-include:
- item: For heritage assets on the Heritage at Risk Register, how the asset will be brought into repair
    and, where possible, reuse
  level: must
  source-text: Applications which affect heritage assets included on the Heritage at Risk Register will
    be required to demonstrate how they will bring that heritage asset into repair, and where possible,
    reuse.
confidence: low
notes: 'From the audit (missing_requirement): Full planning has no Heritage Statement row; the sibling
  audits give Note 19''s cases (listed building consent, major applications in or affecting conservation
  areas, demolition in conservation areas, any application affecting a heritage asset). ''Other applications
  in conservation areas, including demolition'' is quoted by the Gateshead audit. The Heritage at Risk
  sentence is the joint list''s wording, as extracted for Gateshead (the audit lists Heritage at Risk
  as missing here). The audit couldn''t read this council''s list, so its contents weren''t checked.'
