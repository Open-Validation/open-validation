reference: proposed-habitat-plan
local-authority: NTY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Not exempt from the biodiversity gain condition (Schedule 7A, Town and Country Planning
      Act 1990).
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: Town and Country Planning Act 1990, Schedule 7A
source-text: Pre- and post- development site plans clearly showing polygons and areas for each habitat
  used to populate the statutory metric calculation tool using UK Habitat Classification symbology (shapefiles
  in GIS or AutoCAD may be requested).
must-include:
- item: Polygons and areas for each habitat used in the statutory metric, in UK Habitat Classification
    symbology (Phase 1 symbology not accepted)
  level: must
- item: Drawn to an identified scale and showing the direction of north
  level: must
- item: Polygons labelled with a Habitat Reference Number that is also noted in the metric tool
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 32-33 of the PDF edition (North Tyneside
  publishes the same text as a web page). The post-development plan. Note 16C of the list. The list says
  'All applications', but householder and other exempt development is exempt by law (the list names the
  exemptions), so the rule follows the biodiversity gain condition. Exempt applications (other than householder
  or change of use with no groundworks) need a statement setting out why the development is exempt.
