reference: waste-management-plan
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: New or increased commercial floorspace.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
      - condition:
          field: waste-storage-facilities
          value: true
          description: New or enhanced waste storage provision is required.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
source-text: Planning applications involving new dwellings, new and increased commercial floorspace and
  changes of use applications that require new or enhanced waste storage provision.
must-include:
- item: Waste management details provided on relevant plans
  level: must
- item: Proposals can be part of the Design and Access Statement, Transport Assessment/Statement or Planning
    Statement
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 91-92 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 38 of the list; Newcastle also asks for its Waste Management
  Plan form.
review-status: unverified
field-status: {}
