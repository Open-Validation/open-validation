reference: ecology-assessment
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: semi-natural-habitat-impact
      value: true
      description: The application could impact upon semi-natural habitats within or outside the site.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) S5.4, DM5.5, DM5.6, DM5.7
source-text: An EcIA will be required for applications (excluding householder) which could impact upon
  semi-natural habitats, both within and external to the development site.
must-include:
- item: Title confirming the document is/includes an Ecological Impact Assessment
  level: must
- item: 'Or: written confirmation from the council ecologist (at pre-application stage) that it is not
    required, or a submitted preliminary ecological assessment confirming no further work is required'
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 30-31 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 16B of the list (Ecological Impact Assessment, EcIA). Not
  required if the council ecologist confirms in writing that it is not needed, or an approved preliminary
  ecological assessment concludes no further survey work is needed.
review-status: unverified
field-status: {}
