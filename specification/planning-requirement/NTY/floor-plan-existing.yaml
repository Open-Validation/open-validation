reference: floor-plan-existing
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - demolition-con-area
  - any:
    - condition:
        field: floor-layout-change
        value: true
        description: The floor plans are materially affected by the proposal.
    - discretionary
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
source-text: Floor plans, Site Sections and Site Levels are required for applications where this would
  be expected to add to the understanding of the proposal and/or where floor plans, site sections and
  site levels respectively are materially affected by the proposal;
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is required and agreed)
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: Proposal shown in context with the site boundary and existing adjacent buildings, including property
    numbers/names where appropriate
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 16 of the PDF edition (North Tyneside publishes
  the same text as a web page). Note 10(b) of the list. Shown as discretionary as well, because plans
  are also needed where they 'would be expected to add to the understanding of the proposal'.
review-status: unverified
field-status: {}
