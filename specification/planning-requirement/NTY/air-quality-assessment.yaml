reference: air-quality-assessment
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more dwellings.
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: A site of more than 0.5 ha.
      - any:
        - all:
          - site:
              in:
              - air-quality-management-area
              description: In or close to an Air Quality Management Area.
          - condition:
              field: parking-spaces
              operator: '>'
              value: 10
              description: More than 10 vehicle parking spaces.
        - condition:
            field: parking-spaces
            operator: '>='
            value: 100
            description: 100 or more vehicle parking spaces elsewhere.
    - all:
      - any:
        - condition:
            field: floorspace-non-residential
            operator: '>'
            value: 1000
            description: More than 1,000 sq m new floorspace for uses other than residential.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 1
            description: A site greater than 1 ha.
      - any:
        - all:
          - site:
              in:
              - air-quality-management-area
              description: In or close to an Air Quality Management Area.
          - condition:
              field: parking-spaces
              operator: '>'
              value: 10
              description: More than 10 vehicle parking spaces.
        - condition:
            field: parking-spaces
            operator: '>='
            value: 100
            description: 100 or more vehicle parking spaces elsewhere.
    - condition:
        field: dust-generation
        value: true
        description: An activity that requires an environmental permit or has significant potential to
          generate dust during construction or demolition, with residential uses within 200 metres.
    - condition:
        field: biomass-or-chp
        value: true
        description: One or more substantial combustion processes (e.g. centralised energy centre, waste
          incineration or biomass) where there is a risk of impacts to relevant receptors.
    - discretionary
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) DM5.19
source-text: 'Air quality assessments will be required where the proposal includes: … 1. Development of
  10 or more dwellings or a site of more than 0.5ha where more than 10 vehicle parking spaces are proposed
  in or close to the Air Quality management Area and 100 spaces elsewhere; … 2. Development of more than
  1,000 square metres new floorspace for all uses other than residential or site greater than 1ha where
  more than 10 vehicle parking spaces in or close to an Air Quality management Area (AQMA) and 100 spaces
  elsewhere … 3. Development where there is potential for a significant change in vehicle traffic flows
  in the surrounding area; … 4. Development where the impact from neighbouring sources have the potential
  to impact upon the air quality of the development site; … 5. An activity that requires an environmental
  permit or has significant potential to generate dust during construction or demolition, where there
  are residential uses within 200 metres; … 6. One or more substantial combustion processes is proposed,
  for example, centralised energy centre, waste incineration or biomass, where there is a risk of impacts
  to relevant receptors'
must-include:
- item: Title states the document is/includes an air quality assessment
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 21-22 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 13 of the list. Discretionary covers trigger 3 (a significant
  change in traffic flows, which the list defines by Annual Average Daily Traffic increases of LDVs, HDVs
  and buses, road realignment, junction changes and car park extracts), trigger 4 (neighbouring sources)
  and 'in exceptional circumstances' requests. '100 spaces elsewhere' is read as 100 or more.
review-status: unverified
field-status: {}
