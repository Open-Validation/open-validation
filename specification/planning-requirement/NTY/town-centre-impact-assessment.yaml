reference: town-centre-impact-assessment
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in an existing centre and not in accordance with an up-to-date
        Local Plan.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) S3.1, S3.2, S3.3, DM3.4, DM3.5, DM3.6
source-text: Main town centre uses that are not in an existing centre and not in accordance with an up-to-date
  Local Plan.
must-include:
- item: Title states whether the documents is/includes a town centre use assessment and whether it includes
    an impact assessment and a sequential test
  level: must
- item: Impact assessment where 500 sq m (gross) or more comparison retail floorspace, 1,000 sq m (gross)
    or more for supermarkets/superstores, or over 2,500 sq m (gross) for other uses is proposed edge or
    out of centre
  level: must
  required-if:
    any:
    - condition:
        field: comparison-retail-floorspace
        operator: '>='
        value: 500
        description: 500 sq m (gross) or more comparison retail.
    - condition:
        field: convenience-retail-floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m (gross) or more for supermarkets/superstores.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m (gross) for other uses.
confidence: medium
notes: From the council's list (published January 2025), page 75-76 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 33 of the list (Town Centre Use Assessment); the impact
  assessment thresholds are in the table on page 75 and differ for each council. The reserved matters
  checklist marks it 'No'.
review-status: unverified
field-status: {}
