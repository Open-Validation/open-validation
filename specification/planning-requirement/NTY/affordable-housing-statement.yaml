reference: affordable-housing-statement
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: Housing development of 11 dwelling units or more.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: Gross internal area of more than 1,000 sq m.
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: North Tyneside Local Plan (2017) DM4.7
source-text: 'North Tyneside only: All applications for housing development of 11 dwelling units or more
  and gross internal area of more than 1,000 square metres.'
must-include:
- item: Title states the document is/includes an affordable housing statement (it can be part of the Design
    and Access or Planning Statement)
  level: must
- item: 'Full and reserved matters applications: the location of the affordable units shown on the plans'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (published January 2025), page 19-20 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 12 of the list; the thresholds differ for each Tyneside
  council.
review-status: unverified
field-status: {}
