reference: bng-metric
local-authority: NTY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Not exempt from the biodiversity gain condition (Schedule 7A, Town and Country Planning
      Act 1990).
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
policy: Town and Country Planning Act 1990, Schedule 7A; North Tyneside Local Plan (2017) S5.4, DM5.5,
  DM5.6, DM5.7
source-text: All applications will be required to meet requirements for measurable biodiversity net gain
  as set out in Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment Act
  2021).
must-include:
- item: Title includes that the document is/includes a Biodiversity Net Gain Assessment and Report
  level: must
- item: A fully completed statutory DEFRA Biodiversity Metric Calculation Tool, in Excel format
  level: must
- item: Completed statutory metric condition assessments for baseline habitats, with supporting information
    (species lists and quadrat locations)
  level: must
- item: Predicted condition assessments of created/enhanced habitats, with the interventions and management
    to achieve them for a minimum of 30 years
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 31-33 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 16C of the list. The list says 'All applications', but
  householder and other exempt development is exempt by law (the list names the exemptions), so the rule
  follows the biodiversity gain condition. Exempt applications (other than householder or change of use
  with no groundworks) need a statement setting out why the development is exempt.
review-status: unverified
field-status: {}
