reference: elevation-proposed
local-authority: NTY
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - lbc
        - demolition-con-area
    - condition:
        field: external-alterations
        value: true
        description: External alterations are proposed.
  - application-type:
      in:
      - advertising
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
source-text: Elevation plans are required for all applications where external alterations are proposed;
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is required and agreed)
  level: must
- item: All external sides of the proposal shown
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: 'Where the elevation adjoins or is close to another building or structure: the relationship between
    the two and the positions of any openings on each property'
  level: should
- item: 'Advertisements: plans of the advert(s) at 1:50 or 1:100 showing elevations, size, position on
    buildings or land, height above ground, projection, sections, materials, colours and method of fixing'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Plans of the advert(s) to a scale of 1:50 or 1:100 showing their elevations, their size,
    position on buildings or land, height above ground level, extent of projection, sections, materials,
    colours and method of fixing;
- item: 'Illuminated advertisements: details of the means of illumination, with a section through the
    advertisement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
  source-text: Details of means of illumination where applicable, with section through advertisement and
    method of illumination.
confidence: medium
notes: From the council's list (published January 2025), page 16, 104 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 10(a) of the list; advertisement consent (Checklist 4,
  page 104) marks Application Plans 'Yes' and lists what the advert plans must show.
review-status: unverified
field-status: {}
