review-status: unverified
validation-list:
  url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
  date: 2025-01
  date-basis: North Tyneside's own web page 'Validation of planning applications in Tyneside' (checked
    2026-11-06), headed 'Tyneside Validation Checklist 2024' (joint list for Gateshead, Newcastle, North
    Tyneside and South Tyneside). Its text matches Newcastle's PDF edition (file named 'Jan 25', created
    10 January 2025); the page links a SuDS standards file uploaded in October 2025, so it was edited
    then. The stored link (Newcastle's PDF) was replaced by North Tyneside's own page. The planning.data.gov.uk
    register still lists the 2019 list. A joint 'Tyneside Validation Checklist update 2026' file exists
    on South Tyneside's site (uploaded 27 October 2026), but that site is behind a Cloudflare check, it
    is not linked from Newcastle's or North Tyneside's pages, and South Tyneside's own page still showed
    the 2024 list, so it was not used.
  status: current
submission-standards:
- item: All plans and drawings numbered or labelled; amended plans carry a revision number and date
  level: must
- item: Applications submitted online through the Planning Portal; post/email only if that is not feasible
    and agreed; paper copies not recommended
  level: should
- item: All relevant questions on the application form completed, or 'Not Applicable'/N/A inserted; the
    description of development accurately describes the proposal and matches the plans
  level: must
- item: Signatures and personal information redacted in supporting documents, or sensitive information
    put in a separate document marked 'Confidential - Not for Public Use'
  level: should
- item: 'Outline applications: indicative information not for determination clearly marked ''Indicative/For
    information only'''
  level: must
joint-list:
  partners:
  - NET
  - GAT
  - STY
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: false
  workbook-link-current: false
  issues-open: 0
  notes: 'The live source could not be fetched because the web budgets were exhausted, so contents were
    not checked against it. The joint Tyneside 2024 checklist is probably what the link shows, but the
    workbook leaves it undated. Grokbot''s own extracts show misplaced triggers, Householder coal mining
    and change-of-use rows that the source excludes, boilerplate counted as requirements, and several
    joint-list requirements missing (SuDS, acoustic, planning statement, tall buildings, minerals, overheating).
    Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
