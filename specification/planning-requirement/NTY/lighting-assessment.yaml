reference: lighting-assessment
local-authority: NTY
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting (e.g. floodlights or security lights).
  - discretionary
source-url: https://www.northtyneside.gov.uk/residents/planning/getting-planning-permission/validation-planning-applications-tyneside
source-text: When developments is likely to involve the provision of significant external lighting (e.g.
  floodlights or security lights) that may have an impact on residential amenity, the character of the
  surrounding area, heritage asset or the biodiversity value of the area … Developments which include
  floodlighting will need to provide as assessment covering light spillage, hours of illumination, light
  levels, column design, specification and colour, and the need for horizontal cut-off in accordance with
  Institute of Lighting Engineers guidance
must-include:
- item: 'Floodlighting: light spillage, hours of illumination, light levels, column design, specification
    and colour, and the need for horizontal cut-off (Institute of Lighting Engineers guidance)'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: The development includes floodlighting.
confidence: medium
notes: 'From the council''s list (published January 2025), page 69-70 of the PDF edition (North Tyneside
  publishes the same text as a web page). Note 30 of the list (lighting part). Discretionary: needed where
  the lighting ''may have an impact'' on amenity, character, heritage or biodiversity, which is a judgement.'
review-status: unverified
field-status: {}
