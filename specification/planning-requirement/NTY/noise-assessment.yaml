reference: noise-assessment
local-authority: NTY
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development may create additional noise (including Class B2 uses).
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development would be sensitive to the prevailing acoustic environment.
  - condition:
      field: plant-equipment
      value: true
      description: New or replacement industrial plant or machinery is proposed.
  - discretionary
