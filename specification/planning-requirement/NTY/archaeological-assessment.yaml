reference: archaeological-assessment
local-authority: NTY
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: The proposal is on or near a Scheduled Monument.
  - site:
      in:
      - archaeological-priority-area
      description: The site is in the Hadrian's Wall corridor or a Roman fort vicus area.
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: The site is greenfield.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
  - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: Archaeological Assessments When is this required? Archaeological desk based assessment Proposals
  on or near Scheduled Monuments; …
confidence: low
notes: 'From the Gateshead and South Tyneside audits of the joint list (wrong_trigger): near Scheduled
  Monuments, the Hadrian''s Wall corridor, Roman fort vicus areas and greenfield sites of 1ha+ (Note 14);
  the list has further cases, shown as officer discretion. The South Tyneside audit adds archaeological
  field evaluation for new building work in these areas or on sites on the Historic Environment Record.
  The audit couldn''t read this council''s list, so its contents weren''t checked.'
