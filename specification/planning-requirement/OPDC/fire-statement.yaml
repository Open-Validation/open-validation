reference: fire-statement
local-authority: OPDC
required-if:
  any:
  - all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: New or existing buildings 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Containing two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Containing education accommodation.
  - ref: major-development
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; London Plan
  Policy D12
source-text: Development involving new or existing buildings 18 metres or more in height; or 7 or more
  storeys, or development within the curtilage of such buildings containing two or more dwellings or education
  accommodation … Major development … All major development proposals must be submitted with a Fire Statement,
  which is an independent fire strategy, produced by a third party suitably qualified assessor.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Education accommodation.
- item: 'For major development: an independent fire strategy produced by a third party suitably qualified
    assessor'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 1 item 6, page 4. Also Part 2 item 23 (page
  16), which asks every major development for a Fire Statement under London Plan Policy D12, following
  the GLA's guidance on fire safety.
