reference: waste-management-plan
local-authority: OPDC
required-if:
  ref: major-development
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU6; London Plan Policy SI7
source-text: Major development
must-include:
- item: 'Construction phase: volume and type of material to be demolished and/or excavated, and opportunities
    for reuse and recovery'
  level: must
- item: 'Construction phase: how off-site disposal of waste will be minimised and managed'
  level: must
- item: 'Construction phase: frequency and timing of collections and drag distances, with a tracked drawing
    of waste vehicle movements'
  level: must
- item: 'Operational stage: a calculation confirming residential/commercial refuse and recycling requirements
    are met on site, including bin size/capacity and store dimensions'
  level: must
- item: 'Operational stage: how refuse/recycling collections would be managed, including access for waste
    vehicles and drag distances'
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 39 (Site Waste Management Plan), page
  22.
review-status: unverified
field-status: {}
