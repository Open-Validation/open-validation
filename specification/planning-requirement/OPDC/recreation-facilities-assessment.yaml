reference: recreation-facilities-assessment
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - condition:
      field: new-open-space
      value: true
      description: Creation of public open space.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU1; Draft NPPF (2025) Policy HC7
source-text: Major development Creation of public open space
must-include:
- item: Existing open space in the vicinity of the site
  level: must
- item: Any open space lost as a result of the development (ha)
  level: must
- item: The area of any open space proposed (ha) and its type
  level: must
- item: Any necessary mitigation, which may include financial contributions
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 31 (Open Space Assessment), page 19.
  The contents are introduced with 'Where relevant'. The list also notes that, under Draft NPPF (2025)
  Policy HC7, an assessment is required for development affecting existing recreation facilities.
review-status: unverified
field-status: {}
