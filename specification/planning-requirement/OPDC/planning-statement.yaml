reference: planning-statement
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: Minor development.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
source-text: Minor development … Major development
must-include:
- item: 'Minor development: a short written description and explanation of the proposal, justifying it
    against key planning policies and explaining why any other submission documents are not appropriate'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
- item: 'Major development: the site location, planning history and the proposed development'
  level: must
  required-if:
    ref: major-development
- item: 'Major development: the outcome of any pre-application engagement and how the proposal changed'
  level: must
  required-if:
    ref: major-development
- item: 'Major development: details of consultation (if not in a Statement of Community Involvement)'
  level: must
  required-if:
    ref: major-development
- item: 'Major development: an assessment against all relevant national and local planning policy and
    any other material considerations'
  level: must
  required-if:
    ref: major-development
- item: 'Where relevant: Business Relocation Strategy, Catalyst Uses Statement, Cultural Action Plan,
    Meanwhile Feasibility Study, Social-economic Statement and Visitor Accommodation Management Plan'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 35, page 20-21. The development thresholds
  on page 27 define minor development as 1-9 dwellings, under 1,000 sq m of floorspace or a site under
  1 hectare.
