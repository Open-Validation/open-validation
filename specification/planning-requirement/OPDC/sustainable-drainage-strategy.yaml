reference: sustainable-drainage-strategy
local-authority: OPDC
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Creates new buildings.
  - condition:
      field: hard-surfacing
      value: true
      description: Increases the area of impermeable surface.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU3; London Plan Policy SI5, SI13; Draft NPPF (2025) Policy F8
source-text: A SuDS and Drainage Strategy is needed for any development that creates new buildings or
  increases the area of impermeable surface
must-include:
- item: Aligns with the London Plan Drainage Hierarchy and uses SuDS to manage runoff on site
  level: must
- item: Runoff limited to greenfield rates, with the required attenuation volume clearly demonstrated
  level: must
- item: A completed SuDS pro-forma
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 41 (SuDS, Drainage and Water Efficiency
  Strategy), page 23. The water efficiency part, for all major development, is in sustainability-statement.
review-status: unverified
field-status: {}
