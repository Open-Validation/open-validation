reference: construction-management-plan
local-authority: OPDC
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: Proposing construction.
  - condition:
      field: highway-obstruction
      value: true
      description: The application would obstruct a public highway.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy T8; London Plan Policy T7
source-text: All major development proposals proposing construction and any application obstructing a
  public highway
must-include:
- item: How on-site impacts will be managed during demolition/construction, including traffic management,
    dust, noise, vibration and stability
  level: must
- item: An Outline Construction Logistics Plan (CLP) in line with TfL's CLP guidance
  level: must
- item: OPDC's Construction Code of Practice (CoCP)
  level: must
- item: Number and type of vehicles accessing the site and a construction travel plan for staff and visitors
  level: should
- item: A Traffic Management Plan showing the site layout during construction, vehicle tracking and any
    changes to the surrounding highway
  level: should
- item: Hours of operation and working hours
  level: should
- item: Means to control dust, vehicle emissions, noise and vibration
  level: should
- item: Measures to protect trees, biodiversity and deal with contaminated land
  level: should
- item: Measures to ensure the safety of pedestrians and cyclists on site and on the public highway
  level: should
- item: Work programme
  level: should
- item: Accords with the GLA's SPG 'Control of Dust and Emissions during Demolition and Construction'
    and the CLOCS Standards
  level: should
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 14, page 11-12. The detailed contents
  are introduced with 'Where relevant'; the CLP and CoCP are things 'The CMP must include'.
review-status: unverified
field-status: {}
