reference: flood-risk-assessment
local-authority: OPDC
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zones 2 and 3, including minor development and changes of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site of more than 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site of more than 1 hectare in Flood Zone 1.
  - condition:
      field: basement
      value: true
      description: A basement extension.
  - all:
    - ref: major-development
    - site:
        in:
        - critical-drainage-area
        description: In a Critical Drainage Area for surface water flooding.
  - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU3; London Plan Policy SI12; Draft NPPF (2025) Policy F4
source-text: All applications in Flood Zones 2 and 3, including minor development and changes of use and
  All developments of sites more than 1 hectare in Flood Zone All basement extensions All major applications
  in Critical Drainage Areas for surface water flooding All applications within Flood Zone 1 where there
  is a critical drainage problem as notified by the Environment Agency
must-include:
- item: The risks of all forms of flooding to and from the site
  level: must
- item: How flood risks will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems, including sustainable drainage systems (SuDS)
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 24, page 16-17. The list reads 'sites
  more than 1 hectare in Flood Zone' (Flood Zone 1 in national policy). 'Flood Zone 1 where there is a
  critical drainage problem as notified by the Environment Agency' has no designation field here, so that
  part shows as discretionary.
review-status: unverified
field-status: {}
