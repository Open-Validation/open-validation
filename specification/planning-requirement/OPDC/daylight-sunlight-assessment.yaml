reference: daylight-sunlight-assessment
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy D5
source-text: Major development Where the scale of proposed buildings has the potential to affect the amenity
  of sensitive neighbouring uses
must-include:
- item: 'Methodology of the latest BRE guidance ''Site layout planning for daylight and sunlight: A guide
    to good practice'''
  level: must
- item: Impacts on existing properties and sites with extant planning permissions
  level: must
- item: Internal daylight values achieved within the proposed scheme
  level: must
- item: An assessment of overshadowing
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 16, page 12-13. Non-major development
  shows as discretionary because 'potential to affect the amenity of sensitive neighbouring uses' has
  no threshold.
review-status: unverified
field-status: {}
