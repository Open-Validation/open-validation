reference: air-quality-assessment
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU4; London Plan Policy SI1
source-text: Major development Any development that has the potential to generate air pollution and/or
  where a sensitive use is proposed in close proximity to an existing source of air pollution
must-include:
- item: An assessment of current air quality in the area
  level: must
- item: Potential pollutant sources from the proposal during construction and operational phases
  level: must
- item: An assessment of their impact, including likely emissions and the effect on existing air quality,
    with pollutant concentrations predicted at suitable receptor locations
  level: must
- item: Measures to mitigate and minimise any impacts, with reference to the objective that all new developments
    must be air quality neutral
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 8, page 8. The contents are introduced
  with 'Where relevant'. Non-major development shows as discretionary because 'potential to generate air
  pollution' and 'close proximity to an existing source of air pollution' have no threshold.
review-status: unverified
field-status: {}
