reference: energy-statement
local-authority: OPDC
required-if:
  ref: major-development
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policies EU9, EU10; London Plan Policies SI2, SI3
source-text: Major development
must-include:
- item: How the development will minimise CO2 emissions in line with the energy hierarchy (Be Lean, Be
    Clean, Be Green and Be Seen), following the GLA Energy Assessment Guidance
  level: must
- item: 'Be Lean: how energy demand has been minimised through design measures and building fabric performance'
  level: must
- item: 'Be Clean: evidence that the heating hierarchy has been followed, including engagement with OPDC''s
    heat network operator to secure a connection'
  level: must
- item: 'Be Green: options for on-site renewable energy generation, the capacity of the proposed strategy
    and carbon savings'
  level: must
- item: 'Be Seen: modelled emissions from unregulated energy use, and how performance will be monitored'
  level: must
- item: A calculation using the GLA's carbon emissions reporting spreadsheet, showing residual emissions
    and the carbon offset contribution
  level: must
- item: A dynamic overheating assessment in line with CIBSE TM52 or TM59, with CIBSE TM49 weather files
    for London
  level: should
- item: 'For renewable and low-carbon energy generation and electricity network infrastructure schemes:
    details of how decommissioning and site restoration measures are expected to be implemented'
  level: must
  required-if:
    condition:
      field: renewable-energy-development
      value: true
      description: Renewable and low-carbon energy generation or electricity network infrastructure.
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 20 (Energy Statement including Overheating
  Assessment), page 13-15.
review-status: unverified
field-status: {}
