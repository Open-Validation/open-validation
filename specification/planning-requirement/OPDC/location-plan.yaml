reference: location-plan
local-authority: OPDC
required-if:
  always: true
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Scale 1:1,250 or 1:2,500 with a scale bar, on A4 or A3 paper
  level: must
- item: Up-to-date base map
  level: must
- item: Roads or buildings on land adjoining the site shown, labelling at least 2 roads
  level: must
- item: Application site outlined clearly in red, including all land needed for access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings
  level: must
- item: Any additional land owned by the applicant that immediately adjoins the site outlined in blue
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 1 item 3, page 3.
review-status: unverified
field-status: {}
