reference: land-contamination-assessment
local-authority: OPDC
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: On or near a site that is known to be, or there is good reason to believe may be, contaminated.
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive use is proposed.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU13; Draft NPPF (2025) Policy P2
source-text: When development is proposed on or near a site that is known to be, or there is good reason
  to believe may be, contaminated, or where a sensitive use is proposed
must-include:
- item: Enough information to determine the existence, nature and risks of contaminants, and whether they
    can be reduced to an acceptable level
  level: must
- item: Follows OPDC Local Plan Table 6.2 (Land Contamination Assessment Process)
  level: should
- item: Prepared by a suitably qualified individual or organisation
  level: should
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 15 (Contamination Preliminary Risk
  Assessment), page 12.
review-status: unverified
field-status: {}
