reference: roof-plan-existing
local-authority: OPDC
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Involves building work or alterations to buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
source-text: All applications that involve building work or changes of use
must-include:
- item: An individual floor plan for each floor of the building and the roof
  level: must
- item: Scale 1:100 or 1:50 on A4 and A3 paper
  level: must
- item: A scale bar on each plan
  level: must
- item: A unique reference number on each drawing
  level: must
- item: The site boundary and any proposed buildings shown in context with neighbouring buildings
  level: must
- item: Written dimensions
  level: must
- item: Details of materials used
  level: must
- item: Cycle parking arrangements
  level: must
- item: Internal storage and refuse storage
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 2 (Existing and Proposed Floor Plans
  including Roof Plan), page 6.
review-status: unverified
field-status: {}
