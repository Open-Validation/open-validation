reference: landscaping-plan
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy D1; London Plan Policy D8
source-text: Major development Minor development which contains a significant element of landscaping
must-include:
- item: Plans showing details of all hard and soft landscaping proposals
  level: must
- item: Plant species, size and planting densities, and any proposed trees with their size and/or extent
    of mature canopy
  level: must
- item: Site levels, gradients, cycle parking, refuse storage, boundary treatments and SuDS
  level: must
- item: A management plan identifying how and by whom any landscaping/public realm areas would be managed
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 27 (Landscape Strategy), page 17-18.
  The contents are introduced with 'Where relevant'. Minor development shows as discretionary because
  'a significant element of landscaping' has no threshold.
review-status: unverified
field-status: {}
