reference: noise-assessment
local-authority: OPDC
required-if:
  any:
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential and other noise sensitive development.
    - discretionary
  - condition:
      field: noise-generating-use
      value: true
      description: Noise generating uses that raise disturbance issues to existing buildings.
  - condition:
      field: plant-equipment
      value: true
      description: Installation of flues, air conditioning, plant, extraction etc.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU5; London Plan Policy D14
source-text: Proposals for residential and other noise sensitive development close to existing sources
  of noise; noise generating uses that raise disturbance issues to existing buildings; applications involving
  installation of flues, air conditioning, plant, extraction etc.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: An assessment of the existing background noise/vibration level
  level: must
- item: Predicted noise and/or vibration levels
  level: must
- item: Any mitigation required to meet the required levels or provide the necessary protection
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 30 (Noise and Vibration Impact Assessment),
  page 18-19. Noise sensitive development shows as discretionary in part because 'close to existing sources
  of noise' has no distance.
review-status: unverified
field-status: {}
