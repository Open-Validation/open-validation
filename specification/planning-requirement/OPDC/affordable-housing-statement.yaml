reference: affordable-housing-statement
local-authority: OPDC
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more new residential homes.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy H2; London Plan Policies H4, H5
source-text: Proposals which provide 10 or more new residential homes
must-include:
- item: The number of residential homes and affordable homes
  level: must
- item: The housing mix and tenure
  level: must
- item: The location of the affordable homes
  level: must
- item: Explanation of the affordability of the different housing types with reference to local incomes
  level: must
- item: Details of any discussions with affordable housing providers
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 6, page 7. May be a standalone document
  or part of the Planning Statement.
review-status: unverified
field-status: {}
