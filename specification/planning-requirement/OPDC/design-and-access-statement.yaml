reference: design-and-access-statement
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floorspace created is 100 sqm or more.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Major development Listed Building Consent All applications for one or more dwellings or a
  building or buildings where the floorspace created is 100 sqm or more within a conservation area
must-include:
- item: Proportionate to the scale of the development
  level: must
- item: Visual, using diagrams, sketches, plans and photographs to explain the evolution of the proposal
  level: must
- item: The design principles, concepts and policies applied
  level: must
- item: The appraisal of the context and how the design takes that context into account
  level: must
- item: The accessibility principles and policies applied
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 1 item 5, page 4.
review-status: unverified
field-status: {}
