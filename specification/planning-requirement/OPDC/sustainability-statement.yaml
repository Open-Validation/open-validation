reference: sustainability-statement
local-authority: OPDC
required-if:
  ref: major-development
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU3; London Plan Policy SI5, SI13; Draft NPPF (2025) Policy F8
source-text: Water efficiency information required for all major development … Water efficiency information
  should form part of a Sustainability Statement which is a comprehensive report setting out the commitments
  and strategies that address all Local Plan and London Plan sustainability policies.
must-include:
- item: Water efficiency information, with baseline and improved water efficiency calculations
  level: should
- item: 'For non-residential schemes: the BREEAM Wat 01 water calculator, targeting the maximum Wat 01
    credits'
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1
      description: Non-residential schemes.
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 41 (SuDS, Drainage and Water Efficiency
  Strategy), page 23. The list also says the Circular Economy Statement (item 12), Energy Statement (item
  20) and Site Waste Management Plan (item 39) should inform the Sustainability Statement.
review-status: unverified
field-status: {}
