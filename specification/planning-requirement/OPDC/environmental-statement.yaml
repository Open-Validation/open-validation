reference: environmental-statement
local-authority: OPDC
required-if:
  condition:
    field: eia-development
    value: true
    description: EIA development under the Town and Country Planning (Environmental Impact Assessment)
      Regulations 2017.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017 (SI 2017/571), as
  amended
source-text: The Town and Country Planning (Environmental Impact Assessment) Regulations (SI 2017/571),
  as amended, set out the circumstances in which an EIA is required. The need for an Environmental Statement
  shall be determined through a formal Screening Opinion.
must-include:
- item: Information specified in regulation 18(3) and meeting regulation 18(4) of the EIA Regulations
    2017
  level: must
- item: An Environmental Statement as defined in parts 1 and 2 of Schedule 4 of the EIA Regulations 2017
  level: must
- item: A statement listing the expertise and qualifications of the competent experts who completed the
    assessment
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 21, page 15.
review-status: unverified
field-status: {}
