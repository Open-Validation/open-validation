reference: bng-metric
local-authority: OPDC
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Environment Act 2021; Town and Country Planning (Development Management Procedure) (England) Order
  2015, article 7
source-text: All Minor and Major Applications (not Householders) Other exclusions apply (refer to Government
  Website)
must-include:
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
- item: 'Where an earlier date is proposed: that date and the reasons for proposing it'
  level: must
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat, including the publication date of the biodiversity metric used
  level: must
- item: A statement whether activities that result in loss of onsite biodiversity value ('degradation')
    have been carried out before the date of application; if so, the date immediately before, the pre-development
    value on that date, the completed metric calculation tool and any supporting evidence
  level: must
confidence: medium
notes: 'From the council''s list (adopted 17 July 2026), Part 1 item 7, page 4-5. The list says ''All
  Minor and Major Applications (not Householders)'' and that other exclusions apply; the rule follows
  the law: householder and other exempt applications are not subject to the biodiversity gain condition.
  The statement or evidence that BNG is not required, where that applies, is listed as unmapped.'
review-status: unverified
field-status: {}
