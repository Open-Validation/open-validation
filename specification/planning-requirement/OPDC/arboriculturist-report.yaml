reference: arboriculturist-report
local-authority: OPDC
required-if:
  any:
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Works affect trees on or off the site.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Trees protected by a Tree Preservation Order (TPO) or Conservation Area legislation.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Works affect trees on or off the site.
    - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: London Plan Policy G7
source-text: Where works affect trees on or off the site that are protected by Tree Preservation Order
  (TPO) or Conservation Area legislation, also where the application would affect other sizeable trees
  that are not covered by a TPO or in a Conservation Area
must-include:
- item: A full tree survey
  level: must
- item: An Arboricultural Impact Assessment (AIA)
  level: must
- item: Trees proposed for retention / removal, with Root Protection Areas shown on proposed layout plans
  level: must
- item: An Arboricultural Method Statement (AMS) showing how retained trees would be protected
  level: must
- item: A Tree Protection Plan, including the location of proposed new utility / drainage services
  level: must
- item: Prepared by a suitably qualified arboriculturist
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 48 (Tree Assessment), page 26. 'Other
  sizeable trees' has no size threshold, so that part shows as discretionary.
review-status: unverified
field-status: {}
