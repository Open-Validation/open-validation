reference: cil-form
local-authority: OPDC
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: 100 sqm or more new floor space.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings (even where this is below 100 sqm).
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Community Infrastructure Levy Regulations 2010; Mayor of London CIL and OPDC CIL
source-text: Proposals comprising 100 sqm or more new floor space, or comprising one or more new dwellings
  (even where this is below 100 sqm)
must-include:
- item: A completed Planning Application Additional Information Requirement Form
  level: must
- item: Breakdown of the proposed residential and non-residential GIA floorspace and the GIA of existing
    uses to be demolished or retained on the site
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 13 (Community Infrastructure Levy Information),
  page 11.
review-status: unverified
field-status: {}
