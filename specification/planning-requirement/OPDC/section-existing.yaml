reference: section-existing
local-authority: OPDC
required-if:
  condition:
    field: building-works
    value: true
    description: Involves building work or alterations to buildings.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
source-text: All applications for new and/or altered buildings
must-include:
- item: Cross sections through the site and buildings, with existing site levels and finished floor levels
  level: must
- item: Scale 1:100 or 1:50 on A4 and A3 paper
  level: must
- item: A scale bar on each plan
  level: must
- item: A unique reference number on each drawing
  level: must
- item: Written dimensions
  level: must
- item: Ceiling heights measured on the drawings
  level: must
- item: The proposals shown in relation to neighbouring buildings
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 3, page 6.
review-status: unverified
