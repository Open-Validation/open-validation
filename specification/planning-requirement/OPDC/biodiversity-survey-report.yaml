reference: biodiversity-survey-report
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - local-wildlife-site
      description: Within or adjacent to a Site of Importance for Nature Conservation or Local Nature
        Reserve.
  - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy EU2; London Plan Policy G6
source-text: Major development Any development within or adjacent to a Site of Importance for Nature Conservation
  or Local Nature Reserve, or which may have impacts on biodiversity or protected species
must-include:
- item: A Preliminary Ecological Appraisal (PEA) carried out in accordance with CIEEM technical guidance
  level: should
- item: Any further surveys or reports the PEA recommends (typically an Ecological Impact Assessment),
    carried out before the application is submitted
  level: must
- item: Up-to-date surveys conforming with the latest legislation
  level: must
- item: Surveys carried out by a suitably qualified ecologist
  level: should
- item: Information supporting any enhancement, mitigation or compensation measures, cross-referenced
    to the plans and, where relevant, Biodiversity Net Gain and Urban Greening Factor plans
  level: should
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 10 (Biodiversity / Ecology Assessment),
  page 9. 'May have impacts on biodiversity or protected species' has no threshold, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
