reference: transport-assessment
local-authority: OPDC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy T9; London Plan Policy T4; Draft NPPF (2025) Policy TR6
source-text: Major development Any application where the proposed development has significant transport
  implications.
must-include:
- item: The impact on transport infrastructure, including road capacity, public transport and walking
    and cycling infrastructure, proportionate to the scale of the development
  level: must
- item: Trip generation, travel demand analysis and TRICS data
  level: should
- item: Collision data review and road safety mitigation, with a Stage 1 Road Safety Audit for any changes
    to the public highway
  level: should
- item: Existing and proposed vehicle and cycle parking, with justification for car parking and accessible
    parking
  level: should
- item: Existing and proposed servicing, and swept path plans for all vehicles
  level: should
- item: Nearby OPDC-led transport projects and any mitigation / planning obligations
  level: should
- item: 'Major development: a Healthy Streets Assessment, a Vision Zero action plan and an Active Travel
    Zone assessment (including night-time)'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 46 (Transport Statement/Assessment),
  page 25-26. Non-major development shows as discretionary because 'significant transport implications'
  has no threshold; TfL guidance says whether a Transport Assessment or Transport Statement is needed.
  Most contents are introduced with 'Where relevant'.
review-status: unverified
field-status: {}
