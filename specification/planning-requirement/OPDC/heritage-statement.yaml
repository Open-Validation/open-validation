reference: heritage-statement
local-authority: OPDC
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - locally-listed-building
    - scheduled-monument
    - park-and-garden
    description: Proposals that have the potential to affect a heritage asset or its setting.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy D7; London Plan Policy HC1; Draft NPPF (2025) Policy HE5
source-text: Proposals that have the potential to affect a heritage asset or its setting
must-include:
- item: The relevant heritage asset(s) identified, whether affected (positively or negatively) or unaffected
  level: must
- item: The significance of affected heritage assets and the contribution of setting to significance
  level: must
- item: The works proposed, including a material schedule and methodologies
  level: must
- item: How the proposal avoids and/or minimises harmful impacts
  level: must
- item: 'The impact on significance: positive, no impact or harmful (including the level of harm)'
  level: must
- item: Justification of any harmful impacts
  level: must
- item: Cross-reference to any Townscape and Visual Impact Assessment provided
  level: should
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 26, page 17. May be a standalone document
  or part of the Design and Access Statement.
review-status: unverified
field-status: {}
