reference: site-plan
local-authority: OPDC
required-if:
  always: true
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: The development site, its boundaries and on-site buildings
  level: must
- item: Scale 1:100 or 1:50 on A4 or A3 paper (unless a different scale is required)
  level: must
- item: Scale bar and north arrow
  level: must
- item: All immediately adjoining buildings and all main roads surrounding the site clearly labelled and
    numbered
  level: must
- item: The property and all land needed for access from a public highway, visibility splays, landscaping,
    car parking and open areas around buildings outlined in red
  level: must
- item: Any other land within the applicant's control that is close to or adjoining the site outlined
    in blue
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 1 item 4, page 3-4.
review-status: unverified
field-status: {}
