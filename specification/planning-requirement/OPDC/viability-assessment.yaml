reference: viability-assessment
local-authority: OPDC
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: There is a planning policy requirement to provide viability information in respect of
      affordable housing provision.
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
policy: OPDC Local Plan Policy H2, London Plan Policy H5; Draft NPPF (2025) Policy DM5
source-text: Where there is a planning policy requirement to provide viability information in respect
  of affordable housing provision
must-include:
- item: Gross Development Value, build costs, land value (existing use value plus) and residual values
    (with comparables)
  level: must
- item: Commercial yields/rents (with comparables), competitive return to developers and professional
    fees/marketing costs
  level: must
- item: Evidence and benchmarks for all values and costs, and justification for all assumptions
  level: must
- item: A viability assessment model capable of full interrogation by OPDC and its advisor
  level: must
- item: Itemised S106 Heads of Terms and Community Infrastructure Levy (CIL)
  level: must
- item: Any capital/grant contributions, build/sale programme and details of any Registered Housing Provider
  level: must
- item: Scenario testing of deliverability if the appraisal shows a deficit
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 22 (Financial Viability Appraisal),
  page 15-16. Under London Plan Policy H5, viability information is required where a scheme does not meet
  the affordable housing threshold for the fast track route, shown here with the affordable-housing-below-target
  field.
review-status: unverified
field-status: {}
