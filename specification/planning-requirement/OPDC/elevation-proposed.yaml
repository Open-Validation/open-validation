reference: elevation-proposed
local-authority: OPDC
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Involves building work or alterations to buildings.
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.oldoakandparkroyal.co.uk/sites/default/files/attachments/OPDC%20Validation%20Checklist%202026.pdf
source-text: All applications that involve building work or alterations to buildings
must-include:
- item: An individual elevation drawing for the front, back and both sides of the building (for householder
    or minor applications, a statement confirming that elevations remain unchanged is sufficient, if so)
  level: must
- item: Any proposed buildings (including extensions and outbuildings) shown in context with neighbouring
    buildings
  level: must
confidence: medium
notes: From the council's list (adopted 17 July 2026), Part 2 item 1, page 6. Part 2 item 38 (page 21)
  also asks every s73 or s96a application for proposed plans, elevations and sections, which 'must be
  a full update or revision of the originally approved plans'.
review-status: unverified
field-status: {}
