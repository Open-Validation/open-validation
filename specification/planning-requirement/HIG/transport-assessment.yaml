reference: transport-assessment
local-authority: HIG
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Saved Local Plan Policy TC10; High Peak Local Plan Modification Version January 2016 Policy CF6
source-text: All major applications where there are likely to be significant transport implications
must-include:
- item: A scoping study, agreed before submission, setting the content of the assessment
  level: must
- item: Measures to deal with the anticipated transport impacts and to improve accessibility and safety
    for all modes, particularly walking, cycling and public transport
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 18-19. 'Transport Assessment or Transport Statement'.
  Derbyshire County Council (highway authority) advises at pre-application stage which is needed; 'significant
  transport implications' has no threshold, so it shows as discretionary. A simplified Transport Statement
  suits smaller developments.
review-status: unverified
field-status: {}
