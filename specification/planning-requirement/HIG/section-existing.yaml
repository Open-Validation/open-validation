reference: section-existing
local-authority: HIG
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change of floor level.
  - condition:
      field: new-build
      value: true
      description: New buildings.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications involving a change of floor level and all applications involving new buildings
must-include:
- item: Illustrative drawings at 1:50 or 1:100
  level: must
- item: Both existing and finished levels
  level: must
- item: Details of foundations and eaves
  level: must
- item: Relationship to existing site levels and neighbouring development
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 4. 'Existing and proposed site sections and
  finished floor and site levels'.
review-status: unverified
field-status: {}
