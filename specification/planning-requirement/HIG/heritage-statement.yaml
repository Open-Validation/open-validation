reference: heritage-statement
local-authority: HIG
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - park-and-garden
      - scheduled-monument
      description: Any part of the site is within or adjoins a listed building, conservation area, historic
        park or garden or scheduled ancient monument.
  - site:
      in:
      - archaeological-priority-area
      description: Buxton Area of High Archaeological Interest (policies map).
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Saved High Peak Local Plan Policy BC10; High Peak Local Plan Modification Version January 2016
  Policy EQ6; NPPF paragraph 128; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: Where any part of the application site is within or adjoins a Listed Building, Conservation
  Area, historic park or garden or scheduled ancient monument; or is in an area containing significant
  archaeological heritage features including Buxton Area of High Archaeological Interest (see policies
  map) … A Heritage Statement is required for all applications affecting a heritage asset
must-include:
- item: Proportionate and no more than sufficient
  level: should
- item: The significance of the affected asset
  level: must
- item: The impact of the proposals on that significance
  level: must
- item: How the impact on the heritage asset is avoided, minimised and mitigated
  level: must
- item: Opportunities to better reveal or enhance significance
  level: must
- item: Justification of any harmful impacts
  level: must
- item: Elevations and floor plans at 1:100 or 1:50 of any building or part of a building to be altered
    or demolished, with accompanying photographs (unless included elsewhere in the application)
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 4-5, 10. Also required for all applications
  affecting a heritage asset (listed buildings and conservation areas rows, pages 4-5), which may also
  need context drawings at 1:50 or 1:100, constructional details at 1:5 or 1:2, a structural survey, a
  viability assessment or a conservation management plan. Other areas with significant archaeological
  features show as discretionary; a written scheme of archaeological investigation may be required for
  underground features.
review-status: unverified
field-status: {}
