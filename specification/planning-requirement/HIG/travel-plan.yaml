reference: travel-plan
local-authority: HIG
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 2500
      description: Non-residential development of 2,500 square metres or more.
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: NPPF paragraph 36; High Peak Local Plan Modification Version January 2016 Policy CF6
source-text: All applications for developments that will generate significant amounts of transport movement
  e.g. non-residential development of [2500 square metres] or more.
must-include:
- item: Description of the location, size and type of organisation
  level: should
- item: Reason for the travel plan
  level: should
- item: Survey results, travel data, trip generation forecasts and public transport
  level: should
- item: Proposed measures, including costs
  level: should
- item: Timetable for implementation
  level: should
- item: Monitoring and review proposals
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 19. The need is agreed at pre-application stage;
  other developments generating 'significant' movement show as discretionary. The contents are what a
  plan will 'typically' show.
review-status: unverified
field-status: {}
