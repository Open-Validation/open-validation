reference: design-and-access-statement
local-authority: HIG
required-if:
  all:
  - any:
    - ref: major-development
    - application-type:
        in:
        - lbc
    - all:
      - site:
          in:
          - conservation-area
          description: Any part of the development is in a conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>'
            value: 100
            description: Buildings where the created floor space exceeds 100 square metres.
  - condition:
      field: involves-change-of-use
      value: false
      description: Not a material change of use.
  - condition:
      field: engineering-operations
      value: false
      description: Not engineering or mining operations.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All major applications, all applications for listed building consent, and those where any
  part of the development is in a conservation area and comprises one or more dwelling houses or the provision
  of a building or buildings where the created floor space exceeds 100 square metres. Exemptions include
  applications for waste development, a material change of use, engineering or mining operations
must-include:
- item: Design principles and concepts applied
  level: must
- item: Context appraisal and how the design takes context into account
  level: must
- item: Access policy and use of local policies
  level: must
- item: Consultation on access
  level: must
- item: Specific issues affecting access and how they are addressed
  level: must
- item: Detail proportionate to the complexity of the application
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 5. Waste development is also exempt (it is decided
  by Derbyshire County Council).
review-status: unverified
field-status: {}
