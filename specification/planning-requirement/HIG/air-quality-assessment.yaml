reference: air-quality-assessment
local-authority: HIG
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Any site within or adjacent to a designated Air Quality Management Area (AQMA).
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Air quality in Planning Practice Guidance (March 2014)
source-text: Any site within or adjacent to a designated Air Quality Management Area (AQMA) An application
  that could give rise to air quality concerns
must-include:
- item: Impact on air quality
  level: must
- item: Possible mitigation measures
  level: must
- item: Influence of air quality issues on the design of the development
  level: must
- item: Design details of windows and ventilation equipment
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 7. An application that 'could give rise to air
  quality concerns' has no threshold, so it shows as discretionary.
review-status: unverified
field-status: {}
