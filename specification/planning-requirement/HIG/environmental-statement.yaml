policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2011
source-text: For all applications within Schedule 1 and Schedule 2 of The Town and Country Planning (Environmental
  Impact Assessment) Regulations 2011. Schedule 1 includes oil and chemical refineries, large scale intensive
  agriculture, major infrastructure, quarrying and waste incineration; an EIA is mandatory Schedule 2
  includes intensive agriculture, energy, extractive sites and infrastructure; an EIA may be required
  depending on scale, location and impact
