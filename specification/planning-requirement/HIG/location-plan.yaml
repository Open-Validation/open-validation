reference: location-plan
local-authority: HIG
required-if:
  always: true
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: On submission of all applications
must-include:
- item: The name of an adjacent road or roads
  level: should
- item: Drawn to an identified scale (preferably 1:1250 or 1:2500)
  level: must
- item: The direction of North
  level: must
- item: The application site edged clearly in red, including all land needed to carry out the development
    (for example access to the site from the public highway)
  level: must
- item: Other adjoining land owned or controlled by the applicant edged clearly in blue
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 3.
review-status: unverified
field-status: {}
