reference: affordable-housing-statement
local-authority: HIG
required-if:
  any:
  - all:
    - condition:
        field: settlement-population
        operator: <
        value: 3000
        description: In settlements of less than 3,000 population.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.17
          description: Sites of 0.17 hectares.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: Developments of 5 dwellings or more.
  - all:
    - condition:
        field: settlement-population
        operator: '>='
        value: 3000
        description: Elsewhere (settlements of 3,000 population or more).
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Sites of 0.5 hectares or more.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 15
          description: Developments of 15 dwellings or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 'Local Plan (2016) threshold: sites of 5 dwellings or more.'
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.16
      description: 'Local Plan (2016) threshold: sites of 0.16 hectares and above.'
  - condition:
      field: rural-exception-housing
      value: true
      description: Rural exception affordable housing for local needs.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Saved Local Plan Policies H9 and H10; Housing Needs in the High Peak SPD 2007; High Peak Local
  Plan Modification Version January 2016 Policy H6; NPPF paragraphs 174 and 177
source-text: 'Saved Local Plan Poliy H9 Affordable Housing for Local Needs: In settlements of less than
  3,000 population, sites of 0.17hectares or developments of 5 dwellings or more. Elsewhere sites of 0.5hectares
  or more or a development of 15 dwellings or more (subject to criteria). The High Peak Local Plan Modification
  Version January introduces new thresholds for affordable housing with threshold of 30% on sites of 25
  dwellings or more, 20% on sites of 5-24 units or 0.16ha and above (only applicable when adopted) Saved
  Local Plan Policy H10 Rural ‘Exception’ Affordable Housing for Local Needs.'
must-include:
- item: Total number of units and number of affordable units
  level: must
- item: Bedrooms and numbers of dwellings by size to be affordable
  level: must
- item: Levels and types of affordability or tenure
  level: must
- item: Compliance with the requirements of the Homes and Communities Agency
  level: must
- item: Details of the Registered Social Landlord
  level: must
- item: Funding sources
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 6. The list gives the saved Local Plan H9 thresholds
  ('subject to criteria') and says the Local Plan Modification Version's new thresholds (30% on 25 or
  more dwellings, 20% on 5-24 units or 0.16 ha and above) apply once that plan is adopted; the High Peak
  Local Plan was adopted in 2016, so both sets are shown. Rural exception housing (saved policy H10, new
  policy H6) is also named.
review-status: unverified
field-status: {}
