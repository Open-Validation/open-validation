reference: lighting-assessment
local-authority: HIG
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - condition:
        field: outside-urban-area
        value: true
        description: In open countryside.
    - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or a conservation area, or open countryside, where external
  lighting would be provided or made necessary by the … Details of external lighting, hours of operation
  and a plan showing levels of illumination and extent of light spillage.
must-include:
- item: Details of external lighting
  level: must
- item: Hours of operation
  level: must
- item: A plan showing levels of illumination and extent of light spillage
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): filed under Listed building consent, but the list applies it by trigger.
  ''In the vicinity of residential property'' and ''publicly accessible developments'' can''t be expressed
  with existing fields, so they are shown as officer discretion.'
review-status: unverified
field-status: {}
