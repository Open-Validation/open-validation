reference: lighting-assessment
local-authority: HIG
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - condition:
        field: outside-urban-area
        value: true
        description: In open countryside.
    - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Light pollution in Planning Practice Guidance (March 2014); Saved Local Plan Policy GD5; High
  Peak Local Plan Modification Version January 2016 Policy EQ9
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or a conservation area, or open countryside, where external
  lighting would be provided or made necessary by the
must-include:
- item: Details of external lighting
  level: must
- item: Hours of operation
  level: must
- item: A plan showing levels of illumination and the extent of light spillage
  level: must
- item: Prepared by suitably qualified lighting engineers
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 12-13. Publicly accessible developments and
  development in the vicinity of residential property (no distance given) show as discretionary.
review-status: unverified
field-status: {}
