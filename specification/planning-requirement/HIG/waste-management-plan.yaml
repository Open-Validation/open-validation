reference: waste-management-plan
local-authority: HIG
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major developments of 10 or more dwellings (how refuse collection will be provided).
  - condition:
      field: new-build
      value: true
      description: New development, major extensions or re-development.
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Environmental Protection Act 1990; National Planning Policy for Waste (October 2014); Waste Management
  Plan for England 2013; High Peak Local Plan Modification Version January 2016 Policy EQ1
source-text: May be required for strategic major applications i.e. those with 50 dwellings or more or
  10,000 square metres of commercial or mixed floorspace (this cannot now be mandatory but could be requested
  by the Council in relevant cases) Applications for major developments i.e. for 10 or more dwellings,
  will be expected to demonstrate how refuse collection will be provided. All applications for new development,
  residential conversion, major extensions to existing buildings, re-developments, most changes of use,
  especially those providing hospitality services
must-include:
- item: Provisions for safe and hygienic storage of waste and its collection by the council's refuse service,
    shown on scale drawings and plans or in the application form
  level: must
- item: Proposed refuse and recycling storage points, preferably in an enclosed store
  level: must
- item: Storage space for 14 days' domestic waste and 7 days' commercial waste and recyclables
  level: must
- item: Access for collection
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 21-22. 'Waste Management Plan / Waste Storage
  and Collection Plan'. A full waste management plan 'may be required' for strategic majors (50 dwellings
  or 10,000 m²) but 'cannot now be mandatory'; residential conversions and 'most changes of use' have
  no clear trigger, so those parts show as discretionary.
review-status: unverified
field-status: {}
