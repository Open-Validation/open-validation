submission-standards:
- item: Plans and drawings drawn to an identified (recognised metric) scale; plans show the direction
    of North
  level: must
- item: A linear scale bar
  level: should
- item: Drawings with the words 'Do Not Scale' are not accepted (the application is made invalid)
  level: must
- item: Original paper size and scale clearly marked on plans and drawings
  level: must
- item: Drawn material generally in black on a white background, avoiding low contrast colours, hatching
    and artistic embellishment
  level: should
