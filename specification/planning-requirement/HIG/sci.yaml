reference: sci
local-authority: HIG
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 200
      description: 200 dwellings or more.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 4
      description: More than 4 hectares of residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 10000
      description: 10,000 sq m of commercial or industrial floorspace.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 2
      description: More than 2 hectares of commercial land.
  - condition:
      field: wind-turbine-count
      operator: '>='
      value: 2
      description: Wind farms of at least two turbines.
  - condition:
      field: turbine-tip-height
      operator: '>'
      value: 15
      description: Turbines in excess of 15 metres in height.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Section 122 Localism Act 2011; Section 61W Town and Country Planning Act 1990
source-text: 'A Statement of Community Involvement is required for all strategic major applications of:
  200 dwellings or more, or for more than 4 hectares of residential development 10,000 sq m of commercial
  or industrial floorspace, or for more than 2 hectares of commercial land Wind farms of at least two
  turbines Turbines in excess of 15 metres in height'
confidence: medium
notes: From the council's list (adopted March 2016), page 16. 'Pre-application Consultation Statement
  / Statement of Community Involvement'. The council encourages engagement on all major applications,
  but says this is not mandatory.
review-status: unverified
