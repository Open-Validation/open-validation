reference: biodiversity-survey-report
local-authority: HIG
required-if:
  any:
  - ref: major-development
  - condition:
      field: vacant-building
      value: true
      description: The conversion or demolition of redundant buildings.
  - site:
      in:
      - site-of-special-scientific-interest
      - local-nature-reserve
      - national-nature-reserve
      - local-wildlife-site
      description: May impact on sites of importance for nature conservation (e.g. SSSIs, nature reserves,
        Derbyshire wildlife sites).
  - condition:
      field: protected-species
      value: true
      description: May impact on wildlife and biodiversity.
  - condition:
      field: bmv-agricultural-land-loss
      operator: '>'
      value: 20
      description: Loss of more than 20 hectares of best and most versatile agricultural land.
  - condition:
      field: eia-development
      value: true
      description: Needs an Environmental Impact Assessment.
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Section 40 Natural Environment and Rural Communities Act 2006; High Peak Local Plan Modification
  Version January 2016 Policies EQ4 Biodiversity and EQ7 Green Infrastructure
source-text: Major developments Applications that propose the conversion or demolition of redundant buildings
  may impact on wildlife and biodiversity or on sites of importance for nature conservation e.g. Sites
  of Special Scientific Interest, nature reserves, Derbyshire wildlife sites involve the loss of more
  than 20 hectares of best and most versatile agricultural land are for minerals and waste developments
  where land will be restored to agriculture need an Environmental Impact Assessment
must-include:
- item: Undertaken by a suitably qualified ecologist
  level: should
- item: The potential for protected species inhabiting the site or using it for recreational purposes
  level: must
- item: Protection of species during construction
  level: must
- item: Alternatives investigated where the habitat will be lost
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 7-8. 'Biodiversity, ecosystems; project level
  Habitats Regulation Assessment; and Green Infrastructure (Survey and Report)'. Minerals and waste developments
  restored to agriculture are also named, but those are decided by Derbyshire County Council. Impact on
  wildlife and biodiversity in general shows as discretionary. The 2016 list predates statutory biodiversity
  net gain and has no BNG requirement.
review-status: unverified
field-status: {}
