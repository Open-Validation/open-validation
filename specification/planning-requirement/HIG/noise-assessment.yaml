reference: noise-assessment
local-authority: HIG
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Developments that may be sensitive to noise.
  - condition:
      field: noise-generating-use
      value: true
      description: Developments that may cause noise disturbance to adjacent buildings.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Noise in Planning Practice Guidance (March 2014); Noise Policy Statement for England (2010); Saved
  Local Plan Policy GD5; High Peak Local Plan Modification Version January 2016 Policies EQ1, EQ5 and
  EQ9
source-text: All applications for developments that may be sensitive to noise; and applications that may
  cause noise disturbance to adjacent buildings
must-include:
- item: Prepared by a suitably qualified acoustic engineer
  level: must
- item: Exposure to noise (of the development or of neighbouring properties)
  level: must
- item: Measures to mitigate the effects of noise
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 13-14. 'Noise Impact Assessment'.
review-status: unverified
field-status: {}
