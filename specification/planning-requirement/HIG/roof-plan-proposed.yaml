reference: roof-plan-proposed
local-authority: HIG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: Changes to the roofline.
    - site:
        in:
        - conservation-area
        description: In a conservation area (detailed existing and proposed roof plans).
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except where the proposal does not relate to a building e.g. a change of
  use to a parcel of land. Floor plans are not required for Agricultural Prior Notifications although
  these are recommended … All applications must be in full and accompanied by detailed existing and proposed
  elevations, floor plans and roof plans.
must-include:
- item: Any changes to the roofline
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 3, 5. 'Existing and proposed floor plans, and
  existing and proposed roof plans'. Not required where the proposal does not relate to a building (e.g.
  a change of use of a parcel of land). The conservation areas row (page 5) says applications there must
  be in full with detailed existing and proposed elevations, floor plans and roof plans (outline applications
  are not accepted in or next to a conservation area). The list asks for 'a roof plan to show any changes
  to the roofline'.
review-status: unverified
field-status: {}
