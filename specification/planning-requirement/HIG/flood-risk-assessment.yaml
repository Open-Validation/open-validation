reference: flood-risk-assessment
local-authority: HIG
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: The site is in flood zone 2 or 3.
    - any:
      - condition:
          field: new-build
          value: true
          description: The proposal includes new buildings.
      - condition:
          field: involves-change-of-use
          value: true
          description: The proposal is a change of use.
      - condition:
          field: footprint-increase
          value: true
          description: The proposal extends the ground cover.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: High Peak Local Plan Policy EQ10
source-text: Flood Risk Assessment All development over 1 hectare in Flood Zone 1, and all applications
  for new buildings, changes of use, or extended ground cover, in Flood Zones 2 and 3, require the preparation
  of a Flood Risk Assessment (FRA)
confidence: medium
notes: 'The ''INFERRED'' Full planning placement was wrong (audit, wrong_app_type): the list applies it
  by trigger.'
review-status: unverified
field-status: {}
