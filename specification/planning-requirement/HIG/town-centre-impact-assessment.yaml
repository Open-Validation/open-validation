reference: town-centre-impact-assessment
local-authority: HIG
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Not in an existing town centre or not in accordance with the Local Plan.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2,500 square metres gross.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 200
        description: Local Plan Policy CF1 threshold of 200 m² for A1 retail.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Saved Local Plan Policies TC3, TC4, TC5 and TC6; High Peak Local Plan Modification Version January
  2016 Policies CF1 and CF2; NPPF paragraphs 24-27
source-text: Required for all planning applications for retail and leisure developments over 2500 square
  metres gross, or any local floorspace threshold set by policy, that is not in an existing town centre
  or not in accordance with the [High Peak Local Plan submission Version April 2014].
must-include:
- item: 'Impact test: impact on existing investment in town centres'
  level: must
- item: 'Impact test: impact on town centre vitality and viability'
  level: must
- item: 'Impact test: impact on trade and turnover in the wider area'
  level: must
- item: 'Impact test: the appropriateness of the scale of the proposal'
  level: must
- item: 'Impact test: cumulative effect of recent developments'
  level: must
- item: 'Impact test: town centre vulnerability'
  level: must
- item: 'Sequential test: whether sequentially preferable sites exist and why they are not practicable
    (availability, suitability and viability)'
  level: must
confidence: medium
notes: 'From the council''s list (adopted March 2016), page 18. ''Town centre uses: sequential test and
  impact test'' (one row covering both). The list adds that Local Plan Policy CF1 applies a new threshold
  of 200 m² for A1 (retail).'
review-status: unverified
field-status: {}
