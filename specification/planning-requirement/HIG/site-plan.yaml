reference: site-plan
local-authority: HIG
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - s73
  - all:
    - application-type:
        in:
        - non-material-amendment
    - condition:
        field: site-layout-change
        value: true
        description: Minor amendments to the site layout are proposed.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except Agricultural Prior notifications or applications for non-material
  amendments (except where minor amendments to the site layout are proposed)
must-include:
- item: Existing and proposed block layout plans
  level: must
- item: Drawn to a recognised metric scale (1:100 or 1:200), with a scale bar
  level: must
- item: Key dimensions, the direction of North, and the original paper size and scale clearly marked
  level: must
- item: The relationship of the site to its boundaries and to other buildings on and off the site, with
    roads and pathways
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 3. 'Existing and proposed block layout plan'.
  Not required for agricultural prior notifications; the main application types are shown.
review-status: unverified
field-status: {}
