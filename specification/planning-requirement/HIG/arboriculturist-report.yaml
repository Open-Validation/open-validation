reference: arboriculturist-report
local-authority: HIG
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Semi-mature or mature trees within or immediately adjacent to the site.
  - condition:
      field: tree-removal
      value: true
      description: Mature or semi-mature trees will need to be removed.
  - all:
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: A Tree Preservation Order, or a conservation area.
    - condition:
        field: tree-removal
        value: true
        description: Removal of trees.
  - condition:
      field: hedgerows-affected
      value: true
      description: Existing hedgerows protected by the Hedgerow Regulations 1997 would be removed or trimmed.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Saved Local Plan Policy OC10; High Peak Local Plan Modification Version January 2016 Policies
  EQ2, EQ5, EQ6 and EQ8; BS 5837:2012
source-text: 'All applications where: there are semi-mature or mature trees within or … immediately adjacent
  to the application site mature or semi-mature trees will need to be removed there is a Tree Preservation
  Order or any proposal within a Conservation Area which requires the removal of trees existing hedgerows
  protected by the Hedgerow Regulations 1997 would be removed or trimmed'
must-include:
- item: Prepared by a suitably qualified arboriculturist
  level: must
- item: Survey and assessment in accordance with BS 5837:2012
  level: should
- item: Details of protection measures
  level: should
- item: Details of special foundations or techniques
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 19-20. 'Tree Survey/ Arboricultural Statement'.
  The contents are what it 'should include as a minimum'.
review-status: unverified
field-status: {}
