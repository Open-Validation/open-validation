reference: land-contamination-assessment
local-authority: HIG
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Vulnerable development (sensitive end use such as housing, schools, allotments, playing
          fields).
    - condition:
        field: minor-development
        value: true
        description: Minor development (an environmental screening report is required even where no contamination
          is suspected).
  - discretionary
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Land affected by contamination in Planning Practice Guidance (March 2014); Part 2A Environmental
  Protection Act 1990; Saved Local Plan Policy GD12; High Peak Local Plan Modification Version January
  2016 Policy EQ9
source-text: 'All applications where contamination is known or suspected or the development is in the
  vicinity of such land and ground works are proposed … For minor vulnerable development: where no contamination
  is suspected an environmental screening report is required.'
must-include:
- item: An environmental screening report
  level: must
  required-if:
    all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Vulnerable development.
    - condition:
        field: minor-development
        value: true
        description: Minor development where no contamination is suspected.
- item: A Phase 1 report
  level: must
  required-if:
    any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known.
    - discretionary
  source-text: For minor, major or non vulnerable development where contamination is suspected or known
    a Phase 1 report is required.
- item: Whether contamination exists, its nature and the risks it may pose (for current and proposed uses)
  level: must
- item: Whether the risks can be reduced to an acceptable level and, if so, a draft methodology for achieving
    this
  level: must
- item: Any restrictions that should apply to the future use of the site
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 11. Suspected contamination, or development
  near contaminated land with ground works, shows as discretionary. No report is needed for non-vulnerable
  development where no contamination is suspected.
review-status: unverified
field-status: {}
