reference: land-contamination-assessment
local-authority: HIG
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the development is in the vicinity of such
        land and ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: Vulnerable development (a sensitive end use such as housing, schools, allotments or
        playing fields).
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
source-text: 'Land Contamination Assessment All applications where contamination is known or suspected
  or the development is in the vicinity of such land and ground works are proposed … Vulnerable developments
  are those with a sensitive end use and include housing, schools, allotments, playing fields etc For
  minor vulnerable development: where no contamination is suspected an environmental screening report
  is required.'
must-include:
- item: An environmental screening report, for minor vulnerable development where no contamination is
    suspected
  level: must
  required-if:
    condition:
      field: sensitive-end-use
      value: true
      description: Vulnerable development (a sensitive end use).
confidence: medium
notes: 'Audit (not_a_requirement): the workbook''s excerpt began with an officer''s email address, removed
