reference: elevation-proposed
local-authority: HIG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: external-alterations
        value: true
        description: Changes are proposed to a building.
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except where the proposal does not relate to a building e.g. a change of
  use to a parcel of land, or where exemption is sought e.g. where no changes are proposed to a building
  (although existing elevations will still be required)
must-include:
- item: Drawn to a recognisable metric scale (e.g. 1:50 or 1:100)
  level: must
- item: Each elevation shown as current and with the proposed changes
  level: must
- item: The proposed type and colour of materials, style and finish
  level: must
- item: The relationship with other buildings (e.g. if a semi-detached property)
  level: must
- item: Dimensions, if plans are not to a recognisable scale
  level: should
confidence: medium
notes: From the council's list (adopted March 2016), page 4. Not required where the proposal does not
  relate to a building, or where no changes are proposed to a building (existing elevations are still
  needed).
review-status: unverified
field-status: {}
