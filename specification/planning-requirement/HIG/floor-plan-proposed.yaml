reference: floor-plan-proposed
local-authority: HIG
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
source-url: https://www.highpeak.gov.uk/media/269/Validation-guidance---National-and-local-list/pdf/Validation_checlist_-_National_and_local_list_HPBC.pdf?m=1471341638693
policy: Part 3 of the Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except where the proposal does not relate to a building e.g. a change of
  use to a parcel of land. Floor plans are not required for Agricultural Prior Notifications although
  these are recommended
must-include:
- item: Drawn to a recognised metric scale (e.g. 1:50 or 1:100)
  level: must
- item: One plan for each floor, showing the arrangement of rooms
  level: must
- item: Both existing and proposed changes shown
  level: must
confidence: medium
notes: From the council's list (adopted March 2016), page 3. 'Existing and proposed floor plans, and existing
  and proposed roof plans'. Not required where the proposal does not relate to a building (e.g. a change
  of use of a parcel of land). The conservation areas row (page 5) says applications there must be in
  full with detailed existing and proposed elevations, floor plans and roof plans (outline applications
  are not accepted in or next to a conservation area).
review-status: unverified
field-status: {}
