reference: flood-risk-assessment
local-authority: KIR
required-if:
  any:
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: More than 1ha in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: More than 1ha in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3, including minor development and change of use.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: A change of use to a more vulnerable class.
    - site:
        in:
        - surface-water-flood-risk
        description: Could be affected by sources of flooding other than rivers (e.g. surface water drains,
          reservoirs).
  - site:
      in:
      - critical-drainage-area
      description: In flood zone 1 with critical drainage problems notified by the Environment Agency.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: National Planning Practice Guidance (flood risk); Calder Catchment Strategic Flood Risk Assessment
source-text: All developments of more than 1ha in Flood Zone 1 ... All developments in flood zone 2 or
  3, including minor development and change of use. ... Less than 1 ha in flood zone 1, including a change
  of use in development type to a more vulnerable class (here they could be affected by sources of ...
  On an area within flood zone 1 which has critical drainage problems as notified by the Environment Agency
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
- item: Whether the measures proposed to deal with these effects and risks are appropriate
  level: must
- item: The evidence for the council to apply the Sequential Test (if necessary)
  level: must
- item: Whether the development will be safe and pass the Exception Test (if applicable)
  level: must
- item: A site layout plan showing the extent of flood zones, where applicable
  level: should
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 3 (Other National Requirements), page 17-18.
  The Environment Agency's standing advice applies to minor extensions and some changes of use in flood
  zone 2 or 3. The separate Sequential and Exception Test evidence is in the unmapped list.
review-status: unverified
field-status: {}
