    description: The development is in flood zone 2 or 3 (including minor development and change of use).
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
source-text: 'Householder: Additional national requirements Item Required Flood Risk Assessment (FRA)
  (where All developments in flood zone 2 or 3, including applicable) minor development and change of
  use.


  Full planning: The objectives of a site-specific FRA are to establish: • Whether a proposed development
  is likely to be affected by current or future flooding from any source • Whether the measures proposed
  to deal with these effects and risks are appropriate • The evidence for the LPA to apply (if necessary)
  the Sequential Test (see below) • Whether the development will be safe and pass the Exception Test (if
  applicable, see below).'
