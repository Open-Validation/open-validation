reference: bng-metric
local-authority: KIR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Subject to the general biodiversity gain condition (not exempt).
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Schedule 7A, Town and Country Planning Act 1990 (inserted by the Environment Act 2021); Kirklees
  Local Plan (2019) policy LP30
source-text: All development which would be subject to the general biodiversity gain condition introduced
  by Schedule 7A of the Town and Country Planning Act 1990
must-include:
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
- item: Where an earlier date is proposed, that date and the reasons for it
  level: must
- item: The completed metric calculation tool, including the publication date of the biodiversity metric
    used
  level: must
- item: A statement whether activities have been carried out that result in loss of onsite biodiversity
    value ('degradation'); if so, the date immediately before, the pre-development value on that date,
    the completed metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: 'From the council''s list (effective 24 May 2024), Table 1 (National Requirements: Biodiversity
  Net Gain), page 10-12. Householder and other exempt applications are exempt by law, so the rule is the
  statutory biodiversity gain condition. The ''whether exempt'' statement and the local BNG statement
  are in the unmapped list.'
review-status: unverified
field-status: {}
