reference: site-plan
local-authority: KIR
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - technical-details-consent
    - lbc
    - advertising
    - demolition-con-area
    - ldc-existing-use
    - ldc-prospective-use
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A site layout or block plan must be provided as follows:'
must-include:
- item: Existing and proposed plans
  level: must
- item: At a metric scale (1:200 or 1:500), ideally scaled to fit onto A4 or A3
  level: must
- item: On an up-to-date map, with a north point
  level: must
- item: The proposed development in relation to site boundaries, other buildings on the site, adjoining
    properties and the immediate area, including named roads and public rights of way (where affected)
  level: must
- item: The position of trees
  level: must
- item: Changes in levels, boundary treatment, vehicular/pedestrian access and parking
  level: must
- item: House names and road names labelled
  level: should
- item: Any red line matches the location plan
  level: must
- item: Connection to an existing drainage system indicated
  level: should
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development connects to the existing drainage system.
- item: The proposed locations and sizes of refuse storage and collection areas
  level: must
- item: Existing and proposed site levels, including off-site levels of adjoining land and buildings where
    feasible, and finished floor levels relative to a fixed, identifiable datum point (preferably Ordnance
    datum) not taken from structures to be demolished or moved
  level: must
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: New buildings or floor space.
    - all:
      - any:
        - condition:
            field: engineering-operations
            value: true
            description: Groundworks and/or engineering operations such as access tracks or re-grading
              of land.
        - condition:
            field: hard-surfacing
            value: true
            description: Hard surfaced areas.
      - condition:
          field: change-in-ground-levels
          value: true
          description: There are changes in level across the site or a change to ground level.
  source-text: ALL applications involving new buildings or floor space and any application that involve
    groundworks and /or engineering operations e.g. access tracks, hard surfaced areas, re-grading of
    land where there are any changes in level across the site or a change to ground level and it would
    add to the understanding of the proposal.
confidence: medium
notes: 'From the council''s list (effective 24 May 2024), Table 2 (Plans required: Site Layout Plan or
  Block Plan; Existing and Proposed Site Levels), page 13-15. The table says ''ALL applications''; the
  list''s other application types (Table 5) have their own requirements. Site levels are a separate row
  in the list that ''can be shown on the existing and proposed site layout plan or block plan'', so they
  are filed here.'
review-status: unverified
field-status: {}
