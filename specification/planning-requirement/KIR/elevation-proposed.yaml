reference: elevation-proposed
local-authority: KIR
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to the exterior of an existing building.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: ALL applications proposing new buildings or alterations to the exterior of an existing building
must-include:
- item: At a metric scale, usually 1:50 or 1:100
  level: must
- item: All existing and proposed elevations, including blank elevations (unless completely obscured)
  level: must
- item: Match the relevant existing/proposed floor plans
  level: must
- item: Labelled by compass direction (north, west etc.) or with a north point; 'front', 'back', 'side'
    alone are not accepted
  level: must
- item: Where adjoining or close to another building, the relationship between the two
  level: should
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 2 (Plans required), page 14.
review-status: unverified
field-status: {}
