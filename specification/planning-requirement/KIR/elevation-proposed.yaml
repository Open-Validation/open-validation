reference: elevation-proposed
local-authority: KIR
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
  - condition:
      field: external-alterations
      value: true
      description: The proposal alters the exterior of an existing building.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
source-text: and Proposed Elevations ALL applications proposing new buildings or alterations to the exterior
  of an existing building Existing and Proposed Floorplans ALL applications proposing new buildings, extensions
  or change of use.
must-include:
- item: All existing and proposed elevations, including blank elevations (unless completely obscured)
  level: must
- item: Matching the relevant existing and proposed floor plans
  level: must
- item: Each elevation labelled (e.g. north, west) or a north point indicated
  level: must
confidence: medium
review-status: unverified
field-status: {}
