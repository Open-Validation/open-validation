reference: heritage-statement
local-authority: KIR
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - park-and-garden
      - locally-listed-building
      - scheduled-monument
      - battlefield
      description: 'Affects a heritage asset: within or affecting the setting of a conservation area;
        affecting a listed building, its curtilage or setting; nationally or locally designated parks/gardens
        or their setting; non-designated heritage assets; or a scheduled monument.'
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP35; NPPF Chapter 16
source-text: 'ALL applications affecting a heritage asset including: ... Development within or affecting
  the setting of a Conservation Area (CA) ... Listed Building Consent applications ... Applications for
  relevant demolition in a CA ... Applications affecting nationally and locally designated parks/gardens
  or their setting ... Applications affecting non-designated heritage assets ... Applications affecting
  a scheduled monument'
must-include:
- item: Meets paragraph 189 of the NPPF and shows the heritage asset has been assessed and understood
    using best practice methods
  level: must
- item: An assessment of the significance of its archaeological, architectural, artistic or historic importance
    and the contribution of its setting
  level: must
- item: An assessment of the impact of the proposal on that significance
  level: must
- item: A description of the sources considered and expertise consulted
  level: should
- item: The justification for the proposed works or demolition
  level: should
- item: 'Listed building consent: a schedule of works to the listed building(s)'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Setting of designated heritage assets: plans indicating the assets whose setting is affected'
  level: should
  required-if:
    site:
      in:
      - listed-building-setting
      - conservation-area
      - park-and-garden
      - battlefield
      - scheduled-monument
      description: Affects the setting of designated heritage assets.
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Heritage Statement or Heritage Impact
  Assessment) and Appendix 3, page 36-37, 68. Appendix 3 says the scope will vary with the circumstances
  and gives the 'should' items. Key photographs are 'always of use'.
review-status: unverified
field-status: {}
