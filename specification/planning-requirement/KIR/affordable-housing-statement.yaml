reference: affordable-housing-statement
local-authority: KIR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings.
  - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP11; Interim Affordable Housing Policy 2020
source-text: ALL applications for more than 10 dwellings (and smaller developments where a masterplanned
  approach is applicable to multiple sites)
must-include:
- item: The proposed quantity of affordable housing provision
  level: must
- item: 'Full / reserved matters: a layout plan identifying the location and tenure of the affordable
    housing units'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'Full / reserved matters: a schedule of tenure, bedrooms per house by plot number, house type,
    storeys and Gross Internal Area of each house/house type'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Local Requirements), page 22. Smaller
  developments where a masterplanned approach applies show as discretionary.
review-status: unverified
field-status: {}
