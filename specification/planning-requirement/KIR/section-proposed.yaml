reference: section-proposed
local-authority: KIR
required-if:
  any:
  - ref: major-development
  - condition:
      field: change-in-ground-levels
      value: true
      description: Cut and fill operations, sloping or uneven land, or immediately adjoining land on a
        different level.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: i. ALL MAJOR development ii. Any proposals where cut and fill operations are proposed iii.
  Proposals on sloping or uneven land or sites where immediately adjoining land is on a different level
must-include:
- item: Finished floor levels and ridge levels of buildings
  level: must
- item: Existing and proposed site levels
  level: must
- item: Sections through the land, with where they are taken shown clearly on the site plan
  level: must
- item: Existing and proposed development in relation to adjoining land/properties, including street scene
    sections front and back
  level: must
- item: A plan showing the points between which each cross section is taken
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 2 (Plans required), page 15.
review-status: unverified
field-status: {}
