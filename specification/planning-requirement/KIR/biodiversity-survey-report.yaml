reference: biodiversity-survey-report
local-authority: KIR
required-if:
  any:
  - site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: Within, adjacent to or likely to affect a designated site (including a European site
        or Local Wildlife Site) or priority habitat.
  - site:
      in:
      - ecology-consultation-zone
      description: Within, adjacent to or likely to affect the Kirklees Wildlife Habitat Network.
  - condition:
      field: protected-species
      value: true
      description: Reasonable likelihood of affecting protected species (e.g. great crested newts, bats,
        birds, badgers).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - sssi-impact-risk-zone
        description: The SSSI Impact Risk Zone the site is in says 'all' planning applications need an
          ecological survey.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: geodiversity-interest
        value: true
        description: In or adjacent to a Local Geological Site.
  - condition:
      field: wind-turbine
      value: true
      description: An application relating to wind turbines.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP30; The Conservation of Habitats and Species Regulations 2017;
  Circular 06/2005
source-text: ALL APPLICATIONS AFFECTING A DESIGNATED SITE, PRIORITY HABITAT OR PROTECTED SPECIES including
  all proposals within, adjacent to, or likely to have an impact on a European site, Local Wildlife Site
  and/or the Kirklees Wildlife Habitat Network. ... Yes, if the SSSI IRZs (Impact Risk Zone) the site
  is in indicates that ‘all’ planning applications must submit an Ecological Survey
must-include:
- item: In accordance with British Standard BS 42020:2013
  level: must
- item: 'Householder: a Preliminary Ecological Appraisal, or an Ecological Survey Report where a single
    protected species is reasonably likely to be affected'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Undertaken by a suitably qualified ecologist
  level: must
- item: 'Ecological survey: identifies important habitats or species, informs an evaluation of nature
    conservation value and the significance of impacts, and identifies opportunities to enhance biodiversity'
  level: must
- item: 'All other minor and all major applications: an Ecological Impact Assessment (EcIA) characterising
    impacts on important ecological features and identifying significant ecological effects, on a geographic
    scale'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - technical-details-consent
- item: 'Wind energy applications: an Ecological Assessment'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application relating to wind turbines.
  source-text: Ecological Assessment
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Ecological Surveys and Reports), page
  30-32. The householder triggers (SSSI Impact Risk Zone, Local Geological Site, bat alert and great crested
  newt layers) are from the householder summary checklist (https://www.kirklees.gov.uk/beta/planning-applications/pdf/householder-applications-checklist.pdf).
  The Wildlife Habitat Network is shown as an ecology consultation zone. Many surveys are seasonal (Appendix
  5). The Species Enhancement Statement is in the unmapped list.
review-status: unverified
field-status: {}
