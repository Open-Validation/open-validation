reference: travel-plan
local-authority: KIR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Residential applications of 50+ dwellings.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: Residential site area over 0.5 hectares.
  - all:
    - ref: major-development
    - any:
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Non-residential floor space over 1,000m2.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Non-residential site area of 1 hectare or above.
  - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan policy LP20 (Sustainable Travel); Highways Design Guide SPD
source-text: 'Required for the following: i. All residential planning applications of 50+ dwellings, or
  the site area is over 0.5 hectares ii. Major non- residential applications where the floor space to
  be built is over 1,000m2 or the site area is 1 hectare or above iii. Proposals that are likely to have
  significant amounts of ... transport movement on a case-by-case basis.'
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Travel Plan), page 49-50. Other proposals
  with significant transport movement are decided case by case (discretionary).
review-status: unverified
field-status: {}
