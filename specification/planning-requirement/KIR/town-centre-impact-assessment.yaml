reference: town-centre-impact-assessment
local-authority: KIR
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development not located within a defined centre.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Floorspace greater than 500 square metres gross.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: Floorspace greater than 200 square metres gross.
      - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: KLP LP13
source-text: 'REQUIRED Main Town Centre Uses - Impact Assessment WHEN IT IS REQUIRED All retail, leisure
  and office developments not located within a defined centre where: • The floorspace is greater than
  500m2 gross or • The proposal is within 800 metres of the boundary of a Town Centre or District Centre
  and is greater than 300m2 gross or POLICY DRIVERS KLP Policy LP13 NPPF, Chapter 7 Ensuring the vitality
  of town centres paragraphs 89 and 90 WHAT INFORMATION IS REQUIRED addition to the guidance set out at'
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Also over 300m2 within
  800 metres of a Town or District Centre, and (from the audit) over 200m2 within 800 metres of a Local
  Centre. Distance to a centre has no field, so these are shown as officer discretion.
review-status: unverified
field-status: {}
