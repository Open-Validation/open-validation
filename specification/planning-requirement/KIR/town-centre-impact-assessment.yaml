reference: town-centre-impact-assessment
local-authority: KIR
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development not located within a defined centre.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Floorspace greater than 500m2 gross.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 300
          description: Greater than 300m2 gross.
      - discretionary
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: Greater than 200m2 gross.
      - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP13
source-text: 'All retail, leisure and office developments not located within a defined centre where: ...
  The floorspace is greater than 500m2 gross or ... The proposal is within 800 metres of the boundary
  of a Town Centre or District Centre and is greater than 300m2 gross or ... The proposal is within 800
  metres of the boundary of a Local Centre and is greater than 200 m2 gross.'
must-include:
- item: Scope and content agreed with the council, reflecting the scale, role and function of the proposal
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Main Town Centre Uses - Impact Assessment),
  page 42. The lower thresholds apply within 800 metres of a Town, District or Local Centre; there is
  no distance field yet, so those parts show as discretionary. The sequential test is in the unmapped
  list.
review-status: unverified
field-status: {}
