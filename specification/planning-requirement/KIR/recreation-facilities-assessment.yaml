reference: recreation-facilities-assessment
local-authority: KIR
required-if:
  any:
  - site:
      in:
      - open-space
      description: Development of open spaces, including sports and recreational buildings and playing
        fields, or Urban Green Space.
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of Urban Green Space (Local Plan Policies Map).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11+ new dwellings (including the cumulative total with adjacent residential sites).
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policies LP5, LP24, LP32, LP50, LP61 and LP63; Open Space SPD (June
  2021)
source-text: All applications seeking to develop open spaces including sports and recreational buildings
  and playing fields All applications which would result in the loss of Urban Green Space (as identified
  on the Kirklees Local Plan Policies Map) All applications for 11+ new dwellings
must-include:
- item: A plan and/or table with measured areas of all greenspace typologies and landscape features (amenity
    greenspace, parks, natural greenspace, allotments, children's play, outdoor sports)
  level: must
- item: 'Playing field land: Sport England''s checklist for applications affecting playing fields checked'
  level: should
  required-if:
    site:
      in:
      - open-space
      description: The application relates to playing field land.
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Open Space/Sport and Recreation Building
  and Land Assessment), page 43-44.
review-status: unverified
field-status: {}
