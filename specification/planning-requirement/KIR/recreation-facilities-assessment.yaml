reference: recreation-facilities-assessment
local-authority: KIR
required-if:
  any:
  - site:
      in:
      - open-space
      description: Development of open space or playing fields.
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of Urban Green Space.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more dwellings.
