reference: daylight-sunlight-assessment
local-authority: KIR
required-if: discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP24; Kirklees Housebuilder Design Guide SPD (June 2021)
source-text: When a proposed residential development, because of its proximity to either existing buildings
  or other proposed buildings within the development, is likely to receive low levels of sunlight and/or
  daylight to habitable rooms or when the scale and form of a development is likely to result in significant
  shadowing impacts upon neighbouring properties or land.
must-include:
- item: Carried out in accordance with the BRE guide 'Site Layout Planning for Daylight and Sunlight'
  level: must
- item: Daylight, vertical sky component, sunlight availability, average daylight factor and shadow studies,
    assessed against the BRE criteria
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Sunlight/Daylight Assessments), page
  48. No measurable trigger is given, so it shows as discretionary.
review-status: unverified
field-status: {}
