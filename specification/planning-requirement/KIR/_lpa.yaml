submission-standards:
- item: Submitted electronically via the Planning Portal or by email (planning.portal@kirklees.gov.uk),
    or by post; CD, DVD and WeTransfer are accepted, but not USB devices or other electronic formats
  level: must
- item: 'Postal submissions: one copy'
  level: must
- item: Drawings uploaded with full and detailed titles and drawing numbers
  level: should
- item: A completed copy of the Appendix 2 checklist submitted with the application
  level: should
- item: Personal or sensitive personal data in a separate document marked confidential, not cross-referenced
    in public documents
  level: should
- item: Plans drawn to an identified standard metric scale, with a linear scale bar
  level: must
- item: Plans in A3 or A4 format, or printable at A3 or A4
  level: must
- item: Plans of acceptable, clear and legible quality, uploaded in the orientation and at the scale indicated
  level: must
- item: Plans named and titled logically and each numbered (the council will add numbers if not)
  level: must
- item: Marked 'indicative' where surveys are not complete or details are not for approval; indicative
    plans for outline applications on separate sheets from plans to be approved
  level: must
- item: Elevations labelled North, South etc.; legible road names where relevant
  level: must
- item: '''Do not scale'' removed (replace with ''Do not scale for construction purposes'' if needed)'
  level: must
- item: All red lines match
  level: must
