reference: fire-statement
local-authority: KIR
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings (including flats).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'For applications involving ‘relevant buildings’ defined as: ... Buildings that contain two
  or more dwellings (including flats) or educational accommodation and ... Meet the height condition of
  18m or more in height, or 7 or more storeys. Unless an exemption applies'
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach relating to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Consultation undertaken on fire safety and what account has been taken of it
  level: must
- item: How fire safety policies in local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 1 (National Requirements), page 9.
review-status: unverified
field-status: {}
