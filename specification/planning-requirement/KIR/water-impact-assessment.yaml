reference: water-impact-assessment
local-authority: KIR
required-if:
  any:
  - condition:
      field: pond-on-or-near-site
      value: true
      description: The site contains a water body with capacity between 500 and 25,000m3, or an extant
        mill pond.
  - discretionary
  - condition:
      field: watercourse-culverting
      value: true
      description: Physical modifications to a waterbody.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policies LP27, LP28, LP29 and LP34; Water Environment (Water Framework
  Directive) (England and Wales) Regulations 2017
source-text: 'Applications to develop sites containing a water body with capacity between 500 – 25,000m3
  Applications to develop sites with extant mill pond (whether on site or remote from site) Applications
  that may have an adverse impact on an existing private water supply Applications that are to be served
  by a new or existing private water supply. ... All planning applications that would:'
must-include:
- item: 'Water bodies: evidence that the scheme retains the area of water, with an effective future management
    plan'
  level: must
  required-if:
    condition:
      field: pond-on-or-near-site
      value: true
      description: A water body or mill pond.
- item: 'Where relevant: evidence of no adverse impact on an existing private drinking water supply or
    its collection ground'
  level: must
- item: 'Developments without mains water: evidence that a wholesome and sufficient drinking water supply
    can be provided'
  level: must
- item: 'Water Framework Directive assessment: screening, scoping and (if needed) impact assessment, covering
    the affected and linked water bodies and compliance with the river basin management plan'
  level: must
  required-if:
    condition:
      field: watercourse-culverting
      value: true
      description: Physical modification or indirect effect on a waterbody.
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Water Bodies Assessment; Water quality
  / Water Framework Directive assessment), page 52-53. Private water supply cases and indirect effects
  on waterbodies (deterioration, preventing improvement) have no field yet and show as discretionary.
review-status: unverified
field-status: {}
