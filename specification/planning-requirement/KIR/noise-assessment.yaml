reference: noise-assessment
local-authority: KIR
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development (residential, hospitals, schools) adjacent to major roads
        or other transportation or industrial/commercial noise sources.
  - condition:
      field: noise-generating-use
      value: true
      description: Development containing noise sources that may affect existing noise sensitive uses.
  - all:
    - site:
        in:
        - town-centre
        description: In a town centre.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  - condition:
      field: wind-turbine
      value: true
      description: An application relating to wind turbines.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP52
source-text: ALL applications involving noise sensitive development (such as residential, hospitals and
  schools) adjacent to major roads or other ... transportation or industrial/commercial noise sources.
  Developments which contain noise sources, whether internally or externally, which may have an impact
  upon existing “noise sensitive” use Residential development in town centres.
must-include:
- item: Carried out by a suitably competent person
  level: must
- item: 'Wind energy applications: noise, shadow flicker and light reflection assessment'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application relating to wind turbines.
  source-text: Noise, Shadow Flicker and Light Reflection Assessment
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Noise Impact Assessment) and Table 5
  (Wind Energy Applications), page 42-43, 60-61. The list says the need for an assessment is decided site
  by site, ideally at pre-application stage.
review-status: unverified
field-status: {}
