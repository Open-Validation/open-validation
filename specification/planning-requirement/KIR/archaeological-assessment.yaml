reference: archaeological-assessment
local-authority: KIR
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: The site includes, or may include, heritage assets with archaeological interest.
  - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
source-text: Where an application site includes, or is considered to have the potential to include, heritage
  assets with archaeological interest, applicants may be required to submit an appropriate desk-based
  assessment and, where desk-based research is insufficient to properly assess the interest, a field evaluation.
must-include:
- item: An appropriate desk-based assessment
  level: must
- item: A field evaluation where desk-based research is insufficient
  level: should
confidence: medium
notes: From the council's list (effective 24 May 2024), Appendix 3 (guidance on heritage statements),
  page 68. Applicants 'may be required' to submit it, so it shows as discretionary; the West Yorkshire
  Archaeology Advisory Service can advise.
review-status: unverified
field-status: {}
