reference: location-plan
local-authority: KIR
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - technical-details-consent
    - lbc
    - advertising
    - demolition-con-area
    - ldc-existing-use
    - ldc-prospective-use
    - pip
    - prior-approval
    - hedgerow-removal
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: ALL applications (except applications for approval of details reserved by condition and Section
  73 applications)
must-include:
- item: At a metric scale (preferably 1:1250 or 1:2500), ideally scaled to fit onto A4 or A3
  level: must
- item: On an up-to-date map
  level: must
- item: Site edged in red, including all land needed to carry out the development (access from a public
    highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: At least two named roads (where relevant) and surrounding buildings, with properties numbered
    or named
  level: must
- item: Any other land owned by the applicant close to or adjoining the site edged in blue
  level: should
- item: A north point
  level: must
- item: 'Householder: shows the site up to the public/adopted highway'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Location Plan (including showing up to the public/adopted highway)
- item: 'Hedgerow removal: a plan (preferably 1:2,500) clearly identifying the hedgerow to be removed'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: A plan (preferably 1:2,500 scale) clearly identifying the hedgerow to be removed
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 2 (Plans required) and Table 5, page 13,
  57-58. Not needed for approval of details reserved by condition or Section 73 applications. Permission
  in principle and prior notifications need 'a plan which identifies the land' / 'A plan indicating the
  site'. The householder item is from the householder summary checklist (https://www.kirklees.gov.uk/beta/planning-applications/pdf/householder-applications-checklist.pdf).
review-status: unverified
field-status: {}
