reference: sci
local-authority: KIR
required-if:
  any:
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: An application relating to wind turbines.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>='
          value: 2
          description: 2 or more wind turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height of any turbine exceeds 15 metres.
  - all:
    - ref: major-development
    - condition:
        field: pre-application-community-consultation
        value: true
        description: Community consultation has taken place before the application was submitted.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Section 61W of the Town and Country Planning Act 1990; DMPO Part 2; Kirklees Development Management
  Charter 2015
source-text: 'For applications involving 2 or more wind turbines or where the hub height of any turbine
  exceeds 15 metres in height. Exception: Section 73 applications ... MAJOR planning applications where
  community consultation has taken place prior to the submission of a planning application. This will
  usually be appropriate where:'
must-include:
- item: 'Pre-application consultation methods (wind turbines: how the local community has been consulted)'
  level: must
- item: A summary of the responses / comments received
  level: must
- item: How the responses have been taken into consideration
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 1 (Wind Turbines Statement of Community
  Involvement) and Table 4, page 10, 46-47. Section 73 applications for wind turbines are excepted. The
  local SCI 'will usually be appropriate' where proposals are likely to have a significant impact or attract
  significant local interest.
review-status: unverified
field-status: {}
