reference: waste-management-plan
local-authority: KIR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
        - technical-details-consent
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: engineering-operations
          value: true
          description: Excavation of material from the site.
  - all:
    - ref: major-development
    - condition:
        field: waste-storage-facilities
        value: true
        description: Provision of refuse storage facilities.
  - condition:
      field: dwelling-subdivision
      value: true
      description: Conversion to flats.
  - condition:
      field: food-or-drink-use
      value: true
      description: Change of use to bars, restaurants or takeaway food outlets.
  - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policies LP24 and LP43; Waste Management Design Guide for New Developments
source-text: Non-householder applications involving the demolition/ excavation of material from the site.
  Major residential and commercial applications involving the provision of refuse storage facilities.
  Other applications that will have an impact on the generation of waste, for example conversion to flats,
  changes of use to bars, restaurants, takeaway food outlets.
must-include:
- item: A plan or statement showing arrangements and/or space for the storage and collection of recycling
    and refuse
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Site Waste Management Plan), page 46.
  Other applications affecting waste generation show as discretionary.
review-status: unverified
field-status: {}
