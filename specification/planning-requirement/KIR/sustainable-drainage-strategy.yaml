reference: sustainable-drainage-strategy
local-authority: KIR
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 5 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Commercial extensions or new builds of 500m2 or greater.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
        - technical-details-consent
    - any:
      - site:
          in:
          - flood-risk-zone
          - surface-water-flood-risk
          description: In flood zone 2 or 3 or the 1 in 100 year surface water flood area.
      - condition:
          field: near-watercourse
          value: true
          description: The site contains a watercourse or culvert.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - technical-details-consent
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: hard-surfacing
        value: true
        description: Hard surfacing of a domestic garden that needs planning permission.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policies LP27, LP28 and LP34; WYCA Sustainable Drainage Guidance (2020)
source-text: 'A Drainage Strategy is required for ALL major applications as well as: ... applications
  for 5 or more dwellings ... commercial extensions of 500m2 or greater ... commercial new builds of 500m2
  or greater ... all applications (excluding householders) in flood zones 2 or 3, the 1 in 100 year surface
  water flood area or containing a watercourse or culvert. ... For proposals not requiring a Drainage
  Strategy (such as applications for less than 5 dwellings), details of the proposed drainage solution
  are still required (excluding householder applications). Drainage details are however required for hard
  surfacing of domestic gardens where these require planning permission.'
must-include:
- item: 'Drainage strategy: how surface water will be dealt with, shown on a plan, proportionate to the
    scale of development'
  level: must
- item: 'Drainage strategy: detailed site layout at an identified scale'
  level: must
- item: 'Drainage strategy: topographical survey of the site'
  level: must
- item: 'Drainage strategy: plans, drawings and specification of the SuDS proposed, including hard construction,
    soft landscaping and planting'
  level: must
- item: 'Drainage strategy: calculations of discharge and run-off rates and water storage capacity, showing
    they meet the site''s requirements'
  level: must
- item: 'Drainage strategy: details of any offsite works, with the necessary consents'
  level: must
- item: 'Drainage strategy: management and maintenance plan for all SuDS'
  level: must
- item: 'Drainage strategy: geotechnical ground investigation reports for infiltration/SuDS schemes'
  level: must
- item: 'Drainage strategy: flood route maps with contour drawings'
  level: must
- item: 'Drainage strategy: justification for excluding preferred options on the drainage hierarchy'
  level: must
- item: 'Drainage strategy: temporary drainage during construction, including (near watercourses) how
    contamination will be kept out of the watercourse'
  level: must
- item: 'Smaller schemes: information showing compliance with Local Plan policies LP28 and LP34, including
    drainage solutions explored under the surface water hierarchy'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - technical-details-consent
- item: 'Hard surfacing of a domestic garden: the proposed surfacing materials and drainage methods'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Drainage details; Drainage Strategy (Surface
  Water)), page 28-30. Filed under MHCLG's (retired) sustainable drainage strategy id. Every non-householder
  application needs at least drainage details; the full strategy is for the listed triggers.
review-status: unverified
field-status: {}
