reference: land-contamination-assessment
local-authority: KIR
required-if:
  any:
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Sensitive or vulnerable end users (residential, schools, nurseries, allotments, play
          areas, hospitals).
    - any:
      - condition:
          field: industrial-site
          value: true
          description: Previous manufacturing or industrial activity.
      - site:
          in:
          - near-landfill-site
          description: Within 250 m of a former or current landfill site.
      - site:
          in:
          - contaminated-land
          description: Land suspected to be contaminated due to its uses now or in the past.
  - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP53
source-text: A Phase 1 Contaminated Land Report (and possibly also a Phase 2 report and Remediation Strategy)
  will be required before determining the application if the site ... is considered to be very likely
  to be highly contaminated and that satisfactory remediation may not be possible to prevent risks to
  sensitive end users
must-include:
- item: Completed by a suitable competent person
  level: must
- item: Historical research from available maps, plans and records, current activities on the site and
    adjoining, and likely sources of contamination
  level: must
- item: Identification of potential receptors
  level: must
- item: The site's environmental setting (location, geology, hydrogeology, proximity to landfill sites)
  level: must
- item: A site walkover
  level: must
- item: An initial conceptual model, with recommendations on whether further investigation or action is
    needed
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Land Contamination Assessment), page
  37-39. The test is whether the site is 'very likely to be highly contaminated'; the list's examples
  (chemical or fuel storage, waste treatment) and other end uses show as discretionary.
review-status: unverified
field-status: {}
