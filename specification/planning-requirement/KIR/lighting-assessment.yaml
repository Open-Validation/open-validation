reference: lighting-assessment
local-authority: KIR
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Exterior lighting.
    - discretionary
  - all:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: Major new buildings.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated adverts, including digital advertisement display panels.
  - discretionary
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policy LP52
source-text: ALL applications involving exterior lighting where it would be likely to ... materially affect
  local amenity, dark landscape, road safety or nature conservation. ALL applications for Sports pitches,
  car parks and major new buildings. Applications for advertisement consent where the adverts are to be
  illuminated, including Digital Advertisement Display Panels
must-include:
- item: Proposed maintained average horizontal illuminance, with reference to guidance
  level: must
- item: Predicted vertical illuminance at the windows of nearby properties
  level: must
- item: 'Luminaire specification: number and location, column height, lamp type and rating, housing design,
    glare control, and a light spill plan'
  level: must
- item: Proposed hours of operation
  level: must
- item: 'Illuminated adverts: type and location of luminaires, with manufacturer specification showing
    no glare to nearby light sensitive premises, drivers or pedestrians'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Illuminated adverts: dimensions of each illuminated advertisement and its luminance (cd/m2)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Illuminated adverts: times of illumination; for digital panels, how luminance differs between
    daylight and darkness'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Lighting Assessment), page 39-41. 'Likely
  to materially affect' amenity etc. shows as discretionary; sports pitches and car parks have no field
  yet, so they are covered by the discretionary part.
review-status: unverified
field-status: {}
