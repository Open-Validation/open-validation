reference: lighting-assessment
local-authority: KIR
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: Exterior lighting likely to affect amenity, dark landscapes or nature, including car
        parks.
  - condition:
      field: floodlighting
      value: true
      description: Lighting of sports pitches.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements.
  - all:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: Major new buildings.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
confidence: medium
notes: 'Audit (wrong_app_type): Kirklees is a unitary authority; the workbook put this under minerals
  and waste because of merged columns.'
review-status: unverified
field-status: {}
