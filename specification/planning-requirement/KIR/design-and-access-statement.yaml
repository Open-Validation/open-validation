reference: design-and-access-statement
local-authority: KIR
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development within a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) where floorspace is 100m2 or more.
  - application-type:
      in:
      - lbc
  - condition:
      field: wind-turbine
      value: true
      description: An application relating to wind turbines.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Kirklees Local Plan (2019) policy LP26 (wind energy)
source-text: 'i. All applications for major development, including applications for approval of reserved
  matters if the original outline permission did not have a statement submitted with it ii. Development
  within a Conservation Area (CA) for: a) One or more dwelling b) Building(s) where floorspace is 100m2
  or more ... iii. Listed Building Consent applications. Excluded: Applications for engineering/mining/waste
  /change of use.'
must-include:
- item: Explains the design principles and concepts applied to the development
  level: must
- item: Demonstrates the steps taken to appraise the context of the development and how the design takes
    it into account, including the characteristics of the site and its wider setting
  level: must
- item: Explains the approach to access and how relevant local access policies have been taken into account
  level: must
- item: States what consultation has been undertaken on access issues and what account has been taken
    of it
  level: must
- item: Explains how any specific issues which might affect access to the development have been addressed
  level: must
- item: 'Wind energy applications: a Statement of Design Rationale and Access'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: An application relating to wind turbines.
  source-text: Statement of Design Rationale and Access
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 1 (National Requirements), page 8-9. Engineering,
  mining, waste and change of use applications are excluded. The wind energy item is from Table 5 (Wind
  Energy Applications, pages 60-61).
review-status: unverified
field-status: {}
