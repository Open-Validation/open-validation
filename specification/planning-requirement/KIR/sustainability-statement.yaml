reference: sustainability-statement
local-authority: KIR
required-if:
  always: true
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: 'Kirklees Local Plan (2019) policies LP23, LP26, LP27, LP28, LP30, LP31, LP33, LP35, LP42, LP43,
  LP47, LP51 and LP52; Climate Change: The Planning Response and Guidance Note for Developers (June 2021)'
source-text: ALL applications (including householder applications) The amount of information in the statement
  should be proportionate to the scale of the proposal.
must-include:
- item: Responds to the council's Climate Change Emergency declaration and shows how the development contributes
    to the transition to a low carbon economy
  level: must
- item: How the layout has been designed to minimise energy consumption (orientation, sustainable transport
    links, renewable/low carbon energy)
  level: must
- item: How the building is designed to reduce energy consumption (orientation, solar gain, insulation,
    renewable energy, waste minimisation, water management including climate adaptation and resilience,
    sustainable sourcing of materials)
  level: must
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Climate Change Statement), page 25-26.
  Kirklees calls it a Climate Change Statement, required since a Cabinet decision of June 2021; it is
  filed under sustainability statement. The householder checklist notes some questions may not be relevant
  for extensions.
review-status: unverified
field-status: {}
