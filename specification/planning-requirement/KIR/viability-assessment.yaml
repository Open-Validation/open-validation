reference: viability-assessment
local-authority: KIR
required-if:
  any:
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>'
          value: 10
          description: More than 10 dwellings.
      - discretionary
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The scheme cannot meet Local Plan policy LP11 on affordable housing.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant wishes to show the development would be unviable with the contributions
        the policies require.
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policies LP4, LP5, LP11, LP19, LP23, LP49 and LP63; Kirklees Viability
  Guidance Note (June 2020)
source-text: ALL applications for more than 10 dwellings (and smaller developments where a masterplanned
  approach is applicable to multiple sites) where the scheme cannot meet KLP Policy LP11 ... All development
  proposals which would generate the requirement for contributions (as set out in the policy drivers)
  to be secured through planning obligation where the applicant wishes to demonstrate that the proposed
  development will be unviable in a particular set(s) of circumstances
must-include:
- item: Follows the viability guidance in the NPPG, the NPPF and the council's Viability Guidance Note
  level: must
- item: Prepared by a suitably qualified person, such as a RICS surveyor
  level: must
- item: Made publicly available, or (in exceptional cases of commercial sensitivity) an executive summary
    made public with sensitive information aggregated
  level: should
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Affordable Housing Financial Viability
  Assessment; Viability Appraisal), page 22, 51-52.
review-status: unverified
field-status: {}
