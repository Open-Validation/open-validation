reference: arboriculturist-report
local-authority: KIR
required-if:
  any:
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site, or on adjacent land, that could influence or be affected by
          the development.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Trees protected by a Tree Preservation Order or Conservation Area status.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development within 2m of the canopy spread of a tree (including street trees).
source-url: https://www.kirklees.gov.uk/beta/planning-applications/pdf/validation-requirements-submission-of-planning-applications.pdf
policy: Kirklees Local Plan (2019) policies LP24 and LP33
source-text: Where there are trees, protected by either Tree Preservation Order or Conservation Area status,
  within the application site, or on land adjacent to it that could influence or be affected by the development.
  ... Any proposal involving development within 2m of the canopy spread of a tree (including street trees).
must-include:
- item: In accordance with BS 5837
  level: must
- item: Tree survey
  level: must
- item: Arboricultural Impact Assessment, with tree constraints plan
  level: must
- item: Arboricultural Method Statement, with tree protection plan
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
      - outline-some
      - technical-details-consent
- item: Details of existing and proposed levels
  level: must
- item: 'Householder applications: a lesser level of information may be appropriate, judged case by case'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (effective 24 May 2024), Table 4 (Tree (Arboricultural) Survey), page 50.
  For outline applications with some matters reserved, the detailed list applies where the reserved matters
  may affect trees.
review-status: unverified
field-status: {}
