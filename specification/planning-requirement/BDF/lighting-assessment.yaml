reference: lighting-assessment
local-authority: BDF
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External or free-standing lighting would be provided or made necessary by the development,
        including sports pitch and security lighting.
  - any:
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        description: In the vicinity of a listed building or conservation area.
    - condition:
        field: protected-species
        value: true
        description: In the vicinity of protected species habitats.
    - condition:
        field: outside-urban-area
        value: true
        description: In open countryside.
    - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: 'Bedford Borough Local Plan 2030 Policy 47S (Pollution, disturbance and contaminated land); NPPF
  Annex C and National Decision-Making Policy P3; Planning Practice Guidance: Light Pollution'
source-text: Proposals involving developments in the vicinity of residential property, protected species
  habitats, a Listed Building or a Conservation Area, or open countryside, where external or free standing
  lighting would be provided or made necessary by the development, including sports pitch lighting and
  security lighting, should be accompanied by details of such external or free standing lighting and the
  proposed hours when the lighting would be switched on.
must-include:
- item: A layout plan with beam orientation, beam spread and intensity of lighting
  level: must
- item: Any controls such as movement sensors or timers, and hours of use
  level: must
- item: A schedule of the equipment in the design
  level: must
- item: How maximum energy efficiency is achieved while minimising nuisance to neighbours
  level: should
- item: Mitigation to minimise impact on bats
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Lighting near a known bat roost or bat flight path.
  source-text: Where lighting is proposed in the vicinity of known bat roost or bat flight paths, details
    must include mitigation to minimise impact on bats.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 12-13. Matrix page 7: ticked for
  Listed Building Works, ''?'' for Major, Minor and Renewable Energy. ''In the vicinity of residential
  property'' and lighting that could spill onto transport networks are shown as discretionary.'
review-status: unverified
field-status: {}
