reference: transport-assessment
local-authority: BDF
required-if: discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policy 90S (Transport infrastructure and network improvements);
  NPPF Annex C and National Decision-Making Policy TR6
source-text: Transport Assessments are required for all development proposals which will generate significant
  amounts of traffic or movements.
must-include:
- item: Accessibility to the site by all modes of transport and the likely modal split
  level: must
- item: Measures to improve access by public transport, walking and cycling, reduce the need for parking
    and mitigate transport impacts
  level: must
- item: Highway capacity analysis and any required off-site works
  level: must
  required-if: discretionary
  source-text: For development that has significant transport 20 implications, an appropriate level of
    highway capacity analysis should be included, together with details of any required off-site works.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 20-21. Matrix page 11: ''?'' for
  Major, Minor, Change of Use and Renewable Energy. ''Significant amounts of traffic'' has no threshold
  in the list, so shown as discretionary; smaller schemes can give a Transport Statement.'
