reference: fire-statement
local-authority: BDF
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>'
        value: 18
        description: The building is more than 18 m in height.
    - condition:
        field: storey-count
        operator: '>'
        value: 7
        description: The building contains more than 7 storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: To be used for 2 or more residential units.
    - condition:
        field: educational-accommodation
        value: true
        description: To be used for education purposes.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A fire Statement is required if the building is more than 18m in height or contains more
  than 7 storeys and is to be used for 2 or more residential units or education purposes.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 7. Matrix page 5: ''?'' for Major,
  Minor, Change of Use and Listed Building Works. The thresholds are the list''s wording; the national
  rule (Article 9A) is 18 m or more, or 7 or more storeys.'
review-status: unverified
field-status: {}
