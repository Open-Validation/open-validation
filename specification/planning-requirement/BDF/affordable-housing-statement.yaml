reference: affordable-housing-statement
local-authority: BDF
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 58S (Affordable Housing) and 59S (Housing Mix); NPPF
  National Decision-Making Policies HO7, HO8, HO9 and HO10
source-text: For all applications of 10 or more dwellings the Council will require a housing statement.
must-include:
- item: Proportion and mix of housing sizes (net internal area, bedrooms and bed spaces) against the Nationally
    Described Space Standards, for open market and affordable housing
  level: should
- item: Proportion and mix of affordable housing tenures, including the minimum proportion of Social Rent
  level: should
- item: 'Number and size mix of residential units: total, proportion of market and affordable, and house
    types'
  level: should
- item: Number and proportion of units meeting Building Regulations M4(1), M4(2) and M4(3)
  level: should
- item: A plan showing the location of market and affordable units, with affordable clusters of no more
    than 15 dwellings, and the bedrooms, floorspace, accessibility standard and tenure of those units
  level: should
- item: 'For outline applications: the tenure and size mix and location (may be indicative)'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: For applications for outline planning permission, the housing tenure and size mix as well
    as ther location may be indicative, however the Housing Statement is still required to include this
    information to demonstrate that the site can accommodate the level of development proposed at that
    stage.
- item: 'For a rural exception site: information showing compliance with National Decision-Making Policy
    HO10, including a Local Housing Needs Survey or secondary data no more than five years old'
  level: must
  required-if:
    condition:
      field: rural-exception-housing
      value: true
      description: The application relates to a rural exception site.
  source-text: In addition to the above, if the application relates to a rural exception site (as defined
    by Annex B of the NPPF) the Housing Statement (alongside the Planning Statement where relavwnt) shall
    include information to demonstrate compliance with National Decision-Making Policy HO10, including
    a Local Housing Needs Survey or secondary data that is no more than five years old.
- item: 'For specialist housing: information showing compliance with National Decision-Making Policy HO9
    (and Local Plan Policy 59S for specialist housing for older people)'
  level: must
  required-if: discretionary
  source-text: For Specialist Housing forms of accommodation, the Housing Statement needs to include information
    to demonstrate compliance with National Decision-Making Policy HO9. For Specialist Housing for Older
    People the Housing Statement must demonstrate compliance with Local Plan 2030 Policy 59S (Housing
    Mix).
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 10. The list calls it a Housing Statement.
  Matrix page 6: ''?'' for Major. The list''s contents are ''expected to include'', so shown as ''should''.
  Specialist housing is shown as discretionary because there is no field for it.'
