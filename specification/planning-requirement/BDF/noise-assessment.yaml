reference: noise-assessment
local-authority: BDF
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development may generate significant noise, alone or with other development.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development.
  - condition:
      field: fronts-main-road
      value: true
      description: Development adjoining major roads, including traffic-sensitive streets in the town
        centre.
  - condition:
      field: near-licensed-premises
      value: true
      description: Development adjoining entertainment venues or licensed premises.
  - condition:
      field: plant-equipment
      value: true
      description: Installation of plant and equipment such as condensers, air conditioning units or air
        to air heat pumps.
  - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 32, 47S (Pollution, disturbance and contaminated land)
  and 88 (Impact of transport on people, places and environment); NPPF Annex C and National Decision-Making
  Policy P3
source-text: Applications that may generate significant noise, either alone or in combination with other
  existing or proposed development or are considered to be a noise-sensitive development will need to
  be supported by a Noise Impact Assessment (which shall include details of mitigation) prepared by a
  suitably qualified acoustician. In particular, noise assessments will be required for all development
  adjoining major roads including traffic sensitive streets in the town centre, industry, entertainment
  venues, licensed premises, the railway, distribution depots and sporting venues. All applications involving
  the installation of plant and equipment (i.e. condensers, air conditioning units, air to air heat pumps)
  shall include either their individual Sound Power Level or Sound Pressure Level at a stated distance.
must-include:
- item: Prepared by a suitably qualified acoustician, including details of mitigation
  level: must
- item: 'For plant and equipment: the individual Sound Power Level, or Sound Pressure Level at a stated
    distance'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Plant and equipment is installed.
- item: Baseline data on existing background noise levels, including frequency analysis
  level: should
- item: Sensitive receptors and measuring points, and why they are appropriate
  level: should
- item: Design features to minimise or mitigate noise
  level: should
- item: Modelling and scenario tests where cumulative impact is identified
  level: should
- item: Assessment of the impact on noise-sensitive receptors and the surrounding area
  level: should
- item: A noise monitoring and mitigation/management scheme
  level: should
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 14. Matrix page 7: ''?'' for Major,
  Minor, Change of Use and Renewable Energy. Development adjoining industry, the railway, distribution
  depots and sporting venues is shown as discretionary (no field).'
