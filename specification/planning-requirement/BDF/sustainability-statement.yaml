  level: must
- item: Renewable or sustainable technologies included (for example PV panels, ground source heat pumps,
    electric charging points, combined heat and power)
  level: must
- item: Other measures to help future occupiers reduce their carbon footprint, such as recycling facilities
    and water recycling
  level: should
