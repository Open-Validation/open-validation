reference: air-quality-assessment
local-authority: BDF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Development of a type in the council's table (for example sensitive development,
          or proposals that introduce or increase car parking by 300 spaces or more) inside or adjacent
          to an Air Quality Management Area.
    - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: 'Bedford Borough Local Plan 2030 Policy 88 (Impact of transport on people places and environment);
  NPPF National Decision-Making Policies P3 and TR3; Planning Practice Guidance: Air Quality'
source-text: Applications that propose development, of a prescribed nature (see table below), inside,
  or adjacent to, an air quality management area (AQMA) or another area where excessive pollution is apparent;
  where the development could in itself result in the designation of an AQMA; or where the grant of planning
  permission would conflict with, or render unworkable, elements of a Local Authority’s air quality action
  plan; will need to be supported by such information
must-include:
- item: Carried out by a competent specialist
  level: must
- item: Details of the baseline assessment
  level: should
- item: Relevant air quality concerns and any previous complaints received
  level: should
- item: Scale and nature of any emissions
  level: should
- item: Assessment methodology used for modelling air quality
  level: should
- item: Details of activities proposed
  level: should
- item: Identification of sensitive locations and receptors
  level: should
- item: Details of mitigation, including during construction phases
  level: should
- item: Ongoing monitoring situation
  level: should
- item: Details of a dust suppression scheme, and how dust levels will be assessed and minimised
  level: must
  required-if: discretionary
  source-text: Any application which is likely to generate significant levels of dust, including during
    construction, must include details of a dust suppression scheme and will need to indicate how dust
    levels will be assessed and minimised for impact on surrounding areas.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 3-4. Matrix page 4: ''?'' for Major,
  Minor and Change of Use, so those types are shown. The list''s table names 12 types of proposal (processes
  under the PPC regime, sensitive development in poor air quality, significant traffic changes on busy
  roads, 300 or more parking spaces, major phased redevelopment, significant dust or emissions, sites
  close to ecological sites or SSSIs and others). It also covers development that could itself lead to
  an AQMA or conflict with the air quality action plan, which is shown as discretionary. The developer
  must agree the approach with the council before the assessment.'
review-status: unverified
field-status: {}
