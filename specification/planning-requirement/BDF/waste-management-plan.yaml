reference: waste-management-plan
local-authority: BDF
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 32 and 49 (waste); NPPF Annex C and National Decision-Making
  Policies CC2, DP3 and P3
source-text: All applications should include details of waste storage facilities and demonstrate the means
  of 22 access to them particularly for larger development where clear vehicular access must be demonstrated
  and swept path analysis for refuse and recycling vehicles including turning facilities for cul-de-sacs
must-include:
- item: Details of waste storage facilities and the means of access to them
  level: must
- item: 'For new dwellings (including change of use and conversion): waste and recycling storage areas'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, including through change of use and conversion.
- item: Clear vehicular access and swept path analysis for refuse and recycling vehicles, including turning
    facilities for cul-de-sacs
  level: should
  required-if:
    ref: major-development
- item: 'For large-scale major development, a waste planning statement: how the proposal meets sustainable
    waste management objectives and promotes reuse and recycling, and how construction waste is minimised
    and managed, including segregating materials for reuse or recycling'
  level: must
  required-if:
    all:
    - ref: major-development
    - discretionary
  source-text: For large scale major development, a waste planning statement will be required and should
    include details on the following matters:- • How the proposal meets sustainable waste management objectives
    and promotes reuse and recycling. • How construction waste is to be minimised and managed throughout
    the lifetime of construction including proposals to segregate materials suitable for reuse or recycling
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 22-23. The list calls it Waste Audits
  and Assessments. Matrix page 11: ticked for Major, Minor and Change of Use, ''?'' for Listed Building
  Works. Swept paths are asked for ''particularly for larger development'', so shown as ''should'' for
  major development. ''Large scale major'' has no threshold in the list, so that item is major plus discretionary.'
review-status: unverified
field-status: {}
