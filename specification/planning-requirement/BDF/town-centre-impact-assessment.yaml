reference: town-centre-impact-assessment
local-authority: BDF
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Main town centre uses (retail, leisure and office) in excess of 2,500 square metres.
  - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 77S, 78, 82 and 85; A Strategy for Bedford High Street
  SPD; NPPF Annex C and National Decision-Making Policy TC4
source-text: Applications for main town centre uses, that is, retail, leisure and office uses (whether
  within the town centre or outside of it) should provide a Sequential Assessment and, for proposals in
  excess of 2,500 square metres, also provide a Retail Impact Assessment.
must-include:
- item: The likely catchment area and nearby centres that could accommodate the development; the area
    of search agreed with the council first
  level: must
- item: Impact on town centre viability and vitality, including local consumer choice and trade, with
    future impacts over 5 years (10 years for major development not implemented immediately)
  level: must
- item: Impact on existing, committed and planned public and private investment in town centres in the
    catchment
  level: must
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 16-17. The list calls it a Retail
  Impact Assessment, within ''Retail/Town Centre Uses''. Matrix page 9: ''?'' for Major. ''Impact assessments
  may also be required for major extensions of existing premises or variations of conditions'' is shown
  as discretionary. The sequential assessment for all main town centre uses is listed separately (see
  unmapped). The applicant pays for any independent review.'
review-status: unverified
field-status: {}
