    (checked 2026-11-06) links this list and the matrix as its local validation requirements; no newer
    list or consultation was found.
  status: current
submission-standards:
- item: Plans drawn to a scale (for example 1:50 or 1:100 for elevations and block plans, 1:1250 or 1:2500
    for a location plan), with a north point and scale bar, and fully labelled
  level: should
- item: Plans must be capable of being scaled from and not marked 'DO NOT SCALE' or 'EXCEPT FOR THE PURPOSES
    OF PLANNING' (the application will be invalid)
  level: must
- item: No photos of plans or websites, and no photographs used to produce paper plans
  level: must
- item: Each plan submitted as an individual PDF, not as a string of plans
  level: must
- item: Photographs only as supporting information and as PDFs; JPEG and PNG files are not accepted
  level: must
- item: Plans submitted at the size they were created (A4, A3, A2, A1 or A0)
  level: must
- item: No email addresses, signatures, personal addresses or personal telephone numbers on plans or documents
    (business addresses are acceptable)
  level: must
- item: Reports with sensitive information (such as protected species locations or personal data) submitted
    as both a redacted version for publication and an unredacted version, identical apart from the redactions
    and labelled 'redacted' / 'unredacted'
  level: must
- item: Written reports cannot replace the need for plans
  level: must
- item: Documents submitted the same way as the application (online or on paper); not by email, file transfer
    or links
  level: must
- item: No password-protected documents; documents supplied in an editable version
  level: must
- item: 'Retrospective (S73A) applications: plans showing the site both before and after the works'
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: The application is retrospective.
