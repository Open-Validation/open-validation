reference: landscaping-plan
local-authority: BDF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: landscaping-works
      value: true
      description: Landscaping is a matter for determination.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 37 (Landscape Character), 38 (Landscaping in New Development),
  39 (Retention of Trees) and 40 (Hedgerows); NPPF National Decision-Making Policies DP3, N2, N3 and N6
source-text: This is required for all Outline, Full or Reserved Matters proposals where landscaping is
  a matter for determination.
must-include:
- item: A plan of the proposed external works, including hard and soft landscaping, trees, flood management
    measures, fencing and boundary treatment, and bunds or screening
  level: should
- item: An evaluation of existing landscape features and how they will be maintained and enhanced
  level: should
- item: 'Where existing features will be lost or harmed: the need for their loss and mitigation'
  level: should
- item: 'Planting specifications: methods, spacing, species, stock size and timing'
  level: should
- item: Ongoing management of planting and landscaping, including monitoring for plant failure and replacement
  level: should
- item: Planting co-ordinated with street lighting and below-ground services
  level: should
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 12. The list calls it Landscape Proposals
  and Mitigation Plans. Matrix page 7: ticked for Major and Minor. The contents are listed as ''should
  include (where relevant)''.'
review-status: unverified
field-status: {}
