reference: recreation-facilities-assessment
local-authority: BDF
required-if:
  site:
    in:
    - open-space
    description: Development affecting open spaces (including Village Open Spaces and Urban Open Spaces),
      sport and recreation uses.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 29 (Design quality and principles) and 53 (Development
  layout and accessibility); Allocations and Designations Local Plan 2013 Policies 28, 40 and 43; Open
  Space SPD; NPPF Annex C and National Decision-Making Policy HC7
source-text: For development affecting open spaces (including Village Open Spaces and Urban Open Spaces),
  sport and recreation uses, application proposals should be accompanied by an assessment demonstrating
  that open space, buildings or land are surplus to requirements.
must-include:
- item: Evidence that the open space, buildings or land are surplus to requirements
  level: must
- item: Plans showing any such areas within or adjoining the site and how they are affected
  level: must
- item: Plans of proposed new open space, sport and recreation facilities, showing how amount, quality
    and accessibility meet adopted policy
  level: should
  required-if: discretionary
  source-text: Where appropriate, proposals for development should be accompanied by plans showing proposed
    new open space, sport and recreation facilities and information to show how the amount, quality and
    accessibility of that space meets the requirements of adopted policy.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 14-15. The list calls it an Open
  Space, Sports and Recreation Facilities Assessment. Matrix page 7: ''?'' for Major, Minor and Change
  of Use.'
