    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: NPPF Annex C and Decision-Making Policy DM1
source-text: A planning statement may be appropriate for major (10 or more dwellings or more than 1000
  square metres or sites 0.5 ha or more) applications.
must-include:
- item: The context and need for the proposed development
  level: must
- item: How the development accords with relevant national and local development plan policies
  level: must
- item: Any draft Heads of Terms for planning obligations (can be included here)
  level: should
  required-if: discretionary
  source-text: it would be beneficial if a draft Heads of Terms is submitted with the application. This
    can be included as part of the Planning Statement submitted with the application.
