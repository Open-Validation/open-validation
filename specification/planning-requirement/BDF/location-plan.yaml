reference: location-plan
local-authority: BDF
required-if:
  always: true
source-url: https://www.bedford.gov.uk/planning-and-building-control/planning-applications/make-planning-application/planning-forms-and-validation-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location plan – to scale and including North Point and at least two roads to identify the
  location.
must-include:
- item: To scale, with a north point
  level: must
- item: At least two roads, to identify the location
  level: must
- item: Application site outlined in red, including land needed for access to the edge of a public highway,
    visibility splays and any additional land for landscaping, car parking or open areas around buildings
  level: must
- item: Red line not drawn around an individual building only, nor showing access onto private tracks
    or drives
  level: must
  source-text: Red line site plans must include means of access to a public highway, they cannot be around
    a building on its own or show access onto private tracks or drives.
- item: Usually at 1:1250 or 1:2500
  level: should
  source-text: Plans should be drawn to a scale for example 1:50 or 1:100 for elevations and block plans,
    1:1250 or 1:2500 for a location plan
confidence: medium
notes: From the council's 'Planning forms and validation requirements' web page (checked 2026-11-06),
  which links the list (published 28 September 2026) and the matrix. Listed under 'National validation
  checklist'. The page says a location plan 'is not essential for a S73 application but is beneficial'.
review-status: unverified
field-status: {}
