reference: biodiversity-survey-report
local-authority: BDF
required-if:
  any:
  - condition:
      field: loss-of-habitat-features
      value: true
      description: The development may affect wildlife or biodiversity, for example removal of hedges,
        trees, ponds or landscaping.
  - condition:
      field: protected-species
      value: true
      description: Works such as demolition of older buildings or roof spaces, removal of trees, scrub
        or hedgerows, or alterations to water courses that may affect protected species.
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      description: Development that will affect an SSSI, County Wildlife Site or Local Nature Reserve.
  - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policy 42S (Protecting Biodiversity and Geodiversity); NPPF National
  Decision-Making Policies N2, N3 and N6
source-text: Where a proposed development may have possible impacts on wildlife, ecological interests
  and biodiversity (e.g. removal of hedges, trees, ponds or landscaping), information must be provided
  on existing ecological interests including habitats and wildlife corridors and possible impacts on them
  (both positive and negative) to allow full consideration of those impacts.
must-include:
- item: Existing ecological interests, including habitats and wildlife corridors
  level: must
- item: Possible impacts on them, both positive and negative
  level: must
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
  required-if: discretionary
  source-text: Where negative impact is likely and proposals are being made for mitigation and/or compensation
    measures, information to support those proposals will be needed.
- item: 'Two versions of any protected species report: a full report and a redacted version without sensitive
    details such as precise locations of species'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Reports related to protected species are submitted.
  source-text: Where reports related to protected species are being submitted two versions of the report
    are required for Validation purposes, one full report, and one redacted version is required removing
    any sensitive details such as precise locations of species or their habits or details which could
    lead to their predation, loss or destruction. Only the redacted version will be published online.
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: should
  required-if: discretionary
- item: 'For designated sites: assessment of impacts and proposals for long-term maintenance and management'
  level: should
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      description: Development affecting an SSSI, County Wildlife Site or Local Nature Reserve.
  source-text: Applications for development that will affect areas designated for their biodiversity interests
    should also include assessments of impacts and proposals for long term maintenance and
- item: Information on protected species, any potential impacts and mitigation
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: The works may affect protected species such as bats, wild birds, newts and voles.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 5-6. Matrix page 5 (''Ecology and
  Habitat Survey''): ''?'' for Major, Minor, CA/Listed Building Demolition and Renewable Energy. ''May
  have possible impacts'' is shown as discretionary next to the clear triggers. The list notes the impact
  ''may arise as a result of even small-scale householder development''.'
review-status: unverified
