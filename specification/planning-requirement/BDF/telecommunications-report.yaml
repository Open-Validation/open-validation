reference: telecommunications-report
local-authority: BDF
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications infrastructure proposals.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: NPPF Annex C and National Decision-Making Policy CO2
source-text: Annex C in the NPPF and National Decision-Making Policy CO2 require supporting information
  for telecommunications infrastructure proposals, including applications for prior approval under the
  General Permitted Development Order, as amended.
must-include:
- item: The outcome of pre-submission consultations, in particular with the relevant body
  level: must
- item: 'Where a new site is proposed: evidence the applicant has sought to keep the number of new sites
    to a minimum'
  level: must
- item: A statement self-certifying that cumulative exposure will not exceed International Commission
    guidelines on non-ionising radiation protection
  level: must
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 20. The list calls it a Telecommunications
  and Infrastructure Statement. Matrix page 10: ticked for Telecommunication.'
review-status: unverified
field-status: {}
