reference: daylight-sunlight-assessment
local-authority: BDF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - condition:
      field: adjoins-residential-property
      value: true
      description: The application site is adjacent to or adjoins another residential property.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policy 30 (Impact of development – design impact); NPPF National
  Decision-Making Policy P3; Supplementary Planning Guidance 'Residential Extensions, New Dwellings and
  Small Infill Developments' (January 2000)
source-text: A daylight/sunlight assessment is required for applications for residential and non-residential
  development other than householder applications, where the application site is adjacent to/adjoins another
  residential property.
must-include:
- item: Impacts on immediately adjoining properties illustrated in plan or elevation form, using the design
    codes in the council's Supplementary Planning Guidance 'Residential Extensions, New Dwellings and
    Small Infill Developments'
  level: should
  source-text: should illustrate in plan/elevation form, the impacts of the proposed development on immediately
    adjoining properties
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 4. Matrix page 4: ''?'' for Major,
  Minor and Renewable Energy. Householder applications are excluded from the assessment itself, but the
  list says all applications other than householder prior notifications should illustrate the impact on
  adjoining properties.'
review-status: unverified
field-status: {}
