reference: land-contamination-assessment
local-authority: BDF
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is already known, or a previous proposal identified contamination as
        an issue.
  - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 47S (Pollution, disturbance and contaminated land) and
  50S (Water resources); Sustainable Drainage SPD; NPPF Annex C and National Decision-Making Policies
  P2 and W4
source-text: This will be required for applications on or near land that may be contaminated due to an
  existing , previous or adjacent use. Where contamination is already known or where a previous proposal
  has 10 identified contamination as an issue, a report will be required for validation. For all other
  major or minor applications assessment may be identified as required during the course of an application
  after consultation with relevant statutory bodies and a report may then requested by the Case officer
  prior to determination of an application.
must-include:
- item: As a minimum a phase 1 survey establishing the extent and nature of contamination, any risks posed
    and to whom
  level: must
- item: Carried out by a suitably qualified assessor
  level: should
- item: Analysis of desk-based information such as historic data and mapping
  level: should
- item: Site walkover results and analysis
  level: should
- item: An initial risk assessment identifying possible risks and sources of contamination, vulnerable
    receptors, pollution issues and mitigation proposed
  level: should
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 10-11. Matrix page 6: ''?'' for Major,
  Minor, Change of Use and Renewable Energy. A report is needed for validation only where contamination
  is already known or was identified before; for other sites ''on or near land that may be contaminated''
  the case officer may ask for one later, so shown as discretionary. A phase 2 survey (including ground
  gas within 250 m of a former landfill) is needed before determination, not for validation.'
review-status: unverified
field-status: {}
