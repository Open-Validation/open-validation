reference: flood-risk-assessment
local-authority: BDF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - site:
      in:
      - flood-risk-zone
      description: All new development in Flood Zones 2 and 3, including householder, minor development
        and changes of use.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or greater in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or greater in Flood Zone 1.
  - site:
      in:
      - surface-water-flood-risk
      - groundwater-flood-risk
      description: A site of less than 1 hectare in Flood Zone 1 that could be affected by other sources
        of flooding, including surface water, groundwater or surface water drains.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 land identified by the Environment Agency as having critical drainage
        problems.
  - site:
      in:
      - future-flood-risk
      description: An area identified in a Strategic Flood Risk Assessment as being at increased risk
        of flooding in the future.
  - condition:
      field: near-watercourse
      value: true
      description: Development (including walls) within 8 m of the top of the bank of a main river or
        flood defence scheme, or that culverts or controls the flow of a river or stream.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 92 (Flood Risk) and 93 (Sustainable Drainage Systems);
  Sustainable Drainage SPD; NPPF National Decision-Making Policies F4, F5, F6, F7 and F8
source-text: 'A site-specific Flood Risk Assessment (FRA) appropriate to the scale, nature and location
  of development will be required for development proposals as follows: • All proposals for new development
  located in Flood Zones 2 and 3 as defined in Annex F of the NPPF and shown on the Environment Agency''s
  Flood Map for Planning including householder, minor development and changes of use. • Development on
  a site of 1 hectare or greater in Flood Zone 1. • Development on sites of less than 1 hectare in Flood
  Zone 1 where the application site could be affected by other sources of flooding including surface water
  flooding, ground water flooding, flooding from surface water drains and where indicated in Environment
  Agency’s Flood Map for Planning • Development in Flood Zone 1 and on land which has been identified
  by the Environment Agency as having critical drainage problems. • Development in areas identified in
  a Strategic Flood Risk Assessment as being at increased risk of flooding in the future. • Development
  that includes culverting or control of flow of any rivers or streams. • Development (including any walls)
  within 8m of the top of the bank of a main river or Flood defence Scheme.'
must-include:
- item: Identification and assessment of the risks of all forms of flooding to and from the development,
    and how they will be managed, taking climate change into account
  level: must
- item: Flood risks from other sources ranked using the flood zone risk bands (low, medium or high), with
    justification
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems, including SuDS where appropriate
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: Biodiversity net gain considered as part of any SuDS design
  level: should
- item: Prepared in consultation with the council, with reference to its local development documents and
    the Strategic Flood Risk Assessment
  level: should
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 7-8. Matrix page 6: ticked for Major,
  ''?'' for Householder, Minor, Change of Use and Renewable Energy. The sequential test is listed separately
  (see unmapped).'
review-status: unverified
field-status: {}
