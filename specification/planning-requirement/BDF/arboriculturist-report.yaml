reference: arboriculturist-report
local-authority: BDF
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: The proposal affects a tree covered by a tree preservation order.
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal affects trees.
source-url: https://edrms.bedford.gov.uk/OpenDocument.aspx?id=dpM1xA7oxodP7i2UzkcUBA%3d%3d&name=M.%20Approval%20of%20Reserved%20Matters%20Application%20checklist%20(23)%20new.pdf
source-text: 'In some instances, it maybe necessary for a tree report to be submitted in accordance with
  BS5837: 2012 Trees in relation to design, demolition and construction (eg. where a proposal affects
  trees in a conservation area or a tree covered by a tree preservation order).'
confidence: medium
notes: From the old per-form checklists. The audit (wrong_app_type) says the local list applies Trees
  to householders too, so no application type is given.
review-status: unverified
field-status: {}
