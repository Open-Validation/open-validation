reference: arboriculturist-report
local-authority: BDF
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: New development on a site containing trees, or where trees are near or overhang the site
      boundary.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policy 39 (Retention of Trees); NPPF National Decision-Making
  Policies DP3 and N2; BS5837:2012
source-text: 'Applications involving new development on sites containing trees, or where trees are situated
  near or overhang the site boundary, will be required to be accompanied by an arboricultural report incorporating
  the recommendations set out in BS5837:2012 “Trees in relation to design, demolition and construction:
  Recommendations.”'
must-include:
- item: Incorporates the recommendations of BS5837:2012
  level: must
- item: Survey information and plans prepared by an arboriculturist as defined in the Standard
  level: should
- item: An arboricultural method statement
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: Works to or affecting trees covered by a Tree Preservation Order or in a conservation
        area.
  source-text: Full arboricultural information will be required for works to or affecting any trees covered
    by a Tree Preservation Order or within a Conservation Area and must include an arboricultural method
    statement.
confidence: medium
