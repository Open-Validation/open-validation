reference: sci
local-authority: BDF
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbines.
    - any:
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height in excess of 15 metres.
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: NPPF Decision-Making Policy DM1; Bedford Borough Council Statement of Community Involvement 2025
source-text: For all major applications, including any large-scale change of use applications, applicants
  are required to undertake pre-application discussions with the local community as indicated in the adopted
  Statement of Community Involvement (2025) ... All applications for wind turbines in excess of 15 metres
  hub height or more than 2 turbines are required to undertake pre-application consultation in accordance
  with the Town and Country Planning (Development Procedure) Order 2015 (as amended).
must-include:
- item: How the views of the local community were sought and taken into account, including how the scheme
    was amended in response
  level: should
- item: If consultation was not carried out, the reasons why
  level: must
  source-text: If consultation is not carried out, the reasons why this has not taken place should be
    included within the application.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 17-18. The list calls it a Statement
  of Community Involvement/Statement of Engagement; it can be part of the Planning Statement. Matrix page
  9: ticked for Major, ''?'' for Renewable Energy. Larger or sensitive schemes are recommended (not required)
  to do the same.'
review-status: unverified
field-status: {}
