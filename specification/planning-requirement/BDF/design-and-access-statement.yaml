reference: design-and-access-statement
local-authority: BDF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Any building over 100 square metres.
  - application-type:
      in:
      - lbc
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This is a National Requirement and must be submitted for the following application types
  • Outline or Full planning applications for MAJOR development • Applications in a Conservation area
  for 1 or more dwellings or any building over 100 square metres • Applications for Listed Building Consent
  and include reference to heritage matters • Design and Access Statements are NOT required for Changes
  of Use, Engineering operations, Removal or variation of Conditions, Mineral and Waste proposals.
must-include:
- item: 'For listed building consent: reference to heritage matters'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Amount, layout, scale, landscaping, access and appearance of the development
  level: should
  source-text: Typically, it will include details of the amount (e.g. number of units or floor space),
    layout (e.g. details of the buildings and spaces), scale (e.g. details of height, width and depth),
    landscaping (e.g. details of existing and proposed planting), access (e.g. pedestrian, vehicular)
    and appearance of the development (e.g. details of the architectural style, materials, decoration,
    lighting, colour and texture).
- item: Justification of the proposal and the impact on the character and appearance of the conservation
    area
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 5. Matrix page 5: ticked for Major,
  ''?'' for Minor and Listed Building Works. The list says a DAS is not required for changes of use, engineering
  operations, removal or variation of conditions or mineral and waste proposals. The Emergency Services
  Statement can be a clearly identifiable section of the DAS (see unmapped).'
