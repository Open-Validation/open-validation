reference: heritage-statement
local-authority: BDF
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      - park-and-garden
      - listed-building
      - listed-building-setting
      - historic-environment-record
      description: Within or affecting the setting of a conservation area or registered historic park
        or garden, or affecting a listed building or known archaeological site.
  - discretionary
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policy 41S (Historic environment and heritage assets); NPPF National
  Decision-Making Policy HE5; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: It is required with any application within or affecting the setting of designated conservation
  areas, registered historic parks or gardens, or affecting known 8 archaeological sites, listed buildings
  and also with applications for Listed Building Consent or Conservation Area Consent). These can also
  be required where there is potential to affect any of these assets.
must-include:
- item: A comprehensive but proportionate explanation of the works, including materials, historic context
    and areas affected, with photographs where helpful
  level: must
- item: An analysis of the significance of any heritage assets affected, designated or non-designated,
    including any contribution made by their setting
  level: must
- item: An assessment of the impact of the proposals on the significance of all affected heritage assets,
    using the NPPF assessment of 'harm'
  level: must
- item: How the proposals have been designed to minimise or mitigate impacts on heritage assets
  level: must
- item: Relevant findings of any archaeological desk-top assessment or trench evaluation, for ground disturbance
    in an area of known archaeological potential or for major or infrastructure proposals
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: ground-disturbance
        value: true
        description: Ground disturbance within an area of known archaeological potential.
  source-text: For applications involving disturbance to ground within an area of known archaeological
    potential or where there is a major development proposal or infrastructure proposal the applicant
    is advised to seek guidance on the need for an archaeological desk-top assessment or trench evaluation
    prior to submission of the heritage statement which should then include the relevant findings of these
    studies
- item: Reference to any local or National Historic Environment List entries
  level: should
- item: 'For advertisements in a conservation area: how the ''Shopfronts and Advertisements in Conservation
    Areas'' SPD (November 2005) has been taken into account, particularly materials and illumination'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - conservation-area
        description: In a conservation area.
  source-text: If your application involves the display of advertisements in a conservation area, the
    Heritage statement should also provide details of how the guidance in the adopted Supplementary Planning
    Document ‘Shopfronts and Advertisements in Conservation Areas’ (November 2005) has been taken into
    account in the proposal particularly in relation to use of appropriate materials and levels of illumination.
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 8-9. The list calls it a Heritage
  Impact Assessment. Matrix page 6: ticked for Listed Building Works and CA/Listed Building Demolition,
  ''?'' for Householder, Major, Minor, Change of Use and Renewable Energy. ''Can also be required where
  there is potential to affect'' these assets is shown as discretionary. A structural survey may be required
  with listed building consent (see unmapped).'
review-status: unverified
field-status: {}
