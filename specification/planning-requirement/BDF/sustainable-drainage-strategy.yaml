reference: sustainable-drainage-strategy
local-authority: BDF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - ref: major-development
    - condition:
        field: drainage-alterations
        value: true
        description: New major development that involves new drainage proposals.
  - condition:
      field: non-mains-drainage
      value: true
      description: The development will not connect to the public sewer.
source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
policy: Bedford Borough Local Plan 2030 Policies 50S (water resources) and 51S (climate change strategic
  approach); Sustainable Drainage SPD; NPPF National Decision-Making Policies CC3, W4 and F8
source-text: All full or reserved matters applications for new major development which involves new drainage
  proposals, will be required to provide full details of the proposed surface and foul drainage in accordance
  with the Council’s Sustainable Drainage System (SuDS) SPD For development not intending to connect to
  the public sewage system you will need to demonstrate that non mains sewerage systems are acceptable
  for your development
must-include:
- item: Full details of the proposed surface and foul drainage, in line with the council's SuDS SPD
  level: must
  required-if:
    ref: major-development
- item: 'For non-mains drainage: evidence that the non-mains system is acceptable, using the Environment
    Agency''s forms'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Not connecting to the public sewer.
- item: 'Current surface water drainage: discharge routes, flow rates, volumes and amenity or ecology
    benefits'
  level: must
- item: 'How surface water from the development will be discharged: volumes, flow rates and any attenuation'
  level: must
- item: Any SuDS proposed, with ongoing maintenance, how flood risk will not increase and how pollution
    will be avoided
  level: must
- item: Biodiversity net gain benefits of the SuDS
  level: must
- item: Why SuDS are not appropriate, where relevant
  level: must
confidence: medium
notes: 'From the council''s list (published 28 September 2026), page 19. The list calls it Surface and
  Foul Water Drainage Disposal Methods. Matrix page 10: ticked for Major, ''?'' for Renewable Energy.
  Mapped to the retired MHCLG id sustainable-drainage-strategy.'
review-status: unverified
field-status: {}
