reference: affordable-housing-statement
local-authority: WIL
required-if:
  any:
  - all:
    - site:
        in:
        - designated-rural-area
        description: The site is in a Designated Rural Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 6
        description: A net increase of 6-9 dwellings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A site of 0.5 hectares or more.
source-url: https://www.wiltshire.gov.uk/media/17833/Local-Validation-Checklist-from-1-Sept-2025/pdf/Local_Validation_Checklist_1_Sept_2025.pdf?m=1755190377417
source-text: 'Affordable Housing Statement/Details When required: Applications for residential developments
  in the Designated Rural Areas (as defined in the NPPF) that provide a net increase of 6-9 dwellings
  and developments of 10 or more dwellings or sites with an area of 0.5 hectares or more.'
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Also listed for outline,
  and for reserved matters where the outline requires it (audit issues 1 and 2).
review-status: unverified
field-status: {}
