reference: water-impact-assessment
local-authority: WIL
required-if:
  all:
  - site:
      in:
      - nutrient-neutrality-area
      description: The site is in the Hampshire Avon, River Test, River Lambourn or Somerset Levels and
        Moors catchment.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal increases overnight accommodation.
source-url: https://www.wiltshire.gov.uk/media/17833/Local-Validation-Checklist-from-1-Sept-2025/pdf/Local_Validation_Checklist_1_Sept_2025.pdf?m=1755190377417
source-text: All applications proposing an increase in overnight accommodation falling within one of the
  following catchment areas - the Hampshire Avon, River Test and the River Lambourn and the Somerset Levels
  and Moors.
must-include:
- item: A completed Nutrient Neutrality Calculator specific to the catchment area the proposal falls within
  level: must
confidence: medium
notes: 'Audit (missing_requirement): Phosphorus and Nitrogen Mitigation, captured only as tab text. Listed
  for full and outline.'
review-status: unverified
field-status: {}
