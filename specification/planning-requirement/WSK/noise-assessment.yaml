reference: noise-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - s73
      - cho-commercial-to-dwh
      - cho-comm-to-school
      - cho-agri-to-school
      - cho-agri-to-flexcom
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: New development which may involve a noise generating activity.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Development for a sensitive use (such as new dwellings) close to an existing noise
          generating activity.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all new development which may involve a noise generating activity to
  surrounding areas, particularly where proposed close to existing sites that may be particularly harmed
  by such development (such as air bases, industrial estates, trunk roads) and for any development for
  sensitive use (such as new dwellings) situated close to an existing noise generating activity.
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC022.
  The list calls it 'Noise impact assessment or acoustic report' and advises contacting the Public Health
  and Housing Team about its scope. The council also lists it for 'Prior Notification - Storage and Distribution
  to Residential'; 'Prior Notification - Various Uses to Restaurants and Cafes'; 'Prior Notification -
  Retail to Assembly and Leisure', which have no application-type id here.
review-status: unverified
field-status: {}
