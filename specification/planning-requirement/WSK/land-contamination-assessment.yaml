reference: land-contamination-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - cho-commercial-to-dwh
      - cho-agri-to-dwh
      - cho-comm-to-school
      - cho-agri-to-school
      - cho-agri-to-flexcom
      - cho-amusements-to-dwh
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: A sensitive end use, for example new dwellings, schools, playgrounds, playing fields,
          nurseries, hospitals or allotments.
    - site:
        in:
        - contaminated-land
        description: Land likely to be contaminated as a result of previous or historic uses.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all applications resulting in a sensitive end use (for example, new
  dwellings, schools, playgrounds, playing fields, nurseries, hospitals, allotments) and all applications
  that involve development on land that is likely to be contaminated as a result of previous or historic
  uses. For applications of one or two dwellings on existing residential or greenfield sites an Environmental
  Search Report and West Suffolk Land Contamination Questionnaire are required. Where the proposal is
  for more than two dwellings, is on a brownfield site or involves the conversion of an agricultural barn
  then a Phase 1 Land Contamination Report is required.
must-include:
- item: An Environmental Search Report and the West Suffolk Land Contamination Questionnaire
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: <=
      value: 2
      description: One or two dwellings on an existing residential or greenfield site.
- item: A Phase 1 Land Contamination Report
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 2
        description: More than two dwellings.
    - condition:
        field: previously-developed-land
        value: true
        description: The site is brownfield.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: The conversion of an agricultural barn.
- item: 'Phase 1 report: a detailed search of all available and current records and maps identifying potential
    on-site and off-site sources, pathways and receptors of contamination'
  level: should
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 2
        description: More than two dwellings.
    - condition:
        field: previously-developed-land
        value: true
        description: The site is brownfield.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: The conversion of an agricultural barn.
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC019.
  An assessment is 'typically valid for up to two years'. Further intrusive investigation may be required
  during the application or by condition. The council also lists it for 'Prior Notification - Storage
  and Distribution to Residential', which have no application-type id here.
review-status: unverified
field-status: {}
