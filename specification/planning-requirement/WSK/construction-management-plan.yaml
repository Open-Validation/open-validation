reference: construction-management-plan
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - pa-demo-building
  - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf22.cfm
source-text: This is not an essential requirement at validation stage but can be helpful when submitted
  with applications that involve demolition.
must-include:
- item: A noise management plan including monitoring of demolition noise
  level: should
- item: A scheme to control dust from demolition works
  level: should
- item: Chassis and wheel cleaning for demolition vehicles, with contingency measures, and cleaning of
    affected public highways
  level: should
- item: Working hours for demolition works
  level: should
- item: Demolition access from the highway, room on site to load and unload clear of the highway, and
    any haul routes across the site
  level: should
- item: Parking of contractors' vehicles
  level: should
- item: Access and deliveries, including hours
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Prior Notification - Proposed Demolition',
  item DC043. The list calls it 'Demolition and construction management plan'. Shown as discretionary
  because the list says it is 'not an essential requirement at validation stage'.
review-status: unverified
field-status: {}
