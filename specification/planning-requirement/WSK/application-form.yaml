policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A completed form is always required (one copy of all application documents must be supplied
  if submitted by post).
must-include:
- item: Every section of the form completed; where sections or questions are not relevant, this is stated
    on the form
  level: should
  source-text: Please ensure that you have completed every section of the application form before submitting.
    Where sections or questions are not relevant please state this on the form.
- item: 'For a larger home extension: a written description including the depth (in metres) of the extension
    from the rear wall of the original dwelling, and its height at the eaves and the ridge'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
  source-text: a written description of the development including the depth (in metres) of the extension
    from the rear wall of the original dwelling (original meaning as the building was first built or,
    if built prior to 1 July 1948, as it stood on that date) the height (in metres) of the proposed development
    at the eaves and the ridge
- item: 'For a larger home extension: the addresses of all neighbouring properties (including those at
    the rear)'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
  source-text: addresses of all neighbouring properties (including those at the rear)
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC001.
  The same wording is on every application type page that lists it; the larger home extension items are
  from that page's introduction ('A valid application needs to consist of the following'). The council
  also lists it for 'Prior Notification - Storage and Distribution to Residential'; 'Prior Notification
  - Various Uses to Restaurants and Cafes'; 'Prior Notification - Retail to Assembly and Leisure'; 'Prior
  Notification - Toll facilities'; 'Prior Notification - Electrical Works'; 'Prior Notification - Temporary
  Change of Use', which have no application-type id here.
