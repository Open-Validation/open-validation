reference: daylight-sunlight-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
  - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all applications where the development is likely to have an adverse
  impact on the current levels of daylight/sunlight enjoyed by adjacent properties or buildings, including
  associated gardens and amenity space.
must-include:
- item: 'Enough information to assess the impact on adjacent properties or buildings: sunlight availability
    to windows and to open spaces and gardens'
  level: should
- item: Shadow paths shown on a block plan (to an appropriate scale) showing the adjacent properties in
    relation to the proposed development
  level: should
confidence: medium
notes: 'From the council''s list (adopted 20 June 2016), web page ''Full Planning Application'', item
  DC008. Shown as discretionary: the trigger is a judgement (''likely to have an adverse impact''), with
  no threshold.'
review-status: unverified
field-status: {}
