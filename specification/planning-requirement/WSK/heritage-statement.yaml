reference: heritage-statement
local-authority: WSK
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: Works in the curtilage of a listed building or in a conservation area.
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: 'All applications where the development is likely to have an impact on designated or non-designated
  heritage assets (identified at pre-application stage) will require a heritage statement. For Householder
  applications this will be required for: works in the curtilage of a listed building works in a conservation
  area'
must-include:
- item: A description of the significance of any heritage assets affected, including any contribution
    made by their setting
  level: should
- item: The relevant historic environment record consulted
  level: should
- item: An assessment of the affected heritage asset(s), using appropriate expertise where necessary
  level: should
- item: An assessment of the impact of the proposal on the significance of the heritage asset and any
    reasoned justification for the proposal
  level: should
- item: A desk-based archaeological assessment (and where necessary an appropriate level of field evaluation)
  level: should
  required-if:
    condition:
      field: ground-disturbance
      value: true
      description: New building or ground disturbance on or adjoining a heritage asset of archaeological
        interest, or a site with potential to include such assets.
- item: Not just a copy of the listing held by English Heritage (now Historic England)
  level: must
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC013.
  The list calls it 'Heritage statement or Heritage impact assessment'. For full and outline applications
  the trigger ('likely to have an impact on designated or non-designated heritage assets (identified at
  pre-application stage)') is a judgement, so it is shown as discretionary; it is shown as always needed
  for listed building consent, whose page lists it. Statements 'should be proportionate to the proposed
  development'.
review-status: unverified
field-status: {}
