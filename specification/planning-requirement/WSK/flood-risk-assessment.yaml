reference: flood-risk-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - cho-commercial-to-dwh
      - cho-agri-to-dwh
      - cho-comm-to-school
      - cho-agri-to-school
      - cho-agri-to-flexcom
      - cho-amusements-to-dwh
      - pa-tmp-use-comm-film
  - any:
    - site:
        in:
        - flood-risk-zone
        - critical-drainage-area
        description: The site is in Flood Zone 2 or 3, or in an area of critical drainage in Flood Zone
          1.
    - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: Follow the Environment Agency's Flood Risk Standing Advice which will help you determine
  when an FRA needs to be submitted. ... where the site is within Flood Zones 2 or 3, or an area of Critical
  Drainage in Flood Zone 1, a site specific flood risk assessment
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC011.
  The item itself only tells applicants to check the flood zone and follow the Environment Agency's standing
  advice, so the rest is shown as discretionary; the flood-zone wording is from the introduction to the
  'Prior Notification - Agricultural Building to Residential' page. Applicants are 'strongly advised'
  to agree the scope with the Environment Agency. The council also lists it for 'Prior Notification -
  Storage and Distribution to Residential', which have no application-type id here.
review-status: unverified
field-status: {}
