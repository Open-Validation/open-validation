reference: air-quality-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Within an air quality management area.
    - condition:
        field: direct-air-emissions
        value: true
        description: Proposed potential harmful emissions to air.
    - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required where development proposals could impact upon local air quality, are located
  within or close to air quality management areas (AQMA's) or where there are proposed potential harmful
  emissions to air.
must-include:
- item: The potential change in air quality resulting from the development
  level: should
- item: Mitigation measures as necessary
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC023.
  'Could impact upon local air quality' and 'close to' an air quality management area are shown as discretionary;
  the list refers to the EPUK/IAQM guidance (2015) for when one is needed. The council also lists it for
  'Prior Notification - Storage and Distribution to Residential', which have no application-type id here.
review-status: unverified
field-status: {}
