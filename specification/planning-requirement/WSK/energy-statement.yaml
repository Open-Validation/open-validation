reference: energy-statement
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development, including re-use or conversion of buildings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Non-residential development over 1000 sq m.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
policy: Joint Development Management Policies Document policy DM7
source-text: Proposals for new residential development (including re-use or conversion of buildings) and
  non-residential development over 1000 square metres should submit an energy statement that details how
  it is proposed the site will meet the energy standards set out within national building regulations.
  In particular, any areas in which the proposed energy strategy might conflict with other policies in
  the local plan should be identified and proposals for resolving this conflict outlined.
must-include:
- item: How the site will meet the energy standards set out in national building regulations
  level: must
- item: Any areas where the energy strategy might conflict with other local plan policies, and proposals
    for resolving the conflict
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC014.
  It may be part of the design and access statement or planning statement.
review-status: unverified
field-status: {}
