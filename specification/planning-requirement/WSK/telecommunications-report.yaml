reference: telecommunications-report
local-authority: WSK
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf20.cfm
source-text: This is always required and consists of evidence (usually in the form of a drawing) showing
  the required area of search should be provided including existing and proposed coverage diagrams. Details
  of alternative sites rejected within this area should also be provided and justification for rejecting
  them; this should include existing masts, structures and other buildings within the search area. Where
  no alternative sites have been considered please provide an explanation as to why this has not been
  the case.
must-include:
- item: The required area of search (usually a drawing), including existing and proposed coverage diagrams
  level: must
- item: Alternative sites rejected within the area of search, including existing masts, structures and
    other buildings, with justification for rejecting them, or an explanation of why none were considered
  level: must
- item: 'Consultation details as required by legislation: a map of the area where addresses were sent
    letters, date-stamped photographs of site notices with a map of their position, copies of any newspaper
    adverts (paper and dates) and the addresses letters were sent to'
  level: should
  source-text: 'Details of the consultation process carried out in relation to the application as required
    by any relevant legislation. This should include: a map of the area in which any addresses were sent
    letters relating to the application date stamped photographs of any site notices posted and a map
    indicating the position copies of any adverts placed in any newspapers including the name of the paper
    and the date(s) the advert was published addresses of properties any letters were sent to.'
- item: The Supplementary Information Template from the Code of Best Practice on Mobile Phone Network
    Development (2013)
  level: should
  source-text: This is not an essential requirement. Supplementary Information Template
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Prior Notification - Telecommunications
  Development', item DC040. Combines items DC040 'Area of search', DC041 'Consultation evidence' and DC042
  'Telecoms best practice' (which the list says is 'not an essential requirement').
