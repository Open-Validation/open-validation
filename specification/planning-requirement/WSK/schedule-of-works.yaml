reference: schedule-of-works
local-authority: WSK
required-if:
  any:
  - application-type:
      in:
      - notice-trees-in-con-area
      - consent-under-tpo
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: works-to-fabric
        description: Works (including repairs) to the fabric of the listed building itself, not new additions.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf32.cfm
source-text: All applications for tree works should be accompanied by a schedule of works that details
  the works to be undertaken (it may be included within the application form where works are only to a
  small number of trees). ... This is required for applications for Listed Building Consent for works
  (including repairs) to the fabric of a listed building itself (that is, not new additions).
must-include:
- item: 'Tree works: the works to be undertaken, which may include the status of the tree and the reason
    for the work (with photographs where appropriate), annotated photographs for work to specific limbs
    and the level of work (such as crown raise to three metres)'
  level: should
  required-if:
    application-type:
      in:
      - notice-trees-in-con-area
      - consent-under-tpo
- item: 'Tree works: all details in metric; imperial measurements are not accepted'
  level: must
  required-if:
    application-type:
      in:
      - notice-trees-in-con-area
      - consent-under-tpo
- item: 'Listed building works: a detailed description of the works including their extent, a specification
    of materials, the method of carrying out the works and the order in which they will be done'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Works to Trees Protected by a Tree Preservation
  Order', item DC035. The same tree wording is on the 'Trees in a Conservation Area Notification' page;
  the listed building wording is item DC035l on the 'Listed Building Consent' page, which says it could
  be included in a heritage statement. For tree works it may be included in the application form where
  only a few trees are involved.
review-status: unverified
field-status: {}
