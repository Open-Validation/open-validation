reference: planning-statement
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - ldc-existing-use
      - ldc-prospective-use
      - s73
      - non-material-amendment
      - mod-discharge-s106
  - any:
    - ref: major-development
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Development that does not accord with the development plan.
    - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all applications where the context and justification for a proposed
  development needs to be demonstrated, and in particular all applications for major development, change
  of use and developments that do not accord with the development plan.
must-include:
- item: How the proposal has taken account of national and local planning policy
  level: should
- item: The context for the development and why the site has been chosen
  level: should
- item: The intensity and type of use and who the users would be
  level: should
- item: Any consultation with the local authority, statutory consultees or wider public and the feedback
    (where not in a separate statement of community involvement)
  level: should
- item: 'Sports facilities and playing fields: reasoned justification for development affecting them;
    the area lost and any replacement; any assessment showing the open space, sport and recreation facilities
    are surplus to requirements'
  level: should
  required-if:
    any:
    - condition:
        field: affects-playing-field
        value: true
        description: The proposal affects or creates sports facilities or playing fields, or generates
          a substantial need for them.
    - discretionary
- item: 'Sports facilities and playing fields: quality, accessibility, management and maintenance of proposed
    and (where there is a loss) existing facilities; existing and proposed changing/toilet facilities;
    technical details including surfacing, fencing and floodlighting; sports to be played and the level'
  level: should
  required-if:
    any:
    - condition:
        field: affects-playing-field
        value: true
        description: The proposal affects or creates sports facilities or playing fields, or generates
          a substantial need for them.
    - discretionary
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC030.
  Beyond major development, change of use and departures, the trigger ('where the context and justification
  ... needs to be demonstrated') is a judgement, so it is shown as discretionary.
review-status: unverified
field-status: {}
