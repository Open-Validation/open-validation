reference: town-centre-impact-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - cho-commercial-to-dwh
  - any:
    - all:
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 1000
          description: Retail floorspace created.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside Bury St Edmunds, Haverhill and Newmarket town centres.
    - all:
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 300
          description: Retail floorspace created.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside other defined centres.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the adopted development plan.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 2500
          description: Leisure or office floorspace created.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside Bury St Edmunds, Haverhill and Newmarket town centres or other defined
            centres.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with an up to date local plan.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
policy: National Planning Policy Framework (March 2012) paragraph 26
source-text: 'This is required for developments for: the creation of retail floor space greater than 1000
  square metres outside Bury St Edmunds, Haverhill and Newmarket town centres that exceed 300 square metres
  outside other defined centres, where such developments are not in accordance with the currently adopted
  development plan proposals for leisure and office developments outside of town centres will require
  a Leisure Impact assessment if the floor space created is greater than 2500 square metres and the proposal
  is not in accordance with an up to date local plan.'
must-include:
- item: A sequential test considering whether sequentially preferable sites exist, assessed for availability,
    suitability and viability
  level: should
- item: The impact on existing, committed and planned public and private investment in a centre or centres
    in the catchment area
  level: must
- item: The impact on town centre vitality and viability, including local consumer choice and trade in
    the town centre and wider area, up to five years from the application (up to ten years for major schemes
    whose full impact will not be realised in five years)
  level: must
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC020.
  The list calls it 'Retail/leisure impact assessment'. Its page for 'Prior Notification - Retail to Residential'
  also lists it, shown here under the commercial-to-dwellings prior approval type. The council also lists
  it for 'Prior Notification - Various Uses to Restaurants and Cafes'; 'Prior Notification - Retail to
  Assembly and Leisure', which have no application-type id here.
review-status: unverified
field-status: {}
