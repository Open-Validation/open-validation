reference: landscaping-plan
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - condition:
      field: landscaping-works
      value: true
      description: Landscaping is to be undertaken.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all applications for development where landscaping is to be undertaken.
must-include:
- item: Proposed planting of trees and shrubs
  level: should
- item: Existing trees and vegetation to be retained
  level: should
- item: Surface materials for hard landscaping
  level: should
- item: Any excavation or changes in ground level
  level: should
- item: The timescale for implementation
  level: should
- item: Proposals for long-term maintenance and landscape management
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC024.
  The list calls it 'Landscaping details'.
review-status: unverified
field-status: {}
