reference: sustainable-drainage-strategy
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - ref: major-development
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: The Sustainable Drainage Systems (SuDs) Proforma is required for all applications for major
  development (defined as development of ten or more dwellings (or 0.5 hectares for residential development
  where the number of dwellings is unknown) for the creation of more than a 1000 square metres of floor
  space and where the site is greater than one hectare).
must-include:
- item: Suffolk County Council SW Drainage Proforma completed
  level: must
- item: SuDS measures shown on all relevant plans, showing how they integrate with planned public open
    spaces, landscaping, roads, trees and buildings
  level: must
- item: Plans identifying multifunctional SuDS (for example those which enhance biodiversity or improve
    water quality)
  level: should
- item: Details including soakage test results and calculations, drainage design layout and calculations,
    protection of SuDS and watercourses during construction, and adoption and maintenance
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC016.
  The list calls it 'Sustainable drainage strategy'.
review-status: unverified
field-status: {}
