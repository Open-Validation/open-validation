reference: transport-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all developments that are likely to generate significant (please see
  below) amounts of pedestrian and vehicular movement.
must-include:
- item: All existing and proposed commercial and residential vehicular and pedestrian movements to and
    from the site
  level: should
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles
  level: should
- item: Existing transport conditions, how the development would affect them and measures proposed to
    overcome any problems
  level: should
- item: 'For larger scale proposals: accessibility to the site by all modes of transport and the likely
    split of journeys across them'
  level: should
- item: Proposed measures to improve access by public transport, walking and cycling, reduce the need
    for parking and mitigate transport impacts
  level: should
confidence: medium
notes: 'From the council''s list (adopted 20 June 2016), web page ''Full Planning Application'', item
  DC021. The list calls it ''Transport statement or assessment''. Shown as discretionary: ''significant''
  is not defined in the list, which points to Appendix B of the Department for Transport''s Guidance on
  Transport Assessment for indicative thresholds.'
review-status: unverified
field-status: {}
