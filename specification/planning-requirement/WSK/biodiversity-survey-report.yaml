source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all applications where the proposed development is likely to have an
  impact on Biodiversity. The local authority has adopted a Biodiversity checklist in order to identify
  whether surveys will be required for a proposal. The checklist must be filled out and submitted with
  all applications. A project level Habitat Regulations Assessment (HRA) may be required where a development
  is within the Breckland SAC, Breckland SPA or an adjoining constraint zone (constrain zones are defined
  in the relevant Core Strategy Policy CS2). Where a scoping survey recommends further surveys need to
  be undertaken, these should also be provided.
must-include:
- item: Surveys up to date (normally not more than two years old, or as stipulated in good practice guidance)
  level: must
- item: Any further surveys that a scoping survey recommends
  level: should
confidence: medium
notes: 'From the council''s list (adopted 20 June 2016), web page ''Full Planning Application'', item
  DC009. Shown as discretionary: the trigger is ''likely to have an impact on Biodiversity'', decided
  with the council''s Biodiversity checklist. The checklist itself, which ''must be filled out and submitted
  with all applications'', and the project-level Habitat Regulations Assessment that ''may be required''
  within the Breckland SAC/SPA or a constraint zone (Core Strategy Policy CS2) have no id here and are
  listed as unmapped. This 2016 list predates mandatory biodiversity net gain and names no BNG documents.
  The council also lists it for ''Prior Notification - Storage and Distribution to Residential''; ''Prior
  Notification - Various Uses to Restaurants and Cafes''; ''Prior Notification - Retail to Assembly and
  Leisure''; ''Prior Notification - Toll facilities'', which have no application-type id here.'
