policy: Town and Country Planning (Environmental Impact Assessment) (Amendment) Regulations 2015
source-text: Usually this will only apply to major projects such as motorways, wind farms and large developments.
  However, this is not always the case and some smaller developments, if located in a sensitive area,
  may require an EIA.
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC015.
  The list calls it 'Environmental impact assessment (EIA)' and advises asking the council about screening
  and scoping at pre-application stage. It cites the 2015 amendment regulations; the 2017 EIA Regulations
  now apply.
