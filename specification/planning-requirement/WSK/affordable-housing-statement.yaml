reference: affordable-housing-statement
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: affordable-housing-proposed
        value: true
        description: The proposal includes affordable housing.
    - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
policy: Forest Heath Core Strategy; St Edmundsbury Core Strategy
source-text: This is required for all proposals that include, or would normally be required to include,
  affordable housing. You find details as to when affordable housing would be sought in the core strategies
  (see links below).
must-include:
- item: The number, mix of tenure and size of the affordable housing units (taking into account local
    housing needs identified by an up to date Strategic Housing Market Assessment)
  level: should
- item: Evidence that the proposal would meet a proven need as shown in a local housing needs assessment
  level: should
  required-if:
    site:
      in:
      - rural-area
      description: The proposal is in the countryside.
- item: Evidence that the affordable housing will be made available to people in local housing need at
    an affordable cost for the life of the property
  level: should
  required-if:
    site:
      in:
      - rural-area
      description: The proposal is in the countryside.
confidence: medium
notes: 'From the council''s list (adopted 20 June 2016), web page ''Full Planning Application'', item
  DC010. The ''would normally be required'' part is shown as discretionary: the list points to the core
  strategies for when affordable housing is sought and gives no threshold.'
review-status: unverified
field-status: {}
