reference: viability-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - mod-discharge-s106
  - any:
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The application cites viability as a factor in the heads of terms.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Less affordable housing than would otherwise normally be required.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: Where the application cites viability as a factor in the heads of terms a viability assessment
  is required, particularly for applications involving less affordable housing than would otherwise normally
  required.
must-include:
- item: A full un-redacted viability assessment at the time of submission
  level: must
- item: 'A residual evaluation with: existing use value supported by an independent valuation; land acquisition
    price and basis; salient terms and process of purchase; purchase costs including legal and agents''
    fees'
  level: must
- item: Estimated sales values with independent supporting evidence, including a schedule of unit sizes
  level: must
- item: Estimated construction costs supported by tender costs or a QS schedule (with a specified contingency,
    contract related fees and itemised 'abnormals'); itemised preliminary costs; professional fees under
    each heading
  level: must
- item: S106/CIL costs as advised by the council; phasing assumptions; financing rate and evidence of
    financing terms; estimated profit with context on the developer's target returns
  level: must
- item: Value/cost of the affordable housing provision, where relevant, with tenure assumption and any
    commuted sum calculation
  level: must
- item: An executive summary that will be made publicly available
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC031.
  Standard viability models are acceptable if they give all this information with a cash flow analysis.
review-status: unverified
field-status: {}
