reference: design-and-access-statement
local-authority: WSK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - s73
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - s73
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The floor area created is 100 sq m or more, measured externally.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The floor space created is 100 sq m or more, measured externally.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: The application involves works to a listed building.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required for major development (that is development of 10 or more dwelllings (or 0.5
  hectares for residential development where the number of dwellings is unknown) for the creation of more
  than a 1000 square metres of floor space and where the site is greater than 1 hectare), and alterations
  to a listed building. If the site is within a conservation area a design and access statement will also
  be required for proposals involving the creation of one or more dwellings or a building or buildings
  where the floor area created by the development is 100 square metres or more measured externally, including
  householder developments if applicable. ... For Householder applications this will be required if the
  site is within a conservation area and proposals involve the creation of floor space of 100 square metres
  or more measured externally and for applications involving works to Listed Buildings.
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC007.
  The householder wording is item DC007h on the 'Householder Planning Application' page. The list's major-development
  definition (10 or more dwellings, or 0.5 ha where the number is unknown; more than 1000 sq m; site over
  1 ha) matches the national one. The listed building part is shown for listed building consent ('alterations
  to a listed building'). The list's contents for the statement repeat the national ones, so they are
  not repeated here.
