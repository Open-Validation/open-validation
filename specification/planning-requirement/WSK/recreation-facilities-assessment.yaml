reference: recreation-facilities-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: New residential development of five or more dwellings.
    - site:
        in:
        - open-space
        description: Development on open space, in public or private ownership.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
policy: Joint Development Management Policies Document policy DM42; Forest Heath and St Edmundsbury open
  space supplementary planning documents
source-text: 'This is required for all applications for: new residential development of five or more dwellings
  which is likely to generate demand for access to and use of open space and recreation facilities and
  development on open space in Forest Heath and St Edmundsbury, whether it is in public or private ownership.'
must-include:
- item: Details of the open space to be provided in relation to the number and type of dwellings, with
    reference to the council's open space supplementary planning document
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: New residential development of five or more dwellings.
- item: Evidence that the land or buildings are no longer required for that purpose, are not economically
    viable and there is no local demand for them in their current use
  level: should
  required-if:
    site:
      in:
      - open-space
      description: Development on open space.
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC027.
  The list calls it 'Open space assessment'. The five-dwelling part applies to development 'likely to
  generate demand for access to and use of open space and recreation facilities'.
review-status: unverified
field-status: {}
