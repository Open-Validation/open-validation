policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan is always required and must be an up-to-date Ordnance Survey based location
  plan at an appropriate scale, usually 1:1250 or 1:2500. In the case of large sites other scales may
  be appropriate.
must-include:
- item: Up-to-date Ordnance Survey based plan at an appropriate scale, usually 1:1250 or 1:2500
  level: must
- item: At least two named roads and all surrounding buildings or land (unless this would need a plan
    greater than a scale of 1:2500)
  level: must
- item: The application site (the whole planning unit) edged clearly with a red line, including all land
    needed to carry out the development (for example access from a public highway, visibility splays,
    landscaping, car parking and open areas around the building)
  level: must
- item: A north point
  level: must
- item: The scale clearly identified
  level: must
- item: Not a Land Registry document; shows the OS Crown copyright acknowledgement and the correct licence
    number
  level: should
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
- item: 'For agricultural buildings to residential (Class Q): the land the application relates to in red,
    the curtilage of the proposed property in green and adjoining land owned by the applicant in blue'
  level: must
  required-if:
    application-type:
      in:
      - cho-agri-to-dwh
  source-text: A plan of the site indicating the land to which the application relates in red, the curtilage
    of the proposed property in green and any adjoining land under the ownership of the applicant in blue.
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC003.
  For 'Prior Notification - Agricultural Building to Residential' the list asks instead for 'P3Q location
  plans' (item DC045), shown here as the green-curtilage item. The council also lists it for 'Prior Notification
  - Storage and Distribution to Residential'; 'Prior Notification - Various Uses to Restaurants and Cafes';
  'Prior Notification - Retail to Assembly and Leisure'; 'Prior Notification - Toll facilities'; 'Prior
  Notification - Electrical Works'; 'Prior Notification - Temporary Change of Use'; 'Notification of Removal
  of Public Call Box', which have no application-type id here.
