reference: arboriculturist-report
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on or adjacent to the proposed development.
    - site:
        in:
        - tree-preservation-zone
        description: Trees are protected by a Tree Preservation Order.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: 'This is required where trees are: on or adjacent to the proposed development protected by
  a Tree Preservation Order'
must-include:
- item: The species of tree
  level: should
- item: Any works proposed to be undertaken
  level: should
- item: Any protection measures to be in place
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC012.
  The list calls it 'Tree survey/arboricultural implications'.
review-status: unverified
field-status: {}
