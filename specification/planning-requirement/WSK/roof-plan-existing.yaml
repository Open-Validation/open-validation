reference: roof-plan-existing
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - reserved-matters
      - s73
      - non-material-amendment
      - pa-extension
      - cho-commercial-to-dwh
      - cho-agri-to-dwh
      - cho-comm-to-school
      - cho-agri-to-flexcom
      - cho-amusements-to-dwh
      - pa-col-fac-shop
      - pa-tmp-use-comm-film
      - pa-roof-solar-nondom
      - pa-excavate-agri
      - pa-build-agri-forest
      - pa-ecomms-network
  - condition:
      field: complex-roof-design
      value: true
      description: The proposal has a complex roof structure.
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications must be accompanied by plans and drawings or information necessary to describe
  the subject of the application including: ... existing and proposed roof plans (for example at a scale
  of 1:50 or 1:100) - required only for complex roof structures'
must-include:
- item: At a scale of, for example, 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC006.
  Item DC006 'Relevant plans' asks for the plans 'necessary to describe the subject of the application',
  so some may not be needed for every proposal of these types. The council also lists it for 'Prior Notification
  - Various Uses to Restaurants and Cafes'; 'Prior Notification - Retail to Assembly and Leisure'; 'Prior
  Notification - Toll facilities', which have no application-type id here.
review-status: unverified
field-status: {}
