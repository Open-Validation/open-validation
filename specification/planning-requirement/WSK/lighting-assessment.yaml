reference: lighting-assessment
local-authority: WSK
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - pa-tmp-use-comm-film
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting.
    - discretionary
source-url: https://www.westsuffolk.gov.uk/planning/planning_applications/pf04.cfm
source-text: This is required for all applications for development where the development is likely to
  result in a material increase in levels of light pollution (for example floodlighting or illumination
  in the countryside).
must-include:
- item: Details of any existing and proposed external lighting
  level: should
- item: The hours when the lighting would be switched on
  level: should
- item: A layout plan with beam orientation
  level: should
- item: A schedule of the equipment in the design (such as manufacturers' specifications)
  level: should
confidence: medium
notes: From the council's list (adopted 20 June 2016), web page 'Full Planning Application', item DC025.
  Floodlighting is the list's own example; other lighting ('a material increase in levels of light pollution',
  for example illumination in the countryside) is shown as discretionary.
review-status: unverified
field-status: {}
