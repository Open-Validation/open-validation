reference: land-contamination-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - pip
      - technical-details-consent
      - change-of-use
      - approval-condition
  - any:
    - ref: major-development
    - site:
        in:
        - contaminated-land
        description: Sites currently or formerly in industrial use where contamination is known or suspected
          (on the site or on adjacent land).
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposed use would be particularly vulnerable to contamination (e.g. residential,
            care homes, holiday accommodation, allotments and small holdings).
      - discretionary
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Non-major conversion of barns to dwellings or holiday accommodation.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Non-major erection of dwellings.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'A Contaminated Land Screening Assessment Form is required for: a. All Non-Major development
  involving the conversion of barns to dwellings / holiday accommodation and / or the erection of dwellings
  or the change of use of land to allotments or small holdings ... A Contaminated Land Survey (Phase One)
  is required for: a. All Major development involving residential development, care homes, holiday accommodation
  commercial development and public infrastructure; b. All new development proposals on sites which have
  currently or in the past been used for industrial purposes and where contamination is known or suspected
  (on the site or on adjacent land) and/or where the proposed use would be particularly vulnerable to
  the presence of contamination (e.g. residential, care homes, holiday accommodation, allotments and small
  holdings).'
must-include:
- item: 'For non-major barn conversions to dwellings or holiday accommodation, erection of dwellings,
    or change of use to allotments or small holdings: a Contaminated Land Screening Assessment Form'
  level: must
  required-if:
    any:
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Barn conversion to dwellings or holiday accommodation.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Erection of dwellings.
    - condition:
        field: sensitive-end-use
        value: true
        description: Change of use of land to allotments or small holdings.
- item: 'For major development and sites with known or suspected contamination: a Contaminated Land Survey
    (Phase One)'
  level: must
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - contaminated-land
        description: Known or suspected contamination.
- item: Enough site investigation information to determine whether contamination exists, its nature and
    extent, the risks it may pose and to whom or what (the receptors), and any necessary remediation measures
  level: must
- item: Undertaken by a suitably qualified and competent person accredited and registered with a professional
    institution or organisation
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 5, requirement
  9. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The Phase One survey is for all major development
  involving residential development, care homes, holiday accommodation, commercial development and public
  infrastructure. Whether a proposed use is particularly vulnerable to contamination is a judgement, so
  that part shows as discretionary. The list defines a major application as 10 or more dwellings, residential
  development on a site of 0.5 hectares or more, buildings creating 1,000 sq m or more floorspace, or
  a site of 1 hectare or more.
review-status: unverified
field-status: {}
