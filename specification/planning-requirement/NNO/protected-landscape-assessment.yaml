reference: protected-landscape-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - non-material-amendment
  - any:
    - all:
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: Within the Norfolk Coast National Landscape.
      - condition:
          field: outside-urban-area
          value: true
          description: Outside defined settlement boundaries.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
policy: Norfolk Coast National Landscape Management Plan
source-text: 'Required for: a. All developments (except Householder applications) located within the Norfolk
  Coast National Landscape and located outside of defined settlement boundaries; b. All developments (except
  Householder applications) located outside of the Norfolk Coast National Landscape but which are likely
  to have an impact on the special qualities of the Norfolk Coast National Landscape.'
must-include:
- item: How the proposal would impact on the identified special qualities of the Norfolk Coast National
    Landscape
  level: must
- item: How it would comply with the targets and objectives of the current Norfolk Coast National Landscape
    Management Plan and associated guidance
  level: must
- item: 'Where an adverse effect arises: whether alternative sites have been considered (where they are
    and why the development cannot be located there) and the benefits that outweigh the adverse impacts'
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 2, requirement
  5. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Assessment of Impact on the
  Norfolk Coast National Landscape'. Sites outside the National Landscape that are likely to affect its
  special qualities are a judgement, so they show as discretionary. For smaller proposals the assessment
  can be part of the Design and Access Statement.
review-status: unverified
field-status: {}
