reference: air-quality-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - approval-condition
  - any:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: Non-major development within an Air Quality Management Area.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'An Air Quality Assessment is required for: a. All Major development within an Air Quality
  Management Area; b. All Major development within an area where the National Air Quality Objectives are
  exceeded for background pollutants (any pollutant); c. All Major Development where the background pollution
  (any pollutant) is within 10% of exceeding the National Air Quality Objectives NOTE: A major application
  is 10 or more dwellings, residential development on a site having an area of 0.5 hectares or more, the
  provision of building/s creating 1,000sqm or more floorspace, or development on a site having an area
  of 1 hectare or more. d. All Non-Major development within an Air Quality Management Area; e. All Non-Major
  development within an area where the National Air Quality Objectives are exceeded for background pollutants
  (any pollutant) NOTE: Non-Major development excludes Householder development and any development which
  is Permitted Development under the Town and Country Planning (General Permitted Development) (England)
  Order 2015 (as amended) ... An Air Quality Impact Statement is required for: ... a. All Major development
  NOT within an Air Quality Management Area; NOT within an area where the National Air Quality Objectives
  are exceeded for background pollutants (any pollutant); and NOT within an area where the background
  pollution (any pollutant) is within 10% of exceeding the National Air Quality Objectives NOTE: A major
  application is 10 or more dwellings, residential development on a site having an area of 0.5 hectares
  or more, the provision of building/s creating 1,000sqm or more floorspace, or development on a site
  having an area of 1 hectare or more. b. All Non-Major development where the background pollution (any
  pollutant) is within 10% of exceeding the National Air Quality Objectives NOTE: Non-Major development
  excludes Householder development and any development which is Permitted Development under the Town and
  Country Planning (General Permitted Development) (England) Order 2015 (as amended)'
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 1-2, requirement
  3. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list asks for an Air Quality Assessment
  (major development in an AQMA or where background pollution exceeds, or is within 10% of, the National
  Air Quality Objectives; non-major development in an AQMA or where the objectives are exceeded) or an
  Air Quality Impact Statement (all other major development, and non-major development where background
  pollution is within 10% of the objectives), so all major development needs one or the other. Background
  pollution levels (from Defra's UK-AIR tool) have no field, so those parts show as discretionary. Non-major
  development excludes householder and permitted development. The list defines a major application as
  10 or more dwellings, residential development on a site of 0.5 hectares or more, buildings creating
  1,000 sq m or more floorspace, or a site of 1 hectare or more.
