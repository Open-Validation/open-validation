reference: section-proposed
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - pip
      - technical-details-consent
      - non-material-amendment
      - s73
      - change-of-use
      - approval-condition
  - condition:
      field: new-build
      value: true
      description: New buildings or floor space (not extensions to existing buildings).
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: Required for all new buildings or floor space except extensions to existing buildings.
must-include:
- item: Finished floor level shown relative to a fixed and identifiable datum point identified on the
    plan (not taken from structures to be demolished or that can be moved)
  level: must
- item: Metric scale
  level: must
- item: North point
  level: must
- item: Relevant scale bar
  level: must
- item: Any 'do not scale' wording removed, including wording which indicates the LPA is unable to scale
    from the plans
  level: must
- item: Plan number, title and date; any revised plan shows a revision reference (e.g. Rev.A) and the
    date of that revision
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 17, requirement
  35. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Plans – Section Drawing'.
  Site levels plans (requirement 36) and topographical surveys and cross sections (requirement 46) have
  no matching id (see the unmapped list).
review-status: unverified
field-status: {}
