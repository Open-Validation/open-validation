reference: planning-statement
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - pip
      - technical-details-consent
      - non-material-amendment
      - s73
      - change-of-use
      - approval-condition
  - any:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Small scale residential development of 1-9 dwellings.
    - condition:
        field: departure-from-development-plan
        value: true
        description: The proposal is contrary to the development plan.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: a. Major applications (a major application is 10 or more dwellings, residential development
  on a site having an area of 0.5 hectares or more, the provision of building/s creating 1000sqm or more
  floorspace, or development on a site having an area of 1 hectare or more); b. all small scale residential
  development of 1-9 dwellings; c. all proposals that are contrary to the development plan
must-include:
- item: How the proposal accords with national and local policy and/or any other relevant material considerations,
    particularly where it is a departure from policy
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 15, requirement
  28. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list defines a major application as 10
  or more dwellings, residential development on a site of 0.5 hectares or more, buildings creating 1,000
  sq m or more floorspace, or a site of 1 hectare or more.
review-status: unverified
field-status: {}
