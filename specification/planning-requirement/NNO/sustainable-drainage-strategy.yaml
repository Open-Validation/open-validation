reference: sustainable-drainage-strategy
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - approval-condition
  - ref: major-development
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required for: a. all Major developments (a major application is 10 or more dwellings, residential
  development on a site having an area of 0.5 hectares or more, the provision of building/s creating ...
  1,000sqm or more floorspace, or development on a site having an area of 1 hectare or more)'
must-include:
- item: Plans, details and specifications setting out foul drainage and surface water drainage proposals
  level: must
- item: How surface water (including flows from off site) will be managed within the site without causing
    flood risk to properties on or off the site, considering climate change and the drainage hierarchy
  level: must
- item: Information on ongoing maintenance and management
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 5-6, requirement
  10. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Drainage Strategy including
  Foul and Surface Water Management'.
review-status: unverified
field-status: {}
