reference: biodiversity-survey-report
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - pip
      - technical-details-consent
      - s73
      - change-of-use
  - any:
    - ref: major-development
    - condition:
        field: protected-species
        value: true
        description: Protected species are likely to be present on or near the site and affected.
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        description: Likely to affect internationally or nationally designated sites.
    - site:
        in:
        - priority-habitat
        description: Likely to affect priority habitats.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required for: • All developments where it is likely that protected species are present on
  or near the development site, and are likely to be affected by the development. • All development likely
  to affect: a. Internationally and nationally designated sites; b. European and nationally protected
  species; c. Priority habitats and species; and d. Significant populations of national or local Red List
  or notable species. For further guidance please refer to the Council’s Local Validation requirements
  for Designated Sites, Priority Habitats and Protected Species (version: Dec 2024) Definition: a major
  application is 10 or more dwellings, residential development on a site having an area of 0.5 hectares
  or more, the provision of building/s creating 1000sqm or more of commercial floorspace, or development
  on a site having an area of 1 hectare or more.'
must-include:
- item: Prepared in accordance with CIEEM guidelines (Preliminary Ecological Appraisal, Ecological Impact
    Assessment, Ecological Report Writing) and BS 42020:2013
  level: should
- item: Valid within the timeframes in CIEEM's advice note 'On the Lifespan of Ecological Reports and
    Surveys'
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 18, requirement
  38. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Preliminary Ecological Appraisal
  (PEA) (followed by – where appropriate) Ecological Impact Assessment (EcIA)'. Its cell ends with the
  major development definition and refers to the council's separate 'Local Validation requirements for
  Designated Sites, Priority Habitats and Protected Species' (Dec 2024, https://www.north-norfolk.gov.uk/media/10771/local-validation-requirements-for-designated-sites-priority-habitats-and-protected-species.pdf),
  whose first trigger is major proposals; that document's other triggers (buildings with bat potential,
  works near woodland or water, floodlighting, felling, ponds, derelict land and more) are shown as discretionary
  here, as are significant populations of Red List or notable species.
review-status: unverified
field-status: {}
