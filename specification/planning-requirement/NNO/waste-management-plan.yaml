reference: waste-management-plan
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - pip
      - technical-details-consent
      - change-of-use
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - condition:
        field: overnight-accommodation
        value: true
        description: New holiday accommodation.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: a. all development proposals which give rise to increased demand on waste and recycling removal
  services, e.g. all new dwellings, new holiday accommodation, new commercial, leisure and tourism floorspace.
must-include:
- item: General waste collection arrangements
  level: must
- item: The location and design of any proposed bin storage areas, including collection points
  level: must
- item: Access routes for refuse vehicles, turning points etc.
  level: must
- item: Adequate waste provision for the size of the development
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 27, requirement
  54. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Waste and Recycling Statement'.
  Other development giving rise to increased demand on waste and recycling services (e.g. new commercial,
  leisure and tourism floorspace) shows as discretionary.
review-status: unverified
field-status: {}
