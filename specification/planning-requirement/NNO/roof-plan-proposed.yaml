reference: roof-plan-proposed
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - technical-details-consent
      - non-material-amendment
      - s73
      - change-of-use
      - approval-condition
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: An existing roof is altered, or a new roof structure is created.
    - condition:
        field: complex-roof-design
        value: true
        description: The proposal involves a more complex roof design.
    - condition:
        field: external-alterations
        value: true
        description: Installation of roof-mounted solar panels.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: Required where the proposals meets one or more of the following; • Where an existing roof
  is altered by the proposal. • Where there is a new roof structure created as part of the proposal •
  Where the scheme involves the installation of roof-mounted solar panels • Involving more complex roof
  design.
must-include:
- item: Metric scale, usually 1:50 or 1:100, or shown on the site/block plan
  level: should
- item: North point
  level: must
- item: Relevant scale bar
  level: must
- item: Any 'do not scale' wording removed, including wording which indicates the LPA is unable to scale
    from the plans
  level: must
- item: Plan number, title and date; any revised plan shows a revision reference (e.g. Rev.A) and the
    date of that revision
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 17, requirement
  34. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")').
review-status: unverified
field-status: {}
