reference: town-centre-impact-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - site:
          in:
          - town-centre
          description: Within a defined primary shopping area of a large or small town centre.
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 500
          description: New retail floorspace (gross external area) of 500 sq m or more (over 750 sq m
            in a large town centre, 500-749 sq m in a large or small town centre).
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Any other location in the District.
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 250
          description: New retail floorspace (gross external area) over 250 sq m.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required for: a. New retail floorspace* (comparison and convenience goods): o over 750sqm
  within a defined primary shopping area of a large town centre; o Between 500 and 749sqm in a defined
  primary shopping area of a large or small town centre; o Up to 499 sqm within the development boundary
  on the best sequentially available site; o Over 250sqm in any other location in the District; *measured
  as gross external area of the building'
must-include:
- item: How the sequential test requirements of the NPPF have been met
  level: must
- item: 'Where the sequential test is not met: the likely impacts on the vitality and viability of town
    centres, with mitigation where adverse impacts are identified'
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 19, requirement
  39. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Retail Impact Assessment
  (including sequential assessment)'. Up to 499 sq m within the development boundary 'on the best sequentially
  available site' is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
