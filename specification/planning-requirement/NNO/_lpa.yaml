type: District
review-status: unverified
validation-list:
  url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
  date: '2025-01-01'
  date-basis: 'Council page (https://www.north-norfolk.gov.uk/tasks/planning-services/development-management/north-norfolk-local-validation-requirements-list/,
    checked 2026-11-06): ''Following a public consultation from 16 October 2024 to 27 November 2024, the
    approved list of local validation requirements comes into effect from 1 January 2025.'' The list is
    the guidance document plus the matrix (https://www.north-norfolk.gov.uk/media/10783/local-validation-list-2025-to-2027-matrix.pdf);
    both are the newest on that page and the site search found no later list or consultation (guidance
    PDF modified 19 December 2024).'
  status: current
submission-standards:
- item: Any 'do not scale' wording removed, including any wording which indicates the LPA is unable to
    scale from the plans
  level: must
- item: Plans provided at a metric scale with a relevant scale bar; photographs with annotated dimensions
    are not accepted
  level: must
- item: Plans given a plan number, title and date; revised plans show a revision reference (e.g. Rev.A)
    dated to that revision
  level: should
- item: Where an Ordnance Survey based plan is submitted, the copyright and licence number are shown
  level: must
- item: Any use of generative AI in the submission is declared and labelled where it was used, including
    whether images or video were created or altered; the applicant declares responsibility for factual
    accuracy and that the use is responsible and lawful
  level: should
- item: Where a local requirement is considered not to apply, a cover letter names it in bold and briefly
    explains why
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is to the current 2025-2027 list (in effect from 1 January 2025). The date should
    be 2025-01-01, not the metadata date. About 14 local requirements are missing, including the coastal
    erosion, National Landscape, ASHP, AI disclosure, structural survey and topographical survey items.
    Heritage and Lighting are wrongly applied to Householder, and most other items are guessed under Full
    planning instead of taken from the matrix columns. Fixed 2026-11-05: every file was rewritten from
    the council''s latest list.'
notes: 'Reorganisation: March 2026 LGR decision for Norfolk WITHDRAWN 7 Sep 2026 (reconsideration under
