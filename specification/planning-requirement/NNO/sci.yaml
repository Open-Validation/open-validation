reference: sci
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
  - ref: major-development
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: a. all Major applications (a major application is 10 or more dwellings, residential development
  on a site having an area of 0.5 hectares or more, the provision of building/s creating 1,000sqm or more
  floorspace, or development on a site having an area of 1 hectare or more); (Excludes all related non-material
  amendment applications, variation of condition proposals and condition discharges).
must-include:
- item: A short report setting out how the applicant engaged with the local community before submitting
    the application
  level: must
- item: How the views of the local community have been taken into account in the final submission
  level: should
- item: Engagement with affected Parish/Town Councils, awareness raising in affected communities, a public
    meeting or exhibition where appropriate, and an opportunity for feedback before submission
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 20, requirement
  42. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list defines a major application as 10
  or more dwellings, residential development on a site of 0.5 hectares or more, buildings creating 1,000
  sq m or more floorspace, or a site of 1 hectare or more.
review-status: unverified
field-status: {}
