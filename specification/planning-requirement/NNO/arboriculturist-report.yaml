reference: arboriculturist-report
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - advertising
      - pip
      - technical-details-consent
      - change-of-use
      - approval-condition
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on site or on adjacent land which may be affected by the proposals (directly
        or indirectly).
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: Required for any application where trees are present on site or on land adjacent to the application
  site and which may be affected by the proposals (either directly or indirectly).
must-include:
- item: A plan identifying and accurately plotting all trees on the site or adjacent land (including street
    trees) that could influence or be affected by the development
  level: must
- item: An assessment of the size, spread, condition and quality of those trees in accordance with BS
    5837:2012
  level: must
- item: Trees to be removed identified on a plan, with mitigation planting in the landscaping proposals
    where necessary
  level: must
- item: 'For trees to be retained: a Tree Protection Plan and protection of root protection areas during
    construction to BS 5837:2012'
  level: must
- item: 'Where works would likely affect trees: an Arboricultural Method Statement'
  level: should
- item: Prepared by a suitably qualified arboriculturist
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 25, requirement
  50. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Tree survey and Arboricultural
  Impact Assessment'.
review-status: unverified
field-status: {}
