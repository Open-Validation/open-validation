reference: affordable-housing-statement
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Residential development on a site of 0.5 hectares or more.
    - all:
      - condition:
          field: rural-exception-housing
          value: true
          description: A rural exception housing scheme of any scale.
      - site:
          in:
          - rural-area
          description: In the 'countryside' policy area.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: A market housing led proposal.
      - site:
          in:
          - rural-area
          description: In the 'countryside' policy area.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required for: a. Major housing applications (a major application is 10 or more dwellings,
  residential development on a site having an area of 0.5 hectares or more); or b. All rural exception
  housing schemes of any scale in the ‘countryside’. c. All market housing led proposals in the ‘countryside’
  policy area.'
must-include:
- item: The level of affordable housing provision, including housing mix and tenure, taking account of
    up-to-date housing needs for the area
  level: must
- item: 'Where a policy compliant scheme is not proposed: clear justification for the reduced amount of
    affordable housing, supported by a financial viability assessment where viability forms all or part
    of the justification'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A policy compliant scheme is not proposed.
- item: Based on an up to date needs assessment, provided on request by the Council's Strategic Housing
    Team
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 1, requirement
  2. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). It can be included within a Planning Statement.
review-status: unverified
field-status: {}
