reference: site-plan
local-authority: NNO
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - pip
    - technical-details-consent
    - non-material-amendment
    - s73
    - change-of-use
    - approval-condition
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all proposals where plans are to be submitted in support of an application.
must-include:
- item: Metric scale of 1:200 or 1:500, on an up-to-date map
  level: must
- item: North point
  level: must
- item: The proposed development in relation to site boundaries, other buildings on the site, adjoining
    properties and the immediate area, including roads, public rights of way (where relevant), trees,
    changes in levels, boundary treatment, vehicular/pedestrian access and parking
  level: must
- item: House names and road names labelled
  level: should
- item: Any red edge matches the location plan
  level: must
- item: Ordnance Survey copyright and licence number shown where an OS-based plan is used
  level: must
- item: Relevant scale bar
  level: must
- item: Any 'do not scale' wording removed, including wording which indicates the LPA is unable to scale
    from the plans
  level: must
- item: Plan number, title and date; any revised plan shows a revision reference (e.g. Rev.A) and the
    date of that revision
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 15, requirement
  29. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Plans – Block Plan'.
review-status: unverified
field-status: {}
