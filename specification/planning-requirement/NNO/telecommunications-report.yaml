reference: telecommunications-report
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators or wireless broadband
          providers.
    - all:
      - condition:
          field: telecommunications-development
          value: true
          description: Radio masts or aerials.
      - condition:
          field: building-height
          operator: '>'
          value: 20
          description: Above 20m in height.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: a. all proposals for mast and antenna development by mobile phone network operators or by
  wireless broadband providers b. all proposals for radio masts/aerials above 20m in height.
must-include:
- item: Area of search, details of any consultation undertaken, details of the proposed structure, and
    technical justification and information
  level: must
- item: A signed declaration that the equipment and installation fully complies with the ICNIRP radio
    frequency public exposure guidelines
  level: must
- item: Photomontages or visualisations
  level: should
- item: 'For radio masts or aerials above 10m: a short statement of why the mast is required, with technical
    information about its visual appearance and likely impact'
  level: should
  required-if:
    condition:
      field: building-height
      operator: '>'
      value: 10
      description: Radio mast or aerial above 10m.
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 21, requirement
  44. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Telecommunications Development
  – Supplementary Information'.
review-status: unverified
field-status: {}
