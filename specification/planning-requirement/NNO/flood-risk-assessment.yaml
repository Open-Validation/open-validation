reference: flood-risk-assessment
local-authority: NNO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
        - technical-details-consent
        - s73
        - change-of-use
        - approval-condition
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: 1 hectare or greater in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: 1 hectare or greater in Flood Zone 1.
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zone 2 or 3 plus an allowance for climate change.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
    - site:
        in:
        - flood-risk-zone
        description: Minor extensions in Flood Zone 2 or 3, and 'more vulnerable', 'less vulnerable' or
          'water compatible' development in Flood Zone 2, covered by Environment Agency standing advice.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required for: a. all planning applications for development proposals of 1 hectare or greater
  in Flood Zone 1; b. all proposals in Flood Zones 2 and 3 plus an allowance for climate change (excluding
  minor extensions, more vulnerable, less vulnerable and water compatible development in flood zone 2
  covered by separate EA standing advice) c. all planning applications involving extensions to existing
  buildings, new development located or changes of use which increase flood vulnerability on ‘Dry Island’
  sites d. all planning applications where proposed development may be subject to other sources of flooding
  or may increase the potential of flood risk from other sources of flooding e.g. large reservoirs or
  development affected by large reservoirs e. All discharge of condition applications where approval of
  detailed drainage design is required. ... Required for: • a minor extension (household extensions or
  non-domestic extensions less than 250 square metres) in flood zone 2 or 3 plus an allowance for climate
  change; • ‘more vulnerable’ in flood zone 2 plus an allowance for climate change (except for landfill
  or waste facility sites, caravan or camping sites); • ‘less vulnerable’ in flood zone 2 plus an allowance
  for climate change (except for agriculture and forestry, waste treatment, and water and sewage treatment);
  ... • ‘water compatible’ in flood zone 2 plus an allowance for climate change This includes developments
  involving a change of use into one of these vulnerable categories or into the water compatible category.'
must-include:
- item: Plans identifying and quantifying the risk to the development from all sources of flooding
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - pip
      - technical-details-consent
      - s73
      - change-of-use
      - approval-condition
- item: Site specific detail (geology, watercourse network, topography etc.) to inform the drainage hierarchy
    for surface water drainage proposals
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - pip
      - technical-details-consent
      - s73
      - change-of-use
      - approval-condition
- item: Flood evacuation and response management plans
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - pip
      - technical-details-consent
      - s73
      - change-of-use
      - approval-condition
- item: 'Standing advice statement: site address and a description of the development'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - change-of-use
- item: 'Standing advice statement: estimated flood level for the development, taking into account climate
    change over its lifetime'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - change-of-use
- item: 'Standing advice statement: finished floor levels'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - change-of-use
- item: 'Standing advice statement: flood resistance and resilience plans'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - change-of-use
- item: 'Standing advice statement: any supporting plans and drawings, and any other information the standing
    advice asks for'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - change-of-use
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 7-8, requirement
  14 and 15. Application types are those the matrix marks the requirement as 'likely' for (its key says
  'Local Validation Requirement likely (check "When Required")'). Requirement 14 is the Flood Risk Assessment;
  requirement 15 is the 'Flood Risk Assessment - Statement of compliance with Environment Agency Standing
  Advice on Flood Risk' for householder, full and change of use applications covered by standing advice.
  'Dry Island' sites, other sources of flooding (e.g. large reservoirs) and discharge of condition applications
  needing approval of detailed drainage design have no field, so they show as discretionary.
review-status: unverified
field-status: {}
