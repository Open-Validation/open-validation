reference: heritage-statement
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - lbc
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        description: Affects or may affect a listed building or its setting, a conservation area, a scheduled
          monument or its setting, a registered historic park or garden, or a locally listed building.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
policy: NPPF paragraph 189
source-text: 'Required in the case of development proposals (except Householder development) which affect
  or may affect: a. listed buildings and their settings; b. the character and appearance of Conservation
  Areas; c. scheduled monuments and their settings; d. a site on the Register of Historic Parks and Gardens
  of Special Historic Interest in England; e. undesignated heritage assets (such as buildings on a local
  list). f. an area with known or high potential for archaeological interest'
must-include:
- item: A description of the significance of the heritage asset and the contribution made by its setting
  level: must
- item: A full description of the proposed works; where demolition is proposed, the age and condition
    of the fabric to be removed
  level: must
- item: A statement of justification for the proposed works
  level: must
- item: An assessment of the impact of the works on the overall significance of the building
  level: must
- item: Proposed mitigation of any negative impact on the significance of the heritage asset and/or its
    setting
  level: must
- item: A field evaluation for sites of archaeological interest
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 9, requirement
  18. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). Other undesignated heritage assets and areas
  with known or high potential for archaeological interest are judgements, so they show as discretionary.
  The heritage assessment can be part of the Design and Access Statement.
review-status: unverified
field-status: {}
