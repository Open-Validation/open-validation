reference: lighting-assessment
local-authority: NNO
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting (including illuminated adverts) is proposed.
  - any:
    - site:
        in:
        - dark-sky-area
        description: The proposal could impact on designated Dark Skies Sites.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'all development (excluding Householder development) where external lighting (Including illuminated
  adverts) is proposed where: o residential amenity can be directly impacted and/or o the proposal could
  impact on designated Dark Skies Sites or the nocturnal character of the area'
must-include:
- item: Location, number and design of the proposed external lighting
  level: must
- item: Manufacturers' product details, including illumination levels and beam orientation
  level: must
- item: Times of operation
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): not for householder development. Officer discretion covers direct impacts
  on residential amenity and on the nocturnal character of the area.'
review-status: unverified
field-status: {}
