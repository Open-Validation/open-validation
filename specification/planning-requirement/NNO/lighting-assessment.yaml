reference: lighting-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - approval-condition
  - condition:
      field: external-lighting
      value: true
      description: External lighting (including illuminated adverts) is proposed.
  - any:
    - condition:
        field: dark-sky-impact
        value: true
        description: The proposal could impact on designated Dark Skies Sites or the nocturnal character
          of the area.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: '• all development (excluding Householder development) where external lighting (Including
  illuminated adverts) is proposed where: o residential amenity can be directly impacted and/or o the
  proposal could impact on designated Dark Skies Sites or the nocturnal character of the area'
must-include:
- item: 'Proposed external lighting: location, number and design'
  level: must
- item: Manufacturers' product details, including illumination levels and beam orientation
  level: must
- item: Times of operation
  level: must
- item: Measures to prevent light spill and light pollution
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 12, requirement
  21. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Lighting Impact Assessment'.
  Whether residential amenity can be directly impacted is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
