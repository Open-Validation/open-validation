reference: location-plan
local-authority: NNO
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - pip
    - technical-details-consent
    - non-material-amendment
    - s73
    - change-of-use
    - approval-condition
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all proposals where plans are to be submitted in support of an application.
must-include:
- item: Metric scale, usually 1:2500 or 1:1250, on an up-to-date map
  level: must
- item: Site edged in red, including the residential curtilage
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: must
- item: North point
  level: must
- item: Ordnance Survey copyright and licence number shown where an OS-based plan is used
  level: must
- item: Relevant scale bar
  level: must
- item: Any 'do not scale' wording removed, including wording which indicates the LPA is unable to scale
    from the plans
  level: must
- item: Plan number, title and date; any revised plan shows a revision reference (e.g. Rev.A) and the
    date of that revision
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 16, requirement
  32. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Plans – Location Plan'. The
  matrix's national requirements rows do not mark the location plan for discharge of condition applications,
  but local requirement 32 does.
review-status: unverified
field-status: {}
