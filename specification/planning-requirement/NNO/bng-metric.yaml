reference: bng-metric
local-authority: NNO
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
policy: Emerging Policy CC 10 (Biodiversity Net Gain)
source-text: 'Biodiversity Net Gain Statement (and completed metric spreadsheet where applicable) ...
  Required for: All applications'
must-include:
- item: The Statutory Biodiversity Metric with baseline and post-development calculations fully completed
    (outline applications may provide indicative post-development calculations)
  level: must
- item: Date of metric completion
  level: must
- item: Name of the competent and/or Watercourse accredited person
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 3, requirement
  6. The list item is 'Biodiversity Net Gain Statement (and completed metric spreadsheet where applicable)',
  required for 'All applications'. In law only development subject to the biodiversity gain condition
  needs the metric and habitat plan (householder and other exempt development do not), so that is the
  rule here; the statement itself, which says whether BNG applies or why the proposal is exempt, has no
  matching id (see the unmapped list). The matrix marks it likely for full, outline and technical details
  consent.
review-status: unverified
field-status: {}
