reference: transport-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - condition:
        field: convenience-retail-floorspace
        operator: '>='
        value: 250
        description: 'Food retail (Class E): at least 250 sq m.'
    - condition:
        field: comparison-retail-floorspace
        operator: '>='
        value: 800
        description: 'Non-food retail (Class E): at least 800 sq m.'
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Financial and professional services (Class E).
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 'Financial and professional services (Class E): at least 1,000 sq m.'
    - all:
      - condition:
          field: use-class
          value: restaurant-cafe
          description: Restaurants and cafes (Class E).
      - condition:
          field: floorspace
          operator: '>='
          value: 300
          description: 'Restaurants and cafes (Class E): at least 300 sq m.'
    - all:
      - condition:
          field: use-class
          value: drinking-establishment
          description: Drinking establishments (sui generis).
      - condition:
          field: floorspace
          operator: '>='
          value: 300
          description: 'Drinking establishments (sui generis): at least 300 sq m.'
    - all:
      - condition:
          field: use-class
          value: hot-food-takeaway
          description: Hot food takeaways (sui generis).
      - condition:
          field: floorspace
          operator: '>='
          value: 250
          description: 'Hot food takeaways (sui generis): at least 250 sq m.'
    - all:
      - condition:
          field: use-class
          value: business
          description: Other offices, research and development or light industrial processes (Class E).
      - condition:
          field: floorspace
          operator: '>='
          value: 1500
          description: 'Other offices, research and development or light industrial processes (Class E):
            at least 1,500 sq m.'
    - all:
      - condition:
          field: use-class
          value: general-industrial
          description: General industrial (Class B2).
      - condition:
          field: floorspace
          operator: '>='
          value: 2500
          description: 'General industrial (Class B2): at least 2,500 sq m.'
    - all:
      - condition:
          field: use-class
          value: storage-distribution
          description: Storage or distribution (Class B8).
      - condition:
          field: floorspace
          operator: '>='
          value: 3000
          description: 'Storage or distribution (Class B8): at least 3,000 sq m.'
    - all:
      - condition:
          field: use-class
          value: hotel
          description: Hotels (Class C1).
      - condition:
          field: bedroom-count
          operator: '>='
          value: 75
          description: 'Hotels (Class C1): at least 75 bedrooms.'
    - all:
      - condition:
          field: use-class
          value: hospital-nursing-home
          description: Hospitals and nursing homes (Class C2).
      - condition:
          field: residential-capacity
          operator: '>='
          value: 30
          description: 'Hospitals and nursing homes (Class C2): at least 30 beds.'
    - all:
      - condition:
          field: use-class
          value: residential-education
          description: Boarding schools and training centres (Class C2).
      - condition:
          field: residential-capacity
          operator: '>='
          value: 50
          description: 'Boarding schools and training centres (Class C2): at least 50 students.'
    - all:
      - condition:
          field: use-class
          value: institutional-hostel
          description: Institutional hostels and homeless centres (Class C2).
      - condition:
          field: residential-capacity
          operator: '>='
          value: 250
          description: 'Institutional hostels and homeless centres (Class C2): at least 250 residents.'
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 'Dwelling houses (Class C3): at least 50 units.'
    - all:
      - condition:
          field: use-class
          value: learning-non-residential-institution
          description: Non-residential institutions (Class F1).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 'Non-residential institutions (Class F1): at least 500 sq m.'
    - all:
      - condition:
          field: use-class
          value: indoor-sport-recreation
          description: Indoor sport and recreation (Class E).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 'Indoor sport and recreation (Class E): at least 500 sq m.'
    - all:
      - condition:
          field: use-class
          value: outdoor-sport-recreation
          description: Swimming baths, skating rinks and outdoor sports or recreation not involving motorised
            vehicles or firearms (Class F2).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 'Swimming baths, skating rinks and outdoor sports or recreation not involving motorised
            vehicles or firearms (Class F2): at least 500 sq m.'
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required for all developments exceeding the thresholds set out below (all floor areas measured
  as gross external area): a. Food Retail (Class E) with a floor area greater than 800sqm; b. Non-Food
  Retail (Class E) with a floor area greater than 1,500sqm; c. Financial and Professional Services (Class
  E) with a floor area greater than 2,500sqm; d. Restaurants and Cafes (Class E) with a floor area greater
  than 2,500sqm; e. Drinking Establishments (Sui Generis) with a floor area greater than 600sqm; f. Hot
  Food Takeaways (Sui Generis) with a floor area greater than 500sqm; g. Other Offices, Research and Development
  or any industrial process which can be carried out in any residential area without causing detriment
  to the amenity of the area (Class E) with a floor area greater than 2,500sqm; h. General Industrial
  (Class B2) with a floor area greater than 4,000sqm; i. Storage or Distribution (Class B8) with a floor
  area greater than 5,000sqm; j. Hotels (Class C1) with more than 100 bedrooms; k. Residential Institutions
  (Class C2) - Hospitals, nursing homes used for residential accommodation and care with more than 50
  beds; l. Residential Institutions (Class C2) - Boarding schools and training centres with more than
  150 students; m. Residential Institutions (Class C2) - Institutional hostels, homeless centres with
  more than 400 residents; n. Dwelling Houses (Class C3) where more than 100 units are proposed o. Non-Residential
  Institutions (Class F1) with a floor area greater than 1,000sqm; ... p. Indoor sport and recreation
  (Class E) with a floor area greater than 1,500sqm. q. Indoor or outdoor swimming baths, skating rinks,
  and outdoor sports or recreations not involving motorised vehicles or firearms (Class F2) with a floor
  area greater than 1,500sqm ... Required for all developments falling within the thresholds set out below
  (all floor areas measured as gross external area): a. Food Retail (Class E) with a floor area between
  250sqm and 800sqm; b. Non-Food Retail (Class E) with a floor area between 800sqm and 1,500sqm; c. Financial
  and Professional Services (Class E) with a floor area between 1,000sqm and 2,500sqm; d. Restaurants
  and Cafes (Class E) with a floor area between 300sqm and 2,500sqm; e. Drinking Establishments (Sui Generis)
  with a floor area between 300sqm and 600sqm; f. Hot Food Takeaways (Sui Generis) with a floor area between
  250sqm and 500sqm; g. Other Offices, Research and Development or any industrial process which can be
  carried out in any residential area without causing detriment to the amenity of the area (Class E) with
  a floor area between 1,500sqm and 2,500sqm; h. General Industrial (Class B2) with a floor area between
  2,500sqm and 4,000sqm; i. Storage or Distribution (Class B8) with a floor area between 3,000sqm and
  5,000sqm; j. Hotels (Class C1) with between 75 and 100 bedrooms; k. Residential Institutions (Class
  C2) - Hospitals, nursing homes used for residential accommodation and care with between 30 and 50 beds;
  l. Residential Institutions (Class C2) - Boarding schools and training centres with between 50 and 150
  students; m. Residential Institutions (Class C2) - Institutional hostels, homeless centres with between
  250 and 400 residents; n. Dwelling Houses (Class C3) where between 50 and 100 units are proposed o.
  Non-Residential Institutions (Class F1) with a floor area between 500sqm and 1,000sqm; p. Indoor sport
  and recreation (Class E) with a floor area between 500sqm and 1,500sqm. ... q. Indoor or outdoor swimming
  baths, skating rinks, and outdoor sports or recreations not involving motorised vehicles or firearms
  (Class F2) with a floor area between 500sqm and 1,500sqm.'
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 22-24, requirement
  47 and 48. Application types are those the matrix marks the requirement as 'likely' for (its key says
  'Local Validation Requirement likely (check "When Required")'). Requirement 47 is the Transport Assessment
  (developments exceeding the upper thresholds); requirement 48 is the Transport Statement (developments
  between the lower and upper thresholds), so the rule uses the Transport Statement's lower thresholds.
  All floor areas are gross external area. Matrix types are those for requirement 47 (requirement 48 is
  the same).
