reference: elevation-proposed
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - technical-details-consent
      - non-material-amendment
      - s73
      - change-of-use
      - approval-condition
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: external-alterations
        value: true
        description: Alterations to the exterior of an existing building (including replacement windows
          and doors).
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: Required for all applications proposing new buildings or alterations to the exterior of an
  existing building (including replacement windows and doors)
must-include:
- item: Metric scale, usually 1:50 or 1:100 (photographs with annotated dimensions are not accepted)
  level: must
- item: All elevations, including blank elevations (unless visibility is completely obscured)
  level: must
- item: Match the relevant existing/proposed floor plans
  level: must
- item: Clearly labelled (e.g. north, west) or with a north point
  level: must
- item: Any attached buildings, with the main features of the adjoining building where possible, and a
    street scene where appropriate
  level: should
- item: Relevant scale bar
  level: must
- item: Any 'do not scale' wording removed, including wording which indicates the LPA is unable to scale
    from the plans
  level: must
- item: Plan number, title and date; any revised plan shows a revision reference (e.g. Rev.A) and the
    date of that revision
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 15, requirement
  30. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")').
review-status: unverified
field-status: {}
