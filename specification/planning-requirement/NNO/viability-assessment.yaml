reference: viability-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The applicant is advancing an economic viability case to support the acceptability
          of a non-policy compliant proposal.
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'a. All development proposals (including Housing) where the applicant/agent is advancing
  an economic viability case to support the acceptability of a non-policy compliant proposal. b. All Housing
  Development where: • time has passed since Local Plan Viability evidence has been produced; or • there
  has been a significant change in economic circumstances; or • there are site specific issues such that
  an up to date FVA is required to be submitted with an application to demonstrate that a proposal is
  viable to deliver.'
must-include:
- item: Completed by a suitably qualified person (RICS accredited)
  level: should
- item: Follows industry best practice, including the latest RICS guidance note 'Assessing Viability in
    Planning', the NPPF and Planning Practice Guidance
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 7, requirement
  13. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). Housing development where time has passed since
  the Local Plan viability evidence, economic circumstances have changed significantly or there are site
  specific issues is a judgement, so it shows as discretionary. The list expects viability assessments
  to be published.
review-status: unverified
field-status: {}
