reference: coastal-change-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - pip
      - technical-details-consent
      - change-of-use
  - site:
      in:
      - coastal-erosion-zone
      description: Partly or fully within the 0-25, 25-50 or 50-100 year indicative erosion zones of Shoreline
        Management Plan SMP5 or SMP6.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
policy: Hunstanton to Kelling Hard Shoreline Management Plan (SMP5); Kelling Hard to Lowestoft Shoreline
  Management Plan (SMP6); Coastal Adaptation Supplementary Planning Document (Sept 2023); Emerging Policy
  CC 5
source-text: 'All applications for proposed development partly or fully within the following indicative
  erosion zones set out within either the Hunstanton to Kelling Hard Shoreline Management Plan (SMP5)
  or the Kelling Hard to Lowestoft Shoreline Management Plan (SMP6): • 0-25 yrs indicative erosion zone
  • 25-50 yrs indicative erosion zone • 50-100 yrs indicative erosion zone. ... Or Once adopted, all applications
  partly or fully within the Coastal Change Management Area defined under the Emerging Local Plan under
  Policy CC 5 (Coastal Change Management)'
must-include:
- item: Proportionate to the development proposed
  level: must
- item: Whether the proposal will result in an increased risk to life or to property
  level: must
- item: That the works are consistent with the relevant Shoreline Management Plan and the Coastal Adaptation
    SPD
  level: must
- item: Whether the proposal would result in adverse impact on the environment elsewhere along the coast
  level: must
- item: 'Where there are adverse impacts and the proposal is for commercial, leisure or community infrastructure:
    the economic, social and environmental benefits to the community (or within a Planning Statement)'
  level: must
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 4-5, requirement
  8. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). Once the emerging Local Plan is adopted, the
  Coastal Change Management Area under Policy CC 5 will apply instead.
review-status: unverified
field-status: {}
