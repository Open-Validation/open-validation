reference: recreation-facilities-assessment
local-authority: NNO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - technical-details-consent
        - change-of-use
        - approval-condition
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Residential development on a site of 0.5 hectares or more.
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
        - change-of-use
    - site:
        in:
        - open-space
        description: Affects playing field land.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: Major applications (a major application is 10 or more dwellings, residential development
  on a site having an area of 0.5 hectares) excluding outline applications where layout and/or landscaping
  have been reserved for subsequent approval. ... Required for all proposals affecting playing field land
must-include:
- item: The amount and type of open space to be provided, in accordance with the latest standards
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - change-of-use
      - approval-condition
- item: Management and maintenance of any on or off-site open space
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - change-of-use
      - approval-condition
- item: 'For playing fields: the information in Annex B of Sport England''s ''Playing Fields Policy and
    Guidance'''
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - pip
      - change-of-use
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 15, 17, requirement
  27 and 37. Application types are those the matrix marks the requirement as 'likely' for (its key says
  'Local Validation Requirement likely (check "When Required")'). Requirement 27 is the 'Open Space Assessment
  and Strategy' (major housing, excluding outline applications where layout and/or landscaping are reserved);
  requirement 37 is the 'Playing Fields Assessment'.
review-status: unverified
field-status: {}
