reference: noise-assessment
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - change-of-use
      - approval-condition
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive uses within close proximity to existing noise generating uses (or
          those with an extant permission) which could cause them to curtail their activities.
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: Noise generating development (uses, plant, machinery or equipment).
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Within close proximity to noise sensitive uses.
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: a. any application proposing noise sensitive uses within close proximity to existing noise
  generating uses (or those with an extant permission) which could cause existing nearby uses to curtail
  their activities; b. any application proposing noise generating development (this includes uses, plant,
  machinery or equipment) within close proximity to noise sensitive uses.
must-include:
- item: Carried out by a qualified professional
  level: must
- item: A baseline survey of existing ambient and background noise levels, covering a representative time,
    with the survey data provided
  level: should
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 13, requirement
  24. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Noise Impact Statement'.
  The guidance says close proximity includes adjacent properties and others within reasonable proximity,
  and may be wider in the countryside.
review-status: unverified
field-status: {}
