reference: landscaping-plan
local-authority: NNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development (1-9 dwellings, up to 0.49 hectares, up to 999 sq m of commercial
          floorspace or a site up to 0.9 hectares).
    - discretionary
source-url: https://www.north-norfolk.gov.uk/media/10782/local-validation-list-2025-to-2027-guidance-document.pdf
source-text: 'Required For: a. Major applications (a major application is 10 or more dwellings, residential
  development on a site having an area of 0.5 hectares or more, the provision of building/s creating 1,000sqm
  or more of commercial floorspace, or development on a site having an area of 1 hectare or more) excluding
  outline applications where landscaping has been reserved for subsequent approval; b. all minor developments
  (a minor application is 1-9 dwellings or up to 0.49 hectares or the provision of buildings creating
  up to 999sqm of commercial floor space or development on a site up to 0.9 hectares excluding outline
  applications where landscaping is a reserved matter); c. or other development involving changes to public
  realm in principle and secondary settlements of Cromer, Fakenham, Holt, North Walsham, Hoveton, Sheringham,
  Stalham and Wells.'
must-include:
- item: A plan showing the proposed site layout, boundary treatments, vegetation to be retained, proposed
    soft planting, and hard surface and boundary treatment details
  level: must
- item: A short statement setting out proposed future management and maintenance of soft landscaping
  level: must
- item: 'Existing: a plan to scale showing the location and canopy spread of all existing trees, hedgerows
    and other significant vegetation on or adjoining the site, and those to be retained'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: 'Existing: boundary treatments and forms of enclosure, and open watercourses or other aquatic
    features'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: 'Soft landscape: ground preparation and cultivation; earthworks and ground profiling with existing
    and proposed levels and contours'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: 'Soft landscape: indicative planting proposals to scale (areas and type of planting), including
    mitigation and enhancement from related surveys where applicable, and any SuDS features'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: 'Hard landscape: materials for hard surfaces; new boundary treatments including plot division
    (type, material and height); street furniture; indicative external lighting; indicative security measures'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: An implementation programme and a landscape management plan (responsibilities, maintenance and
    monitoring for at least five years)
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: 'Minor development: existing trees, shrubs and hedgerows, indicating those to be removed, and
    accurate plotting of those retained (species and canopy spread) with protection measures'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development (1-9 dwellings, up to 0.49 hectares, up to 999 sq m of commercial
        floorspace or a site up to 0.9 hectares).
- item: 'Minor development: all new planting (species, location, number and size), protection of new planting
    and the timescale for completing the landscape works'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development (1-9 dwellings, up to 0.49 hectares, up to 999 sq m of commercial
        floorspace or a site up to 0.9 hectares).
- item: 'Minor development: surface materials for vehicle and pedestrian areas, and boundary treatments
    (hedging species, fencing, walling)'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development (1-9 dwellings, up to 0.49 hectares, up to 999 sq m of commercial
        floorspace or a site up to 0.9 hectares).
confidence: medium
notes: From the council's list (in effect from 1 January 2025), guidance document page 10-12, requirement
  20. Application types are those the matrix marks the requirement as 'likely' for (its key says 'Local
  Validation Requirement likely (check "When Required")'). The list item is 'Landscape Proposals (Hard
  & Soft)'. Outline applications where landscaping is reserved are excluded. Other development changing
  the public realm in Cromer, Fakenham, Holt, North Walsham, Hoveton, Sheringham, Stalham and Wells has
  no field, so it shows as discretionary; the fuller list of details applies to major development and
  to that public realm development. The list defines a major application as 10 or more dwellings, residential
  development on a site of 0.5 hectares or more, buildings creating 1,000 sq m or more floorspace, or
  a site of 1 hectare or more.
