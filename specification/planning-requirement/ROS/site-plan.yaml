reference: site-plan
local-authority: ROS
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: new-vehicle-access
      value: true
      description: A dropped kerb (new vehicle crossing) application.
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
  - condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: the following plans and drawings may be required in support of the application depending
  on the development proposed. ... A Site Plan – This should be drawn to a scale of either 1:200 or 1:500
must-include:
- item: 'Site plan at 1:500 or 1:200 showing: north; the development in relation to the site boundaries
    and other buildings on the site, with written dimensions including to the boundaries; buildings, roads
    and footpaths on adjoining land including access arrangements; trees on the site and adjacent land
    that could influence or be affected by the development; extent and type of hardstanding; proposed
    boundary treatment; public rights of way within or next to the site and any proposed diversions'
  level: should
- item: Block plan at 1:100 or 1:200 showing the site boundaries, the type and height of boundary treatment,
    and any building or structure on the other side of the boundaries
  level: must
  source-text: Block plans of the site are required at a scale of 1:100 or 1:200 showing any site boundaries,
    the type and height of boundary treatment (e.g. walls, fences etc), the position of any building or
    structure on the other side of such boundaries.
- item: 'Dropped kerb: length and location of the kerb to be dropped with a metric dimension, any existing
    dropped kerb, and any obstructions to the access (trees, lampposts, grassed areas, utility cabinets)'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A dropped kerb (new vehicle crossing) application.
- item: 'Telecommunications: layout plan at 1:100/1:200 showing the position of the structure, and elevation
    and layout plan of associated equipment'
  level: must
  required-if:
    condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
- item: 'Wind energy: site/block plan at 1:250 or 1:500'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
- item: 'Householder microgeneration equipment or wind turbines: site plan at 1:100/1:200'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: renewable-energy-development
        value: true
        description: Domestic microgeneration equipment or wind turbines.
confidence: medium
notes: From the council's list (adopted September 2026), pages 5, 15, 16 and 45. Covers the existing and
  proposed site plan and block plan. Appendix A (Householder Applications Checklist) lists it for householder
  applications; for other applications the list says plans 'may be required ... depending on the development
  proposed', so they show as 'check'. Dropped kerb, telecommunications and wind energy applications list
  it outright.
review-status: unverified
field-status: {}
