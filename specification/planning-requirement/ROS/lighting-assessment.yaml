reference: lighting-assessment
local-authority: ROS
required-if:
  condition:
    field: external-lighting
    value: true
    description: New external lighting.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Planning applications which include new external lighting shall be accompanied by a Lighting
  Assessment.
must-include:
- item: Plans showing the location of the lighting
  level: should
- item: Site survey including the District Ambient Brightness Category
  level: should
- item: Calculations of glare, intensity and spill, with recommendations to control them
  level: should
- item: Risk assessment for crime and disorder and the impact on light sensitive premises
  level: should
- item: Schedule of installation; equipment design used to determine aim, glare and overspill
  level: should
- item: Measured luminance of the scheme and hours of illumination
  level: should
confidence: medium
notes: From the council's list (adopted September 2026), page 28.
review-status: unverified
field-status: {}
