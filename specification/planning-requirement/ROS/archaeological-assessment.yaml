reference: archaeological-assessment
local-authority: ROS
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      - scheduled-monument
      description: In an area known to have archaeological interest.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Any development which is situated within an area known to have archaeological interest, or
  potential archaeological interest
must-include:
- item: Professionally produced by a suitably qualified person or organisation, setting out a programme
    of archaeological work including a scheme of investigation
  level: must
- item: An appropriate desk-based assessment and, where necessary, a field evaluation report
  level: must
confidence: medium
notes: From the council's list (adopted September 2026), page 19. 'Potential archaeological interest'
  shows as 'check'.
review-status: unverified
field-status: {}
