reference: land-contamination-assessment
local-authority: ROS
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Reason to suspect contamination or potential contamination (e.g. former industrial
        uses, infilled ground).
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed end use is sensitive to contamination (e.g. residential, allotments, schools).
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: 'An application shall be accompanied by a contaminated land Preliminary Risk Assessment (PRA)
  report (Phase One desk study) where: • there is reason to suspect contamination or potential contamination
  of land, controlled waters, property, organisms or ecological systems (for example, the existence of
  former industrial uses, infilled ground, or other indications of potential contamination during the
  walkover survey), • the proposed end use is sensitive to contamination (for example, residential, allotments,
  or schools)'
must-include:
- item: A Preliminary Risk Assessment (Phase One desk study) by a suitably qualified person, assessing
    current and previous uses of the site and surroundings and contamination risks to and from the development
  level: must
- item: 'Where the PRA identifies potential risks: a Phase Two report with site investigation (type, nature
    and extent of contamination, risks to receptors, migration), remediation proposals, implementation
    timetable, monitoring and a remediation verification plan'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted September 2026), page 27. The Phase Two report depends on what
  the PRA finds, so it shows as 'check'.
review-status: unverified
field-status: {}
