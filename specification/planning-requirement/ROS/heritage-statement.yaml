reference: heritage-statement
local-authority: ROS
required-if:
  any:
  - site:
      in:
      - listed-building
      - scheduled-monument
      - park-and-garden
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      description: Involves a Listed Building, Scheduled Monument, Registered Park or Garden, the setting
        of a Listed Building, work in a Conservation Area or work to a local heritage asset.
  - application-type:
      in:
      - lbc
  - condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: NPPF
source-text: For planning applications which involve a Listed Building, Scheduled Monument, Registered
  Park or Garden, impact on the setting of a Listed Building, involve work within a Conservation Area
  and/or involve work to a local heritage asset, a Heritage Statement will need to accompany the applications.
must-include:
- item: The significance of the heritage asset(s) affected, including the contribution of their setting,
    in proportionate detail
  level: must
- item: Materials or features of historic interest to be altered (walls, doors, floors, windows, stairs,
    panelling, fireplaces, plaster mouldings and other decorative details)
  level: must
- item: The relevant historic environment record consulted as a minimum, with the sources considered and
    expertise consulted
  level: must
- item: An assessment of the impact of the proposal; the impact on significance must be understandable
    for the application to be valid
  level: must
- item: 'Demolition in a Conservation Area: the age and nature of the building and the impact of demolition
    on the character of the conservation area'
  level: must
  required-if:
    all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building or structure.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  source-text: A heritage statement identifying the age and nature of the building and the impact of the
    demolition on the character of the conservation area.
- item: 'Wind energy: impacts on significant cultural, recreational or heritage assets, including sub-surface
    archaeology, within at least ten times turbine height (5 km from the site boundary for turbines of
    40 m or more)'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  source-text: Applications shall include an assessment of the impacts of the proposed turbine(s) on significant
    cultural, recreational or heritage assets which could potentially be affected.
confidence: medium
notes: From the council's list (adopted September 2026), pages 26, 27 and 41. Listed building consent
  applications list it outright; for wind energy it can be part of the Planning Statement.
review-status: unverified
field-status: {}
