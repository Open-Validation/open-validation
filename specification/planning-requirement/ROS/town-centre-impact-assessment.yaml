reference: town-centre-impact-assessment
local-authority: ROS
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in an existing centre and not in accordance with an up-to-date
        Local Plan.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: NPPF; Rossendale Local Plan 2019 to 2036 Strategic Policy R1
source-text: A sequential assessment will be required for main town centre uses that are not proposed
  in an existing centre and are not in accordance with an up-to-date Local Plan. ... Applications for
  retail and leisure development outside of town centres, which are not in accordance with an up-to-date
  Local Plan, will be required to be supported by an impact assessment if the development exceeds the
  thresholds set out in the Local Plan (Strategic Policy R1).
must-include:
- item: 'Sequential assessment: sites assessed for availability, suitability and viability; in-centre
    then edge-of-centre options assessed first; no town centre sites available'
  level: must
- item: 'Edge-of-centre proposals: flexibility shown on scale, format, car parking and disaggregation
    onto sequentially preferable sites'
  level: must
- item: 'Impact assessment: impact on existing, committed and planned public and private investment in
    centres in the catchment'
  level: must
  required-if: discretionary
- item: 'Impact assessment: impact on town centre vitality and viability, including consumer choice and
    trade, up to five years ahead (ten years for major schemes whose full impact takes longer)'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted September 2026), pages 31 and 32. The impact assessment applies
  above thresholds in Local Plan Strategic Policy R1, which the list does not give, so it shows as 'check'.
  Small scale rural offices and other small scale rural development are exempt from the sequential approach.
review-status: unverified
field-status: {}
