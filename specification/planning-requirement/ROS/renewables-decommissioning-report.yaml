reference: renewables-decommissioning-report
local-authority: ROS
required-if:
  condition:
    field: wind-turbine
    value: true
    description: A wind energy application.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: An indication of how decommissioning will be undertaken shall be provided.
must-include:
- item: 'Single turbines over 40 m or multiple turbines of any height: evidence of a bond with the council,
    by Unilateral Undertaking, covering the full cost of decommissioning and removal after the 25 year
    operating period'
  level: must
  required-if:
    any:
    - condition:
        field: turbine-tip-height
        operator: '>'
        value: 40
        description: A single turbine over 40 m to blade tip.
    - condition:
        field: wind-turbine-count
        operator: '>='
        value: 2
        description: Multiple turbines.
  source-text: For all single wind turbines over a height of 40m (or multiple turbines of any height),
    the Council will expect that evidence is provided to demonstrate that a bond has been put in place
    with the Local Authority to cover the entire costs of decommissioning and removing the wind turbine(s)
    from site once they have reached the end of their 25 year operational period. This should be done
    through a Unilateral Undertaking.
confidence: medium
notes: From the council's list (adopted September 2026), pages 43 and 44. Item 17 of the wind energy table
  ('Details of Decommissioning Bond / Arrangements'). Turbine height is measured to the blade tip.
review-status: unverified
field-status: {}
