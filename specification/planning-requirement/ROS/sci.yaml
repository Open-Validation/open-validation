reference: sci
local-authority: ROS
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: A wind energy application.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height of any turbine over 15 metres.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (pre-application
  consultation for wind turbines, section 61W of the 1990 Act)
source-text: Planning applications for major development must include a Statement of Community Involvement.
must-include:
- item: The steps the applicant took to involve the local community in preparing the proposals
  level: must
- item: Details of the community consultation carried out, including its type and dates
  level: must
- item: A summary of the feedback received
  level: must
- item: How the feedback was used to amend the proposals, or why no amendments were made
  level: must
- item: 'Wind turbines needing pre-application consultation: how the applicant complied with section 61W(1),
    responses received, and the account taken of them'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  source-text: Where consultation is required by virtue of article 3(1) an application for planning permission
    must be accompanied by particulars of
confidence: medium
notes: From the council's list (adopted September 2026), pages 33, 34 and 39. A major application without
  pre-application consultation and an SCI is invalid.
review-status: unverified
field-status: {}
