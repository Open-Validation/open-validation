reference: condition-of-trees
local-authority: ROS
required-if:
  application-type:
    in:
    - consent-under-tpo
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Sufficient evidence to support the case for works to trees protected by a TPO in the form
  of a report from a qualified expert or diagnostic information.
must-include:
- item: Full details of the condition of the trees and/or the damage they are causing
  level: must
- item: Pests, diseases or fungi requiring the work described in written evidence or diagnostic information
    from an arboriculturist or other expert
  level: must
- item: Arboricultural evidence where the tree is said to have defects of concern for its future safe
    retention
  level: must
confidence: medium
notes: From the council's list (adopted September 2026), page 8. Missing evidence may lead to the application
  being invalidated, rejected or refused.
review-status: unverified
field-status: {}
