reference: biodiversity-survey-report
local-authority: ROS
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development might affect protected or priority species, or protected species are
        known to be present.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - sssi-impact-risk-zone
      - local-wildlife-site
      - ancient-woodland
      - priority-habitat
      description: Affects Special Areas of Conservation, Special Protection Areas, SSSIs (including their
        impact risk zones), Biological Heritage Sites, Important Wildlife Sites, Ancient Woodland or priority
        habitats.
  - condition:
      field: irreplaceable-habitat
      value: true
      description: Other irreplaceable habitats.
  - condition:
      field: near-woodland
      value: true
      description: Woodland areas.
  - condition:
      field: pond-on-or-near-site
      value: true
      description: Any water body, pond, ditch or similar feature.
  - condition:
      field: near-watercourse
      value: true
      description: In or within 200m of rivers, streams, canals, lakes, reed beds or other aquatic habitats.
  - condition:
      field: demolition
      value: true
      description: Demolition of existing buildings.
  - condition:
      field: potential-roost-features
      value: true
      description: Conversion or modification of buildings or structures on the Appendix B trigger list.
  - condition:
      field: hedgerows-affected
      value: true
      description: Felling, removal or lopping of field hedgerows or lines of trees.
  - condition:
      field: veteran-trees
      value: true
      description: Felling, removal or lopping of old and veteran trees.
  - condition:
      field: geodiversity-interest
      value: true
      description: Geological Heritage Sites.
  - condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Conservation of Habitats and Species Regulations 2017 (Habitats Regulations)
source-text: An ecological assessment report shall be submitted for all proposals where the development
  of the site might affect protected or priority species and/or habitats, Special Areas of Conservation,
  Special Protection Areas, Sites of Special Scientific Interest (including developments in their impact
  risk zones), nationally / internationally / European designated sites, Biological Heritage Sites, Important
  Wildlife Sites, Ancient Woodland or other irreplaceable habitats, woodland areas, any water body, pond
  ditch, or other similar feature. This includes the conversion or demolition of existing buildings.
must-include:
- item: Details of the appointed ecologist, showing their competence
  level: must
- item: Confirmation that surveys were undertaken or updated within the last 3 years
  level: must
- item: A detailed survey method; detailed results and an evaluation of the ecological interest
  level: must
- item: An assessment of likely impacts, and proposals to avoid, mitigate or compensate for them, with
    full mitigation identified and justified
  level: must
- item: 'For European Protected Species (e.g. bats, otters, great crested newts): the information needed
    to address the three licensing tests of the Habitats Regulations'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: European Protected Species are affected.
- item: 'Protected species survey (Appendix B, Table 1): which species are present and roughly how many,
    and their distribution and use of the site, carried out at an appropriate time of year using nationally
    recognised methods'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Proposals on the Appendix B trigger list.
  source-text: If the application involves any of the development proposals shown in Table 1 (Column 1),
    a protected species survey and assessment must be submitted with the application.
- item: 'Designated sites and priority habitats survey (Appendix B, Table 2): habitats and features present,
    their extent, mapped on an appropriate scale plan, with the likely change in area of priority habitat'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - local-wildlife-site
      - ancient-woodland
      - priority-habitat
      description: Designated sites or priority habitats are likely to be affected.
  source-text: If the application is likely to affect any of the designated sites, priority habitats or
    biodiversity features listed in Table 2 a survey and assessment for the relevant feature must be submitted
    with the application.
- item: 'Where harm is likely: how alternatives were considered, and how effects are avoided, mitigated
    or compensated'
  level: must
- item: 'Demolition in a Conservation Area: an ecological survey and report including, where necessary,
    a bat survey'
  level: must
  required-if:
    all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building or structure.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
confidence: medium
notes: From the council's list (adopted September 2026), pages 23, 24, 49 and 54. Appendix B gives the
  trigger lists. 'Each case' judgements (e.g. quarries, cliff faces, floodlighting near woodland or water)
  show as 'check'. Where an applicant thinks no bat survey is needed but a building could support bats,
  the council may ask for photographs or an ecologist's confirmation at validation. Appendix B allows
  exceptions (e.g. written pre-application confirmation from the council or Natural England).
review-status: unverified
