reference: bng-metric
local-authority: ROS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The permission would be subject to the general biodiversity gain condition.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended by the Biodiversity Gain (Town and Country Planning) (Modifications and Amendments) (England)
  Regulations 2024)
source-text: Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information
must-include:
- item: Completed metric calculation tool showing the pre-development biodiversity value on the date of
    application (or earlier date), with the publication date and version of the metric used
  level: must
- item: 'Where onsite habitat has been degraded: the value immediately before the degradation, with supporting
    evidence'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded before the date of application.
- item: Statutory Biodiversity Metric or Statutory Small Site Metric with no red boxes (exceptions may
    apply for bespoke compensation for irreplaceable habitats)
  level: should
  source-text: The Statutory Biodiversity Metric or Statutory Small Site Biodiversity Metric (for minor
    developments not impacting any Irreplaceable or Priority Habitats) should not have any red boxes
- item: Geographical information system (GIS) files showing the extent of the habitats in the metric,
    where possible
  level: should
  source-text: geographical information system files showing the extent of the habitats identified in
    the biodiversity metric where possible
confidence: medium
notes: From the council's list (adopted September 2026), pages 9, 19 and 20. Required by law where the
  biodiversity gain condition applies; householder and other exempt applications are exempt. The council's
  extra local requirements (a draft Biodiversity Gain Plan and a draft Habitat Management and Monitoring
  Plan, section 7 of the local list) are in the unmapped list.
review-status: unverified
field-status: {}
