reference: recreation-facilities-assessment
local-authority: ROS
required-if:
  site:
    in:
    - open-space
    description: Applications affecting playing field land.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Sport England playing fields policy
source-text: For planning applications affecting playing field land it is necessary to provide sport-specific
  information in line with the list below.
must-include:
- item: Extent of playing field to be lost (in hectares), the reason for the chosen location and an appraisal
    of alternatives
  level: must
- item: Proposed changes to indoor and outdoor sports facilities on the site, with layout and elevation
    drawings of new, extended or enhanced facilities
  level: must
- item: Appraisal of current and recent users and their use; fit with any assessment of need or sports
    strategy (with a copy); benefit to sport
  level: must
- item: Specification of ancillary facilities such as floodlights, and of any artificial grass pitch with
    the reason for the surface type
  level: must
- item: How any replacement playing field and ancillary facilities will be delivered (and when), and how
    equivalent or better quality will be achieved and maintained, with a management and monitoring plan
  level: must
confidence: medium
notes: From the council's list (adopted September 2026), page 33. The list's 'Sports / Playing Field Land'
  information, for Sport England.
review-status: unverified
field-status: {}
