submission-standards:
- item: All plans and drawings must include a unique drawing number (including revision number) and unique
    title
  level: must
- item: Plans submitted electronically must be in PDF format, with file names in the format DrawingNumber_RevisionNumber_DrawingTitle.PDF;
    other filename formats cannot be accepted
  level: must
- item: The drawing number, revision number and drawing title in the filename must be exactly the same
    as those stated on the plan / drawing
  level: must
- item: All applications accompanied by a list of submitted drawings (drawing register sheet), showing
    the drawing number, revision number and drawing title
  level: must
- item: Plans provided at the stated scale including the paper size (e.g. 1:200 at A1), accurately showing
    the direction of north (where appropriate)
  level: should
