review-status: unverified
validation-list:
  url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
  date: 2026-09
  date-basis: 'cover: ''Validation Checklist for Applications Submitted to the Local Planning Authority
    Adopted September 2026'' (PDF created 23 September 2026). On 2026-11-06 the council''s ''Apply for
    Planning permission'' page (https://www.rossendale.gov.uk/planning-building-control/planning/2) links
    this file as its ''re-published Validation Checklist''; the ''Planning downloads'' page''s other checklist
    link (/downloads/file/13534) serves a byte-identical copy, and no newer list or consultation was found.'
  status: current
submission-standards:
- item: All plans and drawings drawn to an identified scale stated on each plan; site and location plans
    show the direction of north
  level: must
- item: A linear scale bar is useful, particularly for electronic submissions
  level: should
- item: All plans and drawings include a unique drawing number (including revision number) and unique
    title
  level: must
- item: Plans submitted electronically are PDFs named DrawingNumber_RevisionNumber_DrawingTitle.PDF; other
    filename formats cannot be accepted
  level: must
- item: The drawing number, revision number and title in the filename exactly match those on the plan;
    any discrepancy makes the application invalid
  level: must
- item: All applications accompanied by a list of submitted drawings (drawing register sheet) giving drawing
    number, revision number and title
  level: must
- item: Plans provided at the stated scale including the paper size (e.g. 1:200 at A1), accurately showing
    north where appropriate
  level: should
- item: Reports, surveys and assessments up to date and still valid when the application is submitted
  level: must
- item: Documents with commercially sensitive or personal information submitted twice, one copy redacted
    for publication (with an executive summary where sections are exempt)
  level: should
- item: Plans submitted for illustrative purposes with outline applications clearly marked 'Illustrative'
  level: should
- item: 'Paper applications: only 1 paper copy is required'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current Rossendale checklist (text says ''Adopted September 2026'').
    The extraction is poor: Householder is marked ''(none)'' despite a dedicated Appendix A checklist,
    LDC requirements are filed under Listed building consent, many triggers quote the wrong text, and
    requirements such as the Climate Change Statement, Coal Mining Risk Assessment, Crime Impact Statement
    and Wind Energy items are missing. Fixed 2026-11-05: every file was rewritten from the council''s
    latest list.'
