reference: location-plan
local-authority: ROS
required-if:
  always: true
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: As a minimum, a ‘location plan’ that shows the application site in relation to the surrounding
  area will need to accompany a planning application
must-include:
- item: Based on an up-to-date Ordnance Survey map, typically at 1:1250 or 1:2500
  level: must
- item: Scaled to fit on A4 or A3 paper wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from the highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: Any other land owned by the applicant close to or adjoining the site edged blue
  level: should
- item: 'Dropped kerb applications: the red edge covers the site boundaries and extends to the pavement
    and kerb to be dropped'
  level: should
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A dropped kerb (new vehicle crossing) application.
  source-text: The red edge provided on the plan should cover the 5 boundaries of the site and extend
    to cover the pavement and kerb to be dropped.
- item: Land within the public highway, or land outside the applicant's ownership crossed by non-mains
    drainage pipework, included in the red edge where possible
  level: should
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Non-mains drainage pipework crosses land outside the applicant's ownership.
  source-text: If the development proposes connection to non-mains drainage requiring pipework to cross
    land outside the applicant’s ownership, the land in question must be included in the red edge where
    possible
confidence: medium
notes: From the council's list (adopted September 2026), pages 6 and 11. Not needed for section 73 or
  section 73A(2)(c) applications (footnote 1). Lawful development certificate applications need a plan
  identifying the land, at an identified scale with north shown (article 39 of the DMPO).
review-status: unverified
field-status: {}
