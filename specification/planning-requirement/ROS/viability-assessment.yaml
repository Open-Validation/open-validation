reference: viability-assessment
local-authority: ROS
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The application would not provide the obligations, affordable housing, contributions
      or infrastructure that policy requires.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Where an application is submitted which would fail to provide the obligations, affordable
  housing or other contributions required by policy, or the necessary infrastructure provision (public
  open space, sport or leisure facilities/ education contributions, off-site highway improvements if required)
must-include:
- item: Value of the land (3 different estate agents' valuations)
  level: must
- item: Abnormal development costs and construction costs
  level: must
- item: Price a Registered Provider will pay for the units (for affordable housing)
  level: must
- item: Open market value of the dwellings or of the development; developer return
  level: must
- item: Details of the proposed obligations or scheme elements to be included (e.g. open space)
  level: must
- item: 'Three scenarios: no financial obligations; fully policy-compliant obligations; the scheme as
    proposed'
  level: must
- item: In line with the RICS guidance note 'Assessing viability in planning under the National Planning
    Policy Framework 2019 for England' (1st edition, March 2021) or later amendments
  level: must
- item: 'Commercially sensitive information: two copies, one redacted for publication (with an executive
    summary)'
  level: should
confidence: medium
notes: From the council's list (adopted September 2026), page 37. An independent assessor is appointed
  at the applicant's cost.
review-status: unverified
field-status: {}
