  level: must
- item: 'Major applications: the Lancashire Sustainable Drainage Systems (SuDS) pro-forma'
  level: must
  required-if:
    ref: major-development
  source-text: For major applications, the Lancashire Sustainable Drainage Systems (SuDS) pro-forma must
    be submitted
- item: 'Where connecting to the existing system: the existing system and the proposed drainage within
    the site shown on the drawings'
  level: should
- item: 'Disposal of surface water run-off: location of any existing drains used; for SuDS, enough engineering,
    geotechnical and hydrological information to show feasibility'
  level: should
