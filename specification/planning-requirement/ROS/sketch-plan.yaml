reference: sketch-plan
local-authority: ROS
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: A sketch plan clearly identifying the trees subject to the application (the plan should also
  identify other trees on the site clearly marked that they are not subject to the application).
must-include:
- item: Trees subject to the application clearly identified and numbered (individually or in groups);
    other trees marked as not subject to it
  level: must
- item: Site boundaries, adjacent properties (with house names/numbers), distances between the trees and
    nearby features, a north arrow, and the position of the trees in relation to nearby buildings
  level: should
- item: 'Where individual trees in a woodland or group cannot be identified: their approximate location
    marked'
  level: should
confidence: medium
notes: From the council's list (adopted September 2026), page 8. Uses MHCLG's retired 'sketch-plan' id.
  Appendix C shows an example.
review-status: unverified
field-status: {}
