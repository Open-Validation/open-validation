reference: travel-plan
local-authority: ROS
required-if:
  any:
  - condition:
      field: convenience-retail-floorspace
      operator: '>'
      value: 800
      description: Food retail over 800 sq m GFA.
  - condition:
      field: comparison-retail-floorspace
      operator: '>'
      value: 1500
      description: Non-food retail over 1500 sq m GFA.
  - all:
    - condition:
        field: use-class
        value: financial-professional-services
        description: Financial and professional services.
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: Financial and professional services over 2500 sq m GFA.
  - all:
    - condition:
        field: use-class
        value: restaurant-cafe
        description: Restaurants and cafes.
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: Restaurants and cafes over 2500 sq m GFA.
  - all:
    - condition:
        field: use-class
        value: drinking-establishment
        description: Drinking establishments.
    - condition:
        field: floorspace
        operator: '>'
        value: 600
        description: Drinking establishments over 600 sq m GFA.
  - all:
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Hot food takeaway.
    - condition:
        field: floorspace
        operator: '>'
        value: 500
        description: Hot food takeaway over 500 sq m GFA.
  - condition:
      field: class-eg-floorspace
      operator: '>'
      value: 2500
      description: Business over 2500 sq m GFA.
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 4000
      description: General industrial over 4000 sq m GFA.
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 5000
      description: Storage or distribution over 5000 sq m GFA.
  - all:
    - condition:
        field: hotel-development
        value: true
        description: Hotels.
    - condition:
        field: bedroom-count
        operator: '>'
        value: 100
        description: Hotels with over 100 bedrooms.
  - all:
    - condition:
        field: use-class
        value: hospital-nursing-home
        description: Hospitals and nursing homes with.
    - condition:
        field: residential-capacity
        operator: '>'
        value: 50
        description: Hospitals and nursing homes with over 50 beds.
  - all:
    - condition:
        field: use-class
        value: residential-education
        description: Residential education with.
    - condition:
        field: residential-capacity
        operator: '>'
        value: 150
        description: Residential education with over 150 students.
  - all:
    - condition:
        field: use-class
        value: institutional-hostel
        description: Institutional hostels with.
    - condition:
        field: residential-capacity
        operator: '>'
        value: 400
        description: Institutional hostels with over 400 residents.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: Over 80 dwellings.
  - all:
    - condition:
        field: use-class
        value: former-d1
        description: Non-residential institutions.
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: Non-residential institutions over 1000 sq m GFA.
  - all:
    - condition:
        field: use-class
        value: former-d2
        description: Assembly and leisure.
    - condition:
        field: floorspace
        operator: '>'
        value: 1500
        description: Assembly and leisure over 1500 sq m GFA.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: NPPF
source-text: 'A guide to when Transport Assessments will be required is given below:'
must-include:
- item: Opportunities for promoting and delivering sustainable transport (walking, cycling, public transport)
    to reduce reliance on the car
  level: should
confidence: medium
notes: From the council's list (adopted September 2026), page 35. Uses the table's 'Transport Assessment
  and Travel Plan' column. The thresholds come from the council's table on page 36, which 'are for guidance
  purposes and should not be read as absolutes'; the level of assessment is agreed with the council and
  Lancashire County Council, so other cases show as 'check'.
review-status: unverified
field-status: {}
