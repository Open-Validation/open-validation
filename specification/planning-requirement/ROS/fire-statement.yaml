reference: fire-statement
local-authority: ROS
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: developers are now required to submit a fire statement for “relevant buildings ... “Relevant
  buildings” contain two or more dwellings or educational accommodation and meet the height condition
  of 18 metres or more in height, or seven or more storeys.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: Fire safety principles, concepts and approach applied to each building; site layout; emergency
    vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and the account taken of it; how fire safety policies in local
    development documents have been considered
  level: must
confidence: medium
notes: From the council's list (adopted September 2026), pages 12 and 13.
review-status: unverified
field-status: {}
