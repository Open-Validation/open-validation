reference: affordable-housing-statement
local-authority: ROS
required-if: discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Affordable Housing Statement For housing schemes which require an element of affordable housing
  in accordance with policy, the planning submission will be required to detail how the required percentage
  of affordable housing will be achieved on site, the tenure of the proposed affordable units, the number
  of bedrooms of the proposed affordable units and details of the Registered Provider or Housing Association
  who will manage the affordable units (if applicable).
must-include:
- item: How the required percentage of affordable housing will be achieved on site
  level: must
- item: The tenure of the proposed affordable units
  level: must
- item: The number of bedrooms of the proposed affordable units
  level: must
- item: Details of the Registered Provider or Housing Association who will manage the affordable units
    (if applicable)
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. For housing schemes
  that require affordable housing under policy; the list gives no threshold here.
