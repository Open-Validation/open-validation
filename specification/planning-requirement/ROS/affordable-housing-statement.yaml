reference: affordable-housing-statement
local-authority: ROS
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing schemes.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: For housing schemes which require an element of affordable housing in accordance with policy
must-include:
- item: How the required percentage of affordable housing will be achieved on site
  level: must
- item: Tenure and number of bedrooms of the affordable units
  level: must
- item: The Registered Provider or Housing Association that will manage the units (if applicable)
  level: must
- item: How the proposed tenure responds to local needs
  level: should
confidence: medium
notes: From the council's list (adopted September 2026), page 18. Shows as 'check' because it depends
  on the affordable housing policy threshold, which the list does not give.
review-status: unverified
field-status: {}
