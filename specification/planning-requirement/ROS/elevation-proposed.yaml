reference: elevation-proposed
local-authority: ROS
required-if:
  any:
  - application-type:
      in:
      - hh
  - application-type:
      in:
      - lbc
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
  - condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: the following plans and drawings may be required in support of the application depending
  on the development proposed.
must-include:
- item: Drawn at 1:50 or 1:100, clearly showing the proposed works in relation to what is already there
  level: should
- item: All sides of the proposal, including blank elevations
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: should
- item: Metric dimensions of the proposal clearly shown
  level: must
- item: 'Listed building consent: existing and proposed elevations at 1:100 or 1:200'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Existing and proposed elevation plans at a scale of 1:100 or 1:200
- item: 'Telecommunications: elevation plan at 1:50/1:100 showing the height and design of the structure'
  level: must
  required-if:
    condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
- item: 'Wind energy: elevation plans of turbines and ancillary equipment at 1:50 or 1:100'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
- item: 'Householder microgeneration equipment or wind turbines: elevations at 1:50/1:100'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: renewable-energy-development
        value: true
        description: Domestic microgeneration equipment or wind turbines.
confidence: medium
notes: From the council's list (adopted September 2026), pages 6, 16 and 35. Appendix A (Householder Applications
  Checklist) lists it for householder applications; for other applications the list says plans 'may be
  required ... depending on the development proposed', so they show as 'check'. Listed building consent,
  telecommunications and wind energy applications list elevations outright.
review-status: unverified
field-status: {}
