reference: arboriculturist-report
local-authority: ROS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Proposals with the potential to impact on trees within or adjacent to the site.
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building or structure.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: BS 5837:2012 Trees in relation to design, demolition and construction
source-text: For proposals which have the potential to impact on trees (either within the application
  site or adjacent to the application site) the planning application shall be accompanied by a Tree Survey.
must-include:
- item: A plan of all trees and vegetation within or adjacent to the site, with species, height and canopy
    diameter
  level: must
- item: Which trees and vegetation will be retained, and which will be removed, with justification
  level: must
- item: A tree constraints plan, a tree retention plan and a root protection plan to BS 5837:2012
  level: must
confidence: medium
notes: From the council's list (adopted September 2026), pages 22 and 37. The list's 'Tree Survey'; Appendix
  A lists it for householders where relevant.
review-status: unverified
field-status: {}
