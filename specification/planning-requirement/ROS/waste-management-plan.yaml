reference: waste-management-plan
local-authority: ROS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates new dwellings.
  - condition:
      field: residential-extension
      value: true
      description: An extension to an existing dwelling.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New retail, business or industrial development.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Waste Management Strategy (Bin store/refuse disposal/recycling details) All proposals which
  will include the creation new dwellings or extensions to existing ones, or new retail, business, industrial
  developments will be required to submit details of the proposed facilities for the storage & collection
  of refuse, as well as for the provision of recycling facilities.
confidence: medium
review-status: unverified
field-status: {}
