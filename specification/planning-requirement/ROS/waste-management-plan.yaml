reference: waste-management-plan
local-authority: ROS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
  - condition:
      field: residential-extension
      value: true
      description: Extensions to existing dwellings.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 0
      description: New retail development.
  - condition:
      field: office-floorspace
      operator: '>'
      value: 0
      description: New business development.
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 0
      description: New industrial development.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: All proposals which will include the creation new dwellings or extensions to existing ones,
  or new retail, business, industrial developments will be required to submit details of the proposed
  facilities for the storage & collection of refuse, as well as for the provision of recycling facilities.
must-include:
- item: Facilities for the storage and collection of refuse, and for recycling
  level: must
- item: 'Hot food takeaways: litter bins and a litter picking regime'
  level: must
  required-if:
    condition:
      field: use-class
      value: hot-food-takeaway
      description: A hot food takeaway.
  source-text: Hot food takeaways should indicate the provision of litter bins along with a regime for
    litter picking associated with the hot food takeaway use.
confidence: medium
notes: From the council's list (adopted September 2026), page 38. The list's 'Waste Management Strategy
  (Bin store/refuse disposal/recycling details)'.
review-status: unverified
field-status: {}
