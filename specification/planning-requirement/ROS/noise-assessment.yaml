reference: noise-assessment
local-authority: ROS
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals likely to generate noise.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Close to noise sensitive areas (e.g. residential areas).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development in an area of noisy development (e.g. next to a railway
        line or motorway).
  - condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: Proposals which are likely to generate noise located close to noise sensitive areas (e.g.
  close to residential areas) are required to be accompanied by a Noise Impact Assessment. The assessment
  shall indicate the levels of noise expected to be created and methods for mitigating any impact. Similarly
  proposals for noise sensitive developments within areas of noisy development (e.g. adjacent to a railway
  line / motorway) will be required to detail measures to protect the new development from noise.
must-include:
- item: Levels of noise expected to be created and methods for mitigating any impact
  level: must
- item: 'Noise sensitive development: measures to protect it from noise'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development.
- item: 'Wind energy: plan of occupied buildings within ten times turbine height; site-specific noise
    assessments showing compliance with ETSU-R-97; shadow flicker report on occupied properties and bridleway
    users within ten times turbine height, with mitigation'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  source-text: For all wind energy applications the Council will expect that a plan is submitted which
    identifies any occupied buildings situated within a radius of ten times turbine height from the centre
    of the proposed turbine.
confidence: medium
notes: From the council's list (adopted September 2026), pages 29 and 42. Wind energy applications need
  a Noise & Shadow Flicker Assessment.
review-status: unverified
field-status: {}
