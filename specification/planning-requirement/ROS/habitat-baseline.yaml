reference: habitat-baseline
local-authority: ROS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The permission would be subject to the general biodiversity gain condition.
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended by the Biodiversity Gain (Town and Country Planning) (Modifications and Amendments) (England)
  Regulations 2024)
source-text: Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information
must-include:
- item: A plan drawn to an identified scale, showing the direction of North, of onsite habitat existing
    on the date of application (or earlier date), including any irreplaceable habitat
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat exists on the site.
confidence: medium
notes: From the council's list (adopted September 2026), page 13. Required by law where the biodiversity
  gain condition applies; householder and other exempt applications are exempt. The council's extra local
  requirements (a draft Biodiversity Gain Plan and a draft Habitat Management and Monitoring Plan, section
  7 of the local list) are in the unmapped list.
review-status: unverified
field-status: {}
