reference: elevation-existing
local-authority: ROS
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building or structure.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: the following plans and drawings may be required in support of the application depending
  on the development proposed. ... Floor Plans and Elevations of the building / structure to be demolished
must-include:
- item: Drawn at 1:50 or 1:100, clearly showing the proposed works in relation to what is already there
  level: should
- item: All sides of the proposal, including blank elevations
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: should
- item: Metric dimensions of the proposal clearly shown
  level: must
- item: 'Listed building consent: existing and proposed elevations at 1:100 or 1:200'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Existing and proposed elevation plans at a scale of 1:100 or 1:200
confidence: medium
notes: From the council's list (adopted September 2026), pages 6, 16 and 22. Appendix A (Householder Applications
  Checklist) lists it for householder applications; for other applications the list says plans 'may be
  required ... depending on the development proposed', so they show as 'check'. Listed building consent
  and demolition in a Conservation Area list elevations outright.
review-status: unverified
field-status: {}
