reference: design-and-access-statement
local-authority: ROS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the householder plan list. From the audit: National
  requirement 5, major development, Conservation Area 1+ dwelling or 100sqm, and LBC.'
review-status: unverified
field-status: {}
