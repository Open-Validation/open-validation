reference: design-and-access-statement
local-authority: ROS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'a Design and Access Statement is a national requirement for the following types of applications:
  - Applications for major development.2 - Applications for development in a Conservation Area, where
  the proposed development consists of: o One or more dwellings; or o A building or buildings with a floor
  space of 100 square metres or more. - Applications for listed building consent.'
must-include:
- item: Explains the design principles and concepts applied to the development
  level: must
- item: Demonstrates the steps taken to appraise the context of the development and how the design takes
    it into account
  level: must
- item: Explains the policy adopted as to access, and how access policies in relevant local development
    documents have been taken into account
  level: must
- item: States what consultation has been undertaken on access and what account has been taken of it;
    explains how specific access issues have been addressed
  level: must
- item: Includes any alternative options considered and discounted
  level: must
confidence: medium
notes: From the council's list (adopted September 2026), page 12. Not required for section 73 applications,
  article 20(1)(b) or (c) applications, engineering or mining operations, or a material change of use.
review-status: unverified
field-status: {}
