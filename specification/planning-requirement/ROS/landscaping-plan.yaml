reference: landscaping-plan
local-authority: ROS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New housing schemes.
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: For certain proposals, including new housing schemes, the following plans will be required
  to enable a full assessment of the proposals.
must-include:
- item: All existing trees and those to be removed; existing and proposed ground cover planting; size,
    species, density and position of proposed trees and shrubs; existing and proposed hardstanding and
    parking areas
  level: must
- item: Landscape strategy for especially complex or phased developments
  level: should
  required-if: discretionary
  source-text: Landscape strategies may be required for especially complex or phased developments where
    an overview or framework is needed.
confidence: medium
notes: From the council's list (adopted September 2026), pages 17 and 27. One of the 'Additional Plans';
  'certain proposals' other than new housing show as 'check'. Appendix A lists it for householder applications
  where relevant. The Landscape and Visual Impact Assessment (section 19) is in the unmapped list.
review-status: unverified
field-status: {}
