source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: NPPF
source-text: The NPPF sets out that all developments that generate significant amounts of transport movement
  should be supported by a Transport Statement or Transport Assessment.
must-include:
- item: Proportionate to the size and scope of the development, building on existing information
  level: should
- item: 'Wind energy: lorry and crane movements and routes; measures for oversize loads; design, construction,
    permanence and materials of access tracks; crane hard standings; on-site concrete mixing and disposal;
    construction compound; electricity transmission equipment; construction hours'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  source-text: Applications involving wind power require the following information in the Transport Statement
- item: Regard had to the Hyndburn & Rossendale Local Cycling and Walking Infrastructure Plan (LCWIP)
  level: should
confidence: medium
notes: From the council's list (adopted September 2026), pages 35 and 37. Covers Transport Statements
  (the lower thresholds) and Transport Assessments. The thresholds come from the council's table on page
  36, which 'are for guidance purposes and should not be read as absolutes'; the level of assessment is
  agreed with the council and Lancashire County Council, so other cases show as 'check'.
review-status: unverified
field-status: {}
