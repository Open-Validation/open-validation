reference: planning-statement
local-authority: ROS
required-if:
  any:
  - ref: major-development
  - condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
source-text: For major planning applications a Planning Statement will be required as part of the submission.
must-include:
- item: An explanation of and justification for the proposals in the context of relevant national and
    local planning policies
  level: must
- item: 'Lawful development certificates: a statement of the grounds on which the certificate is sought'
  level: should
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
confidence: medium
notes: From the council's list (adopted September 2026), pages 6 and 31. Minor applications that are likely
  to be controversial ('may also be useful') and lawful development certificates (evidence that 'may include'
  one) show as 'check'. Wind energy applications need a Planning Statement/Heritage Statement.
review-status: unverified
field-status: {}
