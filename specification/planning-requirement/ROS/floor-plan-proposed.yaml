reference: floor-plan-proposed
local-authority: ROS
required-if:
  any:
  - application-type:
      in:
      - hh
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: the following plans and drawings may be required in support of the application depending
  on the development proposed.
must-include:
- item: Drawn at 1:50 or 1:100, explaining the proposal in detail, with existing and proposed buildings
  level: should
- item: Buildings or walls to be demolished clearly shown
  level: should
- item: New buildings shown in context with adjacent buildings (including property numbers)
  level: should
- item: Metric dimensions of the proposal clearly shown
  level: must
- item: 'Lawful development certificates: proposed floor plans at not less than 1:100'
  level: should
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
confidence: medium
notes: From the council's list (adopted September 2026), page 16. Appendix A (Householder Applications
  Checklist) lists it for householder applications; for other applications the list says plans 'may be
  required ... depending on the development proposed', so they show as 'check'.
review-status: unverified
field-status: {}
