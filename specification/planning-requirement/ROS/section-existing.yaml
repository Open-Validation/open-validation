reference: section-existing
local-authority: ROS
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
  - application-type:
      in:
      - hh
  - discretionary
source-url: https://www.rossendale.gov.uk/downloads/file/13886/planning-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings should
  be submitted to show both existing and finished levels ... This will be required for all applications
  involving new buildings.
must-include:
- item: Drawn at 1:50 or 1:100, with cross section(s) through the proposed building(s)
  level: should
- item: 'Where ground levels change: existing and finished levels, foundations and eaves, and how encroachment
    onto adjoining land is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Ground levels change.
- item: Existing site levels and finished floor levels related to a fixed datum point off site, with the
    proposals in relation to adjoining buildings
  level: should
- item: 'Householder development on sloping sites: how the proposal relates to existing ground levels,
    or where levels outside the extension would change'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (adopted September 2026), pages 6 and 16. Covers site sections and finished
  floor and site levels. Appendix A lists them for householder applications. Other cases show as 'check'.
review-status: unverified
field-status: {}
