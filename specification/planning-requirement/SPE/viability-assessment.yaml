reference: viability-assessment
local-authority: SPE
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The scheme proposes less affordable housing than the Council's policy requires.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy H2
source-text: Where it is proposed not to provide affordable housing in accordance with the Council's policy,
  a full viability appraisal must be submitted to demonstrate why it is not considered possible to achieve
  full policy compliance.
confidence: medium
notes: From the council's list (published June 2026), item 12 and note 1, page 20.
review-status: unverified
field-status: {}
