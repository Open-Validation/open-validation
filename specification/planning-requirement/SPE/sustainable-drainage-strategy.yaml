source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E3; Written Ministerial Statement 18/12/2014
source-text: All planning applications are required to demonstrate that they will not result in an increase
  in surface water run-off from the site ensuring the receiving drainage system is adequate to deal with
  flows from the site.
must-include:
- item: No increase in surface water run-off from the site, and a receiving drainage system adequate for
    the flows
  level: must
- item: The council's pro forma (Sustainable Urban Drainage Statement) completed
  level: must
