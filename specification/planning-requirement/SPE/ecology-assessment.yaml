reference: ecology-assessment
local-authority: SPE
required-if:
  any:
  - all:
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: roof-alteration
          value: true
          description: Works in the roof space.
    - condition:
        field: protected-species
        value: true
        description: Buildings which may be used by bats.
  - discretionary
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E2
source-text: Where the development would affect natural or semi- natural habitats. For the demolition
  or works in the roof space of buildings which may be used by bats.
must-include:
- item: 'Habitat and species surveys identified by the PEA: presence/absence, population levels, likely
    impacts and a scheme of mitigation and compensation'
  level: must
- item: The CIEEM/ALGE EcIA checklist
  level: must
- item: Measurable biodiversity net gain outlined in the assessment
  level: must
- item: A Biodiversity Mitigation Plan where mitigation and compensation are proposed
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2026), item 17, page 9. The council calls it an Ecological
  Impact Assessment (EcIA). Development affecting natural or semi-natural habitats shows as 'check' (no
  field for it).
review-status: unverified
field-status: {}
