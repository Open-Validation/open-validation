reference: arboriculturist-report
local-authority: SPE
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site, or on adjacent land (including street trees), that could influence
      or be affected by the development.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS3; BS 5837
source-text: Where there are trees within the application site or on land adjacent to it that could influence
  or be affected by the development (including street trees).
must-include:
- item: A survey of all trees on the site, with species and quality
  level: must
- item: Root protection zones
  level: must
- item: Trees to be felled and retained
  level: must
- item: Protective fencing to be put up during construction
  level: must
- item: The route of any service trench close to the canopy spread of retained trees
  level: must
- item: Prepared by a qualified arboriculturist, following BS 5837
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 30 and note 21, page 14, 27.
review-status: unverified
field-status: {}
