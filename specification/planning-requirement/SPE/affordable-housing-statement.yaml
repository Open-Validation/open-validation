reference: affordable-housing-statement
local-authority: SPE
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy H2
source-text: Applications for 10 or more dwellings.
must-include:
- item: The number of affordable and market homes
  level: must
- item: The mix of units, with numbers of habitable rooms and bedrooms, and the gross internal floorspace
    of all residential units and communal areas
  level: must
- item: Plans showing the location of units, their habitable rooms and/or bedrooms and gross internal
    floor area
  level: must
- item: Any different levels or types of affordability or tenure for different units, clearly set out
    and justified
  level: must
- item: Any Registered Providers acting as partners in the development
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 12 and note 1, page 6, 20. The council calls
  it an Affordable Housing Viability Statement. Policy requires at least 30% affordable housing on schemes
  of 10 or more (net), and at least 50% on greenfield sites.
review-status: unverified
field-status: {}
