reference: air-quality-assessment
local-authority: SPE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential uses of 1,000 sq m.
  - discretionary
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E4
source-text: Applications for 10 or more dwellings, or non-residential uses of 1000sq m, or those which
  generate significant levels of pollution, increase traffic volumes or congestion or involve development
  sensitive to poor air quality.
must-include:
- item: Impact of poor air quality on future occupants and the mitigation needed (for example mechanical
    ventilation with filtration)
  level: must
- item: Scope agreed beforehand with the council's Environmental Health Pollution Team
  level: should
- item: 'Construction phase: monitoring and mitigation to prevent dust and particulate pollution, and
    the impact of construction traffic on local air quality'
  level: must
- item: A Construction Management Plan and Demolition Method Statement
  level: must
- item: 'Demolition: surveys and measures to prevent pollution from asbestos removal'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: The development involves demolition.
- item: 'Point sources such as a CHP unit: why the equipment is necessary'
  level: must
  required-if:
    condition:
      field: biomass-or-chp
      value: true
      description: The proposal introduces a point source such as a Combined Heat and Power unit.
- item: Mitigation and compensation measures where the proposal could cause, worsen or introduce exposure
    to poor air quality
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 15 and note 2, page 7, 20-21. The whole borough
  is an Air Quality Management Area. Proposals that generate significant pollution, increase traffic or
  congestion, or are sensitive to poor air quality show as 'check'.
review-status: unverified
field-status: {}
