reference: flood-risk-assessment
local-authority: SPE
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2, 3 or 3b.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development created by new build or conversion.
      - condition:
          field: residential-extension
          value: true
          description: Residential extensions (in Flood Zone 3b).
  - site:
      in:
      - critical-drainage-area
      description: The site is in an area at risk of surface water flooding.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: The site is over 0.5 hectares.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.5
      description: The site is over 0.5 hectares.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres or more of floorspace.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
source-text: Residential development created by new build or conversion
confidence: low
notes: 'Audit (wrong_trigger): the excerpt was column headers. From the audit: Flood Zones 2/3/3b and
  surface-water risk areas, for new dwellings/conversions, residential extensions in FZ3b and sites over
  0.5ha / 10+ dwellings / 1,000 sq m. How the site-size thresholds combine with the locations needs checking
  in Item 19. Audit (other): the council page presents the June 2026 list as a consultation version (11
  June to 9 July 2026) and never says it has been adopted; adoption should be confirmed.'
review-status: unverified
