reference: cil-form
local-authority: SPE
required-if:
  always: true
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended); Spelthorne CIL Charging Schedule
source-text: All proposed development which may or may not be CIL liable.
must-include:
- item: 'Residential proposals: a completed CIL ''Planning Application Additional Requirement Form'''
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential proposals.
- item: Existing floor plans drawn to scale, to confirm the existing floorspace
  level: must
- item: Assumption of Liability Notice
  level: should
confidence: medium
notes: From the council's list (published June 2026), item 32, page 15.
review-status: unverified
field-status: {}
