reference: lighting-assessment
local-authority: SPE
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting provided or made necessary by a publicly accessible development.
    - discretionary
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E2
source-text: Application for floodlighting. ... Proposals involving the provision of publicly accessible
  developments, in the vicinity of residential property, a listed building or a conservation area, or
  open countryside, where external lighting would be provided or made necessary by the development, should
  be required to be accompanied by details of external lighting
must-include:
- item: Details of external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 22 and note 8, page 12, 25. Note 8's publicly
  accessible developments 'in the vicinity of' homes, listed buildings, conservation areas or countryside
  show as 'check'.
review-status: unverified
field-status: {}
