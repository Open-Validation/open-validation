reference: section-existing
local-authority: SPE
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The ground level slopes, is not uniform across the site, or is different to adjoining
        sites.
  - condition:
      field: roof-alteration
      value: true
      description: Roof extensions and/or dormer windows.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS2
source-text: All applications on sites where the ground level slopes or is not uniform across the site
  or is different to adjoining sites. Applications for roof extensions and/or dormer windows
must-include:
- item: Existing and proposed site sections and site levels at a scale of 1:50 or 1:100, or other scales
    by prior agreement
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 9, page 5.
review-status: unverified
field-status: {}
