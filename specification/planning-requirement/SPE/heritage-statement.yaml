reference: heritage-statement
local-authority: SPE
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      description: 'Related to, or impacting on the setting of, heritage assets: listed buildings, conservation
        areas (including extensions to properties in a conservation area) and locally listed buildings
        and structures.'
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS3
source-text: Applications for Listed Building or Conservation Area Consent. For all other applications
  either related to, or impacting on, the setting of heritage assets (including extensions to properties
  in a Conservation Area, works impacting Locally Listed buildings and structures or development in a
  Site of High Archaeological Potential).
must-include:
- item: The significance of the historic, archaeological and/or artistic interest of the heritage asset(s)
    affected, and the contribution of their setting
  level: must
- item: The impact of the proposals on the significance of the heritage asset
  level: must
- item: As a minimum, the relevant historic environment record consulted
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 21 and note 6, page 11-12, 23. Item 21 covers
  both the Heritage Statement and the Archaeological Assessment.
review-status: unverified
field-status: {}
