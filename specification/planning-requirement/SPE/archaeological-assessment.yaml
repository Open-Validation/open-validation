reference: archaeological-assessment
local-authority: SPE
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: Sites of High Archaeological Potential.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.4
        description: Sites of 0.4 ha or larger.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.4
        description: Sites of 0.4 ha or larger.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS3
source-text: Where an application includes, or is considered to have the potential to include, heritage
  assets with archaeological interest applicants should submit an appropriate desk-based assessment and,
  where desk– based research is insufficient to properly assess the interest, a field evaluation.
must-include:
- item: An appropriate desk-based assessment
  level: must
- item: A field evaluation where desk-based research is not enough to assess the interest
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2026), item 21 and note 6, page 11-12, 23. Item 21's 'geographic
  locations' column lists Sites of High Archaeological Potential and sites of 0.4 ha or larger.
review-status: unverified
field-status: {}
