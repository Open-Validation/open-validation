reference: fire-statement
local-authority: SPE
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: Applications which contain two or more dwellings or educational accommodation (i.e., residential
  accommodation for the use of students boarding at a boarding school or in later stages of education)
  and meet the height condition of 18m or more in height, or 7 or more storeys.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account was taken of it
  level: must
- item: How fire safety policies in local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 36, page 17-18.
review-status: unverified
field-status: {}
