reference: bng-metric
local-authority: SPE
required-if:
  always: true
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Environment Act 2021; Spelthorne Local Plan 2024-2039/40 (March 2026) policy E2
source-text: Submission of an up-to-date biodiversity net gain assessment including the calculation tool
  in excel format, showing how no net loss can be achieved and trading rules satisfied.
must-include:
- item: The calculation tool (statutory metric) in Excel format
  level: must
- item: At least 10% BNG on site
  level: must
- item: How no net loss can be achieved and the trading rules satisfied
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 38 and note 24, page 19, 28. Item 38 says 'All.'
  and does not mention the statutory exemptions. Self-build and custom housebuilding sites also need the
  council's proforma (listed as unmapped).
review-status: unverified
field-status: {}
