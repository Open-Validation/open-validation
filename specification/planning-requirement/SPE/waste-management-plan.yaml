reference: waste-management-plan
local-authority: SPE
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Flatted development of 10 units or more.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS2; Surrey Waste Local Plan 2020
source-text: For Major applications, i.e. 10 units or more, for flatted development.
must-include:
- item: How construction, demolition and excavation waste will be managed, maximising re-use and recycling
  level: must
- item: How the bin storage areas and collection points will operate and be managed for efficient collection
  level: must
- item: Plans with swept paths showing a refuse vehicle can turn within the site and exit in forward gear
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 27 and note 15, page 13, 26. The council calls
  it a Waste and Recycling Strategy. Note 15 also says proposed new development 'should be supported by
  site waste management plans' (volume and type of material, reuse and recovery, off-site disposal). Item
  25 (waste and recycling storage details for all new dwellings and commercial development) is listed
  as unmapped.
review-status: unverified
field-status: {}
