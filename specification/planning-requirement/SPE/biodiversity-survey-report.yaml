reference: biodiversity-survey-report
local-authority: SPE
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - special-protection-area
      description: The development is likely to affect a designated site (SSSI, SNCI or SPA).
  - ref: major-development
  - site:
      in:
      - priority-habitat
      description: Within 100m of, or likely to affect, a Priority Habitat.
  - condition:
      field: protected-species
      value: true
      description: Within 100m of, or likely to affect, a Priority Species.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E2
source-text: Where the development is likely to affect a designated site 1* or is classified as a major
  development or larger. Where the development is within 100m of or is likely to affect a Priority Habitat
  or Species
must-include:
- item: Up-to-date information on habitats on the site and links to other habitats, species present or
    likely, likely impacts, and mitigation and enhancement opportunities
  level: must
- item: Guidance on further survey requirements (for example bat surveys)
  level: must
- item: 'For all but the most minor applications: the results of a search from the Surrey Biodiversity
    Information Centre'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2026), item 16, page 8. The council calls it a Preliminary
  Ecological Appraisal (PEA).
review-status: unverified
field-status: {}
