reference: floor-plan-existing
local-authority: SPE
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Building work is proposed.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use is proposed.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS2
source-text: All applications where building work or a change of use is proposed.
must-include:
- item: At a scale of 1:50 or 1:100 (or other scales by prior agreement), clearly showing the proposed
    works in relation to what is already there
  level: must
- item: 'Where the proposal is liable to CIL: all internal dimensions clearly shown'
  level: must
  required-if: discretionary
- item: Annotated with the overall dimensions and height of each element and the distance to the adjoining
    boundaries
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 6, page 4.
review-status: unverified
field-status: {}
