reference: noise-assessment
local-authority: SPE
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Development that raises issues of disturbance by noise to the occupants of nearby existing
        buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development close to existing sources of noise.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E2
source-text: Applications for developments that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and which are close to existing sources of noise.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (published June 2026), item 23 and note 9, page 12, 25.
review-status: unverified
field-status: {}
