reference: land-contamination-assessment
local-authority: SPE
required-if:
  any:
  - condition:
      field: previously-developed-land
      value: true
      description: Development on or adjacent to land previously in industrial or commercial use, or former
        or active landfill.
  - site:
      in:
      - contaminated-land
      description: Development on or adjacent to land known to be affected by contamination.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
source-text: Land Contamination assessment Applications where the development is for new housing or other
  forms of development which are particularly sensitive to contamination, and/or which propose development
  on or adjacent to land that has been subject to previous industrial or commercial uses, former landfill
  sites, active landfill sites or other land known to be affected by contamination must include an appropriate
  assessment of land contamination risk…
confidence: low
notes: 'Audit (wrong_app_type): not a minerals and waste item. From the audit: Item 18 applies to development
  on or next to previously developed or contaminated land, and to 10+ dwellings. Audit (other): the council
  page presents the June 2026 list as a consultation version (11 June to 9 July 2026) and never says it
  has been adopted; adoption should be confirmed.'
