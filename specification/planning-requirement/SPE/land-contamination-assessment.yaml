reference: land-contamination-assessment
local-authority: SPE
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: On or next to land previously in industrial or commercial use, or other land known
        to be affected by contamination.
  - site:
      in:
      - near-landfill-site
      description: On or next to former or active landfill sites.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development particularly sensitive to contamination (note 7).
  - discretionary
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy E4
source-text: Applications which propose development on or adjacent to land that has been subject to previous
  industrial or commercial uses, former landfill sites, active landfill sites or other land known to be
  affected by contamination. All applications proposing 10 or more dwellings.
must-include:
- item: Phase 1 desk study of former uses of the site and adjacent sites, with a Conceptual Site Model
    (each source, pathway and receptor) and a schematic diagram
  level: must
- item: Evidence of a site walkover/visit in the Phase 1 report
  level: must
- item: A method statement for a site investigation to characterise land and/or groundwater contamination
    or ground gas
  level: must
- item: Enough information to determine whether contamination exists, its nature, the risks and whether
    they can be reduced to an acceptable level
  level: must
- item: 'Demolition or removal of asbestos-containing materials: surveys and measures to prevent pollution
    from asbestos removal'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition works or removal of asbestos-containing materials.
confidence: medium
notes: From the council's list (published June 2026), item 18 and note 7, page 9, 24. Note 7 also covers
  new housing and other sensitive development, and says other applications may need one depending on how
  likely contamination is ('check').
review-status: unverified
field-status: {}
