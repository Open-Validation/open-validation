reference: elevation-proposed
local-authority: SPE
required-if:
  all:
  - condition:
      field: building-works
      value: true
      description: Building work is proposed.
  - condition:
      field: external-alterations
      value: true
      description: The work changes the external appearance.
source-url: https://www.spelthorne.gov.uk/sites/default/files/2026-06/Local%20List%20of%20Requirements_0.pdf
policy: Spelthorne Local Plan 2024-2039/40 (March 2026) policy PS2
source-text: All applications where building work is proposed unless no change to external appearance.
must-include:
- item: At a scale of 1:50 or 1:100 (or other scales by prior agreement), clearly showing the proposed
    works in relation to what is already there
  level: must
- item: All sides of the proposal, indicating the proposed building materials and finish
  level: must
- item: Blank elevations included
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the site boundaries'
  level: must
  required-if: discretionary
- item: Annotated with the overall dimensions and height of each element and the distance to the adjoining
    boundaries from each elevation
  level: must
- item: 'Built development next to neighbouring homes: the relationship between the two buildings, with
    the positions and heights of openings on the adjoining property''s elevations facing the development'
  level: must
  required-if: discretionary
  source-text: All applications for built development adjoining neighbouring residential properties.
confidence: medium
notes: From the council's list (published June 2026), item 4 and 5, page 3-4. Item 5 (plans showing the
  position and window details of adjoining properties) is shown as the last 'must show' item; there is
  no field for 'adjoining neighbouring residential properties', so it shows as 'check'.
review-status: unverified
field-status: {}
