reference: daylight-sunlight-assessment
local-authority: WOR
required-if:
  all:
  - any:
    - application-type:
        in:
        - reg-3
        - s73
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: false
          description: A waste management facility other than landfill (Checklist 4).
  - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 28; Worcestershire Waste Core Strategy policies
  WCS 1 and WCS 14
source-text: A Daylight / Sunlight Assessment is required for all applications where there is a potential
  adverse impact upon current levels of sunlight / daylight enjoyed by adjoining properties or buildings,
  including their gardens or amenity space.
must-include:
- item: Undertaken by a suitably qualified professional using the BRE guidelines (Site Layout Planning
    for Daylight and Sunlight)
  level: must
- item: An overshadowing study with shadow diagrams at hourly intervals at different times of year, existing
    and proposed
  level: should
- item: Measures to mitigate the expected impact
  level: should
- item: Diagrams as relevant and a non-technical summary
  level: should
- item: Vertical Sky Component (VSC) and Average Daylight Factor (ADF)
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 25. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 4 (waste except landfill), 10 (section 73). A 'potential adverse impact' is
  a judgement, so it shows as discretionary. The contents are what the list says to refer to 'if applicable'.
  Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3;
  Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
