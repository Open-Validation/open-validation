reference: site-plan
local-authority: WOR
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - ldc-existing-use
    - ldc-prospective-use
    - advertising
    - waste-dev
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_1_-_councils_own_developments.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Site Plan Scale 1:500 or 1:200. … Block Plan of the Site Scale 1:100
  or 1:200.
must-include:
- item: Existing and proposed site plan at 1:500 or 1:200 (advertisements 1:500 or 1:100; larger waste
    applications 1:2500 recommended)
  level: must
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - advertising
      - waste-dev
- item: Block plan at 1:100 or 1:200 showing the site boundaries and the type and height of boundary treatment
  level: must
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - waste-dev
- item: Position of any buildings or structures on the other side of the boundaries
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - ldc-existing-use
      - ldc-prospective-use
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site (with written dimensions for mineral working and LDCs)
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - waste-dev
- item: Buildings and roads on adjoining land, including access arrangements
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - waste-dev
- item: Public rights of way crossing or adjoining the site and any diversions
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - waste-dev
- item: Landscaping features, trees and hedges
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - waste-dev
- item: Extent and type of any hard surfacing; boundary treatment including walls or fencing
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-existing-use
      - ldc-prospective-use
      - waste-dev
- item: Features of biodiversity and geodiversity interest
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Parking and access (layout) during construction and operation
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Layout of outdoor games/sports areas and details of any external flood lighting
  level: should
  required-if:
    application-type:
      in:
      - reg-3
- item: Underground services and overhead lines; drainage ditches and controlled waters; features of archaeological
    interest
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: Pre-development contours over and within 250 metres of the site, and the position of boreholes
    and trial pits
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: Areas allocated for the storage, handling, processing and treatment of waste materials
  level: should
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: false
        description: A waste management facility other than landfill (Checklist 4).
- item: 'Landfill: pre and post settlement contours across the site and within 250 metres; limits of landfilling;
    soil storage bunds (type, location, height and volumes); proposed buildings, plant and ancillary structures'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: A landfill proposal (Checklist 5).
- item: 'Outline: indicative site layout showing the uses and any development zones, the amount of development
    for each use, scale parameters (upper and lower limits for height, width and length of each building)
    and indicative access points'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: 'Indicative Site Layout Plans Where relevant, the following information should be shown:
    • The uses for the development and any distinct development zones within the site identified. • The
    amount of development proposed for each use. • Scale parameters giving an indication of the upper
    and lower limits for height, width and length of each building within the site boundary. • Indicative
    access points, showing an area or areas in which access points to the site will be situated.'
- item: 'Advertisements: the advertisement(s) in context with adjacent buildings, dimensions, siting,
    materials, fixing, colours, height above existing ground and any engineering works; the extent of
    any projection from a building; and for illuminated adverts the type and colour(s) of illumination
    and whether it is static, flashing or has moving parts'
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published June 2025), page 5. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 6 (LDC existing),
  7 (LDC proposed), 8 (advertisements). The checklists ask for an 'Existing and Proposed Site Plan' (Checklists
  1, 3, 4, 5), 'Site Plans' (6, 7, 8) and a 'Block Plan of the Site' (2 to 7); both are shown here. Items
  are what each checklist says 'should be shown' 'where relevant'. Checklists 1 and 2 are both Regulation
  3 (the county council's own development), so both show as reg-3; Checklist 1 also covers reserved matters
  after a Regulation 3 outline.
review-status: unverified
field-status: {}
