reference: site-restoration
local-authority: WOR
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: A landfill proposal (Checklist 5).
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 7-12 and MLP 26-38; Worcestershire Waste Core
  Strategy policies WCS 5 and WCS 9
source-text: All proposals for mineral extraction and landfill sites, except for those applications seeking
  to vary / remove a condition(s) that has no impact on the final restoration / aftercare of the site.
must-include:
- item: Plans showing the phasing of working and restoration, the final landform and landscaping proposals
  level: must
- item: A statement setting out the restoration and aftercare proposals for the land after operations
    cease
  level: must
- item: 'Restoration: overall strategy and after-use; voidspace and volume/type of fill and filling rates;
    phasing; soil resources and handling; pre and post settlement contours; drainage of restored areas;
    removal of buildings, plant and roads; cultivation, cropping and grazing with an agricultural land
    classification assessment; landscape strategy and planting details'
  level: should
- item: 'Aftercare: the proposed after-use (and area of each use if combined), the Management Plan, and
    an aftercare period of at least 5 years'
  level: should
- item: Details of enhancement on other land in the applicant's control, and interim measures before final
    restoration
  level: should
- item: 'For mineral development: how the scheme contributes to the Minerals Local Plan''s green infrastructure
    priorities (including the relevant Strategic Corridor, policies MLP 8-12)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: Restoration, aftercare and after-use plans at a scale of at least 1:2500 showing existing and
    proposed pre and post settlement contours across the site and within 250 metres, landscaping, site
    drainage and discharge, and public access routes and facilities
  level: must
  required-if:
    any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: true
          description: A landfill proposal (Checklist 5).
- item: 'Mineral working: water areas (location, depth, method of controlling water levels, bank gradients
    and treatment of margins)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: 'Landfill: landfill gas and leachate management, and biodiversity and/or geodiversity mitigation,
    compensation and enhancement measures'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: A landfill proposal (Checklist 5).
confidence: medium
notes: From the council's list (published June 2025), page 75. Named in Checklists 3 (mineral working),
  5 (landfill), 10 (section 73). Section 73 applications need it unless the varied condition has no impact
  on the final restoration or aftercare, so that part shows as discretionary. The scheme's contents are
  what the list 'advised' ('where applicable'). Checklists 3 and 5 also ask for 'Restoration and Aftercare
  and After use plans'. Uses the retired MHCLG id site-restoration.
review-status: unverified
field-status: {}
