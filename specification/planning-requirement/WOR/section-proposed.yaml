reference: section-proposed
local-authority: WOR
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - waste-dev
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_1_-_councils_own_developments.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Site Sections and Finished Floor and Site Levels Scale 1:50 or 1:100.
  … Sectional Drawings Scale at least 1:2500.
must-include:
- item: 'Site sections at 1:50 or 1:100: cross sections through the proposed building(s), the relationship
    to neighbours and existing development, existing site levels and finished floor levels'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - reg-3
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: false
          description: A waste management facility other than landfill (Checklist 4).
- item: Proposed buildings and operational plant; proposed roads, paths and infrastructure
  level: should
  required-if:
    any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: false
          description: A waste management facility other than landfill (Checklist 4).
- item: 'Mineral working: sectional drawings at least 1:2500 showing existing and final restoration levels
    (with likely settlement), maximum depth of excavation, position of the quarry faces and maximum level
    of the water table'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: 'Mineral working: representative sections and borehole diagrams differentiating topsoil, subsoil
    and overburden (characteristics and thickness of each), the mineral and any interbedded waste, the
    underlying geology and the water table; typical profiles and gradients of mounds of topsoil, overburden
    and mineral waste tips'
  level: should
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
- item: 'Landfill: sectional drawings at least 1:2500 showing pre-development site levels, proposed levels
    pre and post settlement, maximum level of the water table and profiles of the site lining and capping
    infrastructure'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: A landfill proposal (Checklist 5).
confidence: medium
notes: From the council's list (published June 2025), page 5. Named in Checklists 1 (Regulation 3), 3
  (mineral working), 4 (waste except landfill), 5 (landfill). Checklists 1, 3 and 4 ask for 'Existing
  and Proposed Site Sections and Finished Floor and Site Levels'; Checklists 3 and 5 ask for 'Sectional
  Drawings'. Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both
  show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
