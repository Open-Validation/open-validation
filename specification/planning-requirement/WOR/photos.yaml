reference: photos
local-authority: WOR
required-if:
  any:
  - all:
    - application-type:
        in:
        - reg-3
        - mineral-extraction
        - mineral-app
        - advertising
        - pa-demo-building
        - s73
        - waste-dev
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of an existing building.
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          description: Affects a Conservation Area or a Listed Building and its setting (heritage assets).
  - application-type:
      in:
      - ldc-existing-use
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Waste Core Strategy policy WCS 12
source-text: Photographs and photomontages should be provided if the proposal involves the demolition
  of an existing building or for proposals affecting a Conservation Area or a Listed Building and its
  setting.
must-include:
- item: Dated, numbered and cross-referenced to a plan, showing the site and its context and the area
    of change
  level: must
- item: 'For an LDC (existing): showing the existing use, operation or activity'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
  source-text: 'Photographs: These should show the existing use, operation, or activity, and be dated,
    numbered and cross-referenced to a plan.'
- item: 'For advertisements: annotated, showing the proposed advertisement(s) on the site and how they
    relate to the locality'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published June 2025), page 66. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 8 (advertisements),
  9 (demolition prior notification), 10 (section 73). Checklist 6 (LDC existing) lists photographs under
  'Other Requirements'. For advertisements the main body says annotated photographs and photomontages
  'may also be required', so that part shows as discretionary. Checklists 1 and 2 are both Regulation
  3 (the county council's own development), so both show as reg-3; Checklist 1 also covers reserved matters
  after a Regulation 3 outline.
review-status: unverified
field-status: {}
