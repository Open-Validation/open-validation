reference: viability-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - waste-dev
      - s73
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Planning obligations or contributions required by local policy are not offered for
        viability reasons.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: National Planning Policy Framework, section 4; Worcestershire Minerals Local Plan policy MLP 40
source-text: Where any development which requires planning obligations or planning contributions but where
  such obligations, contributions or features are not being proposed due to viability reasons.
must-include:
- item: Enough information for an objective review, on an 'open book' basis
  level: must
- item: 'Where relevant: site acquisition cost and existing use value; construction costs and programme;
    fees and on costs; projected sale prices; gross and net margin; other costs and receipts'
  level: should
- item: Agreement to pay for the council's independent review (normally needed at validation)
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 98. None of the ten checklists names it, so
  it is shown for the planning application types the checklists cover. Checklists 1 and 2 are both Regulation
  3 (the county council's own development), so both show as reg-3; Checklist 1 also covers reserved matters
  after a Regulation 3 outline.
review-status: unverified
field-status: {}
