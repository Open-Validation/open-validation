reference: noise-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - pa-demo-building
      - s73
      - waste-dev
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Processes or uses generating noise.
    - condition:
        field: dust-generation
        value: true
        description: Processes or uses generating dust.
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 28, MLP 29 and MLP 31; Worcestershire Waste Core
  Strategy policies WCS 1, WCS 3, WCS 6, WCS 10, WCS 14 and WCS 17; National Planning Policy for Waste,
  Appendix B
source-text: For all proposals that could involve processes and uses generating noise, dust, odours and
  vibrations.
must-include:
- item: A management strategy for the control and mitigation of emissions
  level: must
- item: Baseline conditions around the site
  level: should
- item: Operations that could generate the emissions and, where relevant, flues and ventilation extraction
    details
  level: should
- item: The change in baseline conditions from the development
  level: should
- item: Environmental and human receptors that could be affected
  level: should
- item: Recommended mitigation measures
  level: should
- item: Proposals to monitor and report on emissions and respond to complaints
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 2. The list's 'Emissions Assessment (Dust,
  Noise, Odours, and Vibration)', one document covering all four. Named in Checklists 1 (Regulation 3),
  2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 9 (demolition
  prior notification), 10 (section 73). Odours and vibration have no field, so they show as discretionary;
  the dust, odour and vibration parts are also in the unmapped list. Worcestershire Regulatory Services'
  Technical Guidance Note for Planning sets out the detail. Checklists 1 and 2 are both Regulation 3 (the
  county council's own development), so both show as reg-3; Checklist 1 also covers reserved matters after
  a Regulation 3 outline.
review-status: unverified
field-status: {}
