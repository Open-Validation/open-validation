reference: sci
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - condition:
      field: pre-application-community-consultation
      value: true
      description: Pre-application engagement with the public has been undertaken.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire County Council Statement of Community Involvement (2021); Worcestershire Waste
  Core Strategy policy WCS 15
source-text: Any proposal involving pre-application engagement with the public should include a statement
  outlining how the applicant has addressed the Council’s adopted Statement of Community Involvement (SCI).
must-include:
- item: How the applicant has complied with the pre-application consultation requirements of the County
    Council's SCI, showing that the views of the local community were sought and taken into account
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 20. The list's 'Consultation Statement'. Named
  in Checklists 1 (Regulation 3), 2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill),
  5 (landfill), 10 (section 73). The checklists say it 'is required for any proposal where pre-application
  engagement with the public has been undertaken'. Checklists 1 and 2 are both Regulation 3 (the county
  council's own development), so both show as reg-3; Checklist 1 also covers reserved matters after a
  Regulation 3 outline.
review-status: unverified
field-status: {}
