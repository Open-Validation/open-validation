submission-standards:
- item: The original and 3 copies of the application form, plans and supporting information (4 copies
    in all) unless submitted electronically
  level: must
- item: Plans clearly titled, showing the direction of north, with a unique reference number and dated
  level: should
- item: Mineral working applications on the County Council's Standard Minerals Application Form (by post
    or email); waste and County Council applications on the 1APP form (online via the Planning Portal
    or other services)
  level: must
- item: Where an item in the relevant checklist is not provided, a written justification of why it is
    not appropriate
  level: should
