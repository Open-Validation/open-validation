reference: biodiversity-survey-report
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - pa-demo-building
      - s73
      - waste-dev
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected and priority species on the site or land adjacent to it.
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-wildlife-site
        - local-nature-reserve
        description: Sites designated for their local, national or international importance for nature
          conservation.
    - site:
        in:
        - priority-habitat
        description: Important (priority) habitats on the site or land adjacent to it.
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_1_-_councils_own_developments.pdf
policy: Environment Act 2021; Worcestershire Minerals Local Plan policy MLP 31; Worcestershire Waste Core
  Strategy policies WCS 1, WCS 3, WCS 6, WCS 14 and WCS 17
source-text: 'Ecological Surveys and Reports: This information is required for all applications where
  a proposed development is likely to have impacts on wildlife and biodiversity, including … when there
  are protected and priority species, sites designated for their local, national, or international importance
  for nature conservation, important habitats or other biodiversity features on the site or land adjacent
  to it.'
must-include:
- item: 'Informed by a local ecological data search (first point of contact: Worcestershire Biological
    Records Centre)'
  level: should
- item: Undertaken by competent and qualified persons at an appropriate time of year, in suitable weather,
    using nationally recognised survey guidelines and complying with BS42020:2013
  level: must
- item: Habitats and features present on and around the site, with their extent, and those affected by
    the proposal, mapped
  level: must
- item: Key species present, their population status and their distribution and use of the site, mapped
  level: must
- item: Direct and indirect impacts during and after construction
  level: must
- item: Where harm is likely, evidence that the ecological mitigation hierarchy has been followed (alternatives,
    avoidance, mitigation, compensation)
  level: must
- item: Enough confidence in the specification and location of mitigation and enhancement measures to
    secure their delivery
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 30-33. Named in Checklists 1 (Regulation 3),
  2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 9 (demolition
  prior notification), 10 (section 73). Wording from the checklists. The main body adds that 'All development
  proposals need to be informed by ecological surveys and reports; as a minimum, a scoping survey (such
  as Preliminary Ecological Appraisal [PEA]) is needed', and Appendix 1 gives the trigger list of designated
  sites, priority habitats and other biodiversity features; features outside the fields shown, and the
  'likely to have impacts' test, show as discretionary. Surveys are normally valid for up to two years.
  Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3;
  Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
