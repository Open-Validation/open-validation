source-text: 'Full planning: How to Read, Write and Use Them 29 ECOLOGICAL IMPACT ASSESSMENT AND ECOLOGICAL
  SURVEYS AND REPORTS When might it be required? All development proposals need to be informed by ecological
  surveys and reports; as a minimum, a scoping survey (such as Preliminary Ecological Appraisal [PEA])
  is needed, and usually further specific surveys if identified during scoping.


  Outline, Variation of condition s73, Minerals & waste (county), County own devt (Reg 3): Ecological
  Surveys and Reports: This information is required for all applications where a proposed development
  is likely to have impacts on wildlife and biodiversity, including when there are protected and priority
  species, sites designated for their local, national, or international importance for nature conservation,
  important habitats or other biodiversity features on the site or land adjacent to it.'
