reference: flood-risk-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: 'In Flood Zone 1: a site of 1 hectare or more.'
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: 'In Flood Zone 1: a site of 1 hectare or more.'
    - site:
        in:
        - critical-drainage-area
        description: Land identified by the Environment Agency as having critical drainage problems.
    - site:
        in:
        - future-flood-risk
        description: Land identified in a Strategic Flood Risk Assessment as being at increased flood
          risk in future.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: The development would introduce a more vulnerable use.
      - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 37 and MLP 38; Worcestershire Waste Core Strategy
  policies WCS 1, WCS 10 and WCS 11
source-text: 'A site-specific Flood Risk Assessment (FRA) will be required for all development in Flood
  Zones 2 and 3. In Flood Zone 1, an assessment should accompany all proposals involving: sites of 1 hectare
  or more; land which has been identified by the Environment Agency as having critical drainage problems;
  land identified in a Strategic Flood Risk Assessment as being at increased flood risk in future; or
  land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use.'
must-include:
- item: A level survey to Ordnance Datum showing the 1% (1 in 100) river flood level including climate
    change (or 0.5% tidal) relative to proposed site levels; in Flood Zone 3 the functional floodplain
    (3.3%); defences and their standard of protection where appropriate
  level: must
- item: An assessment of the risks to the site (1% flooding with climate change, breach and overtopping
    where necessary, historic flooding, surface water runoff)
  level: must
- item: Mitigation of flood risk to the development and its users for its lifetime (floor levels, flood
    proofing, safe access and egress)
  level: must
- item: Impact on flood risk elsewhere, including level for level, volume for volume flood storage compensation
  level: must
- item: Residual risks after mitigation, including an extreme 0.1% (1 in 1000) event
  level: must
- item: The relevant Environment Agency flood zone, and the design of surface water management including
    SuDS
  level: must
- item: Any floodplain compensation scheme, with plans, calculations and a cut and fill table
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2025), page 38-39. Named in Checklists 1 (Regulation 3),
  2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section
  73). Land 'that may be subject to other sources of flooding' has no field, so that part shows as discretionary.
  The checklists summarise it as '1 hectare of greater in Flood Zone 1 and for all proposals for new development
  located in Flood Zones 2 and 3'. A Sequential Test may be needed even where no FRA is (see the unmapped
  list). Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show
  as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
