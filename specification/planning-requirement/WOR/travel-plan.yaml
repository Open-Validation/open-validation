reference: travel-plan
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - any:
    - condition:
        field: new-school
        value: true
        description: New schools.
    - all:
      - condition:
          field: school-expansion
          value: true
          description: Extensions to existing schools.
      - discretionary
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: National Planning Policy Framework, section 9; Worcestershire Minerals Local Plan policy MLP 39;
  Worcestershire Waste Core Strategy policy WCS 8
source-text: Travel Plans will be required for all applications that are likely to have significant transport
  implications, and for any planning applications involving new schools or significant extensions to existing
  schools.
must-include:
- item: An identified owner responsible for managing and implementing the Travel Plan
  level: must
- item: Mode share targets, the measures to achieve them, a monitoring strategy and remedial measures
    if targets are not met
  level: must
- item: The relevant criteria of the Active Travel England Planning Application Assessment Toolkit
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 94. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section 73).
  'Significant transport implications' and 'significant' school extensions are judgements, so they show
  as discretionary. Checklists 1 and 2 are both Regulation 3 (the county council's own development), so
  both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
