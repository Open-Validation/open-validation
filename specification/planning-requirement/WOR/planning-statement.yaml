reference: planning-statement
local-authority: WOR
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - ldc-existing-use
    - ldc-prospective-use
    - advertising
    - pa-demo-building
    - s73
    - waste-dev
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Planning and Compulsory Purchase Act 2004, section 38(6); Town and Country Planning Act 1990,
  section 70(2)
source-text: All planning applications should be accompanied by a Planning Statement.
must-include:
- item: How the proposal accords with the development plan, national policy and guidance and other relevant
    technical guidance
  level: must
- item: Where it does not accord with policy, an acknowledgement and the reasons it should still be granted
  level: must
- item: Where relevant, justification of any departure from policy, including very special circumstances
    for development contrary to Green Belt policy
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 70. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 6 (LDC existing),
  7 (LDC proposed), 8 (advertisements), 9 (demolition prior notification), 10 (section 73). Checklists
  1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3; Checklist
  1 also covers reserved matters after a Regulation 3 outline.
