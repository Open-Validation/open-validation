reference: landscaping-plan
local-authority: WOR
required-if:
  any:
  - application-type:
      in:
      - reg-3
      - waste-dev
  - application-type:
      in:
      - pa-demo-building
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_1_-_councils_own_developments.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Landscaping Plan Scale 1:500 or 1:250. … Landscaping / Restoration Plan
must-include:
- item: Scale 1:500 or 1:250
  level: must
  required-if:
    application-type:
      in:
      - reg-3
      - waste-dev
- item: Existing trees and hedgerows to be retained and removed
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - waste-dev
- item: Species type, number, size and location of all new planting
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - waste-dev
- item: Details of fences and hard and soft landscaping, including changes of level
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - waste-dev
- item: 'Demolition: how the site will be restored and the location of any material to remain on site'
  level: should
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (published June 2025), page 5, 54. Named in Checklists 1 (Regulation 3),
  4 (waste except landfill), 5 (landfill), 9 (demolition prior notification). Checklist 9 (demolition
  prior notification) asks for a 'Landscaping / Restoration Plan'. The Heritage Statement section (page
  54) adds that landscaping schemes/plans are also required to protect or enhance the setting of designated
  heritage assets. Checklists 1 and 2 are both Regulation 3 (the county council's own development), so
  both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
