reference: archaeological-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - advertising
      - s73
      - waste-dev
  - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 32; Worcestershire Waste Core Strategy policies
  WCS 9 and WCS 12
source-text: Where a site, on which development is proposed, includes or has the potential to include
  heritage assets with archaeological interest, applicants will be required to submit an Archaeological
  Assessment. This will entail an appropriate desk-based assessment and, where necessary, a field evaluation
  as part of the Heritage Statement.
must-include:
- item: A desk-based assessment of the quality and significance of known assets, the potential for unknown
    assets, the likely impact and how it might be mitigated
  level: must
- item: Where necessary, a field evaluation (intrusive and/or non-intrusive) by fully qualified professionals
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 53-54. Part of the Heritage Statement section.
  Named in Checklists 1 (Regulation 3), 2 (Regulation 3 outline), 3 (mineral working), 4 (waste except
  landfill), 5 (landfill), 8 (advertisements), 10 (section 73). Whether a site has 'potential' archaeological
  interest is for the county's Historic Environment Planning Advisors, so it shows as discretionary. Checklists
  1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3; Checklist
  1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
