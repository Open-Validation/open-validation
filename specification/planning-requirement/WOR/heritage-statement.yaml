source-text: 'Full planning: Document 52 HERITAGE STATEMENT When might it be required? A Heritage Statement
  will be required where the proposed development affects a heritage asset and/or its setting.


  Outline, Variation of condition s73, Minerals & waste (county), County own devt (Reg 3): Heritage Statement:
  This information is required where a proposal is in an archaeologically sensitive area or has the potential
  to impact upon heritage asset(s) and / or its setting.


  Advertisement consent: Assessments Heritage Statement: This information is required where a proposal
  is in an archaeologically sensitive area or has the potential to impact upon the setting of a heritage
  asset(s).'
