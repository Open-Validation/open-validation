reference: heritage-statement
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - advertising
      - s73
      - waste-dev
  - any:
    - site:
        in:
        - scheduled-monument
        - battlefield
        - listed-building
        - listed-building-setting
        - conservation-area
        - park-and-garden
        description: Affects a Scheduled Monument, Registered Battlefield, Listed Building or Registered
          Historic Park and Garden (or their setting), or is within or affects a Conservation Area.
    - site:
        in:
        - historic-environment-record
        description: Affects a historic building, structure, park or garden on the county Historic Environment
          Record.
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Ground disturbance.
      - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 32; Worcestershire Waste Core Strategy policies
  WCS 9, WCS 12 and WCS 14; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: 'A Heritage Statement will be required where the proposed development affects a heritage
  asset and/or its setting. A Heritage Statement will be required in respect of proposals: • Involving
  ground disturbance within an area of known or potential archaeological significance; • Which would affect
  Scheduled Monuments or Registered Battlefields or their setting; • Which would affect Listed Buildings
  or their setting; • Within or which would affect a Conservation Area; • Which would affect a Registered
  Historic Park and Garden or its setting; or • Which would affect a historic building, structure, park
  or garden registered on the county Historic Environment Record.'
must-include:
- item: A Statement of Significance describing the significance of designated and undesignated heritage
    assets affected, including any contribution made by their setting, proportionate to their importance
  level: must
- item: The county Historic Environment Record consulted as a minimum
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 53. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 8 (advertisements),
  10 (section 73). 'Ground disturbance within an area of known or potential archaeological significance'
  has no designation field, so it shows as discretionary. See archaeological-assessment for the desk-based
  assessment and field evaluation, and structural surveys (unmapped) where demolition of a designated
  asset is justified on condition. Checklists 1 and 2 are both Regulation 3 (the county council's own
  development), so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
