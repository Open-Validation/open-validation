reference: lighting-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
      - advertising
  - any:
    - condition:
        field: external-lighting
        value: true
        description: The provision of external lighting, including floodlighting, that may have an impact
          upon the locality.
    - condition:
        field: illuminated
        value: true
        description: The proposal includes illuminated signage.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_2_-_outline_planning_applications.pdf
source-text: 'Full planning: Land Stability 59 LIGHTING ASSESSMENT When might it be required? A Lighting
  Assessment would be required for applications involving the provision of external lighting, including
  floodlighting and where the lighting may have an impact upon the locality.


  Outline, Advertisement consent, Variation of condition s73, Minerals & waste (county), County own devt
  (Reg 3): provision of external lighting, where it may have an impact upon the locality, in particular
  developments with sports lighting, for developments near residential property, heritage assets such
  as Listed Buildings, in Conservation Areas, in the open countryside, or has the potential to impact
  upon wildlife, or near a canal corridor; and where it might have an impact upon a designated area of
  the National Landscape (AONB).'
