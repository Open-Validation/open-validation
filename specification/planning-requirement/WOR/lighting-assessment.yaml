reference: lighting-assessment
local-authority: WOR
required-if:
  any:
  - all:
    - application-type:
        in:
        - reg-3
        - mineral-extraction
        - mineral-app
        - s73
        - waste-dev
    - condition:
        field: external-lighting
        value: true
        description: External lighting, including floodlighting.
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - any:
      - condition:
          field: illuminated
          value: true
          description: Illuminated signage.
      - condition:
          field: external-lighting
          value: true
          description: The installation of lighting.
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 28; Worcestershire Waste Core Strategy policies
  WCS 9, WCS 11 and WCS 14
source-text: A Lighting Assessment would be required for applications involving the provision of external
  lighting, including floodlighting and where the lighting may have an impact upon the locality. … A Lighting
  Assessment may also be required for applications for consent to display an advertisement(s) by the County
  Council under the Town and Country Planning (Control of Advertisements) (England) Regulations 2007 (as
  amended), where the proposal includes illuminated signage or the installation of lighting.
must-include:
- item: A layout plan of all light fixtures, beam orientation and spread, with LUX levels
  level: must
- item: Elevations showing the position of the lighting units, including column heights
  level: must
- item: A performance specification of the equipment, including colour (correlated colour temperature,
    spectral distribution and glare rating)
  level: must
- item: The times the lighting would be in use
  level: must
- item: A plot of horizontal illuminance and overspill onto adjacent premises and/or habitats
  level: must
- item: Effects on light-sensitive wildlife; the need for full horizontal cut-off; potential distraction
    to drivers
  level: must
confidence: medium
notes: 'From the council''s list (published June 2025), page 60-61. Named in Checklists 1 (Regulation
  3), 2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 8 (advertisements),
  10 (section 73). Whether lighting ''may have an impact upon the locality'' depends on the scheme and
  how sensitive the area is (the list gives examples: sports lighting, near homes, heritage assets, wildlife
  sites, bat routes, dark corridors, open countryside and canals), so it shows as discretionary. Follow
  ILP/BCT Guidance Note GN08/23. Checklists 1 and 2 are both Regulation 3 (the county council''s own development),
  so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.'
review-status: unverified
field-status: {}
