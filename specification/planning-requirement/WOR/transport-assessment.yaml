reference: transport-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: National Planning Policy Framework, section 9; Worcestershire Minerals Local Plan policy MLP 39;
  Worcestershire Waste Core Strategy policy WCS 8; Worcestershire Streetscape Design Guide
source-text: Paragraph 117 of the National Planning Policy Framework states that all developments that
  would generate significant amounts of movements should be required to provide a Travel Plan and the
  application should be supported by a Transport Statement or Transport Assessment so that the likely
  impacts of the proposal can be assessed.
must-include:
- item: The proposed development and site layout, especially transport access across all modes
  level: should
- item: Neighbouring uses and the functional classification of the nearby road network
  level: should
- item: Existing public transport provision and proposed changes
  level: should
- item: Travel characteristics and multi-modal movements generated, with trip generation, distribution
    and assignment
  level: should
- item: Trips from committed development; current traffic flows and critical links and junctions
  level: should
- item: Injury accident records near the site access for the most recent 3 years (5 in a high accident
    area)
  level: should
- item: Environmental impacts of the traffic; accessibility, active travel and parking
  level: should
- item: Measures to mitigate residual impacts
  level: should
- item: A draft completed Active Travel England Planning Application Assessment Toolkit
  level: should
confidence: medium
notes: 'From the council''s list (published June 2025), page 91-93. Named in Checklists 1 (Regulation
  3), 2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section
  73). The Streetscape Design Guide thresholds are ''for guidance purposes only'' and the County may ''interpret
  the need'' from local circumstances, so it shows as discretionary. The checklists add: ''For smaller
  schemes a Transport Statement is required.'' The contents are what ''should be considered'' when scoping.
  Checklists 1 and 2 are both Regulation 3 (the county council''s own development), so both show as reg-3;
  Checklist 1 also covers reserved matters after a Regulation 3 outline.'
review-status: unverified
field-status: {}
