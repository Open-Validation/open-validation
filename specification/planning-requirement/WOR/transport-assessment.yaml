source-text: 'Full planning: website 90 TRANSPORT ASSESSMENT / TRANSPORT STATEMENT When might it be required?
  Paragraph 117 of the National Planning Policy Framework states that all developments that would generate
  significant amounts of movements should be required to provide a Travel Plan and the application should
  be supported by a Transport Statement or Transport Assessment so that the likely impacts of the proposal
  can be assessed.


  Outline, Variation of condition s73, Minerals & waste (county), County own devt (Reg 3): For smaller
  schemes a Transport Statement is required.'
