reference: arboriculturist-report
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - pa-demo-building
      - s73
      - waste-dev
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Works affect trees within the site or on adjacent land (including street trees).
    - condition:
        field: hedgerows-affected
        value: true
        description: Works affect hedgerows within the site or on adjacent land.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 31 and MLP 33; Worcestershire Waste Core Strategy
  policies WCS 9 and WCS 12
source-text: Where development involves works that affect any trees or hedgerows within the application
  site or on land adjacent to it (including street trees).
must-include:
- item: A site plan showing the species, accurate canopy spread and position of trees on and next to the
    site, indicating trees to be felled or affected
  level: must
- item: A schedule of the trees, each numbered, with species, height, maturity, condition and recommendations
    for felling, surgery or other treatment
  level: must
- item: A statement of measures to protect retained trees during works, in line with BS 5837:2012, prepared
    by a qualified arboriculturist
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 96. The list's 'Tree Survey / Arboricultural
  Statement'. Named in Checklists 1 (Regulation 3), 2 (Regulation 3 outline), 3 (mineral working), 4 (waste
  except landfill), 5 (landfill), 9 (demolition prior notification), 10 (section 73). Checklists 1 and
  2 are both Regulation 3 (the county council's own development), so both show as reg-3; Checklist 1 also
  covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
