reference: recreation-facilities-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - condition:
      field: affects-playing-field
      value: true
      description: The application includes the loss of playing field space.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: National Planning Policy Framework, section 8; Sport England Playing Fields Policy and Guidance
  (2021)
source-text: Applications that include the loss of playing field space will need to include a Playing
  Pitch Assessment, which appraises the current and proposed pitch provision.
must-include:
- item: An appraisal of current and proposed pitch provision
  level: must
- item: Without an up-to-date district Playing Pitch Strategy, an independent assessment showing the land
    or buildings are surplus to requirements, with community consultation
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 71. The list's 'Playing Pitch Assessment'.
  Named in Checklists 1 (Regulation 3), 2 (Regulation 3 outline), 3 (mineral working), 4 (waste except
  landfill), 5 (landfill), 10 (section 73). Applicants are strongly advised to follow Sport England's
  information requirements (Annex B). Checklists 1 and 2 are both Regulation 3 (the county council's own
  development), so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
