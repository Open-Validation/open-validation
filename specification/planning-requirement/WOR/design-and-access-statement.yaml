reference: design-and-access-statement
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area such as a Conservation Area or World Heritage Site.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) with a floor space created of 100 square metres or more.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A Design and Access Statement is not required for all developments, but is required for
  applications for both outline and full planning permission for the following: • Applications for major
  development (as defined under Article 2 of the Town and Country Planning (Development Management Procedure
  (England)) Order 2015 (as amended); • Applications for development in a designated area, such as a Conservation
  Area or World Heritage Site, where the proposed development consists of buildings or building where
  the floor space created by the development is 100 square metres or more; and • Applications for Listed
  Building Consent.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The policy adopted as to access, and how development plan policies relating to access have been
    taken into account
  level: must
- item: What consultation has been undertaken on access, and what account has been taken of it
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 27. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline). The list exempts material changes of use without operational development, engineering
  or mining operations, section 73 applications, waste development, non-material amendments and hazardous
  substances, so only Regulation 3 applications show. Listed building consent is not decided by the county
  council. Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show
  as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
