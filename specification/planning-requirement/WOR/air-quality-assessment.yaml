reference: air-quality-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - any:
    - site:
        in:
        - air-quality-management-area
        description: In the vicinity of an Air Quality Management Area.
    - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 28 and MLP 29; Worcestershire Waste Core Strategy
  policy WCS 14; National Planning Policy for Waste, Appendix B
source-text: When a proposed development is likely to have an impact upon air quality, such as due to
  an increase in emissions from road traffic and / or relevant point sources; or is in the vicinity of
  areas of poor air quality including those designated as an Air Quality Management Area (AQMA) and areas
  of emerging poor air quality.
must-include:
- item: Potential cumulative impacts from committed development in the local area as well as the development
    itself, and impacts on areas of poor air quality such as AQMAs
  level: should
- item: Appropriate measures to mitigate any negative effects
  level: should
- item: Undertaken and prepared by competent and qualified persons
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 10. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section 73).
  The list says it is 'not possible to provide prescriptive criteria' and advises agreeing the need with
  the County Planning Authority and Worcestershire Regulatory Services at pre-application stage, so apart
  from AQMAs it shows as discretionary. Worcestershire Regulatory Services' Technical Guidance Note for
  Planning sets out the detail. Checklists 1 and 2 are both Regulation 3 (the county council's own development),
  so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
