source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_2_-_outline_planning_applications.pdf
source-text: 'Full planning: Protecting the Best and Most Versatile Agricultural Land 9 AIR QUALITY ASSESSMENT
  When might it be required? When a proposed development is likely to have an impact upon air quality,
  such as due to an increase in emissions from road traffic and / or relevant point sources; or is in
  the vicinity of areas of poor air quality including those designated as an Air Quality Management Area
  (AQMA) and areas of emerging poor air quality.


  Outline, Variation of condition s73, Minerals & waste (county), County own devt (Reg 3): Air Quality
  Assessment: This information is required when application proposals are likely to have an impact air
  quality or is in the vicinity of areas of poor air quality.'
