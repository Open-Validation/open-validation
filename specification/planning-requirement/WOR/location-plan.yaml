reference: location-plan
local-authority: WOR
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - ldc-existing-use
    - ldc-prospective-use
    - advertising
    - pa-demo-building
    - waste-dev
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_1_-_councils_own_developments.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Location Plan Scale 1: 1250 or 1:2500. Scaled to fit onto A4 or A3 size paper.'
must-include:
- item: Scale 1:1250 or 1:2500 (larger scale plans may be appropriate for mineral working)
  level: must
- item: Scaled to fit onto A4 or A3 paper
  level: must
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - advertising
      - pa-demo-building
      - waste-dev
- item: Based on an up-to-date map
  level: should
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - pa-demo-building
      - waste-dev
- item: Roads and/or buildings on land adjoining the application site identified
  level: should
- item: A red line around the application site, including all land necessary to carry out the development
    (for example access from a public highway, visibility splays, landscaping, car parking and open areas
    around buildings)
  level: should
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
- item: Two named roads and surrounding buildings
  level: should
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
- item: The proposed position of the advertisement
  level: should
  required-if:
    application-type:
      in:
      - advertising
- item: Public rights of way crossing or adjoining the site and any diversions
  level: should
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (published June 2025), page 5. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 6 (LDC existing),
  7 (LDC proposed), 8 (advertisements), 9 (demolition prior notification). Each checklist says what 'should
  be shown' 'where relevant'. Checklist 10 (section 73) asks only for 'any other plans, drawing and information
  necessary to describe the development'. Checklists 1 and 2 are both Regulation 3 (the county council's
  own development), so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation
  3 outline.
review-status: unverified
field-status: {}
