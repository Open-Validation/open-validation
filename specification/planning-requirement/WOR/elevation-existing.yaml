  level: should
  required-if:
    any:
    - application-type:
        in:
        - reg-3
        - mineral-extraction
        - mineral-app
    - all:
      - application-type:
          in:
          - waste-dev
      - condition:
          field: landfill-development
          value: false
          description: A waste management facility other than landfill (Checklist 4).
- item: The relationship with adjoining buildings or buildings in close proximity, with the positions
    of the openings on each property
  level: should
- item: Building materials and the style, materials and finish of windows and doors
  level: should
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
confidence: medium
notes: From the council's list (published June 2025), page 5. Named in Checklists 1 (Regulation 3), 3
  (mineral working), 4 (waste except landfill), 6 (LDC existing), 7 (LDC proposed). Checklists 6 and 7
  (LDCs) ask for existing elevations only. Checklist 5 (landfill) does not list elevations. Checklists
  1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3; Checklist
  1 also covers reserved matters after a Regulation 3 outline.
