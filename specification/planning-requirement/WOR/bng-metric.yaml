reference: bng-metric
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Town and Country Planning Act 1990, Schedule 7A; Environment Act 2021; Town and Country Planning
  (Development Management Procedure) (England) Order 2015, article 7
source-text: From 12 February 2024, all planning applications seeking to be validated and which fall within
  the scope of mandatory Biodiversity Net Gain (BNG) legislation, contained within the Environment Act
  2021 and subsequent regulations, are required to deliver a minimum of 10% net gain in biodiversity value
  over and above the measured baseline that existed pre-development.
must-include:
- item: The pre-development biodiversity value on the date of application (or an earlier proposed date),
    measured by habitat survey (usually UKHab) and the statutory biodiversity metric
  level: must
- item: The completed metric calculation tool and condition sheets, including the publication date of
    the metric used
  level: must
- item: 'Where activities before the application date have degraded onsite habitat: the date immediately
    before, the pre-development value on that date, the completed metric and any supporting evidence'
  level: must
- item: 'Small Sites Metric: photographs of on-site habitats taken at an appropriate time of year'
  level: must
  source-text: Photographic evidence of on- site habitats, captured at an appropriate time of year, must
    be included within the relevant Small Sites Metric sections so as to enable validation.
confidence: medium
notes: From the council's list (published June 2025), page 14-15. Named in Checklists 1 (Regulation 3),
  2 (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section
  73). The list says 'all planning applications' within the scope of mandatory BNG; by law exempt development
  (such as de minimis and self-build) is outside it, so the file uses biodiversity-gain-condition. The
  statements BNG also needs (that the condition applies, any degradation, irreplaceable habitat) and the
  draft gain plan, management plan, heads of terms and shapefiles the council 'expects' are in the unmapped
  list. Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show
  as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
