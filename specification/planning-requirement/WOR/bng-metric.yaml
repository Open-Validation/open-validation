source-text: 'Full planning: Exposure 13 BIODIVERSITY NET GAIN When might it be required? From 12 February
  2024, all planning applications seeking to be validated and which fall within the scope of mandatory
  Biodiversity Net Gain (BNG) legislation, contained within the Environment Act 2021 and subsequent regulations,
  are required to deliver a minimum of 10% net gain in biodiversity value over and above the measured
  baseline that existed pre-development. 10% mandatory BNG for small sites commenced on 2nd April 2024.


