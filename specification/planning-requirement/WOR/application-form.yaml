reference: application-form
local-authority: WOR
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - ldc-existing-use
    - ldc-prospective-use
    - advertising
    - pa-demo-building
    - s73
    - waste-dev
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/checklist_1_-_councils_own_developments.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: '1APP Form: to access the form directly visit Planning Portal. … Standard Minerals Application
  Form: to access the form directly visit Worcestershire County Council, Standard Minerals Application
  Form.'
must-include:
- item: The 1APP form, or for mineral working the County Council's Standard Minerals Application Form
  level: must
  source-text: 'Standard Minerals Application Form: to access the form directly visit Worcestershire County
    Council, Standard Minerals Application Form.'
- item: All relevant questions answered correctly
  level: must
- item: Completed ownership certificates
  level: must
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - ldc-prospective-use
      - s73
      - waste-dev
- item: Agricultural Holdings Certificate
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: All signed and dated
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 5. Every checklist starts with the form and
  'What information is required?'. Named in Checklists 1 (Regulation 3), 2 (Regulation 3 outline), 3 (mineral
  working), 4 (waste except landfill), 5 (landfill), 6 (LDC existing), 7 (LDC proposed), 8 (advertisements),
  9 (demolition prior notification), 10 (section 73). Ownership certificates are not listed in Checklists
  6 (LDC existing), 8 (advertisements) or 9 (demolition); Checklist 7 also asks for the Agricultural Holdings
  Certificate. The fee is listed under 'Fees' (see the council's planning pages). Checklists 1 and 2 are
  both Regulation 3 (the county council's own development), so both show as reg-3; Checklist 1 also covers
  reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
