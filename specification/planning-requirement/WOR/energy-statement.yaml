reference: energy-statement
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 26; Worcestershire Waste Core Strategy policies
  WCS 1 and WCS 11; district development plan renewable energy policies
source-text: Where policies in the Development Plan require developments to incorporate onsite renewable
  and low carbon energy facilities to generate a percentage (usually 10%) of the predicted energy requirements,
  an Energy Statement is also required.
must-include:
- item: The predicted regulated energy use and the energy generated by the proposed onsite renewable /
    low carbon facilities
  level: must
- item: If the Development Plan percentage is not met, why, with supporting evidence (e.g. a Viability
    Assessment)
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 89. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section 73).
  Whether it is needed depends on the policies of the district development plan that covers the site,
  so it shows as discretionary. Checklists 1 and 2 are both Regulation 3 (the county council's own development),
  so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
