reference: sustainable-drainage-strategy
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 31, MLP 37 and MLP 38; Worcestershire Waste Core
  Strategy policies WCS 1, WCS 3, WCS 6, WCS 8, WCS 10, WCS 11, WCS 14 and WCS 17; Environment Act 2021
source-text: A Surface Water Drainage Strategy is required for all development that is likely to significantly
  increase or change patterns of surface water run-off and its impacts.
must-include:
- item: How surface water run-off will be dealt with within the site, following the SuDS 'train' approach,
    with total storage volume covering interception, attenuation, long-term and treatment storage
  level: must
- item: Phasing showing SuDS in place and commissioned before completion of the phase they serve
  level: must
- item: Minimum ground floor levels at the design flood level (100 year plus climate change plus 600 mm)
    or 150-300 mm above adjacent ground, whichever is greater
  level: must
- item: Details of the existing drainage system on the drawings where connecting to it
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development connects to the existing drainage system.
- item: Porosity test results and calculations where a soakaway is used
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: A soakaway is proposed.
- item: Consideration of design-exceedance events and the impact of failures on downstream watercourses
  level: should
- item: Site location plan, site layout plan, and a plan of existing watercourses on and next to the site
    and how they are incorporated into the SuDS scheme
  level: must
  source-text: Site location plan
- item: Runoff rates and volumes, with balancing flows up to the 1 in 100-year event plus climate change
  level: must
- item: A concept drainage strategy and masterplan, and a copy of any site-specific FRA
  level: must
- item: 'Full applications (not outline): connection details including flow controls; ground investigation
    and permeability tests to BRE 365; exceedance routes plan; who will maintain the SuDS and how it is
    funded; a management plan and contractual arrangements; maintenance access'
  level: must
  required-if:
    application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - waste-dev
      - s73
confidence: medium
notes: From the council's list (published June 2025), page 86. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section 73).
  Whether a scheme will 'significantly increase or change' run-off is a judgement, so it shows as discretionary.
  The last four items are the Lead Local Flood Authority's Surface Water Checklist (Appendix 3, Table
  3, https://www.worcestershire.gov.uk/sites/default/files/2025-06/appendix_3_-_lead_local_flood_authoritys_surface_water_checklist.pdf),
  which marks the last item 'No' for outline applications. Uses the retired MHCLG id sustainable-drainage-strategy.
  Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3;
  Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
