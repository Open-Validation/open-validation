reference: sustainability-statement
local-authority: WOR
required-if:
  application-type:
    in:
    - reg-3
    - mineral-extraction
    - mineral-app
    - s73
    - waste-dev
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 26; Worcestershire Waste Core Strategy policies
  WCS 1 and WCS 11
source-text: A Sustainability Statement is required to accompany all development proposals.
must-include:
- item: The elements of the scheme that address sustainable development, including the positive environmental,
    social and economic implications
  level: must
- item: Energy efficiency and options for renewable energy; measures to reduce energy consumption and
    carbon emissions
  level: must
- item: Sustainable drainage and water efficiency; water management
  level: must
- item: Use of previously developed land, and how site features such as topography and orientation informed
    the design
  level: must
- item: Predicted energy demand and the degree to which current energy efficiency standards are met
  level: must
- item: A BREEAM rating where appropriate
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 89. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section 73).
  It may be part of the Planning Statement or Environmental Statement. Checklists 1 and 2 are both Regulation
  3 (the county council's own development), so both show as reg-3; Checklist 1 also covers reserved matters
  after a Regulation 3 outline.
review-status: unverified
field-status: {}
