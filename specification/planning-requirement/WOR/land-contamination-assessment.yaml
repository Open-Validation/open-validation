reference: land-contamination-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the land has the potential to be contaminated.
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policy MLP 28; Worcestershire Waste Core Strategy policies
  WCS 1, WCS 5 and WCS 6; National Planning Policy for Waste, Appendix B
source-text: A Contaminated Land Assessment may be required where contamination is known or suspected.
must-include:
- item: 'As a minimum a Preliminary Risk Assessment: desk study, walkover site reconnaissance and a conceptual
    model of pollutant sources, pathways and receptors'
  level: must
- item: Carried out in line with the Environment Agency's Land Contamination Risk Management (LCRM) and
    BS10175
  level: should
- item: Undertaken and prepared by competent and qualified persons
  level: must
- item: A risk assessment of landfill gas migration
  level: should
  required-if:
    site:
      in:
      - near-landfill-site
      description: On or within 250 metres of a former landfill site.
confidence: medium
notes: From the council's list (published June 2025), page 21. Named in Checklists 1 (Regulation 3), 2
  (Regulation 3 outline), 3 (mineral working), 4 (waste except landfill), 5 (landfill), 10 (section 73).
  The checklists say it 'is required for development on land that has the potential to be contaminated'.
  Checklists 1 and 2 are both Regulation 3 (the county council's own development), so both show as reg-3;
  Checklist 1 also covers reserved matters after a Regulation 3 outline.
review-status: unverified
field-status: {}
