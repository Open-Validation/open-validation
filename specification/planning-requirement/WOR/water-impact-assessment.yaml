reference: water-impact-assessment
local-authority: WOR
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-extraction
      - mineral-app
      - s73
      - waste-dev
  - discretionary
source-url: https://www.worcestershire.gov.uk/sites/default/files/2025-06/validation_document_2025.pdf
policy: Worcestershire Minerals Local Plan policies MLP 37 and MLP 38; Worcestershire Waste Core Strategy
  policies WCS 1, WCS 8, WCS 10 and WCS 11
source-text: Any development scheme which has potential to threaten the qualitative or quantitative status
  of any waterbody.
must-include:
- item: An assessment of the existing water environment (ground and surface water resources, including
    aquifers) at and near the site
  level: must
- item: The risk the development poses to the water environment and the proposed mitigation
  level: must
- item: Proposals for ongoing monitoring and reporting, with groundwater levels monitored over at least
    a complete water year (October to September)
  level: must
- item: Hydrogeomorphology assessments of the impact on watercourses
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 100. The list's 'Water Environment Hydrology
  / Hydrogeology Assessment'. Named in Checklists 1 (Regulation 3), 2 (Regulation 3 outline), 3 (mineral
  working), 4 (waste except landfill), 5 (landfill), 10 (section 73). 'Potential to threaten' a waterbody
  is a judgement, so it shows as discretionary. Checklists 1 and 2 are both Regulation 3 (the county council's
  own development), so both show as reg-3; Checklist 1 also covers reserved matters after a Regulation
  3 outline.
review-status: unverified
field-status: {}
