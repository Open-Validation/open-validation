reference: daylight-sunlight-assessment
local-authority: HRW
required-if:
  any:
  - condition:
      field: storey-count
      operator: '>'
      value: 4
      description: Buildings exceeding four storeys in height where adjoining other developed land or
        public open spaces.
  - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM1; Harrow Area Action Plan (2013)
  Policy AAP4
source-text: 'Statements will be required in support of all applications involving: ▪ buildings exceeding
  four storeys in height where adjoining other developed land or public open spaces, ▪ where proposed
  buildings or extensions could lead to overshadowing of other proposed buildings or spaces within the
  same development site, ▪ where the application site is itself subject to significant shading from adjoining
  buildings or trees.'
must-include:
- item: A daylight, vertical sky component, sunlight availability and shadow study, assessed against the
    BRE criteria
  level: must
- item: Existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties
  level: must
- item: The measures to be taken to mitigate the expected impact
  level: must
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 14. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Overshadowing within the site and significant shading of
  the site need judgement, so they show as discretionary.
review-status: unverified
field-status: {}
