reference: biodiversity-survey-report
local-authority: HRW
required-if:
  any:
  - site:
      in:
      - local-wildlife-site
      description: In or adjacent to a Site of Importance for Nature Conservation (SINC).
  - condition:
      field: roof-alteration
      value: true
      description: Alterations to a roof or loft space of a building (preliminary protected species survey).
  - condition:
      field: roof-space-room
      value: true
      description: Alterations to a roof or loft space of a building (preliminary protected species survey).
  - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policies DM20, DM21 and DM22; Harrow
  Area Action Plan (2013) Policy AAP12
source-text: Where a proposed development may have possible impacts on wildlife and biodiversity, information
  should be provided on existing biodiversity interests and possible impacts on them to allow full consideration
  of those impacts. Sites in or adjacent to Sites of Importance for Nature Conservation (SINCs) will require
  a biodiversity statement.
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: should
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: should
  required-if: discretionary
- item: Preliminary protected species survey where a roof or loft space is altered (may not be needed
    with substantial existing external lighting or no surrounding vegetation, judged case by case)
  level: must
  required-if:
    any:
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to a roof.
    - condition:
        field: roof-space-room
        value: true
        description: Alterations to a loft space.
- item: A plan of any alterations to external lighting or landscaping
  level: must
  required-if:
    any:
    - condition:
        field: external-lighting
        value: true
        description: Alterations to external lighting.
    - condition:
        field: landscaping-works
        value: true
        description: Alterations to landscaping.
- item: Extended phase one habitat survey where anything happens outside the current built footprint
  level: should
  required-if:
    all:
    - condition:
        field: footprint-increase
        value: true
        description: Works outside the current built environment footprint.
    - discretionary
- item: Surveys undertaken by a suitably qualified ecologist
  level: should
confidence: medium
notes: 'From the council''s list (dated 1 February 2024), Section 2 (Local Requirements), page 12-13.
  Section 3 lists it under ''Potential request for further information'' (Appendix 1) for most application
  types; the trigger here is the one Section 2 gives. Listed as ''Biodiversity'' (Appendix 1: ''Biodiversity
  Survey and Report''). The roof and loft space survey is needed ''before determination''. Other possible
  impacts on wildlife show as discretionary.'
review-status: unverified
field-status: {}
