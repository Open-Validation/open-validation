reference: roof-plan-proposed
local-authority: HRW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - condition:
      field: roof-alteration
      value: true
      description: A roof would be created or altered.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required where a roof would be created or altered by the proposed development.
must-include:
- item: Scale 1:100 or 1:200 with a scale bar
  level: must
- item: The shape of the roof, details of roofing materials and features such as chimney positions or
    windows
  level: must
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements), page 9. It
  may be combined with the proposed block plan where the roof plan is simple.
review-status: unverified
field-status: {}
