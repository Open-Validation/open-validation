reference: location-plan
local-authority: HRW
required-if:
  always: true
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: Scale 1:1250 or 1:2500, up to date, with the direction of north and a scale bar
  level: must
- item: At least one named road and enough information to make clear where the site is
  level: should
- item: All the surrounding buildings, roads and footpaths on land adjoining the site
  level: should
- item: A red line defining the boundaries of the application site and extending to the highway
  level: should
- item: A blue line around all other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements), page 7. The
  scale, north point and scale bar are in the item title; the rest 'should' be included.
review-status: unverified
field-status: {}
