reference: sustainability-statement
local-authority: HRW
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: Minor schemes.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM12; Harrow Area Action Plan
  (2013) Policy AAP4
source-text: Major and minor schemes should provide a sustainability statement outlining the elements
  of the scheme that address sustainable development issues, including the environmental, social and economic
  implications.
must-include:
- item: The elements of the scheme that address sustainable development issues, including environmental,
    social and economic implications
  level: must
confidence: medium
notes: 'From the council''s list (dated 1 February 2024), Section 2 (Local Requirements), page 25. The
  list gives examples that ''may'' be included: building design, resource use and greenspace incorporating
  wildlife corridors.'
review-status: unverified
field-status: {}
