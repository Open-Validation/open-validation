reference: town-centre-impact-assessment
local-authority: HRW
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure developments over 2,500 square metres of gross floor space.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail outside a designated retail centre.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with Harrow's Local Plan.
  - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM35; Harrow Area Action Plan
  (2013) Policies AAP17 and AAP18
source-text: Retail impact assessments are required for all retail and leisure developments over 2,500
  square metres of gross floor space and may be required for smaller developments such as those likely
  to have a significant impact on smaller centres. Retail impact assessments should also be provided for
  applications to locate retail outside a designated retail centre and not in accordance with Harrow’s
  local Plan.
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment area
  level: must
- item: The impact on town centre vitality and viability, including local consumer choice and trade, up
    to five years from the application (up to ten years for major schemes whose full impact will not be
    realised in five)
  level: must
- item: Justifies the scale of the development, explains why the site was chosen and confirms accessibility
    by a choice of transport modes
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 25-27. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Listed as 'Town Centre Uses'. Smaller developments likely
  to have a significant impact on smaller centres show as discretionary. The town centre sequential test
  is sent to unmapped.
review-status: unverified
field-status: {}
