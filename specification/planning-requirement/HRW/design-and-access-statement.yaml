reference: design-and-access-statement
local-authority: HRW
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted heritage statement text. From the audit: major development,
  or development in a designated area of one or more dwellings or 100 sqm or more (including householder
  work in a conservation area).'
review-status: unverified
field-status: {}
