reference: design-and-access-statement
local-authority: HRW
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: 'Any part of the development is in a designated area (Section 3: ''within a Conservation
          Area'').'
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floor space created is 100 square metres or more.
  - application-type:
      in:
      - outline
      - lbc
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Regulation 3, Planning (Listed Buildings and Conservation Areas) Regulations 1990
source-text: (a) development which is major development; ... (b) where any part of the development is
  in a designated area, development consisting of— (i) the provision of one or more dwellinghouses; or
  (ii) the provision of a building or buildings where the floor space created by the development is 100
  square metres or more.
must-include:
- item: Explains the design principles and justification for the designs applied, the evolution of the
    design before submission, the rationale and how it meets the criteria of the Development Plan
  level: should
- item: The proposed use and amount of development, its scale, layout, landscaping, lighting and overall
    appearance
  level: should
- item: How access to the development has been dealt with, including wheelchair accessible development
  level: should
- item: How the design contributes to sustainable development, particularly climate change mitigation
    and adaptation measures (green roofs and walls, sustainable drainage, greenspace, biodiversity, waste,
    water efficiency, flood risk, recycled materials)
  level: should
- item: How the development has complied with the energy hierarchy (energy efficiency first, then on-site
    renewable energy, then off-site solutions)
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements), page 6-7. Section
  3 also lists a Design and Access Statement for every outline application and for full applications including
  listed building consent; for householder and listed building consent applications it says '(if floor
  space created >=100sq.m and the site is within a Conservation Area)'. Listed building consent is included
  in full because the row cites Regulation 3 of the Listed Buildings Regulations, which requires one for
  every listed building consent application.
review-status: unverified
field-status: {}
