reference: arboriculturist-report
local-authority: HRW
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees may be affected on the site, on the street or on adjoining sites.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM22
source-text: Proposals where trees may be affected on the application site, on the street, or on adjoining
  sites should identify which trees are to be retained and the means of protecting these trees during
  construction.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: should
- item: Survey information, protection plan and method statement following BS 5837 'Trees in relation
    to construction'
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 28. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Listed as 'Tree Survey/Arboriculture Assessment'.
review-status: unverified
field-status: {}
