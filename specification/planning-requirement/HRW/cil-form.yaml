reference: cil-form
local-authority: HRW
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: New buildings or extensions creating 100 sq m or more of gross internal floor space.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of a dwelling, even below 100 sq m, by building or change of use.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM50; Community Infrastructure
  Levy Regulations 2010
source-text: Applications for new buildings or extensions which involve the creation of 100 square metres
  or more of gross internal floor space or involve the creation of a dwelling (even where below 100 square
  metres by building or change of use) will require the submission of certain information.
must-include:
- item: A completed Planning Application Additional Information Requirement Form (available on the Planning
    Portal)
  level: must
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements) and Section 3 (Application
  Types), page 13, 29-35. Listed as 'Community Infrastructure Levy'. Section 3 adds '(plus CIL PAAIR form)'
  to the application form for full, householder, reserved matters and Section 73 applications.
review-status: unverified
field-status: {}
