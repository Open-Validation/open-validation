reference: land-contamination-assessment
local-authority: HRW
required-if:
  any:
  - all:
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected on the site.
      - discretionary
    - condition:
        field: ground-disturbance
        value: true
        description: Ground-works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: A vulnerable or sensitive end user (residential, schools, nurseries, hospitals and
        allotments).
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM15
source-text: Where contamination is known or suspected or the development site is in the vicinity of such
  land, and ground- works are proposed; or, where there is a vulnerable or sensitive end user i.e. Residential,
  Schools, Nurseries, Hospitals and Allotments.
must-include:
- item: A desk study listing current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
- item: 'Where contamination is known or suspected or the site is near such land: a preliminary conceptual
    site model (pollutant linkages) and a preliminary risk assessment of those linkages'
  level: must
  required-if:
    any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected on the site.
    - discretionary
- item: A desk top study where the site is previously contaminated, in a source protection zone and over
    250 square metres in floor area
  level: should
  required-if:
    all:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected on the site.
    - site:
        in:
        - source-protection-zone
        description: In a source protection zone.
    - condition:
        field: floorspace
        operator: '>'
        value: 250
        description: Over 250 square metres in floor area.
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 13-14. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Listed as 'Contaminated Land Survey & Report'. 'In the
  vicinity' has no distance, so it shows as discretionary. Site investigation and remediation reports
  'may be required' for sensitive uses or where significant contamination is found.
review-status: unverified
field-status: {}
