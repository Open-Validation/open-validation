reference: section-existing
local-authority: HRW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels, or development next to changing ground levels.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications which involve a change in ground levels or where ... development
  is proposed next to changing ground levels.
must-include:
- item: Scale 1:50 or 1:100 with a scale bar
  level: must
- item: Cross section through the proposed building(s) and/or site
  level: must
- item: 'Where ground levels change: both existing and proposed finished ground levels'
  level: must
- item: Floor levels, building height and relationship to site boundaries
  level: must
- item: How proposed buildings relate to existing site levels and neighbouring development
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements), page 8-9. Listed
  as 'Existing and proposed site sections and finished floor and site levels'. On sloping sites it will
  be necessary to show how proposals relate to existing ground levels where they may be modified.
review-status: unverified
field-status: {}
