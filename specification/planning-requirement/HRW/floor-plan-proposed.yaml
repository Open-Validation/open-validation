reference: floor-plan-proposed
local-authority: HRW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - condition:
      field: building-works
      value: true
      description: New or amended floorspace and/or alterations to existing buildings.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new or amended floorspace and/or proposals to alter existing buildings.
must-include:
- item: Scale 1:50 or 1:100, with written dimensions showing the overall size of any new buildings or
    extensions, and a scale bar
  level: must
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements) and Section
  3 (Application Types), page 8, 30-33. Two plans are required, one existing and one proposed.
review-status: unverified
field-status: {}
