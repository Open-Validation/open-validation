reference: waste-management-plan
local-authority: HRW
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Proposed new developments (site waste management plan).
  - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM45
source-text: On small developments, the plans should show clearly the means by which refuse, and recycling
  will be stored and include details of how waste will be disposed of. ... Proposed new developments should
  be supported by a site waste management plan
must-include:
- item: 'Small developments: plans showing how refuse and recycling will be stored, with details of how
    waste will be disposed of'
  level: should
- item: 'Larger developments: a waste management strategy assessing waste arising, using the waste hierarchy,
    and setting out how waste will be reduced, recycled, sorted, stored and disposed of'
  level: should
  required-if: discretionary
- item: 'A site waste management plan for the construction phase: volume and type of materials demolished
    and/or excavated, reuse and recovery, and how off-site disposal will be minimised'
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: Proposed new developments.
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 23-24. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Combines 'Refuse and Recycling Disposal Details' and 'Site
  Waste Management Plan'. The refuse details have no clear trigger, so they show as discretionary.
review-status: unverified
field-status: {}
