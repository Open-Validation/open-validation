reference: landscaping-plan
local-authority: HRW
required-if: discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM22
source-text: Landscaping should be an integral part of the design concept for the site. Applications should
  be accompanied by landscaping details and include proposals for long term maintenance and landscape
  management.
must-include:
- item: Site survey and site analysis
  level: should
- item: A plan showing the location of existing and proposed shrubs and trees, indicating those to be
    retained or removed
  level: should
- item: Landscape design proposals and a planting plan
  level: should
- item: Hard landscaping details such as structures, surfaces and ancillary objects
  level: should
- item: How retained vegetation will be protected during construction
  level: should
- item: A maintenance and management plan
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 21. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Listed as 'Landscaping'. Section 2 gives no trigger and
  Appendix 1 lists 'Landscaping details' only as a possible request, so it shows as discretionary.
review-status: unverified
