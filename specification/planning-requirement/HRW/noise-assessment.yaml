reference: noise-assessment
local-authority: HRW
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development would generate noise disturbance issues for adjoining occupants.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise pollution is already poor and could have an adverse impact on the proposed development.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM1; Harrow Area Action Plan (2013)
  Policy AAP4
source-text: A Noise Impact Assessment should be submitted where the development proposal would generate
  noise disturbance issues for adjoining occupants and for developments where noise pollution is already
  poor and could have an adverse impact on the proposed development.
must-include:
- item: Confirms whether noise is an issue
  level: must
- item: The mitigation measures to ensure occupants are not negatively affected by existing noise pollution
  level: must
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 22. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Listed as 'Noise Impact Assessment'.
review-status: unverified
field-status: {}
