reference: site-plan
local-authority: HRW
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
      - outline
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications including Change of Use.
must-include:
- item: Two plans, one existing and one proposed
  level: must
- item: Scale 1:200 or 1:500, with the direction of north and a scale bar
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on the site and on land adjoining the site
  level: should
- item: Precise positions of vehicular access points, existing and where appropriate proposed, with dimensions
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees and hedgerows on the site and adjacent land
  level: should
- item: The extent of any hard surfacing and the type of boundary treatment (e.g. walls, fences)
  level: should
- item: Landscape features
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements) and Section
  3 (Application Types), page 7-8, 30-35. Listed as 'Block Plan'. Section 3 asks for it with householder,
  full, listed building consent, outline and reserved matters applications (and minerals applications),
  and as a possible request for Section 73 applications.
review-status: unverified
field-status: {}
