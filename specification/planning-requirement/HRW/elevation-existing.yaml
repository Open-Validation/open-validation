reference: elevation-existing
local-authority: HRW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: external-alterations
          value: true
          description: Alterations to the exterior of existing buildings.
  - application-type:
      in:
      - advertising
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings.
must-include:
- item: Scale 1:50 or 1:100, with written dimensions showing the overall size of any new buildings or
    extensions, and a scale bar
  level: must
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 1 (National Requirements) and Section
  3 (Application Types), page 8, 29-33. Section 3 lists 'Existing and Proposed Floorplans and Elevations'
  for householder, full, listed building consent and reserved matters applications, and 'Existing and
  Proposed Elevations' for advertisement consent.
review-status: unverified
field-status: {}
