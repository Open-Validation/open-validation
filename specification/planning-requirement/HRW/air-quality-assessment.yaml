reference: air-quality-assessment
local-authority: HRW
required-if:
  all:
  - ref: major-development
  - any:
    - site:
        in:
        - air-quality-management-area
        description: In or near an Air Quality Management Area.
    - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM1
source-text: Schemes that may impact on air quality by virtue of the nature of the uses proposed, the
  associated transport generation or their location in or near to an Air Quality Management Area (AQMA)
  should provide an air quality assessment. This is for Major Planning Applications only.
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 11. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Only for major applications. Impacts from the nature of
  the uses or transport generation need judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
