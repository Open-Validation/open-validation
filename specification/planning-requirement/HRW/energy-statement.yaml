reference: energy-statement
local-authority: HRW
required-if:
  ref: major-development
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM12; Harrow Area Action Plan
  (2013) Policy AAP10; London Plan
source-text: Policy 5.2 of the London Plan requires each major development proposal to submit a detailed
  energy assessment.
must-include:
- item: How the energy hierarchy has been taken into account in the design and layout, and how the proposal
    will meet the London Plan carbon reduction targets
  level: must
- item: Predicted energy demand and the degree to which the development meets current energy efficiency
    standards
  level: should
- item: Measures to maximise energy efficiency and reduce carbon dioxide emissions (design, orientation,
    passive solar gain, energy supply, renewables, heating and ventilation, controls, materials)
  level: should
- item: 'Major residential development: compliance with the London Plan zero carbon requirement'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential development.
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 15-16. Listed
  as 'Energy Assessment'.
review-status: unverified
field-status: {}
