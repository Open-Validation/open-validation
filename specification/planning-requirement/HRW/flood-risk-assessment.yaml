reference: flood-risk-assessment
local-authority: HRW
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in Flood Zone 2 or 3, a surface-water flood area or a Critical Drainage
        Area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
source-text: a SiteSpecific Flood Risk Assessment with the planning application.
must-include:
- item: Surface water drainage strategy
  level: must
  source-text: Surface water drainage strategy must be set out within the FRA for all new development
    applications including a single dwelling.
confidence: medium
notes: 'Audit (wrong_trigger, missing_requirement): the excerpt omitted the triggers. From the audit:
  Flood Zones 2 and 3, surface-water areas, sites of 1 ha or more and Critical Drainage Areas, including
  minor development and householder extensions, outbuildings and hard surfacing.'
review-status: unverified
field-status: {}
