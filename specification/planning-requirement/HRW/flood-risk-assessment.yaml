reference: flood-risk-assessment
local-authority: HRW
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Environment Agency Fluvial Flood Zone 2 or 3 (including minor development, permitted
        development and change of use).
  - site:
      in:
      - surface-water-flood-risk
      description: Environment Agency Flood Map for Surface Water 1 in 30 or 1 in 100 years.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Sites of 1 hectare or greater in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Sites of 1 hectare or greater in flood zone 1.
  - site:
      in:
      - critical-drainage-area
      description: A designated critical drainage area identified in the Harrow SFRA.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM9; Harrow Area Action Plan (2013)
  Policy AAP9
source-text: 'Planning applications for development in any of these mapped flood zones will be required
  to submit a Site- Specific Flood Risk Assessment with the planning application. This includes: ▪ minor
  developments i.e. extensions, outbuildings, hard surfacing, etc. ▪ permitted developments and change
  of use in flood zone 2 and 3, ▪ proposals on sites of 1 hectare (ha) or greater in flood zone 1, ▪ any
  development in a designated critical drainage area identified in Harrow SFRA.'
must-include:
- item: A surface water drainage strategy within the FRA, for all new development including a single dwelling
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New development, including a single dwelling.
- item: Identifies and assesses the risks of all forms of flooding to and from the development and how
    they will be managed, taking climate change into account
  level: should
- item: Safe access to and from the development in areas at risk, and flood compensation storage for displaced
    flood water in zones 3 and 3b
  level: should
- item: Sustainable drainage design reducing surface water discharge to the greenfield run-off rate of
    5 l/s/ha from all impermeable areas
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 17-19. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. The four mapped zones are EA Fluvial Flood Zones 2 and
  3 and the EA Flood Map for Surface Water 1 in 30 and 1 in 100 year extents. The sequential test (major
  development in Flood Zones 2 and 3) is sent to unmapped.
review-status: unverified
field-status: {}
