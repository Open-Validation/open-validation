reference: planning-statement
local-authority: HRW
required-if: discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM1
source-text: A planning statement identifies the context and need for a proposed development and sets
  out the overall case for the proposal.
must-include:
- item: An assessment of how the proposed development accords with relevant national, regional and local
    planning policies
  level: should
- item: 'Larger schemes: a phasing plan'
  level: should
  required-if: discretionary
- item: 'Major applications: a non-technical summary suitable for a wider audience'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 23. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Section 2 gives no trigger (for small and minor developments
  these issues may be covered in the Design and Access Statement), so it shows as discretionary.
