reference: fire-statement
local-authority: HRW
required-if:
  any:
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
  - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  London Plan policy D12(A)
source-text: 'Fire statements must be submitted on a form published by the Secretary of State (or a form
  to similar effect) contain the particulars specified or referred to in the form, which includes information
  about (not exhaustive list):'
must-include:
- item: Gateway One fire statement on the Secretary of State's form (or one to similar effect) with the
    particulars it asks for
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
- item: 'Planning Fire Safety Strategy: who wrote and approved the fire safety information, and their
    competence (qualifications and experience)'
  level: should
- item: 'Information under each criterion of London Plan Policy D12(A): space for fire appliances and
    assembly points; passive and active safety measures; construction products and materials; means of
    escape and evacuation strategy; access and equipment for firefighting'
  level: should
- item: The relevant fire safety design codes and standards, and how they ensure the highest standards
    of fire safety
  level: should
confidence: medium
notes: 'From the council''s list (dated 1 February 2024), Section 1 (National Requirements) and Section
  2 (Local Requirements), page 9, 24. Covers the ''Fire Safety Statement and/or Fire Safety Strategy''
  (Section 1) and the ''Reasonable Exception Statement'' (Section 2, criteria 1 to 5). The list cites
  Article 9A (relevant buildings: 2 or more dwellings or educational accommodation, and 18 metres or more
  or 7 or more storeys) but gives no trigger for the Planning Fire Safety Strategy or Reasonable Exception
  Statement, so other applications show as discretionary.'
review-status: unverified
