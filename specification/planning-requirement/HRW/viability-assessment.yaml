reference: viability-assessment
local-authority: HRW
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: On-site affordable housing provision is not proposed to be met by the application.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Core Strategy (2012) Policy CS1.J
source-text: A Financial Viability Appraisal is required for any application where the provision of on-site
  affordable housing is not proposed to be met by the planning application.
must-include:
- item: An open book assessment, for publication on the council's Planning Register
  level: must
- item: A written assurance to cover all reasonable costs of the council's independent assessment
  level: must
- item: Locally relevant benchmark data (new builds in the relevant part of the borough)
  level: must
- item: The names of the applicants, agents, consultants, parent or holding companies, development managers
    and other interested parties
  level: must
- item: 'Where it contains commercially sensitive information: a second, redacted version explaining why
    the redaction is appropriate'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 16-17. Listed
  as 'Financial Viability Appraisal'.
review-status: unverified
field-status: {}
