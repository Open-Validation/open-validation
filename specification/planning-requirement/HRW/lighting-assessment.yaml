reference: lighting-assessment
local-authority: HRW
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements (possible request).
    - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM1; Harrow Area Action Plan (2013)
  Policy AAP4
source-text: Proposals involving the provision of publicly accessible developments in the vicinity of
  residential property, a listed building or conservation area or open countryside where external lighting
  would be provided or made necessary by the development will need a lighting assessment.
must-include:
- item: The location, type, number and intensity of any lighting and the proposed hours it would be switched
    on
  level: must
- item: As a minimum, a layout plan showing beam orientation and a schedule of the equipment
  level: must
- item: A more detailed lighting study for proposals such as sports grounds or development close to housing,
    nature conservation areas or in a rural area
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements) and Section 3 (Application
  Types), page 21, 29. Section 3 lists it under 'Potential request for further information' (Appendix
  1) for most application types; the trigger here is the one Section 2 gives. Listed as 'Lighting'. Whether
  a publicly accessible development is 'in the vicinity' of homes, a listed building, a conservation area
  or open countryside needs judgement, so it shows as discretionary. Section 3 lists a lighting assessment
  for illuminated advertisements as a possible request.
review-status: unverified
field-status: {}
