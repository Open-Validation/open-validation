reference: heritage-statement
local-authority: HRW
required-if:
  all:
  - application-type:
      in:
      - lbc
      - hh
      - full
      - outline
      - reserved-matters
      - advertising
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - archaeological-priority-area
      description: Affects a registered park and garden, conservation area, listed building, non-designated
        heritage asset, scheduled ancient monument or archaeological priority area, or its setting.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
source-text: 'A heritage statement is needed for any application for listed building consent, planning
  permission or advertisement consent that affects one or more of these heritage assets: … a registered
  park and garden or its setting a conservation area or its setting a listed building or its setting a
  non-designated heritage asset or it’s setting e.g. a locally listed building, park or garden, or its
  setting a scheduled ancient monument or its setting an archaeological priority area'
confidence: medium
notes: 'Audit (wrong_app_type): the workbook had it only under LBC and adverts. It can be incorporated
  within a Design and Access Statement under the heading ''Heritage Statement''.'
review-status: unverified
