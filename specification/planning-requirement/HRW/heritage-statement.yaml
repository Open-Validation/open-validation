reference: heritage-statement
local-authority: HRW
required-if:
  all:
  - application-type:
      in:
      - lbc
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - advertising
  - site:
      in:
      - park-and-garden
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - archaeological-priority-area
      description: Affects a registered park and garden, conservation area, listed building, non-designated
        heritage asset or scheduled monument (or the setting of any of these), or an archaeological priority
        area.
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM7
source-text: 'A heritage statement is needed for any application for listed building consent, planning
  permission or advertisement consent that affects one or more of these heritage assets: ▪ a registered
  park and garden or its setting ▪ a conservation area or its setting ▪ a listed building or its setting
  ▪ a non-designated heritage asset or it’s setting e.g. a locally listed building, park or garden, or
  its setting ▪ a scheduled ancient monument or its setting ▪ an archaeological priority area'
must-include:
- item: A schedule of works
  level: must
- item: Describes and analyses the significance of the site and its setting, with details of the heritage
    assets affected, emphasising the parts directly affected
  level: must
- item: Assesses the impact of the proposal on that significance against national and local heritage legislation,
    policy and guidance
  level: must
- item: As a minimum, the relevant historic environment record consulted and the heritage assets assessed
    using appropriate expertise where necessary
  level: must
- item: 'Where the site includes or may include heritage assets with archaeological interest: an appropriate
    desk-based assessment and, where necessary, a field evaluation'
  level: must
  required-if:
    any:
    - site:
        in:
        - archaeological-priority-area
        description: In an archaeological priority area.
    - discretionary
- item: 'More complex cases: sequential historic plans or cross-sections, map regression, and mitigation
    proposals'
  level: should
  required-if: discretionary
- item: A structural engineer's report describing any structural consequences of proposed alterations
  level: should
  required-if:
    condition:
      field: structural-alteration
      value: true
      description: The proposal involves structural alterations.
- item: A structural survey by a suitably qualified conservation accredited surveyor where substantial
    demolition is involved
  level: should
  required-if:
    condition:
      field: structural-demolition
      value: true
      description: The proposal involves substantial demolition.
- item: If incorporated in the Design and Access Statement, included under the heading 'Heritage Statement'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 19-20. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. 'Planning permission' covers householder, full, outline,
  reserved matters and Section 73 applications. The level of information should be proportionate to the
  significance and the scale of the alteration.
review-status: unverified
field-status: {}
