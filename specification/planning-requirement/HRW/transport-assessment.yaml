reference: transport-assessment
local-authority: HRW
required-if:
  any:
  - condition:
      field: parking-change
      value: true
      description: Implications for car parking.
  - discretionary
source-url: https://www.harrow.gov.uk/downloads/file/23287/planning-application-requirements.pdf
policy: Harrow Development Management Policies Local Plan (2013) Policy DM43
source-text: Any proposed development that will have implications for transportation in terms of car parking
  or traffic movements should be accompanied by a Transport Statement (TS) or Transport Assessment (TA).
must-include:
- item: 'Smaller schemes (Transport Statement): existing site conditions and proposed transport aspects
    (parking, site access points, servicing, access to public transport, cycle parking)'
  level: should
- item: 'Major proposals (Transport Assessment): a more detailed appraisal of existing site conditions'
  level: should
  required-if:
    ref: major-development
- item: Measures to improve access by public transport, walking and cycling, to reduce parking need and
    to mitigate transport impacts
  level: should
confidence: medium
notes: From the council's list (dated 1 February 2024), Section 2 (Local Requirements), page 27. Section
  3 lists it under 'Potential request for further information' (Appendix 1) for most application types;
  the trigger here is the one Section 2 gives. Implications for traffic movements need judgement, so that
  part shows as discretionary.
review-status: unverified
field-status: {}
