reference: viability-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Does not meet the policy requirements for affordable housing.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Does not meet the policy requirements for infrastructure.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies H2, DS4 and HS1; NPPF paragraph 57
source-text: development proposals that do not meet the policy requirements set out in the Nuneaton and
  Bedworth borough for the delivery of affordable housing and infrastructure.
must-include:
- item: Prepared by an appropriately qualified person following Government guidance on viability
  level: must
- item: 'An executive summary: gross development value, benchmark land value with premium, costs, developer
    return, assumptions, changes since the plan viability assessment and proposed contributions against
    policy'
  level: must
- item: A full, un-redacted assessment (to be published, save exceptional justified circumstances)
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 79. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline. The applicant pays for independent verification.
review-status: unverified
field-status: {}
