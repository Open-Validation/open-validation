reference: bng-metric
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Nuneaton and Bedworth Borough Plan policy NE3
source-text: 'Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015:'
must-include:
- item: The completed metric calculation tool showing the pre-development biodiversity value on the date
    of application (or earlier proposed date), including the publication date of the metric
  level: must
- item: A statement of intention as to how net gain will be achieved (onsite, offsite or both), ideally
    with a draft completed statutory metric
  level: should
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), page 28-31. Shown with the statutory biodiversity
  gain condition: the list says BNG applies to major and small sites ''subject to the confirmed exemptions''
  and not to householder applications.'
review-status: unverified
field-status: {}
