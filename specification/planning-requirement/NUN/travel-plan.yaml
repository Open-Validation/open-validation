reference: travel-plan
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - non-material-amendment
  - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policy HS2; NPPF paragraph 111
source-text: 'A Transport Assessment and a Travel Plan are required for: … major development proposals
  that generate significant traffic movements; or … other development that creates or exacerbates a traffic
  problem or has an impact on the local highway network. … development proposals where it is agreed that
  resulting transport issues are limited.'
must-include:
- item: Benchmark travel data, including trip generation databases
  level: must
- item: The nature of the development and the forecast trips by all modes
  level: must
- item: Existing travel habits in the surrounding area
  level: must
- item: Proposals to reduce single car occupancy journeys
  level: must
- item: Improved access to active travel infrastructure and public transport
  level: must
- item: A Framework Travel Plan for certain outline applications
  level: must
  required-if:
    all:
    - application-type:
        in:
        - outline
    - discretionary
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 73-75. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, prior notification, reserved matters, s73, non-material amendments. Even
  for major development the trigger is 'significant traffic movements', and for other development a traffic
  problem or highway impact, so it is discretionary.
review-status: unverified
field-status: {}
