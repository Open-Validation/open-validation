reference: roof-plan-existing
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - reserved-matters
      - s73
      - approval-condition
      - non-material-amendment
  - condition:
      field: roof-alteration
      value: true
      description: The proposal will alter the roof.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: If the proposal will alter the roof.
must-include:
- item: At 1:50 or 1:100, the existing layout of the roof structure
  level: must
- item: The scale used and a scale bar
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 13. The matrix (pages 83-84) marks it 'P'
  (possible) for householder, full, outline, listed building consent, lawful development certificates,
  reserved matters, s73, approval of details, non-material amendments.
review-status: unverified
field-status: {}
