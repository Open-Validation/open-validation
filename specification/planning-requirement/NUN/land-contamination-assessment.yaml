reference: land-contamination-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
  - any:
    - all:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected on or near the site.
      - condition:
          field: ground-disturbance
          value: true
          description: Ground works are proposed.
    - all:
      - site:
          in:
          - contaminated-land
          description: A contaminated site.
      - condition:
          field: sensitive-end-use
          value: true
          description: A sensitive or vulnerable end user, such as allotments, residential development
            (including rural building conversions), schools or hospitals.
    - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policy BE1; NPPF paragraph 190
source-text: Where contamination is known or suspected, or the development site is in the vicinity of
  such land and ground works are proposed; … Where there could be harm to a drinking water supply, ground
  water and/or surface water; and … There is a sensitive or vulnerable end user, such as allotments, residential
  development, including residential rural building conversions, schools or hospital. … A Phase 1 Assessment
  is required for all applications which would result in a sensitive end use on a contaminated site or
  there could be harm to a drinking water supply, ground water and/or surface water.
must-include:
- item: Prepared by a suitably qualified person
  level: must
- item: 'Phase 1: site history and walkover, a preliminary risk assessment of contaminant sources, pathways
    and receptors, and a conceptual site model'
  level: must
- item: Recommendations for intrusive contamination investigation
  level: must
- item: 'Where there could be harm to a drinking water supply, ground water or surface water: pollution
    prevention measures to protect ground and surface water'
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 22-23. The matrix (pages 83-84) marks it 'P'
  (possible) for householder, full, outline, prior notification, reserved matters, s73. Possible harm
  to a drinking water supply, ground water or surface water is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
