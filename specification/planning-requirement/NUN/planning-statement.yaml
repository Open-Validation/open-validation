reference: planning-statement
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - ref: major-development
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: NPPF paragraph 8
source-text: all major development proposals
must-include:
- item: How the development relates to national policy and the development plan
  level: must
- item: The impacts on the economic, environmental and social dimensions of sustainable development, as
    far as practical
  level: must
- item: 'Where the proposal conflicts with policy: the material considerations that outweigh the conflict'
  level: must
  required-if:
    condition:
      field: departure-from-development-plan
      value: true
      description: Does not accord with national policy or the plan.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 59. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, reserved matters, s73.
review-status: unverified
field-status: {}
