reference: transport-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - non-material-amendment
  - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies HS2, HSG4, HSG6, HSG7, EMP2 and EMP6; NPPF paragraph
  111
source-text: 'A Transport Assessment and a Travel Plan are required for: … major development proposals
  that generate significant traffic movements; or … other development that creates or exacerbates a traffic
  problem or has an impact on the local highway network. … development proposals where it is agreed that
  resulting transport issues are limited.'
must-include:
- item: Existing and proposed trips by all modes, with transport modelling scoped with Warwickshire County
    Council
  level: must
- item: Accessibility of the site by all modes and the likely modal split
  level: must
- item: Loading areas, manoeuvring (swept paths), servicing and parking
  level: must
- item: Measures to improve access by public transport, walking and cycling and mitigate impacts
  level: must
- item: Access arrangements, including visibility splays, geometry and swept paths for the largest vehicles
  level: must
- item: Where transport issues are agreed to be limited, a Transport Statement covering loading, servicing,
    parking, sustainable access measures and access arrangements may be provided instead
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 73-75. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, prior notification, reserved matters, s73, non-material amendments. Even
  for major development the trigger is 'significant traffic movements', and for other development a traffic
  problem or highway impact, so it is discretionary.
review-status: unverified
field-status: {}
