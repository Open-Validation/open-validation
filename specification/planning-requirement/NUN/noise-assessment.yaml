reference: noise-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - non-material-amendment
  - any:
    - condition:
        field: food-or-drink-use
        value: true
        description: New use or change of use to restaurants, cafes, takeaways or similar.
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Nightclubs, F1/F2 and E(d) uses such as places of worship, halls, nurseries, cinemas,
          sports and leisure.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential development.
      - condition:
          field: near-licensed-premises
          value: true
          description: Near to licensed premises and cultural venues.
    - all:
      - condition:
          field: class-b2-b8-floorspace
          operator: '>'
          value: 0
          description: New industrial development (B2 and B8).
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Close to existing residential development.
    - condition:
        field: renewable-energy-development
        value: true
        description: Energy generation development, including wind turbines.
    - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies SA1, H3, BE2 and BE3; NPPF paragraphs 170 and 180
source-text: 'development proposals that have the potential to raise issues of disturbance, or are considered
  to be noise sensitive developments. An Assessment will generally be required for the following types
  of application: o new, including change of use: within Use Class E (restaurants, snack bars, cafes),
  sui- generis uses (nightclub and takeaways), E (e-f) and F1 (places of worship, church halls, clinics,
  health centres, crèches, day nurseries, consulting rooms), E (d) and F2 (cinemas, music, concert halls,
  dance, sports halls, swimming baths, skating rinks, gymnasiums, other indoor and outdoor sports and
  leisure uses, bingo halls and casinos); o new residential development near to licensed premises and
  cultural venues; o new industrial development (Use Class B2 and B8) close to existing residential development;
  o new residential development adjoining established industrial estates or transport sources; and o energy
  generation development including wind turbine development.'
must-include:
- item: The potential sources of noise and their effect on local amenity and environmental receptors
  level: must
- item: How the developer intends to overcome these issues
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 51. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, prior notification, reserved matters, s73, non-material amendments. Residential
  development next to industrial estates or transport sources, and other 'potential to raise issues of
  disturbance', are judgements, so they are discretionary.
review-status: unverified
field-status: {}
