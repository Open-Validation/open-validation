reference: floor-plan-proposed
local-authority: NUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - ldc-prospective-use
        - reserved-matters
        - outline
        - lbc
        - ldc-existing-use
        - prior-approval
        - s73
        - approval-condition
        - non-material-amendment
    - condition:
        field: floor-layout-change
        value: true
        description: The proposal will create, alter, or add to a floor.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: If the proposal will create, alter, or add to a floor.
must-include:
- item: At 1:50 or 1:100, the proposed layout of the whole of each floor created, altered or added to
    (a partial plan is acceptable for a single room extension)
  level: must
- item: The name of each room or area
  level: must
- item: 'For dwellings: gross internal area measurements, with an additional measurement excluding storage
    space'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal includes dwellings.
- item: The scale used and a scale bar
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 12-13. The matrix (pages 83-84) marks it 'E'
  (essential) for householder, full, proposed lawful development certificates, reserved matters; 'P' (possible)
  for outline, listed building consent, existing lawful development certificates, prior notification,
  s73, approval of details, non-material amendments.
review-status: unverified
field-status: {}
