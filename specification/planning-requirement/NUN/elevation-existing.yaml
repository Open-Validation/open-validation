reference: elevation-existing
local-authority: NUN
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - reserved-matters
  - all:
    - application-type:
        in:
        - full
        - outline
        - prior-approval
        - s73
        - approval-condition
        - non-material-amendment
    - condition:
        field: building-works
        value: true
        description: The proposal will create, alter, or add to a building/structure.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: If the proposal will create, alter, or add to a building/structure.
must-include:
- item: At 1:50 or 1:100, each side of the building or structure that will be altered or added to, labelled
    by the direction it faces
  level: must
- item: The scale used and a scale bar
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 12. The matrix (pages 83-84) marks it 'E'
  (essential) for householder, full, listed building consent, advertisement consent, both lawful development
  certificates, reserved matters; 'P' (possible) for outline, prior notification, s73, approval of details,
  non-material amendments. Full applications are shown with the list's condition because they include
  changes of use without building work. The list says applications 'will usually require both existing
  and proposed elevations'.
review-status: unverified
field-status: {}
