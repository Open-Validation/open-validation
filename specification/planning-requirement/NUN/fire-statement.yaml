reference: fire-statement
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - non-material-amendment
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: A building containing two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: the provision of one or more relevant buildings, or … development of an existing relevant
  building … or development within the curtilage of a relevant building. … buildings that contain two
  or more dwellings (including flats) or educational accommodation (residential accommodation for the
  use of students at boarding school or in later stages of education); and … the building is 18m or more
  in height, or 7 or more storeys whichever is reached first.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 37. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, prior notification, reserved matters, s73, non-material amendments.
review-status: unverified
field-status: {}
