reference: design-and-access-statement
local-authority: NUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with 100 m2 (gross external area) or more.
  - application-type:
      in:
      - lbc
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: planning permission for major development, as defined in Article 2 of the Town and Country
  Planning (Development Management Procedure (England) Order 2015 for both outline and full applications;
  … planning permission for development in a conservation area for one or more dwelling or for a building
  or buildings with a floor space of 100 m2 (gross external area) or more; and … applications for listed
  building consent.
must-include:
- item: 'For listed building consent: how the design principles take account of the building''s special
    architectural or historic importance, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: any consultation undertaken and how it informed the proposed works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 7-8. The matrix (pages 83-84) marks it 'E'
  (essential) for listed building consent; 'P' (possible) for full, outline. Not needed for waste development,
  a material change of use, or engineering or mining operations.
review-status: unverified
field-status: {}
