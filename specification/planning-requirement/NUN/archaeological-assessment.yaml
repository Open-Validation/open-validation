reference: archaeological-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - non-material-amendment
  - condition:
      field: ground-disturbance
      value: true
      description: The development involves ground intrusion (householder extensions are excepted).
  - any:
    - site:
        in:
        - scheduled-monument
        description: Within, or adjacent to, a Scheduled Monument.
    - site:
        in:
        - listed-building
        description: Forms part of, or is associated with, a Listed Building.
    - site:
        in:
        - park-and-garden
        - battlefield
        description: Within a registered park or garden or registered battlefield.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.2
        description: The site is larger than 0.2ha.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.2
        description: The site is larger than 0.2ha.
    - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies BE4, SA1 and HS3; NPPF paragraph 200
source-text: 'All applications where the proposed development: … lies within, or adjacent to, a Scheduled
  Monument; … forms part of, or is associated with, a Listed Building; … is located within an area included
  in the Historic England Register of Parks and Gardens of Special Historic Interest in England or Historic
  England''s Register of Historic Battlefields; … the proposed development site is larger than 0.2ha in
  area, or … is proposed on a site which includes or has the potential to include heritage assets with
  archaeological interest. … Note: exceptions – householder extensions and any development with no ground
  intrusion.'
must-include:
- item: Either a letter from Warwickshire County Council's Archaeological Information and Advice team
    confirming a pre-determination assessment is not necessary, or a desk-based assessment (and field
    evaluation results if necessary) by a suitably qualified archaeologist to CIfA standards
  level: must
- item: The archaeological interest and significance of known heritage assets
  level: must
- item: The potential of the site to contain unknown archaeological heritage assets
  level: must
- item: The positive and negative impacts of the development, with any harm justified
  level: must
- item: Any proposed mitigation or enhancement measures
  level: must
- item: The unique Historic Environment Record reference number
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 18-19. The matrix (pages 83-84) marks it 'P'
  (possible) for householder, full, outline, reserved matters, s73, non-material amendments. Sites with
  the potential to include archaeological heritage assets are a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
