reference: archaeological-assessment
local-authority: NUN
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - listed-building-setting
      description: The site is near a scheduled monument or listed building.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.2
      description: The site is over 0.2 hectares.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.2
      description: The site is over 0.2 hectares.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: Applicants should note that pre- or post-determination archaeological assessment and/or fieldwork
  may also be necessary for sites which do not fulfil any of the criteria outlined above.
confidence: medium
notes: 'Audit (missing_requirement): it applies to full applications too, not only outline. From the audit:
  sites near scheduled monuments or listed buildings, or over 0.2ha.'
review-status: unverified
field-status: {}
