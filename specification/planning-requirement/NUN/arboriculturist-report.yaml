reference: arboriculturist-report
local-authority: NUN
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees are protected (e.g. by a Tree Preservation Order).
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees of 75mm stem diameter or more on the site, overhanging it, or beyond the red
        line within 12 times their stem diameter.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: Tree Survey and Arboricultural Impact Assessment (AIA) When is this required? This is required
  (as per British Standard 5837 2012) in all instances where trees are protected (e.g. by way of Tree
  Preservation Order) or located within the site boundary that have a stem diameter of 75 mm or more,
  and wherever trees with a stem diameter of 75 mm or more overhang the site, or are located beyond the
  site red line boundary within a distance of up to 12 times their estimated stem diameter.
confidence: medium
notes: 'Audit (wrong_app_type): a development-application requirement, not only for works to trees.'
review-status: unverified
field-status: {}
