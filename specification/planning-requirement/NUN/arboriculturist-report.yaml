reference: arboriculturist-report
local-authority: NUN
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - prior-approval
        - reserved-matters
        - s73
        - non-material-amendment
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Trees are protected (e.g. by a Tree Preservation Order).
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees with a stem diameter of 75 mm or more on the site, overhanging it, or beyond
            the red line within 12 times their stem diameter.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies DS1, TC2, BE3 and NE3; BS 5837:2012
source-text: This is required (as per British Standard 5837 2012) in all instances where trees are protected
  (e.g. by way of Tree Preservation Order) or located within the site boundary that have a stem diameter
  of 75 mm or more, and wherever trees with a stem diameter of 75 mm or more overhang the site, or are
  located beyond the site red line boundary within a distance of up to 12 times their estimated stem diameter.
must-include:
- item: 'A tree survey by a suitably qualified arboriculturist to BS 5837:2012: reference number, species,
    height, stem diameter, branch spread at four cardinal points, crown and first branch heights, life
    stage, condition observations, remaining contribution and category, with a tree survey plan'
  level: must
- item: Tree Constraints Plan (including over parameter and indicative masterplans), Tree Retention/Removal
    Plan, Arboricultural Impact Assessment, Tree Protection Plan, Arboricultural Method Statement and
    a separate New Tree Planting Plan
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10 or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial and industrial development.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 76-77. The matrix (pages 83-84) marks it 'E'
  (essential) for tree works (including TPO consent); 'P' (possible) for householder, full, outline, prior
  notification, reserved matters, s73, non-material amendments.
review-status: unverified
field-status: {}
