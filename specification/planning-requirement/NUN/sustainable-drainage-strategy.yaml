reference: sustainable-drainage-strategy
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - non-material-amendment
  - any:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        description: Development with surface water drainage in flood zone 2 or 3, or at risk of surface
          water flooding.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policy NE4; NPPF paragraphs 165-175
source-text: major development proposals; and … development with surface water drainage in an area at
  risk of flooding such as flood zones 2 or 3, or at risk of surface water flooding.
must-include:
- item: Existing surface water drainage arrangements, rates and volumes of run-off
  level: must
- item: Proposals to restrict discharge rates and manage surface water using SuDS
  level: must
- item: How the multifunctional benefits of SuDS have been considered
  level: must
- item: How climate change has been accounted for
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 65-66. Surface Water Drainage Assessment (MHCLG's
  retired id for a drainage strategy). The matrix (pages 83-84) marks it 'P' (possible) for full, outline,
  reserved matters, s73, non-material amendments.
review-status: unverified
field-status: {}
