reference: site-plan
local-authority: NUN
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - outline
        - lbc
        - advertising
        - ldc-existing-use
        - ldc-prospective-use
        - prior-approval
        - s73
        - approval-condition
        - consent-under-tpo
        - notice-trees-in-con-area
        - non-material-amendment
    - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block Plan based on an up-to date map, at a scale of 1:500 or Site Plan at 1:200 (if the
  proposal will alter an existing building/ structure footprint or create a new building/structure footprint).
must-include:
- item: A block plan at 1:500, or a site plan at 1:200 if the proposal alters or creates a building or
    structure footprint
  level: must
- item: The proposed development within the context of existing
  level: must
- item: Any existing or proposed vehicle parking areas
  level: must
- item: The species, position and spread of all trees on the site, and those on adjacent land that overhang
    the site or are affected by the development
  level: must
- item: The scale used, a linear scale bar and one significant measurement
  level: must
- item: Proposed boundary treatment, including walls or fencing
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: Walls or fencing are proposed.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 9. The matrix (pages 83-84) marks it 'E' (essential)
  for householder, full, reserved matters; 'P' (possible) for all other types. The list gives no test
  for the 'possible' types, so they are discretionary.
review-status: unverified
field-status: {}
