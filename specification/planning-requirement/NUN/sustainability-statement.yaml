reference: sustainability-statement
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - non-material-amendment
  - ref: major-development
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies NE1, NE4, BE2, BE3 and TC2; NPPF chapter 14
source-text: major development proposals.
must-include:
- item: How sustainability has been or will be addressed (e.g. water, materials, waste, pollution, health,
    ecology, fabric, climate resilience, flood risk, renewable energy and transport)
  level: must
- item: 'For non-domestic development of 1,000 m2 or more: BREEAM, with ''Very Good'' achieved where feasible
    (a pre-assessment estimator at outline)'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-domestic development of 1,000 m2 or more.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 71. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, reserved matters, s73, non-material amendments. The page-71 trigger reads
  'major development proposals.'
review-status: unverified
field-status: {}
