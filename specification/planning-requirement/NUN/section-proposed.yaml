reference: section-proposed
local-authority: NUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - prior-approval
        - s73
        - non-material-amendment
    - condition:
        field: building-works
        value: true
        description: The proposal will create, alter or add to a building or structure.
  - all:
    - application-type:
        in:
        - outline
    - condition:
        field: building-works
        value: true
        description: The proposal will create, alter or add to a building or structure.
    - discretionary
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: building-works
        value: true
        description: The proposal will create, alter or add to a building or structure.
    - condition:
        field: change-in-ground-levels
        value: true
        description: There is a level change across the site or in relation to adjoining properties.
  - condition:
      field: track-or-riding-arena
      value: true
      description: A track or an outdoor horse-riding arena.
  - application-type:
      in:
      - lbc
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: 'The proposal will create, alter or add to a building, showing: … The exception to this is
  householder applications where there is no existing or proposed level change across the site or in relation
  to adjoining properties. … The proposal is for a track or an outdoor horse-riding arena, showing: …
  The proposal relates to a listed building, showing:'
must-include:
- item: Cross section(s) through the proposed building and the remainder of the site, related to adjoining
    ground levels, at 1:50 or 1:100
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: The proposal will create, alter or add to a building or structure.
- item: 'For a track or riding arena: cross section(s) of the proposed surface treatment, including surfacing
    materials, at 1:10 or 1:20'
  level: must
  required-if:
    condition:
      field: track-or-riding-arena
      value: true
      description: A track or an outdoor horse-riding arena.
- item: 'For a listed building: whole vertical and horizontal cross sections of joinery details, profiles
    and sections of new or replacement doors, windows and other architectural features, at 1:2 or 1:5'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The scale used and a scale bar
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 11. The matrix (pages 83-84) marks it 'E'
  (essential) for full, listed building consent, prior notification, reserved matters; 'P' (possible)
  for householder, outline, s73, non-material amendments. Outline is shown as discretionary because appearance,
  layout and scale may be reserved.
review-status: unverified
field-status: {}
