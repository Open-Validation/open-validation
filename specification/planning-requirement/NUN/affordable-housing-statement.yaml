reference: affordable-housing-statement
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A residential site of 0.5 hectares or more.
    - condition:
        field: affordable-housing-proposed
        value: true
        description: The proposal includes, or should include, affordable housing.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies H1, H2, DS4, DS8 and DS9; NPPF paragraphs 63-66
source-text: residential development proposals which are for 10 or more dwellings or where the site has
  an area of 0.5 hectares or more, irrespective of the number of proposed dwellings; and … residential
  development proposals which include, or should include an element of affordable housing. … All developments
  consisting of 15 dwellings or more, and for two units where residential development proposals consist
  of between 11 to 14 dwellings, irrespective of any demolitions. The exception to this is outline planning
  applications where appearance, layout and scale are reserved.
must-include:
- item: How the development will contribute towards meeting local housing needs
  level: should
- item: The total number of residential units and of affordable units, with tenure types clearly explained
  level: should
- item: Numbers of bedrooms and property types across all tenures
  level: should
- item: Numbered plots for each housing type and tenure (full and reserved matters only)
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'Where the scheme is not policy compliant: the justification for the variance in housing mix or
    affordable housing, supported by a viability appraisal where viability is relied on'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A policy-compliant scheme is not proposed.
- item: 'Affordable housing plan: the tenure split and affordable housing mix, with a table of percentages
    and the number of dwellings by bedroom size'
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more dwellings (15 or more, or two units where 11 to 14).
    - condition:
        field: matters-beyond-access
        value: true
        description: Not an outline application with appearance, layout and scale reserved.
  source-text: A plan setting out the tenure split and affordable housing mix sought. The plan shall also
    include a table setting out the tenure split and affordable housing mix in percentages. Further to
    this, the table must include details on the number of dwellings by bedroom size.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 11 and 42-43. Combines the Housing Statement
  (page 42) and the Affordable housing plan (page 11). The matrix (pages 83-84) marks it 'P' (possible)
  for full, outline, reserved matters (housing statement), s73, approval of details (affordable housing
  plan). The list says the statement 'should typically' include the contents shown as 'should'.
review-status: unverified
field-status: {}
