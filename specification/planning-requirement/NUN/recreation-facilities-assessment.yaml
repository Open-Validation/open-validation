reference: recreation-facilities-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: The loss, relocation or prejudice to the value of existing open space.
    - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies NE1, NE2 and HS4; Open Space and Green Infrastructure
  SPD; NPPF paragraph 97
source-text: 'proposals for residential and non-residential proposals within Use Classes: E (a-c) (formally
  A1/2/3), sui-generis, as relating to drinking establishments and hot food takeaways (formally A4,A5),
  E(g) (formally B1), B2, B8 and C1, that generate a need for open space; or … proposals that would result
  in the loss, relocation, or would prejudice the value of existing open space.'
must-include:
- item: 'Where a need for open space is generated: the quantity by typology with plans of the location
    of each type'
  level: must
- item: 'Where open space is provided: the maintenance specification and who will install and maintain
    it for at least 10 years'
  level: must
- item: 'Where open space is lost or prejudiced: an evidenced justification (surplus, equivalent or better
    replacement, or alternative sports/recreation provision)'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of or prejudice to open space.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 52-57. Open Space Assessment. The matrix (pages
  83-84) marks it 'P' (possible) for full, outline, reserved matters, s73. Whether a proposal 'generates
  a need for open space' depends on the Open Space and Green Infrastructure SPD, so it is discretionary.
review-status: unverified
field-status: {}
