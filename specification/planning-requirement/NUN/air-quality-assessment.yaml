reference: air-quality-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
  - ref: major-development
  - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies HS2 and BE3; Air Quality SPD; NPPF paragraphs 170
  and 180
source-text: 'Development that has the potential to adversely affect air quality, be that through their
  operation and occupation or through demolition and construction. … The criteria and thresholds for requiring
  an AQIA are set out in the Nuneaton and Bedworth Air Quality Supplementary Planning Document. … Note:
  Minor developments are exempt due to the likely negligible impact.'
must-include:
- item: Proportionate, following the latest guidance, with an air quality modelling study using a method
    agreed with the Council in advance
  level: must
- item: Baseline pollutant data from the most recently published annual data, agreed with the Council
  level: must
- item: Baseline traffic flows agreed in advance with the local highway authority
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 15-16. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, reserved matters, s73, approval of details. The criteria are in the Air
  Quality SPD, not the list, so it is shown as major development (minor developments are exempt) and discretionary.
review-status: unverified
field-status: {}
