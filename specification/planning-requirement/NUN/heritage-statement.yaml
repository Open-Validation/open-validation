reference: heritage-statement
local-authority: NUN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - advertising
        - reserved-matters
        - s73
        - non-material-amendment
    - any:
      - all:
        - ref: major-development
        - site:
            in:
            - conservation-area
            description: Within or otherwise affecting a conservation area.
      - all:
        - site:
            in:
            - listed-building
            - listed-building-setting
            - scheduled-monument
            - park-and-garden
            - battlefield
            - world-heritage-site
            - locally-listed-building
            - protected-wreck-site
            - conservation-area
            description: The application may affect the significance of a heritage asset, including its
              setting, or would materially affect a conservation area.
        - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies BE4, DS1, HSG2, HSG3, HSG9, EMP1 and EMP4
source-text: listed building consent applications; … major planning applications within or otherwise affecting
  conservation areas; … planning applications for developments within conservation areas, including demolition;
  where the proposal would materially affect its character or appearance; and … planning applications
  that may affect the significance of any heritage asset, including its setting.
must-include:
- item: The significance of any heritage assets affected, including the contribution of their setting,
    proportionate to their importance
  level: must
- item: Any justification and mitigation for harm to the significance of a designated heritage asset
  level: must
- item: 'For listed building consent: an analysis of the impact of the schedule of works on the archaeology,
    history, architecture and character of the building, with the justification and methodology'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: contextual and detailed photographs of features to be altered or
    removed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: historic evidence (plans or photographs) for any reinstatement of
    lost features'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: elevations and sections at 1:20 or less for windows, doors, shopfronts
    and similar features (details such as architraves, glazing bars and mouldings may need 1:5 or less)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: a detailed specification of all proposed materials, with samples
    where appropriate'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: photomontages illustrating the works in context'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'In a conservation area, for demolition: the building''s contribution to the area''s character
    and appearance and a justification for demolition'
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Including or solely for demolition.
- item: 'In a conservation area: how the design has regard to, and preserves or enhances, its character
    or appearance, with photographs'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: 'Affecting the setting of heritage assets: plans showing historic features on or next to the site
    and an analysis of their significance and the impact of the works'
  level: must
  required-if:
    site:
      in:
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - battlefield
      - locally-listed-building
      description: The application affects the setting of heritage assets.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 39-41. The matrix (pages 83-84) marks it 'E'
  (essential) for listed building consent; 'P' (possible) for householder, full, outline, advertisement
  consent, reserved matters, s73, non-material amendments. Whether a proposal 'would materially affect'
  a conservation area or 'may affect the significance' of a heritage asset is a judgement, so those parts
  are discretionary. Outline applications are not accepted for development in a conservation area.
review-status: unverified
field-status: {}
