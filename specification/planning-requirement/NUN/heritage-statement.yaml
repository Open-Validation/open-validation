reference: heritage-statement
local-authority: NUN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - ref: major-development
    - site:
        in:
        - conservation-area
        description: Within or otherwise affecting a conservation area.
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: Development in a conservation area (including demolition) that would materially affect
        its character or appearance, or that may affect the significance of any heritage asset, including
        its setting.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: Heritage Statement (Statement of Significance) When it this required? listed building consent
  applications; major planning applications within or otherwise affecting conservation areas; planning
  applications for developments within conservation areas, including demolition; where the proposal would
  materially affect its character or appearance; and planning applications that may affect the significance
  of any heritage asset, including its settin…
must-include:
- item: Appropriate photographs accompanying the appraisal
  level: must
- item: For applications affecting the setting of heritage assets, plans showing historic features on
    or adjacent to the site
  level: must
  required-if:
    site:
      in:
      - listed-building-setting
      description: The application affects the setting of a heritage asset.
confidence: medium
notes: 'Audit (missing_requirement): it applies to planning applications too, not only LBC.'
review-status: unverified
field-status: {}
