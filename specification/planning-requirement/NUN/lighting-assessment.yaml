reference: lighting-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - non-material-amendment
  - any:
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting/illumination.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting or lighting for sports pitches.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies BE3 and HSG2; NPPF paragraph 180
source-text: major development proposals that include external lighting/ illumination (with the exception
  of outline planning applications where appearance, landscaping, layout and scale are reserved."; and
  … other applications proposing floodlighting, external lighting for sports pitches, car parks illumination
  of buildings, work areas and security
must-include:
- item: 'Prepared by an appropriately qualified person: the lighting requirement and relevant standards,
    the layout and composition of the scheme, and isolux diagrams of predicted luminance (horizontal and
    vertical)'
  level: must
- item: The periods of operation, the area to be lit and any sensitive receptors
  level: must
- item: The specification of the luminaires (number, location, type and rating of lamps) and measures
    to minimise glare
  level: must
- item: A contoured lux plan showing ecological habitats would not be unduly affected (designed to BCT/ILP
    Guidance Note 08/23 where bats are concerned)
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: The lighting could affect ecologically sensitive habitat.
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 49. The matrix (pages 83-84) marks it 'P'
  (possible) for full, outline, reserved matters, s73, non-material amendments. Major outline applications
  with appearance, landscaping, layout and scale reserved are excepted.
review-status: unverified
field-status: {}
