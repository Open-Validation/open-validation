reference: lighting-assessment
local-authority: NUN
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting or illumination.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting, including for sports pitches.
  - condition:
      field: external-lighting
      value: true
      description: External lighting for car parks, illumination of buildings, work areas or security.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
source-text: Lighting Impact Assessment When is this required? major development proposals that include
  external lighting/ illumination (with the exception of outline planning applications where appearance,
  landscaping, layout and scale are reserved."; and other applications proposing floodlighting, external
  lighting for sports pitches, car parks illumination of buildings, work areas and security .
must-include:
- item: Prepared by an appropriately qualified person
  level: must
- item: A description of the lighting requirement with reference to relevant standards
  level: must
- item: The layout and composition of the scheme
  level: must
- item: Isolux diagrams showing predicted luminance in the horizontal and vertical plane
  level: must
- item: The periods of operation of the lighting
  level: must
- item: A description of the area where the lighting is to be installed, detailing any sensitive receptors
  level: must
confidence: low
notes: 'Audit (wrong_app_type): outline applications with all matters reserved are exempt, which the rules
  can''t express. The must-include items are from the ''External lighting/illumination'' text that the
  workbook filed as advertisement drawings.'
review-status: unverified
field-status: {}
