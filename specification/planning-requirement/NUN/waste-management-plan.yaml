reference: waste-management-plan
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policy BE3
source-text: major development proposals
must-include:
- item: Sustainable procurement measures to minimise construction waste
  level: must
- item: Types and quantities of demolition and construction waste and how it will be managed under the
    waste hierarchy (segregation, recycling, disposal)
  level: must
- item: Types and quantities of operational waste, with methods to limit it and sufficient segregated
    storage
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 80. Waste Audit Statement. The matrix (pages
  83-84) marks it 'P' (possible) for full, outline.
review-status: unverified
field-status: {}
