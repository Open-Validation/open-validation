reference: town-centre-impact-assessment
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Not within a defined Town or Strategic Allocation.
  - any:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 250
        description: 250 square metres (gross) or more of retail development.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: 2,500 square metres (gross) or more of other main town centre uses.
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policies SA1 and TC1; NPPF paragraph 89
source-text: An impact assessment – development proposals for town centre uses which meet or exceed defined
  thresholds that are not within a defined Town or Strategic Allocations. … The threshold at which an
  impact assessment will be required is 250 square metres (gross) for retail development and 2,500 square
  metres (gross) for other main town centre uses.
must-include:
- item: The impact on existing, committed and planned public and private investment in the catchment
  level: must
- item: The impact on town/district centre vitality and viability, including consumer choice and trade
  level: must
- item: A sequential assessment showing there are no suitable sequentially preferable locations, considering
    flexibility in format and scale
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 61-62. Retail and Leisure Impact Assessment/Sequential
  Assessment. The matrix (pages 83-84) marks it 'P' (possible) for full, outline.
review-status: unverified
field-status: {}
