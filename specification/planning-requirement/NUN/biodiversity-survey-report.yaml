reference: biodiversity-survey-report
local-authority: NUN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - reserved-matters
      - s73
      - non-material-amendment
  - any:
    - condition:
        field: demolition
        value: true
        description: Full or partial removal of a building within the red line boundary.
    - condition:
        field: roof-alteration
        value: true
        description: Works which include the significant destruction, modification of, or intrusion into
          a roof.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Garden or woodland habitat with mature trees that may be directly or indirectly impacted.
    - condition:
        field: protected-species
        value: true
        description: Likely to affect protected or important species, habitats or geological features.
    - discretionary
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Nuneaton and Bedworth Borough Plan policy NE3; NPPF paragraphs 8, 170 and 174; BS 42020:2013
source-text: 'If your application is likely to affect protected or nationally, regionally or locally important
  species and/or protected or nationally, regionally or locally important habitats or geological features,
  you will need to submit a preliminary ecological and/or geological appraisal (as appropriate) and/or
  a preliminary roost assessment, as well as any detailed targeted species and habitat surveys recommended
  within these initial appraisals. … Unless you have an exemption letter from WCC Ecological Services,
  a Preliminary Roost Assessment (PRA) carried out by a qualified bat worker will be required for proposals
  which include the following works: … Demolition - Full or partial removal of a building within the red
  line boundary of a planning application. … Any works which include the significant destruction, modification
  of, or intrusion into a roof. … Garden or woodland habitat with any mature trees that may be directly
  or indirectly impacted by proposed development.'
must-include:
- item: 'Preliminary Roost Assessment by a qualified bat worker: a Warwickshire Biological Record Centre
    desk study, external and internal inspection, a description of the building and any potential roost
    features, photographs where safe, and recommendations'
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - condition:
        field: roof-alteration
        value: true
        description: Roof works.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Mature trees affected.
- item: Any detailed targeted species and habitat surveys recommended by the preliminary appraisals
  level: must
- item: Reports meet BS 42020:2013 and CIEEM Technical Guidance
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 26-27. The matrix (pages 83-84) marks it 'P'
  (possible) for householder, full, outline, listed building consent, reserved matters, s73, non-material
  amendments. An exemption letter from WCC Ecological Services removes the Preliminary Roost Assessment.
review-status: unverified
field-status: {}
