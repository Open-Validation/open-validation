reference: location-plan
local-authority: NUN
required-if:
  always: true
source-url: https://www.nuneatonandbedworth.gov.uk/downloads/file/1470/validation-checklist-matrix
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Location Plan based on an up-to-date map, at a metric scale of 1:1250 at towns and villages
  or 1:2500 in the rural area. The plan, which shall be centred on the application site shall provide:'
must-include:
- item: Based on an up-to-date map at 1:1250 in towns and villages or 1:2500 in the rural area, centred
    on the site
  level: must
- item: 'The site outlined in red, including all land needed for the development: access to the adopted
    public highway carriageway, visibility splays, open areas around buildings, landscaping and car parking,
    and relevant drainage infrastructure including outfalls'
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: Clear reference points such as road/street names and/or neighbouring properties
  level: must
- item: A north point
  level: must
- item: A stated scale and a linear scale bar
  level: must
- item: An up-to-date Ordnance Survey map licence number and a date within 12 months
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 8-9. The matrix (pages 83-84) marks it 'E'
  (essential) for every application type.
review-status: unverified
field-status: {}
