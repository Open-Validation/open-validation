  … Nuneaton and Bedworth Borough Plan Policy BE3: Sustainable Design and Construction 25 Ecology/Geology
  Trigger List, Associated Wildlife Reports and Biodiversity Net Gain When is this required? … All applications
  which meet the criteria set out below. What information is required? If your application is likely to
  affect protected or nationally, regionally or locally important species and/or protected or nationally,
  regionally or locally important habitats or geological features, you will need to submit a preliminary
  ecological and/or geological appraisal (as appropriate) and/or a preliminary roost assessment, as well
  as any detailed targeted species and habitat surveys recommended within these initial appraisals. Those
  that have ecological land-take will also need to undertake a biodiversity net gain assessment (see below)
  and show how the proposal will integrate into any wider green infrastructure network. Unless you have
  an exemption letter from WCC Ecological Services, a Preliminary Roost Assessment (PRA) carried out by
  a qualified bat worker will be required for proposals which include the following works: … Demolition
  - Full or partial removal of a building within the red line boundary of a planning application. … Any
  works which include the significant destruction, modification of, or intrusion into a roof. … Garden
  or woodland habitat with any mature trees that may be directly or indirectly impacted by proposed development.
  The PRA shall include the following information: … A desk study from the Warwickshire Biological Record
  Centre to include an assessment of the local area, its suitability for bat habitat and preferably any
  local bat records. … Fieldwork to include an external and internal inspection of a building. … A report
  to include a description of the building, its condition and any potential roost features (PRF’s) and
  their locations. … Accompanying photographs where safe to do so. … Recommendation for further surveys
  and any ways to avoid harm, provide mitigation measures and provide enhancement opportunities for bats.
  Please note: Depending upon the outcome of any preliminary assessment, further types of follow-on bat
  survey may be necessary prior to validation. 26 NOTE: Full consideration must be made by applicants
  and their consultant ecologists of the BCT Guidelines for Professional Ecologists (2023) and any future
  revised editions. It is recommended that pre-application advice is sought from Warwickshire County Council’s
  Ecological Services at an early stage to determine if bat and/or other protected species surveys are
  required. A Natural England license may be required for a development that impacts on a European protected
  species. All ecological reports will need to meet the BS 42020:2013: Biodiversity, Code of Practice
  for Planning and Development and CIEEM Technical Guidance Series. The following national guidance provides
  further information. … Planning Practice Guidance – Natural Environment … Biodiversity and Geological
  Conservation: Circular 06/2005: Biodiversity and Geological Conservation – Statutory obligations and
  their impact within the planning system … British Standards 42020:2013: Biodiversity - Code of practice
  for planning and development … British Standards 8683: Process for Designing and Implementing Biodiversity
  Net Gain - Specification Additionally, there is also local guidance as follows. … WCC Planning and Ecology:
  www.warwickshire.gov.uk/planningecology … WCC Biodiversity Net Gain: www.warwickshire.gov.uk/biodiversityoffsetting
  … WCC Green Infrastructure Strategy: www.warwickshire.gov.uk/greeninfrastructure … Warwickshire Geological
  Conservation Group www.wgcg.co.uk For further information contact WCC Ecological Services on 01926 418060.
  It is a requirement of the Water Framework Directive (WFD) to cause no overall deterioration in water
  quality or the ecological status of any waterbody. Information on WFD and the current status of water
  bodies can be found in our River Basin Management Plans at: www.gov.uk/search?q=River+Basin+Management+Plans.
  A WFD compliance assessment may be required for some projects – particularly those where proposals have
  a direct impact on a watercourse. Existing gov.uk web guidance covers Estuarine and Coastal Waters and
  can assist in consideration of other watercourses/ bodies. (https://www.gov.uk/guidance/water-framework-directive-assessment-estuarine-and-
  coastal-waters). Biodiversity Net Gain 27 This is now applicable to all applications for planning permission
  for “major development” and “small site development” made under the Town and Country Planning Act 1990,
  subject to the confirmed exemptions. Major development includes residential developments with 10 or
  more dwellings, or where the site area is greater than 0.5 hectares. Small site development includes
  residential development where the number of dwellings is between one and nine, or if unknown the site
  area is less than 0.5 hectares and commercial development where floor space created is less than 1,000
  square metres or the total site area is less than one hectare. Not applicable to householder planning
  applications. Biodiversity net gain is a way of creating and improving biodiversity by requiring development
  to have a positive impact (‘net gain’) on biodiversity. Under the statutory framework for biodiversity
  net gain, subject to some exceptions, every grant of planning permission is deemed to have been granted
  subject to the condition that the biodiversity gain objective is met (“the biodiversity gain condition”).
  This objective is for development to deliver at least a 10% increase in biodiversity value relative
  to the pre-development biodiversity value of the onsite habitat. This increase can be achieved through
  onsite biodiversity gains, registered offsite biodiversity gains or statutory biodiversity credits.
  Planning Practice Guidance on biodiversity net gain can be found on the Government’s webpage: Biodiversity
  net gain - GOV.UK (www.gov.uk). Where applicants consider that the development would not be subject
  to the biodiversity gain condition, Article 7 of The Town and Country Planning (Development Management
  Procedure) (England) Order 2015 provides that the applicant must provide a statement as part of the
  planning application setting out the reasons why they believe this is the case. The planning application
  form, prescribed by the Secretary of State, provides for these reasons to be set out. An applicant would
  be expected in this statement to set out what exemption(s) or transitional provision(s) apply to the
  development. In some cases, the exemption or transitional provision will be evident as they relate to
  the type of permission. For example, the planning application form for household development already
  includes a pre-populated statement. In other cases, evidence may need to be provided, especially for
  the de minimis exemption. Where an applicant believes the development would be subject to the biodiversity
  gain condition, the application must be accompanied by minimum information set out in Article 7 of The
  Town and Country Planning (Development Management Procedure) (England) Order 2015: … Confirmation that
  the applicant believes that planning permission, if granted, would be subject to the biodiversity gain
  condition. … The pre-development biodiversity value(s), either on the date of application or earlier
  proposed date (as appropriate). … Where the applicant proposes to use an earlier date, this proposed
  earlier date and the reasons for proposing that date. … The completed metric calculation tool showing
  the calculations of the pre- development biodiversity value of the onsite habitat on the date of application
  (or 28 proposed earlier date) including the publication date of the biodiversity metric used to calculate
  that value. … A statement whether activities have been carried out prior to the date of application
  (or earlier proposed date), that result in loss of onsite biodiversity value (‘degradation’), and where
  they have: o a statement to the effect that these activities have been carried out. o the date immediately
  before these activities were carried out. o the pre-development biodiversity value of the onsite habitat
  on this date. o the completed metric calculation tool showing the calculations, and o any available
  supporting evidence of this. … A description of any irreplaceable habitat (as set out in column 1 of
  the Schedule to the Biodiversity Gain Requirements (Irreplaceable Habitat) Regulations 2024) on the
  land to which the application relates, that exists on the date of application, (or an earlier date);
  and plan(s), drawn to an identified scale and showing the direction of North, showing onsite habitat
  existing on the date of application (or earlier proposed date), including any irreplaceable habitat
  (if applicable). Further information about the Warwickshire Offsetting Scheme can be found here: Biodiversity
  offsetting activities – Warwickshire County Council https://www.warwickshire.gov.uk/biodiversityoffsetting.
