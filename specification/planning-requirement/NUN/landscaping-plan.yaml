  http://www.legislation.gov.uk/uksi/2017/571/schedule/1/made and http://www.legislation.gov.uk/uksi/2017/571/schedule/2/made
  … The Town and Country Planning (Environmental Impact Assessment) Regulations 2017, Regulation 18: http://www.legislation.gov.uk/uksi/2017/571/regulation/18/made
  32 Flood Risk Assessment When is this required? All planning applications for: … development within,
  in whole or in part of flood zone 2 and/or flood zone 3; and … development on sites with an area of
  1 hectare or more (in flood zones 1, 2 or 3). What information is required? For residential and non-residential
  development of less than 250 square metres in flood risk zones 2 and 3, a simple flood risk assessment,
  which includes a plan showing finished floor levels and estimated flood levels, will be required. For
  other qualifying developments, a Flood Risk Assessment must identify and assess the risks of all forms
  of flooding to and from the development and demonstrate how these flood risks will be managed, taking
  climate change into account. Flood Risk Assessments shall set out: Zone 1 … existing flood risk to the
  site from localised sources and the impact of development upon run off rates; and … design measures
  proposed to mitigate run off rates. Zone 2 … existing flood risk to the site from all sources and the
  potential impact of development upon flood risk (high level assessment only); … the extent of the design
  flood extent; and … design measures proposed to mitigate risk of flooding, and their impact (details
  shall include floor levels, ground levels, evacuation routes, SUDs) for the lifetime of the development
  without increasing risk to third parties. Zone 3 … existing flood risk to the site from all sources
  (e.g. flood depth, flow routes, flood velocity, defence failure); … the potential impact of development
  upon flood risk, including off site/downstream; and … design measures proposed to mitigate the risk
  of flooding, and their impact (details shall include floor levels, ground levels, evacuation routes,
  SUDs) for the lifetime of the development without increasing risk to third parties. 33 Sequential Test
  Applications for new development in flood zones 2 and 3 must additionally include a sequential test
  statement (other than for minor extensions), which shall demonstrate that there are no reasonably available
  alternative sites, within / around the same settlement, where the proposed development could be sited
  within an area of lower flood risk; the sequential test shall consider sites in flood zone 2 if the
  proposal is located in flood zone 3. The following evidence must be provided: … a written statement
  explaining the area of search; … a map identifying all other sites considered within lower areas of
  flood risk; and … a written statement explaining why the alternative sites listed within lower areas
  of flood risk are not reasonably available. Exceptions Test If the sequential test is passed, it will
  also be necessary to demonstrate that the flood risk to people and property will be managed satisfactorily
  while allowing necessary development to go ahead in situations where suitable sites at lower risk of
  flooding are not available. The following will need to be demonstrated: … the development would provide
  wider sustainability benefits to the community that outweigh the flood risk; and … the development will
  be safe for its lifetime taking account of the vulnerability of its users, without increasing flood
  risk elsewhere, and, where possible, will reduce flood risk overall. Relevant policy and reason for
  the document/s … Nuneaton and Bedworth Borough Plan Policy NE4: Managing Flood Risk and Water Quality
  Further information sources … Environment Agency Standing Advice Development and Flood Risk: o www.gov.uk/guidance/flood-risk-assessment-for-planning-applications
  o http://www.environment-agency.gov.uk/research/planning/33098.aspx … Environment Agency West Midlands
  Area FRA guidance notes and Area Climate Change guide. … Flood level data to assist a Flood Risk Assessment
  and/or Flood Management Plan (where available) may be obtained from the Environment Agency’s Area Customers
  & Engagement team on 03708 506506 and WestMids@environment-agency.gov.uk … Preparing a flood risk assessment:
  standing advice: www.gov.uk/guidance/flood-risk- assessment-standing-advice#what-to-include-in-your-assessment
  34 … National Planning Policy Framework paragraphs165-175: www.gov.uk/government/publications/national-planning-policy-framework--2
  35 Foul Drainage Assessment When is this required? … development proposals that would result in the
  disposal of foul sewage, effluent or trade waste not through a mains connection to a public sewer. What
  information is required? A non-mains drainage assessment must be used to establish whether non-mains
  drainage, either a new system or connection to an existing system, would be acceptable. The Environment
  Agency requires applicants to provide evidence that a connection to the public sewer is not feasible.
  The assessment shall include: the method of storage, treatment and disposal, an assessment of site suitability
  and a demonstration as to why the development cannot connect to the public mains sewer. The assessment
  must be provided through the completion of the Environment Agency’s Foul Drainage Assessment form. Foul
  drainage assessment form (FDA1) - GOV.UK (www.gov.uk) or the Environment Agency West Midlands Area Foul
  Drainage Assessment Form (available from WestMidsPlanning@Environment-Agency.gov.uk). Relevant policy
  and reason for the document/s … Nuneaton and Bedworth Borough Plan Policy HSG6 and EMP6 School Lane
  / Longford Road … Nuneaton and Bedworth Borough Plan Policy EMP3: Prologis Extensions … Nuneaton and
  Bedworth Borough Plan Policy EMP4: Coventry road … Nuneaton and Bedworth Borough Plan Policy EMP7: Bowling
  Green Lane Further information sources … Environment Agency Foul Drainage Assessment Form (FDA): https://www.gov.uk/government/publications/foul-drainage-assessment-form-fda1
  36 Fire Statement When is this required? An application for planning permission for development that
  involves: … the provision of one or more relevant buildings, or … development of an existing relevant
  building … or development within the curtilage of a relevant building. Relevant buildings include: …
  buildings that contain two or more dwellings (including flats) or educational accommodation (residential
  accommodation for the use of students at boarding school or in later stages of education); and … the
  building is 18m or more in height, or 7 or more storeys whichever is reached first. What information
  is required? Fire statements must be submitted on a form published by the Secretary of State (or a form
  to similar effect) and contain the particulars specified or referred to in the form, which includes
  information about (not exhaustive list): … the principles, concepts and approach relating to fire safety
  that have been applied to each building in the development. … the site layout … emergency vehicle access
  and water supplies for firefighting purposes … what, if any, consultation has been undertaken on issues
  relating to the fire safety of the development; and what account has been taken of this … how any policies
  relating to fire safety in relevant local development documents have been taken into account. Relevant
  policy and reason for the document/s … Building Safety Bill … Planning Practice Guidance (Fire safety
  and high-rise residential buildings) … Town and Country Planning (Development Management Procedure and
  Section 62A Applications) (England) (Amendment) Order 2021 (”the 2021 Order”). 37 Health Impact Assessment
  and Screening Report When is this required? … Major development proposals = Health Impact Assessment
  Screening Report. … Environmental Impact Assessment = Health Impact Assessment Screening and, if required
  following the Screening Report, a Health Impact Assessment. What information is required? Health Impact
  Assessment Screening Reports shall demonstrate that the proposed development would not overall give
  rise to negative impacts in respect of health and wellbeing. It is recommended that applicants use the
  Development Health Assessment presented in Appendix B of the Council’s Health Impact Assessment SPD
  2021. A Health Impact Assessment shall be provided if the Health Impact Assessment Screening Reports
  identifies that significant impacts on health and wellbeing would arise from the proposed development.
  Applicants should follow the comprehensive procedure set out in the Council’s Health Impact Assessment
  SPD 2021. Relevant policy and reason for the document/s … Nuneaton and Bedworth Borough Plan Policy
  HS5: Health … Health Impact Assessment SPD 2021 38 Heritage Statement (Statement of Significance) When
  it this required? … listed building consent applications; … major planning applications within or otherwise
  affecting conservation areas; … planning applications for developments within conservation areas, including
  demolition; where the proposal would materially affect its character or appearance; and … planning applications
  that may affect the significance of any heritage asset, including its setting. Note: outline applications
  will not be accepted for development proposals within a conservation area. Any application must give
  sufficient detail to allow the impact of the works on the conservation area to be properly assessed.
  What information is required? A heritage asset is a building, monument, site, place, area or landscape
  that has been identified as having a degree of significance meriting consideration in planning decisions.
  They are the valued components of the historic environment and they include the following heritage assets:
  … world heritage site; … scheduled ancient monument; … listed building; … protected wreck site; … registered
  historic park or garden; … historic landscape; … conservation area; … known archaeological sites; …
  assets identified by the local planning authority (non-statutory local listing). The statement must
  describe the significance of any heritage assets affected, including any contribution made by their
  setting. The level of detail shall be proportionate to the assets’ importance and no more than is sufficient
  to understand the potential impact of the proposal on their significance. The statement must also include
  any justification and mitigation in relation to any harm to the significance of a designated heritage
  asset. The statement could form part of a more comprehensive Design and Access Statement, where this
  is also needed. Works to a Listed Building Applications for listed building consent require the following
  elements within the statement: 39 … a schedule of works to the listed building, and an analysis of the
  impact of these works on the significance of the archaeology, history, architecture and character of
  the building/structure along with a statement explaining the justification for the proposed works and
  principles which inform the methodology proposed for their implementation. … contextual and detailed
  photographs of the buildings/structure as existing to illustrate any features which are proposed to
  be altered or removed. … where reinstatement of lost or damaged features is proposed, historic evidence
  to support the detail of reinstatement should be provided where possible i.e. historic plans or photographs;
  … for any alterations, replacement, or installation of features such as windows, doors and shopfronts,
  elevation plans and sectional drawings to a scale of 1:20 or less. Further details of features such
  as architrave, cills, horns, glazing bars, lintels, transom, mullions, panelling, mouldings, meeting
  rails etc. may need to be at a scale of 1:5 or less; … a detailed specification for all proposed materials
  including, where appropriate samples; and … photomontages illustrating the proposed works in context.
  Planning applications for development within conservation areas must provide the following: … development
  including or solely for demolition - an assessment of the contribution that the building in question
  makes to the character and appearance of the conservation area and provide a justification for demolition.
  … development within a conservation area - the statement must address how the proposal has been designed
  to have regard to the character and/or appearance of the conservation area and to explain how the proposal
  enhances or preserves the character or appearance of the conservation area. Appropriate photographs
  shall accompany the appraisal. Applications affecting the setting of heritage assets: … for applications
  impacting on the setting of heritage assets a written statement that includes plans showing historic
  features that are on or adjacent to the application site including listed buildings and structures,
  locally listed buildings and structures, historic parks and gardens, historic battlefields and scheduled
  ancient monuments and an analysis of the significance of archaeology, history and character of the building/structure,
  landscape plans, the principles of and justification for the proposed works and their impact on the
  special character of the listed building or structure, its setting and the setting of adjacent listed
  buildings. Relevant policy and reason for the document/s … Nuneaton and Bedworth Borough Plan Policy
  BE4: Valuing and Conserving our Historic Environment … Nuneaton and Bedworth Borough Plan Policy HSG3:
  Gipsy Lane … Nuneaton and Bedworth Borough Plan Policy HSG9: Golf Drive 40 … Nuneaton and Bedworth Borough
  Plan Policy HSG2: Arbury … Nuneaton and Bedworth Borough Plan Policy EMP1: Faultlands … Nuneaton and
  Bedworth Borough Plan Policy EMP4: Coventry Road … Nuneaton and Bedworth Borough Plan Policy DS1: Presumption
  in Favour of Sustainable Development Further information sources … Historic England Good Practice Notes:
  https://historicengland.org.uk/advice/planning/planning-system/ … Heritage Gateway - https://www.heritagegateway.org.uk/gateway
  41 Housing Statement When is this required? … residential development proposals which are for 10 or
  more dwellings or where the site has an area of 0.5 hectares or more, irrespective of the number of
  proposed dwellings; and … residential development proposals which include, or should include an element
  of affordable housing. The statement must take account of the findings of the Nuneaton and Bedworth
  Housing and Economic Needs Assessment (May 2016), or successor assessments and any parish- based housing
  needs surveys for affordable housing. What information is required? Typically, the statement should
  include the following: … an explanation of how the development will contribute towards meeting local
  housing needs; … the total number of all residential units and the number of affordable units. The tenure
  types proposed should be clearly and fully explained in line with policy expectations; … numbers of
  bedrooms and property type across all tenures to demonstrate a representative mix of unit types; and
  … numbered plots allocated for each housing type and tenure (Full/Reserved Matters only). Where a policy
  compliant scheme is not proposed the statement must set out clearly the justification as to why a variance
  in housing mix or affordable housing (including affordable housing mix) is proposed. The statement must
  be supported by a viability appraisal where viability forms all or part of the justification for non-policy
  compliance. The viability appraisal will normally be required to be independently verified, with the
  applicant being liable for reasonable costs incurred by the local planning authority and that it will
  be available for public inspection. For applications proposing development on the basis of Policy ST19:
  Affordable Housing on Exception Sites, which includes an element of market housing, a viability appraisal
  will normally be required to demonstrate that number of proposed market dwellings is necessary and appropriate.
  For applications proposing development on the basis of Policy ST19A: Starter Homes Exception Sites,
  evidence will be required which demonstrates that the site is no longer suitable for its current or
  former use and does not result in the loss of economic growth prospects or important community services
  and facilities. Where an element of market 42 housing is proposed a viability appraisal will be required
  to demonstrate that it is necessary and appropriate. Relevant policy and reason for the document/s …
  Nuneaton and Bedworth Borough Plan Policy H1: Range and Mix of Housing … Nuneaton and Bedworth Borough
  Plan Policy H2: Affordable Housing … Nuneaton and Bedworth Borough Plan Policy DS4: Overall Development
  needs … Nuneaton and Bedworth Borough Plan Policy DS8: Monitoring of Housing Delivery … Nuneaton and
  Bedworth Borough Plan Policy DS9: Review … National Planning Policy Framework paragraph 63-66 43 Landscape
  and Visual Impact Assessment (LVIA) When is this required? A Landscape and Visual Impact Assessment
  (LVIA) will be required where a proposal is an Environmental Impact Assessment (EIA) development or
  the development would be likely to have a significant impact on the surrounding landscape and/or townscape
  character of the site, including its context. It should be to be prepared by an appropriately qualified
  person. What information is required? Landscape and Visual Impact Assessment - in most cases a full
  LVIA will be required to be prepared in accordance with the latest Landscape Institute guidance (currently
  GLVIA3: Guidelines for Landscape and Visual Impact Assessment) Description of development: This shall
  include the identification of the main features of the proposed development and establish any parameters
  such as maximum extents of the development; sizes of the various elements; a description of any alternatives
  considered or design iterations. Landscape Baseline Conditions: This shall include a description of
  the landscape character of the application site and its surroundings, including the landform, drainage,
  vegetation, land use, landscape condition, aesthetic and perceptual factors that contribute to landscape
  character. The Nuneaton and Bedworth Landscape Character Assessment provides the framework landscape
  character information and must be supplemented by a study specific to the development. It shall include
  the relationship of the site to any designated areas of landscape at a national, regional or local level,
  and to areas of landscape value or scenic quality, reflecting key characteristics of relevant landscape
  character types. The landscape baseline must be evaluated in relation to its sensitivity and importance.
  The sensitivity evaluation of each landscape element shall reflect its quality value, contribution to
  landscape character and the degree to which the particular element or characteristic can be replaced
  or substituted. Visual Assessment: The area covered by the visual assessment must be provided with a
  justification. There shall be a description of views from key receptors including residential properties,
  public rights of way, public amenity space and roads. Predictions of Landscape and Visual Effects: There
  must be an assessment of the scale or magnitude of change to the landscape and visual elements as a
  deviation from the baseline conditions for each phase of the proposal. Consideration shall be given
  to visitor and resident populations, and seasonal variations. The methods used to establish the sensitivity
  44 and magnitude shall be clearly described and be appropriate and reasonable in relation to the importance
  of the landscape and visual impact. A Zone of Theoretical Visibility (ZTV) diagram to a distance appropriate
  to the nature of the development shall be provided to support the assessment. Where assumptions or unsupported
  data has been used in the predictions, these must be highlighted and accompanied by an indication of
  the reliability / confidence of those assumptions or data. There must be an evaluation of the direct,
  indirect, secondary and cumulative, short medium- and long-term effects resulting from the existence
  of the development. Significance of Effects: This must clearly describe the judgements which underpin
  the attribution of significance. The assessment of significance shall consider the impact’s deviation
  from the established landscape baseline condition, the sensitivity of the landscape and receptors and
  the extent to which the impact will be mitigated or is reversible. The range of factors which are likely
  to influence the assessment of significance must be clearly identified. Details shall be provided of
  how these variables will affect the significance of the impacts over the life of the development. Mitigation:
  This must describe the measures proposed to avoid, reduce and if possible, remedy significant adverse
  impacts on both landscape character and visual amenity. There shall be an indication given of the effectiveness
  of the stated measures and a clear indication of how the mitigation measures will be implemented. Presentation
  of the LVIA The document must be clear and logical in its layout and presentation and be capable of
  being understood by a non–specialist. It shall be a balanced document providing an unbiased account
  of the landscape and visual effects, with reasoned and justifiable arguments. A glossary of all technical
  terms must be provided. Plans, diagrams and visual representations shall be provided to assist in the
  understanding of the development and its impact and must be clearly labelled with all locations referenced
  in the text. This shall include photographs and photomontages. Relevant policy and reason for the document/s
  … Nuneaton and Bedworth Borough Plan Policy NE5: Landscape character … Nuneaton and Bedworth Borough
  Plan Policy BE4: Valuing and Conserving our Historic Environment … Nuneaton and Bedworth Borough Plan
  Policy DS7: Green Belt … Nuneaton and Bedworth Borough Plan Policy SA1: Development Principles on Strategic
  Sites … National Planning Policy Framework paragraphs:180 45 Further information sources … Undertaking
  a LVIA - Guidelines for Landscape and Visual Impact Assessment 3rd edition: Landscape Institute and
  Institute of Environmental Management and Assessment: https://www.landscapeinstitute.org/technical/glvia3-panel/
  … Landscape Institute Technical Guidance Note: Visual Representation of Development Proposals: https://landscapewpstorage01.blob.core.windows.net/www-
  landscapeinstitute-org/2019/09/LI_TGN-06-19_Visual_Representation.pdf 46 Landscape Proposals When is
  this required? … major development proposals … minor development proposals that would likely affect
  the existing landscape character or appearance of the application site.'
