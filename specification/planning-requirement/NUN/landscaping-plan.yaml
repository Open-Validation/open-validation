  … Environment Agency West Midlands Area Guide - Protecting and Improving the Water Environment: WFD
  Compliance of Physical works in Rivers. 31 Environmental Impact Assessment When is this required? …
  development proposals which fall within Schedule 1 or 2 of the Town and Country Planning (Environmental
  Impact Assessment) Regulations 2017. What information is required? The assessment must include sufficient
  information to ensure that decisions can be made in full knowledge of any likely significant effects
  on the environment. Regulation 18 (3) and (4) of the Town and Country Planning (Environmental Impact
  Assessment) Regulations 2017 identifies what must be included within the Environmental Statement. The
  assessment shall be prepared by an appropriately qualified person; a statement of relevant expertise
  or qualifications must accompany the assessment. A written request can be made to the local planning
  authority to provide a “screening opinion” (i.e. to determine whether an Environmental Impact Assessment
  is required) and a “scoping opinion” (the scope of the Environmental Impact Assessment), prior to the
  submission of a planning application. Relevant policy and reason for the document/s … Nuneaton and Bedworth
  Borough Plan Policy DS1: Sustainable development … Nuneaton and Bedworth Borough Plan Policy DS3: Development
