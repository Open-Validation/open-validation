  or alteration of a public house or licensed premises; and … public toilets. What information is required?
  The statement can be incorporated into the Design and Access Statement, but will need to include: …
  an assessment of crime and disorder issues in the vicinity of the development site; … an assessment
  of the development proposal in terms of its likely impact on crime and disorder; and … identify incorporated
  design solutions that will reduce the development’s and the local community’s vulnerability to crime
