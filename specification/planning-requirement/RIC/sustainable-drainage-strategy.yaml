reference: sustainable-drainage-strategy
local-authority: RIC
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      - groundwater-flood-risk
      - critical-drainage-area
      description: Evidence of a risk from fluvial flooding or other sources, including surface water,
        ground water or sewer flooding.
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 8; Ham and Petersham Neighbourhood Plan Policy E4
source-text: '1. All major development. 2. Required for all other development: • where there is evidence
  of a risk from fluvial flooding or other sources of flooding, including surface water, ground water
  or sewer flooding. • that could lead to changes to, and have impacts on, surface water run-off.'
must-include:
- item: The completed London Sustainable Drainage Proforma (Excel spreadsheet)
  level: must
- item: How surface water could affect the site and surrounding areas post-development, and that the scheme
    reduces surface water discharge in line with the Sustainable Drainage Hierarchy
  level: must
- item: 'The proposed SuDS features, with long-term management and maintenance: who is responsible and
    how it is funded'
  level: must
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 19-20. Item 36 (Drainage Strategy incorporating
  SuDS). 'Could lead to changes to ... surface water run-off' has no threshold, so it shows as discretionary.
review-status: unverified
field-status: {}
