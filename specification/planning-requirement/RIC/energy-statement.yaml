reference: energy-statement
local-authority: RIC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates one or more dwellings (gross), including by change of use, extension or conversion.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: New non-residential development or extensions of more than 100 sq m gross.
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 3, 4, 5 and 6; GLA Energy Planning Guidance
source-text: 1. New residential development creating 1 dwelling unit gross or more (including new build,
  change of use, extensions and conversions). 2. New non-residential development or extensions of more
  than 100sqm gross floorspace (including new build, change of use and conversions).
must-include:
- item: How on-site emissions savings are maximised following the GLA energy hierarchy (Be Lean, Be Clean,
    Be Green)
  level: must
- item: How the development achieves net zero carbon, including the minimum on-site carbon reduction in
    Local Plan Policy 4 (or evidence all options were explored)
  level: must
- item: The development's energy demand and carbon emissions, with expected savings from energy efficiency
    and renewables
  level: must
- item: The approach to energy supply, including decentralised energy where relevant
  level: must
- item: Enough detail to show the strategy is achievable and policy-compliant
  level: must
- item: Carbon offsetting where on-site reductions are insufficient
  level: must
- item: Written confirmation that the applicant will cover the cost of any independent assessment
  level: must
- item: Estimates of the GLA 'Be Seen' planning stage performance indicators, and confirmation the 'be
    seen' GLA webform has been or will be completed
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 25. Item 49 (Energy Statement setting
  out the proposed Energy Strategy).
review-status: unverified
field-status: {}
