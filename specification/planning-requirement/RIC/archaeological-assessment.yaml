reference: archaeological-assessment
local-authority: RIC
required-if:
  any:
  - all:
    - ref: major-development
    - site:
        in:
        - archaeological-priority-area
        description: In an Archaeological Priority Area.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: Site greater than 0.5 hectares, whether in an APA or not.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.5
      description: Site greater than 0.5 hectares, whether in an APA or not.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In an Archaeological Priority Area.
    - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 33
source-text: 1. All major development in an Archaeological Priority Area (APA). 2. All sites greater than
  0.5 hectares, whether in an APA or not. 3. Some non-major development in APAs (e.g. development of domestic
  basements and other proposals involving groundworks or demolition – see GLAAS consultation criteria
  for guidance).
must-include:
- item: Desk-based assessment by a suitably qualified individual or organisation, using existing information
    to assess the archaeological significance of the site and the potential impact on any surviving monuments
    or remains
  level: must
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 13-14. Item 20. 'Some non-major development
  in APAs' follows GLAAS consultation criteria, so it shows as discretionary.
review-status: unverified
field-status: {}
