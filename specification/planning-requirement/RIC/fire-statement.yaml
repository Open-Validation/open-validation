reference: fire-statement
local-authority: RIC
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 44 and 45; London Plan (2021) Policies D12 and D5 (B5); GLA
  Fire Safety LPG
source-text: All development should submit either a Fire Safety Strategy or Reasonable Exception Statement.
  ... All major development.
must-include:
- item: Fire Safety Strategy, or a Reasonable Exception Statement where appropriate (generally householder
    and non-major development creating no extra dwellings or commercial units, no lifts, no change to
    external materials and no change to communal evacuation areas)
  level: must
- item: Author of a Planning Fire Safety Strategy shows suitable fire safety knowledge, understanding
    and qualifications
  level: must
- item: Reasonable Exception Statement confirms current fire safety measures are appropriate and will
    not be negatively affected; identifies mitigation where they will be altered
  level: should
  required-if: discretionary
- item: Includes the GLA Evacuation Lifts guidance requirements where a lift core is proposed
  level: must
- item: 'For major development: a Fire Statement, an independent fire strategy produced by a third party
    suitably qualified assessor'
  level: must
  required-if:
    ref: major-development
  source-text: All major development proposals must be submitted with a Fire Statement, which is an independent
    fire strategy, produced by a third party suitably qualified assessor.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 17-18. Items 32 (Fire Safety Strategy
  or Reasonable Exception Statement, all development) and 33 (Fire Statement, all major development).
  Shown for planning application types; the list says 'all development'.
