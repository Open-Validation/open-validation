reference: noise-assessment
local-authority: RIC
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise Sensitive Development.
  - condition:
      field: noise-generating-use
      value: true
      description: Noise Generating Development.
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 19 and 53; Development Control for Noise Generating and Noise
  Sensitive Development SPD
source-text: Development where noise is likely to be a material consideration or have a significant impact,
  either for Noise Sensitive Development or Noise Generating Development*.
must-include:
- item: 'For domestic air source heat pumps complying with MCS 020 a): the manufacturer''s specification
    sheet and a certificate of MCS compliance or installer declaration, instead of a noise assessment'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: A domestic air source heat pump is proposed.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 36. Item 72 (Noise Assessment and/or an
  Acoustic Design Statement).
review-status: unverified
field-status: {}
