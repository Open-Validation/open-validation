  url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
  date: 2026-02-20
  date-basis: 'cover: ''Agreed for adoption on 19 February 2026''; version table: Version 1, adoption
    decision 19/2/2026, coming into effect 20/2/2026; the council''s ''Make a planning application'' page
    links this file and says it took effect on 20 February 2026'
  status: current
submission-standards:
- item: Documents in PDF format, unless the checklist accepts another format (e.g. Excel spreadsheet proformas)
  level: must
- item: Individual files kept under 10MB; large files broken into numbered sections
  level: should
- item: No .EXE files and no ZIP utilities
  level: must
- item: 'Files uploaded in order: application form and certificates, site location plan, block plan, proposed
    plans, existing plans, supporting statements, reports and surveys'
  level: should
- item: Where required information is in another document (e.g. the Design and Access Statement), it is
    clearly signposted with the document name and section or page; otherwise a separate standalone document
  level: must
- item: All plans show key metric dimensions (width, height, length), are to a recognised scale (no "Do
    Not Scale" notes) and show North
  level: must
- item: All plans include drawing titles, numbers and a full drawing list
  level: must
- item: Revised drawings keep the same drawing numbers, with updated title blocks (e.g. Rev. A → Rev.
    B) and a revision note explaining the changes
  level: should
- item: All plans clearly show refuse and recycling storage
  level: must
- item: Floorspace figures broken down by use class
  level: should
