submission-standards:
- item: Documents in PDF format, unless the checklist accepts another format (e.g. Excel proformas)
  level: must
- item: Individual files kept under 10MB; large files broken into numbered sections
  level: should
- item: No .EXE files and no ZIP utilities
  level: must
- item: Drawings to a recognised scale (no "Do Not Scale" notes), showing North and key metric dimensions
    (width, height, length)
  level: must
- item: Drawing titles, numbers and a full drawing list; revised drawings keep the same numbers, with
    updated title blocks
  level: should
