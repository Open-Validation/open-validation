reference: recreation-facilities-assessment
local-authority: RIC
required-if:
  any:
  - ref: major-development
  - condition:
      field: loss-of-open-space
      value: true
      description: Results in the loss of Public Open Space.
  - site:
      in:
      - open-space
      description: Affects a sport and recreation facility.
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 37
source-text: 1. All major development. 2. Any development resulting in the loss of Public Open Space.
  ... 1. All major development. 2. Any development that affects a sport and recreation facility.
must-include:
- item: Analysis of existing open space provision against the Council's accessibility standards for travel
    to open spaces, with regard to Local Plan Policy 37 and the NPPF
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of Public Open Space.
- item: Need and feasibility for on-site playing fields, artificial grass pitches and ancillary sport
    facilities, in line with the Playing Pitch and Outdoor Sports Strategy or the Indoor Sports Facility
    Needs Assessment
  level: must
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - open-space
        description: Affects a sport and recreation facility.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 27-28. Items 54 (Public Open Space Assessment)
  and 56 (Playing fields and sport facilities assessment).
review-status: unverified
field-status: {}
