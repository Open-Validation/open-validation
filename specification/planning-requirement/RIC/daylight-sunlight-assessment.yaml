reference: daylight-sunlight-assessment
local-authority: RIC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 46
source-text: 1. All major development. 2. Proposals that could have a potential adverse impact on daylight
  or sunlight levels, or result in harmful overshadowing of the host building or neighbouring properties
  (including gardens and outdoor spaces).
must-include:
- item: Uses the methodology in the latest BRE 'Site layout planning for daylight and sunlight'
  level: must
- item: Prepared by a suitably qualified professional, with relevant diagrams and a non-technical summary
  level: should
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 37-38. Item 77 (Daylight, Sunlight and
  Overshadowing Assessment). Potential adverse impact has no threshold, so it shows as discretionary.
review-status: unverified
field-status: {}
