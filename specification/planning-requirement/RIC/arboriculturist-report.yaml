reference: arboriculturist-report
local-authority: RIC
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on site or adjacent to the development (including street trees).
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 42; BS 5837:2012
source-text: Where there are trees on-site or adjacent to the development (including street trees).
must-include:
- item: Land survey / topographical survey
  level: must
- item: Tree survey to BS 5837:2012, with a plan showing numbered trees and their Root Protection Areas,
    each tree categorised by quality and value, trees to be retained or removed, replacement planting,
    and a tree survey schedule
  level: must
- item: 'Tree Constraints Plan (or, for smaller schemes including householders, a short Tree Constraints
    Statement): location, size, canopy spread and RPA of each tree, and key design constraints'
  level: must
- item: Tree planting and landscaping proposals
  level: must
- item: Prepared by a qualified arboriculturist in accordance with BS 5837:2012
  level: should
- item: 'Draft Tree Protection Plan on a layout plan: hard surfacing and structures within RPAs, protective
    barriers, ground protection, and locations for site huts, toilets and materials storage'
  level: must
  required-if: discretionary
  source-text: Where there are trees on-site or adjacent to the development (including street trees) which
    will be impacted by development.
- item: 'Draft Arboricultural Method Statement: tree protection measures, permitted works within RPAs,
    schedule of tree works, construction management, conflict resolution, supervision and monitoring,
    contingency measures'
  level: must
  required-if: discretionary
  source-text: Where there are trees on-site or adjacent to the development (including street trees) which
    will be impacted by development.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 30-32. Items 62 (Arboricultural Impact
  Assessment including Tree Survey and Tree Constraints Plan/Statement), 63 (Draft Tree Protection Plan)
  and 64 (Draft Arboricultural Method Statement). The TPP and AMS are needed where the AIA identifies
  trees that will be impacted, which has no threshold, so they show as discretionary.
review-status: unverified
field-status: {}
