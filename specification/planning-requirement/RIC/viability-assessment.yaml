reference: viability-assessment
local-authority: RIC
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Does not provide policy-compliant affordable housing or a financial contribution, justified
        on viability grounds.
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 11; Affordable Housing SPD
source-text: 1. Any proposal following the Viability Tested Route (VTR); 2. Any proposal that does not
  provide policy- compliant levels of on-site affordable housing or a financial contribution towards affordable
  housing, or other planning obligations as expected, where the applicant seeks to justify this on viability
  grounds.
must-include:
- item: Written confirmation that the applicant or agent will fund the Council's independent assessment,
    including a build cost review if required
  level: must
- item: A testable, editable electronic or software model showing the calculations and assumptions
  level: must
- item: Detailed build cost plans with elemental breakdowns, benchmarked against comparable schemes where
    possible
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 22-23. Item 41 (Financial Viability Statement).
  Following the Viability Tested Route is the applicant's choice, so it shows as discretionary. Viability
  information is published unless withholding is justified at submission.
review-status: unverified
field-status: {}
