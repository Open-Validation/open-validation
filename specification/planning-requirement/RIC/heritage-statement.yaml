reference: heritage-statement
local-authority: RIC
required-if:
  any:
  - site:
      in:
      - listed-building
      - conservation-area
      - world-heritage-site
      - park-and-garden
      - scheduled-monument
      - locally-listed-building
      - archaeological-priority-area
      description: Affects a designated heritage asset (listed building, conservation area, World Heritage
        Site, registered park and garden, scheduled monument) or a non-designated one (Building of Townscape
        Merit, Archaeological Priority Area).
  - site:
      in:
      - listed-building-setting
      description: Affects the setting of a heritage asset.
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 29 and 30
source-text: 'All applications affecting a designated* and/or non-designated** heritage asset and or their
  setting, including: *Designated Heritage Assets: - Listed Buildings - Conservation Areas - World Heritage
  Sites - Registered Parks and Gardens - Scheduled Monuments **Non-designated Heritage Assets: - Buildings
  of Townscape Merit (designated by the Council) - Archaeological Priority Areas'
must-include:
- item: Details of all heritage assets affected
  level: must
- item: A summary of the findings from consultation with the Greater London Historic Environment Record
    (HER)
  level: must
- item: A summary of the significance or 'special interest' of the asset(s)
  level: must
- item: A summary of the proposals
  level: must
- item: How the proposals will impact on the significance of the asset(s)
  level: must
- item: Justification of the impact, including how the proposal has been designed to conserve or minimise
    harm, and any heritage benefits that may outweigh the harm (mitigation)
  level: must
- item: How the proposal complies with the relevant Conservation Area Appraisals, Village Planning Guidance
    SPDs and other adopted SPDs/SPGs
  level: should
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 11-12. Item 13. 'Should always include'
  items 1-6.
review-status: unverified
field-status: {}
