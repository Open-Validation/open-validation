reference: design-and-access-statement
local-authority: RIC
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 44
source-text: '1. All major development. 2. Applications for development (including householders) in a
  Conservation Area or World Heritage Site, where the proposed development consists of: • one or more
  dwellings; or • a building or buildings with a floor space of 100 sqm or more. 3. Applications for listed
  building consent.'
must-include:
- item: The design evolution and rationale behind the proposal
  level: must
- item: Analysis of the site constraints and wider surrounding context and opportunities, and how the
    context has influenced the design
  level: must
- item: How the proposal aligns with the Conservation Area Appraisals and the design guidance for the
    character area (Urban Design Study and Village Planning Guidance SPDs)
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Where relevant, for example in a Conservation Area.
- item: 'If not a single document: a contents page, with individual documents clearly titled'
  level: should
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 8. Item 3. Smaller developments below
  the Appendix 2 thresholds cover transport within the DAS (item 23).
review-status: unverified
field-status: {}
