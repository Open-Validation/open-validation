reference: construction-management-plan
local-authority: RIC
required-if:
  any:
  - ref: major-development
  - condition:
      field: basement
      value: true
      description: Any basement or subterranean development (including householders).
  - condition:
      field: earthworks
      value: true
      description: Substantial demolition or excavation works.
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 48, 53 and 54; Transport SPD
source-text: 1. All major development. 2. Any basement and subterranean developments (including householders).
  3. Developments of sites in confined locations or near sensitive receptors. 4. If substantial demolition/excavation
  works are proposed. 5. Any development that may involve significant impact to the highway, neighbours,
  or the wider highway network.
must-include:
- item: Uses the Council's latest pro-forma CMP template
  level: must
- item: A Mitigation Measures Statement on how dust, noise and vibration will be monitored, and action
    taken if issues arise
  level: should
- item: How the conditions and Environment Agency regulatory position statements on dewatering will be
    met
  level: must
  required-if: discretionary
  source-text: CMPs will need to demonstrate how they meet the conditions and adhere to the Environment
    Agency's regulatory position statements on dewatering where applicable.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 16. Item 27 (Outline Construction Management
  Plan). 'Confined locations or near sensitive receptors' and 'significant impact to the highway, neighbours'
  have no threshold, so they show as discretionary.
review-status: unverified
field-status: {}
