reference: landscaping-plan
local-authority: RIC
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 39, 42 and 54; Design Quality SPD
source-text: 1. All major development. 2. Minor development where appropriate, e.g. proposals with a significant
  landscaping component or where landscaping is considered to be of material importance to determining
  the proposed development. A full landscaping scheme is not required for outline applications.
must-include:
- item: Hard and soft elements, with materials (and their permeability)
  level: must
- item: Species (native and non-native)
  level: must
- item: Tree and plant sizes, numbers and planting densities
  level: must
- item: Levels, gradients and any earthworks
  level: must
- item: Screening by fences, walls or other means
  level: must
- item: Bicycle and refuse storage, children's playspace, gardens, courts, squares, water features, sculpture
    or public art and other amenity features
  level: must
- item: Timing of implementation
  level: must
- item: Long-term maintenance and landscape management proposals
  level: should
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 29-30. Item 61 (Landscaping Scheme). 'Minor
  development where appropriate' shows as discretionary. A landscape strategy with details by condition
  may be acceptable; for outline, the DAS sets out the principles.
review-status: unverified
field-status: {}
