reference: town-centre-impact-assessment
local-authority: RIC
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside designated centres (sequential test).
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside designated Town, Local and Neighbourhood Centres.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Retail and leisure development (including extensions) over 500 sq m gross (combined).
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 18
source-text: All applications for main town centre uses outside of designated centres (including extensions
  to existing retail and leisure developments of more than 200sqm gross). ... Retail and leisure developments
  (including extensions) over 500sqm gross (combined) proposed outside of designated Town, Local and Neighbourhood
  Centres.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 24. Items 46 (Town Centre Uses Sequential
  Test) and 47 (Retail/Leisure Impact Assessment, over 500 sq m). Scope to be agreed with the Council
  before submission.
review-status: unverified
field-status: {}
