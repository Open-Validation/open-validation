reference: ecology-assessment
local-authority: RIC
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: biodiversity-gain-condition
        value: false
        description: Exempt from Biodiversity Net Gain.
    - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 34 and 39
source-text: All development* that is exempt from Biodiversity Net Gain and/or development that does not
  require a Preliminary Ecological Appraisal. *A statement is not required for householder applications;
  however, such proposals are still expected to deliver ecological enhancements where feasible.
must-include:
- item: Measures to protect and enhance biodiversity and geodiversity, including ecological connectivity
    through habitat corridors and stepping-stone sites
  level: should
- item: Proposed actions such as habitat creation, native planting and wildlife features, with implementation
    and maintenance details
  level: should
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 32-33. Item 66 (Ecological Enhancement
  Statement), filed under MHCLG's retired ecology-assessment id. 'Development that does not require a
  Preliminary Ecological Appraisal' depends on item 67, so it shows as discretionary.
review-status: unverified
field-status: {}
