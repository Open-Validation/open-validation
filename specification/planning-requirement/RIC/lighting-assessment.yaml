reference: lighting-assessment
local-authority: RIC
required-if:
  any:
  - all:
    - any:
      - condition:
          field: floodlighting
          value: true
          description: Floodlighting.
      - condition:
          field: external-lighting
          value: true
          description: Other external artificial lighting.
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - world-heritage-site
          - park-and-garden
          - scheduled-monument
          description: In the vicinity of designated heritage assets.
      - site:
          in:
          - site-of-special-scientific-interest
          - special-area-of-conservation
          - special-protection-area
          - local-wildlife-site
          description: In the vicinity of designated nature conservation sites.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: External lighting is proposed for the advertisement.
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 19 and 43
source-text: '• Development proposals for floodlighting or other external artificial lighting in connection
  with publicly accessible development or development which is in the vicinity of: 1. residential uses;
  or 2. designated heritage assets; or 3. designated nature conservation sites; • Required for advertisements
  where external lighting is proposed.'
must-include:
- item: The lighting strategy, justification for external lighting, and impacts on biodiversity, amenity
    and local character
  level: must
- item: 'Detailed plans and specifications: light levels, spillage, column heights, type, method and colour
    of illumination, fitting sizes, spectrum details and contextualised lux spill maps'
  level: must
- item: Site layout plans with beam orientation, equipment schedules, hours of use, mitigation and evidence
    of compliance with professional guidance
  level: should
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 36. Item 71. 'Publicly accessible development'
  and 'in the vicinity of residential uses' have no field, so they show as discretionary. Item 22 also
  asks for lighting details on advertisement drawings.
review-status: unverified
field-status: {}
