reference: bng-metric
local-authority: RIC
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Environment Act 2021; Richmond Local Plan (2025) Policy 39
source-text: 'All applications. Note: even if you believe your development qualifies for an exemption
  from BNG, you must still explain the reason for the exemption and provide any supporting evidence.'
must-include:
- item: A completed Statutory Biodiversity Metric, completed by a competent person such as a qualified
    ecologist (non-major sites may use the Small Sites Metric if they meet its criteria)
  level: must
- item: 'Draft Biodiversity Gain Plan: how the 10% minimum will be achieved, whether on-site, off-site
    or both, intended off-site location, area and habitat type where known, and how the BNG Hierarchy
    has been considered'
  level: should
  source-text: Draft Biodiversity Gain Plan setting out the proposed BNG strategy
- item: Completed post-development habitat map / landscape plan (to scale)
  level: should
- item: Draft Habitat Management and Monitoring Plan
  level: should
  required-if: discretionary
  source-text: For development proposals involving significant on-site enhancements, a draft Habitat Management
    and Monitoring Plan is recommended
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 9, 32. Item 7 (BNG Statement & Statutory
  Biodiversity Metric) and item 65 (BNG local requirements). The list says 'All applications', but householder
  and other exempt applications are exempt from the biodiversity gain condition by law, so the rule follows
  the law. The council's own BNG Statement template is encouraged, not required (sent to unmapped). Item
  65's extras are 'strongly recommended', so they show as 'should'.
review-status: unverified
field-status: {}
