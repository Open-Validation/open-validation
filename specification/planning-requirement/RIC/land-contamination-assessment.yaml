reference: land-contamination-assessment
local-authority: RIC
required-if:
  any:
  - all:
    - site:
        in:
        - contaminated-land
        description: On or near land known or suspected to be contaminated, or with a history of potentially
          contaminating uses.
    - any:
      - condition:
          field: ground-disturbance
          value: true
          description: Groundworks are proposed.
      - condition:
          field: sensitive-end-use
          value: true
          description: An increase in site sensitivity is proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: Sensitive uses vulnerable to contamination (allotments, nurseries, schools, hospitals,
        playgrounds).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: 'Residential: any development involving one or more new dwellings.'
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 53; Contaminated Land SPG (2003)
source-text: '1. All development on or in the vicinity of land that is known or suspected to be contaminated,
  or has a history of potentially contaminating uses, and where groundworks and/or an increase in site
  sensitivity are proposed. 2. All development proposing sensitive uses that would be particularly vulnerable
  to the presence of contamination (for example: allotments, nurseries, schools, residential*, hospitals
  or playgrounds).'
must-include:
- item: Preliminary risk assessment (desk study) by a suitably qualified person, with site walk-over findings
    if available
  level: must
- item: Site inspection scope
  level: must
- item: Review of historical land use
  level: must
- item: Review of environmental setting
  level: must
- item: Consultation with relevant regulatory authorities
  level: must
- item: Review of existing reports
  level: must
- item: A preliminary qualitative environmental risk assessment
  level: must
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 38. Item 78. *For residential, it applies
  to any development with one or more new dwellings; extensions to existing dwellings are excluded unless
  there is a known or suspected contamination issue.
review-status: unverified
field-status: {}
