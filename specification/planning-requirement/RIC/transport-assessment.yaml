reference: transport-assessment
local-authority: RIC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings (C3).
  - condition:
      field: convenience-retail-floorspace
      operator: '>='
      value: 250
      description: Food retail (E(a)) of 250 sq m GIA or more.
  - condition:
      field: comparison-retail-floorspace
      operator: '>='
      value: 800
      description: Non-food retail (E(a)) of 800 sq m GIA or more.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: General industrial (B2) of 2,500 sq m GIA or more.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 3000
      description: Storage and distribution (B8) of 3,000 sq m GIA or more.
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 47; Ham and Petersham Neighbourhood Plan Policy T1
source-text: See Appendix 2 to establish whether a Transport Statement, Transport Assessment, or coverage
  within the Design & Access Statement is required, depending on the proposed use and scale of development.
must-include:
- item: An Active Travel Zone (ATZ) Assessment
  level: must
  required-if:
    ref: major-development
  source-text: For major developments, and in line with TfL's Healthy Streets Approach and guidance, transport
    statements/assessments should include an Active Travel Zone (ATZ) Assessment.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 14, 41. Item 23 (Transport Statement /
  Transport Assessment). A full Transport Assessment is needed from the higher threshold column (for example
  80 dwellings). Appendix 2 (page 41, Local Plan Table 23.1) sets the thresholds by use class. Below the
  'transport statement' threshold, transport is covered in the Design and Access Statement. Only the thresholds
  that fit existing fields are encoded; the others (financial and professional services 1,000 sq m, restaurants
  and cafes, drinking establishments and hot food takeaways 300/300/250 sq m, business E(g) 1,500 sq m,
  hotels 30 beds, hospitals and nursing homes 30 bedrooms, residential education 50 students, hostels
  250 residents, F1 non-residential institutions and F1/F2 assembly and leisure 500 sq m) and the 'seek
  pre-app advice' uses (schools, sui generis, other Class E) show as discretionary.
review-status: unverified
field-status: {}
