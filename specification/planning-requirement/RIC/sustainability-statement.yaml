reference: sustainability-statement
local-authority: RIC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates one or more dwellings (gross), including by change of use, extension or conversion.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: New non-residential development or extensions of more than 100 sq m gross.
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 6; Sustainable Construction Checklist SPD
source-text: 1. New residential development creating 1 dwelling unit gross or more (including new build,
  change of use, extensions and conversions). 2. New non-residential development or extensions of more
  than 100sqm gross floorspace (including new build, change of use and conversions).
must-include:
- item: The Sustainable Construction Checklist spreadsheet(s), submitted in Excel format
  level: must
  source-text: 'Note: The SCC must be submitted in Excel format'
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 24-25. Item 48 (Sustainable Construction
  Checklist).
review-status: unverified
field-status: {}
