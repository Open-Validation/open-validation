reference: site-plan
local-authority: RIC
required-if:
  always: true
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: Block plan at a scale of 1:100, 1:200 or 1:500
  level: must
- item: Size and position of existing and proposed buildings relative to boundaries and other structures
    within the site, and the width and position of adjacent streets
  level: must
- item: Adjoining buildings, roads, footpaths, public rights of way, trees, hard surfacing and boundary
    treatments, unless these would not influence or be affected by the proposed development
  level: should
confidence: medium
notes: 'From the council''s list (adopted 19 February 2026), page 10. Item 9 (Plans – Local Requirements):
  the block plan.'
review-status: unverified
field-status: {}
