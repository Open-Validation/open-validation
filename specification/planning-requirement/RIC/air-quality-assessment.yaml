reference: air-quality-assessment
local-authority: RIC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 19 and 53; Air Quality SPD (2020)
source-text: 1. All major developments. 2. Minor developments within or adjacent to an Air Quality Focus
  Area, in certain circumstances, (such as introducing sensitive land uses, or residential conversions
  at street level).
must-include:
- item: An Air Quality Neutral (AQN) assessment, included within the AQA
  level: must
  required-if:
    ref: major-development
  source-text: Developers of all major developments will need to commission an AQN assessment and this
    should be included within the AQA.
- item: An Air Quality Positive (AQP) Statement, following the GLA Air Quality Positive LPG
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: Subject to Environmental Impact Assessment.
  source-text: All major developments subject to an Environmental Impact Assessment (EIA) (updated as
    appropriate for reserved matters applications).
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 37. Items 74 (Air Quality Assessment),
  75 (Air Quality Neutral Assessment, within the AQA) and 76 (Air Quality Positive Statement). Minor development
  near an Air Quality Focus Area 'in certain circumstances' shows as discretionary.
