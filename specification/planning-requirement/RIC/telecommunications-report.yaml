reference: telecommunications-report
local-authority: RIC
required-if:
  any:
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 27; Telecommunications Equipment SPD
source-text: All telecommunications development (including permitted development and prior-approval applications
  under Part 16 of the GPDO 2015, or any other such future Order).
must-include:
- item: Outcome of consultations with organisations with an interest in the proposal (for example a mast
    near a school)
  level: must
- item: Certificate or self-certification that cumulative exposure will stay within ICNIRP guidelines
  level: must
- item: Evidence that sharing existing equipment and using existing buildings or structures has been fully
    explored
  level: must
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 39. Item 83 (Telecommunications Statement).
review-status: unverified
