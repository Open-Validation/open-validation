reference: biodiversity-survey-report
local-authority: RIC
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - local-wildlife-site
      description: Within or adjacent to a designated (statutory or non-statutory) nature conservation
        site.
  - site:
      in:
      - priority-habitat
      description: Priority habitats present.
  - condition:
      field: protected-species
      value: true
      description: Protected species likely to be on or adjacent to the site.
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policies 34 and 39; Ham and Petersham Neighbourhood Plan Policy G2
source-text: 1. All development* within or adjacent to designated (statutory and non- statutory) or non-
  designated nature conservation sites. 2. All developments* where priority habitats are present and/or
  protected species are likely to be on or adjacent to the site. *including householder applications,
  depending on the extent of the proposal and ecological constraints
must-include:
- item: 'Preliminary Ecological Appraisal Report (PEAR) where no further surveys are needed: affected
    conservation sites, habitat map and value, protected and priority species, further surveys needed,
    enhancement opportunities'
  level: must
- item: 'Ecological Impact Assessment (EcIA) where surveys beyond the PEA are needed: baseline, evaluation,
    impact significance, mitigation, compensation, enhancement and monitoring'
  level: must
- item: Any information on badgers submitted as a separate (confidential) document
  level: must
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 33-34. Item 67 (Ecological Reports & Surveys).
  Non-designated nature conservation sites show as discretionary.
review-status: unverified
field-status: {}
