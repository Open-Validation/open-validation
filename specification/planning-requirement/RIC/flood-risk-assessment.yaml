reference: flood-risk-assessment
local-authority: RIC
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3 (not Flood Zone 2 for a change of use from water compatible to
        less vulnerable).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 site of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 site of 1 hectare or more.
  - site:
      in:
      - surface-water-flood-risk
      - critical-drainage-area
      - groundwater-flood-risk
      description: 'Evidence of risk from surface water, groundwater or sewer flooding: in the 1 in 100
        year surface water flood extent, a Surface Water Management Plan (2021) hotspot, the throughflow
        and groundwater policy zones or an area of increased potential for elevated groundwater.'
  - all:
    - condition:
        field: basement
        value: true
        description: Subterranean or basement development.
    - site:
        in:
        - groundwater-flood-risk
        description: In the throughflow policy zone or with 25% or more susceptibility to groundwater
          flooding.
  - site:
      in:
      - future-flood-risk
      description: Land identified as being at increased flood risk in the future.
  - discretionary
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 8
source-text: '• All development proposals within Flood Zones 2* and 3. • Development proposals within
  Flood Zone 1 with a site area of 1 hectare or more. • Development proposals where there is evidence
  of a risk from other non- fluvial sources of flooding, including surface water, ground water or sewer
  flooding (which may include sites within Flood Zone 1); this includes major and minor** development
  proposals: o in the 1 in 100 year surface water flood risk map extent or within a SWMP (2021) hotspot
  o within the throughflow and groundwater policy zones and/or o in an area increased potential for elevated
  groundwater. • Subterranean/basement development proposals within the throughflow policy zone or with
  >=25% susceptibility to groundwater flooding. • Development proposals on land identified as being at
  increased flood risk in the future. • Development proposals that may be subject to other sources of
  flooding, where its development would introduce a more vulnerable use.'
must-include:
- item: An accurate assessment of flood risk showing the land use is suitable, will not increase flood
    risk on or off site and is resilient to climate change, using the latest flood map and modelling evidence
  level: must
- item: The line of the tidal flood defence and the state of the flood defences
  level: must
  required-if: discretionary
  source-text: Including the line of the tidal flood defence and the state of the flood defences for sites
    next to the River Thames.
- item: 'Addresses all sources of flooding: rivers and the sea, surface water, rising groundwater, overwhelmed
    sewers and drainage systems, reservoirs, canals, lakes and other artificial sources'
  level: must
- item: Uses the appropriate climate change allowances; tidal flood risk uses the current TE2100 crest
    levels guidance and breach modelling
  level: must
- item: Evidence to apply the Sequential Test and, where necessary, the Exception Test
  level: must
- item: 'For householder development or a non-residential extension with a footprint under 250 sq m in
    Flood Zone 2 or 3: the Council''s ''Householder and Other Minor Extensions in Flood Zone 2 and 3''
    declaration form, or a site-specific FRA'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 18-19, 42-43. Item 34. 'Other sources
  of flooding, where its development would introduce a more vulnerable use' shows as discretionary. Appendix
  3 (Local Plan Table 16.4) summarises flood zone restrictions.
review-status: unverified
field-status: {}
