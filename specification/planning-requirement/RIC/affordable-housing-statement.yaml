reference: affordable-housing-statement
local-authority: RIC
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: Sites capable of 10 or more residential units (gross).
source-url: https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
policy: Richmond Local Plan (2025) Policy 11; Affordable Housing SPD
source-text: Major sites capable of 10 or more residential units (gross).
must-include:
- item: 'Accommodation schedule of market and affordable housing: units, habitable rooms, floor area (GIA)
    and private outdoor amenity space dimensions'
  level: must
- item: Affordable housing provision by tenure as a percentage of total units, habitable rooms and floor
    area
  level: must
- item: Proposed affordability levels or tenures for each unit and how they align with the Affordable
    Housing SPD, with compliance with income thresholds
  level: must
- item: A scaled plan showing the location of the affordable housing units
  level: must
- item: Engagement with Registered Providers (tenure, unit sizes, design, affordability, offers made)
    and any public grant funding
  level: must
- item: Whether the application follows the Fast Track Route or the Viability Tested Route
  level: must
- item: 'For Fast Track Route schemes: confirmation that the London Plan Policy H5 criteria are met, including
    tenure split and grant funding'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 19 February 2026), page 22. Item 39. Smaller schemes of 1-9 units
  submit an Affordable Housing Commuted Sum Calculation instead (item 40, sent to unmapped).
review-status: unverified
field-status: {}
