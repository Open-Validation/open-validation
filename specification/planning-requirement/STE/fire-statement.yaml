reference: fire-statement
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for, or relating to, buildings of 18 metres or more in height or containing
  7 or more storeys; and including two or more dwellings or educational accommodation.
must-include:
- item: Provided on the Government's Fire Statement Form
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 52. Section 3.10. Listed in the tables
  for all development and change of use.
review-status: unverified
field-status: {}
