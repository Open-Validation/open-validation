reference: archaeological-assessment
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - lbc
  - any:
    - site:
        in:
        - scheduled-monument
        description: On or adjoining a scheduled monument.
    - site:
        in:
        - historic-environment-record
        - archaeological-priority-area
        description: A site of known archaeological interest.
    - discretionary
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: Any proposed development on or adjoining a scheduled monument, or a site of known or suspected
  archaeological interest.
must-include:
- item: An appropriate archaeological desk-based assessment
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 58. Section 4.3. 'Suspected' archaeological
  interest shows as discretionary. Listed in the tables for all development, change of use and listed
  building consent. Further evaluation may be required.
review-status: unverified
field-status: {}
