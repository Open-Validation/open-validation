reference: travel-plan
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - discretionary
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for developments that require a Transport Assessment or Transport Statement.
must-include:
- item: 'A summary of the development: for residential, number of dwellings, vehicle/cycle parking and
    EV charging; for employment, size, maximum employees on site, parking, deliveries; for education,
    students and age range, staff, hours, parking and drop-off'
  level: must
- item: Existing site, highway and active travel infrastructure
  level: must
- item: How the transport implications will be managed to minimise environmental, social and economic
    impacts
  level: must
- item: SMART targets
  level: must
- item: A delivery/action plan of measures, responsibilities, funding and timeframes
  level: must
- item: Appointment of a travel plan coordinator
  level: must
- item: Marketing and promotion of sustainable travel to occupiers, users, visitors and residents
  level: must
- item: A monitoring/evaluation strategy
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 89-90. Section 4.27. Needed whenever a
  Transport Assessment or Statement is, so it shows as discretionary like them.
review-status: unverified
field-status: {}
