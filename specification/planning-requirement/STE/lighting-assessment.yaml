reference: lighting-assessment
local-authority: STE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - condition:
        field: external-lighting
        value: true
        description: The development introduces artificial lighting.
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illumination or digital screens.
    - discretionary
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for development introducing artificial lighting into any sensitive context,
  normally close to residential development or sites of nature conservation value or which may impact
  on protected species or priority species. All applications for advertisement consent including proposals
  for illumination or use of digital screens in sensitive locations.
must-include:
- item: Details of the proposed lighting
  level: must
- item: Proposed hours when the lighting would be switched on
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Lighting diagram showing the intensity of illumination
  level: must
- item: Schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 73. Section 4.15. Shown as discretionary
  because a 'sensitive context' (normally near homes, nature conservation sites or protected species)
  or 'sensitive location' is a judgement. Listed in the tables for all development, change of use and
  advertisement consent.
review-status: unverified
field-status: {}
