reference: sci
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: A departure from the development plan.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
policy: Stoke-on-Trent Statement of Community Involvement
source-text: All applications involving residential development of 10 or more residential units (or site
  area of 0.5 or more hectares). All applications involving non-residential development of 1,000sqm or
  more additional floorspace (or site area of 1 or more hectares). All applications involving development
  that would be a departure from the development plan.
must-include:
- item: The measures taken to consult on the development before the application was submitted
  level: must
- item: How the views of consultees have been incorporated into the development
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 82. Section 4.21 'Statement of Community
  Involvement'. The tables list it only for major development ('Always'); section 4.21 adds departures
  from the development plan. Details may be included in the Planning Statement.
review-status: unverified
field-status: {}
