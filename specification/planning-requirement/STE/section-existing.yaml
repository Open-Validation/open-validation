reference: section-existing
local-authority: STE
required-if:
  any:
  - application-type:
      in:
      - advertising
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: The proposal changes ground levels, or the site slopes.
      - condition:
          field: adjacent-ground-level-change
          value: true
          description: Development set at a different ground level than adjoining existing development.
      - site:
          in:
          - listed-building
          description: Alterations to a listed building.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications involving a change in ground levels, or involving development set at a different
  ground level than adjoining existing development. All applications located on a sloping site. Section
  drawings are required for all applications involving alterations to listed buildings. ... Section drawings
  are always required.
must-include:
- item: An appropriate metric scale, for example 1:100, 1:200 or 1:500
  level: must
- item: Existing and proposed streetscene at 1:50 or 1:100
  level: must
- item: Cross section(s) through the proposed building(s)
  level: must
- item: 'Where ground levels change: existing and finished levels, including foundations and eaves, and
    how encroachment onto adjoining land is avoided'
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
- item: Existing site levels and finished floor levels (related to a fixed datum point off site), and
    the proposal in relation to adjoining buildings
  level: should
- item: 'For alterations to listed buildings: detailed sections of new windows, doors and other architectural
    details (minimum 1:20) and joinery and mouldings (minimum 1:2)'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Alterations to a listed building.
confidence: medium
notes: From the council's list (published November 2025), page 50 (and tables, pages 8-42). Section 3.8,
  'Section Drawings, Floor and Site Levels, and Streetscene (Existing and Proposed)'. The advertisement
  consent and listed building consent tables say section drawings are always required; for listed building
  consent, site levels and streetscene are needed only where levels change or the site slopes.
review-status: unverified
field-status: {}
