reference: floor-plan-proposed
local-authority: STE
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - lbc
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications proposing new or amended floor space and/or proposals to alter existing
  buildings.
must-include:
- item: An appropriate metric scale, for example 1:50 or 1:100
  level: must
- item: The existing and proposed use of each room labelled
  level: must
- item: Proposed openings that match the elevations, including the width of glazing bars and other details
    where relevant (line drawings are not acceptable)
  level: should
- item: Details of existing buildings, where relevant, in relation to the proposed buildings
  level: should
- item: 'For change of use: the proposed layout and use of each room, whether or not internal alterations
    are proposed'
  level: must
  required-if:
    application-type:
      in:
      - change-of-use
- item: Where handed house types are provided, plans for all house types
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 47. Section 3.5. The tables list floor
  plans (existing and proposed) as 'Always' for householder, all development, change of use and listed
  building consent.
review-status: unverified
field-status: {}
