reference: landscaping-plan
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - ref: major-development
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications involving residential development of 10 or more residential units (or site
  area of 0.5 or more hectares). All applications involving non-residential development of 1,000sqm or
  more additional floorspace (or site area of 1 or more hectares).
must-include:
- item: Existing landscape features (trees, shrubs, hedgerows, topography), clearly showing those to be
    removed, and proposed planting (including National Forest planting where appropriate)
  level: must
- item: 'Full tree planting details: nursery stock sizes, tree pits, staking, planting and backfill specifications'
  level: must
- item: Location and type of boundary treatment
  level: must
- item: Measures for ongoing protection, maintenance and management of landscaping
  level: must
- item: Integration with proposals for ecological enhancement
  level: must
- item: 'Planting schedules for trees and shrubs: species, stock sizes and categorisation, numbers and
    densities'
  level: must
- item: Seed mixes and sowing densities for amenity grass and wildflower areas
  level: must
- item: Earthworks and ground level changes; finished levels or contours
  level: must
- item: Treatment of all ground surfaces, including the extent and type of hard surfacing
  level: must
- item: Any structures to be erected; functional services above and below ground
  level: must
- item: 'Landscape management plan/strategy: long-term design objectives, management responsibilities
    and maintenance schedules for all landscape areas other than domestic gardens'
  level: must
- item: Maintenance schedules for the first four years and ongoing schedules for five-plus years, with
    the frequency of operations (watering, weeding, litter picking, pests and diseases, inspections and
    pruning, stakes and guards, replacing dead plants, hedgerow cutting, mowing, thinning, re-seeding)
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 71-72. Section 4.14 'Landscape Plans /
  Management Strategy'. 'Always' in the major residential and non-residential tables; for change of use,
  at the same major thresholds.
review-status: unverified
field-status: {}
