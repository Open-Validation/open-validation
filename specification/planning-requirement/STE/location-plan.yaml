reference: location-plan
local-authority: STE
required-if:
  always: true
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications.
must-include:
- item: Ordnance Survey quality, with a valid OS licence number
  level: must
- item: At a scale of 1:1250 unless the size of the site dictates a different scale
  level: must
- item: A north point and a scale bar
  level: must
- item: At least 2 road names where possible, and property numbers/names around the site
  level: must
- item: The application site edged red, including all land needed to carry out the development and any
    land needed to connect it to a highway
  level: must
- item: Any other land owned by the applicant edged blue
  level: must
- item: Obtained from a legitimate source (to avoid breach of copyright)
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 45. Section 3.3. The Part One tables (pages
  8-42) list it for every application type.
review-status: unverified
field-status: {}
