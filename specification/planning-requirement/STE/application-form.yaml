reference: application-form
local-authority: STE
required-if:
  always: true
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications.
must-include:
- item: Completed in full, signed and dated
  level: must
- item: A concise, clear description of the development that accurately reflects all aspects of the proposal
  level: should
- item: The correct ownership certificate (A, B, C or D)
  level: must
- item: An Agricultural Holdings Certificate, even for a non-agricultural use
  level: must
- item: 'For works to trees and advertisement consent: ownership details entered in the relevant section
    of the form'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
      - advertising
confidence: medium
notes: From the council's list (published November 2025), page 43. Section 3.1, 'Application Form and
  Ownership Certificate(s)'. The Part One tables (pages 8-42) list it for every application type.
review-status: unverified
field-status: {}
