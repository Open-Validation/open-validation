reference: heritage-statement
local-authority: STE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - advertising
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        - historic-environment-record
        description: Affects a designated or non-designated heritage asset or its setting.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for development which impacts upon a designated or non-designated heritage
  asset or its setting. A designated heritage asset includes listed buildings, conservation areas, scheduled
  monuments and registered parks and gardens. Non-designated heritage assets include buildings of special
  local interest and sites of archaeological interest.
must-include:
- item: The significance of all heritage assets affected, including any contribution made by their settings,
    in proportionate detail
  level: must
- item: The Stoke-on-Trent Historic Environment Record (HER) consulted as a minimum, with all sources
    and expertise consulted listed
  level: must
- item: Details of the proposed works and an assessment of their impact on the significance of all affected
    assets and/or their settings
  level: must
- item: Justification for the proposals in terms of their impact, and any measures that might mitigate
    it
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 68. Section 4.11. 'Always' for listed building
  consent; listed in the tables for householder, all development, change of use and advertisement consent.
review-status: unverified
field-status: {}
