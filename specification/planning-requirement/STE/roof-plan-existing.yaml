reference: roof-plan-existing
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: footprint-increase
        value: true
        description: Extensions.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to an existing roof.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications involving new buildings including extensions or alterations to an existing
  roof.
must-include:
- item: A recognised metric scale, normally 1:50 or 1:100
  level: must
- item: The shape of the roof and details such as roof lights, chimneys, vents and flues
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 49. Section 3.7. Listed in the tables for
  householder, all development, change of use and listed building consent.
review-status: unverified
field-status: {}
