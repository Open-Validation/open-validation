reference: waste-management-plan
local-authority: STE
required-if:
  application-type:
    in:
    - waste-dev
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for development for uses involving the processing, transfer or deposition
  of waste.
must-include:
- item: 'A full description of the development: how it will operate and its effects, timescale, days and
    hours of operation, processes, layout and design of buildings, plant, operational areas, haul roads
    and external lighting'
  level: must
- item: 'The types and quantities of waste: daily throughput sought, estimated annual quantity of each
    waste type and total capacity where relevant'
  level: must
- item: 'Communal living schemes (flats, HMOs, care homes, student accommodation): internal and external
    storage for food waste, recycling, residual and organic containers'
  level: must
- item: Arrangements for disposing of residues and any hazardous materials used or stored on the site
  level: must
- item: Swept path analysis on all plans
  level: must
- item: Shared driveways identified as adopted or private
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 94. Section 4.31 'Waste Management Scheme
  Details'. Stoke-on-Trent is the waste planning authority; shown for waste development applications.
  Listed in the tables for all development and change of use 'involving the processing, transfer or deposition
  of waste'.
review-status: unverified
field-status: {}
