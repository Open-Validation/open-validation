reference: biodiversity-survey-report
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - consent-under-tpo
      - notice-trees-in-con-area
      - lbc
  - any:
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-nature-reserve
        - local-wildlife-site
        - priority-habitat
        description: Potential to affect a European, national or locally designated site or other sites
          supporting important habitats.
    - condition:
        field: protected-species
        value: true
        description: Potential to affect a priority species or a species protected by law, and its habitat.
    - all:
      - application-type:
          in:
          - lbc
      - any:
        - condition:
            field: vacant-building
            value: true
            description: The building has been vacant for a substantial period of time.
        - condition:
            field: roof-alteration
            value: true
            description: Works to the roof are proposed.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017
source-text: All applications for development that would have the potential to affect a European, national
  or locally designated site or other sites which support important habitats. All applications for development
  that would have the potential to affect a priority species or a species protected by law and their habitat.
  ... Where the building has been vacant for a substantial period of time, or where works to the roof
  are proposed.
must-include:
- item: A description of the proposal
  level: must
- item: An Ecological Impact Assessment (EcIA), with desk study and field survey as necessary, of the
    site and any other areas likely to be affected
  level: must
- item: Features (including geological and geomorphological features) and an assessment of the likely
    impacts
  level: must
- item: How impacts are avoided, mitigated and/or compensated, with clear, site-specific, feasible and
    deliverable prescriptions
  level: must
- item: Any further surveys needed, provided before the application is validated
  level: must
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: should
- item: Information on protected species, impacts and mitigation where the work includes demolition or
    conversion of buildings or roof spaces, removal of trees, scrub or hedgerows, or alterations to watercourses
  level: must
- item: Undertaken by suitably qualified and competent ecology professionals
  level: must
- item: A Preliminary Ecological Appraisal is accepted instead of an EcIA only where ecological impacts
    are likely to be very limited and no further survey work is needed
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 61-62, 42. Section 4.6 'Ecological Impact
  Assessment'. Listed in the tables for householder, all development, change of use, works to trees and
  listed building consent; the listed building table adds vacant buildings and roof works.
review-status: unverified
field-status: {}
