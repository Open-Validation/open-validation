reference: site-plan
local-authority: STE
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - advertising
    - lbc
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications.
must-include:
- item: A recognised metric scale, 1:500 or appropriate (a scale at which the floor layout can be distinguished)
  level: must
- item: The full extent of the existing site (including extensions, garages and outbuildings), relating
    the development to the original and surrounding buildings
  level: should
- item: The site boundary edged red, matching the location plan
  level: must
- item: Consistent with the details on the floor plans
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 46. Section 3.4, 'Site Plan / Block Plan
  (Existing and Proposed)'. The tables list it as 'Always' for householder, all development, change of
  use, advertisement consent and listed building consent (not for works to trees).
review-status: unverified
field-status: {}
