reference: affordable-housing-statement
local-authority: STE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: Residential development of 10 or more units.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Residential site of 0.5 hectares or more.
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Change of use creating 10 or more residential units.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for development involving 15 or more residential units. ... All development
  involving 10 or more residential units.
must-include:
- item: The number, size, type and tenure of the units
  level: must
- item: Plans and drawings showing the location, size and layout of the new affordable dwellings
  level: must
confidence: medium
notes: 'From the council''s list (published November 2025), page 56. Section 4.1. The lists disagree:
  section 4.1 says 15 or more units, but the tables list it as ''Always'' for major residential development
  (10+ units or 0.5 ha) and for change of use involving 10 or more units (page 33). The tables'' wider
  rule is shown.'
review-status: unverified
field-status: {}
