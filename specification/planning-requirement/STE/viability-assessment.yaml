reference: viability-assessment
local-authority: STE
required-if:
  all:
  - any:
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
    - application-type:
        in:
        - change-of-use
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Not fully complying with affordable housing policy.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Not fully complying with planning obligations and/or financial contributions.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for development where the developer does not intend to fully comply with
  policy requirements in respect of affordable housing, planning obligations and/or financial contributions
must-include:
- item: Evidence of why the development cannot viably sustain the level of contribution required
  level: must
- item: The developer meets the cost of an independent review of the appraisal, as instructed by the council
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 93. Section 4.30 'Viability Appraisal'.
  Listed in the major residential and non-residential tables and the change of use table (affordable housing
  only in the residential one).
review-status: unverified
field-status: {}
