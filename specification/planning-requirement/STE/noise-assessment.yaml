reference: noise-assessment
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise-sensitive use (homes, care homes, medical, noise-sensitive commercial).
      - any:
        - site:
            in:
            - town-centre
            description: Within a town or city centre defined in the development plan.
        - discretionary
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: A use generating high levels of noise or vibration (noisy machinery, transport,
            external storage, 24-hour uses).
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Close to existing noise-sensitive uses.
    - all:
      - any:
        - condition:
            field: entertainment-leisure-use
            value: true
            description: A commercial or entertainment use.
        - condition:
            field: food-or-drink-use
            value: true
            description: A commercial use with extraction equipment.
      - any:
        - condition:
            field: plant-equipment
            value: true
            description: Externally mounted extraction equipment.
        - discretionary
    - all:
      - any:
        - condition:
            field: entertainment-leisure-use
            value: true
            description: A commercial, entertainment or leisure use.
        - condition:
            field: noise-generating-use
            value: true
            description: A commercial use.
      - condition:
          field: adjoins-residential-property
          value: true
          description: Sharing a party wall, floor or ceiling with residential uses (existing or proposed).
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications for development within town or city centre, as defined in the development
  plan, or is located within a noise generative environment, which would be for a sensitive use (e.g.
  residential, care homes, medical or noise sensitive industrial / commercial uses). All applications
  for development that generate high levels of noise or vibration such as industrial developments using
  noisy machinery; transport; external storage; 24 hours uses; close to existing noise sensitive uses
  (as per above). All applications for development for commercial or entertainment uses which involve
  externally mounted extraction equipment; live or recorded entertainment; external uses (e.g. beer gardens).
  All applications for development for commercial, entertainment or leisure uses, in premises sharing
  a party wall, floor or ceiling with residential uses (whether these party walls, floors, or ceilings
  be to existing residential uses or as a result of the proposed development); All applications for development
  including noise or vibration sensitive uses (e.g. residential) adjacent to major sources of noise such
  as a main road or motorway, railways, industrial and commercial premises (including existing entertainment
  and sports venues).
must-include:
- item: The building's use and location, and any surrounding people or wildlife affected by noise
  level: must
- item: The noises produced by the development and where they originate
  level: must
- item: Noise and/or vibration survey details and full results
  level: must
- item: Noise/vibration assessment criteria to the relevant British Standard
  level: must
- item: Mitigation to reduce or prevent noise, considering the end use (flues, plant, AC, heat pumps),
    layout (incompatible rooms not sharing a party wall) and protection from existing noise sources
  level: must
- item: Survey undertaken by a suitably qualified and competent professional
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 74-75. Section 4.16. A 'noise generative
  environment', 'major sources of noise' and live/recorded entertainment or beer gardens are judgements,
  so those parts show as discretionary. Listed in the tables for all development and change of use.
review-status: unverified
field-status: {}
