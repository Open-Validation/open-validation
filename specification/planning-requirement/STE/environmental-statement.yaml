reference: environmental-statement
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - condition:
      field: eia-development
      value: true
      description: EIA development, or a screening opinion has decided an Environmental Statement is needed.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: All applications for development with significant environmental impact or within environmentally
  sensitive locations. All applications for development automatically EIA development in line with the
  Town and Country Planning (Environmental Impact Assessment) Regulations 2017 or their successor. All
  applications for development that has been the subject of a screening opinion provided which determined
  that an Environmental Statement is required.
must-include:
- item: The information set out in Schedule 4 of the EIA Regulations 2017
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 55. Section 3.13. Listed in the tables
  for residential (minor and major) and major non-residential development and change of use.
review-status: unverified
field-status: {}
