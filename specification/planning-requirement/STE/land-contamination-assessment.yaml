reference: land-contamination-assessment
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - ref: major-development
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected due to a previous use or an offsite source.
    - condition:
        field: previously-developed-land
        value: true
        description: The site has been previously developed.
    - discretionary
    - all:
      - application-type:
          in:
          - change-of-use
      - condition:
          field: sensitive-end-use
          value: true
          description: The change of use introduces sensitive receptors, gardens or soft landscaping.
      - condition:
          field: industrial-site
          value: true
          description: On former commercial or industrial land or buildings.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: 'All applications involving: Residential development of 10 or more residential units (or
  site area of 0.5 or more hectares). Non-residential development of 1,000sqm or more additional floorspace
  (or site area of 1 or more hectares). All applications for development on sites where contamination
  is known or suspected due to a previous use or an offsite source. All applications where a site has
  been previously developed or historically associated with mineral extraction. All applications for a
  change of use introducing sensitive receptors and/or the creation of gardens or soft landscaping on
  former commercial / industrial land and buildings.'
must-include:
- item: A Stage 1 Preliminary Risk Assessment of the ground-based environmental and geotechnical risks,
    development constraints and liabilities
  level: must
- item: Undertaken by a competent professional, in accordance with government guidance on Land Contamination
    Risk Management
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 69. Section 4.12. Sites historically associated
  with mineral extraction show as discretionary (no map field). 'Always' in the major tables; listed for
  minor development and change of use where the triggers apply.
review-status: unverified
field-status: {}
