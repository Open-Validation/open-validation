reference: air-quality-assessment
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - discretionary
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: 'All applications for development which are likely to cause significant levels of air pollution
  or exposes future occupants to existing poor air quality. In order to determine whether an Air Quality
  Assessment is required for a proposal, the Stage 1 and Stage 2 criteria within section 6 of the Institute
  of Air Quality Management (IAQM) Land-Use Planning & Development Control: Planning For Air Quality guidance
  should be used.'
must-include:
- item: Assessment of harmful fumes and pollutants the development could cause, or existing pollutants
    likely to affect occupants
  level: must
- item: Mitigation against the pollution
  level: must
confidence: medium
notes: 'From the council''s list (published November 2025), page 57. Section 4.2. Shown as discretionary:
  whether pollution is ''significant'' is judged with the IAQM Stage 1 and 2 criteria, and the whole city
  is an Air Quality Management Area. Listed in the tables for all development and change of use.'
review-status: unverified
field-status: {}
