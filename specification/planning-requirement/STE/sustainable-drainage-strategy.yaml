reference: sustainable-drainage-strategy
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
  - any:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: Surface water drainage in an area at risk of flooding (Flood Zone 2 or 3, or another
          source such as surface water or groundwater).
    - all:
      - site:
          in:
          - critical-drainage-area
          description: In a Critical Drainage Area.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: Site of 0.5 ha or above.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 0.5
            description: Site of 0.5 ha or above.
    - discretionary
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications involving residential development of 10 or more residential units (or site
  area of 0.5 or more hectares). All applications involving non-residential development of 1,000sqm or
  more additional floorspace (or site area of 1 or more hectares). ... With surface water drainage in
  an area at risk of flooding such as flood zones 2 or 3, or at risk from another source of flooding.
  Such as (but not limited to); fluvial, watercourse, surface water, and ground water flooding. Located
  on sites of 0.5ha or above in Critical Drainage Areas .
must-include:
- item: The existing surface water drainage arrangements, including discharge rates and volumes
  level: must
- item: Following the Building Regulations Part H drainage hierarchy (ground, surface water body, surface
    water sewer, combined sewer) with reasonable justification
  level: must
- item: Justification for the types of SuDS considered; green SuDS expected in all development
  level: must
- item: A drainage layout showing all components, outfalls, levels and connectivity
  level: must
- item: An assessment of greenfield runoff rates post development
  level: must
- item: SuDS water quality management train features across the site
  level: must
- item: Discharge rates and attenuation volumes
  level: must
- item: Maintenance arrangements for the lifetime of the development, with suitable maintenance easements
    in the layout
  level: must
- item: The Sustainable Urban Drainage Pro-forma
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 84-85 (and tables). Section 4.23 'Sustainable
  Drainage Strategy (including Sustainable Urban Drainage Pro-forma)'. Section 4.23 names major development;
  the householder, minor and change-of-use tables add sites at flood risk and sites of 0.5 ha+ in Critical
  Drainage Areas. Other flood sources are 'not limited to' those named, so that part shows as discretionary.
review-status: unverified
field-status: {}
