reference: arboriculturist-report
local-authority: STE
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on the site or on adjacent land (including the highway) that could be affected.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: Where there are trees within the application site or on adjacent land (including the highway)
  that could be affected by the development.
must-include:
- item: Survey by a suitably qualified and competent arboriculturalist in accordance with BS5837:2012
  level: must
- item: Positions of all trees of 75 mm stem diameter (at 1.5 m) within the site and adjoining or overhanging
    its boundaries
  level: must
- item: Species, height, diameter, Root Protection Area and canopy spread of each tree; age, class, condition
    and life expectancy
  level: must
- item: Height and direction of the first significant branch and of the canopy
  level: must
- item: A constraints plan showing RPAs and features such as utility routes and hardstanding
  level: must
- item: All shrub masses and hedges, and other relevant features (banks, slopes, walls, fences, water
    features)
  level: must
- item: Existing and proposed levels
  level: must
- item: Trees categorised A-C or U under Table 1 of BS5837:2012 and colour coded
  level: must
- item: 'Where trees are affected: an Arboricultural Impact Assessment with trees to be retained (continuous
    outline), removed (dashed outline) and pruned, areas of structural landscaping to protect, evaluation
    of losses and a draft tree protection plan'
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Trees are affected by the development.
- item: An Arboricultural Method Statement for any operations within the RPA, where necessary
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 90-91. Section 4.28 'Tree Survey (including
  Tree Protection Plan) and Method Statement'. 'Always' in the works to trees table (page 39); listed
  for householder, all development and change of use where trees could be affected.
review-status: unverified
field-status: {}
