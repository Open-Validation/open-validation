reference: design-and-access-statement
local-authority: STE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - advertising
    - site:
        in:
        - conservation-area
        description: Development located in a Conservation Area.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
source-text: All applications involving residential development of 10 or more residential units (or site
  area of 0.5 or more hectares). All applications involving non-residential development of 1,000sqm or
  more additional floorspace (or site area of 1 or more hectares). All development located in a Conservation
  Area. All applications for Listed Building Consent.
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development, and how it informed the design
  level: must
- item: The applicant's approach to access, and how relevant Local Plan policies have been taken into
    account
  level: must
- item: Any consultation on access issues, and how it informed the design
  level: must
- item: Design solutions, based on analysis of the context and local crime issues, that reduce the development's
    vulnerability to crime
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 53. Section 3.11. The tables also list
  it for householder and advertisement consent applications in a Conservation Area or alongside listed
  building consent. Scope proportionate to the development.
review-status: unverified
field-status: {}
