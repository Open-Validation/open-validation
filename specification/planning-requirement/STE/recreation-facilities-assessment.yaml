reference: recreation-facilities-assessment
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - any:
    - site:
        in:
        - open-space
        description: Within or incorporating existing open space, allocated green space, sports and recreational
          buildings and land, playing fields or formal play spaces.
    - condition:
        field: loss-of-open-space
        value: true
        description: Results in the loss of open space.
    - discretionary
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
policy: Stoke-on-Trent Green Space Strategy (2018 and 2021 update)
source-text: All development within, incorporating, or resulting in the loss of, any existing area of
  open space and/or allocated green space, sports and recreational buildings and land, including playing
  fields and formal play spaces. All development where there is additional demand for open / green spaces.
must-include:
- item: Reference to the adopted Stoke-on-Trent Green Space Strategy (2018 and 2021 update)
  level: must
- item: 'Loss of open space: a map of the typology and area to be lost; quantitative analysis at several
    levels (city, sub-area, ward, output area); accessibility analysis of alternative provision; a consultation
    document on how the space is used and the impact of its loss'
  level: must
  required-if:
    any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space.
    - site:
        in:
        - open-space
        description: Existing open space.
- item: 'Creation of open space / new demand: a map of the green space network nearby; assessment of quantity
    and quality of provision and how the extra population affects the standards; accessibility of green
    space of all typologies'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published November 2025), page 76. Section 4.17 'Open Space Assessment'.
  'Additional demand for open / green spaces' is not defined, so it shows as discretionary. Listed in
  the tables for all development and change of use.
review-status: unverified
field-status: {}
