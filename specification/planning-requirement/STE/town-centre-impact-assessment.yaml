reference: town-centre-impact-assessment
local-authority: STE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses not in an existing centre or in accordance with an up-to-date
        development plan.
source-url: https://www.stoke.gov.uk/download/downloads/id/2872/planning_validation_list_-_printable_version.pdf
policy: National Planning Policy Framework, section 7
source-text: Sequential Test required for all applications for main town centre uses development which
  are not in an existing centre or in accordance with an up-to-date development plan. Impact Assessment
  required for all applications for main town centre uses development not in an existing centre or in
  accordance with an up-to-date development plan, with a gross floorspace of over 2,500 sqm.
must-include:
- item: A Sequential Test
  level: must
- item: An Impact Assessment on the vitality and viability of defined town centres
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Gross floorspace over 2,500 sq m.
- item: Undertaken in line with section 7 of the NPPF
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 86. Section 4.24 'Town Centre Uses Sequential
  Test and Impact Assessment'. Listed in the non-residential and change of use tables.
review-status: unverified
field-status: {}
