reference: waste-management-plan
local-authority: COV
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, including change of use to residential.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial development.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy EM8 of the Coventry Local Plan 2017
source-text: All applications for residential or commercial development (including changes of use) that
  will have an impact on the generation of waste
must-include:
- item: The location of bin storage
  level: must
- item: The size of bins
  level: must
- item: The design and materials of any proposed bin enclosure
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 18, 36 (item 5.4, 7.19). Called a 'Site Waste
  Management Plan'. Residential development (item 5.4); commercial development only in the major list
  (item 7.19).
review-status: unverified
field-status: {}
