reference: travel-plan
local-authority: COV
required-if:
  any:
  - ref: major-development
  - condition:
      field: convenience-retail-floorspace
      operator: '>='
      value: 250
      description: A1 food retail of 250 sq m or more.
  - condition:
      field: comparison-retail-floorspace
      operator: '>'
      value: 800
      description: A1 non-food retail over 800 sq m.
  - all:
    - condition:
        field: use-class
        value: restaurant-cafe
        description: Restaurants and cafes (former A3).
    - condition:
        field: floorspace
        operator: '>'
        value: 300
        description: Floorspace > 300 sq m.
  - all:
    - condition:
        field: use-class
        value: drinking-establishment
        description: Drinking establishments (former A4).
    - condition:
        field: floorspace
        operator: '>='
        value: 300
        description: Floorspace >= 300 sq m.
  - all:
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Hot food takeaways (former A5).
    - condition:
        field: floorspace
        operator: '>='
        value: 250
        description: Floorspace >= 250 sq m.
  - all:
    - condition:
        field: use-class
        value: non-residential-institution
        description: Non-residential institutions (former D1).
    - condition:
        field: floorspace
        operator: '>'
        value: 500
        description: Floorspace > 500 sq m.
  - all:
    - condition:
        field: use-class
        value: assembly-and-leisure
        description: Assembly and leisure (former D2).
    - condition:
        field: floorspace
        operator: '>'
        value: 500
        description: Floorspace > 500 sq m.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy AC3 of the Coventry Local Plan 2017; Coventry Connected SPD
source-text: 'A Travel Plan Statement is required for: A1 food retail up between 250-800 sq.m; A1 Non-food
  retail over 800 sq.m; A3 over 300 sq.m; A4 between 300-600 sq.m; A5 250-500 sq.m; D1 over 500 sq.m;
  D2 over 500 sq.m A Travel Plan is required for: A1 food retail over 800 sq.m; A4 over 600 sq.m; A5 over
  500 sq.m. Full threshold criteria are set out in the Coventry Connected SPD … A Travel Plan should be
  provided for all major development proposals'
must-include:
- item: 'A Travel Plan Statement: positive measures for promoting sustainable transport, with an action
    plan for their implementation (no specific targets needed)'
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 26, 38 (item 6.10, 7.22). A Travel Plan Statement
  for A1 food retail 250-800 sq m, A1 non-food over 800, A3 over 300, A4 300-600, A5 250-500, D1 and D2
  over 500; a full Travel Plan above those bands and for major development (a Statement may be accepted
  for some A and D uses). The list still uses the pre-2020 use classes; full thresholds are in the Coventry
  Connected SPD.
review-status: unverified
field-status: {}
