reference: viability-assessment
local-authority: COV
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Not all contributions can be paid.
    - condition:
        field: employment-site-non-employment-use
        value: true
        description: Redevelopment of an employment site for non-employment purposes.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy JE3 of the Coventry Local Plan 2017
source-text: 'Any proposals where there is a viability case: applications where not all contributions
  can be paid; applications for the redevelopment of employment sites for non- employment purposes'
must-include:
- item: Prepared on the basis that it will be made publicly available, other than in exceptional circumstances
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 42 (item 7.32). In the major list under 'This
  information may also be required'.
review-status: unverified
field-status: {}
