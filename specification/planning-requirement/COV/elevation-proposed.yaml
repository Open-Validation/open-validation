reference: elevation-proposed
local-authority: COV
required-if:
  any:
  - any:
    - all:
      - application-type:
          in:
          - hh
          - full
          - outline
          - reserved-matters
      - any:
        - condition:
            field: building-works
            value: true
            description: Built development.
        - condition:
            field: involves-change-of-use
            value: true
            description: A change of use.
      - condition:
          field: external-alterations
          value: true
          description: External alterations are proposed.
    - application-type:
        in:
        - advertising
    - application-type:
        in:
        - pa-ecomms-network
    - all:
      - application-type:
          in:
          - ldc
      - discretionary
    - all:
      - application-type:
          in:
          - s73
      - discretionary
  - application-type:
      in:
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-dwh
      - pa-demo-replace-dwh
      - pa-flats-terr-comm
      - pa-flats-de-dwh
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Article 7 of the Town and Country Planning (General Development Procedure) Order (England) 2015;
  Policy DE1 of the Coventry Local Plan 2017
source-text: All Planning applications for built development or change of use where external alterations
  are proposed; All advertisement consent applications; Applications for existing/proposed certificate
  of lawful development (where relevant)
must-include:
- item: Drawn to scale (1:50 or 1:100) with title, drawing number and scale bar
  level: must
- item: Clearly show the proposed works in relation to what is already there
  level: should
- item: The relationship to neighbouring buildings and any structures to be demolished
  level: should
- item: 'For external wall insulation: a photo-montage or detailed scale drawing showing the proposed
    cladding, including details of any dentil course, headers, cills etc'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: external-wall-insulation
        value: true
        description: External wall insulation (cladding) to a house.
- item: 'For external wall insulation: details of the cladding finish'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: external-wall-insulation
        value: true
        description: External wall insulation (cladding) to a house.
- item: 'For prior approval of new or enlarged dwellings: drawn to an identified scale showing the direction
    North, with existing and proposed elevations and the position, dimensions and locations of the proposed
    windows'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-dwh
      - pa-demo-replace-dwh
      - pa-flats-terr-comm
      - pa-flats-de-dwh
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 6, 8, 47-56 (item 2.3, 3.2, 8.12-8.18).
  Lawful development certificates need them only ''where relevant'': discretionary. Section 2 plans also
  apply to telecommunications applications (item 8.11, ''Section 2.1 – 2.3'') and, ''Where necessary'',
  to section 73 applications (item 8.10): shown as discretionary for s73.'
review-status: unverified
field-status: {}
