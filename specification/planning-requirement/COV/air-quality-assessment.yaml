reference: air-quality-assessment
local-authority: COV
required-if:
  any:
  - ref: major-development
  - condition:
      field: eia-development
      value: true
      description: The development requires an EIA.
  - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy EM7 of the Coventry Local Plan 2017
source-text: All applications where there may be relevant exposure to pollutant concentrations above statutory
  limits (EU or UK) All major development proposals Where the development meets DfT threshold criteria
  for Transport Assessment https://content.tfl.gov.uk/thresholds-for-transport-assessments.pdf Where development
  requires an EIA.
must-include:
- item: The existing background levels of air quality
  level: must
- item: The cumulative background levels of air quality (cumulative impact of development in the area)
  level: must
- item: The feasibility of mitigation measures that would prevent the national air quality objectives
    being exceeded or reduce air quality deterioration
  level: must
- item: Reduction/mitigation measures set out in full
  level: must
  required-if:
    any:
    - site:
        in:
        - air-quality-management-area
        description: An area of existing poor air quality.
    - discretionary
  source-text: Where increased building and/or transport emissions are likely or where the development
    is located in an area of existing poor air quality
- item: Methodology agreed with the council's Environmental Protection team
  level: should
confidence: medium
notes: From the council's list (updated 17 March 2025), page 16, 23, 30 (item 5.1, 6.1, 7.2). Major development
  and EIA development are clear triggers (item 7.2). 'Relevant exposure to pollutant concentrations above
  statutory limits' and meeting the DfT threshold criteria for a Transport Assessment (items 5.1, 6.1)
  are judged case by case, so they show as discretionary.
review-status: unverified
field-status: {}
