reference: floor-plan-proposed
local-authority: COV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: building-works
          value: true
          description: Built development.
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
  - application-type:
      in:
      - pa-flats-de-blocks
      - pa-demo-replace-dwh
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Article 7 of the Town and Country Planning (General Development Procedure) Order (England) 2015;
  Policy DE1 of the Coventry Local Plan 2017
source-text: All planning applications for built development or change of use; applications for existing/proposed
  certificate of lawful development (where relevant)
must-include:
- item: Drawn to scale (1:50 or 1:100) with title, drawing number and scale bar
  level: must
- item: Clearly show the proposed works in relation to what is already there
  level: should
- item: The relationship to neighbouring buildings and any structures to be demolished
  level: should
- item: 'For new dwellings on a detached block of flats (Class A): drawn to an identified scale showing
    the direction North, indicating the dimensions and proposed use of each room and the position and
    dimension of windows, doors and walls'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
- item: 'For demolition and rebuild (Class ZA): the position and dimensions of all windows, doors and
    walls, and the dimensions and use of all habitable and other rooms in each dwellinghouse (rooms labelled)'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-replace-dwh
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 6, 49, 53 (item 2.2, 8.13, 8.16). Lawful
  development certificates need them only ''where relevant'': discretionary. Section 2 plans also apply
  to telecommunications applications (item 8.11, ''Section 2.1 – 2.3'') and, ''Where necessary'', to section
  73 applications (item 8.10): shown as discretionary for s73.'
review-status: unverified
field-status: {}
