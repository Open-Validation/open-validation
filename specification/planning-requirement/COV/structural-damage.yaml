reference: structural-damage
local-authority: COV
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - any:
    - condition:
        field: subsidence-alleged
        value: true
        description: The tree is allegedly damaging property.
    - condition:
        field: structural-damage-alleged
        value: true
        description: The tree is allegedly damaging property.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy GE3 & GE4 of the Coventry Local Plan 2017
source-text: If the tree is allegedly damaging property, 8.5additional reports are required providing
  evidence of; 12 month period of level/crack monitoring read at 2 monthly intervals, structural engineer's
  report identifying foundation depths, soil type, Arboriculturist’s report, drain survey.
must-include:
- item: Structural engineer's report identifying foundation depths and soil type
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 44 (item 8.4). The structural engineer's
  report is one of the reports the list asks for when a TPO tree is allegedly damaging property (see subsidence-report).
review-status: unverified
field-status: {}
