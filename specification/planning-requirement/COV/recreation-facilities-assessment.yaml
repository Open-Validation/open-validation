reference: recreation-facilities-assessment
local-authority: COV
required-if:
  all:
  - ref: major-development
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of green space of value for amenity, recreation, outdoor sports and/or community
        use.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy GE2 of the Coventry Local Plan 2017
source-text: Development proposals that involve the loss of green space that is of value for amenity,
  recreational, outdoor sports and/or community use
must-include:
- item: Evidence that there is no longer a demand or prospect of demand for the recreational use, or that
    no deficiency would be created by its loss
  level: must
- item: Plans identifying any areas of existing or proposed green space to be lost
  level: must
- item: Full details of the existing playing fields and facilities to be lost, the reason for the location
    of the development and any proposed changes in sports provision
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Playing fields would be lost.
confidence: medium
notes: From the council's list (updated 17 March 2025), page 34 (item 7.10). Called a 'Green space/ playing
  fields assessment'; in the major development list.
review-status: unverified
field-status: {}
