reference: heritage-statement
local-authority: COV
required-if:
  any:
  - site:
      in:
      - listed-building
      - conservation-area
      description: Affects a listed building or is in a Conservation Area.
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - pa-demo-replace-dwh
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy HE2 of the Coventry Local Plan 2017
source-text: Applications affecting a listed building or in a Conservation Area; listed building consent
  applications
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting,
    proportionate to the importance of the asset
  level: must
- item: Details of the history and development of the asset
  level: must
- item: A photographic record showing the site context and the spaces and features which may be affected
  level: must
- item: An assessment of the archaeological, architectural, historical or other significance of the asset
  level: must
- item: An assessment of the impact of the proposed works on the significance of the asset
  level: must
- item: A statement of justification for the works, with details of any mitigation measures proposed
  level: must
- item: 'For demolition and rebuild prior approval (Class ZA): a written statement on heritage and archaeological
    considerations'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-replace-dwh
confidence: medium
notes: From the council's list (updated 17 March 2025), page 10, 13, 53 (item 3.5, 3.6, 4.2, 8.16). Householder
  applications in a conservation area or with listed building consent need it too (items 3.5-3.6).
review-status: unverified
field-status: {}
