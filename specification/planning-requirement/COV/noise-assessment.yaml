reference: noise-assessment
local-authority: COV
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The application raises issues of disturbance.
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise sensitive development, such as residential close to roads or commercial premises.
    - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Includes residential accommodation.
    - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy H5 and Policy DE1 of the Coventry Local Plan 2017
source-text: Residential schemes in close proximity to noise sources (such as roads, commercial premises)
  … Planning applications that raise issues of disturbance, or are considered to be noise sensitive developments
must-include:
- item: Identify and quantify the potential sources of noise and their effect on local amenity
  level: must
- item: How adverse issues will be mitigated so that internal and external noise levels meet national
    guidance criteria
  level: must
- item: Details of any mitigation measures required
  level: must
- item: Prepared by a qualified acoustician
  level: must
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 22, 29, 41, 45 (item 5.10, 6.14, 7.27,
  8.8). How close is ''close proximity'', and whether a scheme is ''considered'' noise sensitive, are
  the council''s judgement: discretionary. Prior notifications that include residential accommodation
  need a noise survey ''where appropriate'' (item 8.8). The major list (item 7.27) asks only for the sources
  and mitigation.'
review-status: unverified
field-status: {}
