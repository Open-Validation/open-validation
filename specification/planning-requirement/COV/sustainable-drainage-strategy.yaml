reference: sustainable-drainage-strategy
local-authority: COV
required-if:
  ref: major-development
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policies DS3, EM1, EM2 and EM4 of the Coventry Local Plan 2017
source-text: All applications for major development
must-include:
- item: How the hierarchy for the discharge of surface water from the site will be applied
  level: must
- item: Where infiltration is unsuitable, how QBar greenfield run-off rates minus 20% or 5l/s (whichever
    is greater) will be achieved
  level: must
- item: Evidence of a SuDS 'treatment train' treating the water before infiltration or discharge
  level: must
- item: Open-air SuDS features with a multifunctional purpose, including amenity and biodiversity benefits
  level: must
- item: A maintenance plan for the lifetime of the development
  level: must
- item: Management of overland flow routes in the event of exceedance or blockage
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 36 (item 7.20). Part of the 'Sustainable
  Buildings Statement' for major development.
review-status: unverified
field-status: {}
