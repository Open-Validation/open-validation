reference: schedule-of-works
local-authority: COV
required-if:
  all:
  - application-type:
      in:
      - lbc
  - any:
    - condition:
        field: structural-alteration
        value: true
        description: Structural alterations.
    - condition:
        field: demolition
        value: true
        description: Demolition.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy HE2 of the Coventry Local Plan 2017
source-text: Listed building consent applications where structural alterations or demolition is proposed
must-include:
- item: A schedule of works and a method statement
  level: must
- item: Level 2 recording in accordance with Part 5 (Recording Levels) of Historic England's Understanding
    Historic Buildings, where demolition or alterations result in a loss of historic fabric
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 13 (item 4.3).
