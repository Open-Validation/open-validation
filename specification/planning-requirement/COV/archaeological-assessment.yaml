reference: archaeological-assessment
local-authority: COV
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: The application involves groundworks.
  - site:
      in:
      - archaeological-priority-area
      description: Within an archaeological constraint area shown on the council's online map.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy HE2 of the Coventry Local Plan 2017
source-text: Applications involving groundworks that fall within an archaeological constraint area as
  identified on the online map that may have an impact on archaeological deposits and/or the significance
  of the historic environment
must-include:
- item: A desk based assessment from existing records highlighting the nature, extent and significance
    of the historic environment within the site
  level: must
- item: The impact of the proposed development on the significance of the historic environment
  level: must
confidence: medium
notes: From the council's list (updated 17 March 2025), page 14 (item 4.4). Further geophysics or evaluation
  reports 'may also be required'.
review-status: unverified
field-status: {}
