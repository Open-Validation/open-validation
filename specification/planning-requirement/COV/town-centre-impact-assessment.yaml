reference: town-centre-impact-assessment
local-authority: COV
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside a defined centre.
    - condition:
        field: office-floorspace
        operator: '>='
        value: 2500
        description: Office floor space of 2500 sq m or more.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside a defined centre.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 1000
        description: Retail and other Main Town Centre uses in excess of 1000 sq m.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policies JE4 and R4 of the Coventry Local Plan 2017; NPPF
source-text: Proposals for office development outside a defined centre where the floor space is for 2500
  sq.m or more … Any proposals for retail and other Main Town Centre uses in excess of 1000 sq.m that
  fall outside a defined centre
must-include:
- item: 'For offices: the impact on the vitality and viability of Defined Centres and on existing, committed
    and planned public and private investment in office development within them'
  level: must
  required-if:
    condition:
      field: office-floorspace
      operator: '>='
      value: 2500
      description: Office floor space of 2500 sq m or more.
- item: 'For retail and other town centre uses: prepared in accordance with national guidance, considering
    the impact on the vitality, viability, role and character of defined centres (Policy R3 hierarchy)'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Main town centre uses over 1000 sq m.
confidence: medium
notes: From the council's list (updated 17 March 2025), page 35-36 (item 7.12, 7.17). Combines the office
  'Impact assessment' and the 'Retail Impact Assessment'. The sequential test is listed as unmapped.
review-status: unverified
field-status: {}
