reference: site-plan
local-authority: COV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: building-works
          value: true
          description: Built development.
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - pa-ecomms-network
  - application-type:
      in:
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-dwh
      - pa-demo-replace-dwh
      - pa-flats-terr-comm
      - pa-flats-de-dwh
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Article 7 of the Town and Country Planning (General Development Procedure) Order (England) 2015;
  Policy DE1 of the Coventry Local Plan 2017
source-text: All planning applications for built development or change of use; Applications for advertisement
  consent
must-include:
- item: Drawn to scale (1:200 or 1:500)
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: must
- item: Written dimensions, including those to the boundary
  level: must
- item: Details of any car parking
  level: must
- item: Details of boundary treatment
  level: must
- item: The position of all trees on site and those on adjacent land
  level: must
- item: 'For external wall insulation: which elevations are to be insulated'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: external-wall-insulation
        value: true
        description: External wall insulation (cladding) to a house.
  source-text: Block/Site plan indicating which elevations are to be insulated
- item: 'For a dropped kerb: details of any proposed driveway/hardsurfacing, including drainage details'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-vehicle-access
        value: true
        description: A dropped kerb for vehicular access.
  source-text: Details of any proposed driveway/ hardsurfacing including drainage details
- item: 'For prior approval: a plan drawn to an identified scale, showing the direction of North, indicating
    the site and showing the proposed development'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-dwh
      - pa-demo-replace-dwh
      - pa-flats-terr-comm
      - pa-flats-de-dwh
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 6, 8, 10, 47-56 (item 2.1, 3.2, 3.3, 3.7,
  8.10-8.18). Section 2 plans also apply to telecommunications applications (item 8.11, ''Section 2.1
  – 2.3'') and, ''Where necessary'', to section 73 applications (item 8.10): shown as discretionary for
  s73.'
review-status: unverified
field-status: {}
