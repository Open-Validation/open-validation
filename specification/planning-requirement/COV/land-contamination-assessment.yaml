reference: land-contamination-assessment
local-authority: COV
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Known to be affected by land contamination.
  - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Includes residential accommodation.
    - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy EM6 of the Coventry Local Plan 2017
source-text: Any application where the development is known or suspected to be affected by land contamination
must-include:
- item: Site inspection scope
  level: must
- item: Review of historical land use
  level: must
- item: Review of environmental setting
  level: must
- item: Consultation with relevant regulatory authorities
  level: must
- item: Qualitative environmental risk assessment
  level: must
- item: Review of existing relevant reports
  level: must
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 21, 28, 40, 45 (item 5.9, 6.13, 7.25, 8.8).
  ''Suspected'' contamination is judged case by case: discretionary. Prior notifications that include
  residential accommodation need an assessment of any contamination ''where appropriate'' (item 8.8).'
review-status: unverified
field-status: {}
