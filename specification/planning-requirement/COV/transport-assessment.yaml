reference: transport-assessment
local-authority: COV
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Residential development of 50 dwellings or more.
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: ==
        value: 0
        description: Major development other than residential.
  - all:
    - ref: major-development
    - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy AC3 of the Coventry Local Plan 2017; Coventry Connected SPD
source-text: Residential development up to 49 dwellings may require a Transport Statement; Residential
  development between 50 and 79 dwelling will require a Transport Statement; … All other major development
  will require a Transport Assessment
must-include:
- item: An assessment of the trip generation of the site, covering all movement by people and vehicles
  level: must
- item: Accompanied by a Travel Plan
  level: must
- item: Scope and details agreed with the local highway authority
  level: should
confidence: medium
notes: From the council's list (updated 17 March 2025), page 37 (item 7.21). A Transport Statement for
  50-79 dwellings and a Transport Assessment for other major development; major residential schemes up
  to 49 dwellings 'may require' a Transport Statement (discretionary). Full thresholds are in the Coventry
  Connected SPD.
review-status: unverified
field-status: {}
