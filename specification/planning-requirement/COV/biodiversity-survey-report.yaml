confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 10, 19-20, 23, 27, 31, 47 (item 3.8, 5.6,
  5.7, 6.2, 6.11, 7.3, 7.4, 8.9). A bat scoping survey ''will be required'' for major development involving
  demolition, affecting a roof space or likely to impact bats (item 7.3) and for prior notification of
  demolition (item 8.9). For householder and minor development the applicant completes a bat scoping self-certification
  form, which decides whether a report is needed, so that part is discretionary (the form is listed as
  unmapped). The wider ecological survey and report is for minor schemes ''where the site appears to have
  ecological value'' (may also be required) and major proposals ''where there is potential impact on biodiversity'':
  discretionary.'
