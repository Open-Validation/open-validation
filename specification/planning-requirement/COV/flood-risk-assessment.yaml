reference: flood-risk-assessment
local-authority: COV
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      description: Within flood zone 2 or 3, or a river floodplain in the Coventry SFRA maps.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Less than 1 ha in flood zone 1 with a change of use to a more vulnerable class.
    - discretionary
  - condition:
      field: near-watercourse
      value: true
      description: Within 20 metres of any watercourse.
  - condition:
      field: near-flood-defence
      value: true
      description: Adjacent to, or including, any flood bank or other flood control structure.
  - all:
    - ref: major-development
    - any:
      - site:
          in:
          - surface-water-flood-risk
          description: An area with surface water issues and drainage problems.
      - discretionary
  - all:
    - application-type:
        in:
        - pa-flats-de-blocks
        - pa-demo-replace-dwh
    - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policies EM4, EM5 and EM6 of the Coventry Local Plan 2017
source-text: 'All major development; and Any development falling into the following categories: within
  flood zone 2 or 3; more than 1 hectare (ha) in flood zone 1; less than 1 ha in flood zone 1, which includes
  a change of use in development type to a more vulnerable class, where they could be affected by flooding
  from any other source or ; … within a river floodplain, as defined by the Coventry SFRA indicative flood
  zone maps; within 20 metres of any watercourse; Adjacent to, or including, any flood bank or other flood
  control structure; Within an area where there may be surface water issues and drainage problems.'
must-include:
- item: Appropriate to the scale and nature of the development, assessing flood risk from all sources
  level: must
- item: Flood risk mapping
  level: should
- item: Existing drainage infrastructure / features
  level: should
- item: Site history, including flooding events
  level: should
- item: Topographical survey
  level: should
- item: Drainage area plans and greenfield runoff rate calculations
  level: should
- item: Surface water drainage strategy including hydraulic calculations
  level: should
- item: Site ground conditions
  level: should
- item: Opportunities to reduce the probability and consequences of flooding, including surface water
    management with Sustainable Drainage (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: Details of sequential testing, exception testing and hydraulic modelling
  level: must
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 16, 24, 33, 49, 53 (item 5.2, 6.4, 7.8,
  8.13, 8.16). The ''should'' items are what ''A typical FRA will include''. Less than 1 ha in flood zone
  1 with a change to a more vulnerable use needs one only ''where they could be affected by flooding from
  any other source'', and surface water issue areas are not mapped: both discretionary. Prior approvals
  for new dwellings on blocks of flats (Class A) and demolition and rebuild (Class ZA) need a site-specific
  FRA ''where Environment Agency are required to be consulted'' (discretionary).'
review-status: unverified
field-status: {}
