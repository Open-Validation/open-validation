reference: fire-statement
local-authority: COV
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings (multi-occupied residential building).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (national requirement)
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys.
confidence: medium
notes: From the council's list (updated 17 March 2025), page 4 (item 1.7). Shown with the national rule
  (two or more dwellings or educational accommodation, and 18 m or 7 storeys).
review-status: unverified
