reference: design-and-access-statement
local-authority: COV
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a designated area (Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Article 9 of the Town and Country Planning (General Development Procedure) Order (England) 2015
source-text: 'A design and access statement (DAS) is required for: applications for major development;
  applications for development in a … designated area (Conservation Area) where the proposed development
  consists of: one or more dwellings; or - a building or buildings with a floor space of 100 square meters
  or more; applications for listed building consent.'
confidence: medium
notes: From the council's list (updated 17 March 2025), page 3 (item 1.5). The contents described are
  the national ones, so no local must-include is listed.
review-status: unverified
field-status: {}
