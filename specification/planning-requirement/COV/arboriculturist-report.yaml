reference: arboriculturist-report
local-authority: COV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: A householder application affecting trees.
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwellings, including change of use to residential.
      - ref: major-development
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site.
    - any:
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: Trees protected by a Tree Preservation Order or Conservation Area legislation.
      - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Policy GE3, GE4 & HE2 of the Coventry Local Plan 2017; BS 5837:2012
source-text: Householder application affecting trees … Any development where there are significant or
  protected trees within or adjacent to the site.
must-include:
- item: A plan showing the location of all trees on site and within 8m of the proposed work, or 15m where
    those trees are within an Ancient Woodland
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: A list of trees to be removed and a schedule of any pruning to retained trees
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Where trees are protected by a TPO or Conservation Area legislation: a report in full accordance
    with BS5837 including an Arboricultural Impact Assessment, Arboricultural Method Statement and Tree
    Protection Plan'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Trees protected by a Tree Preservation Order or Conservation Area legislation.
- item: Prepared by a qualified arboriculturist
  level: must
- item: 'For outline applications: a Tree Survey and a Tree Constraints Plan / tree removal and retention
    plan'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'For full applications, in accordance with BS5837: a Tree Survey of all on-site and off-site trees
    (including hedges) whose Root Protection Areas fall within the site'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For full applications: a Tree Constraints Plan showing the RPA radius, existing and estimated
    ultimate canopy spread and height and a shading segment for each tree, superimposed on the proposed
    block plan'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For full applications: an Arboricultural Impact Assessment (services, level changes within RPAs,
    new hard surfaces, crane jib arcs, CCTV splays, storage areas, etc.)'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For full applications: an Arboricultural Method Statement for construction or level changes within
    any RPA or close to crowns'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For full applications: a schedule of works for retained trees (e.g. access facilitation pruning)'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'For full applications: a dimensioned Tree Protection Plan showing distances from trunk centres
    to the protection barrier, with tree protection posters at 10m centres'
  level: must
  required-if:
    application-type:
      in:
      - full
confidence: medium
notes: From the council's list (updated 17 March 2025), page 10-12, 18, 38 (item 3.9, 5.5, 7.23). Item
  3.9 (householder) sits under 'This information may also be required'. Items 5.5 and 7.23 apply to minor
  residential and major development; whether unprotected trees are 'significant' is the council's judgement,
  so that part is discretionary.
review-status: unverified
field-status: {}
