reference: section-existing
local-authority: COV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: change-in-ground-levels
        value: true
        description: Level changes across the site or in relation to neighbouring properties.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Article 7 of the Town and Country Planning (General Development Procedure) Order (England) 2015;
  Policy DE1 of the Coventry Local Plan 2017
source-text: Planning applications where there are level changes across the site or in relation to neighbouring
  properties; Applications for advertisement consent
must-include:
- item: Drawn to scale (1:50 or 1:100) with title, drawing number and scale bar
  level: must
- item: Clearly show the proposed works in relation to what is already there
  level: should
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 7 (item 2.5). Section 2 plans also apply
  to telecommunications applications (item 8.11, ''Section 2.1 – 2.3'') and, ''Where necessary'', to section
  73 applications (item 8.10): shown as discretionary for s73.'
review-status: unverified
field-status: {}
