reference: bng-metric
local-authority: COV
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the biodiversity gain condition (not exempt).
source-url: https://www.coventry.gov.uk/downloads/file/44597/validation-checklist-17-3-25
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015 as modified and amended by Part 4, Regulation 15 of the Biodiversity Gain (Town and Country Planning)
  (Modification and Amendments) (England) Regulations 2024; Policy GE3 of the Coventry Local Plan 2017
source-text: All development proposals that are not exempt from the general biodiversity condition
must-include:
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), including the completed metric calculation tool showing the calculations
  level: must
- item: The publication date and version of the biodiversity metric used, which should be the latest version
    of the DEFRA metric
  level: must
- item: 'Where an earlier date is used: the proposed earlier date and the reasons for proposing it'
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant wishes to use an earlier baseline date.
- item: A statement confirming whether the onsite biodiversity value is lower because of activities ('degradation')
    and, if so, supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
confidence: medium
notes: 'From the council''s list (updated 17 March 2025), page 5, 20, 27, 31 (item 1.8, 5.8, 6.12, 7.5).
  Shown for applications subject to the biodiversity gain condition: the list says ''All applications
  (unless exemption applies)'', and householder and other exempt applications are exempt by law. Items
  5.8 and 6.12 repeat it for ''Schemes that will impact on over 25 square metres or 5 linear metres of
  existing habitat'' (the de minimis exemption) and item 7.5 for all major development. The statement
  whether the condition applies is listed as unmapped.'
review-status: unverified
field-status: {}
