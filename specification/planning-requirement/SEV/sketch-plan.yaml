      in:
      - consent-under-tpo
  - all:
    - application-type:
        in:
        - notice-trees-in-con-area
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4898/10_application_for_tree_works_validation_checklist
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: Sketch Plan Showing boundaries, adjoining properties and names of roads Position of trees
  in relation to buildings and species if known Numbering of trees must match the identification schedule
must-include:
- item: Boundaries, adjoining properties and names of roads
  level: must
- item: Position of the trees in relation to buildings, and species if known
  level: must
- item: Numbering of the trees matches the identification schedule
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 1 of the tree works checklist. A national
  requirement for works to TPO trees. For notifications of works to trees in a conservation area it is
  under 'Additional information that may be helpful' ('not mandatory', page 2), so it shows as discretionary
  there. Mapped to MHCLG's retired id sketch-plan, as other councils do.
