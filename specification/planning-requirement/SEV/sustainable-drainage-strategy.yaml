reference: sustainable-drainage-strategy
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: non-mains-drainage
          value: true
          description: Non-mains drainage is proposed.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: non-mains-drainage
        value: true
        description: Non-mains drainage is proposed.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: 'Required for major developments. Or where non-mains drainage is proposed a statement to
  confirm the following is required: Location, details and impact of system, Management of the system,
  Confirmation that the General Binding Rules are adhered to.'
must-include:
- item: Location, details and impact of the system
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Non-mains drainage is proposed.
- item: Management of the system
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Non-mains drainage is proposed.
- item: Confirmation that the General Binding Rules are adhered to
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Non-mains drainage is proposed.
confidence: medium
notes: 'From the council''s list (published October 2026), page 5 of the planning permission checklist.
  Also in householder page 4, reserved matters page 5, outline and hybrid page 6. Called a ''Drainage
  assessment''. The householder checklist asks for it only ''When non-mains drainage is proposed''. The
  outline and hybrid checklist (page 10) also lists a ''Drainage Strategy'' under additional information:
  ''Where non-mains drainage is proposed the General Binding rules for a septic tank or small sewage treatment
  plant must be met.'' The variation of condition checklist (page 5) has it listed under ''Additional
  information that may be required for the application, subject to site constraints'', which the council
  says ''might not be requested to make the application valid'', so it shows as discretionary there. Mapped
  to MHCLG''s retired id sustainable-drainage-strategy, as other councils do.'
review-status: unverified
field-status: {}
