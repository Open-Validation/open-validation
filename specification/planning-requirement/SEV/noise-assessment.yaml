reference: noise-assessment
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: noise-sensitive-use
          value: true
          description: Residential development close to commercial or industrial uses, or dwellings next
            to main roads, motorways, A roads or a railway.
      - condition:
          field: plant-equipment
          value: true
          description: Air source heat pumps, air conditioning or other heat exchanger/condenser technology.
      - condition:
          field: noise-generating-use
          value: true
          description: New commercial or industrial uses in residential areas, or new commercial development
            that generates noise.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Residential development close to commercial or industrial uses, or dwellings next
            to main roads, motorways, A roads or a railway.
      - condition:
          field: plant-equipment
          value: true
          description: Air source heat pumps, air conditioning or other heat exchanger/condenser technology.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: 'Noise assessment requirements will vary per type of proposal, for example: Proposals for
  residential development located in close proximity to commercial or industrial uses ... Residential
  dwellings sited adjacent to Main roads / Motorways / A Roads / Railway ... Where air source heat pumps,
  air conditioning or other heat exchanger/condenser technology are proposed, a noise assessment to include
  evaluation to the latest version of British Standards 4142:2014 will be required. Proposals for new
  commercial/industrial uses located within residential areas ... New commercial development with associated
  noise generation ... Note – required for all major development.'
must-include:
- item: Refers to BS4142:2014+A1:2019, BS8233:2014, WHO guidance and CIEH/IOA/ANC guidance
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Residential development close to commercial or industrial uses.
  source-text: Proposals for residential development located in close proximity to commercial or industrial
    uses – The assessment would need to include reference to BS4142:2014+A1:2019, BS8233:2014, WHO guidance
    and CIEH/IOA/ANC guidance.
- item: Refers to BS8233:2014
  level: should
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Dwellings next to main roads, motorways, A roads or a railway.
  source-text: Residential dwellings sited adjacent to Main roads / Motorways / A Roads / Railway – The
    assessment should include reference to BS8233:2014
- item: Evaluation to the latest version of BS4142:2014
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Air source heat pumps, air conditioning or other heat exchanger/condenser technology.
- item: Full evaluation to BS4142:2014+A1:2019
  level: must
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: New commercial or industrial uses within residential areas.
  source-text: Proposals for new commercial/industrial uses located within residential areas – Any assessment
    must include a full evaluation to BS4142:2014+A1:2019
- item: Regard to the impact of vehicle movements, plant and equipment used in any process or site activity,
    and air-conditioning plant
  level: should
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: New commercial development with associated noise generation.
  source-text: New commercial development with associated noise generation – the assessment should have
    regard to the potential impact of the commercial development from vehicle movements, plant and equipment
    used as part of any process or site activity and air-conditioning plant serving offices etc.
- item: Carried out by a suitably qualified acoustic consultant
  level: should
confidence: medium
notes: From the council's list (published October 2026), page 6-7 of the planning permission checklist.
  Also in householder page 5, reserved matters page 6-7, outline and hybrid page 7. The cases are given
  'for example', so other cases show as the council's discretion. The householder checklist lists only
  the first three cases. The variation of condition checklist has it listed under 'Additional information
  that may be required for the application, subject to site constraints', which the council says 'might
  not be requested to make the application valid', so it shows as discretionary there.
review-status: unverified
field-status: {}
