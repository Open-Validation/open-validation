reference: arboriculturist-report
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: 'Trees likely to be affected: TPO trees, trees in a Conservation Area or other
            trees within or next to the site, or works within the root protection area or falling distance
            of retained trees.'
      - site:
          in:
          - ancient-woodland
          description: Trees within Ancient Woodland or its 15m buffer zone.
      - condition:
          field: veteran-trees
          value: true
          description: Ancient or veteran trees.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: A BS5837:2012 compliant Arboricultural Assessment is required where development proposals
  are likely to affect trees protected by a Tree Preservation Order (TPO), trees within a Conservation
  Area, trees within Ancient Woodland including its 15m buffer zone, Ancient or Veteran Trees or other
  trees that may be affected by development. 'Likely to affect' includes where trees are located within
  or adjacent to the development site, or where excavations, foundations, service runs, changes in level,
  access works or other construction activities are proposed within the Root Protection Area (RPA) or
  falling distance of retained trees.
must-include:
- item: Compliant with BS5837:2012
  level: must
- item: Details of any necessary tree protection measures
  level: should
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - s73
  source-text: The assessment should include details of any necessary tree protection measures.
- item: Details of any necessary tree protection measures
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: Details of any necessary tree protection measures are also required within the report.
- item: Carried out by a suitably qualified consultant
  level: should
confidence: medium
notes: From the council's list (published October 2026), page 4 of the planning permission checklist.
  Also in householder page 3, reserved matters pages 4-5, outline and hybrid page 5. The reserved matters
  checklist words it as trees 'covered by a TPO or located within a Conservation Area', veteran trees
  or within 15m of Ancient Woodland. The variation of condition checklist has it listed under 'Additional
  information that may be required for the application, subject to site constraints', which the council
  says 'might not be requested to make the application valid', so it shows as discretionary there. A separate
  Ancient Woodland and Ancient/Veteran Trees assessment is in the unmapped list.
review-status: unverified
field-status: {}
