reference: arboriculturist-report
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees on or next to the site.
  - any:
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        - ancient-woodland
        description: The trees are protected by a Tree Preservation Order or are in a Conservation Area,
          or the site is in Ancient Woodland or its 15m buffer.
    - condition:
        field: veteran-trees
        value: true
        description: There are ancient or veteran trees on or next to the site.
source-url: https://www.sevenoaks.gov.uk/downloads/download/1057/planning_validation_checklists
must-include:
- item: Assessment to BS5837
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): Arboricultural Assessment (BS5837) where trees are protected
  by a TPO, in a Conservation Area, in Ancient Woodland including its 15m buffer, or are Ancient/Veteran
  trees (householder checklist). The Planning Permission checklist also lists an Arboricultural Assessment;
  the audit gives no separate trigger for it.'
review-status: unverified
field-status: {}
