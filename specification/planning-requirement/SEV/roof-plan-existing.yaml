reference: roof-plan-existing
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - s73
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: A roof is altered and the change can't be adequately shown on the elevations (for
          example chimney positions, rooflights, dormers or solar panels).
  - application-type:
      in:
      - outline-some
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Where any roof is being altered and the change cannot be adequately shown on the elevation
  plans, such as chimney positions, roof lights, dormers, and solar panels.
must-include:
- item: Scale of 1:50 or 1:100, with a matching scale bar
  level: must
confidence: medium
notes: 'From the council''s list (published October 2026), page 2 of the planning permission checklist.
  Also in householder page 2, variation of condition page 3, listed building page 3, reserved matters
  page 3, outline and hybrid pages 4 and 9. Outline: only where appearance is not reserved. For a proposed
  lawful development certificate it is ''Additional information'' (''may be helpful''), so shown as discretionary.'
review-status: unverified
field-status: {}
