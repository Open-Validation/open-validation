reference: planning-statement
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - advertising
  - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Statement to outline history, constraints, policy, justification and proposals for example.
must-include:
- item: Heads of Terms for the S106 Legal Agreement (in this statement or the Design and Access Statement)
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more residential units.
      - all:
        - site:
            in:
            - designated-rural-area
            description: In a Designated Rural Area.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 6
            description: 6 or more residential units in a Designated Rural Area.
  source-text: Planning Statement/Design and Access Statement should include Heads of Teams for the S106
    Legal Agreement.
confidence: medium
notes: From the council's list (published October 2026), page 8 of the planning permission checklist.
  Also in reserved matters page 8, outline and hybrid page 10, advertisement page 2 ('Other documents').
  It is listed under 'Additional information that may be required for the application, subject to site
  constraints', which the council says 'might not be requested to make the application valid', so it shows
  as discretionary. The Heads of Terms item comes from the Planning Obligations section (planning permission
  page 7, outline page 8, variation of condition page 3).
review-status: unverified
field-status: {}
