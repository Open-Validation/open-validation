reference: biodiversity-survey-report
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - ancient-woodland
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: The site is, or is next to, Ancient Woodland, an SSSI or a Local Wildlife Site.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: 'Preliminary Ecology Appraisal (PEA) and any further surveys where the PEA (or subsequent
  surveys/reports) recommends. Required when the application site is or adjacent to the following (but
  not limited to): Designated areas including - Ancient Woodland, SSSI, Local Wildlife Site. Meadows,
  grassland, mature trees/woodland and ponds. Conversion, demolition, replacement, or roof alterations
  to rural buildings; outbuildings; agricultural buildings; farmhouses, older dwellings etc. Where buildings
  have an ecological potential i.e. derelict, run down, or missing roof tiles.'
must-include:
- item: A Preliminary Ecology Appraisal (PEA), plus any further surveys the PEA (or later surveys or reports)
    recommends
  level: must
- item: Internal and external photographs of the building(s), covering all sides, to show whether they
    have ecological potential
  level: must
  required-if: discretionary
  source-text: To assist in assessing whether the building(s) have ecological potential, internal and
    external photos (covering all sides) of the building will be required.
- item: Carried out by a suitably qualified ecologist
  level: should
confidence: medium
notes: From the council's list (published October 2026), page 5-6 of the planning permission checklist.
  Also in householder page 4, reserved matters page 5, outline and hybrid page 6. Meadows, grassland,
  mature trees, woodland, ponds and rural or older buildings with ecological potential are shown as the
  council's discretion (the list is 'not limited to' these and there are no map fields for them); the
  photographs apply to those buildings. The variation of condition checklist has it listed under 'Additional
  information that may be required for the application, subject to site constraints', which the council
  says 'might not be requested to make the application valid', so it shows as discretionary there.
review-status: unverified
field-status: {}
