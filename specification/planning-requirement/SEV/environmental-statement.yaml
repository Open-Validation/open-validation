reference: environmental-statement
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: eia-development
        value: true
        description: EIA development under the EIA Regulations 2017.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Environmental Impact Assessment (EIA) is required in circumstances set out in the Town and
  Country Planning (Environmental Impact Assessment) Regulations 2017.
must-include:
- item: The information set out in Schedule 4 of the EIA Regulations
  level: should
confidence: medium
notes: From the council's list (published October 2026), page 4 of the planning permission checklist.
  Also in reserved matters page 2, outline and hybrid page 3. The variation of condition checklist only
  lists an 'Environmental Impact Statement' under 'Other documents' with no trigger, so it shows as discretionary
  there.
review-status: unverified
field-status: {}
