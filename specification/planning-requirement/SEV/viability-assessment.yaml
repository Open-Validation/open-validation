reference: viability-assessment
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more residential units.
    - all:
      - site:
          in:
          - designated-rural-area
          description: In a Designated Rural Area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 6
          description: 6 or more residential units in a Designated Rural Area.
  - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
policy: Policy SP3; Affordable Housing Supplementary Planning Document
source-text: In instances where affordable housing is not proposed, or where the requirements of policy
  SP3 and/or the Affordable Housing SPD are not met, a Viability Report will be required.
confidence: medium
notes: From the council's list (published October 2026), page 7 of the planning permission checklist.
  Also in outline and hybrid page 8, variation of condition page 3. Listed under Planning Obligations,
  where affordable housing is required for 10 or more residential units, or 6 or more in a Designated
  Rural Area. Whether the scheme falls short of policy SP3 or the SPD is a judgement, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
