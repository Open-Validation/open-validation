reference: flood-risk-assessment
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zone 2 or 3.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Flood Zone 1 site greater than 1 hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Flood Zone 1 site greater than 1 hectare.
      - site:
          in:
          - surface-water-flood-risk
          description: At risk from other sources of flooding, such as surface water.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
policy: National Planning Policy Framework Annex F
source-text: When the application site is located within Flood Zone 2 or 3, or Flood Zone 1 if development
  site is greater than 1 hectare. ... Where development is at risk from other sources of flooding i.e.
  surface water, a site specific FRA will be required, in particular where more vulnerable uses are introduced
  in accordance with Annex F of the NPPF.
confidence: medium
notes: From the council's list (published October 2026), page 6 of the planning permission checklist.
  Also in householder page 4, reserved matters page 6, outline and hybrid page 7. The variation of condition
  checklist has it listed under 'Additional information that may be required for the application, subject
  to site constraints', which the council says 'might not be requested to make the application valid',
  so it shows as discretionary there.
review-status: unverified
field-status: {}
