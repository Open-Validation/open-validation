reference: flood-risk-assessment
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: The site is over 1 hectare (in Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: The site is over 1 hectare (in Flood Zone 1).
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/download/1057/planning_validation_checklists
confidence: medium
notes: 'From the audit (missing_requirement): Flood Zone 2/3, or Flood Zone 1 over 1ha, or at risk from
  other sources of flooding (shown as officer discretion).'
review-status: unverified
field-status: {}
