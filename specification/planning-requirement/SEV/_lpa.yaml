  status: current
submission-standards:
- item: All drawings submitted as PDFs, stating the metric scale used and the paper size
  level: must
- item: No file larger than 50MB
  level: must
- item: Drawings to scale, with a matching metric scale bar for every metric scale used
  level: must
- item: Smaller 'key plans' have a metric scale bar or are marked 'not to scale'
  level: must
- item: Door and window sizes shown correctly, and measurements consistent across floor plans, elevations
    and block plans
  level: must
- item: Features (steps, walls, fences, ramps, air source heat pumps, protruding solar panels, rooflights)
    shown consistently on all relevant floor plans and elevations
  level: must
- item: The red line is the same on every drawing and is solid and continuous (not dashed or dotted),
    with all works inside it
  level: must
- item: Plans and elevations of any bin and cycle stores provided
  level: must
- item: Documents and reports not marked 'Private and confidential' or 'Draft'
  level: must
- item: Ownership certificates correctly dated and giving the actual name of the owner (not the occupier)
  level: must
