reference: section-proposed
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - s73
        - outline
    - condition:
        field: change-in-ground-levels
        value: true
        description: The development changes the site topography, or the site has significant existing
          changes in level.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: basement
        value: true
        description: Excavation or below-ground (basement) works are proposed.
  - application-type:
      in:
      - reserved-matters
  - application-type:
      in:
      - advertising
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Required where development results in changes to the site topography, or where there are
  existing significant level changes. Sections to also show any excavation/below ground works, and any
  patios, raised platforms and decking.
must-include:
- item: Scale of 1:100 or 1:200, with a matching scale bar
  level: must
  required-if:
    application-type:
      in:
      - full
      - s73
      - lbc
      - outline
- item: Scale of 1:50 or 1:100, with a matching scale bar
  level: must
  required-if:
    application-type:
      in:
      - hh
      - reserved-matters
- item: Any excavation or below-ground works, and any patios, raised platforms and decking
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
      - outline
      - reserved-matters
- item: Changes to the existing site topography and finished floor levels
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
- item: Section through the structure the sign is fixed to, showing the relationship between the sign
    and any lighting structures on the building, at 1:20 or 1:50 with a matching scale bar
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Section through the structure on which the sign is to be fixed showing the relationship
    between the sign and any lighting structures to the building. Set to a scale of 1:20 or 1:50 with
    matching scale bar.
confidence: medium
notes: From the council's list (published October 2026), page 3 of the planning permission checklist.
  Also in householder page 3, variation of condition page 3, listed building page 3, reserved matters
  pages 3-4, outline and hybrid pages 4 and 9. The listed building checklist asks for sections 'where
  any excavation/below ground (i.e. basement) works are proposed'. Advertisement checklist page 2 asks
  for the sectional drawing of the sign.
review-status: unverified
field-status: {}
