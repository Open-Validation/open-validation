reference: application-form
local-authority: SEV
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - s73
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Fully completed including description of development, declaration and applicant details.
  Applicant details must be provided and should not be described as ‘c/o agent’.
must-include:
- item: Description of the development, the declaration and the applicant details
  level: must
- item: Applicant details given, not described as 'c/o agent'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
- item: Identifies the condition to change, how you wish to vary it and the reasons why
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: Clearly identify the condition to change, how you wish to vary the condition and the reasons
    why.
- item: Dated, with all mandatory questions answered
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
  source-text: Fully completed and dated application form with all mandatory questions answered.
- item: A full and clear description of the proposed tree works, including dimensions and/or percentages
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Statement of reasons for the proposed works
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: Sufficient information to identify the trees (species if known) and their numbering or sequence
  level: must
  required-if:
    application-type:
      in:
      - notice-trees-in-con-area
- item: Statement (in the form or a Biodiversity Statement) that the applicant believes the development
    would be subject to the biodiversity gain condition
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
- item: 'Where an earlier date is proposed: that date and the reasons for proposing it'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
- item: 'Whether activities before the date of application (or earlier date) have lost onsite biodiversity
    value (''degradation''); where they have: a statement saying so, the date immediately before them,
    the pre-development value on that date, the completed metric calculation and any supporting evidence'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
- item: Description of any irreplaceable habitat on the land on the date of application (or earlier date)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
confidence: medium
notes: From the council's list (published October 2026), page 1, 3 of the planning permission checklist.
  Also in every other checklist, page 1-2. The biodiversity items go in the form 'or via a Biodiversity
  Statement' (planning permission page 3; outline and hybrid page 2). For a notification of works to trees
  in a conservation area, an 'Application Form or written description of proposal' is accepted (tree works
  page 2). Every checklist also asks for the ownership certificate (A, B, C or D) and the fee.
review-status: unverified
field-status: {}
