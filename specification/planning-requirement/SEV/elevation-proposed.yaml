reference: elevation-proposed
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - s73
    - any:
      - condition:
          field: external-alterations
          value: true
          description: External alterations, including fenestration, roof openings, boundaries and enclosures,
            or other structures such as renewable energy sources.
      - condition:
          field: building-works
          value: true
          description: Extensions or new buildings.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: External alterations affecting or attached to the listed building.
  - application-type:
      in:
      - advertising
      - reserved-matters
      - outline-some
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Existing and proposed plans showing any external alterations, including basement area (shown
  via a dashed/dotted line), fenestrations and roof openings, boundaries and enclosures, and any other
  structures i.e. renewable energy sources. All relevant elevations should be shown.
must-include:
- item: Scale of 1:50 or 1:100, with a matching scale bar
  level: must
- item: All relevant elevations shown
  level: should
- item: External alterations shown, including fenestration and roof openings, boundaries and enclosures,
    and other structures such as renewable energy sources
  level: must
- item: Any basement area shown with a dashed or dotted line
  level: must
- item: Windows, doors, rooflights, steps, walls and terraces matching the floor plans
  level: must
- item: All sides of the dwelling and of any other outbuilding within 5m of it, including the outline
    of any basement areas
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - green-belt
        description: In the Metropolitan Green Belt.
  source-text: 'Any application for works to a dwelling or to an outbuilding within 5m of the dwelling
    must include: Existing and proposed elevations covering all sides for the dwelling and any other outbuilding
    within 5m of the dwelling (including the outline of any basement areas)'
- item: All elevations of the proposed dwellings or structures, matching the proposed floor plans
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
- item: 'Outline with appearance not reserved: external appearance, including materials and finishes'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
- item: 'Outline with scale not reserved: elevation drawings at 1:100 or 1:200 with a matching scale bar,
    showing the relationship between buildings within and next to the site (for example street scene elevations)'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
- item: Any proposed upper-floor window in a wall or roof slope forming a side elevation shown as obscure-glazed
    and non-opening
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
  source-text: Drawings must indicate that any proposed upper-floor window located in a wall or roof slope
    forming a side elevation is obscure- glazed and non-opening.
confidence: medium
notes: 'From the council''s list (published October 2026), page 2 of the planning permission checklist.
  Also in householder page 2 (with the Green Belt rule on page 5), variation of condition page 3, listed
  building page 3, advertisement page 2, reserved matters page 3, outline and hybrid pages 3-4 and 9.
  Outline: only for the matters not reserved (appearance, scale). For lawful development certificates
  they are ''Additional information'' (''may be helpful''), so shown as discretionary.'
review-status: unverified
field-status: {}
