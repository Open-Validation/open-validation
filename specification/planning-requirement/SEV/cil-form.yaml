reference: cil-form
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The gross internal floor space increases by 100 square metres or more.
      - condition:
          field: residential-annexe
          value: true
          description: The proposal includes a residential annexe.
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates new homes, including by change of use to a dwelling.
      - condition:
          field: residential-extension
          value: true
          description: The proposal includes a residential extension or outbuilding.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 100
          description: The proposal includes 100 square metres or more of retail floorspace.
source-url: https://www.sevenoaks.gov.uk/downloads/download/1057/planning_validation_checklists
confidence: medium
notes: 'From the audit (missing_requirement): householder - where gross internal floor space increases
  by 100 sqm or more, or for any residential annexe; full - new homes, change of use to a dwelling, residential
  extensions and outbuildings, retail of 100 sqm or more.'
review-status: unverified
field-status: {}
