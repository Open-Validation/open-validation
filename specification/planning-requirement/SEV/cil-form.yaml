reference: cil-form
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New homes, including change of use to a dwelling.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: '100 sq m or more of floorspace: residential extensions and outbuildings, supermarkets,
          convenience stores and retail warehousing (householder: an increase in gross internal floorspace
          of 100 sq m or more).'
    - condition:
        field: residential-annexe
        value: true
        description: Any residential annexe, ancillary or self-contained.
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: The charge will apply to the development of new homes and change of use to a dwelling. It
  also applies to residential extensions and outbuildings, supermarkets, convenience stores and retail
  warehousing where the proposed floor space is 100 square metres or more.
confidence: medium
notes: 'From the council''s list (published October 2026), page 5 of the planning permission checklist.
  Also in reserved matters page 5, outline and hybrid page 6, variation of condition page 3. The householder
  checklist (page 4) says: ''All applications where the proposal increases the gross internal floor space
  by 100m2 or more. Any residential annexe whether ancillary or self-contained.'''
review-status: unverified
field-status: {}
