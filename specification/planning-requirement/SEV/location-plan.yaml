reference: location-plan
local-authority: SEV
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - s73
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: 'Site Location Plan Must include: Set to scale of 1:1250 or 1:2500 with the application site
  clearly marked in red and any other owned land marked in blue (which is adjoining or relevant to the
  application site). Identify the land to which the application relates (properties shown should be numbered
  or named to ensure that the exact location of the application site is clear) Red line should extend
  up to the public highway where there are works to a building(s), creation of a new access, or alterations
  to an existing access. Direction of north indication. Relationship to neighbouring properties or sites
  to enable the application site to be located.'
must-include:
- item: Scale of 1:1250 or 1:2500
  level: must
- item: Application site clearly marked in red, and any other owned land (adjoining or relevant to the
    site) marked in blue
  level: must
- item: Identifies the land the application relates to, with properties numbered or named so the exact
    location of the site is clear
  level: must
- item: Direction of north
  level: must
- item: Relationship to neighbouring properties or sites, so the application site can be located
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
- item: Red line extends up to the public highway
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - any:
      - condition:
          field: building-works
          value: true
          description: Works to a building or buildings.
      - condition:
          field: new-vehicle-access
          value: true
          description: A new access is created or an existing access altered.
  source-text: Red line should extend up to the public highway where there are works to a building(s),
    creation of a new access, or alterations to an existing access.
- item: Access up to the public highway indicated
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - condition:
        field: new-vehicle-access
        value: true
        description: Lawfulness is sought for access works.
  source-text: Access up to the public highway must be indicated where lawfulness is being sought for
    these works.
- item: Shows whether the red line boundary is smaller than on the original or linked application
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: Indication of whether the redline boundary is being made smaller than original/linked application.
- item: Shows the location of the access, which must adjoin the public highway
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: Site location plan to detail the location access. Access must adjoin the public highway.
confidence: medium
notes: From the council's list (published October 2026), page 2 of the planning permission checklist.
  Also in the householder (page 2), reserved matters (page 2), outline and hybrid (pages 2, 4, 8-9), variation
  of condition (page 2), listed building (page 2), advertisement (pages 1-2) and both lawful development
  certificate (pages 1-2) checklists. The householder checklist doesn't ask for the relationship to neighbouring
  properties. The red line must be solid and the same on every drawing (see submission-standards).
review-status: unverified
field-status: {}
