reference: condition-of-trees
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4898/10_application_for_tree_works_validation_checklist
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: If the reasons relate to the health or the condition of the trees written evidence or diagnostic
  information (photos) from an arboriculturist or other appropriate expert.
must-include:
- item: Written evidence or diagnostic information (photos) from an arboriculturist or other appropriate
    expert
  level: must
confidence: medium
notes: From the council's list (published September 2026), page 1 of the tree works checklist. Needed
  for TPO works when the reason is the trees' health or condition; whether that applies depends on the
  reasons given, so it shows as discretionary. For conservation area notifications it is only 'helpful'
  (page 2).
review-status: unverified
