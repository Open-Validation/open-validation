reference: air-quality-assessment
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Other development over 1000 sq m.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Required for all major development, including other development over 1000m2
confidence: medium
notes: From the council's list (published October 2026), page 4 of the planning permission checklist.
  Also in reserved matters page 4, outline and hybrid page 5. The council adds that 'further air quality
  appraisal with damage cost analysis may be required to evaluate the harm of a development'. The variation
  of condition checklist has it listed under 'Additional information that may be required for the application,
  subject to site constraints', which the council says 'might not be requested to make the application
  valid', so it shows as discretionary there.
review-status: unverified
field-status: {}
