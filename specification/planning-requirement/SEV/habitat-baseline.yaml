reference: habitat-baseline
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Separate scaled drawings (not embedded within reports), with a matching scale bar and other
  validation requirements indicated above, detailing onsite habitat existing on the date of application
  (or earlier proposed date), including any irreplaceable habitat (if applicable).
must-include:
- item: Separate drawings, not embedded within reports
  level: must
- item: Drawn to scale with a matching scale bar, meeting the other drawing requirements
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's list (published October 2026), page 3 of the planning permission checklist.
  Also in outline and hybrid pages 2-3 and 10. The reserved matters checklist (pages 7-8) lists BNG under
  'Additional information', which 'might not be requested to make the application valid', so it shows
  as discretionary there.
review-status: unverified
field-status: {}
