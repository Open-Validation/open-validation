reference: floor-plan-proposed
local-authority: SEV
required-if:
  any:
  - application-type:
      in:
      - full
      - s73
      - reserved-matters
      - outline-some
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: building-works
          value: true
          description: Extensions or new buildings are proposed.
      - condition:
          field: external-alterations
          value: true
          description: Alterations, including to the fenestration or roof.
      - condition:
          field: demolition
          value: true
          description: Buildings or structures are to be demolished.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: building-works
          value: true
          description: Alterations or extensions affecting the listed building or a curtilage listed building.
      - condition:
          field: demolition
          value: true
          description: Curtilage listed buildings or outbuildings are to be demolished.
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Existing and proposed floor plans required for all proposals, including for replacement dwellings
  and for buildings proposed to be demolished.
must-include:
- item: Scale of 1:50 or 1:100, with a matching scale bar
  level: must
- item: All windows, doors, rooflights, steps, walls and terraces shown clearly, matching the elevations
  level: must
- item: All subterranean areas shown
  level: should
- item: All floors (including any basement areas) of the dwelling and of any other outbuilding within
    5m of it
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - green-belt
        description: In the Metropolitan Green Belt.
  source-text: 'Any application for works to a dwelling or to an outbuilding within 5m of the dwelling
    must include: Existing and Proposed Floor plans covering all floors (including any basement areas)
    for the dwelling and any other outbuilding within 5m of the dwelling'
- item: Proposed areas of change highlighted
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: Highlight proposed areas of changes
- item: Any internal changes, including the position of new doors, enclosure of existing doorways and
    removal of internal walls
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Must include any internal changes, including positioning of new doors (and enclosure of
    existing doorways) and removal of any internal walls.
confidence: medium
notes: 'From the council''s list (published October 2026), page 2 of the planning permission checklist.
  Also in householder page 2 (with the Green Belt rule on page 5), variation of condition page 2, listed
  building pages 2-3, reserved matters page 3, outline and hybrid pages 4 and 9. Outline: only where appearance
  is not reserved; reserved matters: only for the matters applied for. For lawful development certificates
  they are ''Additional information'' (''may be helpful''), so shown as discretionary.'
review-status: unverified
field-status: {}
