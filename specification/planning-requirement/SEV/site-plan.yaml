reference: site-plan
local-authority: SEV
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - advertising
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: 'Site/Block Plan Must include: Set to scale of 1:200 or 1:500, with matching scale bar. Changes
  in footprint of the building(s). Clearly annotated to show all existing and proposed buildings and structures,
  including those to be demolished. Included details/indication of all trees within the site. Relationship
  to the site boundaries and other existing buildings on the site. The existing and proposed parking arrangements
  Details of the access to the highway (with vehicular and pedestrian visibility splays) where relevant
  to proposed works. See Kent County Council’s Design Guide for more information. Any changes to the boundaries
  and landscaping of the site.'
must-include:
- item: Scale of 1:200 or 1:500, with a matching scale bar
  level: must
- item: Changes in the footprint of the building(s)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
- item: Clearly annotated to show all existing and proposed buildings and structures, including those
    to be demolished
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
- item: Details or indication of all trees within the site
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
- item: Relationship to the site boundaries and other existing buildings on the site
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
- item: Existing and proposed parking arrangements
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
- item: Access to the highway, with vehicular and pedestrian visibility splays
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - s73
    - condition:
        field: new-vehicle-access
        value: true
        description: The proposed works create or alter an access.
  source-text: Details of the access to the highway (with vehicular and pedestrian visibility splays)
    where relevant to proposed works.
- item: Any changes to the boundaries and landscaping of the site
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - s73
- item: Any changes to the boundaries of the site where they affect the listed building
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Location of the proposed and existing adverts or signage
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Outline with layout reserved: the layout of the proposal with the indicative area or floorspace
    for each proposed use'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Outline with layout reserved (except major applications): plans of any existing buildings to
    be replaced'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Layout (outline with layout not reserved, or reserved matters for layout): the position of all
    new buildings, routes and open spaces within the development, and their relationship to buildings
    and spaces outside it'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
      - reserved-matters
- item: 'Layout (outline with layout not reserved, or reserved matters for layout): provision for parking
    and turning of vehicles and cycles'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
      - reserved-matters
- item: 'Access (outline with access not reserved, or reserved matters for access): vehicle, bicycle and
    pedestrian access and circulation routes within the site'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
      - reserved-matters
- item: 'Access (outline with access not reserved): the position and treatment of the proposed access
    and of circulation routes, and how they connect to the surrounding area'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
- item: 'Access (outline with access not reserved): visibility splays for any proposed vehicular access,
    in line with Local Highway Authority standards'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
- item: 'Hybrid applications: the block plan indicates the hybrid (outline and full) areas'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: 'Block Plan (indicating Hybrid areas):'
confidence: medium
notes: From the council's list (published October 2026), page 2 of the planning permission checklist.
  Also in householder page 2, variation of condition page 2, listed building page 2, advertisement page
  2, reserved matters page 2, outline and hybrid pages 3-4 and 8-9. For lawful development certificates
  it is under 'Additional information' ('may be helpful'), so it shows as discretionary there. Outline
  items apply only to the matters not reserved, and reserved matters items only to the matters applied
  for.
review-status: unverified
field-status: {}
