reference: heritage-statement
local-authority: SEV
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        - park-and-garden
        - listed-building
        - listed-building-setting
        - locally-listed-building
        - scheduled-monument
        description: Within or next to a designated area (including conservation areas and Registered
          Parks and Gardens), affecting a statutory or locally listed building or its setting, or within
          the setting of a scheduled monument.
  - all:
    - application-type:
        in:
        - s73
        - advertising
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Required when the application site is within, or adjacent to, a designated area (which includes
  conservation areas and Registered Parks & Gardens), or where the proposed development affects a statutory
  or locally listed building and/or their setting. Also required if the site is located within the setting
  of a scheduled monument.
must-include:
- item: Proportionate to the significance of the asset and the impact of the development
  level: should
- item: Assessment and description of the significance of the heritage asset
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Description of any features affected by the proposal (or of its setting, if affected) and their
    contribution to that significance
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Assessment of the impact of the proposals on heritage significance
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Refers to any other designated or non-designated heritage assets affected, and their setting (listed
    buildings, conservation areas, World Heritage Sites, registered parks and gardens, scheduled monuments)
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (published October 2026), page 6 of the planning permission checklist.
  Also in householder page 5, reserved matters page 6, outline and hybrid page 7. The listed building
  checklist (page 2): ''Heritage statements are required for all listed building applications.'' The variation
  of condition checklist has it listed under ''Additional information that may be required for the application,
  subject to site constraints'', which the council says ''might not be requested to make the application
  valid'', and the advertisement checklist lists it under ''Other documents'' with no trigger, so it shows
  as discretionary for those.'
review-status: unverified
field-status: {}
