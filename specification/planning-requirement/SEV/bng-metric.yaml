reference: bng-metric
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development would be subject to the biodiversity gain condition.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: The completed biodiversity metric calculation tool showing the calculations of the pre-development
  biodiversity value of the onsite habitat on the date of application (or proposed earlier date) including
  the publication date of the biodiversity metric used to calculate that value.
must-include:
- item: Calculations of the pre-development biodiversity value of the onsite habitat on the date of application
    (or proposed earlier date)
  level: must
- item: The publication date of the biodiversity metric used
  level: must
confidence: medium
notes: From the council's list (published October 2026), page 3 of the planning permission checklist.
  Also in outline and hybrid pages 2-3 and 10. The reserved matters checklist (pages 7-8) lists BNG under
  'Additional information', which 'might not be requested to make the application valid', so it shows
  as discretionary there.
review-status: unverified
field-status: {}
