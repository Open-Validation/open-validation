reference: fire-statement
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.sevenoaks.gov.uk/downloads/download/1057/planning_validation_checklists
confidence: medium
notes: 'From the audit (missing_requirement): 2 or more dwellings or educational accommodation at 18m
  or more, or 7 or more storeys.'
review-status: unverified
field-status: {}
