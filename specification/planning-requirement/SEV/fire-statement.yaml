reference: fire-statement
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Where development is for two or more dwellings or educational accommodation and meets the
  height condition of 18m or more, or 7 or more storeys. A Fire Statement form is required.
must-include:
- item: Made on the Fire Statement form
  level: must
confidence: medium
notes: From the council's list (published October 2026), page 6 of the planning permission checklist.
  Also in outline and hybrid page 7.
review-status: unverified
field-status: {}
