reference: design-and-access-statement
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal includes new or replacement dwellings, including by change of use.
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 100
        description: The proposal includes 100 square metres or more of commercial floorspace.
source-url: https://www.sevenoaks.gov.uk/downloads/download/1057/planning_validation_checklists
confidence: medium
notes: 'From the audit (missing_requirement): all new or replacement dwellings including change of use,
  major development, commercial of 100 sqm or more.'
review-status: unverified
field-status: {}
