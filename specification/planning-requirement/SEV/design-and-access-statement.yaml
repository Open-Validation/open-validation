reference: design-and-access-statement
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New or replacement dwellings (including through change of use).
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 100
        description: Commercial development of 100 sq m or more.
  - all:
    - application-type:
        in:
        - outline
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: 100 sq m or more of floorspace created.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: 'When required: All new dwellings (including through change of use applications) or replacement
  dwellings and required for major development. All commercial developments of 100sqm or more.'
must-include:
- item: Heads of Terms for the S106 Legal Agreement (in this statement or the Planning Statement)
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more residential units.
      - all:
        - site:
            in:
            - designated-rural-area
            description: In a Designated Rural Area.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 6
            description: 6 or more residential units in a Designated Rural Area.
  source-text: Planning Statement/Design and Access Statement should include Heads of Teams for the S106
    Legal Agreement.
confidence: medium
notes: 'From the council''s list (published October 2026), page 5, 7 of the planning permission checklist.
  Also in reserved matters page 5, outline and hybrid pages 2 and 6. The outline checklist adds ''all
  development/uses where floor space to be created is 100m² or more in a Conservation area or World Heritage
  Site''. The listed building checklist (page 2): ''Required for all Listed Building Consent Applications.''
  The variation of condition checklist only lists it under ''Other documents'' with no trigger, so it
  shows as discretionary there.'
review-status: unverified
field-status: {}
