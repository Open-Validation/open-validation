reference: affordable-housing-statement
local-authority: SEV
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: The development proposes 10 or more residential units.
    - all:
      - site:
          in:
          - designated-rural-area
          description: The site is in a Designated Rural Area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 6
          description: The development proposes 6 or more residential units.
source-url: https://www.sevenoaks.gov.uk/downloads/download/1057/planning_validation_checklists
source-text: Affordable Housing provision required where the development proposes 10 or more residential
  units
confidence: medium
notes: 'From the audit (missing_requirement): S106 Affordable Housing for 10 or more units, or 6 or more
  in a Designated Rural Area.'
review-status: unverified
field-status: {}
