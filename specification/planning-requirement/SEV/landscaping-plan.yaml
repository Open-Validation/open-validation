reference: landscaping-plan
local-authority: SEV
required-if:
  any:
  - application-type:
      in:
      - outline-some
      - reserved-matters
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4902/3_application_for_reserved_matters_validations_checklist
source-text: Note – the following documents and information are required where the matters are to be considered
  at this application following an approved outline application.
must-include:
- item: Scale of 1:200 or 1:500, with a matching scale bar
  level: must
- item: Position of all existing trees and shrubs to be retained and those to be removed
  level: must
- item: Size, species and density of all proposed trees and shrubs
  level: must
- item: Proposed finished levels or contours
  level: must
- item: All means of enclosure and boundary details
  level: must
- item: Hard surfacing materials
  level: must
- item: Minor structures (for example play equipment, refuse or other storage units, signs, lighting)
  level: must
- item: Existing and proposed functional services above and below ground (for example drainage, power,
    communications cables, pipelines)
  level: must
- item: Vehicle parking layout and pedestrian access
  level: must
  required-if:
    application-type:
      in:
      - outline-some
- item: Retained landscape features
  level: must
  required-if:
    application-type:
      in:
      - outline-some
confidence: medium
notes: From the council's list (published October 2026), page 4 of the reserved matters checklist. Also
  in outline and hybrid pages 4-5. Only where landscaping is the matter applied for (reserved matters)
  or is not reserved (outline). A 'Landscaping Strategy' is also asked for 'where any significant hard
  and soft landscaping works are proposed' (planning permission page 8, outline page 10, reserved matters
  page 8); it is listed under 'Additional information that may be required for the application, subject
  to site constraints', which the council says 'might not be requested to make the application valid',
  so it shows as discretionary for full and outline.
review-status: unverified
field-status: {}
