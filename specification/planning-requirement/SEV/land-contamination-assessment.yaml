reference: land-contamination-assessment
local-authority: SEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - site:
        in:
        - contaminated-land
        description: A history of industrial, commercial or agricultural uses on the site.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.sevenoaks.gov.uk/downloads/file/4901/2_application_for_planning_permission_validation_checklist
source-text: Required for development on sites where there is a history of industrial, commercial or agricultural
  uses. As a minimum a Phase 1 (desk-top) risk assessment will be required.
must-include:
- item: At least a Phase 1 (desk-top) risk assessment
  level: must
confidence: medium
notes: From the council's list (published October 2026), page 5 of the planning permission checklist.
  The outline and hybrid (page 10), reserved matters (page 8) and variation of condition (page 5) checklists
  have it listed under 'Additional information that may be required for the application, subject to site
  constraints', which the council says 'might not be requested to make the application valid', so it shows
  as discretionary there.
review-status: unverified
field-status: {}
