reference: land-contamination-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - prior-approval
  - site:
      in:
      - contaminated-land
      description: New development on land that is or may have been affected by contamination.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: 'NPPF; Environmental Health Technical Planning Guidance: A guide for the redevelopment of land
  affected by Contamination in Staffordshire (3rd edition, 2008); Lichfield Local Plan Strategy 2008-2029
  policy BE1'
source-text: All applications (excluding Householders, Advertisement and Heritage) where new development
  is proposed on land that is or may have been affected by contamination.
must-include:
- item: A Phase 1 Contamination Assessment prepared by a suitably qualified professional
  level: must
- item: 'Where Phase 1 identifies contamination: a Phase 2 assessment with an extended assessment of contamination,
    its implications for the development, and mitigation'
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 16. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context).'
review-status: unverified
field-status: {}
