reference: travel-plan
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - s73
  - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Lichfield Local Plan Strategy 2008-2029 policies BE1 and ST1
source-text: A Travel Plan should be submitted alongside planning applications which are likely to have
  significant transport implications (see Transport Assessments below).
must-include:
- item: How the transport implications of the development will be managed
  level: must
- item: The travel plan coordinator, management arrangements and timetable
  level: must
- item: Activities for marketing and promoting the plan to occupiers, users, visitors and residents
  level: must
- item: Form and content agreed with Staffordshire County Council before the application is registered
    (or the principle of a Minimalist Travel Plan agreed in writing)
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 13. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). Shown as ''check'' because it depends on whether the scheme has significant
  transport implications, with scope agreed with the highway authority.'
review-status: unverified
field-status: {}
