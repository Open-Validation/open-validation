reference: lighting-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - advertising
  - condition:
      field: external-lighting
      value: true
      description: Proposes external illumination, e.g. floodlighting.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: 'NPPF; Lichfield Local Plan Strategy 2008-2029 policy BE1; Environmental Health Technical Planning
  Guidance: External Artificial Lighting (2008)'
source-text: All developments proposing external illumination e.g. floodlighting proposals
must-include:
- item: The proposed external lighting
  level: must
- item: The hours of use when the lighting would be switched on
  level: must
- item: A layout plan showing the proposed beam orientation and light spillage
  level: must
- item: Future maintenance
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 16. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context).'
review-status: unverified
field-status: {}
