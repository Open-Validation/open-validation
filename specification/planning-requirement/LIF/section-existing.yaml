reference: section-existing
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - prior-approval
      - ldc
      - pa-demo-building
      - s73
      - approval-condition
      - non-material-amendment
  - any:
    - condition:
        field: new-build
        value: true
        description: Involves new buildings.
    - condition:
        field: change-in-ground-levels
        value: true
        description: Involves a change in ground levels.
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Three copies (unless submitted electronically) of such plans drawn at a scale of 1:50 or
  1:100 must be submitted where relevant, and should show a cross section(s) through the proposed building(s).
  In all cases where a proposal involves a change in ground levels, illustrative drawings should be submitted
  to show both existing and finished levels ... This will be required for all applications involving new
  buildings.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: Cross section(s) through the proposed building(s)
  level: should
- item: 'Where ground levels change: existing and finished levels, foundations and eaves, and how encroachment
    onto adjoining land is avoided'
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Involves a change in ground levels.
- item: Existing site levels and finished floor levels related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: should
- item: 'For householder schemes on sloping sites: how the proposal relates to existing ground levels
    or where levels outside the extension change'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: change-in-ground-levels
        value: true
        description: Sloping site or modified ground levels.
- item: A linear scale bar, to help electronic scaling and measuring
  level: must
- item: A unique plan / drawing reference number
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 29-30. Appendix A, existing and proposed site
  sections and finished floor and site levels. The validation matrix marks them 'C' for these application
  types; other cases 'where relevant' show as 'check'.
review-status: unverified
field-status: {}
