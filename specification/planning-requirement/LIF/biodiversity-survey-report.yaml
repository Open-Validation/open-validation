reference: biodiversity-survey-report
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - pa-ecomms-network
      - pa-demo-building
  - any:
    - condition:
        field: protected-species
        value: true
        description: May negatively impact protected or priority species.
    - site:
        in:
        - priority-habitat
        description: May negatively impact priority habitats.
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        description: May impact (directly or indirectly) a statutory designated site such as an SSSI or
          SAC.
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Conservation of Habitats and Species Regulations 2017; Wildlife and Countryside Act 1981; NERC
  Act 2006; Protection of Badgers Act 1992; NPPF; Biodiversity and Development SPD; Lichfield Local Plan
  Strategy 2008-2029 Core Policy 13 and policies NR3, NR6, NR7, NR8; Local Plan Allocations policy NR10
source-text: 'Where it is considered likely that a proposed development may: • Negatively impact on protected
  or priority species and/or habitats, • Would affect the biodiversity value of the area within the development
  boundary, • Would impact (directly or indirectly, individually or in combination with other developments)
  on a statutory designated site (i.e. SSSI, SAC etc.)'
must-include:
- item: Surveys at the appropriate time of year for the species or survey type, by a suitably qualified
    and experienced (licensed) person
  level: must
- item: Survey methodology as prescribed by the relevant Natural England Standing Advice Species Sheet
  level: must
- item: Surveys less than 2 years old, with no further species survey work outstanding
  level: must
- item: 'Where a statutory or non-statutory site may be affected: an impact assessment showing the mitigation
    hierarchy and all avoidance, mitigation and/or compensation measures'
  level: must
- item: The presence and population of all protected and priority species and priority habitats on the
    site or likely to be negatively affected
  level: must
- item: 'Where protected or priority species have been recorded or are likely: up-to-date surveys'
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 6-7. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). The effect on the biodiversity value of the site is left to judgement,
  so it shows as ''check''. The list predates mandatory biodiversity net gain and has no BNG section.'
review-status: unverified
field-status: {}
