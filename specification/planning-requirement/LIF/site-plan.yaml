reference: site-plan
local-authority: LIF
required-if:
  any:
  - application-type:
      in:
      - hh
      - advertising
      - pa-ecomms-network
      - pa-demo-building
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - prior-approval
        - ldc
        - s73
        - approval-condition
        - non-material-amendment
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Three copies (unless submitted electronically) of the site plan must be submitted at a scale
  of 1:500 or 1:200 and must accurately show:'
must-include:
- item: At 1:500 or 1:200
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, and any building or structure on the other side of those boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: All trees on the site, and those on adjacent land that could influence or be affected by the development
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
- item: Proposed and existing vehicle parking
  level: must
- item: A linear scale bar, to help electronic scaling and measuring
  level: must
- item: A unique plan / drawing reference number
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 29. Appendix A, block plans. The validation
  matrix ('Site Layout Plan') marks it 'R' for householder, advertisement, telecommunications and demolition
  prior notifications, and 'C' for other types, shown here as 'check'.
review-status: unverified
field-status: {}
