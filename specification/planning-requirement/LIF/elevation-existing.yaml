reference: elevation-existing
local-authority: LIF
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - prior-approval
        - ldc
        - pa-ecomms-network
        - pa-demo-building
        - s73
        - approval-condition
        - non-material-amendment
        - advertising
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Three copies (unless submitted electronically) of all existing and proposed elevations at
  a scale of 1:50 or 1:100 must be submitted showing clearly the proposed works in relation to what is
  already there.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: All elevations, including blank elevations
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: Intervening features (fencing, hedges, trees) omitted so they don't obscure the proposals
  level: must
- item: 'Where the elevation adjoins or is close to an existing building: the relationship between the
    buildings and the positions of openings on each'
  level: must
- item: A linear scale bar, to help electronic scaling and measuring
  level: must
- item: A unique plan / drawing reference number
  level: must
- item: Elevations correspond exactly with the existing / proposed floor plans
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 29. Appendix A, existing and proposed elevations.
  The validation matrix marks them 'R' for householder applications and 'C' for other types, shown here
  as 'check'.
review-status: unverified
field-status: {}
