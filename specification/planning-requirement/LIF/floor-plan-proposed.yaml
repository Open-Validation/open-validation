reference: floor-plan-proposed
local-authority: LIF
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - prior-approval
        - ldc
        - pa-ecomms-network
        - pa-demo-building
        - s73
        - approval-condition
        - non-material-amendment
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Three copies (unless submitted electronically) of existing and proposed floor plans at a
  scale of 1:50 or 1:100 must be submitted.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: New buildings shown in context with adjacent buildings, including property numbers where applicable
  level: must
- item: A linear scale bar, to help electronic scaling and measuring
  level: must
- item: A unique plan / drawing reference number
  level: must
- item: Floors correspond exactly with the existing / proposed block plan drawings
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 29. Appendix A, existing and proposed floor
  plans. The validation matrix marks them 'R' for householder applications and 'C' for other types, shown
  here as 'check'.
review-status: unverified
field-status: {}
