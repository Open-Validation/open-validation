reference: heritage-statement
local-authority: LIF
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      - conservation-area
      - park-and-garden
      description: Development to a listed building, or in or next to a conservation area or a registered
        park and garden.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: A known area of archaeological significance.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal disturbs the ground.
  - all:
    - ref: major-development
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
source-text: 'A Heritage Statement for development in or adjacent to a Conservation Area; or a Registered
  Park and Garden; or for works to or within proximity of a Historic Hedgerow should include: An assessment
  of the significance of the designated area. … A heritage statement will also be required in respect
  of proposals involving the disturbance of ground within a known area of archaeological significance,
  or in other areas the subject of major development proposals or significant infrastructure works, where
  archaeological remains may survive, as may be specified in pre-application advice.'
must-include:
- item: An assessment of the significance of the designated area
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook captured only the archaeology clause; the conservation area
  and registered park text was in the LDC tree-survey row. From the audit: listed buildings and demolition
  in conservation areas too. Works near a Historic Hedgerow have no field.'
review-status: unverified
field-status: {}
