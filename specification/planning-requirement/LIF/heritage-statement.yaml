reference: heritage-statement
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - advertising
      - pa-ecomms-network
      - pa-demo-building
      - s73
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        description: Affects a heritage asset (listed building, conservation area, scheduled monument,
          registered park or garden, or a non-designated heritage asset) or its setting.
    - all:
      - site:
          in:
          - conservation-area
          description: In a conservation area.
      - condition:
          field: demolition
          value: true
          description: Involves demolition.
    - site:
        in:
        - archaeological-priority-area
        description: Ground disturbance within a known area of archaeological significance.
    - all:
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerow removal.
      - discretionary
    - all:
      - ref: major-development
      - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Lichfield Local Plan Strategy 2008-2029 policies BE1 and NR5; Trees, Landscaping and
  Development SPD; Historic Environment SPD
source-text: All Planning applications / Listed Building consents that affect a heritage asset and / or
  its setting. All applications involving demolition within a Conservation Area Hedgerow removal may also
  require a Heritage Statement where it forms part of a significant historic landscape or area of archaeological
  potential. A heritage statement will also be required in respect of proposals involving the disturbance
  of ground within a known area of archaeological significance, or in other areas the subject of major
  development proposals or significant infrastructure works, where archaeological remains may survive,
  as may be specified in pre-application advice.
must-include:
- item: 'For a listed building: the architectural, historical or other significance of the building, its
    site and setting, with documentary evidence, photographs and map regression where appropriate'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Affects a listed building.
- item: 'For a listed building: the impact of the proposals on the significance of the building, its site
    and setting and any adjacent heritage assets'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Affects a listed building.
- item: 'For a listed building: a justification for the proposals and any mitigation measures'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Affects a listed building.
- item: 'Where a heritage asset is to be demolished: how the application meets the NPPF criteria (paragraph
    133)'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: A heritage asset is proposed for demolition.
- item: 'In or next to a conservation area or registered park and garden, or near a historic hedgerow:
    the significance of the designated area and the impact on its character, appearance and/or setting'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      - park-and-garden
      description: In or next to a conservation area or registered park and garden.
- item: 'For a non-designated heritage asset: its significance and the impact of the development on it'
  level: must
  required-if:
    site:
      in:
      - locally-listed-building
      description: Affects a non-designated heritage asset.
- item: 'Where the land includes or may include heritage assets with archaeological interest: an appropriate
    desk-based assessment'
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: Heritage assets with archaeological interest.
- item: The significance of, and impact on, each heritage asset affected
  level: must
- item: Reference to the Staffordshire Historic Environment Record
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 4. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context) (and ''R'' for listed building consent). Hedgerow removal in a historic
  landscape and major or infrastructure schemes where archaeology may survive show as ''check'' because
  the list leaves them to judgement or pre-application advice.'
review-status: unverified
field-status: {}
