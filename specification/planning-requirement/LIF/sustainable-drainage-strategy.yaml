reference: sustainable-drainage-strategy
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Lichfield Local Plan Strategy 2008-2029 Core Policy 3 and policy BE1; Sustainable
  Design SPD
source-text: All major developments should be accompanied by a sustainable drainage strategy.
must-include:
- item: Existing site plan showing topography and how the site currently drains
  level: must
- item: Proposed site plan showing how the site will drain
  level: must
- item: How the drainage hierarchy has been followed
  level: must
- item: How flood risks will be mitigated
  level: must
- item: Surface water design for the site
  level: must
- item: Evidence of an agreed point of discharge, with calculations of current and proposed site run-off
    and likely forms of SuDS
  level: must
- item: Logical location of attenuation storage areas
  level: must
- item: Who will maintain and pay for the system over the life of the development
  level: must
- item: How flood risk will be considered at all stages of development
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 10. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). Uses MHCLG''s retired sustainable-drainage-strategy id.'
review-status: unverified
field-status: {}
