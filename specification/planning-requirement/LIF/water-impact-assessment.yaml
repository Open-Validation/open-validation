reference: water-impact-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - condition:
      field: non-mains-drainage
      value: true
      description: Does not drain into the foul mains system.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Conservation of Habitats and Species Regulations 2017; Staffordshire Requirements for Biodiversity
  and Geological Conservation (2011)
source-text: For all applications (excluding Listed Building Consents, and, Advertisements) and qualifying
  householder developments which do not drain into the foul mains system.
must-include:
- item: Existing drainage survey
  level: must
- item: Proposed drainage scheme
  level: must
- item: A statement showing the proposal does not harm the water environment through excess abstraction
    or the release of pollutants
  level: must
- item: Undertaken in liaison with Severn Trent Water
  level: should
confidence: medium
notes: 'From the council''s list (published March 2023), page 11. The list''s Water Quality Assessment,
  covering Black Brook, Footherley Brook, River Tame, River Trent, Burntwood Brook, Ford Brook, Moreton
  Brook, River Blithe, River Mease and the Cannock Extension Canal SAC. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). Read here as applying where the development does not drain to the foul
  mains.'
review-status: unverified
field-status: {}
