reference: noise-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - prior-approval
      - pa-ecomms-network
      - s73
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: Likely to affect noise and/or vibration sensitive development or locations.
      - discretionary
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Introduces noise and/or vibration sensitive development where noise is likely to
            have an adverse impact.
      - discretionary
    - all:
      - site:
          in:
          - listed-building
          description: A listed building.
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: 'Noise Policy Statement for England (2010); Environmental Protection Act 1990; NPPF; NPPG; Environmental
  Health Technical Planning Guidance: Noise & Vibration (2013); BS 4142, BS 8233, BS 7445'
source-text: All applications likely to have an impact on noise and/or vibration sensitive development(s).
  All applications likely to have an impact on noise and/or vibration sensitive locations. All applications
  that introduce or expose noise and/or vibration sensitive development(s) into areas and locations where
  noise and/or vibration is likely to have an adverse impact. All planning applications for change of
  use of Listed buildings
must-include:
- item: 'Any vibration survey conducted having regard to BS 6472: 2008 and BS 7385-2: 1993'
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 16-17. The list''s Noise and Vibration Assessments
  and Appraisals. Application types follow the validation matrix on the last page of the list, where this
  document is marked ''C'' (conditional: dependent on site and application context). Whether an impact
  is ''likely'' is for the council''s Pollution Control Team to advise, so those parts show as ''check''.'
review-status: unverified
field-status: {}
