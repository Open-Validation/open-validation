reference: photos
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - advertising
  - any:
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbine applications.
    - all:
      - application-type:
          in:
          - advertising
      - condition:
          field: affects-trunk-road
          value: true
          description: Advertisements next to the Strategic Road Network.
    - all:
      - ref: major-development
      - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; Lichfield Local Plan Strategy 2008-2029 policy BE1; Local Plan Allocations policy BE2
source-text: Required for • Wind turbine applications; • Advertisements adjacent to the Strategic Road
  Network; and • Major commercial and residential developments which will alter a streetscene.
must-include:
- item: Photomontages showing how the development can be satisfactorily integrated within the street scene
  level: must
- item: Produced to an identifiable scale, with the scale clearly stated
  level: should
confidence: medium
notes: 'From the council''s list (published March 2023), page 5. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). Advertisement consent is added for the Strategic Road Network case. Major
  schemes show as ''check'' because whether they ''will alter a streetscene'' is a judgement.'
review-status: unverified
field-status: {}
