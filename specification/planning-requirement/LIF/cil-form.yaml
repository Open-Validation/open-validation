reference: cil-form
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - prior-approval
      - s73
      - non-material-amendment
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates a new dwelling (not apartments).
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 100
        description: Extension to a supermarket, neighbourhood convenience store or retail warehouse over
          100 sq m (GIA).
    - all:
      - condition:
          field: new-build
          value: true
          description: New building.
      - condition:
          field: use-class
          value: retail
          description: A new supermarket, retail warehouse or neighbourhood convenience retail unit.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Community Infrastructure Levy Regulations 2010 (as amended); NPPF; Developer Contributions SPD;
  Lichfield CIL Charging Schedule (June 2016)
source-text: 'All planning applications that comprise any of the following: • All extensions to super
  markets, neighbourhood convenience stores and retail warehousing in excess of 100 square metres (GIA)
  • The creation of new dwelling (not apartments) • New super markets • New retail warehousing • Neighbourhood
  convenience retail units'
must-include:
- item: A completed CIL Additional Information Requirement Form
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 22-23. The validation matrix marks the CIL
  question form 'R' for full, outline, reserved matters, householder, prior notification, S73 and non-material
  amendment applications; the triggers come from the text. An application can't be validated without it
  where it applies.
review-status: unverified
field-status: {}
