reference: location-plan
local-authority: LIF
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - advertising
      - ldc
      - pa-ecomms-network
      - pa-demo-building
      - s73
  - all:
    - application-type:
        in:
        - prior-approval
        - non-material-amendment
    - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include 3 copies of a location plan (unless submitted electronically)
  based on an up-to-date map at a scale of 1:1250 or 1:2500.
must-include:
- item: Up-to-date map at 1:1250 or 1:2500
  level: must
- item: At least one named road and two surrounding buildings, numbered or named so the exact location
    is clear
  level: must
- item: The direction of north
  level: must
- item: A linear scale bar, to help electronic scaling and measuring
  level: must
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from the highway, visibility splays, landscaping, septic tanks, car parking and open areas around
    buildings)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: A unique plan / drawing reference number
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 28. Appendix A (National Validation Requirements).
  The validation matrix marks the location plan 'R' for most application types and 'C' for prior notifications
  and non-material amendments.
review-status: unverified
field-status: {}
