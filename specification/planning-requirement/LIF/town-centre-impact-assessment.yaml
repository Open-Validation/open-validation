reference: town-centre-impact-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: A main town centre use not in an existing centre.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with an up-to-date development plan.
    - all:
      - condition:
          field: settlement-boundary
          value: Lichfield City
          description: Within Lichfield City.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1000
          description: Retail and leisure over 1,000 sq m gross.
    - all:
      - condition:
          field: settlement-boundary
          value: Burntwood
          description: Within Burntwood.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: Retail and leisure over 500 sq m gross.
    - all:
      - site:
          in:
          - town-centre
          - local-centre
          description: In any other centre.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 100
          description: Retail and leisure over 100 sq m gross.
    - all:
      - condition:
          field: departure-from-development-plan
          value: true
          description: In an existing centre, not in accordance with the development plan.
      - discretionary
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF paragraphs 86-89; NPPG; Lichfield Local Plan Strategy 2008-2029 policy E1
source-text: A Sequential Assessment (para 86 of the NPPF) is required for planning applications for main
  town centres uses that are not in an existing centre and are not in accordance with an up to date development
  plan.. An assessment addressing the impacts in paragraph 89 is required for all planning applications
  for retail and leisure developments over 1,000 square metres gross floorspace within Lichfield City;
  over 500 sqm gross floorspace within Burntwood; and over 100sqm gross floor space in any other centre.
  An impact assessment will also be required for applications in an existing ... centre, not in accordance
  with the development plan and which would substantially increase the attraction of the centre to an
  extent that the development could impact on other centres.
must-include:
- item: 'Sequential assessment: whether sequentially preferable sites exist, and why they are not practical
    in terms of availability, suitability and viability'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in an existing centre.
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
- item: Impact on town centre vitality and viability, including local consumer choice and trade in the
    centre and wider area, up to five years from the application (ten years for major schemes whose impact
    will not be realised in five)
  level: must
- item: Impact on allocated sites outside town centres
  level: must
- item: Impact on in-centre trade/turnover and trade in the wider area
  level: must
- item: Current and future consumer expenditure capacity in the catchment
  level: must
- item: Whether the proposal is of an appropriate scale
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 23-24. The list''s Evidence to accompany
  applications for town centre uses / retail impact assessments, covering both the sequential and impact
  assessments. Application types follow the validation matrix on the last page of the list, where this
  document is marked ''C'' (conditional: dependent on site and application context). An impact assessment
  for a scheme in an existing centre that would ''substantially increase'' its attraction shows as ''check''.'
review-status: unverified
field-status: {}
