reference: affordable-housing-statement
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - s73
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Residential development of 15 units or more.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Developer Contributions SPD
source-text: Residential developments of 15 Units (excluding Outline applications) or over unless Affordable
  Housing would render scheme unviable – A Planning Statement will be required if this is the case justifying
  in detail why unviable.
must-include:
- item: Number of affordable units
  level: must
- item: Mix of units, including number of bedrooms
  level: must
- item: Floor space of the units
  level: must
- item: Location of the units within the site
  level: must
- item: Tenure
  level: must
- item: Any Registered Social Landlords acting as partners in the development
  level: must
confidence: medium
notes: From the council's list (published March 2023), page 22. The matrix also marks outline applications
  'C', but the text excludes them, so outline is left out. Where affordable housing would make the scheme
  unviable, a planning statement justifying this in detail is needed instead.
review-status: unverified
field-status: {}
