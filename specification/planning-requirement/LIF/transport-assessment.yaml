reference: transport-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - s73
  - any:
    - discretionary
    - condition:
        field: affects-public-right-of-way
        value: true
        description: Likely to have Public Right of Way implications.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: 'NPPF; Manual for Streets; Circular 02/2013: The strategic road network and the delivery of sustainable
  development'
source-text: All applications likely to generate very significant traffic movements associated with developments
  above set thresholds. All applications likely to have Public Right of Way implications.
must-include:
- item: Accessibility to the site by all modes of transport, including likely modal shift
  level: must
- item: Measures to improve access by public transport, walking and cycling, to reduce the need for parking
  level: must
- item: Any necessary highway mitigation works
  level: must
- item: A completed Transport Assessment Verification form
  level: should
- item: 'Where work is needed within the Strategic Highway Network boundary: an agreed Stage 1 Road Safety
    Audit, a Non-Motorised User Audit and confirmation from National Highways'
  level: must
  required-if:
    condition:
      field: affects-trunk-road
      value: true
      description: Requires work within the Strategic Highway Network boundary.
confidence: medium
notes: 'From the council''s list (published March 2023), page 12. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). The traffic thresholds are not given in the list (it points to DfT guidance),
  so that part shows as ''check''.'
review-status: unverified
field-status: {}
