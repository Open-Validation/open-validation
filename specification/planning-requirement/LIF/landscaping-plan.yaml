reference: landscaping-plan
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - any:
    - all:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
      - condition:
          field: involves-change-of-use
          value: false
          description: Not a change of use.
    - site:
        in:
        - listed-building-setting
        - conservation-area
        - park-and-garden
        - scheduled-monument
        description: Affects the setting of a designated heritage asset.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Lichfield Local Plan Strategy 2008-2029 policies NR4 and BE1; Trees, Landscape and
  Development SPD
source-text: All applications (excluding Householder, Listed Building Consent, Advertisements and Change
  of Use) plus where a development effects the setting of a designated heritage asset, ... should be accompanied
  by hard and soft landscaping details.
must-include:
- item: Hard and soft landscaping details
  level: must
- item: Drawn to an appropriate scale (usually 1:100 or 1:200)
  level: should
- item: Proposed species, height at planting, spacing and densities
  level: should
- item: Measures for the ongoing protection and maintenance of the landscaping
  level: should
confidence: medium
notes: 'From the council''s list (published March 2023), page 8-9. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). The text excludes householder, listed building consent, advertisement
  and change of use applications unless the setting of a designated heritage asset is affected, so householder
  applications appear only in that case.'
review-status: unverified
field-status: {}
