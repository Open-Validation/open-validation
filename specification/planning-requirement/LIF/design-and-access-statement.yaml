reference: design-and-access-statement
local-authority: LIF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more new dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A new building or buildings with 100 sq m of new floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Section 42 of the Planning and Compulsory Purchase Act 2004; Article 9, Town and Country Planning
  (Development Management Procedure) (England) Order 2015; NPPF; NPPG
source-text: 'Applicants are advised to refer to Article 9 of the Development Management Procedure Order
  for full details but, in summary, a DAS is statutorily required for an application for Planning permission
  for: • All major development; • Provision of new dwellings in a conservation area; or • Provision of
  a new building or buildings in a conservation area where 100 sqm of new floor space is being provided.
  Applications for waste development, a material change of use, engineering or mining operations or S73
  applications do not need to be accompanied by a DAS. A DAS is also required as part of all applications
  affecting listed buildings'
must-include:
- item: The design principles and concepts applied, and how access issues have been dealt with
  level: must
- item: The amount of development, layout, scale, landscaping and appearance
  level: must
- item: Prevention of crime
  level: must
- item: A detailed explanation of how climate change mitigation and adaptation measures have been considered
    in the design
  level: must
- item: An appraisal of the site's context and how the design takes account of it
  level: must
- item: The approach to all forms of access, how relevant Local Plan Strategy policies have been taken
    into account, any consultation on access and how it informed the proposal
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'For outline applications: the principles of design and access, the use, amount of development,
    scale parameters, indicative layout and access points'
  level: should
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: 'From the council''s list (published March 2023), page 3. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context) (and ''R'' for listed building consent). Waste development, material changes
  of use, engineering or mining operations and S73 applications don''t need one.'
review-status: unverified
field-status: {}
