reference: design-and-access-statement
local-authority: LIF
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: The proposal creates a new building of more than 100 square metres.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted generic national text. From the audit: all major development,
  new dwellings or new buildings over 100 sq m in conservation areas, and listed building applications.'
review-status: unverified
field-status: {}
