reference: flood-risk-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - prior-approval
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more in Flood Zone 1.
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Flood and Water Management Act 2010; NPPF; NPPG; Lichfield Local Plan Strategy 2008-2029 Core
  Policy 3
source-text: In Flood zone 1 (Low Probability) any development site of 1 hectare of above will require
  a Flood Risk Assessment. All Developments in Flood zones 2 and 3 must be accompanied by a Flood Risk
  Assessment. (i) a Flood Risk Assessment, (ii) sufficient information for the Local Planning Authority
  to undertake the Sequential and where appropriate the Exceptions Test*.
must-include:
- item: Sufficient information for the council to apply the Sequential Test and, where appropriate, the
    Exception Test
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
- item: Undertaken by a suitably qualified professional, proportionate to the risk and the scale, nature
    and location of the development
  level: should
- item: Supported by appropriate data, including historical information on previous flood events
  level: should
confidence: medium
notes: 'From the council''s list (published March 2023), page 8. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context).'
review-status: unverified
field-status: {}
