reference: viability-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Cannot provide the full range of Section 106 requirements (including affordable housing)
        due to viability.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; RICS Guide to Planning and Viability (GN 94/2012)
source-text: Where an applicant is proposing that they cannot provide the full range of Section 106 requirements
  (including affordable housing), due to financial viability issues.
must-include:
- item: A viability assessment as described in Appendix C of the RICS Guide to Planning and Viability
    (GN 94/2012)
  level: must
- item: 'An accompanying report with: executive summary; contents; introduction and background; site location;
    planning policy context; scheme description; market information summary; build cost and programme;
    methodology and approach; outputs and results; sensitivity analysis; concluding statement'
  level: must
confidence: medium
notes: 'From the council''s list (published March 2023), page 26. Application types follow the validation
  matrix on the last page of the list, where this document is marked ''C'' (conditional: dependent on
  site and application context). The applicant pays for any independent advice the council seeks on the
  assessment.'
review-status: unverified
field-status: {}
