reference: recreation-facilities-assessment
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - open-space
        description: Within an existing area of Public Open Space.
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
    - condition:
        field: affects-playing-field
        value: true
        description: Affects playing fields.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Developer Contributions SPD
source-text: This is required for submission with any development proposals within an existing area of
  Public Open Space or for new major residential development. ... For new developments which affect playing
  fields.
must-include:
- item: 'For development on existing Public Open Space: an independent assessment showing the land or
    buildings are surplus to local requirements'
  level: must
  required-if:
    site:
      in:
      - open-space
      description: On existing Public Open Space.
- item: 'For development within existing open spaces: plans showing existing or proposed open space within
    or next to the site'
  level: must
  required-if:
    site:
      in:
      - open-space
      description: Within existing open space.
- item: 'Where open space is provided on site or in kind: a maintenance specification, and how it will
    be installed and maintained to that specification for at least 10 years'
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: Open space or facilities provided on site or in kind.
- item: 'For playing fields: the size of the playing field and the area affected'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing fields.
- item: 'For playing fields: an existing site plan to a recognised scale showing the winter and summer
    pitch layout'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing fields.
- item: 'For playing fields: the sports currently played and the use of the site'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing fields.
- item: 'For playing fields: a proposed site plan showing how new buildings and works affect the pitch
    layout'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing fields.
- item: 'For playing fields: information on any alternative sport and recreational provision'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing fields.
confidence: medium
notes: 'From the council''s list (published March 2023), page 9. Combines the list''s Open Space Assessment
  and Playing Fields Assessment. Application types follow the validation matrix on the last page of the
  list, where this document is marked ''C'' (conditional: dependent on site and application context) (playing
  fields: full and outline only).'
review-status: unverified
field-status: {}
