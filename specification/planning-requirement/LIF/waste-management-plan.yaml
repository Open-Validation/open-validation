reference: waste-management-plan
local-authority: LIF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - application-type:
      in:
      - pa-demo-building
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: Site Waste Management Plan Regulations 2008; NPPF; Staffordshire County Council Waste Local Plan
source-text: Refuse collection All applications for major housing and commercial developments. ... a)
  Waste Audit – strategic major applications (i.e. 50 dwellings or more, or 10,000sq.m. commercial floorspace)
  b) Site Waste Management Plan (SWMP) – strategic major applications (i.e. 50 dwellings or more, or 10,000sq.m.
  commercial floorspace) and demolition notification applications.
must-include:
- item: Areas and facilities for the commercial and domestic waste likely to arise from the development
  level: must
  required-if:
    ref: major-development
- item: 'Waste Audit and Site Waste Management Plan covering: waste from construction, demolition and
    excavation; waste once operational; use of recycled and renewable materials; in-house storage, recycling,
    treatment and disposal; access for collection; energy recovery from waste where feasible'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 'Strategic major: 50 dwellings or more.'
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 10000
        description: 'Strategic major: 10,000 sq m or more of commercial floorspace.'
    - application-type:
        in:
        - pa-demo-building
- item: A copy of the latest Site Waste Management Plan for the site, or a statement explaining why it
    cannot be provided
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 'Strategic major: 50 dwellings or more.'
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 10000
        description: 'Strategic major: 10,000 sq m or more of commercial floorspace.'
    - application-type:
        in:
        - pa-demo-building
confidence: medium
notes: 'From the council''s list (published March 2023), page 17-18, 21. Combines the refuse collection
  part of the list''s Ventilation / Extraction Details / Refuse collection (page 17-18) with the Waste
  Audit / Site Waste Management Plan (page 21). Application types follow the validation matrix (refuse:
  full and reserved matters; SWMP: full and outline), plus prior notification for demolition from the
  text.'
review-status: unverified
field-status: {}
