reference: arboriculturist-report
local-authority: LIF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - s73
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Semi-mature, mature or protected trees or hedgerows on the site, or off-site trees
          (including street trees) within 15 metres, whether retained or removed.
    - site:
        in:
        - tree-preservation-zone
        description: A Tree Preservation Order on the site.
    - site:
        in:
        - conservation-area
        description: In a conservation area.
source-url: https://www.lichfielddc.gov.uk/downloads/file/1682/local-planning-validation-guidance
policy: NPPF; NPPG; Lichfield Local Plan Strategy 2008-2029 policy NR4; Trees, Landscape and Development
  SPD; BS 5837:2012
source-text: All applications (excluding Advertisements and Change of Use) where there are semi- mature
  / mature trees /protected trees or hedgerows within the site and/or or off-site trees within 15metres
  of the application site (including street trees) irrespective of whether the trees are to be removed
  or retained. All sites where there is a Tree Preservation Order or any proposals within a Conservation
  Area.
must-include:
- item: Tree survey and plan as specified in BS 5837:2012
  level: must
- item: Which trees are to be retained and which removed
  level: must
- item: Extent and location of root protection areas
  level: must
- item: Arboricultural Impact Assessment
  level: must
- item: How retained trees will be protected during construction
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: should
confidence: medium
notes: 'From the council''s list (published March 2023), page 11. The list''s Tree Survey / Arboricultural
  Impact Assessment. Application types follow the validation matrix on the last page of the list, where
  this document is marked ''C'' (conditional: dependent on site and application context).'
review-status: unverified
field-status: {}
