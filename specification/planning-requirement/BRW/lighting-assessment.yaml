reference: lighting-assessment
local-authority: BRW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
  - condition:
      field: floodlighting
      value: true
      description: The proposal incorporates external flood lighting.
source-url: https://www.brentwood.gov.uk/media/829
source-text: 'Lighting Assessment – Requirement: All applications, except householder, where it is proposed
  to incorporate external flood lighting'
must-include:
- item: Proposed hours when the lighting would be switched on
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Schedule of the equipment in the design
  level: must
confidence: low
notes: 'Audit (wrong_app_type): the workbook placed it under Householder, which the list excludes. ''Except
  householder'' is shown as a list of application types.'
review-status: unverified
field-status: {}
