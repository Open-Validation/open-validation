reference: affordable-housing-statement
local-authority: BRW
required-if: discretionary
source-url: https://www.brentwood.gov.uk/media/829
source-text: 'Affordable Housing Statement – Requirement: Residential units, see below for fuller explanation
  Where local plan policies require the provision of affordable housing, the local planning authority
  will require information concerning both the affordable housing and any market housing, for example:
  the numbers of residential units, the mix of units with numbers of bedrooms and plans showing the location
  of units and their number of habitable rooms and/or bedrooms.'
must-include:
- item: The numbers of residential units
  level: must
- item: The mix of units with numbers of bedrooms
  level: must
- item: Plans showing the location of units and their number of habitable rooms and/or bedrooms
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Needed where local
  plan policies require affordable housing; covers both the affordable and any market housing.
