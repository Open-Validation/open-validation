reference: landscaping-plan
local-authority: MRT
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Construction of new buildings or extensions to existing buildings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of one or more dwellings.
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policies G6 and G7; Merton Local Plan 2024 policies D12.2, D12.3, D12.11 and
  O15.4
source-text: Landscaping schemes are required for applications involving the construction of new buildings,
  extensions to existing buildings, or comprising a dwelling or dwellings, or other developments where
  landscaping enhances the proposed scheme.
must-include:
- item: The proposed landscaping scheme, including the extent of hard and soft landscaping features and
    existing and proposed trees
  level: must
- item: Species, specification and proposed maintenance of new planting, and why the species suit the
    location in height and spread
  level: must
- item: 'Where landscaping is above a basement: a cross section showing at least 1 metre of naturally
    draining permeable soil and a minimum 200 mm drainage layer'
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: Landscaping above a basement.
confidence: medium
notes: From the council's list (December 2024, updated June 2026), items 48 (Landscaping Schemes / Tree
  survey / Arboricultural) and 5 (Plans and Drawings), point 10, page 9, 28-29. 'Other developments where
  landscaping enhances the proposed scheme' shows as discretionary.
review-status: unverified
field-status: {}
