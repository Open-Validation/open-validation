reference: design-and-access-statement
local-authority: MRT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: Over 100 sq m non-residential.
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 sq m or more of floor space.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Merton Local Plan 2024 policies D12.3 and D12.4 and relevant site allocations
source-text: 1. All applications for Major development or; 2. All Listed Building Consent applications
  or; 3. If over 100m2 non- residential or; 4. Applications for one or more dwelling houses in a Conservation
  Area; 5. Applications for the provision of a building / buildings where the floor space created by the
  development is 100 square metres or more within a Conservation Area. 6. This does not apply to applications
  for planning permission to amend conditions, extend the time limit for implementation, for reserved
  matters applications, for engineering or mining operations, for a material change of use, or for waste
  development.
must-include:
- item: Explains, with visual aids, the design thinking behind the development and why it is a suitable
    response to the site and its setting
  level: must
- item: Demonstrates the development can be adequately accessed by prospective users
  level: must
- item: Uses Merton's Small Sites Toolkit template DAS where applicable
  level: should
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 6 (Design & Access Statement),
  page 10-11. Not needed for applications to amend conditions, extend time limits, reserved matters, engineering
  or mining operations, material change of use or waste development.
review-status: unverified
field-status: {}
