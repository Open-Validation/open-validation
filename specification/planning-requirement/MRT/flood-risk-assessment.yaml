reference: flood-risk-assessment
local-authority: MRT
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site in Flood Zone 1 greater than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site in Flood Zone 1 greater than 1 hectare.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 area with critical drainage problems (CDA).
  - site:
      in:
      - surface-water-flood-risk
      description: Evidence of risk from other sources of flooding, including surface water.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use that increases the flood vulnerability of the development (NPPF).
    - discretionary
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: NPPF; Merton Local Plan 2024 policies F15.7, F15.8 and F15.9; Merton Strategic Flood Risk Assessment
source-text: 'In accordance with the National Planning Policy Framework (NPPF), a site-specific FRA must
  be produced to support applications for development proposals in flood risk areas. The NPPF states that
  a site-specific FRA is required to accompany a planning application for a site: a. within Flood Zones
  2 or 3, or b. where the site lies within Flood Zone 1 and is greater than 1 hectare in area, or, c.
  in an area in Flood Zone 1 which has critical drainage problems (CDA) or evidence of risk from other
  sources of flooding including surface water, groundwater, sewer flooding, ordinary watercourse/s or
  d. where a change of use of land or buildings increases the flood vulnerability of the development,
  as defined by the NPPF, where it may be subject to other sources of flooding.'
must-include:
- item: An accurate assessment of the level of flood risk, showing the land use is suitable, will not
    increase flood risk on or off site and is resilient to climate change
  level: must
- item: The latest flood map and modelling evidence
  level: must
- item: How the development will be designed to cope with flooding and how the risk will be mitigated
    without increasing it elsewhere
  level: must
- item: 'In areas of flood risk: a flood warning and evacuation plan, prepared with advice from the emergency
    services and Merton''s Emergency Planning team'
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Within Flood Zone 2 or 3.
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 27 (Flood Risk Assessment), page
  19-20. Groundwater, sewer and ordinary watercourse flooding have no field yet, and a vulnerability-increasing
  change of use depends on the NPPF tables, so those show as discretionary.
review-status: unverified
field-status: {}
