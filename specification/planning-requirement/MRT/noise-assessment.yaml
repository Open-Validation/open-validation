reference: noise-assessment
local-authority: MRT
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential and other noise sensitive development close to existing sources of noise.
  - condition:
      field: noise-generating-use
      value: true
      description: Noise generating uses that raise noise disturbance issues to existing buildings.
  - condition:
      field: plant-equipment
      value: true
      description: Installation of flues, air conditioning, plant, extraction etc.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policy D14; Merton Local Plan 2024 policy P15.10
source-text: Proposals for residential and other noise sensitive development close to existing sources
  of noise; noise generating uses that raise noise disturbance issues to existing buildings; applications
  which involve installation of flues, air conditioning, plant, extraction etc.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Noise Exposure Categories and the resulting impact
  level: must
- item: Mitigation measures, including layout, design and insulation
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 50 (Acoustic Assessment and/or
  Acoustic Design Statement), page 31.
review-status: unverified
field-status: {}
