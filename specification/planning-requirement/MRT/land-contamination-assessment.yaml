reference: land-contamination-assessment
local-authority: MRT
required-if:
  all:
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use to residential.
  - site:
      in:
      - contaminated-land
      description: Within 50m of a potential contaminated land site.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Merton Local Plan 2024 policy P15.10
source-text: Schemes where there is a change of use to residential, if within 50m of a potential contaminated
  land site
must-include:
- item: An environmental risk assessment of the potential for contamination, associated risks and the
    potential for the site to be designated as contaminated land
  level: must
- item: Site inspection scope
  level: must
- item: Review of historical land use
  level: must
- item: Review of environmental setting
  level: must
- item: Consultation with relevant regulatory authorities
  level: must
- item: Qualitative environmental risk assessment
  level: must
- item: Review of existing relevant reports
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 56 (Land Contamination Assessment),
  page 33. The change of use condition means a change of use to residential.
review-status: unverified
field-status: {}
