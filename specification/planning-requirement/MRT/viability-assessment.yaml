reference: viability-assessment
local-authority: MRT
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: The proposal does not include policy compliant affordable housing provision/payments
      and this is justified on viability grounds.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Merton Local Plan 2024 policies H11.1, H11.2, H11.4, H11.5 and H11.7
source-text: If proposal does not include policy compliant provision/ payments and this being justified
  on viability grounds
must-include:
- item: Shows affordable housing provision has been maximised as far as is viable
  level: must
- item: Full public disclosure of the financial information, unless withholding it meets the FOIA or EIR
    tests (shown at submission)
  level: must
- item: Written confirmation that the agent will fund independent assessment by the council's viability
    consultants, including a costs review if necessary
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 31 (Viability Report), page 22-23.
review-status: unverified
field-status: {}
