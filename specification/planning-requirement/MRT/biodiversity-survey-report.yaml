reference: biodiversity-survey-report
local-authority: MRT
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Likely to have an impact on protected species (including through floodlighting or external
        lighting).
  - site:
      in:
      - priority-habitat
      description: Likely to have an impact on priority habitats.
  - site:
      in:
      - local-wildlife-site
      description: Likely to have an impact on Sites of Recognised Nature Conservation Interest.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Merton Local Plan 2024 policies O15.1 and O15.3
source-text: Development proposals, including those that include floodlighting / external lighting, that
  are likely to have an impact on protected species, priority habitats or Sites of Recognised Nature Conservation
  Interest (refer to Local Plan Policy O15.3).
must-include:
- item: A Preliminary Ecological Appraisal informed by data from GiGL (Greenspace Information for Greater
    London)
  level: must
- item: Justified survey methodology and times; the report adheres to CIEEM guidance and BS 42020
  level: must
- item: Mitigation and/or enhancement measures responding to the current proposals, including external
    lighting details
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 9 (Preliminary Ecological Appraisal),
  page 12. Survey scope is usually agreed at pre-application stage.
review-status: unverified
field-status: {}
