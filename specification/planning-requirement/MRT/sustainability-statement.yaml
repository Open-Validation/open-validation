reference: sustainability-statement
local-authority: MRT
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Major schemes of 1,000 sq m or more non-residential gross internal floor space (new
        build, conversion and change of use).
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Major conversion and change of use developments.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Creating 10 or more dwellings.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policies SI 2 and SI 3; Merton Local Plan 2024 policies CC2.1 to CC2.6
source-text: 2. All major schemes of 1,000sqm or more non-residential gross internal floor space (new
  build, conversion and change of use). 3. All major conversion and change of use developments resulting
  in the creation of 10 or more dwellings.
must-include:
- item: A BREEAM pre-assessment showing the scheme achieves BREEAM 'Excellent' or equivalent
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 43 (BREEAM Pre-Assessment), page
  26-27.
review-status: unverified
field-status: {}
