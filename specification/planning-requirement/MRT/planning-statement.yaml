reference: planning-statement
local-authority: MRT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of one or more dwellings.
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; NPPF; London
  Plan 2021; Merton Local Plan 2024
source-text: 1. All Major development applications, Major change of use applications or listed building
  applications. 2. Creation of one or more new dwellings 3. Encouraged for other developments as appropriate
  to cover issues not covered by Design & Access statement; may incorporate statement of community involvement.
must-include:
- item: The context and need for the proposed development
  level: must
- item: An assessment of how the development complies with relevant national, regional and local planning
    policies, such as a justification for a change of use or demolition
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 11 (Supporting Planning Statement),
  page 13. Other developments are only 'encouraged', shown as discretionary.
review-status: unverified
field-status: {}
