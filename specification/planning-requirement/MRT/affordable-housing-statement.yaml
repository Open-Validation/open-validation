reference: affordable-housing-statement
local-authority: MRT
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: Schemes capable of 10 or more units (including former employment sites).
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Merton Local Plan 2024 policies H11.1, H11.2, H11.4, H11.5 and H11.7
source-text: 1. All schemes capable of 10 or more units 2. All former employment sites and schemes capable
  of 10 or more units
must-include:
- item: The proposed mix of private and affordable units by affordable housing tenure, with numbers of
    habitable rooms, bedrooms and the floor space of habitable areas
  level: must
- item: The location of each affordable unit (with tenure) and its habitable rooms, bedrooms and floor
    space, shown on the proposed floor plans
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 30 (Affordable Housing Statement),
  page 22. It can be part of the Planning Statement.
