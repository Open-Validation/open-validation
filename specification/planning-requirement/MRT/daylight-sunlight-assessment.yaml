reference: daylight-sunlight-assessment
local-authority: MRT
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policies D6 and D9; Merton Local Plan 2024 policy D12.1; BRE Guidelines on daylight
  and sunlight
source-text: 1. All Major development or; 2. Creation of new dwellings and development that has potential
  to impact on existing daylight/sunlight.
must-include:
- item: An overshadowing study with shadow diagrams at hourly intervals at different times of the year,
    existing and proposed
  level: must
- item: A daylight and sunlight assessment where the proposal includes single aspect units
  level: must
  required-if: discretionary
- item: An assessment of Vertical Sky Component (VSC) and Average Daylight Factor (ADF)
  level: must
- item: Undertaken by a suitably qualified professional using the BRE Guidelines criteria
  level: must
- item: Relevant diagrams and a non-technical summary of the conclusions
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 54 (Daylight / Sunlight Assessment),
  page 32-33. The second trigger reads 'creation of new dwellings and development that has potential to
  impact on existing daylight/sunlight'; because it turns on potential impact it shows as discretionary.
review-status: unverified
field-status: {}
