reference: floor-plan-proposed
local-authority: MRT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of one or more dwellings.
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015; Mayor of London's Housing Design Standards LPG; Merton Local Plan 2024 policy D12.6
source-text: All Applications (Other plans and drawings and information needed to describe the development.)
must-include:
- item: Proposed floorspace areas, broken down into relevant use classes (residential or commercial)
  level: must
- item: A 45 degree line from the nearest window of a habitable room to the proposed development
  level: must
- item: 'For residential accommodation: fully furnished internal floorplans for every dwelling type, at
    a scale of at least 1:100'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal includes residential accommodation.
  source-text: Proposals that include residential accommodation should include fully furnished internal
    floorplans for every dwelling type proposed, at a scale of at least 1:100
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 5 (Plans and Drawings), page 7-9.
  Item 5 asks every application for the plans and drawings 'needed to describe the development' without
  saying when each type is needed, so the trigger shows as discretionary. Proposals with residential accommodation
  need furnished floorplans.
review-status: unverified
field-status: {}
