reference: archaeological-assessment
local-authority: MRT
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: The site is in an Archaeological Priority Area.
  - site:
      in:
      - scheduled-monument
      description: The site is near a scheduled monument.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.4
      description: The site is 0.4 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 0.4
      description: The site is 0.4 hectares or more.
  - condition:
      field: eia-development
      value: true
      description: The development is EIA development.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
confidence: medium
notes: 'From the audit (missing_requirement): item 49 Archaeological Statement/Evaluation, for APAs, sites
  near scheduled monuments, sites of 0.4ha+ and EIA development.'
review-status: unverified
field-status: {}
