reference: archaeological-assessment
local-authority: MRT
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: A site in an archaeological priority area.
    - condition:
        field: ground-disturbance
        value: true
        description: Proposed works could affect archaeological remains below ground level.
  - site:
      in:
      - scheduled-monument
      description: On or near a Scheduled Ancient Monument.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.4
      description: Site of 0.4 hectares or larger not in a priority area.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 0.4
      description: Site of 0.4 hectares or larger not in a priority area.
  - condition:
      field: eia-development
      value: true
      description: Applications for a scoping opinion for EIA, supported EIA or Environmental Statement.
  - all:
    - site:
        in:
        - listed-building
        - locally-listed-building
        - park-and-garden
        description: Buildings, parks or gardens of historic interest.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition is proposed.
      - condition:
          field: structural-alteration
          value: true
          description: Significant alteration is proposed.
  - all:
    - application-type:
        in:
        - approval-condition
    - discretionary
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policy HC1; Merton Local Plan 2024 policy D12.5; Historic England Planning Advice
source-text: 1. A site in an archaeological priority area where proposed works could affect archaeological
  remains below ground level, 2. All sites on or near a Scheduled Ancient Monument, 3. All sites of 0.4
  hectares or larger not in a priority area, 4. All applications for a scoping opinion for an Environmental
  Impact Assessment, supported EIA, or Environmental Statement, 5. All applications where supported by
  an archaeological desk- based assessment as part of a design and access statement, 6. Buildings, parks
  or gardens of historic interest for which demolition or significant alteration is proposed, 7. All submissions
  to discharge archaeological or recording conditions, 8. Appeals.
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 49 (Archaeological Statement /
  Evaluation report), page 30-31. It can be within a Heritage Statement. Discharging archaeological or
  recording conditions, and applications already supported by a desk-based assessment in the DAS, show
  as discretionary; appeals are outside this model.
review-status: unverified
field-status: {}
