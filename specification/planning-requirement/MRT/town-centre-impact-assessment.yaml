reference: town-centre-impact-assessment
local-authority: MRT
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses proposed not in an existing centre and not in accordance with an
      up to date Local Plan.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policies SD7 and E9; Merton Local Plan 2024 policy TC13.6
source-text: 1. Proposals for new, or extensions to existing retail floorspace located edge or out of
  town centre or not in accordance with the Local Plan where the net new retail floorspace is 280m2 and
  over. 2. Proposals for new or extensions to existing office and leisure floorspace located out of town
  centres or not in accordance with the Local Plan where the new floorspace is 2,500sqm gross or more)
  3. A sequential test is required where main town centre uses are proposed not in an existing centre
  and not in accordance with an up to date Local Plan.
must-include:
- item: A sequential test
  level: must
- item: The impact on the vitality and viability of any nearby centre
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 280
        description: Net new retail floorspace of 280 sq m and over, edge or out of centre.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: New office and leisure floorspace of 2,500 sq m gross or more, out of centre.
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 33 (Retail Impact Assessment,
  including Sequential Test), page 23-24.
review-status: unverified
field-status: {}
