submission-standards:
- item: Every drawing has a drawing title and drawing number, an identified metric scale, a relevant scale
    bar, key dimensions in metric units (width, height, length, area) and a north arrow
  level: must
- item: Existing and proposed drawings showing the same aspect are at a similar scale, to allow comparison
  level: should
- item: All plans and documents carry an individual reference with version number and date of production;
    amended plans follow the same format
  level: should
- item: File names describe the contents clearly and accurately in plain English
  level: must
- item: Every drawing's file name begins with the word 'Drawing' (e.g. 'Drawing - Site Location Plan');
    other documents simply state their title
  level: must
- item: On the Planning Portal, the closest relevant 'document type' is selected and the 'document description'
    matches the file name
  level: must
