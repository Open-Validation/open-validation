reference: arboriculturist-report
local-authority: MRT
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site or on land adjacent to it (including street trees) that could
        influence or be affected by the development.
  - site:
      in:
      - tree-preservation-zone
      description: Significant or protected (TPO) trees on or adjacent to the site impacted by the development.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policies G6 and G7; Merton Local Plan 2024 policies D12.2, D12.3, D12.11 and
  O15.4; BS5837
source-text: 2. Where there are trees within the application site or on land adjacent to it that could
  influence or be affected by the development (including street trees), information will be required on
  which trees are to be retained and on the means of protecting these trees during demolition and construction
  works. 3. Where there are significant or protected trees (Tree Preservation Order) on or adjacent to
  the site, which will either by (directly or indirectly) impacted by the development or its demolition
  or construction.
must-include:
- item: A tree survey (BS5837)
  level: must
- item: A topographical survey
  level: must
- item: A tree constraints plan
  level: must
- item: An arboricultural impact assessment
  level: must
- item: An arboricultural method statement including a tree protection plan
  level: must
- item: Trees and vegetation that have been or will be removed to facilitate the development
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 48 (Landscaping Schemes / Tree
  survey / Arboricultural Statement / AIA and AMS), page 28-30.
review-status: unverified
field-status: {}
