reference: cil-form
local-authority: MRT
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Construction of new buildings or extensions to existing buildings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of one or more dwellings.
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: Applications involving the construction of new buildings, extensions to existing buildings,
  or comprising a dwelling or dwellings. All applications for development that may potentially be CIL
  liable
must-include:
- item: 'CIL Form 1: CIL Additional Information, with plans'
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 57 (Community Infrastructure Levy),
  page 33. 'Development that may potentially be CIL liable' shows as discretionary.
review-status: unverified
field-status: {}
