reference: site-plan
local-authority: MRT
required-if:
  always: true
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015; Merton Local Plan 2024 policy D12.5
source-text: All Applications
must-include:
- item: Block plan / site survey plan at a scale of 1:100 showing site boundaries and existing and proposed
    features (roads, parking areas, footpaths, landscaping, walls, fences, trees, buildings and other
    structures)
  level: must
  source-text: Block plan / Site survey plan (at a scale of 1:100) showing any site boundaries and existing
    and proposed features e.g. roads, parking areas, footpaths, landscaping, walls, fences, trees, buildings
    and other structures.
- item: 'For permission in principle: block/site layout plan at 1:200 or 1:500 with a scale bar, showing
    the development in relation to the site boundaries and other buildings, any trees, any protected species
    habitats, any public rights of way affected, and access points with proposed parking'
  level: must
  required-if:
    application-type:
      in:
      - pip
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 5 (Plans and Drawings), point
  3, and Permission in Principle, page 3, 8.
review-status: unverified
field-status: {}
