reference: location-plan
local-authority: MRT
required-if:
  always: true
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All Applications (A plan identifying the site is not required for non- material amendments
  and discharge of condition applications)
must-include:
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: Shows the direction of North and enough roads and/or buildings on adjoining land to make the exact
    location clear
  level: must
- item: Application site outlined in red, including all land needed for the development and the means
    of access to the public highway
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, outlined in blue
  level: must
- item: 'For permission in principle: at 1:1250, with at least 2 named roads and neighbouring properties
    or adequate context'
  level: must
  required-if:
    application-type:
      in:
      - pip
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 4 (Location Plan) and Permission
  in Principle, page 3, 6-7. Not required for non-material amendments and discharge of condition applications.
review-status: unverified
field-status: {}
