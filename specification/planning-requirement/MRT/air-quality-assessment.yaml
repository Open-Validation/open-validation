reference: air-quality-assessment
local-authority: MRT
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Merton Local Plan 2024 policy P15.10; Merton Air Quality SPD 2021
source-text: 1. All Major development or; 2. Any development that could have a significant impact on air
  quality (directly or indirectly)
must-include:
- item: How a residential scheme (or other sensitive uses) will be accommodated in an area of particularly
    significant air quality
  level: must
- item: An impacts assessment allowing full consideration of the impact of the proposal on the air quality
    of the area
  level: must
- item: How the proposals will reduce the impact on air quality during construction and demolition
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 52 (Air Quality Assessment), page
  32. Merton is within an Air Quality Management Area. 'Significant impact on air quality' shows as discretionary.
  The Air Quality Neutral statement asked for all development (item 53) is listed with the unmapped requirements.
review-status: unverified
field-status: {}
