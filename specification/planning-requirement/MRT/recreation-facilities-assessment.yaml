- item: Refers to the Merton Green Infrastructure Study 2020, Playing Pitch Strategy 2019 or Indoor Sports
    Facility Study 2020
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 46 (Playing fields and sport facilities
  assessment), page 27-28. The Open Space Assessment for Metropolitan Open Land and designated open space
  (item 45) is listed with the unmapped requirements.
