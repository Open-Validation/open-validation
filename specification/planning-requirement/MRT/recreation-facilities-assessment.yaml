reference: recreation-facilities-assessment
local-authority: MRT
required-if:
  site:
    in:
    - open-space
    description: Development proposals that affect sport and recreation facilities.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policy S5; Merton Local Plan 2024 policies IN14.3 and O15.2; Merton Playing Pitch
  Strategy 2019
source-text: Development proposals that affect sport and recreation facilities.
must-include:
- item: The impacts of the proposals on the capacity and demand for sport and recreation facilities
  level: must
- item: 'Where playing pitches are affected: the matters raised in Sport England guidance'
  level: must
