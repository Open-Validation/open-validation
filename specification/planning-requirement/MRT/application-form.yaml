reference: application-form
local-authority: MRT
required-if:
  always: true
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Town and Country Planning Act 1990; Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: All Applications
must-include:
- item: The completed application forms with all relevant certificates, signed and dated
  level: must
- item: The completed ownership certificate (A, B, C or D) under Article 13 of the DMPO, with Notice 1
    (Certificate B or C, or an agricultural holdings certificate) or Notice 2 (Certificate C or D) as
    needed; not needed for lawful development certificates, advertisement consent, prior notifications,
    reserved matters, s96a and discharge of conditions
  level: must
  source-text: Required - all applications except for Lawful Development Certificates, Advertisement Consent,
    Prior Notifications, Reserved Matters, s96a and Discharge of Conditions.
- item: 'For permission in principle: a completed application form, submitted via the Planning Portal
    or by post'
  level: must
  required-if:
    application-type:
      in:
      - pip
confidence: medium
notes: From the council's list (December 2024, updated June 2026), items 1 (Application Forms) and 3 (Ownership
  Certificate), and Permission in Principle, page 3, 5-6. The fee (item 2) must also be correct; fee concessions
  for disabled access need evidence.
review-status: unverified
field-status: {}
