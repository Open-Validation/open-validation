reference: construction-management-plan
local-authority: MRT
required-if:
  any:
  - condition:
      field: structural-demolition
      value: true
      description: Substantial demolition/excavation works proposed.
  - discretionary
  - condition:
      field: basement
      value: true
      description: Schemes including basements or subterranean development (Construction Traffic Management
        Plan).
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policy T4; Merton Local Plan 2024 policy D12.11; TfL Construction Logistics Plans
  Guidance; GLA Control of Dust and Emissions during Construction
source-text: 1. If substantial demolition/excavation works proposed 2. Sites in confined locations or
  near sensitive receptors. 3. All developments that will have an impact on the road network and surrounding
  community ... All schemes including basements or subterranean development
must-include:
- item: 'For basements: a Construction Traffic Management Plan showing that traffic and construction activity
    will not cause unacceptable harm to pedestrian, cyclist, vehicular and road safety (see Merton''s
    Basement and Subterranean Planning Guidance SPD)'
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: Basement or subterranean development.
confidence: medium
notes: From the council's list (December 2024, updated June 2026), items 24 (Construction Logistics Plan)
  and 66 (Construction Traffic Management Plan), page 18, 38. Sites in confined locations or near sensitive
  receptors, and developments with an impact on the road network, show as discretionary. The council may
  seek a S106 contribution to monitor complex operations.
