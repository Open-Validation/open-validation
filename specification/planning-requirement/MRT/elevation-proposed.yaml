- item: A 45 degree line from the nearest window of a habitable room to the proposed development
  level: must
- item: Extraction ducts, vents and flues, with adjacent properties, confirming vertical discharge at
    least one metre above the highest residential window or eaves level
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Extraction ducts, vents or flues are proposed.
