reference: sustainable-drainage-strategy
local-authority: MRT
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - surface-water-flood-risk
      description: Evidence of a risk from surface water flooding.
  - discretionary
  - condition:
      field: hard-surfacing
      value: true
      description: An increase in impermeable area.
  - condition:
      field: basement
      value: true
      description: Basement or subterranean development.
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: Merton Local Plan 2024 policies F15.7, F15.8 and F15.9; Non-statutory technical standards for
  Sustainable Drainage Systems
source-text: 1. Required for all Major development 2. Required for all other development proposals where
  there is evidence of a risk from other sources of flooding, including surface water, ground water and
  sewer flooding. 3. Required when there is an increase in impermeable area on all development. 4. Required
  for all basement or subterranean development
must-include:
- item: The proposed Sustainable Drainage System, with details of its long term management and maintenance
  level: must
- item: Details of implementation, adoption, maintenance and management, with a timetable and a lifetime
    management and maintenance plan (adoption by a public body or statutory undertaker, or other arrangements)
  level: must
- item: 'If the development does not include SuDS: why such measures are not feasible and how drainage
    will be dealt with'
  level: must
confidence: medium
notes: From the council's list (December 2024, updated June 2026), item 28 (Drainage Strategies including
  SUDS), page 20-21. Groundwater and sewer flood risk have no field yet and show as discretionary. The
  hard-surfacing condition stands for any increase in impermeable area.
review-status: unverified
field-status: {}
