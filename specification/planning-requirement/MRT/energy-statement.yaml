reference: energy-statement
local-authority: MRT
required-if:
  any:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Ten or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 sq m or more non-residential gross internal floorspace (including conversions
          or change of use).
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Minor residential scheme creating 1-9 dwellings (new build, change of use and conversion).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: Minor residential scheme creating 1-9 dwellings (new build, change of use and conversion).
source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
policy: London Plan 2021 policies SI 2 and SI 3; Merton Local Plan 2024 policies CC2.1 to CC2.6; Mayor
  of London Energy Planning Guidance; Merton Explanatory Note on Approaches to Sustainable Design & Construction
source-text: All major development involving the creation of ten or more dwellings and/or 500sqm or more
  non-residential gross internal floor space (including conversions or change of use) ... All minor residential
  schemes involving the creation or 1-9 dwellings (new build, change of use and conversion).
must-include:
- item: 'Major schemes: an Energy Assessment Report showing the scheme maximises carbon savings at all
    stages of the energy hierarchy, in line with the GLA''s Energy Planning Guidance and Merton''s Explanatory
    Note'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Ten or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 sq m or more non-residential gross internal floorspace (including conversions
          or change of use).
- item: 'Minor residential schemes (1-9 dwellings): Merton''s Energy Assessment Template, showing the
    scheme maximises carbon savings at all stages of the energy hierarchy'
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Minor residential scheme creating 1-9 dwellings (new build, change of use and conversion).
    - condition:
        field: dwelling-count
        operator: <=
        value: 9
        description: Minor residential scheme creating 1-9 dwellings (new build, change of use and conversion).
- item: As designed SAP or BRUKL outputs
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creation of one or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 sq m or more non-residential gross internal floor space.
  source-text: All schemes involving the creation of 1 or more dwellings, or 500sqm or more non-residential
    gross internal floor space.
- item: 'Major schemes: the GLA Carbon Reporting Spreadsheet'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Ten or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 sq m or more non-residential gross internal floorspace (including conversions
          or change of use).
confidence: medium
notes: From the council's list (December 2024, updated June 2026), items 35 (Energy Assessment Report),
  36 (Merton's Energy Assessment Template), 37 (As designed SAP or BRUKL outputs) and 38 (GLA Carbon Reporting
  Spreadsheet), page 24-25.
review-status: unverified
field-status: {}
