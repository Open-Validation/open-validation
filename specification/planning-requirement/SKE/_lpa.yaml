  date: ''
  date-basis: 'South Kesteven has no local validation list on its website, so there is no list date. Checked
    2026-11-06: the ''Submit a Planning Application'' page (step 3 of the planning application step-by-step
    guide, undated) lists only the national minimum (form, location plan, site plan, other plans, ownership
    certificate, design and access statement, fee) and says other documents ''may'' be asked for; the
    site''s sitemap (1,394 pages) and site search for ''validation'', ''validation list'', ''local validation'',
    ''validation checklist'' and ''local list'' find no list; MHCLG''s register (planning.data.gov.uk
    entity 20325) points to the same page (''Information relating to National Requirements''). The old
    committee appendix ''Planning Applications Requirements'' (https://moderngov.southkesteven.gov.uk/documents/s5577/PLA713%20appendix%20A.pdf)
    was retried 2026-11-06 once the proxy allowed the host: the council''s ModernGov meeting pages load,
    but that PDF and the document search return an Azure WAF JavaScript challenge (HTTP 403), which was
    not bypassed, so its text was not read. Its age is clear from the ModernGov document numbers: s5577
    falls between the Cabinet papers of 11 August 2008 (up to s5575) and 1 September 2008 (from s5589),
    and planning report PLA735 was decided later in 2008, so report PLA713 and its appendix date from
    about August 2008. A 2008 list predates the current national requirements (DMPO 2015), has not been
    reviewed within the last two years as a local list must be, and no current South Kesteven planning
    page refers to it, so it is treated as old and superseded, not as a local list in force'
  status: national-only
