reference: site-plan
local-authority: SKE
required-if:
  always: true
source-url: https://www.southkesteven.gov.uk/planning-building-control/planning-development-management/step-by-step/planning-application-0
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site plan (sometimes known as a block plan) - which shows the proposed development in detail
  and can be purchased from one of the Portal's three accredited suppliers. (1:200 or 1:500 scale)
must-include:
- item: At a scale of 1:200 or 1:500
  level: must
- item: Shows the proposed development in detail
  level: must
confidence: medium
notes: South Kesteven publishes no local validation list (checked 2026-11-06). From the council's undated
  'Submit a Planning Application' page ('What to submit with your application'), the only page that names
  what to submit. Listed in the minimum documents for a valid application; the page calls it a site plan
  (sometimes known as a block plan). The national rules on when a site plan is needed still apply.
