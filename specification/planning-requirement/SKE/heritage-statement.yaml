reference: heritage-statement
local-authority: SKE
required-if:
  all:
  - site:
      in:
      - conservation-area
      - listed-building
      description: The site is in a conservation area, or the works are to a listed building.
  - discretionary
source-url: https://www.southkesteven.gov.uk/planning-building-control/planning-development-management/step-by-step/planning-application-0
source-text: 'You may be asked to submit additional supporting documents after submission of your application.
  These could include but are not limited to: a heritage impact assessment ( recommended for all applications
  in conservation areas or for works to a listed building'
confidence: medium
notes: South Kesteven publishes no local validation list (checked 2026-11-06). From the council's undated
  'Submit a Planning Application' page ('What to submit with your application'), the only page that names
  what to submit. The page calls it a heritage impact assessment and only 'recommended' in conservation
  areas or for works to a listed building, so it is shown as discretionary. The page lists this among
  documents the council 'may' ask for after submission, and adds that flood risk and heritage impact assessments
  'may be validation requirements for certain application types'. The council's Conservation Advice page
  links Heritage Impact Assessment guidance notes and a pro-forma.
