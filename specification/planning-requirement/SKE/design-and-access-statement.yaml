reference: design-and-access-statement
local-authority: SKE
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more new dwellings.
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
source-url: https://www.southkesteven.gov.uk/planning-building-control/planning-development-management/step-by-step/planning-application-0
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Design and access statement (required for major scale proposals or applications for new dwellings
  if the proposal is in a conservation area) - this should outline the design principles and concepts
  that have been applied to the proposed development and how issues relating to access to the development
  have been dealt with.
must-include:
- item: The design principles and concepts applied to the proposed development
  level: should
- item: How issues relating to access to the development have been dealt with
  level: should
confidence: medium
notes: South Kesteven publishes no local validation list (checked 2026-11-06). From the council's undated
  'Submit a Planning Application' page ('What to submit with your application'), the only page that names
  what to submit. Listed in the minimum documents for a valid application. The page names only major proposals
  and new dwellings in a conservation area; the national rule also covers 100 sq m or more of new floorspace
  in a conservation area and listed building consent.
review-status: unverified
field-status: {}
