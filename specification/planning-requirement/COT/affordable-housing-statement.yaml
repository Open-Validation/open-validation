reference: affordable-housing-statement
local-authority: COT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 square metres.
  - all:
    - site:
        in:
        - designated-rural-area
        description: The site is in a designated rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 6
        description: 6 to 10 dwellings in a rural area.
source-url: https://www.cotswold.gov.uk/media/5cwjexsa/full-planning-permission-validation-checklist-cdc-20-07-26-af.pdf
confidence: medium
notes: 'From the audit (missing_requirement): Cotswold: 11+ dwellings or over 1,000 sqm, or 6-10 rural
  dwellings.'
review-status: unverified
field-status: {}
