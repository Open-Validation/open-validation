reference: design-and-access-statement
local-authority: COT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: The site is in a World Heritage Site or conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: More than 100 square metres of new floorspace.
source-url: https://www.cotswold.gov.uk/media/5cwjexsa/full-planning-permission-validation-checklist-cdc-20-07-26-af.pdf
confidence: medium
notes: 'From the audit (missing_requirement): major; LBC; WHS/conservation area with 1+ dwelling or 100
  sqm+; and householder proposals with more than 100 sqm of new floorspace.'
review-status: unverified
field-status: {}
