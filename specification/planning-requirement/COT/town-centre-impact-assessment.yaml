reference: town-centre-impact-assessment
local-authority: COT
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: The proposal is outside a centre.
  - any:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 100
        description: A retail increase of 100 square metres or more.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Leisure over 500 square metres gross.
source-url: https://www.cotswold.gov.uk/media/5cwjexsa/full-planning-permission-validation-checklist-cdc-20-07-26-af.pdf
source-text: 'Cotswold: retail increase of 100 sqm+ outside a centre, or leisure over 500 sqm gross'
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the S106 variation row.'
review-status: unverified
field-status: {}
