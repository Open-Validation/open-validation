source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S2 and S29; Copeland Local Plan 2013-2028 policies
  ST1, ENV1, DM11 and DM24; Cumbria Minerals and Waste Local Plan 2015-2030 policies DC19 and DC20
source-text: Where the application form has indicated that surface water drainage is proposed to a watercourse
  or sewer. ... a) Major developments (except a change of use where no increase in permeable area is proposed);
  b) Residential development of 5 or more properties (except a change of use where no increase in permeable
  area is proposed); c) Development on land of 0.5ha or more in critical drainage areas as defined by
  the Environment Agency; ... d) Developments in flood risk zones 3a and 3b as defined by the Environment
  Agency. ... All development proposals will be expected to provide details of foul and surface water
  drainage arrangements - whether connecting to existing systems or developing new ones – and to confirm
  that the proposed drainage scheme has sufficient capacity to cope with the demands of the new development
  and takes into account forecasted increased flows due to climate change.
must-include:
- item: 'Surface water drainage to a watercourse or sewer: evidence that infiltration or water reuse is
    not practicable and that the drainage follows the hierarchy (infiltration or reuse; watercourse; sewer
    as a last resort), including evidence that ground conditions make soakaways impractical (normally
    a BRE 365 test)'
  level: must
