confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 24. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 28. Same
  wording. Covers the district lists'' Surface Water Drainage Assessment and Sustainable Drainage Assessment
  and Strategy (same wording in both lists). The SuDS strategy is not needed for a change of use with
  no increase in permeable area (major or 5+ dwellings cases). Minerals, waste and the council''s own
  (Regulation 3) development: the inherited Cumbria County Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 19. The foul drainage part of the minerals and waste item, and the district Foul Drainage Statement,
  have no id (unmapped). Uses the new field surface-water-to-sewer-or-watercourse. The Carlisle area has
  no local list, so nothing applies there.'
