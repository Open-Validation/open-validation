reference: floor-plan-existing
local-authority: CUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: building-works
          value: true
          description: Extensions.
      - condition:
          field: involves-change-of-use
          value: true
          description: Changes of use.
  - all:
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: building-works
          value: true
          description: Extensions.
      - all:
        - condition:
            field: involves-change-of-use
            value: true
            description: A change of use.
        - condition:
            field: external-alterations
            value: true
            description: The change of use involves external alterations.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
        - reg-3
    - condition:
        field: building-works
        value: true
        description: The development involves buildings, plant or structures.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Floor Plans – required for any new buildings, extensions or changes of use. ... Floor Plans
  – required for any new buildings, extensions or changes of use which involve external alterations. ...
  For development proposals involving buildings existing and proposed floorplans and elevations will be
  required. These should be drawn to a scale of 1:50 or 1:100. These should clearly show:'
must-include:
- item: Drawn to a scale of 1:50 or 1:100, labelled with a drawing number, title and scale
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Existing or proposed works in relation to what is already there
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: The extent of any demolition or rebuild works proposed
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Minerals, waste and council development: drawn at 1:50 or 1:100, showing all sides (including
    blank elevations), proposed materials including windows and doors, boundary treatments and any ventilation
    equipment'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals, waste and council development: walls or buildings to be demolished clearly shown; for
    extensions, the existing building as well as the proposal'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 11. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 14. Copeland
  asks for floor plans for a change of use only where it involves external alterations. Minerals, waste
  and the council''s own (Regulation 3) development: the inherited Cumbria County Council list (November
  2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf, page
  10. The Allerdale outline checklists ask for proposed floor plans only ''if appearance is to be considered''.
  The Carlisle area has no local list, so nothing applies there. Existing plans only where there is an
  existing building.'
