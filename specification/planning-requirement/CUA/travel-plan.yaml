reference: travel-plan
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
        - reg-3
    - discretionary
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policy S22; Copeland Local Plan 2013-2028 policy T1; Cumbria
  Minerals and Waste Local Plan 2015-2030 policy DC1
source-text: Please be aware that TAs need to be accompanied by a Travel Plan. ... For development proposals
  likely to generate significant travel movements a Travel Plan will be required to demonstrate how travel
  generated by the development (including during construction/development phase if appropriate) and in
  particular how use of sustainable transport options will be encouraged.
must-include:
- item: 'Minerals, waste and council development: how travel generated by the development (including construction
    where appropriate) will be managed and how sustainable transport options will be encouraged'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 26. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 32. Same
  wording. The district lists need a travel plan with any Transport Assessment, whose thresholds they
  don''t state, so it shows as ''check''. Minerals, waste and the council''s own (Regulation 3) development:
  the inherited Cumbria County Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 33. The checklists say ''Travel Plan (if required)'' and it is often left to a condition, so ''check''.
  The Carlisle area has no local list, so nothing applies there.'
review-status: unverified
field-status: {}
