reference: landscaping-plan
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
        - reg-3
    - condition:
        field: landscaping-works
        value: true
        description: Landscape planting or screening is integral to the proposals (for example as identified
          in an LVIA).
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S33 and DM17; Allerdale Local Plan (Part 2) 2020 policy
  SA52; Copeland Local Plan 2013-2028 policies ENV5, DM25, DM26 and DM28; Cumbria Minerals and Waste Local
  Plan 2015-2030 policies DC18 and DC22
source-text: Required for all applications (except for changes of use, or for outline applications where
  layout is not applied for) where existing or proposed landscaping would contribute to the acceptability
  of the proposed scheme. ... Details of any proposed landscape planting should be included on the submitted
  Site Plans. Where landscape planting/screening is integral to the development proposals (for example,
  as identified within a LVIA report) then a detailed landscape strategy will also be required.
must-include:
- item: 'A scaled plan of hard and soft landscaping: levels, paving treatment and materials, plant species,
    position, numbers and/or densities per square metre with the area, and the size and specification
    of plants'
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Proposals for long-term maintenance and landscape management
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Details of phasing, particularly for larger sites
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Major development: how it strengthens the green infrastructure network (new and enhanced assets
    on site) and, where the site adjoins it and connection is feasible, a layout giving pedestrian and/or
    wildlife links to it'
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - ref: major-development
  source-text: 'Proposals for all major developments will be required to demonstrate how they: a) strengthen
    the Network through the creation of new and enhancement of existing green infrastructure assets within
    the site; and b) incorporate a layout that provides pedestrian and/or wildlife linkages to the existing
    Network in circumstances where the development site lies adjacent, and connectivity is feasible.'
- item: 'Minerals, waste and council development: existing landscape features to be retained and proposed
    planting, with size and species, and how planting will be protected and maintained'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 21. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 26. Same
  wording. Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 26. The district lists ask for it (except changes of use and outline applications not seeking layout)
  only where existing or proposed landscaping would contribute to the scheme''s acceptability, which is
  a judgement, so it shows as ''check''. The Allerdale outline checklists ask for it ''if landscaping
  is to be considered''. The Carlisle area has no local list, so nothing applies there.'
review-status: unverified
field-status: {}
