confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 13. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 16. Copeland''s
  list has the same wording without the Hadrian''s Wall Buffer Zone and World Heritage Site value. Minerals,
  waste and the council''s own (Regulation 3) development: the inherited Cumbria County Council list (November
  2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf, page
  24. The minerals and waste list also asks for it where a proposal could affect archaeological assets,
  designated or not, or currently unknown ones, which shows as ''check''. Appendix C (heritage) gives
  further detail. The Carlisle area has no local list, so nothing applies there.'
