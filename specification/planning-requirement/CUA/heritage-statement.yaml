source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S27 and S28; Copeland Local Plan 2013-2028 policies
  ENV4 and DM27; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP15 and DC17; NPPF chapter
  16
source-text: For applications that propose works to listed buildings, developments in the curtilage of
  or directly adjoining the curtilage of listed buildings, developments in the setting of, or adjacent
  to, a listed building, developments in conservation areas, developments in the setting of, or adjacent
  to, a conservation area, within Registered Parks and Gardens, on or adjoining Scheduled Ancient Monuments
  or within the Hadrian’s Wall Buffer Zone. ... Any proposal which will impact upon a designated heritage
  asset, or its setting. A designated heritage asset is a listed building, scheduled monument, conservation
  area, registered park and garden, and registered battlefield • Any proposal which will impact on archaeological
  assets, whether designated or not, or has the potential to impact upon currently unknown archaeological
  assets.
