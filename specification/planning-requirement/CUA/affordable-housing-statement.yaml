reference: affordable-housing-statement
local-authority: CUA
required-if:
  all:
  - any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: Housing development of more than 10 dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: The site has an area of 0.5 hectares.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 2) 2020 policy SA3; Copeland Local Plan 2013-2028 policies ST1 and
  SS3; NPPF chapter 5
source-text: All housing development of more than 10 dwellings. • The site has an area of 0.5 hectares.
must-include:
- item: The total number of residential units, with the number, tenure type and size of the affordable
    homes
  level: must
- item: A plan or schedule showing the location of the units (dispersed in clusters), except for outline
    applications where layout is reserved
  level: must
- item: The background and justification for the approach, showing it accords with policy
  level: must
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 28. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 34. Same
  wording. The Allerdale per-type checklists say ''Required for 10 or more dwellings or a site area of
  above 0.5 hectares''. Where less than the policy amount is offered, a financial viability statement
  is needed (see viability-assessment). Not in the minerals and waste list. The Carlisle area has no local
  list, so nothing applies there.'
review-status: unverified
field-status: {}
