reference: section-proposed
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: A proposed change in site levels.
      - condition:
          field: new-build
          value: true
          description: A detached building is proposed.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
    - discretionary
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - condition:
          field: building-works
          value: true
          description: Buildings or structures.
      - condition:
          field: change-in-ground-levels
          value: true
          description: A change in ground levels.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site Sections OR Existing and Proposed Datum Levels (Above Ordnance Datum (AOD)) – required
  for a proposed change in site levels, including when a detached building is proposed. ... Sections and
  Profiles (if required for buildings/structures or change in ground levels)
