reference: waste-management-plan
local-authority: CUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: Site excavation.
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings and structures.
source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
policy: Cumbria Minerals and Waste Local Plan 2015-2030 policies SP2 and SP3; Waste Management Plan for
  England (2013)
source-text: It will be required for proposals involving site excavation or demolition of buildings and
  structures.
must-include:
- item: 'Waste arising from the proposals: estimated quantity, proportion retained on site and method
    of disposal for waste not retained'
  level: must
- item: Opportunities for re-use and/or recovery, and measures to minimise off-site disposal, with reference
    to the waste hierarchy
  level: must
confidence: medium
notes: 'Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 35. Site Waste Management Plan. The district lists don''t ask for one.'
review-status: unverified
field-status: {}
