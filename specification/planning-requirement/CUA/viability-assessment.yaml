reference: viability-assessment
local-authority: CUA
required-if:
  all:
  - any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: Housing development of more than 10 dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: The site has an area of 0.5 hectares.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: No affordable housing, or less than the policy thresholds, is proposed.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 2) 2020 policy SA3; Copeland Local Plan 2013-2028 policy SS3
source-text: If no affordable housing is to be provided or a lesser amount than the thresholds indicated
  by Policy than a financial viability statement should be provided.
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 28. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 34. Same
  wording. Part of the Affordable Housing Statement item. The Carlisle area has no local list, so nothing
  applies there.'
review-status: unverified
field-status: {}
