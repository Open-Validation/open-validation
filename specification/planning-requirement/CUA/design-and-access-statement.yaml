reference: design-and-access-statement
local-authority: CUA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with 100 square metres or more of floorspace.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A Design and Access Statement is a concise report required to accompany: • All major developments.
  • Applications for development in a designated area (World Heritage Site or a Conservation Area) as
  outlined in the amended Development Management Procedure Order 2015 where the proposed development consists
  of one or more dwellings; or a building or buildings with a floor space of 100 square metres or more.
  • Applications for listed building consent. ... Applications for a material change of use, engineering
  or mining operation, or applications to amend a condition attached to a planning application do not
  need to be accompanied by a Design and Access Statement. ... A design and access statement'
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 7. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 9. Same wording.
  Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County Council
  list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 11. National rule. Not needed for a material change of use, engineering or mining operations, section
  73 applications or (minerals and waste list) waste development.'
review-status: unverified
field-status: {}
