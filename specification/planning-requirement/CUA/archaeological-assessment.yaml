reference: archaeological-assessment
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - site:
        in:
        - scheduled-monument
        description: Proposals directly affecting Scheduled Ancient Monuments.
  - all:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - site:
        in:
        - world-heritage-site
        description: In or close to the Hadrian's Wall World Heritage Site (within its visual impact/buffer
          zone).
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S27 and S28; Copeland Local Plan 2013-2028 policies
  ENV4 and DM27; NPPF chapter 16
source-text: Archaeological Assessment – Proposals directly affecting Scheduled Ancient Monuments (including
  the Hadrian’s Wall World Heritage Site or within close proximity to the World Heritage Site i.e., within
  its visual impact/buffer zone).
must-include:
- item: Explains how the proposed development would be affected by the significance of the archaeological
    remains, following the County Archaeologist's specification
  level: must
- item: Produced by an experienced professional archaeologist
  level: must
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 15. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 19. Same
  wording. Copeland''s wording stops at ''Scheduled Ancient Monuments'' (no Hadrian''s Wall). Often a
  desk-based assessment; field evaluation may follow. The Historic Building Record in the same section
  has no id, so it is in the unmapped list. In the minerals and waste list archaeology is part of the
  heritage statement. The Carlisle area has no local list, so nothing applies there.'
review-status: unverified
field-status: {}
