reference: location-plan
local-authority: CUA
required-if:
  always: true
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan should be based on an up-to-date map. The scale should typically be 1:1250
  or 1:2500 but, wherever possible, the plan should be scaled to fit onto A4 or A3 size paper. A location
  plan should show the direction north and identify sufficient roads and/or buildings on land adjoining
  the application site to ensure that the exact location of the application site is clear. The application
  site should be edged clearly with a red line on the location plan. It should include all land necessary
  to carry out the proposed development e.g., land required for access to the site from a public highway,
  visibility splays, landscaping, car parking and open areas around buildings. A blue line should be drawn
  around any other land owned by the applicant, close to or adjoining the application site. ... All planning
  applications must be accompanied by a location plan at a scale of 1:1250 or 1:2500 with the scale and
  direction of north clearly labelled on the plan. Location plans should consist of or be based upon Ordnance
  survey extracts where possible and wherever possible, at least two named roads should be included within
  the plan to ensure the site location can be readily identified. The application site should be edged
  in red and any other land ... owned by or controlled by the applicant edged in blue. All land necessary
  to carry out the proposed development should be included within the land edge red (for example, access
  route from the public highway, landscaping works/screening, landfill gas monitoring boreholes).
must-include:
