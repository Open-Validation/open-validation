        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Direction of north, and enough roads and/or buildings on adjoining land to make the exact location
    of the site clear
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Site edged clearly in red, including all land needed for the development (access from a public
    highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Any other land owned by the applicant close to or adjoining the site edged in blue
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Access points shown with visibility splays in each direction: 30mph = 60m, 40mph = 120m, 50mph
    = 160m, 60mph = 215m'
  level: must
  required-if:
    condition:
      field: former-district
      value: allerdale
      description: The site is in the former Allerdale area.
  source-text: 'Access points shown with visibility splays in each direction: 30mph = 60m 40mph = 120m
    50mph = 160m 60mph = 215m'
- item: 'Minerals, waste and council development: scale 1:1250 or 1:2500 with the scale and north clearly
    labelled; based on Ordnance Survey extracts where possible, with at least two named roads where possible'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals, waste and council development: site edged red including all land needed (for example
    the access route from the public highway, landscaping or screening, landfill gas monitoring boreholes);
    other land owned or controlled by the applicant edged blue'
  level: must
  required-if:
    application-type:
