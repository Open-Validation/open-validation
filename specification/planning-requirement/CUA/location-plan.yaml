      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals and waste: a scale of 1:50,000 may be more appropriate, but ideally not larger than
    1:10,000'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
  source-text: For Minerals and Waste applications a scale of 1:50,000 may be more appropriate for a location
    plan but ideally should not be larger than 1:10,000.
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 7. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 9. Same wording.
  Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County Council
  list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 8. The visibility splay item is on every Allerdale per-type checklist (for example the full application
  (major) checklist, https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_application_major_checklist.pdf).
  The Carlisle area has no local list, so nothing applies there.'
