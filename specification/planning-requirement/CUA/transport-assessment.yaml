reference: transport-assessment
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
        - reg-3
    - any:
      - ref: major-development
      - discretionary
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policy S22; Copeland Local Plan 2013-2028 policies ST1, T1
  and DM22; Cumbria Minerals and Waste Local Plan 2015-2030 policy DC1; Cumbria Development Design Guide,
  Appendix 3
source-text: 'Appendix 3 of the Cumbria Development Design Guide specifies the thresholds for Transport
  Statements and Transport Assessments: ... For minor developments, a Transport Statement should be sufficient
  which will outline the aspects of the scheme which may impact upon transport but will generally contain
  less technical data. A Transport Assessment will be required where the proposed scheme is a major development
  or will result in significant implications for the highway network and significant additional numbers
  of vehicle movements. • The need for either a Transport Statement or Assessment would be considered
  on each individual case,'
must-include:
- item: 'Transport Statement: trip generation, improvements to site accessibility, car parking provision
    and internal vehicular circulation, traffic impacts of servicing and the net change over any current
    development on the site'
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Transport Assessment: quantifies and assesses the impact on traffic movement and highway safety,
    how the development could be accessed by alternative modes and how they would be promoted, with any
    proposals for access or transport improvements'
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Minerals, waste and council development: proportionate to the scale, with analysis of the impacts
    including the modal split of journeys and measures to improve access by public transport, walking
    and cycling; scope agreed with the council early'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 26. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 31. Same
  wording. The district lists leave the thresholds to Appendix 3 of the Cumbria Development Design Guide
  and don''t state them, so the district case shows as ''check''. Minerals, waste and the council''s own
  (Regulation 3) development: the inherited Cumbria County Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 33. A Transport Assessment is required for major development or significant highway implications;
  otherwise the need is considered case by case (''check''). The Allerdale per-type checklists call it
  ''Highway Assessment''. The Carlisle area has no local list, so nothing applies there.'
