reference: site-plan
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: building-works
          value: true
          description: Extensions.
      - all:
        - condition:
            field: involves-change-of-use
            value: true
            description: A change of use.
        - condition:
            field: external-alterations
            value: true
            description: The change of use involves external extensions or the provision of facilities,
              e.g. parking within the curtilage or bin storage on commercial premises.
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block Plan – should be included within all development proposals for new buildings, extensions
  and changes of use involving external extensions or the provision of facilities e.g., parking within
  the curtilage, bin storage on commercial. ... All applications should usually contain a site plan at
  a scale of 1:500 or 1:200 with the scale and direction of north clearly labelled on the plan.
must-include:
- item: Drawn to a scale of 1:500 or 1:200, labelled with a drawing number, title and scale, showing the
    direction of North
