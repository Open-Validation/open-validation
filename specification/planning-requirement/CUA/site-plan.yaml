        description: The site is in the former Copeland area.
- item: 'Minerals, waste and council development: scale and north clearly labelled; based on Ordnance
    Survey maps'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals, waste and council development: buildings, roads and land within or adjoining the site,
    including points of access; public rights of way, underground services or overhead lines crossing
    the site; trees or hedges that could be affected; hard or soft landscaping; boundary treatments; watercourses,
    culverts, drainage ditches or ponds, with the direction of flow where appropriate'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals and waste: normally at 1:2500, also showing (as appropriate) land previously used for
    mineral working, with working/tipping faces, restored areas and permission references; existing contours
    at no less than 10m intervals for at least 250m outside the site (500m for oil and gas); proposed
    plant, machinery and buildings; outside bays; stockpiles, soil storage mounds and screening bunds
    with heights; the maximum extent of soil stripping and other changes to ground level'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 11. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 14. Same
  wording. Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 9. The district lists call it a Block Plan; the minerals, waste and council checklists list both
  a Site Plan and a Block Plan. The Carlisle area has no local list, so nothing applies there.'
