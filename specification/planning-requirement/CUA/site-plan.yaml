- item: The species, position, crown spread and root protection area of all trees within the site, including
    those covered by a Tree Preservation Order or in a Conservation Area
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
