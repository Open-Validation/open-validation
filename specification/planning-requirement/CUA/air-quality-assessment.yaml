reference: air-quality-assessment
local-authority: CUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: direct-air-emissions
        value: true
        description: Emissions to air such as dust from extraction or blasting or other processes, odour,
          stack emissions, biological treatment sites and traffic.
    - site:
        in:
        - air-quality-management-area
        description: Inside or adjacent to an air quality management area (AQMA).
source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
policy: Cumbria Minerals and Waste Local Plan 2015-2030 policies SP13, DC2 and DC5; Environment Act 1995
  Part IV
source-text: 'For any application that will result in: • Emissions to air such as dust from extraction/blasting
  or other operational processes, odour, stack emissions, biological treatment sites and traffic. • Where
  development is proposed inside or adjacent to an air quality management area (AQMA).'
must-include:
- item: Existing baseline data and a modelling assessment; any monitoring locations agreed with the council
    before submission
  level: must
confidence: medium
notes: 'Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 13. The district lists don''t ask for one.'
review-status: unverified
field-status: {}
