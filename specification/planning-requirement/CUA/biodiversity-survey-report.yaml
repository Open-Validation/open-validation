source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S35 and DM17; Copeland Local Plan 2013-2028 policies
  ST1, ENV3 and DM25; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP15 and DC16; Conservation
  of Habitats and Species Regulations 2017; Wildlife and Countryside Act 1981
source-text: 'Nature Conservation & Ecological Assessment: An ecological assessment will be required for
  all major development. Phase 1 Habitat Survey (also known as a Preliminary Ecological Assessment)/ Protected
  Species Assessment: For all other development/proposal types where the site includes a pond, field hedgerow
  (including boundaries), trees of 1m girth at chest height or semi-improved or unimproved grassland,
  development affecting a building as described in Appendix E or the site is designated or directly adjoins
  a designated site (designated at a local or national level for its ecological sensitivity). Also, for
  conversion of traditional buildings and other developments described in Appendix E. A Habitats Regulations
  Assessment may be required for developments with connectivity to European designated sites. Exemptions:
  a) Following consultation by the applicant at the pre-application stage, the LPA has stated in writing
  that no protected species surveys and assessments are required. b) Householder Planning applications
  ... Where a development proposal is likely to adversely impact on designated sites (a designated site
  is as defined on the Natural England website www.magic.gov.uk), protected or priority species or habitats,
  or other important biodiversity or geological features that may be affected. This includes internationally
  designated sites such as Special Protection Areas (SPA), Special Area of Conservation (SAC), RAMSAR
  sites, nationally designated sites such as Sites of Special Scientific Interest (SSSI) and ... National
  Nature Reserve (NNR); and locally designated sites such as County Wildlife Site (CWS) and Local Nature
  Reserve (LNR). • The initial habitat survey should establish (including from relevant data search) whether
  any protected or priority (BAP) species are known to be present on the site, in which case the relevant
  species surveys will need to be carried out as a matter of course. In addition, all development proposals
  including works as set out in the table below will trigger the need for a protected species survey.'
must-include:
- item: 'Major development: an ecological assessment including proposals for the long-term maintenance
    and management of protected species and habitats'
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - ref: major-development
- item: 'Major development: plans showing any significant wildlife habitats or features and the location
    of habitats of protected species'
  level: should
  required-if:
    all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - ref: major-development
- item: 'Where bats or owls are present or could be (especially conversions): a detailed investigation
    and assessment at the appropriate time of year'
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Habitat survey (preliminary ecological survey) by a person holding a relevant certification, undertaken
    only during the relevant time of year (Appendix E)
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: Surveys (including bat surveys) no more than 2 years old, or a new survey or an addendum
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
  source-text: 'NB: Please note that Ecological Surveys including Bats Surveys are only relevant for 2
    years. After this time either a new survey will need to be undertaken by a qualified person or an
    addendum provided.'
- item: 'Minerals, waste and council development: survey and report meeting the CIEEM Guidelines for Ecological
    Appraisal, by competent persons, at an appropriate time of year and using recognised survey methods'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals, waste and council development: identifies the likely impacts on protected species and
    habitats, designated sites and priority habitats; where harm is likely, assesses the impact and addresses
    long-term maintenance and management'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Minerals, waste and council development: pertinent biodiversity issues addressed in accordance
    with BS 42020:2013'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
- item: 'Where a European site may be affected: enough information to inform a Habitats Regulations Assessment
    (a shadow HRA is advised)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  source-text: It is therefore advised that applicants submit their own Habitats Regulations Assessment
    (shadow HRA).
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 18. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 23. Same
  wording. Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 13. Covers the district lists'' Ecological Assessment and Phase 1 Habitat Survey / Protected Species
  Assessment. Householder applications are exempt, as is a case where the council said in writing at pre-application
  stage that no survey is needed. Application types for the non-major case follow the Allerdale per-type
  checklists (ecology is on the full, outline and change of use checklists, not householder or listed
  building). The district lists say a Habitats Regulations Assessment ''may be required'' (unmapped).
  The lists don''t ask for a biodiversity net gain metric. The Carlisle area has no local list, so nothing
  applies there.'
