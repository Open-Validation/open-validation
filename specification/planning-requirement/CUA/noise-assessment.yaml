reference: noise-assessment
local-authority: CUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Likely to generate significant noise above background levels (commonly minerals applications).
    - condition:
        field: hcv-movements
        value: true
        description: Regular movements of larger vehicles.
source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
policy: Cumbria Minerals and Waste Local Plan 2015-2030 policy DC3
source-text: Any development which is likely to generate significant noise above background levels or
  regular movements of larger vehicles. It would commonly be required with minerals applications due to
  the nature of that operation, but could equally apply to noise associated with construction of new buildings,
  or the introduction of a new/more intensive activity near to sensitive receptors.
must-include:
- item: Baseline conditions of the existing noise climate around the site at the times it is proposed
    to operate
  level: must
- item: Site activities that could lead to unacceptable noise without mitigation, and the proposed mitigation
  level: must
- item: Proposals to monitor and report noise emissions
  level: must
confidence: medium
notes: 'Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 29. The district lists mention noise only in a general note that assessments are ''regularly required''
  (not a validation item).'
review-status: unverified
field-status: {}
