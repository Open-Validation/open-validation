reference: recreation-facilities-assessment
local-authority: CUA
required-if:
  all:
  - any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space (e.g. public open space, amenity open space, playing fields).
    - condition:
        field: new-open-space
        value: true
        description: Creation of open space.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policy S25; Copeland Local Plan 2013-2028 policies ST1 and
  DM12; NPPF chapter 8
source-text: Applications relating to the creation of or loss of open space (for example public open space,
  amenity open space and playing fields).
must-include:
- item: 'For a loss of open space: evidence that the space is surplus to requirements, or that the loss
    would be replaced by equivalent or better provision in a suitable location, or that the development
    is for alternative sports and leisure provision whose need clearly outweighs the loss'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 33. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 41. Same
  wording. Open Space/Sport/Play/Leisure Assessment. The Carlisle area has no local list, so nothing applies
  there.'
review-status: unverified
field-status: {}
