reference: sci
local-authority: CUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: Accompanied by an Environmental Statement.
source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
policy: Cumbria Minerals and Waste Development Plan Statement of Community Involvement (July 2017)
source-text: For all major development proposals and those accompanied by Environmental Statements, it
  is expected that the developer will have carried out some consultation and engagement with the local
  community.
must-include:
- item: 'Details of the consultation carried out: who was consulted, what information was provided and
    how, and any public events'
  level: must
- item: A summary of the responses and how they have been taken into account (amendments made, or why
    an issue was not taken further)
  level: must
confidence: medium
notes: 'Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 32. The district lists don''t ask for one.'
