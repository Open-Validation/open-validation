reference: land-contamination-assessment
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion of agricultural, commercial or unused buildings to residential use.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
        - reg-3
    - any:
      - site:
          in:
          - contaminated-land
          description: Land contamination is likely from past uses, or the development would disturb existing
            contamination.
      - site:
          in:
          - near-landfill-site
          description: Close to an existing landfill site (usually within 250 metres).
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S3, S30 and S31; Copeland Local Plan 2013-2028 policies
  ST1 and DM15A; Cumbria Minerals and Waste Local Plan 2015-2030 policies SP16 and DC21
source-text: For conversion of agricultural/commercial/unused buildings to residential. ... A survey would
  be required where there is a likelihood of land contamination from past uses of the land or as a result
  of the new development disturbing existing contamination. Past or present uses which could lead to land
  contamination may include industry activity, chemical and fuel storage, treat and disposal of waste
  and sites located close to existing landfill sites (usually within 250 metres).
must-include:
- item: The completed Appendix D form on past contamination issues
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Minerals, waste and council development: a Phase 1 desktop survey (history of past and present
    uses; potential sources, pathways and receptors), prepared by a competent and qualified person'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  source-text: A Phase 1 report will be required to validate the planning application.
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 14. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 19. Same
  wording. The district item is the Contamination Form (Appendix D). Minerals, waste and the council''s
  own (Regulation 3) development: the inherited Cumbria County Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 27. The Carlisle area has no local list, so nothing applies there.'
review-status: unverified
field-status: {}
