reference: arboriculturist-report
local-authority: CUA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: former-district
          value: allerdale
          description: The site is in the former Allerdale area.
      - condition:
          field: former-district
          value: copeland
          description: The site is in the former Copeland area.
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Trees protected by a Tree Preservation Order may be affected, including on adjacent
            land or highways within 15m of the site boundary.
      - all:
        - site:
            in:
            - conservation-area
            description: In a Conservation Area.
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Trees in the Conservation Area may be affected, including on adjacent land or
              highways within 15m of the site boundary.
      - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - romp
        - waste-dev
        - reg-3
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Likely to affect trees within or adjacent to the site, directly or by building close
          to them.
source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policy DM17; Copeland Local Plan 2013-2028 policy DM28; Cumbria
  Minerals and Waste Local Plan 2015-2030 policy DC16
source-text: A tree survey should accompany all applications where trees protected by a Tree Preservation
  Order or within a Conservation Area may be affected by the proposed development. This includes trees
  on adjacent land or highways which are within 15m of the boundary of the site. ... NB. A tree or hedgerow
  survey may also be required when trees or hedgerows are either present on the proposal site or are adjacent
  to it and are likely to influence or be affected by the development. ... A tree survey will be required
  for any development proposal which is likely to affect trees within and adjacent to the development
  site, either directly by loss or damage, or indirectly by developing in close proximity to trees and
  therefore potentially reducing their lifespan.
must-include:
- item: Tree and Hedgerow Survey, Arboricultural Impact Assessment, Tree Plan showing Root Protection
    Areas, Tree Protection Plan and Tree Schedule (Appendix F)
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Minerals, waste and council development: carried out by qualified persons to the latest BS 5837,
    with a full arboricultural impact assessment, justification for any trees to be felled and accurate
    constraints plans with the extent and crown spreads of all trees'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 19. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 25. Same
  wording. Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 34. Where unprotected trees or hedgerows on or next to the site could influence or be affected
  by the development, the district lists say a survey ''may also be required'', so that part shows as
  ''check''. The hedgerow assessment in the same section has no id (unmapped). The Carlisle area has no
  local list, so nothing applies there.'
review-status: unverified
field-status: {}
