source-url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
policy: Allerdale Local Plan (Part 1) 2014 policies S16 and DM8; Copeland Local Plan 2013-2028 policies
  ST1, ER7, ER8 and ER9; NPPF chapter 7
source-text: 'Sequential Approach: Proposals for new main town centre uses (as defined in the NPPF) or
  extensions over 200m2. Impact Assessment: Planning applications for retail, or leisure developments
  over the following m2 gross floor space not in an existing defined centre. a) Workington 500 m2 b) Maryport
  300 m2 ... c) Cockermouth 300 m2 d) Wigton 300 m2 e) Maryport 300 m2 f) Aspatria 100 m2 g) Silloth 100
  m2 ... Sequential Approach: A sequential test will be applied to planning applications for main town
  centre uses which are neither in an existing centre nor in accordance with an up-to-date plan. Impact
  Assessment: Planning applications for retail, or leisure developments exceeding 2,500 sq. metres of
  gross floorspace. not in an existing defined centre.'
must-include:
- item: 'Sequential approach: evidence on the potential use of preferable available town centre sites
    before edge of centre or out of centre sites, considering the suitability of more central sites and
    flexibility in format and scale'
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
- item: 'Impact assessment: the state of existing centres and current shopping patterns (base year); a
    time frame focused on the first five years; a ''no development'' scenario; the proposal''s turnover
    and trade draw; a range of plausible impact scenarios; the likely impact set out clearly with assumptions'
  level: should
  required-if:
    any:
    - condition:
        field: former-district
        value: allerdale
        description: The site is in the former Allerdale area.
    - condition:
        field: former-district
        value: copeland
        description: The site is in the former Copeland area.
confidence: medium
notes: 'From the council''s list (Allerdale area checklist, final December 2022), page 31. Copeland area:
  the Copeland Local Validation List draft proposal (consultation draft February 2023), page 38. Allerdale''s
  impact thresholds are by town (its list names Maryport twice, both at 300 m2); Copeland''s is 2,500
  sq m. The Allerdale per-type checklists add office development to the impact thresholds. The Carlisle
  area has no local list, so nothing applies there.'
