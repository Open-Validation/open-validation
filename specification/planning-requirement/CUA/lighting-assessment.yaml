reference: lighting-assessment
local-authority: CUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: External lighting with potential to impact on neighbouring property or the visual amenity
        of the area (including dark skies).
source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
source-text: When proposals involve external lighting which has potential to impact on either neighbouring
  property, or on the visual amenity of the area (including on dark skies). Installation of external lighting
  on buildings may only require submission of details with the application for consideration. Where more
  significant new lighting is proposed, such a floodlighting, or lighting on car parks, open land or yards
  a Lighting Assessment prepared by a suitably qualified lighting engineer will be required.
must-include:
- item: Type and location of external lighting, including lux levels, and hours of operation
  level: must
- item: An assessment of light spill and its impact on nearby properties and the wider setting, especially
    in the countryside and dark sky areas
  level: must
- item: Consideration of less intrusive schemes where appropriate, and measures to reduce light pollution
    or disturbance
  level: should
- item: 'Significant new lighting (floodlighting, lighting of car parks, open land or yards): prepared
    by a suitably qualified lighting engineer'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Floodlighting or lighting of car parks, open land or yards.
confidence: medium
notes: 'Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 28. For lighting on buildings, details with the application may be enough. The district lists don''t
  ask for one.'
review-status: unverified
field-status: {}
