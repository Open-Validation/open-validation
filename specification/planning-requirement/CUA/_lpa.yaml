validation-list:
  url: https://www.cumberland.gov.uk/sites/default/files/2025-03/allerdale_full_validation_checklist.pdf
  date: 2022-12-01
  date-basis: 'Cover: ''Final: December 2022'' (its contents page says ''September 2022''; the PDF was
    created 26 January 2023). Cumberland still uses its former districts'' lists, so the files combine
    three lists and use the field former-district: (1) this Allerdale area list, linked from https://www.cumberland.gov.uk/planning-and-building-control/apply-planning-permission-allerdale
    with per-type tick-sheet checklists and appendices (uploaded March 2025); (2) the Copeland area list,
    ''Consultation Draft - February 2023'' (https://www.cumberland.gov.uk/sites/default/files/2026-04/local_validation_list_draft_proposal.pdf),
    linked as the ''Copeland Local Validation list draft proposal'' from https://www.cumberland.gov.uk/planning-and-building-control/local-validation-list-copeland
    (uploaded April 2026; no adopted version is published); (3) for minerals, waste and the council''s
    own (Regulation 3) development, Cumbria County Council''s ''Local planning validation requirements
    for Minerals, Waste and County Council planning applications'', November 2021 (https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf),
    linked from https://www.cumberland.gov.uk/planning-and-building-control/minerals-and-waste-planning/minerals-and-waste-planning-applications
    (re-uploaded October 2026; MHCLG''s register lists this file). The Carlisle area page (https://www.cumberland.gov.uk/planning-and-building-control/apply-planning-permission-carlisle)
    links no local list, so nothing local applies there; the old district sites (carlisle.gov.uk, allerdale.gov.uk,
    copeland.gov.uk) are refused by the egress proxy. Checked 2026-11-06: the council''s planning pages,
    its sitemap and MHCLG''s register show no newer or Cumberland-wide list or consultation. All three
    lists are more than two years old, so outdated.'
  status: outdated
submission-standards:
- item: 'Allerdale and Copeland areas: all plans carry a drawing number and title (revised plans with
    a suffix and the nature of the revision) and are labelled with a scale'
  level: must
- item: 'Allerdale and Copeland areas: each drawing submitted electronically shows the scale and print
    size (for example 1:50 @ A3)'
  level: must
- item: 'Allerdale and Copeland areas: no unnecessary colour, to keep file sizes down; red and blue colour
    on site location plans is essential'
  level: should
- item: 'Allerdale and Copeland areas: supporting documents over 100 pages come with a summary of the
    key points of no more than 20 pages'
  level: should
- item: 'Allerdale and Copeland areas: hard-copy application forms signed and dated (a typed signature
    is acceptable for electronic applications)'
  level: must
- item: 'Minerals, waste and council development: all plans drawn to a recognised metric scale with the
    scale and direction of north clearly shown'
  level: must
- item: 'Minerals, waste and council development: the completed validation checklist submitted with the
    application, explaining why any item is not provided'
  level: must
- item: 'Minerals, waste and council development: unless submitted electronically, one original and three
    copies of the form, plans and documents'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: false
  issues-open: 0
  notes: 'Grokbot''s link opens, but it is the inherited Cumbria County Council minerals, waste and Reg
    3 list (November 2021, not March 2014), and its rows sit under Full planning when they belong under
    Minerals & waste. Cumberland''s general requirements are still the legacy Allerdale, Carlisle and
    Copeland area checklists, none of which were captured. Even within the M&W list, nine requirements
    (e.g. Birdstrike, Blasting, Minerals Need, PRoW) are missing and most triggers are fragments. Fixed
    2026-11-05: every file was rewritten from the council''s latest list.'
