reference: daylight-sunlight-assessment
local-authority: CUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - romp
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
source-text: In circumstances where there is a potential adverse impact upon the current levels of sunlight/daylight
  enjoyed by adjoining properties or building(s), including associated gardens or amenity space, then
  applications may also need to be accompanied by a daylight/sunlight assessment.
must-include:
- item: The impact on neighbouring properties and uses in terms of overshadowing, with enough information
    to determine existing and expected sunlight levels
  level: must
confidence: medium
notes: 'Minerals, waste and the council''s own (Regulation 3) development: the inherited Cumbria County
  Council list (November 2021), https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf,
  page 18. Applications ''may also need'' one, so it shows as ''check''.'
review-status: unverified
field-status: {}
