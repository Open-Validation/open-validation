reference: land-contamination-assessment
local-authority: CAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: Possible contamination (including ground/mining gas) from mineral or coal workings,
          waste disposal, previous development or use, or where remediation is required; including land
          on the Council's register of contaminated land.
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a site of previous landfill or mineral working (ground or mining
          gas).
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: NPPF
source-text: For land where there is the possibility of contamination (including ground/mining gas) from
  mineral or coal workings, waste disposal, previous development or use or where remediation is required.
  As identified in the Councils register of contaminated land or contamination from ground or mining gas
  if 250 metres from a site of previous landfill or mineral working.
must-include:
- item: Prepared by a suitably qualified party and presented as a formal report
  level: must
- item: Based on a conceptual site model identifying potential sources, pathways and receptors
  level: should
- item: A remediation programme, with a mechanism for verifying completion of the works, where significant
    risks of contamination or gas generation are identified
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Significant risks of contamination or gas generation are identified.
  source-text: Should significant risks of contamination or gas generation be identified, a remediation
    programme should be submitted. This shall include a mechanism for verification that remediation works
    have been completed.
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential) (Contaminated Land Desktop Study/ Remediation Statement). The 250 metre
  landfill/mineral working trigger and the remediation programme are in Checklist 2 only.
review-status: unverified
field-status: {}
