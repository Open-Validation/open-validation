reference: cil-form
local-authority: CAN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: new-build
        value: true
        description: New build floor area, including extensions.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A new dwelling.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Cannock Chase CIL Charging Schedule (adopted 1 June 2015); CIL Regulations 2010
source-text: Community Infrastructure Levy if it involves new build floor area, including extensions or
  a new dwelling. You must therefore submit the national CIL form ... This is required for every planning
  application since the adoption of the Council’s CIL Charging Schedule on 1 June 2015.
confidence: medium
notes: From the council's list (published January 2024), Introduction and National Requirements section
  (CIL Liability Form). The introduction ties the form to new build floor area; the CIL section says every
  planning application. Missing CIL forms are named as the most common cause of delay.
