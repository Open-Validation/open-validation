reference: lighting-assessment
local-authority: CAN
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: Street lighting.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting.
  - condition:
      field: illuminated
      value: true
      description: Illumination of advertisements.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Lighting
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - special-area-of-conservation
          - local-wildlife-site
          - wildlife-corridor
          description: In or adjacent to areas of ecological interest (designated sites, ecological corridors).
      - condition:
          field: protected-species
          value: true
          description: Habitat likely to be used by protected species, such as bats.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
source-text: Proposals involving street lighting, floodlighting and illumination of advertisements and
  any lighting in or adjacent to areas of ecological interest e.g. designated sites, ecological corridors,
  habitat likely to be used by protected species, such as bats etc. ... Proposals involving lighting,
  floodlighting or other illumination of advertisements shall provide details of the precise means of
  illumination.
must-include:
- item: Siting, numbers and timing of lights, with their intensity in lux
  level: must
- item: 'For advertisements: the precise means of illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential), Validation
  Checklist 3 (Non-Residential) and Validation Checklist 4 (Advertisements) (Lighting details and assessments).
review-status: unverified
field-status: {}
