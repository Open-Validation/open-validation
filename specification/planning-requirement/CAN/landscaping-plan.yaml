reference: landscaping-plan
local-authority: CAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
  - all:
    - application-type:
        in:
        - outline
    - ref: major-development
  - all:
    - ref: major-development
    - discretionary
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        - special-area-of-conservation
        description: Minor development within or visible from the Cannock Chase National Landscape or
          Special Area of Conservation.
    - discretionary
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Cannock Chase Design SPD (April 2016), Appendices C and D
source-text: 'All full applications for major development will require full landscape details. Outline
  applications for major development must include a masterplan to show how the development and accompanying
  landscaping can be accommodated on the site. ... Will be required for: Major developments with wider
  landscape impacts. May be required for: Minor developments, within or would be visible from the Cannock
  Chase National Landscape (formally known as Cannock Chase Area of Outstanding Natural Beauty) or Special
  Area of Conservation.'
must-include:
- item: Full hard and soft landscape details
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'For outline major development: a masterplan showing how the development and its landscaping can
    be accommodated on the site'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential) (Landscaping Details (hard & soft)). Checklist 3's 'when needed' wording
  repeats the LVIA wording ('wider landscape impacts', 'may be required for' minor development near the
  National Landscape or SAC), which is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
