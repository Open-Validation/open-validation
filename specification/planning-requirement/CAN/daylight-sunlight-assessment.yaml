reference: daylight-sunlight-assessment
local-authority: CAN
required-if:
  any:
  - all:
    - condition:
        field: building-height
        operator: '>'
        value: 2.5
        description: A proposed building over 2.5m high.
    - condition:
        field: distance-to-site-boundary
        operator: <=
        value: 2
        description: Within 2m of a boundary (of a residential property).
  - discretionary
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Existing trees within or adjacent to the site.
    - discretionary
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Cannock Chase adopted design guidance; BRE right to light and daylighting guidelines
source-text: Required in cases where development may have impacts on the residential amenity of neighbouring
  properties and in all cases in which a proposed building is over 2.5m high within 2m of a boundary.
  Also required in respect of existing trees within or adjacent to the site and its impacts on use and
  enjoyment of property and garden areas. ... Required where the impact upon current levels of sunlight
  and/or daylight enjoyed by occupants of adjoining or near properties could be affected and for all developments
  which result in buildings over 2.5m within 2m of the boundary of a residential property.
must-include:
- item: Considers any affected neighbouring property (an assessment or plans)
  level: must
- item: How the proposal meets the Council's design guidance and the BRE guidelines (e.g. the 25 degree
    standard)
  level: should
- item: Tree impacts ideally incorporated within the Arboricultural Impact Assessment
  level: should
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 1 (Householder), Validation
  Checklist 2 (Residential) and Validation Checklist 3 (Non-Residential) (Sunlight and Daylight Assessment
  or Plans which seek to consider any affected neighbouring property). 'May have impacts on residential
  amenity' and the effect of existing trees are judgements, so they show as discretionary.
review-status: unverified
field-status: {}
