reference: site-plan
local-authority: CAN
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following plans will be required as part of most applications: ... Site/Block Plan –
  Show the whole of the proposal'
must-include:
- item: Scale of 1:200 or 1:500
  level: must
- item: The relationship of the proposal to existing buildings and features on the site and to adjacent
    land uses, buildings, features and highways
  level: must
- item: The access to the site from a public road
  level: must
- item: Any buildings, trees/hedges or other features within or adjacent to the site or within 10 metres
    of its boundary
  level: must
- item: Details of the visibility splays that can be achieved, and whether any roadside hedge, wall or
    tree(s) must be removed, drawn in accordance with Manual for Streets (7.7 and 7.8)
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new vehicular access or material intensification in the use of an existing access.
  source-text: Any application that includes a new vehicular access or material intensification in the
    use of an existing access should include details of visibility splays that can be achieved and whether
    this will require the removal of any roadside hedge, wall or tree(s).
- item: 'For advertisements that could interfere with a visibility splay: the available visibility and
    the precise position of the sign'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - discretionary
  source-text: Where an advertisement could reasonably interfere with a visibility splay from an adjacent
    or nearby highway junction, details of the available visibility and precise position of the sign shall
    be provided
confidence: medium
notes: From the council's list (published January 2024), National Requirements section. The list says
  these plans are needed for 'most applications' without naming the types; the types here are the planning
  and listed building consent applications. The visibility splay item is from Checklists 2 and 3 (Transport)
  and the advertisement item from Checklist 4; 'could reasonably interfere' is a judgement, so it shows
  as discretionary.
review-status: unverified
field-status: {}
