reference: archaeological-assessment
local-authority: CAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - historic-environment-record
      - archaeological-priority-area
      description: Potential to contain heritage assets of archaeological interest, as identified by the
        Historic Environment Record.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: NPPF
source-text: Development on sites where there is potential for the site to contain heritage assets of
  archaeological interest as identified by the Historic Environment Record which can be accessed through
  the Historic Gateway website.
must-include:
- item: A desk-based assessment, or if necessary a field evaluation, by a Qualified Archaeologist who
    is a registered CIfA member
  level: must
- item: Description of the site, the potential for archaeology and its significance
  level: must
- item: Impact of the proposed development on the archaeology
  level: must
- item: Confirmation of the need or otherwise for field evaluation
  level: must
- item: Advice on the best way to avoid or minimise conflict between conserving the archaeology and the
    development
  level: must
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential).
review-status: unverified
field-status: {}
