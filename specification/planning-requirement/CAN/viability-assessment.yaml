reference: viability-assessment
local-authority: CAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: enabling-development
        value: true
        description: Enabling development.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Viability is relied on to justify a departure from policy.
    - discretionary
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: RICS Guide to Planning and Viability (GN 94/2012), Appendix C
source-text: Where financial considerations are relied upon to justify the proposal or where viability
  is relied upon to justify a departure from adopted planning policy - a financial appraisal will be required,
  for example where you are proposing the loss of a rural pub, a shop or “enabling development”, that
  would not normally be acceptable in principle but is being put forward to meet other planning objectives
  e.g. to protect the future of a listed building.
must-include:
- item: Content as set out in Appendix C of the RICS Guide to Planning and Viability (GN 94/2012)
  level: should
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential) (Financial Viability Appraisal). Whether 'financial considerations are
  relied upon' depends on the applicant's case, so it also shows as discretionary.
review-status: unverified
field-status: {}
