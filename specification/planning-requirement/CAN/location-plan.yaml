reference: location-plan
local-authority: CAN
required-if:
  always: true
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following plans will be required as part of most applications: ... Location Plan (to
  show us where the site is). This must be based on an up-to-date map.'
must-include:
- item: Scale of 1:1250 or 1:2500
  level: must
- item: At least two named roads and the north point
  level: must
- item: Application site edged clearly in red, including all land necessary to carry out the development
    (access from a public highway, access visibility splays, landscaping, car parking and open areas around
    buildings)
  level: must
- item: Blue line around any other land owned by the applicant close to or adjoining the site
  level: should
- item: 'For an extension: the red line normally around the whole property (house, garden and drive) up
    to the road'
  level: should
  required-if:
    condition:
      field: residential-extension
      value: true
      description: An extension to a house or other building.
- item: 'For a new or altered access: the red line includes all land needed for the visibility splay'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new access or an amendment to an access.
- item: 'From a private road, where use would intensify or vehicular access is needed: the red line includes
    the private road up to the public highway'
  level: should
confidence: medium
notes: From the council's list (published January 2024), National Requirements section. The red line examples
  are from 'Useful Tips and FAQS'.
review-status: unverified
field-status: {}
