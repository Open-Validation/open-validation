reference: waste-management-plan
local-authority: CAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1
        description: Businesses.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Cannock Chase 'Developers and Landlords Guide for New Developments/Estates and Multi-Occupancy
  Properties'
source-text: All developments for new dwellings or businesses must include plans showing the location
  of bin stores in relation to the proposed development and on bin collection day with ‘bin carry’ distances
  clearly shown.
must-include:
- item: Location of bin stores in relation to the development, and on collection day, with 'bin carry'
    distances shown
  level: must
- item: How bins/bags can be stored next to the public highway on collection day
  level: must
- item: Adequate access for refuse collection vehicles
  level: must
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential) (Bin storage and collection plan).
review-status: unverified
field-status: {}
