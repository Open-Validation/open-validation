reference: elevation-proposed
local-authority: CAN
required-if:
  any:
  - any:
    - condition:
        field: building-works
        value: true
        description: New or altered buildings.
    - condition:
        field: demolition
        value: true
        description: Buildings to be demolished.
  - application-type:
      in:
      - lbc
      - ldc
      - advertising
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning (Control of Advertisements) (England) Regulations 2007
source-text: Floor Plans and Elevations of all new and altered buildings including any buildings to be
  demolished (to show us the precise details of what you propose). Plans and elevations of the site/buildings
  as existing should also be provided. ... All applications unless disproportionate to the nature of the
  change proposed ... All applications shall include scaled elevation drawings of the proposed signage
  in situ on the building concerned
must-include:
- item: Scale of 1:100, with 1:20 for specific details such as window details on listed buildings
  level: must
- item: 'For advertisements: scaled elevation drawings of the proposed signage in situ on the building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published January 2024), National Requirements section, and Checklists
  4, 5 and 6. Listed building consent and lawful development certificate applications need them 'unless
  disproportionate'.
review-status: unverified
field-status: {}
