reference: noise-assessment
local-authority: CAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: plant-equipment
          value: true
          description: Air-conditioning units.
      - condition:
          field: air-source-heat-pump
          value: true
          description: Some micro-generation technologies (such as air source heat pumps).
      - discretionary
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Generating significant noise/vibration (e.g. takeaways, flues, extraction systems,
            car washes).
      - condition:
          field: noise-sensitive-use
          value: true
          description: Particularly sensitive to significant noise/vibration (e.g. new flats where existing
            noise levels are elevated, close to main roads or railways).
      - all:
        - condition:
            field: traffic-movements-daily
            operator: '>='
            value: 1
            description: Generating significantly increased traffic (such as housing estates or large
              mixed developments).
        - discretionary
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Relevant British Standards for the noise source
source-text: Required for air-conditioning units and some micro-generation technologies. ... For proposals
  generating or particularly sensitive to significant noise/vibration such as new flats or properties
  where existing noise levels are known to be elevated such as close to main roads, railways, takeaways,
  flues, extraction systems and car washes. Noise impact assessments will also be required for all proposals
  generating significantly increased traffic such as housing estates or large mixed developments.
must-include:
- item: Prepared by a suitably qualified professional in line with the relevant British Standards for
    the noise source
  level: should
- item: An acoustic design statement in some cases
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 1 (Householder) (Noise Impact
  assessment), Validation Checklist 2 (Residential) and Validation Checklist 3 (Non-Residential) (Noise/
  Vibration Impact Assessment). 'Some micro-generation technologies' and 'significantly increased traffic'
  have no threshold, so they show as discretionary.
review-status: unverified
field-status: {}
