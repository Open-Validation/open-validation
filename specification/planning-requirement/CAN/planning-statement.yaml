reference: planning-statement
local-authority: CAN
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Development not in accordance with adopted planning policy.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
source-text: For all major developments and all development not in accordance with adopted Planning Policy.
must-include:
- item: The context and need for the development
  level: must
- item: An assessment of how it accords with relevant national and local planning policies
  level: must
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential). It may also give evidence of need or personal circumstances (e.g. a gypsy/traveller
  site). For listed building consent, Checklist 5 asks for a 'Heritage Statement / Planning Statement'
  (see heritage-statement).
review-status: unverified
field-status: {}
