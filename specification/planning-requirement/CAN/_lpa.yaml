  contents-checked: false
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the council''s currently linked Jan 2024 checklist. The extraction is poor:
    it misreads the checklist-by-application-type structure, so it records ''none'' for Householder, Reserved
    matters and LDC, files householder items under Full planning, gives many cut-off or mismatched triggers
    and mixes in the superseded May 2022 draft. The Jan 2024 .docx could not be read as text (binary),
    so contents were compared against the May 2022 draft (same six-checklist structure) and Grokbot''s
    own excerpts. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Staffordshire and Stoke-on-Trent paused 7 Sep 2026
