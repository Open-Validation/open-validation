validation-list:
  url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
  date: 2024-01
  date-basis: 'Cover: ''Validation of Planning Applications: Guide to National and Local Requirements
    ... January 2024'' (document metadata created 8 May 2024). The council''s ''Information on the Planning
    Process'' page (https://www.cannockchasedc.gov.uk/residents/planning-and-building-control/planning/development-control/2-information-planning-process,
    last updated 6 November 2026, checked 2026-11-06) links it as the ''New validation checklist'' and
    asks applicants to review ''the new local validation checklist''; site search found no newer list
    or consultation (the last consultation notice is the draft list of 30 September 2022). Published more
    than two years ago, so outdated, but still the council''s current list. It is a Word document with
    no fixed page numbers, so the notes cite the section or checklist (1 Householder, 2 Residential, 3
    Non-residential, 4 Advertisements, 5 Listed building consent, 6 Lawful development certificates).'
  status: outdated
submission-standards:
- item: Recognised metric scales (1:50, 1:100, 1:500, 1:1,250 or 1:2,500); avoid plans marked 'not to
    scale'
  level: should
- item: A scale bar, or the page size the scale should be read at
  level: should
- item: North point clearly identified
  level: should
- item: Each plan has a reference number and date
  level: should
- item: Where existing boundaries remain, their ongoing ownership is clarified unless removed at the end
    of the development
  level: must
- item: Correct application fee paid (Planning Portal, BACS with receipt, cheque or telephone)
  level: must
- item: Applications are not registered if relevant information is missing and may be returned if it is
    not received in time
  level: must
audit:
  status: audited
