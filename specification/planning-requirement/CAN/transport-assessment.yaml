reference: transport-assessment
local-authority: CAN
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 200
        description: Major residential development over 200 dwellings.
  - all:
    - condition:
        field: use-class
        value: A1-A5
        description: A1-A5 uses (former use classes).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 800
        description: Over 800 sq m.
  - all:
    - condition:
        field: use-class
        value: B1-B8
        description: B1-B8 uses (former use classes).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 2500
        description: Over 2,500 sq m.
  - all:
    - condition:
        field: use-class
        value: D1-D2
        description: D1/D2 uses (former use classes).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1500
        description: Over 1,500 sq m.
  - discretionary
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Planning Practice Guidance (Travel plans, transport assessments and statements); Manual for Streets
source-text: All major developments over 200 dwellings should be accompanied by a Transport Assessment.
  For any development generating or having a significant effect on vehicle or pedestrian movement or other
  transport movement, a Transport Statement must be provided. ... All major developments of A1-A5 uses
  over 800sqm, B1-B8 uses over 2500sqm of B1-B8 or D1/D2 uses over 1500sqm should be accompanied by a
  Transport Assessment.
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential) (Transport Assessment Transport Statement, Travel Plan and Visibility
  Splays). A Transport Statement for development 'generating or having a significant effect on' movement
  has no threshold, so it shows as discretionary. The thresholds use the pre-2020 use classes as the list
  does. The visibility splay details are on the site plan file.
review-status: unverified
field-status: {}
