reference: flood-risk-assessment
local-authority: CAN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Land in flood zone 2 or 3, including minor development and change of use.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: More than 1 hectare in flood zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: More than 1 hectare in flood zone 1.
      - all:
        - condition:
            field: more-vulnerable-use-change
            value: true
            description: Less than 1 ha in flood zone 1 with a change of use to a more vulnerable class
              (e.g. commercial to residential).
        - any:
          - condition:
              field: surface-water-flood-risk
              value: true
              description: The occupation could be affected by surface water flooding.
          - condition:
              field: reservoir-flood-risk
              value: true
              description: The occupation could be affected by flooding from reservoirs.
          - discretionary
      - site:
          in:
          - critical-drainage-area
          description: An area within flood zone 1 with critical drainage problems notified by the Environment
            Agency.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: NPPF; Planning Practice Guidance (Flood risk and coastal change)
source-text: 'A site-specific flood risk assessment is required for all development within Flood Zone
  2 or 3. ... A Flood Risk Assessment (FRA) will be required if the development involves: Land in flood
  zone 2 or 3 including minor development and change of use. More than 1 hectare (ha) in flood zone 1.
  Less than 1 ha in flood zone 1, but including a change of use in development type to a more vulnerable
  class (e.g. from commercial to residential), where the occupation could be affected by sources of flooding
  other than rivers (e.g., surface water drains, canals, reservoirs). An area within flood zone 1 which
  has critical drainage problems as notified by the Environment Agency.'
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 1 (Householder), Validation
  Checklist 2 (Residential) and Validation Checklist 3 (Non-Residential). Other sources such as canals
  have no mapped field, so that part also shows as discretionary. The flood risk sequential test (needed
  in Flood Zones 2 and 3 with exceptions) has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
