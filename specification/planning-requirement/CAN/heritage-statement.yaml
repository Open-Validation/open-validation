reference: heritage-statement
local-authority: CAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - locally-listed-building
        - conservation-area
        description: Buildings of character, locally listed buildings and other buildings in a conservation
          area.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - battlefield
        - world-heritage-site
        - locally-listed-building
        description: Affects a designated or non-designated heritage asset or their settings.
  - application-type:
      in:
      - lbc
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: 'NPPF (Annex 2: Glossary, heritage assets)'
source-text: 'Required for proposals affecting buildings of character, locally listed buildings and other
  buildings in a conservation area. ... Developments affecting a ‘designated heritage asset’, or ‘non-designated
  heritage asset’ or their settings (definition found in NPPF Annex 2: Glossary). ... All applications
  in order to provide the context for the nature of the change sought.'
must-include:
- item: Shows that the relevant historic environment record has been consulted
  level: should
  required-if:
    any:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - application-type:
        in:
        - lbc
- item: The heritage asset(s) assessed using appropriate expertise
  level: should
  required-if:
    any:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - application-type:
        in:
        - lbc
- item: Proportionate to the asset's significance and sufficient to understand the potential impact of
    the proposal
  level: should
- item: 'Householder: may be part of the Design and Access Statement or Planning Statement, in a part
    labelled ''Heritage Statement'''
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 1 (Householder), Validation
  Checklist 2 (Residential), Validation Checklist 3 (Non-Residential) and Validation Checklist 5 (Listed
  Building Consent) (Heritage Statement / Planning Statement). 'Buildings of character' are not a mapped
  designation. For listed building consent it is needed for all applications.
review-status: unverified
field-status: {}
