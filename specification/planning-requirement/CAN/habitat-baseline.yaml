reference: habitat-baseline
local-authority: CAN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Schedule 7A of the Town and Country Planning Act 1990; Article 7 of the DMPO 2015; Environment
  Act 2021
source-text: a plan, drawn to an identified scale which must show the direction of North, showing onsite
  habitat existing on the date of application (or and earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat on the date of application (or an earlier date), including any irreplaceable habitat
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat on the application land.
- item: GIS habitat plans compatible with QGIS (e.g. a QGIS geopackage)
  level: must
  source-text: GIS habitat plans compatible with QGIS (e.g. QGIS geopackage)
confidence: medium
notes: From the council's list (published January 2024), National Requirements section (Biodiversity Net
  Gain Information) and Checklists 2 and 3. The rule follows the law (exempt applications are exempt).
review-status: unverified
