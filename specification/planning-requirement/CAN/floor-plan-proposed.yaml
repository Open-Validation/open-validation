reference: floor-plan-proposed
local-authority: CAN
required-if:
  any:
  - any:
    - condition:
        field: building-works
        value: true
        description: New or altered buildings.
    - condition:
        field: demolition
        value: true
        description: Buildings to be demolished.
  - application-type:
      in:
      - lbc
      - ldc
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor Plans and Elevations of all new and altered buildings including any buildings to be
  demolished (to show us the precise details of what you propose). Plans and elevations of the site/buildings
  as existing should also be provided. ... All applications unless disproportionate to the nature of the
  change proposed
must-include:
- item: Scale of 1:100, with 1:20 for specific details such as window details on listed buildings
  level: must
confidence: medium
notes: From the council's list (published January 2024), National Requirements section, and Checklists
  5 and 6. Listed building consent and lawful development certificate applications need existing and proposed
  floor plans and elevations 'unless disproportionate to the nature of the change proposed'.
review-status: unverified
field-status: {}
