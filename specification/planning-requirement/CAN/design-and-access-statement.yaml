reference: design-and-access-statement
local-authority: CAN
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floor space created of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Planning (Listed
  Buildings and Conservation Areas) Regulations 1990 (as amended 2013)
source-text: 'A ‘Design and Access Statement’ (DAS) must accompany the following types of planning applications:
  Major developments Development in a conservation area consisting the provision of one or more dwelling
  houses Development in a conservation area where the floor space created by the development is 100 square
  metres or more All applications for listed building consent must be accompanied by a Design and Access
  Statement.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes it into account
  level: must
- item: The policy adopted as to access, and how local development document policies on access have been
    taken into account
  level: must
- item: Any consultation on access and what account has been taken of it
  level: must
- item: How any specific issues which might affect access have been addressed
  level: must
- item: 'For listed building consent: how the design takes account of the building''s special architectural
    or historic importance, the physical features that justify its designation, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: access to the building (unless internal changes only), alternative
    means of access considered, and how access policy takes account of the building''s special importance'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2024), National Requirements section. Not required for
  section 73 applications, material change of use, or waste development. A single DAS is acceptable where
  listed building consent is submitted alongside a planning application.
review-status: unverified
field-status: {}
