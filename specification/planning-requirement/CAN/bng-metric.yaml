reference: bng-metric
local-authority: CAN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: Schedule 7A of the Town and Country Planning Act 1990; Article 7 of the DMPO 2015; Environment
  Act 2021
source-text: 'Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015: ... All qualifying major applications, and small site applications
  (from April 2024) must be accompanied by a Biodiversity Net Gain Assessment.'
must-include:
- item: A statement of whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed metric calculation tool, and the publication date and version of the metric
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant wishes to use an earlier date.
- item: A statement of whether the onsite habitat value is lower because of degradation, with supporting
    evidence
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded.
- item: A BNG Statement/BNG Design Stage Report with the metric calculations
  level: must
confidence: medium
notes: 'From the council''s list (published January 2024), National Requirements section (Biodiversity
  Net Gain Information) and Checklists 2 and 3 (Biodiversity Net Gain (BNG) Assessment). The rule follows
  the law: householder and other exempt applications are exempt, as the list itself says. The BNG self-assessment
  form asked of all applications and the draft Habitat Management and Monitoring Plan have no matching
  id (see the unmapped list).'
review-status: unverified
field-status: {}
