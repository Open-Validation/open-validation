reference: construction-management-plan
local-authority: CAN
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development (Checklist 2).
    - discretionary
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
source-text: All major developments (over 10 dwellings), Development in close proximity to sensitive areas
  (such as houses, schools or medical facilities etc) and development proposed where there is restricted
  access (e.g. single track roads accessing the site) and or restricted space on site. ... All major developments
  in close proximity to sensitive areas (such as houses, schools or medical facilities etc) and development
  proposed where there is restricted access (e.g. single track roads accessing the site) and or restricted
  space on site.
must-include:
- item: 'CMP: impact on residents'' amenity (noise, fumes, vibration, hours of working, parking congestion,
    temporary buildings), dust and dirt, waste handling and hours of operation'
  level: should
- item: 'CEMP: safeguarding protected species, local ecology and retained trees/hedges'
  level: should
- item: 'CTMP: highway safety and congestion, parking, unloading and storage of plant and materials, security,
    wheel-washing'
  level: should
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 2 (Residential) and Validation
  Checklist 3 (Non-Residential). Outline applications will not normally need one (a condition is used).
  'Close proximity to sensitive areas' and 'restricted access or space' are judgements, so they show as
  discretionary. The list says all or some of the three elements may be needed.
review-status: unverified
field-status: {}
