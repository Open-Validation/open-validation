reference: biodiversity-survey-report
local-authority: CAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - lbc
    - condition:
        field: protected-species
        value: true
        description: Demolition/conversion of buildings or roof spaces, alterations to cellars, loss of
          semi-natural habitats (including ponds) or works to/loss of trees that may affect protected
          species such as bats, nesting birds and great crested newts.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - special-area-of-conservation
          - local-wildlife-site
          - local-nature-reserve
          - national-nature-reserve
          description: Within, adjacent or functionally linked to a statutory or non-statutory designated
            site for nature conservation.
      - condition:
          field: geodiversity-interest
          value: true
          description: A designated site or feature of geological interest.
      - site:
          in:
          - priority-habitat
          description: Priority habitat.
      - condition:
          field: protected-species
          value: true
          description: May have impacts on biodiversity or protected or priority species.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: NPPF; Cannock Chase 'Delivering Biodiversity Enhancement and Net Gain' guidance note; Biodiversity
  Trigger List
source-text: Required when certain proposals which include demolition/conversion of buildings or roof
  spaces and alterations to cellars, or loss of semi-natural habitats including ponds or works to/loss
  of trees may affect protected species such as bats, nesting birds and great crested newts. ... Proposals
  on sites within, adjacent or functionally linked to a statutory or non-statutory designated site for
  nature conservation and/or geological interest, or which may have impacts on biodiversity or protected
  or priority habitat or species.
must-include:
- item: Existing biodiversity interests on the land and on adjoining or nearby land that may be affected
  level: must
- item: The possible impacts on those biodiversity interests
  level: must
- item: Avoidance, mitigation and/or compensation and enhancement measures
  level: must
- item: In most cases a Preliminary Ecological Appraisal (PEA), informing further surveys
  level: should
- item: A Protected Species Survey and Assessment and/or Ecological Impact Assessment where protected
    or priority species and/or habitats are likely to be affected
  level: should
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected or priority species or habitats likely to be affected.
- item: Surveys by competent persons (e.g. a CIEEM member), at an appropriate time of year, in suitable
    weather, over a sufficient period and using nationally recognised methods
  level: must
- item: Proposed works that will enhance, restore or add to designated sites, priority habitats and features
    or habitats of protected or priority species
  level: should
- item: Information supporting any mitigation and/or compensation, cross referenced to the plans for approval
  level: must
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 1 (Householder) (Biodiversity
  Survey and Assessment), Validation Checklist 2 (Residential) and Validation Checklist 3 (Non-Residential)
  (Biodiversity/Ecological and/or Geological Survey and Assessment) and Validation Checklist 5 (Listed
  Building Consent) (Biodiversity Survey and Report). The Council's Biodiversity Trigger List (Parts 1-3)
  sets out indicative thresholds.
review-status: unverified
field-status: {}
