reference: arboriculturist-report
local-authority: CAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within 15m (edge of trunk) of the development, on the site or adjoining land,
          including street trees.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Building, demolition or engineering works where there are trees within or adjoining
          the site with a stem of more than 75mm diameter at 1.5m above ground.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
source-text: 'Arboricultural Impact Statement Required where trees are located within 15m (edge of trunk)
  of development (on the site or adjoining land, including street trees).

  … and Arboricultural Method Statements All developments involving building, demolition or engineering
  works where there are trees within or adjoining the application site which have a stem of more than
  75mm (3 inches approx.) diameter at 1.5 metres above ground level.'
