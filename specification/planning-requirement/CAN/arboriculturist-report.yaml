reference: arboriculturist-report
local-authority: CAN
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within 15m (edge of trunk) of development, on the site or adjoining land, including
        street trees.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Building, demolition or engineering works with trees within or adjoining the site
          with a stem over 75mm diameter at 1.5m above ground.
source-url: https://www.cannockchasedc.gov.uk/sites/default/files/document-library/CCDC%20validations_document_Jan%202024_final_0_0.docx
policy: BS 5837:2012; Cannock Chase Design SPD (April 2016)
source-text: Required where trees are located within 15m (edge of trunk) of development (on the site or
  adjoining land, including street trees). ... All developments involving building, demolition or engineering
  works where there are trees within or adjoining the application site which have a stem of more than
  75mm (3 inches approx.) diameter at 1.5 metres above ground level.
must-include:
- item: Prepared by a suitably qualified professional in accordance with BS 5837:2012
  level: must
- item: A survey plan
  level: must
- item: An impact assessment specific to the proposed development
  level: must
- item: Details of any works within the Root Protection Area (householder) or mitigation proposals during
    construction
  level: must
- item: Covers all trees on the site and trees within 15m of any operations
  level: must
- item: A tree shading (sunlight and daylight) assessment based on a shading plan, where buildings or
    gardens will be shaded by existing trees
  level: should
confidence: medium
notes: From the council's list (published January 2024), Validation Checklist 1 (Householder) (Arboricultural
  Impact Statement), Validation Checklist 2 (Residential) and Validation Checklist 3 (Non-Residential)
  (Arboricultural Impact Assessment and Arboricultural Method Statements).
review-status: unverified
field-status: {}
