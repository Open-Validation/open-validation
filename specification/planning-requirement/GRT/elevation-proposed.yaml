reference: elevation-proposed
local-authority: GRT
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - reserved-matters
    - advertising
    - ldc-prospective-use
    - ldc-proposed-work-lb
source-url: https://www.guildford.gov.uk/article/22710/Planning-permission-for-works-or-extension-to-a-dwelling
source-text: 'You must submit drawings and information which describe the project, including: existing
  and proposed elevations; existing and proposed floor plans; roof plans (if needed)'
must-include:
- item: 'For advertisements: the size, siting and materials of the advertisement, how far out it will
    project, and lighting details'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: 'drawings showing: the size of the advertisement; the siting of the advertisement; the
    materials involved; how far out the advertisement will project; lighting details'
- item: Adjoining elevations of neighbouring buildings, to show the building in context
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - reserved-matters
  source-text: adjoining elevations of neighbouring buildings (to show your building in context)
- item: Position of any external extractor flues or air conditioning units
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: plant-equipment
        value: true
        description: The proposal includes external extractor flues or air conditioning units.
  source-text: If you propose any external extractor flues or air conditioning units, you will need to
    show the position of the flue/units on the floor or roof plans and elevations.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Planning permission
  for works or extension to a dwelling'. Also listed as a must on the full planning (all five variants),
  listed building consent, reserved matters, advertisement consent and both proposed lawful development
  certificate pages. The outline (some matters reserved) page only says you 'may wish to submit' them,
  and the existing-use lawful development certificate page says there are no local requirements, although
  existing floor plans and elevations make the application more likely to be accepted. The council may
  also ask for more details where the project is in a Neighbourhood Plan area (every application-type
  page). Advertisement details come from the advertisement consent and full planning with advertisement
  pages; adjoining elevations from the listed building consent and reserved matters pages; flue positions
  from the change-of-use-only page.
review-status: unverified
field-status: {}
