    - s73
source-url: https://www.guildford.gov.uk/article/22687/Sustainability-statement-information
policy: 'Climate Change, Sustainable Design, Construction and Energy SPD 2024; Guildford Borough Local
  Plan: Strategy and Sites 2019; Guildford Borough Local Plan: Development Management Policies 2023'
source-text: You should show how you'll follow sustainable design and construction practice for any project.
  This includes refurbishment and extensions. For major developments, provide this information in an energy
  statement and a sustainability statement. Applications for non-major development including householder
  developments must include sustainability information proportionate to the size of the development, and
  adequate information to show how the energy and carbon requirements have been met.
must-include:
- item: 'For major developments: a sustainability statement (with an energy statement)'
  level: must
  required-if:
    ref: major-development
- item: 'For non-major development: sustainability information proportionate to the size of the development,
    showing how the energy and carbon requirements have been met'
  level: must
- item: A completed Climate Change, Sustainable Design, Construction and Energy Questionnaire can be submitted
    to cover this
  level: should
