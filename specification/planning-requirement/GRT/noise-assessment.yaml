reference: noise-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - reserved-matters
      - s73
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: New residential development adjacent to an A road, a railway, a motorway or an area
          which generates noise.
    - condition:
        field: noise-generating-use
        value: true
        description: The project will have an industrial use.
    - condition:
        field: plant-equipment
        value: true
        description: The building will include air conditioning or extraction units.
source-url: https://www.guildford.gov.uk/article/22675/Noise-impact-assessment
policy: National Planning Policy Framework 2019 (paras 180, 182)
source-text: 'This is required if you are applying to build a new residential development which is adjacent
  to either: an A road; a railway; a motorway; an area which generates noise You are also required to
  do a noise impact assessment if your project will have an industrial use or if the building will include
  air conditioning or extraction units.'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Noise impact assessment'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here.
review-status: unverified
field-status: {}
