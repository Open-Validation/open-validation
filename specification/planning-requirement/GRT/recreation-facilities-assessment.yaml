reference: recreation-facilities-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - reserved-matters
      - s73
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: The proposal will remove open space.
    - all:
      - site:
          in:
          - open-space
          description: Creating open space or changing the typology of open space.
      - discretionary
source-url: https://www.guildford.gov.uk/article/22676/Open-amenity-space-assessment
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policy ID4; National Planning Policy Framework
  2019 (para 97)'
source-text: 'This is required if your proposal will either: create or remove open space; change the typology
  of open space'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Open/amenity space assessment'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. The council's 'open/amenity space assessment' is recorded
  here. Creating open space or changing its typology has no exact field and shows as 'check'.
review-status: unverified
field-status: {}
