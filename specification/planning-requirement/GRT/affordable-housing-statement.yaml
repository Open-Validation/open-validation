reference: affordable-housing-statement
local-authority: GRT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 11
          description: Housing including 11 or more properties.
      - condition:
          field: housing-floorspace
          operator: '>'
          value: 1000
          description: Housing over 1,000 sq m of gross internal floor space.
      - all:
        - site:
            in:
            - designated-rural-area
            description: Set in a designated rural area (see policy H2).
        - condition:
            field: dwelling-count
            operator: '>='
            value: 5
            description: Housing including 5 or more properties.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The proposal is to reduce or remove the provision of affordable housing.
source-url: https://www.guildford.gov.uk/article/22657/Affordable-housing-statement
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policies H2 and H3; National Planning Policy
  Framework 2019 (para 63, Annex 2)'
source-text: 'This is required for housing developments: including 11 or more properties or over 1,000
  square metres of internal floor space (gross); including 5 or more properties if set in a designated
  rural area (see policy H2)'
must-include:
- item: A tenure plan showing the affordable units, or an explanation of why it's not practical to follow
    the requirements
  level: must
  source-text: Include a tenure plan showing the affordable units, or an explanation of why it's not practical
    to follow the requirements.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Affordable housing statement'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. The s73 page (https://www.guildford.gov.uk/article/22712/Removal-or-variation-of-a-condition-following-grant-of-planning-permission-or-Listed-Building-Consent)
  asks for it 'if the proposal is to reduce or remove the provision of affordable housing'.
review-status: unverified
field-status: {}
