source-text: roof plans ... roof plans (if needed)
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Full planning permission'.
  Roof plans are a must on the full planning, full with advertisement, full with demolition in a conservation
  area and full with listed building consent pages; the householder, listed building consent, reserved
  matters and proposed lawful development certificate pages say 'roof plans (if needed)', shown as 'check'.
  The list says 'roof plans' without saying existing or proposed, so no separate existing roof plan is
  recorded. The council may also ask for more details where the project is in a Neighbourhood Plan area
  (every application-type page).
