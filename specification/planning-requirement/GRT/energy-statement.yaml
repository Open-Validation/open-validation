reference: energy-statement
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - reserved-matters
      - s73
  - condition:
      field: new-build
      value: true
      description: The application is for new buildings.
source-url: https://www.guildford.gov.uk/article/22664/Energy-statement-information-regarding-energy-and-carbon-emissions
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policy D2; Sustainable Design and Construction
  SPD; National Planning Policy Framework 2019 (paras 150, 151, 153)'
source-text: 'This is required with applications for new buildings. You need to show (and quantify) how
  you will meet the energy requirements set out in our Local Plan: Strategy and Sites 2019 (Policy D2).
  major development need to provide an energy statement; minor development need to provide enough information
  to show they will comply with the Local Plan'
must-include:
- item: Shows (and quantifies) how the energy requirements of Local Plan policy D2 will be met
  level: must
- item: A full energy statement (minor development need only give enough information to show it will comply
    with the Local Plan)
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Energy statement/information
  regarding energy and carbon emissions'. The application-type pages list it under 'You may also need
  to send us the following information'; the document's own page gives the triggers used here.
review-status: unverified
field-status: {}
