reference: archaeological-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - lbc
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: Within or near to an Area of High Archaeological Potential.
    - discretionary
source-url: https://www.guildford.gov.uk/article/22659/Archaeological-desk-based-assessment
policy: Guildford Borough Local Plan; National Planning Policy Framework 2019 (para 189)
source-text: 'This is required if your project either: will take place within or near to an Area of High
  Archaeological Potential; has any archaeological interest'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Archaeological desk-based
  assessment'. The application-type pages list it under 'You may also need to send us the following information';
  the document's own page gives the triggers used here. 'Has any archaeological interest' (and 'near to')
  shows as 'check'. If there is not enough evidence for a desk-based assessment and the site is over 0.4
  ha, a field evaluation will be required.
review-status: unverified
