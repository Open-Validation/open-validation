reference: planning-statement
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - advertising
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.01
        description: Developing or changing the use of over 100 square metres of land (0.01 ha).
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.01
        description: Developing or changing the use of over 100 square metres of land (0.01 ha).
source-url: https://www.guildford.gov.uk/article/22679/Planning-statement
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policies S1-S3; National Planning Policy
  Framework 2019 (para 44)'
source-text: This is required if you want to either develop or change the use of over 100 square metres
  of land.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Planning statement'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. The council also advises a planning statement to create
  new properties, develop 100 or more square metres of commercial, community or educational floor space,
  or develop or refurbish existing buildings.
review-status: unverified
field-status: {}
