reference: arboriculturist-report
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees on or overhanging the site, or the work will impact trees (including
        driveways, patios, drains or other utilities).
source-url: https://www.guildford.gov.uk/article/22690/Tree-survey-Arboricultural-Impact-Assessment-and-Method-Statements-Tree-Protection-Plan
source-text: 'These surveys are required for any project where either: there are trees on or overhanging
  the site; the work will impact trees This includes applications to: build driveways; build patios; lay
  drains; install other utilities'
must-include:
- item: Arboricultural Impact Assessment, completed by a qualified arboriculturalist, with a tree survey
    and a plan showing which trees will be kept or removed
  level: must
- item: Retained trees (and any root protection areas) shown on the plans of the proposed site layout
  level: should
- item: AIA shows how the trees were taken into account in the design, conflicts with trees on site, and
    impacts of the project and the changes in site activity
  level: should
- item: 'Arboricultural Method Statement: how retained trees will be protected, schedules of tree work,
    and how the conflicts in the AIA will be dealt with'
  level: should
- item: 'Tree Protection Plan: measures (protective barriers, fences, ground protection) to protect the
    trees throughout the project'
  level: must
- item: Methods set out in BS 5837:2012
  level: should
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Tree survey/Arboricultural
  Impact Assessment and Method Statements/Tree Protection Plan'. The application-type pages list it under
  'You may also need to send us the following information'; the document's own page gives the triggers
  used here.
review-status: unverified
field-status: {}
