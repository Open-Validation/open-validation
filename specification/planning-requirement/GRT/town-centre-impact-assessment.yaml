reference: town-centre-impact-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and/or leisure located outside town, district and local centres on sites not
        allocated in the Local Plan (Strategy and Sites) 2019.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: Exceeds 500 square metres.
source-url: https://www.guildford.gov.uk/article/22669/Impact-Assessment-retail-and-or-leisure
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policies E7-E9'
source-text: 'This is required if your project: relates to retail and/or leisure; exceeds 500 square metres;
  will be located outside town, district and local centres on sites that are not allocated in the Local
  Plan (Strategy and Sites) 2019'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Impact Assessment (retail
  and/or leisure)'. The application-type pages list it under 'You may also need to send us the following
  information'; the document's own page gives the triggers used here.
review-status: unverified
field-status: {}
