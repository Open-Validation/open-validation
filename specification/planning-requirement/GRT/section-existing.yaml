reference: section-existing
local-authority: GRT
required-if:
  any:
  - application-type:
      in:
      - full
      - lbc
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline-some
        - reserved-matters
        - s73
    - condition:
        field: site-level-change
        operator: '>='
        value: 1000
        description: The project changes the level of the site by 1 metre or more (front to back and/or
          side to side).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: Works to a listed building (householder with listed building consent).
    - discretionary
source-url: https://www.guildford.gov.uk/article/22698/Full-planning-permission
source-text: existing and proposed site sections ... This is required if your project will cause the level
  of a site to change by 1 metre or more (front to back and/or side to side).
must-include:
- item: Sections through the extension and building or structure (e.g. decking), at a scale of 1:50 or
    1:100
  level: must
  required-if:
    condition:
      field: site-level-change
      operator: '>='
      value: 1000
      description: The project changes the level of the site by 1 metre or more (front to back and/or
        side to side).
  source-text: sections through the extension and building or structure (e.g. decking) ... Plans of sections
    need to be at a scale of 1:50 or 1:100.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Full planning permission'.
  Site sections are a must on the full planning (all five variants), listed building consent and reserved
  matters pages. The 'Site Levels/Section' page (https://www.guildford.gov.uk/article/22681/Site-Levels-Section)
  asks for sections on any listed application type when levels change by 1 metre or more. The householder
  with listed building consent page asks for 'existing and proposed internal elevations, framing, and
  cross sections (if needed)', shown as 'check'. The existing/proposed site levels and finished floor
  levels the same pages ask for have no matching requirement and are listed in the unmapped requirements.
  The council may also ask for more details where the project is in a Neighbourhood Plan area (every application-type
  page).
