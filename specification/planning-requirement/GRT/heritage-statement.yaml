reference: heritage-statement
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - advertising
      - ldc-proposed-work-lb
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - archaeological-priority-area
      - scheduled-monument
      - park-and-garden
      description: Work affecting a listed building and/or its setting; new development or demolition
        in a conservation area; work within an area of archaeological potential, a scheduled ancient monument
        or a historic park or garden.
source-url: https://www.guildford.gov.uk/article/22668/Heritage-statement
policy: 'Guildford Borough Local Plan 2003 policies HE2, HE4, HE5, HE7-HE10 and HE12; Guildford Borough
  Local Plan: Strategy and Sites 2019 policy D3; National Planning Policy Framework 2019 (para 194)'
source-text: 'A Heritage Statement is required if your project links to either: work affecting a listed
  building and/or its setting; a new development in a conservation area; demolition work in a conservation
  area; work within an area of archaeological potential; work within the area of a scheduled ancient monument;
  work within a historic park or garden'
must-include:
- item: Identifies the significance of the heritage asset and justifies the project
  level: must
  source-text: 'The purpose of a Heritage Statement is to: identify the significance of the protected
    building or area (this is called the heritage asset); justify your project'
- item: Identifies the site, including any outbuildings and boundaries
  level: should
- item: Identifies what type of heritage asset it is (e.g. listed building, conservation area)
  level: should
- item: Describes the asset's nature (age, building type, materials, general character), referring to
    its list description or conservation area appraisal if possible
  level: should
- item: Shows how the development site links to its surroundings
  level: should
- item: Describes the project (scale, height, construction methods, materials, design, details, any associated
    landscaping)
  level: should
- item: Shows how the project affects the asset and/or its setting (loss or concealment of key features,
    compromised views, impact on the relationship between buildings, other impacts)
  level: should
- item: Explains how the project will preserve, enhance, or increase awareness of the asset
  level: should
- item: Explains the steps taken to minimise or prevent any harm to the asset
  level: should
- item: Photographs or other evidence which explain or justify the proposal
  level: should
confidence: medium
notes: 'From the council''s list (last updated and reviewed 7 July 2021), web page ''Heritage statement''.
  The householder and full planning pages for demolition in a conservation area or listed building consent,
  and the listed building lawful development certificate page, require it ''if: the site is in a Conservation
  Area; you are working on a listed building; the site affects a listed building''s setting''; the other
  listed pages say you may need it. The ''should'' items are what the page says ''effective statements
  will'' include. The listed-building-consent-only page does not list it (it is a national requirement
  there).'
review-status: unverified
field-status: {}
