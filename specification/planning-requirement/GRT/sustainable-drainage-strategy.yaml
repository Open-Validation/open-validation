reference: sustainable-drainage-strategy
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - ref: major-development
source-url: https://www.guildford.gov.uk/article/22686/Surface-water-drainage-information
policy: Surrey County Council SuDS planning advice; Guildford Surface Water Advice Note
source-text: Planning applications for major projects are required to prove land drainage will not increase
  surface water runoff.
must-include:
- item: Shows that land drainage will not increase surface water runoff
  level: must
- item: 'Shows that priority has been given to Sustainable Drainage Systems (SuDS): how and where they
    will be built'
  level: should
- item: Plans to manage and maintain the drainage system over the lifetime of the development
  level: should
- item: A completed Surface Water Drainage form (pro forma)
  level: must
  source-text: To meet drainage requirements, submit a Surface Water Drainage form with your application.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Surface water drainage
  information'. The application-type pages list it under 'You may also need to send us the following information';
  the document's own page gives the triggers used here. The 'Drainage requirements' page (https://www.guildford.gov.uk/article/16858/Drainage-requirements)
  defines the major projects as 10 or more properties or 1,000 square metres of non-residential floor
  space, and asks for the Surface Water Drainage form.
review-status: unverified
field-status: {}
