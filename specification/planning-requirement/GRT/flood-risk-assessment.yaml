reference: flood-risk-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3 (including Zone 3b).
    - site:
        in:
        - critical-drainage-area
        description: Flood Zone 1 where the area has critical drainage problems.
    - site:
        in:
        - surface-water-flood-risk
        description: Flood Zone 1 where the area is affected by surface water flooding.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: A site of more than 1 hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: A site of more than 1 hectare.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: New uses that are more vulnerable to flooding than the old uses.
      - discretionary
source-url: https://www.guildford.gov.uk/article/22666/Flood-risk-assessment
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policy P4; National Planning Policy Framework
  2019 (paras 155-165)'
source-text: 'If your project takes place in Zone 1, a flood risk assessment is required if either: the
  area has critical drainage problems; the area is affected by surface water flooding; the project site
  will be more than 1 hectare; the project will introduce new uses to the land which are more vulnerable
  to flooding than the old uses All project in Zones 2 or 3 (including Zone 3b) require a flood risk assessment.'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Flood risk assessment'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. A change to a more vulnerable use shows as 'check'
  because there is no field for flood vulnerability.
review-status: unverified
field-status: {}
