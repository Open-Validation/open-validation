reference: land-contamination-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: The project will cause ground disturbances.
    - discretionary
    - site:
        in:
        - contaminated-land
        description: The land could be contaminated because of its previous use.
source-url: https://www.guildford.gov.uk/article/22661/Contaminated-land-assessment
policy: Guildford Borough Local Plan 2003 policies G3 and G4; National Planning Policy Framework 2019
  (paras 178-179, Annex 2)
source-text: 'This is required if your project will cause either: ground disturbances; changes to the
  groundwater regime It''s also required if the land could be contaminated because of its previous use.'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Contaminated land assessment'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. The full planning with demolition in a Conservation
  Area page (https://www.guildford.gov.uk/article/22701/Full-planning-permission-with-demolition-in-a-Conservation-Area)
  narrows it to 'extensions at ground level where the land is identified as at 'high' risk'. 'Changes
  to the groundwater regime' has no exact field and shows as 'check'.
review-status: unverified
field-status: {}
