reference: floor-plan-proposed
local-authority: GRT
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - reserved-matters
    - ldc-prospective-use
    - ldc-proposed-work-lb
source-url: https://www.guildford.gov.uk/article/22710/Planning-permission-for-works-or-extension-to-a-dwelling
source-text: 'You must submit drawings and information which describe the project, including: existing
  and proposed elevations; existing and proposed floor plans; roof plans (if needed)'
must-include:
- item: Position of any external extractor flues or air conditioning units (on the floor or roof plans)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: plant-equipment
        value: true
        description: The proposal includes external extractor flues or air conditioning units.
  source-text: If you propose any external extractor flues or air conditioning units, you will need to
    show the position of the flue/units on the floor or roof plans and elevations.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Planning permission
  for works or extension to a dwelling'. Also a must on the full planning (all five variants), listed
  building consent, reserved matters and both proposed lawful development certificate pages. Not asked
  for on the advertisement consent page; optional on the outline (some matters reserved) page; only 'more
  likely to be accepted' for an existing-use lawful development certificate. The council may also ask
  for more details where the project is in a Neighbourhood Plan area (every application-type page). The
  flue item comes from the change-of-use-only page.
review-status: unverified
