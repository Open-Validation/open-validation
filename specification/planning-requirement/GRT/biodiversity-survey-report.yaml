reference: biodiversity-survey-report
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-protection-area
        - special-area-of-conservation
        description: In or next to a national habitat site.
    - condition:
        field: near-watercourse
        value: true
        description: Within 8 metres of a watercourse or within the corridor of a watercourse.
    - condition:
        field: protected-species
        value: true
        description: Known or likely to contain protected species or habitats.
source-url: https://www.guildford.gov.uk/article/22660/Biodiversity-assessment
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policy ID4; Guildford Borough Local Plan
  2003 policy NE4; National Planning Policy Framework 2019 (paras 174-176); Circular 06/2005'
source-text: 'This is required if the site is: in or next to a national habitat site; within 8 metres
  of a watercourse or within the corridor of a watercourse; known or likely to contain protected species
  or habitats'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Biodiversity assessment'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. The list does not say which designations count as
  a 'national habitat site'.
review-status: unverified
field-status: {}
