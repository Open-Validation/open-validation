reference: lighting-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - reserved-matters
      - s73
      - advertising
  - any:
    - condition:
        field: external-lighting
        value: true
        description: The application includes lighting details.
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements are proposed.
source-url: https://www.guildford.gov.uk/article/22672/Lighting-assessment
policy: Guildford Borough Local Plan 2003 policies G1(8), G8 and G9; Advertisements and Signs SPD; National
  Planning Policy Framework 2019 (para 132)
source-text: This is required for all applications for planning permission or advertisement consent which
  include lighting details.
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Lighting assessment'.
  The application-type pages list it under 'You may also need to send us the following information'; the
  document's own page gives the triggers used here. The advertisement consent page adds '(where illuminated
  advertisements are proposed)'.
review-status: unverified
field-status: {}
