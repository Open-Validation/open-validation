source-text: 'You must submit drawings and information which describe the project, including: existing
  and proposed elevations; existing and proposed floor plans; roof plans (if needed)'
confidence: medium
notes: From the council's list (last updated and reviewed 7 July 2021), web page 'Planning permission
  for works or extension to a dwelling'. Also listed as a must on the full planning (all five variants),
  listed building consent, reserved matters, advertisement consent and both proposed lawful development
  certificate pages. The outline (some matters reserved) page only says you 'may wish to submit' them,
  and the existing-use lawful development certificate page says there are no local requirements, although
  existing floor plans and elevations make the application more likely to be accepted. The council may
  also ask for more details where the project is in a Neighbourhood Plan area (every application-type
  page).
