reference: transport-assessment
local-authority: GRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: convenience-retail-floorspace
        operator: '>='
        value: 250
        description: Food retail (A1) 250 sq m or more.
    - condition:
        field: comparison-retail-floorspace
        operator: '>='
        value: 800
        description: Non-food retail (A1) 800 sq m or more.
    - condition:
        field: office-floorspace
        operator: '>='
        value: 1500
        description: B1 business 1,500 sq m or more.
    - condition:
        field: industrial-floorspace
        operator: '>='
        value: 2500
        description: B2 general industrial 2,500 sq m or more.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 3000
        description: B8 storage or distribution 3,000 sq m or more.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 75
        description: C1 hotels with 75 bedrooms or more.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 'C3 dwelling houses: 50 units or more.'
    - condition:
        field: traffic-movements-peak-hour
        operator: '>'
        value: 30
        description: 'Other uses: over 30 two-way vehicle movements per hour.'
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 100
        description: 'Other uses: over 100 two-way vehicle movements per day.'
    - condition:
        field: parking-spaces
        operator: '>'
        value: 100
        description: 'Other uses: over 100 parking spaces.'
    - discretionary
source-url: https://www.guildford.gov.uk/article/22688/Transport-Statement-Transport-Assessment
policy: 'Guildford Borough Local Plan: Strategy and Sites 2019 policies ID1 and ID3; Guildford Borough
  Local Plan 2003 policies G1 and M3; National Planning Policy Framework 2019 (paras 109-111)'
source-text: 'The table shows which of these documents you''re required to submit with your application.
  The documents we need depend on the size of your project. ... You''re only required to provide a transport
  assessment and travel plan for these buildings if: the site will experience over 30 two-way vehicle
  movements per hour; the site will experience over 100 two-way vehicle movements per day; the site will
  contain over 100 parking spaces'
must-include:
- item: A full Transport Assessment (not a Transport Statement) above the top of the size band for the
    use
  level: must
  required-if:
    any:
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 800
        description: Food retail (A1) over 800 sq m.
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 1500
        description: Non-food retail (A1) over 1,500 sq m.
    - condition:
        field: office-floorspace
        operator: '>'
        value: 2500
        description: B1 business over 2,500 sq m.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 4000
        description: B2 general industrial over 4,000 sq m.
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 5000
        description: B8 storage or distribution over 5,000 sq m.
    - condition:
        field: bedroom-count
        operator: '>'
        value: 100
        description: C1 hotels over 100 bedrooms.
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: C3 dwelling houses over 80 units.
    - condition:
        field: traffic-movements-peak-hour
        operator: '>'
        value: 30
        description: 'Other uses: over 30 two-way vehicle movements per hour.'
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 100
        description: 'Other uses: over 100 two-way vehicle movements per day.'
    - condition:
        field: parking-spaces
        operator: '>'
        value: 100
        description: 'Other uses: over 100 parking spaces.'
    - discretionary
confidence: medium
notes: 'From the council''s list (last updated and reviewed 7 July 2021), web page ''Transport Statement/Transport
  Assessment''. The application-type pages list it under ''You may also need to send us the following
  information''; the document''s own page gives the triggers used here. The thresholds use the old use
  classes: Transport Statement from A1 food 250, A1 non-food 800, A2 1,000, A3 300, A4 300, A5 250, B1
  1,500, B2 2,500, B8 3,000, D1 500 and D2 500 sq m; C1 75 bedrooms; C2 30 hospital/nursing home beds,
  50 students or 250 hostel residents; C3 50 units. Transport Assessment above the top of each band (800,
  1,500, 2,500, 2,500, 600, 500, 2,500, 4,000, 5,000, 1,000 and 1,500 sq m; 100 bedrooms; 50 beds, 150
  students, 400 residents; 80 units). A2, A3, A4, A5, C2, D1 and D2 have no matching field and show as
  ''check''. For other uses (stadia, retail, warehouse clubs, nightclubs...) contact Surrey County Council
  Highway Authority; the movement and parking thresholds apply to those.'
review-status: unverified
field-status: {}
