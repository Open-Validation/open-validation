reference: sustainable-drainage-strategy
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: Non-major new development (excluding householder proposals).
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: All major planning applications need to be accompanied by a detailed drainage assessment
  clearly demonstrating the use of sustainable drainage methods. ... All non major new development proposals
  (excluding householder proposals) must be accompanied by a drainage statement and plan showing how the
  drainage from the proposed development will be managed.
must-include:
- item: 'For major development: a detailed drainage assessment showing sustainable drainage methods, with
    run off rates, discharge locations and the water cycle strategy (reduce, recycle, reuse)'
  level: must
  required-if:
    ref: major-development
- item: 'For non-major new development: a drainage statement and plan showing how drainage will be managed'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: Non-major new development.
- item: A completed Drainage Assessment, submitted with the application form
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 6, 32. 'Drainage Assessment and Plans (including
  SUDS details)'.
review-status: unverified
field-status: {}
