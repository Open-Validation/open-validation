reference: lighting-assessment
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a Listed Building or a Conservation Area.
    - site:
        in:
        - local-wildlife-site
        description: In the vicinity of a Local Wildlife Site or green link.
    - condition:
        field: near-watercourse
        value: true
        description: In the vicinity of a watercourse.
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: All proposals involving the provision of publicly accessible developments, in the vicinity
  of residential property, a Listed Building or a Conservation Area, Local Wildlife Site, green link or
  watercourse where external lighting would be provided or made necessary by the development.
must-include:
- item: Hours of operation
  level: should
- item: An isolux contour map showing light spillage to 1 lux
  level: should
- item: Light levels and column heights
  level: should
- item: Layout plan with beam orientation and a schedule of equipment
  level: should
- item: Measures such as hoods and cowls to avoid glare
  level: should
- item: Impact on nearby dwellings or roads, and planting to mitigate it
  level: should
confidence: medium
notes: From the council's list (published February 2024), page 6, 17, 33-34. 'External Lighting details'.
  Publicly accessible development and the vicinity of residential property show as discretionary. The
  items are listed 'as relevant'.
review-status: unverified
field-status: {}
