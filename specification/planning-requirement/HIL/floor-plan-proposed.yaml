reference: floor-plan-proposed
local-authority: HIL
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - prior-approval
    - lbc
    - advertising
    - ldc
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Drawings at a scale of 1:50 or 1:100 showing floor plans of the existing buildings & the
  proposed building, identifying each relevant floor/ part floor, roof, and means of access.
must-include:
- item: Drawn at a scale of 1:50 or 1:100, identifying each relevant floor or part floor, roof and means
    of access
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: Proposed plans shown in context with the site boundary and any existing adjacent buildings
  level: should
- item: 'For change of use: the extent of the existing and proposed use within the land or building'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
confidence: medium
notes: From the council's list (published February 2024), page 5, 33. 'prior-approval' stands for the
  'Prior Approval (Non- Householder)' checklist (page 20).
review-status: unverified
field-status: {}
