reference: heritage-statement
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - change-of-use
        - advertising
    - any:
      - site:
          in:
          - listed-building
          - conservation-area
          - park-and-garden
          - scheduled-monument
          - locally-listed-building
          description: Affects a heritage asset (listed building, conservation area, registered park and
            garden, scheduled monument, locally listed building).
      - site:
          in:
          - listed-building-setting
          description: Affects the setting of a heritage asset.
      - discretionary
  - application-type:
      in:
      - lbc
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: New development which affects a ‘heritage asset’ or its setting or for new development proposals
  in conservation areas. Designated Heritage Assets are Listed Buildings, Conservation Areas, Registered
  Historic Parks and Gardens, Scheduled Ancient Monuments and locally listed buildings. A Heritage Statement
  may also be requested if the Council identifies a building or site as a ‘non-designated heritage asset’
  of architectural, historic, archaeological or artistic interest during the pre-application or application
  process.
must-include:
- item: The history, character and significance of the heritage asset
  level: must
- item: The extent and nature of the proposed development
  level: must
- item: The impact of the development on the heritage asset
  level: must
- item: Justification for the works and any mitigation proposed
  level: must
- item: Shows the Historic Environment Record has been consulted
  level: must
- item: Prepared by an architectural historian or accredited conservation architect
  level: should
  required-if: discretionary
  source-text: For buildings or sites of high significance it is recommended that the statement be prepared
    by an architectural historian or accredited conservation architect.
confidence: medium
notes: From the council's list (published February 2024), page 6, 14-16, 22, 25, 35-36. The householder,
  change of use and advertisement checklists ask for it in a conservation area or for a listed or locally
  listed building; listed building consent always. Non-designated heritage assets identified by the council
  show as discretionary.
review-status: unverified
field-status: {}
