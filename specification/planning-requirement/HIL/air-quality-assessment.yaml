reference: air-quality-assessment
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - air-quality-management-area
        description: In the air quality management area or a Focus area, where air quality is already
          poor.
    - discretionary
  - all:
    - application-type:
        in:
        - change-of-use
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: Within an AQMA.
    - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: An air quality assessment should also be submitted in areas where air quality is already
  poor and could have an adverse impact on the proposed development. ... Air quality assessments will
  be required for certain developments in the air quality management area and Focus areas. ... Air Quality
  Assessment (if major application and within an AQMA and change of use increases the amount of vehicular
  traffic)
must-include:
- item: Whether air quality is an issue
  level: must
- item: Mitigation measures so that occupiers are not negatively affected by existing poor air quality
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 5, 15, 20, 29. 'Certain developments' and,
  for change of use, 'increases the amount of vehicular traffic' have no threshold, so they show as discretionary.
  The non-householder prior approval checklist lists it with no trigger. 'prior-approval' stands for the
  'Prior Approval (Non- Householder)' checklist (page 20).
review-status: unverified
field-status: {}
