reference: arboriculturist-report
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site, or on adjacent land, that could influence or be affected by
          the development.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: loss-of-habitat-features
        value: true
        description: Felling a tree.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: The tree is covered by a Tree Preservation Order or located in a Conservation Area.
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: Where there are trees within the application site, or on land adjacent to it that could influence
  or be affected by the development, information will be required on which trees are to be retained and
  on the means of protecting these trees during construction works. ... Tree Survey (if felling a tree
  covered by a Tree Preservation Order or located in a Conservation Area)
must-include:
- item: Which trees are to be retained
  level: must
- item: How retained trees will be protected during construction
  level: must
- item: Prepared by a qualified arboriculturist
  level: should
confidence: medium
notes: 'From the council''s list (published February 2024), page 5, 14, 39. ''Arboricultural Impact Assessment''
  and ''Tree Survey'' (Definitions: ''Tree Survey/ Arboricultural report'').'
review-status: unverified
field-status: {}
