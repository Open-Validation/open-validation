reference: noise-assessment
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Potentially noise generating development near existing noise sensitive development.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise sensitive uses near existing noise generating uses, classified roads, railways
            or a noisy environment.
      - condition:
          field: plant-equipment
          value: true
          description: Commercial applications including extractor or cooling units near noise sensitive
            uses.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: BS 4142
source-text: Potentially noise generating developments (ie pubs, clubs, takeaways, child care nurseries
  & schools, industrial/commercial uses, recreation) in the vicinity of existing noise sensitive developments
  - residential, schools and hospitals; or . Noise sensitive uses in the vicinity of existing noise generating
  uses, classified roads, railways or in areas with an existing noisy environment such as the city centre;
  or . Mixed use applications comprising both noise generating and noise sensitive uses; or Commercial
  applications including extractor or cooling units in the vicinity of noise sensitive uses.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The existing noise environment, noise sources from or affecting the development, and mitigation
  level: should
- item: Sound power level and likely noise level at the site boundary of noise-producing machinery, and
    where plant will be located
  level: must
- item: Delivery times and opening hours for commercial premises in noise sensitive areas; waste collection
    details
  level: must
- item: 'For development adjoining (including above or below) homes: sound insulation, entrances/exits
    and car parking'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2024), page 6, 20, 37. 'Noise and Vibration Impact
  Assessment'; the non-householder prior approval checklist lists a 'Noise Report' with no trigger. 'prior-approval'
  stands for the 'Prior Approval (Non- Householder)' checklist (page 20).
review-status: unverified
field-status: {}
