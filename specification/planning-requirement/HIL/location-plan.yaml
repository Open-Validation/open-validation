reference: location-plan
local-authority: HIL
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - prior-approval
    - lbc
    - approval-condition
    - non-material-amendment
    - advertising
    - ldc
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Up to date map at a scale of 1:1250 or 1:2500 for larger sites. Application site must be
  clearly edged with a red line & include all land required for the proposed development (including any
  access).
must-include:
- item: Up to date map at a scale of 1:1250, or 1:2500 for larger sites
  level: must
- item: Application site clearly edged with a red line, including all land required for the development
    (including any access)
  level: must
- item: Other land within the control or ownership of the applicant, adjacent or close to the site, edged
    with a blue line
  level: should
- item: Not sourced from Land Registry
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 5, 36-37. Listed in every checklist except
  tree works and Permission in Principle. 'prior-approval' stands for the 'Prior Approval (Non- Householder)'
  checklist (page 20).
review-status: unverified
field-status: {}
