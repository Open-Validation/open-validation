reference: site-plan
local-authority: HIL
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - pa-ecomms-network
    - pa-extension
    - prior-approval
    - lbc
    - advertising
    - ldc
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site plan at a scale of 1:500 accurately showing direction of north, proposed development
  in relation to the site boundaries and other existing buildings on site, all neighbouring buildings,
  roads and footpaths on land adjoining the site including access arrangements, all public rights of way
  crossing or adjoining the site.
must-include:
- item: Scale of 1:100 or 1:200
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Scale of 1:500 (existing and proposed block plans)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - change-of-use
      - pa-ecomms-network
      - pa-extension
      - prior-approval
      - lbc
      - advertising
      - ldc
- item: Direction of north
  level: must
- item: Proposed development in relation to the site boundaries and other existing buildings on site
  level: must
- item: All neighbouring buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: Location of trees, numbered as on the application form
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (published February 2024), page 5, 14, 27, 30. 'Site Plan/Block plan'.
  The full, outline and reserved matters checklists give 1:100 or 1:200; the definition and the other
  checklists give 1:500. Not listed for prior notification of demolition, discharge of conditions, non-material
  amendments or Permission in Principle. 'prior-approval' stands for the 'Prior Approval (Non- Householder)'
  checklist (page 20).
review-status: unverified
field-status: {}
