reference: design-and-access-statement
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area.
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: external-alterations
        value: true
        description: Change of use involving external work.
  - application-type:
      in:
      - lbc
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Design and Access Statement if a Major Planning Application or in designated area ... Design
  and Access Statement (including accessibility statement)
must-include:
- item: The process that led to the proposal, explaining the approach, justification and detail of the
    design
  level: must
- item: The standards of accessibility designed into the development
  level: must
- item: Includes the accessibility statement
  level: must
  required-if:
    application-type:
      in:
      - change-of-use
      - lbc
confidence: medium
notes: From the council's list (published February 2024), page 6, 16, 22, 32. Also listed for change of
  use with external work and listed building consent.
review-status: unverified
field-status: {}
