reference: archaeological-assessment
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - archaeological-priority-area
      description: In an Archaeological Priority Area or Zone.
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves disturbance of the ground.
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: Statements will be required for all proposals involving the disturbance of ground within
  a Archeological Priority Areas and Zones.
must-include:
- item: A desk-based assessment and, where necessary, a field evaluation
  level: must
- item: Plans showing historic features, listed buildings and structures, historic parks and gardens,
    historic battlefields and scheduled ancient monuments
  level: should
- item: Analysis of the significance of the archaeology, history and character of the building or structure
  level: should
- item: Principles of and justification for the proposed work
  level: should
confidence: medium
notes: From the council's list (published February 2024), page 5, 30.
review-status: unverified
field-status: {}
