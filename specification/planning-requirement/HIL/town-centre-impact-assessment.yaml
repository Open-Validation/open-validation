reference: town-centre-impact-assessment
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Out of centre or edge of centre location.
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 200
          description: Over 200 sq m of gross retail floorspace.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Out of centre or edge of centre location.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1000
          description: Over 1,000 sq m of other main town centre uses.
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: National Planning Policy Framework
source-text: If the proposal involves the loss of retail floorspace in a town centre location or development
  proposals in out of centre and edge of centre locations which exceed 200 sqm of gross retail floorspace
  of 1,000sqm of other main town centre uses then a retail impact assessment will be required.
must-include:
- item: Impact on existing, committed and planned public and private investment, and on town centre vitality
    and viability
  level: must
- item: A sequential approach (NPPF) showing no available or suitable town centre sites
  level: must
  required-if:
    all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Edge-of-centre or out-of-centre location.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m of retail or other main town centre uses.
  source-text: Any proposal for 1,000sqm of retail or other main town centre uses in an edge-of-centre
    or out-of-centre location should demonstrate that there are no available or suitable sites in a town
    centre
confidence: medium
notes: From the council's list (published February 2024), page 6-7, 15, 16, 38. 'Town Centre/Retail/Leisure
  Uses Impact Assessment', 'Sequential Test' and 'Retail/office assessment'. Loss of retail floorspace
  in a town centre (also the change of use trigger) shows as discretionary. The loss-of-employment evidence
  (B1, B2, B8) is sent to unmapped.
review-status: unverified
field-status: {}
