reference: town-centre-impact-assessment
local-authority: HIL
required-if:
  any:
  - condition:
      field: loss-of-use
      value: true
      description: The proposal involves the loss of retail floorspace in a town centre location.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: An out of centre or edge of centre proposal.
    - any:
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 200
          description: Exceeding 200 square metres of gross retail floorspace.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Exceeding 1,000 square metres of other main town centre uses.
source-url: https://www.hillingdon.gov.uk/media/5135/Validation-checklist-June-2020/pdf/g3PUBLICATION_Validation_Checklist_June_2020.pdf?m=1613489637773
source-text: Retail/office assessment If the proposal involves the loss of retail floorspace in a town
  centre location or development proposals in out of centre and edge of centre locations which exceed
  200 sqm of gross retail floorspace of 1,000sqm of other main town centre uses then a retail impact assessment
  will be required.
confidence: low
