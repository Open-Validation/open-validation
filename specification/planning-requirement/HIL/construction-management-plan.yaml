reference: construction-management-plan
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - application-type:
      in:
      - pa-demo-building
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: Mayor's Sustainable Design and Construction SPG
source-text: 'Applications for major developments should submit details of how on- site impacts will be
  managed during the demolition/construction phase (particularly on homes, other sensitive uses and biodiversity),
  including traffic management, dust, noise, vibration and stability. ... A method statement detailing:
  • what the works comprise of • how the building(s) would be demolished • the proposed hours of working'
must-include:
- item: How on-site impacts will be managed during demolition and construction (particularly on homes,
    other sensitive uses and biodiversity), including traffic management, dust, noise, vibration and stability
  level: must
  required-if:
    ref: major-development
- item: What the works comprise, how the building(s) would be demolished and the proposed hours of working
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (published February 2024), page 6, 21, 31. 'Demolition and Construction
  Method Statement'; the prior notification (demolition) checklist asks for a method statement.
review-status: unverified
field-status: {}
