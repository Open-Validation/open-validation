reference: transport-assessment
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - prior-approval
  - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: A transport assessment should be submitted as part of any planning application where the
  proposed development has significant transport implications.
must-include:
- item: 'For smaller schemes: an outline of the transport aspects of the application'
  level: must
- item: 'For major proposals: accessibility by all modes, likely modal split, measures to improve public
    transport, walking and cycling, to reduce parking and to mitigate transport impacts'
  level: must
  required-if:
    ref: major-development
- item: Swept path analysis and road safety audits
  level: must
  required-if: discretionary
  source-text: Transport Assessment including swept analysis and road safety audits
confidence: medium
notes: From the council's list (published February 2024), page 7, 20, 39. 'Significant transport implications'
  has no threshold, so it shows as discretionary. The non-householder prior approval checklist lists a
  Transport Statement. 'prior-approval' stands for the 'Prior Approval (Non- Householder)' checklist (page
  20).
review-status: unverified
field-status: {}
