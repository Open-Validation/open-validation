reference: flood-risk-assessment
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of one hectare or greater in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of one hectare or greater in Flood Zone 1.
      - site:
          in:
          - flood-risk-zone
          description: New development in Flood Zone 2 or 3.
      - site:
          in:
          - critical-drainage-area
          description: New development in a critical drainage area.
      - site:
          in:
          - surface-water-flood-risk
          description: Identified drainage problems or high risk of surface water or sewer flooding.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zones 2 and 3a.
  - all:
    - application-type:
        in:
        - change-of-use
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 3.
    - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: National Planning Policy Framework
source-text: An FRA needs to accompany development proposals of one hectare or greater in Flood Zone 1
  and all proposals for new developments located in Flood Zones 2 and 3. FRAs will also be required for
  all new development in critical drainage areas (does not apply to Householder Applications). An FRA
  will also be required where the proposed development or change of use to a more vulnerable class may
  be subject to other sources of flooding, or where there are identified drainage problems or high risk
  of surface water or sewer flooding.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
- item: 'For new dwellings, or non-residential extensions with a footprint over 250 sq m, in Flood Zone
    2 or 3: a statement showing a sequential approach at site level'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwellings.
      - discretionary
- item: The Environment Agency Flood Risk Matrix
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: ground-floor-or-basement
        value: true
        description: A basement or ground floor extension in Flood Zone 2 or 3.
  source-text: Environment Agency Flood Risk Matrix (if the site is in Flood Zones 2 or 3 and the proposal
    is for a basement or ground floor extension)
confidence: medium
notes: 'From the council''s list (published February 2024), page 6, 14, 15, 20, 35. Householder: ''if
  the site is in Flood Zones 2 and 3a''. Change of use: ''if development is in Flood Zone 3 and change
  of use is to a more vulnerable use type'' (shown as discretionary). Other sources of flooding show as
  discretionary. The non-householder prior approval checklist lists it with no trigger. The separate ''Flood
  Risk Sequential Test'' is sent to unmapped. ''prior-approval'' stands for the ''Prior Approval (Non-
  Householder)'' checklist (page 20).'
review-status: unverified
field-status: {}
