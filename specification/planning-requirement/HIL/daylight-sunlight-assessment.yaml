reference: daylight-sunlight-assessment
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
  - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: 'BRE ''Site layout planning for daylight and sunlight: A guide to good practice'' (2011)'
source-text: A daylight and sunlight assessment should be submitted to illustrate that the development
  does not cause unacceptable loss of amenity to adjacent occupiers by reducing the amount of daylight
  or sunlight.
must-include:
- item: Follows the BRE 'Site layout planning for daylight and sunlight' methodology
  level: must
- item: Impacts on existing properties and sites with extant planning permissions
  level: must
- item: Final daylight and sunlight values achieved within the proposed scheme
  level: must
- item: Proposed on-site amenity and recreational areas
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 6, 17, 31-32. Listed in the full, outline
  and reserved matters checklists (pages 5-13) with no trigger; the list says these are items that 'can
  be required', so it shows as discretionary. Also listed for change of use with external work.
review-status: unverified
field-status: {}
