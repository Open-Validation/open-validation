reference: viability-assessment
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The applicant makes a case for not meeting the policy requirements.
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: 'In order to fully assess whether the case made by an applicant for not meeting the policy
  requirements is reasonable and justifiable the London Borough of Hillingdon will require the applicant
  to submit a residual valuation with all the following information:'
must-include:
- item: Full, un-redacted, provided at the time of submission (it will be published online; a redacted
    copy where there is sensitive information)
  level: must
- item: Existing Use Value supported by an independent valuation
  level: must
- item: Land acquisition price, basis of purchase and salient terms; purchase process; purchase costs
    including legal and agents fees
  level: must
- item: Estimated sales values with independent supporting evidence, including a schedule of unit sizes
  level: must
- item: Estimated construction costs supported by tender costs or a QS schedule, with contingency, contract
    fees and itemised abnormals; itemised preliminary costs
  level: must
- item: Professional fees under each heading; S106/CIL costs as advised by the LPA
  level: must
- item: Financing rate and evidence of financing terms
  level: must
- item: Estimated profit with context on the developer's target returns
  level: must
- item: Value/cost of the affordable housing provision, with tenure assumptions and any commuted sum
  level: must
  required-if: discretionary
- item: Supported by an appropriate cash flow analysis if a standard viability model is used
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2024), page 6, 34. Financial Viability Assessment.
  The policy requirements not met are not limited to affordable housing, so the trigger also shows as
  discretionary.
review-status: unverified
field-status: {}
