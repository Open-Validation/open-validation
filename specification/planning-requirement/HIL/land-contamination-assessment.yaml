reference: land-contamination-assessment
local-authority: HIL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - all:
        - site:
            in:
            - contaminated-land
            description: Contamination is known or suspected, or the site is in the vicinity of such land.
        - condition:
            field: ground-disturbance
            value: true
            description: Ground-works are proposed.
      - condition:
          field: sensitive-end-use
          value: true
          description: A vulnerable or sensitive end user (residential, schools, nurseries, hospitals,
            allotments).
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: sensitive-end-use
        value: true
        description: The change of use introduces more sensitive receptors.
    - site:
        in:
        - contaminated-land
        description: An area likely to be contaminated.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: Where contamination is known or suspected or the development site is in the vicinity of such
  land, and ground-works are proposed; or, where there is a vulnerable or sensitive end user ie Residential,
  Schools, Nurseries, Hospitals and Allotments. ... Contaminated Land Assessment (if change of use introduces
  more sensitive receptors to areas likely to be contaminated)
must-include:
- item: Desk study of current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
- item: Preliminary conceptual site model of pollutant linkages and a preliminary risk assessment
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the site is in the vicinity of such land.
- item: Method statement for decommissioning underground storage tanks in line with APEA guidance
  level: must
  required-if: discretionary
  source-text: For applications involving the decommissioning of underground storage tanks, a method statement
    for decommissioning of tanks in line with APEA Guidance.
confidence: medium
notes: From the council's list (published February 2024), page 5, 15, 20, 31. 'Contaminated Land Survey
  & Report'. The non-householder prior approval checklist lists a Contaminated Land Report with no trigger.
  'prior-approval' stands for the 'Prior Approval (Non- Householder)' checklist (page 20).
review-status: unverified
field-status: {}
