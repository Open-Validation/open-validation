reference: fire-statement
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - ref: major-development
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
policy: London Plan (2021) Policy D12
source-text: Fire Statement (majors only)
must-include:
- item: An independent fire strategy produced by a third party suitably qualified assessor
  level: must
- item: 'The building''s construction: methods, products and materials'
  level: must
- item: Means of escape for all building users, including disabled users and level access, with the management
    plan approach
  level: must
- item: 'Access for fire service personnel and equipment: water supplies, equipment, firefighting lifts,
    stairs and lobbies, fire suppression and smoke ventilation, and their maintenance and monitoring'
  level: must
- item: How fire appliances will gain access to the building within the site
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 6, 12, 34-35. Listed in the full and reserved
  matters checklists (not outline).
review-status: unverified
field-status: {}
