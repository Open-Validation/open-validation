reference: biodiversity-survey-report
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - local-wildlife-site
        description: Within or close to a Local Wildlife Site or Green Link.
    - site:
        in:
        - priority-habitat
        description: Known priority habitats.
    - condition:
        field: protected-species
        value: true
        description: Could impact on rare, protected, invasive or notable species, or sites with known
          protected or priority species.
    - discretionary
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: An ecological survey report will be required for applications that could directly or indirectly
  potentially impact on rare, protected, invasive or notable species or habitats and/or on Local Wildlife
  Sites or Green Links. This includes all major applications and some smaller applications, particularly
  those within or close to Local Wildlife Sites, green links or those that will impact upon garden or
  overgrown land.
must-include:
- item: A bat survey
  level: should
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to roofs or lofts.
  source-text: Proposals that involve the demolition of buildings or alterations to roofs or lofts will
    often need to be accompanied by a bat survey.
- item: Species present, potential impacts and mitigation
  level: must
  required-if:
    condition:
      field: loss-of-habitat-features
      value: true
      description: Removal of trees, scrub or hedgerows, or alteration of water courses.
  source-text: Proposals that involve the removal of trees, scrub, hedgerows or alter water courses will
    need to supply information on species present and potential impacts and the mitigation for such impacts.
confidence: medium
notes: From the council's list (published February 2024), page 6, 32-33. 'Ecological survey & reports'.
  Smaller applications that impact garden or overgrown land show as discretionary.
review-status: unverified
field-status: {}
