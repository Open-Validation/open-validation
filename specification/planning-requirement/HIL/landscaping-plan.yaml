reference: landscaping-plan
local-authority: HIL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: external-space
      value: true
      description: New development that includes external space.
source-url: https://pre.hillingdon.gov.uk/downloads/file/2127/validation-checklist
source-text: For major and minor planning applications for all new development proposals that include
  external space. A landscape strategy would be required as a minimum with the requirement for further
  details forming part of a planning condition.
must-include:
- item: Details of existing and proposed planting, at least outline details of the proposed landscaping
    scheme
  level: must
- item: Proposed finished ground levels or contours, means of enclosure, car parking layouts, access and
    circulation areas, structures and ancillary objects
  level: should
- item: Proposed and existing functional services above and below ground
  level: should
- item: Native and/or wildlife friendly species, including large canopy trees and climate-resilient species
  level: should
- item: Use of sustainable drainage and surface water to irrigate new landscaping
  level: should
- item: Boundary treatments that let hedgehogs and other wildlife traverse the site
  level: should
- item: Which trees or landscape features are to be retained and which are to go, and how retained ones
    will be protected during construction
  level: should
confidence: medium
notes: From the council's list (published February 2024), page 6, 36. 'Landscape Strategy'.
review-status: unverified
field-status: {}
