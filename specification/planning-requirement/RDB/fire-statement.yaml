reference: fire-statement
local-authority: RDB
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: A residential building.
        - condition:
            field: educational-accommodation
            value: true
            description: An educational accommodation building.
      - any:
        - condition:
            field: storey-count
            operator: '>='
            value: 7
            description: 7 storeys or more.
        - condition:
            field: building-height
            operator: '>='
            value: 18
            description: 18 metres in height or greater.
  - ref: major-development
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 9A of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; London Plan 2021 policies D12(A) and D12(B)
source-text: All applications providing, modifying, or in the curtilage of, a residential or educational
  accommodation building that is 7 storeys and/or 18 metres in height or greater. … All major applications.
  … Non-major developments, including householder applications
must-include:
- item: 'For higher-risk residential or educational buildings (7 storeys or 18 m or more): the national
    fire statement on the Secretary of State''s form (or a form to similar effect), with the particulars
    it asks for'
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: A residential building.
      - condition:
          field: educational-accommodation
          value: true
          description: An educational accommodation building.
    - any:
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 storeys or more.
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres in height or greater.
- item: 'For major applications: a London Plan fire statement covering construction methods and materials,
    means of escape and evacuation strategy, features reducing risk to life, fire service access and equipment,
    appliance access within the curtilage, and protection of fire safety measures from future modifications'
  level: must
  required-if:
    ref: major-development
- item: 'For major applications: produced by a competent professional (registered fire engineer, IEng
    or CEng and MIFireE), with evidence of competency at the start of the statement'
  level: must
  required-if:
    ref: major-development
- item: 'For non-major developments, including householder applications: a Planning Fire Safety Strategy
    (PFSS), or a Reasonable Exception Statement (RES) where parts or all of London Plan policy D12A are
    not relevant'
  level: must
confidence: medium
notes: 'From the council''s list (published August 2026), pages 4, 13-14, 31-34. Three rows: the national
  fire statement (exempt for outline, S73 and some changes of use), the London Plan fire statement for
  all major applications, and the PFSS or RES for non-major developments including householder applications.
  Only householder proposals can use a RES (as a covering letter), and it also applies to schemes with
  no extra dwellings or units, no lifts, no change to external materials and no change to communal escape
  areas.'
review-status: unverified
field-status: {}
