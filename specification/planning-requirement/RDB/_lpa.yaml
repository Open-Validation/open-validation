submission-standards:
- item: All plans submitted as separate single-page PDF files; other file types or multi-page PDFs are
    not accepted
  level: must
- item: All other documents in PDF format (unless they need to be an Excel document)
  level: should
- item: All drawings state the scale; a scale bar showing 1m and 10m lengths may be added
  level: must
- item: All drawings clearly labelled as proposed or existing (or existing and pre-existing for retrospective
    applications)
  level: must
- item: All areas measured as Gross Internal Area (GIA) under the RICS Code of Measuring Practice (6th
    edition), unless stated otherwise
  level: must
