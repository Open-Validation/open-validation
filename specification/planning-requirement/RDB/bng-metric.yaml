reference: bng-metric
local-authority: RDB
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Environment Act 2021; Schedule 7A of the Town and Country Planning Act 1990
source-text: All planning applications (subject to exceptions)
must-include:
- item: A statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date with justification), with the completed metric calculation tool, its publication date
    and version
  level: must
- item: A statement on whether the onsite habitat value is lower because of degradation, with supporting
    evidence if so
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or an earlier
    date)
  level: must
- item: 'Where significant onsite biodiversity enhancements are proposed: a draft Habitat Management and
    Monitoring Plan'
  level: should
  required-if: discretionary
- item: 'Where an off-site biodiversity gain site is proposed: draft heads of terms for the section 106
    obligations'
  level: should
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: An off-site biodiversity gain site is proposed for the development.
confidence: medium
notes: From the council's list (published August 2026), pages 4, 15-16. The list says 'All planning applications
  (subject to exceptions)'; following the law, this applies where the general biodiversity gain condition
  applies (householder and other exempt applications are exempt).
review-status: unverified
field-status: {}
