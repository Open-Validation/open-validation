reference: roof-plan-proposed
local-authority: RDB
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: The proposal involves changes to roofs.
  - condition:
      field: new-build
      value: true
      description: The proposal is for new buildings (including outbuildings).
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All applications that involve changes to roofs or are for new buildings (including outbuildings).
must-include:
- item: Drawn at 1:50, 1:100 or 1:200, with the scale stated on the plan, showing the shape and materials
    of roofs
  level: must
- item: 'For new developments (other than householder and change of use): shown in context with the site
    boundary and the outline of adjacent buildings'
  level: should
confidence: medium
notes: From the council's list (published August 2026), pages 4, 12.
review-status: unverified
field-status: {}
