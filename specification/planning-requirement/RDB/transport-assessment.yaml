reference: transport-assessment
local-authority: RDB
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - condition:
          field: dwelling-count
          operator: '>'
          value: 50
          description: Above 50 residential units.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: 1,000 sq m of commercial floorspace.
  - discretionary
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP22 and LP23; London Plan 2021 policies GG3, D2, D3,
  D8 and T4
source-text: Major applications above 50 residential units or 1,000 sqm of commercial floorspace … A Transport
  Impact Assessment and a Travel Plan should be submitted alongside non-major planning applications which
  are likely to have significant transport implications.
must-include:
- item: Coverage and detail reflecting the scale of the development and its transport implications
  level: must
- item: The design process, the impact on the existing network and any mitigation needed
  level: must
- item: Includes a parking survey and transport statement
  level: should
confidence: medium
notes: From the council's list (published August 2026), page 51. Listed as 'Transport Impact Assessment
  and Green Travel Plan (inclusive of Parking Survey and Transport Statement)'. Non-major applications
  'likely to have significant transport implications' show as discretionary.
review-status: unverified
field-status: {}
