reference: design-and-access-statement
local-authority: RDB
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new residential units.
  - all:
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The floor space created is 100 sq m or more.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 9 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; London Plan 2021 policy D5 (inclusive design)
source-text: Major applications; listed building consents; applications for one or more new residential
  units; and applications where the floor space created is 100sqm or more within a conservation area.
must-include:
- item: The process that led to the submitted proposal, explaining the approach, justification and detail
    of the design
  level: must
- item: The standards of accessibility designed into the development, such as M4(2) and M4(3)
  level: must
- item: How the scheme takes into account local context
  level: should
- item: A perspective view of the proposal including adjacent buildings
  level: should
- item: An inclusive design statement (within the DAS or as a separate document) showing how the development
    is designed for all, including independent access for disabled users and suitable means of emergency
    escape
  level: should
confidence: medium
notes: From the council's list (published August 2026), pages 4, 9-10.
review-status: unverified
field-status: {}
