reference: arboriculturist-report
local-authority: RDB
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within or adjacent to the site may be affected by the development.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP38 and LP31; London Plan 2021 policies G5, G6 and G7
source-text: All applications where trees within or adjacent to the site may be affected by the development.
must-include:
- item: Prepared by a qualified arboriculturalist to BS 5837:2012
  level: must
- item: Arboricultural report, tree survey/classification, tree protection plan and method statement
  level: must
- item: 'Where trees are removed: adequate replacement based on the value of the trees removed (for example
    i-Tree or CAVAT)'
  level: should
  required-if:
    condition:
      field: tree-removal
      value: true
      description: Trees are to be removed.
confidence: medium
notes: From the council's list (published August 2026), page 21. Listed as 'Arboriculture Impact Statement/Tree
  Survey'.
review-status: unverified
field-status: {}
