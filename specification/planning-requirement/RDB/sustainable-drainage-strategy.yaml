reference: sustainable-drainage-strategy
local-authority: RDB
required-if:
  any:
  - ref: major-development
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Sites of one hectare or greater in Flood Zone 1 (residential).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Sites of one hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: All new development (including minor development and changes of use) in Flood Zones
        2 and 3.
  - site:
      in:
      - critical-drainage-area
      description: Land within Flood Zone 1 with critical drainage problems (as notified by the Environment
        Agency).
  - site:
      in:
      - surface-water-flood-risk
      description: Land identified in the council's SFRA and/or by the Environment Agency as subject to
        surface water flooding.
  - site:
      in:
      - future-flood-risk
      description: Within Flood Zone 1 where the SFRA shows it will be at risk of flooding from rivers
        or the sea in future.
  - condition:
      field: basement
      value: true
      description: Creating or extending basements in areas of flood risk (zones 1, 2 and 3) and/or surface
        water drainage in flood risk areas.
  - condition:
      field: sensitive-end-use
      value: true
      description: Proposing a more vulnerable or higher end use.
  - discretionary
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP21; London Plan 2021 policies SI 12 and SI 13; London
  Sustainable Drainage Action Plan
source-text: 'Required for: All major applications All new developments that meet the following criteria:
  1 Sites of one hectare or greater in Flood Zone 1 (low probability). … 9 All developments creating or
  extending basements, in areas of flood risk (zones 1, 2 and 3) and/or surface water drainage in flood
  risk areas. 10 All developments proposing a more vulnerable or higher end use.'
must-include:
- item: The GLA London Sustainable Drainage Proforma for Redbridge (not needed if the strategy contains
    all its information)
  level: must
- item: Identification of flood risk and existing surface water drainage for the site
  level: must
- item: Existing run-off rates and volumes, greenfield run-off rates, and proposed run-off rates and volumes
  level: must
- item: Measures for managing, restricting and discharging surface water using SuDS, accounting for climate
    change
  level: must
- item: How the drainage hierarchy has been followed, why SuDS features were selected, and technical justification
    for any excluded
  level: must
- item: Multifunctional benefits of the drainage system
  level: must
- item: Operation and maintenance plans for the lifetime of the development, including who owns the maintenance
    schedule
  level: must
- item: Greenfield development achieves greenfield run-off rates; brownfield development aims for them
  level: should
confidence: medium
notes: From the council's list (published August 2026), pages 48-50. Criteria 2-8 are the same as for
  the Flood Risk Assessment; criteria 5 and 8 show as discretionary as there.
review-status: unverified
field-status: {}
