reference: land-contamination-assessment
local-authority: RDB
required-if:
  all:
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive end use (residential, allotments, schools, nurseries and crèches, children's
        playing areas and playing fields).
  - site:
      in:
      - contaminated-land
      description: Land with risk of potential contamination in view of the former use of the site.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP24; London Plan 2021 policies SD1 and G9
source-text: All applications with a sensitive end use and on land with risk of potential contamination
  in view of the nature of … the former use at the site.
must-include:
- item: Characterises contamination risks to receptors and shows whether they can be reduced to make the
    site suitable for the proposed use
  level: must
- item: Investigations and reports in line with CLR 11 and BS 10175:2011+A2:2017
  level: must
- item: 'For new build: a Phase 1 desk study report, with proposals for site investigation where significant
    pollutant linkages are identified'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New build development.
confidence: medium
notes: From the council's list (published August 2026), pages 24-26. Listed as 'Contaminated Land Report'.
review-status: unverified
field-status: {}
