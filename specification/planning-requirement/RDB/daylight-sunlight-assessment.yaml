reference: daylight-sunlight-assessment
local-authority: RDB
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP26 and LP29; London Plan 2021 policies D3, D6, D8 and
  D9
source-text: All major applications.
must-include:
- item: Indicative levels of existing and proposed sunlight and daylight before and after the development
  level: must
- item: 'Follows the BRE guide ''Site layout planning for daylight and sunlight: A guide to good practice''
    (2022)'
  level: must
- item: A written undertaking to meet the council's reasonable costs of independent review by an accredited
    expert
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 7, 26. The abridged list (page 7) also ticks
  it 'If relevant' for other applications, so that part shows as discretionary.
review-status: unverified
field-status: {}
