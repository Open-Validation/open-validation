reference: energy-statement
local-authority: RDB
required-if:
  ref: major-development
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP32; London Plan 2021 policies SI 2, SI 3 and SI 4
source-text: All major applications.
must-include:
- item: A detailed energy strategy showing how the zero-carbon target will be met within the energy hierarchy
    (be lean, be clean, be green, be seen)
  level: must
- item: Confirmation that energy data has been submitted to the GLA ('be seen')
  level: must
- item: SAP/SBEM outputs attached to justify the findings
  level: must
- item: A completed GLA carbon emissions spreadsheet showing at least a 35% on-site reduction beyond Building
    Regulations
  level: must
- item: Energy efficiency savings of 10% (residential) or 15% (non-residential)
  level: should
- item: 'Where zero carbon cannot be met on site: carbon offset calculation using GLA guidance and templates'
  level: must
- item: Cooling hierarchy, passive ventilation, mitigation, energy-minimising design, renewable energy,
    and district heating connection assessment where in a Heat Network Priority Area
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 27-29. Listed as 'Energy and Sustainability
  Assessment'.
review-status: unverified
field-status: {}
