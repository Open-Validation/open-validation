reference: floor-plan-existing
local-authority: RDB
required-if:
  always: true
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All
must-include:
- item: Drawn at 1:50, 1:100 or 1:200, with the scale stated on the plan
  level: must
- item: Each relevant floor or part floor, the roof and the means of access
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: Existing and proposed floor plans next to each other where possible
  level: should
- item: 'For new developments (other than householder applications): proposed plans shown in context with
    the site boundary and the outline of adjacent buildings'
  level: should
- item: 'For changes of use: floor plans annotated where helpful to show the extent of the existing and
    proposed use'
  level: should
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
confidence: medium
notes: From the council's list (published August 2026), pages 4, 11.
review-status: unverified
field-status: {}
