reference: noise-assessment
local-authority: RDB
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise sensitive development (homes, student accommodation, care homes, hotels, schools,
        hospitals) adjoining an existing noise source.
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal has the potential to generate noise (for example pubs, bars, music venues,
        leisure, B2, B8, MUGAs, gyms, wind turbines).
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP24; London Plan 2021 policies D13 and D14
source-text: If your proposal is for a noise sensitive development and is adjoining an existing noise
  source (upper floor of a pub/night club/industrial site/railway line) or your proposal has the potential
  to generate noise.
must-include:
- item: Prepared by a qualified acoustician, in line with British Standards and World Health Organisation
    guidelines
  level: must
- item: Existing noise levels measured over 24 hours, including background noise
  level: must
- item: Proposed noise levels or outputs (where appropriate)
  level: must
- item: Measures proposed to reduce noise (for example design, orientation, insulation)
  level: must
- item: Examples of the calculations and assumptions made
  level: must
- item: The measuring equipment and calibration certificate
  level: must
- item: 'For sites adjoining the main line railway: a vibration assessment'
  level: should
confidence: medium
notes: From the council's list (published August 2026), pages 43-44. The list names the noise sensitive
  and noise generating uses.
review-status: unverified
field-status: {}
