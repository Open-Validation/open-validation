reference: site-plan
local-authority: RDB
required-if:
  always: true
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All
must-include:
- item: Block plan at a scale of 1:200 or 1:500, with the scale stated on the plan
  level: must
- item: Direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: must
- item: All neighbouring buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: A red line around the site is not required, but if included it must match the red line on the
    location plan
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 4, 10-11. Listed as 'Block Plan'.
review-status: unverified
field-status: {}
