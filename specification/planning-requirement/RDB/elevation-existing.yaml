reference: elevation-existing
local-authority: RDB
required-if:
  any:
  - condition:
      field: involves-change-of-use
      value: false
      description: The application is not only a change of use.
  - condition:
      field: external-alterations
      value: true
      description: The proposal includes external changes (including changes to windows).
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All applications – excluding applications for changes of use with no external changes.
must-include:
- item: Drawn at 1:50, 1:100 or 1:200, with the scale stated on the plan, showing all relevant external
    parts
  level: must
- item: Existing and proposed elevations next to each other where possible
  level: should
- item: 'For new developments (other than householder and change of use): proposed elevations shown in
    context, describing the relationship between the buildings and the relative positions of openings,
    parapets and levels on each property'
  level: should
- item: Blank elevations (such as blank end elevations) also included
  level: should
confidence: medium
notes: From the council's list (published August 2026), pages 4, 11-12.
review-status: unverified
field-status: {}
