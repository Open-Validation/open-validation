reference: waste-management-plan
local-authority: RDB
required-if:
  any:
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of new residential units.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP24 and LP22; London Plan 2021 policies SI 7 and SI 8
source-text: All major and non-major applications for change of use and creation of new residential units.
must-include:
- item: Arrangements and/or space for storage and collection of recycling and refuse, shown on the site
    plan or addressed in the application
  level: must
- item: 'How the premises will be serviced (service and delivery plan): location, hours and frequency
    of loading, vehicle sizes and swept paths'
  level: must
- item: Waste storage of 200 litres per flat (general) and 30 litres per flat (recycling), with room for
    growth
  level: must
- item: Separate areas for non-residential waste in mixed-use schemes
  level: must
- item: 'Travel distances from refuse vehicles: no more than 25 m dragging distance within the site (or
    10 m for up to two eurobins on the highway)'
  level: must
- item: Private management to present eurobins at the site boundary, and any dropped kerbs needed
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 51-52. Listed as 'Waste/Site Waste Management
  Plan/Service Delivery Plan'.
review-status: unverified
field-status: {}
