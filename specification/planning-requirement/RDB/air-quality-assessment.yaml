reference: air-quality-assessment
local-authority: RDB
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: fronts-main-road
        value: true
        description: The site faces a main road (class A or B road, TLRN, SRN or motorway).
    - all:
      - condition:
          field: car-free
          value: false
          description: Not a car-free scheme with appropriate disabled parking.
      - condition:
          field: parking-standards-departure
          value: true
          description: On-site parking would exceed the London Plan maximum car parking standards.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP24; London Plan 2021 policy SI 1
source-text: All major applications (exceptions listed) … All major applications will require an AQA where
  they face a main road to consider impacts mitigated from existing air pollution. … Where not facing
  a main road, major schemes will require an AQA except for; 1. car free schemes with appropriate disabled
  parking, or 2. where on-site parking levels would not exceed the car parking maximum standards of the
  London Plan (see policies T6, T6.1 to T6.5).
must-include:
- item: A statement that a condition will be accepted limiting any gas boilers to NOx emissions of no
    more than 40 mg/kWh
  level: must
- item: How the scheme (or other sensitive uses) will be successfully accommodated in an area of particularly
    significant air quality
  level: must
- item: Impacts on local air pollution including fixed plant (boilers, emergency generators) and expected
    transport sources, covering all relevant pollutants
  level: must
- item: 'Industrial, waste and other working sites: on-site vehicles and mobile machinery as well as fixed
    machinery and transport sources'
  level: should
confidence: medium
notes: From the council's list (published August 2026), pages 18-20. All of Redbridge is an Air Quality
  Management Area.
review-status: unverified
field-status: {}
