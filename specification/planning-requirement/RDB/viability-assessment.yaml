reference: viability-assessment
local-authority: RDB
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Under 35% affordable housing (or under 50% on public/industrial land).
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Another planning policy requirement is not met, such as a 60/40 split between affordable
          rented and intermediate tenures.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP41, LP3, LP15, LP16 and LP20; London Plan 2021 policies
  H4, H5 and DF1; Redbridge Planning Obligations SPD
source-text: All major applications where there is a planning policy requirement that is not met within
  the development. … (ie the development provides under 35% affordable housing, or under 50% affordable
  housing for development on public/industrial land) or where the affordable housing is not a 60/40% split
  between affordable rented and intermediate tenures at rents set by the London Plan SPG).
must-include:
- item: A full viability report (which may be published in full) and an executive summary, in plain English
  level: must
- item: A written undertaking to meet the council's reasonable costs of independent review by an accredited
    expert
  level: must
- item: Any redaction fully justified and agreed by the council
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 30-31. Listed as 'Financial Viability Assessment'.
review-status: unverified
field-status: {}
