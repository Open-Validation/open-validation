reference: heritage-statement
local-authority: RDB
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - park-and-garden
    - locally-listed-building
    - conservation-area
    description: Directly affects, or affects the setting of, a statutory listed building, registered
      park or garden, non-designated heritage asset or conservation area.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP33-LP40; London Plan 2021 policies HC1-HC5 and HC7
source-text: All applications that directly affect, or … affect the setting of, a statutory listed building,
  registered park or garden,; non-designated heritage asset; or conservation area.
must-include:
- item: The significance of the heritage asset affected, including any contribution made by its setting
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset, and whether it causes substantial
    harm or total loss of significance
  level: must
- item: 'For listed buildings: a Structural Impact Assessment and Schedule of Works'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'For a World Heritage Site: the impact on its Outstanding Universal Value'
  level: must
  required-if:
    site:
      in:
      - world-heritage-site
      description: The site affects a World Heritage Site.
- item: The sources considered, the expertise consulted, and the steps taken to avoid or minimise adverse
    impacts on significance
  level: should
- item: 'Where the site includes or may include heritage assets with archaeological interest: a desk-based
    assessment and, where necessary, a field evaluation'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published August 2026), pages 40-41.
review-status: unverified
field-status: {}
