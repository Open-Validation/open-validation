reference: biodiversity-survey-report
local-authority: RDB
required-if:
  all:
  - ref: major-development
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - local-wildlife-site
        description: On or adjacent to designated SSSIs, SAC, SINCs or local wildlife sites (statutory
          and non-statutory).
    - condition:
        field: near-watercourse
        value: true
        description: On or adjacent to a river.
    - condition:
        field: previously-developed-land
        value: true
        description: On or adjacent to brownfield land.
    - site:
        in:
        - open-space
        description: On or adjacent to open space.
    - condition:
        field: protected-species
        value: true
        description: Protected species may be in the locality.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP37 and LP39; London Plan 2021 policy G6
source-text: All major applications where site is on or adjacent to designated SSSIs, SAC, SINCS or local
  wildlife sites (LWS) (both statutory and non-statutory), rivers, brownfield and open space, and/or where
  protected species may be in the locality.
must-include:
- item: An Ecological Impact Assessment (EcIA) following CIEEM technical guidance
  level: must
- item: External lighting plans with times of operation, spectrum details and contextualised lux spill
    maps
  level: must
- item: Contextualised daylight/sunlight plans
  level: must
- item: A Construction Environment Management Plan (CEMP) with method statements, timeframes and post-clearance
    monitoring
  level: must
- item: Detailed design ecological mitigation and improvement, in detailed architectural, M&E and landscape
    drawings with specification
  level: must
confidence: medium
notes: From the council's list (published August 2026), page 27. Listed as 'Ecological and Biodiversity
  Assessment'. Read as applying to major applications in each listed situation.
review-status: unverified
field-status: {}
