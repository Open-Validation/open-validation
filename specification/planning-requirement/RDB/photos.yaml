reference: photos
local-authority: RDB
required-if:
  always: true
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP26, LP30 and LP38
source-text: All applications
must-include:
- item: Photographs of the existing site, specifically the parts of the site/building to be altered
  level: must
- item: Views facing outwards from within the site, showing buildings and features (especially neighbouring
    windows, trees potentially affected and changes in ground level)
  level: must
- item: The relationship of the host building/site to adjoining buildings/sites
  level: must
- item: Views from adjoining roads showing the context for proposals visible from them
  level: must
- item: No people, including children, in the photographs
  level: must
confidence: medium
notes: From the council's list (published August 2026), page 45.
review-status: unverified
field-status: {}
