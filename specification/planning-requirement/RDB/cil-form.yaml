reference: cil-form
local-authority: RDB
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A new dwelling is created.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: 100 sq m of floor space (GIA) is created.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Community Infrastructure Levy Regulations 2010; Redbridge Local Plan 2015-2030 policies LP17 and
  LP41; London Plan 2021 policy DF1
source-text: All applications where a new dwelling is created, and/or where 100sqm of floor space (GIA)
  is created.
must-include:
- item: 'Completed ''Form 1: CIL Additional Information'' with new build and existing floorspace and the
    current use of the site'
  level: must
- item: '''Form 2: Assumption of Liability'' (advisable, not a validation requirement)'
  level: should
- item: Plans with scale bars and clear measurements of proposed and existing floor areas (strongly recommended)
  level: should
confidence: medium
notes: From the council's list (published August 2026), page 23. Listed as 'CIL Application Forms'.
review-status: unverified
field-status: {}
