reference: flood-risk-assessment
local-authority: RDB
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Sites of one hectare or greater in Flood Zone 1 (residential).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Sites of one hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: All new development (including minor development and changes of use) in Flood Zones
        2 and 3.
  - site:
      in:
      - critical-drainage-area
      description: Land within Flood Zone 1 with critical drainage problems (as notified by the Environment
        Agency).
  - site:
      in:
      - surface-water-flood-risk
      description: Land identified in the council's SFRA and/or by the Environment Agency as subject to
        surface water flooding.
  - site:
      in:
      - future-flood-risk
      description: Within Flood Zone 1 where the SFRA shows it will be at risk of flooding from rivers
        or the sea in future.
  - discretionary
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP21; London Plan 2021 policies SI 12 and SI 13
source-text: 'Site-specific Flood Risk Assessments for all new developments that meet the following criteria:
  1) Sites of one hectare or greater in Flood Zone 1 (low probability). 2) All new development (including
  minor development and changes of use) in Flood Zones 2 (medium probability) and Flood Zone 3 (high probability).
  … 3) Land within Flood Zone 1 which has critical drainage problems (as notified by the Environment Agency).
  4) Land identified within the Council’s Strategic Flood Risk Assessment and/or Environment Agency as
  being subject to surface water flooding. 5) Sites that fall within an area identified in the Council’s
  Strategic Flood Risk Assessment (SFRA) Level 1 and Level 2. 6) Development within Flood Zone 3 which
  introduces a sensitive or more vulnerable end use. … 7) Within flood zone 1 where the SFRA shows it
  will be at risk of flooding from rivers or the sea in future. 8) That increases the vulnerability classification
  and is in flood zone 1.'
must-include:
- item: An assessment of flood risk from all sources, plus an allowance for climate change
  level: must
- item: The estimated flood level, taking account of climate change over the development's lifetime (and
    residual risk if defences breach or overtop)
  level: must
- item: Finished floor levels
  level: must
- item: Flood resistance, resilience and emergency plans
  level: must
- item: Any supporting plans and drawings, and anything the Environment Agency standing advice asks for
  level: must
- item: The information in the NPPG site-specific flood risk assessment checklist
  level: should
- item: 'For minor development: as a minimum, that the development is safe for its users for its lifetime,
    does not increase flood risk elsewhere, and is sufficiently flood resistant and resilient'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development (householder, alterations, small non-residential extensions).
confidence: medium
notes: From the council's list (published August 2026), pages 34-37. Criteria 5 (any area in SFRA Level
  1 and Level 2) and 8 (increases the vulnerability classification in Flood Zone 1) have no clear field,
  so they show as discretionary. Surface water flood extent is treated as Flood Zone 3.
review-status: unverified
field-status: {}
