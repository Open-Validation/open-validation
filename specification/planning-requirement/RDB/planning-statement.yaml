reference: planning-statement
local-authority: RDB
required-if:
  ref: major-development
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP26 and LP33
source-text: All major applications.
must-include:
- item: The context and need for the development and how it accords with national, regional and local
    planning policy
  level: must
- item: A commitment that new build residential units will be M4(2) or M4(3) compliant, or reasons why
    they cannot be
  level: must
- item: A schedule of residential units by number of bedrooms, habitable rooms and tenure
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 45-46. For non-major developments the information
  may be included in the Design and Access Statement.
review-status: unverified
field-status: {}
