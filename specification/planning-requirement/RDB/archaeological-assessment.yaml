reference: archaeological-assessment
local-authority: RDB
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: Within an Archaeological Priority Area (GLAAS tiers 1-4).
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: Any form of excavation or piling.
    - discretionary
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policy LP33; London Plan 2021 policy HC1
source-text: All applications within Archaeological Priority Areas likely to affect important archaeological
  remains. All applications that involve any form of excavation or piling within an Archaeological Priority
  Area. … GLAAS requirement tiers 1-4.
must-include:
- item: An assessment of potential archaeological heritage, prepared by a qualified individual or organisation,
    using existing information to establish the significance of the site and the impact on surviving remains
  level: must
- item: 'Where the proposal includes new basements, extensions to basements or other extensive groundworks:
    the results of an archaeological evaluation'
  level: should
  required-if:
    any:
    - condition:
        field: basement
        value: true
        description: New or extended basements.
    - condition:
        field: earthworks
        value: true
        description: Other extensive groundworks.
confidence: medium
notes: From the council's list (published August 2026), page 21. 'Likely to affect important archaeological
  remains' shows as discretionary.
review-status: unverified
field-status: {}
