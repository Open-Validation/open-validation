reference: lighting-assessment
local-authority: RDB
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: external-lighting
        value: true
        description: The application contains external lighting.
  - condition:
      field: floodlighting
      value: true
      description: The application includes, or is for, floodlighting.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP24, LP27 and LP28; London Plan 2021 policies D3, D8,
  D9 and S5
source-text: All major applications which contain external lighting; all applications which include, or
  are for, floodlighting.
must-include:
- item: Lighting levels, hours of operation and light spill diagrams
  level: must
- item: Wavelength
  level: must
- item: Column heights
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Equipment design
  level: must
- item: Impact (including levels and extent of spillage) on nearby dwellings, roads or habitats, and features
    to mitigate it
  level: must
- item: Size/power of light fittings
  level: must
confidence: medium
notes: From the council's list (published August 2026), page 43.
review-status: unverified
field-status: {}
