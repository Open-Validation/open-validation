reference: location-plan
local-authority: RDB
required-if:
  always: true
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All
must-include:
- item: Up-to-date map at a scale of 1:1250 or 1:2500, with the scale stated on the plan
  level: must
- item: Application site boundary clearly edged with a red line, including all land required for the development
  level: must
- item: Any other adjacent or nearby land in the applicant's control or ownership edged with a blue line
  level: should
- item: An arrow indicating the direction of north
  level: must
- item: At least two surrounding named roads
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 4, 10.
review-status: unverified
field-status: {}
