reference: town-centre-impact-assessment
local-authority: RDB
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail uses on the edge of, or out of, a town centre.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail floorspace above 2,500 sq m.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 0
      description: Change of use or development of new main town centre uses (retail, leisure, offices,
        arts, culture, hotels and conference facilities).
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP9, LP10, LP11 and LP12; London Plan 2021 policies E4,
  E9 and T6.3; NPPF
source-text: All applications for retail uses above 2,500 sqm floorspace where on the edge, or out of,
  a town centre. … Change of use or development of new main town centre uses (incl. retail, leisure, offices,
  arts, culture, hotels and conference facilities)
must-include:
- item: 'For retail over 2,500 sq m on the edge of or outside a town centre: a Retail Impact Assessment
    covering the factors in Local Plan policies LP10 and LP11'
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 2500
      description: Retail floorspace above 2,500 sq m.
- item: 'Sequential test: whether the use could be in a town centre or edge-of-centre site (and if not,
    why), be accommodated more flexibly, or has specific market requirements for the location'
  level: must
confidence: medium
notes: From the council's list (published August 2026), pages 46-47. Covers the 'Retail Impact Assessment'
  and 'Sequential Test (town centre)' rows. The sequential test row does not limit it to sites outside
  town centres.
review-status: unverified
field-status: {}
