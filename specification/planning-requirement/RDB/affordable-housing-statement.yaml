reference: affordable-housing-statement
local-authority: RDB
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential uses of 10 or more units.
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of residential floorspace.
source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
policy: Redbridge Local Plan 2015-2030 policies LP3 and LP5; London Plan 2021 policies H4 and H6
source-text: All major applications proposing residential uses of 10 or more units or 1000m2 of residential
  floorspace.
must-include:
- item: How many affordable rented and intermediate homes are provided, and which flats are allocated
    to each type
  level: must
- item: Which Registered Provider will manage them, and the rents (including service charges)
  level: must
- item: Affordable wheelchair units (10% overall) to Building Regulations M4(3) shown as 'accessible'
    (fully fitted out); market wheelchair units as 'adaptable'
  level: must
confidence: medium
notes: From the council's list (published August 2026), page 18. A net gain approach is applied; it does
  not apply to an existing block of flats.
review-status: unverified
field-status: {}
