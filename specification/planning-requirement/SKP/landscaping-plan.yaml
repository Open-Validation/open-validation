reference: landscaping-plan
local-authority: SKP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS8, SIE-1 and SIE-3
source-text: Depending on the nature and scale of development and its impact, applications for full planning
  permission (involving the erection of buildings or engineering works) may be required to submit an accompanying
  landscape masterplan including drawings and a supporting design statement. Applications for outline
  permission, where landscaping is to be approved as a reserved matter, may also require the submission
  of a landscape masterplan as supporting information or, depending on the type of scheme, indicative
  planting areas so that the potential for future on site landscaping can be assessed.
must-include:
- item: Existing trees and hedges to be retained or removed, accurately plotted and labelled
  level: must
- item: 'Soft landscape: planting plan and plant schedule (species, size, numbers/density) and a written
    specification of cultivation operations'
  level: must
- item: 'Hard landscape: existing and proposed finished levels, hard surface treatment and edging, boundary
    treatments and forms of enclosure, with standard elevation details'
  level: must
- item: 'Except for domestic gardens: a landscape maintenance schedule (monthly operations) for 5 years
    after planting'
  level: must
  required-if: discretionary
  source-text: With the exception of domestic gardens, a schedule of landscape maintenance (including
    a table of monthly operations and a brief description of these maintenance operations) is likely to
    be required for a period of 5 years after planting
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 32. 'May be required' depending on the nature,
  scale and impact of the development, so discretionary.
review-status: unverified
field-status: {}
