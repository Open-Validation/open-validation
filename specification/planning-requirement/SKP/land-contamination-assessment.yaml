reference: land-contamination-assessment
local-authority: SKP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS8 and SIE-3
source-text: As a minimum requirement, outline and full plan applications for sensitive end uses (including
  residential, nursing/ care home, schools and hospitals) may require a Phase 1 contamination survey.
  This might also be necessary for other uses depending on the nature of the development proposed.
must-include:
- item: Carried out by a suitably qualified and competent person or organisation
  level: must
- item: 'Phase 1 report: desktop study of available information and historical maps'
  level: must
- item: Site walkover survey for obvious signs of contamination
  level: must
- item: Conceptual site model and basic hazard assessment (Preliminary Risk Assessment)
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 64. 'May require' for sensitive end uses (residential,
  care homes, schools, hospitals) and possibly other uses, depending on the risk of contamination (including
  radon), so discretionary.
