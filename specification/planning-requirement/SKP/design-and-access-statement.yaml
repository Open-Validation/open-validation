reference: design-and-access-statement
local-authority: SKP
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace created.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Major developments and Listed Building consents require the submission of a Design and Access
  Statement. Planning applications for the provision of one or more dwellings or a building or buildings
  where the floor space created by the development is 100 square metres or more, in designated areas (Conservation
  Areas and World Heritage sites), also require a Design and Access Statement.
must-include:
- item: The design concepts and principles behind the development, and how context has informed the scheme
  level: must
- item: The approach to access, and how any consultation on access issues has been taken into account
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 11.
review-status: unverified
field-status: {}
