reference: air-quality-assessment
local-authority: SKP
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Within the Stockport Air Quality Management Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates new residential units.
  - condition:
      field: direct-air-emissions
      value: true
      description: Potentially air pollution generating uses or combustion based technologies.
  - condition:
      field: sensitive-end-use
      value: true
      description: Proposals incorporating sensitive uses.
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS8 and SIE-3
source-text: 'Where the proposal may potentially have a significant impact on air quality either by emitting
  air quality pollutants (including during construction and demolition phases) or by introducing receptors
  to areas where there are existing sources of air quality pollutants and will include: • all major development.
  • proposals that could result in significant vehicle movements through the Stockport Air Quality Management
  Area (AQMA) • proposals that include potentially air pollution generating uses or combustion based technologies.
  • proposals incorporating sensitive uses; and • developments that create new residential units within
  the Stockport Air Quality Management Area (AQMA).'
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 59. Also required for significant vehicle
  movements through the AQMA, and where any of seven screening criteria apply (changes of more than 100/50
  AADT light vehicles or 25/100 AADT heavy vehicles within/outside an AQMA, road realignment of 5 m or
  more in an AQMA, new or removed junctions, bus stations, underground car parks venting within 20 m of
  a receptor with more than 100 movements a day, substantial combustion processes). Our fields can't hold
  these traffic figures, so that part shows as discretionary.
review-status: unverified
field-status: {}
