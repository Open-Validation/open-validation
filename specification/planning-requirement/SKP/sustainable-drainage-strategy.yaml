reference: sustainable-drainage-strategy
local-authority: SKP
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS1, SD-6, CS8 and SIE-3; Sustainable Design and Construction
  SPD
source-text: All development involves the management of surface water run-off and should be submitted
  with a Surface Water or Drainage Strategy to manage run-off as close to the source as possible.
must-include:
- item: Undertaken by a suitably qualified and competent person or organisation
  level: must
- item: Proposals to manage surface water with SuDS, following the drainage hierarchy
  level: must
- item: 'Brownfield sites: evidence of at least a 50% reduction in unattenuated run-off; greenfield sites:
    no increase in run-off rate (with technical/financial justification if not feasible)'
  level: must
- item: Who will maintain the surface water assets, including SuDS features, and how they will be safely
    maintained
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 70. 'All development' is shown as the planning
  application types. The foul drainage assessment from the same section is in the unmapped list. The companion
  Application Validation Checklist (which ticks documents per application type) could not be read, so
  the application types come from the notes' own wording.
