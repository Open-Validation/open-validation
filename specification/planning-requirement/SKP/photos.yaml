reference: photos
local-authority: SKP
required-if:
  any:
  - all:
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
    - site:
        in:
        - listed-building
        - conservation-area
        - locally-listed-building
        - scheduled-monument
        description: The building is a heritage asset.
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport UDP Review (2006) saved policy GBA1.1, GBA1.2, LCR1, LCR1.1 and LCR1.1a; Stockport Core
  Strategy DPD policies CS8, SIE-1 and SIE-3
source-text: Photographs and photomontages may be required where development proposals will have a significant
  impact on their setting, for example sensitive landscape settings (see ‘Landscape Character Statement
  and Landscape Impact Assessment’). They also provide useful background information and can help to show
  how large developments can be satisfactorily integrated within the street scene. Where a planning application
  or prior approval is sought for the demolition of a heritage asset, a photographic record of that building
  should be provided.
must-include:
- item: Clearly labelled, dated and cross-referenced to a plan where one is provided
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 37. Applies to planning and prior approval
  applications for demolition of a heritage asset. Otherwise 'may be required' where the development will
  have a significant impact on its setting, so discretionary.
review-status: unverified
