  notes: 'Grokbot''s link is to the current Stockport list, the Explanatory Notes adopted 19 June 2024,
    and it works, though the List date should be 19 June 2024 and not 1 June. The extraction is weak.
    It ignores the 2024 checklist''s per-application-type lists, so Householder, Reserved Matters, LBC,
    LDC, S73, discharge of conditions and NMA all show ''(none)''. It omits Green Belt, Airport Safeguarding,
    the House Extension Energy Checklist and other local items, and it mixes in 2019-checklist and 2010
    national-guidance text as tab items. Fixed 2026-11-05: every file was rewritten from the council''s
    latest list.'
