submission-standards:
- item: All documents referenced for identification and drawn to a recognisable scale
  level: must
- item: Drawing file names prefixed with a maximum eight character alpha/numeric reference, followed by
    a brief description of the drawing
  level: should
- item: Drawings annotated with 'do not scale from this drawing' will not be accepted
  level: must
- item: Drawings clear and comprehensible, as they will be publicly viewable
  level: must
- item: Plans and elevations formatted on A3 sheets wherever possible
  level: should
- item: 'Paper submissions: two copies of each local-list document'
  level: must
- item: 'Major or large electronic submissions (more than 10 attachments, or with an Environmental Statement):
    a copy on CD-ROM is helpful'
  level: should
