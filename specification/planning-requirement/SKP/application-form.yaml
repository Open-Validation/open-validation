reference: application-form
local-authority: SKP
required-if:
  always: true
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning Act 1990 section 65(5)
source-text: All planning applications need to be submitted on a standard application form.
must-include:
- item: An accurate, concise description covering all aspects of the development applied for; no overly
    long descriptions
  level: must
  source-text: An application will not be validated without a full and accurate description of development.
- item: 'For listed building consent: a detailed description of the works, with an attached schedule of
    proposed works rather than an overly long description'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For changes of use: the existing and proposed Use Classes'
  level: should
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use.
- item: 'Retrospective applications: the word ''retrospective'' in the description'
  level: should
  required-if:
    condition:
      field: retrospective
      value: true
      description: The development has already taken place.
- item: 'Revisions or amendments to earlier permissions: made clear in the description, with the earlier
    permission reference numbers'
  level: should
  required-if:
    condition:
      field: amends-approved-plans
      value: true
      description: The application revises or amends earlier approved plans.
- item: The appropriate ownership certificate (A, B, C or D), except for reserved matters applications
  level: must
  source-text: All applications for planning permission except for approval of reserved matters must include
    the appropriate certificate of ownership.
- item: Notice(s) served on owners of the application site under Article 11 of the DMPO
  level: must
- item: Agricultural holdings certificate, whether or not the site includes an agricultural holding (not
    needed for reserved matters, renewal of temporary permission, discharge or variation of conditions,
    tree preservation orders or advertisement consent)
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), pages 6-9.
review-status: unverified
field-status: {}
