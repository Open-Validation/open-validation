reference: lighting-assessment
local-authority: SKP
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: A new external illumination or floodlighting installation, e.g. floodlighting to sports
        pitches, tennis courts, golf driving ranges, recreational and entertainment facilities.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements.
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
source-text: 'new external illumination/floodlighting installation is proposed: illuminated advertisements,
  floodlighting to sports pitches, tennis courts, golf driving ranges, recreational and entertainment
  facilities. b) For the introduction of new sensitive receptors close to an existing external lighting
  scheme (as per (a)) It must show how the lighting installation will visually impact the area and the
  living conditions of residents, and how it will be mitigated to overcome impact.'
must-include:
- item: How the lighting installation will visually impact the area and the living conditions of residents
  level: must
- item: How the impact will be mitigated
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s lighting row quoted ''pilots (see ...)''; the real trigger
  was filed under Advertisement consent. New sensitive receptors close to an existing lighting scheme
  are shown as officer discretion.'
