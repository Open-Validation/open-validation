reference: lighting-assessment
local-authority: SKP
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: New external illumination or floodlighting installation.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting to sports pitches, tennis courts, golf driving ranges, recreational and
        entertainment facilities.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: New sensitive receptors.
    - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport UDP Review (2006) saved policy EP1.9; Stockport Core Strategy DPD policies CS8, SIE-1
  and SIE-3
source-text: 'A Lighting Assessment is required: a) Where new external illumination/floodlighting installation
  is proposed: illuminated advertisements, floodlighting to sports pitches, tennis courts, golf driving
  ranges, recreational and entertainment facilities. b) For the introduction of new sensitive receptors
  close to an existing external lighting scheme (as per (a))'
must-include:
- item: Assessed and designed by a competent person or organisation
  level: must
- item: Compliance with ILP Guidance Note 01/21 (The Reduction of Obtrusive Light) and the environmental
    zone lux level (E2, E3 or E4)
  level: must
- item: Location, height, fixture design and luminance of the lighting
  level: must
- item: Light assessment modelling light spill around the site (isolux contour drawings)
  level: must
- item: How the design minimises light disturbance to wildlife and sensitive habitats
  level: must
- item: Proposed hours of operation, and controls (timers, sensors) to prevent illumination outside them
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 77. New sensitive receptors 'close to' an
  existing lighting scheme shows as discretionary.
review-status: unverified
field-status: {}
