reference: location-plan
local-authority: SKP
required-if:
  always: true
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy of the completed application form, each of the following plans and a Design and
  Access Statement (where relevant to the application), must be supplied for a planning application to
  be validated.
must-include:
- item: Preferably at 1:1250 or 1:2500 scale
  level: should
- item: Application site edged clearly in red, including all land needed to carry out the development
    (e.g. access from the highway, visibility splays, landscaping, car parking and open space around buildings)
  level: must
- item: A blue line round any other land owned by the applicant that is close to or adjoins the site
  level: should
- item: Based on an up to date map, showing wherever possible at least two roads and surrounding buildings,
    with properties numbered or named
  level: should
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 7. The companion Application Validation Checklist
  (which ticks documents per application type) could not be read, so the application types come from the
  notes' own wording.
review-status: unverified
field-status: {}
