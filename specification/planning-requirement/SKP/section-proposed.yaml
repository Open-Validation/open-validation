reference: section-proposed
local-authority: SKP
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The application involves new buildings.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where a proposal involves a change in ground levels, illustrative drawings should be submitted
  to show both existing and finished levels to include details of foundations and eaves and how encroachment
  onto adjoining land is to be avoided. ... This will be required for all applications involving new buildings.
  ... particularly in the case of sloping sites it will be necessary to show how proposals relate to ground
  levels or where ground levels outside the extension would be modified.
must-include:
- item: At 1:50 or 1:100 scale
  level: must
- item: Existing and finished site levels and finished floor levels, related to a fixed datum point off
    site, with foundations and eaves
  level: must
- item: The proposals in relation to adjoining buildings and neighbouring development
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 8. For householder schemes the levels may
  show on the plans and elevations; sections are needed particularly on sloping sites, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
