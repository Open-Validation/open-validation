reference: biodiversity-survey-report
local-authority: SKP
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - priority-habitat
      description: Likely to affect a SSSI, Site of Biological Importance, Local Nature Reserve or priority
        habitat.
  - condition:
      field: protected-species
      value: true
      description: Likely to affect protected or priority species.
  - condition:
      field: potential-roost-features
      value: true
      description: Modification, conversion, demolition or removal of buildings or structures in the GMEU
        checklist (agricultural buildings, other non-prefabricated buildings with roof voids, unlined
        industrial chimneys, tunnels, culverts, cellars, bridges).
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Lighting of churches or listed buildings, or floodlighting of green space.
    - condition:
        field: near-woodland
        value: true
        description: Within 50 m of woodland, water, field hedgerows or tree lines connected to them.
  - any:
    - condition:
        field: near-woodland
        value: true
        description: Proposals affecting woodland.
    - condition:
        field: hedgerows-affected
        value: true
        description: Proposals affecting field hedgerows or lines of trees connected to woodland or water.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport UDP Review (2006) saved policy NE1.1, NE1.2 and NE3.1; Stockport Core Strategy DPD policies
  CS8 and SIE-3
source-text: An Ecology Survey and Assessment is necessary to assess the ecological impact of proposals
  on wildlife and biodiversity where a proposed development is likely to affect (either directly or indirectly)
  protected or priority habitats and/or species. ... If the application involves any of the development
  proposals shown in the checklist, an Ecology survey and Assessment must be submitted.
must-include:
- item: Undertaken by a suitably qualified and competent person, at an appropriate time and in suitable
    conditions, using nationally recognised survey methods
  level: must
- item: Informed by a data search with the Greater Manchester Local Record Centre
  level: should
- item: Which species and habitats are present and in what numbers, mapped on the site and in the zone
    of influence
  level: must
- item: Any constraints on the survey
  level: must
- item: Impacts on protected and priority species and habitats, direct and indirect, during and after
    construction
  level: must
- item: How the mitigation hierarchy has been followed (alternatives, avoidance, mitigation, compensation)
  level: must
- item: Mitigation, protection during construction, biodiversity enhancement, and long-term maintenance,
    monitoring and management
  level: must
- item: 'Where European protected species are present: evidence on the three Habitats Directive tests'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: European protected species present.
- item: Badger reports marked confidential
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 19 June 2024), pages 90-92. The GMEU Biodiversity Validation Checklist
  triggers are shown as conditions.
review-status: unverified
field-status: {}
