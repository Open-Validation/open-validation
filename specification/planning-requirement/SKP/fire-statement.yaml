reference: fire-statement
local-authority: SKP
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys,
  must be accompanied by a Fire Statement completed by an expert.
must-include:
- item: Completed by an expert
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 9. The rule follows the national one (two
  or more dwellings or educational accommodation, and 18 m or 7 storeys).
review-status: unverified
field-status: {}
