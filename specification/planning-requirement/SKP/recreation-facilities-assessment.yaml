reference: recreation-facilities-assessment
local-authority: SKP
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: Loss of open space, including public or private sports grounds or land last used for
      active recreation.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport UDP Review (2006) saved policy L1.1, UOS1.2 and UOS1.3
source-text: Proposals for development that involves loss of open space, including public or private sports
  grounds or land last used for active recreation, should be accompanied by an open space assessment.
must-include:
- item: The extent of current usage, needs and opportunities for using the land for open space and sport/recreation
  level: must
- item: The implications of the loss, including any mitigation measures
  level: must
- item: A draft agreement where the assessment involves a legal agreement (such as replacement open space)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 34. Can be part of the Planning Statement.
  Smaller areas not shown on the Proposals Map can still need an assessment.
review-status: unverified
field-status: {}
