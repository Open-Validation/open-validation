policy: Stockport Statement of Community Involvement (October 2015)
source-text: Where a development proposal is of a scale and/ or nature that is likely to generate significant
  levels of public interest, the prospective applicant should engage the local community and a Statement
  of Community Involvement (SCI) should be submitted with the application.
must-include:
- item: How the applicant has complied with the pre-application consultation requirements in the Council's
    SCI
  level: must
- item: 'Any community involvement exercise: methodology, community contacted and outcome'
  level: must
- item: How the community's views have been taken into account in the proposals
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 47. Depends on whether the proposal is likely
  to generate significant public interest, so discretionary.
