reference: affordable-housing-statement
local-authority: SKP
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: The site provides 15 dwellings (gross) or more, including changes of use.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: The site is 0.5 hectares or more.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
source-text: AFFORDABLE HOUSING STATEMENT When Required Affordable housing is required on sites providing
  15 dwellings (gross) or more (including changes of use) and sites of 0.5 hectares or more.
must-include:
- item: Details of pre-application discussions with partner Registered Providers, where applicable
  level: must
- item: A statement of intended conformity with up to date design and accessibility standards
  level: must
- item: A draft legal agreement where the affordable housing requirement is to be addressed in this way
  level: must
- item: Evidence to justify why the Council's normal affordable housing requirement cannot be met, where
    relevant (e.g. a viability appraisal)
  level: must
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The content items
  are from the bullets the workbook filed under pre-application advice and planning obligations.
