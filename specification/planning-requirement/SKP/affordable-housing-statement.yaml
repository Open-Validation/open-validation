reference: affordable-housing-statement
local-authority: SKP
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 dwellings (gross) or more, including changes of use.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Sites of 0.5 hectares or more.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 dwellings (gross) or more.
    - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS2, CS3 and H-3; Provision of Affordable Housing SPG
source-text: Affordable housing is required on sites providing 15 dwellings (gross) or more (including
  changes of use) and sites of 0.5 hectares or more. The site size threshold is lowered to 5 dwellings
  (gross) in areas with property prices above the Stockport average.
must-include:
- item: Schedule of the total number, type, floorspace (gross internal area, sq m) and bedrooms of each
    dwelling, distinguishing affordable from market units, and affordable units split into intermediate
    and social rented
  level: must
- item: Plan showing the distribution and location of the affordable units within the site
  level: must
- item: Statement of the proposed arrangements for providing the affordable housing, including pre-application
    discussions with partner Registered Providers where applicable
  level: must
- item: Statement of intended conformity with up to date design and accessibility standards
  level: must
- item: Draft legal agreement where the requirement is to be met that way
  level: must
  required-if: discretionary
- item: Where relevant, evidence justifying why the normal requirement can't be met (e.g. viability appraisal
    and an agreement to pay the council's independent assessment costs)
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposal offers less affordable housing than policy requires.
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 15. The 5-dwelling threshold applies only
  in areas with property prices above the Stockport average, which the council decides, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
