reference: viability-assessment
local-authority: SKP
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant says the development would be unviable if it met the normal planning
        obligations or Development Plan policies.
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: NPPF; Stockport Development Plan
source-text: 'Where it is submitted that a development is unviable and undeliverable if it were to meet
  the normal requirements for planning obligations (see ‘Planning Obligations: Heads of Terms) or policies
  of the adopted Development Plan (and that the development is desirable to meet a planning objective),
  an ‘open book’ viability appraisal should be undertaken of the development proposed.'
must-include:
- item: Open book appraisal covering all costs, expected receipts and the developer's profit margin, giving
    the net residual valuation, with supporting evidence
  level: must
- item: Following national planning guidance, including standardised inputs, and made publicly available
  level: must
- item: A written undertaking to pay the council's costs of independently assessing the appraisal, whether
    or not permission is granted
  level: must
  source-text: Where a viability appraisal is submitted, the application will not be validated until applicants
    provide a written undertaking to pay the Council's costs in connection with the assessment of the
    appraisal.
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 52. The same approach applies to enabling
  development (e.g. to retain a listed building), which shows as discretionary. Marketing exercises and
  business plans from the same section are in the unmapped list.
review-status: unverified
field-status: {}
