reference: site-plan
local-authority: SKP
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy of the completed application form, each of the following plans and a Design and
  Access Statement (where relevant to the application), must be supplied for a planning application to
  be validated.
must-include:
- item: Block plan at 1:100 or 1:200 showing site boundaries, the type and height of boundary treatment,
    and any building or structure on the other side of those boundaries
  level: must
- item: Site plan at 1:500 or 1:200 showing north and the proposed development in relation to the site
    boundaries and other buildings on the site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: Position of all trees on the site (and those on adjacent land that could influence or be affected
    by the development)
  level: must
- item: Extent and type of any hard surfacing (including car parking, turning and servicing areas) and
    boundary treatment, including walls or fencing where proposed
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 7. The list asks for both a block plan and
  a site plan; both are shown here. The companion Application Validation Checklist (which ticks documents
  per application type) could not be read, so the application types come from the notes' own wording.
