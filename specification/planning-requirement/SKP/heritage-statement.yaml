reference: heritage-statement
local-authority: SKP
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - listed-building
      - park-and-garden
      - conservation-area
      - locally-listed-building
      - historic-environment-record
      - listed-building-setting
      description: 'Affects a heritage asset or its setting: Scheduled Monuments, Listed Buildings, Registered
        Parks and Gardens, Conservation Areas, locally listed buildings or Historic Environment Record
        sites.'
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport UDP Review (2006) saved policy HC1.1, HC1.3, HC1.4, HC4.1, SE1.2-SE1.4; Stockport Core
  Strategy DPD policies CS8 and SIE-3; Planning (Listed Buildings and Conservation Areas) Act 1990; NPPF
source-text: A Heritage Statement must be submitted with any application that affects any heritage assets.
  This includes impacts on the settings of heritage assets. Heritage assets include Designated heritage
  assets (in Stockport; Scheduled Monuments, Listed Buildings, Registered Parks and Gardens, Conservation
  Areas) and undesignated assets identified as having a degree of significance meriting consideration
  in planning decisions, because of their heritage interest (this can include those identified by the
  local planning authority (including local listing), and sites on the Historic Environment Record (HER)).
  A statement may therefore be requested if the Council identifies the building or site as a non-designated
  heritage asset of archaeological, architectural, artistic or historic interest during the pre- application
  or application process.
must-include:
- item: Undertaken using appropriate expertise, proportionate to the significance of the asset
  level: must
- item: Significance of the building, site or area (archaeological, architectural, historic or artistic),
    including its setting, with reference to the HER and National Heritage List
  level: must
- item: Schedule of works affecting the building, site or area
  level: must
- item: Impact of the proposals on the special interest and character of the asset and any adjacent heritage
    assets
  level: must
- item: Justification for the proposals and any mitigation
  level: must
- item: 'Less than substantial harm: evidence of public benefit outweighing the harm; substantial harm
    or total loss: evidence for the NPPF tests'
  level: must
  required-if: discretionary
- item: 'Demolition or conversion of heritage assets: supported by a structural survey and, where relevant,
    a viability appraisal and marketing exercise'
  level: should
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of a heritage asset.
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion of a heritage asset.
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 96. Non-designated assets the council identifies
  during pre-application or the application show as discretionary. Can form part of the Design and Access
  Statement.
review-status: unverified
field-status: {}
