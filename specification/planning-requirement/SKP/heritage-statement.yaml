reference: heritage-statement
local-authority: SKP
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - outline
      - hh
      - lbc
      - s73
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The application affects any heritage asset.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
source-text: HERITAGE STATEMENT When Required A Heritage Statement must be submitted with any application
  that affects any heritage assets.
must-include:
- item: A schedule of works affecting the building, site or area
  level: must
- item: An assessment of the impact of the proposals on the special interest and character of the building,
    site or area and that of any adjacent heritage assets
  level: must
- item: A justification for the proposals, in terms of the principles applied, together with any mitigation
    measures proposed
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type):
  F, RM, O, H, LB and RC. The content items are from the bullets the workbook filed under schedule of
  works and archaeology. The list also asks for ''an appropriate desk-based assessment and, where necessary,
  a field evaluation'', but its lead-in condition was cut off.'
