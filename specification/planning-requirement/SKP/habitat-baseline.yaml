reference: habitat-baseline
local-authority: SKP
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Environment Act 2021; Town and Country Planning Act 1990 Schedule 7A
source-text: A Draft Biodiversity Gain Plan/BNG Statement or a Statement detailing why the application
  is exempt form BNG is required for all Major Developments and all and Minor Developments from 2 April
  2024. ... Where the full draft Biodiversity Gain Plan is not provided upfront with the main application,
  Stockport Council requires a BNG Statement as a Local Validation Requirement.
must-include:
- item: Plan/map of the baseline habitats with accompanying GIS shapefiles
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 93. Required by law where the biodiversity
  gain condition applies (householder and other exempt applications are exempt), so the rule uses the
  biodiversity-gain-condition field. Stockport asks for a BNG Statement (baseline metric, baseline habitat
  plan with GIS shapefiles, and an indicative plan of how 10% will be achieved) where a full draft Biodiversity
  Gain Plan isn't submitted; the statement and the exemption statement are in the unmapped list.
review-status: unverified
field-status: {}
