reference: arboriculturist-report
local-authority: SKP
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The development is near to trees.
  - condition:
      field: tree-removal
      value: true
      description: The development proposes the removal of trees.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS8, SIE-1 and SIE-3; BS5837:2012
source-text: Where a development is near to trees, or proposes the removal of trees, survey details are
  required of trees in line with BS5837 2012.
must-include:
- item: Undertaken by a suitably qualified and competent person or organisation
  level: must
- item: Survey plotted at 1:200 showing trees to be retained and felled
  level: must
- item: Location, species, size, crown spread and health of each tree on the site and on adjacent land
  level: must
- item: Arboricultural Implications Report and method statement, including a tree protection plan
  level: must
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 51.
review-status: unverified
field-status: {}
