reference: town-centre-impact-assessment
local-authority: SKP
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside Stockport's centres (excluding the TCG2.2 Portwood Gateway area).
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 200
        description: A1 retail of over 200 sq m net sales area.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside Stockport's centres and not in accordance with the Development Plan.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Leisure development over 2,500 sq m gross floorspace.
  - all:
    - site:
        in:
        - town-centre
        description: Inside Stockport Town Centre or a District or Local Centre.
    - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS5, CS6 and AS-1; Stockport UDP Review (2006) saved policy
  TCG2.1, TCG2.2 and TCG3; NPPF
source-text: An assessment, addressing the types of impact listed in the ‘Ensuring the vitality of town
  centres’ section of the National Planning Policy Framework (NPPF), is required for planning applications
  involving the provision of A1 use of over 200 sqm net retail sales area at locations outside Stockport’s
  centres (but excluding within the TCG2.2 (Portwood Gateway) area). This is a locally set floorspace
  threshold with respect to the NPPF. An assessment, addressing the types of impact listed in the ‘Ensuring
  the vitality of town centres’ section of the NPPF, is required for planning applications involving the
  provision outside of Stockport’s centres of leisure development over 2,500 sqm gross floorspace where
  it is not in accordance with Stockport’s Development Plan. This is also a requirement of the NPPF.
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 43. The 200 sq m figure is net retail sales
  area (the field holds gross floorspace, so check). Inside the centres, the summary table sets impact
  thresholds by centre (e.g. A1 over 2,500 sq m net in District Centres, 1,500 sq m in Large Local Centres,
  280 sq m in Other Local Centres); our fields can't tell the centre types apart, so that part shows as
  discretionary. The sequential assessment is in the unmapped list.
review-status: unverified
