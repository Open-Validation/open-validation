reference: floor-plan-proposed
local-authority: SKP
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy of the completed application form, each of the following plans and a Design and
  Access Statement (where relevant to the application), must be supplied for a planning application to
  be validated.
must-include:
- item: At 1:50 or 1:100 scale
  level: must
- item: All proposed floor plans, showing the works in relation to what is already there
  level: must
- item: New buildings shown in context with adjacent buildings, including property numbers where applicable
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: The proposal includes a new building.
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 8. The companion Application Validation Checklist
  (which ticks documents per application type) could not be read, so the application types come from the
  notes' own wording.
