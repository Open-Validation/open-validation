reference: energy-statement
local-authority: SKP
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: new-build
        value: true
        description: New development (the list excludes changes of use and extensions to existing businesses
          or other non-domestic premises).
  - application-type:
      in:
      - hh
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS1, SD-2, SD-3 and SD-6; Sustainable Design and Construction
  SPD
source-text: Applications for planning permission (excluding changes of use, extensions to existing businesses
  or other non-domestic premises) are required to submit an Energy Statement explaining how low and zero
  carbon technologies have been considered as part of the proposal, and demonstrate how the proposal will
  contribute reductions in CO2 emissions. ... Applications for changes to existing domestic dwellings
  will be required, where possible and practical, to undertake reasonable improvements to the energy performance
  of the existing dwelling. These applications will require the submission of a completed Council House
  Extension Energy Checklist to identify which measures are appropriate to the residence.
must-include:
- item: How low and zero carbon technologies have been considered and how the proposal will reduce CO2
    emissions, responding to the Council's Climate Emergency declaration and strategy
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: new-build
        value: true
        description: New development.
- item: 'For changes to existing dwellings: a completed Council House Extension Energy Checklist identifying
    which energy improvement measures suit the dwelling'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Comprehensive statement: summary of the strategy to reduce energy use and CO2; heating and renewable
    energy overview (ventilation, overheating mitigation, generating capacity, storage, in-use monitoring);
    siting/layout plans of renewable equipment; water efficiency; embodied carbon measures; a completed
    Energy Summary Tool (SAP or agreed alternative)'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m or more.
  source-text: 'Applications for new developments that are 10 or more dwellings or 1000 sqm or above must
    submit a comprehensive Energy Statement that includes:'
confidence: medium
notes: From the council's list (adopted 19 June 2024), pages 24-26. Schemes under 10 dwellings or 1,000
  sq m can include this in the Design and Access Statement or a short statement. The House Extension Energy
  Checklist (section 6) is shown here for householder applications.
review-status: unverified
field-status: {}
