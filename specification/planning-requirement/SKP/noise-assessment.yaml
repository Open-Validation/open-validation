reference: noise-assessment
local-authority: SKP
required-if:
  any:
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: New sensitive receptors (including converted upper floors above or next to commercial
          activities) exposed to existing noise or vibration.
    - discretionary
  - all:
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: A new noise or vibration source.
      - condition:
          field: plant-equipment
          value: true
          description: Plant such as air conditioning, air source heat pumps or kitchen extraction.
    - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport UDP Review (2006) saved policy EP1.10; Stockport Core Strategy DPD policies CS8 and
  SIE-3
source-text: 'A Noise Impact Assessment is required: • Where new sensitive receptors are likely to be
  exposed to noise and/or vibration from existing noise sources. Examples are: road traffic, railway,
  aviation, licensed premises, sports/leisure, commercial activities and plant noise. Also when converting
  the upper floor of buildings where commercial activities are located on the ground floor or adjoining
  building. • Where a new noise/vibration source is proposed and has potential to affect existing noise-sensitive
  receptors (residential, school, hospital, office accommodation). Examples are air conditioning units,
  air source heat pumps (ASHP), and commercial kitchen extraction systems.'
must-include:
- item: Completed by a suitably qualified and experienced noise consultant
  level: must
- item: 'Residential: a noise mitigation scheme (glazing and ventilation strategy; for conversions, floors,
    ceilings, party walls and partitions) meeting BS 8233:2014 internal levels, 50 dB LAeq,16hr external,
    and 45 dB LAmax in bedrooms'
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Residential development.
- item: 'New sound source: assessed to BS 4142:2014+A1:2019, with plant rating level 10 dB below background
    at the nearest noise-sensitive receptor (5 dB with justification)'
  level: must
  required-if:
    any:
    - condition:
        field: noise-generating-use
        value: true
        description: A new sound source.
    - condition:
        field: plant-equipment
        value: true
        description: New plant.
- item: 'Schools: break-in of external noise controlled to BB93:2015; health buildings to HTM 08-01'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 80. Whether receptors are 'likely to be exposed'
  or a new source 'has potential to affect' them is a judgement, so both parts show as discretionary alongside
  the clear conditions.
review-status: unverified
field-status: {}
