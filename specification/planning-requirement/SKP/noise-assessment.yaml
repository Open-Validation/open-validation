reference: noise-assessment
local-authority: SKP
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: New sensitive receptors exposed to existing noise or vibration sources.
  - condition:
      field: noise-generating-use
      value: true
      description: New noise sources.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
source-text: 'NOISE AND VIBRATION IMPACT ASSESSMENT When Required: new sensitive receptors exposed to
  existing noise/vibration sources… or new noise sources'
must-include:
- item: Internal ambient noise levels for dwellings and design criteria for external noise to BS 8233:2014
    (desirable external noise level of 50dB LAeq,16hr)
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the BS 8233 design criteria instead of the trigger.
  The audit says the Householder and Prior Notification lists include it too.'
review-status: unverified
field-status: {}
