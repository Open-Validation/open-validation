reference: planning-statement
local-authority: SKP
required-if:
  any:
  - application-type:
      in:
      - full
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is in clear breach of Development Plan policies or runs counter to Supplementary
        Planning Documents/Guidance.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Development Plan (Core Strategy DPD, saved UDP Review policies, GM Joint Waste and Minerals
  DPDs)
source-text: The submission of a planning statement by an applicant, presenting the case for why a development
  should be granted planning permission, will normally be expected with all applications for full planning
  permission. Where a proposal is in clear breach of policies contained in the Council’s Development Plan
  or runs counter to the approach advised in relevant Supplementary Planning Documents/ Guidance, a planning
  statement must be submitted to explain why.
must-include:
- item: Overview of the issues with reference to all relevant planning considerations, and why the development
    should be permitted if it is in clear breach of the Development Plan or SPDs/SPG
  level: must
- item: Outcome of consultation and pre-application discussion with the council, consultees or the community
  level: must
  required-if: discretionary
- item: History of the site, including previous applications and present and previous uses
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 19 June 2024), page 40. 'Normally expected' with all full applications;
  required where the proposal is in clear breach of policy.
review-status: unverified
field-status: {}
