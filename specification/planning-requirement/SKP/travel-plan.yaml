reference: travel-plan
local-authority: SKP
required-if:
  any:
  - condition:
      field: new-school
      value: true
      description: New schools and colleges.
  - condition:
      field: school-expansion
      value: true
      description: Expanded schools and colleges.
  - discretionary
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS9, CS10, T-1 and T-3; Sustainable Transport SPD
source-text: The Council will require applications for development which are likely to have significant
  or specific transport implications to be supported by a Travel Plan (TP) or Travel Plan Statement (TPS),
  the form of which will be dependent on the scale and nature of the development and its transport implications.
  ... School Travel Plans will be required for all new and expanded schools and colleges.
must-include:
- item: 'Non-residential: produced with the Transport for Greater Manchester Travel Plan Toolkit (unless
    agreed otherwise), with a copy output from the Toolkit submitted with the application'
  level: must
confidence: medium
notes: 'From the council''s list (adopted 19 June 2024), page 100. Thresholds are those in Table 4 of
  ''Good Practice Guidelines: Delivering Travel Plans through the Planning Process'' (DCLG/DfT 2009),
  not the list itself, and developers should confirm the need with the council, so the general case shows
  as discretionary.'
review-status: unverified
