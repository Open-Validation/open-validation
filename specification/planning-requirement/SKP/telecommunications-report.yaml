reference: telecommunications-report
local-authority: SKP
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications applications.
source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
policy: Stockport Core Strategy DPD policies CS8 and SIE-5; Radio Telecommunications Development SPG
source-text: 'All telecommunications applications should be accompanied by the following information:'
must-include:
- item: Statement of compliance with ICNIRP guidelines
  level: must
- item: Evidence of assessment of alternative sites and/or mast sharing
  level: must
- item: Justification for the installation, with existing and proposed coverage plots
  level: must
- item: Photomontages where it would have a significant impact on its setting
  level: must
  required-if: discretionary
- item: Results of pre-application consultation with interested parties and the community, including the
    Traffic Light Model
  level: must
