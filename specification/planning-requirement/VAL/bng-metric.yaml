reference: bng-metric
local-authority: VAL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Town and Country Planning Act 1990 (as amended), Schedule 7A, paragraph 13
source-text: 'If mandatory BNG does apply, national minimum information requirements must be satisfied.
  These are: ... The Statutory Biodiversity Metric, with at least all relevant baseline sections completed,'
must-include:
- item: The Statutory Biodiversity Metric with at least all relevant baseline sections completed
  level: must
- item: Statement of degradation confirming the relevant date for the pre-development baseline (immediately
    before any degrading activity on or after 30 January 2020, otherwise the application date)
  level: must
- item: Statement of irreplaceable habitats describing any that exist or existed on site
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.13 (national list), page 12-13. The
  joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils; the
  checklist for each application type says which items apply. The guide says all applicants must declare
  whether the biodiversity gain condition applies; householder and other exempt applications are exempt
  by law, so this follows the condition. If claiming the de minimis or self-build exemption, plans or
  statements evidencing it may be needed.
review-status: unverified
field-status: {}
