reference: design-and-access-statement
local-authority: VAL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
source-text: 'A concise and site-specific report accompanying applications for planning permission and
  listed building in the following cases: ... all major development proposals (both full and outline applications)
  ... all listed building consent proposals ... one or more new dwellings in a Conservation Area ... a
  building or buildings with a floor space of 100 square metres or more.'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The approach to access and how relevant Local Plan policies have been considered
  level: must
- item: Any consultation on access issues and how its outcome informed the proposal
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.11 (national list), page 11-12. The
  joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils; the
  checklist for each application type says which items apply. The guide lists the 100 sq m floor space
  case as a separate bullet after the conservation area one; it is shown here as applying in a conservation
  area, as in Article 9 of the Development Management Procedure Order, which the national list follows.
review-status: unverified
field-status: {}
