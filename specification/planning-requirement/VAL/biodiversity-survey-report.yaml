reference: biodiversity-survey-report
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        description: Within or next to a SSSI, Special Area of Conservation or Special Protection Area.
    - condition:
        field: protected-species
        value: true
        description: A reasonable likelihood that the proposal might affect important protected species
          or habitats.
    - discretionary
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1 Core Policy 46; Vale of White Horse Local Plan 2031
  Part 2 Development Policy 30
source-text: 'for all major planning application proposals ... if the site is within or adjacent to a
  designated habitat site: ... Site of Special Scientific Interest (SSSI) ... Special Area of Conservation
  (SAC) ... Special Protection Area (SPA) ... where there is a reasonable likelihood that a planning proposal
  might affect important protected species or habitats ... if the proposal affects mature/overgrown gardens,
  areas of rough grassland or derelict land, including brownfield, allotments on or adjacent to the site
  ... where a development proposal may have possible impacts on wildlife and biodiversity, in particular
  protected species such as bats – a survey is generally considered necessary for demolition proposals,
  including small-scale householder extension and refurbishment schemes where bats are known to be in
  the area. ... Great Crested Newts (where there is a pond within 250m of the site or a pond on the site),
  badgers or common reptiles.'
must-include:
- item: The species and habitats likely to be affected and an assessment of the impacts
  level: must
- item: Up-to-date survey information on the species or habitats likely to be affected
  level: must
- item: Net gain of biodiversity (10%) using a recognised biodiversity metric, with the Excel calculation
    spreadsheet
  level: must
- item: Biodiversity enhancement measures on a detailed plan with specifications
  level: must
- item: How habitat creation or other enhancement measures will be established, managed and maintained
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.20, 'Biodiversity/Ecological Impact
  Assessment and Survey', page 18-19. The joint South Oxfordshire and Vale of White Horse Validation Guide
  is published by both councils; the checklist for each application type says which items apply. On the
  householder, full, outline and reserved matters checklists. The habitat cases (gardens, rough grassland,
  derelict land, demolition where bats are known nearby, ponds within 250m for great crested newts, badgers,
  reptiles) need a judgement on the site, so they are shown as discretionary. The hedgerow removal notice
  checklist also asks for a biodiversity survey where protected species or habitats could be affected.
review-status: unverified
field-status: {}
