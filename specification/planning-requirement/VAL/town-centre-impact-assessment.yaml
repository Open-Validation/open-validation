reference: town-centre-impact-assessment
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 1
          description: Retail development.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 500
        description: Retail development exceeding 500 sq m gross (LPP1 Core Policy 16).
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m gross retail floorspace for development likely to have an impact on Abingdon-on-Thames
          or Wantage town centre (LPP1 Core Policy 32).
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 500
        description: 500 sq m gross retail floorspace elsewhere in the district (LPP1 Core Policy 32).
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1 Core Policies 16 and 32; NPPF
source-text: 'all major planning application proposals for retail development ... in Vale of White Horse:
  ... LPP1 CP16 specific, retail development exceeding 500sqm (gross) ... LPP1 CP32: ... 1,000sqm gross
  retail floorspace for development likely to have an impact on Abingdon-on-Thames or Wantage town centre
  ... 500 sqm gross retail floorspace elsewhere in the district'
must-include:
- item: 'For major retail proposals: evidence of compliance with the sequential test (NPPF)'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1
        description: Retail development.
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment area
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.34, 'Retail Impact Assessment', page
  28-29. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils;
  the checklist for each application type says which items apply. The guide gives different thresholds
  for each council; these are the Vale of White Horse ones (the list cites 'CPP2 policy CP32'; Core Policy
  32 is in Local Plan Part 1).
review-status: unverified
field-status: {}
