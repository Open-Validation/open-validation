reference: arboriculturist-report
local-authority: VAL
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within 15m of any part of the development.
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: Protected (TPO or conservation area) trees are affected.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
source-text: '7.18.1 A tree survey or Arboricultural Assessment should identify the quantity, species,
  position, and size of the tree(s) and provide a full and clear specification of the works intended and
  any protection measures required for the retained trees. 7.18.2 An arboricultural assessment is required
  when: - - there are any trees within 15m of any part of the development.'
must-include:
- item: Quantity, species, position and size of the trees
  level: must
- item: A full and clear specification of the works intended
  level: must
- item: Protection measures required for the retained trees
  level: must
confidence: low
notes: 'Audit (wrong_trigger, wrong_app_type): trees within 15m or TPO/conservation area trees; applies
  to householder work too. Where a note says "From the audit", it is the South Oxfordshire audit of the
  same joint guide; the Vale audit could not re-read the guide. The audit couldn''t read this council''s
  list, so its contents weren''t checked.'
review-status: unverified
field-status: {}
