reference: arboriculturist-report
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within 15m of any part of the development (including access, service routes,
          compounds and drainage), including trees on neighbouring land that could be affected.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Significant or protected trees (Tree Preservation Order or in a Conservation Area)
          on or next to the site that would be directly or indirectly affected.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1 Core Policy 44
source-text: there are any trees within 15m of any part of the development. They should be surveyed and
  assessed as part of an Arboricultural Impact Assessment, including trees on neighbouring land that could
  be affected by the development. Development in relation to trees also includes provision of site access,
  service routes, compound areas, drainage infrastructure ... where there are significant or protected
  trees (subject to a Tree Preservation Order or within a Conservation Area – you can check this on our
  website) on or adjacent to the site which will either be (directly or indirectly) impacted by the development
  or its construction.
must-include:
- item: Tree survey based on a topographical survey, accurately positioning the trunks of trees that could
    be influenced by the development
  level: must
- item: Trees to be retained, numbered and marked on a plan
  level: must
- item: Trees to be removed, numbered and marked on a plan
  level: must
- item: Trees to be pruned (including access facilitation pruning), numbered and marked on a plan, with
    a schedule of works
  level: must
- item: Areas for structural landscaping to be protected from construction operations
  level: must
- item: An evaluation of the impact of any proposed tree loss
  level: must
- item: Evaluation of the tree constraints and a draft Tree Protection Plan
  level: must
- item: All issues addressed in an Arboricultural Method Statement
  level: must
- item: Prepared by a qualified arboriculturist in line with BS 5837:2012 (or later revisions)
  level: should
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.18, 'Arboricultural Assessment/Tree
  Survey', page 16-17. The joint South Oxfordshire and Vale of White Horse Validation Guide is published
  by both councils; the checklist for each application type says which items apply. On the householder,
  full, outline and reserved matters checklists. The hedgerow removal notice checklist also asks for a
  tree survey and arboricultural statement.
review-status: unverified
field-status: {}
