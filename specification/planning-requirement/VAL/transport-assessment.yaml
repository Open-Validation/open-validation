reference: transport-assessment
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1 Core Policies 33 and 35; Vale of White Horse Local
  Plan 2031 Part 2 policy DP17
source-text: 'A Transport Assessment is required for: ... all major planning application proposals (residential
  and non-residential) ... proposals that are likely to have significant highway implications that either
  arise from the development proposal or cumulatively with other development proposals'
must-include:
- item: Accessibility to the site by all modes of transport
  level: must
- item: Likely modal split of journeys to and from the site
  level: must
- item: Measures to improve access by sustainable modes
  level: must
- item: Parking and manoeuvring areas on a plan
  level: must
- item: How the transport implications will be managed to minimise impacts
  level: must
- item: A strategy for implementation and co-ordination of a travel plan
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.39, 'Transport Assessment/Statement/Travel
  Plan', page 31-32. The joint South Oxfordshire and Vale of White Horse Validation Guide is published
  by both councils; the checklist for each application type says which items apply. A Transport Statement
  is the lighter-touch version where proportionate. 'Significant highway implications' has no threshold,
  so it is shown as discretionary. The travel plan is asked for as part of this document (a strategy for
  its implementation), not as a separate requirement; Oxfordshire County Council is the highway authority.
review-status: unverified
field-status: {}
