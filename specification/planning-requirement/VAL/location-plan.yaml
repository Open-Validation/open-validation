reference: location-plan
local-authority: VAL
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc-prospective-use
    - ldc-existing-use
    - pip
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
source-text: This plan is required to show us where the site is and on what land planning permission is
  being applied on.
must-include:
- item: Up-to-date Ordnance Survey based map, not a Land Registry document or plan
  level: must
- item: At an identified scale of 1:1250 or 1:2500, with a scale bar and the scale written on the drawing
  level: must
- item: Direction of North
  level: must
- item: The full site, all site boundaries and adjoining properties
  level: must
- item: Application site, including all land needed for the development and access from the highway, outlined
    with a continuous unbroken red line
  level: must
- item: Any other land in the applicant's ownership or control adjacent to the site outlined in blue
  level: must
- item: A unique drawing reference
  level: must
- item: Original paper size (A4, A3 etc); uploaded and printable in colour
  level: must
- item: Copyright licence number with the appropriate copyright acknowledgement
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.6 (national list), page 9. The joint
  South Oxfordshire and Vale of White Horse Validation Guide is published by both councils; the checklist
  for each application type says which items apply. Listed on the householder, full, outline, reserved
  matters, listed building, advertisement, lawful development (proposed and existing) and permission in
  principle checklists.
review-status: unverified
field-status: {}
