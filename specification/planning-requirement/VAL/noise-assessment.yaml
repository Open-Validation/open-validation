reference: noise-assessment
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: plant-equipment
        value: true
        description: Plant, ventilation, air extraction or air conditioning equipment and flues.
    - condition:
        field: noise-generating-use
        value: true
        description: Uses likely to create significant noise such as food/drink, entertainment and leisure,
          industrial uses, day nurseries.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise-sensitive use in a noisy environment or near an existing noise-generating
          use.
    - discretionary
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 2 policy DP25
source-text: 'where noise is likely to be a material consideration/ cause an impact for either noise sensitive
  development or noise generating development, such as: ... plant, ventilation, air extraction of air
  conditioning equipment and flues ... uses likely to create significant noise such as food/drink, entertainment
  and leisure uses, industrial uses, day nurseries, etc. ... a noise-sensitive use located in a noisy
  environment ... use likely to generate a significant amount of traffic ... noise-sensitive use being
  proposed in proximity to an existing noise generating use.'
must-include:
- item: Existing background noise levels measured over a 24-hour period
  level: must
- item: A clear understanding of proposed noise levels
  level: must
- item: Any proposed measures to reduce noise levels
  level: must
- item: The method used and examples of the calculations and assumptions made
  level: must
- item: Prepared by a suitably qualified acoustic consultant, with a scheme of noise mitigation where
    required
  level: should
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.14, 'Acoustic Report/ Noise Impact Assessment',
  page 14. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both councils;
  the checklist for each application type says which items apply. On the full, outline and reserved matters
  checklists. The overall test ('where noise is likely to be a material consideration') and the traffic
  example ('a significant amount of traffic') have no threshold, so they are shown as discretionary.
review-status: unverified
field-status: {}
