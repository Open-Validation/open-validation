reference: archaeological-assessment
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - scheduled-monument
        description: The site or part of it is within, or in the setting of, a Scheduled Monument.
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an archaeological priority or archaeologically sensitive area.
    - ref: major-development
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 2 policy DP39
source-text: if the site or part of the site is within, or in the setting of, a Scheduled Ancient Monument
  or if the site is within a priority or in an archaeologically sensitive area. ... the proposal is a
  major development application
must-include:
- item: The significance of the heritage assets affected and their contribution to the site
  level: must
- item: A desk-based assessment of the impact of the proposal, showing the sources considered and the
    expertise consulted
  level: must
- item: Relevant supporting documentation, such as plans of historic features on or next to the site
  level: must
- item: How the impact on heritage assets and their settings has been considered (NPPF section on the
    historic environment)
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.19, 'Archaeological Survey/Assessment',
  page 17-18. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both
  councils; the checklist for each application type says which items apply. On the full, outline and reserved
  matters checklists. It can be combined with the Heritage Statement. If a field evaluation is needed,
  discuss it first with Oxfordshire County Council's Archaeologist.
review-status: unverified
field-status: {}
