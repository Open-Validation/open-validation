reference: section-existing
local-authority: VAL
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: Alterations to existing ground levels, for example a sloping site or clear level differences
      across the site or with neighbouring properties.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
source-text: Site sections and finished floor and site levels (existing and proposed) 7.10.1 These plans
  are required where alterations are being made to the existing ground levels, for example a sloping site
  or where there are clear ground level differences across the site and/or between neighbouring properties.
must-include:
- item: At an identifiable scale of 1:200, 1:100 or 1:50, with a scale bar
  level: must
- item: A cross section through the building(s)
  level: must
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Where a note says
