reference: air-quality-assessment
local-authority: VAL
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
source-text: '7.17.2 An air quality assessment is required: - For all major planning application proposals
  where the development could result in significant vehicle movements through an Air Quality Management
  Area (AQMA)'
must-include:
- item: The existing air quality (baseline)
  level: must
- item: A prediction of future air quality without the proposed development
  level: must
confidence: low
notes: Applies to major outline as well as full applications. Whether vehicle movements through an AQMA
  are significant is a judgement, so it is shown as officer discretion. Where a note says "From the audit",
  it is the South Oxfordshire audit of the same joint guide; the Vale audit could not re-read the guide.
  The audit couldn't read this council's list, so its contents weren't checked.
review-status: unverified
field-status: {}
