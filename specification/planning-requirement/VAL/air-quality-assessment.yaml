reference: air-quality-assessment
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: 'Vale of White Horse Local Plan 2031 Part 2 policy DP26 (Air Quality Management Areas: Abingdon-on-Thames,
  Botley, Marcham)'
source-text: 'An air quality assessment is required: ... For all major planning application proposals
  ... where the development could result in significant vehicle movements through an Air Quality Management
  Area (AQMA)'
must-include:
- item: The existing air quality (baseline)
  level: must
- item: A prediction of future air quality without the development (future baseline)
  level: must
- item: The impacts of the development during construction
  level: must
- item: A prediction of future air quality with the development (operational phase)
  level: must
- item: Measures to mitigate and manage impact
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.17, page 16. The joint South Oxfordshire
  and Vale of White Horse Validation Guide is published by both councils; the checklist for each application
  type says which items apply. 'Significant vehicle movements through an AQMA' has no threshold (the site
  need not be in the AQMA), so it is shown as discretionary. The methodology and datasets should be agreed
  with the Environmental Protection Team first.
review-status: unverified
field-status: {}
