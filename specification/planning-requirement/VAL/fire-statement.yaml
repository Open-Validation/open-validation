reference: fire-statement
local-authority: VAL
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
source-text: '7.12.1 Measures to ensure the consideration of fire safety matters as part of the planning
  process which should be submitted with applications for: - proposals that contain two or more dwellings
  or educational accommodation and meet the height condition of 18m or more in height, or 7 or more storeys.'
must-include:
- item: Submitted on a form published by the Secretary of State (or a form to similar effect)
  level: must
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Where a note says
  "From the audit", it is the South Oxfordshire audit of the same joint guide; the Vale audit could not
  re-read the guide. The audit couldn't read this council's list, so its contents weren't checked.
review-status: unverified
field-status: {}
