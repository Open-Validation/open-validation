reference: viability-assessment
local-authority: VAL
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Housing where policy requires affordable housing but, for viability reasons, the required
        level is not proposed.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Development needing planning obligations or contributions that, for viability reasons,
        are not proposed.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1 Core Policies 6, 7, 22, 24, 25 and 26
source-text: housing proposals where there is a policy requirement to provide affordable housing and for
  viability reasons the level of affordable housing contribution is not being proposed. ... any development
  that requires planning obligations or planning contributions but where such obligations, contributions
  or features are not being proposed due to viability reasons.
must-include:
- item: Enough financial information to show why the scheme cannot support the obligations or contributions
    sought
  level: must
- item: An open book approach reflecting the PPG on standardised inputs to viability assessment
  level: must
- item: Written confirmation that the applicant will fund independent assessment of the viability assessment
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.40, 'Viability and Financial Information',
  page 32-33. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both
  councils; the checklist for each application type says which items apply. Viability information will
  be published in full; documents marked confidential are accepted only with clear and compelling reasons.
review-status: unverified
field-status: {}
