reference: planning-statement
local-authority: VAL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - ldc-prospective-use
      - ldc-existing-use
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1; Vale of White Horse Local Plan 2031 Part 2; NPPF
source-text: 'A planning statement is required for: ... all major planning application proposals ... applications
  where a planning justification, assessment or interpretation is required'
must-include:
- item: The context and an explanation of the principles behind the proposed development
  level: must
- item: How the proposal complies with relevant national and development plan policies, including supplementary
    planning guidance and documents
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.32, page 27-28. The joint South Oxfordshire
  and Vale of White Horse Validation Guide is published by both councils; the checklist for each application
  type says which items apply. 'Where a planning justification, assessment or interpretation is required'
  is a judgement, so it is shown as discretionary. The lawful development certificate checklists list
  a 'Planning/Supporting Statement'. It can be combined with the design and access statement and heritage
  statement.
review-status: unverified
field-status: {}
