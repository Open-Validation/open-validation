reference: sustainability-statement
local-authority: VAL
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
policy: Vale of White Horse Local Plan 2031 Part 1 Core Policies 37, 40 and 43
source-text: 'A sustainable design measures statement is required for: ... all new development including:
  ... building conversions ... refurbishments ... residential extensions'
must-include:
- item: How the proposal limits greenhouse gas emissions through location, landform, layout and building
    orientation, design, massing, landscaping and planting, resilience, and water conservation and management
  level: must
confidence: medium
notes: From the council's list (published 4 June 2024), section 7.37, 'Sustainable Design Measures Statement',
  page 30-31. The joint South Oxfordshire and Vale of White Horse Validation Guide is published by both
  councils; the checklist for each application type says which items apply. On the householder, full,
  outline and reserved matters checklists ('Sustainable Design Measures Statement/Checklist'); the councils'
  sustainable construction checklists can be used. It can stand alone or be part of the planning statement.
