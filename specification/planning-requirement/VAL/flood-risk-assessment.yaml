reference: flood-risk-assessment
local-authority: VAL
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area.
source-url: https://www.whitehorsedc.gov.uk/wp-content/uploads/sites/3/2024/06/2024-06-04-Final-Validation-Guide-1.pdf
confidence: low
notes: 'Audit (wrong_trigger): the excerpt was only the definition. From the audit: 7.26 triggers are
  Flood Zones 2/3, Flood Zone 1 sites of 1ha+, and critical drainage areas; it applies to householder
  work too. Where a note says "From the audit", it is the South Oxfordshire audit of the same joint guide;
  the Vale audit could not re-read the guide. The audit couldn''t read this council''s list, so its contents
  weren''t checked.'
review-status: unverified
field-status: {}
