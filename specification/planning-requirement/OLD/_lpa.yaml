local-authority: OLD
name: Oldham Metropolitan Borough Council
region: North West
type: Metropolitan borough
review-status: unverified
validation-list:
  url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
  date: '2025-10-13'
  date-basis: The checklist states no adoption, publication or version date; the PDF was created on 13
    October 2025 (PDF metadata) and it cites the 2024 Places for Everyone plan and the 2024 BNG regulations.
    The council's 'How to apply for planning permission' page (https://www.oldham.gov.uk/info/200399/applying_for_planning_permission/3042/how_to_apply_for_planning_permission),
    checked 2026-11-06, links this checklist (file 8273) as its planning validation checklist and no newer
    list or consultation; MHCLG's register (planning.data.gov.uk entity 20167) still points to an older
    checklist (file 2785, 2011).
  status: current
submission-standards:
- item: No individual file larger than 10MB unless agreed in advance; larger documents split into smaller
    files clearly labelled Part 1, Part 2 etc. (in the file name and within the file)
  level: must
- item: All supporting documents (including letters, reports and photographs) in PDF format, ideally PDF/A
  level: must
- item: Drawings as single-layer, scalable PDFs, ideally PDF/A; CAD files not accepted, except drawings
    of drainage or highway layouts (e.g. swept-path analysis), which are submitted in both formats
  level: must
- item: Drawings at A3 paper size where possible
  level: should
- item: All drawings on a recognised ISO 'A' paper size
  level: must
- item: Each drawing has a title box with the site address/name, drawing title (including whether existing
    or proposed), date, drawing reference/number with revision number/letter, scale and paper size
  level: must
- item: Each drawing has a scale bar and a North compass point
  level: must
- item: '''Not to scale'' or ''Do not scale'' annotations are not accepted; drawings are true to the stated
    scale'
  level: must
- item: Key external dimensions marked on drawings (e.g. depth/width of a rear extension on floor plans,
    its height on elevations)
  level: must
- item: Scanned drawings at a minimum of 200dpi
  level: must
- item: PDF orientation matches the original drawing sheet
  level: must
- item: A summary list/schedule of drawings, with drawing title, reference, description and paper size
  level: must
- item: Electronic file names include the document type, title and reference (e.g. 'DRAWING - PROPOSED-FLOORPLAN
    – 12345 REV.A')
  level: must
- item: Additional material may be sent by online file transfer by prior arrangement
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link works and appears to be Oldham''s current checklist, but its date comes only
    from PDF metadata. The extraction misses about 13 local requirements, including Affordable Housing,
    Air Quality, Contaminated Land, Planning Statement, Lighting, Levels and Sustainability, wrongly marks
    Householder/Outline/RM as having no local requirements, and has several triggers copied from the tree-survey
    row. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
