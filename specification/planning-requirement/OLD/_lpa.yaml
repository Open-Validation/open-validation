local-authority: OLD
name: Oldham Metropolitan Borough Council
region: North West
type: Metropolitan borough
data-stage: scraping-in-progress
review-status: unverified
validation-list:
  url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
  date: 2025-10-01
  date-basis: PDF metadata (CreationDate) only; the checklist states no adoption, publication or version
    date (audit wrong_date). It cites the 2024 Places for Everyone plan and 2024 BNG regulations
  status: current
submission-standards:
- item: No individual file larger than 10MB unless agreed in advance; split larger documents into clearly
    labelled parts (Part 1, Part 2 etc.)
  level: must
- item: All supporting documents (including letters, reports and photographs) in PDF format, ideally PDF/A
  level: must
- item: Drawings as single-layer, scalable PDFs, ideally PDF/A; CAD files not accepted, except drawings
    of drainage or highway layouts (e.g. swept-path analysis), which are submitted in both formats
  level: must
- item: Drawings on ISO 'A' paper sizes, at A3 where possible
  level: must
- item: Each drawing has a title box, including the site address/name and the drawing reference/number
    with revision number/letter
  level: must
- item: Each drawing has a scale bar and a north point; 'Not to scale' or 'Do not scale' annotations are
    not accepted
  level: must
- item: PDF orientation matches the original drawing sheet
  level: must
- item: A summary schedule of drawings, with drawing title, reference, description and paper size
  level: must
- item: Electronic file names include the document type, title and reference (e.g. 'DRAWING - PROPOSED-FLOORPLAN
    – 12345 REV.A')
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 10
  notes: Grokbot's link works and appears to be Oldham's current checklist, but its date comes only from
    PDF metadata. The extraction misses about 13 local requirements, including Affordable Housing, Air
    Quality, Contaminated Land, Planning Statement, Lighting, Levels and Sustainability, wrongly marks
    Householder/Outline/RM as having no local requirements, and has several triggers copied from the tree-survey
    row.
