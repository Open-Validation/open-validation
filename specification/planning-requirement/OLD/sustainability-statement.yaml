reference: sustainability-statement
local-authority: OLD
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: The proposal creates new floorspace.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The change of use creates new dwellings.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
confidence: medium
notes: 'From the audit (missing_requirement): a Sustainability, Carbon and Energy Statement.'
review-status: unverified
field-status: {}
