reference: sustainability-statement
local-authority: OLD
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: Creates new floorspace.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates new dwellings, by conversion or subdivision.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-S2 (Carbon and Energy); PfE Policy JP-S3 (Heat and Energy Networks)
source-text: All Major and Minor development that creates new floorspace. All changes of use that create
  new dwellings, either by conversion or subdivision.
confidence: medium
notes: From the council's list (published October 2025), page 17. Called 'Sustainability, Carbon and Energy
  Statement'. The commentary points to the Greater Manchester net zero design guidance.
review-status: unverified
field-status: {}
