reference: town-centre-impact-assessment
local-authority: OLD
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: More than 2,500 sq m of gross floor space.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: Local Plan Policy 15 (Centres)
source-text: Where retail and leisure developments are outside town centres, and where more than 2,500m²
  of gross floor space is proposed, an Impact Assessment is required.
must-include:
- item: The impact of the proposal on existing, committed and planned public and private investment in
    a centre or centres in the catchment area
  level: should
- item: The impact of the proposal on town centre vitality and viability, including local consumer choice
    and trade in the town centre and the wider retail catchment
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 18-19. The sequential assessment for main
  town centre uses outside a centre has no id here; it is listed as unmapped.
review-status: unverified
field-status: {}
