reference: biodiversity-survey-report
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - condition:
        field: protected-species
        value: true
        description: The buildings could support protected species.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: Within or near (50m) an SSSI or SBI.
      - site:
          in:
          - flood-risk-zone
          description: Within 10m of Flood Zone 2 or 3.
      - condition:
          field: near-watercourse
          value: true
          description: Within 10m of a canal or green corridor.
