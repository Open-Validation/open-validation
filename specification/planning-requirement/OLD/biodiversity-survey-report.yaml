reference: biodiversity-survey-report
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building.
    - condition:
        field: potential-roost-features
        value: true
        description: The building has the potential to support protected species.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Inside or within 50 metres of a SSSI or Site of Biological Importance.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - any:
      - condition:
          field: near-watercourse
          value: true
          description: Inside or within 10 metres of a canal.
      - site:
          in:
          - green-corridor
          description: Inside or within 10 metres of a Green Corridor.
      - site:
          in:
          - flood-risk-zone
          description: Inside or within 10 metres of Flood Zones 2 and 3.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-G2 (Green Infrastructure Network); PfE Policy JP-G8 (A Net Enhancement of Biodiversity
  and Geodiversity); Local Plan Policy 21 (Protecting Natural Environmental Assets)
source-text: All Major Development. Development involving the demolition of a building which has the potential
  to support protected species. Minor development inside or within 50 metres of a Site of Special Scientific
  Interest or Site of Biological Importance. Minor development inside or within 10 metres of a Canal,
  a Green Corridor or Flood Zones 2 and 3.
confidence: medium
notes: From the council's list (published October 2025), page 7-8. Called 'Ecological Assessment'.
review-status: unverified
field-status: {}
