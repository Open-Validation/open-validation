reference: air-quality-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: The site is in an Air Quality Management Area.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: Residential development of more than 50 dwellings.
  - all:
    - ref: major-development
    - condition:
        field: floorspace
        operator: '>'
        value: 5000
        description: Major development of more than 5,000 square metres.
  - condition:
      field: biomass-or-chp
      value: true
      description: Combustion uses such as power stations, biomass or incineration.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 50
      description: More than 50 car parking spaces.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
confidence: medium
notes: 'From the audit (missing_requirement): an Air Quality Statement for these cases.'
review-status: unverified
field-status: {}
