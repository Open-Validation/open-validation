reference: air-quality-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: Within an Air Quality Management Area.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: Residential development of more than 50 dwellings.
  - all:
    - ref: major-development
    - condition:
        field: floorspace
        operator: '>'
        value: 5000
        description: More than 5,000 sq m of floorspace created.
  - condition:
      field: direct-air-emissions
      value: true
      description: Development involving combustion, such as power stations, biomass and incineration.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 50
      description: More than 50 car parking spaces.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-S5 (Clean Air); Local Plan Policy 9 (Local Environment)
source-text: All Major development within Air Quality Management Areas. Residential development of more
  than 50 dwellings. Major Development where more than 5,000 square metres of floorspace would be created.
  Development involving combustion, such as power stations, biomass and incineration. Any development
  proposing more than 50 car parking spaces.
confidence: medium
notes: From the council's list (published October 2025), page 2. Called 'Air Quality Statement'.
review-status: unverified
field-status: {}
