reference: land-contamination-assessment
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: new-build
        value: true
        description: New-build residential.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates dwellings.
  - condition:
      field: sensitive-end-use
      value: true
      description: New schools or hospitals, or changes of use to those uses or housing on previously
        industrial land.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
confidence: medium
notes: 'From the audit (missing_requirement): a Contaminated Land Survey (Phase I, and Phase II if needed)
  for major development, minor new-build residential, schools or hospitals, and changes of use to those
  uses on previously industrial land.'
review-status: unverified
field-status: {}
