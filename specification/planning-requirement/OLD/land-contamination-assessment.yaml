reference: land-contamination-assessment
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: new-build
        value: true
        description: New build.
    - condition:
        field: sensitive-end-use
        value: true
        description: Residential, schools or hospitals.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - condition:
        field: sensitive-end-use
        value: true
        description: To residential, schools or hospitals.
    - condition:
        field: industrial-site
        value: true
        description: The land has previously been used for industrial purposes.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-S1 (Sustainable Development); PfE Policy JP-S4 (Flood Risk and the Water Environment);
  PfE Policy JP-G3 (River Valleys and Waterways)
source-text: All Major Development. All Minor Development involving new build residential, schools or
  hospitals. Changes of use to residential, schools or hospitals where the land has previously been used
  for industrial purposes.
must-include:
- item: A Phase I Preliminary Risk Assessment
  level: must
- item: A Phase II intrusive site investigation where the Phase I appraisal identifies it as necessary
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 6. Called 'Contaminated Land Survey'.
review-status: unverified
field-status: {}
