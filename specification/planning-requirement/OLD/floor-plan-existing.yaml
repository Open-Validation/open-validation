source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: National Information Requirement
source-text: 'All applications for development must include the following: 1:1250 Site Location Plan Existing
  and Proposed Site Plan at a scale of 1:200 or 1:500 based on a site survey. This should show, as a minimum:
  a) The direction of North; b) The proposed development in relation to the site boundaries and other
  existing buildings on the site, with written dimensions including those to the boundaries; c) All the
  buildings, roads and footpaths on land adjoining the site including access arrangements; d) The species,
  position and crown spread of all onsite trees with a stem diameter greater than 75mm when measured at
  1.5m from the ground; e) The position of trees with an estimated stem diameter of 75mm or more than
  overhang the site or are located beyond the site boundaries within a distance up to 12 times their estimated
  stem diameter. f) The extent and type of any hard surfacing; g) Boundary treatment including walls or
  fencing where proposed. Existing and Proposed Elevations Existing and Proposed Roof Plan Existing and
  Proposed Floor Plans'
confidence: medium
notes: From the council's list (published October 2025), page 16. Listed under 'Plans and Drawings' as
  'Existing and Proposed Floor Plans'. Existing drawings apply only where there is an existing building.
