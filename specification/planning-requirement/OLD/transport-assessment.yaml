reference: transport-assessment
local-authority: OLD
required-if: discretionary
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-C8 (Transport Requirements of New Development)
source-text: All developments which generate significant amounts of transport movement.
must-include:
- item: Air quality impacts on Holcroft Moss, within the Manchester Mosses Special Area of Conservation
    (SAC)
  level: must
- item: 'Where traffic on the M62 past Holcroft Moss would rise by more than 100 vehicles or 20 HGVs per
    day: a scheme-specific range of measures to reduce reliance on cars, reduce trip generation and promote
    ultra-low emission vehicles, and a contribution towards restoration measures under the Holcroft Moss
    Habitat Mitigation Plan'
  level: must
- item: Starts with a vision of what the development is seeking to achieve, then tests a set of scenarios
    to find the optimum design and transport infrastructure
  level: should
confidence: medium
notes: 'From the council''s list (published October 2025), page 19-20. Shown as discretionary: ''significant
  amounts of transport movement'' has no threshold, and the commentary says a Transport Assessment or
  the lighter Transport Statement is needed ''where appropriate''. The commentary advises agreeing the
  scope with the highway authorities at pre-application stage.'
