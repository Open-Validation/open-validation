reference: flood-risk-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2, 3 and 3b.
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - site:
        in:
        - surface-water-flood-risk
        description: An area affected by surface water flooding issues.
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Would introduce a more vulnerable use, such as residential, compared to the existing
          use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site area of more than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site area of more than 1 hectare.
  - site:
      in:
      - future-flood-risk
      description: Flood Zone 1 where the strategic flood risk assessment (SFRA) shows it will be at increased
        risk of flooding during its lifetime.
  - site:
      in:
      - critical-drainage-area
      description: An area with critical drainage problems (guidance notes).
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-S4 (Flood Risk and the Water Environment); Local Plan Policy 19 (Water and Flooding)
source-text: All Major Developments and Minor Developments within Flood Zones 2, 3 and 3b. All Major Development
  and Minor Development in areas affected by surface water flooding issues, where this would introduce
  a more vulnerable use, such as residential, compared to the existing use. All development with a site
  area of more than 1 hectare. All developments in Flood Zone 1 where the LPA’s strategic flood risk assessment
  (SFRA) shows it will be at increased risk of flooding during its lifetime.
confidence: medium
notes: From the council's list (published October 2025), page 9-10, 32. The guidance notes (page 32) also
  list areas with critical drainage problems.
review-status: unverified
field-status: {}
