reference: flood-risk-assessment
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2, 3 or 3b.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
  - all:
    - site:
        in:
        - surface-water-flood-risk
        description: The site is in a surface water flood area.
    - condition:
        field: sensitive-end-use
        value: true
        description: A more vulnerable use is introduced.
  - discretionary
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
