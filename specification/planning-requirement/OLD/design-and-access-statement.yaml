reference: design-and-access-statement
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (a World Heritage Site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: National Information Requirement
source-text: 'All Major Development Applications for development in a designated area, where the proposed
  development consists of: - one or more dwellings; or - a building or buildings with a floor space of
  100 square metres or more. Applications for listed building consent. (For the purposes of Design and
  Access Statements, a designated area means a World Heritage Site or a conservation area).'
confidence: medium
notes: From the council's list (published October 2025), page 7, 30-31. The guidance notes repeat the
  national contents of a statement.
review-status: unverified
field-status: {}
