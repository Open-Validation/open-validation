reference: design-and-access-statement
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
source-text: All Major developments; ... designated area ... one or more dwellings ... or 100 sqm or more;
  Listed Building Consent applications
confidence: medium
notes: 'Audit (wrong_app_type): the workbook had this under Listed building consent only.'
review-status: unverified
field-status: {}
