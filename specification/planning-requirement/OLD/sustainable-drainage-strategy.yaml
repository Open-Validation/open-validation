reference: sustainable-drainage-strategy
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Development with surface water drainage in an area at risk of flooding, such as flood
        zones 2 or 3, or at risk of surface water flooding.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-S4 (Flood Risk and the Water Environment)
source-text: All Major developments Development with surface water drainage in an area at risk of flooding
  such as flood zones 2 or 3, or at risk of surface water flooding
must-include:
- item: All the information in section 6 of the site-specific flood risk assessment checklist and the
    national guidance on what sustainable drainage information to submit
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 18, 33. Called 'Sustainable Drainage System
  and Maintenance Strategy'. It can be a separate document or part of the flood risk assessment.
review-status: unverified
field-status: {}
