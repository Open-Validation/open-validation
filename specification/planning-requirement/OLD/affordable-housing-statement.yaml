reference: affordable-housing-statement
local-authority: OLD
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Proposes new residential development.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: Local Plan Policy 10 (Affordable Housing); PfE Policy JP-H2 (Affordability of New Housing)
source-text: All Major development proposing new residential development.
must-include:
- item: Where known, the type and tenure of the affordable housing to be provided
  level: should
- item: Where Vacant Building Credit is considered relevant, it is specifically addressed
  level: should
  required-if:
    condition:
      field: vacant-building
      value: true
      description: Vacant Building Credit is considered relevant.
confidence: medium
notes: From the council's list (published October 2025), page 2.
review-status: unverified
field-status: {}
