reference: fire-statement
local-authority: OLD
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
source-text: Fire Statement Buildings that are 18 metres … more in height, or 7 or more storeys and contain
  two or more dwellings … or educational accommodation.
confidence: medium
notes: The checklist marks this as a National Information Requirement.
review-status: unverified
field-status: {}
