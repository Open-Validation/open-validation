reference: fire-statement
local-authority: OLD
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: National Information Requirement; Town and Country Planning (Development Management Procedure
  and Section 62A Applications) (England) (Amendment) Order 2021
source-text: Buildings that are 18 metres of more in height, or 7 or more storeys and contain two or more
  dwellings or educational accommodation.
confidence: medium
notes: From the council's list (published October 2025), page 9, 31-32. The guidance notes repeat the
  national form contents.
review-status: unverified
field-status: {}
