source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
source-text: All Major development
must-include:
- item: The context and need for the proposed development
  level: should
- item: An assessment of how the development accords with relevant national, regional and local planning
