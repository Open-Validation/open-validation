reference: arboriculturist-report
local-authority: OLD
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on or off the site with a stem diameter over 75mm (at 1.5m) may be affected by
      the proposals.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
source-text: … on or offsite with a stem diameter greater than 75 mm when measured at 1.5 metres from
  the ground that may foreseeably be impacted by the proposals prior to or during the implementation of
  the proposals, or which may have foreseeable implications for the proposals post completion.
must-include:
- item: Arboricultural Impact Assessment
  level: must
- item: Tree Constraints Plan
  level: must
- item: Tree Protection Plan
  level: must
- item: Mitigation Planting Plan
  level: must
- item: Method Statements
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): the checklist applies this to all applications, including householder.
  The must-include items are the checklist item''s sub-headings.'
review-status: unverified
