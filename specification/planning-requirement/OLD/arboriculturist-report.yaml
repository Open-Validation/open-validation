reference: arboriculturist-report
local-authority: OLD
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on or off site with a stem diameter greater than 75 mm at 1.5 m from the ground
      that may be affected by the proposals, during or after the works.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-G7 (Trees and Woodland)
source-text: Where there are trees either onsite or offsite with a stem diameter greater than 75 mm when
  measured at 1.5 metres from the ground that may foreseeably be impacted by the proposals prior to or
  during the implementation of the proposals, or which may have foreseeable implications for the proposals
  post completion.
must-include:
- item: Arboricultural Impact Assessment
  level: must
- item: Tree Constraints Plan
  level: must
- item: Tree Protection Plan
  level: must
- item: Mitigation Planting Plan
  level: must
- item: Method Statements
  level: must
confidence: medium
notes: From the council's list (published October 2025), page 20-21. Called 'Tree Surveys'; the parts
  are those named in the item column. The commentary and guidance notes refer to BS 5837:2012.
review-status: unverified
field-status: {}
