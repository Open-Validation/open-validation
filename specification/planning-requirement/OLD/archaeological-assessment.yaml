reference: archaeological-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal involves excavation.
      - condition:
          field: new-build
          value: true
          description: The proposal involves new buildings.
  - all:
    - site:
        in:
        - listed-building
        description: The site is in the curtilage of a listed building.
    - any:
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal involves excavation.
      - condition:
          field: new-build
          value: true
          description: The proposal involves new buildings.
  - discretionary
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
confidence: medium
notes: 'From the audit (missing_requirement): also conversion or change of use of former textile mills,
  or substantial demolition, excavation or new build in their curtilage. Former textile mills have no
  field, so that case is shown as officer judgement.'
review-status: unverified
