reference: archaeological-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - condition:
        field: former-textile-mill
        value: true
        description: A building formerly used by the textile industry (typically a mill).
    - any:
      - condition:
          field: involves-change-of-use
          value: true
          description: Conversion or change of use of the building.
      - condition:
          field: demolition
          value: true
          description: Substantial demolition within its curtilage.
      - condition:
          field: ground-disturbance
          value: true
          description: Excavation within its curtilage.
      - condition:
          field: new-build
          value: true
          description: New buildings within its curtilage.
  - all:
    - site:
        in:
        - conservation-area
        - listed-building
        description: Within a Conservation Area or the curtilage of a Listed Building.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: Excavation.
      - condition:
          field: new-build
          value: true
          description: Construction of new buildings.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-P2 (Heritage); Local Plan Policy 24 (Historic Environment)
source-text: All development involving the conversion or change of use of a building formerly used by
  the textile industry (typically “mills”) or that would result in substantial demolition, excavation
  or the construction of new buildings within the curtilage of one of these buildings. All Development
  within a Conservation Area or within the curtilage of a Listed Building that would result in demolition,
  excavation or the construction of new buildings.
confidence: medium
notes: From the council's list (published October 2025), page 3. Called 'Archaeological Impact Assessment'.
review-status: unverified
field-status: {}
