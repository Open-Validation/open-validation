reference: section-proposed
local-authority: OLD
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: building-works
        value: true
        description: The erection of any new buildings or extensions of buildings (not house extensions
          at the rear of terraced houses).
  - condition:
      field: change-in-ground-levels
      value: true
      description: Other applications on uneven sites.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-P1 (Sustainable Places)
source-text: All Major Development and Minor Development that would result in the erection of any new
  buildings or extensions of buildings, or for other applications on uneven sites.
confidence: medium
notes: From the council's list (published October 2025), page 11. The list asks for 'Levels / Sections'
  (existing and proposed are not split). Its commentary says it covers majors, minors and house extensions,
  except house extensions at the rear of terraced houses, and that confirmation that changes in levels
  are not an issue can be given instead.
