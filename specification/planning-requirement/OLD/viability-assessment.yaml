reference: viability-assessment
local-authority: OLD
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The applicant argues that the development is not viable and so cannot meet policy requirements.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-D2 (Developer Contributions); Local Plan Policy 10 (Affordable Housing) and PfE
  Policy JP-H2; Local Plan Policy 23 (Open Spaces and Sports) and PfE Policy JP-P7; Local Plan Policy
  25 (Developer Contributions)
source-text: Where an applicant wishes to make a case that a development is not viable, and therefore
  cannot conform to planning policy requirements, they should provide clear evidence in viability appraisal.
must-include:
- item: Confirmation that the applicant is in principle (subject to a quote) willing to meet the costs
    of the Viability Assessment being tested by a third party
  level: should
- item: Follows the government's recommended approach in national Planning Practice Guidance; proportionate,
    simple and transparent
  level: should
- item: Prepared on the basis that it will be made publicly available
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 21, 35. The applicant pays for independent
  review by the council's appointed assessors.
review-status: unverified
field-status: {}
