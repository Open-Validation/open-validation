reference: site-plan
local-authority: OLD
required-if:
  always: true
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: National Information Requirement
source-text: 'All applications for development must include the following: 1:1250 Site Location Plan Existing
  and Proposed Site Plan at a scale of 1:200 or 1:500 based on a site survey. This should show, as a minimum:
  a) The direction of North; b) The proposed development in relation to the site boundaries and other
  existing buildings on the site, with written dimensions including those to the boundaries; c) All the
  buildings, roads and footpaths on land adjoining the site including access arrangements; d) The species,
  position and crown spread of all onsite trees with a stem diameter greater than 75mm when measured at
  1.5m from the ground; e) The position of trees with an estimated stem diameter of 75mm or more than
  overhang the site or are located beyond the site boundaries within a distance up to 12 times their estimated
  stem diameter. f) The extent and type of any hard surfacing; g) Boundary treatment including walls or
  fencing where proposed.'
must-include:
- item: Existing and proposed site plans at a scale of 1:200 or 1:500, based on a site survey
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All the buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: The species, position and crown spread of all onsite trees with a stem diameter greater than 75mm
    measured at 1.5m from the ground
  level: must
- item: The position of trees with an estimated stem diameter of 75mm or more that overhang the site or
    stand beyond the site boundaries within up to 12 times their estimated stem diameter
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: Boundary treatment, including walls or fencing where proposed
  level: must
confidence: medium
notes: From the council's list (published October 2025), page 15. The list says these items are 'as a
  minimum'.
