reference: bng-metric
local-authority: OLD
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the biodiversity gain condition (not exempt).
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-G8 (A Net Enhancement of Biodiversity and Geodiversity); Article 7 of the Town and
  Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All applications for planning permission, unless exempt from such requirements, must be
  accompanied by:'
must-include:
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat on the date of application (or proposed earlier date), including the publication date of the
    metric used
  level: must
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date;
    where an earlier date is used, that date and the reasons for it
  level: must
- item: A statement whether activities that result in loss of onsite biodiversity value ('degradation')
    have been carried out before that date and, where they have, the date immediately before, the value
    on that date, the completed metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: The statutory biodiversity metric with the post-development part completed
  level: must
confidence: medium
notes: 'From the council''s list (published October 2025), page 3-5, 26. Shown for applications subject
  to the biodiversity gain condition: the list says ''unless exempt'', and householder and other exempt
  applications are exempt by law. If an exemption is claimed a BNG Statement justifying it is required
  (listed as unmapped). The post-development metric comes from the guidance notes (page 26).'
review-status: unverified
field-status: {}
