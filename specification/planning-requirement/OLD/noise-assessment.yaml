reference: noise-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: noise-generating-use
        value: true
        description: Noise could cause nuisance, including Use Classes B2 (General Industrial) and B8
          (Storage and Distribution).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive uses (e.g. housing) next to major noise sources such as roads, railways,
        entertainment venues and industrial premises, or new homes close to existing or planned noise
        generating uses.
  - condition:
      field: entertainment-leisure-use
      value: true
      description: Evening economy uses including pubs, bars, hot food takeaways, casinos, cinemas, theatres
        and public performance venues.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 500
      description: New Class E(a) retail use with more than 500 sq m floorspace.
  - condition:
      field: use-class
      value: indoor-sport-recreation
      description: Class E(d) fitness, indoor sport and recreation uses.
  - condition:
      field: use-class
      value: creche-day-nursery
      description: Class E(f) day nursery, creche and day centre uses.
  - condition:
      field: use-class
      value: outdoor-sport-recreation
      description: Class F2(c) outdoor sport and recreation uses.
  - condition:
      field: noise-generating-use
      value: true
      description: Other sui generis uses such as taxi business, scrap yards, minerals, vehicle breaking,
        waste disposal, and any development generating significant levels of noise.
  - condition:
      field: new-school
      value: true
      description: New schools.
  - condition:
      field: use-class
      value: hospital
      description: New hospitals.
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: Local Plan Policy 9 (Local Environment); PfE Policy JP-P1 (Sustainable Places)
source-text: Major and Minor developments where noise could cause nuisance including development in Use
  Classes B2 (General Industrial) and B8 (Storage and Distribution). Development of noise sensitive uses
  (e.g. housing) adjacent to major sources of noise such as roads, railways, entertainment venues and
  industrial premises Evening economy uses including pubs, bars, hot food takeaways, casinos, cinemas,
  theatres and public performance venues. The creation of Class E(a) retail use with more than 500 square
  metres floorspace. Class E(d) fitness, indoor sport and recreation uses Class E(f) day nursery, creche
  and day centres uses Class F2(c) outdoor sport and recreation uses Other sui generis uses such as taxi
  business, scrap yards, minerals, vehicle breaking, waste disposal. All development generating significant
  levels of noise. New residential development in close proximity to existing or planned noise generating
  uses. New schools and hospitals
confidence: medium
notes: From the council's list (published October 2025), page 12-13. Called 'Noise Impact Assessment'.
  Instead, a robust justification and evidence can show that no sensitive uses nearby could be affected.
review-status: unverified
field-status: {}
