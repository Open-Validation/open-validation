reference: lighting-assessment
local-authority: OLD
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: communal-external-area
        operator: '>'
        value: 50
        description: External communal areas of more than 50 sq m.
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: parking-spaces
        operator: '>='
        value: 4
        description: Communal external car parking for four vehicles or more.
  - condition:
      field: use-class
      value: outdoor-sport-recreation
      description: Development for outdoor recreation and sport.
  - condition:
      field: floodlighting
      value: true
      description: Development proposing floodlights.
  - condition:
      field: near-watercourse
      value: true
      description: Within 10 metres of a Main River or body of open water.
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Within 10 metres of a SSSI or Site of Biological Importance (SBI).
source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
policy: PfE Policy JP-P1 (Sustainable Places); Local Plan Policy 9 (Local Environment)
source-text: Major and Minor development where external communal areas is proposed with an area of more
  than 50 square metres. Major and Minor development where communal external car parking provision is
  proposed for four vehicles or more. Development for outdoor recreation and sport. Development proposing
  floodlights Development within 10 metres of a Main River, body of open water, SSSI or SBI.
confidence: medium
notes: From the council's list (published October 2025), page 11-12. Called 'Lighting Impact Assessment'.
  The guidance notes point to the Institution of Lighting Professionals.
review-status: unverified
field-status: {}
