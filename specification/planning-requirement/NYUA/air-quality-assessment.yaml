source-text: Air Quality Assessment Where the development is proposed inside, or adjacent to an Air Quality
  Management Area (AQMA), or where the development could in itself result in the designation of an AQMA
  or where the grant of planning permission would conflict with, or render unworkable, elements of the
  Local Authority’s Air Quality Action Plan, applications should be supported by such information as is
  necessary to allow a full consideration of the impact of the proposal on the air quality of the area
