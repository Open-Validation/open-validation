source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: Where the development is proposed inside, or adjacent to an Air Quality Management Area (AQMA),
  or where the development could in itself result in the designation of an AQMA or where the grant of
  planning permission would conflict with, or render unworkable, elements of the Local Authority’s Air
  Quality Action Plan, applications should be supported by such information as is necessary to allow a
  full consideration of the impact of the proposal on the air quality of the area. Where AQMAs cover regeneration
  areas, developers should provide an Air Quality Assessment as part of the planning application. ...
  Where there is clear potential for a significant increase in airborne pollutants. (Within the areas
  for which the Council determines planning applications there are currently no Air Quality Management
  Areas).
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Scarborough: Scarborough area validation requirements (May
  2021). The other triggers (could cause an AQMA designation or conflict with an Air Quality Action Plan;
  ''clear potential'') are discretionary.'
