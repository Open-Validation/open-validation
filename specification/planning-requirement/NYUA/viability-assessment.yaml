reference: viability-assessment
local-authority: NYUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Housing where the affordable housing (or contribution) required under policy H2 is
          not offered for viability reasons.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - any:
      - all:
        - ref: major-development
        - condition:
            field: planning-obligations-shortfall
            value: true
            description: A major residential application seeking an exemption or reduced affordable housing
              or s106 contribution.
      - discretionary
source-url: https://www.northyorks.gov.uk/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-permission-and-apply-your-area/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-6-2
policy: Craven Local Plan policy H2 (Craven); Scarborough Local Plan policies INF5, HC3, HC10, TC5, TOU3
  (Scarborough)
source-text: Viability assessment will be required with all planning applications proposing housing where
  under policy H2 ... Major residential applications which seek exemption or a reduced contribution relating
  to affordable housing or s106 contributions. Applications involving the loss of certain uses, such as
  hotels or village shops – contact Planning Services to determine if applicable.
must-include:
- item: 'Craven: if non-disclosure is sought, an additional statement titled ''Financial Viability Appraisal
    - Exceptional Circumstances'''
  level: should
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: Craven: Craven area
  ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021). The joint
  checklist says a viability assessment is needed where an exception to affordable housing policy is justified
  on financial grounds (see the affordable housing statement). Scarborough''s ''loss of certain uses''
  case is discretionary.'
review-status: unverified
field-status: {}
