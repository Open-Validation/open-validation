validation-list:
  url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
  date: 2023-04-20
  date-basis: 'PDF metadata: the North Yorkshire Council-branded NYPA2 ''Full planning permission validation
    requirements'' was created 20 April 2023 (no date printed; its text is the North Yorkshire Planning
    Authorities'' joint checklist from the ''Validation requirements'' list dated March 2016, which the
    council''s minerals and waste page still calls the county planning authority''s adopted local list:
    https://www.northyorks.gov.uk/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-permission-and-apply-minerals-and-waste-or-council-planning).
    North Yorkshire Council has no single list: checked 2026-11-06, its ''apply in your area'' pages still
    send each former district to its own list: Harrogate and Craven to web pages, Scarborough to its May
    2021 list (https://www.northyorks.gov.uk/sites/default/files/2023-03/Validation%20guidance%20may%202021%20-%20na.pdf),
    Selby to the ''North Yorkshire Local List'' (adopted April 2011, checklist https://www.northyorks.gov.uk/sites/default/files/2023-03/111016_NYPA2_Application_for_Outline_or_Full_Planning_Permission_v3_Final%20-%20na.pdf),
    Ryedale to its May 2017 review (https://www.northyorks.gov.uk/sites/default/files/2023-03/validation_d%20-%20na.pdf);
    Hambleton''s page links only national requirements, and Richmondshire''s says ''There is no local
    validation checklist'' (its 2024 guidance treats the 2013 list as advisory). Minerals and waste: NYPA15
    (20 April 2023). No new council-wide list or consultation was found. Each file names the area lists
    it comes from and uses the former-district field.'
  status: outdated
submission-standards:
- item: All plans and drawings show dimensions in metres (county, Selby, Ryedale and minerals and waste
    checklists)
  level: must
- item: 'Paper submissions: one original with three copies (county and minerals and waste; Ryedale: two);
    Scarborough and Harrogate areas: one copy'
  level: must
- item: 'Minerals and waste: the NYPA15 checklist returned with the application, every box ticked or marked
    n/a, with a justification statement for any item considered not applicable'
  level: must
- item: 'Craven: PDF preferred; forms and plans not as JPEGs; each drawing and document uniquely named
    and numbered; scale and print size on each drawing (e.g. 1:50@A3); drawings no larger than A1 unless
    necessary; same scale and orientation for existing and proposed'
  level: must
- item: 'Craven: multiple or very large documents on CD/DVD with an index; information from file transfer
    sites not accepted'
  level: must
- item: 'Scarborough: a schedule of submitted documents with every application, updated when amendments
    are submitted'
  level: must
- item: 'Harrogate: personal information only where it is a planning consideration, in a covering letter
    or separate document'
  level: should
- item: Updated or superseded plans clearly labelled with revision and date (county list)
  level: should
audit:
  status: audited
