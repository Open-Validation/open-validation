  issues-open: 0
  notes: 'Grokbot captured the 2016 North Yorkshire Planning Authorities (county matters) list, dated
    it wrongly to 2023 and missed the per-former-district validation lists that North Yorkshire Council
    actually uses for most applications. The extracted items are largely boilerplate, and the Householder
    and other per-type checklists are wrongly shown as having no local requirements. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
