reference: section-existing
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: The proposal involves a change in ground levels, or the site slopes.
      - condition:
          field: new-build
          value: true
          description: The application involves new buildings.
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - any:
      - application-type:
          in:
          - lbc
      - condition:
          field: engineering-operations
          value: true
          description: Engineering operations.
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: new-build
          value: true
          description: The application involves the erection of buildings.
      - all:
        - site:
            in:
            - flood-risk-zone
            - surface-water-flood-risk
            - groundwater-flood-risk
            description: The building is in an area of flood risk from any source.
        - condition:
            field: building-works
            value: true
            description: The application involves a building, including a change of use.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - condition:
        field: change-in-ground-levels
        value: true
        description: The proposal changes site levels, or ground levels vary on site or relative to adjacent
          land.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where a proposal involves a change in ground levels, illustrative drawings should be submitted
  to show both existing and finished floor levels to include details of foundations and eaves. | | For
  applications involving new buildings, information to demonstrate how proposed buildings relate to existing
  site levels (with reference to a fixed datum point) and neighbouring development. ... All applications
  involving the erection of buildings. All applications involving a building within areas of flood risk
  from any source, including changes of use. ... Applications proposing changes in site levels or where
  there are existing variations in ground level on site or relative to adjacent land.
must-include:
- item: 'At a scale of 1:50 or 1:100 (Scarborough: 1:100 or 1:200)'
  level: must
- item: Existing and finished floor levels, related to a fixed datum point, including details of foundations
    and eaves
  level: must
- item: How proposed buildings relate to existing site levels and neighbouring development
  level: must
- item: 'Minerals and waste: representative sections of existing and final restoration levels, maximum
    depth of excavation, winter water table and quarry faces where applicable; borehole sections differentiating
    topsoil, subsoil, overburden and mineral'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Harrogate: existing and proposed site cross-section always required for engineering operations; sections
  at 1:50 for listed building consent.'
review-status: unverified
field-status: {}
