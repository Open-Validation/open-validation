reference: lighting-assessment
local-authority: NYUA
required-if:
  condition:
    field: external-lighting
    value: true
    description: Publicly accessible development near residential property, a listed building, a conservation
      area or open countryside, where external lighting would be provided or made necessary.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-07/Application%20validation%20requirements%20-%20accessible_1.pdf
source-text: Lighting Assessment Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a Listed Building or a Conservation Area, or open countryside,
  where external lighting would be provided or made necessary by the development, should be required to
  be accompanied by details of the proposed external lighting and the hours when the lighting would be
  switched on.
must-include:
- item: Details of the proposed external lighting
  level: must
- item: The hours when the lighting would be switched on
  level: must
confidence: low
