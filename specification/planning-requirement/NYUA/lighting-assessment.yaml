source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'If the application involves significant new lighting, in terms of floodlighting, or lighting
  to car parks or open land, then a lighting assessment prepared by a suitably qualified lighting engineer
  will be required ... A lighting assessment will be required for applications that propose development
  which includes artificial external lighting that: - materially could alter light levels outside the
  application site - include installation of floodlighting - could affect residential amenities - impact
  on visual amenities - potentially impact on highway/railway safety - impact on the natural environment
  including bats ... Proposals involving significant external lighting (e.g. outdoor sports facilities,
  car parks etc.) especially in the vicinity of residential property, sites ... designated as a heritage
  asset or of ecological value or in the open countryside,'
must-include:
- item: Details of the external lighting and hours of use, a layout plan with beam orientation and a schedule
    of equipment
  level: must
- item: 'County: floodlighting on the site plan (columns, luminaires, proximity to boundary, highway and
    homes) with an isolux diagram; elevations showing columns, luminaires and cowls'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - reg-3
    - condition:
        field: former-district
        value: selby
        description: Site in the former Selby district area.
    - condition:
        field: former-district
        value: ryedale
        description: Site in the former Ryedale district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
