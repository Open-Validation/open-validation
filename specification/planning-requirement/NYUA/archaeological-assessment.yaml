reference: archaeological-assessment
local-authority: NYUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - site:
        in:
        - archaeological-priority-area
        - scheduled-monument
        - historic-environment-record
        description: The development affects an archaeologically sensitive area (including a Scheduled
          Monument or non-designated sites of archaeological interest).
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - all:
      - site:
          in:
          - archaeological-priority-area
          - historic-environment-record
          description: The site includes or is likely to include archaeological remains.
      - discretionary
source-url: https://www.northyorks.gov.uk/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-permission-and-apply-your-area/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-6-2
source-text: The proposed development affects an archaeologically sensitive area (including a Scheduled
  Ancient Monument or non-designated sites of archaeological interest). ... Where an application site
  either includes or is likely to include archaeological remains which may be affected.
must-include:
- item: A desk-based assessment (field evaluation may be needed later)
  level: must
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: Craven: Craven area
  ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021). The joint
  checklist expects the archaeological desk-based assessment within the Heritage Statement.'
review-status: unverified
field-status: {}
