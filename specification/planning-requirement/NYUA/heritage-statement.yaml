notes: 'Audit (wrong_app_type): it applies to planning applications generally, not only listed building
  consent (''in appropriate circumstances''). Audit (wrong_document): this is the 2016 County Planning
  Authority list, now used for minerals, waste and the council''s own development; most applications are
  validated against the former district areas'' own lists, which are not captured yet.'
