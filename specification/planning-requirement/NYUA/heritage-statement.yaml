reference: heritage-statement
local-authority: NYUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - park-and-garden
      - scheduled-monument
      - world-heritage-site
      description: The application is likely to affect a designated heritage asset or its setting.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-07/Application%20validation%20requirements%20-%20accessible_1.pdf
source-text: Heritage Statement (including Historical, Archaeological Features and Scheduled Ancient Monuments)
  All applications which are likely to affect a designated heritage asset (i.e. a Listed Building, a Conservation
  Area, a Registered Historic Park and Garden, a Scheduled Monument, a Registered Battlefield, or a World
  Heritage Site) or which might impact upon the setting of one of these assets will, in appropriate circumstances,
  be required to submit a Heritage Statement.
