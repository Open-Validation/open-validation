source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'A Heritage Statement will need to accompany an application if it affects a Listed Building,
  Conservation Area, Historic Park or Garden, Registered Battlefield, World Heritage Site, Scheduled Monument
  or their setting. They may also be required where the development would have an impact upon archaeological
  remains. ... A Heritage Statement (also referred to as a ‘Statement of Significance and Impact’) is
  required in all cases ... A brief description of the historical development of the building, indicating
  as far as possible which parts are original and which are later additions. ... Required when: - applications
  for planning permission affecting a nationally or locally listed building, its curtilage, or its setting
  - applications for Listed Building Consent - planning applications affecting a conservation area or
  its setting - applications for demolition within a Conservation Area - planning application affecting
  nationally and locally designated parks and gardens - planning application affecting an ancient monument
  or its setting - planning application affecting undesignated heritage assets that are recorded on the
  Historic - Environment Record including: - known archaeological sites - known historic buildings ...
  Applications which are likely to affect a designated heritage asset (e.g. a Listed Building, a Conservation
  Area, a Registered Historic Park/Garden or a Scheduled Monument) or which might impact upon | A Heritage
  Statement should contain: - A description of those elements which contribute to the significance of
  any heritage assets likely to be affected by the proposals. - An assessment of the contribution which
  the setting makes to that significance. - An assessment of the likely impact which the proposals will
  have upon those elements 31 | | | the setting of one of these assets. ... On occasions, it may also
  be required in respect to a non-designated heritage asset as advised by the Planning Service.'
