source-text: Where a proposed development may cause loss of amenity to a nearby property though loss of
  daylight/sunlight to habitable windows or cause over-shadowing of adjacent land, then an assessment
  will be required. ... Where there is a potential adverse impact upon the current levels of sunlight/daylight
  enjoyed by adjoining properties or building(s). ... As advised by the Planning Service, where standard
  block, elevation, floor and roof plans or cross-sections are considered insufficient to assess such
  matters.
