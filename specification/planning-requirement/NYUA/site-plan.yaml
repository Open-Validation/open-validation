reference: site-plan
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - application-type:
        in:
        - full
        - outline
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - application-type:
        in:
        - hh
        - full
        - ldc-prospective-use
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - condition:
        field: site-layout-change
        value: true
        description: The application involves changes to a site layout.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Site/Block Plan at a scale of 1:100 or 1:200 to show: ... All applications involving changes
  to a site layout require a site layout or block plan showing both the existing site layout and the proposed
  layout. ... Virtually all applications. If no external works or layout changes are proposed then an
  | This should be drawn at a scale of 1:100 or 1:200. On larger sites a masterplan may be submitted at
  a scale of 1:500. All plans should accurately show: 18 | | Procedure) Order 2015 | existing block plan
  only may suffice.'
must-include:
- item: 'At a scale of 1:100 or 1:200 (Craven: 1:200 or 1:500; Scarborough: 1:100 or 1:200, or a 1:500
    masterplan on larger sites)'
  level: must
- item: The direction of North
  level: must
- item: Site boundaries, any building or structure on the other side of them, and the type and height
    of boundary treatment
  level: must
- item: Where relevant, details of surfacing and proposed materials for parking areas
  level: must
- item: 'Craven: proposed works shaded; all existing buildings and structures; all trees (position, spread,
    species); hard-surfaced areas; buildings to be demolished and trees to be felled; adjoining roads,
    footpaths and rights of way; adjacent buildings'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
- item: 'Scarborough: buildings or structures to be demolished, bin storage, and the layout of parking
    (including disabled and cycle parking) where appropriate'
  level: must
  required-if:
    condition:
      field: former-district
      value: scarborough
      description: Site in the former Scarborough district area.
- item: 'Harrogate listed building consent: existing (and, if the building or a curtilage structure is
    demolished or extended, proposed) site plan at 1:200 showing external surfaces and boundary treatments'
  level: must
  required-if:
    all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - application-type:
        in:
        - lbc
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Harrogate lists the site block plan as always required for householder, residential, commercial, agricultural
  and telecoms development and lawful development certificates for proposed development, and sometimes
  for advertisements (if the sign is not on an existing building) and non-material amendments.'
review-status: unverified
field-status: {}
