reference: elevation-existing
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - application-type:
        in:
        - full
        - outline
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - application-type:
        in:
        - hh
        - full
        - lbc
        - ldc-prospective-use
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings are proposed.
      - condition:
          field: footprint-increase
          value: true
          description: Extensions are proposed.
      - condition:
          field: external-alterations
          value: true
          description: Modifications to existing elevations are proposed.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings or structures (except most outline applications).
      - condition:
          field: external-alterations
          value: true
          description: An extension or alteration, unless an elevation is unaffected.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed elevations at a scale of 1:50 or 1:100 to show: ... Required for new
  buildings/extensions or modifications to existing elevations are proposed. ... All applications for
  new buildings/ structures (except most outline applications) or ... extension/alteration, unless an
  elevation is unaffected.'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: The works in relation to what is already there
  level: must
- item: All sides of the proposal, including blank elevations
  level: must
- item: The proposed building materials and the style, materials and finish of windows and doors
  level: must
- item: 'Craven: a title box with the drawing title, number, date, nature of the development, site address
    and scale'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
- item: 'Harrogate listed building consent: existing and proposed elevations at 1:50, annotated to show
    general construction, section lines and defective areas'
  level: must
  required-if:
    all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - application-type:
        in:
        - lbc
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Harrogate lists existing and proposed elevations as always required for householder, residential, commercial,
  agricultural and telecoms development, listed building consent and proposed lawful development certificates,
  and sometimes for advertisements (photo montages usually suffice) and non-material amendments.'
review-status: unverified
field-status: {}
