reference: arboriculturist-report
local-authority: NYUA
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: There are trees within the site, or on adjacent land, that could influence or be affected
      by the development (including street trees).
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-07/Application%20validation%20requirements%20-%20accessible_1.pdf
source-text: Tree Survey/Arboricultural Implications Where there are trees within the application site,
  or on land adjacent to it that could influence or be affected by the development (including street trees),
  information will be required on which trees are to be retained and on the means of protecting these
  trees during construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: The means of protecting retained trees during construction works
  level: must
