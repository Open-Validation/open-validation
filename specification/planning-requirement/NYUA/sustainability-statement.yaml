reference: sustainability-statement
local-authority: NYUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - any:
      - all:
        - condition:
            field: new-build
            value: true
            description: New build detached non-residential development (including outline with appearance/layout,
              and reserved matters).
        - condition:
            field: floorspace-non-residential
            operator: '>'
            value: 0
            description: Non-residential.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 500
          description: Non-residential conversion or extension of over 500 sq m.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New build dwelling(s).
  - condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
source-url: https://www.northyorks.gov.uk/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-permission-and-apply-your-area/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-3
source-text: Sustainable construction and design - new build detached non-residential development (including
  outline applications where appearance and layout are considered, and reserved matters applications),
  non-residential conversion or extension of over 500m2, new build dwelling(s) (including outline applications
  where appearance and/or layout is considered, and reserved matters applications. ... All planning applications
  with the exception of proposals that are themselves solely for the installation of energy efficiency
  measures or renewables.
must-include:
- item: 'Craven: a non-technical summary of climate change mitigation measures, how they compare with
    Building Regulations minimums, and why others are not included'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: Harrogate: Harrogate
  area validation criteria page; Craven: Craven area ''What to submit'' page. Craven: ''Sustainability
  design and construction statement (SDCS)'', not needed for proposals solely for energy efficiency measures
  or renewables.'
review-status: unverified
field-status: {}
