reference: recreation-facilities-assessment
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - condition:
        field: loss-of-open-space
        value: true
        description: Development on public or private open space or recreation areas.
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 11
          description: Developments of 11 dwellings or more.
      - condition:
          field: housing-floorspace
          operator: '>'
          value: 1000
          description: A combined gross floor area of more than 1,000 sq m.
      - all:
        - site:
            in:
            - designated-rural-area
            description: Designated rural areas.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 6
            description: Six or more dwellings.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - condition:
        field: loss-of-open-space
        value: true
        description: Development involving the loss of open space, sports and recreational facilities.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: For development on public or private open space or recreation areas, applications should
  be accompanied by plans showing existing or proposed open space within or adjoining the application
  site. ... Developments of 11 dwellings or more, or with a combined gross floor area of more than 1000
  sqm. In designated rural areas all new housing and mixed-use developments yielding six or more dwellings
  or over 1,000 meter square combined residential gross floorspace. ... For development involving the
  loss of open space, sports and recreational facilities this will need to be justified having regard
  to the policies in the 2 boxes to the left.
must-include:
- item: 'Craven: a completed Heads of Terms pro forma for the section 106 planning obligation'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); Craven: Craven area ''What
  to submit'' page; Scarborough: Scarborough area validation requirements (May 2021). ''Open Space Assessment''
  (joint checklist, Scarborough); ''Open space/recreational facilities assessment'' (Craven).'
review-status: unverified
field-status: {}
