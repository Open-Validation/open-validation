source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'Where a proposed development is likely to affect protected species, a designated site, priority
  habitat or geological feature, the application must be accompanied by a Biodiversity/Geological Survey
  and Report. ... All developments in or adjacent to: - European site (for instance, SAC/SPA/Ramsar) -
  Site of Special Scientific Interest (SSSI) - in or adjacent to National Nature Reserve (NNR) - Site
  of Nature Conservation Interest (SNCI) - Regionally Important Geological Sites (RIGS) - Local Nature
  Reserve (LNR) - wildlife corridors - priority habitats - development of greenfield sites - redevelopment
  of disused, redundant or buildings in disrepair in the main urban area - redevelopment of outbuildings
  within the countryside ... Most applications for ‘major development’  Any development directly or indirectly
  affecting a statutory or non-statutory protected site  Proposals with potential impact on protected
  species, priority habitats, or Ancient Woodlands  Demolition of older buildings (pre-1945)  Removal
  or alteration of certain roof spaces  Barn conversions  Natural habitat directly affected or nearby
  e.g. woodland, ponds, watercourses)  Removal of mature trees, scrub or hedgerows  Sites of geological
  interest'
must-include:
- item: 'Craven: existing biodiversity interests on and near the land, possible impacts, and avoidance,
    mitigation and/or compensation; in most cases a Preliminary Ecological Appraisal'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
- item: 'Scarborough: undertaken by a suitably qualified ecologist; surveys up to date'
  level: must
  required-if:
    condition:
      field: former-district
      value: scarborough
      description: Site in the former Scarborough district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Craven: Craven area ''What to submit'' page; Scarborough:
  Scarborough area validation requirements (May 2021). The joint checklist refers to its Biodiversity
  and Geological Assessments appendix for when protected species surveys are needed. Harrogate asks for
  its biodiversity pro forma in every case (see the unmapped list). Scarborough''s ''most applications
  for major development'' is discretionary.'
