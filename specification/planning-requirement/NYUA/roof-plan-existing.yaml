source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where appropriate, at a scale of 1:50 or 1:100 to show details such as the roofing material,
  roof shape, any vents and their location ... Where a proposal includes changes to the appearance and
  shape of a roof. ... All applications for new buildings or where the roof is to be altered.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Roof shape and roofing material, and vents and their location
  level: must
- item: 'Craven: the position of all ridges, valleys, dormer windows, roof lights and other features such
    as chimneys or raised parapets'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Craven: Craven area ''What to submit'' page; Scarborough:
  Scarborough area validation requirements (May 2021). The county, Selby, Ryedale and minerals and waste
  checklists ask for roof plans ''where appropriate'' (discretionary).'
