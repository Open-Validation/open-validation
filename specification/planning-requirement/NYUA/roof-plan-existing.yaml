      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - all:
      - condition:
          field: roof-alteration
          value: true
          description: The proposal changes or adds a roof.
      - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - romp
    - all:
      - condition:
          field: roof-alteration
          value: true
          description: The proposal changes or adds a roof.
      - discretionary
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - condition:
        field: roof-alteration
        value: true
        description: The proposal includes changes to the appearance and shape of a roof.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - any:
