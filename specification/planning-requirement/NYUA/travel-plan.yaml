source-text: Where developments are likely to generate significant additional traffic or journeys to work
  a Travel Plan will be required ... in some cases, a travel statement may be needed and a travel plan.
  ... The requirement for a Travel Plan is the same as the requirement for a Transport Assessment and
  Travel Plans are required to accompany all Transport Assessments. ... Applications accompanied by TA
  or TS (see above) and generating a significant amount of movement.
