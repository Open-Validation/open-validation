reference: water-impact-assessment
local-authority: NYUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: ryedale
        description: Site in the former Ryedale district area.
    - site:
        in:
        - source-protection-zone
        description: The site is on a groundwater Source Protection Zone.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - romp
    - discretionary
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - site:
        in:
        - source-protection-zone
        description: Development within groundwater Source Protection Zones (Local Plan Table 8.2).
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-03/validation_d%20-%20na.pdf
