source-text: This will only be required where it has been identified that the application site is on a
  Ground Source Protection Zone. ... For minerals and/or waste-related development proposals, applications
  will be expected to be accompanied by a full and comprehensive hydrological assessment and hydro-geological
  assessment ... Development within groundwater Source Protection Zones as specified in Table 8.2 in the
  Local Plan.
must-include:
- item: 'Scarborough: risk to groundwater and public water supply, taking account of proposed mitigation'
  level: must
  required-if:
    condition:
      field: former-district
      value: scarborough
      description: Site in the former Scarborough district area.
