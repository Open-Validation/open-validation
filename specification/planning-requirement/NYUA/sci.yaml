reference: sci
local-authority: NYUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - romp
    - any:
      - ref: major-development
      - condition:
          field: eia-development
          value: true
          description: Accompanied by an Environmental Statement.
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - any:
      - all:
        - ref: major-development
        - discretionary
      - all:
        - ref: major-development
        - condition:
            field: departure-from-development-plan
            value: true
            description: Major departure from the Development Plan.
      - condition:
          field: eia-development
          value: true
          description: EIA development.
      - discretionary
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - ref: major-development
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - all:
      - condition:
          field: pre-application-community-consultation
          value: true
          description: Larger scale applications where pre-application community consultation has taken
            place.
      - discretionary
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYC%20NYPA15%20Minerals%20and%20waste%20application%20validation%20requirements%20-%20accessible.pdf
source-text: In line with national advice and guidance, applications for major schemes and those accompanied
  by Environmental Statements, a Statement of Community Involvement will be required ... Planning statement
  - statement of community involvement - major developments within or adjoining residential areas, major
  departures from the Development Plan, EIA development, applications which require notification to the
  Secretary of State and other proposals that are likely to attract significant community interest. ...
  If you’re applying for a major development, you’ll need to submit a Community Involvement Statement.
  ... Larger scale applications where pre-application community consultation has taken place.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: minerals and waste:
  NYPA15 minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page;
  Craven: Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May
  2021). Harrogate''s item is ''Planning statement - statement of community involvement''; its ''significant
  community interest'' and Scarborough''s ''larger scale'' cases are discretionary.'
