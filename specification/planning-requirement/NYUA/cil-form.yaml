reference: cil-form
local-authority: NYUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - application-type:
        in:
        - hh
        - full
        - outline
        - change-of-use
  - all:
    - condition:
        field: former-district
        value: ryedale
        description: Site in the former Ryedale district area.
    - condition:
        field: cil-liable
        value: true
        description: Residential, supermarket or retail warehouse development liable for Ryedale CIL.
source-url: https://www.northyorks.gov.uk/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-permission-and-apply-your-area/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-3
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: Community infrastructure levy ... Certain types of development are liable for the Ryedale
  District Council Community Infrastructure Levy Charge. Where development is for residential development,
  for supermarket development, or for retail warehouses, in the first instance the 'Planning Application
  Additional Information Requirement Form' must be completed for full planning permission.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: Harrogate: Harrogate
  area validation criteria page; Ryedale: Ryedale area RDC2 checklist (May 2017). Harrogate lists CIL
  as always required for householder, residential, commercial, change of use and outline (all matters
  reserved) applications. The Selby area page also says all applications must complete the CIL form.'
review-status: unverified
field-status: {}
