policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'Where required to do so, under the requirements of the Town and Country Planning (Environmental
  Impact Assessment) (England and Wales) Regulations 1999 (as amended), applications will need to be accompanied
  by an Environmental Statement. ... Environmental impact assessment - major developments which are of
  more than local importance; Developments which are proposed for particularly environmentally sensitive
  or vulnerable locations: Developments with unusually complex and potentially hazardous environmental
  effects. ... Environmental impact assessment is needed for certain types of development. ... The ES
  is the full and detailed Assessment accompanying an application as established by the Screening & Scoping
  procedures.'
