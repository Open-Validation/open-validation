reference: floor-plan-proposed
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - application-type:
        in:
        - full
        - outline
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - application-type:
        in:
        - hh
        - full
        - lbc
        - ldc-prospective-use
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings are proposed.
      - condition:
          field: footprint-increase
          value: true
          description: Extensions are proposed.
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use of floorspace within an existing building.
      - all:
        - application-type:
            in:
            - lbc
        - condition:
            field: internal-works
            value: true
            description: Listed building consent is sought for internal works.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings (except most outline applications).
      - condition:
          field: footprint-increase
          value: true
          description: Extensions to buildings.
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed floor plans to a scale of 1:50 or 1:100 to show: ... These are required:
  - if new buildings/extensions are proposed - where a change of use of floorspace within an existing
  building is proposed - where listed building consent is sought for internal works ... All applications
  for new buildings (except most outline applications), for extensions to buildings or change of use.'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Existing walls or buildings to be demolished clearly shown
  level: must
- item: Details of the existing building(s) as well as the proposed development
  level: must
- item: New buildings in context with adjacent buildings
  level: must
- item: 'Craven: a title box with the drawing title, number, date, nature of the development, site address
    and scale; listed building consent internal works clearly identified'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Harrogate lists floor plans as always required for householder, residential, commercial and agricultural
  development, listed building consent and proposed lawful development certificates, and sometimes for
  change of use and non-material amendments.'
review-status: unverified
field-status: {}
