reference: waste-management-plan
local-authority: NYUA
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
  - any:
    - condition:
        field: engineering-operations
        value: true
        description: Excavations are proposed.
    - condition:
        field: demolition
        value: true
        description: Demolition/removal of existing buildings is proposed.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYC%20NYPA15%20Minerals%20and%20waste%20application%20validation%20requirements%20-%20accessible.pdf
source-text: Such a Plan will be required where excavations are proposed as part of or as a consequence
  of the development or where demolition/removal of existing permanent or temporary buildings is proposed.
confidence: medium
