reference: design-and-access-statement
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: Any part of the development is in a Conservation Area or World Heritage Site.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>'
              value: 100
              description: New building(s) with more than 100 sq m of floorspace.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - romp
    - discretionary
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In the Conservation Area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>'
              value: 100
              description: New buildings over 100 sq m.
      - site:
          in:
          - world-heritage-site
          description: World Heritage Site.
      - application-type:
          in:
          - lbc
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: In a designated area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings with a floor space of 100 sq m or more.
      - application-type:
          in:
          - lbc
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a Conservation Area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: 1+ dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Buildings with a floor area of 100 sq m or more.
      - application-type:
          in:
          - lbc
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for any proposal that is a “major” development or if the development involves either
  the provision of one or more dwellings or new building(s) with more than 100 sq. m. of floor space and
  any part of the development is within a designated area (for instance, Conservation Area or World Heritage
  Site). ... If required. For guidance refer to the National Planning Practice Guidance (PPG) (6 March
  2014) web-based resource ... Design and access statement - major development, one or more dwellings
  in the conservation area, new buildings in the conservation area over 100m2 or World Heritage Site.
  ... A design and access statement - other than for replacement consent. ... All applications for major
  development, Applications for development in a designated area, where the proposed development consists
  of: - one or more dwellings; or - a building or buildings with a floor space of 100 square metres or
  more - applications for listed building consent. ... Applications for ‘major development’ (see para
  3.3)  Applications for 1+ dwellings or buildings with a floor area of 100sqm+ in a Conservation Area.
   Listed building applications'
must-include:
- item: 'Craven: a crime impact statement incorporated where the local list requires one'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Not needed for change of use, engineering operations, section 73, non-material or minor material amendments
  (Scarborough) or waste development. The minerals and waste checklist says ''If required'' (discretionary).'
