reference: sustainable-drainage-strategy
local-authority: NYUA
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - all:
      - application-type:
          in:
          - full
      - discretionary
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more residential units.
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m gross floor space or more.
source-url: https://www.northyorks.gov.uk/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-permission-and-apply-your-area/planning-and-conservation/find-out-if-you-need-planning-permission-and-apply/find-out-if-you-need-planning-3
source-text: Drainage strategy ... This applies to all applications proposing 10 or more residential units
  or 1,000 square gross floor space or more.
must-include:
- item: 'Outline: indicative sustainable drainage principles, topographical survey and water flows, proposed
    surface water destination, infiltration results, watercourses and sewers, flood risk to and from the
    site, offsite works, maintenance principles'
  level: must
  required-if:
    all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - application-type:
        in:
        - outline
- item: 'Full: also compliance with Defra non-statutory technical standards, flow paths, storage volumes,
    sub-catchments, treatment train, design calculations and maintenance arrangements for the lifetime
    of the development'
  level: must
  required-if:
    all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - application-type:
        in:
        - full
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: Harrogate: Harrogate
  area validation criteria page; Craven: Craven area ''What to submit'' page. Harrogate lists a ''Drainage
  strategy'' as sometimes required for commercial and agricultural development, with no trigger (discretionary).'
review-status: unverified
field-status: {}
