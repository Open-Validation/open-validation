reference: location-plan
local-authority: NYUA
required-if:
  any:
  - any:
    - application-type:
        in:
        - reg-3
    - condition:
        field: former-district
        value: selby
        description: Site in the former Selby district area.
    - condition:
        field: former-district
        value: ryedale
        description: Site in the former Ryedale district area.
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
  - condition:
      field: former-district
      value: harrogate
      description: Site in the former Harrogate district area.
  - condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
  - condition:
      field: former-district
      value: scarborough
      description: Site in the former Scarborough district area.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Location Plan at a scale of 1:1250 or 1:2500 to show: ... Required for all applications.'
must-include:
- item: 'At a scale of 1:1250 or 1:2500 (minerals and waste: 1:1250, 1:2500 or 1:10,000), showing the
    direction of North'
  level: must
- item: Application site edged red, including all land needed to carry out the development (such as access
    to the public highway and landscape works); other land owned by the applicant edged blue
  level: must
- item: Wherever possible, at least two named roads and surrounding buildings
  level: must
- item: 'Minerals and waste: screening or soil storage bunds and landfill gas monitoring boreholes within
    the red line, and any gas monitoring boreholes outside the main site shown'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
- item: 'Craven: based on an up-to-date digital map'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Harrogate: always required except for advertisement consent (only if the sign is not on an existing
  building).'
review-status: unverified
field-status: {}
