reference: town-centre-impact-assessment
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - all:
      - application-type:
          in:
          - reg-3
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 2500
          description: More than 2,500 sq m of retail, leisure or office development outside a defined
            town centre.
  - all:
    - condition:
        field: former-district
        value: selby
        description: Site in the former Selby district area.
    - any:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 2500
          description: Retail and leisure over 2,500 sq m gross not in an existing centre.
      - discretionary
  - all:
    - condition:
        field: former-district
        value: ryedale
        description: Site in the former Ryedale district area.
    - any:
      - condition:
          field: comparison-retail-floorspace
          operator: '>'
          value: 500
          description: More than 500 sq m comparison retail.
      - condition:
          field: convenience-retail-floorspace
          operator: '>='
          value: 750
          description: 750 sq m convenience retail.
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m of total retail where mixed.
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2,500 sq m gross floor space.
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Retail and leisure outside a designated centre at or above the centre's threshold
            (Skipton 1,500 sq m; Settle 750; Bentham and Cross Hills 500; Ingleton 250).
      - all:
        - site:
            in:
            - shopping-frontage
            description: Primary Shopping Area of Skipton.
        - condition:
            field: involves-change-of-use
            value: true
            description: Change of use of retail units.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Town centre uses (notably retail, leisure and offices) outside a town centre.
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
policy: Scarborough Local Plan policies TC1 and TC2 (Scarborough); Ryedale Local Plan Strategy (Ryedale)
source-text: any application for more than 2,500 sq. m. of retail, leisure or office development outside
  of a defined town centre ... This would apply to all retail and leisure developments over 2,500 square
  metres gross floorspace not located within an existing centre and not in accordance with the current
  Development Plan. ... Any application for more than 500 sq. m. of comparison retail only schemes, 750
  sq. m of convenience only schemes, or where the scheme is a combination of convenience or comparison,
  the threshold is set at 1000 sq. m of the total retail gross floor space ... Retail impact assessment
  - all retail and leisure developments over 2500m2 gross floor space. ... developments involving retail,
  and leisure uses located outside of a designated centre ... Town centre uses, (notably retail, leisure
  and offices) located outside a town centre usually require the Sequential Test. An Impact Assessment
  is additionally required for such proposals exceeding 500sqm.
must-include:
- item: Impact on existing, committed and planned investment in centres in the catchment, and on town
    centre vitality and viability
  level: must
- item: 'Scarborough: a sequential test; an impact assessment as well over 500 sq m'
  level: must
  required-if:
    condition:
      field: former-district
      value: scarborough
      description: Site in the former Scarborough district area.
- item: 'Selby: evidence that there are no sequentially preferable sites'
  level: must
  required-if:
    condition:
      field: former-district
      value: selby
      description: Site in the former Selby district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); Selby: Selby area NYPA2 checklist
  (North Yorkshire Local List, April 2011); Ryedale: Ryedale area RDC2 checklist (May 2017); Harrogate:
  Harrogate area validation criteria page; Craven: Craven area ''What to submit'' page; Scarborough: Scarborough
  area validation requirements (May 2021). Selby also asks for it for smaller developments likely to significantly
  affect other centres (discretionary).'
review-status: unverified
field-status: {}
