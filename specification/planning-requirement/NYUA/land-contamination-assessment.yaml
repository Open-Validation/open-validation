reference: land-contamination-assessment
local-authority: NYUA
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected.
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposed use would be particularly vulnerable (housing with gardens, schools,
            nurseries, allotments).
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - romp
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected.
  - all:
    - condition:
        field: former-district
        value: harrogate
        description: Site in the former Harrogate district area.
    - any:
      - all:
        - application-type:
            in:
            - full
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Residential new build.
        - condition:
            field: new-build
            value: true
            description: New build.
      - condition:
          field: sensitive-end-use
          value: true
          description: Residential developments, allotments, play areas, playing fields, mixed use with
            vulnerable uses, nurseries, creches and schools.
  - all:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - any:
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposed end use is sensitive to contamination.
      - site:
          in:
          - contaminated-land
          description: Known or suspected of being affected by contaminating land use.
      - all:
        - condition:
            field: new-build
            value: true
            description: New buildings.
        - condition:
            field: industrial-site
            value: true
            description: The site is or has been used for purposes that may lead to ground contamination.
  - all:
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected (e.g. industrial, landfill sites).
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposed use would be particularly vulnerable.
      - discretionary
source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'Where contamination is known or suspected, or the proposed use would be particularly vulnerable
  (for example, housing with gardens, schools, nurseries or allotments), a contamination assessment should
  be provided. ... Contamination risk assessment - all residential developments (houses, flats, nursing
  homes etc.), allotments, children''s play areas, playing fields, mixed-use developments including vulnerable
  end uses, nurseries and creches and schools ... Required for all applications where: - the proposed
  end use is sensitive to contamination - the sites are known or suspected of being affected by current
  or previous contaminating land use - the proposed end use could cause contamination ... Where contamination
  is known or suspected (e.g. industrial, landfill sites etc.) and/or the proposed ... use would be particularly
  vulnerable (e.g. housing with gardens, schools, nurseries or allotments) or there are sensitive receptors,
  such as watercourses or aquifers, which might be affected.'
must-include:
- item: 'Craven: a Phase I survey as a minimum; Phase II where recommended'
  level: must
  required-if:
    condition:
      field: former-district
      value: craven
      description: Site in the former Craven district area.
- item: 'Scarborough: at least a desktop study and site reconnaissance report'
  level: must
  required-if:
    condition:
      field: former-district
      value: scarborough
      description: Site in the former Scarborough district area.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Harrogate lists a contamination risk assessment as always required for residential new build. Scarborough''s
  ''sensitive receptors'' case is discretionary.'
review-status: unverified
field-status: {}
