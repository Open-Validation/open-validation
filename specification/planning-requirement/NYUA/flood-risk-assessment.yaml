source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'Currently, this will require a Flood Risk Assessment for: • Any development of 1 hectare
  or more in Flood Zone 1 (to consider surface water drainage); and, • All proposals for development in
  Flood Zones 2 and 3 (including a change of use to a more vulnerable class of use) where required under
  Flood Risk Standing Advice as issued by the Environment Agency. ... Flood risk assessment - planning
  applications for development proposals of 1ha or greater in Flood Zone 1. All proposals for new development,
  that are located in Flood Zones 2 and 3, or other areas where the Environment Agency and Internal Drainage
  Boards have indicated there may be drainage problems. ... All development in Flood Zones 2 and 3. ...
  Proposals of 1 hectare or greater in Flood Zone 1 and all proposals for development located in Flood
  Zones 2 and 3 where required under Flood Risk as issued by the Environment Agency (see the gov.uk website
  for further information). A FRA will also be required for any major development in a designated Critical
  Drainage Area (CDA).'
must-include:
- item: The risks of all forms of flooding to and from the development and how they will be managed, taking
    climate change into account
  level: must
- item: The design of surface water management systems, including SuDS, and safe access in areas at risk
    of flooding
  level: must
  required-if:
    any:
    - condition:
        field: former-district
        value: craven
        description: Site in the former Craven district area.
    - condition:
        field: former-district
        value: scarborough
        description: Site in the former Scarborough district area.
- item: 'High risk flood zones: information about alternative sites to support a sequential test'
  level: must
  required-if:
    all:
    - any:
      - application-type:
          in:
          - reg-3
      - condition:
          field: former-district
          value: selby
          description: Site in the former Selby district area.
      - condition:
          field: former-district
          value: ryedale
          description: Site in the former Ryedale district area.
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
