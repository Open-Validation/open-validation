source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'Application proposals that raise issues of disturbance or are considered to be a noise sensitive
  development in what are considered to be noise sensitive areas should be supported by a Noise Impact
  Assessment prepared by a suitably qualified acoustician. ... Noise impact assessment - industrial or
  commercial uses near to residential property, New residential property near to transportation noise
  sources, New residential property near to existing industrial or commercial premises where industrial
  noise is the dominant source, New entertainment premises near to residential property and new residential
  property near to places of entertainment. ... Noise assessments will be required to be provided with
  planning applications proposing: - new development that may create additional noise in areas where noise-sensitive
  receptors (such as dwellings) already exist; and - new noise-sensitive development in areas that already
  experience significant noise levels ... Proposals that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and for proposals that are considered to be noise sensitive and which
  are close to existing sources of noise.'
