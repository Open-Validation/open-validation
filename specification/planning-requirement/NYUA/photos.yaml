source-text: Photographs are expected to support major or complex schemes or proposals in sensitive locations.
  ... These are essential and can be helpful to members of the public ... Photographs of all elevations
  of the building (to convey its general character) and detailed photographs (internal or external) of
  those parts where alterations or extensions are proposed. ... As agreed with the Planning Service to
  show how large developments can be satisfactorily integrated with their surroundings.
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Scarborough:
  Scarborough area validation requirements (May 2021). Harrogate: photographs of all elevations for listed
  building consent; photo montages showing an advertisement in its proposed location; ''Photos'' sometimes
  required for agricultural development. Elsewhere ''expected'' for major, complex or sensitive schemes,
  so discretionary.'
