source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'This will usually be required in connection with major or complex schemes ... However, a
  statement will be required for: - all major planning applications - applications that are not in accordance
  with the development plan - proposals that require detailed policy consideration ... Normally only required
  on complex full or outline applications, or if an exception to planning policy requires explanation.'
