source-url: https://www.northyorks.gov.uk/sites/default/files/2023-10/NYPA2%20Application%20for%20outline%20or%20full%20planning%20permission%20-%20accessible.pdf
source-text: 'A Transport Assessment (TA) or Transport Statement should be submitted as part of any planning
  application where the proposed development would generate significant amounts of movement ... A Transport
  Assessment (TA) should be submitted as part of the minerals and/or waste related planning application.
  ... Transport assessment and travel plan - where proposals are likely to have significant transport
  implications a transport assessment may be required ... In determining whether a Transport Assessment
  or Statement will be needed for a proposed development the local planning authority will take into account
  the following considerations: ... TA’s are required for proposals likely to generate the greatest vehicular
  movements, while TS’s are a simplified version relating to an intermediate scale of development.'
must-include:
- item: 'Minerals and waste: all existing and proposed vehicular movements to and from the development'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - romp
confidence: medium
notes: 'From the council''s lists (published 2011 to 2023; see _lpa.yaml), by area: county (Regulation
  3), Selby and Ryedale: county NYPA2 full planning checklist (April 2023); minerals and waste: NYPA15
  minerals and waste checklist (April 2023); Harrogate: Harrogate area validation criteria page; Craven:
  Craven area ''What to submit'' page; Scarborough: Scarborough area validation requirements (May 2021).
  Required for every minerals and waste application. Elsewhere discretionary: the joint checklist gives
  indicative thresholds for major schemes (food retail 0.2 ha or 1,000 sq m; non-food retail 0.8 ha or
  1,000 sq m; office 0.8 ha or 2,500 sq m; industry 2.0 ha or 6,000 sq m; residential 1.0 ha or 80 units;
  other 60+ vehicle movements in any hour) and Scarborough refers to its Transport Assessments SPD.'
