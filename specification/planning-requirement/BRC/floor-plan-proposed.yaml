reference: floor-plan-proposed
local-authority: BRC
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - s73
        - approval-condition
    - discretionary
source-url: https://www.bracknell-forest.gov.uk/sites/default/files/2021-09/developer-planning-validation-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor Plan to a recognised metric scale for each floor showing existing and proposed layout.
  (1:50 or 1:500)
must-include:
- item: A recognised metric scale for each floor (the checklist says 1:50 or 1:500; the householder page
    says 1:50 or 1:100)
  level: must
- item: Existing and proposed layout of each floor
  level: must
- item: The whole building, fully annotated with dimensions, room spaces identified and drawing titles
  level: should
- item: Existing and proposed development clearly distinguished, preferably in colour
  level: must
confidence: medium
notes: 'From the council''s list (published September 2021), page 1: the developer checklist; also the
  householder checklist (all householder works) and the miscellaneous checklist (telecoms: yes). The miscellaneous
  checklist says plans ''May be required'' for outline applications and ''As required by outline decision
  notice'' for reserved matters; proposed plans ''May be required'' for variation or removal of a condition
  and approval of a condition. These show as discretionary.'
review-status: unverified
field-status: {}
