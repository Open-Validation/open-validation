reference: site-plan
local-authority: BRC
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: footprint-change
          value: true
          description: A single or two storey extension (including a conservatory).
      - condition:
          field: new-vehicle-access
          value: true
          description: A vehicle crossover.
source-url: https://www.bracknell-forest.gov.uk/sites/default/files/2021-09/developer-planning-validation-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site/block plan - When extending or altering a building(s) your proposal should be shown
  on a block plan to a preferred scale of 1:500 to include the existing/proposed site boundaries and site
  access points i.e.existing/proposed driveways.
must-include:
- item: Preferred scale 1:500 (typically 1:200 or 1:500)
  level: should
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Existing and proposed site boundaries and site access points, such as existing/proposed driveways
  level: must
- item: 'Householder extensions and vehicle crossovers: the parking layout'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'From the council''s list (published September 2021), page 1: the developer checklist; the householder
  checklist asks for a ''Block Plan and Parking Lay out'' for single and two storey extensions and vehicle
  crossovers, not for loft conversions, roof alterations or general alterations; the miscellaneous checklist
  asks for it for outline applications only.'
review-status: unverified
field-status: {}
