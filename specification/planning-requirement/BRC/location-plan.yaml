reference: location-plan
local-authority: BRC
required-if:
  always: true
source-url: https://www.bracknell-forest.gov.uk/sites/default/files/2021-09/developer-planning-validation-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan - Plans should be at a scale of 1:1250 or 1:2500
must-include:
- item: Scale 1:1250 or 1:2500
  level: must
- item: Fits onto A4 or A3 paper wherever possible
  level: should
- item: The application site clearly outlined in red, including all land needed for the development (for
    example access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: must
- item: Any adjoining land in the applicant's ownership/control outlined in blue
  level: must
- item: Red and blue lines continuous, not broken
  level: must
- item: Two named roads and the access to the highway
  level: must
- item: Enough named roads and/or buildings on adjoining land to make the exact location clear
  level: should
confidence: medium
notes: 'From the council''s list (published September 2021), page 1: the developer checklist; also the
  householder checklist, the miscellaneous checklist (all types) and the ''Guidance on completing a planning
  application'' and ''What to submit'' pages.'
review-status: unverified
field-status: {}
