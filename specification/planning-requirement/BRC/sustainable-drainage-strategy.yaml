reference: sustainable-drainage-strategy
local-authority: BRC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.bracknell-forest.gov.uk/planning-and-building-control/planning/sustainable-drainage-systems/sustainable-drainage-systems-and-planning-applications
policy: National Planning Policy Framework; Bracknell Forest Local Plan policy LP24
source-text: major applications - a sustainable drainage strategy and flood risk assessment (if needed)
  minor applications - sufficient information as outlined in the Flood Risk Management and Sustainable
  Drainage Strategy Information
must-include:
- item: Topographical survey
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
- item: Identification of discharge destination
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
- item: Development information including location plan, site layout and drainage schematic
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
- item: Calculation assumptions and results, including impermeable areas, infiltration rates, network
    calculations and models
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
- item: Existing and proposed drainage arrangements
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
- item: Existing and proposed discharge rates
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
- item: Ground investigation reports/survey and soakage testing results (at outline, where infiltration
    is proposed without ground investigation, a back-up alternative strategy)
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
- item: Exceedance plan including proposed levels, conveyance routes, volumes and depths
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Catchment plans
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
- item: Water quality index
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Watercourse condition and connectivity
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Landscape plan
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Pre-application enquiry to the sewerage undertaker for discharge into the foul water sewer
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
confidence: medium
notes: 'From the council''s list (published January 2026), pages 3-4: the SuDS and planning applications
  page and its ''Flood Risk Management and Sustainable Drainage Strategy Information'', Table 1 (https://www.bracknell-forest.gov.uk/sites/default/files/2026-01/Flood-Risk-Management-and-Sustainable-Drainage-2026.pdf).
  The developer checklist (September 2021) lists ''SUDs – (Sustainable Drainage Strategy) – (Where appropriate...)''.
  Minor and non-major applications need information proportionate to the scale of development, shown as
  discretionary. The contents come from Table 1 for outline, full and reserved matters applications.'
review-status: unverified
field-status: {}
