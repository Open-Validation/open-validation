reference: flood-risk-assessment
local-authority: BRC
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: Within a Flood Risk Zone.
    - condition:
        field: footprint-change
        value: true
        description: A single or two storey extension (including a conservatory).
  - discretionary
source-url: https://www.bracknell-forest.gov.uk/sites/default/files/2026-01/Flood-Risk-Management-and-Sustainable-Drainage-2026.pdf
policy: National Planning Policy Framework; Planning Practice Guidance Flood risk and coastal change
source-text: A site-specific flood risk assessment is required to assess the flood risk to and from a
  development site and should accompany a planning application where prescribed in Environment Agency
  guidance.
must-include:
- item: Sequential test, for developments as specified in the NPPF and national flood risk standing advice
  level: must
  required-if: discretionary
  source-text: A sequential test is required for developments as specified in NPPF and National flood
    risk standing advice.
- item: Impacts such as loss of floodplain storage, deflection or constriction of flood flow routes or
    inadequate surface water management, and how mitigation addresses them
  level: should
- item: Pre and post development hydraulic modelling, depending on the scale of the development
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published January 2026), page 2: the ''Flood Risk Management and Sustainable
  Drainage Strategy Information''. The householder checklist (published August 2021) asks for one ''Only
  within a Flood Risk Zone'' for single and two storey extensions. Otherwise the council points to Environment
  Agency guidance and the miscellaneous checklist says ''May be required'', so it shows as discretionary.'
review-status: unverified
field-status: {}
