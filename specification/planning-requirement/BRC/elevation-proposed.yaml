reference: elevation-proposed
local-authority: BRC
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - s73
        - approval-condition
    - discretionary
source-url: https://www.bracknell-forest.gov.uk/sites/default/files/2021-09/developer-planning-validation-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevation Plan to a recognised metric scale showing all external elevations of the building(s)
  existing and proposed, clearly annotating the type and colour of materials to be used for walls, roofs
  and windows. (1:50 or 1:500)
must-include:
- item: A recognised metric scale (the checklist says 1:50 or 1:500; the householder page says 1:50 or
    1:100)
  level: must
- item: All external elevations of the building(s); full elevations, not part
  level: must
- item: Type and colour of materials for walls, roofs and windows clearly annotated
  level: must
- item: Existing and proposed development clearly distinguished, preferably in colour
  level: must
confidence: medium
notes: 'From the council''s list (published September 2021), page 1: the developer checklist; also the
  householder checklist (all householder works) and the miscellaneous checklist (telecoms: yes). The miscellaneous
  checklist says plans ''May be required'' for outline applications and ''As required by outline decision
  notice'' for reserved matters; proposed plans ''May be required'' for variation or removal of a condition
  and approval of a condition. These show as discretionary. For single storey householder extensions,
  existing and proposed elevations and floor plans may be on one drawing if clearly distinguished.'
