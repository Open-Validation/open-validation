  url: https://www.bracknell-forest.gov.uk/sites/default/files/2021-09/developer-planning-validation-checklist.pdf
  date: 2021-09-01
  date-basis: no date in the document; uploaded September 2021 (council URL folder 2021-09), PDF last
    modified 27 September 2019; linked from the council's 'What to submit' page as the current 'Planning
    application validation checklist for developers'
  status: outdated
submission-standards:
- item: No individual file greater than 5 MB (documents over 5 MB cannot be uploaded); no .zip or .exe
    files
  level: must
- item: Drawings in single layer PDF format; letters and reports in PDF format
  level: must
- item: Drawings in A3 where possible
  level: should
- item: No optional scales at different paper sizes
  level: must
- item: Scanned drawings at a minimum 200 dpi; all plans of sufficient quality to scan
  level: must
- item: A list of drawings with drawing number, description and paper size; a list of all submitted documents
  level: must
- item: Critical dimensions checked on the PDF and in scale; PDF orientation correct on screen
  level: must
- item: A scale bar and key dimensions on all drawings; 'do not scale' disclaimers removed
  level: must
- item: Plans clear, intelligible, drawn to a metric scale with the scale quoted
  level: must
- item: Photographs listed and annotated with title and context or purpose; each photo file below 1 MB,
    maximum 15x10 cm
  level: must
- item: File names include a brief description in plain English
  level: must
- item: 'Paper applications: the original plus two copies (2 sets of all associated documents)'
  level: must
