reference: cil-form
local-authority: BAB
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: New build development over 100 sq m (internal), including residential extensions and
        annexes.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, regardless of size.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Community Infrastructure Levy Regulations 2010
source-text: Please be aware that for all new build development over 100sqm (internal), including residential
  extensions and annexes, and all new dwellings regardless of size must pay Community Infrastructure Levy
  (CIL). Some exemptions may apply, but CIL forms will be required in all cases.
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 27; Part One (Householder),
  page 12-13. An 'Additional Note' in both parts. If you intend to phase the development, the council
  suggests a phasing plan so CIL can be split across phases.
review-status: unverified
field-status: {}
