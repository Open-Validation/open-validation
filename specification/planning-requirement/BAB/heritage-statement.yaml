reference: heritage-statement
local-authority: BAB
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - locally-listed-building
    - scheduled-monument
    - park-and-garden
    description: The proposal directly involves, or affects the setting of, a heritage asset.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: A Heritage Statement is required with all development proposals requiring planning permission
  or listed building consent, when the proposal directly involves, or affects the setting of a heritage
  asset.
must-include:
- item: Consideration of the relevant Historic Environment Record
  level: must
- item: A photographic record showing the site context and the spaces and features which might be affected,
    preferably cross-referenced to survey drawings
  level: must
confidence: medium
notes: The must-include items were filed under the photos row in the workbook.
review-status: unverified
field-status: {}
