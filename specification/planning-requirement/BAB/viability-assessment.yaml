reference: viability-assessment
local-authority: BAB
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The scheme does not include policy compliant accommodation on the basis of viability.
  - all:
    - any:
      - condition:
          field: rural-exception-housing
          value: true
          description: A community-led or rural exception site.
      - condition:
          field: affordable-housing-led
          value: true
          description: A community-led or rural exception site.
    - condition:
        field: market-housing-proposed
        value: true
        description: Market dwellings are proposed within the scheme.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Babergh and Mid Suffolk Joint Local Plan
source-text: If you do not propose to include policy compliant accommodation on the basis of scheme viability,
  please provide a complete viability appraisal to accord with the format of the Joint Local Plan. … Where
  any market dwellings are proposed within the scheme, the applicant should provide a viability assessment.
must-include:
- item: A complete viability appraisal in the format of the Joint Local Plan
  level: must
- item: An undertaking to cover the council's costs of assessing it independently
  level: must
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 22. Sections 28a
  and 28c. The rural workers' dwelling business plan and evidence of viability (section 29c) is listed
  as unmapped with the functional justification.
review-status: unverified
field-status: {}
