reference: site-plan
local-authority: BAB
required-if:
  condition:
    field: building-works
    value: true
    description: The proposal involves external works within the site, for example outbuildings.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block Plans are required for any external works within the site, for example outbuildings.
  Existing and proposed block plans can be on same plan if it is clear what is proposed and what is existing.
must-include:
- item: Scale at 1:200 or 1:500, including the relevant scale bar
  level: should
- item: Written dimensions
  level: should
- item: A north point
  level: should
- item: Details of the site surroundings, such as buildings, landscaping and roads
  level: should
- item: Any proposed works clearly annotated
  level: should
- item: Existing trees and hedgerows
  level: should
- item: Existing and proposed parking spaces
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: No red line on the block plan
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: 'For s.73 or s.73a applications: the plans or documents to be amended, with a schedule listing
    all plans and documents on the original decision notice and whether each is superseded or remains
    as approved'
  level: should
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 4; Part One (Householder),
  page 4. Part Two calls it 'Existing Site Plan/Proposed Block Plan'. The existing plan shows the site
  as it is now and the proposed plan shows the proposal in context.
review-status: unverified
field-status: {}
