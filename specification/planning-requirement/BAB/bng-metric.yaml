reference: bng-metric
local-authority: BAB
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the general biodiversity gain condition.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: 'Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015:'
must-include:
- item: A statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value of the on-site habitat on the date of application (or an
    earlier date), with the completed metric calculation tool showing the calculations, and the publication
    date and version of the metric
  level: must
- item: The proposed earlier date and the reasons for it
  level: must
  required-if: discretionary
- item: A statement on whether the value is lower because of degradation, with supporting evidence if
    it has taken place
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or an earlier
    date)
  level: must
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 14-15. The list
  says BNG applies to 'most Major and Minor Planning applications' and lists the exemptions (householder,
  listed building consent, adverts, permitted development and prior approvals, self-build, de minimis,
  some s73 and reserved matters). Shown with the biodiversity gain condition, as the law sets it. 'If
  this information has not been provided, the local planning authority will refuse to validate the application.'
review-status: unverified
field-status: {}
