reference: affordable-housing-statement
local-authority: BAB
required-if:
  condition:
    field: dwelling-count
    operator: '>'
    value: 1
    description: Housing of more than one unit.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: 'Each application for housing of more than one unit should include a schedule of accommodation,
  stating what the mix of and tenure of market and affordable housing will be. A plan showing affordable
  housing units, tenures and number of bedrooms is required together with a descriptive table in a similar
  format to that below:'
must-include:
- item: A schedule of accommodation stating the mix and tenure of market and affordable housing
  level: should
- item: A plan showing the affordable housing units, tenures and number of bedrooms
  level: must
- item: 'A descriptive table giving, for each plot: tenure, type, design/typology, size (bedspaces/occupants),
    gross internal area (m²), compliance with the Nationally Described Space Standard and accessibility
    standard (M4(1), M4(2) or M4(3))'
  level: must
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 21-22. Section 28a
  'Viability and Housing Mix Information'. If you apply for a Deed of Variation of an existing permission,
  include a draft Deed of Variation.
review-status: unverified
field-status: {}
