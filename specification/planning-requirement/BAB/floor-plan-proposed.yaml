reference: floor-plan-proposed
local-authority: BAB
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New development.
  - condition:
      field: building-works
      value: true
      description: Existing buildings altered by the proposed development.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: Floor Plans are required for new development, and for existing buildings if altered by the
  proposed development.
must-include:
- item: A scale of 1:50 or 1:100, with the relevant scale bar
  level: should
- item: At least two key dimensions
  level: should
- item: Clearly labelled as existing and/or proposed
  level: should
- item: The proposed floor area, including any window/door openings
  level: should
confidence: medium
review-status: unverified
field-status: {}
