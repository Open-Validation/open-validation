reference: flood-risk-assessment
local-authority: BAB
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      - groundwater-flood-risk
      description: Minor applications at risk of any form of flooding (river/sea, surface water, reservoir,
        groundwater, foul) within the red line boundary.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 and/or 3.
    - condition:
        field: floorspace
        operator: <=
        value: 250
        description: A minor extension with a floor space of no more than 250 sq m.
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: National Planning Policy Framework
source-text: A site-specific flood risk assessment (FRA) is required to be provided for all major planning
  applications and some minor planning applications that are at risk of any form of flood risk within
  the red line boundary of the proposed developments. … For any development that is a minor extension
  (household or non-domestic extension with a floor space of no more than 250sqm) within Flood Zone 2
  and/or 3
must-include:
- item: Assesses flood risk from river/sea, surface water, reservoir, groundwater and foul sources
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Any recorded historical flood instances
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: That the development is safe for its lifetime and where possible reduces flood risk overall
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Whether it will increase flood risk elsewhere
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The measures proposed to deal with these effects and risks, and design that reduces flood risk
    (sustainable drainage, flood resilience or flood compatible measures)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: How surface water flows will be reduced back to equivalent greenfield rates
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: 'For householder minor extensions: finished floor levels of the extension and estimated flood
    levels for the property, shown on a plan, in relation to Ordnance Datum'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'For householder minor extensions: how the development will not be flooded by surface water'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'For householder minor extensions: flood resistance and resilience measures (this may not always
    be required)'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 16-17; Part One
  (Householder), page 11-12. Part One calls it 'Details of Development Within Flood Zone 2/3'. 'This is
  a requirement under national planning policy.'
review-status: unverified
field-status: {}
