reference: landscaping-plan
local-authority: BAB
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Major residential development (10 or more dwellings).
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial development.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: new-build
        value: true
        description: Resulting in new building works.
    - condition:
        field: outside-urban-area
        value: true
        description: In the countryside outside the defined built-up boundaries of the Local Plan.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: In a designated National Landscape (formerly AONB).
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: 'This is required for: … All Full applications for major residential development (10 or more
  dwellings) … All Major commercial developments … All Full applications for Minor development resulting
  in new building works in the countryside outside the defined built-up boundaries of the Local Plan …
  ALL non-householder applications in designated National Landscapes (formerly AONBs)'
must-include:
- item: Details of all boundaries
  level: should
- item: Details of all hard surface treatment
  level: should
- item: Details of all soft landscaped areas, with exact details of planting or percentage mix of planting,
    identifying all species
  level: should
- item: A layout plan at a relevant scale showing these details, including the relevant scale bar(s)
  level: should
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 7. The scheme 'shall
  show all details of the existing and proposed hard and soft landscaping'.
review-status: unverified
field-status: {}
