reference: section-proposed
local-authority: BAB
required-if: discretionary
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Section Plans should show the elevation(s) not visible from that elevation when viewed
  from within the site. … It is also necessary when the proposed development relates to existing site
  levels and adjacent development (with levels related to a fixed datum point off site) … Section Plans
  are not always required, however if the development involves excavation (other than foundations – e.g.
  Swimming pools, basements, menages), this may be requested at the point of validation
must-include:
- item: Scale at 1:50 or 1:100, including the relevant scale bar
  level: should
- item: Written dimensions
  level: should
- item: Levels clearly outlined and defined, with the element of the build they relate to
  level: should
- item: 'Where relevant: existing site levels and adjacent development (levels related to a fixed datum
    point off site), existing and proposed foundations and eaves where a change is proposed, and how encroachment
    onto adjoining land is avoided'
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: 'From the council''s list (updated April 2024), Part Two (Major and Minor), page 6-7; Part One
  (Householder), page 6. Shown as discretionary: Part Two gives no clear trigger (''also necessary when
  the proposed development relates to existing site levels and adjacent development''), and Part One says
  sections for householder excavation (swimming pools, basements, ménages) ''may be requested''. Only
  proposed sections are listed.'
