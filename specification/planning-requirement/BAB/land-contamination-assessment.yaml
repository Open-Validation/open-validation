reference: land-contamination-assessment
local-authority: BAB
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on site.
  - site:
      in:
      - near-landfill-site
      description: The site is within 250 metres of a landfill site.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units, including replacement units.
    - condition:
        field: greenfield-site
        value: true
        description: Land that has served as garden/domestic curtilage, or land not previously developed.
  - discretionary
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-1-householder-v3-final-pdf
source-text: The Land Contamination Report and Questionnaire are only required in the following situations
  for householder development. o (1) Contamination is suspected on site. o (2) Contamination is known
  to exist on site o (3) The proposed site is within 250 metres of a landfill site
must-include:
- item: A Phase I Site Walkover and Risk Assessment in accordance with BS10175:2011+A2:2017 (or the equivalent
    current standard) by an appropriate person
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - discretionary
confidence: medium
notes: 'Part Two: a Land Contamination Report ''for 1-2 residential units including replacement residential
  units on Land that has served as garden/domestic curtilage, and/or not previously developed land in
  the NPPF and/or involves conversion of agricultural building/s''. Barn conversions (officer discretion
  here) also need the Phase I walkover.'
review-status: unverified
field-status: {}
