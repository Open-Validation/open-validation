reference: sustainability-statement
local-authority: BAB
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: All new residential development.
  - ref: major-development
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: All new residential development shall include a Sustainability Design and Construction Statement.
  … ALL MAJOR developments shall include a Sustainability Design and Construction Statement. … Non-residential
  development of 1,000sqm shall include Certification evidence of the levels for BREEAM.
must-include:
- item: 'For full applications: the predicted Energy Performance Certificate rating for each dwelling'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
- item: 'For outline applications: the EPC rating(s) expected to be achieved'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - outline
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
- item: Certification evidence of the BREEAM levels
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential development of 1,000 sq m.
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 20-21. Section 26
  'Sustainable construction'. The council encourages an 'A' EPC rating on all dwellings.
review-status: unverified
field-status: {}
