reference: biodiversity-survey-report
local-authority: BAB
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected species may be affected.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Any roof works (bat survey).
      - condition:
          field: demolition
          value: true
          description: Demolition (bat survey).
  - discretionary
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: Adequate ecological survey and impact assessment is necessary to provide certainty of likely
  impacts and that any mitigation and compensation necessary can be secured by either a condition of any
  consent or a mitigation licence.
must-include:
- item: Where an ecology report recommends further protected species surveys, the full results of those
    surveys and details of any mitigation measures
  level: must
  source-text: For any ecology reports recommending further protected species surveys, the full results
    of these surveys, and further details of any mitigation measures will be required prior to validation.
confidence: medium
notes: 'From the audit (missing_requirement): Part One item 16a asks for a bat survey for any roof works
  or demolition.'
review-status: unverified
field-status: {}
