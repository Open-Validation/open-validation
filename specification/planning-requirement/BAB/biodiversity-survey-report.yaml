reference: biodiversity-survey-report
local-authority: BAB
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The proposal triggers a requirement of the Suffolk Biodiversity Validation Requirements
        (Table 1 Development Criteria and Indicative Thresholds), or protected or Priority species are
        likely to be present and affected.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: Any works to a roof (for example re-roofing).
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: demolition
        value: true
        description: Any proposed demolition works (for example demolition of sheds or outbuildings).
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.babergh.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: A survey and impact assessment are required if the development proposal triggers any requirement
  as set out by Suffolk Biodiversity Validation requirements, including Table 1 Development Criteria and
  Indicative Thresholds. … Most householder developments will not require this report. However, it may
  be requested if any protected or priority species are likely to be present and affected. … A bat survey
  will be required for ANY works to a roof, and also for ANY proposed demolition works.
must-include:
- item: Carried out by a suitably qualified ecologist, complying with and informed by surveys that comply
    with the CIEEM guidelines
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Identifies designated sites, protected or Priority species and habitats on or next to the site,
    assesses likely impacts and identifies mitigation and compensation
  level: must
- item: Any further surveys the ecology report recommends, with their full results and mitigation details
  level: must
- item: Up to date (see CIEEM's advice note on the lifespan of ecological reports and surveys)
  level: must
confidence: medium
notes: 'From the council''s list (updated April 2024), Part Two (Major and Minor), page 13-14; Part One
  (Householder), page 9-10. Part One gives householder examples: re-roofing buildings, any development
  near a pond, demolition of sheds or outbuildings. The householder ''may be requested'' part is shown
  as discretionary.'
review-status: unverified
field-status: {}
