reference: town-centre-impact-assessment
local-authority: DUR
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Proposed outside of a defined centre.
    - any:
      - condition:
          field: convenience-retail-floorspace
          operator: '>'
          value: 1500
          description: More than 1,500 sqm (gross) convenience floorspace.
      - condition:
          field: comparison-retail-floorspace
          operator: '>'
          value: 1000
          description: 1,000 sqm (gross) comparison floorspace.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Proposed outside of a defined centre.
    - any:
      - condition:
          field: convenience-retail-floorspace
          operator: '>'
          value: 400
          description: More than 400 sqm (gross) convenience floorspace.
      - condition:
          field: comparison-retail-floorspace
          operator: '>'
          value: 400
          description: More than 400 sqm (gross) comparison floorspace.
    - discretionary
  - all:
    - site:
        in:
        - town-centre
        description: Within the defined District Centres.
    - any:
      - condition:
          field: convenience-retail-floorspace
          operator: '>'
          value: 1500
          description: More than 1,500 sqm (gross) convenience floorspace.
      - condition:
          field: comparison-retail-floorspace
          operator: '>'
          value: 1000
          description: 1,000 sqm (gross) comparison floorspace.
  - all:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Leisure development.
    - condition:
        field: floorspace
        operator: '>='
        value: 2500
        description: The national default threshold of 2,500 sqm.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policy 9
source-text: 'Impact Assessment: All ''Main Town Centre Uses'': Proposals for retail, more than 1,500
  sqm (gross) convenience floorspace or 1,000 sqm (gross) comparison floorspace, proposed outside of a
  defined centre that could impact on a Sub Regional, Large Town or District Centre*. Proposals for retail,
  more than 400 sqm (gross) convenience or comparison floorspace, proposed outside of a defined centre
  that could impact on Small Town or Local Centres. For leisure development, the national default threshold
  of 2,500 sqm is applicable for all centres. Proposals for retail, more than 1,500 sqm (gross) convenience
  floorspace or 1,000 sqm (gross) comparison floorspace within the defined District Centres* will be required
  to consider the impact on Durham City Centre and other centres potentially impacted. For leisure development,
  the national default threshold of 2,500 sqm is applicable.'
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    of the proposal
  level: must
- item: Impact on town centre vitality and viability, including local consumer choice and trade in the
    town centre and wider area, up to 5 years from submission (10 years for major schemes)
  level: must
- item: 'Within District Centres: the impact on Durham City Centre and other centres potentially impacted'
  level: must
  required-if:
    site:
      in:
      - town-centre
      description: Within the defined District Centres.
confidence: medium
notes: From the council's list (published 2026), item 32 (Sequential Test and Impact Assessment for Town
  Centre Uses). The 400 sqm threshold applies to out-of-centre proposals that could impact on Small Town
  or Local Centres, which is a judgement, so discretionary; the higher thresholds apply where a Sub Regional,
  Large Town or District Centre could be impacted. For mixed comparison and convenience schemes the 1,500
  sqm threshold applies. The sequential test is in the unmapped list.
