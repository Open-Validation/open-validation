source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 3, 5, 21
source-text: E Food Retail (Supermarket) >800 sqm E Non-Food Retail >1500 sqm E Financial and Professional
  Services >2500 sqm E Restaurants and Cafes >2500 sqm Sui Generis Drinking Establishment >600 sqm Sui
  Generis Hot Food Takeaway >500 sqm E Office/R and D/Light Industry>2500 sqm B2 Industrial >4000 sqm
  B8 Storage or Distribution >5000 sqm C1 Hotels >100 beds C2 Residential Institution (Hospitals/nursing
  homes) >50 bed C2 Residential Institutions (Education) >150 students C2 Secure Residential Institutions
  >400 residents C3 Dwellings >80 units (at Travel Planners discretion, see guidance) E Clinics, Health
  Centres, Day Care, Creches > 1000 sqm F1 Education and Training, Libraries, Public Halls, Places of
  Worship > 1000sqm E Indoor recreation and Gyms > 1500 sqm F2 Community Halls/Meeting Place >1500 sqm
  F2 Swimming Baths/Skating Rinks > 1500 sqm
must-include:
- item: How the transport implications of the development will be managed to minimise environmental, social
    and economic impacts
  level: must
- item: Measures to improve access by public transport, walking and cycling, to address parking need and
    to mitigate transport impact
  level: must
confidence: medium
notes: From the council's list (published 2026), item 40 (Travel Plan). For C3 dwellings over 80 units
  a travel plan is 'at Travel Planners discretion', so discretionary. There are four types of travel plan
  (Outline, Framework, Full and STARS) for different stages.
