reference: flood-risk-assessment
local-authority: DUR
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: All development on sites of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: All development on sites of 1 hectare or more.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: operational-development
          value: true
          description: Operational development of less than 1 hectare.
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: Change of use resulting in 'highly vulnerable' or 'more vulnerable' development.
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use from water compatible to less vulnerable development (Flood Zone
            3).
  - condition:
      field: watercourse-culverting
      value: true
      description: Development that includes culverting or control of any river or stream.
  - condition:
      field: near-watercourse
      value: true
      description: Development within 20 metres of the top of a bank of a main river.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 8, 29, 35, 36; Minerals and Waste Policies and Allocations Development
  Plan Document (M&WDPD) Policy MW1
source-text: 'Flood Risk Assessment required for: all development on sites of 1 hectare or more operational
  development of less than 1 hectare in Flood Zone 2 and 3 change of use resulting in ''highly vulnerable''
  or ''more vulnerable'' development in Flood Zone 2 and 3 change of use from water compatible to less
  vulnerable development in Flood Zone 3 non-residential extensions with a footprint of less than 250
  sqm where the development includes culverting or control of any river or stream or any development within
  20 metres of the top of a bank of a main river.'
must-include:
- item: All forms of flooding to and from the development, and how the risks will be managed, taking climate
    change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding, and safe access to and from
    the development in areas at risk
  level: must
- item: SuDS details, where the drainage thresholds apply
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential developments of 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A residential site of 0.5 hectares or greater.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: Non-residential developments of 1,000 sqm or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A non-residential site of 1 hectare or more.
- item: Sequential test (done before the FRA) and, if needed, the exception test
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
- item: How foul water will be disposed of
  level: must
confidence: medium
notes: From the council's list (published 2026), item 35 (Surface and Foul Water Management including
  Flood Risk Assessment (FRA)). The culverting and 20 m from a main river triggers are listed for non-residential
  extensions with a footprint under 250 sqm.
review-status: unverified
field-status: {}
