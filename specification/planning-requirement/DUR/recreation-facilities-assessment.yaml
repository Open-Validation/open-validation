reference: recreation-facilities-assessment
local-authority: DUR
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space (for example public open space, amenity open space and playing fields).
  - condition:
      field: new-open-space
      value: true
      description: Creation of open space.
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major housing proposal.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 4, 26, 29
source-text: Applications relating to the creation of or loss of open space (for example public open space,
  amenity open space and playing fields). All major housing proposals.
must-include:
- item: Detailed breakdown of how the typologies and quantum of open space in the Open Space Needs Assessment
    (OSNA) would be provided
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major housing proposal.
- item: Evidence that the open space is surplus to requirements, or that the needs/benefits of the development
    clearly outweigh the loss, with mitigation and/or compensation proposals
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves loss of open space.
confidence: medium
notes: From the council's list (published 2026), item 30 (Open Space, Sport, Play and Leisure Assessment).
review-status: unverified
field-status: {}
