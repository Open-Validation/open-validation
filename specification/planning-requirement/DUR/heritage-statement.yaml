reference: heritage-statement
local-authority: DUR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - scheduled-monument
      - park-and-garden
      description: In or immediately adjacent a scheduled Ancient Monument or a site on the Register of
        Parks and Gardens.
  - all:
    - site:
        in:
        - conservation-area
        description: Within or adjoining a Conservation Area.
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a change of use.
  - site:
      in:
      - archaeological-priority-area
      description: Affecting any known or suspected archaeological sites.
  - discretionary
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 44, 45, 46; Minerals and Waste Policies and Allocations Development
  Plan Document (M&WDPD) Policy MW1
source-text: All applications for Listed Building Consent. Applications in or immediately adjacent a scheduled
  Ancient Monument or a site on the Register of Parks and Gardens All development within or adjoining
  a Conservation Area (except changes of use) All applications affecting any known or suspected archaeological
  sites. Applications whose scale or nature could impact on heritage assets (designated and non-designated)
must-include:
- item: Detail proportionate to the importance of the asset and enough to understand the potential impact
    on its significance
  level: must
- item: 'Statement of Significance: the significance of the affected assets and the contribution of their
    setting to it'
  level: must
- item: Archaeological Assessment, for applications in or next to areas of archaeological interest that
    could affect them
  level: must
  required-if:
    any:
    - site:
        in:
        - archaeological-priority-area
        description: In an area of archaeological interest.
    - discretionary
- item: Schedule of Works affecting the asset, its site and setting
  level: must
- item: Assessment of the impact on the special interest and character of the asset, its site and setting,
    and of any adjacent heritage assets
  level: must
- item: Justification for the proposals, in terms of the principles applied, and any mitigation measures
  level: must
- item: The sources considered and the expertise consulted
  level: must
confidence: medium
notes: From the council's list (published 2026), item 18 (Heritage Statement). 'Applications whose scale
  or nature could impact on heritage assets' is shown as discretionary.
review-status: unverified
field-status: {}
