reference: heritage-statement
local-authority: DUR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - world-heritage-site
      description: The proposal affects a heritage asset, including householder works in or next to a
        conservation area.
source-url: https://www.durham.gov.uk/media/3760/Planning-Application-Validation-Checklist/pdf/PlanningApplicationValidationChecklist.pdf
must-include:
- item: A Statement of Significance, including a description of the significance of the affected assets
    and the contribution of their setting to that significance
  level: must
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the excerpt was content text. Item 18 expressly requires
  it for listed building consent, and for householder works in or next to a conservation area. The designations
  shown for other cases are the usual heritage assets.'
review-status: unverified
field-status: {}
