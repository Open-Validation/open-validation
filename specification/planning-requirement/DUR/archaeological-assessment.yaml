source-text: Archaeological Assessment - will be required for applications in areas of archaeological
  interest or ones that may be adjacent to and could affect them. In some cases, a Written Scheme of Investigation
  or investigative works prior to submission may be required. Applicants are advised to discuss this requirement
  at an early stage of developing the scheme.
