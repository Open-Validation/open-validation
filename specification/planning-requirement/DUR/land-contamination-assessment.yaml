reference: land-contamination-assessment
local-authority: DUR
required-if:
  any:
  - all:
    - condition:
        field: previously-developed-land
        value: true
        description: Development on brownfield land.
    - site:
        in:
        - contaminated-land
        description: Contamination could be an issue due to the previous use of the site (or adjacent
          land).
  - site:
      in:
      - near-landfill-site
      description: New development within 250 metres of current or former landfill sites.
  - condition:
      field: sensitive-end-use
      value: true
      description: The end use would be particularly sensitive (for example residential development, schools,
        day nurseries, care homes or hospitals).
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policy 32; Minerals and Waste Policies and Allocations Development Plan
  Document (M&WDPD) Policy MW1
source-text: All development on brownfield land where contamination could be an issue due to the previous
  use of the site (or adjacent land). New development within 250 metres of current or former landfill
  sites. Where the end use would be particularly sensitive (for example residential development, schools,
  day nurseries, care homes or hospitals).
must-include:
- item: Carried out by a suitably qualified competent person
  level: must
- item: As a minimum, a Phase 1 Preliminary Risk Assessment (desk top study) identifying all past uses
    of the site
  level: must
- item: Risk assessment of adjacent and nearby sites, as contaminants can migrate
  level: must
- item: Whether a Phase 2 Contamination Assessment is required
  level: must
confidence: medium
notes: From the council's list (published 2026), item 22 (Land Contamination Assessment). A Phase 2 assessment
  may be needed where contamination is known or likely.
review-status: unverified
field-status: {}
