reference: arboriculturist-report
local-authority: DUR
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Mature or semi-mature trees within the site or on land adjacent that could influence
        or be affected by the development (including street trees).
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows within the site or on land adjacent that could influence or be affected by
        the development.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 29, 40; Minerals and Waste Policies and Allocations Development
  Plan Document (M&WDPD) Policy MW1; Trees, Woodlands and Hedges Supplementary Planning Document (2024)
source-text: All development where there are mature or semi-mature trees/hedgerows within the site or
  on land adjacent that could influence or be affected by the development (including street trees).
must-include:
- item: Which trees/hedgerows are to be retained, and how they will be protected during construction
  level: must
- item: Accurate survey of the location and size of the trees/hedgerows, with classification and root
    protection areas
  level: must
- item: Likely impact of the development
  level: must
- item: Survey, protection plan and method statement following BS 5837:2012
  level: should
confidence: medium
notes: From the council's list (published 2026), item 41 (Tree and Hedgerow Assessment).
review-status: unverified
field-status: {}
