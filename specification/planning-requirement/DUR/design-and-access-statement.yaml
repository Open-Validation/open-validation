reference: design-and-access-statement
local-authority: DUR
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: In a World Heritage Site or Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provision of 1 or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Building/extension over 100 sqm.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: Town and Country Planning (Development Management Procedure) Order 2015; Parking and Accessibility
  Supplementary Planning Document
source-text: 'provision of 10 or more dwellings or site area exceeds 0.5 ha erection of buildings/extensions
  over 1000 sqm where site area is 1 ha or greater (excluding minerals and waste development) applications
  for listed building consent In World Heritage Site or Conservation Area: provision of 1 or more dwellings
  building/extension over 100 sqm'
must-include:
- item: How the development complies with the council's Parking and Accessibility Supplementary Planning
    Document
  level: must
- item: Proportionate to the scale and sensitivity of the proposals
  level: should
confidence: medium
notes: From the council's list (published 2026), item 5 (Design and Access Statement). The list's major
  thresholds (10 or more dwellings or a site over 0.5 ha; buildings or extensions over 1,000 sqm; a site
  of 1 ha or more, excluding minerals and waste development) are the major development definition, so
  shown as major development.
review-status: unverified
field-status: {}
