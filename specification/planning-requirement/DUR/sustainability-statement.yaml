reference: sustainability-statement
local-authority: DUR
required-if:
  ref: major-development
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policy 29; Minerals and Waste Policies and Allocations Development Plan
  Document (M&WDPD) Policy MW1
source-text: All new major development (excluding equestrian and agricultural developments)
must-include:
- item: 'Residential: how the development will conserve energy and resources during construction and its
    lifetime, using low carbon energy generation where appropriate'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: 'Non-residential: how the development will achieve a minimum BREEAM rating of ''very good'', with
    any pre-assessment'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential development.
- item: Supported by the council's Sustainability Checklist
  level: should
confidence: medium
notes: From the council's list (published 2026), item 36 (Sustainability Statement). Equestrian and agricultural
  developments are excluded.
review-status: unverified
field-status: {}
