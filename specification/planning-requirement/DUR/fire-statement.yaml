reference: fire-statement
local-authority: DUR
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.durham.gov.uk/media/3760/Planning-Application-Validation-Checklist/pdf/PlanningApplicationValidationChecklist.pdf
source-text: Fire statements must be submitted on the standard form – Town and Country Gov.uk – Fire statement
  form.pdf Planning (Development Management Procedure) Order 2015 Relevant buildings are those which contain
  two or more dwellings or educational accommodation and meet the height condition (18m or more in height,
  or 7 or more storeys whichever is reached first).
