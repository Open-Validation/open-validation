reference: fire-statement
local-authority: DUR
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: Town and Country Planning (Development Management Procedure) Order 2015
source-text: Provision of one or more relevant buildings, or development of an existing relevant building
  or development within the curtilage of a relevant building. Relevant buildings are those which contain
  two or more dwellings or educational accommodation and meet the height condition (18 m or more in height,
  or 7 or more storeys whichever is reached first).
confidence: medium
notes: 'From the council''s list (published 2026), item 6 (Planning Gateway One Fire Statement). Development
  of an existing relevant building or in its curtilage also needs one. Exempt: outline applications, section
  73 applications, and changes of use that stop a building being a relevant building or that don''t create
  one.'
review-status: unverified
field-status: {}
