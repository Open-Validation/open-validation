reference: sustainable-drainage-strategy
local-authority: DUR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential developments of 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A residential site of 0.5 hectares or greater.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential developments of 1,000 sqm or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A non-residential site of 1 hectare or more.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 8, 29, 35, 36; Minerals and Waste Policies and Allocations Development
  Plan Document (M&WDPD) Policy MW1
source-text: 'Surface and foul water drainage details including Sustainable Urban Drainage (SUDs) details
  will be required for: residential developments of 10 or more dwellings or a site of 0.5 hectares or
  greater non-residential developments of 1,000 sqm or more a site of 1 hectare or more'
must-include:
- item: 'Outline applications: Outline Drainage Strategy Statement; preliminary layout of SuDS across
    the site; outline hydraulic calculations (outfall location, final discharge rate, approximate on-site
    storage); ground investigation report (infiltration testing); topographical survey'
  level: must
  required-if:
    application-type:
      in:
      - outline
      - outline-all
      - outline-some
- item: 'Full applications: Surface Water Drainage Strategy Statement; ground investigation report (infiltration
    testing); detailed layout of SuDS and other drainage; topographical survey (existing and proposed
    levels); full hydraulic model (computer model on request); evidence of third-party agreement for final
    discharge; maintenance schedule and responsibilities'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: How foul water will be disposed of
  level: must
- item: The Environment Agency's SuDS strategy template, completed
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 2026), item 35 (Surface and Foul Water Management including
  Flood Risk Assessment (FRA)). Uses MHCLG's retired sustainable-drainage-strategy id.
review-status: unverified
field-status: {}
