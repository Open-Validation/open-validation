reference: construction-management-plan
local-authority: DUR
required-if:
  all:
  - ref: major-development
  - application-type:
      in:
      - full
      - reserved-matters
  - condition:
      field: distance-to-noise-sensitive-use
      operator: <=
      value: 100
      description: Existing sensitive receptors (for example, housing, care homes, or student accommodation)
        within 100 m of site boundary.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 31, 35; Minerals and Waste Policies and Allocations Development
  Plan Document (M&WDPD) Policy MW1
source-text: All detailed major proposals with existing sensitive receptors (for example, housing, care
  homes, or student accommodation) within 100 m of site boundary.
must-include:
- item: Hours of construction and demolition activities
  level: must
- item: Measures to control emission of dust and dirt
  level: must
- item: Measures to control emission of noise and vibration
  level: must
- item: 'Where construction involves penetrative piling: piling methods, with measures to suppress noise
    and vibration'
  level: must
- item: Measures to prevent mud and other material migrating onto the highway
  level: must
- item: Designation, layout and design of construction access and egress points
  level: must
- item: Directional signage (on and off site)
  level: must
- item: Contractors' compounds, materials storage and other storage arrangements, including cranes, plant,
    equipment and temporary infrastructure
  level: must
- item: Loading and unloading of plant, machinery and materials
  level: must
- item: Provision for site operatives, parking and turning within the site
  level: must
- item: Routing agreements for construction traffic
  level: must
- item: Security hoarding, including decorative displays and public viewing facilities where appropriate
  level: must
- item: Waste audit and scheme for waste minimisation and recycling/disposal of demolition and construction
    waste
  level: must
- item: Monitoring of noise, vibration and dust
  level: must
- item: Temporary lighting
  level: must
- item: Liaison with the local community and procedures for dealing with complaints
  level: must
- item: Surface water drainage measures throughout construction
  level: must
confidence: medium
notes: From the council's list (published 2026), item 14 (Construction Management Plan). 'Detailed' proposals
  are shown as full and reserved matters applications.
review-status: unverified
field-status: {}
