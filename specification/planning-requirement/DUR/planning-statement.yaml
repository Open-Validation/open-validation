reference: planning-statement
local-authority: DUR
required-if:
  any:
  - ref: major-development
  - condition:
      field: traveller-site
      value: true
      description: Applications for Gypsies and Travellers sites.
  - condition:
      field: employment-site-non-employment-use
      value: true
      description: Non-employment uses on protected and allocated employment sites.
  - condition:
      field: educational-accommodation
      value: true
      description: Applications for Purpose-Built Student Accommodation (PBSA).
  - condition:
      field: childrens-home
      value: true
      description: Applications for the formation of children's homes.
  - application-type:
      in:
      - s73
  - discretionary
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: Minerals and Waste Policies and Allocations Development Plan Document (M&WDPD) Policy MW1; County
  Durham Plan (CDP) Policies 2, 17, 18 and 29
source-text: All major planning applications Developments requiring a detailed understanding of relevant
  policy and context Applications for Gypsies and Travellers sites. Non-employment uses on protected and
  allocated employment sites Applications for Purpose-Built Student Accommodation (PBSA) Applications
  for the formation of children's homes. Application to vary or remove conditions
must-include:
- item: How the development accords with relevant national and local planning policies
  level: must
- item: 'Where regeneration benefits are of material significance: jobs created or supported, community
    benefits, relevant regeneration strategies, and social and environmental benefits'
  level: should
  required-if: discretionary
- item: 'Where large numbers of people are likely to congregate (transport hubs, night time economy venues,
    cinemas, theatres, stadia, shopping centres, health and education establishments, places of worship,
    hotels, restaurants, visitor attractions, commercial centres): how the proposal anticipates and addresses
    malicious threats and natural hazards'
  level: should
  required-if: discretionary
- item: The extent of community engagement and consultation undertaken
  level: should
- item: Evidence of the status of applicants and intended occupiers as 'gypsies and travellers' or 'travelling
    showpeople'
  level: must
  required-if:
    condition:
      field: traveller-site
      value: true
      description: The proposal creates gypsy and traveller pitches or travelling showpeople plots.
- item: 'Evidence of unsuccessful marketing with at least one recognised commercial agent: 12 months for
    a change of use; 2 years for redevelopment of a protected site or an allocated site below 10 ha; 5
    years for an allocated site over 10 ha'
  level: must
  required-if:
    condition:
      field: employment-site-non-employment-use
      value: true
      description: Non-employment use on a protected or allocated employment site.
- item: Need, where plan policies require it
  level: should
  required-if: discretionary
- item: 'For a children''s home: management of the home (including a missing child policy), statement
    of purpose and a locality risk assessment, considering crime or safety concerns in consultation with
    Durham Constabulary, Children and Young People''s Services and other agencies'
  level: must
  required-if:
    condition:
      field: childrens-home
      value: true
      description: The proposal is for the formation of a children's home.
- item: When development would start and the expected build out rate until completion
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings.
- item: 'For solar farms: the maximum theoretical energy capacity compared with the secured grid connection
    output'
  level: must
  required-if:
    condition:
      field: solar-panels
      value: true
      description: Development relating to solar farms.
- item: 'For variation of conditions: a list of the proposed changes; for removal of conditions: the justification,
    with reference to planning policies'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: 'For major developments below the full Health Impact Assessment thresholds: how the development
    reflects the health needs of the population'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 2026), item 31 and 17 (Planning Statement; Health Impact Assessment).
  'Developments requiring a detailed understanding of relevant policy and context' is discretionary. Item
  17 says the planning statement of other major developments should evidence how they reflect the population's
  health needs.
review-status: unverified
field-status: {}
