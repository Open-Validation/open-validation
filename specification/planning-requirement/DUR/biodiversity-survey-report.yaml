reference: biodiversity-survey-report
local-authority: DUR
required-if:
  any:
  - all:
    - any:
      - condition:
          field: building-works
          value: true
          description: Conversion, demolition, removal, or modification of existing buildings.
      - condition:
          field: demolition
          value: true
          description: Demolition or removal of existing buildings.
      - condition:
          field: tree-removal
          value: true
          description: Removal or pruning of trees.
    - any:
      - condition:
          field: protected-species
          value: true
          description: Protected species are known to be present (confirmed by a data search or local
            knowledge).
      - condition:
          field: agricultural-building-reuse
          value: true
          description: 'Barn owl: agricultural buildings including barns and outbuildings except for single
            skin livestock barns.'
      - condition:
          field: potential-roost-features
          value: true
          description: 'Bats: buildings, structures or trees with features which may support roosts, within
            200m of woodland or water, or with clear connectivity to bat foraging habitats.'
      - all:
        - condition:
            field: floodlighting
            value: true
            description: Floodlighting.
        - condition:
            field: near-woodland
            value: true
            description: Within 50 metres of woodland, water, or hedgerows / lines of trees.
  - condition:
      field: distance-to-pond
      operator: <=
      value: 250
      description: 'Great crested newts: within 250m of ponds and other standing water habitats.'
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: Minor applications.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 10, 16, 34, 35, 40, 41 and 43; Minerals and Waste Policies and
  Allocations Development Plan Document (M&WDPD) Policy MW1
source-text: 'All applications which include conversion, demolition, removal, or modification of existing
  buildings or removal or pruning of trees as follows: … A EcIA will be required for all minor and major
  applications'
must-include:
- item: Protected species surveys undertaken by competent persons with suitable qualifications and experience,
    at an appropriate time of year, in suitable weather and to nationally recognised methods where available
  level: must
- item: Survey work carried out within 2 years of submission of the application
  level: must
- item: Any further bat or great crested newt surveys recommended by the risk assessments
  level: must
  required-if: discretionary
- item: Ecological Impact Assessment (EcIA) prepared by a professional ecologist, following CIEEM's 'Guidelines
    for Ecological Impact Assessment in the UK and Ireland' and BS 42020
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor applications.
- item: Habitats and species on the site and within the zone of influence, with the results informing
    design, layout and construction through the mitigation hierarchy (avoid, minimise, compensate)
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor applications.
- item: Covers any additional land affected by the development, such as access routes, compounds and drainage
    connections
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor applications.
confidence: medium
notes: From the council's list (published 2026), item 11 (Biodiversity and Geology Survey and Report,
  and BNG, parts A and B). Part A (protected species surveys) and part B (Ecological Impact Assessment,
  all minor and major applications) are combined here. Householder applications need no bat survey if
  the works are at ground floor level only and don't disturb the roof structure of the house or outbuildings.
  Structures traditionally known to support bats (bridges, tunnels, mines, kilns, ice houses, cellars
  and similar) also need bat risk assessments. The EcIA may be waived if the council confirms in writing
  at pre-application stage that it isn't needed.
review-status: unverified
field-status: {}
