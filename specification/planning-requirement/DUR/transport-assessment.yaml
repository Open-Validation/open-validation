- item: Measures to improve access by public transport, walking and cycling, to address parking need,
    and to mitigate transport impacts
  level: must
- item: A completed Active Travel England planning application assessment toolkit, in the Transport Assessment
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 dwellings or more.
    - condition:
        field: floorspace
        operator: '>='
        value: 7500
        description: 7,500 sqm floor space or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 5
        description: A site area of 5 ha or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 5
        description: A site area of 5 ha or more.
  source-text: 'In addition, where development that meets or exceeds 150 dwellings, 7,500 sqm floor space
    or a site area of 5 ha or more, the Transport Assessment shall include a completed Gov.uk: Active
    Travel England: planning application assessment toolkit.'
confidence: medium
notes: 'From the council''s list (published 2026), item 38 and 39 (Transport Assessment; Transport Statement).
  This id covers both: a Transport Statement from the lower thresholds (item 39) and a Transport Assessment
  above the upper ones (item 38). ''Significant freight/HGV movements'', ''inadequate transport infrastructure''
  and ''likely to increase accidents or vehicle/pedestrian conflicts'' are judgements, so discretionary.
  Applicants are encouraged to consult Highways England where the Strategic Road Network could be affected.
  The Active Travel England toolkit comes from item 8.'
