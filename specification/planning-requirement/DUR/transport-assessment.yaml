    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 7500
        description: 7,500 square metres or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 5
        description: A site of 5 hectares or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 5
        description: A site of 5 hectares or more.
