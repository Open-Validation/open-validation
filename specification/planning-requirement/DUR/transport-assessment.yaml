source-text: E Food Retail (Supermarket) >800 sqm E Non-Food Retail >1500 sqm E Financial and Professional
  Services >2500 sqm E Restaurants and Cafes >2500 sqm Sui Generis Drinking Establishment >600 sqm Sui
  Generis Hot Food Takeaway >500 sqm E Office/R and D/Light Industry>2500 sqm B2 Industrial >4000 sqm
  B8 Storage or Distribution >5000 sqm C1 Hotels >100 beds C2 Residential Institution (Hospitals/nursing
  homes) >50 bed C2 Residential Institutions (Education) >150 students C2 Secure Residential Institutions
  >400 residents C3 Dwellings >80 units E Clinics, Health Centres, Day Care, Creches > 1000 sqm F1 Education
  and Training, Libraries, Public Halls, Places of Worship > 1000 sqm E Indoor recreation and Gyms > 1500
  sqm F2 Community Halls/Meeting Place >1500 sqm F2 Swimming Baths/Skating Rinks > 1500 sqm Development
  likely to increase accidents or vehicle/pedestrian conflicts … E Food Retail (Supermarket) 250-800 sqm
  E Non-Food Retail 800-1500 sqm E Financial and Professional Services 1000-2500 sqm E Restaurants and
  Cafes 300-2500 sqm Sui Generis Drinking Establishments 300-600 sqm Sui Generis Hot Food Takeaway 250-500
  sqm E Office/R and D/Light Industry Business 1500-2500 sqm B2 Industrial - 2500-4000 sqm B8 Storage
  or Distribution 3000-5000 sqm C1 Hotels 75-100 beds C2 Residential Institutions (Hospitals and nursing
  homes) 30-50 beds C2 Residential Institutions (Education) 50-150 students C2 Secure Residential Institutions
  250-400 residents C3 Dwellings 50-80 units E Clinics, Health Centres, Day Care, Creches 500-1000 sqm
  F1 Education and Training, Libraries, Public Halls, Places of Worship 500-1000 sqm E Indoor Recreation
  and Gyms 500-1500 sqm F2 Swimming Baths/Skating Rinks 500-1500 sqm Development not in conformity with
  the development plan Development generating 30+ two-way vehicle movements in an hour Development generating
  100+ two-way vehicle movements per day Development proposing 100+ parking spaces Development generating
  significant freight/HGV movements per day or significant abnormal loads per year Development in a location
  where transport infrastructure is inadequate Development within or adjacent to an AQMA
