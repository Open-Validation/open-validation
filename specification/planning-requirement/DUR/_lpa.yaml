submission-standards:
- item: Documents for each validation requirement provided as separate, clearly labelled files, not combined
    with unrelated information
  level: should
- item: Plans emailed for submission must be in .pdf or .tif format
  level: must
- item: Submit through the Planning Portal (or a service connected to the council's system), paying the
    fee through the Portal and uploading validation documents to it; otherwise a non-refundable service
    charge applies (£300 inc VAT for major applications, £149 for others)
  level: should
- item: Where required information cannot be provided, a clear and reasoned justification should accompany
    the application
  level: should
