reference: habitat-baseline
local-authority: DUR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policy 41; Environment Act 2021
source-text: 'Applies to all development (excluding householder applications, or where a development does
  not impact a priority habitat and impacts less than: 25 square metres of habitat and 5 meters of linear
  habitat such as hedgerows) will be required to demonstrate BNG) S.73 applications which do not affect
  secured BNG and other exemptions set out in the Biodiversity Gain Requirements (Exemptions) Regulations
  [2024]'
must-include:
- item: The areas covered by each existing habitat type (or habitat parcel), with the area of each in
    hectares
  level: must
- item: Linear features with their length in metres
  level: should
confidence: medium
notes: From the council's list (published 2026), item 11 (Biodiversity and Geology Survey and Report,
  and BNG, part C). Shown with the biodiversity gain condition, which is what the law exempts (householder,
  de minimis and other exempt development). The list also says Policy 41 of the County Durham Plan expects
  a net gain from small sites. The Habitat Baseline Plan is part of the draft BNG Plan and usually forms
  part of the EcIA.
review-status: unverified
field-status: {}
