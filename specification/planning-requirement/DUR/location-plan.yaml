reference: location-plan
local-authority: DUR
required-if:
  always: true
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: Town and Country Planning (Development Management Procedure) Order 2015
source-text: Location plan All
must-include:
- item: Based on an up-to-date map at 1:1250 or 1:2500
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact site location clear
  level: must
- item: Direction of north
  level: should
- item: Site edged in red, including all land needed to carry out the development and a link to the public
    highway (road)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged blue
  level: must
confidence: medium
notes: From the council's list (published 2026), item 2 (Location plan).
review-status: unverified
