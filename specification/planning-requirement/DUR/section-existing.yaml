reference: section-existing
local-authority: DUR
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: adjacent-ground-level-change
      value: true
      description: Ground levels outside of the application site are noticeably different.
  - discretionary
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 31, 32
source-text: 'All developments where the proposal involves a change in ground levels or where ground levels
  outside of the application site are noticeably different. … Additional Plans and Drawings All Depending
  on nature of development the following may be required: existing and proposed site sections, site levels
  and finished floor levels'
must-include:
- item: Usually at 1:50 or 1:100
  level: should
- item: Existing and proposed site levels and finished floor levels, with cross sections where relevant;
    levels related to a fixed datum point off site
  level: must
- item: The proposals in relation to adjoining buildings that may be affected
  level: must
- item: Existing and proposed ground levels on the sections, with a plan showing the points between which
    the cross sections are taken
  level: must
- item: Existing and proposed buildings within and next to the site, with finished floor and ridge levels
  level: must
confidence: medium
notes: From the council's list (published 2026), item 7 and 23 (Additional Plans and Drawings; Levels).
  Item 23 (Levels) asks for levels plans with cross sections; item 7 says sections 'may be required' (discretionary).
  For householder development the levels may be evident from floor plans and elevations.
review-status: unverified
field-status: {}
