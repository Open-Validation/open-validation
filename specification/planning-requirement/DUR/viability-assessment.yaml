reference: viability-assessment
local-authority: DUR
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: Policy-compliant development is not being proposed for viability reasons.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 15, 25
source-text: For applications when policy-compliant development is not being proposed for viability reasons
must-include:
- item: Enough information for an objective review, having regard to the checklist at Appendix C of RICS
    'Financial Viability in Planning'
  level: should
- item: Site-specific viability report and appraisal
  level: must
- item: Floor areas, types and numbers of units
  level: must
- item: Estimated sales values (including affordable housing values), with market evidence
  level: must
- item: Gross Development Value calculation, with evidence of how it was derived
  level: must
- item: 'All costs: acquisition, site preparation, external works and infrastructure, construction, abnormals,
    contingency, finance/interest, professional fees, marketing, agents'' fees, legal and disposal fees'
  level: must
- item: Section 106 contributions
  level: must
- item: 'Development programme: pre-build, construction, marketing and sales periods and phasing assumptions'
  level: must
- item: Development profit as profit on cost and/or profit on value
  level: must
confidence: medium
notes: From the council's list (published 2026), item 43 (Viability Assessment).
review-status: unverified
field-status: {}
