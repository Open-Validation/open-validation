reference: affordable-housing-statement
local-authority: DUR
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major housing application.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: Applications for 5 units or more.
    - condition:
        field: housing-market-area
        value: west-durham
        description: In West Durham.
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 4, 5, 6, 11, 15, 25
source-text: All major housing application and applications for 5 units or more in West Durham to provide
  an additional affordable housing Statement
must-include:
- item: Number of dwellings, including market, affordable and other specialist housing types (for example
    self-build/custom build)
  level: must
- item: Percentage proposed as affordable
  level: must
- item: Tenure of affordable dwellings (rented as social rent or affordable rent; intermediate as shared
    ownership)
  level: must
- item: Type and size (number of bedrooms) of property, for both market and affordable
  level: must
- item: Gross internal area (sqm) by tenure and property type
  level: must
- item: Compliance with any standards (for example HCA DQS)
  level: must
- item: Housing to meet the needs of older people and people with disabilities
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Sites of 10+ dwellings.
- item: Location of affordable housing in the on-site layout
  level: must
- item: Evidence that the affordable housing meets the requirements of local RSLs
  level: must
- item: Reference to viability, where the required level of affordable housing is not intended
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The required level of affordable housing is not intended to be provided.
confidence: medium
notes: From the council's list (published 2026), item 25 (Meeting Housing Needs Statement). Part of the
  Meeting Housing Needs Statement; the Accessible and Adaptable Homes Statement (5 units or more) is in
  the unmapped list.
review-status: unverified
field-status: {}
