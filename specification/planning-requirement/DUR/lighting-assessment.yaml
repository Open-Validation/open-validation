reference: lighting-assessment
local-authority: DUR
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting (e.g. floodlights or security lighting).
  - discretionary
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 13, 29, 31, 38, 39, 44, 45, 46; Minerals and Waste Policies
  and Allocations Development Plan Document (M&WDPD) Policy MW1
source-text: Applications for developments which would involve the provision of significant external lighting
  (e.g. floodlights or security lighting) that may have an adverse impact on residential amenity, the
  character of the open countryside or a heritage asset
must-include:
- item: 'For floodlighting: light spillage, hours of illumination, light levels, column heights, specification
    and colour, lamp and luminaire treatment, full horizontal cut-off, no distraction to the highway,
    impact on nearby dwellings, demountable columns, retention of screening vegetation, planting and bunding
    to contain lighting effects'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: The scheme involves floodlighting.
- item: Effects on visual amenity, local character and distinctiveness, neighbouring amenity, heritage
    assets if present, and nature conservation
  level: must
- item: How those effects will be mitigated
  level: must
confidence: medium
notes: From the council's list (published 2026), item 24 (Lighting Assessment). Needed where significant
  lighting 'may have an adverse impact' on residential amenity, open countryside or a heritage asset,
  which is a judgement, so discretionary alongside the lighting condition.
review-status: unverified
field-status: {}
