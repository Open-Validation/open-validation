reference: air-quality-assessment
local-authority: DUR
required-if:
  any:
  - discretionary
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10+ residential units.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: A residential site area of more than 0.5ha.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: '> 1,000 m2 of floor space for all other uses.'
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: A site area greater than 1ha (other uses).
    - any:
      - condition:
          field: parking-spaces
          operator: '>'
          value: 10
          description: '> 10 parking spaces.'
      - condition:
          field: centralised-combustion
          value: true
          description: A centralised energy facility or other centralised combustion process.
    - discretionary
source-url: https://www.durham.gov.uk/article/37122/Validation-checklist
policy: County Durham Plan (CDP) Policies 22 and 31; Minerals and Waste Policies and Allocations Development
  Plan Document (M&WDPD) MW1 and MW5
source-text: 'Where the proposal may potentially have a significant impact on air quality either by emitting
  air quality pollutants or by introducing receptors to areas where there are existing sources of air
  quality pollutants. Where the grant of permission would conflict with, or render unworkable, measures
  contained within an air quality action plan. If any of the following Stage 1 Screening Criteria apply,
  then further consideration will be required against the Stage 2 indicative criteria below: … Stage 1
  Screening Criteria: 10+ residential units or a site area of more than 0.5ha > 1,000 m2 of floor space
  for all other uses or a site area greater than 1ha Coupled with any of the following: > 10 parking spaces
  a centralised energy facility or other centralised combustion process'
must-include:
- item: Enough information for full consideration of the impact of the proposal on the air quality of
    the area, including any proposals for mitigation
  level: must
- item: The potential impacts of neighbouring sources on the site, even if impacts of the development
    on the surrounding area are screened out
  level: should
confidence: medium
notes: From the council's list (published 2026), item 10 (Air Quality Assessment). Meeting a Stage 1 screening
  criterion leads to 'further consideration' against Stage 2 indicative criteria (traffic flow changes
  near receptors or in an Air Quality Management Area, new junctions, bus stations, underground car parks,
  combustion plant, minerals and waste schemes, biomass, dusty demolition or construction within 200 m
  of residents), so the officer's judgement is shown as discretionary. Significant impacts on air quality,
  or conflict with an air quality action plan, are also discretionary.
review-status: unverified
field-status: {}
