reference: air-quality-assessment
local-authority: DUR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A residential site of 0.5 hectares or more.
  - condition:
      field: floorspace-non-residential
