reference: application-form
local-authority: TES
required-if:
  always: true
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Completed form. ... The appropriate fee (see Fees list).
must-include:
- item: The appropriate fee
  level: must
- item: The completed Ownership Certificate and Agricultural Land Declaration (A, B, C or D, as applicable)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
- item: 'Where Ownership Certificate B, C or D is completed: the required notice(s) given and/or published'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
- item: 'For tree works: the application form completed and dated'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
  source-text: Completed and dated application form.
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  full permission checklist (04), householder checklist (01), listed building consent checklist (11),
  relevant demolition in a conservation area checklist (10), tree works (TPO) checklist (31b). For approval
  of details reserved by condition there are ''NO NATIONAL REQUIREMENTS ... except that they should be
  made in writing'', though the form and fee may be submitted.'
review-status: unverified
field-status: {}
