reference: site-plan
local-authority: TES
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: freestanding-advert
        value: true
        description: The advert is freestanding or not affixed to the building identified on the site
          plan.
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block plan of the site at a scale of 1:200 or 1:500 showing any site boundaries.
must-include:
- item: Drawn at a scale of 1:200 or 1:500
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - advertising
- item: Site boundaries
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
- item: 'For relevant demolition in a conservation area: the structures to be demolished identified'
  level: must
  required-if:
    application-type:
      in:
      - demolition-con-area
  source-text: Block plan of the site at a scale of 1:200 or 1:500 showing identifying the structures
    to be demolished.
- item: 'For advertisement consent: the location of the advert'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Block Plan identifying the location of the advert at a scale of 1:200 or 1:500 (when the
    advert is freestanding or not affixed to the building identified on the site plan).
- item: 'For lawful development certificates: a site survey plan at a scale of 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
  source-text: Site survey plan at a scale of 1:50 or 1:100.
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  householder checklist (01), full permission checklist (04), outline (some matters reserved) checklist
  (05), outline (all matters reserved) checklist (06), reserved matters checklist (23), relevant demolition
  in a conservation area checklist (10), listed building consent checklist (11), advertisement consent
  checklist (12), lawful development (existing) checklist (14), lawful development (proposed) checklist
  (15). The block plan is a local requirement for advertisement consent and relevant demolition, and the
  lawful development checklists ask for a ''site survey plan'' (an existing one for existing use).'
review-status: unverified
field-status: {}
