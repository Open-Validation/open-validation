reference: flood-risk-assessment
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - flood-risk-zone
        description: New development located in Flood Zones 2 and 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: 1 hectare or greater in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: 1 hectare or greater in Flood Zone 1.
    - all:
      - site:
          in:
          - critical-drainage-area
          description: In a designated critical drainage area notified by the Environment Agency.
      - discretionary
source-url: https://www.testvalley.gov.uk/assets/attach/25081/Descriptions-of-Local-Requirements-for-Planning-Applications.pdf
policy: Test Valley Borough Revised Local Plan 2016 policy E7; Flood and Water Management Act 2010
source-text: A Flood Risk Assessment (FRA) will be required for development proposals of 1 hectare or
  greater in Flood Zone 1 and for all proposals for new development located in Flood Zones 2 and 3 as
  designated by the Environment Agency. An FRA will also be required for any development other than minor
  development in a designated critical drainage area which has been notified to the Local Planning Authority
  by the Environment Agency.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: should
- item: The impact of the development on flooding elsewhere
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  householder checklist (01), householder and conservation area checklist (02), householder and listed
  building checklist (03), full permission checklist (04), outline (some matters reserved) checklist (05),
  outline (all matters reserved) checklist (06), full permission and conservation area checklist (07),
  full permission and listed building checklist (08), full permission and advertisement checklist (09).
  Detail from the Descriptions of Local Requirements (2015, updated 15 March 2016), page 5. In a critical
  drainage area it is needed for development ''other than minor development''; as that cannot be shown
  without a matching field, that part is shown as discretionary.'
review-status: unverified
field-status: {}
