reference: biodiversity-survey-report
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
  - any:
    - condition:
        field: protected-species
        value: true
        description: The proposal may affect protected species (for example demolition of older buildings
          or roof spaces, removal of trees, scrub or hedgerows, or alterations to water courses).
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - local-wildlife-site
        - priority-habitat
        description: The development will affect areas designated for their biodiversity interests.
    - discretionary
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Test Valley Borough Revised Local Plan 2016 policy E5; Conservation of Habitats and Species Regulations;
  Wildlife and Countryside Act 1981
source-text: Biodiversity Checklist and Biodiversity survey and report where Biodiversity Checklist identifies
  the need for one. ... Where a proposed development may have possible impacts on wildlife and biodiversity,
  information (e.g.surveys and impact assessments) should be provided on existing biodiversity interests
  and possible impacts on them to allow full consideration of those impacts.
must-include:
- item: Existing biodiversity interests and possible impacts on them (for example surveys and impact assessments)
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: should
  required-if:
    condition:
      field: protected-species
      value: true
      description: Mitigation or compensation is proposed.
- item: Where appropriate, plans showing significant wildlife habitats or features and the location of
    habitats of protected species
  level: should
- item: 'For development in the countryside affecting areas designated for biodiversity: an assessment
    of impacts and proposals for long term maintenance and management'
  level: should
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - local-wildlife-site
      description: Areas designated for their biodiversity interests.
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  householder checklist (01), householder and conservation area checklist (02), householder and listed
  building checklist (03), full permission checklist (04), outline (some matters reserved) checklist (05),
  outline (all matters reserved) checklist (06), listed building consent checklist (11), relevant demolition
  in a conservation area checklist (10). Detail from the Descriptions of Local Requirements (2015, updated
  15 March 2016), page 2. Needed where the council''s Biodiversity Checklist identifies the need, which
  is shown as discretionary alongside the clear triggers. The relevant demolition checklist lists it without
  that qualifier. The Biodiversity Checklist itself is in the council''s unmapped rows.'
