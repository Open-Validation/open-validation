reference: archaeological-assessment
local-authority: TES
required-if:
  all:
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: Within an area of archaeological potential.
      - condition:
          field: ground-disturbance
          value: true
          description: The application involves the disturbance of ground.
    - ref: major-development
  - discretionary
source-url: https://www.testvalley.gov.uk/assets/attach/25081/Descriptions-of-Local-Requirements-for-Planning-Applications.pdf
policy: Test Valley Borough Revised Local Plan 2016 policy E9
source-text: For all applications involving the disturbance of ground within an area of archaeological
  potential or in other areas in the case of a major development proposal or significant infrastructure
  works, an applicant may need to commission an assessment of the archaeological impact and submit the
  results as part of the Heritage Statement.
confidence: medium
notes: From the council's Descriptions of Local Requirements (2015, updated 15 March 2016), page 9, under
  Heritage Statement. 'May need to' is shown as discretionary; significant infrastructure works outside
  areas of archaeological potential are also covered. The results go in the Heritage Statement.
