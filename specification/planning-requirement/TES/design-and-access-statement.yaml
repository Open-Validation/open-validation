reference: design-and-access-statement
local-authority: TES
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floorspace created is 100m2 or more.
  - application-type:
      in:
      - lbc
source-url: https://www.testvalley.gov.uk/assets/attach/25082/Design-and-Access-Statement-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'From 25th June 2013, a Design and Access Statement will not be required with a planning
  application unless it is for: a) major development; b) development in a Conservation Area or World Heritage
  Site consisting of- i) the provision of one or more dwellinghouses; or ii) the provision of a building
  or buildings where the floorspace created by the development is 100m2 or more; ... Design and Access
  Statements continue to be required with applications for Listed Building Consent.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: The policy adopted as to access, and how access policies in local development documents have been
    taken into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: Any consultation on access and how its outcome was taken into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: How any specific issues which might affect access have been addressed
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: 'For listed building consent: the design principles and concepts applied to take account of the
    building''s special architectural or historic importance, the physical features that justify its listing,
    and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent, unless the works affect only the interior: the access policy (including
    alternatives considered), how it takes account of the building''s importance, features and setting,
    any consultation, and how specific access issues have been addressed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's Design and Access Statement guidance (as from 25 June 2013), pages 1-2, which
  the checklists cite as the 'separate explanation'. Not required for section 73 applications, extending
  the life of a permission, engineering and mining operations, material change of use or waste development.
  The checklists list it for full, outline, listed building and advertisement-with-full applications.
review-status: unverified
field-status: {}
