reference: affordable-housing-statement
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Additional dwellings are proposed.
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Test Valley Borough Revised Local Plan 2016 policy COM7; Affordable Housing SPD
source-text: Affordable Housing statement (Where additional dwellings are proposed).
must-include:
- item: The numbers of residential units, for both the affordable and any market housing
  level: should
- item: The mix of units, with numbers of habitable rooms and/or bedrooms
  level: should
- item: The floor space of habitable areas of the residential units
  level: should
- item: Plans showing the location of the units and their habitable rooms and/or bedrooms and/or floor
    space
  level: should
- item: 'Where different levels or types of affordability or tenure are proposed: a clear and full explanation'
  level: should
- item: Any Registered Social Landlords acting as partners in the development
  level: should
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  full permission checklist (04), outline (some matters reserved) checklist (05), outline (all matters
  reserved) checklist (06), full permission and conservation area checklist (07), full permission and
  listed building checklist (08), full permission and advertisement checklist (09). Detail from the Descriptions
  of Local Requirements (2015, updated 15 March 2016), page 1. Financial contributions may be needed under
  policy COM7.'
review-status: unverified
field-status: {}
