reference: heritage-statement
local-authority: TES
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        - scheduled-monument
        - park-and-garden
        description: Development in a conservation area or in the setting of any heritage assets.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: Householder works to a listed building.
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Test Valley Borough Revised Local Plan 2016 policy E9
source-text: Heritage Statement (If development is in a conservation area or in the setting of any heritage
  assets). ... Heritage statements should be submitted where the proposals impact on ‘heritage assets’.
must-include:
- item: 'For listed building consent: a schedule of works; an analysis of the significance of archaeology,
    history and character of the building; and the principles of and justification for the works and their
    impact on its special character, its setting and the setting of adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
  source-text: For applications for listed building consent, a written statement may be required that
    includes schedule of works to the listed building(s), an analysis of the significance of archaeology,
    history and character of the building/structure, the principles of and justification for the proposed
    works and their impact on the special character of the listed building or structure, its setting and
    the setting of adjacent listed buildings.
- item: 'For demolition in a conservation area: a structural survey, an analysis of the character and
    appearance of the building, and the principles of and justification for the demolition and its impact
    on the special character of the area'
  level: should
  required-if:
    application-type:
      in:
      - demolition-con-area
- item: 'For proposals affecting the setting of heritage assets: plans showing historic features on or
    next to the site (listed buildings and structures, historic parks and gardens, historic battlefields,
    scheduled ancient monuments) and an analysis of the significance of the asset'
  level: should
  required-if:
    site:
      in:
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      description: The proposal relates to or affects the setting of heritage assets.
- item: 'For applications within or adjacent to a conservation area: an assessment of the impact on the
    character and appearance of the area'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  full permission checklist (04), outline (some matters reserved) checklist (05), outline (all matters
  reserved) checklist (06), full permission and conservation area checklist (07), full permission and
  listed building checklist (08), full permission and advertisement checklist (09), listed building consent
  checklist (11), relevant demolition in a conservation area checklist (10), householder and listed building
  checklist (03). Detail from the Descriptions of Local Requirements (2015, updated 15 March 2016), page
  7-9. Always listed for listed building consent, relevant demolition in a conservation area and the combined
  full permission checklists; for full and outline applications only in a conservation area or the setting
  of heritage assets. The householder conservation area checklist does not list it. The contents are ''the
  sort of information that may be required'', so they show as ''should''.'
review-status: unverified
field-status: {}
