reference: planning-statement
local-authority: TES
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - demolition-con-area
    - s73
source-url: https://www.testvalley.gov.uk/assets/attach/25081/Descriptions-of-Local-Requirements-for-Planning-Applications.pdf
policy: Test Valley Borough Revised Local Plan 2016
source-text: A planning statement identifies the context and need for a proposed development and includes
  an assessment of how the proposed development accords with relevant national and local planning policies.
must-include:
- item: The context and need for the proposed development
  level: must
- item: An assessment of how the proposal accords with relevant national and local planning policies
  level: must
- item: Reference to the loss of any local facilities or services (e.g. community facilities, shops, sports
    fields and recreational facilities)
  level: should
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: The proposal would lose a local facility or service.
- item: Financial contributions required under Local Plan policies such as COM7, LHW1 and COM15 and the
    Infrastructure and Developer Contributions SPD
  level: should
- item: 'For removal or variation of a condition: the reasons for seeking the variation or removal'
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: Planning Statement explaining reasons for seeking variation or removal of condition(s).
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  full permission checklist (04), outline (some matters reserved) checklist (05), outline (all matters
  reserved) checklist (06), reserved matters checklist (23), full permission and conservation area checklist
  (07), full permission and listed building checklist (08), full permission and advertisement checklist
  (09), relevant demolition in a conservation area checklist (10), removal or variation of condition checklist
  (25/26). Detail from the Descriptions of Local Requirements (2015, updated 15 March 2016), page 10.
  It may also cover pre-application consultation, or a separate statement on community involvement may
  be appropriate.'
