reference: transport-assessment
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://www.testvalley.gov.uk/assets/attach/25081/Descriptions-of-Local-Requirements-for-Planning-Applications.pdf
policy: Test Valley Borough Revised Local Plan 2016 policies T1, T2, T3
source-text: A Transport Assessment (TA) should be submitted as part of any planning application where
  the proposed development has significant transport implications.
must-include:
- item: 'For smaller schemes: an outline of the transport aspects of the application'
  level: should
- item: 'For major proposals: accessibility to the site by all modes of transport and the likely modal
    split of journeys'
  level: should
  required-if:
    ref: major-development
- item: 'For major proposals: measures to improve access by public transport, walking and cycling, to
    reduce the need for parking, and to mitigate transport impacts'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's Descriptions of Local Requirements (2015, updated 15 March 2016), page 10, and
  its 2017 matrix of local requirements (planning permission and outline). It is not on the January 2022
  checklists. 'Significant transport implications' depends on judgement, so it is shown as discretionary.
review-status: unverified
field-status: {}
