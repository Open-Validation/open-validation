reference: floor-plan-proposed
local-authority: TES
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - reserved-matters
      - non-material-amendment
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: operational-development
        value: true
        description: Operational development is proposed or has been undertaken.
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed floor plans at a scale of 1:50 or 1:100.
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
- item: 'For a non-material amendment: the proposed alterations clearly identified'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  householder checklist (01), full permission checklist (04), listed building consent checklist (11),
  reserved matters checklist (23), non-material amendment checklist (34), lawful development (proposed)
  checklist (15).'
review-status: unverified
