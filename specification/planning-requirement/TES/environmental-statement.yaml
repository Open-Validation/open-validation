reference: environmental-statement
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: eia-development
      value: true
      description: An Environmental Impact Assessment is deemed necessary through EIA screening.
source-url: https://www.testvalley.gov.uk/assets/attach/25081/Descriptions-of-Local-Requirements-for-Planning-Applications.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations; Test Valley Borough Revised
  Local Plan 2016 policies E2, E5, E7, E8
source-text: Environmental statement (Where one is deemed necessary through EIA Screening).
must-include:
- item: The information set out in Schedule 4 to the EIA Regulations
  level: should
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  full permission checklist (04), outline (some matters reserved) checklist (05), outline (all matters
  reserved) checklist (06), reserved matters checklist (23). Detail from the Descriptions of Local Requirements
  (2015, updated 15 March 2016), page 4. Where a full EIA is not needed the council may still ask for
  environmental information such as a landscape and visual impact assessment (for example in the North
  Wessex Downs AONB).'
review-status: unverified
field-status: {}
