  outline (all matters reserved) checklist (06), reserved matters checklist (23), listed building consent
  checklist (11), relevant demolition in a conservation area checklist (10). Detail from the Descriptions
  of Local Requirements (2015, updated 15 March 2016), page 11. Listed as ''Tree Survey/Arboricultural
  implications (British Standard 5837:2012)''.'
