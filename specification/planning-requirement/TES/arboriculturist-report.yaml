reference: arboriculturist-report
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site or on land adjacent to it that could influence or be affected
        by the development (including street trees).
source-url: https://www.testvalley.gov.uk/assets/attach/25081/Descriptions-of-Local-Requirements-for-Planning-Applications.pdf
policy: Test Valley Borough Revised Local Plan 2016 policy E2; BS 5837
source-text: Where there are trees within the application site or on land adjacent to it that could influence
  or be affected by the development (including street trees), information will be required on which trees
  are to be retained and on the means of protecting these trees during construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: The means of protecting retained trees during construction works
  level: must
- item: Prepared by a qualified arboriculturist
  level: should
- item: Survey information, protection plan and method statement as set out in the current BS 5837
  level: must
confidence: medium
