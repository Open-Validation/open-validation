reference: cil-form
local-authority: TES
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - demolition-con-area
  - any:
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 0
        description: All residential development, including extensions and annexes.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The creation of 1 or more dwellings (even if less than 100m² GIA).
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 280
        description: Retail development of at least 280m² GIA floorspace.
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Test Valley CIL Charging Schedule (adopted 27 January 2016); Community Infrastructure Levy Regulations
  2010
source-text: 'Completion of the Additional Information Form (CIL – Determining whether a Development may
  be CIL Liable – Planning Application Additional Information Requirement form) for the following development:
  • All Residential development including extensions and annexes • The creation of 1 or more dwellings
  (even if it is less than 100m² GIA floorspace) Retail development of at least 280m² GIA floorspace'
must-include:
- item: A statement addressing the criteria in Part 6 of the CIL Regulations 2010 (as amended)
  level: must
  required-if:
    condition:
      field: cil-relief-claimed
      value: true
      description: The applicant is applying for Charitable Relief or Social Housing Relief.
  source-text: Applications for either Charitable Relief or Social Housing Relief will be required to
    include a statement which addresses the criteria set out in Part 6 of the CIL Regulations 2010 (as
    amended).
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  full permission checklist (04), outline (some matters reserved) checklist (05), outline (all matters
  reserved) checklist (06), full permission and conservation area checklist (07), full permission and
  listed building checklist (08), full permission and advertisement checklist (09), relevant demolition
  in a conservation area checklist (10). Detail from the Descriptions of Local Requirements (2015, updated
  15 March 2016), page 3. The householder checklists do not list the CIL form, although the description
  covers residential extensions.'
review-status: unverified
field-status: {}
