    - hh
    - full
    - outline
    - demolition-con-area
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - hedgerow-removal
source-url: https://www.testvalley.gov.uk/assets/attach/21703/Full-Application-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A plan which identifies the land to which the application relates and showing the direction
  of North, drawn to a scale of 1:1250 or 1:2500 with the application site outlined in red.
must-include:
- item: Drawn at a scale of 1:1250 or 1:2500
  level: must
- item: Direction of North
  level: must
- item: Application site outlined in red
  level: must
- item: 'For hedgerow removal: the location and length of the hedgerow(s) to be removed, preferably at
    1:2500 (another scale is acceptable if it shows them clearly)'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: A plan which clearly shows the location and length of the hedgerow(s) to be removed (preferably
    to a scale of 1:2500).
confidence: medium
notes: 'From the council''s PAR checklists (January 2022; reviewed 12 January 2024 with no material changes):
  householder checklist (01), full permission checklist (04), outline (some matters reserved) checklist
  (05), outline (all matters reserved) checklist (06), relevant demolition in a conservation area checklist
  (10), listed building consent checklist (11), advertisement consent checklist (12), lawful development
  (existing) checklist (14), lawful development (proposed) checklist (15), hedgerow removal checklist
  (21). Not listed for reserved matters, variation of condition, approval of details, non-material amendment
  or tree works (which need a sketch plan).'
