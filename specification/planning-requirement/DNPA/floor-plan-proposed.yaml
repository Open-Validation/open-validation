reference: floor-plan-proposed
local-authority: DNPA
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New or replacement buildings.
  - condition:
      field: footprint-increase
      value: true
      description: Extended buildings.
  - application-type:
      in:
      - lbc
  - condition:
      field: external-alterations
      value: true
      description: Changes to existing layouts which affect external appearance.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use of existing buildings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: To dwellings.
source-url: https://www.dartmoor.gov.uk/__data/assets/pdf_file/0033/193767/2025-Local-Validation-Checklist-final-Updated-21-10-26.pdf
