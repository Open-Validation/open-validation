reference: fire-statement
local-authority: DNPA
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 storeys or more.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: 2 or more dwellings (including flats).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.dartmoor.gov.uk/__data/assets/pdf_file/0033/193767/2025-Local-Validation-Checklist-final-Updated-21-10-26.pdf
