    value: true
    description: Schedule 1 development, or Schedule 2 development likely to have significant effects
      on the environment (EIA Regulations 2017).
source-url: https://www.cherwell.gov.uk/download/downloads/id/15879/validation-guidance-appx-1---biodiversity-checklist.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: All applications where the development is listed in Schedule 1 of the Town and Country Planning
  (Environmental Impact Assessment) Regulations 2017. … Developments that are listed in Schedule 2 of
  the above regulations, either above or below the thresholds, may require an Environmental Statement
  if it is likely to have significant effects on the environment by virtue of factors such as nature,
  size and location.
confidence: medium
notes: From the council's Validation Guidance Appendix 1 (Ecology and Biodiversity Requirements, January
  2024), page 1. It advises requesting a screening opinion for major development in or affecting a sensitive
  area or Schedule 2 development.
