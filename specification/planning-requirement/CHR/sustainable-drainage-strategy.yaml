reference: sustainable-drainage-strategy
local-authority: CHR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings (the council's 'Major residential development' checklists).
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Dwellings on a site of 0.5 hectares or more.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Local Plan 2011-2031 Part 1 (CLP 2015) policy ESD7
source-text: The FRA should include a surface water drainage strategy. The strategy must set out the proposed
  sustainable drainage system to manage water run-off and provision of its maintenance for the lifetime
  of the development. … Surface Water Drainage Strategy (essential)
must-include:
- item: The proposed sustainable drainage system to manage water run-off, and its maintenance for the
    lifetime of the development
  level: must
- item: Type of sustainable drainage system, its extent/position, design and site suitability, and future
    management arrangements
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 13-14. The guidance describes
  it inside the flood risk section; the checklist forms list it as a separate 'Surface Water Drainage
  Strategy', essential on the major residential checklists (https://www.cherwell.gov.uk/download/downloads/id/15906/full-planning-major-resi---validation-checklist-form.pdf).
  For other types it 'may' be needed with no stated trigger, so it is shown as discretionary.
review-status: unverified
field-status: {}
