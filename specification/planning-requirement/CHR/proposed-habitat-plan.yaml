reference: proposed-habitat-plan
local-authority: CHR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Environment Act 2021
source-text: The statutory metric requirement from January 2024, subject to any exemptions; … The statutory
  small site metric will be required from April 2024. … Biodiversity Net Gain is required through the
  Environment Act 2021. … Where the full Biodiversity Gain Plan is not provided upfront, a BNG Statement
  is required.
must-include:
- item: An annotated Ecological Mitigation Map and illustrative post-development habitat proposals, including
    retained and proposed new features, as a separate document with imagery produced using GIS software
  level: must
confidence: medium
notes: 'From the council''s list (published March 2024, reviewed March 2026), page 11-12. Part of the
  council''s Biodiversity Net Gain Statement. Shown for developments subject to the statutory biodiversity
  gain condition: householder and other exempt applications are exempt by law. The checklists mark the
  BNG Statement essential for 10 or more dwellings and for non-residential sites over 1 hectare.'
