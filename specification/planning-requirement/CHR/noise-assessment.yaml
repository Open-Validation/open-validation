reference: noise-assessment
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: New industrial, commercial or entertainment premises close to residential properties.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New residential property near transportation, industrial or commercial noise sources,
          or near entertainment premises.
    - condition:
        field: plant-equipment
        value: true
        description: New extraction or ventilation equipment, or air conditioning units.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
source-text: New industrial or commercial premises close to residential properties … New residential property
  near to transportation, industrial or commercial noise sources … New entertainment premises near to
  residential properties, and vice versa … New extraction or ventilation equipment … Air conditioning
  units
must-include:
- item: Description of the building's use and location, and the surrounding people or wildlife affected
    by noise
  level: must
- item: Description of the noises the development produces and where they come from
  level: must
- item: A noise survey and report data, carried out by a competent professional in accordance with BS4142
  level: must
- item: Mitigation measures to reduce or prevent noise
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 16-17.
review-status: unverified
field-status: {}
