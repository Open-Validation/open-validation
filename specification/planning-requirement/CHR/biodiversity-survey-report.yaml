reference: biodiversity-survey-report
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - demolition-con-area
      - advertising
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - consent-under-tpo
      - notice-trees-in-con-area
  - any:
    - ref: major-development
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        description: The site is within a designated habitat site (SSSI, SAC or SPA).
    - condition:
        field: protected-species
        value: true
        description: The proposal is likely to affect important protected species or habitats.
    - discretionary
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Local Plan 2011-2031 Part 1 (CLP 2015) policies ESD9, ESD10 and ESD11
source-text: 'All major planning applications; … If the site is within a designated habitat site: … Site
  of Special Scientific Interest (SSSI) … Special Area of Conservation (SAC) … Special Protection Area
  (SPA) … Where there is a likelihood that a planning proposal might affect important protected species
  or habitats; … If the proposal affects mature/overgrown gardens, areas of rough grassland or derelict
  land, including brownfield, allotments on or adjacent to the site; … Presence or suitability for Great
  Crested Newts (where there is a pond within 250m of the site or a pond on the site), badgers or common
  reptiles;'
must-include:
- item: Produced by a suitably qualified and experienced ecologist, with all the information the council
    needs to decide the application, including survey information on protected and priority species and
    habitats
  level: must
  source-text: Where the checklist indicates that Ecological information is required, it must be submitted
    with the application and be produced by a suitably qualified and experienced ecologist.
- item: All details of proposed avoidance, mitigation, compensation and enhancement
  level: must
- item: Consistent with other relevant reports, e.g. on SUDS, landscape, lighting, flood risk, open space,
    access, aftercare and trees
  level: must
- item: A lighting strategy/plan with a Lux Analysis of the development plans
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published March 2024, reviewed March 2026), page 12-13. Contents from
  Appendix 1 (Ecology and Biodiversity Requirements, January 2024), page 3: https://www.cherwell.gov.uk/download/downloads/id/15879/validation-guidance-appx-1---biodiversity-checklist.pdf
  . Gardens, rough grassland, derelict land, bats where demolition is proposed, newts, badgers and reptiles
  are shown as discretionary (no matching fields); the Appendix 1 biodiversity checklist (site over 0.1
  ha, demolition, roof works, light spill and so on) helps decide. The council''s Validation Checklist
  Forms (March 2024) list which documents each application type ''may also'' need; only those marked ''(essential)''
  are always needed. Essential for 10 or more dwellings and non-residential sites over 1 hectare, which
  are major development.'
review-status: unverified
field-status: {}
