reference: transport-assessment
local-authority: CHR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more new dwellings.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Oxfordshire County Council Local Transport and Connectivity Plan
source-text: When a proposal has significant transport implications; … Large scale residential, commercial
  developments, new educational premises. … Transport Statement/Assessment (essential)
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 20. A Transport Assessment
  is generally for large scale major development, a Transport Statement for smaller development. 'Significant
  transport implications' and 'large scale' are not defined, so shown as discretionary, except that the
  50+ dwellings checklist (https://www.cherwell.gov.uk/download/downloads/id/15907/full-planning-major-50---validation-checklist-form.pdf)
  marks it essential.
review-status: unverified
field-status: {}
