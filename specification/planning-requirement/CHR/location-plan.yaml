reference: location-plan
local-authority: CHR
required-if:
  always: true
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This plan is required to show us where the site is and on what land planning permission is
  being applied on.
must-include:
- item: Not a Land Registry document/plan (copyright); as up to date as possible OS based map
  level: must
- item: At an identified measurable scale of 1:1250 or 1:2500, with a scale bar and the scale indicated
    in writing on the drawing
  level: must
- item: Clearly marked with the direction of North
  level: must
- item: The full site, all site boundaries and adjoining properties
  level: must
- item: Application site and all land needed to carry out the development, including access from the highway,
    outlined in a continuous, unbroken red line
  level: must
- item: Any other land in the applicant's ownership or control adjacent to the site outlined in blue
  level: must
- item: A unique drawing reference
  level: must
- item: The original paper size (A4 or A3 etc.) shown on the drawing; uploaded/printed in colour
  level: must
- item: The copier's licence number with the copyright acknowledgement
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 7-8. Listed on every
  Validation Checklist Form.
review-status: unverified
field-status: {}
