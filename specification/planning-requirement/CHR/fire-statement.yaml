reference: fire-statement
local-authority: CHR
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: 'Measures to ensure the consideration of fire safety matters as part of the planning process
  which should be submitted with applications for: … proposals that contain two or more dwellings or educational
  accommodation and … meet the height condition of 18m or more in height, or 7 or more storeys'
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach relating to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on the fire safety of the development
  level: must
- item: How relevant development plan policies have been considered in the design
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 7.
review-status: unverified
field-status: {}
