reference: fire-statement
local-authority: CHR
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
source-text: 'addressed. 6.5 Fire Safety Statement 6.5.1 Measures to ensure the consideration of fire
  safety matters as part of the planning process which should be submitted with applications for: - proposals
  that contain two or more dwellings or educational accommodation and meet the height condition of 18m
  or more in height, or 7 or more storeys 6.5.2 Fire safety statement requirements: - the statement must
  be submitted on a form published by the Secretary of State (or a form to similar effect).'
must-include:
- item: Submitted on a form published by the Secretary of State (or a form to similar effect)
  level: must
