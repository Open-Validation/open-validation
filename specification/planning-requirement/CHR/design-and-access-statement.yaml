reference: design-and-access-statement
local-authority: CHR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
    - site:
        in:
        - conservation-area
        description: In a conservation area.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
source-text: '6.4 Design and Access Statement (DAS) 6.4.1 A concise and site-specific report accompanying
  applications for planning permission and listed building is required in the following cases: - all major
  development proposals (both full and outline applications) all listed building consent proposals one
  or more new dwellings in a Conservation Area a building or buildings with a floor space of 100 square
  metres or more.'
confidence: low
notes: 'Audit (wrong_trigger, not_a_requirement): most rows only repeated the forms'' ''if required''
