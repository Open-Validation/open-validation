reference: design-and-access-statement
local-authority: CHR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  - all:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: A building or buildings with a floor space of 100 square metres or more.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area (the designated-area rule in article 9 of the DMPO).
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A concise and site-specific report accompanying applications for planning permission and
  listed building is required in the following cases: … all major development proposals (both full and
  outline applications) … all listed building consent proposals … one or more new dwellings in a Conservation
  Area … a building or buildings with a floor space of 100 square metres or more.'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Shows the steps taken to appraise the context of the development and how the design takes that
    context into account
  level: must
- item: Explains the approach to access and how relevant Local Plan policies have been considered
  level: must
- item: Details any consultation on access issues and how its outcome informed the development
  level: must
- item: Explains how any specific issues which might affect access to the development have been addressed
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 6-7. The list's 100 sq
  m bullet doesn't repeat 'in a Conservation Area', but the national rule it summarises (DMPO article
  9) applies it only in designated areas, so it is shown that way.
review-status: unverified
field-status: {}
