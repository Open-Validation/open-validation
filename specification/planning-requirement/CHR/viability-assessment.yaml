reference: viability-assessment
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - condition:
      field: affordable-housing-below-target
      value: true
      description: You are not proposing to meet the minimum affordable housing policy requirements.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Local Plan 2011-2031 Part 1 (CLP 2015) policy BSC3; Developer Contributions SPD 2018
source-text: You will need to provide a viability statement if you are not proposing to meet the minimum
  policy requirements (detailed below).
must-include:
- item: Why you are unable to meet the affordable housing requirements
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 10. An independent consultant
  assesses the scheme and the viability statement.
review-status: unverified
field-status: {}
