reference: arboriculturist-report
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - demolition-con-area
      - consent-under-tpo
      - notice-trees-in-con-area
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: Protected trees on or adjacent to the site which would be impacted by the development.
    - all:
      - site:
          in:
          - conservation-area
          description: In a Conservation Area.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees on or adjacent to the site which would be impacted by the development.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are within or adjacent to the application site.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
source-text: If there are protected trees on or adjacent to the site, which would be impacted by the development;
  … In a Conservation Area, where there are trees on or adjacent to the site, which would be impacted
  by the development; … Where trees are within or adjacent to the application site.
must-include:
- item: BS5837 compliant tree survey where trees are present within or adjacent to the proposal
  level: must
- item: BS5837 compliant Arboricultural Impact Assessment where the proposal seeks to prune, remove or
    retain trees within or adjacent to the red line boundary
  level: must
- item: BS5837 compliant Arboricultural Method Statement where the proposal seeks to retain trees
  level: must
- item: Replanting plan where replacement tree planting is offered as mitigation for tree removals
  level: must
- item: Completed by a competent and fully qualified arboriculturalist
  level: should
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 20-21. The council calls
  it a Tree Survey, Report and Protection. Trees should also be shown on the block plan and highlighted
  on the application form. Listed on the householder, dropped kerb, full, outline/reserved matters, variation
  of condition, listed building consent and tree works checklists (https://www.cherwell.gov.uk/download/downloads/id/15908/tree-works---validation-checklist-form.pdf).
review-status: unverified
field-status: {}
