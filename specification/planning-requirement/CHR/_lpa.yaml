submission-standards:
- item: Plans drawn to scale, with the scale shown on the drawing; drawings marked 'Do not Scale' or similar
    will not be accepted
  level: must
- item: All drawings and plans on the same paper size (all A3 or all A4), with the original paper size
    shown on the drawings
  level: must
- item: A unique drawing reference on each drawing
  level: must
- item: No individual file larger than 10MB
  level: must
- item: All plans submitted as separate single-page PDF files; multipage PDF files will not be accepted
  level: must
- item: No signatures or personal information in documents or plans that would need redacting
  level: should
