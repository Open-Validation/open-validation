review-status: unverified
validation-list:
  url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
  date: 2026-03
  date-basis: 'Cover: ''March 2024'' (checklist forms and matrix also ''March 2024''; PDF created 8 November
    2024). The council''s ''Making a planning application'' page says the Local Validation Checklist requirements
    ''were updated in March 2024, reviewed in March 2026 and remain in place until 31 March 2028'', so
    the March 2026 review is used as the date. Used with the Validation Checklist Matrix, Appendix 1 (Ecology
    and Biodiversity Requirements) and the per-type Validation Checklist Forms linked from that page (https://www.cherwell.gov.uk/info/9/planning-and-building/1220/making-a-planning-application).
    No newer list is published there; the council''s committee site (modgov.cherwell.gov.uk) was blocked
    by the proxy, so the review decision itself could not be read.'
  status: current
submission-standards:
- item: All documents in PDF format when submitted electronically
  level: must
- item: No individual file larger than 10MB
  level: must
- item: All plans submitted as separate single-page PDF files; multipage PDF files will not be accepted
  level: must
- item: No .zip or .exe files
  level: must
- item: All documents correctly orientated
  level: must
- item: Plans drawn to a metric scale, with a scale bar and confirmation of the scale at the declared
    paper size
  level: must
- item: No disclaimers such as 'Do not Scale', 'Not to Scale' or 'Draft' on plans; drawings with them
    are invalid
  level: must
- item: Each plan/drawing has a descriptive title, e.g. existing rear (south) elevation
  level: must
- item: All drawings and plans on the same paper size (all A3 or all A4), with the original paper size
    shown, to be uploaded/printed in colour
  level: must
- item: A unique drawing reference on each drawing, for use in any decision notice
  level: must
- item: Documents and drawings accurately described when uploaded
  level: should
- item: CAD drawings exported to PDF 'flattened' to one layer
  level: should
- item: Personal or sensitive personal data submitted in a separate document, clearly marked confidential
  level: should
- item: No signatures or personal information in documents or plans that would need redacting; personal
    details (car registrations, people) removed from photographs
  level: should
- item: Submission through the Planning Portal strongly recommended; paper submissions discouraged
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: false
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the council''s current Validation Guidance: updated March 2024, reviewed
    March 2026 and valid to March 2028. The list date (PDF metadata, Nov 2024) and the ''outdated'' flag
    are wrong. The PDFs block automated fetching, so contents could not be fully re-checked. Grokbot''s
    own extracts show weak capture: tab items are mostly process text, application types are mis-mapped
    (prior approval, s73, dropped kerb) and many triggers are fragments or mislabelled. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: government "minded to" implement the Oxfordshire (incl. adjoining part of
  West Berkshire) proposal (announced 29 Oct 2026; final decision after >=3 weeks of representations).
  Not in force: council remains the LPA; new councils expected 2029 (shadow elections May 2028).'
