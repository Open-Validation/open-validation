reference: town-centre-impact-assessment
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Commercial or retail floor space over 2500 sq m.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail or commercial development outside main retail centres or any area designated
          for retail.
    - discretionary
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Local Plan 2011-2031 Part 1 (CLP 2015) policy SLE2; NPPF (Ensuring the Vitality of Town
  Centres)
source-text: All developments for commercial or retail floor space over 2500m … Other retail or commercial
  developments that will have a significant impact on their local areas … Retail or commercial development
  outside main retail centres or any area designated for retail by the Council
must-include:
- item: Sequential test assessment of alternative sites in town centres, local shopping areas and edge
    of centre locations, showing there are no more preferable sites
  level: must
- item: Approach to employment and skills (e.g. construction and operational jobs created, opportunities
    for local residents)
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 19. The council calls
  it a Retail Impact Assessment. Other developments with 'a significant impact on their local areas' are
  shown as discretionary. Listed on the non-residential, change of use, outline/reserved matters and variation
  of condition checklists.
review-status: unverified
field-status: {}
