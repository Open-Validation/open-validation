reference: lighting-assessment
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
      - advertising
  - condition:
      field: external-lighting
      value: true
      description: The application includes external lighting.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
source-text: All planning applications that include external lighting.
must-include:
- item: Layout plan showing the position and direction of the lights
  level: must
- item: Manufacturer's information, including luminance levels, security sensors, timers and switches
  level: must
- item: Details of any mitigation to reduce the impact of the lighting
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 15-16. Listed on the
  full, change of use, outline/reserved matters, variation of condition and advertisement checklists.
review-status: unverified
field-status: {}
