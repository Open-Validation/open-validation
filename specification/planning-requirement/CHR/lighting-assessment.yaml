reference: lighting-assessment
local-authority: CHR
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: The proposal includes external lighting.
  - condition:
      field: illuminated
      value: true
      description: The advertisement is illuminated.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15892/advertisement-consent---validation-checklist-form.pdf
source-text: Details of external lighting are required to ensure that external lights do not cause nuisance
  to nearby residences, create undue levels of light pollution, or damage the habitats of protected species,
  such as bats.
must-include:
- item: Luminance levels, security sensors, timers and switches
  level: must
- item: Details of any mitigation to reduce the impact of the lighting
  level: must
confidence: low
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. The must-include
  items are from the 6.19 text that the workbook filed as ''Advertisement drawings / illumination details''.
  Audit (wrong_app_type): the council''s matrix separates minor residential (<10), major residential (10-49),
  50+ units and non-residential <1ha / >1ha; those distinctions are lost here. The audit couldn''t read
  this council''s list, so its contents weren''t checked.'
review-status: unverified
field-status: {}
