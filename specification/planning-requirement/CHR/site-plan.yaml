reference: site-plan
local-authority: CHR
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - s73
    - lbc
    - advertising
    - cho-agri-to-dwh
    - cho-commercial-to-dwh
    - cho-commercial-to-mixed
    - cho-sui-to-dwh
    - cho-agri-to-flexcom
    - cho-agri-to-school
    - cho-comm-to-school
    - cho-amusements-to-dwh
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: We require this plan to identify the site and the proposed development in relation to its
  surroundings.
must-include:
- item: Up-to-date OS based map at an identified measurable scale of 1:500 or 1:200, with a scale bar
  level: must
- item: Clearly marked with the direction of North
  level: must
- item: Red edge of the site matches the location plan
  level: must
- item: The full site, all site boundaries, existing buildings, roads, tracks, historic features, ponds,
    watercourses and proposed boundary treatments
  level: must
- item: Any buildings to be removed
  level: must
- item: 'Access arrangements where relevant: access width, vision splays, existing and proposed vehicle
    parking and cycle parking'
  level: must
- item: Position of existing trees and hedges, including those that could be affected by the development,
    and those proposed to be removed
  level: must
- item: The original paper size (A4, A3 etc.) shown on the drawing; uploaded/printed in colour
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 8. The checklist forms
  list an 'Existing and Proposed Site/Block Plan' for every type except lawful development certificates.
review-status: unverified
field-status: {}
