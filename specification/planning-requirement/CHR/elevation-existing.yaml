source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: We require these plans to clearly show the proposed works in relation to what currently exists
  on the site.
must-include:
- item: At an identified measurable scale of 1:100 or 1:50, with a scale bar
  level: must
- item: Each elevation clearly marked with its direction, e.g. North elevation
  level: must
- item: All elevations shown in full unless otherwise agreed
  level: must
- item: Proposed building materials, style and finish, with window, door and rainwater goods details
  level: must
- item: A unique drawing reference
  level: must
- item: The original paper size (A4, A3 etc.) shown on the drawing; uploaded/printed in colour
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 9. Listed as 'Existing
  and Proposed Elevations' on the checklist forms for these types. The access or dropped kerb checklist
  (made as a full application) does not list them.
