reference: planning-statement
local-authority: CHR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings (the council's 'Major residential development' checklists).
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Dwellings on a site of 0.5 hectares or more.
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - outline
        - reserved-matters
        - s73
        - ldc
    - discretionary
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Local Plan and National Planning Policy Framework
source-text: The level of detail required for a planning statement depends on the scope and nature of
  development, the type of application and the sensitivity of the development’s location. … Planning Statement
  (essential) … Planning Statement (why the work is needed)
must-include:
- item: Written description and explanation of the proposal, with justification against key planning policies
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: minor-development
        value: true
        description: Minor application for full planning permission.
- item: Why any other submission documents are not required
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: minor-development
        value: true
        description: Minor application for full planning permission.
- item: Description of the site, its context and planning history
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
- item: Summary of relevant national and local policies/guidance and how the development accords or fails
    to accord with them
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
- item: Details of consultations with the wider community, local authority or statutory consultees
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
- item: Any other information materially relevant to planning not addressed in other submission documents
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
- item: How the proposed development differs from the approved scheme, and why the alterations are required
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Summary of relevant national and local planning policies/guidance adopted since the previous permission,
    and how the development accords or fails to accord with them
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Description of the site and its planning history, the use(s) or work(s) applied for, and why they
    are believed to be lawful
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
- item: Appendices of supporting evidence, e.g. sworn affidavits/statutory declarations, floor plans,
    council tax/utility bills, receipts/invoices, dated photographs
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
- item: Why the tree work is needed
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 18-19. Essential on the
  major residential checklists; on the tree works checklist (https://www.cherwell.gov.uk/download/downloads/id/15908/tree-works---validation-checklist-form.pdf)
  it is a national-list item ('why the work is needed'). For householder, other full, change of use, outline/reserved
  matters, variation of condition and lawful development certificate applications it 'may' be needed,
  so it is shown as discretionary.
review-status: unverified
field-status: {}
