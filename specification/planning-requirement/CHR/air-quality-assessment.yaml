reference: air-quality-assessment
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Inside or adjacent to an Air Quality Management Area (AQMA).
    - discretionary
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Air Quality Action Plan (2017)
source-text: Inside or adjacent to an Air Quality Management Area (AQMA); or … Where the development could,
  in itself, result in the designation of an AQMA; or … Where the grant of planning permission would conflict
  with, or render unworkable, elements of a local authority’s air quality action plan.
must-include:
- item: Assessment of the increase in air pollutants the development could cause, from the development
    itself or the extra traffic
  level: must
- item: Mitigation measures to reduce the impact on air quality
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 10-11. Developments that
  could themselves cause an AQMA designation or conflict with the air quality action plan are shown as
  discretionary. The council's Validation Checklist Forms (March 2024) list which documents each application
  type 'may also' need; only those marked '(essential)' are always needed. The minor residential (fewer
  than 10 dwellings) checklist doesn't list it.
review-status: unverified
field-status: {}
