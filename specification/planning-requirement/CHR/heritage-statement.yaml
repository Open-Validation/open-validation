reference: heritage-statement
local-authority: CHR
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - s73
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
        - consent-under-tpo
        - notice-trees-in-con-area
    - any:
      - site:
          in:
          - listed-building
          description: A listed building, or any land/building within the curtilage of a listed building.
      - site:
          in:
          - conservation-area
          description: Any building within a Conservation Area.
      - site:
          in:
          - scheduled-monument
          description: A Scheduled Monument.
      - site:
          in:
          - locally-listed-building
          description: A locally listed building.
      - site:
          in:
          - archaeological-priority-area
          description: An Archaeological Alert Area.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Conservation Area Appraisals
source-text: A listed building, or any land/building within the curtilage of a listed building (full list
  available on Historic England's website) … Any building within a Conservation Area … Scheduled Monument
  … Locally listed building … Archaeological Alert Area
must-include:
- item: Significance of the heritage asset, with evidence of its importance (maps, photos or documents)
    and details of its history and role in the local area
  level: must
- item: 'Impact: how the works will affect the heritage asset and its setting, with drawings, photos and
    maps'
  level: must
- item: 'Mitigation: measures to preserve the heritage asset and its setting, including details of materials
    and construction techniques'
  level: must
- item: Reference to the site's Historic Environment Record (HER)
  level: must
- item: Reference to the relevant Conservation Area Appraisals
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 14-15. Essential on the
  listed building consent checklist (https://www.cherwell.gov.uk/download/downloads/id/15898/listed-building-consent---validation-checklist-form.pdf);
  the checklist matrix row covers listed building consent and demolition in a conservation area.
review-status: unverified
field-status: {}
