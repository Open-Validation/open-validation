reference: land-contamination-assessment
local-authority: CHR
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: 50 or more new dwellings.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Non-residential/commercial development on a site greater than 1 hectare.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Non-residential/commercial development of more than 1000 sq m (the checklist matrix
            row 'More than 1000m2 / 1.0 hectare').
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
    - any:
      - site:
          in:
          - contaminated-land
          description: There are known contamination issues with the site.
      - condition:
          field: eia-development
          value: true
          description: The application is subject to an Environmental Impact Assessment.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
source-text: Applications where there are known contamination issues with the site; or … Applications
  subject to an Environmental Impact Assessment
must-include:
- item: Phase 1 desktop survey and Phase 2 intrusive site investigation (the two-stage process)
  level: must
- item: 'Where unacceptable risks to human health are identified: a further report with a suitable remediation
    scheme'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 12. The council's Validation
  Checklist Forms (March 2024) list which documents each application type 'may also' need; only those
  marked '(essential)' are always needed. The 50+ dwellings and non-residential over 1 hectare checklists
  mark it essential.
review-status: unverified
field-status: {}
