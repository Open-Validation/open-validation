reference: affordable-housing-statement
local-authority: CHR
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: The development consists of, or has capacity of, 11 dwellings or more.
source-url: https://www.cherwell.gov.uk/download/downloads/id/15909/validation-guidance.pdf
policy: Cherwell Local Plan 2011-2031 Part 1 (CLP 2015) policies BSC3 and Policy Villages 3; Developer
  Contributions SPD 2018
source-text: When do I need an affordable housing statement / viability statement? … The development consists
  of, or has capacity of, 11 dwellings or more; or
must-include:
- item: The overall level of affordable housing proposed
  level: must
- item: Number, size, types and tenure of the units
  level: must
- item: Plans showing the location of the affordable housing
  level: must
- item: Compliance with the Affordable Housing section of the Developer Contributions SPD
  level: must
confidence: medium
notes: From the council's list (published March 2024, reviewed March 2026), page 10. Policy BSC3 asks
  for 30% affordable housing at Banbury and Bicester and 35% at Kidlington and the rural areas. The council's
  Validation Checklist Forms (March 2024) list which documents each application type 'may also' need;
  only those marked '(essential)' are always needed. The major residential checklists (10 or more dwellings)
  mark it essential; the guidance's threshold of 11 dwellings is used.
review-status: unverified
field-status: {}
