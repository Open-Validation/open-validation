reference: water-impact-assessment
local-authority: WKF
required-if: discretionary
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policy LP67; Water Framework Directive
source-text: A water impact assessment with appropriate mitigation measures must be submitted for all
  ... applications which have the potential to result in water pollution – including during construction
  and/or demolition phases.
must-include:
- item: Appropriate mitigation measures
  level: must
- item: 'Impact on water bodies and groundwater: quantity, quality, the ecological features they support
    and their Water Framework Directive status or ability to achieve ''good'' status'
  level: should
- item: Any statutory requirements and relevant national planning policy
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Water Impact Assessment'. The list
  is a Word document without page numbers. 'Potential to result in water pollution' has no defined test,
  so discretionary.
