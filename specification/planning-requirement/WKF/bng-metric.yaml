reference: bng-metric
local-authority: WKF
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Subject to the general biodiversity gain condition (not exempt).
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by the following minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015 (as amended):'
must-include:
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed Statutory Metric calculations and the publication date and version of the
    metric
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
- item: A statement on whether the value is lower because of degradation, with supporting evidence if
    so
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
- item: 'Major and minor development: completed pre- and post-development sections (Statutory Metric,
    or Small Sites Metric for minor development)'
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the general biodiversity gain condition (not exempt).
- item: 'Major development: raw data calculations for all habitat types, free from errors and meeting
    the trading rules'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published September 2026), section 'Biodiversity Net Gain (BNG)'. The
  list is a Word document without page numbers. Exempt applications (householder and others) are exempt
  by law, so the rule is the biodiversity gain condition. The Initial Biodiversity Statement, Exemption
  Declaration Form, draft Biodiversity Gain Plan and Habitat Management and Monitoring Plan are in the
  unmapped list.
review-status: unverified
field-status: {}
