reference: bng-metric
local-authority: WKF
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
must-include:
- item: An Initial Biodiversity Statement (type and condition of existing on-site habitat, expected balance
    of on-site and off-site gains, how off-site gains will be secured, and whether statutory credits will
    be used)
  level: must
  source-text: An Initial Biodiversity Statement setting out the type and condition of existing onsite
    habitat, the expected balance of on-site gains and off-site gains, how any off-site net gains will
    be secured … and whether any statutory biodiversity credits are intended to be used for the development,
    taking account of the Biodiversity Gain Hierarchy.
- item: GIS shapefiles for pre- and post-development habitats
  level: must
  required-if:
    ref: major-development
- item: A Preliminary Ecological Appraisal, and an Ecological Impact Assessment where the habitat impact
    is substantial
  level: must
  required-if:
    ref: major-development
- item: A draft Biodiversity Gain Plan, Condition Assessment and draft 30-year Habitat Management and
    Monitoring Plan
  level: must
  required-if: discretionary
- item: The Statutory or Small Sites Metric and a habitat plan, showing at least 10% gain
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
confidence: medium
