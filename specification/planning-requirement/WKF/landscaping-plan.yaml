reference: landscaping-plan
local-authority: WKF
required-if:
  condition:
    field: landscaping-works
    value: true
    description: New landscaping, or changes to existing landscaping.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: For all applications which involve the provision of new landscaping, or changes to existing
  landscaping.
must-include:
- item: Existing trees, shrubs and other landscape features, showing which are retained and which removed
  level: must
- item: Plans, specifications and schedules for new or replacement planting
  level: must
- item: Existing and proposed levels and contours
  level: must
- item: Means of enclosure, walls, retaining walls and boundary treatments
  level: must
- item: Paving and other surface treatment, including car parking and circulation layouts
  level: must
- item: Landscape furniture, equipment, storage, signage and lighting
  level: must
- item: Services and drainage
  level: must
- item: The location of site cabins and compounds
  level: must
- item: Any watercourse and associated landscaping, existing and proposed
  level: should
- item: 'Where the development directly affects the Wildlife Habitat Network: measures to enhance ecological
    connectivity'
  level: must
  required-if: discretionary
- item: Cross-referenced with the Design and Access Statement and other documents
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Landscaping Information'. The list
  is a Word document without page numbers.
review-status: unverified
field-status: {}
