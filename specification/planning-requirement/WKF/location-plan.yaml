reference: location-plan
local-authority: WKF
required-if:
  always: true
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Location Plan is required for every application.
must-include:
- item: Normally at 1:1250 scale (other scales such as 1:2500 for larger sites)
  level: should
- item: Site edged clearly with a red line including all land needed to carry out the development (access
    from the public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: A blue line around any other land owned or controlled by the applicant close to or adjoining the
    site
  level: must
- item: Based on an up-to-date map, showing the names of two streets wherever possible
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Location Plan'. The list is a Word
  document without page numbers. These are local requirements in addition to the national ones.
review-status: unverified
field-status: {}
