reference: heritage-statement
local-authority: WKF
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - archaeological-priority-area
      - scheduled-monument
      - world-heritage-site
      - park-and-garden
      - locally-listed-building
      description: Development affecting historic assets (designated or non-designated).
  - application-type:
      in:
      - lbc
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: For all developments affecting Historic Assets (designated or non-designated). This includes
  Listed Buildings and Conservation Areas, Archaeological Sites, Scheduled Ancient Monuments, World Heritage
  Sites and Historic Parks and Gardens, and Buildings of Local Interest.
must-include:
- item: The Historic Environment Record held by West Yorkshire Archaeological Advisory Service consulted
    as a minimum
  level: should
- item: 'Listed building consent: a schedule of works, an analysis of significance (archaeology, history
    and character), the principles of and justification for the works and their impact on the listed building,
    its setting and adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Settings of heritage assets: plans showing historic features on or next to the site, with an
    analysis of significance'
  level: should
  required-if:
    site:
      in:
      - listed-building-setting
      - park-and-garden
      - scheduled-monument
      description: Related to or affecting the setting of heritage assets.
- item: 'Within or adjacent to a conservation area: an assessment of the impact on the character and appearance
    of the area'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a Conservation Area.
- item: 'Ground disturbance in an Area of Archaeological Potential (or major development / significant
    infrastructure elsewhere): an assessment of existing archaeological information'
  level: should
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: Area of Archaeological Potential.
confidence: medium
notes: From the council's list (published September 2026), section 'Heritage Statement'. The list is a
  Word document without page numbers. The list says the scope will vary with the circumstances and that
  most parts 'may be required', so they are 'should' items. The council's apply page also points to the
  West Yorkshire 'Brief for Heritage Statement'.
review-status: unverified
field-status: {}
