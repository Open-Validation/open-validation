reference: waste-management-plan
local-authority: WKF
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - lbc
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: All applications must be accompanied by a Waste Management Plan.
must-include:
- item: Designs and layouts allowing effective sorting, recycling and composting of waste
  level: should
- item: How the development can be served by appropriate waste collection methods
  level: should
- item: Design principles and construction methods encouraging recycled and secondary building materials
  level: should
- item: Construction, demolition and excavation methods that minimise waste and re-use/recycle materials
    on site
  level: should
- item: Community-based sorting, recycling and composting facilities where appropriate
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Waste Management Plan'. The list is
  a Word document without page numbers. Items are 'as appropriate'; for some developments the information
  can be on the plans or in the Design and Access / Planning Statement.
