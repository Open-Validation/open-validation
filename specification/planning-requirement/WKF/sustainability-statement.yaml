reference: sustainability-statement
local-authority: WKF
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - lbc
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policies SP24, LP32, LP33, LP34 and LP36
source-text: Applications must be accompanied by information to address the requirements of national planning
  policy, and the requirements of Local Plan Policies SP24, LP32, LP33, LP34 and LP36 insofar as these
  are relevant to the proposed development.
must-include:
- item: How energy and water efficiency has been considered (Policy LP33), and that opportunities to conserve
    energy and water through layout and design have been maximised
  level: should
- item: 'Non-residential development over 1,000 sq m: whether the BREEAM ''excellent'' standard has been
    achieved'
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Non-residential development over 1,000 square metres.
- item: 'New development with car parking: compliance with the Electric Vehicle Charging Point provision
    in Policy LP34'
  level: must
  required-if:
    condition:
      field: parking-spaces
      operator: '>'
      value: 0
      description: The development provides car parking spaces.
- item: Whether Policy LP36 applies and, if so, the district heating and cooling infrastructure provided
  level: must
confidence: medium
notes: From the council's list (published September 2026), section 'Environmental, Energy and Sustainability
  Statement'. The list is a Word document without page numbers. The energy assessment for larger schemes
  is filed as the energy statement.
review-status: unverified
field-status: {}
