reference: floor-plan-existing
local-authority: WKF
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: internal-works
      value: true
      description: Changes to existing buildings (other than external alterations to non-listed buildings).
  - condition:
      field: footprint-change
      value: true
      description: Extensions to existing buildings.
  - all:
    - site:
        in:
        - listed-building
        description: A listed building.
    - condition:
        field: external-alterations
        value: true
        description: External alterations.
  - condition:
      field: involves-change-of-use
      value: true
      description: Changes of use.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: Floor Plans must be provided for all applications which involve new buildings, changes to
  existing buildings (apart from applications which involve external alterations to non-listed buildings),
  or changes of use.
must-include:
- item: Normally at 1:50 or 1:100, with the scale clearly identifiable
  level: should
- item: The location of all doors and windows, existing and proposed
  level: must
- item: Internal walls, staircases, chimney breasts, columns and other structural features
  level: must
- item: The existing and/or proposed use of each room / area
  level: must
confidence: medium
notes: From the council's list (published September 2026), section 'Floor Plans'. The list is a Word document
  without page numbers. Existing floor plans for all relevant applications involving existing buildings.
review-status: unverified
field-status: {}
