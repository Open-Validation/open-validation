reference: energy-statement
local-authority: WKF
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Site area of 0.5 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 0.5
      description: Site area of 0.5 hectares or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 square metres or more of employment, commercial, leisure and community floor
        area (including conversions).
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policy LP32
source-text: All developments of 0.5 hectares or more in site area, or 10 or more dwellings, or 1,000
  square metres or more floor area for employment, commercial, leisure and community development (including
  conversions) must be accompanied by an Energy Assessment to demonstrate compliance with Local Plan Policy
  LP32.
confidence: medium
notes: From the council's list (published September 2026), section 'Environmental, Energy and Sustainability
  Statement'. The list is a Word document without page numbers. The list calls it an Energy Assessment.
