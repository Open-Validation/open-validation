reference: elevation-existing
local-authority: WKF
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Operational development.
  - condition:
      field: external-alterations
      value: true
      description: External alterations to existing buildings.
  - application-type:
      in:
      - advertising
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: Existing and Proposed Elevations must be provided for all applications which involve operational
  development and/or external alterations to existing buildings. (This includes applications for advertisement
  consent).
must-include:
- item: Every elevation of the building, even where no change is proposed to it
  level: must
- item: Normally at 1:50 or 1:100, with the scale clearly identifiable (each elevation's scale shown where
    a sheet has several)
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Elevations'. The list is a Word document
  without page numbers. Existing elevations only where there is an existing building.
review-status: unverified
field-status: {}
