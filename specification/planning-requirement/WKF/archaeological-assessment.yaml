reference: archaeological-assessment
local-authority: WKF
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: The site includes or impacts upon (or may include or impact upon) heritage assets with
        archaeological interest.
  - site:
      in:
      - design-improvement-area
      description: 'Within the Design Improvement Areas on the Policies Map: Pontefract Inset Map.'
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: 'Where a site on which development is proposed includes or impacts upon (or has the potential
  to include or impact upon) heritage assets with archaeological interest. ... Notwithstanding the above,
  all applications within the Design Improvement Areas identified in the Policies Map: Pontefract Inset
  Map must be accompanied by a desk-based archaeological assessment.'
must-include:
- item: An appropriate desk-based assessment and, where necessary, a field evaluation
  level: must
- item: A written statement with plans showing historic features, listed buildings and structures, historic
    parks and gardens, historic battlefields and scheduled ancient monuments
  level: must
- item: An analysis of the significance of archaeology, history and character, the principles of and justification
    for the works, and their impact on listed buildings and their settings
  level: must
confidence: medium
notes: From the council's list (published September 2026), section 'Archaeological Assessment'. The list
  is a Word document without page numbers.
review-status: unverified
field-status: {}
