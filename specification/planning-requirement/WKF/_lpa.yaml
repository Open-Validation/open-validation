  issues-open: 0
  notes: 'Grokbot''s reference link and 2015-12-01 date belong to the 2015 full/outline checklist; the
    current list is the docx headed ''Local Validation List September 2026''. Grokbot captured about 30
    of the list''s roughly 55 local items, but many triggers are cut-off fragments borrowed from nearby
    sections. Several requirements are missing entirely, including some that apply to all or all major
    applications (Crime and Safety, Flood Risk, Affordable Housing, Design Code Checklist, Green Belt,
    Road Safety Audit, minerals/waste). The application-type mapping is weak: most items are inferred
    into Full planning, Householder, Outline and Reserved matters are near-empty, and the s73 sheet is
    bare 2015 checklist names. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
