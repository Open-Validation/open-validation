  status: current
submission-standards:
- item: Plans show a plan number (with revision information where appropriate), the paper size and the
    scale
  level: must
- item: A scale bar and/or figured dimensions in addition to the stated scale, wherever possible
  level: should
- item: Where one sheet has drawings at different scales, each scale clearly indicated (next to each drawing
    wherever possible)
  level: must
- item: All drawings measure accurately at the indicated scale and correspond in their measurements
  level: must
- item: Electronic plans submitted as PDFs that can be measured electronically, and when printed at the
    indicated scale
  level: must
- item: Hand-drawn plans accepted only if they meet the minimum requirements for clarity and accuracy
    and measure accurately
  level: must
- item: Electronic files (drawings and supporting documents) no bigger than 5MB
  level: should
- item: 'Paper submissions: only one copy of all forms, plans and other supporting documents'
  level: must
audit:
  status: audited
