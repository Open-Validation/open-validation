source-text: Such sections will be requested where they are necessary to allow for a suitable assessment
  of the impact on, and relationship between buildings; or an assessment of levels (whether this is site
  levels, or the level of buildings). ... For applications where the Nationally Described Space Standard
  applies and/or must be considered, applications must be accompanied by section drawings for each house
  / house type.
