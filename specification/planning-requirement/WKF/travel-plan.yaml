reference: travel-plan
local-authority: WKF
required-if:
  any:
  - discretionary
  - all:
    - ref: major-development
    - condition:
        field: office-floorspace
        operator: '>'
        value: 0
        description: Major office development.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policy LP22
source-text: The National Planning Policy Framework establishes that all developments which will generate
  significant amounts of vehicular movement should be accompanied by a Travel Plan. In addition, Local
  Plan Policy LP22 requires that applications for major office development require the submission of a
  Travel Plan.
must-include:
- item: Specific required outcomes, targets and measures, with monitoring, timescales and management arrangements
  level: should
- item: Additional measures if the targets are not met
  level: should
- item: Explicit outcomes covering all journeys to and from the development
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Travel Plan'. The list is a Word document
  without page numbers. 'Significant amounts of vehicular movement' has no threshold, so discretionary.
review-status: unverified
field-status: {}
