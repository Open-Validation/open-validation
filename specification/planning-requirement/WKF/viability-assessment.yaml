reference: viability-assessment
local-authority: WKF
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The applicant argues exceptional circumstances where policy requirements cannot be met.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policy LP7
source-text: Where an applicant wishes to make a case for an exceptional circumstance where policy requirements
  cannot be met, a viability assessment must be submitted.
must-include:
- item: Based on, and refers back to, the Local Plan viability assessment, with evidence of what has changed
  level: must
- item: An electronic version of the viability appraisal that can be fully tested and interrogated
  level: must
- item: Agreement to pay for the council's assessment
  level: must
- item: 'Where contributions are reduced: how policy compliance can be achieved over time, with review
    triggers and terms in a draft Section 106 agreement'
  level: must
  required-if:
    condition:
      field: planning-obligations-shortfall
      value: true
      description: Contributions are reduced below policy requirements.
confidence: medium
notes: From the council's list (published September 2026), section 'Viability Information'. The list is
  a Word document without page numbers. Submitted viability information will be made public.
review-status: unverified
field-status: {}
