reference: air-quality-assessment
local-authority: WKF
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Inside, or adjacent to, an air quality management area (AQMA).
  - site:
      in:
      - air-quality-action-plan-area
      description: Where permission would conflict with, or render unworkable, elements of the air quality
        action plan.
  - discretionary
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policy LP67
source-text: In line with Local Plan Policy LP67, an appropriate pollution impact assessment must be submitted
  with all applications relating to developments which are likely to cause pollution and/or are likely
  to be exposed to potential sources of pollution. ... is proposed inside, or adjacent to an air quality
  management area (AQMA), ... where the development could in itself result in the designation of an AQMA
  ... where the grant of planning permission would conflict with, or render unworkable, elements of a
  local authority’s air quality action plan.
must-include:
- item: 'A detailed assessment of the likely sources of pollution: from the development, its use (e.g.
    traffic) or external sources affecting it'
  level: must
- item: Covers the construction and operational phases
  level: should
- item: Mitigation measures where relevant
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Pollution Assessment (including Air
  Quality Assessment)'. The list is a Word document without page numbers. Development likely to cause,
  or be exposed to, pollution, and development that could itself lead to an AQMA, show as discretionary.
review-status: unverified
field-status: {}
