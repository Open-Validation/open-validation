reference: land-contamination-assessment
local-authority: WKF
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Known contamination, or reason to suspect contamination.
  - condition:
      field: industrial-site
      value: true
      description: Former industrial uses.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development that could put people at risk of contamination (particularly sensitive
        uses such as family housing, allotments or children's nurseries).
  - discretionary
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: 'All applications for sites: ... Where there is known contamination; ... Where there are
  potential risks from radon gas, or ground gases; ... There is a reason to suspect contamination, such
  as the existence of former industrial uses, or other indications of potential contamination; ... Where
  the proposed development could give rise to a risk of contamination affecting any of the following receptors:'
must-include:
- item: A desk-based study of the available records relating to the site
  level: must
- item: An assessment of the previous uses of the site, their potential for contamination and the likelihood
    of harm to future users and the wider environment
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Land Contamination Assessment'. The
  list is a Word document without page numbers. Radon/ground gas risks and risks to controlled waters,
  watercourses and principal aquifers have no field yet, so they show as discretionary. Further investigation
  is likely if harm is confirmed.
review-status: unverified
field-status: {}
