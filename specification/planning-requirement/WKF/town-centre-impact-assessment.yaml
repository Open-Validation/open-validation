reference: town-centre-impact-assessment
local-authority: WKF
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure proposals outside a centre and not in accordance with the Local
        Plan.
  - any:
    - all:
      - any:
        - condition:
            field: settlement-type
            value: sub-regional city
            description: In a sub-regional city.
        - condition:
            field: settlement-type
            value: principal town
            description: In a principal town.
        - condition:
            field: settlement-type
            value: main town
            description: In a main town.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 700
          description: Gross external floorspace in excess of 700 square metres.
    - all:
      - any:
        - condition:
            field: settlement-type
            value: district centre
            description: In a District Centre.
        - condition:
            field: settlement-type
            value: local retail centre
            description: In a Local Retail Centre.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 300
          description: Gross external floorspace in excess of 300 square metres.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: 'An Impact Assessment is required for retail and leisure proposals which are outside of a
  centre, as defined on the Policies Map, and not in accordance with the Local Plan and have a gross external
  floorspace in excess of: ... 700 square metres for proposal in sub-regional cities, principal towns
  and main towns; ... 300 square metres for proposals in the District Centres and Local Retail Centres.'
confidence: medium
notes: From the council's list (published September 2026), section 'Retail Impact and Sequential Assessments'.
  The list is a Word document without page numbers. The sequential assessment is in the unmapped list.
review-status: unverified
field-status: {}
