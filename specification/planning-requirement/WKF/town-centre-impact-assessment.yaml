reference: town-centre-impact-assessment
local-authority: WKF
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses not within an existing centre or in accordance with an up-to-date
        plan.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 300
      description: More than 300 square metres gross external floorspace.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: Sequential Assessment A Sequential Assessment will be required for all proposals for main
  town centre uses with a gross external floorspace exceeding 300 square metres and which are not within
  an existing centre or in accordance with an up-to-date plan.
must-include:
- item: A Retail Impact Assessment, for retail and leisure proposals outside a defined centre that do
    not accord with the Local Plan (over 700 sq m gross external floorspace in sub-regional cities, principal
    towns and main towns; over 300 sq m in District and Local Retail Centres)
  level: must
  required-if: discretionary
confidence: medium
notes: 'Audit (missing_requirement): the Impact Assessment thresholds depend on the centre type, which
  no field expresses.'
review-status: unverified
field-status: {}
