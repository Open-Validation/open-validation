reference: biodiversity-survey-report
local-authority: WKF
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - special-area-of-conservation
      description: On or near designated nature conservation sites, including the Denby Grange Colliery
        Ponds SAC.
  - condition:
      field: hedgerows-affected
      value: true
      description: Impact on notable habitats such as hedgerows.
  - condition:
      field: near-woodland
      value: true
      description: Impact on woodland.
  - condition:
      field: near-watercourse
      value: true
      description: Impact on watercourses or wildlife corridors such as watercourses.
  - condition:
      field: pond-on-or-near-site
      value: true
      description: Impact on ponds or wetlands.
  - site:
      in:
      - priority-habitat
      description: Impact on notable habitats such as woodlands, wetlands and grasslands.
  - condition:
      field: protected-species
      value: true
      description: Possible impacts on protected and/or notable species and the places they use for shelter.
  - all:
    - ref: major-development
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Subject to the general biodiversity gain condition (not exempt).
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: 'An Ecology Assessment must be submitted for any application for development: ... On or near
  to designated nature conservation sites that may affect their biodiversity interests. ... Which will
  impact on notable habitats such as woodlands, hedgerows, water courses, ponds, wetlands and grasslands.
  ... Which may have possible impacts on protected and/or notable species of wildlife and the places they
  use for shelter. ... Which will have an adverse impact on wildlife corridors, for example watercourses.
  ... An Appropriate Ecological Assessment must be submitted for any application for development in proximity
  to the Denby Grange Colliery Ponds Special Area of Conservation.'
must-include:
- item: Existing habitats and species of ecological interest likely to be affected, and the short and
    long term impacts on them
  level: must
- item: Mitigation and enhancement measures where needed
  level: should
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: must
- item: A species-specific report (e.g. bats) where protected species may be affected, for example in
    a Bat Alert zone
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species may be affected.
- item: Measures to enhance ecological connectivity where the development directly affects the Wildlife
    Habitat Network
  level: must
  required-if: discretionary
- item: 'Major development subject to BNG: a Preliminary Ecological Appraisal, and an Ecological Impact
    Assessment where there is potential for a more substantial impact on habitats'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Subject to the general biodiversity gain condition (not exempt).
confidence: medium
notes: From the council's list (published September 2026), section 'Ecology Reports; Biodiversity Net
  Gain (BNG)'. The list is a Word document without page numbers. The Appropriate Ecological Assessment
  (designated sites or species of principal importance, and near the Denby Grange Colliery Ponds SAC)
  is included here.
review-status: unverified
field-status: {}
