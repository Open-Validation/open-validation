reference: floor-plan-proposed
local-authority: WKF
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: internal-works
      value: true
      description: Changes to existing buildings (other than external alterations to non-listed buildings).
  - condition:
      field: footprint-change
      value: true
      description: Extensions to existing buildings.
  - all:
    - site:
        in:
        - listed-building
        description: A listed building.
    - condition:
        field: external-alterations
        value: true
        description: External alterations.
  - condition:
      field: involves-change-of-use
      value: true
      description: Changes of use.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: Floor Plans must be provided for all applications which involve new buildings, changes to
  existing buildings (apart from applications which involve external alterations to non-listed buildings),
  or changes of use.
must-include:
- item: Normally at 1:50 or 1:100, with the scale clearly identifiable
  level: should
- item: The location of all doors and windows, existing and proposed
  level: must
- item: Internal walls, staircases, chimney breasts, columns and other structural features
  level: must
- item: The existing and/or proposed use of each room / area
  level: must
- item: 'Nationally Described Space Standard: bedrooms labelled single or double/twin'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, where the Nationally Described Space Standard applies.
- item: 'Nationally Described Space Standard: all storage areas, including built-in wardrobes'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, where the Nationally Described Space Standard applies.
- item: 'Nationally Described Space Standard: Gross Internal Area of each bedroom (sq m)'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, where the Nationally Described Space Standard applies.
- item: 'Nationally Described Space Standard: figured width of each bedroom (each part where the width
    varies)'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings, where the Nationally Described Space Standard applies.
- item: 'Where M4(2) and/or M4(3) homes are required: enough detail to show compliance'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published September 2026), section 'Floor Plans'. The list is a Word document
  without page numbers. The M4(2)/M4(3) item depends on the accessible housing policy thresholds, so it
  shows as discretionary.
review-status: unverified
field-status: {}
