reference: site-plan
local-authority: WKF
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings, including replacement buildings.
  - condition:
      field: footprint-change
      value: true
      description: Extensions to existing buildings (new built form).
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: A Block or Site Plan is required for all applications which include new built form. This
  includes extensions to existing buildings, and new buildings (including new buildings which are replacements
  for existing buildings in the same, or similar, location).
must-include:
- item: Scaled, usually at 1:500 (other scales may suit large sites)
  level: should
- item: The application site and proposed works in their immediate context, enough to assess impacts on
    adjoining and nearby sites
  level: must
- item: All neighbouring properties that may be affected, not just adjoining ones (including those across
    a highway)
  level: must
- item: Road names and property numbers where relevant
  level: must
confidence: medium
notes: From the council's list (published September 2026), section 'Block / Site Plan'. The list is a
  Word document without page numbers.
review-status: unverified
field-status: {}
