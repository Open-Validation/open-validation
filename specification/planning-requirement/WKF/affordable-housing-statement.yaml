reference: affordable-housing-statement
local-authority: WKF
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The application includes the provision of housing.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: Wakefield Local Plan policy SP6
source-text: Every major application which includes the provision of housing must be accompanied by details
  of the proposed Affordable Housing provision.
must-include:
- item: Shows how the development satisfies local and national planning policy
  level: must
- item: The exact type and number of affordable homes
  level: must
- item: A plan identifying the proposed affordable homes and their type / tenure
  level: must
confidence: medium
notes: 'From the council''s list (published September 2026), section ''Housing Information: Affordable
  Housing Information''. The list is a Word document without page numbers.'
review-status: unverified
field-status: {}
