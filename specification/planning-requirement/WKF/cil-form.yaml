reference: cil-form
local-authority: WKF
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellinghouses, including those created through a change of use.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 0
      description: New supermarkets or retail warehouses.
  - condition:
      field: cil-liable
      value: true
      description: Any other development which might give rise to a CIL liability.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
