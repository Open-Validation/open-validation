reference: arboriculturist-report
local-authority: WKF
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees (including street trees) within or adjacent to the site which may be affected.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows within or adjacent to the site which may be affected.
  - condition:
      field: near-woodland
      value: true
      description: Woodland within or adjacent to the site which may be affected.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: Where there are hedgerows and/or trees (including street trees) and/or woodland within, or
  adjacent to, the application site which may be affected by a proposed development.
must-include:
- item: In accordance with BS 5837:2012
  level: must
- item: A plan showing the position of every tree on or next to the site (including street trees) that
    could influence or be affected by the development, indicating which are to be removed
  level: must
- item: 'A schedule for every tree: the information in paragraph 4.4.2.5 of BS 5837:2012 and any proposed
    pruning, felling or other works'
  level: must
- item: 'For retained trees: changes to ground levels and excavations affecting the root protection area,
    changes in surfaces, services, demolition, and specific protection where RPA incursions are unavoidable'
  level: must
- item: A shade assessment where properties will be affected by trees
  level: must
  required-if: discretionary
- item: The effect on local amenity where trees are to be lost
  level: must
  required-if:
    condition:
      field: tree-removal
      value: true
      description: Trees are to be lost.
confidence: medium
notes: From the council's list (published September 2026), section 'Arboricultural Impact Assessment'.
  The list is a Word document without page numbers.
review-status: unverified
field-status: {}
