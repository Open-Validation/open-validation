reference: flood-risk-assessment
local-authority: WKF
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3 (national policy).
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Over 1 hectare in flood zone 1 (national policy).
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Over 1 hectare in flood zone 1 (national policy).
  - discretionary
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
policy: National Planning Policy Framework and Planning Practice Guidance (flood risk)
source-text: 'The following must be provided when they are required by Local Plan policies and/or National
  Planning Policy and Guidance: ... Flood Risk Assessment (https://www.gov.uk/guidance/flood-risk-assessment-for-planning-applications)'
must-include:
- item: 'Householder development: the council''s Householder Flood Risk Assessment questionnaire/template'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Householder Flood Risk Assessment, a template is available using the link
confidence: medium
notes: From the council's list (published September 2026), section 'Flood Risk Information and Assessments'.
  The list is a Word document without page numbers. The list defers to local and national policy and links
  GOV.UK's flood risk assessment guidance; the national triggers (flood zones 2 and 3, sites over 1 ha
  in flood zone 1) are shown, and other policy-led cases are discretionary. The sequential and exception
  tests are in the unmapped list.
