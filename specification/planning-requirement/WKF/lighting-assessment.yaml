reference: lighting-assessment
local-authority: WKF
required-if:
  condition:
    field: external-lighting
    value: true
    description: External lighting is proposed.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: For applications where external lighting is proposed
must-include:
- item: A layout plan showing the location of lighting
  level: must
- item: Beam orientation and light / lux levels
  level: must
- item: Height and design / specification of the lighting equipment
  level: must
- item: Proposed hours of operation
  level: must
- item: Adaptations informed by ecological surveys to reduce impacts on wildlife and minimise light spill
    (see Design Code 2.4c)
  level: must
confidence: medium
notes: From the council's list (published September 2026), section 'Lighting Assessment'. The list is
  a Word document without page numbers.
review-status: unverified
field-status: {}
