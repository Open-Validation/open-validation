reference: noise-assessment
local-authority: WKF
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Development that raises issues of disturbance by noise to occupants of nearby existing
        buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development close to existing sources of noise.
source-url: https://www.wakefield.gov.uk/media/lrcldwgq/local-validation-list.docx
source-text: Applications for developments that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and for developments that are considered to be noise sensitive and which
  are close to existing sources of noise.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Existing and potential sources of noise and how they may affect local amenity
  level: should
- item: How the developer intends to overcome these issues, with any mitigation measures
  level: should
confidence: medium
notes: From the council's list (published September 2026), section 'Noise Impact Assessment'. The list
  is a Word document without page numbers.
review-status: unverified
field-status: {}
