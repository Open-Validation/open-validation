reference: arboriculturist-report
local-authority: TAN
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees, woodland or hedges on the site or on adjacent sites within 15 metres of the site
      boundary.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policy CSP 18; Tandridge Local Plan 2014 policy DP7; Trees
  and Soft Landscaping Supplementary Planning Document (2017)
source-text: 'Applications where there are trees, woodland or hedges either on the development site or
  on sites adjacent to the development site within 15 metres of the site boundary. Householder checklist:
  All applications where there are trees/ hedges either on the development site or on the site adjacent
  to the development site.'
must-include:
- item: Tree survey schedule, tree survey plan and tree retention and removal plan to the latest revision
    of BS 5837, identifying trees on site and within 15m of the site boundary
  level: must
- item: 'Arboricultural Impact Assessment: trees to be retained, lost and planted, and the direct and
    indirect impact of the proposal on the site''s tree population'
  level: must
- item: Tree Protection Plan and outline Arboricultural Method Statement
  level: must
confidence: medium
notes: From the council's list (published 1 September 2025), page 5 of the Planning checklist. The householder
  checklist (page 2-3) asks for the same contents.
review-status: unverified
field-status: {}
