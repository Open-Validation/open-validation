reference: viability-assessment
local-authority: TAN
required-if:
  any:
  - all:
    - site:
        in:
        - rural-area
        - green-belt
        description: In a rural area and/or the Green Belt.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: Site of 0.5 hectares or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 0.5
            description: Site of 0.5 hectares or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site of 0.5 hectares or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.5
        description: Site of 0.5 hectares or more.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1000 square metres or more of new non-residential/commercial floorspace.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Planning Obligations and CIL guidance 2015; Surrey County Council Developer Contribution
  Guide 2020; RICS 'Assessing viability in planning under the NPPF 2019 (for England)'
source-text: 'Viability Assessment/ Statement: Applications for 10 or more dwellings or sites of or greater
  than 0.5 hectares. (rural areas and /or green belt) Applications for 15 or more dwellings and/ or sites
  of or greater than 0.5 hectares. Applications involving 1000 square metres or more of new non – residential/
  commercial floorspace. Affordable Housing Viability Assessment: Applications for 10 or more dwellings
  (rural areas) where the proposed affordable housing provision does not comply with the Affordable Housing
  target of 34%. Applications for 15 or more dwellings and/ or sites of or greater than 0.5 hectares (built
  up areas) where the proposed affordable housing provision does not comply with the Affordable Housing
  target of 34%.'
must-include:
- item: The planning contributions/community infrastructure improvements required for the development,
    and in full how the developer has assumed the development will be viable, including whether deferred
    obligations are proposed
  level: must
- item: A full statement of the financial viability of the scheme, showing why affordable housing cannot
    be provided in full to policy requirements
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Gross Development Value; Build Costs (QS Schedule); Land Value (existing use value plus); Residual
    values (including comparables); Commercial yields/rents (including comparables)
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Competitive return to developers; Professional Fees/Marketing costs
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Evidence and benchmarks to support all values and costs, and justification for all assumptions
    used
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: A viability assessment model capable of full interrogation by the Council and its advisor
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Fully itemised S106 Heads of Terms and Community Infrastructure Levy (CIL); any capital/grant
    contributions
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Build/sale programme and details of any Registered Housing Provider
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Scenario testing of the deliverability of the development if the assessment shows a deficit
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
- item: Completed Written Consent Form to fund in full the costs of a viability appraisal by an RICS qualified
    surveyor
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The proposed affordable housing provision does not comply with the Affordable Housing
        target of 34%.
confidence: medium
notes: From the council's list (published 1 September 2025), page 2-3, 28 of the Planning checklist. Combines
  the list's item 39 (Viability Assessment/Statement) with item 2 (Affordable Housing Viability Assessment);
  item 2's contents apply where affordable housing falls short of the 34% target. Item 2 contents are
  'should include'.
review-status: unverified
field-status: {}
