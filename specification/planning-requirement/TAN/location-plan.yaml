reference: location-plan
local-authority: TAN
required-if:
  application-type:
    in:
    - hh
    - ldc
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Validation%202034/Householder-Local-Validation-Requirements-and-Checklist-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (article 39
  for lawful development certificates)
source-text: 'All applications. Planning checklist (Lawful Development Certificate): Application for certificate
  of lawfulness existing or proposed use.'
must-include:
- item: Drawn to an identified scale and shows the direction of north
  level: must
- item: Based on an up-to-date map, typically at 1:1250 or 1:2500, scaled to fit A4 or A3 paper where
    possible
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: 'Where two or more uses, operations or other matters are specified: which part of the land each
    relates to'
  level: must
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: 'From the council''s list (published 1 September 2025), page 12-13 of the Householder checklist.
  Lawful development certificates: Planning checklist page 18-19. The Planning checklist doesn''t list
  a location plan for other application types (it is a national requirement).'
review-status: unverified
field-status: {}
