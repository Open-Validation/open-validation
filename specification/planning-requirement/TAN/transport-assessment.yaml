reference: transport-assessment
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10 units and above.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Non-residential floorspace of 500 square metres and above.
  - condition:
      field: traffic-movements-peak-hour
      operator: '>'
      value: 30
      description: More than 30 two-way vehicle movements per hour entering or leaving a classified/trunk
        road.
  - condition:
      field: traffic-movements-daily
      operator: '>'
      value: 100
      description: More than 100 two-way vehicle movements per day entering or leaving a classified/trunk
        road.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 100
      description: More than 100 parking spaces.
  - discretionary
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Local Plan 2014 policy DP5 (Highway Safety Design)
source-text: 'Applications involving: Residential development of 10 units and above. Non-residential floorspace
  of 500 square metres and above Any development that is likely to generate an increase in the number
  of HGV vehicle movements. Any development that is likely to result in a material increase in traffic
  entering or leaving a classified/trunk road (where there are more than 30 2-way vehicle movements per
  hour or more than 100 2-way vehicle movements per day or more than 100 parking spaces are proposed)'
must-include:
- item: Existing transport conditions at the site and details of the development proposals
  level: should
- item: How the development will reduce the need to travel, particularly by car
  level: should
- item: How the development will promote/improve accessibility to public transport, cycling and walking
  level: should
confidence: medium
notes: From the council's list (published 1 September 2025), page 25-26 of the Planning checklist. 'Likely
  to generate an increase in HGV movements' has no threshold, so it shows as discretionary. The traffic
  thresholds apply to classified or trunk roads.
review-status: unverified
field-status: {}
