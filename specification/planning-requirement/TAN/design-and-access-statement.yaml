reference: design-and-access-statement
local-authority: TAN
required-if:
  all:
  - application-type:
      in:
      - hh
  - site:
      in:
      - conservation-area
      description: Within a Conservation Area.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: A building with a floorspace of 100 square metres or more.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Validation%202034/Householder-Local-Validation-Requirements-and-Checklist-2025.pdf
source-text: Applications (except applications to amend the conditions attached to a planning permission)
  within a Conservation Area where the proposal consists of a building with a floorspace of 100 square
  metres or more.
must-include:
- item: Explains how the development is a suitable response to the site and its setting
  level: should
confidence: medium
notes: From the council's list (published 1 September 2025), page 6 of the Householder checklist. The
  Planning checklist doesn't list a design and access statement (it is a national requirement).
review-status: unverified
field-status: {}
