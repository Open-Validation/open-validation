reference: construction-management-plan
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 1000
      description: Floorspace in excess of 1000 square metres.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - demolition-con-area
        - lbc
        - advertising
        - ldc
        - prior-approval
    - any:
      - condition:
          field: demolition
          value: true
          description: Involves demolition.
      - condition:
          field: ground-disturbance
          value: true
          description: Involves excavation.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Local Plan 2014 policy DP22 (Minimising Contamination, Hazards and Pollution)
source-text: Applications for 10 or more dwellings or floorspace in excess of 1000 square metres and/or
  any applications that involve demolition/excavation.
must-include:
- item: Control of construction noise and vibration during hours of noisy activities
  level: must
- item: Construction waste and material management, transportation and disposal strategy
  level: must
- item: Air quality measures to control and monitor dust, fine particles and odours
  level: must
- item: Construction traffic routing through the area and the site, with signage and an enforcement system
    for breaches
  level: must
- item: Piling or other penetrative foundation methods in relation to risks to underlying groundwater
  level: must
- item: Measures to protect controlled waters from construction processes and contamination
  level: must
- item: Measures to deal with unexpected contamination on site
  level: must
- item: Security of the construction site in relation to adjacent sites
  level: must
- item: How disturbance to residents will be minimised
  level: must
confidence: medium
notes: From the council's list (published 1 September 2025), page 8-9 of the Planning checklist. Not in
  the householder checklist.
review-status: unverified
field-status: {}
