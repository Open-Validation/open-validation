reference: energy-statement
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Non-residential development with a floor area of 500 square metres and above.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policy CSP 14 (Sustainable Construction)
source-text: Applications for residential development All applications for non-residential development
  with floor area of 500 square metres and above.
must-include:
- item: Full details, including plans and technical information, showing carbon dioxide savings in line
    with Policy CSP 14
  level: must
- item: Full details of combined heat and power (or similar technology), with the carbon dioxide saving
    and other benefits
  level: must
- item: 'Where these are not proposed: a detailed justification of alternative provision achieving similar
    carbon dioxide savings'
  level: must
- item: 'Where not provided on viability or other grounds: a detailed justification and the Written Consent
    Form to fund in full a viability appraisal by an RICS qualified surveyor'
  level: must
confidence: medium
notes: From the council's list (published 1 September 2025), page 22-23 of the Planning checklist. The
  list calls it a 'Renewable Energy Assessment'.
review-status: unverified
field-status: {}
