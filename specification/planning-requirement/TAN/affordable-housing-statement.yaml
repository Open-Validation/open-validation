reference: affordable-housing-statement
local-authority: TAN
required-if:
  any:
  - all:
    - site:
        in:
        - rural-area
        description: In a rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings (built up areas).
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: Site greater than 0.5 hectares (built up areas).
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policies CSP 4 (Affordable Housing) and CSP 5 (Rural Exceptions)
source-text: Applications for 10 or more dwellings (rural areas) Applications for 15 or more dwellings
  and/ or sites greater than 0.5 hectares (built up areas)
must-include:
- item: 'Full details of the affordable housing units proposed: the mix of units in both tenures, bedroom
    numbers and floorspace'
  level: must
- item: A plan showing the location of the units, broken down by tenure type
  level: must
- item: Details of the Registered Social Landlord and of contact with the Council's Housing Enabling Service
  level: must
- item: Draft Heads of Terms for the S106 agreement to secure the affordable housing
  level: must
confidence: medium
notes: From the council's list (published 1 September 2025), page 2 of the Planning checklist. The 0.5
  hectare site threshold is listed for built up areas; the list doesn't say whether it also applies in
  rural areas.
review-status: unverified
field-status: {}
