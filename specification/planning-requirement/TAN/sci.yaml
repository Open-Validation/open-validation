reference: sci
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: New commercial development (or change of use) of 1000 square metres or more.
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: Site area exceeding 0.5 hectares where it is not known how many dwellings are to
          be created.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.5
        description: Site area exceeding 0.5 hectares where it is not known how many dwellings are to
          be created.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development on a site area of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development on a site area of 1 hectare or more.
  - application-type:
      in:
      - mineral-extraction
      - waste-dev
  - all:
    - application-type:
        in:
        - s73
    - ref: major-development
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
source-text: Applications for 10 or more residential units, new commercial development (or change of use)
  of 1000 square metres or more, site area exceeding 0.5 hectares where it is not known how many dwellings
  are to be created, development on site area of 1 hectare or more, applications for winning and working
  of minerals, waste development, applications to amend or remove a condition relating to the grant of
  planning permission for any major development.
confidence: medium
notes: From the council's list (published 1 September 2025), page 23-24 of the Planning checklist. The
  list gives no contents beyond showing early, proactive engagement with the community.
review-status: unverified
