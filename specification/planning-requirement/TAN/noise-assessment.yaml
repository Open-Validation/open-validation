reference: noise-assessment
local-authority: TAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
  - any:
    - condition:
        field: plant-equipment
        value: true
        description: External plant equipment.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New noise sensitive development (e.g. residential) in an area with high levels of
          noise, or which could cause existing nearby uses to curtail their activities (agent of change).
    - condition:
        field: noise-generating-use
        value: true
        description: Development that could affect noise sensitive receptors (residential, hospital, hotel,
          hostel, educational uses), or whose scale and type could increase noise levels.
    - condition:
        field: food-or-drink-use
        value: true
        description: Cooking on the premises, odour abatement measures or a commercial kitchen (Ventilation/Extraction
          details).
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
source-text: 'A noise impact assessment is required for: proposals for external plant equipment. the proposed
  creation of new noise sensitive development (e.g. residential) in areas that suffer from high levels
  of noise. proposed developments that could affect noise sensitive receptors such as residential use,
  hospital, hotel, hostel, and educational uses proposals that could cause existing nearby uses to have
  to curtail their activities (agent of change principle). proposals where the scale and type of development
  could cause an increase in noise levels. (Ventilation/ Fume/ Odour/ Noise Extraction Details: Any application
  that involves cooking on the premises Any application that may require the use of odour abatement measures
  or developments that include a commercial kitchen. A noise and odour assessment should be submitted.)'
must-include:
- item: Size, design and location of any plant, proposed operating hours and the manufacturer's specification
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: External plant.
- item: Baseline survey of ambient and background noise logged in 15-minute intervals over a representative
    period (LAFmax and octave data where necessary); background as the lowest LA90,15min over the proposed
    operating hours for plant
  level: must
- item: 'Noise generated by the development: measured and/or calculated sound pressure level, LAeq for
    the 16 daytime hours and the 8 night-time hours if operating at night, and LAFmax where necessary'
  level: must
- item: How the noise relates to existing background levels, with time, date, weather, instrumentation
    and calibration, sampling locations and a copy of the survey data
  level: must
- item: Location of the most relevant noise sensitive receptors
  level: must
- item: Predicted noise level 1 metre from the window of the nearest sensitive receptor and the mitigation
    measures, with attenuation performance specifications
  level: must
confidence: medium
notes: From the council's list (published 1 September 2025), page 20-21 of the Planning checklist. Uses
  BS 8233:2014. Also covers the noise and odour assessment the list's item 40 (Ventilation/Extraction
  Details, page 28) asks for. The Gypsy and Traveller statement (page 14) adds a noise survey where electricity
  is supplied by generators (see TAN-unmapped.csv).
review-status: unverified
field-status: {}
