reference: waste-management-plan
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Commercial development.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Construction of 10 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Construction of new floorspace of 1,000 square metres or more.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of a site with an area of 1 hectare or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of a site with an area of 1 hectare or greater.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Surrey Waste Local Plan 2020; Tandridge Waste Storage Standards 2020; The Waste (England and Wales)
  Regulations 2011
source-text: 'All applications for residential or commercial development. A Site Waste Management Plan''
  (SWMP) is required to be submitted for all new development in the following categories: Development
  involving the construction of 10 or more dwellings. Development involving the construction of new floorspace
  of 1,000 square metres or more. Development of a site with an area of 1 hectare or greater. Or as otherwise
  provided in the Town and Country Planning (Development Management Procedure) (England) Order 2015.'
must-include:
- item: Appropriate on-site arrangements for the storage and collection of recycling and general waste
  level: must
- item: Site Waste Management Plan showing by type the volume or amount of Construction, Demolition and
    Excavation waste, Commercial and Industrial waste and Local Authority Collected Waste
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Construction of 10 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Construction of new floorspace of 1,000 square metres or more.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of a site with an area of 1 hectare or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of a site with an area of 1 hectare or greater.
- item: How the proposal follows the Waste Hierarchy (prevention, preparing for re-use, recycling, other
    recovery, disposal)
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Construction of 10 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Construction of new floorspace of 1,000 square metres or more.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of a site with an area of 1 hectare or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of a site with an area of 1 hectare or greater.
