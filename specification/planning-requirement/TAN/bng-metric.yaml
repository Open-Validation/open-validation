reference: bng-metric
local-authority: TAN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Not subject to exemptions and/or transitional arrangements which disapply the general
      biodiversity gain condition.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Schedule 7A, Town and Country Planning Act 1990 (as inserted by Schedule 14 of the Environment
  Act 2021)
source-text: All applications not subject to exemptions and/ or transitional arrangements which disapply
  the general condition, as determined with reference to national requirements including The Environment
  Act 2021, Secondary Legislation, and statutory guidance.
must-include:
- item: The statutory biodiversity metric (or later statutory version), with the baseline and post-intervention
    biodiversity value of the onsite habitat
  level: should
- item: Baseline and post-intervention values for offsite biodiversity gains, where applicable
  level: should
- item: BNG report following CIEEM guidance
  level: should
confidence: medium
notes: From the council's list (published 1 September 2025), page 7-8 of the Planning checklist. The list
  asks for a 'Biodiversity Net Gain Report' that includes the statutory metric.
