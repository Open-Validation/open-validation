reference: archaeological-assessment
local-authority: TAN
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: Within or likely to affect a County Site of Archaeological Importance or an Area of
        High Archaeological Potential (AHAP).
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.4
          description: Site larger than 0.4 hectares (outside those areas).
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.4
          description: Site larger than 0.4 hectares (outside those areas).
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a change of use.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Local Plan 2014 policy DP20 (Heritage Assets)
source-text: Sites within or likely to affect a County Site of Archaeological Importance or an Area of
  High Archaeological Potential (AHAP). All planning applications (except changes of use) where the site
  is larger than 0.4 hectares and is located outside these areas.
must-include:
- item: Identification and assessment of the significance of any archaeological heritage assets that may
    be affected
  level: must
- item: Discussion of the impact of any previous groundworks across the site
  level: must
- item: Appropriately detailed information on the nature of all groundworks involved and their likely
    impact on surviving archaeological horizons
  level: must
confidence: medium
notes: From the council's list (published 1 September 2025), page 5-6 of the Planning checklist. The householder
  checklist (page 11) asks for a DBA, with the same contents, where a site includes or could affect heritage
  assets with archaeological interest.
review-status: unverified
field-status: {}
