reference: heritage-statement
local-authority: TAN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - conservation-area
      - locally-listed-building
      - historic-environment-record
      description: Adjacent to or would affect the setting of a designated (Listed Buildings, Scheduled
        Ancient Monuments, Historic Parks and Gardens, Conservation Areas) or non-designated (non-scheduled
        archaeological sites, locally listed buildings) heritage asset.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - demolition-con-area
        - lbc
        - advertising
        - ldc
        - prior-approval
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: A non-residential application.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: An area of archaeological potential/significance.
    - condition:
        field: ground-disturbance
        value: true
        description: The ground will be disturbed.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - archaeological-priority-area
        description: Within or likely to affect a County Site of Archaeological Importance or an Area
          of High Archaeological Potential (AHAP).
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Local Plan 2014 policy DP20 (Heritage Assets)
source-text: 'Applications for Listed Building Consent Planning applications that involve development
  that is adjacent to or would affect the setting of a designated (Listed Buildings, Scheduled Ancient
  Monuments (SAMs), Historic Parks and Gardens, Conservation Areas) or non-designated (non-scheduled archaeological
  sites, locally listed buildings) heritage asset. All non-residential applications. Where the ground
  will be disturbed within an area of archaeological potential/ significance. All applications involving
  ground disturbance within an area of potential archaeological significance, an assessment of existing
  archaeological information, and a programme of fieldwork may be required. Householder checklist: Sites
  within or likely to affect a County Site of Archaeological Importance or an Area of High Archaeological
  Potential (AHAP).'
must-include:
- item: Analysis and assessment of the special interest of the heritage assets, including any contribution
    made by their setting
  level: must
- item: Assessment of the potential impact of the proposals on the special interest, significance and
    qualities identified
  level: must
- item: The historic environment record consulted, and heritage assets assessed with appropriate expertise
    where necessary
  level: must
- item: Significance of the architectural and historical interest and character of the building or structure;
    principles of and justification for the works; impact on the listed building, its setting and the
    setting of adjacent listed buildings
  level: must
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      description: Affects a listed building or its setting.
- item: Sources considered, heritage expertise consulted, steps taken to avoid or minimise heritage harm,
    and any public benefits (including heritage benefits)
  level: must
- item: Schedule of proposed works
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Extensive works/alterations to a listed building.
- item: Archaeological Desk Based Assessment
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: The site includes, or has the potential to include, heritage assets with archaeological
        interest.
confidence: medium
notes: From the council's list (published 1 September 2025), page 16-17 of the Planning checklist. Householder
  checklist page 9-11. 'All non-residential applications' is the council's wording; it is shown as any
  non-residential floorspace.
review-status: unverified
field-status: {}
