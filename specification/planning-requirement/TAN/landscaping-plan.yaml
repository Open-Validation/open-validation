reference: landscaping-plan
local-authority: TAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: external-space
          value: true
          description: Creates new private space.
      - condition:
          field: loss-of-habitat-features
          value: true
          description: Results in the loss of existing landscaping.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policies CSP 20 (Areas of Outstanding Natural Beauty) and
  CSP 21 (Landscape and Countryside); Harestone Valley Design Guidance; Woldingham Design Guidance
source-text: 'Required for major and minor development including outline and S73 applications. Householder
  checklist: Landscaping details and plans required for development creating new private space or resulting
  in the loss of existing landscaping.'
must-include:
- item: 'For new public realm: long term management plans/arrangements'
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
- item: 'Where green roofs and walls are proposed: landscaping details/management plan'
  level: should
- item: All existing trees and areas of planting, and proposed trees and planting (size, species, density
    and position)
  level: should
- item: Existing and proposed boundary treatments, pathways and paving areas
  level: should
- item: A Landscape Visual Impact Assessment in specially designated landscape areas
  level: should
  required-if:
    all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: A specially designated landscape area.
    - discretionary
confidence: medium
notes: From the council's list (published 1 September 2025), page 17-18 of the Planning checklist. Householder
  checklist page 12. A Landscape Visual Impact Assessment 'may be required', so that item shows as discretionary.
review-status: unverified
field-status: {}
