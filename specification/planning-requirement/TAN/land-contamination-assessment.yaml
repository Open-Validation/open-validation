reference: land-contamination-assessment
local-authority: TAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination on the site or an adjacent site is known or suspected (including former
          equestrian/agricultural/industrial uses, any car repairs/petrol station).
    - all:
      - site:
          in:
          - contaminated-land
          description: In the vicinity of known or suspected contaminated land.
      - condition:
          field: sensitive-end-use
          value: true
          description: A use vulnerable to contamination, e.g. residential use/school/hospital.
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Ground disturbance or changes to the groundwater regime.
      - discretionary
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Local Plan 2014 policy DP22 (Minimising Contamination, Hazards & Pollution)
source-text: Applications where (i) contamination (on the development site or an adjacent site) is either
  known or suspected (including former equestrian/agricultural/industrial uses, any car repairs/petrol
  station). And/ or (ii) the development is within the vicinity of contaminated land (either known or
  suspected) and the development is particularly vulnerable to contamination e.g. residential use/ school/hospital)
  And/ or applications where there would be any ground disturbance or changes to the groundwater regime.
must-include:
- item: Desk top study or enough information to determine whether contamination exists, its nature, the
    risks it may pose, and whether these can be reduced to an acceptable level without undue environmental
    impact during and after development
  level: must
confidence: medium
notes: 'From the council''s list (published 1 September 2025), page 17 of the Planning checklist. Ground
  disturbance or groundwater changes on their own show as discretionary: the list joins them with ''and/or''
  and doesn''t say whether they apply without contamination.'
review-status: unverified
field-status: {}
