    - reserved-matters
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policy CSP 15 (Environmental Quality)
source-text: 'All planning applications for major and non-major development. Including change of use to
  a more vulnerable class e.g., to a residential use including mobile homes. As required by NPPF paragraph
  182. Householder checklist: All applications should as a minimum include a statement which details how
  surface water will be controlled on site.'
must-include:
- item: How surface water will be managed on site and how the proposals will not increase surface water
    flood risk on or off site
  level: must
- item: Shows the drainage hierarchy has been considered for managing surface water
  level: must
- item: How Sustainable Drainage Systems (SuDS) have been used on site, proportionate to the scale of
    the development
  level: should
confidence: medium
notes: From the council's list (published 1 September 2025), page 12-13 of the Planning checklist. Required
  'irrespective of whether a Flood Risk Assessment is required'; the details column says '(where relevant)'.
  Householder checklist page 8.
