reference: flood-risk-assessment
local-authority: TAN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Development in Flood Zones 2 and 3.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more (Flood Zone 1).
  - site:
      in:
      - critical-drainage-area
      description: Land identified by the Environment Agency as having critical drainage problems.
  - discretionary
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policy CSP 15 (Environmental Quality)
source-text: 'All development in Flood Zones 2 and 3. In Flood Zone 1, an assessment should accompany
  all proposals involving: sites of 1 hectare or more; land which has been identified by the Environment
  Agency as having critical drainage problems; land identified in a strategic flood risk assessment as
  being at increased flood risk in future; or land that may be subject to other sources of flooding, where
  its development would introduce a more vulnerable use. Householder checklist: Applications on sites
  of 1 hectare or more. All applications involving development in Flood Zone 2 and/or 3'
must-include:
- item: Meets the minimum requirements of the technical guidance to the NPPF, including the sequential
    and exception tests where necessary
  level: must
- item: Identifies and assesses the risks of all forms of flooding to and from the development and shows
    how they will be managed so it stays safe for its lifetime, taking climate change into account
  level: should
- item: Identifies opportunities to reduce flood risk from all sources
  level: should
- item: A surface water drainage strategy (within the FRA or stand-alone) showing surface water managed
    with multifunctional SuDS in line with the NPPF and Non-Statutory Technical Standards
  level: should
confidence: medium
notes: From the council's list (published 1 September 2025), page 12-13 of the Planning checklist. Householder
  checklist page 8-9. Land at increased future flood risk in the strategic flood risk assessment, and
  other sources of flooding where a more vulnerable use is introduced, show as discretionary.
review-status: unverified
field-status: {}
