reference: travel-plan
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10 units and above.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Non-residential floorspace of 500 square metres and above.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge Local Plan 2014 policy DP5 (Highway Safety Design)
source-text: 'Applications involving: - Residential development of 10 units and above Non-residential
  floorspace of 500 square metres and above.'
must-include:
- item: Accessibility of the site by all modes of transport
  level: should
- item: Likely modal split of all journeys to and from the site
  level: should
- item: Measures to improve access to public transport, walking and cycling and reduce the use of private
    vehicles
  level: should
