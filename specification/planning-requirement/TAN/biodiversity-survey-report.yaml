reference: biodiversity-survey-report
local-authority: TAN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Not a change of use only.
    - site:
        in:
        - site-of-special-scientific-interest
        - ancient-woodland
        description: Within 2km of a Site of Special Scientific Interest (SSSI) or ancient woodland.
  - condition:
      field: protected-species
      value: true
      description: Development likely to impact existing habitats/species, including protected/priority
        species, designated sites or priority, notable or irreplaceable habitats.
  - condition:
      field: demolition
      value: true
      description: Part or full demolition.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Loss of trees or hedges.
  - condition:
      field: near-watercourse
      value: true
      description: Development within 0.5 km of waterways or ponds.
  - discretionary
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Tandridge District Core Strategy 2008 policy CSP17 (Biodiversity); Natural Environment and Rural
  Communities Act 2006
source-text: 'A Biodiversity Survey is required for: Applications (except applications for Advertisement,
  Listed Building Consent, change of use only) within 2km of a Site of Special Scientific Interest (SSSI)
  or ancient woodland. The Applications where development is likely to impact existing habitats/species
  including protected/ priority species, or designated sites and priority, notable or irreplaceable habitats,
  or any other likely significant ecological effect upon important ecological features. This includes
  proposals for part/ full demolition, development that involves the loss of trees/ hedges and development
  adjacent to (within 0.5 km of) waterways/ ponds. Householder checklist: Applications where the completion
  of the Biodiversity Checklist indicates that a survey must be completed.'
must-include:
- item: A Species Survey and Assessment or an Ecological Survey and Assessment
  level: must
- item: Conforms to CIEEM best practice guidelines and BS 42020:2013, with any deviations made clear and
    justified
  level: should
- item: Any further ('phase 2') survey recommended by a preliminary ecological report completed in full
    with an assessment report, or justification for why not
  level: must
- item: Carried out by qualified professionals who are members of an appropriate professional body such
    as CIEEM, with the right experience, survey licences and competence
  level: should
- item: Species-specific biodiversity enhancements appropriate to the site, such as integrated nesting
    and roosting features on proposed buildings
  level: should
- item: Shows that the development would achieve biodiversity net gain unless it falls within an exemption
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published 1 September 2025), page 6-7 of the Planning checklist. Householder
  checklist page 3-5. 'Any other likely significant ecological effect' and a Biodiversity Checklist that
  says a survey is needed show as discretionary. The Biodiversity Checklist itself has no id (see TAN-unmapped.csv).
review-status: unverified
field-status: {}
