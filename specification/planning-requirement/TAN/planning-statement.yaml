reference: planning-statement
local-authority: TAN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: New commercial development (or change of use) of 1000 square metres or more.
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: Site area exceeding 0.5 hectares where it is not known how many dwellings are to
          be created.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.5
        description: Site area exceeding 0.5 hectares where it is not known how many dwellings are to
          be created.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development on a site area of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development on a site area of 1 hectare or more.
  - application-type:
      in:
      - mineral-extraction
      - waste-dev
  - all:
    - application-type:
        in:
        - s73
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - demolition-con-area
        - lbc
        - advertising
        - ldc
        - prior-approval
    - condition:
        field: minor-development
        value: true
        description: Minor development (non-householder).
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: residential-annexe
          value: true
          description: A residential annex.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Buildings with a floorspace of 100 square metres or more.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
source-text: 'Applications for 10 or more residential units New commercial development (or change of use)
  of 1000 square metres or more Site area exceeding 0.5 hectares where it is not known how many dwellings
  are to be created Development on site area of 1 hectare or more Applications for winning, working of
  minerals and/or waste development Applications to amend or remove a condition relating to the grant
  of planning permission for any major development Applications for minor development (non-householder)
  Householder checklist: Applications for residential annexes and Applications for buildings with a floorspace
  of 100 square metres or more.'
must-include:
- item: Background and need for the proposed development
  level: must
- item: Assessment of how the development accords with relevant national, local and, where applicable,
    neighbourhood planning policies
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
confidence: medium
notes: From the council's list (published 1 September 2025), page 21-22 of the Planning checklist. A proportionate
  version is required for minor development. Householder checklist page 15 asks only for the background
  and need.
review-status: unverified
field-status: {}
