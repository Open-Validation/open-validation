reference: section-proposed
local-authority: TAN
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: change-in-ground-levels
        value: true
        description: Floor levels or site levels change.
source-url: https://www.tandridge.gov.uk/Portals/0/Documents/Planning%20and%20building/Planning%20applications%20and%20enforcement/Making%20and%20submitting%20a%20planning%20application/Planning%20application%20forms/Planning-Local-Validation-Requirements-and-Checklist-2025.pdf?ver=WmyWXjH8vduWTRTyy4hJXA%3D%3D
policy: Article 7(1)(c), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'Drawings (2): All applications Householder checklist: Drawings and Photos (2): All applications
  (Existing and proposed sections (if floor levels and site levels are to remain unchanged, a drawing
  is not required providing this is confirmed in writing))'
must-include:
- item: Detailed elevations and sections at scale 1:5 where existing features are altered or replaced,
    or new features inserted (doors, windows, chimneys, shopfronts, signage, panelling, fireplaces, plaster
    mouldings or other details)
  level: should
  required-if:
    application-type:
      in:
      - lbc
  source-text: Applications for Listed Building Consent Where it is proposed to alter or replace existing
    features, or insert new features, including doors, windows, chimneys, shopfronts, signage, panelling,
    fireplaces, plaster mouldings or other details.
confidence: medium
notes: 'From the council''s list (published 1 September 2025), page 10 of the Planning checklist. Householder
  checklist page 7: sections are not needed for a householder application if floor and site levels stay
  the same and this is confirmed in writing. The 1:5 detail drawings are the list''s item 14 (page 11).'
