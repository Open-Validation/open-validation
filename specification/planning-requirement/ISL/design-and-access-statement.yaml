reference: design-and-access-statement
local-authority: ISL
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  Islington Strategic and Development Management Policies PLAN1, H4, H7, H9, H11, SC1, T3, T4, ST2, DH1,
  DH3 and DH8; London Plan Policies D3, D5, D6, D7, D8 and D9
source-text: All applications which require a Design & Access Statement … (Major developments and proposals
  within conservation areas of one or more residential units, or 100 square metres of more). … All Listed
  Building Consent applications require their own specific Design and access statement.
must-include:
- item: 'Design section: description of the existing property or site; design principles and concepts;
    intended use; layout; scale; landscaping; appearance; how local context influenced the design'
  level: must
- item: Inclusive design statement referencing relevant floorplans, evidencing compliance with Islington
    inclusive design policies and Approved Document M across the residents' whole journey (drop-off, cycle
    and mobility scooter parking, public realm, access and control systems, circulation, sanitary and
    kitchen facilities, egress, storage, outdoor amenity, waste and recycling)
  level: must
  source-text: Alongside the design section, an inclusive design statement referencing relevant details
    floorplans is required, in line with London Plan Policy D5.
- item: 'For residential accommodation: a schedule of accommodation (housing mix, tenure mix, number and
    size of habitable rooms, wheelchair accessible units)'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
    - condition:
        field: hmo-creation
        value: true
        description: Large-scale HMO or student accommodation (sui generis).
  source-text: A schedule of accommodation section will be required for all residential accommodation,
    including C3 and C4 new build, Sui Generis accommodation
- item: Dimensioned drawings whenever dimensions are directly referenced in relevant policies
  level: must
- item: 'For major developments: how site appraisal has been carried out, addressing the PLAN1 principles
    (contextual, connected, inclusive and sustainable)'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals with public realm: a public realm statement (materials layout plan, changes
    in level and sections, urban furniture, waste and recycling, car and cycle parking, eye-level perspectives)'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: public-realm
        value: true
        description: The proposal has an element of public realm.
  source-text: Major proposals with an element of public realm (including on privately owned public spaces)
    will require a public realm statement
- item: 'For tall buildings (over 30 m): how the proposal meets SDM Policy DH3 Part E and London Plan
    Policy D9 Part C'
  level: must
  required-if:
    condition:
      field: building-height
      operator: '>'
      value: 30
      description: Tall buildings over 30 m in height.
- item: 'For proposals providing public art: the details in SDM Policy DH8 para 8.104'
  level: must
  required-if:
    condition:
      field: public-art
      value: true
      description: The proposal provides public art.
- item: 'For listed building consent: how the works take account of the building''s special interest,
    its physical features and its setting; and (unless only internal) the approach to access and any consultation
    undertaken'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published 12 April 2024), page 14-16. Section 3.3.
review-status: unverified
field-status: {}
