reference: planning-statement
local-authority: ISL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: minor-development
        value: true
        description: Minor development.
  - all:
    - ref: major-development
    - condition:
        field: submission-page-count
        operator: '>'
        value: 100
        description: The entire submission exceeds 100 pages.
  - application-type:
      in:
      - s73
      - non-material-amendment
  - application-type:
      in:
      - ldc
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan; Islington Strategic and Development Management Policies; Bunhill and Clerkenwell
  Area Action Plan; Site Allocations; Islington's Statement of Community Involvement (2017)
source-text: Minor applications for full planning permission … Major developments (including applications
  for outline permission and approval of reserved matters) … for applications where the entire submission
  exceeds 100 pages in length and where that summary is not already provided in an Environmental Statement’s
  nontechnical summary … Applications for variation or removal of conditions and for material and non-material
  amendments … Applications for Lawful Development Certificates
must-include:
- item: 'For minor full applications: a short description and explanation of the proposal, justified against
    key planning policies, explaining why any other submission documents are not appropriate, and covering
    crime prevention/safer places and pre-application consultation with neighbours'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: minor-development
        value: true
        description: Minor development.
- item: 'For minor developments: a site appraisal commensurate with the scale, location and impact of
    the proposal, addressing the PLAN 1 design principles (in a planning statement or cover letter)'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
  source-text: Minor developments should provide a site appraisal commensurate with the scale, location
    and potential impact of the proposal; in a planning statement or cover letter as appropriate which
    addresses key design principles set out in PLAN 1.
- item: 'For major developments: a summary (no more than 20 pages) covering the site, context and planning
    history; relevant policies; how the proposal accords with them; consultations; other material information;
    and justification for any local list information not supplied'
  level: must
  required-if:
    ref: major-development
- item: 'For restaurants/cafés, pubs, hot food takeaways, nightclubs, places of worship, minicab offices,
    community facilities and other uses with potential amenity impacts: opening hours, covers, staff and
    customer numbers, transport, refuse storage and collection, activities and ancillary uses (and for
    minicab offices, number of minicabs and whether drivers are remote or office based)'
  level: must
  required-if:
    any:
    - condition:
        field: food-or-drink-use
        value: true
        description: Restaurant/café, public house or hot food takeaway.
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Nightclub or similar.
    - discretionary
  source-text: Proposals involving restaurant/cafés, public house or hot food takeaway uses, nightclubs,
    places of worship, minicab offices, community facilities or other uses with the potential for significant
    impacts upon neighbouring residential amenity.
- item: 'For variation/removal of conditions and amendments: how the proposal differs from the approved
    scheme; policies adopted since the previous permission and how it accords with them; why the alterations
    are required'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
- item: 'For lawful development certificates: site description and planning history; the use(s) or work(s);
    why they are believed lawful; appendices with evidence (dated floor plan, sworn affidavits, rent records,
    council tax and utility bills, receipts, invoices, tax returns, dated photographs) as appropriate'
  level: must
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (published 12 April 2024), page 19, 36-37. Section 8, Planning Statements
  (plus 3.7 Site appraisal for minor developments). For major developments the summary is not needed where
  an Environmental Statement's non-technical summary already provides it.
review-status: unverified
field-status: {}
