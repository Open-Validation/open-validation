reference: sustainability-statement
local-authority: ISL
required-if:
  always: true
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies SI1 to SI5, SI7 and SI13; Islington Strategic and Development Management
  Policies S1 to S10, G1, G4 and G5; Environmental Design SPD
source-text: A Sustainable Design and Construction Statement must be submitted to demonstrate the proposal
  meets all relevant sustainable design policies, and that these have been considered with a level of
  detail proportionate to these requirements. … All development proposals
must-include:
- item: 'For residential extensions and refurbishments of more than 500 sq m (gross) or five or more dwellings
    (gross): a BREEAM Domestic Refurbishment pre-assessment by a certified assessor demonstrating ''Excellent'''
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: residential-extension
          value: true
          description: Residential extension or refurbishment.
      - condition:
          field: building-works
          value: true
          description: Residential refurbishment.
    - any:
      - condition:
          field: floorspace
          operator: '>'
          value: 500
          description: More than 500 sq m of floorspace (gross).
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: Five or more dwellings (gross).
  source-text: BREEAM Domestic Refurbishment pre-assessment conducted by a certified BREEAM Assessor submitted
    at application stage demonstrating “Excellent” will be achieved.
- item: 'For listed buildings: the BREEAM pre-assessment identifies any fabric/material changes'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For major developments, minor developments creating new residential, and extensions of 100 sq
    m or more: the statement in line with SDM Policy S2 Part B, covering sustainable design standards,
    energy, air quality, adaptive design/circular economy, integrated water management and landscape'
  level: must
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Extensions of 100 sq m or greater.
  source-text: Sustainable Design and Construction Statements must be submitted in accordance with Strategic
    and Development Management Policy S2 Part B.
- item: Assessment of relevant BRE/BREEAM sustainable design standards, plus Fabric Energy Efficiency
    for residential
  level: must
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Extensions of 100 sq m or greater.
- item: 'For major and minor developments creating new residential units: a BRE Home Quality Mark pre-assessment
    showing at least a four-star rating'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings.
- item: An Adaptive Design Strategy showing how circular economy principles have been addressed
  level: must
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Extensions of 100 sq m or greater.
- item: Integrated Water Management and Sustainable Drainage approach (Policy S9)
  level: must
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Extensions of 100 sq m or greater.
- item: Summaries of the landscape, ecology, open space and play, tree, urban greening and biodiversity
    net gain requirements presented together
  level: should
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Extensions of 100 sq m or greater.
confidence: medium
notes: From the council's list (published 12 April 2024), page 24-26. Section 4.8, Sustainable Design
  and Construction Statement (SDCS). The energy, air quality and drainage parts are filed under energy-statement,
  air-quality-assessment and sustainable-drainage-strategy; the GLA Circular Economy Statement for major
  applications has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
