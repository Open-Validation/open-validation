reference: site-plan
local-authority: ISL
required-if:
  always: true
source-url: https://www.islington.gov.uk/planning/applications/permission-check/requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This is a more detailed scale plan showing the relationship of the proposal to the site boundary
  and any buildings on neighbouring land.
must-include:
- item: Relationship of the proposal to the site boundary and any buildings on neighbouring land
  level: must
- item: 'For major developments: layout of external areas showing arrangements for servicing, cycle storage
    and end of trip facilities, substations, refuse and recycling collection'
  level: must
  required-if:
    ref: major-development
  source-text: Layout plans of external areas showing arrangements for servicing, cycle storage and end
    of trip facilities, substations, refuse and recycling collection.
- item: 'For outline applications with layout reserved: an illustrative/indicative layout showing the
    approximate layout of buildings, routes (including step-free routes) and open spaces'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - outline
    - condition:
        field: layout-reserved-matter
        value: true
        description: Layout is a reserved matter.
  source-text: Illustrative/ indicative layout showing approximate layout of buildings, routes, including
    step-free routes, and open spaces.
confidence: medium
notes: From the council's list (published 12 April 2024), page 10-11. The source-text is from the council's
  'Requirements for valid planning application' page, which lists the site plan as a mandatory application
  requirement. The list's (https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf)
  layout plans of external areas (major developments) and the illustrative layout for outline applications
  with 'layout' as a reserved matter are filed here as contents.
