source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policy T4; Islington Strategic and Development Management Policies T1, T2 and T3 and
  Appendix 3; TfL Travel Plan Guidance
source-text: 'All proposals above the following thresholds: … E(a) Retail: 1,000sqm or greater … E(b)/
  Sui Generis hot food takeaway and bar/public house use: 750sqm or greater … B2/B8/E(c)/E(g): 2,500sqm
  or greater … C1: 50 beds or greater … C3: 50 residents or greater … E(e): hospitals/medical centres:
  50 staff or greater … F1(a) schools: all developments to have a school travel plan … F1(a) higher/further
  education: 2,500sqm or greater … F1(c) and F1(e) museum/gallery: 100,000 or greater visitors annually
  … F1(f) places of worship: 200 or greater members/attendees … E(d) and F2 (c-d) and Sui Generis uses
  Assembly and Leisure: 1,000sqm or greater … General Class E (unspecified activity): 750sqm or greater'
must-include:
- item: How travel to the development will be managed
  level: must
- item: Proposals to manage sustainably the levels of movement generated, reducing the environmental impact
    of vehicles and promoting public transport, walking and cycling for all users
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 34-35. Section 7.5, Transport Assessment
  and full or local level travel plan. The museum/gallery (annual visitors) and place of worship (members/attendees)
  thresholds have no field, so those parts show as discretionary. Schools need a school travel plan for
  all developments.
review-status: unverified
