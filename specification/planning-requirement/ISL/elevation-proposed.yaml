reference: elevation-proposed
local-authority: ISL
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works.
  - condition:
      field: plant-equipment
      value: true
      description: Plant, flues, ventilation or air conditioning.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies PLAN1, DH3 and DH5; Islington Urban Design
  Guide SPD
source-text: Applications that involve building works … Existing and proposed drawings of all sides of
  the exterior of the building at an appropriate scale, usually 1:50 or 1:100.
must-include:
- item: Drawn at an appropriate scale, usually 1:50 or 1:100
  level: should
- item: All altered sides of the proposal, including blank elevations and elevations part attached to
    an adjoining building or facing into a shared lightwell
  level: must
- item: 'For an extension: the elevation of the existing building, clearly indicating what is new work'
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: The proposal is an extension.
- item: Elevations in the context of adjacent buildings
  level: must
- item: 'Where a proposed elevation adjoins or is close to another building: the relationship between
    the buildings and the positions of openings on each property'
  level: should
- item: Make, type and colour of external materials (walls, roofs, windows, doors, rainwater goods etc.)
    clearly annotated
  level: should
- item: The manner in which new windows are intended to open
  level: must
- item: 'For listed buildings: existing and proposed internal elevations showing internal alterations,
    usually at 1:50 or 1:100'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For plant, flues, ventilation and air conditioning: manufacturer''s specifications and details
    of mounting (if attached to an upper floor occupied as residential use)'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Plant, flues, ventilation or air conditioning.
  source-text: Plants, flues, ventilation and air conditioning – in addition to elevations and floor plans
    / roof plans. Applications should provide manufacturer’s specifications and details of mounting (if
    attached to the upper floor that is occupied as residential use).
- item: 'For listed building consent involving alteration, replacement or installation of features such
    as windows, doors or shopfronts: existing and proposed elevations and sections at 1:20 or less (details
    such as frames, architraves and mouldings at 1:5 or less; glazing bars at 1:2)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: For any alterations, replacement, or installation of features such as windows, doors, shopfronts,
    existing and proposed elevation plans and sectional drawings to a scale of 1:20 or less will be required.
confidence: medium
notes: From the council's list (published 12 April 2024), page 7-8, 11, 18. Section 2, Building elevations,
  plus the plant/flues row of section 6 and the heritage statement note on 1:20 details.
review-status: unverified
field-status: {}
