reference: floor-plan-existing
local-authority: ISL
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works.
  - condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies PLAN1; Islington Urban Design Guide SPD
source-text: Applications that involve building works … Plans are required of the existing and proposed
  floors of the building at an appropriate scale, usually 1:50 or 1:100. … Applications for changes of
  use
must-include:
- item: Drawn at an appropriate scale, usually 1:50 or 1:100
  level: should
- item: 'For a new building: the proposal in detail, indicating which parts are to be used for which purpose'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building.
- item: Ground floor plans shown in context with relevant details from the site plan
  level: should
- item: Floor plans in the context of adjacent buildings, with the positions of relevant openings on immediately
    adjacent land, where appropriate
  level: should
- item: 'For an extension: the existing and proposed floor layout, clearly indicating what is new work'
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: The proposal is an extension.
- item: Buildings or walls to be demolished clearly shown on a separate plan
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: North point on all plans
  level: must
- item: 'For changes of use: which parts are to be used for which purpose, with the north point'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
confidence: medium
notes: From the council's list (published 12 April 2024), page 8. Section 3, Building floor and roof plans.
review-status: unverified
field-status: {}
