reference: heritage-statement
local-authority: ISL
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - protected-view
      description: Affects London View Management Framework views, Islington Local Views or views of Local
        Landmarks.
  - condition:
      field: building-height
      operator: '>'
      value: 30
      description: 'Tall buildings (over 30 m): a separate Heritage Impact Assessment.'
  - all:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - locally-listed-building
        - scheduled-monument
        - park-and-garden
        - battlefield
        description: Affects the significance of a heritage asset, including its setting.
    - discretionary
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies HC1, HC2 and D9; Islington Strategic and Development Management Policies
  DH1, DH2, DH3; Islington's Conservation Area Design Guidelines
source-text: Listed building consent … Applications for removal or variation of a listed building consent
  condition … Applications affecting significance of any heritage assets, including any contribution made
  by their setting. … Development proposals that affect London View Management Framework Views, designated
  Islington Local Views, or views of Local Landmarks must provide appropriate supporting material – including
  3D modelling - to verify the visual impact of proposed development on protected views. … Alongside proposals
  for tall buildings separate Heritage Impact Assessments (which include heritage-related visuals) and
  Townscape Visual Impact Assessments should be provided.
must-include:
- item: 'For listed building consent: analysis of the significance of the listed building and other affected
    heritage assets, including setting and condition of elements affected'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: schedule of all works proposed and specification of materials and
    methodologies'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: how the works would impact on significance, including why mitigation
    or alternatives could not be accommodated if harm is proposed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: annotated photographs of affected areas, linked to locations on
    the plans/drawings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: justification for the works, including the principles and methodology'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Where reinstatement of lost or damaged features is proposed: historic evidence (plans or photographs)
    where possible'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For applications affecting heritage assets: plans showing historic features on or adjacent to
    the site; analysis of significance; justification for the works and their impact on character and
    setting'
  level: must
  required-if: discretionary
- item: 'Affecting protected views: supporting material, including 3D modelling, verifying the visual
    impact'
  level: must
  required-if:
    site:
      in:
      - protected-view
      description: Affects protected views.
- item: 'For tall buildings: Zones of Visual Influence (Zones of Theoretical Visibility) as part of the
    visualisations'
  level: should
  required-if:
    condition:
      field: building-height
      operator: '>'
      value: 30
      description: Tall buildings over 30 m.
confidence: medium
notes: From the council's list (published 12 April 2024), page 16-18. Section 3.5 (and the tall buildings
  row of 3.3, which asks for separate Heritage Impact Assessments, filed here). For applications affecting
  heritage assets and for removal or variation of a listed building consent condition the list says the
  statement 'may be required', so those parts show as discretionary. The Townscape Visual Impact Assessment
  has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
