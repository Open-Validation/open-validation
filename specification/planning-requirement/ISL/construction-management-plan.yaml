reference: construction-management-plan
local-authority: ISL
required-if:
  any:
  - ref: major-development
  - condition:
      field: basement
      value: true
      description: Basement development.
  - discretionary
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policy T7; Islington Strategic and Development Management Policies DH4, S1, S7, S10
  and T5; Environmental Design SPD
source-text: Major applications, any other site which may cause disruption during its construction and
  applications with basement development
must-include:
- item: How on-site impacts will be managed during the demolition/construction phase
  level: must
- item: Best practice construction techniques to limit impacts on air quality, noise and vibration, demolition
    and construction waste, waste transport, contamination of land and water and disturbance of local
    ecology
  level: must
- item: Identification and mitigation of impacts
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 13. 'Any other site which may cause disruption'
  is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
