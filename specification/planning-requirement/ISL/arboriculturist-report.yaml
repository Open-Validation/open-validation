reference: arboriculturist-report
local-authority: ISL
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Affects trees within the site or on adjacent land (including street trees).
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies G1, G5, G7 and D8; Islington Strategic and Development Management Policies
  G4; Islington Tree Policy
source-text: Proposals that affect trees within the application site or on land adjacent to the site (including
  street trees).
must-include:
- item: Tree survey and arboricultural impact assessment to BS 5837:2012, including tree quality
  level: must
- item: Tree retention/removal plan (finalised)
  level: must
- item: 'Where needed: arboricultural method statement and tree protection plan to BS 5837:2012'
  level: must
  required-if: discretionary
- item: Tree planting to BS8545:2014
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 26. Section 4.9. The method statement and
  tree protection plan are needed if the impacts require tree protection or special working methods in
  root protection areas.
review-status: unverified
field-status: {}
