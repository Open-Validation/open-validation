reference: schedule-of-works
local-authority: ISL
required-if:
  all:
  - application-type:
      in:
      - lbc
  - condition:
      field: demolition
      value: true
      description: The proposals remove any part of a building.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policy HC1
source-text: A schedule of works must be provided where proposals seek to remove any part of a building,
  indicating the location, extent and character of the items to be removed (cross- referenced to elevations,
  plans and sections).
must-include:
- item: Location, extent and character of the items to be removed, cross-referenced to elevations, plans
    and sections
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 13-14. Section 2.2, under 'Works to a listed
  building or structure (including demolition)'. The structural survey and method statement for listed
  buildings in the same row are 'may be required' items with no matching id (see the unmapped list).
review-status: unverified
field-status: {}
