reference: town-centre-impact-assessment
local-authority: ISL
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses in out-of-centre or edge-of-centre locations outside Local Shopping
        Areas.
  - all:
    - site:
        in:
        - shopping-frontage
        description: Within a Local Shopping Area.
    - condition:
        field: floorspace
        operator: '>'
        value: 200
        description: Main town centre uses over 200 sq m.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies E9 and SD7; Islington Strategic and Development Management Policies R3 and
  R4
source-text: Applications for Main Town Centre Uses (retail, professional services, café/restaurants,
  assembly and leisure, and Sui Generis uses) in out-of-centre locations, edge of centre locations outside
  Local Shopping Areas (LSAs) and main town centre uses over 200sqm within Local Shopping Areas.
must-include:
- item: Sequential test thoroughly investigating alternative sites in Town Centres, Local Shopping Areas
    and edge-of-centre locations
  level: must
- item: Impact assessment of likely significant adverse impacts on relevant Town Centres and/or LSAs
  level: must
- item: Scope agreed with the council before submission
  level: should
confidence: medium
notes: From the council's list (published 12 April 2024), page 31. Section 6.3, Retail Statement (sequential
  test and impact assessment). The other parts of the retail statement (primary shopping area analysis,
  essential daily goods plan, small shop units and marketing and vacancy evidence) have no matching id
  (see the unmapped list).
review-status: unverified
field-status: {}
