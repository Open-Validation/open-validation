reference: affordable-housing-statement
local-authority: ISL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings.
  - condition:
      field: residential-capacity
      operator: '>='
      value: 10
      description: Sites with the potential to provide 10 or more units.
  - condition:
      field: hmo-occupants
      operator: '>'
      value: 6
      description: Large-scale HMOs (above 6 unrelated people).
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies H2, H4, H5, H6 and H7; Islington Strategic and Development Management Policies
  H3, H6, H7, H8, H10 and H11; Development Viability SPD
source-text: Development proposals which would provide 10 or more new residential units / proposals for
  residential development on sites with the potential to provide 10 or more residential units. … Applications
  for large-scale HMOs. … Residential developments of under 10 new units (C3 and C4 use classes.
must-include:
- item: 'For 10 or more units and large-scale HMOs: number, tenure, bedroom mix and size of on-site affordable
    housing, habitable rooms and floorspace'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more units.
    - condition:
        field: hmo-occupants
        operator: '>'
        value: 6
        description: Large-scale HMO.
- item: 'For 10 or more units: approach to Policy H3 from development value alone; public subsidy options
    and additionality; Registered Provider partners and nomination rights; schedule of accommodation;
    shared ownership costs; approach to review mechanisms'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more units.
- item: 'For under 10 units: how the scheme complies with the small sites contributions, plus either a
    statement agreeing to pay the contribution and legal fees, or a viability assessment with agreement
    to pay for its review, a draft unilateral undertaking and undertaking to pay legal fees'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: <
      value: 10
      description: Under 10 new units.
- item: 'For large-scale HMOs without on-site affordable housing: how cash in lieu complies with policy,
    plus either an agreement to pay fees and sign the council''s Unilateral Undertaking, or a viability
    assessment with agreement to pay for its review'
  level: must
  required-if:
    condition:
      field: hmo-occupants
      operator: '>'
      value: 6
      description: Large-scale HMO.
confidence: medium
notes: From the council's list (published 12 April 2024), page 28. Section 5.1. Viability information
  is only accepted in exceptional circumstances, justified in the statement.
review-status: unverified
field-status: {}
