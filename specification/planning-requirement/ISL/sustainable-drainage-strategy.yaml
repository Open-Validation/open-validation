reference: sustainable-drainage-strategy
local-authority: ISL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: Extensions of 100 sq m or greater.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies S9
source-text: Integrated Water Management and Sustainable Drainage demonstrating holistic approach to water
  management which considers sustainable drainage, water efficiency, water quality and biodiversity (Policy
  S9).
must-include:
- item: Holistic approach covering sustainable drainage, water efficiency, water quality and biodiversity
  level: must
- item: 'For major developments: a Surface Water Drainage Pro-forma'
  level: must
  required-if:
    ref: major-development
- item: Refers to the site-specific Flood Risk Assessment, if one is required
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 25-26. Section 4.8 e), part of the Sustainable
  Design and Construction Statement.
review-status: unverified
field-status: {}
