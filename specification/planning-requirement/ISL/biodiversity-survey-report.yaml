reference: biodiversity-survey-report
local-authority: ISL
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Likely to have an impact on protected species.
  - site:
      in:
      - priority-habitat
      description: Likely to affect habitats or priority species in the borough's Biodiversity Action
        Plan.
  - site:
      in:
      - local-wildlife-site
      description: Within or in close proximity to a SINC.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policy G6; Islington Strategic and Development Management Policies G4; Environmental
  Design SPD
source-text: All developments, (including refurbishment) that are likely to have an impact on protected
  species; habitats or priority species in the boroughs Biodiversity Action Plan; and/or is within or
  in close proximity to a SINC(s)
must-include:
- item: Potential development impacts likely to harm the ecology of the site, with recommended mitigation
    and enhancement measures
  level: must
- item: Undertaken by an appropriately qualified ecologist
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 20. Section 4.1, Biodiversity / Ecological
  survey / report. SINC = Site of Importance for Nature Conservation.
review-status: unverified
field-status: {}
