reference: fire-statement
local-authority: ISL
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policy D12; Town and Country Planning (Development Management Procedure) (England)
  Order 2015, article 9A
source-text: All Major development applications … Minor developments providing two or more dwellings,
  educational dwellings or being more than 18m or 7 stories in height.
must-include:
- item: 'For major development: an independent fire strategy produced by a third party, suitably qualified
    assessor'
  level: must
  required-if:
    ref: major-development
- item: 'For major development: the building''s construction; means of escape for all users; features
    reducing the risk to life; access for fire service personnel and equipment; fire appliance access
    within the curtilage; future modifications not compromising fire safety measures'
  level: must
  required-if:
    ref: major-development
- item: 'For minor development: the fire safety principles applied to each building; site layout; emergency
    vehicle access and water supplies; consultation on fire safety; how fire safety policies were taken
    into account'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
confidence: medium
notes: From the council's list (published 12 April 2024), page 17. Major applications need a London Plan
  D12 fire statement. For minor development the national rule is used (2 or more dwellings or educational
  accommodation AND 18 m or more or 7 or more storeys); the list's 'or' wording is read as that rule.
review-status: unverified
field-status: {}
