submission-standards:
- item: Documents in PDF (.pdf) or Microsoft Word (.doc/.docx) format; other formats converted to PDF
    or Word
  level: must
- item: No restrictions on editing or redacting (the document can be saved as another file name)
  level: must
- item: Files no larger than 10 MB (break large files into numbered sections; no .EXE or ZIP files); the
    list asks that individual documents and plans do not exceed 5 MB
  level: must
- item: Drawings at a recognised metric scale (usually printable at 1:100 or 1:50) with a scale bar; 'do
    not scale' not used
  level: must
- item: Each drawing carries a unique number and a title
  level: should
- item: Dimensioned drawings preferred where annotation does not compromise readability
  level: should
- item: Neighbouring properties and neighbouring windows always shown on plans, elevations and sections
    (existing and proposed)
  level: must
- item: Existing and proposed ground levels always shown for extensions or new buildings
  level: must
- item: Extent of any demolition clearly hatched and shown on a separate set of drawings
  level: should
