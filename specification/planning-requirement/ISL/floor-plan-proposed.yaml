reference: floor-plan-proposed
local-authority: ISL
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works.
  - condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies PLAN1, H4, H6, H10, SC1, SC2, B1, T1,
  T3, T4 and ST2; London Plan Policies D5, D6 and D7; Inclusive Design in Islington SPD
source-text: Applications that involve building works … Plans are required of the existing and proposed
  floors of the building at an appropriate scale, usually 1:50 or 1:100. … Applications for changes of
  use
must-include:
- item: Drawn at an appropriate scale, usually 1:50 or 1:100
  level: should
- item: 'For a new building: the proposal in detail, indicating which parts are to be used for which purpose'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building.
- item: Ground floor plans shown in context with relevant details from the site plan
  level: should
- item: Floor plans in the context of adjacent buildings, with the positions of relevant openings on immediately
    adjacent land, where appropriate
  level: should
- item: 'For an extension: the existing and proposed floor layout, clearly indicating what is new work'
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: The proposal is an extension.
- item: Buildings or walls to be demolished clearly shown on a separate plan
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: North point on all plans
  level: must
- item: 'For changes of use: which parts are to be used for which purpose, with the north point'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
- item: 'Inclusive design detail: transport (cycle storage and end of trip facilities, mobility scooter
    parking and charging, safe vehicular drop-off); approach to and exit from the building and access
    to internal units; sizes of internal units; horizontal and vertical circulation (turning spaces and
    means of escape in case of fire); bathroom and kitchen facilities'
  level: should
  source-text: 'Submitted plans and drawings should include the following detail to allow for assessment
    against Islington’s inclusive design policies:'
- item: 'For residential (C3 and C4) proposals: tenure mix, unit sizes, room sizes and layouts of all
    units'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (C3 and C4).
  source-text: All C3 and C4 proposals must include details of the tenure mix, unit sizes, room sizes
    and layouts of all units proposed
- item: 'For residential proposals: location of waste and recycling facilities'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (C3 and C4).
  source-text: All proposals for residential development must provide details of location of waste and
    recycling facilities.
- item: 'For residential proposals: layouts showing private outdoor space, built-in storage, standard-sized
    furniture and inclusive design features; compliance with M4(2) for all dwellings and M4(3) for wheelchair
    accessible and adaptable dwellings; dimensioned where policies reference dimensions'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (C3 and C4).
  source-text: Compliance with Building Regulations Approved Document M4(2) will need to be demonstrated
    for all dwellings, and M4(3) for wheelchair accessible and adaptable dwellings
- item: 'For hotels, HMOs, student accommodation and other non-self-contained or visitor accommodation:
    intended occupancy, floorspace and room sizes; access to units, built-in storage, private outdoor
    space; detailed layouts of all wheelchair-accessible units'
  level: must
  required-if:
    any:
    - condition:
        field: hotel-development
        value: true
        description: Hotel or visitor accommodation.
    - condition:
        field: hmo-creation
        value: true
        description: A house in multiple occupation.
    - condition:
        field: use-class
        value: student-accommodation
        description: Student accommodation.
    - condition:
        field: use-class
        value: non-self-contained-housing
        description: Other non-self-contained housing.
  source-text: Details of intended occupancy, proposed floorspace and room sizes are required. Layouts
    showing access to units, built-in storage space and breakdown of room sizes, as well as private outdoor
    space provision. Detailed layouts of all wheelchair-accessible units proposed.
confidence: medium
notes: From the council's list (published 12 April 2024), page 8-10. Sections 3 and 6. The inclusive design
  details apply to 'All applications'; minor applications may give details not visible on plans in the
  cover letter or planning statement.
review-status: unverified
field-status: {}
