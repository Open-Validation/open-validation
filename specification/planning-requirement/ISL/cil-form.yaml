reference: cil-form
local-authority: ISL
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: New buildings or extensions of 100 sq m or more gross internal floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Planning Act 2008, Part 11; Community Infrastructure Levy Regulations 2010; London Plan Policy
  DF1; Islington Strategic and Development Management Policies ST1; LBI CIL Charging Schedule (2014);
  Mayor of London MCIL2 Charging Schedule (2019)
source-text: Proposals including new buildings or extensions which involve the creation of 100 square
  metres or … more of gross internal floorspace, or involve the creation of one or more dwellings (even
  where this is below 100 square metres)
must-include:
- item: A completed Planning Application Additional Information Requirement Form
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 32-33. Section 7.1.
review-status: unverified
field-status: {}
