reference: noise-assessment
local-authority: ISL
required-if:
  any:
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential or other noise-sensitive development.
    - discretionary
  - condition:
      field: noise-generating-use
      value: true
      description: A noise-generating use that raises disturbance issues.
  - condition:
      field: plant-equipment
      value: true
      description: Installation of flues, air conditioning, plant, extraction etc.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policy D14; Islington Strategic and Development Management Policies DH5 and Appendix
  2
source-text: Proposals for residential and other noise sensitive development close to existing sources
  of noise; noise generating uses that raise disturbance issues to existing buildings; applications involving
  installation of flues, air conditioning, plant, extraction etc.
must-include:
- item: Addresses the relevant requirements in Appendix 2 of the Strategic and Development Management
    Policies
  level: must
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 23. Section 4.6, noise impact assessment,
  acoustic design statement or vibration assessment. 'Close to existing sources of noise' has no field,
  so that part shows as discretionary.
review-status: unverified
field-status: {}
