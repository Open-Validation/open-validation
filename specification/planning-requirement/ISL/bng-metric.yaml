reference: bng-metric
local-authority: ISL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Environment Act 2021; Islington Strategic and Development Management Policies G4
source-text: Major Developments from February 2023. … Small developments from April 2024
must-include:
- item: 'Statement of applicability: whether the development is subject to the biodiversity net gain condition'
  level: must
- item: Completed metric calculation tool for the pre-development biodiversity value
  level: must
- item: How a minimum 10% net gain will be met, with the full metric spreadsheet (latest version) and
    justification of habitat types, distinctiveness, condition, connectivity and functionality
  level: must
- item: Steps taken to minimise adverse impacts, following the Mitigation Hierarchy and BNG Hierarchy
  level: must
- item: 'Where an earlier date than the application date is used: that date and the reasons'
  level: must
  required-if: discretionary
- item: 'Any degradation before the application date: date, pre-degradation value, metric and evidence'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Activities have reduced onsite biodiversity value before the application.
- item: Any irreplaceable habitat on the land
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat on the land.
- item: Any off-site enhancements (including credits) and off-site provision to be secured by planning
    obligation
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site gains or credits are proposed.
- item: Implementation, management, monitoring and auditing measures
  level: must
confidence: medium
notes: 'From the council''s list (published 12 April 2024), page 20-21. Section 4.2, Biodiversity Net
  Gain Assessment. The rule follows the law (biodiversity gain condition): householder applications, self-build
  and custom housebuilding and development below the de minimis threshold are exempt, as the list''s own
  ''Exempt developments'' section says. The list says it applies to major development from February 2023
  (sic) and small developments from April 2024.'
review-status: unverified
field-status: {}
