reference: daylight-sunlight-assessment
local-authority: ISL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - discretionary
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies PLAN1 and H4; BRE 'Site layout planning
  for daylight and sunlight' (2021)
source-text: All new major residential development proposals. … Proposals where there may be a potential
  adverse impact on current levels of sunlight / daylight enjoyed by adjoining properties or building(s),
  including associated gardens or amenity space.
must-include:
- item: 'Follows the BRE guidance ''Site layout planning for daylight and sunlight: A guide to good practice''
    (2021)'
  level: should
- item: Impacts on existing properties and sites with extant planning permissions
  level: should
- item: 'In restricted settings: final daylight and sunlight values achieved within the proposed scheme'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published 12 April 2024), page 14. 'Potential adverse impact' on neighbours
  is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
