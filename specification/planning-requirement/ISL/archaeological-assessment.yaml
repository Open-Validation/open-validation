reference: archaeological-assessment
local-authority: ISL
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: Within an Archaeological Priority Area (likely to affect important remains, or involving
        any excavation or piling).
  - site:
      in:
      - scheduled-monument
      description: In proximity to a scheduled monument.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies DH2
source-text: Proposals within Archaeological Priority Areas likely to affect important archaeological
  remains. … Proposals that involve any form of excavation or piling within an Archaeological Priority
  Area. … Proposals in proximity to scheduled monuments.
must-include:
- item: Prepared by a qualified individual or organisation
  level: must
- item: Uses existing information to establish the archaeological significance of the site and the impact
    of the proposals on surviving monuments or remains
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 14. Archaeological Field Evaluation may
  also be required.
review-status: unverified
field-status: {}
