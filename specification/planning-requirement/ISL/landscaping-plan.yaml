reference: landscaping-plan
local-authority: ISL
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Creation of new buildings or redevelopment of existing buildings.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: Large extensions (100 sq m or larger).
  - condition:
      field: public-realm
      value: true
      description: The proposal has an element of public realm (even on private land).
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies PLAN1, G1, G2, G4, G5, S1, S2, S9, SC2,
  T4 and DH4; London Plan Policies G1, G5, G6 and G7; Inclusive Landscape Design SPD; Streetbook SPD
source-text: Development proposals involving the creation of new buildings, redevelopment of existing
  buildings or large extensions (100sqm or larger) … All proposals with an element of public realm (even
  where provided on private land)
must-include:
- item: Approach to hard and soft landscaping design
  level: must
- item: Existing and proposed trees, hedges, shrubs and other vegetation
  level: must
- item: Enhancement of biodiversity and habitat creation, including provision of swift bricks
  level: must
- item: SUDS
  level: must
- item: Green/blue and/or bio-solar roofs
  level: must
- item: How the application complies with SDM Policies PLAN 1, G1, G4, G5, S1, S2, S9 and DH4 and how
    the design and layout of all outdoor areas responds to local guidance/SPDs
  level: must
- item: Loss of any open/amenity space, in line with Policy G2
  level: must
- item: 'Formal and informal play space/playable space: play equipment, surfacing materials, light fittings
    and seating'
  level: must
  required-if: discretionary
  source-text: The landscape design strategy should provide details of any formal and informal play space/playable
    space.
- item: 'For major development: on-site free-to-use, publicly accessible play space (Policy SC2 Part C)'
  level: must
  required-if:
    ref: major-development
- item: 'For public realm: detailed plans and cross sections of proposed external areas at 1:100, with
    a strategy addressing Policy T4 (levels, boundary treatment, street access, lighting and planting,
    street furniture, surfacing materials)'
  level: must
  required-if:
    condition:
      field: public-realm
      value: true
      description: The proposal has an element of public realm.
  source-text: Detailed plans and cross sections of proposed external areas at 1:100 scale and explanation
    of strategy which addresses criteria in Strategic and Development Management Policy T4.
confidence: medium
notes: From the council's list (published 12 April 2024), page 10-11, 19. Combines the Landscape plans
  row of section 6 and section 3.6 Landscape Design Strategy. 'Large extensions' is defined in 3.6 as
  100 sq m or larger. Play space details apply where play space is proposed, so they show as discretionary.
review-status: unverified
field-status: {}
