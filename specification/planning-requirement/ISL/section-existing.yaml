reference: section-existing
local-authority: ISL
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: A new building.
  - condition:
      field: building-works
      value: true
      description: The application involves building works.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies PLAN1; Islington Basement Development
  SPD
source-text: Proposals for new and altered buildings and/or changes in ground levels … Cross and long
  sections, usually at 1:00 or 1:50, should be provided for all new and altered buildings to reveal construction
  details. … In all cases where a proposal involves a change in ground levels, drawings should be submitted
  to show existing and finished levels.
must-include:
- item: Cross and long sections, usually at 1:100 or 1:50, revealing construction details
  level: should
- item: Shown in context with ground levels and immediately adjacent buildings where necessary
  level: should
- item: Detailed sections of junctions (usually 1:20 or 1:10) where these communicate key interventions
  level: should
  required-if: discretionary
- item: Existing and finished levels where the proposal changes ground levels
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
- item: 'On sloping sites: full information on alterations to levels and relative levels of existing and
    proposed, in context with immediately adjacent buildings'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A sloping site.
confidence: medium
notes: From the council's list (published 12 April 2024), page 9. Section 4, Finished floor / site levels
  and sections. The list prints '1:00' for the usual section scale (read as 1:100).
review-status: unverified
field-status: {}
