reference: energy-statement
local-authority: ISL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: Extensions of 100 sq m or greater.
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies SI2 to SI4; Islington Strategic and Development Management Policies S4, S5
  and S6
source-text: Major developments, minor developments creating new residential and extensions of 100m2 or
  greater. … An Energy Strategy utilising the energy hierarchy and the heating hierarchy.
must-include:
- item: Energy strategy using the energy hierarchy and the heating hierarchy
  level: must
- item: Details of any carbon offsetting
  level: must
- item: 'For minor new build residential: a Unilateral Undertaking agreeing to pay carbon offsetting contributions
    and the council''s legal checking fees'
  level: must
  required-if:
    all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
    - condition:
        field: new-build
        value: true
        description: New build.
  source-text: Minor new build residential developments should provide a Unilateral Undertaking
- item: 'Operational sustainability: how the development will be designed for ongoing effective and sustainable
    use, management and maintenance (Policies S4 and S6)'
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 25. Section 4.8 b), Energy Statement, part
  of the Sustainable Design and Construction Statement.
review-status: unverified
field-status: {}
