reference: photos
local-authority: ISL
required-if:
  always: true
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies D4, D9 and HC4; Islington Strategic and Development Management Policies PLAN1,
  DH1, DH2 and DH3
source-text: All Development … Provide photographs of the existing building and relationship with neighbouring
  buildings
must-include:
- item: Photographs of the existing building and its relationship with neighbouring buildings
  level: must
- item: 'For major developments: photographs and photomontages showing how large buildings integrate within
    the street scene and wider context'
  level: must
  required-if:
    ref: major-development
- item: 'For major developments: a simplified massing model in *.fbx format, geolocated by OS Grid coordinates
    (preferred) or Lat/Long, with the original software and units of measure stated'
  level: should
  required-if:
    ref: major-development
  source-text: Applicants should submit the massing model of their building – simplified - in the *.fbx
    format, geolocated by either OS Grid Coordinates (preferred) or Lat/Long.
- item: 'For development affecting a heritage asset or its setting, or demolition of an existing building:
    photographs of the existing building(s), including internal imagery where relevant'
  level: must
  required-if:
    any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - locally-listed-building
        description: Development affecting a heritage asset or its setting.
    - condition:
        field: demolition
        value: true
        description: Demolition of an existing building.
  source-text: Provide photographs of the existing building(s) including internal imagery where relevant.
- item: 'Within strategic or local viewing corridors or affecting views of landmarks: annotated elevations
    relating to heights of viewing planes, photomontages and verified visual montages'
  level: must
  required-if:
    site:
      in:
      - protected-view
      description: Within a strategic or local viewing corridor or affecting views of landmarks.
  source-text: Provide annotated elevations relating to heights of viewing planes; photomontages; and
    verified visual montages.
confidence: medium
notes: From the council's list (published 12 April 2024), page 12. Section 7, Photographs, photomontages
  and 3D models.
review-status: unverified
field-status: {}
