reference: air-quality-assessment
local-authority: ISL
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - all:
        - condition:
            field: minor-development
            value: true
            description: Minor development.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Extensions of 100 sq m or greater.
    - discretionary
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: Islington Strategic and Development Management Policies S7; London Plan Guidance Air Quality Neutral
  (2023) and Air Quality Positive (2023)
source-text: Submission of details of the Air Quality Assessment (AQA) as part of the SDCS must be provided.
  The level of detail must be proportionate to the scale of proposed development. … Minor new build developments
  should provide a statement setting out how they are Air Quality Neutral (AQN) referring to GLA Air Quality
  Neutral Guidance (paragraph 3.1.1). If they are not able to fulfil these criteria, they must submit
  an AQA.
must-include:
- item: Refers to the findings of the preliminary AQA
  level: should
- item: How Air Quality Neutral will be achieved
  level: must
- item: 'For developments over 200 net additional residential units or 10,000 sq m net additional gross
    external floorspace: how they are Air Quality Positive'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 200
        description: More than 200 net additional residential units.
    - condition:
        field: floorspace
        operator: '>'
        value: 10000
        description: More than 10,000 sq m net additional gross external floorspace.
confidence: medium
notes: From the council's list (published 12 April 2024), page 25. Section 4.8 c), part of the Sustainable
  Design and Construction Statement. Minor new build developments may give an Air Quality Neutral statement
  instead and need a full AQA only if they cannot meet the criteria, so the minor part shows as discretionary.
review-status: unverified
field-status: {}
