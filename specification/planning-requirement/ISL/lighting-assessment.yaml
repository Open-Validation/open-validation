reference: lighting-assessment
local-authority: ISL
required-if:
  all:
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting.
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        - local-wildlife-site
        description: In the vicinity of a listed building, conservation area or Site of Importance for
          Nature Conservation.
    - discretionary
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies D8 and S5; Islington Strategic and Development Management Policies G4
source-text: Proposals for external lighting or floodlighting in connection with publicly accessible development
  or development which is in the vicinity of a residential property, listed building, conservation area
  or Site of Importance for Nature Conservation
must-include:
- item: Layout plan with beam orientation
  level: must
- item: Schedule of the equipment in the design
  level: must
- item: Hours of operation
  level: must
- item: Light spillage and light levels
  level: must
- item: Column heights
  level: must
- item: Method, type and colour of illumination
  level: must
- item: Size of the light fitting and shielding of the fittings
  level: must
- item: 'For projecting signs: distance from the edge of the sign to the kerb edge'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Effect on biodiversity, particularly on or near a SINC or where bats roost or forage
  level: must
confidence: medium
notes: From the council's list (published 12 April 2024), page 23. Section 4.5. 'Publicly accessible development'
  and 'in the vicinity of a residential property' have no field, so they show as discretionary.
review-status: unverified
field-status: {}
