reference: viability-assessment
local-authority: ISL
required-if:
  any:
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: Triggers the on-site affordable housing requirement.
      - condition:
          field: affordable-workspace-required
          value: true
          description: Triggers the affordable workspace requirement.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: An exceptional case has been demonstrated and accepted by the council before submission.
  - all:
    - condition:
        field: dwelling-count
        operator: <
        value: 10
        description: Residential developments of less than 10 units.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: No Unilateral Undertaking for the full affordable housing or carbon offset contribution.
  - discretionary
source-url: https://www.islington.gov.uk/~/media/sharepoint-lists/public-records/planningandbuildingcontrol/publicity/publicconsultation/20232024/validation-requirements-update-final-april-2024.pdf
policy: London Plan Policies H4, H5, E1, E2, E3, E9, S4, SI2 and DF1; Islington Strategic and Development
  Management Policies H3, B4 and S4; Development Viability SPD
source-text: All proposals which trigger the on-site affordable housing requirement or affordable workspace
  requirement and where an exceptional case has been demonstrated and accepted by the council prior to
  submission of an application. … Residential developments of less than 10 units where a Unilateral Undertaking
  is not being submitted for the full required affordable housing or carbon offset contribution is not
  being submitted. … Other proposals where development viability is a relevant consideration.
must-include:
- item: In line with the Islington Development Viability SPD (Sections 4, 5, 6 and Appendix B)
  level: must
- item: Agreement to pay for the council's assessment, including any specialist expertise
  level: must
- item: An itemised electronic version of the appraisal that can be fully tested (preferably WCFX)
  level: must
- item: 'For on-site affordable housing: whether the proposed level is the maximum reasonable, and the
    approach to review mechanisms (Policy H3)'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: On-site affordable housing.
- item: 'For under 10 units: whether the required affordable housing and carbon offsetting contributions
    are not viable and that any lower payment is the maximum reasonable'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: <
      value: 10
      description: Under 10 units.
confidence: medium
notes: From the council's list (published 12 April 2024), page 38-39. Section 9, Viability. 'Other proposals
  where development viability is a relevant consideration' is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
