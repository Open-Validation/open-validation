reference: application-form
local-authority: KIN
required-if:
  always: true
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Planning Application Form and relevant Ownership Certificate … Yes
must-include:
- item: 'For a variation or removal of condition: the form fully completed with all variations clearly
    identified (for example to change materials, or to insert a window on the east elevation)'
  level: should
  required-if:
    application-type:
      in:
      - s73
  source-text: TO AVOID DELAY IN DETERMINING YOUR APPLICATION – PLEASE ENSURE THAT THE FORM IS FULLY COMPLETED
    AND ALL VARIATIONS ARE CLEARLY IDENTIFIED (i.e. to change materials, to insert a window on east elevation
    etc)
- item: 'For discharge of conditions where there is more than one consent (for example the original consent
    and a variation of condition consent): the correct planning reference number quoted on the form'
  level: should
  required-if:
    application-type:
      in:
      - approval-condition
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 1; Variation
  or Removal of Condition(s) checklist page 1; Discharge of Condition checklist page 1. Every checklist
  asks for the form (with the ownership certificate where relevant), so it shows as always required. The
  fee is a national requirement too (see the unmapped list).
