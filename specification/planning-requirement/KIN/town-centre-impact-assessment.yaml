reference: town-centre-impact-assessment
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - all:
        - condition:
            field: retail-floorspace
            operator: '>'
            value: 2500
            description: Developments exceeding 2,500 m² of (retail) floorspace.
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Outside the existing service centres.
      - all:
        - site:
            in:
            - hardwick-area
            description: In the Hardwick area of King's Lynn, as identified on the Policies Map.
        - condition:
            field: retail-floorspace
            operator: '>='
            value: 500
            description: New retail uses of 500 sqm or more for individual schemes.
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - all:
        - condition:
            field: retail-floorspace
            operator: '>'
            value: 2500
            description: Developments exceeding 2,500 m² of (retail) floorspace.
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Outside the existing service centres.
      - all:
        - site:
            in:
            - hardwick-area
            description: In the Hardwick area of King's Lynn, as identified on the Policies Map.
        - condition:
            field: retail-floorspace
            operator: '>='
            value: 500
            description: New retail uses of 500 sqm or more for individual schemes.
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: King's Lynn and West Norfolk Local Plan 2021-2040 policies LP07 and LP08; NPPF paragraph 90(a)-(f)
source-text: Yes, if your proposal meets the following criteria; • Developments exceeding 2,500m2 of floorspace
  and are outside the existing service centres … Policy LP08 states that Retail impact assessments will
  be required for individual schemes having a gross floorspace greater than 2,500 square metres, although
  in the case of the Hardwick area in King’s Lynn, as identified on the Policies Map, (where there is
  already a significant accumulation of out of town centre retailing) greater weight will be attached
  to the cumulative impact of new development on the town centre. Therefore, new retail uses in the Hardwick
  area of 500 sqm or more for individual schemes will require an impact assessment
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 6. 'Retail
  Assessment'. The Outline (some matters reserved) checklist says 'Yes, if Policy LP08 applies'. At reserved
  matters stage the checklist asks for it only 'If any of the following documents were NOT submitted at
  Outline Application stage', so that part shows as discretionary.
