reference: design-and-access-statement
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
    - site:
        in:
        - conservation-area
        description: The site is in or adjacent to a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) with 100 square metres or more of floorspace.
  - all:
    - application-type:
        in:
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Proposed floorspace over 100 m².
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - conservation-area
          description: The dwelling is in a conservation area.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: More than 100 square metres of floorspace proposed.
  - application-type:
      in:
      - lbc
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  Regulation 3A of the Planning (Listed Buildings and Conservation Areas) Regulations 1990
source-text: Yes, if the proposal is in or adjacent to a Conservation Area and is; i) for the provision
  of one or more dwellings ii) for the provision of building(s) where the floorspace proposed is 100 square
  metres or more iii) a Major Application … Yes, for applications; • Major Applications • Proposed floorspace
  >100m2 • One or more dwelling … If the dwelling lies within a Conservation Area or more than 100 square
  metres of floospace is proposed … Yes, to address; • the special architectural or historic interest
  of the building; • the particular physical features of the building that justify its designation as
  a listed building; and • the building’s setting.
must-include:
- item: 'For listed building consent: the special architectural or historic interest of the building,
    the physical features that justify its designation as a listed building, and the building''s setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Landscaping details
  level: must
  required-if:
    application-type:
      in:
      - full
  source-text: Yes, within the DAS (Design and Access Statement)
confidence: medium
notes: 'From the council''s list (checklists dated 1 April 2026), Full Application checklist page 2; Outline
  Planning (some matters reserved) checklist page 2; Householder checklist page 2; Listed Building checklist
  page 2; Full Application checklist page 7. The Full Application checklist lists ''a Major Application''
  as a third case after the conservation-area cases; it is shown on its own, as the outline checklists
  and the DMPO require a statement for all major applications. The checklists differ on the conservation
  area: the full checklist needs one in or next to a conservation area for dwellings or 100 m² or more,
  the outline checklists for any dwelling or over 100 m², and the householder checklists in a conservation
  area or over 100 m². The Full Application checklist''s ''Landscaping Details'' row is met within the
  statement.'
review-status: unverified
field-status: {}
