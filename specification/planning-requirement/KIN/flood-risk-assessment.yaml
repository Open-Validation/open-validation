reference: flood-risk-assessment
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: The site is in an area at risk of any type of flooding.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: The site is in an area at risk of any type of flooding.
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: If you are at risk of flooding, and depending on your proposal, you will need to submit one
  of the following; - A full flood risk assessment - SFRA Proforma for sequential and exception tests
  (template available on the link above) … Yes, if you are in a Flood Risk Area, regardless of the Risk.
  … THIS SHOULD HAVE BEEN SUBMITTED AT OUTLINE APPLICATION STAGE
must-include:
- item: Either a full flood risk assessment or the council's SFRA Proforma for the sequential and exception
    tests, depending on the proposal
  level: must
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 2; Householder
  checklist page 2; Reserved Matters checklist page 3. 'Flood Risk Assessment Matrix'. Householder applications
  need it in any flood risk area, regardless of the risk (the council's Householder Matrix for Flood Risk).
  For other applications it depends on the proposal as well as the flood risk, so that part shows as discretionary.
  At reserved matters stage it 'should have been submitted at outline application stage'.
review-status: unverified
field-status: {}
