reference: fire-statement
local-authority: KIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building with 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Contains educational accommodation.
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Part 3, Regulation 9A of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: Yes, if your application is for; A building 18 metres or more in height or contains 7 or
  more storeys, and contains; •Two or more dwellings •Educational Accommodation
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 5; Reserved
  Matters checklist page 2.
review-status: unverified
field-status: {}
