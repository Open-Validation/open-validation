reference: noise-assessment
local-authority: KIN
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals that generate noise, such as industrial or commercial developments (factory
          or industrial units, warehousing, intensive animal housing, licensed premises).
    - condition:
        field: plant-equipment
        value: true
        description: New or replacement equipment that can generate significant noise (refrigeration plant,
          air conditioning, sewage treatment pumps, air source heat pumps, wind turbines), including at
          homes and smaller commercial units such as restaurants and takeaways.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New noise-sensitive receptors (homes, hospitals, schools) next to sources of noise
          such as roads, railways, commercial or industrial sources, pubs and clubs.
    - condition:
        field: mixed-use
        value: true
        description: Developments with mixed use.
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: Yes, for proposals that; • generate noise such as industrial and/or commercial developments,
  for example factory or industrial units, warehousing, intensive animal housing, licenced premises or,
  • include new or replacement equipment that can generate significant levels of noise e.g. refrigeration
  plant, equipment, air conditioning plant, sewage treatment plants requiring pumping equipment, air source
  heat pumps, wind turbines and other uses/forms of development including such equipment at residential
  properties and smaller commercial units such as restaurants and takeaways or, • The introduction of
  new noise sensitive receptors (such as those associated with new residential dwellings, hospitals, or
  schools) adjacent to sources of noise, including roads, railways, commercial, industrial sources, pubs
  and clubs. • Developments with mixed use
must-include:
- item: Carried out by a suitably qualified and competent person
  level: must
- item: 'For residential development: follows the principles of ProPG: Planning & Noise – New Residential
    Development, unless otherwise agreed by the council''s Community Safety and Neighbourhood Nuisance
    team'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: 'For a commercial kitchen ventilation or extraction system: a statement on the position and design
    of the ventilation and extraction equipment, with noise abatement techniques if necessary (EMAQ+ guidance)'
  level: must
  required-if:
    condition:
      field: food-or-drink-use
      value: true
      description: A commercial kitchen ventilation or extraction system.
- item: Refers where relevant to BS 4142, BS 8233, BS 5228-1 and -2, the PPG on noise and the Noise Policy
    Statement for England
  level: should
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 7. 'Noise
  Impact Assessment' (Full Application checklist only).
review-status: unverified
field-status: {}
