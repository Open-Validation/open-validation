reference: biodiversity-survey-report
local-authority: KIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        description: Development likely to affect internationally and nationally designated sites.
    - condition:
        field: protected-species
        value: true
        description: Development likely to affect European and nationally protected species.
    - site:
        in:
        - priority-habitat
        description: Development likely to affect priority habitats and species.
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: 'Yes if; • Major application • All development likely to affect: a) Internationally and nationally
  designated sites; b) European and nationally protected species; c) Priority habitats and species; and
  d) Significant populations of national or local Red List or notable species.'
must-include:
- item: Surveys follow BS 42020:2013 (Biodiversity – Code of practice for planning and development) and
    CIEEM guidance for EcIA, or a PEA
  level: must
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 4; Outline
  Planning (some matters reserved) checklist page 3. 'Ecological Impact Assessment (including protected
  species surveys)', on the full and outline checklists. 'Significant populations of national or local
  Red List or notable species' is a judgement, so it shows as discretionary.
review-status: unverified
field-status: {}
