reference: biodiversity-survey-report
local-authority: KIN
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - priority-habitat
      description: Development likely to affect internationally or nationally designated sites, or priority
        habitats.
  - condition:
      field: protected-species
      value: true
      description: Development likely to affect European or nationally protected species.
  - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: 'Major application All development likely to affect: a) Internationally and nationally designated
  sites; b) European and nationally protected species; c) Priority habitats and species; and d) Significant
  populations of national or local Red List or notable species.'
must-include:
- item: Surveys following BS 42020:2013
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): this ecology trigger had been filed under Fire Statement. Red List or notable
  species have no field, so they are shown as officer judgement.'
review-status: unverified
field-status: {}
