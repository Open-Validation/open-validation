reference: cil-form
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
    - any:
      - condition:
          field: retrospective
          value: true
          description: The work has already started.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: More than 100 square metres of floorspace proposed.
      - condition:
          field: residential-annexe
          value: true
          description: An extension or conversion of an existing building to create a residential annexe.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - s73
        - ldc-prospective-use
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: If the work has already started or the more than 100 square metres of floorspace is proposed.
  CIL Forms must be submitted if your proposal is for an extension or conversion of an existing building
  to create a residential Annexe. … Please see website for validation information to be submitted
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 3; Outline
  Planning (some matters reserved) checklist page 7. Full and householder checklists give the triggers.
  The outline, reserved matters, variation of condition and proposed lawful development certificate checklists
  say only 'Please see website for validation information to be submitted', so those show as discretionary.
review-status: unverified
field-status: {}
