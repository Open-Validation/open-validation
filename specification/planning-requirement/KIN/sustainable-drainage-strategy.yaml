reference: sustainable-drainage-strategy
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - condition:
          field: drainage-alterations
          value: true
          description: The proposal connects to the existing drainage system, changes or replaces the
            existing system, or creates a new system.
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: drainage-alterations
          value: true
          description: The proposal connects to the existing drainage system, changes or replaces it,
            or creates a new system.
    - discretionary
  - all:
    - application-type:
        in:
        - approval-condition
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Planning Practice Guidance; NPPF paragraphs 164(a) and 182; National Standards for Sustainable
  Drainage Systems (30 July 2025); Norfolk LLFA Statutory Consultee Guidance Document (Version 7.3, April
  2025)
source-text: Yes, for applications; • Which it is proposed to connect to the existing drainage system
  • For applications where changes/replacement to the existing system is proposed • For applications where
  the creation of a new system is proposed • For all Major Applications … PLEASE SEE SURFACE WATER DRAINAGE
  INFORMATION ON THE DISCHARGE OF CONDITION VALIDATION CHECKLIST
must-include:
- item: A single report with all investigations, drawings and calculations as appendices, and the completed
    council checklist showing where each item is
  level: should
- item: 'Hydrological and hydrogeological context: existing drainage, site surveys, infiltration testing
    to BRE 365 and groundwater levels (or evidence that infiltration is not feasible)'
  level: should
- item: Method and location of existing and proposed surface water disposal, following the sustainable
    drainage hierarchy
  level: should
- item: Existing and proposed catchment areas (permeable and impermeable) with an allowance for urban
    creep
  level: should
- item: Existing, greenfield and proposed discharge rates, attenuation volumes, flow controls and SuDS
    design
  level: should
- item: Detailed drainage layout with levels, pipe and manhole references matching the calculations, finished
    floor levels and external ground levels
  level: should
- item: Long sections and cross sections, including all SuDS features and flow controls
  level: should
- item: Hydraulic calculations of the entire system, including climate change and urban creep
  level: should
- item: SuDS water quality assessment (simple index approach or detailed assessment)
  level: should
- item: Plan of exceedance flow routes, stored flood volumes and any flood risk mitigation
  level: should
- item: Coordination with landscaping and how SuDS deliver water quality, biodiversity and amenity benefits
  level: should
- item: Agreement in principle for discharge with the sewer undertaker or third party (IDB, EA or LLFA)
    where relevant
  level: should
- item: Management and maintenance plan for the lifetime of the development, including riparian responsibilities
    where a watercourse is present
  level: should
- item: How the drainage system is protected, and runoff managed, during construction
  level: should
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 9; Discharge
  of Condition checklist page 4. 'Assessment of treatment of Foul and Surface Water including SUDS'. The
  contents are the 'Surface Water Drainage Conditions – Minor / Non Major Applications' list on the Discharge
  of Condition checklist (V4 11/2025), which the Full Application checklist points to; householder schemes
  have a shorter nine-point list there. Discharge of a drainage condition shows as discretionary. The
  foul drainage strategy for off-mains solutions has no matching id (see the unmapped list). At reserved
  matters stage the checklist asks for it only 'If any of the following documents were NOT submitted at
  Outline Application stage', so that part shows as discretionary.
review-status: unverified
field-status: {}
