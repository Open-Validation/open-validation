reference: planning-statement
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: eia-development
          value: true
          description: Applications requiring an Environmental Assessment.
      - ref: major-development
      - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: eia-development
          value: true
          description: Applications requiring an Environmental Assessment.
      - ref: major-development
      - discretionary
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: King's Lynn and West Norfolk Local Plan 2021-2040; King's Lynn and West Norfolk Neighbourhood
  Plans; NPPF
source-text: Yes, if; • For applications requiring an Environmental Assessment • For Major Applications
  • For Significant Applications
must-include:
- item: Shows how the proposal has taken into consideration policies in the Local Plan, Neighbourhood
    Plans and the NPPF
  level: should
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 5. 'Supporting
  Planning Statement'. 'Significant Applications' is not defined, so it shows as discretionary. A statement
  can be submitted with any application. At reserved matters stage the checklist asks for it only 'If
  any of the following documents were NOT submitted at Outline Application stage', so that part shows
  as discretionary.
review-status: unverified
