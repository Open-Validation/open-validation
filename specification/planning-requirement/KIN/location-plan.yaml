reference: location-plan
local-authority: KIN
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
    - advertising
    - ldc
    - pa-build-agri-forest
    - pa-road-agri-forest
    - pa-excavate-agri
    - pa-fish-struct
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Location Plan … Yes
must-include:
- item: In most cases at a scale of 1:1250 or 1:2500
  level: should
- item: A north point
  level: must
- item: The curtilage (boundary) of the application site marked in red
  level: must
- item: Any other land owned by the applicant that is not part of the application marked in blue
  level: should
- item: 'Identical to the land identified at outline stage: no land can be added at reserved matters stage'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: Yes – this must be identical to the land identified at Outline Application stage, additional
    land cannot be added on the submission of Reserved Matters.
- item: For directional signs not on the premises, more than one location plan may be needed
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 1; Reserved
  Matters checklist page 1; Advertisement Consent checklist page 1. Required on the full, outline, reserved
  matters, householder, listed building, advertisement, lawful development and agricultural prior notification
  checklists (Schedule 2, Part 6 of the GPDO); the variation of condition, discharge of condition and
  tree checklists do not ask for one. The agricultural checklist adds that a scaled location and site
  plan 'would assist'.
review-status: unverified
