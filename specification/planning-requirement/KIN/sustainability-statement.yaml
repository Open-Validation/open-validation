reference: sustainability-statement
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Site of 1 hectare or more.
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: King's Lynn and West Norfolk Local Plan 2021-2040 policy LP06
source-text: For any proposals on sites of 1ha or more … Policy LP06 of the Kings Lynn and West Norfolk
  Local Plan requires that a Sustainability and Climate Change Statement be submitted in order to Validate
  a Planning application, where the site area is 1ha or more.
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 6; Outline
  Planning (some matters reserved) checklist page 6. 'Climate Change Statement' (a Sustainability and
  Climate Change Statement under Policy LP06). At reserved matters stage the checklist asks for it only
  'If any of the following documents were NOT submitted at Outline Application stage', so that part shows
  as discretionary.
review-status: unverified
field-status: {}
