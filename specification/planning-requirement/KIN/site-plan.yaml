reference: site-plan
local-authority: KIN
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - s73
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: freestanding-advert
        value: true
        description: The advertisements are to be displayed on land.
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Yes, … Yes, unless; The footprint of the existing dwelling or outbuildings are not changing.
  A site plan is also required in order to identify the exact positions of any new gates, walls and fences.
  … Not if the application is for internal alterations only or amendments to the elevations … Yes, if
  the Advertisements are to be displayed on land, you must identify the exact location on a scaled Site
  Plan. … Yes, and even in circumstances where Access is being Reserved, an indication of the Access must
  be shown on the Site Plan and marked “Indicative Access” … Yes, but this depends on what the application
  involves.
must-include:
- item: In most cases at a scale of 1:200 or 1:500
  level: should
- item: A north point
  level: should
- item: The curtilage (boundary) of the application site marked in red
  level: must
- item: Any other land owned by the applicant that is not part of the application marked in blue
  level: should
- item: Existing and proposed plans showing ALL features of the site, including buildings, hardstanding
    areas, parking, gates, walls, fences and landscaping (including trees)
  level: must
- item: The exact positions of any new gates, walls and fences
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: New gates, walls or fences are proposed.
- item: 'For outline applications: an indication of the access marked ''Indicative Access'', even where
    access is reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'For advertisements displayed on land: the exact location of the advertisements, on a scaled plan'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 1; Householder
  and Listed Building Consent checklist page 2; Listed Building checklist page 1; Advertisement Consent
  checklist page 1; Outline Planning (some matters reserved) checklist page 1; Lawful Development Certificate
  (existing) checklist page 1. 'Existing and Proposed Site Plans'. The plain Householder checklist says
  'Yes'; the Householder and Listed Building Consent checklist excuses it where the footprint is not changing.
  Listed building consent (not for internal alterations or elevation changes only) and lawful development
  certificates ('depends on what the application involves') show as discretionary. The Listed Building
  variation of condition checklist asks for it 'If anything outside of the building is proposed to be
  re-sited or changed in any way'.
review-status: unverified
field-status: {}
