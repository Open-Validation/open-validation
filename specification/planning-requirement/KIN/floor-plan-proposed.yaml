reference: floor-plan-proposed
local-authority: KIN
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
    - discretionary
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - outline-some
        - reserved-matters
    - condition:
        field: matters-beyond-access
        value: true
        description: The application includes appearance, landscaping, layout or scale (not only access).
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The variation changes the approved drawings.
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Yes, existing and proposed drawings will be required for most development … Yes, existing
  and proposed drawings will always be required. … If the application is for internal works only, please
  provide only existing and proposed floorplans … Relevant floorplans, elevations, roof plans and sections
  will be required if any of the following are included in the Outline Application; • Appearance • Landscaping
  • Layout • Scale … Yes, drawings must be included for all Matters Reserved. … Yes, obviously depending
  on what is being varied. … Yes, but this depends on what the application involves.
must-include:
- item: To a scale of 1:100
  level: must
- item: 'For a variation of condition: drawing version numbers updated, as approved drawings will be listed
    on a condition'
  level: should
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 2; Householder
  and Listed Building Consent checklist page 2; Listed Building checklist page 1; Outline Planning (some
  matters reserved) checklist page 2; Reserved Matters checklist page 2; Variation or Removal of Condition(s)
  checklist page 1; Lawful Development Certificate (existing) checklist page 1. 'Application Drawings'
  (roof plans, floor plans, elevations and sections, existing and proposed). 'Most development' (full
  applications) and lawful development certificates ('depends on what the application involves') show
  as discretionary. Outline applications with all matters reserved have no drawings row. For variations
  of condition the drawings depend on what is being varied, shown as the approved drawings changing. For
  listed building consent for internal works only, floor plans are the only drawings needed.
review-status: unverified
field-status: {}
