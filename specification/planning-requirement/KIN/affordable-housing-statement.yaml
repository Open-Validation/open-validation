reference: affordable-housing-statement
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings (King's Lynn, Hunstanton and Downham Market).
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.33
          description: Site of 0.33 ha or more (King's Lynn, Hunstanton and Downham Market).
      - all:
        - site:
            in:
            - rural-area
            description: The site is in the rural areas.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 5
              description: 5 or more dwellings in the rural areas.
          - condition:
              field: site-area-residential
              operator: '>='
              value: 0.165
              description: Site of 0.165 ha or more in the rural areas.
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings (King's Lynn, Hunstanton and Downham Market).
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.33
          description: Site of 0.33 ha or more (King's Lynn, Hunstanton and Downham Market).
      - all:
        - site:
            in:
            - rural-area
            description: The site is in the rural areas.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 5
              description: 5 or more dwellings in the rural areas.
          - condition:
              field: site-area-residential
              operator: '>='
              value: 0.165
              description: Site of 0.165 ha or more in the rural areas.
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: King's Lynn and West Norfolk Local Plan 2021-2040 policy LP28
source-text: Yes, If your application is for New Dwellings and meets the following criteria; Sites of
  0.33ha or more or 10 or more dwellings in Kings Lynn, Hunstanton and Downham Market or 0.165ha or more
  or 5 dwellings in rural areas
must-include:
- item: A Heads of Terms document (council template) so the council can prepare the legal agreement
  level: must
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 6. 'Affordable
  Housing Contributions'. The 10-dwelling / 0.33 ha threshold applies in King's Lynn, Hunstanton and Downham
  Market and is shown without a location, because any site above it also passes the lower rural threshold.
  At reserved matters stage the checklist asks for it only 'If any of the following documents were NOT
  submitted at Outline Application stage', so that part shows as discretionary.
review-status: unverified
field-status: {}
