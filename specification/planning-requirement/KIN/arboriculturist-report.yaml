reference: arboriculturist-report
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the application site or on land adjacent to it that could influence
          or be affected by the development, even if not protected.
  - all:
    - application-type:
        in:
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the application site or on land adjacent to it that could influence
          or be affected by the development, even if not protected.
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: Yes, where there are trees within the application site or on land adjacent to it that could
  influence or be affected by the development, even if the trees are not protected.
must-include:
- item: Survey carried out in accordance with BS5837
  level: must
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 10. 'Tree
  Survey'. At reserved matters stage the checklist asks for it only 'If any of the following documents
  were NOT submitted at Outline Application stage', so that part shows as discretionary.
review-status: unverified
field-status: {}
