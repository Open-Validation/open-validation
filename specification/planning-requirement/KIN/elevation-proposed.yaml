reference: elevation-proposed
local-authority: KIN
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
    - discretionary
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: The listed building works are not internal works only.
  - all:
    - application-type:
        in:
        - outline-some
        - reserved-matters
    - condition:
        field: matters-beyond-access
        value: true
        description: The application includes appearance, landscaping, layout or scale (not only access).
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The variation changes the approved drawings.
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
  - application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: The advertisements are on a building.
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Yes, existing and proposed drawings will be required for most development … Yes, existing
  and proposed drawings will always be required. … If the application is for internal works only, please
  provide only existing and proposed floorplans … Relevant floorplans, elevations, roof plans and sections
  will be required if any of the following are included in the Outline Application; • Appearance • Landscaping
  • Layout • Scale … Yes, drawings must be included for all Matters Reserved. … Yes, obviously depending
  on what is being varied. … Yes, but this depends on what the application involves. … Yes, if the Advertisements
  are on a building you will need to submit proposed elevations, together with drawings of the advertisements
  to scale.
must-include:
- item: To a scale of 1:100
  level: must
- item: 'For advertisements: drawings of the advertisements at 1:50 or 1:100 showing size, siting, materials
    and colours, height above ground, and the method and colour(s) of any internal or external illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisements: proposed elevations at 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisements: external lighting details (if applicable)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For a variation of condition: drawing version numbers updated, as approved drawings will be listed
    on a condition'
  level: should
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: 'From the council''s list (checklists dated 1 April 2026), Full Application checklist page 2; Householder
  and Listed Building Consent checklist page 2; Listed Building checklist page 1; Outline Planning (some
  matters reserved) checklist page 2; Reserved Matters checklist page 2; Variation or Removal of Condition(s)
  checklist page 1; Lawful Development Certificate (existing) checklist page 1. ''Application Drawings''
  (roof plans, floor plans, elevations and sections, existing and proposed). ''Most development'' (full
  applications) and lawful development certificates (''depends on what the application involves'') show
  as discretionary. Outline applications with all matters reserved have no drawings row. For variations
  of condition the drawings depend on what is being varied, shown as the approved drawings changing. For
  listed building consent for internal works only the checklist asks for floor plans only, so elevations
  are needed where the works are not internal only. The Agricultural Prior Notification checklist asks
  for ''Application Drawings including Roof Plans'' (page 2), shown here for proposed elevations and roof
  plans. Advertisement Consent checklist page 2: proposed elevations and advertisement drawings when the
  advertisements are on a building; advertisements not on a building need scaled drawings of the advertisements
  only.'
review-status: unverified
