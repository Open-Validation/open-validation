reference: landscaping-plan
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - condition:
        field: landscaping-works
        value: true
        description: Landscaping is one of the matters applied for.
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: Drawings to a recognisable scale, showing hard and soft landscaping may also be required.
  … Landscaping drawings to scale, showing proposed soft and hard Landscaping and Open Space
must-include:
- item: Drawn to a recognisable scale, showing hard and soft landscaping
  level: must
- item: 'For reserved matters: the proposed open space'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 7; Reserved
  Matters checklist page 2. 'Landscaping Details' are needed within the Design and Access Statement on
  full applications; drawings 'may also be required', so they show as discretionary. At reserved matters
  stage they are among the drawings for the matters reserved.
review-status: unverified
