reference: heritage-statement
local-authority: KIN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - advertising
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        description: Within the curtilage of a listed building, in a conservation area, or affecting a
          scheduled monument, a registered park and garden, a non-designated heritage asset, or the setting
          of a heritage asset (for example next to a conservation area or listed building).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: The dwelling is a listed building (Householder and Listed Building Consent).
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: National Planning Policy Framework
source-text: Yes, if your proposal falls within one of the following; • Listed Building Consent; • Applications
  within the curtilage of a listed building (an area of land surrounding a property, including any closely
  associated buildings and structures) • Applications for sites within a conservation area; • Applications
  affecting Scheduled Monuments; • Applications affecting a Registered Park & Garden; • Applications affecting
  non-designated heritage assets (buildings of local interest); • Applications affecting the setting of
  a heritage asset (i.e. adjacent to a conservation area or listed building) … Yes, if your proposal may
  affect as heritage asset, defined as; those parts of the historic environment that have significance
  because of their historic, archaeological, architectural or artistic interest. These can be manifested
  as Listed Buildings, Conservation Areas and Scheduled Ancient Monuments
must-include:
- item: Describes the significance of any heritage assets affected, including any contribution made by
    their setting
  level: must
- item: Detail proportionate to the assets' importance and sufficient to understand the potential impact
    of the proposal on their significance
  level: should
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 4; Outline
  Planning (some matters reserved) checklist page 7. 'Listed Building and/or Conservation Area Heritage
  Statement' (full, outline, listed building, advertisement and householder-with-listed-building-consent
  checklists; the outline and reserved matters checklists add a local 'Heritage Statement' row). The plain
  Householder checklist has no heritage row. The council has a Heritage Statement template.
review-status: unverified
