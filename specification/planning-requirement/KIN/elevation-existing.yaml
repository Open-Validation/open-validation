source-text: 'Householder: Roof Plan – to a scale of 1:100 PLEASE DO NOT MARK DRAWINGS Floor Plans – to
  a scale of 1:100 “NOT TO SCALE” AS THIS WILL Elevations – to a scale of 1:100 INVALIDATE YOUR APPLICATION
  Sections – to a scale of 1:100 showing site levels and finished floor levels Listed Building and/or
  The National Planning Policy Framework (NPPF) states that Local Yes, if your proposal falls within one
  of Conservation Area Heritage Planning Authorities should require applicants to “describe the the following;


  Full planning: of 1:100 Floor Plans – to a scale of 1:100 Elevations – to a scale of 1:100 Sections
  – to a scale of 1:100 showing site levels and finished floor levels Other plans may be required, depending
  on the proposal.


  Outline: Floor Plans – to a scale of 1:100


  Reserved matters: Roof Plan – to a scale of 1:100 Floor Plans – to a scale of 1:100 Elevations – to
  a scale of 1:100 Sections – to a scale of 1:100 showing site levels and finished floor levels Depending
  on what matters are Reserved from your Outline Planning Consent, all or some of the following will be
  required;


  Advertisement consent: Drawings Proposed Elevations – 1:50 or 1:100 Yes, if the Advertisements are on
  a Advertisement Drawings – 1:50 or 1:100 showing size, siting, materials building you will need to submit
  and colours to be used, height above ground, details of method and proposed elevations, together with
  colour(s) of illumination for internal and external illumination. drawings of the advertisements to
  Section Through – 1:50 or 1:100 showing extent of projection scale.


  Lawful development cert: are unsure Floor Plans – to a scale of 1:100 Elevations – to a scale of 1:100
  Sections – to a scale of 1:100 showing site levels and finished floor levels Depending on your application
  will depend on what evidence you need to Yes submit.


  Variation of condition s73: approved, the Floor Plans – to a scale of 1:100 drawings will be listed
  on a Condition Elevations – to a scale of 1:100 attached to the Planning Permission.'
