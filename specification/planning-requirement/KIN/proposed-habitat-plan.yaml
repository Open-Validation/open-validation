reference: proposed-habitat-plan
local-authority: KIN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
policy: Environment Act 2021; Biodiversity Gain Requirements (Exemptions) Regulations 2024; Biodiversity
  Gain (Amendments and Transition Provisions) Regulations 2026
source-text: The Application should include a draft Biodiversity Gain Plan; completed *Statutory Biodiversity
  Metric and *Habitat Plan (to scale) for both baseline and post-intervention habitats and *condition
  assessment sheets for the pre-development habitats. … Yes for; • Major development • Non-Major development
  marked * • Offsite net gain is proposed that is not delivered through Habitat Bank Units** • On-site
  significant gain**
must-include:
- item: Habitat plan to scale for the post-intervention habitats
  level: must
confidence: medium
notes: 'From the council''s list (checklists dated 1 April 2026), Full Application checklist page 3; Outline
  Planning (some matters reserved) checklist page 3. On the full and outline checklists. Items marked
  * are needed for non-major development too. Shown by law: only development subject to the biodiversity
  gain condition needs it (householder and other exempt applications are exempt). The draft Biodiversity
  Gain Plan, the HMMP and the monitoring-fee Unilateral Undertaking have no matching id (see the unmapped
  list). The variation of condition checklist has a BNG row about permissions granted (or applied for)
  before 12 February / 2 April 2024 (page 2).'
review-status: unverified
field-status: {}
