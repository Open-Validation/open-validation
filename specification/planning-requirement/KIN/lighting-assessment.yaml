reference: lighting-assessment
local-authority: KIN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: floodlighting
          value: true
          description: Floodlighting.
      - all:
        - condition:
            field: external-lighting
            value: true
            description: Illumination.
        - site:
            in:
            - rural-area
            description: In the countryside.
      - all:
        - condition:
            field: external-lighting
            value: true
            description: External lighting.
        - site:
            in:
            - dark-sky-area
            description: The neighbourhood plan has a 'Dark Skies' policy.
      - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: floodlighting
          value: true
          description: Floodlighting.
      - all:
        - condition:
            field: external-lighting
            value: true
            description: Illumination.
        - site:
            in:
            - rural-area
            description: In the countryside.
      - all:
        - condition:
            field: external-lighting
            value: true
            description: External lighting.
        - site:
            in:
            - dark-sky-area
            description: The neighbourhood plan has a 'Dark Skies' policy.
      - discretionary
    - discretionary
source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
source-text: • Yes, for applications where; • the development is likely to result in a material increase
  in levels of light pollution (for example floodlighting or illumination in the countryside). • There
  is a “Dark Skies” Policy in the Neighbourhood Plan
must-include:
- item: Details of any existing and proposed external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation and a schedule of the equipment (such as manufacturers' specifications)
  level: must
- item: How any artificial light spill may extend beyond the site into neighbouring properties and gardens
  level: must
confidence: medium
notes: From the council's list (checklists dated 1 April 2026), Full Application checklist page 9. 'Lighting
  Scheme / Light Pollution Assessment' (refers to ILP GN01 For the reduction of obtrusive light 2021).
  Floodlighting and lighting in the countryside are the list's examples; whether another scheme is 'likely
  to result in a material increase' is a judgement, so it shows as discretionary. At reserved matters
  stage the checklist asks for it only 'If any of the following documents were NOT submitted at Outline
  Application stage', so that part shows as discretionary.
review-status: unverified
field-status: {}
