reference: flood-risk-assessment
local-authority: PTE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - mineral-extraction
        - waste-dev
    - any:
      - site:
          in:
          - flood-risk-zone
          description: The site is in Flood Zone 2 or 3 (Environment Agency standing advice applies).
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 1
            description: Sites outside Flood Zones 2 and 3 that are over 1 hectare.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 1
            description: Sites outside Flood Zones 2 and 3 that are over 1 hectare.
      - site:
          in:
          - critical-drainage-area
          description: Sites outside Flood Zones 2 and 3 within a Critical Drainage Area.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: 'Householder: the property is in flood zone 2 or 3.'
    - condition:
        field: footprint-increase
        value: true
        description: The proposed development will increase the footprint of the property.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: NPPF; Environment Agency Flood Risk Standing Advice
source-text: Sites that are over 1 hectare or that are within a Critical Drainage Area . If your property
  is located within flood zone 2 or 3 and the proposed development will increase the footprint of your
  property, please complete the form at the bottom of this page and send it to us as part of your application.
must-include:
- item: 'Where a sequential test is required: evidence that it is passed, normally as part of the FRA
    (not needed for sites allocated in the Development Plan or for minor development in Flood Zones 2
    and 3)'
  level: must
  source-text: Where a sequential test is required in accordance with paragraph 103 of the National Planning
    Policy Framework, the applicant is required to provide the evidence to demonstrate the sequential
    test is passed with the submitted application (normally as part of an FRA). This is required by paragraph
    030 of the National Planning Practice Guidance. Where no such sequential test evidence is provided
    the application will be invalid.
- item: 'Householder: the Environment Agency''s flood risk assessment form, with supporting evidence such
    as floor levels'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Please note that you will also need to submit supporting evidence as part of your application
    e.g. floor levels etc.
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Householder (PF01)' page. The page tells applicants to check
  the flood zone and follow the Environment Agency's Flood Risk Standing Advice to decide whether an FRA
  is needed, and to discuss the scope of a full FRA with the Environment Agency and the council.
review-status: unverified
field-status: {}
