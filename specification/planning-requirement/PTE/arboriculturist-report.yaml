reference: arboriculturist-report
local-authority: PTE
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees are on or adjacent to the proposed site.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/householder-works-or-extension-pf01
source-text: 'Tree or Arboricultural Survey - Local requirement - Required for all Minor Proposals (including
  householder) where trees are on or adjacent to the proposed site … Tree survey Arboricultural Impacts
  Assessment Tree Protection Plan The above must be in accordance with BS5837:2012: Trees in relation
  to design, demolition and construction.'
must-include:
- item: Tree survey, arboricultural impacts assessment and tree protection plan in accordance with BS5837:2012
  level: must
- item: A Level 2 BS5837 survey
  level: must
  required-if:
    any:
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Trees covered by a TPO or in a conservation area.
    - ref: major-development
confidence: medium
