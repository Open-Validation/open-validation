reference: arboriculturist-report
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline-some
      - outline-all
      - mineral-extraction
      - waste-dev
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on or adjacent to the site (within 15 metres of the proposed development).
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: NPPF
source-text: 'Level One: Basic Information Required for all Minor Proposals (including householder) where
  trees are on or adjacent to the proposed site. Where trees on an application (and/or within 15 metres
  of the proposed development) site are: protected by a Tree Preservation Order; or located within a Conservation
  Area; or the proposal is for major development'
must-include:
- item: 'Level one: location of all trees (stem diameter over 75mm at 1.5m) within the red line and within
    15m of the work area and accesses, shown on the block plan'
  level: must
- item: 'Level one: a list of all trees to be removed and a schedule of any proposed pruning to retained
    trees'
  level: must
- item: 'Level two: a tree survey, an Arboricultural Impacts Assessment and a Tree Protection Plan to
    BS5837:2012'
  level: must
  required-if:
    any:
    - site:
        in:
        - tree-preservation-zone
        description: Trees protected by a Tree Preservation Order.
    - site:
        in:
        - conservation-area
        description: Trees located within a Conservation Area.
    - ref: major-development
- item: 'Level two: root protection area infringements identified with solutions; drainage, soakaway and
    service runs plotted on the Tree Protection Plan, site plan and landscaping plan'
  level: must
  required-if:
    any:
    - site:
        in:
        - tree-preservation-zone
        description: Trees protected by a Tree Preservation Order.
    - site:
        in:
        - conservation-area
        description: Trees located within a Conservation Area.
    - ref: major-development
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page. Both levels apply 'unless otherwise confirmed in writing by
  the PCC tree officer OR a PCC planning officer as part of pre-application advice'. The council may be
  flexible for major sites where the development, compound and access are more than 15m from any trees.
review-status: unverified
