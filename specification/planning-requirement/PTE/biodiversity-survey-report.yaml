reference: biodiversity-survey-report
local-authority: PTE
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - waste-dev
      - demolition-con-area
      - lbc
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - hh
        - outline-some
        - outline-all
    - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations; Badgers Act
  1992
source-text: If you answer "yes" to the questions in the checklist you will be required to carry out a
  survey or obtain a statement from a suitably qualified ecologist. Please see the checklists for the
  requirements. Always required. The report should provide sufficient information to allow a robust assessment
  of the potential impacts resulting from a development upon the species present on an application site
  to be undertaken. Surveys should be undertaken by suitably experienced, and where necessary licensed,
  ecological specialists.
must-include:
- item: 'Protected species survey: enough information for a robust assessment of the potential impacts
    on the species present on the site'
  level: must
- item: Undertaken by suitably experienced, and where necessary licensed, ecological specialists
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Carrying out of Mineral Working and Associated Development'
  page; 'Demolition in a Conservation Area (PF10)' page; 'Listed Building Consent (PF11)' page. The minerals,
  demolition in a conservation area and listed building consent pages say a protected species survey is
  'Always required'. On the other pages a survey (or a statement from a qualified ecologist) is needed
  only where the Biodiversity Checklist answers are 'yes', so it is shown as discretionary; the checklist
  itself is in the unmapped list.
review-status: unverified
field-status: {}
