reference: transport-assessment
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-some
      - outline-all
      - mineral-extraction
      - waste-dev
  - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: NPPF
source-text: Required for all developments that are likely to generate significant amounts of movement.
must-include:
- item: All existing and proposed commercial and residential vehicular and pedestrian movements to and
    from the site
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles
  level: should
- item: Existing transport conditions, how the development would affect them and measures to overcome
    any problems
  level: must
- item: 'Larger schemes: accessibility by all modes and the likely modal split of journeys'
  level: must
  required-if: discretionary
- item: Proposed measures to improve access by public transport, walking and cycling, reduce parking need
    and mitigate transport impacts
  level: should
- item: 'Minor developments with some traffic implications: a transport statement (can be in the Design
    and Access or Planning Statement) setting out the traffic implications and how the design responds'
  level: must
  required-if: discretionary
  source-text: Minor developments which will have some traffic implications but not significant enough
    to warrant a full transport assessment, a transport statement must be included but this can be included
    in the Design and Access Statement (under access) or in a Planning Statement etc. It must briefly
    set out the traffic implications of the development and how the design and layout of the proposal
    responds to this.
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page. 'Significant amounts of movement' is a judgement (the page points
  to the indicative thresholds in the DfT guidance), so shown as discretionary.
review-status: unverified
field-status: {}
