reference: site-plan
local-authority: PTE
required-if:
  application-type:
    in:
    - reserved-matters
    - land-drainage-consent
    - change-of-use
    - full
    - hh
    - ldc-prospective-use
    - lbc
    - ldc-existing-use
    - outline-all
    - outline-some
    - mineral-extraction
    - waste-dev
    - prior-approval
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required Existing site layout plans to a recognised scale (1:100, 1:200 or 1:500 as
  appropriate) Proposed site layout plans to a recognised scale (1:100, 1:200 or 1:500 as appropriate)
must-include:
- item: Existing and proposed site layout plans at a recognised scale (1:100, 1:200 or 1:500)
  level: must
- item: The direction of North and a scale bar or metric measurements
  level: should
- item: Buildings, roads and footpaths on adjoining land including access arrangements; public rights
    of way crossing or adjoining the site; trees on the site and adjacent land; hard surfacing; boundary
    treatment (unless they would not influence or be affected by the development)
  level: should
- item: Existing and proposed car parking and turning arrangements, and bin and cycle stores
  level: should
- item: Plans accurately labelled and numbered
  level: must
- item: 'For reserved matters: plans indicating the site and showing the existing and proposed development,
    to an identified scale or with measurements'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: A plan indicating the site and showing the existing development, drawn to an identified
    scale or with measurements (in metres).
- item: 'For works affecting a watercourse: the existing site including any watercourse; structures that
    may influence local river hydraulics (bridges, pipes, crossings, culverts, screens, embankments, walls,
    outfalls); existing fish passes; at a clearly stated scale'
  level: must
  required-if:
    application-type:
      in:
      - land-drainage-consent
  source-text: 'You must provide a plan of the site showing: The existing site, including any watercourse;
    The plan should be drawn to an appropriate scale, which must be clearly stated.'
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Reserved Matters (PF23)' page; 'Consent for Works Affecting
  Watercourses' page; 'Apply for planning or building permission (hub)' page. The 'should' items are what
  the list says the plan should show. Lawful development (existing) needs only the existing plan; minerals
  and waste only the proposed plan. The hub page says all prior approval applications need a site plan.
