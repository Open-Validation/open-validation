reference: elevation-existing
local-authority: PTE
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - ldc-existing-use
      - ldc-prospective-use
      - advertising
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: external-alterations
        value: true
        description: 'Change of use only: building works that materially affect the external appearance
          of the building.'
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required Detailed drawings showing the existing elevations (the appearance of the
  property from all sides affected by the proposal) to an appropriate scale, usually 1:100 and with a
  scale bar or metric measurements included. Drawings must show the complete building, partial drawings
  are not acceptable.
must-include:
- item: The appearance of the property from all sides affected by the proposal, at an appropriate scale
    (usually 1:100) with a scale bar or metric measurements
  level: must
- item: The complete building (partial drawings are not acceptable)
  level: must
- item: 'For advertisements: photographs of all existing elevations affected may be submitted instead'
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Full Planning Permission (Change of use ONLY)' page; 'Listed
  Building Consent (PF11)' page; 'Advertisement Consent (PF12)' page. Discretionary for listed building
  consent ('may be required').
review-status: unverified
field-status: {}
