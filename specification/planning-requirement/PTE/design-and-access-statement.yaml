reference: design-and-access-statement
local-authority: PTE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline-some
        - outline-all
        - mineral-extraction
        - waste-dev
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: The site is within a Conservation Area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings where the floor area created is 100 square metres or
                more (measured externally).
  - application-type:
      in:
      - lbc
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Only required for Major development , or; If the site is within a Conservation Area** and
  the proposal is for: - One or more dwellings - A building or buildings where the floor area created
  by the development is 100 square metres or more (measured externally) Required for any application for
  listed building consent, except where; Consent for the works being applied for has already been granted
  on or before 1 Oct 2010 to a time limit that has not expired and the development/works have not yet
  begun and The consent is necessary to carry out development which has been granted outline permission
  and where development has begun in accordance with any approved reserved matters and the outline permission
  was granted before 1 Oct 2010'
must-include:
- item: Explain the design principles and concepts applied to the development
  level: must
- item: Demonstrate the steps taken to appraise the context of the development and how the design takes
    that context into account
  level: must
- item: Explain the policy adopted as to access and how access policies in relevant DPDs have been taken
    into account
  level: must
- item: State what consultation on access has been undertaken and how its outcome has been taken into
    account
  level: must
- item: Explain how specific issues which might affect access have been addressed
  level: must
- item: 'For listed building consent: how the design principles take account of the building''s special
    architectural or historic importance, the physical features that justify its listing, and its setting
    (access matters not needed for internal works only)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: 'The LBC application shall be accompanied by a D&A statement which explains; the design
    principles and concepts that have been applied to the works; and how the design principles and concepts
    that have been applied to the works take account of the: (i) special architectural or historic importance
    of the building; (ii) particular physical features of the building that justify its designation as
    a listed building; and (iii) building''s setting; and;'
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Listed Building Consent (PF11)' page. For listed building consent
  the exceptions are consents granted on or before 1 October 2010 that have not expired, and works needed
  for development under an outline permission granted before then. The statement can be combined with
  a Heritage Statement.
review-status: unverified
field-status: {}
