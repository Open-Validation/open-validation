reference: town-centre-impact-assessment
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-some
      - outline-all
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and/or leisure floorspace greater than 2,500 square metres.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: In an out of town centre location.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with the currently adopted development plan.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: NPPF
source-text: Required for developments for the creation of retail and/or leisure floorspace greater than
  2,500 square metres in out of town centre locations, which are not in accordance with the currently
  adopted development plan.
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on town centre vitality and viability, including consumer choice and trade, up to five
    years from the application (ten years for major schemes whose full impact takes longer)
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page. The page also asks for a sequential test for main town centre
  uses outside the city, district or local centres (see the unmapped list).
review-status: unverified
field-status: {}
