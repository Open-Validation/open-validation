reference: section-proposed
local-authority: PTE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - mineral-extraction
        - waste-dev
    - condition:
        field: change-in-ground-levels
        value: true
        description: The site, or the site and surrounding land, are at variable levels.
  - all:
    - application-type:
        in:
        - lbc
        - reserved-matters
        - outline-some
    - discretionary
  - all:
    - application-type:
        in:
        - land-drainage-consent
    - condition:
        field: near-watercourse
        value: true
        description: Works encroach into a watercourse.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Only required where a site or site and surrounding land are at variable levels
must-include:
- item: Section drawings showing how the proposals relate to existing ground levels, or where ground levels
    would be modified
  level: must
- item: Drawn to an identified scale or showing metric measurements
  level: should
- item: 'For works affecting a watercourse: proposed longitudinal sections along the centre line (water
    levels, bed levels, structures) and cross sections, upstream and downstream of the works'
  level: must
  required-if:
    application-type:
      in:
      - land-drainage-consent
  source-text: Required where works encroach into any watercourse Proposed Longitudinal sections taken
    along the centre line of the watercourse are needed. These must show the proposed features including
    water levels, bed levels and structures. They should extend both upstream and downstream of the proposed
    work.
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Listed Building Consent (PF11)' page; 'Consent for Works Affecting
  Watercourses' page. Discretionary for listed building consent and reserved matters.
review-status: unverified
field-status: {}
