reference: roof-plan-proposed
local-authority: PTE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
    - condition:
        field: complex-roof-design
        value: true
        description: Complex roof structures.
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: external-alterations
        value: true
        description: 'Change of use only: building works that materially affect the external appearance
          of the building.'
  - all:
    - application-type:
        in:
        - lbc
        - reserved-matters
        - outline-some
    - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required only for complex roof structures.
must-include:
- item: The shape of the roof at an appropriate scale (usually 1:50 or 1:100) with correct overall dimensions
    in metric measurements
  level: must
- item: Details such as the material, vents and their location
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Full Planning Permission (Change of use ONLY)' page; 'Listed
  Building Consent (PF11)' page; 'Reserved Matters (PF23)' page. Discretionary for listed building consent
  and reserved matters.
review-status: unverified
field-status: {}
