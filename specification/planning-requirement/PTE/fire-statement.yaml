reference: fire-statement
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The proposal contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The proposal contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
source-text: Fire statement form Required for full and reserved matters applications where the proposal
  contains two or more dwellings or educational accommodation, and is 18m or more in height, or 7 or more
  storeys
confidence: medium
notes: 'Audit (wrong_app_type, not_a_requirement): placed only under Reserved matters, with page boilerplate.'
review-status: unverified
field-status: {}
