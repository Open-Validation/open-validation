reference: elevation-proposed
local-authority: PTE
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - ldc-prospective-use
      - advertising
      - mineral-extraction
      - waste-dev
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: external-alterations
        value: true
        description: 'Change of use only: building works that materially affect the external appearance
          of the building.'
  - all:
    - application-type:
        in:
        - lbc
        - reserved-matters
        - outline-some
    - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required Detailed drawings showing the proposed elevations (showing the proposal against
  existing building from all sides) to an appropriate scale, usually 1:100 and with a scale bar or metric
  measurements included. Drawings must show the complete building, partial drawings are not acceptable.
must-include:
- item: The proposal against the existing building from all sides, at an appropriate scale (usually 1:100)
    with a scale bar or metric measurements
  level: must
- item: The complete building (partial drawings are not acceptable)
  level: must
- item: 'For advertisements: photographs with the proposed advertisements superimposed may be submitted
    instead'
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Full Planning Permission (Change of use ONLY)' page; 'Listed
  Building Consent (PF11)' page; 'Advertisement Consent (PF12)' page; 'Reserved Matters (PF23)' page.
  Discretionary for listed building consent and for reserved matters / outline with some matters reserved.
review-status: unverified
field-status: {}
