reference: land-contamination-assessment
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - mineral-extraction
      - waste-dev
  - any:
    - site:
        in:
        - contaminated-land
        description: Site contamination is known or suspected.
    - all:
      - condition:
          field: new-build
          value: true
          description: A new building.
      - site:
          in:
          - near-landfill-site
          description: Within 250 metres of a closed landfill or a site on the Contaminated Land Register
            (landfill statement).
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Peterborough Planning Policies DPD policy PP20
source-text: Required where site contamination is known or suspected. A landfill statement will be required
  for any new building located within 250 metres of a closed landfill or site on the Contaminated Land
  Register unless contained within the Contamination Assessment.
must-include:
- item: A landfill statement for a new building within 250 metres of a closed landfill or Contaminated
    Land Register site, unless covered in the contamination assessment
  level: must
  required-if:
    all:
    - condition:
        field: new-build
        value: true
        description: A new building.
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a closed landfill or a site on the Contaminated Land Register.
- item: 'Where relying on a previously approved assessment: which report (title, reference and date) is
    relied on'
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page.
review-status: unverified
field-status: {}
