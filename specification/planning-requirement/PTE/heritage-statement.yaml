reference: heritage-statement
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline-some
      - outline-all
      - reserved-matters
      - mineral-extraction
      - waste-dev
      - demolition-con-area
      - lbc
      - s73
  - site:
      in:
      - conservation-area
      - listed-building
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      description: Development that would affect a designated heritage asset (the list counts conservation
        areas, listed and locally listed buildings, scheduled monuments, parks and gardens and areas of
        archaeological importance).
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: NPPF; Peterborough Planning Policies DPD policy PP17
source-text: Required for all development proposals that would affect any designated heritage asset.
must-include:
- item: Describe and assess the significance of the asset and/or its setting (architectural, historic,
    artistic or archaeological interest)
  level: must
- item: Identify the impact of the works on the special character of the asset
  level: must
- item: A clear justification for the works, especially if they would harm the asset or its setting
  level: must
- item: Detail proportionate to the asset's importance and sufficient to understand the impact on its
    significance and/or setting
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page. Can be combined with a Design and Access Statement.
review-status: unverified
field-status: {}
