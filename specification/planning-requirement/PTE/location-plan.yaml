    - mineral-extraction
    - waste-dev
    - land-drainage-consent
    - demolition-con-area
    - change-of-use
    - full
    - hh
    - ldc-prospective-use
    - lbc
    - outline-all
    - s73
    - advertising
    - hedgerow-removal
    - ldc-existing-use
    - outline-some
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required This must be an up-to-date Ordnance Survey based location plan at an appropriate
  scale, usually 1:1250 or 1:2500. In the case of large sites other drawing scales maybe appropriate.
must-include:
- item: Up-to-date Ordnance Survey based plan at an appropriate scale, usually 1:1250 or 1:2500
  level: must
- item: At least 2 main roads and all surrounding buildings or land
  level: must
- item: The application site (the whole planning unit)
  level: must
- item: A north point and a scale bar
  level: must
- item: Application site edged clearly in red, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: On an A4 size plan or larger
  level: should
- item: Not a Land Registry document, a photocopy or a screen grab; not used for multiple applications;
    shows OS Crown copyright and the correct licence number
  level: should
- item: 'For advertisements: drawn to an identified scale and identifying the proposed position of the
    advertisement'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: 'A plan which identifies the land to which the application relates. This should be: drawn
    to an identified scale; identify the proposed position of the advertisement; show the direction of
    North; include a scale bar.'
- item: 'For hedgerow removal: the location and length of the hedgerow(s) to be removed (if possible at
    1:2500)'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: 'You must provide a plan which: clearly shows the location and length of the hedgerow(s)
    to be removed. If possible please provide a plan to a scale of 1:2500. A different scale can be used
    so long as it shows clearly the location and length of the hedgerow(s) that you wish to remove.'
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
