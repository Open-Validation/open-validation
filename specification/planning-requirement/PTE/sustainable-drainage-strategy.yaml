reference: sustainable-drainage-strategy
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - ref: major-development
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Flood and Water Management Act 2010
source-text: Required on all applications for major development from 6 April 2015 (unless already approved
  on the outline permission and no further submission required).
must-include:
- item: 'Full and reserved matters: a detailed SuDS strategy confirming low flow conveyance, overflow
    and exceedance routes; collection of run-off from all hard surfaces; source and site control features
    with flow controls; conveyance features; final storage volumes and flow control rates; regional controls
    in public open space where appropriate; the outfall design; plans with levels and detail drawings'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
  source-text: The application must be submitted with a detailed SuDS (Sustainable Drainage System) drainage
    strategy which includes the following; Confirm details of low flow conveyance, overflow and exceedance
    routes Confirm details of how run-off is collected from all hard surfaces to keep water at or near
    the surface Confirm details of Source Control feature for each sub-catchment Confirm details of each
    Site Control feature with flow control locations and details Confirm details of conveyance features
    from place to place Confirmation of final storage volumes and flow control rates Confirm detail design
    of Regional (Catchment) Controls in public open space where appropriate Confirm the outfall design
    for “the controlled flow of clean water” from the site Plan(s) showing detail of the SuDS including
    levels, detail locations, detail drawings
- item: 'Outline: a preliminary SuDS strategy covering flow routes; run-off collection; source and site
    control features with approximate volumes; conveyance; treatment stages; sub-catchments and flow controls;
    regional controls; landscape integration with a management plan; and the destination of the controlled
    flow of clean water'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
      - outline-all
  source-text: The application must be submitted with a preliminary SuDS (Sustainable Drainage System)
    drainage strategy which includes the following; Flow routes including low flow, overflow and exceedance
    routes Details of how runoff is collected from roofs, roads and other hard surfaces to keep water
    at or near the surface Source Control techniques for each sub-catchment Site Control features with
    approximate volumes and flow control locations and details Confirmation of conveyance features from
    place to place Confirmation of appropriate “treatment stages” within each “sub-catchment” and “management
    train” Confirmation of sub-catchments with location of flow controls Regional (Catchment) Controls
    in public open space where appropriate Confirm and demonstrate how the SuDS are integrated into the
    landscape, with sketches and sections as appropriate, including a management plan for the development
    Confirm the destination of the “controlled flow of clean water” from the site – the ground by infiltration,
    a watercourse or the surface water sewer
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Outline with some matters reserved (PF05)' page. Uses MHCLG's
  retired 'sustainable-drainage-strategy' id. Alternatively, details can follow a submission list agreed
  in a written pre-application response. Not needed for a change of use with no surface water implications.
review-status: unverified
field-status: {}
