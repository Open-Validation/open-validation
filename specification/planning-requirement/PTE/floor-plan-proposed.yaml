reference: floor-plan-proposed
local-authority: PTE
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - ldc-prospective-use
      - mineral-extraction
      - waste-dev
  - all:
    - application-type:
        in:
        - change-of-use
    - any:
      - condition:
          field: multiple-uses
          value: true
          description: 'Change of use only: multiple uses are proposed in one building.'
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: 'Change of use only: the change of use is to residential.'
  - all:
    - application-type:
        in:
        - lbc
        - reserved-matters
        - outline-some
    - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required Drawings showing the full proposed floor layout plans to an appropriate scale,
  usually 1:100 and with a scale bar or metric measurements included. Drawings must show the complete
  building, partial drawings are not acceptable.
must-include:
- item: Full floor layout plans at an appropriate scale, usually 1:100, with a scale bar or metric measurements
  level: must
- item: The complete building (partial drawings are not acceptable)
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Full Planning Permission (Change of use ONLY)' page; 'Listed
  Building Consent (PF11)' page; 'Reserved Matters (PF23)' page. Discretionary for listed building consent
  ('may be required') and for reserved matters and outline with some matters reserved, where plans 'will
  depend on which matters are reserved'.
review-status: unverified
field-status: {}
