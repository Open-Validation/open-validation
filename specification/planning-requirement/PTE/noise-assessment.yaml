reference: noise-assessment
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
      - outline-some
      - outline-all
      - mineral-extraction
      - waste-dev
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: New development which gives rise to potential noise nuisance and/or vibration to
          the surrounding area.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New residential development that may be subject to noise nuisance from adjacent sites
          or trunk roads.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Peterborough Planning Policies DPD policy PP3
source-text: Required for all new development which gives rise to potential noise nuisance and/or vibration
  to surrounding area and for all new residential development that may be subject to noise nuisance from
  adjacent sites or trunk roads.
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page.
review-status: unverified
field-status: {}
