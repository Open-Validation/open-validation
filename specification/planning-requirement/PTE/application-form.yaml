source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Always required Please ensure that you have completed every section of the application form
  before submitting. Where sections or questions are not relevant please state this on the form.
must-include:
- item: Every section completed; where a section or question is not relevant, this is stated on the form
  level: must
- item: The relevant ownership certificate (A, B, C or D) completed, signed and dated (only one); Notice
    1 sent to known owners and Notice 2 published in a local newspaper where owners are unknown, with
    a copy of the notice sent with the application
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - waste-dev
      - demolition-con-area
      - change-of-use
      - full
      - lbc
      - outline-all
      - outline-some
      - s73
      - hh
      - mod-discharge-s106
  source-text: The relevant certificate must be completed, signed and dated (part of application form).
    Only one certificate should be completed.
- item: 'For reserved matters or discharge of conditions: the form, or a written application with enough
    information to identify the permission (or a full written description of the details to discharge
    the conditions)'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
      - approval-condition
  source-text: You can either use the application form or make your application in writing providing sufficient
    information to enable the planning authority to identify the outline permission in respect of which
    it is made.
confidence: medium
notes: 'From the council''s list (web pages, last updated 26 August 2026 for Full Planning Permission),
  ''Full Planning Permission (PF04)'' page; ''Reserved Matters (PF23)'' page; ''Discharge of conditions
  (PF27)'' page; ''Section 106 modification (PF39)'' page; ''Apply for planning or building permission
  (hub)'' page. ''Always required'' on every application-type page. The Section 106 page asks for ''Application
  form - Part 1'' and ''Ownership Certificate - Part 2''. The hub page adds: ''All Prior Approval applications
  require an application form, planning fee and site plan.'' The fee is listed on each page too (see the
  unmapped list).'
