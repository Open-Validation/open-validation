reference: air-quality-assessment
local-authority: PTE
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - discretionary
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
source-text: Required if the development proposals could impact upon air quality or there are potential
  pollutants. A report is required for all applications involving extraction which sets out all the air
  quality implications of the proposal (including dust, odour, gases etc), together with suitable mitigation
  where appropriate.
must-include:
- item: The change in air quality resulting from the development, with appropriate mitigation as necessary
  level: must
- item: 'Minerals: all air quality implications (dust, odour, gases etc.) with suitable mitigation; as
    an EIA chapter or a separate report by a suitably qualified person'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
  source-text: This can take the form of a chapter of an Environmental Impact Assessment (if applicable)
    or a separate report. It must be undertaken by a suitably qualified person.
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Carrying out of Mineral Working and Associated Development'
  page. 'Could impact upon air quality' is a judgement, so shown as discretionary for other applications.
review-status: unverified
field-status: {}
