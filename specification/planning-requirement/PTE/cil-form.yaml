reference: cil-form
local-authority: PTE
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - reserved-matters
  - any:
    - condition:
        field: housing-floorspace
        operator: '>='
        value: 100
        description: New residential development of 100 square metres and over (including householder
          extensions).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The creation of 1 or more dwellings (even if less than 100 square metres).
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 100
        description: Supermarket, neighbourhood convenience store and retail warehouse development of
          100 square metres and over.
source-url: https://www.peterborough.gov.uk/council/planning-and-development/planning-and-building/apply-for-planning-building-permission/full-planning-permission-pf04
policy: Peterborough CIL Charging Schedule; Peterborough Developer Contributions SPD (July 2019)
source-text: For applications creating; New residential development of 100 square metres and over (this
  includes householder extensions); The creation of 1 or more dwellings (even if it is less than 100 square
  metres), and; Supermarket, neighbourhood convenience stores and retail warehouse development of 100
  square metres and over.
confidence: medium
notes: From the council's list (web pages, last updated 26 August 2026 for Full Planning Permission),
  'Full Planning Permission (PF04)' page; 'Reserved Matters (PF23)' page. For reserved matters only where
  the outline permission was issued on or after 24 April 2015.
review-status: unverified
field-status: {}
