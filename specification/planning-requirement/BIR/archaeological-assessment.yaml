reference: archaeological-assessment
local-authority: BIR
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: The development includes a new building.
    - condition:
        field: ground-disturbance
        value: true
        description: The development includes ground disturbance.
  - site:
      in:
      - archaeological-priority-area
      description: On or adjoining a heritage asset of archaeological interest.
source-url: https://www.birmingham.gov.uk/download/downloads/id/1080/application_for_full_planning_permission_checklist.pdf
source-text: Archaeological Assessment When any proposed development includes new building or ground disturbance
  on or adjoining a heritage asset of archaeological interest (regardless of the need for a Design and
  Access Statement).
confidence: medium
review-status: unverified
field-status: {}
