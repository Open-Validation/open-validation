reference: town-centre-impact-assessment
local-authority: BIR
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development outside the hierarchy of centres in the BDP.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Greater than 2,500 square metres.
source-url: https://www.birmingham.gov.uk/download/downloads/id/1080/application_for_full_planning_permission_checklist.pdf
source-text: An impact assessment is required for retail, leisure and office development proposals greater
  than 2,500sqm which are outside of the hierarchy of centres identified in the BDP and not in accordance
  with the Local Plan
