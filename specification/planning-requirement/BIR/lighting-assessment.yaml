    - condition:
        field: external-lighting
        value: true
        description: External lighting, including lighting for a publicly accessible development.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting.
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        - local-wildlife-site
