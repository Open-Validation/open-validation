reference: fire-statement
local-authority: BIR
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.birmingham.gov.uk/download/downloads/id/1080/application_for_full_planning_permission_checklist.pdf
source-text: Fire Assessment Applications involving the provision of one or more relevant buildings, or;
confidence: medium
notes: 'Audit (wrong_trigger): the workbook carried the Flood Risk Assessment text. The list covers relevant
  buildings (18m+ or 7+ storeys), works to them, development within their curtilage and change of use;
  the last three can''t be expressed separately.'
review-status: unverified
field-status: {}
