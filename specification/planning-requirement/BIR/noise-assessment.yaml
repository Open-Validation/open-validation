reference: noise-assessment
local-authority: BIR
required-if:
  any:
  - condition:
      field: food-or-drink-use
      value: true
      description: Change of use to A3, A4 or A5 (food and drink).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Conversion of buildings to residential use, or new residential development.
  - discretionary
source-url: https://www.birmingham.gov.uk/download/downloads/id/1080/application_for_full_planning_permission_checklist.pdf
source-text: 'The following developments should include a noise impact assessment / noise mitigation scheme
