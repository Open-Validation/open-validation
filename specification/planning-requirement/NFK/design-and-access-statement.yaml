reference: design-and-access-statement
local-authority: NFK
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: Development in a designated area.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100m² or more of floor space.
source-url: https://www.norfolk.gov.uk/media/19094/Minerals-And-Waste-Local-List/pdf/19minerals-and-waste-local-list.pdf?m=1712148339267
