reference: design-and-access-statement
local-authority: SUR
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: The floor area of the proposal exceeds 100 square metres.
source-url: https://www.surreyheath.gov.uk/sites/default/files/2024-12/Local%20Validation%20List%202025.pdf
source-text: A Design and Access Statement will only be required within a conservation area if the floor
  area of the proposal (s) exceeds 100 sq metres …
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the excerpt covers only the conservation area case; majors
