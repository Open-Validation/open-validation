reference: floor-plan-existing
local-authority: MDW
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: Floor space would be created by the development.
  - condition:
      field: building-works
      value: true
      description: Floor space would be altered by the development.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Applications where floor space would be created or altered by the development proposal.
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
- item: Existing walls or buildings to be demolished highlighted, where applicable
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Walls or buildings are to be demolished.
confidence: medium
notes: From the council's list (published April 2025), page 6, item 1, Existing and proposed floor plans.
review-status: unverified
field-status: {}
