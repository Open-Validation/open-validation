reference: design-and-access-statement
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          description: In a conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: Two or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: 100 sq m or more of floorspace.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: For all major applications and for applications in a conservation area where the proposal
  is for two or more dwelling houses or for the provision of 100m² or more floorspace.
confidence: medium
notes: From the council's list (published April 2025), page 10, item 8. The table on pages 2-4 marks it
  'P' (potentially required) for these application types, and the 'When required?' wording sets when.
review-status: unverified
field-status: {}
