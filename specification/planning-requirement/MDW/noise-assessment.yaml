reference: noise-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Could cause significant noise disturbance, e.g. noisy sports or industrial developments
          using noisy machinery.
    - condition:
        field: plant-equipment
        value: true
        description: Refrigeration plant and equipment.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development, such as housing, near existing noise sources (busy roads,
          railway lines, industrial or commercial premises).
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Proposals that could cause significant noise disturbance, e.g. noisy sports; industrial developments
  using noisy machinery; refrigeration plant and equipment. Noise sensitive developments, such as housing,
  that are near to existing sources of noise, for example, busy roads, railway lines, industrial or commercial
  premises.
must-include:
- item: Information on noise levels
  level: must
- item: Any proposed mitigation measures
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 14, item 24. Applicants should confirm the
  scope and methodology with the Environmental Protection Team first. The table on pages 2-4 marks it
  'P' (potentially required) for these application types, and the 'When required?' wording sets when.
review-status: unverified
field-status: {}
