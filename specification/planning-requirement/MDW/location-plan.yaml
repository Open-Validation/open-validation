reference: location-plan
local-authority: MDW
required-if:
  always: true
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: All applications.
must-include:
- item: At least two named roads and surrounding buildings
  level: must
- item: At a scale of 1:1250 or 1:2500
  level: should
- item: Properties shown are numbered so the exact location of the site is clear
  level: should
- item: Application site edged clearly with a red line, including all land necessary to carry out the
    development (e.g. access from a public highway, visibility splays, landscaping, car parking and open
    areas around buildings)
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: must
- item: The direction of North
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 5, item 1, Site location plan. The direction
  of North comes from the list's general drawing requirements.
review-status: unverified
field-status: {}
