reference: landscaping-plan
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
      - non-material-amendment
  - condition:
      field: landscaping-works
      value: true
      description: The proposal requires new or enhanced hard and/or soft landscaping.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Proposals that require new or enhanced hard and/or soft landscaping.
must-include:
- item: Proposed finished ground levels or contours
  level: should
- item: A soil management survey where significant earthworks are required
  level: should
  required-if:
    condition:
      field: earthworks
      value: true
      description: Significant earthworks are required.
- item: Means of enclosure such as fencing, boundary walls or hedging
  level: should
- item: 'Hard landscaping: pedestrian and car parking layouts/manoeuvring area'
  level: must
- item: 'Soft landscaping: location of existing and proposed shrubs and trees, indicating which are to
    be retained and which removed'
  level: must
- item: 'Soft landscaping: a schedule of new planting (species, size at time of planting and density),
    implementation programme, protection measures, management practices and final maintenance height/details'
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 11, item 15. The list heads this 'Landscape
  / Townscape Character Assessment / Landscape and Visual Impact assessment', but its wording describes
  a landscaping scheme. Items the list qualifies with 'where appropriate' are 'should'.
review-status: unverified
field-status: {}
