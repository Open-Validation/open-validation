reference: recreation-facilities-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Develops open space, sports and recreational buildings and land for other purposes.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 dwellings or more.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Proposals to develop open space, sports and recreational buildings and land for other purposes.
  Any developments of 10 dwellings or more.
must-include:
- item: Information on amenity space, including private, public and communal
  level: must
- item: Plans showing existing and proposed open space
  level: must
- item: An independent assessment evidencing that the land or buildings are surplus to local requirement
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Open space or recreational land or buildings would be lost.
confidence: medium
notes: From the council's list (published April 2025), page 14, item 25. The list calls it an Open Space
  Assessment.
review-status: unverified
field-status: {}
