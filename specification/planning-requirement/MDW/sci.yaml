reference: sci
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: Residential development of 100 units or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1000 sq m or more of commercial floorspace.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Residential development of 100 units or more and/or 1000sqm or more of commercial floorspace.
must-include:
- item: How the applicant has complied with the pre-application consultation requirements of the council's
    adopted statement of community involvement
  level: must
- item: That the views of the local community have been sought and considered in forming the proposals
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 17, item 34.
review-status: unverified
field-status: {}
