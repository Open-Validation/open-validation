reference: affordable-housing-statement
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 25
        description: 'Within the urban area: 25 or more dwellings.'
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: 'Within the urban area: a site of 1 hectare or more.'
    - all:
      - site:
          in:
          - rural-area
          description: In a rural settlement as defined by the local plan.
      - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Within the urban area, developments which include 25 or more dwellings or where the site
  area is 1 hectare or more or in rural settlements as defined by the local plan, with a population of
  3,000. It is recommended you look at the Section106 contributions guide
must-include:
- item: Information about both the affordable housing and the market housing
  level: must
- item: The levels or types of affordability or tenure proposed for different units, clearly and fully
    explained
  level: must
- item: Details of any Registered Social Landlords acting as partners in the development
  level: must
- item: The proposed timing of the provision
  level: must
- item: Draft heads of terms for a planning obligation, or a Unilateral Undertaking
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 9, item 5. The list gives no dwelling or site-area
  threshold for rural settlements ('with a population of 3,000'), so that part is shown as discretionary.
review-status: unverified
field-status: {}
