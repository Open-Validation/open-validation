reference: telecommunications-report
local-authority: MDW
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Telecommunications Developments - Supplementary information for Prior Approval applications
must-include:
- item: A written description of the proposed works
  level: must
- item: 'Site details: name, reference and location, with address and National Grid Reference'
  level: must
- item: Site type (macro or micro)
  level: must
- item: Height, frequency, modulation characteristics and power output
  level: must
- item: The proposed structure, its type and dimensions, and the height of the existing building
  level: must
- item: The size and materials of the equipment housing
  level: must
- item: The need and purpose of the development
  level: must
- item: The reason for the choice of design
  level: must
- item: A signed ICNIRP declaration that the equipment and installation fully comply with the requirements
  level: must
- item: Annual roll-out and pre-application discussions with Medway Council
  level: must
- item: Rating of the site under the Traffic Light Model (Green, Amber or Red)
  level: must
- item: Consultation carried out under the Ten Commitments
  level: must
  required-if: discretionary
- item: Consultation carried out with the school or further education college
  level: must
  required-if: discretionary
- item: Consultation carried out with the CAA/Secretary of State for Defence/aerodrome operator
  level: must
  required-if: discretionary
- item: Existing and proposed coverage maps
  level: must
- item: A map showing the relationship of the site to schools and other telecommunications equipment in
    the area
  level: must
- item: A completed Supplementary Information Template (Annex F of the Code of Best Practice on Mobile
    Network Development)
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 18, item 36. The consultation items apply
  'if relevant', so they are shown as discretionary.
review-status: unverified
field-status: {}
