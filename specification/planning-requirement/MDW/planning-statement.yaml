reference: planning-statement
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - ref: major-development
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Major applications and should include.
must-include:
- item: A description of the site, its location and its surroundings
  level: must
- item: A description of the development proposals and the circumstances surrounding them
  level: must
- item: Identification and assessment of the relevant planning policies and guidance
  level: must
- item: Identification and assessment of any other material considerations
  level: must
- item: A summary of the findings of any other material submitted with the application
  level: must
- item: Details of any consultations with the council and the wider community/statutory consultees before
    submission
  level: must
- item: Where the proposal is not in principle in accordance with the Development Plan, why the applicant
    considers it should be approved
  level: must
  required-if:
    condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is not in principle in accordance with the Development Plan.
confidence: medium
notes: From the council's list (published April 2025), page 15, item 29.
review-status: unverified
field-status: {}
