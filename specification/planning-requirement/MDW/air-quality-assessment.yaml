source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: The Medway Air Quality Planning Guidance (April 2016) contains two screening checklists that
  can be used to identify when an air quality assessment and/or emissions mitigation assessment may be
  required. The checklists should be carried out in consultation with the Environmental Protection Team.
  ... Proposals that generate high levels of pollution, such as significant industrial developments, combustion
  processes and significant proposals that are located in/near to an AQMA or would result in a significant
  increase in traffic passing through to an AQMA.
must-include:
- item: Sufficient information to enable the Council to assess the likely impact on local air quality
  level: must
