reference: biodiversity-survey-report
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - demolition-con-area
      - lbc
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Affects SSSIs, LNRs, LWS, SLNVs and/or SNCIs.
    - site:
        in:
        - ramsar
        description: Directly or indirectly affects RAMSAR wetland sites.
    - discretionary
    - all:
      - condition:
          field: protected-species
          value: true
          description: There is a possibility of protected species being present.
      - any:
        - condition:
            field: demolition
            value: true
            description: Buildings are to be demolished.
        - condition:
            field: involves-change-of-use
            value: true
            description: Buildings are undergoing a change of use, e.g. conversion of an agricultural
              building.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: 9) Ecological Site Assessment When required? Proposals affecting; SSSIs, LNRs, and/or LWS,
  SLNVs and/or SNCIs or natural or semi-natural vegetation/habitat, e.g., woodland, hedgerow, ponds and
  grassland. ... 10) Ecology Survey When required? Proposals that directly or indirectly affect; SSSIs,
  LNRs, and/or LWS, SLNVs and/or SNCIs,RAMSAR wetlands sites ... 11) Protected Species Survey When required?
  Any site where there is a possibility of protected species being present and the proposed buildings
  are to be demolished or undergoing a change of use, for example, conversion of an agricultural building.
must-include:
- item: 'Ecological site assessment: up to date information on habitats on site and links to habitats
    off site, species present or likely to be present, records search, likely impacts, mitigation and
    opportunities for enhancement'
  level: must
  required-if:
    any:
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Affects SSSIs, LNRs, LWS, SLNVs and/or SNCIs.
    - discretionary
- item: Any ancient woodland, important hedgerows or Biodiversity Action Plan priority habitats on or
    adjacent to the site
  level: should
  required-if:
    any:
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Affects SSSIs, LNRs, LWS, SLNVs and/or SNCIs.
    - discretionary
- item: 'Protected species survey: the presence or absence of protected species and, if present, the population
    level, the likely impact on the species and a scheme of mitigation'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: There is a possibility of protected species being present.
confidence: medium
notes: From the council's list (published April 2025), page 10-11, item 9-11. Covers the list's Ecological
  Site Assessment (9), Ecology Survey (10) and Protected Species Survey (11). 'Natural or semi-natural
  vegetation/habitat' has no field, so it is shown as discretionary. The Ecological management plan (12)
  has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
