reference: energy-statement
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Buildings with a floorspace of 1000 sq m or more.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential developments providing 10 or more units.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Buildings with a floorspace of 1000sqm or more and/or residential developments providing
  10 or more residential units.
must-include:
- item: The predicted CO2 emissions per annum
  level: must
- item: The technical feasibility of renewable energy technologies for the site
  level: must
- item: The CO2 saving as a percentage of the site's predicted CO2 emissions
  level: must
- item: How a saving of at least 10% has been achieved
  level: must
- item: Electrical charging points in car parks
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 16, item 32. The list calls it a Renewable
  Energy Assessment.
review-status: unverified
field-status: {}
