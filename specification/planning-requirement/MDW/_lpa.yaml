  status: current
submission-standards:
- item: Every drawing has a unique drawing number and title that also indicates any revisions (e.g. MC100
    revision B)
  level: must
- item: Drawings at a recognised metric scale (1:50, 1:100, 1:200, 1:500, 1:1250 or 1:2500), with the
    scale stated
  level: must
- item: A scale bar indicating a minimum of 0-10 metres on all drawings
  level: must
- item: All drawings to scale and an accurate representation of the existing site and the proposed development;
    inconsistencies between drawings (e.g. floor plans and elevations, window and door positions, number
    of units) make the application invalid
  level: must
- item: 'Major applications: one paper copy to accompany the electronic submission'
  level: must
- item: 'Paper submissions: one original and one copy of all application documents'
  level: must
- item: Sensitive personal data (in particular physical or mental health) in a separate annex clearly
    marked as containing personal data
  level: should
