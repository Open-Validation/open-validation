reference: land-contamination-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - lbc
      - reserved-matters
      - s73
      - approval-condition
  - site:
      in:
      - contaminated-land
      description: There is a possibility that previous uses of the site or adjacent land could have given
        rise to contamination.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Where there is a possibility that previous uses of the site or adjacent land could have given
  rise to contamination.
must-include:
- item: A desk study assessing the nature and extent of any contamination on the site, including risks
    to human health and ground water
  level: must
- item: Site history, site walk over, potential contaminants and receptors, and a conceptual site model
  level: should
- item: Undertaken by a competent person
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 11, item 13. The table on pages 2-4 marks
  it 'P' (potentially required) for these application types, and the 'When required?' wording sets when.
review-status: unverified
field-status: {}
