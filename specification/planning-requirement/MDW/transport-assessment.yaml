reference: transport-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 50
        description: 'Residential: over 50 households.'
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: 'Non-residential: over 1,000 sq m.'
    - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: 'Subject to discussion with the Local Planning Authority, however as a general guide: Residential:
  over 50 households, Non-residential: over 1,000m²'
must-include:
- item: Baseline and future year traffic assessment
  level: should
- item: Multi-modal trip analysis
  level: should
- item: Highway safety and capacity analysis
  level: should
- item: Parking assessment
  level: should
- item: Walking, cycling and public transport assessment
  level: should
- item: Measures to mitigate the transport impact of the development
  level: should
- item: Road Safety Audit
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 19, item 37. The thresholds are 'a general
  guide' and the need is 'subject to discussion', so 'discretionary' sits alongside them. The contents
  are what the assessment 'should generally contain'.
review-status: unverified
field-status: {}
