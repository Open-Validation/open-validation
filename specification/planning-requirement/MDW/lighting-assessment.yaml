reference: lighting-assessment
local-authority: MDW
required-if:
  any:
  - condition:
      field: illuminated
      value: true
      description: The proposal (for example an advertisement) includes illumination.
  - condition:
      field: floodlighting
      value: true
      description: Flood lights.
  - condition:
      field: external-lighting
      value: true
      description: Commercial or residential development that includes external lighting.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Details of illumination When required? All applications that include any illumination (Flood
  lights, Adverts etc). ... Details of lighting scheme When required? All commercial and residential development,
  which includes the installation of external lighting.
must-include:
- item: Drawings of the illumination at a scale of 1:20 or 1:50 showing size (length, width, depth), siting,
    materials and colour, height above ground, extent of projection, design of lighting elements and levels
    of luminance
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: The proposal includes illumination such as illuminated adverts or flood lights.
- item: The number, type (e.g. wall mounted or free standing columns), location and intensity of any light
    installation proposed
  level: must
  required-if:
    condition:
      field: external-lighting
      value: true
      description: Development that includes external lighting.
- item: The hours when the lighting would be switched on
  level: must
  required-if:
    condition:
      field: external-lighting
      value: true
      description: Development that includes external lighting.
- item: Lighting column locations shown on hard and soft landscape plans
  level: should
  required-if:
    condition:
      field: external-lighting
      value: true
      description: Development that includes external lighting.
confidence: medium
notes: From the council's list (published April 2025), page 7, 14, item 1 (Details of illumination) and
  23. The list adds that a lighting impact study 'may be required' for floodlighting, particularly for
  sports grounds, near homes or in open countryside.
review-status: unverified
field-status: {}
