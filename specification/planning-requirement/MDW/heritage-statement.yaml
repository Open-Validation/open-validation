reference: heritage-statement
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - demolition-con-area
      - lbc
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - world-heritage-site
        description: 'A designated heritage asset or its setting: listed buildings (including curtilage),
          conservation areas, scheduled monuments, registered parks and gardens, world heritage sites.'
    - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: All applications involving a heritage asset or its setting. Where the application requires
  a Design and Access Statement, the Heritage Statement can be included in this. Where no Design and Access
  Statement is required, it should be a stand-alone document.
must-include:
- item: A description of the significance of the heritage assets affected by the development
  level: must
- item: A description of the contribution of their setting to that significance
  level: must
- item: An assessment of the impact of the proposals on that significance
  level: must
- item: An explanation of how the works have been designed to minimise any negative impacts and to preserve
    and enhance the significance
  level: must
- item: An explanation of how requirements of other legislation, such as the building regulations, have
    been balanced against the need to respect the significance of the heritage asset
  level: must
- item: A desk-based assessment and, where necessary, the results of a field evaluation
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: The site includes, or may include, heritage assets with archaeological interest.
- item: An assessment of the impact of the proposals on the character of the conservation area
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: The sources that have been considered and the expertise that has been consulted
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 7-8, item 2. Registered battlefields and protected
  wreck sites are also named as designated heritage assets but can't be expressed in the rule. Shown with
  'discretionary' because undesignated heritage assets 'may be identified during pre-application stages
  or while the application is under consideration'. The table marks it M for conservation area consent
  and listed building consent, P for householder, full, outline, reserved matters and variation of condition.
review-status: unverified
field-status: {}
