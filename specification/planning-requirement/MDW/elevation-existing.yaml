reference: elevation-existing
local-authority: MDW
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Elevations would be created by the development.
  - condition:
      field: external-alterations
      value: true
      description: Elevations would be altered by the development.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Applications where elevations would be created or altered by the development proposal.
must-include:
- item: Separate existing and proposed elevations, drawn at an identifiable metric scale, usually 1:50
    or 1:100
  level: must
- item: All sides of the existing building, including blank elevations
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 6, item 1, Existing and proposed elevations.
review-status: unverified
field-status: {}
