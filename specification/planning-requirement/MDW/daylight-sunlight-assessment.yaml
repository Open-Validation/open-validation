reference: daylight-sunlight-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
  - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: All applications where there is a potential adverse impact upon the current levels of daylight/sunlight
  enjoyed by adjoining properties and buildings.
must-include:
- item: A sunlight indicator test using the Building Research Establishment's 'Site layout planning for
    daylight and sunlight – A guide to good practice'
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 11, item 14. 'Potential adverse impact' is
  a judgement, so shown as discretionary. The table on pages 2-4 marks it 'P' (potentially required) for
  these application types, and the 'When required?' wording sets when.
review-status: unverified
field-status: {}
