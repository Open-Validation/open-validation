reference: arboriculturist-report
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - approval-condition
      - consent-under-tpo
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The proposed works are within 5 metres of the crown spread of any tree.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Where the proposed works are within 5 metres of the crown spread of any tree.
must-include:
- item: Layout plans identifying trees and other vegetation to be retained or lost, including trees that
    may be affected on adjoining land
  level: must
- item: A tree condition survey where trees are affected
  level: must
- item: The trees' contribution to the street scene, visual amenity and ecological importance
  level: must
- item: For trees with features used by bats (e.g. cavities, ivy clad), an assessment of the impact of
    the works on bats
  level: should
- item: Prepared by an expert
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 19, item 38. The list calls it a Tree Survey/Arboricultural
  assessment.
review-status: unverified
field-status: {}
