reference: section-existing
local-authority: MDW
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels or the site slopes.
  - all:
    - condition:
        field: roof-space-room
        value: true
        description: A new room is created in the roof space.
    - condition:
        field: building-works
        value: true
        description: An alteration to an existing building.
  - all:
    - all:
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: New floor space (commercial and residential).
      - site:
          in:
          - flood-risk-zone
          description: Within a flood zone.
    - condition:
        field: building-works
        value: true
        description: An alteration to an existing building.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: When the proposal includes a change in ground level or sloping sites ... Sections showing
  finished floor levels When required? Creation of new floor space (commercial and residential) within
  a flood zone and for the creation of a new room in the roof space.
must-include:
- item: Site sections at a scale of 1:20 or 1:50, showing existing and proposed land levels
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground level or a sloping site.
- item: Sections showing finished floor levels at a scale of 1:50 or 1:100
  level: must
  required-if:
    any:
    - all:
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: New floor space (commercial and residential).
      - site:
          in:
          - flood-risk-zone
          description: Within a flood zone.
    - condition:
        field: roof-space-room
        value: true
        description: A new room is created in the roof space.
confidence: medium
notes: From the council's list (published April 2025), page 6-7, item 1, Existing and proposed site sections;
  Sections showing finished floor levels. Existing sections showing finished floor levels only 'where
  there is an alteration'.
review-status: unverified
field-status: {}
