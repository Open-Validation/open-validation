reference: waste-management-plan
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 new dwellings or more.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: New retail, business, industrial, leisure or other similar development.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of buildings or structures.
      - condition:
          field: ground-disturbance
          value: true
          description: Excavation.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: 31) Refuse Collection When required? All proposals for the creation of 10 new dwellings or
  more, new retail business, industrial, leisure or other similar developments. ... 41) Waste Management
  Plans When required? All applications involving the demolition of buildings or structures and/or excavation.
must-include:
- item: 'Refuse collection: provision for the storage and means of disposal of refuse, including recyclables,
    and access for refuse disposal vehicles'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 new dwellings or more.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: New retail, business, industrial, leisure or other similar development.
- item: 'Site waste management plan: the volume and type of material to be demolished and/or excavated,
    opportunities for reuse and recovery, and how off-site disposal will be minimised and managed'
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings or structures.
    - condition:
        field: ground-disturbance
        value: true
        description: Excavation.
confidence: medium
notes: From the council's list (published April 2025), page 16, 20, item 31 and 41. Covers the list's
  Refuse Collection (31) and Waste Management Plans (41).
review-status: unverified
field-status: {}
