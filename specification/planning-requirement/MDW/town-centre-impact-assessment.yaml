reference: town-centre-impact-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail development over 2,500 sq m gross floorspace.
    - all:
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 0
          description: A retail proposal.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Located outside the main centres of Chatham, Strood, Gillingham and Rainham.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
policy: Policy R13
source-text: Retail developments over 2,500sqm gross floorspace. Retail proposals located outside the
  main centres of Chatham, Strood, Gillingham and Rainham.
must-include:
- item: A sequential test, where outside the town centres and not in accordance with the development plan's
    retail and main town centre use strategy
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside the main centres.
- item: The catchment area, to be agreed by the council
  level: must
- item: Flexibility in scale and format, particularly for more central locations
  level: must
- item: Sequential sites considered in order (in-centre, then edge of centre, then out of centre), as
    set out in policy R13
  level: must
- item: Available sites identified, with their suitability and viability justified
  level: must
- item: The need (particularly quantitative) for the proposal
  level: must
- item: The impact on the vitality and viability of the defined Primary Shopping Areas, neighbourhood
    or village centres, as appropriate
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 16, item 33. The list calls it 'Retail and
  town centre uses'.
review-status: unverified
field-status: {}
