reference: sustainable-drainage-strategy
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3, including minor development and change of use.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: More than 1 hectare in flood zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: More than 1 hectare in flood zone 1.
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: Less than 1 ha in flood zone 1, including a change of use to a more vulnerable
            class (e.g. commercial to residential).
      - discretionary
    - site:
        in:
        - critical-drainage-area
        description: In flood zone 1 with critical drainage problems as notified by the Environment Agency.
  - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: A Drainage Strategy would be required for those developments which fall into the above categories
  which could be affected by surface water run off or increase surface water runoff.
must-include:
- item: Meets the requirements of the Lead Local Flood Authority
  level: must
- item: Surface water run-off controlled as near to its source as possible through a sustainable drainage
    approach (SUDS)
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 13, item 22. Needed for developments that
  meet the flood risk assessment triggers and 'could be affected by surface water run off or increase
  surface water runoff', which is a judgement, so shown with 'discretionary'.
review-status: unverified
field-status: {}
