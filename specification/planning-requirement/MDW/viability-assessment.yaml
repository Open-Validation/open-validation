reference: viability-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Any development that generates a need for developer contributions where the applicant is
  of the view that the economics of the development cannot support the likely requirements for contributions
  by the Local Planning Authority or stakeholders.
must-include:
- item: The costs of carrying out the development and the anticipated return on that investment, set out
    in detail
  level: must
- item: A detailed land appraisal including the costs of carrying out the development, e.g. land cost,
    construction costs, fees and the costs of the contributions likely to be required
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 12, item 17. The list calls it a Development
  Contributions Viability Statement. Shown as discretionary because it depends on whether the applicant
  argues viability.
review-status: unverified
field-status: {}
