reference: elevation-proposed
local-authority: MDW
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: Elevations would be created by the development.
  - condition:
      field: external-alterations
      value: true
      description: Elevations would be altered by the development.
  - application-type:
      in:
      - advertising
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Applications where elevations would be created or altered by the development proposal. ...
  Advertisement drawings When required? All applications for display of signage.
must-include:
- item: Separate existing and proposed elevations, drawn at an identifiable metric scale, usually 1:50
    or 1:100
  level: must
- item: All sides of the proposed development, including blank elevations
  level: must
- item: New buildings shown in context with adjacent buildings
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building.
- item: Where the proposed elevation adjoins or is close to another building, the relationship between
    the buildings
  level: must
- item: 'For signage: advertisement drawings at 1:20 or 1:50 showing size (length, width, depth), siting,
    materials and colour, height above ground and extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For signage: the relationship of the sign and any lighting structures to the building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For signage: a section through the structure on which the sign is to be fixed'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published April 2025), page 6-7, item 1, Existing and proposed elevations;
  Advertisement drawings.
review-status: unverified
field-status: {}
