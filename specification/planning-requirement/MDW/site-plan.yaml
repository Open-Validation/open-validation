reference: site-plan
local-authority: MDW
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Changes to a building.
  - condition:
      field: external-alterations
      value: true
      description: Changes to a building or to a site.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: When there are changes to a building or to a site.
must-include:
- item: Existing and proposed block plans/site layout plans
  level: must
- item: At a scale of 1:200 or 1:500, based on an up-to-date Ordnance Survey map
  level: must
- item: Existing and proposed features of the site, e.g. walls, fencing, trees, outbuildings, hard and
    soft landscaping, vision splays, turning points and parking provision
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 6, item 1, Existing and proposed block plan/site
  plan.
review-status: unverified
field-status: {}
