reference: fire-statement
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>'
        value: 18
        description: Over 18 metres tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 storeys or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: Containing more than one dwelling.
  - condition:
      field: new-build
      value: true
      description: New buildings.
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: New buildings of over 18 metres (or 7 stories) tall containing more than one dwelling.
must-include:
- item: A Planning Gateway One fire statement completed on the standard form
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 21, item 44.
review-status: unverified
field-status: {}
