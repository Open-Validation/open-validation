reference: archaeological-assessment
local-authority: MDW
required-if:
  all:
  - application-type:
      in:
      - full
      - lbc
  - any:
    - site:
        in:
        - archaeological-priority-area
        - historic-environment-record
        description: The presence of buried archaeology is known.
    - discretionary
source-url: https://www.medway.gov.uk/download/downloads/id/7949/planning_permission_validation_checklist.docx
source-text: Where the presence of buried archaeology is known or suspected.
must-include:
- item: Consideration of all known records relating to the site
  level: must
- item: An assessment of the site's archaeological potential
  level: must
- item: How best to work with and protect the site before, during and after development
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 9, item 3. 'Suspected' is shown as discretionary.
  The table on pages 2-4 marks it 'P' (potentially required) for these application types, and the 'When
  required?' wording sets when.
review-status: unverified
field-status: {}
