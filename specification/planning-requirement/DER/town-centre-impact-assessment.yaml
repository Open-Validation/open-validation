reference: town-centre-impact-assessment
local-authority: DER
required-if:
  all:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Retail, entertainment, recreation or leisure floorspace greater than 1,000 sq m.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside the hierarchy of centres identified in DCLP1 (CP12).
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with the Local Plan.
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP13 (Retail and Leisure Outside of Defined
  Centres)
source-text: A detailed impact assessment is required for retail, entertainment, recreation and leisure
  proposals greater than 1,000sqm which are outside of the hierarchy of centres identified in the DCLP1
  (CP12) and not in accordance with the Local Plan.
confidence: medium
notes: From the council's list (published October 2025), page 11-12. The separate sequential assessment
  row is listed as unmapped.
review-status: unverified
field-status: {}
