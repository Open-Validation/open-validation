reference: planning-statement
local-authority: DER
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF
source-text: Full and Outline applications. To fully justify and explain the proposal … A Planning Statement
  confirming that the application will deliver BNG or a reasoned justification why it is exempt.
must-include:
- item: The context and need for the proposed development
  level: should
- item: An assessment of how the proposal accords with relevant national, regional and local planning
    policies
  level: should
- item: Justification for a proposed change of use, particularly if it involves the loss of community
    facilities
  level: should
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal involves a change of use.
- item: Confirmation that the application will deliver biodiversity net gain, or a reasoned justification
    why it is exempt
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
confidence: medium
notes: 'From the council''s list (published October 2025), page 4, 15. For full and outline applications
  the list gives only a purpose (''To fully justify and explain the proposal''), not a trigger, so that
  part shows as discretionary. The BNG part (page 4) applies to major and minor development. Rule follows
  the law: householder, permitted development, de minimis, sites of 0.2 ha or less and the other exemptions
  listed by the council are exempt. The list (October 2025) still exempts self and custom build but asks
  for the metric anyway; the council''s page says that from 6 August 2026 self and custom build is no
  longer exempt and sites of 0.2 hectares or below are.'
