reference: arboriculturist-report
local-authority: DER
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Development may impact upon trees on or adjoining the site (including street trees).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: BS5837; BS3998; NPPF; Town and Country Planning Act 1990 (Section 197-198); BDP Policy TP 7 Green
  Infrastructure Network
source-text: Any application where development may impact upon trees on or adjoining the development site.
  … Where there are trees within the application site, and/or on land adjacent to it that could influence
  or be affected by the development (including street trees), information will be required on how trees
  are to be impacted upon by the proposed development and how retained trees are to be protected during
  construction works.
must-include:
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: must
- item: Tree survey information, Arboricultural Impact Assessment and Arboricultural Method Statement
    (including Tree Protection Plan) as set out in BS5837
  level: should
- item: Hard/soft landscaping and the installation of services (including land drainage) fed into the
    Arboricultural Impact Assessment and Method Statement
  level: must
- item: A tree canopy assessment of pre-development and post-development canopy size
  level: must
confidence: medium
notes: From the council's list (published October 2025), page 18-19. The list calls it 'Arboricultural
  Impact Assessment'. Its policy cell cites 'BDP Policy TP 7 Green Infrastructure Network', which looks
  like a Birmingham Development Plan policy; it is kept as written.
review-status: unverified
field-status: {}
