reference: habitat-baseline
local-authority: DER
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: Environment Act 2021; NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP19 (Biodiversity)
source-text: A plan to an identified scale with a north point showing on-site habitat on the date of application,
  including Irreplaceable habitat. … Development where the site area within the red line boundary is 0.2
  hectares or below. … The major change is that self and custom build development is no longer exempt.
must-include:
- item: Plan to an identified scale with a north point showing on-site habitat on the date of application,
    including irreplaceable habitat
  level: must
- item: Each individual habitat notated to cross-reference with the metric; similar, smaller habitats
    not combined into one large area
  level: must
  required-if:
    ref: major-development
- item: The baseline habitat survey sheets
  level: must
  required-if:
    ref: major-development
- item: A statement confirming whether the site has been degraded after 30 January 2020
  level: must
- item: A description of any irreplaceable habitats
  level: must
confidence: medium
notes: 'From the council''s list (published October 2025), page 4-5. Rule follows the law: householder,
  permitted development, de minimis, sites of 0.2 ha or less and the other exemptions listed by the council
  are exempt. The list (October 2025) still exempts self and custom build but asks for the metric anyway;
  the council''s page says that from 6 August 2026 self and custom build is no longer exempt and sites
  of 0.2 hectares or below are.'
review-status: unverified
