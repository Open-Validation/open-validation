reference: land-contamination-assessment
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
  - any:
    - condition:
        field: industrial-site
        value: true
        description: Former industrial or commercial site.
    - condition:
        field: sensitive-end-use
        value: true
        description: Introduces new sensitive receptors, e.g. residential dwellings, nursing/care homes
          and schools.
    - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; City of Derby Local Plan Review (CDLPR) Policy E13 (Contaminated Land)
source-text: Full and Outline applications including Changes of Use. Particularly on former industrial/commercial
  sites but also the majority of developments which will introduce new sensitive receptors e.g. residential
  dwellings, nursing/care homes and schools. … Applications which give rise to concerns over potential
  land contamination risks to either human health or controlled waters, will need to be accompanied by
  an assessment of the associated risks in accordance with the UK Government Land Contamination Risk Management
  (LCRM) framework.
must-include:
- item: As a minimum, a Phase I Desk Study Assessment including a robust Conceptual Site Model
  level: must
- item: A full and detailed Phase II intrusive site investigation following the LCRM framework, if required
  level: must
confidence: medium
notes: From the council's list (published October 2025), page 12. The list says 'particularly' former
  industrial/commercial sites and 'the majority of' developments introducing sensitive receptors; other
  sites with contamination concerns are judged case by case (site history, sensitivity of new receptors,
  nearby watercourses), so that part is discretionary.
review-status: unverified
field-status: {}
