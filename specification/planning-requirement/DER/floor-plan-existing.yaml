reference: floor-plan-existing
local-authority: DER
required-if:
  any:
  - condition:
      field: residential-extension
      value: true
      description: Extension to a dwelling (including single and double storey extensions).
  - all:
    - condition:
        field: new-build
        value: true
        description: A new build house.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: roof-space-room
      value: true
      description: Loft conversion.
  - condition:
      field: outbuilding
      value: true
      description: Erection of an outbuilding.
  - ref: major-development
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf
source-text: The drawings which are expected for an application will be appropriate and proportionate
  to the type and scale of the proposal as explained in Table 01. … *All GA drawings should show separately
  both the existing situation and proposed. … Existing and proposed GA drawings should be provided.
must-include:
- item: Shows the proposal relative to the existing context, including accurate information on neighbouring
    buildings
  level: should
- item: Relevant annotations and drawing legends
  level: should
- item: The internal arrangement, including partition walls, fixtures, appliances and furniture
  level: should
- item: Critical dimensions (room width x depth, corridor widths, distances to neighbouring properties/boundaries,
    garden dimensions, window/door dimensions and similar)
  level: should
confidence: medium
notes: From the council's list (published October 2025) and its Planning Drawing Guidance (v1.0, December
  2025; linked with the list on the council's 'Planning applications' page), page 4-6, 11. Table 01 lists
  GA floor plans, roof plan, elevations and sections (existing and proposed) for extensions to a dwelling,
  new build houses, loft conversions, outbuildings and major proposals. For other proposals (conservation
  areas, listed buildings, other majors) the guidance says the drawings 'may be relevant' depending on
  the proposal, so that part shows as discretionary.
review-status: unverified
field-status: {}
