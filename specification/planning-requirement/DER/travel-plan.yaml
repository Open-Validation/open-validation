reference: travel-plan
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP23 (Delivering a Sustainable Transport Network)
source-text: Full and outline applications. Major developments. … A (draft) travel plan should be submitted
  alongside planning applications which are likely to have significant transport implications.
must-include:
- item: A strategy for its implementation appropriate to the development
  level: should
- item: The travel plan coordinator, the management arrangements (e.g. a steering group) and the development
    timetable
  level: should
- item: Activities for marketing and promoting the plan to occupiers, users, visitors and residents
  level: should
- item: Targets and arrangements for monitoring
  level: should
- item: How new occupiers or customers will use alternative means of travel that do not involve private
    car use
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 17-18. The list's row is 'Draft Travel Plan';
  the targets, monitoring and alternative-travel items come from the Transport Assessment row.
review-status: unverified
field-status: {}
