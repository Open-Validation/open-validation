reference: location-plan
local-authority: DER
required-if:
  always: true
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
source-text: All new applications should be accompanied by a Site Location Plan.
must-include:
- item: Up to date and produced on an Ordnance Survey base with a North point
  level: must
- item: Scale of 1:1250 for most sites, or 1:2500 for larger sites
  level: should
- item: Application site centred on the plan, with surrounding roads named
  level: should
- item: The whole application site outlined in red, and any other land in the applicant's ownership or
    control outlined in blue
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 6, and its Planning Drawing Guidance (v1.0,
  December 2025; linked with the list on the council's 'Planning applications' page), page 10.
review-status: unverified
field-status: {}
