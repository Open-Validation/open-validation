reference: site-plan
local-authority: DER
required-if:
  any:
  - condition:
      field: residential-extension
      value: true
      description: Extension to a dwelling (including single and double storey extensions).
  - all:
    - condition:
        field: new-build
        value: true
        description: A new build house.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: roof-space-room
      value: true
      description: Loft conversion.
  - condition:
      field: outbuilding
      value: true
      description: Erection of an outbuilding.
  - condition:
      field: new-boundary-treatment
      value: true
      description: Walls, fences and gates.
  - ref: major-development
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf
source-text: Any application, as necessary to fully illustrate the existing arrangement and separately
  the proposal … Site Layout Plans – proposed layout plans should clearly identify where the proposals
  are located within the site and in relation to surrounding properties and show access, parking, servicing
  as appropriate to the development.
must-include:
- item: Where the proposal is located within the site and in relation to surrounding properties, through
    an accurate block footprint of the proposal
  level: should
- item: Access, parking and servicing, as appropriate to the development
  level: should
- item: Locations of existing trees and major landscape features
  level: should
- item: Scale of 1:200 for most sites, or 1:500 for larger sites
  level: should
- item: 'Walls, fences and gates: the location of the proposed walls, fences and gates clearly shown'
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: Walls, fences and gates.
confidence: medium
notes: From the council's list (published October 2025), page 6, and its Planning Drawing Guidance (v1.0,
  December 2025; linked with the list on the council's 'Planning applications' page), page 4-6, 10. The
  guidance calls it the Site Block Plan; Table 01 lists it for extensions, new houses, loft conversions,
  outbuildings, walls/fences/gates and major proposals; otherwise 'as necessary', shown as discretionary.
review-status: unverified
field-status: {}
