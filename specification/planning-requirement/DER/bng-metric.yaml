reference: bng-metric
local-authority: DER
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: Environment Act 2021; NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP19 (Biodiversity)
source-text: 'For major developments we require the following information to be submitted with your application:
  … A completed Biodiversity Metric with the on-site baseline habitat: … For minor developments we require
  the following information to be submitted with your application: … Whilst self and custom build applications
  are exempt from delivering Biodiversity Net Gain, the Council still requires the submission of the appropriate
  metric, setting out the baseline habitat of the site. … Development where the site area within the red
  line boundary is 0.2 hectares or below. … The major change is that self and custom build development
  is no longer exempt.'
must-include:
- item: 'Major development: the Main Metric, completed by a competent person (competency aligned with
    BS 8683)'
  level: must
  required-if:
    ref: major-development
- item: 'Minor development: the Small Sites Metric, completed by a competent person able to identify the
    habitats on site and the management needed for habitats to be created or enhanced'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
- item: Submitted as an xlsx file (not xlsm or PDF)
  level: must
- item: Any river condition assessment needed for the metric completed by a qualified assessor
  level: must
confidence: medium
notes: 'From the council''s list (published October 2025), page 4-5. Rule follows the law: householder,
  permitted development, de minimis, sites of 0.2 ha or less and the other exemptions listed by the council
  are exempt. The list (October 2025) still exempts self and custom build but asks for the metric anyway;
  the council''s page says that from 6 August 2026 self and custom build is no longer exempt and sites
  of 0.2 hectares or below are. BNG update: https://www.derby.gov.uk/environment-and-planning/planning/development-control/planning-applications/'
review-status: unverified
field-status: {}
