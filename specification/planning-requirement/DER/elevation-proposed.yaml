reference: elevation-proposed
local-authority: DER
required-if:
  any:
  - condition:
      field: residential-extension
      value: true
      description: Extension to a dwelling (including single and double storey extensions).
  - all:
    - condition:
        field: new-build
        value: true
        description: A new build house.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: roof-space-room
      value: true
      description: Loft conversion.
  - condition:
      field: outbuilding
      value: true
      description: Erection of an outbuilding.
  - condition:
      field: new-boundary-treatment
      value: true
      description: Walls, fences and gates.
  - ref: major-development
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf
source-text: The drawings which are expected for an application will be appropriate and proportionate
  to the type and scale of the proposal as explained in Table 01. … *All GA drawings should show separately
  both the existing situation and proposed.
must-include:
- item: Front, rear and side elevations, and all elevations that might be obscured in a single view
  level: should
- item: Critical dimensions (distances to neighbouring properties/boundaries, extension step back, window/door
    dimensions and similar)
  level: should
- item: Where the proposal relates to a semi-detached or terraced property, an indication of the relationship
    to adjoining properties
  level: should
  source-text: Where proposals relate to semi-detached/terraced properties, drawings should reflect this
    with an indication of the relationship to adjoining properties.
- item: 'Key building level datums with dimensions: floor, parapet, eaves and ridge height'
  level: should
- item: A legend or annotation showing which materials and finishes are used where, and a materials schedule
    (type, finish and colour)
  level: should
- item: Architectural façade details and features
  level: should
- item: Details of window openings/fenestration (including opening lights), any obscured glazing and doors
  level: should
- item: Full design details of any rooftop plant or building services
  level: should
- item: Elevation locations marked on the GA floor plans
  level: should
- item: 'Walls, fences and gates: details of the proposed materials and finishes'
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: Walls, fences and gates.
confidence: medium
notes: From the council's list (published October 2025), page 7, and its Planning Drawing Guidance (v1.0,
  December 2025; linked with the list on the council's 'Planning applications' page), page 4-6, 12. Table
  01 lists GA floor plans, roof plan, elevations and sections (existing and proposed) for extensions to
  a dwelling, new build houses, loft conversions, outbuildings and major proposals. For other proposals
  (conservation areas, listed buildings, other majors) the guidance says the drawings 'may be relevant'
  depending on the proposal, so that part shows as discretionary. Walls, fences and gates need elevations
  too.
review-status: unverified
field-status: {}
