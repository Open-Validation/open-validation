reference: air-quality-assessment
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Within an Air Quality Management Area (AQMA).
    - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP23 (Delivering a Sustainable Transport Network)
source-text: 'Full and Outline applications. Within or affecting an AQMA or an area where levels of air
  pollution are known to be high … Applications will need to be supported by information necessary to
  allow a full consideration of the impact of the proposal on local air quality, where any of the following
  apply: … The development could cause an increase in air pollution in an Air Quality Management Area
  (AQMA) or in any other area of the city known to experience high concentrations of air pollution; or
  … the development would introduce new sensitive receptors (e.g. the occupants of housing or a new school)
  into an AQMA or any other area of the city known to experience high concentrations of air pollution;
  or … where the grant of planning permission would conflict with, or render unworkable, elements of the
  Council’s Air Quality Action Plan (AQAP).'
must-include:
- item: A detailed air quality impact assessment where the impacts could be 'significant'
  level: must
  required-if: discretionary
  source-text: A detailed air quality impact assessment shall be submitted for all applications where
    it is deemed that the above impacts could be ‘significant’.
confidence: medium
notes: From the council's list (published October 2025), page 2. Development affecting (rather than in)
  an AQMA, other areas of the city known to have high air pollution and conflict with the Air Quality
  Action Plan are judged case by case, so they show as discretionary.
review-status: unverified
field-status: {}
