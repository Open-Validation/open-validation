reference: section-proposed
local-authority: DER
required-if:
  any:
  - condition:
      field: residential-extension
      value: true
      description: Extension to a dwelling (including single and double storey extensions).
  - all:
    - condition:
        field: new-build
        value: true
        description: A new build house.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: roof-space-room
      value: true
      description: Loft conversion.
  - condition:
      field: outbuilding
      value: true
      description: Erection of an outbuilding.
  - ref: major-development
  - condition:
      field: change-in-ground-levels
      value: true
      description: Land levels change across the site or between nearby properties.
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf
source-text: The drawings which are expected for an application will be appropriate and proportionate
  to the type and scale of the proposal as explained in Table 01. … *All GA drawings should show separately
  both the existing situation and proposed. … Sections/Topographical Survey – sites where land levels
  change across the site or between nearby properties should be accompanied by drawings which clearly
  reflect this.
must-include:
- item: Taken at an appropriate location(s) on the proposal, with section cut lines shown on the GA floor
    plans
  level: should
- item: Details of land levels around the proposal
  level: should
- item: Key building level datums (floor, parapet, eaves and ridge height), and floor-to-ceiling and floor-to-floor
    heights
  level: should
- item: Details of rooftop plant or building services
  level: should
- item: Parts of the building being 'cut through' shown with an appropriate solid hatch; wall and window
    reveal depths shown accurately
  level: should
- item: Boundary treatments
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 7, and its Planning Drawing Guidance (v1.0,
  December 2025; linked with the list on the council's 'Planning applications' page), page 4-6, 12-13.
  Table 01 lists GA floor plans, roof plan, elevations and sections (existing and proposed) for extensions
  to a dwelling, new build houses, loft conversions, outbuildings and major proposals. For other proposals
  (conservation areas, listed buildings, other majors) the guidance says the drawings 'may be relevant'
  depending on the proposal, so that part shows as discretionary.
review-status: unverified
field-status: {}
