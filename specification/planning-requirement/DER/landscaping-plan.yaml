reference: landscaping-plan
local-authority: DER
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf
source-text: 'Applications for major development. … The following is expected as a minimum (further drawings
  may be requested on a case-by-case basis): … Landscape strategy plan, which clearly demonstrates details
  of hard landscaping (including materials and finishes), public realm (street furniture, lighting), and
  soft landscaping (including details of planting species, size and location).'
must-include:
- item: Hard landscaping, including materials and finishes
  level: must
- item: 'Public realm: street furniture and lighting'
  level: must
- item: Soft landscaping, including planting species, size and location
  level: must
- item: Access, movement, maintenance and the locations of existing trees
  level: should
confidence: medium
notes: 'From the council''s list (published October 2025), page 9-10, and its Planning Drawing Guidance
  (v1.0, December 2025; linked with the list on the council''s ''Planning applications'' page), page 5-6,
  13. For conservation areas and listed buildings the guidance lists ''Detailed landscaping proposals
  if relevant'', and the list says landscape plans ''could be required'' to protect the setting of heritage
  assets: discretionary.'
review-status: unverified
field-status: {}
