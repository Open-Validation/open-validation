reference: lighting-assessment
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
source-text: Where external lighting would be provided or made necessary by the development, should be
  required to be accompanied by details of external lighting and the proposed hours when the lighting
  would be in use.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be in use
  level: must
- item: A schedule of the equipment, including performance details such as colour temperature and colour
    rendering, height, mounting and orientation
  level: must
  required-if: discretionary
  source-text: Where lighting proposals may impact upon 'sensitive receptor's … a schedule of the equipment,
    including performance details such as colour temperature and colour rendering, height, mounting and
    orientation
