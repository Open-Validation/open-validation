reference: lighting-assessment
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Saved Policy GD5 (Amenity) of the CDLP1 Review; Schedule 4 1(d) of the EIA Regulations 2017;
  Institution of Lighting Professionals Professional Lighting Guide 04 (2013) and Guidance Note 08/23
  Bats and artificial Lighting at Night (2023)
source-text: Full and Outline applications. Where lighting proposals may impact upon ‘sensitive receptor’s
  … Where external lighting would be provided or made necessary by the development, should be required
  to be accompanied by details of external lighting and the proposed hours when the lighting would be
  in use.
must-include:
- item: Details of the external lighting and the proposed hours when it would be in use
  level: must
- item: A layout plan
  level: must
- item: Design calculations, based and evidenced on the relevant standards applied
  level: must
- item: A schedule of the equipment, with performance details such as colour temperature and colour rendering,
    height, mounting and orientation
  level: must
confidence: medium
notes: From the council's list (published October 2025), page 12-13. Whether lighting 'may impact upon
  sensitive receptors' is a judgement, so the rule is discretionary within lit schemes.
review-status: unverified
field-status: {}
