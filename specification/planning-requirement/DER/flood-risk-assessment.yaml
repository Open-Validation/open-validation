reference: flood-risk-assessment
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3 (Environment Agency flood maps and the City Council's Strategic
          Flood Risk Assessment).
    - condition:
        field: near-watercourse
        value: true
        description: Within 20 metres of a watercourse.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or greater (Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or greater (Flood Zone 1).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; National Planning Practice Guidance; Derby City Local Plan Part 1 (DCLP1) Policy CP2 (Responding
  to Climate Change); Derby City Strategic Flood Risk Assessment
source-text: Full and Outline applications. Sites in Flood Zones 2 and 3 and within 20 metres of a watercourse.
  As identified on both the EA flood Maps and the City Council Strategic Flood Risk Assessment … Planning
  applications for development proposals of 1 hectare or greater in Flood Zone 1 and all proposals for
  new development located in Flood Zones 2 and 3 should be accompanied by a Flood Risk Assessment (FRA).
  … Full and Outline applications, (including householder development)
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development, and shows
    how they will be managed, taking climate change into account
  level: should
- item: 'Major development in Flood Zone 1: opportunities to reduce the probability and consequences of
    flooding'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published October 2025), page 8-9. Read as two separate triggers: sites
  in Flood Zones 2 and 3, and sites within 20 m of a watercourse. The types cell adds ''(including householder
  development)''.'
review-status: unverified
field-status: {}
