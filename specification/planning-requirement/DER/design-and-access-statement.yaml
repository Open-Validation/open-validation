reference: design-and-access-statement
local-authority: DER
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (conservation area or World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sqm or more.
  - site:
      in:
      - conservation-area
      - listed-building
      description: Development within a conservation area, or affecting a listed building (Table 01).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications for major development. Applications for development in a designated area where
  the proposal comprises of one of more dwellings or a building/ buildings with a floor space of 100sqm
  or more. Listed building consent applications.
must-include:
- item: Commentary on the design process, showing how the proposal has evolved from concept to developed
    design
  level: should
- item: A cohesive design narrative and the design principles behind the proposal, informed by analysis
    of the site context and character
  level: should
- item: How access to the site and proposal is to be provided (including servicing)
  level: should
- item: How the proposal accords with relevant local and national policies
  level: should
confidence: medium
notes: From the council's list (published October 2025) and its Planning Drawing Guidance (v1.0, December
  2025; linked with the list on the council's 'Planning applications' page), page 5-6, 14. Table 01 also
  lists a Design and Access Statement for proposed development within a conservation area and development
  affecting listed buildings, whatever its size.
review-status: unverified
field-status: {}
