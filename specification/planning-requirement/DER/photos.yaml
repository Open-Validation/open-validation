reference: photos
local-authority: DER
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: The proposal involves the demolition of an existing building.
  - site:
      in:
      - conservation-area
      - listed-building
      description: Development affecting a conservation area or a listed building.
  - condition:
      field: residential-extension
      value: true
      description: Extension to a dwelling (Planning Drawing Guidance Table 01).
  - all:
    - condition:
        field: new-build
        value: true
        description: A new build house (Planning Drawing Guidance Table 01).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
  - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
source-text: Any application, as necessary to fully illustrate the proposal … Photographs should be provided
  if the proposal involves the demolition of an existing building or development affecting a conservation
  area or a listed building. … Photographs of the application site showing the baseline habitats. Even
  if you consider that the application is exempt.
must-include:
- item: Photographs of the application site showing the baseline habitats
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
- item: 'Conservation area: photographs of the elevations/areas where works are proposed'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Development within a conservation area.
- item: 'Listed building: photographs of all elevations/areas/rooms where works are proposed'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Development affecting a listed building.
confidence: medium
notes: 'From the council''s list (published October 2025), page 4, 15. The Planning Drawing Guidance (Table
  01, pages 4-6) adds site photographs for extensions to a dwelling and new build houses, and the elevation/room
  photographs for conservation areas and listed buildings. ''As necessary to fully illustrate the proposal''
  is discretionary. Rule follows the law: householder, permitted development, de minimis, sites of 0.2
  ha or less and the other exemptions listed by the council are exempt. The list (October 2025) still
  exempts self and custom build but asks for the metric anyway; the council''s page says that from 6 August
  2026 self and custom build is no longer exempt and sites of 0.2 hectares or below are.'
review-status: unverified
field-status: {}
