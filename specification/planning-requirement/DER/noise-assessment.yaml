reference: noise-assessment
local-authority: DER
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Introduces new sources of noise into sensitive areas (e.g. residential areas).
      - condition:
          field: noise-sensitive-use
          value: true
          description: Introduces new sensitive receptors (e.g. dwellings or care/residential homes) into
            existing noisy areas.
  - condition:
      field: air-source-heat-pump
      value: true
      description: Domestic air source heat pump installations.
  - condition:
      field: wind-turbine
      value: true
      description: Domestic wind turbine installations.
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; City of Derby Local Plan Review (CDLPR) Policy GD5 (Amenity)
source-text: Full and Outline applications. Where a development might create noise which could impact
  upon ‘sensitive receptors’ and where new ‘sensitive’ developments are proposed within the vicinity of
  existing noise sources. … Applications which introduce new sources of noise into sensitive areas (e.g.
  residential areas), or which introduce new sensitive receptors (e.g. residential dwellings or care/residential
  homes) into existing noisy areas, shall be supported by documentation which considers the potential
  noise impacts. … Any proposals for domestic installations … Applications for air source heat pumps or
  wind turbines must be accompanied by a simplified noise assessment called an MCS-020 Noise.
must-include:
- item: 'Air source heat pumps or wind turbines: a simplified MCS-020 noise assessment'
  level: must
  required-if:
    any:
    - condition:
        field: air-source-heat-pump
        value: true
        description: Air source heat pump.
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbine.
- item: 'Where significant noise impacts are anticipated: a detailed noise impact assessment prepared
    by a suitably qualified and competent acoustic consultant'
  level: must
  required-if: discretionary
- item: Has regard to relevant British Standards and/or current guidance (e.g. BS4142, BS8233 or MCS-020
    for air source heat pumps)
  level: should
- item: Methodology agreed in advance with the council's Environmental Protection Team
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 2, 14. Combines the 'Noise Impact Assessment'
  row and the 'Air Source Heat Pumps/Wind Turbines' row.
review-status: unverified
field-status: {}
