reference: transport-assessment
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP23 (Delivering a Sustainable Transport Network)
source-text: Full and Outline applications. Major developments impacting upon the local and strategic
  highway network … For smaller schemes the Transport Statement (TS) is sufficient
must-include:
- item: Accessibility to the site by all modes of transport, and the likely modal split of journeys to
    and from the site
  level: must
- item: Proposed measures to improve access by public transport, walking and cycling, to reduce the need
    for parking, and to mitigate transport impacts
  level: must
- item: Analysis of all existing and proposed trips by all modes of travel generated by the proposal
  level: must
- item: Existing transport conditions, how the development would affect them, and any measures proposed
    to overcome problems
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles clearly identified
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 17-18. A Transport Statement for smaller
  schemes with significant transport implications is judged case by case, so it shows as discretionary.
  TAs should be agreed in advance where possible.
review-status: unverified
field-status: {}
