  date-basis: 'Title on page 1: ''Local List of Validation Requirements - October 2025'' (PDF created
    22 October 2025). It is the only list linked from the council''s ''Planning applications'' page (https://www.derby.gov.uk/environment-and-planning/planning/development-control/planning-applications/),
    checked 6 November 2026; that page adds ''Updated Biodiversity Net Gain (BNG) guidance'' (6 August
    2026) that ''updates what is in the Local List'' and links the companion Planning Drawing Guidance
    (v1.0, December 2025: https://www.derby.gov.uk/media/derbycitycouncil/content/documents/environmentandplanning/developmentcontrol/planning-drawing-guidance.pdf).
    No newer list or consultation found.'
  status: current
submission-standards:
- item: Drawings of a sufficiently high quality, accuracy and legibility to clearly demonstrate the proposal
    in detail
  level: must
- item: Elevations, floor plans and sections to a recognised metric scale (GA drawings at 1:100 or 1:50,
    in millimetres/metres), with a scale bar and north point on relevant drawings
  level: should
- item: Hand-drafted drawings accepted only for smaller proposals, and they must still follow the drawing
    guidance
  level: must
- item: Existing and proposed GA drawings, showing the proposal in its existing context including neighbouring
    buildings; drawings without sufficient context will be resisted
  level: should
- item: Clear differentiation between existing, to be demolished (hatched in red) and proposed
  level: should
- item: A clear title block on all GA drawings with the drawing name, number and dates/details of revisions
  level: should
- item: Drawings submitted electronically clearly named to describe their content; a drawing reference
    number alone is not sufficient
  level: must
- item: Drawings that fail to include the information the drawing guidance requires will not be accepted/validated
  level: must
- item: Biodiversity metric submitted as an xlsx file (not xlsm or PDF)
  level: must
- item: Postal applications need only one copy of forms, certificates, plans and documents; electronic
    submission (PDF forms, plans and documents) preferred
  level: should
