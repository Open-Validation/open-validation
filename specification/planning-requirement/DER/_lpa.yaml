  notes: 'Grokbot''s link is the current Derby LLVR (October 2025). However, its capture misses about
    10 local requirements (climate change tool, residential delivery info, aerodrome safeguarding, GCN
    and others) and ignores the application types stated in the LLVR by putting most items under Full
    planning only. It also wrongly says householder has no local requirements and has many garbled triggers.
    Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
