reference: biodiversity-survey-report
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - local-nature-reserve
        - local-wildlife-site
        description: May affect designated nature conservation sites.
    - condition:
        field: protected-species
        value: true
        description: May affect protected wildlife habitats or species (for example demolition of older
          buildings or roof spaces, removal of trees, scrub or hedgerows, alterations to watercourses,
          or great crested newts).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP19 (Biodiversity); Supplementary Planning
  Document – Nature Conservation
source-text: Full, Outline and Reserved Matters applications. Proposal which may affect designated nature
  conservation sites or other protected wildlife habitats or species … Certain proposals which include
  work such as the demolition of older buildings or roof spaces, removal of trees, scrub, hedgerows or
  alterations to water courses may affect protected species and will need to provide information on them,
  any potential impacts for them and any mitigation proposals for such impacts.
must-include:
- item: Existing biodiversity interests on the site and the possible impacts on them
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
- item: Where appropriate, plans showing significant wildlife habitats or features and the location of
    habitats of protected species
  level: should
- item: 'For development in the countryside affecting areas designated for their biodiversity: assessment
    of impacts and proposals for long-term maintenance and management'
  level: should
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - local-nature-reserve
      - local-wildlife-site
      description: Countryside areas designated for their biodiversity interests.
confidence: medium
notes: 'From the council''s list (published October 2025), page 3-4, 20. The list''s separate ''Great
  Crested Newts'' row (page 20: ''Any application where development affects Great Crested Newts'') asks
  applicants to meet the legal requirements through a Natural England licence route (mitigation licence,
  low impact class licence or District Level Licensing, which Derby is part of); it is covered here by
  the protected-species trigger.'
review-status: unverified
field-status: {}
