reference: affordable-housing-statement
local-authority: DER
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more units are proposed.
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP7 (Affordable and Specialist Housing)
source-text: Full and Outline applications. where 15 or more units are proposed. … Where local plan policies
  or Supplementary Planning Document guidance requires the provision of affordable housing the local planning
  authority may require information concerning both the affordable housing and any market housing
must-include:
- item: Numbers of residential units and the mix of units, with numbers of habitable rooms and/or bedrooms,
    or the floor space of habitable areas
  level: should
- item: Plans showing the location of units and their number of habitable rooms and/or bedrooms, and/or
    the floor space of the units
  level: should
- item: A clear and full explanation where different levels or types of affordability or tenure are proposed
    for different units
  level: should
- item: Details of any Registered Provider acting as partners in the development
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 2.
review-status: unverified
field-status: {}
