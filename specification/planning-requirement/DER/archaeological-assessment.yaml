reference: archaeological-assessment
local-authority: DER
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: The development includes a new building.
    - condition:
        field: ground-disturbance
        value: true
        description: The development includes ground disturbance.
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      - scheduled-monument
      description: On or adjoining a heritage asset of archaeological interest (the list points to Archaeological
        Alert Areas on the Local Plan Policies Map and the Derbyshire Historic Environment Record).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP20 (Historic Environment); City of Derby Local
  Plan Review (CDLPR) Policy E21 (Archaeology)
source-text: When any proposed development includes new building or ground disturbance on or adjoining
  a heritage asset of archaeological interest
must-include:
- item: Enough information to establish the significance of any archaeological remains within the site
    and the likely impacts of the proposals on them
  level: should
- item: A full Historic Environment Record search, where a formal archaeological assessment is required
  level: should
confidence: medium
notes: From the council's list (published October 2025), page 3. The assessment may be a desk-based assessment
  and/or a field evaluation, depending on sensitivity, current land use and the proposal; Derbyshire County
  Council's archaeology team advises.
review-status: unverified
field-status: {}
