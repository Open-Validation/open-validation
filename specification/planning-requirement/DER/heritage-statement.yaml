reference: heritage-statement
local-authority: DER
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      description: Works to properties in a conservation area.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - listed-building
        - listed-building-setting
        - world-heritage-site
        - scheduled-monument
        - locally-listed-building
        - park-and-garden
        description: Development impacting on a heritage asset (including the Derwent Valley Mills World
          Heritage Site, its buffer zone and setting).
source-url: https://www.derby.gov.uk/media/derbycitycouncil/contentassets/documents/environmentandplanning/planning/developmentcontrol/local-list-validation-requirements2025.pdf
policy: NPPF; Derby City Local Plan Part 1 (DCLP1) Policy CP20 (Historic Environment)
source-text: Full, Outline, Listed Building Application Any Developments impacting on a Heritage Asset.
  … This is required for applications for Listed Building Consent and works to properties in conservation
  areas.
must-include:
- item: A list of the heritage assets to be assessed
  level: should
- item: Statement of significance for designated assets and those of local architectural, historic, archaeological
    or artistic interest, including the significance of their setting
  level: should
- item: 'Heritage impact assessment: the impact of the proposal on the significance of the heritage asset(s),
    directly or through setting, with justification and/or mitigation'
  level: should
- item: Photos, with a plan showing where they were taken and the direction where the application is complex
  level: should
- item: 'Within the Derwent Valley Mills World Heritage Site, its buffer or wider setting: heritage impact
    assessment following the UNESCO guidance'
  level: must
  required-if:
    site:
      in:
      - world-heritage-site
      description: Derwent Valley Mills World Heritage Site, its buffer zone or wider setting.
- item: Structural plans where structural works or any degree of demolition of a heritage asset is proposed
  level: should
  required-if:
    any:
    - condition:
        field: structural-alteration
        value: true
        description: Structural works to a heritage asset.
    - condition:
        field: demolition
        value: true
        description: Any degree of demolition of a heritage asset.
- item: 'Where the proposal directly affects a heritage asset: a schedule of works to the asset(s), and
    a method statement where appropriate'
  level: should
- item: A clear and convincing justification for the work in terms of need, options looked at and ruled
    out, and public benefits
  level: must
- item: Where harm is caused, appropriate mitigation
  level: must
confidence: medium
notes: From the council's list (published October 2025), page 9-10. The council's 'Planning applications'
  page (https://www.derby.gov.uk/environment-and-planning/planning/development-control/planning-applications/)
  says a heritage statement is 'required for applications for Listed Building Consent and works to properties
  in conservation areas', and the Planning Drawing Guidance (Table 01) asks for a heritage statement of
  significance and heritage impact assessment for development in a conservation area or affecting listed
  buildings. Landscape plans 'could be required' to protect the setting of designated heritage assets.
review-status: unverified
field-status: {}
