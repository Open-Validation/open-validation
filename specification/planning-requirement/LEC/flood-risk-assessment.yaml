reference: flood-risk-assessment
local-authority: LEC
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        - critical-drainage-area
        description: The site is in flood zone 2 or 3, or in a critical drainage area.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more (in flood zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more (in flood zone 1).
    - discretionary
source-url: https://www.leicestershire.gov.uk/sites/default/files/field/pdf/2021/8/25/LCC-Planning-Application-Validation-Requirements.pdf
source-text: 'A site-specific Flood Risk Assessment (FRA) is required to be provided for all development
  in Flood Zones 2 and 3. … In Flood Zone 1, an assessment should accompany all proposals involving: sites
  of 1 hectare or more;'
confidence: medium
notes: 'Audit (wrong_trigger): para 4.20 also covers flood zone 1 areas flagged by a SFRA, and other sources
  of flooding where a more vulnerable use is introduced (shown as officer discretion).'
review-status: unverified
field-status: {}
