reference: air-quality-assessment
local-authority: LEC
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposal introduces a sensitive receptor, such as a school.
      - site:
          in:
          - air-quality-management-area
          description: The site is in an area of poor air quality.
    - discretionary
source-url: https://www.leicestershire.gov.uk/sites/default/files/field/pdf/2021/8/25/LCC-Planning-Application-Validation-Requirements.pdf
source-text: Air Quality Assessments will be required where a proposed development would release emissions
  (e.g., a facility where a fuel source is combusted, such as waste incinerator); where dust would be
  emitted; where there is an increase in vehicular movements (particularly HGVs); or where ‘sensitive
  receptors’, such as a school, would be introduced in an area of poor air quality.
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Emissions, dust and
  increases in vehicle movements (particularly HGVs) have no threshold, so they are shown as officer discretion.
review-status: unverified
field-status: {}
