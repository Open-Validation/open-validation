reference: land-contamination-assessment
local-authority: CHS
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: There is reason to suspect that the site may be contaminated.
  - discretionary
source-url: https://www.chesterfield.gov.uk/health-and-environment/contaminated-land/contaminated-land-and-the-planning-process/
source-text: Where there is reason to suspect that a site may be contaminated and there is the possibility
  that the contamination may affect the proposed development, the applicant will be required to submit
  reports in support of their planning application.
confidence: medium
notes: From the council's 'Contaminated land and the planning process' web page (last updated 26 June
  2026). Chesterfield publishes no local validation list (checked 2026-11-06), so this comes from the
  council's own web page instead. Shown as partly 'check' because whether the contamination 'may affect
  the proposed development' is the council's judgement. The linked 'Contaminated Land – A Guide for Developers'
  and its checklist (2015) set the phased report contents (desk study, site investigation, remediation)
  as the detail of the standard planning condition, to be submitted before development starts, so they
  are not listed as application contents here.
review-status: unverified
field-status: {}
