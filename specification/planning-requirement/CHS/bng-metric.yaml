reference: bng-metric
local-authority: CHS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.chesterfield.gov.uk/planning-and-building-control/planning-permission-and-development-management/biodiversity-net-gain/
policy: Environment Act 2021; Town and Country Planning Act 1990 (general biodiversity gain condition)
source-text: The list below sets out the minimum level of information in relation to biodiversity net
  gain that must be provided to the council for an application to be validated.
must-include:
- item: Completed biodiversity metric, including the publication date and version of the metric used,
    as a supporting XLSX document titled 'biodiversity metric calculation tool'
  level: must
  source-text: 'Completed biodiversity metric including the publication date and version of metric used
    (metrics can be downloaded from the gov.uk website) How to include it: Supporting XLSX document titled
    ‘biodiversity metric calculation tool’.'
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or proposed
    earlier date)
  level: should
  source-text: The metric should show the pre-development biodiversity value of the onsite habitat on
    the date of application (or proposed earlier date).
- item: Justification if an earlier baseline date has been used
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: An earlier baseline date than the application date is used.
  source-text: Justification if an earlier baseline date has been used
- item: Statement confirming whether the biodiversity value of on-site habitat is lower on the date of
    the application (or earlier date) because of degradation
  level: must
  source-text: Statement confirming if the biodiversity value of on-site habitat is lower on the date
    of the application (or earlier date) because of degradation
- item: 'Where degradation has occurred: a supporting statement confirming the date immediately before
    the activities were carried out, the pre-development value on that date (with metric) and any supporting
    evidence'
  level: should
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: On-site habitat has been degraded.
  source-text: Where degradation has occurred, a supporting statement should be submitted which confirms
    the date immediately before the activities were carried out, the pre-development value on this date
    (along with metric) and any supporting evidence.
- item: Description of any on-site irreplaceable habitats on the application land (as irreplaceable habitat
    details, or within a biodiversity statement, baseline on-site habitat survey report or other ecology
    report)
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: The application land includes irreplaceable habitat.
  source-text: Description of any on-site irreplaceable habitats ‘on land to which the application relates’
- item: Each individual habitat notated to allow cross-referencing with the metric; similar, smaller habitats
    not combined into one large area
  level: must
  source-text: Each individual habitat must be notated to allow cross-referencing with the Metric. Similar,
    smaller habitats must not be combined into one large area.
- item: Main metric completed by a competent person
  level: should
  source-text: The main metric should be completed by a competent person
- item: Any river condition assessment completed by a qualified assessor
  level: must
  required-if:
    condition:
      field: river-condition-assessment
      value: true
      description: A river condition assessment is needed to complete the metric.
  source-text: If a river condition assessment is required as part of completing the metric, this must
    be completed by a qualified assessor.
confidence: medium
notes: From the council's 'Biodiversity net gain' web page (last updated 13 August 2026). Chesterfield
  publishes no local validation list (checked 2026-11-06), so this comes from the council's own web page
  instead. The page lists the minimum BNG information that 'must be provided to the council for an application
  to be validated'. By law the rule is the biodiversity gain condition (the page lists householder, de
  minimis, some self-build and pre-BNG s73 applications as exempt). Confirmation that the permission would
  be subject to the condition goes on the application form. The information the page asks for 'at the
  earliest possible stage' (post-development habitats, mitigation hierarchy, strategy for meeting the
  condition, draft HMMP) is in the unmapped list.
