reference: cil-form
local-authority: CHS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The development results in new dwellings (including conversion of a building no longer
        in lawful use).
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 100
      description: Retail development with at least 100 square metres of new build.
  - discretionary
source-url: https://www.chesterfield.gov.uk/planning-and-building-control/planning-permission-and-development-management/cil-community-infrastructure-levy/
policy: Community Infrastructure Levy Regulations 2010; Chesterfield CIL Charging Schedule
source-text: all retail developments (use class A1-A5) containing at least 100 square metres of new build
  (such as extra floor space) ... development that results in new dwellings ... If you are uncertain whether
  your proposal is liable for CIL, you should submit a CIL information form (CIL Form 0) with your application.
  ... It is important that you submit the CIL additional information form with your planning application,
  to ensure that your CIL liability is calculated correctly.
confidence: medium
notes: From the council's 'CIL - Community Infrastructure Levy' web page (last updated 4 November 2026).
  Chesterfield publishes no local validation list (checked 2026-11-06), so this comes from the council's
  own web page instead. The page lists the developments liable for CIL (retail of at least 100 sq m new
  build; new dwellings) and says to submit the CIL form with the application. The 'check' part is the
  page's 'If you are uncertain whether your proposal is liable'.
review-status: unverified
