reference: energy-statement
local-authority: CHS
required-if:
  ref: major-development
source-url: https://www.chesterfield.gov.uk/planning-and-building-control/planning-permission-and-development-management/climate-change-planning-guidance-for-developers/
policy: Chesterfield Borough Local Plan policy CLP20
source-text: Local Plan Policy CLP20 requires proposals for major development to be accompanied by a statement
  (as part of or in addition to a design and access statement) which sets out how the development minimises
  CO2 emissions during construction and occupation, and maximises both the use of and the generation of
  renewable energy.
must-include:
- item: How the development minimises CO2 emissions during construction and occupation
  level: must
- item: How the development maximises both the use of and the generation of renewable energy
  level: must
confidence: medium
notes: From the council's 'Climate change planning guidance for developers' web page (last updated 22
  October 2024). Chesterfield publishes no local validation list (checked 2026-11-06), so this comes from
  the council's own web page instead. The statement can be part of, or in addition to, the design and
  access statement; the page calls it 'the Energy Statement required by CLP20'. The Derbyshire planning
  assessment tool 'can be submitted' with it (optional). For minor and householder development the Derbyshire
  climate change checklist 'can be submitted' but is not required, so it has no file.
review-status: unverified
