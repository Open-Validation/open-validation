    required to process the application has been received'', and the pre-application service standards
    say written pre-application responses ''will include a list of the validation requirements for a planning
    application for those proposals''. The site''s full sitemap and site search have no validation list,
    no list was found by web search, and MHCLG''s register (planning.data.gov.uk entity 20309, entry 2026-10-16)
    says ''Couldn''t find any sort of checklist''. The council''s committee papers could not be searched
    (chesterfield.moderngov.co.uk is refused by the proxy). The pages do not say the council uses national
    requirements only, so the status stays not-found. Requirement files come from the council''s own Biodiversity
    net gain, climate change guidance, contaminated land and CIL pages'
