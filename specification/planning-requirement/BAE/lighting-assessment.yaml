reference: lighting-assessment
local-authority: BAE
required-if:
  condition:
    field: external-lighting
    value: true
    description: The proposal includes external lighting, particularly near residential property, a listed
      building, a conservation area or open countryside.
source-url: https://www.bassetlaw.gov.uk/media/4914/validation-of-planning-application.pdf
source-text: Lighting assessment Proposals involving the provision of external lighting, particularly
  in the vicinity of residential property, a listed building or a conservation area or open countryside,
  must be accompanied by details of the external lighting and the proposed hours when the lighting would
  be switched on.
must-include:
- item: Details of the external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): applies to external lighting near a listed building or conservation area,
  not to listed building consent applications. The wording is from the 2018 PDF.'
review-status: unverified
field-status: {}
