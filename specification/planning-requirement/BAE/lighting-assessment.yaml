reference: lighting-assessment
local-authority: BAE
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: The proposal includes external illumination (e.g. security, car-park, ménage or sports
        floodlighting).
  - any:
    - condition:
        field: adjoins-residential-property
        value: true
        description: Within or in the vicinity of residential areas.
    - site:
        in:
        - listed-building
        - listed-building-setting
        description: Within or in the vicinity of listed building(s).
    - site:
        in:
        - conservation-area
        description: Within or in the vicinity of a conservation area.
    - condition:
        field: outside-urban-area
        value: true
        description: Within or in the vicinity of open countryside.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policies 46 and ST38
source-text: 'Development proposals which include an element of external illumination (e.g., security
  lighting of buildings and open areas, car-park lighting, ménage, floodlighting of sports facilities)
  where the application site is within or in the vicinity of the following: residential areas listed building(s)
  conservation area open countryside'
must-include:
- item: A layout plan showing all light fixtures, beam orientation and spread of illuminated areas with
    specified lux levels
  level: must
- item: Elevational details showing the position of the lighting units
  level: must
- item: A detailed performance specification of the equipment
  level: must
- item: The times the lighting will be in use
  level: must
- item: An assessment of the impact on adjoining uses, nearby habitats used by light sensitive wildlife
    and the locality
  level: must
- item: Mitigation measures for any adverse impacts
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Lighting Specification'.
review-status: unverified
field-status: {}
