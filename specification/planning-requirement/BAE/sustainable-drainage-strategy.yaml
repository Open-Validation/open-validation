reference: sustainable-drainage-strategy
local-authority: BAE
required-if:
  ref: major-development
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policy ST50
source-text: Major development proposals with surface water drainage (including outline applications)
must-include:
- item: 'For outline applications: a conceptual drainage plan and SuDS design statement'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'For detailed applications: a detailed drainage plan and SuDS design statement covering operation,
    management and maintenance for the lifetime of the development, and measures to avoid water contamination
    and safeguard groundwater'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: If SuDS are not possible, a statement explaining why
  level: must
- item: Where connecting to an existing drainage system, details of that system on the drawings
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Sustainable Drainage Systems (SuDS) Strategy'.
review-status: unverified
field-status: {}
