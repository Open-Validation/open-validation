reference: location-plan
local-authority: BAE
required-if:
  always: true
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 7 (1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: Location Plan (based on an up-to-date map, at a scale of either 1:1250 or 1:2500)
must-include:
- item: Based on an up-to-date map, at a scale of either 1:1250 or 1:2500
  level: must
- item: The entire application site outlined in red, and any other land within the ownership or control
    of the applicant outlined in blue
  level: must
- item: Sufficient roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: A north point
  level: should
