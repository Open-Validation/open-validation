reference: waste-management-plan
local-authority: BAE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of new residential units (including subdivision and conversion schemes).
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New commercial development.
  - condition:
      field: hmo-creation
      value: true
      description: Creation of Houses in Multiple Occupation.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A material change of use.
    - condition:
        field: waste-storage-facilities
        value: true
        description: Will necessitate the storage and collection of waste.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Nottinghamshire and Nottingham Waste Local Plan
source-text: 'Development proposals involving any of the following: Creation of new residential units
  (including subdivision and conversion schemes) New commercial development Creation of Houses in Multiple
  Occupation Any material change of use which will necessitate the storage and collection of waste.'
must-include:
- item: Refuse and recycling storage locations and access arrangements for collection
  level: must
- item: Any proposed means of enclosure detailed on plans
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Waste Storage and Collection Details'.
review-status: unverified
field-status: {}
