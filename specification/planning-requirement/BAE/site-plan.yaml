reference: site-plan
local-authority: BAE
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: Creation of new floorspace.
  - condition:
      field: engineering-operations
      value: true
      description: Engineering operations.
  - condition:
      field: involves-change-of-use
      value: true
      description: Material changes of use of land.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 7 (1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: Proposals involving the creation of new floorspace, engineering operations or material changes
  of use of land.
must-include:
- item: Existing and proposed site/block plans at a scale of either 1:200 or 1:500
  level: must
- item: 'Where applicable: the proposed development relative to the site boundaries and other existing
    buildings and landscape features on the site'
  level: must
- item: 'Where applicable: buildings, roads and footpaths on adjoining land, enough to show the relationship
    to neighbouring properties'
  level: must
- item: 'Where applicable: access and parking arrangements, including visibility splays, vehicle turning,
    parking space dimensions and allocation to plots'
  level: must
- item: 'Where applicable: existing and proposed hard and soft landscape areas'
  level: must
- item: 'Where applicable: boundary treatment, including walls or fencing'
  level: must
- item: 'Where applicable: areas for bin and/or cycle storage'
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Plans/Drawings. 'Existing
  and proposed site/block plan'. The contents apply 'where applicable to the nature and type of development
  proposed'.
review-status: unverified
field-status: {}
