reference: planning-statement
local-authority: BAE
required-if:
  any:
  - ref: major-development
  - condition:
      field: hmo-creation
      value: true
      description: Creation of Houses in Multiple Occupation.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - any:
      - condition:
          field: childrens-home
          value: true
          description: Creates accommodation for children.
      - condition:
          field: use-class
          value: accommodation-for-vulnerable-adults
          description: Creates accommodation for vulnerable adults.
  - application-type:
      in:
      - s73
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: NPPF; Bassetlaw development plan
source-text: Development proposals that involve any of the following Major developments (including applications
  for outline permission and approval of reserved matters) Creation of Houses in Multiple Occupation Changes
  of use which include the creation of accommodation for children or vulnerable adults. Seeking the removal
  or variation of planning conditions
must-include:
- item: A summary of the proposed development and its key impacts
  level: must
- item: A description of the site, its context and planning history
  level: must
- item: A summary of relevant national and local planning policies and guidance
  level: must
- item: How and why the development accords or fails to accord with them
  level: must
- item: Any other materially relevant information not covered in other documents
  level: must
- item: 'Where pre-application advice was given: whether and how it fed into the proposals, and justification
    where it was not followed'
  level: should
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  Major development includes outline and reserved matters applications. 'Seeking the removal or variation
  of planning conditions' is shown as s73.
review-status: unverified
field-status: {}
