reference: construction-management-plan
local-authority: BAE
required-if:
  any:
  - ref: major-development
  - condition:
      field: demolition
      value: true
      description: Demolition is proposed.
  - discretionary
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policies ST52 and ST53
source-text: Proposals for major development or any other development proposals that have the potential
  to cause disruption including, but not limited to, where demolition is proposed.
must-include:
- item: Enough detail to show construction traffic and activity would not cause unacceptable harm to road
    safety, bus or transport operations, congestion or the day-to-day life of people nearby
  level: must
- item: If full details are not available, a framework or draft plan outlining the areas the detailed
    plan will cover
  level: should
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Construction Traffic Management Plan (CTMP)'. Other proposals with 'the potential to cause disruption'
  are a judgement, so 'discretionary' is included.
review-status: unverified
field-status: {}
