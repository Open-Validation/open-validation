reference: affordable-housing-statement
local-authority: BAE
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: Residential developments of 10 or more units.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policy ST27; Affordable Housing SPD (November 2025)
source-text: Residential developments of 10 or more units
must-include:
- item: The levels of affordable housing to be provided, in line with national guidance and local policy
  level: must
- item: If the full affordable housing ask is not met, relevant and justifiable reasons; if based on viability,
    fully detailed reasons in line with Chapter 5 and Appendix B of the Affordable Housing SPD
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The full affordable housing ask is not met.
- item: Any viability appraisal completed by a suitably qualified person with supporting evidence
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The justification is based on viability.
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  The applicant pays for the council's consultant to validate any viability assessment.
review-status: unverified
