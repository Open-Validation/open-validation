reference: biodiversity-survey-report
local-authority: BAE
required-if:
  any:
  - ref: major-development
  - condition:
      field: greenfield-site
      value: true
      description: Greenfield developments.
  - condition:
      field: hedgerows-affected
      value: true
      description: Likely to impact hedgerows.
  - condition:
      field: tree-works
      value: true
      description: Likely to impact mature trees.
  - condition:
      field: near-woodland
      value: true
      description: Likely to impact woodland, or in or adjacent to woodland.
  - condition:
      field: derelict-site
      value: true
      description: Overgrown or derelict former industrial sites.
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - ancient-woodland
      description: On, adjacent to or near designated sites such as SSSIs, Local Wildlife Sites or ancient
        woodland.
  - condition:
      field: potential-roost-features
      value: true
      description: Affects the roof or roof void of a building of traditional construction (protected
        species survey).
  - condition:
      field: underground-structures
      value: true
      description: A bridge, cave, tunnel or cellar (protected species survey).
  - condition:
      field: near-watercourse
      value: true
      description: In or adjacent to a watercourse (protected species survey).
  - condition:
      field: pond-on-or-near-site
      value: true
      description: In or adjacent to a pond or lake (protected species survey).
  - condition:
      field: demolition
      value: true
      description: Demolition of a building (protected species survey).
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Conversion of a building, e.g. a barn (protected species survey).
  - condition:
      field: protected-species
      value: true
      description: Buildings already known to house bat roosts or barn owls.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policy ST38; Wildlife and Countryside Act 1981; Conservation of
  Habitats and Species Regulations; Protection of Badgers Act 1992
source-text: 'An Ecological Appraisal, sometimes termed as Biodiversity Assessment Preliminary Ecological
  Appraisal and Ecological Impact Assessment will be required for all major applications, greenfield developments
  or for developments which are likely to impact: Hedgerows, mature trees or woodland Overgrown or derelict
  former industrial sites On, adjacent to or near designated sites such as SSSI’s, or other protected
  sites including Local Wildlife Sites or ancient woodland An Ecological Appraisal may include several
  types of protected species surveys or may target one protected species such as bats. A survey or surveys
  for protected species will be required where: A proposed development affects the roof or roof void of
  a building of traditional construction A bridge, cave, tunnel or cellar Proposals in or adjacent to
  a watercourse, pond, lake or woodland Demolition or conversion of a building (e.g. barn) Buildings already
  known to house bat roosts or barn owls.'
must-include:
- item: Any protected species surveys needed (including additional surveys), submitted before determination;
    they cannot be conditioned
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Ecological Appraisal'. It may include several protected species surveys or target one, such as bats.
review-status: unverified
field-status: {}
