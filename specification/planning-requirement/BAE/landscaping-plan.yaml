reference: landscaping-plan
local-authority: BAE
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor developments.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Creation of new residential curtilages.
      - condition:
          field: landscaping-works
          value: true
          description: Creation of landscaped amenity spaces.
  - condition:
      field: landscaping-works
      value: true
      description: Any other development which involves the creation of landscape features.
  - condition:
      field: tree-removal
      value: true
      description: Development which involves the loss of landscape features.
  - condition:
      field: hedgerows-affected
      value: true
      description: Development which involves the loss of landscape features.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policy ST35
source-text: 'All applications involving any of the following: Major development proposals. Minor developments
  which result in the creation of new residential curtilages and/or landscaped amenity spaces. Minor developments
  which result in the creation of landscaped amenity spaces. Any other development which involves the
  creation or loss of landscape features.'
must-include:
- item: 'Where a detailed scheme is not possible: an overarching landscape strategy, e.g. a landscape
    masterplan showing the location and quantum of landscape elements and green infrastructure'
  level: should
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Landscaping Details'. The list says the content depends on the nature and context of the scheme.
review-status: unverified
field-status: {}
