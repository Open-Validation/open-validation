reference: flood-risk-assessment
local-authority: BAE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zones 2, 3 or 3b (including minor development and changes of use).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood zone 1 with a site area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood zone 1 with a site area of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: Areas with critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Flood zone 1 where the SFRA shows it will be at increased risk of flooding during its
        lifetime.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Proposals which increase the vulnerability classification.
    - site:
        in:
        - surface-water-flood-risk
        - reservoir-flood-risk
        - groundwater-flood-risk
        description: May be subject to sources of flooding other than rivers or sea.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policy ST50; NPPF; national flood risk standing advice
source-text: 'All proposals for development (including minor development and changes of use) within: Flood
  zones 2, 3 or 3b Flood zone 1 with a site area of 1 hectare or more Areas with critical drainage problems
  Flood zone 1 where the strategic flood risk assessment (SFRA) shows it will be at increased risk of
  flooding during its lifetime For proposals which increase the vulnerability classification and may be
  subject to sources of flooding other than rivers or sea'
must-include:
- item: The flood risk sequential and exception tests, where applicable
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Flood Risk Assessment & Sequential & Exceptions Tests (where applicable)'.
review-status: unverified
field-status: {}
