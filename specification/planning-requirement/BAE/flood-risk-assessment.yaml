reference: flood-risk-assessment
local-authority: BAE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in Flood Zone 2, 3 or 3b, or in a critical drainage area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more in Flood Zone 1.
  - discretionary
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s 2018 excerpt dropped the Flood Zone 2/3/3b, critical drainage
  area and SFRA future-risk triggers (the future-risk case is shown as officer discretion). The 1 ha Flood
  Zone 1 case is from the 2018 excerpt.'
review-status: unverified
