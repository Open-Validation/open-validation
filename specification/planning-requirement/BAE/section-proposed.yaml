reference: section-proposed
local-authority: BAE
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground or floor levels, or a sloping site.
  - condition:
      field: height-change
      value: true
      description: A change in height.
  - condition:
      field: adjacent-ground-level-change
      value: true
      description: Sites involving different levels.
  - condition:
      field: basement
      value: true
      description: Lower ground floors or basements, with lightwells and garden levels.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 7 (1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: Proposals involving a change in ground or floor levels, a change in height, on sloping sites,
  or sites involving different levels such as lower ground floors or basements, with lightwells and garden
  levels often best shown in section.
must-include:
- item: At a scale of either 1:50 or 1:100, matching the elevations
  level: must
- item: 'Where applicable: relationships between new buildings or works and retained adjoining land, buildings,
    landscape features and structures, and adjoining ground levels'
  level: must
- item: 'Where ground levels are to be altered: existing and proposed levels'
  level: must
- item: 'Where applicable: eaves and foundation details of new buildings in relation to site boundaries'
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Plans/Drawings. 'Existing
  and proposed section drawings (cross-sections)'. Existing and proposed site levels and finished floor
  levels are a separate item (listed as unmapped).
review-status: unverified
field-status: {}
