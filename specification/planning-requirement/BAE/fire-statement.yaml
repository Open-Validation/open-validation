reference: fire-statement
local-authority: BAE
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: Fire Statements (where applicable)
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 1 (national requirements).
  Shown with the national rule (two or more dwellings or educational accommodation, and 18 m or 7 storeys).
review-status: unverified
field-status: {}
