reference: roof-plan-proposed
local-authority: BAE
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: Creation of new floorspace.
  - condition:
      field: roof-alteration
      value: true
      description: Extensions or alterations that include works to a roof.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 7 (1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: Proposals involving the creation of new buildings/floorspace or extensions/alterations that
  include works to a roof.
must-include:
- item: At a scale of either 1:50 or 1:100
  level: must
- item: The shape of the proposed roof, identifying changes from the existing shape
  level: must
- item: Materials, and the location and design of chimneys, vents, plant, lift gear and other features
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Plans/Drawings. 'Existing
  and proposed roof plans'.
review-status: unverified
field-status: {}
