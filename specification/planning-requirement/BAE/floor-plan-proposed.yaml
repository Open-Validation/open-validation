reference: floor-plan-proposed
local-authority: BAE
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: Creation of new floorspace.
  - condition:
      field: external-alterations
      value: true
      description: Changes to external aspects of the property.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 7 (1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended); Bassetlaw Local Plan 2020-2038 Policy 46
source-text: Proposals involving the creation of new floorspace or changes to external aspects of the
  property.
must-include:
- item: At a scale of either 1:50 or 1:100
  level: must
- item: The relationships between existing/proposed rooms, spaces and other physical features
  level: should
- item: 'Where applicable: the use of each room, and the location and size of all specific storage spaces'
  level: must
- item: 'Where applicable: any buildings, parts of buildings, structures or walls to be demolished'
  level: must
- item: 'Where applicable: floor plans of any proposed garages, bin stores and cycle stores'
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Plans/Drawings. 'Existing
  and proposed floor plans'.
review-status: unverified
field-status: {}
