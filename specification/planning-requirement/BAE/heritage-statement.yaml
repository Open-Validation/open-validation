reference: heritage-statement
local-authority: BAE
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: Development affecting the setting of a Listed Building or any other heritage asset.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policies ST40 and ST41; Historic England Advice Note 12
source-text: Development proposals for listed building consent, demolition in a Conservation Area or development
  affecting the setting of a Listed Building or any other heritage asset.
must-include:
- item: A statement of significance, identifying the main phases of construction and their significance
  level: must
- item: 'For major works or particularly sensitive buildings: a more detailed assessment with phases of
    construction shown on a plan'
  level: must
  required-if: discretionary
- item: How the works might affect the significance of the building, including historic fabric and setting,
    and how the impact is mitigated
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
review-status: unverified
field-status: {}
