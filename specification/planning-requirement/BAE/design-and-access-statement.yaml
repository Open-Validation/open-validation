reference: design-and-access-statement
local-authority: BAE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a designated area (Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floor space created of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 9 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; Bassetlaw Local Plan 2020-2038 Policies ST33 and ST35
source-text: Design and Access Statement (where applicable)
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 1 (national requirements).
  The page says 'where applicable' and cites Article 9 of the DMPO, so the national rule is shown.
review-status: unverified
field-status: {}
