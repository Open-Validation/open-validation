reference: elevation-existing
local-authority: BAE
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: Creation of new floorspace.
  - condition:
      field: building-works
      value: true
      description: New buildings or extensions.
  - condition:
      field: engineering-operations
      value: true
      description: Engineering operations.
  - condition:
      field: external-alterations
      value: true
      description: Changes to external aspects of a building or structure.
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Article 7 (1)(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: Proposals involving the creation of new buildings/ floorspace, extensions, engineering operations
  or any changes to external aspects of a building or structure.
must-include:
- item: At a scale of either 1:50 or 1:100
  level: must
- item: 'Where applicable: external materials and the finish of windows, doors and other openings'
  level: must
- item: 'Where applicable: details such as rainwater goods, vents, meter boxes and charge points'
  level: must
- item: 'Where applicable: true elevations of all external walls of irregular buildings, including internal
    elevations (e.g. courtyards and setbacks)'
  level: must
- item: 'Where applicable: elevations of any proposed garages, bin stores and cycle stores'
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Plans/Drawings. 'Existing
  and proposed elevations'.
review-status: unverified
field-status: {}
