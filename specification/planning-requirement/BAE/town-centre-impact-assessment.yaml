reference: town-centre-impact-assessment
local-authority: BAE
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or leisure development outside a centre.
  - discretionary
source-url: https://www.bassetlaw.gov.uk/planning-and-building-control/planning-applications/development-management/local-validation-requirement/
policy: Bassetlaw Local Plan 2020-2038 Policies ST10 and ST11; NPPF
source-text: Relevant thresholds are set out in Policy ST11 of the Bassetlaw Local Plan 2020-2038
must-include:
- item: Likely effects on the viability and vitality of existing centres and on planned investment
  level: must
- item: An assessment of the need for the development
  level: must
- item: Evidence that the development is of an appropriate scale
  level: must
- item: Evidence that there are no other town centre-based sites
  level: must
- item: Evidence that there are no unacceptable impacts on existing centres
  level: must
- item: Evidence that the location(s) are accessible
  level: must
confidence: medium
notes: From the council's list (web page last updated 27 August 2026), Section 2, Reports/Statements.
  'Retail & Leisure Impact Assessment'. Shown as 'discretionary' because the thresholds are in Local Plan
  Policy ST11, not on the page.
review-status: unverified
field-status: {}
