reference: heritage-statement
local-authority: SRY
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: Work affecting a listed building and/or its setting.
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: new-build
          value: true
          description: New development.
      - condition:
          field: demolition
          value: true
          description: Demolition work.
  - site:
      in:
      - archaeological-priority-area
      description: Work within an area of archaeological potential.
  - site:
      in:
      - scheduled-monument
      description: Work within the area of a scheduled ancient monument.
  - site:
      in:
      - park-and-garden
      description: Work within a historic park or garden.
  - all:
    - site:
        in:
        - locally-listed-building
        - battlefield
        description: Other heritage assets (locally listed buildings or parks, registered battlefields,
          historic landscapes).
    - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: NPPF; Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling
  Joint DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local
  plans; NPPF
source-text: 'Where Heritage Assets or features, and their respective settings, may be affected by the
  proposal. A statement is required if your proposal links to either: • Work affecting a listed building
  and/or its setting. • A new development in a conservation area • Demolition work in a conservation area
  • Work within an area of archaeological potential • Work within the area of a scheduled ancient monument
  • Work within a historic park or garden'
must-include:
- item: The significance of all heritage assets affected, proportionate to the potential harm
  level: must
- item: Justification for any loss of, or damage to, a heritage asset
  level: must
- item: The relevant historic environment record consulted, and assets assessed with appropriate expertise
  level: must
- item: How the proposal affects the listed building/asset and its setting
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 31; Annex 2 (waste) page
  32; Annex 3 (Reg 3) page 21. Same in all three annexes. Listed building consent is decided by the district
  or borough. Other heritage assets the list names ('may be affected') show as discretionary.
review-status: unverified
field-status: {}
