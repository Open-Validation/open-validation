reference: sustainable-drainage-strategy
local-authority: SRY
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: NPPF; Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling
  Joint DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local
  plans; NPPF
source-text: All major developments should incorporate sustainable drainage systems unless there is clear
  evidence that this would be inappropriate. A surface water drainage assessment should be carried out
  to demonstrate that all mineral development makes use of SuDS and will not create an increased risk
  of flooding from surface water to the development site and the surrounding area. The SuDS pro-forma
  should be completed and returned to the CPA as part of the planning application. For minor applications
  a proportionate assessment of the surface water requirements should be undertaken and any opportunity
  for the inclusion of SuDS reviewed. ... A surface water drainage assessment should be carried out to
  demonstrate that all developments make use of SuDS and will not create an increased risk of flooding
  from surface water to the development and the surrounding area. The SuDS pro-forma ... should be completed
  and returned to the CPA as part of the planning application.
must-include:
- item: The Surrey County Council Surface Water Drainage Summary Proforma (SuDS pro-forma), completed
  level: must
- item: How surface water will be controlled as near to its source as possible, following the SuDS hierarchy
  level: must
- item: A drainage strategy with the proposed drainage layout and calculations (and FRA where applicable)
    showing the development does not flood or increase flooding downstream
  level: must
- item: 'For infiltration SuDS: feasibility shown by intrusive geotechnical surveys (infiltration rates,
    groundwater levels, contamination), or a desktop study with an alternative strategy'
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: Infiltration SuDS are proposed.
- item: 'For discharge to a watercourse or sewer: evidence of greenfield rates and adequate downstream
    capacity'
  level: must
- item: 'For minor applications: a proportionate assessment'
  level: should
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 28; Annex 2 (waste) page
  29; Annex 3 (Reg 3) page 18-19. A surface water drainage assessment is asked of all minerals, waste
  and county development; major developments must incorporate SuDS unless clearly inappropriate.
review-status: unverified
field-status: {}
