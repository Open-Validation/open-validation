  date-basis: 'The council''s Local List page (https://www.surreycc.gov.uk/land-planning-and-development/planning/applications-register/process/new-application/local-list,
    ''Reviewed: 28 Oct 2026'', checked 2026-11-06) says ''The current Local List was adopted on 3 January
    2024''; the documents are marked ''v4.0 - January 2024''. No newer list or consultation was found.
    The list is this Introduction and Background plus three annexes: Annex 1 Minerals (https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf),
    Annex 2 Waste (https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359986/Annex-2-Waste-2024.pdf)
    and Annex 3 County Development (Regulation 3) (https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf);
    each requirement file cites the annex its wording comes from. Adopted more than two years ago, so
    outdated, but still the council''s current list. Page numbers in the requirement notes are PDF pages.'
  status: outdated
submission-standards:
- item: Each file below 10MB, in an unlocked format (not secured with a password)
  level: should
- item: Plans and drawings show a north point (except on elevation plans)
  level: must
- item: Plans and drawings show a drawing reference number and date
  level: must
- item: Plans and drawings at an appropriate scale with a scale bar and calibration scale
  level: must
- item: Plans and drawings printed on the correct sized paper according to the scale
  level: must
- item: Plans and drawings show the measurements and dimensions of proposed structures
  level: must
- item: At least one paper copy for applications accompanied by an Environmental Impact Assessment
  level: must
- item: Mineral-related applications are sent direct to the council (email, post on DVD/USB, or hard copy),
    not via the Planning Portal
  level: must
- item: Applications remain invalid until the full fee has been received
  level: must
- item: Videos cannot currently be accepted as part of an application (council's Local List page)
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s Annex 3 link is part of the current list (adopted 3 January 2024, still current per
    a page reviewed Oct 2026), but the extraction is poor. Every Reg 3 requirement was filed under ''Full
    planning'' while ''County own devt (Reg 3)'' shows none. Minerals and waste items are mixed up, many
    requirement-to-trigger pairs are wrong, and many minerals/waste requirements (restoration, aftercare,
    stability, hydrogeology, odour, bio-aerosols, landfill) were missed. The tab is padded with guidance-document
    titles and process text. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: IN LAW, NOT YET IN FORCE: Surrey (Structural Changes) Order 2026 (SI 2026/264)
  abolishes Surrey CC and all 11 districts from 1 Apr 2027; East Surrey and West Surrey councils (shadow
  authorities elected 7 May 2026) take over then. Surrey CC remains the county planning authority (minerals/waste,
  Reg 3) until 31 Mar 2027.'
