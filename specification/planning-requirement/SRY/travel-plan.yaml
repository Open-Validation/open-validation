reference: travel-plan
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - condition:
      field: school-expansion
      value: true
      description: A school development that increases pupil and/or staff numbers, including temporary
        and bulge permissions.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
policy: Relevant borough or district local plans; NPPF
source-text: All school developments resulting in an increase in pupil and/or staff numbers, including
  temporary and bulge permissions.
must-include:
- item: A strategy for managing access to the school, reducing car travel and encouraging public transport,
    cycling, walking, scooters and car sharing
  level: must
- item: Sustainable travel objectives and targets the school commits to, with measures to achieve them
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 3 (Reg 3) page 15. Special Educational
  Needs schools usually do not need one, but the Planning Statement must give pupil and staff numbers
  and expected movements.
review-status: unverified
field-status: {}
