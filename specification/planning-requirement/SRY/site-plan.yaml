reference: site-plan
local-authority: SRY
required-if:
  any:
  - application-type:
      in:
      - s73
      - pa-demo-building
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
        - reg-3
    - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications (where relevant). ... Block plan of the site (e.g. 1:100 or 1:200) showing
  any site boundaries.
must-include:
- item: A north point, a drawing reference number and date
  level: must
- item: At an appropriate scale with a scale bar and calibration scale
  level: must
- item: The proposed development (or demolition) in relation to the site boundaries and other existing
    buildings on site
  level: must
- item: Measurements and dimensions of the proposed (or, for demolition, existing) structures
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 6; Introduction
  and Background page 12. For full applications a block plan is one of the 'other plans' required 'where
  relevant', so it shows as discretionary. A site plan is listed as required for s73 and prior notification
  of demolition applications.
review-status: unverified
field-status: {}
