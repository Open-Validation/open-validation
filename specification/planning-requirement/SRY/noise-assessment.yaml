reference: noise-assessment
local-authority: SRY
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Likely to affect sensitive land uses such as a dwelling, school or care home.
      - condition:
          field: plant-equipment
          value: true
          description: Mobile site plant, processing plant or machinery such as a crusher, screener, conveyor
            or trommel.
      - condition:
          field: earthworks
          value: true
          description: Engineering activities such as earth moving, bund creation or soil stripping.
      - site:
          in:
          - site-of-special-scientific-interest
          - special-area-of-conservation
          - special-protection-area
          - local-wildlife-site
          description: Likely to affect a designated Nature Conservation or Geological site.
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: Within the AONB and Area of Great Landscape Value.
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Close to an existing major noise source (motorway, trunk road, airport, railway,
            minerals or waste operations).
      - condition:
          field: noise-generating-use
          value: true
          description: Likely to generate significant noise levels, e.g. outdoor sports activities.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Noise Guidelines (January 2020); Surrey Minerals Plan Core Strategy DPD (2011), Primary
  Aggregates DPD, Aggregates Recycling Joint DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste);
  relevant borough or district local plans; NPPF
source-text: 'Where the development: • Is likely to affect sensitive land uses such as dwelling, school,
  or care- home. • Involves the use of mobile site plant, processing plant or machinery such as a crusher,
  screener, conveyor, or trommel. • Involves engineering activities such as earth moving, bund creation
  or soil stripping. • Is likely to affect a designated (international, national, or local) Nature Conservation
  or Geological site. • Is to be located within the AONB and Area of Great Landscape Value. ... Proposed
  development close to existing major noise source e.g. motorways or trunk road, airports and possibly
  railway, industrial activities such as minerals or waste operations. ... When the development itself
  is likely to generate significant noise levels e.g. outdoors sports activities.'
must-include:
- item: The existing noise climate (normally by measurement) and the impact of the development on noise
    sensitive development, by prediction and measurement
  level: must
- item: Prepared by a competent person
  level: must
- item: 'Where guidance criteria may be exceeded: mitigation so that they are not, with impacts assessed
    after mitigation'
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 33-34; Annex 2 (waste)
  page 34; Annex 3 (Reg 3) page 25. Area of Great Landscape Value has no dataset, so it is described with
  the AONB.
review-status: unverified
field-status: {}
