reference: noise-assessment
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Development close to an existing major noise source (motorway, trunk road, airport,
          railway, minerals or waste operations).
    - condition:
        field: noise-generating-use
        value: true
        description: The development itself is likely to generate significant noise levels (e.g. outdoor
          sports).
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
source-text: '9.3 Noise Assessment Required for the following applications: 9.3.1 Proposed development
  close to existing major noise source e.g. motorways or trunk road, airports and possibly railway, industrial
  activities such as minerals or waste operations. 9.3.2 When the development itself is likely to generate
  significant noise levels e.g. outdoors sports activities.'
confidence: medium
notes: 'Audit (wrong_app_type): an Annex 3 (Reg 3) item.'
review-status: unverified
field-status: {}
