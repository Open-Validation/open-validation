reference: protected-landscape-assessment
local-authority: SRY
required-if:
  all:
  - site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within an Area of Outstanding Natural Beauty.
  - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: NPPF (major development in AONBs); Surrey Hills and High Weald AONB Management Plans
source-text: 'For major development within an Area of Outstanding Natural Beauty (AONB). Note: There is
  no definition of major for development in the AONB – it is a matter for the decision maker to determine
  whether a proposed development in the AONB context is major development.'
must-include:
- item: The need for the development, including national considerations, and the impact of permitting
    or refusing it on the local economy
  level: must
- item: The cost of, and scope for, developing outside the designated area or meeting the need in some
    other way
  level: must
- item: Any detrimental effect on the environment, the landscape and recreational opportunities, and the
    extent to which that can be moderated
  level: must
- item: The impact of the proposal on the setting of the AONB
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 13; Annex 2 (waste) page
  14; Annex 3 (Reg 3) page 9. The list's 'Area of Outstanding Natural Beauty Exceptional Circumstances
  Test'. Whether development in the AONB is 'major' is for the decision maker, so the rule is discretionary
  inside the AONB.
review-status: unverified
field-status: {}
