reference: sustainability-statement
local-authority: SRY
required-if:
  any:
  - all:
    - application-type:
        in:
        - waste-dev
    - ref: major-development
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - ref: major-development
      - condition:
          field: school-expansion
          value: true
          description: A large school expansion.
      - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359986/Annex-2-Waste-2024.pdf
policy: Surrey Waste Local Plan (2020); relevant borough or district local plans
source-text: Major Developments (Over 1000 square metres) [As defined in The Town and Country Planning
  (Development Management Procedure) (England) Order 2015 however there isn’t a definition of major for
  use in the AONB – it is a matter for the decision maker to determine whether a proposed development
  in the AONB context is major development.] ... Large school expansions, major developments (over 1000sqm)
  or where Borough or District stipulate specific thresholds.
must-include:
- item: How sustainable forms of design and construction, and any renewable energy technologies, are incorporated
  level: must
- item: 'How waste produced during all stages of development will be minimised and managed: the type of
    waste, how it will be managed, and which contractors will be used'
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 2 (waste) page 39; Annex 3 (Reg 3) page
  28. The list's 'Sustainable Design and Construction Statement'. 'Large' school expansions and borough
  or district thresholds have no figure here, so those parts show as discretionary.
review-status: unverified
field-status: {}
