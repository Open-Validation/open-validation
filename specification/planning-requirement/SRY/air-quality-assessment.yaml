reference: air-quality-assessment
local-authority: SRY
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - site:
          in:
          - air-quality-management-area
          description: Within or adjacent to an Air Quality Management Area.
      - all:
        - condition:
            field: traffic-movements-daily
            operator: '>='
            value: 1
            description: Likely to generate significant vehicle movements.
        - discretionary
      - condition:
          field: direct-air-emissions
          value: true
          description: The construction of a new chimney stack.
  - all:
    - application-type:
        in:
        - waste-dev
    - any:
      - condition:
          field: direct-air-emissions
          value: true
          description: Energy from waste or combustion (operational phase).
      - condition:
          field: biomass-or-chp
          value: true
          description: Biomass boilers, CHP schemes and centralised boilers above the list's thresholds.
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - ref: major-development
      - discretionary
      - all:
        - condition:
            field: sensitive-end-use
            value: true
            description: Development sensitive to poor air quality.
        - site:
            in:
            - air-quality-management-area
            description: In or adjacent to an AQMA.
      - condition:
          field: direct-air-emissions
          value: true
          description: The construction of a new chimney stack.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: 'Where development as defined by the Environmental Protection UK (EPUK) – Institute of Air
  Quality Management (IAQM) guidance (or subsequent updates): • Is to be located within or adjacent to
  an Air Quality Management Area (AQMA) or; • Is likely to generate significant vehicle movements; or
  • Would involve the construction of a new chimney stack. ... Required for the operational phase where
  a proposal includes: • Energy from waste. • Combustion. • Bio-mass boilers. • Combined heat and power
  (CHP) schemes incorporating a biomass steam boiler ≥50 kWth. • Other CHPs and centralised boilers≥450kWth
  gas boiler or 30kw CHP. ... Major Developments (over 1000sqm) • Generates significant levels of pollution
  • Involves development sensitive to poor air quality that is proposed in or adjacent to an AQMA • If
  proposal is for a development which would generate odours • Where the proposal would involve the construction
  of a new chimney stack'
must-include:
- item: 'Minerals and waste: vehicle emission impacts on local sensitive receptors (NO2, PM2.5 and PM10)
    for construction and operation, with mitigation and/or compensation, following EPUK-IAQM and Defra
    TG(16) guidance'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Waste (other pollutants): impact on surrounding sensitive receptors with the controls and mitigation
    to avoid adverse impacts'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Reg 3: existing air quality and predicted air quality as a result of the development'
  level: must
  required-if:
    application-type:
      in:
      - reg-3
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 6; Annex 2 (waste) page
  6, 9; Annex 3 (Reg 3) page 24. 'Significant vehicle movements', 'significant levels of pollution' and
  developments that 'would generate odours' (Reg 3) have no threshold in the trigger, so they show as
  discretionary (the guidance threshold of 25 HDV or 100 LDV AADT within/adjacent to an AQMA, 100/500
  elsewhere, is given in the contents). Reg 3 major is 'Major Developments (over 1000sqm)'. Construction
  and operational dust, odour and bio-aerosol assessments have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
