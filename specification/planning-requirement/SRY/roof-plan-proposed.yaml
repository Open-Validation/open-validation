reference: roof-plan-proposed
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: roof-alteration
      value: true
      description: A roof would be created or altered.
  - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications (where relevant). ... Roof plans at a scale of 1:50 or 1:100.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Measurements and dimensions of proposed structures
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 6. The list's
  'Other plans' are required for 'All applications (where relevant)' and 'could include' these drawings,
  so they show as discretionary. All plans/drawings show a north point (except elevations), a drawing
  reference and date, and a scale bar.
review-status: unverified
field-status: {}
