reference: environmental-statement
local-authority: SRY
required-if:
  condition:
    field: eia-development
    value: true
    description: 'EIA development: Schedule 1, or Schedule 2 screened as EIA development.'
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'An Environmental Impact Assessment will be required for the following development proposals:
  • For development of a type listed in Schedule 1 of the Town & Country Planning (EIA) Regulations 2017
  (as amended) (please refer to Statutory Instrument 2017 No.571 The Town and Country Planning (Environmental
  Impact Assessment) Regulations 2017) (the EIA Regulations). • For development of a type listed in Schedule
  2 of the EIA Regulations for which the County Planning Authority has adopted a Screening Opinion or
  the Secretary of State has issued a Screening Direction stating that the proposal is ‘EIA development’
  (i.e. is likely to have significant effects on the environment).'
must-include:
- item: An Environmental Statement and a Non-Technical Summary
  level: must
- item: All the information in Regulation 18(3) of the EIA Regulations, and as much of Schedule 4 as can
    reasonably be provided
  level: must
- item: A short summary and conclusion at the end of each section or chapter, incorporated into the Non-Technical
    Summary
  level: must
- item: Where to obtain a copy of the ES and the charge; where it can be viewed and inspected locally
  level: must
- item: A paper copy of the planning submission and ES
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 9. Not needed
  where a screening opinion or direction says a Schedule 2 proposal is not EIA development.
review-status: unverified
field-status: {}
