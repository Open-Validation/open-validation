reference: landscaping-plan
local-authority: SRY
required-if:
  any:
  - condition:
      field: landscaping-works
      value: true
      description: Landscape mitigation, compensation or restoration is proposed.
  - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: All applications where landscape mitigation, compensation, or restoration is required.
must-include:
- item: How the proposal reflects the landscape assessment and the existing features and landscape character
  level: must
- item: Written and schematic plans with details of hard and soft landscaping, existing vegetation to
    be retained, and future maintenance and long-term management
  level: must
- item: 'A landscape management plan: management compartments, objectives, prescriptions, annual operations,
    timing, and responsibilities for implementation, monitoring and review'
  level: must
- item: 'Where new planting is proposed: a schedule of plants (species, stock size, spacing or densities),
    cultivation notes and timing of planting'
  level: must
  required-if:
    condition:
      field: landscaping-works
      value: true
      description: New planting is proposed.
- item: 'Where new trees are proposed: post-planting maintenance arrangements, including regular scheduled
    watering'
  level: must
- item: 'Where replacement trees are proposed: a schedule of sizes and numbers/densities'
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 14-16; Annex 2 (waste)
  page 15-17; Annex 3 (Reg 3) page 10-12. The list's 'Landscape Scheme' (same in all three annexes). Whether
  mitigation, compensation or restoration 'is required' is a judgement, so it also shows as discretionary.
  A Landscape and Ecology Management Plan may be needed for larger nature conservation restoration schemes.
  The landscape assessment (LVIA/LVA) has no matching id (see the unmapped list).
review-status: unverified
field-status: {}
