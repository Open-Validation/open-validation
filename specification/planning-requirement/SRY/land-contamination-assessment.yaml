reference: land-contamination-assessment
local-authority: SRY
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination of soil, groundwater or hazardous soil gas known or suspected on or near
        the site (from present or previous uses), or land designated contaminated by the borough/district.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Part 2A, Environmental Protection Act 1990; Surrey Minerals Plan Core Strategy DPD (2011), Primary
  Aggregates DPD, Aggregates Recycling Joint DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste);
  relevant borough or district local plans; NPPF
source-text: When contamination of soil, groundwater, or from hazardous soil gas is known or suspected,
  on or in the vicinity of the site, based on present or previous uses of the site or its surroundings.
  ... Where the land has been designated ‘contaminated’ by the Borough/District Council. ... Also when
  there is a potential risk from naturally occurring hazards in the ground such as arsenic, radon and
  methane/carbon dioxide. ... Where previous uses of the site, or adjacent land, could have caused contamination
  (e.g. mineral extraction, waste disposal, landfilling, industrial processes, petrol stations, institutional/
  residential with fuel storage, agricultural chemical storage, vehicle parking/servicing, etc.).
must-include:
- item: A proportionate but sufficient risk assessment of the existence, nature and extent of contamination
    and the risks to all identified receptors
  level: must
- item: Potential sources, pathways and receptors (pollutant linkages) identified and evaluated
  level: must
- item: As a minimum a desktop study, site walkover and initial Tier 1 risk assessment (Phase 1) by a
    competent and suitably qualified specialist
  level: must
- item: Further site investigation (Phase 2), a remediation or mitigation strategy and a verification
    plan, unless Phase 1 shows with complete confidence that the risk can be reduced to an acceptable
    level
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 24; Annex 2 (waste) page
  25; Annex 3 (Reg 3) page 32. A 'potential risk from naturally occurring hazards in the ground' (minerals
  and waste) is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
