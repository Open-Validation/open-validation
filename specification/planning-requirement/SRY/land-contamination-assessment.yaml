reference: land-contamination-assessment
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - mineral-app
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on or near the site, from previous uses or natural
        hazards.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
source-text: 'Contaminated Land Assessment Required for the following applications: 8.1.1 When contamination
  of soil, groundwater, or from hazardous soil gas is known or suspected, on or in the vicinity of the
  site, based on present or previous uses of the site or its surroundings. 8.1.2 Where the land has been
  designated ‘contaminated’ by the Borough/District Council.'
