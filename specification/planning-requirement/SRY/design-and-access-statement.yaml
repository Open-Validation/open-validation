reference: design-and-access-statement
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated historic area (Conservation Area or World Heritage Site).
      - any:
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: An extension creating more than 100 square metres, or 100 square metres or more
              of additional floorspace.
        - condition:
            field: new-build
            value: true
            description: The erection of a building or buildings with a cubic content over 100 cubic metres.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
policy: Article 2, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement (DAS) will be required for the following development proposals:
  • All major development applications. Major development, as referred to in this document, is defined
  under Article 2 of the Town and County Planning (Development Management Procedure) (England) Order ...
  • In designated historic areas [Conservation Areas and World Heritage Sites] where: • the extension
  of an existing building where the floorspace created exceeds 100 square metres. • the erection of a
  building or buildings where the cubic content of the development exceeds 100 cubic metres. • Applications
  for development in a designated area where additional floor- space of 100 square metres or more proposed
  in relation to buildings. ... However, the following applications are exempt from this requirement:
  • applications relating to engineering or mining operations, • applications relating to a material change
  in use of the land or buildings, • applications relating to waste development.'
must-include:
- item: The design principles and concepts applied, and how access to the development has been dealt with,
    proportionate to the complexity of the application
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 8. Engineering
  or mining operations, a material change of use and waste development are exempt, so the rule is limited
  to the council's own (Reg 3) development. The 100 cubic metre test has no MHCLG field, so it shows as
  a new building.
review-status: unverified
field-status: {}
