reference: arboriculturist-report
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees, woodland or hedgerows on or adjacent to the site that could be affected by the
        development.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
source-text: '4.5 Trees and Arboricultural Implications Required for the following applications: 4.5.1
  All development proposals where there are trees, woodland or hedgerows (protected by a tree preservation
  order or not) either on, or adjacent to, the application site and which could be influenced or be affected
  by the development.'
must-include:
- item: Tree survey in accordance with BS 5837:2012 'Trees in relation to demolition, design and development'
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): an Annex 3 development requirement, not a works-to-trees item (the county
  doesn''t determine works-to-trees applications). From the audit: Annex 3 also asks for a Tree Constraints
  Plan (4.6) and Tree Protection Plan (4.7).'
review-status: unverified
field-status: {}
