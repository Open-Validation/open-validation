reference: arboriculturist-report
local-authority: SRY
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or woodland on or adjacent to the site that could be affected.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows on or adjacent to the site that could be affected.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: BS 5837:2012; Hedgerows Regulations 1997 (where relevant); Surrey Minerals Plan Core Strategy
  DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint DPD (2013) (minerals); Surrey Waste Local
  Plan (2020) (waste); relevant borough or district local plans; NPPF
source-text: All development proposals where there are trees, woodland, or hedgerows (protected by a tree
  preservation order or not) either on, or adjacent to, the application site and which could be influenced
  or be affected by the development.
must-include:
- item: An Arboricultural Impact Assessment of direct and indirect effects, with mitigation and compensatory
    measures where necessary
  level: must
- item: A tree survey of trees on or adjacent to the site, by a suitably qualified arboriculturist to
    BS 5837:2012, each tree categorised
  level: should
- item: Effects of any tree loss and of damaging activities near retained trees, including access, working
    space and storage of materials
  level: must
- item: 'Where replacement trees are proposed: a schedule of sizes and numbers/densities'
  level: should
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 17; Annex 2 (waste) page
  18; Annex 3 (Reg 3) page 12. The list's 'Trees and Arboricultural Implications' (same in all three annexes).
  The Tree Constraints Plan and Tree Protection Plan have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
