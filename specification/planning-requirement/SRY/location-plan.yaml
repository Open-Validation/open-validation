reference: location-plan
local-authority: SRY
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
    - s73
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: At an appropriate scale (typically 1:1250 or 1:2500), scaled to fit A3 or A4 paper
  level: must
- item: Based on an up to date metric or OS map
  level: must
- item: At least two named roads, surrounding buildings and features
  level: must
- item: A north point, a drawing reference number and date
  level: must
- item: All land needed to carry out the development, including access, edged red
  level: must
- item: Any other land owned by the applicant close to or adjoining the site edged blue
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 6. The list
  covers every application the county council decides (minerals, waste and the council's own development,
  including s73 applications for them), so 'all applications' is shown as those types. Also required for
  s73 applications.
review-status: unverified
field-status: {}
