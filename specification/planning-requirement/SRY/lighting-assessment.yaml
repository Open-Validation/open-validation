reference: lighting-assessment
local-authority: SRY
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: external-lighting
        value: true
        description: Any external lighting, including temporary, construction and security lighting.
  - all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: external-lighting
        value: true
        description: External lighting, including temporary construction and security lighting.
    - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: All minerals developments involving any external lighting, including temporary, construction
  and security lighting. ... All waste developments involving any external lighting, including temporary,
  construction and security lighting. ... Developments involving significant external lighting, including
  temporary construction and security lighting.
must-include:
- item: The number, type, location and height of lighting, including on columns and/or buildings
  level: must
- item: The intensity (Lux levels) and spill patterns shown on a plan
  level: must
- item: The proposed hours of use
  level: must
- item: Potential impacts on ecological features, proposed mitigation, and measures for unforeseen impacts
    and monitoring
  level: must
- item: 'Reg 3: lighting levels no more than the minimum needed, with impacts from all relevant near and
    far viewpoints'
  level: must
  required-if:
    application-type:
      in:
      - reg-3
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 33; Annex 2 (waste) page
  34; Annex 3 (Reg 3) page 24-25. For Reg 3 only 'significant' external lighting needs one, so that part
  shows as discretionary.
review-status: unverified
field-status: {}
