reference: flood-risk-assessment
local-authority: SRY
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 and/or 3.
  - all:
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: In Flood Zone 1 with a site area greater than 1 hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: In Flood Zone 1 with a site area greater than 1 hectare.
    - discretionary
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 with critical drainage problems, or where a Surface Water Management Plan
        or equivalent shows the site may be subject to drainage problems.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Development or a change of use to a more vulnerable class.
    - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: NPPF; Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling
  Joint DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local
  plans; NPPF
source-text: All development proposals located within Flood Zones 2 and/or 3. ... Where the development
  is to be located within Flood Zone 1 and the site area is greater than 1 hectare in size and where the
  Environment Agency or Local Drainage Engineer has indicated that there may be a land drainage problem.
  ... All proposals for new development (including minor development and changes of use) in an area within
  Flood Zone 1 which has critical drainage problems and/or where a Surface Water Management Plan or equivalent
  document is in place which indicates that the site may be subject to drainage problems; and/or where
  the proposed development or change of use to a more vulnerable class may be subject to other sources
  of flooding.
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
- item: Whether it will increase flood risk elsewhere
  level: must
- item: How flood risks will be managed now and over the development's lifetime, with consideration of
    climate change
  level: must
- item: Evidence for the Sequential Test for all sources of flooding, if necessary
  level: must
- item: Mitigation measures and emergency evacuation procedures
  level: must
- item: Whether the development will be safe and pass the Exception Test, if applicable
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 27; Annex 2 (waste) page
  28; Annex 3 (Reg 3) page 18. Same in all three annexes. For Flood Zone 1 sites over 1 hectare the Environment
  Agency or drainage engineer must have indicated a possible land drainage problem, and 'other sources
  of flooding' is a judgement, so those parts show as discretionary.
review-status: unverified
field-status: {}
