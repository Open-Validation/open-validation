reference: bng-metric
local-authority: SRY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990; Environment Act 2021
source-text: All applications except those exempt from BNG requirements.
must-include:
- item: Pre-development biodiversity value of the on-site habitat on the date of application (or an earlier
    date), with the completed metric calculation tool and the publication date and version of the metric
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
- item: Post-development metric calculations using the Biodiversity Metric (in Excel format)
  level: must
- item: 'A technical BNG report: methodology including habitat condition results, justification of the
    approach (mitigation hierarchy), caveats and limitations, and how a minimum 10% gain is met on site,
    off site or with statutory credits'
  level: must
- item: A UK Hab baseline and post-intervention figure, with habitats referenced to the BNG report
  level: must
- item: 'For off-site BNG: the off-site land on a site plan, a baseline ecological assessment of it and
    the proposed enhancements, with the metric''s off-site tab completed'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: BNG is to be provided off site.
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 10; Annex 1
  (minerals) page 11; Annex 2 (waste) page 12; Annex 3 (Reg 3) page 7. The same wording is in all three
  annexes. The rule follows the law (exempt applications are exempt). The statements on whether the condition
  applies, degradation and irreplaceable habitat have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
