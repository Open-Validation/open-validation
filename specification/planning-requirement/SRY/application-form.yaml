reference: application-form
local-authority: SRY
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
    - s73
    - approval-condition
    - non-material-amendment
    - pa-demo-building
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications, including outline planning applications.
must-include:
- item: A fully completed and original application form for the type of development proposed
  level: must
- item: The ownership certificate (A, B, C or D) and agricultural holdings declaration; for mineral applications
    a separate certificate
  level: must
  source-text: All applications – the agricultural holding declaration is required whether or not the
    application site forms part of or includes an agricultural holding.
- item: Notice to owners of the site completed and served under Article 14 of the DMPO
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Introduction and Background page 6; Introduction
  and Background page 7. The list covers every application the county council decides (minerals, waste
  and the council's own development, including s73 applications for them), so 'all applications' is shown
  as those types. Also required for details pursuant, s73, prior notification of demolition and non-material
  amendment applications. The fee is a national requirement too (see the unmapped list).
review-status: unverified
