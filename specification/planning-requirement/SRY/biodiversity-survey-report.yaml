reference: biodiversity-survey-report
local-authority: SRY
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - local-wildlife-site
      description: Likely to affect a designated site.
  - site:
      in:
      - sssi-impact-risk-zone
      description: In a Site of Special Scientific Interest (SSSI) Impact Risk Zone.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.4
        description: 0.4 hectare or larger.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.4
        description: 0.4 hectare or larger.
  - site:
      in:
      - priority-habitat
      description: Within 100m of, or likely to affect, a Priority Habitat.
  - condition:
      field: protected-species
      value: true
      description: Likely to affect a Priority Species, or needs a protected species survey (including
        demolition or works in the roof space of buildings which may be used by bats).
  - all:
    - condition:
        field: loss-of-habitat-features
        value: true
        description: Affects natural or semi-natural habitats.
    - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Conservation of Habitats and Species Regulations 2017 (as amended); Wildlife and Countryside Act
  1981; Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: 'Where the development is: •likely to affect a designated site; •in a Site of Special Scientific
  Interest (SSSI) Impact Risk Zone; •0.4 hectare or larger; •within 100m of, or is likely to, affect a
  Priority Habitat or Species (See section 4.3 for specific requirements relating to Great Crested Newts).
  ... Where the development would: • Affect natural or semi- natural habitats. • Require a protected species
  survey (See section 4.3 for specific requirements relating to Great Crested Newts). • For the demolition
  or works in the roof space of buildings which may be used by bats'
must-include:
- item: 'Preliminary Ecological Appraisal: up-to-date information on habitats on the site and links to
    other habitats, species present (or likely), likely impacts, mitigation and enhancement opportunities'
  level: must
- item: Results of a search from the Surrey Biodiversity Information Centre, for all but the most minor
    applications
  level: must
- item: Results of any further surveys the appraisal recommends
  level: must
- item: 'Where surveys are needed: an Ecological Impact Assessment following CIEEM guidelines, establishing
    presence/absence, population levels, likely impacts and mitigation and compensation'
  level: must
- item: Mitigation, compensation and net gain measures set out in a Biodiversity Mitigation Plan that
    can be covered by condition
  level: must
- item: Surveys, data collection and analysis following BS 42020
  level: should
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 9-10; Annex 2 (waste)
  page 10-11; Annex 3 (Reg 3) page 5. The list's Preliminary Ecological Assessment and Ecological Impact
  Assessment (same wording in all three annexes). 'Affect natural or semi-natural habitats' is a judgement,
  so that part shows as discretionary. Great Crested Newt assessments, the Reg 3 Special Protection Area
  (HRA) information and ancient woodland impact assessments have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
