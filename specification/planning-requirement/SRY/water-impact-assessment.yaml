reference: water-impact-assessment
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - any:
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: Dewatering or abstraction.
    - condition:
        field: landfill-development
        value: true
        description: Proposals to infill land.
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Significant ground works.
      - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: 'Applications that: • Involve significant ground works, dewatering, abstraction; or • Propose
  to infill land.'
must-include:
- item: Existing groundwater levels, impacts on them, and mitigation and management of the impacts
  level: must
- item: 'In a groundwater source protection zone: a risk assessment of impacts on water quality and resources'
  level: must
  required-if:
    site:
      in:
      - source-protection-zone
      description: In a groundwater source protection zone.
- item: 'For dewatering or abstraction: extent and volumes, geology and borehole data, the natural water
    table, impact on any wetland SSSI, effects on third parties and water supplies with mitigation, methods
    of dewatering and disposal, pollution control, drainage and monitoring'
  level: must
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering or abstraction.
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 29; Annex 2 (waste) page
  30. The list's 'Hydrogeological/hydrological report'. 'Significant ground works' is a judgement, so
  that part shows as discretionary. At least 12 months of monitoring before submission may be necessary.
review-status: unverified
field-status: {}
