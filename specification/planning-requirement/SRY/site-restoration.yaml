reference: site-restoration
local-authority: SRY
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - waste-dev
    - any:
      - condition:
          field: landfill-development
          value: true
          description: Landfill.
      - condition:
          field: temporary-development
          value: true
          description: A temporary waste proposal.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013); Surrey Minerals Plan Minerals Site Restoration SPD; Surrey Waste Local Plan (2020)
source-text: All mineral proposals except for those applications seeking to vary/remove a condition which
  has no impact on the final restoration/aftercare of the site. ... All landfill and temporary waste proposals
  except for those applications seeking to vary/remove a condition which has no impact on the final restoration/aftercare
  of the site.
must-include:
- item: An overall restoration plan identifying the proposed afteruse
  level: must
- item: Voidspace, total volume and type of fill material (if required), filling rates and expected settlement
  level: must
- item: Phasing of restoration, with phasing plans if progressive
  level: must
- item: An assessment of the agricultural land classification, where applicable
  level: must
- item: 'A soil resource and management plan: soil resources, stripping, handling, storage (bund positions,
    heights, quantities), safeguarding and restored depths'
  level: must
- item: Pre and post settlement contours of the restored area and its relationship to surrounding land,
    where applicable
  level: must
- item: Drainage of the restored area, with a site drainage plan and erosion control measures
  level: must
- item: Proposals for removing buildings, plant, equipment, roads and hardstandings
  level: must
- item: Landscape strategy and planting details
  level: must
- item: How the restoration plan delivers Biodiversity Net Gain
  level: must
- item: 'Minerals: enhancement measures on other land in the applicant''s control and interim measures
    while awaiting final restoration'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
  source-text: All mineral proposals except for those applications seeking to vary/remove a condition
    which has no impact on the final restoration/aftercare of the site.
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 19-20; Annex 2 (waste)
  page 20. The list's 'Restoration' (with 'Enhancement'). Not needed for applications to vary or remove
  a condition with no impact on final restoration or aftercare. The aftercare strategy has no matching
  id (see the unmapped list).
review-status: unverified
field-status: {}
