reference: construction-management-plan
local-authority: SRY
required-if:
  any:
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
  - all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: operational-development
        value: true
        description: Physical development other than very minor proposals such as canopies, fences or
          a change of use.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: Where it is proposed to bring large plant (which may or may not be classified as abnormal
  loads) onto the site or where the access (by virtue of existing land used or designation) is considered
  sensitive. ... All developments except very minor proposals such as canopies, fences, change of use.
  If not being provided, your Planning Statement should make simple case as to why one is not being submitted
  to show that issues have actively been considered.
must-include:
- item: Parking for vehicles of site personnel, operatives and visitors
  level: must
- item: Loading and unloading, and storage, of plant and materials
  level: must
- item: Programme of works, including traffic management, vehicle routing, hours of operation and design
    of delivery areas
  level: must
- item: Specifications for vehicle turning so that vehicles leave the site in forward gear
  level: must
- item: Measures for the suppression and control of dust during construction
  level: must
- item: 'Minerals and waste: boundary hoarding behind any visibility zones'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 21; Annex 2 (waste) page
  22; Annex 3 (Reg 3) page 15. The list's 'Construction Traffic Management Plan'. For minerals and waste
  it turns on large plant or a sensitive access (a judgement), so it shows as discretionary; it is not
  needed where there is no physical development or traffic movements. For Reg 3, if one is not provided,
  the Planning Statement should explain why.
review-status: unverified
field-status: {}
