reference: archaeological-assessment
local-authority: SRY
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - archaeological-priority-area
      description: A Scheduled Monument, County Site of Archaeological Importance or Area of High Archaeological
        Potential.
  - all:
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.4
          description: An application area exceeding 0.4 hectares where undocumented remains might survive.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.4
          description: An application area exceeding 0.4 hectares where undocumented remains might survive.
    - discretionary
  - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: NPPF; Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling
  Joint DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local
  plans; NPPF
source-text: 'An archaeological assessment is required when a Heritage Statement or pre- application discussion
  indicates that a Heritage Asset with an Archaeological Interest is likely to be present on site and/or
  affected by a development proposal. ... Note: An asset of Archaeological Interest is considered to be
  a Scheduled Monument, a County Site of Archaeological Importance, an Area of High Archaeological Potential,
  or development application area exceeding 0.4 hectares in size, where it is reasonably considered that
  previously undocumented archaeological remains might survive.'
must-include:
- item: The nature and significance of the archaeological resources of the site compared with the development,
    and the likely implications for the survival and management of the resource
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 32; Annex 2 (waste) page
  33; Annex 3 (Reg 3) page 22. It turns on whether a heritage statement or pre-application discussion
  shows an asset with archaeological interest is likely, so it is partly discretionary.
review-status: unverified
field-status: {}
