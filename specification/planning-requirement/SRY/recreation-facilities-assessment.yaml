reference: recreation-facilities-assessment
local-authority: SRY
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: The development would result in the loss of open space.
  - condition:
      field: affects-public-right-of-way
      value: true
      description: The development has implications for Public Rights of Way.
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: Any development proposals that would result in the loss of open space or have implications
  for Public Rights of Way.
must-include:
- item: Any open space or Public Rights of Way lost or directly or indirectly affected (including outside
    the site boundary), with measures to replace or compensate, and opportunities to improve facilities
    for walkers, cyclists and horse riders
  level: must
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 34; Annex 2 (waste) page
  35; Annex 3 (Reg 3) page 25. The list's 'Open Space Assessment including Rights of Way' (same in all
  three annexes).
review-status: unverified
field-status: {}
