reference: transport-assessment
local-authority: SRY
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
source-text: '5.3 Transport Statement Required for the following applications: 5.3.1 Small scale developments
  and minor school expansions (not required for temporary / bulge applications unless advised otherwise
  by the County Planning Authority).'
must-include:
- item: For a Transport Assessment, an illustration of accessibility to the site by all modes of transport
    and the likely modal split of journeys
  level: must
  source-text: 5.4.2 As for Transport Statement plus an illustration of accessibility to the site by all
    modes of transport, and the likely modal split of journeys to and from the site.
- item: Justification of the level of parking provision proposed
  level: should
- item: Proposals to reduce the transportation impact of the development, and adequate mitigation
  level: should
- item: Where traffic is to be restricted to certain routes, details of how this will be achieved with
    certainty
  level: must
  source-text: 5.4.4 Where traffic is intended to be restricted to certain routes, the proposal must include
    details of how this is to be accomplished with certainty.
confidence: medium
