reference: transport-assessment
local-authority: SRY
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - ref: major-development
      - condition:
          field: school-expansion
          value: true
          description: A new school or a school expansion (minor expansions need a Transport Statement;
            temporary/bulge only if advised).
      - discretionary
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: 'The scale of development is anything too small to require a Transport Assessment. ... When
  a development proposal has significant transport implications [significant normally means a 10% increase
  in HGV movement but should be considered on a case-by-case basis]. A Transport Assessment is likely
  to be required for development: • Generating 30 or more two-way vehicle movements per hour. • 100 plus
  two-way vehicle movements per day. • Any development proposed in a location within or adjacent to an
  AQMA. ... Small scale developments and minor school expansions (not required for temporary / bulge applications
  unless advised otherwise by the County Planning Authority). ... For new schools, large school expansions
  and major developments.'
must-include:
- item: Existing or proposed access arrangements, with the access width on a plan showing visibility splays;
    for an altered access, the proposed width and method of construction
  level: must
- item: 'Minerals and waste: the mode of transport; average and maximum daily vehicle movements by type
    (HGV, LGV, car) and HGV capacity; spread over the working day with peaks; routes; measures against
    mud on the highway; current traffic generation'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Reg 3 schools: existing modal split and how trips spread over drop-off and pick-up periods; parking
    for staff and visitors, loading/unloading and manoeuvring'
  level: must
  required-if:
    application-type:
      in:
      - reg-3
- item: Details where a public right of way is affected
  level: must
  required-if:
    condition:
      field: affects-public-right-of-way
      value: true
      description: A public right of way is affected.
- item: 'Transport Assessment: accessibility by all modes, likely modal split, impact and any works needed,
    measures to improve access by public transport, walking and cycling, and proposals to reduce transport
    impact with adequate mitigation'
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 21-23; Annex 2 (waste)
  page 22-24; Annex 3 (Reg 3) page 16-17. MHCLG's id covers both the Transport Statement and the Transport
  Assessment. For minerals and waste, development too small for an Assessment needs a Statement, so one
  of the two is always needed. An Assessment is 'likely' for 30+ two-way movements an hour, 100+ a day,
  or a site in or next to an AQMA ('significant normally means a 10% increase in HGV movement'). Reg 3
  'small scale developments' have no threshold, so that part shows as discretionary.
review-status: unverified
field-status: {}
