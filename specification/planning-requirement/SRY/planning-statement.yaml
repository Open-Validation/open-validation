reference: planning-statement
local-authority: SRY
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
policy: Surrey Minerals Plan Core Strategy DPD (2011), Primary Aggregates DPD, Aggregates Recycling Joint
  DPD (2013) (minerals); Surrey Waste Local Plan (2020) (waste); relevant borough or district local plans;
  NPPF
source-text: Mandatory for all planning applications. ... The extent of the information required will
  be site/planning application specific.
must-include:
- item: A comprehensive site description of the physical features of the site and its surroundings
  level: must
- item: Any use, planning and environmental designations and physical constraints
  level: must
- item: 'The context and need for the development (minerals: demand, annual tonnage and contribution to
    the landbank)'
  level: must
- item: Information on the geology and topography of the site
  level: must
- item: Details of boundary treatment
  level: must
- item: How the proposal accords with national and development plan policy
  level: must
- item: Details of consultations with the County Planning Authority, the wider community and statutory
    consultees before submission, including regard to the Equality Act 2010
  level: must
- item: 'Minerals and waste: summaries of supporting technical information and an assessment of cumulative
    effects with other development nearby'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Reg 3: the scope of the development, its activities and phases; the site layout, buildings and
    materials; existing and proposed staff and pupil numbers for a school, and the educational need argument
    where relevant'
  level: must
  required-if:
    application-type:
      in:
      - reg-3
confidence: medium
notes: From the council's list (adopted 3 January 2024), Annex 1 (minerals) page 3-4; Annex 2 (waste)
  page 3; Annex 3 (Reg 3) page 3. The list covers every application the county council decides (minerals,
  waste and the council's own development, including s73 applications for them), so 'all applications'
  is shown as those types. The more complex the scheme, the greater the detail.
review-status: unverified
field-status: {}
