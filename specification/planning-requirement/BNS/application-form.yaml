reference: application-form
local-authority: BNS
required-if:
  always: true
source-url: https://www.barnsley.gov.uk/media/19068/july-2021-national-validation-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All sections need to be completed using the relevant form
must-include:
- item: Ownership certificate (A, B, C or D) completed, with notice served on any other owners and agricultural
    tenants
  level: must
- item: Agricultural holdings certificate signed and dated, whether or not the site includes an agricultural
    holding
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
      - change-of-use
confidence: medium
notes: From the council's National validation requirements (July 2021), Application form, Ownership Certificate
  and Agricultural Holdings Certificate, page 1. The agricultural certificate isn't needed for reserved
  matters, renewals of temporary permission, non-material amendments, conditions, advertisement consent
  or listed building consent. The correct fee is also required.
review-status: unverified
