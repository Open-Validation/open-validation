reference: affordable-housing-statement
local-authority: BNS
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 15
    description: Residential developments of 15 units or more.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policy H7; Affordable Housing SPD; First Homes Technical Note
source-text: 'Required for: • Residential developments of 15 units or more'
must-include:
- item: Total number of all residential units proposed
  level: must
- item: Percentage of affordable units proposed and how this relates to Policy H7, the Affordable Housing
    SPD and the First Homes Technical Note
  level: must
- item: 'Schedule of accommodation with, for each unit: plot number, tenure (as table 1 of the First Homes
    Technical Note), bedrooms, storeys, internal floorspace, accessibility standard (M4(1), M4(2), M4(3))
    and car parking per affordable unit'
  level: must
- item: Layout plan with each affordable unit highlighted and a key showing tenure, with justification
    for the locations
  level: must
- item: Details of design and proposed quality standards of build
  level: must
- item: Details of any Registered Provider partner and the proposed ongoing housing management (transfer
    to a Registered Provider on BMBC's Framework)
  level: must
- item: Anticipated OMV and transfer value of each affordable property (if applicable)
  level: must
- item: Proposed phasing of delivery and occupation on sites delivered over more than one phase
  level: must
  required-if: discretionary
- item: Arrangements to keep the provision affordable for first and future occupiers, or to recycle the
    subsidy within the Borough
  level: must
- item: Viability Assessment if the provision proposed does not comply with policy
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing provision proposed is non-compliant with policy.
confidence: medium
notes: From the council's list (updated 10 March 2026), section 1, page 1.
review-status: unverified
field-status: {}
