reference: elevation-proposed
local-authority: BNS
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The proposal alters the outside of a building.
source-url: https://www.barnsley.gov.uk/media/19068/july-2021-national-validation-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevations – all existing and proposed to be shown at a metric scale of 1:50 or 1:100 (if
  not retrospective)
must-include:
- item: Drawn accurately to a conventional metric scale such as 1:100 or 1:50, true to the stated scale
  level: must
- item: Measured dimensions included
  level: must
- item: All elevations of the proposed development
  level: must
confidence: medium
notes: From the council's National validation requirements (July 2021), Plans & Drawings, page 3.
review-status: unverified
field-status: {}
