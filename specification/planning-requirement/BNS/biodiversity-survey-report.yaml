reference: biodiversity-survey-report
local-authority: BNS
required-if:
  any:
  - discretionary
  - condition:
      field: protected-species
      value: true
      description: Priority and/or protected species are known or likely to be present.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - national-nature-reserve
      - ancient-woodland
      description: Within or close to a designated nature conservation site (Natura 2000 site, SSSI, Nature
        Improvement Area, Local Wildlife Site, Local Nature Reserve, National Nature Reserve, Ancient
        Woodland and biodiversity network).
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies BIO1 and GI1; Biodiversity and Geodiversity SPD; Trees and
  Hedgerows SPD; Barn Conversions SPD
source-text: Of land with areas of semi- natural habitat (including brownfield sites but not including
  minor developments unless there are issues for particular species/habitats*); • Where priority and/or
  protected species are known or likely to be present; and, • If the proposal is within or close to a
  designated nature conservation site (Natura 2000 site, Site of Special Scientific Importance, Nature
  Improvement Area, Local Wildlife Site, Local Nature Reserve, National Nature Reserve, Ancient Woodland
  and biodiversity network). *Which would impact protected Species and/or Habitats of Principal Importance
  (Section 41 of NERC Act 2006)
must-include:
- item: Preliminary Ecological Appraisal / Ecological Impact Assessment (where appropriate) and any secondary
    surveys needed, with proportionate mitigation, enhancement or compensation
  level: must
- item: By competent persons with suitable qualifications and experience, at an appropriate time of year
    (or justified if sub-optimal), using nationally recognised methods
  level: must
- item: How the mitigation hierarchy (avoid, mitigate, compensate) has been applied
  level: must
- item: Desk study data from Barnsley Biological Records Centre and other relevant sources (any omission
    justified)
  level: must
- item: SSSI Impact Risk Zone check as a rapid initial assessment of impacts on statutory designated sites
  level: must
- item: 'Demolition/works to buildings or trees: Preliminary Roost Assessment by a qualified bat worker,
    plus any secondary bat surveys it recommends, all submitted with the application'
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Demolition or works to buildings and/or trees.
- item: Badger reports marked confidential, or sensitive information redacted
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Badgers present.
- item: Mitigation/enhancement measures and precautionary construction measures set out
  level: should
- item: Willow tit surveys where suitable habitat is near Dearne Valley Wetland SSSI parcels
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      description: Suitable habitat in proximity of Dearne Valley Wetland SSSI parcels.
confidence: medium
notes: 'From the council''s list (updated 10 March 2026), section 7, page 6. Contents from Appendix 1
  (Guidance for applicants: Biodiversity, which the council''s page names as part of its local requirements),
  also cited as source. ''Areas of semi-natural habitat'' and ''issues for particular species'' are judgements
  with no field here, so that trigger shows as ''discretionary''. The appendix lists exceptions, e.g.
  where the council has confirmed in writing at pre-application stage that no surveys are needed.'
review-status: unverified
field-status: {}
