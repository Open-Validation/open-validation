reference: heritage-statement
local-authority: BNS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Relevant demolition that requires planning permission.
  - site:
      in:
      - listed-building-setting
      - scheduled-monument
      description: Affects the setting of a listed building or scheduled monument.
  - site:
      in:
      - conservation-area
      - park-and-garden
      description: Within or adjacent to a Conservation Area or Registered Park or Garden.
  - site:
      in:
      - locally-listed-building
      description: Affects a site on the local heritage list.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies D1, HE1, HE2, HE3, HE4, HE5 and HE6; SPD Heritage Impact Assessment
source-text: 'Heritage Statements: Required for: • Applications for Listed Building Consent • Relevant
  demolitions that require planning permission in a Conservation Area • Applications affecting setting
  of a listed building or scheduled monument • Applications on sites located within or adjacent to a Conservation
  Area or Registered Park or Garden • Applications affecting sites on the local heritage list'
must-include:
- item: 'Listed building consent: a schedule of works; analysis of the significance of archaeology, history
    and character of the building; the principles of and justification for the works; and their impact
    on its special interest, structure, setting and contribution to adjacent heritage assets'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Planning permission in conservation areas: analysis of the character and appearance of the building
    and/or space and its contribution to the area; the principles of and justification for the development;
    a structural survey where demolition is proposed; and the impact on the area''s special interest'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
confidence: medium
notes: From the council's list (updated 10 March 2026), section 13, page 10. The contents are 'likely
  to be required', so they are 'should'; detail varies with the significance of the assets. The structural
  survey for demolitions is listed as unmapped.
review-status: unverified
field-status: {}
