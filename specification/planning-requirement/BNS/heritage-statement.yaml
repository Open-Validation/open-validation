reference: heritage-statement
local-authority: BNS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - condition:
        field: demolition
        value: true
        description: Relevant demolition that requires planning permission.
  - site:
      in:
      - conservation-area
      - listed-building-setting
      description: The site is in or next to a Conservation Area, or within the setting of a listed building.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
source-text: 'Required for: Applications for Listed Building Consent … Relevant demolitions that require
  planning permission in a Conservation Area'
must-include:
- item: A schedule of works
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: An analysis of the significance of archaeology, history and character of the building/structure
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The principles of and justification for the works, and their impact on the special architectural
    or historic character of the listed building, its structure, its setting and the setting of any adjacent
    heritage asset
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type, missing_requirement): Item 13 applies to listed building
  consent, relevant demolitions in Conservation Areas, and (from the audit) sites in or next to Conservation
  Areas or within the setting of listed buildings, including householder. The must-include items are the
  workbook''s listed building text (''that includes a schedule of works, an analysis of the significance
  …'').'
review-status: unverified
field-status: {}
