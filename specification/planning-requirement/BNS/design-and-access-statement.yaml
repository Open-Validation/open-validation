reference: design-and-access-statement
local-authority: BNS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (conservation area or World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.barnsley.gov.uk/media/19068/july-2021-national-validation-requirements.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Barnsley Local Plan (2019) Policy D1
source-text: '•Applications for major development, as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015; major development” means development involving
  any one or more of the following— (a) the winning and working of minerals or the use of land for mineral-working
  deposits; (b) waste development; (c) the provision of dwellinghouses where— (i) the number of dwellinghouses
  to be provided is 10 or more; or (ii) the development is to be carried out on a site having an area
  of 0.5 hectares or more and it is not known whether the development falls within sub-paragraph (c)(i);
  (d) the provision of a building or buildings where the floor space to be created by the development
  is 1,000 square metres or more; or (e) development carried out on a site having an area of 1 hectare
  or more; “mining operations” means the winning and working of minerals in, on or under land, whether
  by surface or underground working •Applications for development in a designated area, where the proposed
  development consists of: •one or more dwellings; or •a building or buildings with a floor space of 100
  square metres or more. •Applications for listed building consent.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes that context into account
  level: must
- item: The approach to access, how relevant Local Plan policies have been taken into account, any consultation
    on access and how it informed the development, and how specific access issues have been addressed
  level: must
- item: Building for a Healthy Life assessment, responding to and expanding on its 12 considerations
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential schemes (10 or more dwelling units).
  source-text: 'Building for a healthy life (BHL) Assessment Required for: • Major Residential schemes
    (10 or more dwelling units)'
- item: 'National Design Guide assessment: responds to and expands on its 10 characteristics of well designed
    places'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential schemes (10 or more dwelling units).
  source-text: National Design Guide Assessment Required for; • Major residential schemes (10 or more
    dwelling units)
- item: Masterplan/Design Code Compliance Statement as an appendix, covering at least the vision for the
    site, site context, quantum of development, public realm, Character Areas, health and wellbeing, and
    sustainability
  level: must
  required-if:
    condition:
      field: masterplan-or-design-code-area
      value: true
      description: The development is in an area covered by a masterplan framework or a local design code.
  source-text: 'Masterplan/Design Code Compliance Statement Required for: • All developments in areas
    covered by a masterplan framework or a local design code'
- item: 'Compliance statement with the ''Design of Housing Development'' SPD: tables of rear garden sizes
    per plot (with bedrooms) and internal area per dwelling type (with bedrooms and bed spaces); site
    layout annotating affordable, M4(2) and M4(3)(2)(b) dwellings; house type plans marked ''M4(2) compliant''
    or ''M4(3)(2)(b) compliant'' where provided'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential schemes (10 or more dwellings).
  source-text: Compliance statement with ‘Design of Housing Development’ SPD • Major residential schemes
    (10 or more dwellings)
confidence: medium
notes: From the council's National validation requirements (July 2021), Design and Access Statements,
  page 3. The four design documents come from section 3 of the 2026 list ('Design Documents to supplement
  Design & Access Statements', pages 2-3). Waste development, material changes of use, engineering or
  mining operations don't need one.
review-status: unverified
