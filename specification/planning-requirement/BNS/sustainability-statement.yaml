reference: sustainability-statement
local-authority: BNS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential schemes of 10 or more units.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential schemes of 1,000 square metres or more of floorspace.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
source-text: Residential schemes of 10+ units … Non-residential schemes of 1,000m2 + floorspace … An Energy/Sustainability
  Statement should demonstrate how the proposed development would minimise resource and energy consumption
  compared to the minimum required under current Building Regulations legislation and how it is located
  and designed to withstand the longer term impacts of climate change.
must-include:
- item: How the development would minimise resource and energy consumption compared with the minimum required
    under current Building Regulations
  level: must
- item: How the development is located and designed to withstand the longer term impacts of climate change
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): Item 8; the workbook gave no threshold.'
