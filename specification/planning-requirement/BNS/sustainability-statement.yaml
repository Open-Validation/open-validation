reference: sustainability-statement
local-authority: BNS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential schemes of 10+ units.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential schemes of 1,000 m² + floorspace.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies CC2 and RE1; Sustainable Construction and Climate Change Adaptation
  SPD
source-text: 'Required for: • Residential schemes of 10+ units • Non-residential schemes of 1,000m2 +
  floorspace A Whole Life Carbon Assessment will be required for all major developments (10 dwellings
  or above and 1000m2 or above for commercial developments or change of use developments)'
must-include:
- item: How the development minimises resource and energy consumption compared with current Building Regulations,
    and is located and designed to withstand longer term climate change impacts
  level: must
- item: How it incorporates decentralised, renewable or low carbon energy sources
  level: must
- item: How CO2 emissions are minimised following the energy hierarchy (use less energy, supply energy
    efficiently, maximise renewable and low carbon energy)
  level: must
- item: Commitments on operational CO2 savings, with estimated site-wide regulated CO2 emissions and reductions
    (domestic and non-domestic) in tonnes per annum after each stage of the hierarchy
  level: must
- item: Commitment to maximise on-site renewable technologies, shown in tonnes of CO2
  level: must
- item: How actual energy performance will be monitored after construction and the performance gap addressed
  level: must
- item: 'Non-residential: preliminary assessment towards BREEAM ''Very Good'''
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential scheme.
- item: Whole Life Carbon Assessment following the RICS professional statement 'Whole Life Carbon Assessment
    for the Built Environment' (2017)
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (updated 10 March 2026), section 8, page 7. Called an 'Energy/Sustainability
  Statement including a whole life carbon assessment'. The whole life carbon assessment is for all major
  developments (10 dwellings or 1,000 m² commercial or change of use).
review-status: unverified
field-status: {}
