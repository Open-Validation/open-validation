reference: arboriculturist-report
local-authority: BNS
required-if:
  all:
  - any:
    - condition:
        field: building-works
        value: true
        description: Building work.
    - condition:
        field: engineering-operations
        value: true
        description: An engineering operation.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees located on or within 15 m or falling distance (whichever is greater) of the site.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Town & Country Planning (Trees) Regulations 2012; BS 5837:2012; Barnsley Local Plan (2019) Policy
  BIO1; Trees & Hedgerows SPD
source-text: Any planning application for building work or an engineering operation where there are trees
  located on or within 15m
must-include:
- item: Tree Survey and Tree Constraints Plan to BS5837:2012
  level: must
- item: Any trees scheduled for removal clearly shown on the proposal plans
  level: must
- item: Tree Protection Plan showing how retained trees will be protected during construction
  level: must
- item: Arboricultural Impact Assessment, if trees are implicated
  level: should
  required-if: discretionary
- item: Arboricultural Method Statement, depending on impacts on retained trees
  level: should
  required-if: discretionary
- item: 'Householder applications with excavations within 15 m of trees: position and crown spread of
    the trees on the plans, with species and approximate ages'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (updated 10 March 2026), section 20, page 16. Called a Tree Survey.
review-status: unverified
field-status: {}
