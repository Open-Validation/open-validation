reference: habitat-baseline
local-authority: BNS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The statutory biodiversity gain condition applies.
source-url: https://www.barnsley.gov.uk/media/yyhmuadm/biodiversity-appendix.pdf
policy: Town and Country Planning Act 1990, Schedule 7A; Environment Act 2021; Town and Country Planning
  (Development Management Procedure) (England) Order 2015
source-text: 'Where development would be subject to the biodiversity gain condition, the application must
  be accompanied by minimum information set out in Article 7 of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015:'
must-include:
- item: Plans to an identified scale, showing the direction of North and the onsite habitat existing on
    the date of application (or an earlier date), including any irreplaceable habitat
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: 'From the council''s Biodiversity Appendix (Appendix 1 to the list, March 2026), Biodiversity Net
  Gain, page 5. Follows the law: only where the statutory biodiversity gain condition applies (householder
  and other exempt applications are exempt, but must state that they believe the condition doesn''t apply).'
review-status: unverified
field-status: {}
