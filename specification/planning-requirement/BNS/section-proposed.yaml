reference: section-proposed
local-authority: BNS
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in levels.
  - discretionary
source-url: https://www.barnsley.gov.uk/media/19068/july-2021-national-validation-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Sections-required where any proposal involves a change in levels or is on a sloping site.
  Drawings should include finished floor levels.
must-include:
- item: Drawn accurately to a conventional metric scale such as 1:100 or 1:50, true to the stated scale
  level: must
- item: Measured dimensions included
  level: must
- item: Finished floor levels
  level: must
confidence: medium
notes: From the council's National validation requirements (July 2021), Plans & Drawings, page 3. 'On
  a sloping site' has no stated gradient, so it shows as discretionary.
review-status: unverified
field-status: {}
