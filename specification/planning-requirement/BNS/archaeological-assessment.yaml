reference: archaeological-assessment
local-authority: BNS
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: Includes new buildings.
    - condition:
        field: ground-disturbance
        value: true
        description: Includes ground disturbance.
  - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies HE1 and HE6
source-text: 'Archaeological Assessment: Required for: • Any proposal on or adjoining a site of archaeological
  interest that includes new buildings or ground disturbance.'
must-include:
- item: Results of a desk-based archaeological assessment
  level: must
- item: 'Where the desk-based assessment indicates archaeological potential: the results of an archaeological
    evaluation report'
  level: must
confidence: medium
notes: From the council's list (updated 10 March 2026), section 13, page 10. For sites on or adjoining
  a site of archaeological interest; the list says to discuss with the South Yorkshire Archaeology Service
  'to fully establish whether a site is of archaeological interest', so that part shows as discretionary.
review-status: unverified
