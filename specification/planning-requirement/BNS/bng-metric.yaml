reference: bng-metric
local-authority: BNS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The statutory biodiversity gain condition applies.
source-url: https://www.barnsley.gov.uk/media/yyhmuadm/biodiversity-appendix.pdf
policy: Town and Country Planning Act 1990, Schedule 7A; Environment Act 2021; Town and Country Planning
  (Development Management Procedure) (England) Order 2015
source-text: 'Where development would be subject to the biodiversity gain condition, the application must
  be accompanied by minimum information set out in Article 7 of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015:'
must-include:
- item: Pre-development biodiversity value of the onsite habitat, with the completed metric calculation
    tool, its publication date and version
  level: must
- item: Statement whether the value is lower because of degradation, with supporting evidence if so
  level: must
- item: Completed statutory biodiversity metric with all tabs (habitat loss, creation and enhancement),
    informed by the submitted layout plans, as a Microsoft Excel workbook (macros disabled)
  level: should
- item: Condition assessment sheets, where applicable
  level: should
- item: 'Written BNG Statement/Assessment: how losses will be addressed, the mitigation and biodiversity
    gain hierarchies, irreplaceable habitats, management of on-site habitats and whether on-site gains
    are ''significant'''
  level: should
confidence: medium
notes: 'From the council''s Biodiversity Appendix (Appendix 1 to the list, March 2026), Biodiversity Net
  Gain, page 5. Follows the law: only where the statutory biodiversity gain condition applies (householder
  and other exempt applications are exempt, but must state that they believe the condition doesn''t apply).
  The ''should'' items are the council''s ''requirements prior to determination'', which it asks to have
  at validation to avoid delays.'
review-status: unverified
field-status: {}
