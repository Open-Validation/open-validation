reference: planning-statement
local-authority: BNS
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: Any departures.
  - all:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.4
        description: Housing on sites above 0.4 ha.
    - condition:
        field: site-allocation
        value: false
        description: Not on a Local Plan housing allocation (contrary to the Local Plan).
  - ref: major-development
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies E4 and H5
source-text: 'Required for: • Any departures • Applications for housing on sites above 0.4ha that are
  contrary to the Local Plan • Major applications'
must-include:
- item: The relevant national, regional and local policies and how the development relates to them
  level: must
- item: Details of pre-application discussions
  level: must
- item: Summary of the other technical documents submitted
  level: must
- item: 'Housing on non-allocated sites of 0.4 ha and above: evidence of why the site is appropriate,
    taking account of Policies E4 and H5'
  level: must
  required-if:
    all:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.4
        description: Site of 0.4 ha and above.
    - condition:
        field: site-allocation
        value: false
        description: Not a housing allocation.
- item: Summary of any community consultation carried out before submission
  level: must
confidence: medium
notes: From the council's list (updated 10 March 2026), section 17, page 13. The section is headed 'Planning
  & Community Consultation Statement'.
review-status: unverified
field-status: {}
