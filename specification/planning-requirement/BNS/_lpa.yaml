submission-standards:
- item: Plans and drawings accurately drawn to a conventional metric scale (such as 1:100 or 1:50), true
    to the stated scale; no 'Not to Scale' or 'Do Not Scale' disclaimers except on perspective drawings
  level: must
- item: Measured dimensions included on plans and drawings
  level: must
- item: Each plan/drawing has a title box with the address and proposal, drawing title, date, scale and
    drawing number, with revisions clearly identified
  level: should
- item: Existing and proposed drawings grouped side by side at the same scale
  level: should
- item: External dimensions written on plans and/or a linear scale bar, especially for electronic submissions
  level: should
- item: BNG metric submitted as a Microsoft Excel workbook (macros disabled)
  level: must
