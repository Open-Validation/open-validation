reference: town-centre-impact-assessment
local-authority: BNS
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses neither in an existing centre nor in accordance with an up to date
      plan.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: NPPF paragraphs 90-95; Barnsley Local Plan (2019) Policies TC1, TC3, TC4 and TC5
source-text: 'Impact Assessment: • Required for retail and leisure uses where they are of a scale, role
  or function where they could have a negative impact on the vitality and viability of the centre and
  are: Located outside the Primary Shopping Area of Barnsley Town Centre and are: • Within the catchment
  of Barnsley Town Centre, and • Have a floorspace in excess of 2,500 square metres gross Located outside
  the Primary Shopping Area of a District centre and are: • Within the catchment of a District Centre,
  and • Have a floorspace in excess of 1000 square metres gross Located outside a Local Centre and are:
  • Within the catchment of a Local centre, and • Have a floorspace in excess of 500 square metres gross'
must-include:
- item: 'Sequential approach: town centre sites first, then edge of centre, and out of centre only if
    no suitable sites are available'
  level: must
- item: 'Impact assessment: impact on investment in centres in the catchment and on town centre vitality
    and viability'
  level: must
  required-if:
    any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Outside the Primary Shopping Area of Barnsley Town Centre, within its catchment,
          over 2,500 m² gross.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 1000
          description: Over 1,000 m² gross.
      - discretionary
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: Over 500 m² gross.
      - discretionary
confidence: medium
notes: 'From the council''s list (updated 10 March 2026), section 18, page 14. Impact thresholds: 2,500
  m² outside Barnsley Town Centre''s Primary Shopping Area within its catchment; 1,000 m² within a District
  Centre''s catchment; 500 m² within a Local Centre''s catchment. Which catchment applies has no field
  here, so the lower two show with ''discretionary''. The sequential test isn''t applied to proposals
  that comply with Local Plan Policy T5.'
review-status: unverified
field-status: {}
