reference: transport-assessment
local-authority: BNS
required-if:
  any:
  - condition:
      field: convenience-retail-floorspace
      operator: '>'
      value: 800
      description: Food retail (E) over 800 m² GFA.
  - condition:
      field: comparison-retail-floorspace
      operator: '>'
      value: 1500
      description: Non-food retail (E) over 1,500 m² GFA.
  - all:
    - condition:
        field: use-class
        value: financial-professional-services
        description: Finance and professional services (E).
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 m².
  - all:
    - condition:
        field: use-class
        value: restaurant-cafe
        description: Restaurants and cafes (E).
    - condition:
        field: floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 m².
  - all:
    - condition:
        field: use-class
        value: drinking-establishment
        description: Drinking establishments (sui generis).
    - condition:
        field: floorspace
        operator: '>'
        value: 600
        description: Over 600 m².
  - all:
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Hot-food takeaways (sui generis).
    - condition:
        field: floorspace
        operator: '>'
        value: 500
        description: Over 500 m².
  - condition:
      field: office-floorspace
      operator: '>'
      value: 2500
      description: Business (E) over 2,500 m² GFA.
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 4000
      description: General industrial (B2) over 4,000 m² GFA.
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 5000
      description: Storage or distribution (B8) over 5,000 m² GFA.
  - all:
    - condition:
        field: use-class
        value: hotel
        description: Hotels (C1).
    - condition:
        field: bedroom-count
        operator: '>'
        value: 100
        description: Over 100 beds.
  - all:
    - condition:
        field: use-class
        value: hospital-nursing-home
        description: Hospitals and nursing homes (C2).
    - condition:
        field: residential-capacity
        operator: '>'
        value: 50
        description: Over 50 beds.
  - all:
    - condition:
        field: use-class
        value: residential-education
        description: Residential education (C2).
    - condition:
        field: residential-capacity
        operator: '>'
        value: 150
        description: Over 150 students.
  - all:
    - condition:
        field: use-class
        value: institutional-hostel
        description: Institutional hostels (C2a).
    - condition:
        field: residential-capacity
        operator: '>'
        value: 400
        description: Over 400 residents.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: Dwellings (C3) over 80 units.
  - all:
    - condition:
        field: use-class
        value: non-residential-institution
        description: Non-residential institutions (F1).
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: Over 1,000 m².
  - all:
    - condition:
        field: use-class
        value: assembly-leisure
        description: Assembly and leisure (D2).
    - condition:
        field: floorspace
        operator: '>'
        value: 1500
        description: Over 1,500 m².
  - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies T3, T4 and T5
source-text: 'However, a TA and Draft Travel Plan will be required where gross floor area (GFA) exceeds
  the following:'
must-include:
- item: Accessibility of the development by all modes of transport
  level: must
- item: Whether the site access can accommodate the predicted traffic
  level: must
- item: Impacts on the wider highway network, including existing and proposed infrastructure
  level: must
- item: Transport impact mitigation measures
  level: must
- item: Measures to encourage walking, cycling and public transport
  level: must
confidence: medium
notes: From the council's list (updated 10 March 2026), section 19, page 15. Thresholds from the list's
  GFA table (food 800 m², non-food 1,500 m², finance and professional, restaurants and business 2,500
  m², drinking 600 m², takeaways 500 m², B2 4,000 m², B8 5,000 m², hotels 100 beds, hospitals and nursing
  homes 50 beds, residential education 150 students, hostels 400 residents, dwellings 80 units, F1 1,000
  m², D2 1,500 m²). Other uses (stadiums, retail warehouses, petrol stations and similar) 'shall be assessed
  on their merits in discussion with Highways DC', shown as discretionary. 'Exceeds' is read as more than
  the figure.
review-status: unverified
field-status: {}
