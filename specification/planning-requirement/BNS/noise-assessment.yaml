reference: noise-assessment
local-authority: BNS
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Potentially noise generating development (pubs, clubs, takeaways, industrial/commercial
          uses, recreation).
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of existing noise sensitive developments (residential, schools, hospitals).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive uses near existing noise generating uses, classified roads, railways
        or in an existing noisy environment.
  - all:
    - condition:
        field: mixed-use
        value: true
        description: Mixed use application.
    - condition:
        field: noise-generating-use
        value: true
        description: Comprising both noise generating and noise sensitive uses.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Commercial applications including extractor or cooling units.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of noise sensitive developments.
  - condition:
      field: renewable-energy-development
      value: true
      description: Energy generating development (e.g. Short Term Operating Reserve, wind turbines).
  - application-type:
      in:
      - waste-dev
  - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policy POLL1
source-text: Potentially noise generating developments (i.e. pubs, clubs, takeaways, industrial/commercial
  uses, recreation) in the vicinity of existing noise sensitive developments - residential, schools and
  hospitals; • Noise sensitive uses in the vicinity of existing noise generating uses, classified roads,
  railways or in areas with an existing noisy environment such as the city centre; • Mixed use applications
  comprising both noise generating and noise sensitive uses; • Commercial applications including extractor
  or cooling units in the vicinity of noise sensitive developments • Energy generating development (e.g.
  Short Term Operating reserve (STOR), Wind turbines etc) • Waste producing installations • Any major
  road schemes
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Existing noise environment, potential noise sources from the development or affecting it, and
    mitigation measures
  level: must
- item: Methodology and scope discussed with Regulatory Services beforehand
  level: should
confidence: medium
notes: From the council's list (updated 10 March 2026), section 15, page 12. 'Any major road schemes'
  and non-renewable energy generation such as STOR have no field here, so they show as discretionary.
  Heat pumps need the MCS Planning Standard checklist instead (listed as unmapped).
review-status: unverified
field-status: {}
