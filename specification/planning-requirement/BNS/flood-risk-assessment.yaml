reference: flood-risk-assessment
local-authority: BNS
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
source-text: Planning applications for development proposals of 1 hectare or greater in Flood Zone 1 and
  all proposals for new development located in Flood Zones 2 and 3 should be accompanied by an FRA … A
  FRA will also be required where the proposed development or change of use to a more vulnerable class
  may be subject to other sources of flooding or where the Environment Agency, Internal Drainage Board
  and/or other bodies have indicated that there may be drainage problems.
must-include:
- item: The risks of all forms of flooding to and from the development, and how they will be managed,
    taking climate change into account
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): the workbook filed this under ''Change of use - prior approval'' only;
  Item 10 is not a prior approval list and applies to householder, full, outline and reserved matters
  applications. Other sources of flooding and drainage problems are shown as officer discretion.'
review-status: unverified
field-status: {}
