reference: sustainable-drainage-strategy
local-authority: BNS
required-if:
  ref: major-development
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies CC1, CC3 and CC4
source-text: 'Required for: • Major Developments'
must-include:
- item: 'Outline applications: a conceptual drainage plan and SuDS design statement'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Detailed applications: a detailed drainage plan and SuDS design statement covering how the SuDS
    will operate and be managed and maintained for the lifetime of the development, with measures to avoid
    water contamination and safeguard groundwater'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: If SuDS are not possible, a statement explaining why
  level: must
- item: Where connecting to an existing drainage system, details of that system on the drawings
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development connects to an existing drainage system.
- item: Foul drainage assessment to Environment Agency standards where foul sewage goes other than to
    the public sewer, showing why mains connection isn't practical and the alternative is satisfactory
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Foul sewage disposed of other than to the public sewer.
confidence: medium
notes: From the council's list (updated 10 March 2026), section 11, page 9. Called 'SuDS/Foul & Surface
  Water Drainage Details'.
review-status: unverified
field-status: {}
