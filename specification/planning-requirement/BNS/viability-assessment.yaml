reference: viability-assessment
local-authority: BNS
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: On viability grounds the scheme doesn't meet the affordable housing requirement.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: On viability grounds the scheme doesn't meet all the policy requirements (affordable
        housing, education etc.) normally secured by a section 106 agreement.
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: 'Barnsley Local Plan (2019) Policies I1, I2 and H7 and appendix 5: Viability Assessments; Planning
  Obligations SPD; Affordable Housing SPD'
source-text: Where on the grounds of viability, any submitted scheme is not proposing to meet all the
  policy requirements, such as affordable housing, education etc., that would otherwise be expected to
  be offset through the provision of a section 106 agreement
must-include:
- item: Prepared in line with Planning Practice Guidance, RICS guidance and the NPPF, by a suitably qualified
    practitioner
  level: must
- item: Executive summary setting out the key findings
  level: must
- item: Prepared so it can be made public, other than in exceptional circumstances set out in an accompanying
    statement
  level: must
confidence: medium
notes: From the council's list (updated 10 March 2026), section 21, page 17. The council recovers the
  cost of independent review from the applicant.
review-status: unverified
field-status: {}
