reference: air-quality-assessment
local-authority: BNS
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: The site is within, adjacent to or impacting on an Air Quality Management Area.
  - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
source-text: 'Air Quality Assessment Details of when required Required for: Sites within, adjacent or
  impacting on Air Quality Management Area’s (AQMA’s) or where a development would result in air quality
  issues such as certain industrial processes e.g. glass recycling, concrete works, sewage treatment works'
must-include:
- item: Existing air quality, and the impact of additional emissions associated with the proposed development
  level: should
confidence: medium
notes: 'Developments that would result in air quality issues (certain industrial processes) are a judgement,
  so shown as officer discretion. Audit (wrong_app_type): applies to outline and reserved matters as well
  as full applications.'
review-status: unverified
field-status: {}
