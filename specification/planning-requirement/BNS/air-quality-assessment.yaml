reference: air-quality-assessment
local-authority: BNS
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within, adjacent to or impacting on an Air Quality Management Area.
  - all:
    - condition:
        field: direct-air-emissions
        value: true
        description: Certain industrial processes, e.g. glass recycling, concrete works, sewage treatment
          works.
    - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policies AQ1 and Poll1
source-text: Sites within, adjacent or impacting on Air Quality Management Area’s (AQMA’s) or where a
  development would result in air quality issues such as certain industrial processes e.g. glass recycling,
  concrete works, sewage treatment works
must-include:
- item: Existing air quality and the impact of additional emissions from the development (such as traffic
    emissions)
  level: must
- item: Actions to mitigate air quality impact and public exposure to air pollution
  level: must
- item: Scope and methodology discussed and approved by BMBC Regulatory Services beforehand
  level: should
confidence: medium
notes: From the council's list (updated 10 March 2026), section 2, page 2. Whether a development 'would
  result in air quality issues' is a judgement, so the industrial-process trigger shows with 'discretionary'.
review-status: unverified
field-status: {}
