reference: land-contamination-assessment
local-authority: BNS
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected due to the nature of the previous use of the site.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable.
    - discretionary
source-url: https://www.barnsley.gov.uk/media/0qpll0xy/2026-local-validation-list.pdf
policy: Barnsley Local Plan (2019) Policy CL1
source-text: Where contamination is known or suspected due to the nature of the previous use of the site
  or the proposed use would be particularly vulnerable
must-include:
- item: Phase 1 Desk Study, Site Walkover and Initial Risk Assessment, following the YHPAC Technical Guide
  level: must
- item: Not needed if evidence shows the site was previously remediated, the remediation verified, and
    the development won't undermine it
  level: should
confidence: medium
notes: From the council's list (updated 10 March 2026), section 5, page 4. A particularly vulnerable proposed
  use on a site with no known contamination is a judgement, so it shows with 'discretionary'. Scope is
  best discussed with Pollution Control (BMBC Regulatory Services).
review-status: unverified
field-status: {}
