reference: fire-statement
local-authority: BNS
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - application-type:
      in:
      - full
      - change-of-use
source-url: https://www.barnsley.gov.uk/media/19068/july-2021-national-validation-requirements.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'An application for planning permission for development which involves: on or after 1st August
  2021) • the provision of one or more relevant buildings, or • development of an existing relevant building
  • or development within the curtilage of a relevant building must be accompanied by a fire statement
  unless an exemption applies.'
must-include:
- item: On the government's template form (or one to the same effect)
  level: must
confidence: medium
notes: From the council's National validation requirements (July 2021), Fire Statement, page 5. Relevant
  buildings contain two or more dwellings or educational accommodation and are 18 m or more or 7 or more
  storeys. Outline and section 73 applications, and some changes of use, are exempt.
review-status: unverified
field-status: {}
