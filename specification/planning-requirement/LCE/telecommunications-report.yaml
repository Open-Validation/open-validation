reference: telecommunications-report
local-authority: LCE
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: ICNIRP Declaration … Justification Statement … Planning applications for mast and antenna
  development by mobile phone network operators should be accompanied by a range of supplementary information
  including the area of search, details of any consultation undertaken, details of the proposed structure,
  and technical justification and information about the proposed development.
must-include:
- item: Signed ICNIRP declaration
  level: must
- item: 'Justification statement: the reasons or need for the development'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Area of search, consultation undertaken, details of the structure and technical justification
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 39, 56-57, 71-72. The ICNIRP declaration
  and justification statement are essential in the telecoms prior notification checklist; Part 2 adds
  the supplementary information for planning applications.
review-status: unverified
field-status: {}
