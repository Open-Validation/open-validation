reference: waste-management-plan
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use with an impact on the generation of waste.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Conversion to flats.
        - condition:
            field: food-or-drink-use
            value: true
            description: Change of use to bars, restaurants or takeaway food outlets.
        - discretionary
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Waste Management Statement - Major applications … Waste Management Statement - development
  that will have an impact on the generation of waste, for example conversion to flats, changes of use
  to bars, restaurants, takeaway food outlets.
must-include:
- item: How construction-phase waste will be dealt with in line with national and local policies
  level: should
- item: Site Waste Management Plan with the location of the bin store and the materials, design and type
    of enclosure
  level: should
- item: Refuse bin storage and its proximity to an accessible collection point
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 14, 16, 73-74. Part 2 excludes householder
  applications that are major only because of site area. Other changes of use 'with an impact on the generation
  of waste' are discretionary. The contents come from Part 2 ('Document Types and Definitions'), which
  the list says is guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
