reference: landscaping-plan
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Dwellings (residential development).
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Landscaping Scheme
must-include:
- item: Location of existing and proposed trees and a general indication of the type of planting in all
    landscaped areas
  level: should
- item: Regard to existing and proposed services, and protection of existing trees during construction
  level: should
- item: Long-term maintenance and management arrangements where landscaping falls outside individual properties
  level: must
- item: Scale, title, drawing number and north arrow
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 18, 57. Essential in the dwellings checklist.
  The contents come from Part 2 ('Document Types and Definitions'), which the list says is guidance and
  does not form part of the adopted list.
review-status: unverified
field-status: {}
