reference: photos
local-authority: LCE
required-if:
  any:
  - application-type:
      in:
      - lbc
      - consent-under-tpo
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-hoarding
        value: true
        description: A hoarding is proposed.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Photographs – Showing location of proposed extension, alteration or demolition … Photographs
  … Where hoarding is proposed – photo montage of proposed and all existing hoarding(s) (Level 0 AVR)
must-include:
- item: Location of the proposed extension, alteration or demolition
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Photomontage of the proposed and all existing hoardings (Level 0 Accurate Visual Representation)
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Current condition and appearance of any part of the building to be altered or demolished
  level: should
- item: Clearly labelled, with a brief description where appropriate
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 27, 30, 35, 47, 64. Essential for listed
  building consent and works to TPO trees.
review-status: unverified
field-status: {}
