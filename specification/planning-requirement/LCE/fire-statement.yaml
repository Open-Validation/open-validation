reference: fire-statement
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings (including flats).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: Building 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Building of 7 or more storeys.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9A
source-text: Fire Statement – Where educational accommodation is proposed and the building meets the height
  condition of 18m or more in height, or 7 or more storeys … Fire Statement - Where two or more dwellings
  (includes flats) are proposed and the building meets the height condition of 18m or more in height,
  or 7 or more storeys.
must-include:
- item: Completed by an expert
  level: must
- item: Submitted using the government's fire statement form
  level: must
confidence: medium
notes: From the council's list (published 7 July 2025), pages 12-13, 15, 19, 51-52. Also for other alterations
  to buildings in residential or educational use that meet the same height condition. The contents come
  from Part 2 ('Document Types and Definitions'), which the list says is guidance and does not form part
  of the adopted list.
review-status: unverified
field-status: {}
