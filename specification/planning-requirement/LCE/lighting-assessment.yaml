reference: lighting-assessment
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting is proposed.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Lighting Assessment - When floodlighting is proposed … Lighting Assessment / Specification
must-include:
- item: Carried out in accordance with CIE 150:2017 or a suitable equivalent
  level: should
- item: Why lighting is needed, the proposed users, and the frequency and hours of illumination
  level: should
- item: Site survey of the area to be lit relative to its surroundings, with existing and proposed landscape
    features to mitigate the impacts
  level: should
- item: 'Technical report by a qualified person: type of lights, performance, height and spacing of columns'
  level: should
- item: Light levels over the intended area and at the site boundaries (and 50 m beyond for large schemes),
    superimposed on a map
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 13, 23, 57-58. Essential in the floodlighting
  checklist. The contents come from Part 2 ('Document Types and Definitions'), which the list says is
  guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
