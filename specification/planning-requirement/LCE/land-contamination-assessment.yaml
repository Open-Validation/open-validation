reference: land-contamination-assessment
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - contaminated-land
      description: Land with historically contaminative uses or naturally occurring contamination.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Contamination Assessment – development on land with any historically contaminative uses or
  where the site has any naturally occupying contamination
must-include:
- item: Desktop study determining, as a minimum, any historically contaminative uses or naturally occurring
    contamination, whether intrusive investigation is needed and potential remediation strategies
  level: must
confidence: medium
notes: From the council's list (published 7 July 2025), pages 12, 18, 47. In the buildings and extensions
  and the dwellings checklists. The contents come from Part 2 ('Document Types and Definitions'), which
  the list says is guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
