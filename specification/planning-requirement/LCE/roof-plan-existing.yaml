reference: roof-plan-existing
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
    - condition:
        field: complex-roof-design
        value: true
        description: The development proposes a complex roof form.
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: roof-mounted-equipment
        value: true
        description: Energy generating equipment attached to a roof.
  - all:
    - application-type:
        in:
        - ldc
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: The development changes (or changed) the roof.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Roof Plans – Existing and Proposed - If the development proposes a complex roof arrangement
  you may be asked for these … Roof Plans – Existing and Proposed – When equipment is attached to a roof
  … Roof Plan – Existing and Proposed – Where development proposes changes to the roof … Roof Plan – as
  existing prior to development - Where existing roof plan was changed by the development … Roof Plans
  – Existing and Proposed – Where alterations affecting the roof are proposed
must-include:
- item: Drawn to a standardised metric scale (preferably 1:50 or 1:100) with a scale bar so measurements
    can be taken from electronic versions
  level: should
- item: Critical dimensions, showing the shape of the roof
  level: should
- item: Title, plan number and north arrow (if applicable)
  level: should
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6, 13, 21, 28-30, 66. Complex roofs (householder
  extensions, buildings and extensions): ''you may be asked for these'', so discretionary. The contents
  come from Part 2 (''Document Types and Definitions''), which the list says is guidance and does not
  form part of the adopted list.'
review-status: unverified
field-status: {}
