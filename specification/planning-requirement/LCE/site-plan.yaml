reference: site-plan
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: openings-only
        value: false
        description: Not only new or replacement doors and windows (that householder checklist has no
          site plan).
  - application-type:
      in:
      - full
      - reserved-matters
      - lbc
      - ldc-prospective-use
      - footpath-diversion
      - pa-demo-building
      - pa-extension
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - ldc-existing-use
    - condition:
        field: site-layout-change
        value: true
        description: The existing site layout was changed by the development.
  - all:
    - application-type:
        in:
        - non-material-amendment
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The proposal affects the previously approved plans.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site Plan – Existing and Proposed … Site Plan – as existing prior to development - Where
  existing site layout was changed by the development … Site and Floor Plans – Proposed including clear
  identification of where amendments are proposed (by bubbles/annotation) – Where proposals affect the
  previously approved plans … Site Plan – Showing proposed and existing routes … Site Plan identifying
  building(s) to be demolished … Site Plan – indicating position of the extension
must-include:
- item: Standardised metric scale, preferably 1:100 or 1:200 (a master plan at 1:500 or similar on larger
    sites), with a scale bar
  level: should
- item: Title and drawing number
  level: should
- item: The direction of North
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including the type and height of walls or fencing where proposed
  level: should
- item: Position of any river, pond or other water feature on or adjacent to the site
  level: should
- item: Dimensions of parking spaces and visibility splays
  level: should
- item: Proposed and existing routes
  level: must
  required-if:
    application-type:
      in:
      - footpath-diversion
  source-text: Site Plan – Showing proposed and existing routes
- item: The building(s) to be demolished
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
  source-text: Site Plan identifying building(s) to be demolished
- item: Position of the extension
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
  source-text: Site Plan – indicating position of the extension
- item: Amendments clearly identified (by bubbles/annotation)
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6-39, 67. Essential in most householder
  and non-householder checklists (shop fronts: existing site plan only), and for listed building consent,
  proposed-use LDCs, right of way diversions, prior notifications of demolition, larger home extensions
  and telecoms. Not listed for advertisement consent. Outline and reserved matters: the list says the
  requirements are the same as for a full application of the same type for the matters not reserved (page
  24). The contents come from Part 2 (''Document Types and Definitions''), which the list says is guidance
  and does not form part of the adopted list.'
review-status: unverified
field-status: {}
