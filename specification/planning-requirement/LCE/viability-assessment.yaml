reference: viability-assessment
local-authority: LCE
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing below policy, justified on financial grounds.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: A policy planning obligation is not met in full for reasons of financial viability.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Where the justification is based on a financial case a Viability Assessment carried out by
  a suitably qualified surveyor must be submitted by the applicant and. … If the reason relates to the
  financial viability of the development, the application must be accompanied by an ‘open book’ financial
  appraisal setting out the projected costs, and expected income from the development.
must-include:
- item: Carried out by a suitably qualified surveyor
  level: must
- item: '''Open book'' appraisal of projected costs and expected income'
  level: must
- item: Made public (an executive summary only in exceptional circumstances)
  level: must
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 41, 62. Not in the Part 1 checklists:
  from Part 2''s Affordable Housing Statement and Planning Obligations entries. The developer pays for
  independent assessment.'
review-status: unverified
field-status: {}
