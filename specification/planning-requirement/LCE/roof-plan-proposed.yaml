reference: roof-plan-proposed
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
    - condition:
        field: complex-roof-design
        value: true
        description: The development proposes a complex roof form.
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: roof-mounted-equipment
        value: true
        description: Energy generating equipment attached to a roof.
  - all:
    - application-type:
        in:
        - ldc
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: The development changes (or changed) the roof.
  - all:
    - application-type:
        in:
        - non-material-amendment
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The proposal affects the previously approved roof plan.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Roof Plans – Existing and Proposed - If the development proposes a complex roof arrangement
  you may be asked for these … Roof Plans – Existing and Proposed – When equipment is attached to a roof
  … Roof Plan – Proposed including clear identification of where amendments are proposed (by bubbles/annotation)
  – Where proposals affect the previously approved roof plan … Roof Plan – as built – Where changes to
  the roof have been made
must-include:
- item: Drawn to a standardised metric scale (preferably 1:50 or 1:100) with a scale bar so measurements
    can be taken from electronic versions
  level: should
- item: Critical dimensions, showing the shape of the roof
  level: should
- item: Title, plan number and north arrow (if applicable)
  level: should
- item: Roofing material, vents and their location, and any plant, solar PV, lift overruns and green/brown
    roofs
  level: should
- item: Amendments clearly identified (by bubbles/annotation)
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6, 13, 21, 28-34, 66. Complex roofs: ''you
  may be asked for these'', so discretionary. The contents come from Part 2 (''Document Types and Definitions''),
  which the list says is guidance and does not form part of the adopted list.'
review-status: unverified
field-status: {}
