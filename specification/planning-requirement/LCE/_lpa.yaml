validation-list:
  url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
  date: '2025-07-07'
  date-basis: 'Title: ''Local Validation List - Planning Validation Requirements (7th July 2025)'', with
    ''7th July 2025'' in every page footer (PDF created 4 July 2025). The council''s ''Apply for planning
    permission'' page (make-an-application, checked 2026-11-06) links only this list (''Leicester local
    validation list – July 2025''); the ''Local Validation List: Updates'' document the list mentions
    is not linked there, and the planning.data.gov.uk register still points to the older 2022 list. Within
    two years, so current.'
  status: current
submission-standards:
- item: Applications submitted electronically through the Planning Portal where the appropriate form is
    available, with all supporting plans and documents
  level: should
- item: A summary list of all submitted plans and documents
  level: should
- item: 'Planning Portal limit of 30 MB per file: reduce larger files following the Planning Portal best
    practice guide; only if that fails, the council can provide a OneDrive link, with a drawing register'
  level: should
- item: Plans rotated and labelled correctly before uploading
  level: should
- item: Personal and sensitive information (personal contact details, signatures) redacted from all plans
    and documents
  level: should
- item: 'Revised applications: an Amendment Statement explaining the changes, amended plans fully annotated,
    and a version of each amended plan showing the amendments over the original'
  level: should
- item: Submitted reports and supporting statements no more than 12 months old
  level: should
- item: Drawings at a standardised metric scale with a scale bar (so measurements can be taken from electronic
    versions), critical dimensions, a title and a drawing number
  level: should
