reference: archaeological-assessment
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - conservation-area
      - listed-building
      - scheduled-monument
      - archaeological-priority-area
      description: Within a conservation area, the curtilage of a listed building or scheduled monument,
        the Archaeological Alert Area, or an area of archaeological significance in the Development Plan.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: 'Archaeological Assessment - For development likely to have impact on archaeological assets.
  (Will be required when the site is: within a conservation area; within the curtilage of a listed building
  or Scheduled Ancient Monument; within the Archaeological Alert Area; or within an area designated in
  the Development Plan as of archaeological significance)'
must-include:
- item: Desk-based study of the recorded history and archaeology of the site, evaluating its archaeological
    potential and the need for further archaeological work
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 12, 18, 43. In the buildings and extensions
  and the dwellings checklists. The contents come from Part 2 ('Document Types and Definitions'), which
  the list says is guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
