reference: sustainable-drainage-strategy
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Dwellings (residential development).
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: footprint-area
        operator: '>'
        value: 200
        description: New building footprint over 200 sq m.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: impermeable-area-increase
          operator: '>'
          value: 200
          description: New hard surfacing over 200 sq m.
      - all:
        - condition:
            field: hard-surfacing
            value: true
            description: A driveway.
        - condition:
            field: impermeable-area-increase
            operator: '>'
            value: 5
            description: Over 5 sq m.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Sustainable Drainage Strategy - When development proposes over 200 square metres of building
  footprint … Sustainable Drainage Assessment – if new building has footprint over 200 square metres …
  Sustainable Drainage Assessment– if development has footprint of new surfacing over 200 square metres
  or a driveway of over 5 square meters
must-include:
- item: 'Layout plan of the drainage network: foul and surface water systems (proposed and existing),
    connections to public sewers, location and attenuation capacity of all SuDS and soakaways, and flow
    control devices'
  level: must
- item: Surface water discharge restricted to the greenfield runoff rate of 5 l/s/ha on greenfield sites,
    and a 50% reduction of existing rates on brownfield sites
  level: must
- item: Appropriate climate change allowance
  level: should
- item: 'Sustainable Drainage Assessment: SuDS maintenance plan (CIRIA C753) and a product specification
    or design drawing for each SuDS'
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: Hard surfacing or driveway.
confidence: medium
notes: From the council's list (published 7 July 2025), pages 6-7, 10, 14, 17-18, 21, 25-26, 70-71. Covers
  the Sustainable Drainage Strategy (essential for dwellings; buildings over 200 sq m footprint) and the
  Sustainable Drainage Assessment (householder and driveway checklists). Uses the retired MHCLG id. The
  contents come from Part 2 ('Document Types and Definitions'), which the list says is guidance and does
  not form part of the adopted list.
review-status: unverified
field-status: {}
