reference: elevation-existing
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: residential-extension
          value: true
          description: Householder extension.
      - condition:
          field: openings-only
          value: true
          description: Householder doors and windows.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - any:
      - condition:
          field: building-works
          value: true
          description: Buildings and extensions (other than dwellings).
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use.
      - condition:
          field: new-boundary-treatment
          value: true
          description: Fences, walls and enclosures.
      - condition:
          field: plant-equipment
          value: true
          description: Plant and machinery, including ventilation flues.
      - condition:
          field: shopfront
          value: true
          description: Shop fronts.
      - all:
        - condition:
            field: renewable-energy-development
            value: true
            description: Energy generating equipment.
        - condition:
            field: external-alterations
            value: true
            description: The equipment is attached to a building.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: external-alterations
        value: true
        description: The development changes (or changed) the elevations.
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevations – Existing and Proposed … Elevations – Existing – When attached to a building
  … Elevations – Existing and Proposed – Where development proposes changes to elevations … Elevations
  – as existing prior to development - Where existing elevations were changed by the development … Plans
  relevant to the proposed works - these may be floor plans and/or elevations and may include cross section
  drawings
must-include:
- item: Drawn to a standardised metric scale (preferably 1:50 or 1:100) with a scale bar so measurements
    can be taken from electronic versions
  level: should
- item: Critical external dimensions in figures
  level: should
- item: Title and drawing number
  level: should
- item: All sides of the proposal, including blank elevations
  level: must
- item: The proposed works shown clearly in relation to what is already there
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: should
- item: Includes a cross section
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Elevations – Existing and Proposed, including cross section
- item: Labelled 'as existing prior to development'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - ldc-existing-use
    - condition:
        field: retrospective
        value: true
        description: Retrospective application.
  source-text: “Existing” and “proposed” plans should be labelled “as existing prior to development” and
    “as built”.
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6-34, 49. Listed building consent: the
  essential item is ''plans relevant to the proposed works'', which may be floor plans and/or elevations,
  so it shows as discretionary. Outline and reserved matters: the list says the requirements are the same
  as for a full application of the same type for the matters not reserved (page 24). The contents come
  from Part 2 (''Document Types and Definitions''), which the list says is guidance and does not form
  part of the adopted list.'
review-status: unverified
field-status: {}
