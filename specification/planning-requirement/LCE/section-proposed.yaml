reference: section-proposed
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Dwellings (residential development).
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: change-in-ground-levels
        value: true
        description: Significant land level differences across the site.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: residential-extension
          value: true
          description: Householder extension.
      - condition:
          field: outbuilding
          value: true
          description: Domestic outbuilding.
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2, 3a or 3b, or in an Ordinary Watercourse (the council's flood map).
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: openings-only
        value: true
        description: Householder doors and windows.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - lbc
    - condition:
        field: architectural-detailing
        value: true
        description: New or replacement architectural detailing (windows, façade treatment, eaves).
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Site Sections, Finished Floor Levels and Site Levels … Site Levels - where there are significant
  land level differences across the site … Finished Floor Levels – for developments in Flood Zones 2,
  3a or 3b or in an Ordinary Watercourse … Cross Section Detail of Proposed Windows and Doors … Section
  drawings of joinery and/or architectural detailing - When the proposal is for new or replacement elements
  of architectural detailing (including but not limited to new/replacement windows, façade treatment,
  eaves detailing).
must-include:
- item: Standardised metric scale, preferably 1:50 or 1:100, with a scale bar; critical dimensions; title
    and plan number
  level: should
- item: Cross section(s) through the proposed building(s), including room heights
  level: should
- item: Existing and finished levels, with details of foundations and eaves and how encroachment onto
    adjoining land is avoided
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: Existing site levels and finished floor levels related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: The application involves new buildings.
- item: How level access to the building will be achieved
  level: should
- item: Existing and proposed finished floor levels
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Flood Zone 2, 3a or 3b, or in an Ordinary Watercourse (the council's flood map).
- item: 'Windows and doors: cross sections of existing (if replaced) and proposed windows or doors at
    a standardised metric scale, preferably 1:50 or 1:20, with critical dimensions'
  level: should
  required-if:
    condition:
      field: openings-only
      value: true
      description: New or replacement windows and doors.
- item: 'Joinery: horizontal and vertical sections at 1:5 or 1:10, including glazing bars, opening systems
    and double glazing where relevant'
  level: should
  required-if:
    condition:
      field: architectural-detailing
      value: true
      description: New or replacement architectural detailing.
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6-30, 51, 53, 66-68. Site sections, finished
  floor levels and site levels are essential for dwellings. Existing levels are shown on the same drawings
  (Part 2: ''Site Sections, Finished Floor and Site Level Plans – Existing and Proposed''). The contents
  come from Part 2 (''Document Types and Definitions''), which the list says is guidance and does not
  form part of the adopted list.'
review-status: unverified
field-status: {}
