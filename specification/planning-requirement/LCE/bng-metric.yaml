reference: bng-metric
local-authority: LCE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition (not de minimis or otherwise
      exempt).
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning Act 1990 Schedule 7A; Town and Country Planning (Development Management
  Procedure) (England) Order 2015 article 7
source-text: Biodiversity Net Gain assessment and Metric calculation – for any development that does not
  fall within the ‘de minimis’ exemption
must-include:
- item: Fully completed Defra Metric, including the Condition Assessment Sheets
  level: must
- item: A draft Biodiversity Gain Plan
  level: should
- item: A draft Habitat Management and Monitoring Plan
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 12, 17-18, 21-25, 45-46. Listed in the non-householder
  checklists, and essential for outline applications. Shown with the statutory biodiversity gain condition,
  so householder and other exempt applications are exempt by law. Self-build or custom-build dwellings
  need the signed Appendix B declaration instead (see unmapped). The contents come from Part 2 ('Document
  Types and Definitions'), which the list says is guidance and does not form part of the adopted list.
