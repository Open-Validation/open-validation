reference: sustainability-statement
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Leicester Climate Change SPD (January 2011)
source-text: Sustainability Design and Construction Statement – For major applications
must-include:
- item: How energy efficiency has been designed in and how the proposal meets or exceeds Building Regulations
    CO2 standards (fabric efficiency, decentralised energy, on-site renewable/low carbon technologies)
  level: must
- item: 'Efficient use of resources: minimising waste and maximising recycling/re-use in construction
    and occupation, including reuse of viable existing buildings'
  level: must
- item: 'Resilience to future climate change: the water environment (SuDS, flood proofing, water demand)
    and energy (passive solar design, overheating)'
  level: must
confidence: medium
notes: From the council's list (published 7 July 2025), pages 14, 16, 20, 69-70. The contents come from
  Part 2 ('Document Types and Definitions'), which the list says is guidance and does not form part of
  the adopted list.
review-status: unverified
field-status: {}
