reference: noise-assessment
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: '''Noisy uses'' that could generate increased levels of noise.'
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise-sensitive use that may be affected by existing noise levels.
    - condition:
        field: plant-equipment
        value: true
        description: Plant and machinery, including ventilation flues.
    - condition:
        field: renewable-energy-development
        value: true
        description: Energy generating equipment.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Noise Impact Assessment – For ‘Noisy Uses’. For uses that could generate increased levels
  of noise. … Noise Levels Assessment - For noise sensitive uses. For developments which may be affected
  by existing noise levels.
must-include:
- item: Mitigation strategy showing how impacts are reduced to acceptable levels
  level: should
- item: Any equipment to be installed, with noise emission data
  level: should
- item: Noise from nearby Class E uses assessed at their full potential, including café/restaurant use
  level: should
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Noise levels assessment.
confidence: medium
notes: From the council's list (published 7 July 2025), pages 13, 15, 19, 21, 25, 59-61. Covers the Noise
  Impact Assessment and the Noise Levels Assessment; a Noise Impact Assessment is essential for energy
  generating equipment and for plant and machinery. The contents come from Part 2 ('Document Types and
  Definitions'), which the list says is guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
