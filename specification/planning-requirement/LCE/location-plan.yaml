reference: location-plan
local-authority: LCE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - advertising
    - ldc
    - lbc
    - s73
    - footpath-diversion
    - pa-demo-building
    - pa-extension
    - pa-ecomms-network
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan identifying the site
must-include:
- item: Based on an up-to-date map at a standardised metric scale, preferably 1:1250 or 1:2500
  level: should
- item: Normally on A4 or A5 sized paper
  level: should
- item: At least two named roads and surrounding buildings, with properties numbered or named, wherever
    possible
  level: should
- item: North direction arrow
  level: must
- item: Application site edged clearly and accurately with an unbroken red line, including all land needed
    to carry out the development (access from a public highway, visibility splays, landscaping, car parking,
    open areas around buildings)
  level: should
- item: Blue line around any other land owned by the applicant close to or adjoining the site
  level: should
- item: Title and drawing number
  level: should
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 3, 6-39, 58. Essential in every checklist
  except non-material amendments and tree works. North arrow: the list''s summary of national requirements
  says ''An accurate Site Location Plan (including North Arrow)''. The contents come from Part 2 (''Document
  Types and Definitions''), which the list says is guidance and does not form part of the adopted list.'
