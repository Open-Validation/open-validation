reference: floor-plan-proposed
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: residential-extension
          value: true
          description: Householder extension.
      - condition:
          field: outbuilding
          value: true
          description: Domestic outbuilding.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - any:
      - condition:
          field: building-works
          value: true
          description: Buildings and extensions (other than dwellings).
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Dwellings (residential development).
      - condition:
          field: plant-equipment
          value: true
          description: Plant and machinery, including ventilation flues.
      - condition:
          field: shopfront
          value: true
          description: Shop fronts.
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: floor-layout-change
        value: true
        description: The development changes (or changed) the floor plans.
  - all:
    - application-type:
        in:
        - non-material-amendment
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The proposal affects the previously approved plans.
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor Plans - Existing and Proposed … Floor Plans – Proposed … Site and Floor Plans – Proposed
  including clear identification of where amendments are proposed (by bubbles/annotation) – Where proposals
  affect the previously approved plans … Floor Plans – as built – Where floor plans have been changed
  by the development
must-include:
- item: Drawn to a standardised metric scale (preferably 1:50 or 1:100) with a scale bar so measurements
    can be taken from electronic versions
  level: should
- item: Critical external dimensions in figures
  level: should
- item: Title and drawing number
  level: should
- item: The use of each room or part of the building
  level: should
- item: Room sizes (widths and lengths) and room areas annotated
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: Spaces with reduced head height (e.g. roof spaces) shaded, and floor areas with ceiling heights
    between 1.5 m and 2.3 m shown separately
  level: should
- item: New buildings shown in context with adjacent buildings (including property numbers where applicable)
  level: should
- item: Amendments clearly identified (by bubbles/annotation)
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6-34, 53-54, 56. Listed building consent:
  ''plans relevant to the proposed works'', so discretionary. Outline and reserved matters: the list says
  the requirements are the same as for a full application of the same type for the matters not reserved
  (page 24). The contents come from Part 2 (''Document Types and Definitions''), which the list says is
  guidance and does not form part of the adopted list.'
review-status: unverified
field-status: {}
