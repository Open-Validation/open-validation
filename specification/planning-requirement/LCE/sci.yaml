reference: sci
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1500
        description: Industrial or commercial development of 1,500 sq m or more in or adjacent to residential
          areas.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: Residential development of 100 dwellings or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 3
        description: Residential development on a site of 3 hectares or more.
    - all:
      - condition:
          field: use-class
          value: educational-or-institutional
          description: New educational or institutional sites or extensions.
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more.
    - condition:
        field: wind-turbine-count
        operator: '>'
        value: 2
        description: Wind turbine development of more than two turbines.
    - condition:
        field: turbine-hub-height
        operator: '>'
        value: 15
        description: Hub height of any turbine exceeds 15 metres.
    - all:
      - condition:
          field: plant-equipment
          value: true
          description: Plant and machinery.
      - ref: major-development
    - discretionary
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Leicester Statement of Community Involvement (2019)
source-text: Statement of Community Involvement - industrial or commercial development of 1500m² or more
  in or adjacent to residential areas, major infrastructure proposals, new educational or institutional
  sites or extensions of 1000m² or more … residential development of 100 dwellings or more or on a site
  of 3 hectares or more … Statement of Community Involvement – For wind turbine developments of more than
  two turbines or where the hub height of any turbine exceed 15 metres … Statement of Community Involvement
  – major development
must-include:
- item: Shows the views of the local community were sought and taken into account
  level: should
- item: How the applicant complied with the pre-application consultation requirements of the council's
    Statement of Community Involvement (2019)
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 13, 16, 19, 21, 25, 68. ''Major infrastructure
  proposals'' is undefined, so that part is discretionary. Plant and machinery: ''major development''.
  The contents come from Part 2 (''Document Types and Definitions''), which the list says is guidance
  and does not form part of the adopted list.'
review-status: unverified
field-status: {}
