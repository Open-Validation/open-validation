reference: sci
local-authority: LCE
required-if:
  any:
  - all:
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1500
        description: Industrial or commercial development of 1,500 square metres or more.
    - discretionary
  - condition:
      field: dwelling-count
      operator: '>='
      value: 100
      description: Residential development of 100 dwellings or more.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 3
      description: Residential development on a site of 3 hectares or more.
  - all:
    - condition:
        field: educational-accommodation
        value: true
        description: New educational or institutional sites or extensions.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 square metres or more.
  - discretionary
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: 'Statement of Community Involvement A Statement of Community Involvement is required where
  proposals include: Industrial or commercial development in or adjacent to residential areas of 1500
  square metres or more Residential development of 100 dwellings or more or on a site of 3 hectares or
  more Major infrastructure proposals New educational or institutional sites or extensions of 1000 square
  metres or more Large-scale major applications require a statement setting out how the applicant has
  compl'
confidence: medium
notes: '''In or adjacent to residential areas'' (for industrial/commercial) and ''major infrastructure
  proposals'' are shown as officer discretion. Large-scale majors also need a statement on compliance
  (excerpt cut off).'
review-status: unverified
field-status: {}
