reference: heritage-statement
local-authority: LCE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - pa-ecomms-network
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        description: Development may affect a heritage asset or its setting (scheduled monuments, listed
          buildings, historic parks and gardens, conservation areas, local heritage assets).
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Heritage Statement - Where a development may affect a heritage asset, including its setting
  (heritage assets include Scheduled Monuments, Listed Buildings, Historic Parks & Gardens, sites within
  Conservation Areas and local heritage assets)
must-include:
- item: Identifies the designation of the heritage asset (e.g. whether it is listed)
  level: should
- item: Assesses how the proposal affects the significance of the heritage asset, including its setting
  level: should
- item: What the applicant has done to minimise the impact
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 6-39, 55-56. Essential for listed building
  consent; criteria-based in the householder, non-householder and telecoms checklists. The contents come
  from Part 2 ('Document Types and Definitions'), which the list says is guidance and does not form part
  of the adopted list.
review-status: unverified
field-status: {}
