reference: planning-statement
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use.
    - any:
      - condition:
          field: departure-from-development-plan
          value: true
          description: Does not accord with adopted policies.
      - discretionary
  - application-type:
      in:
      - footpath-diversion
      - consent-under-tpo
      - s73
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Planning Statement – Where a proposal does not accord with adopted policies and/or is a complex
  planning application … Justification Statement … Details Specified in Condition(s)
must-include:
- item: Reasons or need for the development or works, including plans and photographs where relevant
  level: should
  required-if:
    application-type:
      in:
      - footpath-diversion
      - consent-under-tpo
- item: Original and proposed wording of all relevant conditions, with written justification for the change
  level: should
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: From the council's list (published 7 July 2025), pages 16, 33-35, 57, 63, 73. Change of use checklist
  ('complex' applications are discretionary). A Justification Statement is essential for right of way
  diversions and works to TPO trees; 'Details Specified in Condition(s)' for section 73 applications (Part
  2 says the supporting statement gives the original and proposed wording). The contents come from Part
  2 ('Document Types and Definitions'), which the list says is guidance and does not form part of the
  adopted list.
review-status: unverified
field-status: {}
