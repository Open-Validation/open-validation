reference: arboriculturist-report
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - pa-ecomms-network
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the site or on adjacent sites in close proximity to the boundary.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Arboricultural Assessment - When there are trees located on the application site or on adjacent
  sites in close proximity to the boundary
must-include:
- item: Carried out by a qualified arboriculturalist
  level: should
- item: Accurate position of all trees and hedgerows on the site and on adjacent land, including canopy
    spread and root area
  level: should
- item: Species of all trees and hedgerows, with an assessment of their health, vigour and amenity value
  level: should
- item: Schedule of trees and hedgerows to be retained or removed, and why
  level: should
- item: Tree protection measures during construction and the life of the development
  level: should
- item: Tree survey carried out to BS5837
  level: must
- item: Carried out not more than a year before the application date
  level: should
confidence: medium
notes: 'From the council''s list (published 7 July 2025), pages 6-25, 39, 42-43. Floodlighting and plant:
  ''when works will take place within root protection areas/canopy or result in the removal of trees or
  hedges''. Telecoms prior approval: ''when trees are located on or neighbouring the application site
  & the proposal involves new ground-based apparatus''. The contents come from Part 2 (''Document Types
  and Definitions''), which the list says is guidance and does not form part of the adopted list.'
review-status: unverified
field-status: {}
