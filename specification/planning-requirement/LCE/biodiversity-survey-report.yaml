reference: biodiversity-survey-report
local-authority: LCE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: protected-species
          value: true
          description: Development may affect protected species (e.g. badgers, birds, bats).
      - condition:
          field: potential-roost-features
          value: true
          description: Works affect potential bat roost features (roofs, dormers, eaves, cladding, hanging
            tiles).
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - pa-ecomms-network
    - any:
      - condition:
          field: protected-species
          value: true
          description: Development may affect protected species.
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          - local-nature-reserve
          - priority-habitat
          description: Development on or which may affect designated sites or priority habitats.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Ecological Assessment – For development that may affect protected species such as (but not
  limited to) badgers, birds and bats. … Preliminary Roost Assessment (PRA) – where the development will
  affect potential roost features (including but not limited to roofs, dormers, eaves, wooding cladding
  and hanging tiles). … Ecological Assessment - For development on or which may affect designated sites,
  protected species and/or priority habitats (see this link for further criteria and guidance) and accompanying
  Ecological Report
must-include:
- item: Survey by competent, suitably qualified persons at an appropriate time of year, in suitable weather
    and using nationally recognised survey guidelines/methods
  level: must
- item: Survey undertaken within the last available season before the application
  level: should
- item: Records which habitats and species are present on or around the site, their extent/area/length,
    and maps their distribution
  level: must
- item: Shows how adverse effects will be avoided, mitigated or compensated, and how alternatives have
    been considered
  level: should
- item: Results presented as an Ecological Report with methodologies, results, evaluation, mitigation
    and any further surveys or licences needed
  level: must
- item: Bat Emergence Survey submitted with the application where the PRA recommends one
  level: must
  source-text: Where this is the recommendation the Bat Emergence Survey must also be submitted with the
    application.
- item: PRA undertaken by a suitably experienced ecologist holding an appropriate survey licence
  level: must
confidence: medium
notes: From the council's list (published 7 July 2025), pages 6-7, 12, 15, 18, 21, 23, 25, 39, 43-44,
  65. Covers the Ecological Assessment, Ecological Report, Preliminary Roost Assessment and Bat Emergence
  Survey. The non-householder 'see this link for further criteria' points to the council's local biodiversity
  criteria (https://www.leicester.gov.uk/sites/default/files/2026-01/appendix-1-local-validation-criteria-for-biodiversity.pdf,
  2020), a trigger table for protected species surveys. The contents come from Part 2 ('Document Types
  and Definitions'), which the list says is guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
