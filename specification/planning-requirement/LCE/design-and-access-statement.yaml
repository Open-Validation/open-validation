reference: design-and-access-statement
local-authority: LCE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: residential-extension
          value: true
          description: Householder extension.
      - condition:
          field: outbuilding
          value: true
          description: Domestic outbuilding.
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Floorspace created exceeds 100 sq m.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floorspace created of 100 sq m or more.
  - application-type:
      in:
      - demolition-con-area
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Design and Access Statement - Within a conservation area where the floorspace to be created
  exceeds 100 square metres … Design and Access Statement – For major applications or where any part of
  the development is within a conservation area and comprises the provision of one or more dwellings or
  a building(s) where the floorspace created by the development is 100 square metres or more … Applications
  for Listed Building Consent … Applications for demolition within a Conservation Area
confidence: medium
notes: From the council's list (published 7 July 2025), pages 6-7, 12, 18-19, 21, 25, 30, 48. Demolition
  in a conservation area comes from Part 2's list of when a statement is needed; there is no checklist
  for that type. The required contents are the national ones.
review-status: unverified
field-status: {}
