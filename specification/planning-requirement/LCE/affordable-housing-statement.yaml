reference: affordable-housing-statement
local-authority: LCE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A residential site of 0.5 hectares or more.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: 'Affordable Housing Statement An Affordable Housing Statement should provide all the following
  information in relation to all proposed affordable and market housing: Number of residential units'
must-include:
- item: For all proposed affordable and market housing, the number of residential units
  level: should
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_trigger):
  the workbook had no threshold; from the audit, 15+ dwellings or 0.5 ha+.'
review-status: unverified
