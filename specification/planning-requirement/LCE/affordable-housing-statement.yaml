reference: affordable-housing-statement
local-authority: LCE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site of 0.5 ha or over.
source-url: https://www.leicester.gov.uk/sites/default/files/2026-01/local-validation-list-requirements-july-2025.pdf
source-text: Affordable Housing Statement – On all sites of 15 or more dwellings or sites of 0.5 ha or
  over
must-include:
- item: Number of residential units
  level: should
- item: Schedule of the mix of units with numbers of habitable rooms and/or bedrooms, or floorspace
  level: should
- item: Plan showing the location of the units and their habitable rooms/bedrooms and/or floorspace
  level: should
- item: Compliance with Building Regulations M4(2) or M4(3) and Nationally Described Space Standards
  level: should
- item: Different levels or types of affordability or tenure clearly explained
  level: should
- item: Any Registered Social Landlord / Registered Provider partner
  level: should
- item: Heads of Terms where provision is to be secured through a Section 106 obligation
  level: should
- item: Full justification of any exception to affordable housing policy
  level: should
confidence: medium
notes: From the council's list (published 7 July 2025), pages 15, 18, 40-41. In the change of use and
  the dwellings checklists. The contents come from Part 2 ('Document Types and Definitions'), which the
  list says is guidance and does not form part of the adopted list.
review-status: unverified
field-status: {}
