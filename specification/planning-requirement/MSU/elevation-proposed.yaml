reference: elevation-proposed
local-authority: MSU
required-if:
  condition:
    field: external-alterations
    value: true
    description: The works create or alter an elevation.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevation Plans are required for any works where an elevation is created or altered.
must-include:
- item: Scale at 1:50 or 1:100, including the relevant scale bar
  level: should
- item: Height, width and depth dimensions (where applicable)
  level: should
- item: Each elevation clearly labelled as existing or proposed and by direction (front, side, rear or
    north, south, east...)
  level: should
- item: Proposed details such as doors and windows annotated or labelled on each elevation
  level: should
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 5; Part One (Householder),
  page 5. The proposed plans show the works in context with the rest of the existing building.
review-status: unverified
field-status: {}
