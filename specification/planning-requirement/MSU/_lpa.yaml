submission-standards:
- item: Ordnance Survey plans must be originals (licensed copies); illegally copied OS plans may not be
    accepted
  level: must
- item: Copied architect's plans need written evidence of permission from the copyright holder
  level: must
- item: Google Maps or Bing Maps are not acceptable
  level: must
- item: All plans and documents given appropriate titles and annotated correctly
  level: should
- item: Drawing numbers advised, with a different reference number for each plan; amended plans shown
    by a new reference or revision number (e.g. 01 superseded by 01A)
  level: should
- item: Plans drawn to the stated scale with the relevant scale bar
  level: should
- item: An email address and phone number given so the council can make contact
  level: should
