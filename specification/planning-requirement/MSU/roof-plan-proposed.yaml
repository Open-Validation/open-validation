reference: roof-plan-proposed
local-authority: MSU
required-if:
  condition:
    field: roof-alteration
    value: true
    description: A roof is created or altered.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof Plans are only required when a roof is created or altered. Existing and proposed roof
  plans can be on same plan if it is clear what is proposed and what is existing.
must-include:
- item: Shape and location of the roof, specifying the roofing material
  level: should
- item: Scale at 1:50 or 1:100, including the relevant scale bar (or 1:200 or 1:500 if shown on the block
    plan)
  level: should
- item: Written dimensions
  level: should
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 6; Part One (Householder),
  page 6.
review-status: unverified
field-status: {}
