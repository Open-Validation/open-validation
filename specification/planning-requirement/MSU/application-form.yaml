reference: application-form
local-authority: MSU
required-if:
  always: true
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The form outlines what information is necessary for each element, please complete all questions,
  quoting N/A when not applicable. … The Householder Application Form is required for all householder
  applications.
must-include:
- item: All questions completed, quoting N/A when not applicable
  level: should
- item: The relevant Certificate of Ownership (A, B, C or D) signed; only one certificate is needed
  level: must
- item: 'Where Certificate B is completed: a copy of the Article 11 or 13 notice served'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate B is completed.
- item: 'Where Certificate C or D is completed: a copy of the article published in the newspaper'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate C or D is completed.
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 3; Part One (Householder),
  page 3. Sections 1 (Application Form), 1a (Certificates) and 1b (Notice Served). If the site is part
  of an agricultural holding, notice should be served on the tenant.
review-status: unverified
field-status: {}
