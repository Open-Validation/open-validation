reference: lighting-assessment
local-authority: MSU
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: external-lighting
        value: true
        description: Minor or major development that includes external lighting (not internal lighting
          or lighting contained to private domestic gardens).
  - condition:
      field: use-class
      value: intensive-livestock-poultry
      description: Intensive livestock and poultry farming (including extensions to existing units).
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: This is required for all minor and major development proposals that includes external lighting
  unless for internal lighting or lighting that will only relate and is contained to private domestic
  gardens. … Assessments for Odour and light pollution;
must-include:
- item: Technical specification of the lights
  level: must
- item: Layout plan/lighting orientation plan with beam orientation, and a schedule of the equipment in
    the design
  level: must
- item: Details of lighting spill, including a polar luminance diagram based on vertical luminance at
    the nearest sensitive premises
  level: must
- item: Confirmation of hours of operation
  level: must
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 20. If it is not
  considered to be required, the applicant must give a statement confirming no such lighting is proposed
  or explaining why it is not needed at this stage. Not for street lighting on public highways. Intensive
  livestock and poultry applications (section 29b, page 23) need a light pollution assessment.
review-status: unverified
field-status: {}
