reference: location-plan
local-authority: MSU
required-if:
  always: true
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Site Location Plan is required for all applications.
must-include:
- item: Application site outlined in one continuous red line on an Ordnance Survey based map
  level: must
- item: Any other adjoining or nearby land in the applicant's ownership outlined in blue
  level: must
- item: Scale at 1:1250 or 1:2500, including the relevant scale bar
  level: should
- item: A north point
  level: should
- item: At least one named road
  level: should
- item: Clearly identifies the location of the site
  level: should
- item: Where the proposal includes access or a visibility splay to the highway, the access is included
    within the red line
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: The proposal includes an access or visibility splay to the highway.
- item: Details of landscaping within the proposed visibility splays
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: new-vehicle-access
        value: true
        description: The proposal includes visibility splays.
- item: 'For householder applications: the site location drawn around the immediate residential curtilage'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 4; Part One (Householder),
  page 3-4. Both parts say the plan 'should' show the listed details. Part One adds that Google or Bing
  maps are not acceptable (see submission standards).
review-status: unverified
field-status: {}
