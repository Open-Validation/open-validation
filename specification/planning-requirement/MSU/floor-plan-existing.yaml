reference: floor-plan-existing
local-authority: MSU
required-if:
  condition:
    field: building-works
    value: true
    description: An existing building is altered by the proposed development.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor Plans are required for new development, and for existing buildings if altered by the
  proposed development.
must-include:
- item: Scale at 1:50 or 1:100, including the relevant scale bar
  level: should
- item: At least two key dimensions
  level: should
- item: Clearly labelled as existing and/or proposed, showing the proposed floor area including any window
    and door openings
  level: should
- item: Existing walls or buildings to be demolished highlighted, where applicable
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: The proposal involves demolition.
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 5-6; Part One (Householder),
  page 5. Part Two adds that where the application is simply a change of use with no development work,
  'a floor plan may not be necessary'.
review-status: unverified
field-status: {}
