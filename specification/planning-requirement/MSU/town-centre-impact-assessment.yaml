reference: town-centre-impact-assessment
local-authority: MSU
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A town centre use not in Sudbury, Hadleigh or Stowmarket town centres, nor a centre
        defined in a made Neighbourhood Plan, nor in accordance with an up-to-date plan.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 400
      description: In excess of 400 (the list says 'metres').
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: Applications for these uses, which are neither in Sudbury, Hadleigh or Stowmarket town centres
  (as defined on the Policies Map), nor centres that are defined in made Neighbourhood Plans, nor in accordance
  with an up-to-date plan shall be accompanied by a sequential test/report to justify the proposed use.
  Such applications, if in excess of 400 metres, shall also be accompanied by a retail impact assessment.
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 25. Section 33 'Town
  Centre Uses'. The list says 'in excess of 400 metres'; shown as 400 square metres of floorspace. The
  sequential test is listed as unmapped.
review-status: unverified
