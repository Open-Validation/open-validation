reference: design-and-access-statement
local-authority: MSU
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with 100 square metres or more of floor space.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: Householder applications submitted jointly with listed building consent.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: What applications must be accompanied by a Design and Access Statement? o Applications for
  major development … o Applications for development in a Conservation area, where the proposed development
  consists of one or more dwellings and/or a building or buildings with a floor space of 100 square metres
  or more.
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): Part One adds ''Householder Applications jointly submitted
  with listed building consent applications''; the list also covers listed building consent.'
review-status: unverified
field-status: {}
