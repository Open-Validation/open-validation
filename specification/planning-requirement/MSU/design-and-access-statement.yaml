reference: design-and-access-statement
local-authority: MSU
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Which applications must be accompanied by a Design and Access Statement? … Applications for
  major development, as described on page one of this document … Applications for development in a Conservation
  area, where the proposed development consists of one or more dwellings and/or a building or buildings
  with a floor space of 100 square metres or more. … Applications for listed building consent.
must-include:
- item: Details of all accesses, including sustainable and active forms of access, not just vehicular
    access
  level: must
  source-text: these details shall include all accesses (including sustainable and active forms of access),
    and not just vehicular access.
- item: How relevant Local Plan policies have been taken into account in the approach to access
  level: must
- item: 'For listed building consent: justification for the proposed works and the impact, if any, on
    the listed building'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 8-9; Part One (Householder),
  page 7. Applications to amend conditions do not need one. Part One lists conservation area householder
  development of 100 sq m or more and householder applications made with listed building consent. The
  rest of the content is the national (DMPO) content the list repeats. A crime prevention statement and
  the Policy LP29 statement can be included in it.
review-status: unverified
field-status: {}
