reference: section-proposed
local-authority: MSU
required-if:
  any:
  - condition:
      field: site-level-change
      operator: '>'
      value: 500
      description: Changing the ground levels (normally more than 500mm).
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: basement
          value: true
          description: Excavation for a basement.
      - discretionary
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-1-householder-v3-final-pdf
source-text: For a householder application if you are changing the ground levels (normally more than 500mm),
  these plans will need to be provided.
must-include:
- item: An appropriate scale, with the relevant scale bar
  level: should
- item: A fixed datum point
  level: should
- item: Written dimensions
  level: should
confidence: medium
notes: 'Part Two uses the same 500mm threshold. From the audit: Part One item 10 also asks for section
  plans for excavation (pools, basements, manèges), shown as basement or officer discretion.'
