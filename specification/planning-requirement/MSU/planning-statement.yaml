reference: planning-statement
local-authority: MSU
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: residential-annexe
          value: true
          description: Householder proposals such as annexes or cart lodges.
      - discretionary
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: All applications (apart from Discharge of Conditions) require a Planning Statement as it
  will aid the application by giving more details of the development and the reasons behind it, providing
  clarity for why the proposal is sought. The amount of detail necessary should be proportionate to the
  proposal. … A Planning Statement is not always required, but may be needed for certain applications
  i.e. Annexes, cart lodges, etc.
must-include:
- item: The intention of and reasons for the application, and why the development is necessary (clarifying
    and justifying the need)
  level: should
- item: How the application complies with relevant planning policies
  level: should
- item: 'For annexed accommodation or a change of use: the intended use of the building and the need for
    the development'
  level: must
  required-if:
    any:
    - condition:
        field: residential-annexe
        value: true
        description: The proposal creates annexed accommodation.
    - condition:
        field: involves-change-of-use
        value: true
        description: The proposal is a change of use.
  source-text: In developments involving the creation of annexed accommodation or change of use it would
    be necessary to clarify the intention of the use of the building and need for the development.
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 8; Part One (Householder),
  page 6-7. For minor and major applications it can be part of another document such as the Design and
  Access Statement. For householder applications it is shown as discretionary except for annexes, the
  example the list gives ('cart lodges, etc.' are also examples).
review-status: unverified
field-status: {}
