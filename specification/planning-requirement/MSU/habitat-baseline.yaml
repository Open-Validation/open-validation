reference: habitat-baseline
local-authority: MSU
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the general biodiversity gain condition.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: 'Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015:'
must-include:
- item: Drawn to an identified scale, showing the direction of North
  level: must
- item: On-site habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 15. The list says
  BNG applies to 'most Major and Minor Planning applications' and lists the exemptions (householder, listed
  building consent, adverts, permitted development and prior approvals, self-build, de minimis, some s73
  and reserved matters). Shown with the biodiversity gain condition, as the law sets it.
review-status: unverified
field-status: {}
