reference: site-plan
local-authority: MSU
required-if:
  condition:
    field: external-alterations
    value: true
    description: Any external works within the site, for example outbuildings.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: Block Plans are required for any external works within the site, for example outbuildings.
must-include:
- item: A scale of 1:200 or 1:500, with the relevant scale bar
  level: should
- item: Written dimensions
  level: should
- item: A north point
  level: should
- item: Details of the site surroundings (buildings, landscaping, roads)
  level: should
- item: Proposed works clearly annotated
  level: should
confidence: medium
notes: 'The must-include items are the Part Two block plan notes (''The plans should: …'').'
review-status: unverified
field-status: {}
