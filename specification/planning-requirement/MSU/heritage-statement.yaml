reference: heritage-statement
local-authority: MSU
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      description: Within the curtilage of a listed building (including buildings that formed part of
        the curtilage when listed and/or are older than 1948).
  - site:
      in:
      - conservation-area
      description: Within or adjoining a conservation area.
  - site:
      in:
      - listed-building-setting
      - scheduled-monument
      - world-heritage-site
      - battlefield
      - protected-wreck-site
      description: Adjacent to a heritage asset (taken to affect its setting for validation).
  - site:
      in:
      - park-and-garden
      description: Affecting a Registered Park or Garden of Special Historic Interest.
  - site:
      in:
      - locally-listed-building
      - historic-environment-record
      description: Affecting an unlisted building on the Historic Environment Record (HER)/Local List.
  - discretionary
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: 'A Heritage Statement is required with all development proposals requiring planning permission
  or listed building consent, when the proposal directly involves, or affects the setting of a heritage
  asset. … Compilation of a Heritage Statement will be applicable to the following types of proposal:
  … Development requiring listed building consent … Development within the curtilage of a listed building
  (including building/s that formed part of the curtilage when listed and/or older than 1948 even if not
  part of the same ownership in present day) … Development within or adjoining Conservation Areas'
must-include:
- item: History and development of the asset, using photographic, map, archival and fabric evidence
  level: must
- item: Consideration of the relevant Historic Environment Record
  level: must
- item: A photographic record of the site context and the spaces and features that might be affected,
    preferably cross-referenced to survey drawings
  level: must
- item: An assessment of the archaeological, architectural, historical or other significance of the asset
    and its setting
  level: must
- item: An assessment of the impact of the works on the significance of the asset and its setting, a statement
    of justification, and any mitigation measures
  level: must
- item: Whether a variety of options was considered and why the proposed option was chosen
  level: must
- item: 'Where historic fabric is to be removed or altered: its significance, properly understood and
    explained'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Historic fabric is to be removed or altered.
- item: 'For a listed building: whether the works are reversible in whole or in part'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: The proposal relates to a listed building.
- item: 'Where the works would cause harm: whether the harm would be offset or outweighed by public benefits'
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
- item: All relevant heritage assets, where the proposal affects more than one
  level: should
confidence: medium
notes: 'From the council''s list (updated April 2024), Part Two (Major and Minor), page 9-11; Part One
  (Householder), page 8-9. The list also names development adjacent to a heritage asset, a Registered
  Park or Garden and unlisted buildings on the HER/Local List. The discretionary part: applications affecting
  non-designated heritage assets or the setting of a listed building ''may be judged as needing a heritage
  statement'' once the heritage team has reviewed them.'
review-status: unverified
field-status: {}
