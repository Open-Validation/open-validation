reference: sustainable-drainage-strategy
local-authority: MSU
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: change-in-ground-levels
        value: true
        description: Ground level changes are proposed.
  - discretionary
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
source-text: A surface water drainage strategy utilising a Sustainable Drainage System (SuDS) is required
  for … Major residential development applications (FULL and OUTLINE), i.e. development of more than 10
  dwellings (or 0.5 hectares for residential development where the number of dwellings is unknown) as
  well as some minor developments. … Applications (FULL and OUTLINE) for the creation of more than a 1000
  square metres of floor space … Any application where the site is greater than 1 hectare. … Technical
  Surface Water drainage information will also be required for all Minor developments where ground level
  changes are proposed.
must-include:
- item: 'Evidence that a viable discharge point or points exists, following the drainage hierarchy: infiltration
    (with BRE Digest 365 test results), a surface water body (with the right to discharge in perpetuity),
    a surface water sewer, highway drain or other system, or a combined sewer (with permission in principle
    to connect)'
  level: must
- item: SuDS measures shown on the relevant plans, showing how they integrate with public open space,
    landscaping, roads, trees and buildings
  level: must
- item: Multifunctional SuDS identified on the plans (for example improving water quality or enhancing
    biodiversity)
  level: should
- item: Details of long-term management and maintenance of SuDS
  level: must
confidence: medium
notes: 'From the council''s list (updated April 2024), Part Two (Major and Minor), page 17-18. Sections
  20a (majors) and 20b (minors). Shown as major development for the thresholds the list gives. Discretionary
  parts: ''some minor developments'', a strategy ''may be required when a Flood Risk Assessment is required'',
  and details ''MAY also be requested'' for minor development where a localised flood risk has been identified.'
review-status: unverified
field-status: {}
