reference: recreation-facilities-assessment
local-authority: MSU
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: The proposal would result in the loss of open space.
source-url: https://www.midsuffolk.gov.uk/documents/d/asset-library-54706/joint-lvl-part-2-major-and-minor-v3-final
policy: Babergh and Mid Suffolk Joint Local Plan policy LP28
source-text: '37b Loss of open space or community service or facility Applications shall provide: … Proof
  of compensatory provision or proof (to be agreed in advance by the Local Planning Authority) that the
  service or facility is not viable and is no longer performing a functional role in its current or future
  form and it is not needed for an economically viable alternative community use.'
must-include:
- item: Proof of compensatory provision, or proof (agreed in advance with the council) that the facility
    is not viable, no longer performs a functional role and is not needed for an economically viable alternative
    community use
  level: must
- item: Proof of a sustained marketing period, normally 6 months, at a realistic asking price on a range
    of terms and in an appropriate format, by an independent qualified assessor (terms agreed with the
    council before submission)
  level: must
confidence: medium
notes: From the council's list (updated April 2024), Part Two (Major and Minor), page 26-27. Loss of a
  community service or facility is in the same section; it is listed as unmapped.
review-status: unverified
field-status: {}
