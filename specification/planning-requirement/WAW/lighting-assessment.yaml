reference: lighting-assessment
local-authority: WAW
required-if:
  condition:
    field: floodlighting
    value: true
    description: The application proposes flood lighting.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policy BE3
source-text: All applications which propose flood lighting
must-include:
- item: Details of external lighting and the hours it would be switched on
  level: must
- item: Layout plan with beam orientation, a schedule of the equipment, and the expected level of luminance
    and glare
  level: must
- item: 'For advertisements: the level of luminance'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For floodlighting of an area (e.g. a sports pitch): a light contour diagram with projected lux
    levels including backlight, superimposed on a topographical survey where ground levels differ'
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 19-20. The list's 'Lighting/Light Pollution Assessment'.
review-status: unverified
field-status: {}
