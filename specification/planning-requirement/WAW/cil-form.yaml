reference: cil-form
local-authority: WAW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 100
      description: Retail development over 100 square metres.
  - all:
    - condition:
        field: housing-type
        value: student
        description: Student housing.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 100
        description: Over 100 square metres.
  - all:
    - condition:
        field: residential-extension
        value: true
        description: A residential extension.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Over 100 square metres.
