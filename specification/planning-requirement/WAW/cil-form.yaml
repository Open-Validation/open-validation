reference: cil-form
local-authority: WAW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates new dwellings.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 100
      description: New retail floorspace exceeding 100 sq m.
  - all:
    - condition:
        field: housing-type
        value: student
        description: Student housing.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 100
        description: Exceeding 100 sq m.
  - all:
    - condition:
        field: residential-extension
        value: true
        description: A residential extension.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Exceeding 100 sq m.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policy DM1; Community Infrastructure Levy Regulations 2010
source-text: 'All applications which: - i. Create new dwellings. ii. Propose either new retail floorspace
  or student housing which exceeds 100 sq. m. in floorspace; or iii. Propose residential extensions which
  exceed 100 sq. m. in floor space'
must-include:
- item: The CIL Additional Information Requirements Form (Form 1)
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  page 13.
review-status: unverified
field-status: {}
