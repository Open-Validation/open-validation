reference: energy-statement
local-authority: WAW
required-if:
  always: true
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Local Plan Policy CC1; Warwick Net Zero Carbon DPD NZC1, NZC2, NZC3
must-include:
- item: Net Zero Carbon DPD policies NZC1 and NZC2
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 square metres or more of non-residential floorspace.
- item: Embodied carbon (NZC3)
  level: must
  required-if:
    ref: major-development
- item: Whole-life carbon assessment
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 5000
        description: 5,000 square metres or more.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s ''Energy / Sustainability Statement'' excerpt is Design
  Statement content. From the audit (item 11): an Energy Statement for all development (Policy CC1), with
  the Net Zero Carbon DPD items above.'
review-status: unverified
field-status: {}
