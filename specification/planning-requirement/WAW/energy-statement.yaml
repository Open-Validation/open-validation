reference: energy-statement
local-authority: WAW
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick Net Zero Carbon Development Plan Document policies NZC1, NZC2(A), NZC2(B), NZC2(C), NZC3
  and NZC4; Warwick District Local Plan policy CC1
source-text: All development Energy Statement to comply with DPD Policy NZC4 by demonstrating a consideration
  to sustainable construction and design in accordance with Local Plan Policy CC1 – Planning for Climate
  Change Adaptation.
must-include:
- item: How the climate change adaptation measures a-d of Policy CC1 have been included, or why not
  level: must
- item: A Low/Zero Carbon assessment of low carbon energy supply options, as alternatives to conventional
    fossil fuel boilers
  level: should
- item: Compliance with DPD Policies NZC1, NZC2(A), NZC2(B), NZC2(C) and NZC4
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development of 1 dwelling or more (C3 or C4).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: New non-residential buildings, hotels (C1) or residential institutions (C2) of 1,000
          sq m or more.
  source-text: a) All new residential developments of 1 dwelling or more (C3 or C4 use) b) All new non-residential
    buildings, hotels (C1 use class) or residential institutions (C2 use class) of 1,000sqm or more floorspace.
    Energy Statement demonstrating compliance with DPD Policies NZC1; NZC2(A); NZC2(B); NZC2(C) & NZC4
- item: Compliance with Policy NZC3 (embodied carbon)
  level: must
  required-if:
    ref: major-development
- item: A whole-life assessment of the materials used
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more new dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 5000
        description: 5,000 sq m or more of new non-residential floorspace.
  source-text: Development of 50 or more new dwellings and/or 5,000sqm or more of new non-residential
    floorspace
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 14-15. The list says 'All development'; it is shown for planning applications. A pro-forma for
  Policy NZC4 is on the council's website.
