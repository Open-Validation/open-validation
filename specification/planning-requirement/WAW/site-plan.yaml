reference: site-plan
local-authority: WAW
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Warwick District
  Local Plan policies BE1 and BE3
source-text: Site/Block Plan. Showing the existing and proposed site at a scale of 1:200 or 1:500.
must-include:
- item: Existing and proposed site at a scale of 1:200 or 1:500
  level: must
- item: The development in relation to the site boundaries and other buildings on the site, with written
    dimensions including those to the boundaries
  level: should
  source-text: 'For all applications the following details will (where appropriate) need to be shown:
    - The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries - All buildings, roads and footpaths
    on land adjoining the site including access arrangements - All Public Rights of Way crossing or adjoining
    the site - The position of all trees on the site, and those on adjacent land and any tree protection
    measures proposed - The extent and type of any hard surfacing - Boundary treatments including walls
    or fencing where this is proposed - position, and window details of the adjoining properties - Parking
    and cycle spaces - Refuse areas'
- item: Buildings, roads and footpaths on adjoining land, including access arrangements, and Public Rights
    of Way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and adjacent land, and any tree protection measures
  level: should
- item: Extent and type of hard surfacing; boundary treatments
  level: should
- item: Position and window details of adjoining properties
  level: should
- item: Parking and cycle spaces; refuse areas
  level: should
- item: 'For a new or amended access: dimensions of access, extent of bound material, visibility splays,
    parking spaces, turning areas and tracking data'
  level: should
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new or amended access.
  source-text: 'Where applications involve a new or amended access the following details will (where appropriate)
    need to be shown: - Dimensions of access - Extent of bound material - Visibility splays - Parking
    spaces - Turning areas - Tracking data'
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 2 (National Validation Requirements)
  and section 3, item 24 (Plans), pages 5, 23. Item 24 asks for an existing and proposed block/site plan
  at 1:500; its details are listed 'where appropriate', so they show as 'should'.
