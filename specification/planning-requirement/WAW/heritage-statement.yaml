reference: heritage-statement
local-authority: WAW
required-if:
  site:
    in:
    - conservation-area
    - listed-building
    - locally-listed-building
    - scheduled-monument
    - park-and-garden
    - battlefield
    - world-heritage-site
    description: Affects a designated heritage asset, e.g. a Conservation Area, Listed Building, Locally
      Listed Building or Scheduled Ancient Monument.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policies HE1, HE2 and HE3
source-text: All development affecting a designated heritage asset, e.g. a Conservation Area, Listed Building,
  Locally Listed Building or Scheduled Ancient Monument
must-include:
- item: A description of the asset and its significance (for a listed building, as a minimum consulting
    the Historic England listing entry and the local historic environment record)
  level: must
- item: An assessment of how the works affect heritage significance, including architectural and historic
    merit or setting
  level: must
- item: The proposed mitigation measures
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  page 17. The list names these as examples; other designated assets are included.
review-status: unverified
field-status: {}
