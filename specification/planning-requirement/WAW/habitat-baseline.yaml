reference: habitat-baseline
local-authority: WAW
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: This is now applicable to all applications for planning permission for “major development”
  (submitted from 12/02/24) and “small site development” (submitted from 02/04/24) made under the Town
  and Country Planning Act 1990, subject to the confirmed exemptions.
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: On-site habitat existing on the date of application (or earlier proposed date), including any
    irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 8-10. Exempt development (including householder applications) is exempt by law.
review-status: unverified
field-status: {}
