reference: noise-assessment
local-authority: WAW
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: A potentially noisy use (for example B2, B8 or some leisure uses) next to existing
        uses.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A vulnerable use (residential) next to an existing noise source.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policy BE3
source-text: All applications which would place a potentially noisy use (for example B2, B8 or some leisure
  uses) next to existing uses or a vulnerable use (residential) next to an existing noise source
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The existing noise environment, the noise sources from or affecting the development, and mitigation
    measures
  level: should
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 20-21. The list's 'Noise/vibration Impact Assessment (and insulation details)'.
review-status: unverified
field-status: {}
