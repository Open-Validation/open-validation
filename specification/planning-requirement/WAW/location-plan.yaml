reference: location-plan
local-authority: WAW
required-if:
  always: true
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site Location Plan. Must be based on an up-to-date OS map (please ensure you have permission
  to use the map). A scale of 1:1250 should be used and the map should show the site and at least two
  named roads. You can purchase a site location plan here. The development site should be edged in red
  with any other land close to or adjoining the site within the same ownership edged in blue. The red
  line should include all land necessary to carry out the development (e.g. access to the site up to the
  adopted highway, landscaping, car parking and open areas).
must-include:
- item: Based on an up-to-date OS map, used with permission
  level: must
- item: At a scale of 1:1250, showing the site and at least two named roads
  level: must
- item: Site edged in red, including all land necessary to carry out the development (e.g. access up to
    the adopted highway, landscaping, car parking and open areas)
  level: must
- item: Any other land close to or adjoining the site in the same ownership edged in blue
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 2 (National Validation Requirements),
  page 5.
