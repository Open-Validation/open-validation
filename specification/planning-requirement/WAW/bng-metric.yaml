reference: bng-metric
local-authority: WAW
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: This is now applicable to all applications for planning permission for “major development”
  (submitted from 12/02/24) and “small site development” (submitted from 02/04/24) made under the Town
  and Country Planning Act 1990, subject to the confirmed exemptions.
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value(s) on the date of application or an earlier proposed date
  level: must
- item: The proposed earlier date and the reasons for it
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant proposes an earlier date.
- item: The completed metric calculation tool showing the pre-development biodiversity value, with the
    publication date of the metric used
  level: must
- item: Statement on whether activities before the date have lost on-site biodiversity value ('degradation');
    if so, the date before them, the value then, the completed metric and any supporting evidence
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 8-10. Householder and other exempt applications are exempt by law; where the condition doesn't
  apply, the applicant gives the reasons in a statement (Article 7 DMPO).
review-status: unverified
field-status: {}
