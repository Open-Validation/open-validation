reference: archaeological-assessment
local-authority: WAW
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: Within, or adjacent to, a Scheduled Monument.
  - site:
      in:
      - listed-building
      description: Associated with a Listed Building.
  - site:
      in:
      - park-and-garden
      - battlefield
      description: Within a Registered Park and Garden or a Registered Historic Battlefield.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.2
      description: The site is larger than 0.2 ha.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.2
      description: The site is larger than 0.2 ha.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policy HE4
source-text: 'All applications where the proposed development: lies within, or adjacent to, a Scheduled
  Monument; is associated with a Listed Building; is located within an area included in the Register of
  Parks and Gardens of special historic interest in England or The English Heritage Register of Historic
  Battlefields, or the proposed development site is larger than 0.2ha in area.'
must-include:
- item: Either a letter from Warwickshire County Council's Archaeological Information and Advice team
    confirming no pre-determination assessment is needed, or a desk-based assessment (and field evaluation
    if necessary) by a registered member of the Chartered Institute for Archaeologists (CIfA)
  level: must
- item: Scope agreed with Warwickshire County Council's Archaeological Information and Advice team in
    advance
  level: should
- item: Informed by the up-to-date Warwickshire County Council Historic Environment Record (not the free
    online version), quoting the unique HER reference number
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 7-8.
review-status: unverified
field-status: {}
