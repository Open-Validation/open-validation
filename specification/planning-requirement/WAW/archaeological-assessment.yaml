reference: archaeological-assessment
local-authority: WAW
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - listed-building
      - park-and-garden
      description: The site includes or affects a scheduled monument, listed building or registered park
        or battlefield.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.2
      description: The site is more than 0.2 hectares.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.2
      description: The site is more than 0.2 hectares.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
source-text: pre- determination archaeological assessment is not necessary, or Provide a desk-based Archaeological
  Assessment and, if necessary, a field evaluation.
