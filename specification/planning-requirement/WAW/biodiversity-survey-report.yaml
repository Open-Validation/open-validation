reference: biodiversity-survey-report
local-authority: WAW
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Likely to affect a protected or nationally, regionally or locally important species.
  - site:
      in:
      - priority-habitat
      description: Likely to affect protected or nationally, regionally or locally important habitats.
  - condition:
      field: geodiversity-interest
      value: true
      description: Likely to affect protected or nationally, regionally or locally important geological
        features.
  - condition:
      field: demolition
      value: true
      description: Full or partial removal of a building within the red line (Preliminary Roost Assessment).
  - condition:
      field: potential-roost-features
      value: true
      description: Works destroying, modifying or intruding into a non-inhabited loft void (Preliminary
        Roost Assessment).
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Garden or woodland habitat with substantial mature trees that may be directly impacted
        (Preliminary Roost Assessment).
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policies NE2 and NE3
source-text: 'All applications which are likely to affect a protected or nationally, regionally or locally
  important species and / or protected or nationally, regionally or locally important habitats or geological
  features. ... A Preliminary Roost Assessment (PRA) carried out by an appropriately licensed surveyor
  will be required for proposals which include the following works: Demolition - Full or partial removal
  of a building within the red line boundary of a planning application. Any works which include the destruction,
  modification of, or intrusion into, a non-inhabited loft void; this includes any remaining sealed loft
  void within a loft space which has already been partially converted. Garden or woodland habitat with
  any substantial mature trees that may be directly impacted by proposed development.'
must-include:
- item: 'For minor and major applications: a Preliminary Ecological Appraisal and any pre-determination
    surveys it generates'
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor application.
- item: 'Where there is ecological land-take: a Biodiversity Impact Assessment showing biodiversity net
    gain and integration with the wider green infrastructure network'
  level: must
  required-if:
    condition:
      field: loss-of-habitat-features
      value: true
      description: The proposal has ecological land-take.
- item: 'PRA: desk study of the local area, its suitability for bats and preferably local bat records'
  level: must
- item: 'PRA: external and internal inspection of the building'
  level: must
- item: 'PRA: description of the building, its condition and any potential roost features and their locations'
  level: must
- item: 'PRA: photographs, where possible'
  level: should
- item: 'PRA: recommendations for further surveys, avoiding harm, mitigation and enhancement for bats'
  level: must
- item: Meets BS 42020:2013 and the CIEEM Technical Guidance Series
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 10-12. The list's 'Preliminary Ecological Appraisal / Preliminary Roost Assessment / Biodiversity
  and Geodiversity Statement'. Follow-on bat surveys may be needed before validation.
review-status: unverified
field-status: {}
