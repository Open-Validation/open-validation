reference: affordable-housing-statement
local-authority: WAW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: Residential development of 11 or more dwellings.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: Residential development with combined gross floor space of more than 1,000 sq m.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policy H2
source-text: Residential development on sites of 11 or more dwellings or where the combined gross floor
  space is more than 1,000sq.m will not be permitted unless provision is made for 40% affordable housing
must-include:
- item: The sizes, types and tenures of the affordable housing and evidence that this meets local need
  level: should
- item: How the affordable housing will be provided to those identified as genuinely in housing need
  level: should
- item: Evidence that the affordable housing meets the definition in terms of tenure, eligibility and
    provider
  level: should
- item: Timescales and deliverability
  level: should
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  page 6. Policy H2 seeks 40% affordable housing.
review-status: unverified
field-status: {}
