reference: design-and-access-statement
local-authority: WAW
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: 'In a designated area: a Conservation Area or property on the World Heritage List.'
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Buildings where the floorspace created is 100 sq m or more.
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Planning (Listed
  Buildings and Conservation Areas) Regulations 1990, regulation 3A
source-text: 'A Design and Access Statement is required in the following circumstances: Development defined
  as ‘major development’1 Applications for Listed Building Consent Development in a designated area2 consisting
  of: o The provision of one or more dwellings o The provision of buildings where the floorspace created
  is 100sq m or more'
must-include:
- item: 'For listed building consent: the design principles and concepts applied and how they take account
    of the building''s special architectural or historic importance, its physical features and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent with external alterations: how access to the building has been dealt
    with'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: External alterations are proposed.
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 2 (National Validation Requirements),
  page 5.
review-status: unverified
field-status: {}
