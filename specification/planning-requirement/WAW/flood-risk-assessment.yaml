reference: flood-risk-assessment
local-authority: WAW
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Land in Flood Zones 2 or 3, including minor development and changes of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 ha of development in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 ha of development in Flood Zone 1.
  - condition:
      field: more-vulnerable-use-change
      value: true
      description: Less than 1 ha in Flood Zone 1 with a change of use to a more vulnerable class, where
        occupation could be affected by sources of flooding other than rivers.
  - site:
      in:
      - critical-drainage-area
      description: An area in Flood Zone 1 with critical drainage problems notified by the Environment
        Agency.
  - site:
      in:
      - future-flood-risk
      description: Land within 'Flood Zones plus Climate Change' (increased future risk of flooding from
        rivers).
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policy FW1
source-text: Land in Flood Zones 2 or 3, including minor development and changes of use. Development of
  more than 1 hectare (ha) of development in Flood Zone 1. Development on land less than 1 ha of in Flood
  Zone 1, including a change of use to a more vulnerable class (e.g. from commercial to residential),
  where the occupation could be affected by sources of flooding other than rivers (e.g. surface water
  drains, canals, reservoirs). An area within Flood Zone 1 which has critical drainage problems as notified
  by the Environment Agency. Land within ‘Flood Zones plus Climate Change’, showing it is at increased
  risk of flooding from rivers in the future.
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  page 16. Including the sequential and exception tests where applicable.
review-status: unverified
field-status: {}
