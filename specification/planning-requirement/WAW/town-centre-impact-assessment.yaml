reference: town-centre-impact-assessment
local-authority: WAW
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Office, retail, meeting, tourism, leisure, cultural or sport development outside the
        town centres identified in the Local Plan.
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Above 500 square metres (2,500 square metres for office development).
    - discretionary
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
source-text: Impact Assessment / Sequential Test Required for all applications for new office, retail,
  meeting, tourism, leisure, cultural and sport development above 500 sq. m. (2,500 sq. m. for office
  development) seeking to place development outside of the town centres as identified within the Local
  Plan. (Outside of the town centre schemes below 500 sq. m. will be considered on a case-by-case basis
  and an assessment may be required)
confidence: low
notes: 'Audit (wrong_trigger): the workbook labelled this a flood sequential test. The rule can''t give
  offices their own 2,500 sq m threshold, so it uses 500 sq m for all uses.'
review-status: unverified
field-status: {}
