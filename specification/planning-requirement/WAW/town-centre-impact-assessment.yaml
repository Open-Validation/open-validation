reference: town-centre-impact-assessment
local-authority: WAW
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside the town centres identified in the Local Plan.
    - any:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: New retail, meeting, tourism, leisure, cultural or sport development above 500
            sq m.
      - condition:
          field: office-floorspace
          operator: '>'
          value: 2500
          description: New office development above 2,500 sq m.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside the town centres.
    - discretionary
source-url: https://www.warwickdc.gov.uk/download/downloads/id/8022/local_validation_checklist.pdf
policy: Warwick District Local Plan policies EC1, TC2, CT1 and CT3
source-text: Required for all applications for new office, retail, meeting, tourism, leisure, cultural
  and sport development above 500 sq. m. (2,500 sq. m. for office development) seeking to place development
  outside of the town centres as identified within the Local Plan. (Outside of the town centre schemes
  below 500 sq. m. will be considered on a case-by-case basis and an assessment may be required)
must-include:
- item: A full sequential test showing there are no sequentially preferable sites within or adjacent to
    (300 m of the defined retail area) town centres
  level: must
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment
  level: must
- item: The impact on town centre vitality and viability, including consumer choice and trade, up to five
    years from the application (ten years for major schemes where the full impact takes longer)
  level: must
- item: Sequential test by a suitably qualified person
  level: should
- item: Evidence that there are no sequentially preferable sites or buildings, and that the facility is
    of a type and scale to primarily serve a local community that can reach it other than by car
  level: must
confidence: medium
notes: From the council's list (adopted May 2018, reviewed May 2026), section 3 (Local Validation Requirements),
  pages 18-19. The list's 'Impact Assessment / Sequential Test'. Schemes below 500 sq m outside town centres
  are 'considered on a case-by-case basis' (discretionary).
review-status: unverified
field-status: {}
