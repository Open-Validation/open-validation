reference: viability-assessment
local-authority: WGN
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The developer does not intend to comply fully with policy on affordable housing and/or
      developer contributions.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
