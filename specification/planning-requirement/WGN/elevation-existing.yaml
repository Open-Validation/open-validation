reference: elevation-existing
local-authority: WGN
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New elevations are proposed.
  - condition:
      field: external-alterations
      value: true
      description: Existing elevations are to be altered.
  - application-type:
      in:
      - advertising
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'EXISTING AND PROPOSED ELEVATIONS are needed where: • New elevations are proposed. • Existing
  elevations are to be altered.'
must-include:
- item: Drawn to a recognised metric scale, normally 1:50 or 1:100
  level: must
- item: Explains the proposal in detail, with the existing buildings and the proposed development, showing
    all sides of the proposal
  level: must
- item: The relationship with adjoining buildings or buildings within 2 metres, with the positions of
    openings on each property
  level: must
- item: Corresponds with the floor plans
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N9 (National Requirements), page 6. Existing elevations
  only where there is an existing building.
review-status: unverified
field-status: {}
