reference: lighting-assessment
local-authority: WGN
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Proposals introducing artificial lighting.
    - any:
      - condition:
          field: adjoins-residential-property
          value: true
          description: Close to residential development.
      - site:
          in:
          - local-wildlife-site
          - site-of-special-scientific-interest
          description: Close to sites of nature conservation value.
      - condition:
          field: protected-species
          value: true
          description: May impact on protected or priority species.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Proposals for illumination or digital screens.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Proposals introducing artificial lighting into any sensitive context, normally close to residential
  development or sites of nature conservation value or which may impact on protected species or priority
  species; Applications for advertisement consent including proposals for illumination or use of digital
  screens.
must-include:
- item: The proposed lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A lighting diagram showing the intensity of illumination
  level: must
- item: A schedule of the equipment
  level: must
confidence: medium
notes: 'From the council''s list (adopted 21 May 2024), L18, page 12, 22. ''Any sensitive context, normally
  close to...'' leaves other contexts to the council: discretionary.'
review-status: unverified
field-status: {}
