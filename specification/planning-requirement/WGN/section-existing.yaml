reference: section-existing
local-authority: WGN
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels, development set at a different ground level from adjoining
        development, or a sloping site.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'N10 Section Drawings and Existing and Proposed Floor and Site Levels ALWAYS NEEDED where:
  • A proposal involves a change in ground levels or involves development set at a different ground level
  than adjoining existing development. • Development is proposed on a sloping site.'
must-include:
- item: Enough sections to show accurately the relationship between land levels and buildings in the existing
    and proposed development
  level: must
- item: Existing and proposed floor and site levels
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N10 (National Requirements), page 7.
review-status: unverified
field-status: {}
