reference: design-and-access-statement
local-authority: WGN
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Creating one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Creating 100 square metres or more of new floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'N11 Design & Access Statement ALWAYS REQUIRED for: • Major development. • Development creating
  one or more dwellings in a Conservation Area. • Any new development creating 100 square metres or more
  of new floorspace in a Conservation Area. • Applications for Listed Building Consent.'
confidence: medium
notes: From the council's list (adopted 21 May 2024), N11 (National Requirements), page 7.
review-status: unverified
field-status: {}
