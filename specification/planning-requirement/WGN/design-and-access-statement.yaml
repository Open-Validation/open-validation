reference: design-and-access-statement
local-authority: WGN
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of new floorspace.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: 'N11 Design & Access Statement ALWAYS REQUIRED for: Major development.'
confidence: medium
notes: 'Audit (wrong_trigger): N11 also lists ''one or more dwellings in a Conservation Area; 100 sqm+
  ... Listed Building Consent applications''.'
review-status: unverified
field-status: {}
