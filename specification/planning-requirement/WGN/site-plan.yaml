reference: site-plan
local-authority: WGN
required-if:
  any:
  - ref: major-development
  - condition:
      field: footprint-increase
      value: true
      description: Commercial / industrial extensions.
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: residential-extension
      value: true
      description: Householder extensions.
  - condition:
      field: parking-change
      value: true
      description: Development which will increase the demand for parking.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: freestanding-advert
        value: true
        description: Adverts which are not fixed to a building.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'N7 Site Plans ALWAYS REQUIRED for: • Major developments. • Commercial / industrial extensions.
  • New buildings. • Householder extensions. • Development which will increase the demand for parking.
  • Adverts which are not fixed to a building.'
must-include:
- item: Separate existing and proposed site plans
  level: must
- item: The direction of North
  level: must
- item: The development in relation to the site boundaries and existing buildings on or next to the site,
    including windows or other openings in neighbouring properties
  level: must
- item: Any buildings or structures to be demolished
  level: must
- item: Roads, footpaths or Public Rights of Way crossing or adjoining the site
  level: must
- item: Existing and proposed access and parking arrangements
  level: must
- item: The position of trees on or next to the site
  level: must
- item: Extent and type of proposed hard surfacing, and whether it is permeable or drains to a permeable
    area within the site
  level: must
- item: Existing or proposed boundary treatments
  level: must
- item: Clearly annotated dimensions
  level: must
  required-if: discretionary
- item: Proposed bin / refuse / recycling storage
  level: must
- item: At a scale of 1:500 or 1:200 (or a scale that shows the site clearly)
  level: must
- item: PDFs in a format that allows accurate digital measurement at the scale shown
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N7 (National Requirements), page 5.
review-status: unverified
field-status: {}
