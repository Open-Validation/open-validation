reference: site-plan
local-authority: WGN
required-if:
  any:
  - ref: major-development
  - condition:
      field: residential-extension
      value: true
      description: Householder extensions.
  - condition:
      field: footprint-increase
      value: true
      description: Commercial or industrial extensions.
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: parking-change
      value: true
      description: Schemes that increase parking demand.
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: '4 N7 Site Plans ALWAYS REQUIRED for: Major developments.'
must-include:
- item: Scale of 1:500 or 1:200 (or a scale that shows the extent of the site and the proposal)
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): N7 Site Plans are ''ALWAYS REQUIRED for'' major developments, householder
  extensions, commercial/industrial extensions, new buildings, schemes that increase parking demand, and
  free-standing adverts (shown as discretion within advertisement consent). The scale is from the council''s
  site plan standards.'
review-status: unverified
field-status: {}
