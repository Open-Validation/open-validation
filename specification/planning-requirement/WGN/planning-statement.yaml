reference: planning-statement
local-authority: WGN
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Departures from the development plan.
  - discretionary
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Major and complex or potentially controversial proposals, including departures from the development
  plan.
must-include:
- item: The context and need for the development and how it accords with national, regional and local
    policy, including SPG and SPDs
  level: must
- item: 'For residential development: a schedule of the dwellings with bedrooms, persons and gross internal
    areas, showing compliance with the Nationally Described Space Standards'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: Consultations with the council and community before submission
  level: should
confidence: medium
notes: From the council's list (adopted 21 May 2024), L23, page 13, 23. 'Complex or potentially controversial'
  proposals are discretionary.
review-status: unverified
field-status: {}
