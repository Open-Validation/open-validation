reference: town-centre-impact-assessment
local-authority: WGN
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses not in an existing (town) centre or in accordance with an up-to-date
        development plan.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Gross floorspace of over 2,500 sqm.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: National Planning Policy Framework
source-text: Impact Assessment required for proposals for main town centre uses development not in an
  existing (town) centre or in accordance with an up-to-date development plan, with a gross floorspace
  of over 2,500 sqm.
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment, and on town centre vitality and viability, including consumer choice and trade
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), L25, page 13, 23. The Sequential Test is in the
  unmapped list.
review-status: unverified
field-status: {}
