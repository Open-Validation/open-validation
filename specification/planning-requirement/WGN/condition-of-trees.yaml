reference: condition-of-trees
local-authority: WGN
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: • Applications for works (including felling, lopping and topping) to trees subject of Tree
  Preservation Order or located within a Conservation Area.
must-include:
- item: A detailed description of the proposed works
  level: must
- item: Labelled digital photographs of the tree(s) with a plan of their location
  level: must
- item: Written advice from an arboricultural expert on the justification for and methodology of the works
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), L30, page 15, 25. 'Tree Works Specification and
  evidence'.
review-status: unverified
field-status: {}
