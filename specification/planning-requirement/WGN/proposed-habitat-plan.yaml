reference: proposed-habitat-plan
local-authority: WGN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Wigan Validation Checklist L4
source-text: Pre- and post-development habitat maps showing areas of habitat retention and loss etc.
must-include:
- item: A post-development habitat map (can be indicative) whose habitat blocks, buildings and infrastructure
    match the other submitted plans
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), L4 (Part Two), page 18. By law householder and other
  exempt applications are exempt, so this follows the biodiversity gain condition. If you think the condition
  does not apply, you must give a statement saying why. Part Two (page 16) asks for evidence that the
  information was prepared by a suitably qualified and experienced ecologist (with Modular River Survey
  accreditation where a watercourse is on or within 10m of the site).
review-status: unverified
