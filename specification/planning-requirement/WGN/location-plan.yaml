reference: location-plan
local-authority: WGN
required-if:
  always: true
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan • Ordnance Survey quality. • At a scale of 1:1,250 unless the size of the site
  dictates that a different scale is necessary. • Show a North point. • Show at least 2 road names where
  possible and sufficient property numbers/names to allow the site location to be clearly identified.
  • Show a red edge around the application site which includes all the land required to carry out the
  development, including any required to connect the development site to a highway. • Show a blue edge
  around any other land the applicant owns or has an interest in.
must-include:
- item: Ordnance Survey quality
  level: must
- item: At a scale of 1:1,250 unless the size of the site needs a different scale
  level: must
- item: A North point
  level: must
- item: At least 2 road names where possible and enough property numbers/names to identify the site clearly
  level: must
- item: Red edge around all land needed for the development, including any needed to connect the site
    to a highway
  level: must
- item: Blue edge around any other land the applicant owns or has an interest in
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N6 (National Requirements), page 4. The national
  list is 'always required'.
review-status: unverified
field-status: {}
