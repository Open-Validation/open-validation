reference: noise-assessment
local-authority: WGN
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals that generate high levels of noise or vibration, such as industrial developments
        using noisy machinery.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Commercial or entertainment uses with externally mounted extraction equipment.
  - all:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Commercial or entertainment uses.
    - condition:
        field: adjoins-residential-property
        value: true
        description: In premises sharing a party wall or ceiling with residential uses.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New noise or vibration sensitive uses (e.g. housing) next to major noise sources such
        as main roads, motorways, railways, industrial and commercial premises (including entertainment
        venues).
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Proposals that generate high levels of noise or vibration such as industrial developments
  using noisy machinery; Proposals for commercial or entertainment uses which involve externally mounted
  extraction equipment; Proposals for commercial or entertainment uses, in premises sharing a party wall
  or ceiling with residential uses; or New noise or vibration sensitive uses (e.g housing) adjacent to
  major sources of noise such as a main road or motorway, railways, industrial and commercial premises
  (including existing entertainment venues).
must-include:
- item: A description of the site and area; the use and its noise emissions; survey details and full results;
    assessment criteria to the relevant British Standard; a subjective description of sources; assessment
    and calculations; construction and demolition phase assessment; conclusions and mitigation
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), L20, page 12, 22.
review-status: unverified
field-status: {}
