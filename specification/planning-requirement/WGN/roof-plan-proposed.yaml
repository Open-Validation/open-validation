reference: roof-plan-proposed
local-authority: WGN
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: A new roof is proposed.
  - condition:
      field: roof-alteration
      value: true
      description: An existing roof is altered.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'ROOF PLANS are needed where: • A new roof is proposed. • An existing roof is altered. 6
  Unless the development is householder development and the roof form is a simple one with one or two
  planes only.'
must-include:
- item: Drawn to a recognised metric scale, normally 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N9 (National Requirements), page 6-7. Not needed
  for householder development with a simple roof of one or two planes.
review-status: unverified
field-status: {}
