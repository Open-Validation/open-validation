reference: biodiversity-survey-report
local-authority: WGN
required-if:
  any:
  - condition:
      field: potential-roost-features
      value: true
      description: Development (including listed building consent and demolition) that could affect roosting
        bats or nesting birds.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: Development that could affect a European, national or locally designated site or other
        sites with important habitats.
  - condition:
      field: protected-species
      value: true
      description: Development that could affect a priority species or a legally protected species and
        its habitat.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Applications for development (including Listed Building Consent applications and demolition)
  that would have the potential to affect roosting bats or nesting birds.
must-include:
- item: Bat and bird surveys by suitably qualified ecologists
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Could affect roosting bats or nesting birds.
- item: An Ecological Appraisal (Extended Phase I Survey); a Phase II survey where the Phase I identified
    habitats of potential nature conservation value
  level: must
  required-if:
    any:
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        - local-wildlife-site
        - priority-habitat
        description: Designated sites or important habitats.
    - condition:
        field: protected-species
        value: true
        description: Priority or protected species.
  source-text: Development that would have the potential to affect a European, national or locally designated
    site or other sites which support important habitats.
confidence: medium
notes: From the council's list (adopted 21 May 2024), L3 Bat and Bird Surveys and L9 Ecological Appraisal
  (Extended Phase I Survey), page 9-10, 17, 20.
review-status: unverified
field-status: {}
