reference: recreation-facilities-assessment
local-authority: WGN
required-if:
  site:
    in:
    - open-space
    description: Development within or incorporating any existing open space, playing fields, sports and
      recreation facilities, bowling greens, allotments etc.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Development within or incorporating any existing area of open space, playing fields, sports
  and recreation facilities, bowling greens, allotments etc.
must-include:
- item: How the open space or facility will be affected, when it was last used and by whom
  level: must
- item: A site plan of the existing facilities and a proposed site plan showing the likely impact
  level: must
- item: Details of any replacement facilities and/or improvements
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), L21, page 12, 22. 'Open Space Assessment'.
review-status: unverified
field-status: {}
