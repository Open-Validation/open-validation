reference: transport-assessment
local-authority: WGN
required-if:
  any:
  - condition:
      field: class-eg-floorspace
      operator: '>='
      value: 500
      description: 'B1 Business (land uses not in Class E(c)): 500 m2 and over.'
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: 'B2 General Industrial: 2,500 m2 and over.'
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 3000
      description: 'B8 Storage and/or Distribution: 3,000 m2 and over.'
  - all:
    - condition:
        field: use-class
        value: C1
        description: C1 Hotels.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 30
        description: 30 bedrooms and over.
  - all:
    - condition:
        field: use-class
        value: C2
        description: C2 Residential Institutions – hospitals, nursing homes.
    - condition:
        field: residential-capacity
        operator: '>='
        value: 30
        description: 30 beds and over.
  - all:
    - condition:
        field: use-class
        value: C2-education
        description: C2 Residential Institutions – education.
    - condition:
        field: residential-capacity
        operator: '>='
        value: 50
        description: 50 students and over.
  - all:
    - condition:
        field: use-class
        value: C2-hostel
        description: C2 Residential Institutions – institutional hostels.
    - condition:
        field: residential-capacity
        operator: '>='
        value: 250
        description: 250 residents and over.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 40
      description: 'C3 Dwelling Houses: 40 dwellings and over.'
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 800
      description: 'E(a) Retail (non-hot food): 800 m2 and over.'
  - all:
    - condition:
        field: use-class
        value: E(b)
        description: E(b) Restaurants/Cafes and Hot Food Takeaway.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 300
        description: 300 m2 and over.
  - all:
    - condition:
        field: use-class
        value: E(c)
        description: E(c) Financial and Professional Services.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 m2 and over.
  - all:
    - condition:
        field: use-class
        value: E(d)
        description: E(d) Indoor Sport and Recreation.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 m2 and over.
  - all:
    - condition:
        field: use-class
        value: F1
        description: F1 School, College and / or University.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 m2 and over.
  - discretionary
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: 'Transport Assessment Development proposals in the following Use Classes with Gross Floor
  Area: • B1 Business (for land uses not included in Class E(c)) - 2,500m2 and over • B2 General Industrial
  - 4,000m2 and over • B8 Storage and/or Distribution 5,000m2 and over • C1 Hotels – 100 bedrooms and
  over • C2 Residential Institutions – hospitals, nursing homes – 50 beds and over • C2 Residential Institutions
  – education – 150 students and over • C2 Residential Institutions – institutional hostels – 400 residents
  and over • C3 Dwelling Houses – 80 dwellings and over • E(a) Retail (non-hot food) - 1,500m2 and over'
must-include:
- item: A Transport Assessment at or above the L26 thresholds; a Transport Statement (a simplified assessment)
    in the L27 ranges
  level: must
- item: The impact on traffic movement and highway safety, access by alternative modes and how they would
    be promoted, and any access or transport improvements
  level: must
- item: 'Major proposals: accessibility by all modes, likely modal split, and measures to improve public
    transport, walking and cycling, reduce parking need and mitigate impacts'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted 21 May 2024), L26 Transport Assessment and L27 Transport Statement,
  page 13-14, 23-24. Transport Statement ranges start at B1 500, B2 2,500, B8 3,000 m2; C1 30 bedrooms;
  C2 30 beds, 50 students, 250 residents; C3 40 dwellings; E(a) 800, E(b) 300, E(c) 1,000, E(d) 500, F1
  500 m2; a Transport Assessment from B1 2,500, B2 4,000, B8 5,000 m2; C1 100 bedrooms; C2 50 beds, 150
  students, 400 residents; C3 80 dwellings; E(a) 1,500, E(b) 2,500, E(c) 2,500, E(d) 1,500, F1 1,000 m2.
  'Mixed use / Sui Generis uses likely to have (significant) transport implications' is discretionary.
review-status: unverified
field-status: {}
