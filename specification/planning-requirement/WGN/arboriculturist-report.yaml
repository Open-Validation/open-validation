reference: arboriculturist-report
local-authority: WGN
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site or on adjacent land (including the highway) that could be affected
      by the development.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: • Where there are trees within the application site or on adjacent land (including the highway)
  that could be affected by the development.
must-include:
- item: Which trees are to be retained and how they will be protected during construction, following BS
    5837
  level: must
- item: Positions of all trees of 75 mm stem diameter at 1.5 metres within the site and adjoining or overhanging
    it
  level: must
- item: Species, height, diameter, Root Protection Area, canopy spread, age class, condition and life
    expectancy of each tree
  level: must
- item: A constraints plan showing RPAs and features such as utility routes and hardstanding
  level: must
- item: Shrub masses and hedges; other features (banks, slopes, walls, fences, water features); existing
    and proposed levels
  level: must
- item: Trees categorised A-C or U under BS 5837, colour coded
  level: must
- item: Undertaken by a suitably qualified arboriculturalist
  level: should
confidence: medium
notes: From the council's list (adopted 21 May 2024), L29, page 14, 24-25. If unsure whether trees are
  affected, submit at least a 1:200 or 1:500 plan showing the development and the trunks and crowns of
  trees within falling distance; the council then decides.
review-status: unverified
field-status: {}
