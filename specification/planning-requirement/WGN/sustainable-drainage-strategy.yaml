reference: sustainable-drainage-strategy
local-authority: WGN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellinghouses.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Dwellinghouses on a site of 0.5 hectares or more.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Buildings creating 1,000 square metres or more of floor space.
  - all:
    - site:
        in:
        - critical-drainage-area
        description: In a Critical Drainage Area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Site of 0.5ha or above.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 0.5
          description: Site of 0.5ha or above.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: The provision of dwellinghouses where — (i)the number of dwellinghouses to be provided is
  10 or more; or (ii)the development is to be carried out on a site having an area of 0.5 hectares or
  more; • the provision of a building or buildings where the floor space to be created by the development
  is 1,000 square metres or more; or • Sites of 0.5ha or above in Critical Drainage Areas
must-include:
- item: The Sustainable Urban Drainage Pro-forma
  level: must
- item: 'Outline (major): a Proof of Concept Plan with location and layout plans, topographical survey
    of the catchment (1 metre contours, flow routes, drains, sewers, watercourses), a plan of Main River
    and surface water flooding, a Flood Risk Assessment, and a drainage strategy (SuDS proposals, infiltration
    results, outfalls, discharge rates, storage, operational maintenance plan)'
  level: must
  required-if:
    application-type:
      in:
      - outline
      - outline-all
      - outline-some
- item: 'Full and reserved matters (major): additionally exceedance flow routes, drainage layout, condition
    survey of drainage assets to be used, design and flow calculations, detailed drawings, cross sections,
    materials, phasing and construction management, construction surface water management plan, inlets/outlets/flow
    controls, operational maintenance plan and a health and safety risk assessment'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (adopted 21 May 2024), L8, page 10, 19-20. 'Sustainable Drainage Strategy
  (including Sustainable Urban Drainage Pro-forma)'.
review-status: unverified
field-status: {}
