reference: land-contamination-assessment
local-authority: WGN
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Known or suspected contamination.
  - site:
      in:
      - near-landfill-site
      description: Development within 250m of a known landfill site.
  - all:
    - ref: major-development
    - condition:
        field: sensitive-end-use
        value: true
        description: A sensitive end use.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
confidence: medium
notes: 'From the audit (missing_requirement): L16 Land Contamination Assessment.'
review-status: unverified
field-status: {}
