reference: land-contamination-assessment
local-authority: WGN
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Sites where contamination is known or suspected due to a previous use or an offsite
        source.
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development (below the major development thresholds).
    - site:
        in:
        - near-landfill-site
        description: Within 250m of a known landfill site.
  - all:
    - ref: major-development
    - condition:
        field: sensitive-end-use
        value: true
        description: A sensitive end use.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Development on sites where contamination is known or suspected due to a previous use or an
  offsite source; • Minor or major development within 250m of a known landfill site; • Major developments
  of a sensitive end use.
must-include:
- item: A stage 1 preliminary risk assessment
  level: must
- item: 'Where contamination is known or suspected or the use is particularly vulnerable: a desk study,
    site walk-over and conceptual model (sources, pathways, receptors) as a basis for assessing risks
    and remediation options'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 21 May 2024), L16, page 11, 21.
review-status: unverified
field-status: {}
