reference: energy-statement
local-authority: WGN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellinghouses.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Dwellinghouses on a site of 0.5 hectares or more.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Buildings creating 1,000 square metres or more of floor space.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Places for Everyone Policy JP-S2
source-text: The provision of dwellinghouses where — (Energy and Climate Change (i) The number of dwellinghouses
  to be Adaptation Statement) provided is 10 or more; or (ii) The development is to be carried out on
  a site having an area of 0.5 hectares or more; or (iii) The provision of a building or buildings where
  the floor space to be created by the development is 1,000 square metres or more.
must-include:
- item: The measures the developer will take to reduce gross CO2 emissions as required by Places for Everyone
    policy JP-S2
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), L5, page 9, 18. 'Carbon Reduction Strategy (Energy
  and Climate Change Adaptation Statement)'. The quote keeps the table's interleaved column text as extracted.
review-status: unverified
field-status: {}
