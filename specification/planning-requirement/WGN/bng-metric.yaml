reference: bng-metric
local-authority: WGN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development will be subject to the general biodiversity gain condition.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: 'N13 Biodiversity Net Gain The following details are ALWAYS REQUIRED where development will
  be subject to the general biodiversity gain condition, as set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015: A statement as to whether the applicant
  believes that planning permission, if granted, would be subject to the biodiversity gain condition;'
must-include:
- item: A statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: Evidence that the information has been prepared by a suitably qualified and experienced ecologist
  level: must
