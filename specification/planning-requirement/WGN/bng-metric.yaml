reference: bng-metric
local-authority: WGN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The pre-development biodiversity value of the on-site habitat on the date of application
  (or an earlier date) including the completed metric calculation tool used showing the calculations,
  the publication date and version of the biodiversity metric used to calculate that value;
must-include:
- item: A statement whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: The completed metric calculation tool showing the calculations, with the publication date and
    version of the metric
  level: must
- item: The earlier date and the reasons for it, if an earlier date is used
  level: must
  required-if: discretionary
- item: A statement on whether the value is lower because of degradation, with supporting evidence
  level: must
- item: A description of any irreplaceable habitat
  level: must
- item: 'Local: the metric with the habitat loss, creation and/or enhancement tabs filled out (off-site
    tabs not needed yet); a 10% gain need not be shown at this stage'
  level: must
- item: 'Local: a written BNG Statement or draft Biodiversity Gain Plan covering the mitigation hierarchy,
    trading summary, irreplaceable habitat impacts, extra on-site measures and any off-site compensation
    (including statutory credits)'
  level: must
  source-text: Where development will be subject to the general biodiversity gain condition as set out
    in Article 7 of The Town and Country Planning (Development Management Procedure) (England) Order 2015.
- item: Prepared by a suitably qualified and experienced ecologist, with evidence of this
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N13 and L4, page 7-8, 9, 16-18. By law householder
  and other exempt applications are exempt, so this follows the biodiversity gain condition. If you think
  the condition does not apply, you must give a statement saying why. Part Two (page 16) asks for evidence
  that the information was prepared by a suitably qualified and experienced ecologist (with Modular River
  Survey accreditation where a watercourse is on or within 10m of the site).
review-status: unverified
field-status: {}
