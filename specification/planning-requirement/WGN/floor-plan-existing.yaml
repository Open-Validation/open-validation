reference: floor-plan-existing
local-authority: WGN
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: New floor space is proposed.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change in the use of floor space is proposed.
  - application-type:
      in:
      - advertising
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'EXISTING AND PROPOSED FLOOR PLANS are needed for: • Applications where new floor space is
  proposed. • Applications where a change in the use of floor space is proposed. • Advertisement applications
  to show the position of the proposed advert.'
must-include:
- item: Drawn to a recognised metric scale, normally 1:50 or 1:100
  level: must
- item: Explains the proposal in detail, with the existing buildings and the proposed development
  level: must
- item: The development in context with adjacent buildings (with property numbers where appropriate)
  level: must
- item: Corresponds with the elevations
  level: must
- item: 'Advertisements: the position of the proposed advert'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (adopted 21 May 2024), N8 (National Requirements), page 6.
review-status: unverified
field-status: {}
