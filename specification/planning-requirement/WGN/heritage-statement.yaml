reference: heritage-statement
local-authority: WGN
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: Development that impacts on a designated heritage asset (listed buildings, conservation
        areas, scheduled ancient monuments, historic parks and gardens) or its setting.
  - site:
      in:
      - locally-listed-building
      description: Development that directly impacts on a non-designated heritage asset.
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Disturbance of ground.
    - site:
        in:
        - historic-environment-record
        description: Within an area of archaeological interest or potential.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: Where development impacts upon a designated heritage asset or its setting. A designated heritage
  asset includes listed buildings, conservation areas, scheduled ancient monuments and historic parks
  and gardens (nationally and locally listed); • Where development directly impacts upon a non-designated
  heritage asset; or • Proposals involving the disturbance of ground within an area of archaeological
  interest or potential. A separate Archaeological Assessment may be required where the impacts will be
  significant.
must-include:
- item: 'Listed building consent: a schedule of works (with photographs and plans as appropriate), the
    building''s values and setting, its significance, and the impact of the works on its character, significance
    and setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Within or next to a conservation area: the significance of the area, the character and appearance
    of the building, the impact on the area''s special character, and for demolition its justification
    and impact'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
- item: 'Designated assets: the degree of harm and any public benefits put forward'
  level: must
- item: 'Non-designated assets: their significance and the scale of any harm or loss'
  level: must
  required-if:
    site:
      in:
      - locally-listed-building
      description: Non-designated heritage asset.
- item: 'Archaeological interest: an assessment of existing archaeological information'
  level: must
  required-if:
    site:
      in:
      - historic-environment-record
      description: Area of archaeological interest or potential.
confidence: medium
notes: From the council's list (adopted 21 May 2024), L15, page 11, 21. 'Heritage Assessment'. Part Two
  describes the contents as a guide to what 'may be required'.
review-status: unverified
field-status: {}
