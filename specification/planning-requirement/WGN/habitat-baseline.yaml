reference: habitat-baseline
local-authority: WGN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A plan, drawn to an identified scale which must show the direction of North, showing onsite
  habitat existing on the date of application (or an earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale, showing the direction of North
  level: must
- item: Onsite habitat on the date of application (or earlier date), including any irreplaceable habitat
  level: must
- item: 'Local: raw baseline habitat data in UKHab survey format, with condition assessment data (may
    be in a Preliminary Ecological Appraisal or a separate habitat report)'
  level: must
- item: 'Local: a pre-development habitat map showing areas of retention and loss, consistent with the
    layout plans'
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N13 and L4, page 8, 18. By law householder and other
  exempt applications are exempt, so this follows the biodiversity gain condition. If you think the condition
  does not apply, you must give a statement saying why. Part Two (page 16) asks for evidence that the
  information was prepared by a suitably qualified and experienced ecologist (with Modular River Survey
  accreditation where a watercourse is on or within 10m of the site).
review-status: unverified
field-status: {}
