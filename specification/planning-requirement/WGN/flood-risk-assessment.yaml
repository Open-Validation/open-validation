reference: flood-risk-assessment
local-authority: WGN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3, including minor extensions and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: A change of use to a more vulnerable class.
    - site:
        in:
        - surface-water-flood-risk
        description: Could be affected by sources of flooding other than rivers and the sea (e.g. surface
          water drains, reservoirs).
  - all:
    - site:
        in:
        - critical-drainage-area
        description: In a Critical Drainage Area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: Site over 0.5 hectares.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.5
          description: Site over 0.5 hectares.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Wigan Core Strategy Policy CP16
source-text: 'Development proposals: • In flood zone 2 or 3, including minor extensions and change of
  use; • More than 1 hectare in flood zone 1; • Less than 1 hectare in flood zone 1, including a change
  of use in development type to a more vulnerable class where they could be affected by sources of flooding
  other than rivers and the sea (for example surface water drains, reservoirs); or • On a site over 0.5
  hectares in size in Critical Drainage Areas.'
must-include:
- item: Identifies and assesses flood risk to property and people now and with climate change, and how
    risks from all sources will be managed
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: Evidence on the Sequential Test and Exception Test
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 21 May 2024), L12, page 11, 20. The sequential and exception tests
  are needed 'where necessary' (discretionary).
review-status: unverified
field-status: {}
