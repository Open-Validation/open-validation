reference: flood-risk-assessment
local-authority: WGN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3, including minor extensions and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Sites over 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Sites over 1 hectare in Flood Zone 1.
  - all:
    - site:
        in:
        - critical-drainage-area
        description: The site is in a Critical Drainage Area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: Over 0.5 hectares.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.5
          description: Over 0.5 hectares.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
