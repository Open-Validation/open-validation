reference: travel-plan
local-authority: WGN
required-if:
  any:
  - condition:
      field: class-eg-floorspace
      operator: '>='
      value: 2500
      description: 'B1 Business (land uses not in Class E(c)): 2,500 m2 and over.'
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 4000
      description: 'B2 General Industrial: 4,000 m2 and over.'
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 5000
      description: 'B8 Storage and/or Distribution: 5,000 m2 and over.'
  - all:
    - condition:
        field: use-class
        value: C1
        description: C1 Hotels.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 100
        description: 100 bedrooms and over.
  - all:
    - condition:
        field: use-class
        value: C2
        description: C2 Residential Institutions – hospitals, nursing homes.
    - condition:
        field: residential-capacity
        operator: '>='
        value: 50
        description: 50 beds and over.
  - all:
    - condition:
        field: use-class
        value: C2-education
        description: C2 Residential Institutions – education.
    - condition:
        field: residential-capacity
        operator: '>='
        value: 150
        description: 150 students and over.
  - all:
    - condition:
        field: use-class
        value: C2-hostel
        description: C2 Residential Institutions – institutional hostels.
    - condition:
        field: residential-capacity
        operator: '>='
        value: 400
        description: 400 residents and over.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 80
      description: 'C3 Dwelling Houses: 80 dwellings and over.'
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 1500
      description: 'E(a) Retail (non-hot food): 1,500 m2 and over.'
  - all:
    - condition:
        field: use-class
        value: E(b)
        description: E(b) Restaurants/Cafes and Hot Food Takeaway.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 2500
        description: 2,500 m2 and over.
  - all:
    - condition:
        field: use-class
        value: E(c)
        description: E(c) Financial and Professional Services.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 2500
        description: 2,500 m2 and over.
  - all:
    - condition:
        field: use-class
        value: E(d)
        description: E(d) Indoor Sport and Recreation.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1500
        description: 1,500 m2 and over.
  - all:
    - condition:
        field: use-class
        value: F1
        description: F1 School, College and / or University.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 m2 and over.
  - discretionary
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
source-text: • Development requiring a Transport Assessment as set out above
must-include:
- item: 'An implementation strategy: the site travel plan coordinator, management arrangements and timetable'
  level: must
- item: Activities to market and promote sustainable transport to occupiers, users, visitors and residents
  level: must
- item: Takes account of the Council's Travel Plans SPD
  level: should
- item: 'Commercial development: completed using the Greater Manchester Travel Plan Toolkit (TfGM)'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Commercial development.
confidence: medium
notes: From the council's list (adopted 21 May 2024), L28, page 14, 24. Follows the Transport Assessment
  thresholds (L26).
review-status: unverified
field-status: {}
