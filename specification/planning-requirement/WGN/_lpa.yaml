validation-list:
  url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
  date: '2024-05-21'
  date-basis: 'cover: ''Validation Checklist for Planning Applications Adopted 21st May 2024''. On 2026-11-06
    it is still the only ''Validation checklist'' linked from the council''s Apply for planning permission
    page (https://www.wigan.gov.uk/Resident/Planning-and-Building-Control/Planning/Apply.aspx) and About
    the application process page; no newer list, consultation or adoption notice was found. Adopted more
    than two years before 2026-11-05, so outdated, though still the council''s current checklist.'
  status: outdated
submission-standards:
- item: 'Electronic submissions: files in PDF format'
  level: must
- item: Files no larger than 10MB each; split larger files so they stay legible (larger files accepted
    only alongside a compliant version)
  level: must
- item: File names include the drawing / document number (with revision) and signify the content, e.g.
    '12456 Rev A_Site Plan'
  level: should
- item: All plans to scale, with an accurate scale bar (and a numerical scale) and/or measurements or
    dimensions
  level: must
- item: PDF plans in a format that allows accurate digital measurement at the scale indicated (check after
    converting from CAD)
  level: must
- item: 'If pre-application advice was sought: a copy of the advice and any additional information the
    council asked for'
  level: must
- item: If information required by the checklist is not provided (and not agreed at pre-application),
    the reasons given as a validation dispute under Article 12 of the DMPO
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current Wigan validation checklist (adopted 21 May 2024, linked from
    the Apply page), but its list date is off by 20 days. The extraction misses about 11 local requirements
    (e.g. Air Quality, Bat/Bird, Ecology, Green Belt, Contamination, Noise, Transport Assessment). Many
    triggers are garbled or cut off, and several application types are wrongly marked as having no local
    requirements. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
