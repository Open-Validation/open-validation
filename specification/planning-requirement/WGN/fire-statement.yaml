reference: fire-statement
local-authority: WGN
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.wigan.gov.uk/Docs/PDF/Resident/Planning-and-Building-Control/LocalValidationList30kb.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Development for, or relating to, buildings of 18 metres or more in height or containing 7
  or more storeys; and including two or more dwellings or educational accommodation.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety for each building; site layout; emergency
    vehicle access and water supplies; fire safety consultation; and how local fire safety policies have
    been taken into account
  level: must
confidence: medium
notes: From the council's list (adopted 21 May 2024), N12 (National Requirements), page 7, 16.
review-status: unverified
field-status: {}
