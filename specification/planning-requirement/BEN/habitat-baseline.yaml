reference: habitat-baseline
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Environment Act 2021; Town and Country Planning Act 1990, Schedule 7A
source-text: 'From February 2024: All major applications except those eligible for an exemption From April
  2024: All applications except those eligible for an exemption'
must-include:
- item: A plan drawn to an identified scale showing the direction of North, showing the onsite habitat
    existing on the date of application (or an earlier date), including any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 1; Reserved
  Matters checklist page 1; 'Further information on requirements' page 1. It is on the full/outline/TDC
  and reserved matters checklists, not the householder one. The list says 'All applications except those
  eligible for an exemption'; householder and other exempt applications are exempt from the biodiversity
  gain condition by law, so the rule follows the law.
review-status: unverified
field-status: {}
