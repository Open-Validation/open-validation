reference: biodiversity-survey-report
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Development with the potential to affect designated environmentally important sites.
    - condition:
        field: protected-species
        value: true
        description: A reasonable likelihood of a protected species being present.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: Where development has the potential to affect designated environmentally important sites
  or where there is a reasonable likelihood of a protected species being present.
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: should
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published 2024, undated), Full/Outline/TDC checklist page 4; Householder
  checklist page 2; Reserved Matters checklist page 4; ''Further information on requirements'' page 9.
  It is on all three checklists (householder, full/outline/TDC and reserved matters). Listed as ''Ecological
  survey and impact assessment, protected species survey'' (householder and reserved matters: ''Ecological
  assessment / protected species survey''). The guidance names SSSIs, Sites of Importance for Nature Conservation
  and Wildlife Corridors.'
