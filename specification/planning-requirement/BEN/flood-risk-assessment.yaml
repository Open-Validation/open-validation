reference: flood-risk-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Proposals in Flood Zone 2 or 3, including minor development and change of use.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development areas of 1 hectare or greater in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development areas of 1 hectare or greater in Flood Zone 1.
    - site:
        in:
        - critical-drainage-area
        description: Areas with critical drainage problems as designated by the Environment Agency.
    - discretionary
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: 'A Flood Risk Assessment (FRA) should be provided with a planning application for developments
  in the following circumstances: • Proposals in Flood Zone 2 or 3, including Minor Development and Change
  of Use. • Proposals for development areas that are 1 hectare or greater in Flood Zone 1. • New proposals,
  or a Change of Use in development type to a more vulnerable class, where the proposed development could
  be affected by sources of flooding other than rivers and the sea. • Proposals within areas with critical
  drainage problems as designated by the EA'
must-include:
- item: Follows the checklist of what to include in an FRA in the Joint West London Level 1 Strategic
    Flood Risk Assessment
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 5; Householder
  checklist page 2; Reserved Matters checklist page 4; 'Further information on requirements' page 10.
  It is on all three checklists (householder, full/outline/TDC and reserved matters). Includes the sequential
  and exception tests where relevant. Proposals that 'could be affected by sources of flooding other than
  rivers and the sea' show as discretionary.
review-status: unverified
field-status: {}
