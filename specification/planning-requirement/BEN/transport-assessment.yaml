reference: transport-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - any:
    - ref: major-development
    - condition:
        field: large-minor-development
        value: true
        description: Large-scale minor development (Transport Statement).
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: For all major developments ... Largescale minor developments
must-include:
- item: 'For major proposals: accessibility to the site by all modes of transport and the likely modal
    split of journeys'
  level: must
  required-if:
    ref: major-development
- item: Measures to improve access by public transport, walking and cycling, to reduce parking need and
    to mitigate transport impacts
  level: should
- item: How the proposal supports the ten Healthy Streets Indicators in line with TfL guidance
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 7-8; 'Further
  information on requirements' page 15. It is only on the full/outline/TDC checklist. A Transport Assessment
  (including a Travel Plan) for all major developments; a Transport Statement for large-scale minor developments.
review-status: unverified
field-status: {}
