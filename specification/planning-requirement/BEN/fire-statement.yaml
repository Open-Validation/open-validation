reference: fire-statement
local-authority: BEN
required-if:
  application-type:
    in:
    - full
    - outline
    - technical-details-consent
    - reserved-matters
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  London Plan policies D12A and D12B
source-text: 'Required for all applications that involve: • The provision of one or more “relevant buildings”;
  • Development of an existing “relevant building”; or • Development within the curtilage of a “relevant
  building. ... Fire Statement (London Plan) For all major developments ... All non-major applications
  for planning permission, permission in principle or technical details consent'
must-include:
- item: Gateway One fire statement for development involving, or in the curtilage of, a 'relevant building'
    (outline applications excluded)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
- item: 'Major development: a Fire Statement produced in accordance with the Mayor of London''s fire safety
    guidance, showing the highest standard of fire safety under London Plan policies D12A and D12B'
  level: must
  required-if:
    ref: major-development
- item: 'Non-major development: a Planning Fire Safety Strategy or Reasonable Exception Statement produced
    in accordance with the Mayor of London''s fire safety guidance (London Plan policy D12A)'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Non-major development.
confidence: medium
notes: 'From the council''s list (published 2024, undated), Full/Outline/TDC checklist page 2, 5, 6; Reserved
  Matters checklist page 2, 4, 5; ''Further information on requirements'' page 2, 10, 12. It is on the
  full/outline/TDC and reserved matters checklists, not the householder one. Brent lists three fire documents:
  the national Gateway One fire statement (relevant buildings: 2 or more dwellings or educational accommodation,
  and 18 metres or more or 7 or more storeys; excluding outline applications on the full list), the London
  Plan Fire Statement for all major developments, and the Planning Fire Safety Strategy or Reasonable
  Exception Statement for all non-major applications. Together they cover every application on these checklists,
  so they are combined here.'
review-status: unverified
field-status: {}
