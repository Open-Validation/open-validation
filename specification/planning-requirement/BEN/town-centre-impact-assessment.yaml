reference: town-centre-impact-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - all:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 500
        description: 500 sqm gross retail floorspace or above.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside of town centres.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Does not accord with the Local Plan.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: Proposals involving 500 sqm gross retail floorspace or above, which are outside of town centres
  and do not accord with the Local Plan,
must-include:
- item: All in-centre and edge of centre options assessed for availability, suitability and viability,
    showing the proposal cannot reasonably be accommodated there
  level: must
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on town centre vitality and viability, including local consumer choice and trade, up to
    five years from the application (up to ten years for major schemes whose full impact will not be realised
    in five)
  level: must
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 7; 'Further
  information on requirements' page 13. It is only on the full/outline/TDC checklist. Listed as 'Retail
  Impact Assessment'.
review-status: unverified
field-status: {}
