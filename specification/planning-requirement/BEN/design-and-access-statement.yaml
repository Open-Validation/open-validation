reference: design-and-access-statement
local-authority: BEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - technical-details-consent
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: Within a Conservation Area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings where the floorspace created is 100 square metres or
                more.
  - application-type:
      in:
      - lbc
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'When required – any application for: • Major developments • Listed Building Consent • one
  or more dwellings or a building or buildings where the floorspace created is 100 square meters or more
  within a Conservation Area But it is not required for: • Section 73 applications • Material change of
  use of land or buildings'
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 1; Reserved
  Matters checklist page 1; 'Further information on requirements' page 1-2. It is on the full/outline/TDC
  and reserved matters checklists, not the householder one. Not required for Section 73 applications or
  a material change of use. Brent publishes no listed building consent checklist, but this row names Listed
  Building Consent, so lbc is included. The guidance says the level of detail should be proportionate
  to the complexity of the application.
review-status: unverified
field-status: {}
