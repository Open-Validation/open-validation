reference: air-quality-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: London Plan policy SI1; Brent Local Plan policy BSUI2
source-text: Where the proposed development includes new uses or buildings that have the potential to
  generate air pollution or where a sensitive use is proposed in close proximity to an existing source
  of air pollution ... All major developments outside of Growth Areas and Air Quality Focus Areas ...
  All major developments within Growth Areas and Air Quality Focus Areas
must-include:
- item: Assessment of existing air quality in the area
  level: must
- item: Potential pollutant sources from the development during construction and operation, the pollutants
    that may be emitted and the objectives they may impinge on
  level: must
- item: Assessment of their impact, with concentrations predicted at suitable receptor locations, comparing
    with and without development for the first year of occupation
  level: must
- item: Measures to mitigate and minimise impacts, incorporated into the building design
  level: must
- item: 'Major development: an Air Quality Neutral Assessment (outside Growth Areas and Air Quality Focus
    Areas) or an Air Quality Positive Assessment (within them), written to GLA guidance with emissions
    for buildings and transport'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 3; Reserved
  Matters checklist page 3; 'Further information on requirements' page 6. It is on the full/outline/TDC
  and reserved matters checklists, not the householder one. Combines the Air Quality Assessment (whose
  trigger, 'potential to generate air pollution' or a sensitive use 'in close proximity' to a source,
  needs judgement, so it shows as discretionary) with the Air Quality Neutral and Air Quality Positive
  Assessments, which between them are required for all major developments.
review-status: unverified
field-status: {}
