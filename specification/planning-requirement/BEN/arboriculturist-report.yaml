reference: arboriculturist-report
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Tree pruning or removal, or demolition, building or engineering works that may affect
        trees on the site or on adjoining land.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: Required for applications that involve the pruning or removal of existing trees and for the
  carrying out of demolition, building or engineering operations (including the excavation of foundations,
  construction of basements, any changes of level and service/utility runs) where these may affect trees
  both on site or on adjoining land.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Plan showing the trees' position and number, stating diameter and species, and whether each tree
    or hedge is for removal, pruning or protection
  level: should
- item: Prepared by a qualified arboriculturist in accordance with BS 5837
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
- item: 'Where trees would be removed or harmed: adequate replacement based on the value of the trees
    lost, using a valuation system such as i-Tree or CAVAT'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 8; Householder
  checklist page 4; Reserved Matters checklist page 6; 'Further information on requirements' page 15.
  It is on all three checklists (householder, full/outline/TDC and reserved matters). Listed as 'Tree
  survey / arboricultural impact assessment / arboricultural method statement'. The BS 5837 item applies
  to major developments or 'where significant impact is occurring', which shows as discretionary.
review-status: unverified
field-status: {}
