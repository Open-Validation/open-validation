reference: planning-statement
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: Development that is not in accordance with the development plan.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: For all major developments and for any development that is not in accordance with the development
  plan.
must-include:
- item: An assessment of how the proposed development accords with relevant national, regional and local
    planning policies
  level: must
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 6; Reserved
  Matters checklist page 5; 'Further information on requirements' page 12. It is on the full/outline/TDC
  and reserved matters checklists, not the householder one.
review-status: unverified
field-status: {}
