reference: heritage-statement
local-authority: BEN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - technical-details-consent
        - reserved-matters
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - article-4-direction-area
        - locally-listed-building
        description: Affects a listed building (including its setting), is in a Conservation Area, is
          works covered by an Article 4 Direction, or affects a locally listed building.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: • Applications for Listed Building Consent; • Householder & Full applications affecting Listed
  Buildings (including their setting) and sites/properties within Conservation Areas; • Applications for
  works covered by an Article 4 Direction; • Applications for works to buildings which are Locally Listed;
  and • Any new development within a Conservation Area.
must-include:
- item: Describes the significance of any heritage assets affected, including any contribution from their
    setting
  level: must
- item: The impact of the proposal on their significance, with detail reflecting the importance of the
    asset
  level: must
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 5; Householder
  checklist page 2; Reserved Matters checklist page 4; 'Further information on requirements' page 10-11.
  It is on all three checklists (householder, full/outline/TDC and reserved matters).
review-status: unverified
field-status: {}
