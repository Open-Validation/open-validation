reference: sustainable-drainage-strategy
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - ref: major-development
    - all:
      - application-type:
          in:
          - full
          - outline
          - technical-details-consent
      - condition:
          field: drainage-alterations
          value: true
          description: Minor development or change of use that would impact on the current drainage regime.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Brent Local Plan policy BSUI4; London Plan policy SI13
source-text: A Drainage Strategy is required for all Major developments and for all Minor developments
  and changes of use that would impact on the current drainage regime in accordance with Brent Policy
  BSUI4 and London Plan policy SI13. ... Sustainable Urban Drainage Strategy All major developments.
must-include:
- item: Demonstrates compliance with Brent policy BSUI4 and London Plan policy SI13, aiming for greenfield
    run-off rates and managing surface water close to its source in line with the drainage hierarchy
  level: should
- item: Accompanied by the Sustainable Drainage Proforma
  level: should
- item: 'Major development: shows the Mayor of London drainage hierarchy has been followed and the feasibility
    of each stage, using the West London SFRA Drainage Strategy Submission checklist; any failure to meet
    greenfield run-off rates justified'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 4, 7; Reserved
  Matters checklist page 6; 'Further information on requirements' page 8, 14-15. It is on the full/outline/TDC
  and reserved matters checklists, not the householder one. Combines the 'Drainage Strategy' and the 'Sustainable
  Urban Drainage Strategy'. The reserved matters checklist has only the Sustainable Urban Drainage Strategy
  (all major developments).
review-status: unverified
field-status: {}
