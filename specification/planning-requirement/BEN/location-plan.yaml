reference: location-plan
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - always: true
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Based on an up-to-date map
  level: should
- item: Scale typically 1:1250 or 1:2500, scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly in red, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: Blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 1; Householder
  checklist page 1; Reserved Matters checklist page 1; 'Further information on requirements' page 1. It
  is on all three checklists (householder, full/outline/TDC and reserved matters). The guidance note words
  every item as 'should'.
review-status: unverified
field-status: {}
