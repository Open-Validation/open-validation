reference: noise-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - condition:
        field: plant-equipment
        value: true
        description: New plant or machinery with the potential to impact upon sensitive uses.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A sensitive use proposed in close proximity to a noise or vibration source.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: Where the proposed development includes new plant or machinery and has the potential to impact
  upon sensitive uses or where a sensitive use is proposed in close proximity to a noise or vibration
  source
must-include:
- item: Existing background noise/vibration level over a 24 hour period, reflecting typical and worst
    case noise environments
  level: must
- item: Predicted noise/vibration levels
  level: must
- item: Any acoustic mitigation required to meet the required levels or provide the necessary protection
  level: must
- item: Undertaken by a suitably qualified acoustician
  level: must
- item: Refers to relevant British Standards and World Health Organisation (WHO) guidelines
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 6; Householder
  checklist page 3; Reserved Matters checklist page 5; 'Further information on requirements' page 12.
  It is on all three checklists (householder, full/outline/TDC and reserved matters). Listed as 'Noise
  and/or vibration impact assessment'. The separate 'Noise Management Plan' is sent to unmapped.
review-status: unverified
field-status: {}
