reference: viability-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The scheme does not comply with the Fast Track Route (London Plan policy H5 with
          Brent's tenure split).
    - condition:
        field: housing-type
        value: shared
        description: Large-scale purpose-built shared living (London Plan policy H16).
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/further-information-on-validation-requirements.pdf?rev=ee5d67d65830420e925ba79e68ee43f7
policy: London Plan policies H5 and H16; Brent Local Plan policies BH5 and H15; Mayor's Affordable Housing
  and Viability SPG
source-text: Schemes which do not do not comply with the Fast Track Route and proposals for large-scale
  purpose-built shared living development (in accordance with London Plan policy H16) are required to
  be accompanied by a Financial Viability Assessment (FVA)
must-include:
- item: Carried out in accordance with the Mayor's Affordable Housing and Viability SPG
  level: must
- item: Supporting financial assumptions including land value; build, infrastructure and abnormal costs;
    residential and commercial values; developer profit; affordable housing assumptions; fees; finance
    costs; contingencies; planning obligations; Brent and Mayoral CIL; phasing and sales periods; growth
    assumptions and sensitivity analysis
  level: must
- item: A fully working, testable and editable electronic model showing the calculations and assumptions
  level: should
- item: 'Where information is claimed to be sensitive: an ''Affordable Housing Viability Information –
    Exceptional Circumstances'' statement justifying what should be withheld'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 2024, undated), 'Further information on requirements' page 4-6.
  From the guidance note under 'Affordable Housing Statement' (Financial Viability Appraisal – Viability
  Tested Route). The applicant underwrites the council's (and GLA's) costs of an independent review.
review-status: unverified
field-status: {}
