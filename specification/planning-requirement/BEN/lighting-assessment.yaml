reference: lighting-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting.
    - any:
      - discretionary
      - condition:
          field: protected-species
          value: true
          description: External lighting has the potential to affect protected species.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: Where proposals include significant external lighting, or where external lighting has the
  potential to affect protected species
must-include:
- item: Details of external lighting and the proposed hours the lighting would be switched on
  level: must
- item: Layout plan with beam orientation, horizontal and vertical illumination including light levels,
    and a schedule of the equipment
  level: must
- item: Compliance with the ILP 'Guidance notes for the reduction of obtrusive light GN01:2011'
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 5; Reserved
  Matters checklist page 5; 'Further information on requirements' page 11. It is on the full/outline/TDC
  and reserved matters checklists, not the householder one. Listed as 'Lighting assessment and light contour
  map'. 'Significant' external lighting is not defined, so that part shows as discretionary.
review-status: unverified
field-status: {}
