submission-standards:
- item: If any required information is not included, a written justification of why it is not required
    (the application is made invalid if the council disagrees)
  level: must
- item: Applications submitted online via the Planning Portal; if posted, 2 hard copies of all application
    documents
  level: should
- item: All plans and drawings have a scale bar and an indication of North
  level: must
- item: The scale on each plan states the paper size at which it applies, e.g. 1:100 at A3
  level: must
- item: Drawing files named '[drawing number] [drawing name].pdf', with the same text as the file description
  level: should
- item: Supporting reports named as in the validation list, followed by the site address
  level: should
