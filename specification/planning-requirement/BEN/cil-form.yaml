  It is on all three checklists (householder, full/outline/TDC and reserved matters). The householder
  and reserved matters checklists word it ''For all applications including: • 100 square metres or more
  of new floorspace...''. The separate ''CIL plans, calculations and supporting information'' is sent
  to unmapped.'
