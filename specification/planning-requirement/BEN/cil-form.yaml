reference: cil-form
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: 100 sqm or more of new floorspace, including extensions.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates a new residential dwelling, including flat conversions or change of use.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Community Infrastructure Levy Regulations 2010; Brent CIL (from 1 July 2013); Mayoral CIL
source-text: 'For all CIL liable applications including: • 100 sqm or more of new floorspace, including
  extensions; • the creation of a new residential dwelling including flat conversions / change of use
  o The conversion of a house to flats is CIL liable where additional GIA floorspace is created'
confidence: medium
notes: 'From the council''s list (published 2024, undated), Full/Outline/TDC checklist page 4; Householder
