reference: section-existing
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - always: true
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Site sections with finished floor and site levels, normally at a scale of 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 6-7; Householder
  checklist page 3; Reserved Matters checklist page 5; 'Further information on requirements' page 12.
  It is on all three checklists (householder, full/outline/TDC and reserved matters). The list asks for
  'Plans and drawings or information necessary to describe the subject of the application' (indicative
  drawings for an outline application where the relevant matters are reserved), each 'normally' at the
  scale shown, so scales are 'should'. The list asks for 'Existing and proposed site sections and finished
  floor and site levels'.
review-status: unverified
field-status: {}
