reference: land-contamination-assessment
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
  - any:
    - site:
        in:
        - contaminated-land
        description: The site has been identified as being at risk from contamination.
    - discretionary
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
source-text: Where the site has been identified as being risk from contamination or a development is proposed
  in close proximity to a contaminated site
must-include:
- item: Enough information to determine the existence or otherwise of contamination, its nature, the risks
    it may pose and whether these can be reduced to an acceptable level
  level: should
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 4; Householder
  checklist page 1; 'Further information on requirements' page 8. It is on the householder and full/outline/TDC
  checklists, not the reserved matters one. Listed as 'Contaminated land survey'. 'In close proximity
  to a contaminated site' has no distance, so it shows as discretionary.
review-status: unverified
field-status: {}
