reference: affordable-housing-statement
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The major development includes new homes.
    - condition:
        field: housing-type
        value: shared
        description: The proposal is large-scale purpose-built shared living.
    - condition:
        field: housing-type
        value: student
        description: The proposal is purpose-built student accommodation.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
source-text: 'Affordable Housing Statement: major residential schemes, large-scale purpose-built shared
  living, and purpose-built student accommodation'
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the shared-facilities management plan trigger. "Large-scale"
  shared living has no threshold in the audit.'
review-status: unverified
field-status: {}
