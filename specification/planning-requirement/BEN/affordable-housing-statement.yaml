reference: affordable-housing-statement
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Major residential development (10 or more homes).
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Major residential development (site of 0.5 hectares or more).
    - condition:
        field: housing-type
        value: shared
        description: Large-scale purpose-built shared living.
    - condition:
        field: housing-type
        value: student
        description: Purpose-built student accommodation.
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: London Plan policies H5 and H16; Brent Local Plan policies BH5 and H15
source-text: For all major residential developments, for proposed large-scale purpose-built shared living
  development and proposals for purpose-built student accommodation
must-include:
- item: Number and mix of residential units or student rooms by size and tenure, existing and proposed,
    by number of homes, habitable rooms and floorspace (GIA)
  level: must
- item: Details of any Registered Providers acting as partners (or higher education providers for purpose-built
    student accommodation)
  level: must
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 2; 'Further
  information on requirements' page 4-5. It is only on the full/outline/TDC checklist. 'Major residential'
  uses the national major thresholds for housing (10 or more homes or 0.5 hectares). A Financial Viability
  Assessment is needed for schemes outside the Fast Track Route (see viability-assessment).
review-status: unverified
field-status: {}
