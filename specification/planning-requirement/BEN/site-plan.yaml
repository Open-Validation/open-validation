reference: site-plan
local-authority: BEN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - technical-details-consent
      - reserved-matters
  - always: true
source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=a4e3c81fa97740d697cfe13f8040b0d6
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Block plan of the site normally at a scale of 1:100 or 1:200
  level: should
- item: Direction of north
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: Any public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Boundary treatments including walls or fencing where proposed
  level: should
- item: 'For new vehicle accesses or hardstanding: detailed site layout and elevation plans (normally
    at a scale not less than 1:100) showing all accesses and changes to the garden or land affected'
  level: must
  required-if:
    any:
    - condition:
        field: new-vehicle-access
        value: true
        description: A new vehicular access is proposed.
    - condition:
        field: hard-surfacing
        value: true
        description: New hardstanding is proposed.
  source-text: For proposed vehicular accesses or new hardstanding, detailed site layout and elevation
    plans (normally at a scale not less than 1:100) showing all accesses and changes to the garden or
    land affected by the proposal.
confidence: medium
notes: From the council's list (published 2024, undated), Full/Outline/TDC checklist page 6-7; Householder
  checklist page 3; Reserved Matters checklist page 5-6; 'Further information on requirements' page 12-13.
  It is on all three checklists (householder, full/outline/TDC and reserved matters). The list asks for
  'Plans and drawings or information necessary to describe the subject of the application' (indicative
  drawings for an outline application where the relevant matters are reserved), each 'normally' at the
  scale shown, so scales are 'should'. The checklists ask for a block plan (normally 1:100 or 1:200);
  the guidance note's 'Site plan' section gives 1:500 or 1:200 and the contents listed, all as 'should'.
  The householder and reserved matters checklists also list a 'Site plan' 'Where necessary to clarify
  the extent of the site in addition to the Location plan'.
review-status: unverified
field-status: {}
