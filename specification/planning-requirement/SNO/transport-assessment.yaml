reference: transport-assessment
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 800
        description: Food retail (A1) greater than 800 sq m.
    - condition:
        field: comparison-retail-floorspace
        operator: '>='
        value: 800
        description: 'Non food retail (A1): 800-1,500 sq m (transport statement) or greater than 1,500
          sq m (transport assessment).'
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Financial/professional (A2).
      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: Greater than 2,500 sq m.
    - all:
      - condition:
          field: use-class
          value: restaurant-cafe
          description: Restaurants/cafes (A3).
      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: Greater than 2,500 sq m.
    - all:
      - condition:
          field: use-class
          value: drinking-establishment
          description: Drinking establishments (A4).
      - condition:
          field: floorspace
          operator: '>'
          value: 600
          description: Greater than 600 sq m.
    - all:
      - condition:
          field: use-class
          value: hot-food-takeaway
          description: Hot food takeaway (A5).
      - condition:
          field: floorspace
          operator: '>'
          value: 500
          description: Greater than 500 sq m.
    - all:
      - condition:
          field: use-class
          value: business
          description: Business (B1).
      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: Greater than 2,500 sq m.
    - all:
      - condition:
          field: use-class
          value: general-industrial
          description: General industry (B2).
      - condition:
          field: floorspace
          operator: '>'
          value: 4000
          description: Greater than 4,000 sq m.
    - all:
      - condition:
          field: use-class
          value: storage-distribution
          description: Storage/distribution.
      - condition:
          field: floorspace
          operator: '>'
          value: 5000
          description: Greater than 5,000 sq m.
    - all:
      - condition:
          field: use-class
          value: hotel
          description: Hotels (C1).
      - condition:
          field: bedroom-count
          operator: '>'
          value: 100
          description: Greater than 100 bedrooms.
    - condition:
        field: dwelling-count
        operator: '>'
        value: 100
        description: 'Dwelling houses (C3): greater than 100 units.'
    - all:
      - condition:
          field: use-class
          value: hospital-nursing-home
          description: Hospitals (C2).
      - condition:
          field: residential-capacity
          operator: '>'
          value: 50
          description: Greater than 50 beds.
    - all:
      - condition:
          field: use-class
          value: institutional-hostel
          description: Hostels (C2).
      - condition:
          field: residential-capacity
          operator: '>'
          value: 400
          description: Greater than 400 residents.
    - all:
      - condition:
          field: use-class
          value: former-d2
          description: Assembly/leisure (D2).
      - condition:
          field: floorspace
          operator: '>'
          value: 1500
          description: Greater than 1,500 sq m.
    - condition:
        field: traffic-movements-peak-hour
        operator: '>'
        value: 100
        description: More than 100 traffic movements an hour at peak times (air quality section).
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 1000
        description: More than 1,000 movements over 24 hours (air quality section).
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Transportation Statements (TSs) are required for medium scale proposals (see thresholds).
  For larger applications a full transport assessment would be required. … Proposed Use (gross floor area)
  Food Retail (A1) Greater than 800m2 Non Food Retail (A1) 800-1,500sq.m Greater than 1,500 m2 Financial/Professional
  (A2) Greater than 2,500 m2 Restaurants/Cafes (A3) Greater than 2,500 m2 Drinking Establishments (A4)
  Greater than 600 m2 Hot Food Takeaway (A5) Greater than 500 m2 Business (B1) Greater than 2,500 m2 General
  Industry (B2) Greater than 4,000 m2 Storage/Distribution Greater than 5,000 m2 Hotels (C1) Greater than
  100 bedrooms Dwelling Houses (C3) Greater than 100 units Hospitals (C2) Greater than 50 beds Hostels
  (C2) Greater than 400 residents Assembly/Leisure (D2) Greater than 1,500 m2 … In this case the application
  and air quality assessment should also be supported by a transport assessment.
must-include:
- item: Full assessment of existing facilities for non-car modes of transport and their adequacy to meet
    the needs of the proposal
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 30, 13. The list calls it Transport Assessment
  / Statements. The threshold table gives a transport statement band (800-1,500 sq m) only for non-food
  retail; above it a full transport assessment is needed. The traffic thresholds come from the air quality
  section (page 13). The matrix (pages 9-12) marks it '?' ('may be needed') for these application types;
  it is shown for them only when the trigger applies. The list is shared by Broadland District Council
  and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
