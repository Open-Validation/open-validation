reference: section-proposed
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: Physical works on a sloping site with existing gradients steeper than 1 in 14 measured
          in any direction, or a proposal to change existing levels of the site.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All development proposals involving physical works on sloping sites with existing gradients
  steeper than 1 in 14 measured in any direction. • All developments where it is proposed to change existing
  levels of the site as part of the development.
must-include:
- item: Cross sections at regular intervals across the site, showing how the development sits on the sloping
    site
  level: should
- item: Proposed changes to existing ground levels
  level: should
- item: Height of the proposed development in the context of neighbouring development
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 30. The list calls it Topographical Survey
  / Cross Section; the topographical survey of existing levels is listed as unmapped. The matrix (pages
  9-12) marks it '?' ('may be needed') for these application types; it is shown for them only when the
  trigger applies. The list is shared by Broadland District Council and South Norfolk Council (same file
  for both).
review-status: unverified
field-status: {}
