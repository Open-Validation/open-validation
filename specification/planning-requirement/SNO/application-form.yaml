reference: application-form
local-authority: SNO
required-if:
  always: true
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: 'All applications require the following: • Completed Application Form These can either be
  submitted electronically via the Planning Portal website or by post.'
must-include:
- item: Completed Ownership Certificate (A, B, C or D), signed and dated
  level: must
  required-if:
    application-type:
      in:
      - hh
      - advertising
      - change-of-use
      - full
      - lbc
      - outline
      - s73
- item: 'Certificate B or C: Notice 1 served on any owner or agricultural tenant (including where foundations
    or guttering encroach onto or above the neighbouring property)'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate B or C is signed.
- item: 'Certificate C or D: Notice 2 completed where owners or agricultural tenants are unknown'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate C or D is signed.
- item: Completed Agricultural Holding Certificate
  level: must
  required-if:
    application-type:
      in:
      - hh
      - change-of-use
      - full
      - outline
      - s73
confidence: medium
notes: From the council's list (published January 2025), page 5, 9. The matrix marks the application form
  'Y' for every application type; the ownership certificate 'Y' for advertisement consent, change of use,
  full, listed building consent, outline and s73, and the agricultural holding certificate for change
  of use, full, outline and s73. The householder list (page 3) asks for both certificates too. The list
  is shared by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
