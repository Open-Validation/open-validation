reference: site-plan
local-authority: SNO
required-if:
  any:
  - application-type:
      in:
      - hh
      - change-of-use
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - advertising
        - full
        - ldc-existing-use
        - ldc-prospective-use
        - lbc
        - non-material-amendment
        - outline
        - prior-approval
        - s73
        - reserved-matters
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: National requirements - These documents are mandatory as part of each application type as
  described in the Planning Act and other relevant planning legislation. … Y = always needed ? = may be
  needed.
must-include:
- item: 'Shows the property/site and neighbouring properties/land, with the development proposals clearly
    hatched (householder: clearly identified)'
  level: must
- item: Shows the boundaries to the property/site and the location of immediately adjoining properties/land
  level: must
- item: Scale clearly shown, 1:200 or 1:500, with the north arrow clearly indicated
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 6, 9. The list calls it 'Block plan/site
  layout'. The matrix marks it 'Y' (always needed) for change of use and tree works and '?' (may be needed,
  no trigger given) for the other types listed, so those show as discretionary. The householder list (page
  3) always asks for a block plan. The list is shared by Broadland District Council and South Norfolk
  Council (same file for both).
review-status: unverified
field-status: {}
