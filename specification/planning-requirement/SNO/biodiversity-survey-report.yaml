reference: biodiversity-survey-report
local-authority: SNO
required-if:
  any:
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - outline
        - s73
        - reserved-matters
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - special-area-of-conservation
          - local-wildlife-site
          description: The site is on, near or linked to a Site of Special Scientific Interest, a Special
            Area of Conservation or a County Wildlife Site.
      - condition:
          field: near-watercourse
          value: true
          description: Within 500m of a pond or wet ditch and linked by semi-natural habitat (grassland/woodland
            hedgerow).
      - condition:
          field: agricultural-building-reuse
          value: true
          description: Conversion of a timber framed building (farm building or pre 1960s building in
            a rural context).
      - site:
          in:
          - priority-habitat
          description: Heathland on, adjacent to or linked to the site by other semi-natural habitats.
      - condition:
          field: previously-developed-land
          value: true
          description: Rough grassland or previously developed land (brownfield).
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Woodland, scrub, mature trees or hedges on, adjacent to or linked to the site.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: loss-of-habitat-features
        value: true
        description: The proposal involves the loss of a tree/s, removal of a hedge or the filling in
          of any natural pond or ditch.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: 'An Ecological Assessment is required when a proposed development site is on, near or linked
  to: • A Site of Special Scientific Interest (SSSI). • A Special Area of Conservation (SAC). • County
  Wildlife Site (CWS). … An Ecological Assessment is required if the proposed development is: • Within
  500m of a pond or wet ditch and linked by semi-natural habitat (grassland/woodland hedgerow). • Conversion
  of timber framed building (farm building or pre 1960s building in rural context). • Heathland on or
  adjacent or linked to the site by other semi-natural habitats. • Rough Grassland or previously developed
  land (brownfield). • Woodland, scrub, mature trees or hedges on, adjacent or linked to the site. • Wildlife
  corridors (former railway line) on, adjacent or linked to the site. … A basic ecology survey will be
  required for any proposal that involves the loss of a tree/s, removal of a hedge or the filling in of
  any natural pond or ditch.'
must-include:
- item: Protected Species Survey by an ecologist, identifying, evaluating and mitigating direct and indirect
    impacts on protected species, where an Ecological Assessment shows a reasonable likelihood of a protected
    species being present
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: A protected species is reasonably likely to be present.
- item: Proposals for long term mitigation of the protected species or Biodiversity Action Plan habitat
    within the site, where necessary
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Impacts on a protected species or BAP habitat are likely.
- item: Surveys follow the best practice guidelines recommended by Natural England
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 18-19. Householder wording from the Householder
  Local Validation List (https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-householder.pdf),
  page 5. The list calls it an Ecology Impact Assessment (householder list: Ecology survey). Wildlife
  corridors (such as a former railway line) on, adjacent to or linked to the site have no field yet, so
  that part shows as discretionary. The matrix (pages 9-12) marks it ''?'' (''may be needed'') for these
  application types; it is shown for them only when the trigger applies. The list is shared by Broadland
  District Council and South Norfolk Council (same file for both).'
review-status: unverified
field-status: {}
