reference: design-and-access-statement
local-authority: SNO
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      description: The development is within a Site of Special Scientific Interest.
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: A building bigger than 100 square metres.
  - site:
      in:
      - listed-building
      description: The development affects a listed building.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-householder.pdf
source-text: Design and Access Statement are required where the proposed development is within a site
  of special scientific interest, is for a building bigger than 100 sq m in a Conservation area or where
  the proposed development affects a Listed Building.
confidence: medium
notes: 'Audit (wrong_trigger): the Full planning excerpt was a fragment (''... should one be required.'').
