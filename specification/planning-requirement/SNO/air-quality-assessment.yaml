reference: air-quality-assessment
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: direct-air-emissions
        value: true
        description: The proposal would give rise to air-borne emissions including harmful substances,
          smoke, grit and dust (primarily industrial uses).
    - condition:
        field: traffic-movements-peak-hour
        operator: '>'
        value: 100
        description: More than 100 traffic movements an hour at peak times.
    - condition:
        field: traffic-movements-daily
        operator: '>'
        value: 1000
        description: More than 1,000 movements over 24 hours.
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Where proposals would give rise to air-borne emissions including harmful substances, smoke,
  grit and dust, an air quality assessment should be submitted. … Where a development is proposed within
  or adjacent to an area where air quality is likely to be an issue (eg. adjacent to major roads). • Where
  developments are expected to generate more than 100 traffic movements an hour at peak times or more
  than 1,000 movements over 24 hours • Where the development itself could result in the designation of
  an Air Quality Management Area (AQMA) or result in a significant degradation of air quality.
must-include:
- item: Full assessment of the level of the likely impact on the surrounding external environment and
    on the indoor environment of nearby properties
  level: should
- item: Full details of mitigation measures where the development would lead to unacceptable levels of
    air pollution
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 13-14. Sites within or adjacent to an area
  where air quality is likely to be an issue (e.g. next to major roads), and development that could lead
  to an AQMA or significant degradation of air quality, are matters of judgement, so they show as discretionary.
  Where the traffic thresholds are met the list also asks for a transport assessment. The matrix (pages
  9-12) marks it '?' ('may be needed') for these application types; it is shown for them only when the
  trigger applies. The list is shared by Broadland District Council and South Norfolk Council (same file
  for both).
review-status: unverified
field-status: {}
