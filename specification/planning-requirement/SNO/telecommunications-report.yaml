reference: telecommunications-report
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - full
      - prior-approval
  - any:
    - condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators or wireless broadband
          providers.
    - all:
      - condition:
          field: telecommunications-development
          value: true
          description: A radio mast or aerial.
      - condition:
          field: building-height
          operator: '>'
          value: 20
          description: Above 20m in height.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All proposals for mast and antenna development by mobile phone network operators or by wireless
  broadband providers • All proposals for radio masts/aerials above 20m in height.
must-include:
- item: Area of search
  level: must
- item: Details of any consultation undertaken
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification and information about the proposed development
  level: must
- item: Signed declaration that the equipment and installation fully comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
- item: Photomontages or visualisations
  level: should
- item: 'Radio masts or aerials above 10m: a short statement on why the mast is required, with technical
    information on its visual appearance and likely impacts'
  level: should
  required-if:
    condition:
      field: building-height
      operator: '>'
      value: 10
      description: Mast or aerial above 10m.
confidence: medium
notes: 'From the council''s list (published January 2025), page 29. The list calls it a Telecommunication
  Statement. Proposals in the countryside or the AONB should also consider whether a Landscape Visual
  Impact Assessment is needed. The matrix (pages 9-12) marks it ''?'' (''may be needed'') for these application
  types; it is shown for them only when the trigger applies. (Here: full and prior notification.) The
  list is shared by Broadland District Council and South Norfolk Council (same file for both).'
review-status: unverified
field-status: {}
