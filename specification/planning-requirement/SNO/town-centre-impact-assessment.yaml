reference: town-centre-impact-assessment
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - all:
      - condition:
          field: near-named-town
          value: true
          description: Near Diss or Wymondham.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 500
          description: New retail, leisure or office development of 500 sq m or more.
    - all:
      - condition:
          field: near-named-town
          value: false
          description: Elsewhere (not near Diss or Wymondham).
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 200
          description: New retail, leisure or office development of 200 sq m or more.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
policy: National Planning Policy Framework
source-text: 'SNC: All proposals for retail, leisure and office uses of 1000 sq m or more near Diss and
  Wymondham,and 500 sq m elsewhere, will be required to submit an assessment of: • The impact of the proposal
  on existing, committed and planned public and private investment in a centre in the catchment area of
  the proposal; and • The impact of the proposals on town centre vitality and viability, including local
  consumer choice and trade in the town centre and wider area. Sequential assessment : All new retail,
  leisure and office development of 500sq.m or more near Diss and Wymondham, and 200sq.m elsewhere.'
must-include:
- item: 'Sequential assessment: how the NPPF sequential test requirements have been met'
  level: must
- item: Impact of the proposal on existing, committed and planned public and private investment in a centre
    in the catchment area
  level: must
  required-if:
    any:
    - all:
      - condition:
          field: near-named-town
          value: true
          description: Near Diss or Wymondham.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more near Diss or Wymondham.
    - all:
      - condition:
          field: near-named-town
          value: false
          description: Elsewhere (not near Diss or Wymondham).
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more elsewhere.
- item: Impact on town centre vitality and viability, including local consumer choice and trade in the
    town centre and wider area
  level: must
  required-if:
    any:
    - all:
      - condition:
          field: near-named-town
          value: true
          description: Near Diss or Wymondham.
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more near Diss or Wymondham.
    - all:
      - condition:
          field: near-named-town
          value: false
          description: Elsewhere (not near Diss or Wymondham).
      - condition:
          field: town-centre-use-floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more elsewhere.
- item: Mitigation measures where adverse impacts on the vitality and viability of town centres are identified
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), page 27. The list calls it a Retail Impact
  Assessment and gives separate thresholds for Broadland (BDC) and South Norfolk (SNC, used here): a sequential
  assessment from 500 sq m near Diss and Wymondham and 200 sq m elsewhere, and an impact assessment from
  1,000 sq m and 500 sq m. The matrix (pages 9-12) marks it ''?'' (''may be needed'') for these application
  types; it is shown for them only when the trigger applies. The list is shared by Broadland District
  Council and South Norfolk Council (same file for both).'
review-status: unverified
