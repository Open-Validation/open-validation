reference: town-centre-impact-assessment
local-authority: SNO
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development outside a town centre.
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 500
      description: 500 square metres or more of town centre use floorspace (1,000 square metres near Diss
        and Wymondham).
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Where the sequential test is not met, the impact assessment shall fully address the requirements
  of the NPPF taking into account the likely impacts of the proposed development on the vitality and viability
  of town centres.
confidence: low
notes: 'From the audit (missing_requirement): Retail Impact Assessment, South Norfolk thresholds: 1,000
  sq m near Diss/Wymondham and 500 sq m elsewhere. The rule uses the lower threshold; check sites near
  Diss and Wymondham by hand. Broadland has its own threshold in the same list.'
review-status: unverified
field-status: {}
