reference: lighting-assessment
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - advertising
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Flood lighting is proposed.
    - condition:
        field: illuminated
        value: true
        description: An illuminated advert is proposed.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All development where flood lighting is proposed or where an illuminated advert is proposed.
must-include:
- item: Details of all external lighting and the period of time the lights would be used
  level: should
- item: Layout plan showing the beam orientation
  level: should
- item: Schedule of the equipment proposed
  level: should
- item: 'For outline applications: a statement of lighting strategy (suffices)'
  level: should
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (published January 2025), page 24. Lighting must be designed to ILP Guidance
  Notes 1 and 8 and avoid impacts on vulnerable receptors and dark corridors; illuminated signs are limited
  to 300cd/m2. The matrix (pages 9-12) marks it '?' ('may be needed') for these application types; it
  is shown for them only when the trigger applies. (Here also advertisement consent.) The list is shared
  by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
