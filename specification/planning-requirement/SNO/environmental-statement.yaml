reference: environmental-statement
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - condition:
      field: eia-development
      value: true
      description: The development is EIA development (Schedule 1 or Schedule 2 and likely to have significant
        environmental effects).
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Where a development is likely to have a significant effect on the environment due to the
  nature, size and location of the proposal and listed under Schedule 1 or Schedule 2 of the Town and
  Country Planning (Environmental Impact Assessment) (England and Wales)Regulations 2017
must-include:
- item: The information set out in Schedule 4 of the EIA Regulations
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 20. The list calls it an Environmental Impact
  Assessment; a screening or scoping opinion can be requested first. The matrix (pages 9-12) marks it
  '?' ('may be needed') for these application types; it is shown for them only when the trigger applies.
  The list is shared by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
