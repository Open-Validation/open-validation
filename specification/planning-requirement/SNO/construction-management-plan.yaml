reference: construction-management-plan
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Major developments and other developments where construction operations are likely to have
  a significant and long-term impact on local amenity
must-include:
- item: Communication with neighbours before and during works, contact arrangements for residents to raise
    concerns, and how concerns and complaints are investigated and answered
  level: should
- item: Management of noise and dust (assessed using BS5228, IAQM guidance or other appropriate guidance),
    including staff training
  level: should
- item: Hours during which noisy and potentially dusty activities will take place
  level: should
- item: Measures to control loud radios and to keep noisy activities (such as cutting and grinding) away
    from residential premises
  level: should
- item: Dust control for excavation, soil stockpiles, vehicle movements and windy, dry days
  level: should
- item: Measures to control smoke from burning activities
  level: should
- item: Method statements and risk assessments for identifying, removing and disposing of any asbestos
  level: should
- item: Monitoring of dust, noise and vibration, with access to a real-time web-based monitoring system
    and limits and warning levels agreed with the LPA
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 17. The list calls it a Construction Environmental
  Management Plan (CEMP) and says the plan is likely to include these items 'as appropriate'. Other developments
  with a significant, long-term impact on local amenity is a matter of judgement, so that part shows as
  discretionary. The matrix (pages 9-12) marks it '?' ('may be needed') for these application types; it
  is shown for them only when the trigger applies. The list is shared by Broadland District Council and
  South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
