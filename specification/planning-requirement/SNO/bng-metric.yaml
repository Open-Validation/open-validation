reference: bng-metric
local-authority: SNO
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The application must be accompanied by an excel copy of the statutory metric or small sites
  metric showing the baseline value of the site.
must-include:
- item: Excel copy of the statutory metric or small sites metric showing the baseline value of the site
  level: must
- item: Publication date of the biodiversity metric used
  level: must
- item: 'Where onsite habitat was degraded before the application: the completed metric showing the calculations
    for the pre-degradation date'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Activities before the application date reduced the onsite biodiversity value.
- item: Completed by a competent person in line with best practice and BS 8683
  level: should
- item: Evidence of the competency of the person who completed it
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 8-9. Required by law only where the biodiversity
  gain condition applies (householder and other exempt applications are exempt), so the rule is the biodiversity
  gain condition. The matrix marks the BNG condition statement 'Y' for full and outline and '?' for change
  of use and s73, and the metric '?' for change of use, full and s73. The list is shared by Broadland
  District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
