reference: planning-statement
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - ldc-existing-use
      - ldc-prospective-use
      - lbc
      - non-material-amendment
      - outline
      - s73
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: The proposal is contrary to Development Plan policy.
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: 'Major developments: • Residential - 10 or more dwellings or sites of 0.5ha or more. • other
  development comprising sites of 1ha or more or 1,000sq.m or more of development. • Environmentally Sensitive
  Developments. • Where there are considerable issues of scale and controversy or which are contrary to
  Development Plan policy.'
confidence: medium
notes: From the council's list (published January 2025), page 26. 'Environmentally Sensitive Developments'
  and 'considerable issues of scale and controversy' are matters of judgement, so they show as discretionary.
  The matrix (pages 9-12) marks it '?' ('may be needed') for these application types; it is shown for
  them only when the trigger applies. The list is shared by Broadland District Council and South Norfolk
  Council (same file for both).
review-status: unverified
field-status: {}
