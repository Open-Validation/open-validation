reference: archaeological-assessment
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: The site is in an Area of Archaeological Interest defined in the development plan.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal involves the disturbance of ground.
    - ref: major-development
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: For all applications involving the disturbance of ground within an Area of Archaeological
  Interest as defined in the development plan or, in other areas, in the case of a major development proposal
  or significant infrastructure works.
must-include:
- item: Desk-based assessment of previous uses on the site and any previous ground disturbance
  level: must
- item: Evidence that, as a minimum, the relevant historic environment record has been consulted
  level: should
- item: Any information on work done on archaeological considerations and any discussions with Norfolk
    County Council Historic Environment Service
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 14. 'Significant infrastructure works' is
  not defined, so that part shows as discretionary. On more archaeologically important sites preliminary
  site investigations may be needed before an application is made. The matrix (pages 9-12) marks it '?'
  ('may be needed') for these application types; it is shown for them only when the trigger applies. The
  list is shared by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
