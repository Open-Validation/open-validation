reference: fire-statement
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: The building contains two or more dwellings.
        - condition:
            field: educational-accommodation
            value: true
            description: The building contains educational accommodation.
      - any:
        - condition:
            field: building-height
            operator: '>='
            value: 18
            description: 18m or more in height.
        - condition:
            field: storey-count
            operator: '>='
            value: 7
            description: 7 or more storeys.
    - condition:
        field: battery-energy-storage
        value: true
        description: Any battery storage facilities.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: any building which contains two or more dwellings or educational accommodation; and meets
  the height condition of 18m or more in storey height, or 7 or more storeys. • Any battery storage facilities.
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting purposes
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How any fire safety policies in local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 20. The matrix (pages 9-12) marks it '?'
  ('may be needed') for these application types; it is shown for them only when the trigger applies. The
  list is shared by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
