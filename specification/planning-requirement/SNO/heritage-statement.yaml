reference: heritage-statement
local-authority: SNO
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - non-material-amendment
        - outline
        - s73
        - reserved-matters
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - park-and-garden
        - locally-listed-building
        description: The proposal affects the setting of a listed building, a conservation area, a registered
          park and garden or a non-designated heritage asset (locally identified buildings, parks and
          gardens and archaeological sites).
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All applications for listed building consent and applications for planning permission affecting
  the setting of listed buildings, conservation areas, registered parks and gardens, and non designated
  heritage assets (which include locally identified buildings, parks and gardens and archaeological sites).
confidence: medium
notes: From the council's list (published January 2025), page 23, 11. The matrix marks it 'Y' (always
  needed) for listed building consent and '?' for change of use, full, non-material amendment, outline,
  s73 and reserved matters. The list is shared by Broadland District Council and South Norfolk Council
  (same file for both).
