reference: arboriculturist-report
local-authority: SNO
required-if:
  all:
  - application-type:
      in:
      - hh
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees with a stem diameter of 75mm or more at 1.5m above ground level within 15 metres
          of the proposed development, on or adjacent to the site, that may be affected.
    - condition:
        field: hedgerows-affected
        value: true
        description: A hedge covered by the Hedgerow Regulations is affected by the development.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Tree survey required if there are any trees that have a stem diameter 75mm measured at 1.5
  metres above ground level and within 15 metres of the proposed development whether on site or adjacent
  to the site that may be affected by the development. • An Arboricultural Implications Assessment will
  be required where the proposal involves groundworks that are within 2 metres of the crown spread of
  any significant trees on the site. • A Hedgerow Assessment where a hedge covered by the Hedgerow Regulations
  is affected by the development. … A survey plan will be required showing those trees on and adjacent
  to the site, that have a stem diameter of ≥ 75mm measured at 1.5 meters above ground level and within
  15 metres of any new building works.
must-include:
- item: Survey plan accurately plotting all trees and hedgerows on the site or on adjacent land (including
    street trees) that could influence or be affected by the development, to an accuracy of 0.5m
  level: must
- item: Schedule (BS 5837:2012) identifying each tree by a unique number on the plan, with species, height,
    stem diameter at 1.5m, branch spread at the four cardinal points and height of the lowest point of
    the canopy
  level: must
- item: Assessment of the size, spread, condition and quality of the trees to BS 5837:2012
  level: must
- item: Trees to be removed identified on a plan, with mitigation planting where necessary
  level: must
  required-if:
    condition:
      field: tree-removal
      value: true
      description: Trees are to be removed.
- item: Measures to protect retained trees and their root protection areas during construction (BS 5837:2012)
  level: must
- item: Arboricultural Implications Assessment, preferably by a suitably qualified arboriculturist (BS5837:2012),
    where the proposal involves groundworks within 2 metres of the crown spread of any significant trees
  level: must
  required-if:
    condition:
      field: ground-disturbance
      value: true
      description: Groundworks within 2 metres of the crown spread of any significant trees on the site.
  source-text: An Arboricultural Implications Assessment will be required where the proposal involves
    groundworks that are within 2 metres of the crown spread of any significant trees on the site.
- item: Hedgerow Assessment
  level: must
  required-if:
    condition:
      field: hedgerows-affected
      value: true
      description: A hedge covered by the Hedgerow Regulations is affected.
confidence: medium
notes: From the council's list (published January 2025), page 32. Householder wording from the Householder
  Local Validation List (https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-householder.pdf),
  page 5. The list calls it Tree Survey (Arboricultural Assessment); the householder list asks for the
  same tree survey and Arboricultural Implications Assessment. The matrix (pages 9-12) marks it '?' ('may
  be needed') for these application types; it is shown for them only when the trigger applies. The list
  is shared by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
