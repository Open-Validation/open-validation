reference: habitat-baseline
local-authority: BAS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/biodiversity-net-gain-assessment-and-guidance
policy: Environment Act 2021; B&NES Core Strategy and Placemaking Plan (incorporating the Local Plan Partial
  Update 2023) policy NE3a
source-text: 'All major and minor developments will need to submit Biodiversity Gain Information. This
  includes the following categories of application: Full planning application Full planning application
  (with listed building consent) Full planning application (with demolition in a conservation area) Full
  planning with advertisement consent Outline application with some matters reserved Outline application
  with all matters reserved Reserved matters application'
must-include:
- item: Drawn to an identified scale, showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier date), including any irreplaceable
    habitat
  level: must
- item: Maps of baseline habitats, an annotated Ecological Mitigation Map and illustrative post-development
    habitat proposals including retained and proposed new features
  level: should
confidence: medium
notes: 'From the council''s list (web checklists, last updated 10 June 2026), ''Biodiversity Net Gain
  Assessment and guidance'' page (updated 27 February 2026). Follows the law (biodiversity gain condition):
  householder and other exempt applications are exempt.'
review-status: unverified
field-status: {}
