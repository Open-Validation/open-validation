reference: bng-metric
local-authority: BAS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/biodiversity-net-gain-assessment-and-guidance
policy: Environment Act 2021; B&NES Core Strategy and Placemaking Plan (incorporating the Local Plan Partial
  Update 2023) policy NE3a
source-text: 'All major and minor developments will need to submit Biodiversity Gain Information. This
  includes the following categories of application: Full planning application Full planning application
  (with listed building consent) Full planning application (with demolition in a conservation area) Full
  planning with advertisement consent Outline application with some matters reserved Outline application
  with all matters reserved Reserved matters application'
must-include:
- item: Statement on whether the applicant believes the biodiversity gain condition would apply
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed metric calculation tool and the publication date and version of the metric
    used
  level: must
- item: The earlier date and the reasons for it, if an earlier date is used
  level: must
- item: Statement on whether the value is lower because of degradation, with supporting evidence if it
    is
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
- item: The project design steps taken to avoid and minimise adverse biodiversity impacts
  level: should
- item: The proposed approach to enhancing biodiversity on-site, and any off-site enhancements (including
    units or credits) planned or arranged
  level: should
- item: A working assessment of the expected net gain, with the completed metric spreadsheets for the
    post-development value and habitat condition sheets with justifications
  level: should
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Biodiversity Net Gain Assessment
  and guidance' page (updated 27 February 2026). The page lists full, outline and reserved matters applications
  and applies the statutory exemptions to its local policy NE3a too, so this follows the law (biodiversity
  gain condition). The 'should' items are what local policy asks for in addition. The council expects
  a report, completed metric spreadsheet and GIS imagery.
review-status: unverified
field-status: {}
