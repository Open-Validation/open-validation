reference: floor-plan-existing
local-authority: BAS
required-if: discretionary
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In most cases, two separate sets of floor plans will be required: “existing” floor plans
  showing the building as it is now and “proposed” floor plans showing how the building will look, after
  the works have been carried out.'
must-include:
- item: At a scale of 1:100 or 1:50, clearly annotated existing and proposed
  level: must
- item: All relevant floor levels of the building(s), in relation to the rest of the building, with each
    floor labelled
  level: must
- item: The use of each room, and the position of windows, doors, walls and partitions
  level: must
- item: Anything to be demolished
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Drawing Standards (best practice
  guide, 28 June 2023)' page. Section 7, page 8. Shown as discretionary because the guide says 'in most
  cases'. The council's local requirements page says that for all types of application the plans should
  follow its Drawing Standards best practice guide (28 June 2023), which says drawings without enough
  detail make the application invalid. Which drawings are needed comes from the national requirements
  (GOV.UK) that every checklist points to; the guide sets what they show.
review-status: unverified
field-status: {}
