reference: sci
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/statement-community-involvement
policy: B&NES Statement of Community Involvement; My Neighbourhood – A Neighbourhood Planning Protocol
  for B&NES
source-text: 'A statement of community involvement is necessary for a major development, which could be
  any of the following: Developments of 10 or more dwellings Residential sites of 0.5 hectares or more
  Other buildings with a floor space of 1,000m2 or more, or on sites of 1 hectare or more All applications
  for waste development or mineral working associated with these developments'
must-include:
- item: Shows that the views of the local community were sought before submission, and how they were considered
    in forming the proposals
  level: must
