reference: flood-risk-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - mineral-extraction
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3 (all applications, including minor development and change of
          use).
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: In Flood Zone 1, covering more than a hectare.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: In Flood Zone 1, covering more than a hectare.
    - site:
        in:
        - critical-drainage-area
        description: In an area with critical drainage problems notified by the Environment Agency.
    - site:
        in:
        - future-flood-risk
        description: Identified in a strategic flood risk assessment as at increased flood risk in future.
    - all:
      - site:
          in:
          - surface-water-flood-risk
          - groundwater-flood-risk
          description: Subject to other sources of flooding.
      - condition:
          field: sensitive-end-use
          value: true
          description: The development would introduce a more vulnerable use.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/flood-risk-assessment
policy: NPPF; Environment Agency Flood Risk Standing Advice
source-text: 'A Flood Risk Assessment is required if the proposed development falls within a flood zone
  (as defined by the Environment Agency). Flood zones are classed as 1 to 3 for the purposes of planning
  decisions, with zone 3 identifying areas with the highest risk of flooding from rivers or the sea. You
  will need to submit a Flood Risk Assessment with your planning application if your development is one
  of the following: In Zones 2 or 3 All applications, including minor development and change of use In
  Zone 1 Developments covering more than a hectare (ha) within the zone All applications in an area where
  there are critical drainage problems (as notified by the Environment Agency) Land identified in a strategic
  flood risk assessment as being at increased flood risk in future; or land that may be subject to other
  sources of flooding, where its development would introduce a more vulnerable use.'
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Flood risk assessment' page
  (updated 15 May 2025). Content follows the Environment Agency's standing advice. Listed on the householder,
  full, outline, reserved matters and mineral extraction checklists.
