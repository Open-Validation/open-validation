reference: archaeological-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
  - site:
      in:
      - scheduled-monument
      - archaeological-priority-area
      description: The proposal might affect ancient monuments or sites of archaeological importance.
source-url: https://www.bathnes.gov.uk/planning-permission-mineral-extraction-or-associated-development
source-text: If your proposal might affect ancient monuments or sites of archaeological importance you
  will be required to undertake an archaeological assessment as part of the application. The level of
  assessment required will depend on the archaeological sensitivity of the site.
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Planning permission for mineral
  extraction or associated development' page. For other applications, archaeological sites are covered
  by the heritage statement (desk-based assessment and, where necessary, field evaluation).
review-status: unverified
field-status: {}
