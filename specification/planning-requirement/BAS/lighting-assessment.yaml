reference: lighting-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - any:
        - condition:
            field: floodlighting
            value: true
            description: The application includes floodlighting.
        - condition:
            field: external-lighting
            value: true
            description: A significant amount of external lighting.
      - any:
        - condition:
            field: near-noise-sensitive-use
            value: true
            description: Next to a residential property.
        - site:
            in:
            - listed-building
            - listed-building-setting
            - conservation-area
            description: Next to a listed building, or within or next to a conservation area.
        - condition:
            field: protected-species
            value: true
            description: Next to habitats used by legally protected species (bats, badgers, barn owls,
              great crested newts).
        - site:
            in:
            - rural-area
            description: Within the open countryside.
        - condition:
            field: near-watercourse
            value: true
            description: Alongside other watercourses and habitats where bats may be affected.
    - condition:
        field: near-watercourse
        value: true
        description: 'Alongside the River Avon: light spill from internal and external lighting, not only
          floodlighting.'
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/lighting-assessment
policy: 'WaterSpace Design Guidance: Protecting bats in waterside development (2018)'
source-text: 'You will need to submit a Lighting Assessment for any applications which include floodlighting,
  or a significant amount of external lighting, where your development would be any of the following:
  Next to a residential property Next to a listed building Within or next to a conservation area Next
  to habitats used by a legally protected species (such as bats, badgers, barn owls and great crested
  newts) Within the open countryside Alongside the River Avon, to assess predicted light spill from internal
  and external lighting (not only for schemes involving floodlighting) Alongside other watercourses and
  habitats, where there is a risk of impact on bats, especially light sensitive bat species such as the
  horseshoe bats associated with the Bath & Bradford on Avon Bats Special Area of Conservation.'
must-include:
- item: Details of any external lighting and the proposed hours it would be switched on
  level: must
- item: A layout plan showing beam orientation, light spill and lux levels
  level: must
- item: A schedule of the equipment in the design
  level: must
- item: The level of luminance for any advertisements
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: Illuminated advertisements are proposed.
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Lighting assessment' page
  (updated 4 June 2025). 'Next to a residential property' uses near-noise-sensitive-use (next to existing
  homes). The River Avon trigger covers internal and external lighting even without floodlighting.
review-status: unverified
field-status: {}
