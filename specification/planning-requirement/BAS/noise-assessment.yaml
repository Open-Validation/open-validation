reference: noise-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - mineral-extraction
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The development is likely to cause significant noise affecting others.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Users of the new development may be sensitive to noise from other people or activities
          (homes, schools, hospitals).
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/noise-assessment
policy: NPPF
source-text: A noise assessment, prepared by a qualified acoustician, is necessary for all applications
  where the proposed development is likely to cause significant noise which will affect others, or those
  using the new development may be sensitive to noise caused by other people or activities (for example,
  residential developments, schools and hospitals).
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: Potential sources of noise and how they may affect local amenity
  level: must
- item: How the developer intends to overcome these issues
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Noise impact assessment'
  page (updated 4 June 2025).
review-status: unverified
field-status: {}
