reference: environmental-statement
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: eia-development
      value: true
      description: Development likely to have significant environmental effects (EIA Regulations 2017).
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/environmental-impact-assessment
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: When a major development (defined in Schedule 1 or Schedule 2) is likely to have a significant
  effect on the environment because of its nature, size, use, location, and other factors, then the development
  may require an Environmental Impact Assessment (ES).
must-include:
- item: 'Details of the proposed development: site, design, size and relevant features'
  level: must
- item: The likely significant effects on the environment
  level: must
- item: Ways to avoid or limit the impact on the environment
  level: must
- item: Reasons for choosing this type and nature of development, and all reasonable alternatives considered
  level: must
- item: Details of the experts who prepared it and their qualifications, with a statement from the developer
  level: must
- item: A non-technical summary
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Environmental Impact Assessment'
  page (updated 8 May 2025).
review-status: unverified
field-status: {}
