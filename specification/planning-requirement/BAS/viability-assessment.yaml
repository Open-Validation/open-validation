reference: viability-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Planning obligations and contributions are not offered in line with local policy, because
        of viability.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/viability-assessment
policy: NPPF paragraph 58; Planning Obligations SPD (2023)
source-text: You will need to prepare and submit a Viability Assessment if you are not offering planning
  obligations and contributions in accordance with local policy, due to financial viability.
must-include:
- item: Prepared and signed by an appropriately qualified and independent financial professional
  level: must
- item: Shared on an 'open book' basis
  level: must
- item: Site or building acquisition cost and existing use value
  level: must
- item: Construction costs and programme; fees and other on costs
  level: must
- item: Projected sale prices of dwellings; gross and net margin
  level: must
- item: Other costs and receipts, and other relevant information depending on the obligation(s)
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Viability Assessment' page
  (updated 28 April 2026). The applicant pays upfront for the council's independent review. The draft
  heads of terms page says a major development whose heads of terms leave out affordable housing for viability
  reasons needs a Viability Assessment to be valid.
review-status: unverified
field-status: {}
