reference: transport-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - mineral-extraction
  - discretionary
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/transport-assessment
policy: B&NES Core Strategy and Placemaking Plan (incorporating the Local Plan Partial Update 2023) policy
  ST7; Transport and Development SPD (2023)
source-text: In accordance with Placemaking Plan Policy ST7 (pages 253 - 254), planning applications for
  developments that generate significant levels of movement should be accompanied by a Transport Assessment,
  or Transport Statement, in accordance with the National Planning Policy Framework and Planning Practice
  Guidance. Schemes will be expected to be tested through the council’s transport modelling, as necessary.
must-include:
- item: Adopts the 'Decide and Provide' approach
  level: must
- item: A completed Active Travel Checklist (Transport & Development SPD)
  level: should
- item: Overview of the development, cumulative impacts with committed development, and existing access
    and transport conditions and how the development affects them
  level: should
- item: Measures to overcome transport problems and improve access to public transport, and a review of
    pedestrian and wheeled access
  level: should
- item: All existing and proposed residential vehicle movements, service vehicle access, manoeuvring and
    parking, and evidence for the proposed cycle and car parking
  level: should
- item: Testing of likely transport impacts with appropriate modelling tools, and construction phase impacts
  level: should
confidence: medium
notes: 'From the council''s list (web checklists, last updated 10 June 2026), ''Transport assessment''
  page (updated 13 June 2025). Discretionary: required for developments that ''generate significant levels
  of movement'', with no threshold given. The scope items are what the page says the scope ''could include'',
  so they are ''should''. Any development needing a Transport Assessment is likely to need a Travel Plan.'
review-status: unverified
field-status: {}
