reference: travel-plan
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - mineral-extraction
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 20
        description: 'Residential: 20 to 40 dwellings need a Residential Travel Plan Statement; 40 or
          more a Full Residential Travel Plan.'
    - discretionary
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/travel-plan
policy: B&NES Core Strategy and Placemaking Plan (incorporating the Local Plan Partial Update 2023) policy
  ST7; Transport and Development SPD (2023), Figure 6.1
source-text: 'Residential developments Up to 20 dwellings: exempt from this requirement 20 to 40 dwellings:
  Residential Travel Plan Statement 40 dwellings or more: Full Residential Travel Plan Non-residential
  developments Figure 6.1 provides indicative thresholds for Travel Plans and Travel Plan Statements by
  Land Use Class. You should refer to this for Travel Plan requirements relating to non-residential developments.'
must-include:
- item: The relevant Appendix F checklist from the Transport & Development SPD, with reasons for any aspects
    not completed
  level: should
- item: Site description, accessibility by all modes, size and nature of development; survey and baseline
    modal split data
  level: should
- item: Objectives and targets; proposed measures, budget and campaigns in a costed action plan
  level: should
- item: Management, marketing and communication, and monitoring and review arrangements
  level: should
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Travel plan' page (updated
  13 June 2025). Non-residential thresholds are in Figure 6.1 of the SPD (not given on the page), so they
  are shown as discretionary. Up to 20 dwellings is exempt; the page's bands ('up to 20' and '20 to 40')
  overlap at 20.
review-status: unverified
field-status: {}
