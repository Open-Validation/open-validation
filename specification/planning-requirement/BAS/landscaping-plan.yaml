reference: landscaping-plan
local-authority: BAS
required-if: discretionary
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
source-text: In many instances the submission of landscaping details can be a condition of the planning
  permission. In some cases specialist detail, for example a tree survey or detailed design may be required
  when submitting landscaping schemes. It is recommended that you discuss with officers the scope and
  detail required prior to submission.
must-include:
- item: Position and spread of existing trees, their species and condition
  level: must
- item: Trees to be retained and the measures to protect them; any trees to be felled
  level: must
- item: Size, species and positions of trees to be planted, and boundary treatments
  level: must
confidence: medium
notes: 'From the council''s list (web checklists, last updated 10 June 2026), ''Drawing Standards (best
  practice guide, 28 June 2023)'' page. Section 11, page 12. Discretionary: landscaping can often be left
  to a condition, and officers advise on scope. The council''s local requirements page says that for all
  types of application the plans should follow its Drawing Standards best practice guide (28 June 2023),
  which says drawings without enough detail make the application invalid. Which drawings are needed comes
  from the national requirements (GOV.UK) that every checklist points to; the guide sets what they show.'
