reference: recreation-facilities-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/open-space-assessment
policy: B&NES Green Space Strategy 2015; Green Infrastructure Strategy 2013; Planning Obligations SPD
source-text: You need to submit an Open Space Assessment with your planning application when you are proposing
  a major development. Major development means ten or more new dwellings, over 1000sq m of new floor space
  or development carried out on a site having an area of 1 hectare or more.
must-include:
- item: Plan of existing green infrastructure assets and open spaces within and around the site, with
    their use and value
  level: must
- item: Plan of the proposed green infrastructure within and around the site, and how it improves connectivity
    to local and strategic networks
  level: must
- item: Delivery of well-connected places accessible by sustainable transport
  level: must
- item: Any loss of open space, with evidence of sufficient access elsewhere and that the site is surplus
    (if applicable)
  level: must
- item: Effects on adjacent open spaces (use, management and maintenance)
  level: must
- item: Open space requirements generated by the development
  level: must
- item: Plan of the open space proposals identifying Green Space Strategy typologies and quantities (if
    applicable)
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Open space assessment' page
  (updated 10 June 2025). The council calls it an Open Space Assessment.
review-status: unverified
field-status: {}
