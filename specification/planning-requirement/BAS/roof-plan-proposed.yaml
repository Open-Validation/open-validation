reference: roof-plan-proposed
local-authority: BAS
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: The development changes the appearance or shape of the roof.
  - discretionary
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These should be drawn to a scale of 1:50 or 1:100 and is used to show the shape of the roof
  particularly when development includes changes to its appearance and shape.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Position of all ridges, valleys, dormer windows, roof lights and other features such as chimneys
    or raised parapets
  level: must
- item: Roofing materials and their location
  level: should
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Drawing Standards (best practice
  guide, 28 June 2023)' page. Section 10, page 12. The guide lists roof plans as 'required in some cases'.
  The council's local requirements page says that for all types of application the plans should follow
  its Drawing Standards best practice guide (28 June 2023), which says drawings without enough detail
  make the application invalid. Which drawings are needed comes from the national requirements (GOV.UK)
  that every checklist points to; the guide sets what they show.
