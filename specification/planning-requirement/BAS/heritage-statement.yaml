reference: heritage-statement
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
  - any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - battlefield
        - world-heritage-site
        description: Affects a listed building, conservation area, scheduled monument, registered park
          or garden, battlefield or World Heritage Site, or their setting.
    - site:
        in:
        - locally-listed-building
        description: Affects a non-designated heritage asset (such as one on the Locally Listed Heritage
          Assets list).
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/heritage-statement
policy: NPPF
source-text: 'When your proposed development will affect a heritage asset or its setting, you must submit
  a Heritage Statement with your planning application. This includes the following: Listed building consent
  applications Proposals affecting any of the following, or their setting: a listed building, a conservation
  area, a scheduled monument, a registered park, a garden or battlefield, or World Heritage Site Non-designated
  heritage assets (such as those on the Locally Listed Heritage Assets list)'
must-include:
- item: Assessment of the significance of the heritage asset (archaeological, architectural, artistic
    or historic) and the contribution of its setting
  level: must
- item: Enough detail to assess the impact of the proposed work on that significance and setting
  level: must
- item: 'For buildings: analysis of the historic fabric, phasing and development, with documentary research
    where needed'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: A historic building.
- item: 'For settings: wider evaluation of the character of the area and views'
  level: must
  required-if:
    site:
      in:
      - listed-building-setting
      - conservation-area
      - world-heritage-site
      description: The setting of a heritage asset.
- item: 'For archaeological sites: an appropriate desk-based assessment and, where necessary, a field
    evaluation'
  level: must
  required-if:
    site:
      in:
      - scheduled-monument
      description: An archaeological site.
- item: 'For listed building consent: historical and archaeological features and scheduled ancient monuments'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Heritage Statement (including historical, archaeological features and Scheduled Ancient
    Monuments)
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Heritage statement' page
  (updated 21 May 2025). Best presented standalone or combined with the Design and Access Statement. Non-designated
  heritage assets are often identified during pre-application or the application.
review-status: unverified
field-status: {}
