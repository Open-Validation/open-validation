reference: land-contamination-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - mineral-extraction
      - waste-dev
  - any:
    - site:
        in:
        - contaminated-land
        description: Known or suspected contamination, including previous potentially contaminative uses.
    - condition:
        field: industrial-site
        value: true
        description: Conversion or redevelopment of petrol filling stations, or redevelopment of industrial
          and manufacturing sites.
    - application-type:
        in:
        - mineral-extraction
        - waste-dev
    - condition:
        field: change-in-ground-levels
        value: true
        description: Alteration to the topography (for instance infilling) that may result in contamination.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Rural building conversions to other uses.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/land-contamination-assessment
policy: NPPF; B&NES Contaminated Land Strategy 2023
source-text: 'This assessment is necessary for applications where there are known or suspected contamination
  issues with land involved in a development, including previous potentially contaminative uses. Typical
  examples include the following situations: Developments on sites with a known potentially contaminative
  historical land use Conversion or redevelopment of petrol filling stations Redevelopment of industrial
  and manufacturing sites Mineral and waste applications Applications for sites where alteration to the
  topography of the land or surrounding area may result in land contamination (for instance, through infilling
  of the land) Rural building conversions to other uses'
must-include:
- item: Nature and extent of contamination (including ground gas), the risks to the development and feasible
    remedial measures
  level: must
- item: 'As needed: desktop study and walkover survey, intrusive site investigation and risk assessment,
    remediation strategy and validation report'
  level: should
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Land contamination assessment'
  page (updated 29 May 2025).
review-status: unverified
field-status: {}
