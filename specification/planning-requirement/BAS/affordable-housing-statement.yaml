reference: affordable-housing-statement
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: affordable-housing-proposed
        value: true
        description: The development includes an element of affordable housing.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Ten homes or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site of 0.5 hectares or more.
    - all:
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: In an Area of Outstanding Natural Beauty (National Landscape).
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: Five or more homes.
    - condition:
        field: housing-type
        value: co-living
        description: A co-living scheme (sui generis).
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/affordable-housing-statement
policy: B&NES Core Strategy and Placemaking Plan (incorporating the Local Plan Partial Update 2023) policy
  CP9; Planning Obligations SPD (2023)
source-text: An affordable housing statement is required when a development includes an element of affordable
  housing. The following types of residential developments are required to provide affordable housing
  (or, if deemed appropriate, a related payment in place of affordable housing) in accordance with our
  Core Strategy (Policy CP9) and the National Planning Policy Framework (NPPF) Developments involving
  ten homes or more Developments with a site of 0.5 hectares or more (gross internal area) In Areas of
  Outstanding Natural Beauty (designated rural areas), developments of five or more homes We also require
  that co-living schemes (sui generis) provide an element of affordable housing in accordance with adopted
  Development Plan policy CP9.
must-include:
- item: Total numbers of residential units (market and affordable)
  level: must
- item: Mix of units with numbers of bedrooms, confirming every affordable unit meets the nationally described
    space standard and Building Regulation M4(2) and, where required, M4(3)
  level: must
- item: Location of units, shown on a scaled plan
  level: must
- item: A clear and full explanation of any different levels or types of affordability or tenure
  level: must
- item: Shows compliance with national policy, Core Strategy policy CP9 and the Planning Obligations SPD
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Affordable housing statement'
  page (updated 30 April 2025). Listed on the full, outline and reserved matters checklists.
review-status: unverified
field-status: {}
