notes: From the council's list (web checklists, last updated 10 June 2026), 'Householder application checklist'
  page. National rules on when a Design and Access Statement is needed still apply. Locally, householder
  applications 'may need' one covering parking and access, and the householder-with-conservation-area-demolition
  checklist warns one is 'extremely likely' to be needed; the mineral extraction checklist also lists
  one. Shown as discretionary.
