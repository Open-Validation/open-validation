source-text: Parking and Access Arrangements, as part of a Design and Access Statement ... In most areas
  of the UK, this category of application would not require a Design and Access Statement. However, it
  is extremely likely that such a Statement WILL be necessary within our area. Please consult a planning
  agent or contact our Planning Team for confirmation.
