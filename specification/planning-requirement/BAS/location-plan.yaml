reference: location-plan
local-authority: BAS
required-if:
  always: true
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site location plan is a map base that shows the location of the application site in relation
  to surrounding roads, buildings and other land.
must-include:
- item: Taken from an up to date Ordnance Survey base, or to an equivalent standard
  level: must
- item: At a scale of 1:1000, 1:1250 or 1:2500 for larger sites
  level: must
- item: Shows the direction of north
  level: must
- item: Where possible, covers an A4 sheet with the application site in the centre
  level: should
- item: Application site outlined in red, including all land needed to carry out the development (e.g.
    access from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: Any other adjoining land owned by the applicant outlined in blue
  level: must
- item: Adjoining road names and numbers
  level: must
- item: Enough roads and/or buildings on nearby land to make the exact location clear (in rural areas
    normally two named roads)
  level: must
- item: 'For advertisement consent: a standard scale (e.g. 1:1250) stated on the plan, the site located
    by reference to at least two named roads, and the proposed position of the advertisement'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Use a standard scale, for example, 1:1250, and state this on your plan Identify the location
    of the site by reference to at least two named roads Identify the proposed position of the advertisement
- item: 'For a certificate of appropriate alternative development: two copies, at 1:2500 or 1:1250, showing
    north, adjoining properties and roads, and the whole site outlined in red'
  level: must
  required-if:
    application-type:
      in:
      - cert-alt-appropriate-dev
  source-text: 'You should add two copies of your site location plan to the submission. Please note the
    following guidance on how to draw up and submit plans: The scale should be 1:2500 or 1:1250. Indicate
    the direction of north. Include details of adjoining properties and roads. Mark the boundary of the
    whole site clearly in red.'
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Drawing Standards (best practice
  guide, 28 June 2023)' page. Section 4, page 2. The council's local requirements page says that for all
  types of application the plans should follow its Drawing Standards best practice guide (28 June 2023),
  which says drawings without enough detail make the application invalid. Which drawings are needed comes
  from the national requirements (GOV.UK) that every checklist points to; the guide sets what they show.
review-status: unverified
field-status: {}
