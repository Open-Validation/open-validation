reference: sustainability-statement
local-authority: BAS
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new-build residential development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings (including replacements, co-living, student
          accommodation, holiday lets and HMOs).
  - all:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new-build non-residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 square metres or more of non-residential floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: Medium-scale or larger works to existing buildings (5 or more dwellings).
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: Medium-scale or larger works to existing buildings (500 square metres or more).
  - discretionary
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/sustainable-construction-checklist
policy: Sustainable Construction Checklist SPD; Local Plan SCR6
must-include:
- item: Energy Summary Tool
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal is residential.
confidence: medium
notes: 'From the audit (wrong_trigger): the Sustainable Construction Checklist is required for new-build
  residential of 1+ dwellings (including replacements, co-living, student accommodation, holiday lets
  and HMOs), major non-residential new build of 1,000 m2+, medium-scale or larger works to existing buildings
  (5+ dwellings / 500 m2) and district heating proposals (shown as officer discretion). There is no exemption
  for listed buildings. It should accompany Sustainability Statements or Energy Strategies. The workbook''s
  excerpt was scrambled table text.'
review-status: unverified
field-status: {}
