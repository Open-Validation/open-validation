reference: biodiversity-survey-report
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - mineral-extraction
  - any:
    - condition:
        field: protected-species
        value: true
        description: The development may affect protected species or habitats.
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: In or next to an SPA, SAC, Ramsar site, SSSI, Site of Nature Conservation Interest
          or Local Nature Reserve.
    - condition:
        field: geodiversity-interest
        value: true
        description: In or next to a Regionally Important Geological Site, or likely to affect a geological
          feature.
    - site:
        in:
        - priority-habitat
        description: In or next to an area used by UK Biodiversity Action Plan (priority) habitats or
          species.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/biodiversity-and-geological-conservation-assessment
policy: NPPF; Conservation of Habitats and Species Regulations; Wildlife and Countryside Act 1981
source-text: 'Where your proposed development may affect protected species or habitats, you must submit
  a Protected Species Survey and Assessment with your planning application. This may form part of a wider
  Ecological Assessment or part of an Environmental Impact Assessment. ... Where your proposed development
  is likely to affect such a designated site, priority habit or species or geological feature, you must
  get an Ecological/Geological Survey and Assessment. This assessment may form part of a wider Environmental
  Impact Assessment. Find out if you need a survey You will probably need this type of survey if your
  proposed development is in, or next to, any of the following types of designated area: Special Protection
  Area (SPA) Special Area of Conservation (SAC) Ramsar Site (important area of wetland) Site of Special
  Scientific Interest (SSSI) Site of Nature Conservation Interest (SNCI) Regionally Important Geological
  Site (RIGS) Local Nature Reserve (LNR) an area used by UK Biodiversity Action Plan habitats or species'
must-include:
- item: Which species are present and their approximate numbers
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species survey.
- item: Map of their distribution and use of the area, site, structure or feature (feeding, shelter, breeding)
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species survey.
- item: Record of the habitats, species and features on or near the site, their size or number, mapped
    on an appropriate scale plan
  level: must
  required-if:
    any:
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - site-of-special-scientific-interest
        - local-wildlife-site
        - priority-habitat
        description: Designated site or priority habitat.
    - condition:
        field: geodiversity-interest
        value: true
        description: Geological feature.
- item: Potential development impacts, direct and indirect, during construction and afterwards
  level: must
- item: Likely change after development (net loss or gain), including the area (hectares) of priority
    habitat
  level: must
- item: 'Where harm is likely: alternative designs or locations considered, and how impacts will be avoided,
    mitigated and compensated'
  level: must
- item: Carried out by a suitably experienced professional at the correct time of year using nationally
    recognised survey methods
  level: must
confidence: medium
notes: 'From the council''s list (web checklists, last updated 10 June 2026), ''Biodiversity and Geological
  Conservation Assessment'' page (updated 23 October 2020). The council''s protected species criteria
  are in separate guidance linked from the page. On the listed building consent checklist: where work
  affects areas such as vaults or roof spaces a protected species survey may be needed. Listed on the
  householder, full, outline, reserved matters, listed building and conservation area demolition checklists;
  the mineral checklist asks for a wildlife habitat survey where protected species are known or suspected.'
review-status: unverified
field-status: {}
