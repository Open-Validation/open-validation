reference: air-quality-assessment
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - mineral-extraction
  - ref: major-development
  - discretionary
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/air-quality-assessment
policy: 'IAQM Land-Use Planning & Development Control: Planning for Air Quality; NPPF'
source-text: 'All major developments should be screened against the criteria in table 6.2 (page 21) of
  the IAQM planning guidance to determine whether an Air Quality Assessment is required. Major applications
  are developments of 10 or more dwellings, residential sites of 0.5 ha or more, and other buildings with
  a floor space of 1,000m2 or on sites of 1 hectare or more, and all waste applications.) These include
  developments which will: Cause a significant change in Light or Heavy Duty Vehicle traffic flows Realign
  existing roads Introduce or remove junctions near relevant receptors Introduce or change a bus station
  Have an underground car park with extraction system Have one or more substantial combustion processes'
must-include:
- item: Relevant details of the proposed development
  level: must
- item: Description of the relevant air quality standards and objectives
  level: must
- item: Details of the assessment method
  level: must
- item: Results of the modelling assessment
  level: must
- item: Summary of the assessment results
  level: must
- item: Appropriate mitigation measures as necessary
  level: should
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Air Quality Assessment' page
  (updated 16 July 2025). Major developments are screened against table 6.2 of the IAQM guidance (significant
  traffic change, realigned roads, junctions near receptors, bus stations, underground car parks with
  extraction, substantial combustion processes); the outcome of that screening is shown as discretionary.
  Also listed on the mineral extraction checklist.
review-status: unverified
field-status: {}
