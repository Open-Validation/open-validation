reference: planning-statement
local-authority: BAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - discretionary
  - all:
    - application-type:
        in:
        - demolition-con-area
        - mineral-extraction
    - discretionary
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/planning-statement
source-text: 'This requirement will be necessary for Major and Minor developments that involve complex
  or contentious policy issues such as: Housing development outside settlement boundaries Development
  which is opposed to the general character of the area Development that has significant impact on the
  natural environment or open space Development resulting in loss of community facilities Development
  involving affordable housing Development involving houses in multiple occupation Development involving
  student accommodation Development involving major minerals or waste operations etc.'
must-include:
- item: Context and need for the development
  level: must
- item: Relevant national, local and neighbourhood planning policies and supplementary guidance, with
    an assessment of how the development complies
  level: must
- item: Details of pre-application consultation with the council, ward members, local amenity groups,
    the wider community or statutory bodies
  level: must
- item: The business case for the development, where necessary
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Planning Statement' page
  (updated 16 July 2025). Shown as discretionary because it depends on 'complex or contentious policy
  issues', of which the page gives examples (housing outside settlement boundaries, affordable housing,
  HMOs, student accommodation, loss of community facilities, minerals or waste). Also listed on the conservation
  area demolition and mineral extraction checklists.
review-status: unverified
field-status: {}
