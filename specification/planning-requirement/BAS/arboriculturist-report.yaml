reference: arboriculturist-report
local-authority: BAS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The development affects a tree with a trunk diameter over 75 mm (at 1.5 m) on or next
        to the site.
source-url: https://www.bathnes.gov.uk/policy-and-documents-library/tree-survey-or-arboricultural-statement
policy: BS 5837:2012 Trees in relation to design, demolition and construction
source-text: You will need a tree survey or arboricultural statement if your development has an impact
  on any tree with a trunk diameter of over 75mm (as measured 1.5m above ground level) on, or adjacent
  to, the site.
must-include:
- item: Prepared following BS 5837:2012 (or any standard that supersedes it)
  level: must
- item: A tree survey, arboricultural impact assessment and tree retention and removal plan
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
- item: Arboricultural method statement (heads of terms) with an indicative tree protection plan showing
    barriers and where arboricultural supervision is needed
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
- item: Existing and proposed finished levels, underground services and any special construction details
    within root protection areas
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
- item: Soft landscape design with species and location of compensatory planting for removed trees
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
- item: Prepared by a suitably qualified arboriculturist
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
- item: 'Householder: scaled plan positioning the trunks of trees that could influence or be affected,
    numbered (T1, T2...), with species (common name), stem diameter at 1.5 m and whether retained or removed'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Any pre-development tree surgery works
  level: must
- item: 'Householder: compensatory planting for any removed trees'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Householder: the full planning level of detail where trees have a Tree Preservation Order or
    are in a conservation area'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Trees with a TPO or in a conservation area.
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Tree survey or arboricultural
  statement' page (updated 16 December 2025).
review-status: unverified
field-status: {}
