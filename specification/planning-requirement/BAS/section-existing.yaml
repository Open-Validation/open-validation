reference: section-existing
local-authority: BAS
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a significant change in ground levels.
  - discretionary
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where a proposal involves a significant change in ground levels, illustrative drawings should
  normally be submitted to show both existing and finished levels. These drawings should demonstrate how
  the proposed development would relate to existing site levels and neighbouring development.
must-include:
- item: Existing and proposed ground levels where significant cut and fill is proposed, or where slopes
    over 1 in 20 exist or will exist
  level: must
- item: Sections through buildings normally at 1:50 or 1:100, and through land normally at 1:200 or 1:500
  level: should
- item: A plan showing where the sections are taken, with the direction of north
  level: must
- item: Existing and proposed buildings within and next to the site, with finished floor and ridge levels
  level: must
- item: 'Level drawings: existing and proposed spot levels in a grid on a 1:200 or 1:500 plan, a fixed
    datum (usually AOD) and the finished floor levels of proposed buildings'
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Drawing Standards (best practice
  guide, 28 June 2023)' page. Section 8, page 10. The guide says these are 'required in some cases' and
  'should normally be submitted' for a significant change in levels; for householder development the levels
  may be evident from the floor plans and elevations, so it is also shown as discretionary. The council's
  local requirements page says that for all types of application the plans should follow its Drawing Standards
  best practice guide (28 June 2023), which says drawings without enough detail make the application invalid.
  Which drawings are needed comes from the national requirements (GOV.UK) that every checklist points
  to; the guide sets what they show.
review-status: unverified
field-status: {}
