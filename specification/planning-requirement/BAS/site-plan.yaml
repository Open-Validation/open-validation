reference: site-plan
local-authority: BAS
required-if: discretionary
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Most applications should include an existing site layout plan and a proposed site layout
  plan. For simple applications the existing and proposed site can be combined and shown on one plan so
  long as what is existing, what is proposed and what is to be demolished is highlighted and annotated
  clearly.
must-include:
- item: At a scale of 1:200 or 1:500
  level: must
- item: The proposed development, all existing buildings and structures, the garden and other open areas
  level: must
- item: Proposed buildings shaded
  level: must
- item: Position and size of existing and proposed hard surfaced areas (parking spaces, turning areas,
    paths)
  level: must
- item: The whole boundary of the property, with the position and height of all boundary walls and fences
  level: must
- item: Any buildings to be demolished
  level: must
- item: All trees (position, spread and species), and trees proposed for felling
  level: must
- item: All roads, footpaths and public rights of way adjoining the site
  level: must
- item: All existing buildings and structures on adjoining land, unless shown NOT to influence or be affected
    by the development
  level: must
- item: Shows the direction of north
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Drawing Standards (best practice
  guide, 28 June 2023)' page. Section 5, page 4. Shown as discretionary because the guide says 'most applications';
  existing and proposed can be combined on one plan for simple applications. The council's local requirements
  page says that for all types of application the plans should follow its Drawing Standards best practice
  guide (28 June 2023), which says drawings without enough detail make the application invalid. Which
  drawings are needed comes from the national requirements (GOV.UK) that every checklist points to; the
  guide sets what they show.
review-status: unverified
