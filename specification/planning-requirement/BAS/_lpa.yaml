review-status: unverified
validation-list:
  url: https://www.bathnes.gov.uk/full-planning-application
  date: 2026-06-10
  date-basis: 'B&NES publishes its local list only as web pages: an undated index (local requirements
    for planning applications) linking one checklist page per application type, each linking one page
    per requirement. The checklist pages are undated; each requirement page shows ''Published'' and ''Updated''
    dates. Most were revised between 29 April and 16 July 2025; the latest updates are Tree survey (16
    December 2025), Biodiversity Net Gain (27 February 2026), Viability Assessment (28 April 2026) and
    Waste Management Plan (10 June 2026), so the list date is the newest update, 10 June 2026. The full
    planning application checklist is used as the list URL; each file''s source-url is the requirement
    page (or other checklist) its wording comes from. The Drawing Standards best practice guide (28 June
    2023), linked from the index for all application types, gives the drawing contents and submission
    standards. Checked on 2026-11-06: no newer or draft list is published, and MHCLG''s register (planning.data.gov.uk,
    local-area-requirements) points to the same web checklists.'
  status: current
submission-standards:
- item: A separate list or schedule of drawings, plans and documents, with drawing numbers and plan titles
  level: should
- item: All plans and drawings accurately drawn using a conventional metric scale (such as 1:100 or 1:50),
    with the scale stated on the drawing
  level: must
- item: Except for location plans, plans and drawings include a scale bar and/or measured dimensions
  level: should
- item: Plans or drawings with disclaimers such as 'Not to scale' or 'Do not scale' are not accepted (perspectives
    excepted); drawings are true to the stated scales
  level: must
- item: Each plan/drawing has a title box stating the address, the proposal, the drawing title, the date,
    the scale and the drawing number
  level: should
- item: Revisions identified with a new number (e.g. D1a) and the date and details of the revision
  level: should
- item: Plans and drawings annotated so they are completely understandable
  level: should
- item: Every plan based on Ordnance Survey maps carries the Ordnance Survey copyright notice
  level: should
- item: Every file name says what the file shows (e.g. 'proposedfloorplans'); files without a meaningful
    and accurate file name are not accepted
  level: must
- item: Plans, drawings and documents orientated correctly and clear enough to view on the website; overly
    faint drawings and text are not accepted
  level: must
- item: Documents and files normally submitted in PDF format
  level: should
- item: Individual files no larger than 10 megabytes
  level: must
- item: Photographs labelled on the front with a title saying what is shown and where it was taken from
  level: should
audit:
