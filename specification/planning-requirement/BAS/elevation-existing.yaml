reference: elevation-existing
local-authority: BAS
required-if: discretionary
source-url: https://www.bathnes.gov.uk/sites/default/files/Best%20Practice%20Guide%20-%20Drawing%20Standards%20-%2028%20June%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In most cases, two separate sets of elevation drawings will be required, “existing” elevations
  showing the building as it is now and “proposed” elevations showing how the building will look, after
  the works have been carried out.
must-include:
- item: At a scale of 1:100 or 1:50, clearly annotated existing and proposed
  level: must
- item: Every elevation of the building, stating the direction each faces (e.g. rear (south))
  level: must
- item: 'For extensions: every elevation of the development in situ with each relevant elevation of the
    existing building, showing the whole of the existing building'
  level: must
- item: Outline elevations of other buildings close to the development, and the property boundary
  level: must
- item: Building(s) to be demolished
  level: must
- item: Colour and type of all external finishing materials described in detail
  level: must
- item: Position and size of all windows and doors (existing and proposed)
  level: must
confidence: medium
notes: From the council's list (web checklists, last updated 10 June 2026), 'Drawing Standards (best practice
  guide, 28 June 2023)' page. Section 6, page 6. Shown as discretionary because the guide says 'in most
  cases'. The council's local requirements page says that for all types of application the plans should
  follow its Drawing Standards best practice guide (28 June 2023), which says drawings without enough
  detail make the application invalid. Which drawings are needed comes from the national requirements
  (GOV.UK) that every checklist points to; the guide sets what they show.
review-status: unverified
field-status: {}
