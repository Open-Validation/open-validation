submission-standards:
- item: All plans and drawings accurately drawn to a conventional metric scale such as 1:100 or 1:50,
    and true to the stated scale
  level: must
- item: Plans/drawings containing disclaimers such as "Not to scale" and "Do not scale" will not be accepted
    (perspectives excepted)
  level: must
- item: Each plan/drawing has a title box stating the address, the proposal, the drawing title, the date,
    the scale and a unique drawing number
  level: should
- item: Revisions identified with a new number (e.g. D1a), with the date and details of the revision shown
    on the drawing
  level: should
- item: Plans and drawings fully annotated so they are completely understandable
  level: should
- item: Every plan based on Ordnance Survey maps carries the appropriate Ordnance Survey copyright notice
  level: should
- item: A separate list or schedule of drawings, plans and documents, with drawing numbers, submitted
    with the application
  level: should
- item: Existing and proposed drawings grouped side by side at the same scale; relevant measured dimensions
    included
  level: should
- item: Prior agreement obtained before submitting supporting documents on CD-ROM or USB memory stick
  level: must
