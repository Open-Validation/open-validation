reference: land-contamination-assessment
local-authority: SGC
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Historical or current use of the land or nearby land may have caused contamination
        (such as industrial, agricultural or landfill use, petrol filling stations, industrial and manufacturing
        sites), or contamination is known or suspected.
  - application-type:
      in:
      - mineral-app
      - waste-dev
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Rural building conversions to other uses.
  - condition:
      field: change-in-ground-levels
      value: true
      description: Importation of soils for land raising, flood defence, noise bunds, landscaped mounds
        or infilling, or other alteration of the topography.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion of a building.
    - condition:
        field: sensitive-end-use
        value: true
        description: To a higher sensitivity end use, e.g. agricultural or commercial to residential.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policy CS9; Policies, Sites and Places Plan
  (2017) policy PSP21; South Gloucestershire Local Plan policy EP6; South Gloucestershire Council Contaminated
  Land Strategy
source-text: 'Applications for sites where historical or current use of land or nearby land may have resulted
  in contamination of the land, such as industrial, agricultural, landfill etc. Examples may include:
  • Conversion or redevelopment of petrol filling stations • Redevelopment of industrial and manufacturing
  sites. • Mineral and waste applications. • Rural building conversions to other uses • Applications for
  the importation of soils etc for raising of land for flood defence purposes or creation of noise bunds,
  landscaped mounds on golf courses etc. • Developments involving the importation of soils etc for land
  raise/noise bunds/infilling etc. • Conversion of buildings to a higher sensitivity end use eg agricultural
  or commercial to residential Constraint - geographical or built Sites where there is known/suspected
  contamination issues with land and/or previous potentially contaminative uses Developments on sites
  with a known past potentially contaminative historical land use Applications for sites where previous
  or proposed alteration to the topography of the land or nearby land, for instance through infilling
  of the land may result in the land being contaminated'
must-include:
- item: An extended assessment of contamination in line with the Environment Agency's LCRM (Land contamination
    Risk Management, October 2020), by a competent person as defined in the NPPF
  level: must
- item: Considers the location of allotments and domestic gardens that can be used for food production
  level: must
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 4,
  18.
review-status: unverified
field-status: {}
