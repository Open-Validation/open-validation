reference: landscaping-plan
local-authority: SGC
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Works that would affect trees within the site (for example felling, pruning or lopping).
  - condition:
      field: landscaping-works
      value: true
      description: The proposal involves new planting.
source-url: https://beta.southglos.gov.uk/static/73baebe0e4fa06a5abaf9a98107ac464/Planning-application-guidance-plans-and-drawings.pdf
source-text: If the proposal involves any works that would affect any trees within the application site,
  for example, the felling of a tree or the pruning or lopping of branches, or if the proposal involves
  any new planting, landscaping details and plans will be required.
must-include:
- item: The position and spread of the existing trees, their species and condition
  level: must
- item: Trees to be retained and the measures to protect them, and which (if any) are to be felled
  level: must
- item: The size, species and positions of trees to be planted, and boundary treatments
  level: must
confidence: medium
notes: From the council's list, Part 3 ('Planning application guidance - plans and drawings', the separate
  drawing standards document the list points to), page 13. Landscaping schemes are often dealt with by
  condition.
review-status: unverified
field-status: {}
