reference: heritage-statement
local-authority: SGC
required-if:
  any:
  - site:
      in:
      - listed-building
      - locally-listed-building
      description: Affects a nationally or locally listed building or its setting.
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      description: In or affecting a conservation area or its setting.
  - site:
      in:
      - battlefield
      description: Affects a registered historic battlefield or its setting.
  - site:
      in:
      - park-and-garden
      description: Affects a nationally or locally designated park or garden or its setting.
  - site:
      in:
      - scheduled-monument
      description: Affects a scheduled ancient monument or its setting.
  - site:
      in:
      - archaeological-priority-area
      description: Affects an archaeological site or its setting.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policy CS9; Policies, Sites and Places Plan
  (2017) policy PSP17; South Gloucestershire Design Checklist SPD; Conservation Area Appraisal SPDs; Local
  List SPD
source-text: 'Applications affecting a nationally or locally listed building (including applications for
  listed building consent)* Applications in and affecting a conservation area* Application affecting a
  registered Historic Battlefield* Applications affecting nationally and locally designated parks and
  gardens* Application affecting a Scheduled Ancient Monument* Applications affecting archaeological sites
  - including Scheduled Ancient Monument* *and their settings Excludes: Change of use, advertisements,
  and householder applications unless adjoining or adjacent'
must-include:
- item: A description of the significance of the heritage asset or assets affected, including their setting
    (the 'Statement of Significance')
  level: must
- item: A clear description of the proposed development, in particular the aspects likely to affect the
    significance of the heritage asset(s) or their setting
  level: must
- item: 'Mitigation: what steps have been taken to avoid, minimise or mitigate any harm to the significance
    of the heritage asset(s)'
  level: must
- item: How an understanding of significance has shaped the proposal
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 7,
  30-32. The list calls it 'Statements of Heritage Significance'. It excludes change of use, advertisements
  and householder applications unless they adjoin or are adjacent to the asset; the rule format cannot
  exclude types, so this is said here. The statement can be part of the Design and Access Statement.
review-status: unverified
field-status: {}
