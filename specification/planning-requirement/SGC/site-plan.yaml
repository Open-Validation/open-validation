reference: site-plan
local-authority: SGC
required-if: discretionary
source-url: https://beta.southglos.gov.uk/static/73baebe0e4fa06a5abaf9a98107ac464/Planning-application-guidance-plans-and-drawings.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Most applications should include an existing site layout plan and a proposed site layout
  plan.
must-include:
- item: At a scale of 1:200 or 1:500
  level: should
- item: The proposed works shaded
  level: should
- item: The proposed building(s), all existing buildings and structures, the garden and other open areas
  level: should
- item: All trees (position, spread and species), identifying trees to be felled
  level: should
- item: The whole boundary of the property, with the position and height of all boundary walls and fences
  level: should
- item: The position and size of existing and proposed hard surfaced areas (parking spaces, turning areas,
    paths)
  level: should
- item: Any buildings to be demolished
  level: should
- item: All roads, footpaths and public rights of way adjoining the site, and immediately adjacent properties
  level: should
- item: The direction of north
  level: should
confidence: medium
notes: From the council's list, Part 3 ('Planning application guidance - plans and drawings', the separate
  drawing standards document the list points to), page 6. The guidance calls it a block plan or site layout
  plan. 'Most applications' is not defined, so it is shown as discretionary.
