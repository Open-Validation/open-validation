reference: location-plan
local-authority: SGC
required-if:
  always: true
source-url: https://beta.southglos.gov.uk/static/73baebe0e4fa06a5abaf9a98107ac464/Planning-application-guidance-plans-and-drawings.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site location plan is a map base that shows the location of the application site in relation
  to surrounding roads, buildings and other land.
must-include:
- item: Taken from an up to date Ordnance Survey base, or to an equivalent standard
  level: should
- item: At a scale of 1:1000, 1:1250 or 1:2500 for larger sites
  level: should
- item: Where possible, covers an A4 sheet with the application site in the centre
  level: should
- item: Adjoining road names and numbers
  level: should
- item: The application site boundary, including the access to the site from a public highway, outlined
    in red
  level: should
- item: Any other adjoining land owned by the applicant outlined in blue
  level: should
confidence: medium
notes: From the council's list, Part 3 ('Planning application guidance - plans and drawings', the separate
  drawing standards document the list points to), page 5. The guidance does not say when a location plan
  is needed (it is a national requirement for every application); the items are what it says a location
  plan 'should' show.
review-status: unverified
field-status: {}
