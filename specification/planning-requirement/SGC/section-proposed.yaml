reference: section-proposed
local-authority: SGC
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: new-build
      value: true
      description: The application involves new buildings (site levels and finished floor levels).
source-url: https://beta.southglos.gov.uk/static/73baebe0e4fa06a5abaf9a98107ac464/Planning-application-guidance-plans-and-drawings.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings should
  be submitted to show both existing and finished levels to include details of foundations and eaves and
  how encroachment onto adjoining land is to be avoided. … This will be required for all applications
  involving new buildings.
must-include:
- item: At a scale of 1:50 or 1:100, with a cross section(s) through the proposed building(s)
  level: should
- item: Existing and finished levels, with details of foundations and eaves and how encroachment onto
    adjoining land is avoided
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: Existing and proposed ground levels where significant cut and fill is proposed or slopes exceed
    1 in 20
  level: must
- item: Existing site levels and finished floor levels related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New buildings.
confidence: medium
notes: From the council's list, Part 3 ('Planning application guidance - plans and drawings', the separate
  drawing standards document the list points to), page 10. Headed 'required in some cases'. For householder
  development the levels may be evident from the floor plans and elevations.
review-status: unverified
field-status: {}
