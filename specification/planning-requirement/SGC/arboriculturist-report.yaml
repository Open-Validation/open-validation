reference: arboriculturist-report
local-authority: SGC
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Protected trees, or any trees on the site or on adjacent land (including street trees),
        that may be affected by the proposal.
  - site:
      in:
      - tree-preservation-zone
      description: Sites with Tree Preservation Orders.
  - site:
      in:
      - conservation-area
      description: Sites within a conservation area.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policies CS2 and CS9; Policies, Sites and
  Places Plan (2017) policy PSP3; South Gloucestershire Local Plan policy L1; Trees on Development Sites
  SPD; South Gloucestershire Design Checklist SPD
source-text: All sites where protected tree(s), or any tree(s) on the site or on adjacent land that may
  be affected by the proposal. Sites with Tree Preservation Orders (TPO) Sites within a conservation area
must-include:
- item: Which trees are to be retained or removed, and how retained trees will be protected during construction
  level: must
- item: Prepared by a qualified arboriculturist
  level: must
- item: Survey information, tree protection plan and method statement as set out in BS 5837:2012
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 6,
  26. The list calls it 'Tree Survey / Arboricultural Implications'.
review-status: unverified
field-status: {}
