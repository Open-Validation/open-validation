reference: lighting-assessment
local-authority: SGC
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
  - condition:
      field: external-lighting
      value: true
      description: A significant amount of external lighting would be provided or made necessary (for
        example near homes, a listed building, a conservation area or open countryside).
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
source-text: Lighting Assessment Proposals involving the provision of publicly accessible developments,
  in the vicinity of residential property, a listed building or a conservation area, or open countryside,
  including /for flood lighting or a significant amount of external lighting would be provided or made
  necessary by the development, should be required to be accompanied by details of external lighting and
  the proposed hours when the lighting would be…
must-include:
- item: Details of external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
- item: Calculations (vertical illuminance, ULR calculations, etc.) as required
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): the workbook put this under Listed building consent because the text mentions
  a listed building, which is a location here. The calculations item was in the workbook''s ''Advertisement
  drawings'' row.'
review-status: unverified
field-status: {}
