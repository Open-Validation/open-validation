reference: lighting-assessment
local-authority: SGC
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting.
    - discretionary
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policy CS1; Policies, Sites and Places Plan
  (2017) policies PSP21 and PSP8; South Gloucestershire Design Checklist SPD
source-text: Applications including/for floodlighting, or a significant amount of external lighting
must-include:
- item: Details of the external lighting and the hours when it would be switched on
  level: must
- item: A layout plan with beam orientation and a schedule of the equipment in the design
  level: must
- item: Supporting information proving compliance with the British Standards and ILP GN01-21, such as
    an isolux contour plan showing light spill, glare calculations, vertical illuminance and ULR calculations,
    as required
  level: must
- item: A composite plan showing the position of the external lighting in relation to the landscaping,
    public open space, highway and below-ground infrastructure
  level: must
  required-if:
    all:
    - ref: major-development
    - application-type:
        in:
        - full
        - reserved-matters
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 5,
  24-26. 'A significant amount of external lighting' has no threshold, so it is discretionary. The composite
  plan is for major development and does not apply to outline applications.
review-status: unverified
field-status: {}
