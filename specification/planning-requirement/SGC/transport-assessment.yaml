reference: transport-assessment
local-authority: SGC
required-if:
  any:
  - discretionary
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - application-type:
        in:
        - full
        - reserved-matters
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policy CS8; Policies, Sites and Places Plan
  (2017) policies PSP11 and PSP16; Residential Parking Standards SPD (2013)
source-text: All development where there are likely to be significant transportation implications. All
  major development that would require full planning permission or where details submitted as part of
  reserved matters submission.
must-include:
- item: 'Proportionate form: a Transport Assessment for substantial developments that generate significant
    travel movement; a Transport Statement for less significant developments; or part of the Design and
    Access Statement for small developments'
  level: should
- item: Access details by mode of travel, and access designs including safety (e.g. visibility splays
    to the 85th percentile speed of traffic)
  level: should
- item: Distances to walkable and cycleable services and facilities, and accordance with policy PSP11
  level: should
- item: Relationship to surrounding cycling infrastructure and public transport provision (distance to
    and quality of stops, bus journey times)
  level: should
- item: Cycle and car parking in line with PSP16; non-residential parking provision and justification
  level: should
- item: Electric vehicle charging provision
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 9,
  38-39. The list calls it 'Assessment of Transport Impact'. 'Significant transportation implications'
  has no threshold, so that branch is discretionary. The scope of a TS or TA for larger developments should
  be agreed at pre-application stage.
review-status: unverified
field-status: {}
