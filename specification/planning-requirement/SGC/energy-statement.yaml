reference: energy-statement
local-authority: SGC
required-if:
  ref: major-development
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: Climate Change Act 2008; South Gloucestershire Local Plan Core Strategy (2013) policies CS1(8),
  CS3 and CS4; Policies, Sites and Places Plan (2017) policy PSP6; Renewables SPD
source-text: Major development proposals are required to provide an energy assessment. Major development
  is defined as 10 or more dwellings or over 1000sqm of commercial space. … A Sustainable Energy Statement
  is required to be submitted with all major (residential and non- residential) development proposals
  in order to provide the information necessary to evaluate compliance with the council’s planning policies.
must-include:
- item: The predicted total energy consumption of the development and the associated carbon emissions
  level: must
- item: An assessment of the measures proposed to minimise energy consumption, supply energy using zero
    and/or low carbon technology, and generate renewable energy
  level: must
- item: Data setting out the carbon savings achieved through the various measures
  level: must
- item: How the development complies with policies CS1(8), CS3, CS4 and PSP6
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 8,
  35-36. The list defines major development here as 10 or more dwellings or over 1000 sq m of commercial
  space. It also lists which energy policies apply to which proposals (CS4 heat networks for more than
  100 dwellings at over 50 dwellings per hectare or non-residential over 10,000 sq m, and so on); these
  say which policies the statement must address, not when it is needed.
review-status: unverified
field-status: {}
