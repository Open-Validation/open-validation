reference: noise-assessment
local-authority: SGC
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development (such as homes, schools and hospitals), including sites
        next to major road/transport infrastructure or any other significant noise source.
  - condition:
      field: noise-generating-use
      value: true
      description: Uses that involve activities that may generate significant levels of noise.
  - discretionary
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: Policies, Sites and Places Plan (2017) policies PSP21 and PSP8; South Gloucestershire Local Plan
  policy EP4
source-text: Applications for noise sensitive development including sites adjacent to major road/transport
  infrastructure and any other significant noise source. To include residential and all noise sensitive
  development, for example schools and hospitals. Applications for uses that involve activities that may
  generate significant levels of noise. Constraint - geographical or built DEFRA noise mapping and designated
  quiet areas.
must-include:
- item: An assessment of environmental noise and an appropriate scheme of mitigation measures
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 3,
  17. The constraint 'DEFRA noise mapping and designated quiet areas' gives no threshold, so it is shown
  as discretionary.
review-status: unverified
field-status: {}
