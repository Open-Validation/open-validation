reference: town-centre-impact-assessment
local-authority: SGC
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Main town centre uses not in an existing centre (sequential assessment).
    - discretionary
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 1000
      description: Retail, office or leisure development of 1000 sq m gross or more (impact assessment).
  - all:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 350
        description: Retail (former Class A1) development of 350 sq m or more.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside the Primary Shopping Area.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policies CS14 and CS14A; Policies, Sites
  and Places Plan (2017) policy PSP31
source-text: Sequential Assessment for main town centre uses not in an existing centre and not in accordance
  with an up-to- date Local Plan.(Not applicable for smallscale rural development) … Impact Assessment
  for Retail, Office and Leisure South Gloucestershire Council Core Strategy Reduces threshold for impact
  assessments to 1000 square metres gross Sites and Places Plan PSP Policy - PSP31 - A1 retail. New threshold
  of 350m2 and above for retail impact assessment, where A1 development proposed outside of the Primary
  Shopping Area
must-include:
- item: The capacity/need for the development and whether it is of an appropriate scale
  level: should
- item: That there are no sites close to a centre for the development (sequential assessment)
  level: should
- item: That there are no unacceptable impacts on existing centres, and whether locations are accessible
  level: should
- item: Evidence of how the development would contribute to social inclusion (access to jobs, services
    and facilities, training and other positive effects on disadvantaged communities)
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 9,
  37. The list calls it 'Evidence to Accompany Applications for Town Centre Uses'. The sequential assessment
  applies only where the proposal is 'not in accordance with an up-to-date Local Plan' and not small-scale
  rural development, which no field records, so that branch is discretionary. The scope should be agreed
  with officers first.
review-status: unverified
field-status: {}
