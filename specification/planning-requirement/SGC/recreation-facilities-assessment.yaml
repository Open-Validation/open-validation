reference: recreation-facilities-assessment
local-authority: SGC
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential or mixed development.
  - site:
      in:
      - open-space
      description: Within existing open space, sport and recreational buildings or land, including playing
        fields.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: Policies, Sites and Places Plan (2017) policy PSP44; NPPF
source-text: Major residential or mixed development … For major residential development or mixed development
  within existing open spaces, application proposals should be accompanied by plans showing any areas
  of existing or proposed open space within or adjoining the application site.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: must
- item: An assessment showing the open space, buildings or land to be surplus to requirements; or that
    the loss would be replaced by equivalent or better provision; or that the development is for alternative
    sports and recreational provision whose need clearly outweighs the loss
  level: must
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 5,
  23. The list calls it 'Assessment of Proposed Development within Existing Open Space'. The assessment
  item is one of the three ways the list says loss of open space can be justified.
review-status: unverified
field-status: {}
