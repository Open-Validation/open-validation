reference: bng-metric
local-authority: SGC
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: Environment Act 2021; Policies, Sites and Places Plan (2017) policy PSP19; South Gloucestershire
  Council Biodiversity and Planning Supplementary Planning Document (2023)
source-text: All developments unless exempt.
must-include:
- item: A draft Biodiversity Net Gain Plan setting out how a minimum of 10% BNG will be achieved, with
    the completed draft metric (Excel)
  level: must
- item: The pre-development habitat survey and biodiversity value, including the results of condition
    assessments
  level: must
- item: How the mitigation hierarchy and BNG hierarchy have been followed
  level: must
- item: How the Metric Principles and Good Practice Principles are adhered to
  level: must
- item: The approach taken to retain, create and enhance onsite habitats, taking account of other requirements
    for greenspace within the development
  level: must
- item: How any need for offsite units will be met
  level: must
- item: The expected post-development biodiversity value and the result of the draft BNG calculation
  level: must
- item: Prepared by a professional ecologist with suitable qualifications and experience, in line with
    BS 8683
  level: must
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 6,
  27. The list says 'All developments unless exempt'; the rule follows the law (the biodiversity gain
  condition), so householder and other exempt applications are left out.
review-status: unverified
field-status: {}
