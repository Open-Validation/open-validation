reference: archaeological-assessment
local-authority: SGC
required-if:
  all:
  - any:
    - site:
        in:
        - scheduled-monument
        description: Affects a scheduled ancient monument.
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Development (other than householder) involving ground disturbance.
      - any:
        - site:
            in:
            - historic-environment-record
            description: Archaeological heritage assets recorded on the South Gloucestershire HER.
        - discretionary
  - discretionary
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: Policies, Sites and Places Plan (2017) policy PSP17; NPPF
source-text: For all applications affecting Scheduled Ancient Monuments and all other applications for
  development (excluding householder applications), involving ground disturbance within historic settlements
  (recorded on the 1st edition Ordnance Survey Map c. 1881) and archaeological heritage assets recorded
  on the South Gloucestershire HER, an assessment of the archaeological potential of the development site
  may be required.
must-include:
- item: The results of any assessment, including any proposed mitigation where heritage assets or their
    setting are affected
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 32.
  Part 2 of the list (under the heritage statement) says the assessment 'may be required', so the whole
  rule is discretionary. Historic settlements (recorded on the 1st edition Ordnance Survey map, c. 1881)
  have no dataset, so that part is discretionary too. Householder applications are excluded (except where
  they affect a scheduled monument).
review-status: unverified
field-status: {}
