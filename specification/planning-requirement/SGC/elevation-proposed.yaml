reference: elevation-proposed
local-authority: SGC
required-if: discretionary
source-url: https://beta.southglos.gov.uk/static/73baebe0e4fa06a5abaf9a98107ac464/Planning-application-guidance-plans-and-drawings.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In most cases, two separate sets of elevation drawings will be required, "existing" elevations
  showing the building as it is now and "proposed" elevations showing how the building will look, after
  the works have been carried out.
must-include:
- item: At a scale of 1:100 or 1:50, clearly annotated existing and proposed
  level: should
- item: Every elevation of the building, stating the direction each faces (e.g. rear (south))
  level: should
- item: The whole of any existing building to be altered or extended, so the relationship with the new
    work can be seen
  level: should
- item: The property boundary and parts of adjoining properties
  level: should
- item: Colour and type of all finishing materials (roof covering, wall facing, window frames and doors)
  level: should
- item: Any building(s) to be demolished
  level: should
confidence: medium
notes: From the council's list, Part 3 ('Planning application guidance - plans and drawings', the separate
  drawing standards document the list points to), page 7. 'In most cases' is not defined, so it is shown
  as discretionary.
review-status: unverified
field-status: {}
