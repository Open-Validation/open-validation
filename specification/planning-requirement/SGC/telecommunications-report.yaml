reference: telecommunications-report
local-authority: SGC
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications development.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: Policies, Sites and Places Plan (2017) policy PSP36; Core Strategy (Maintaining Economic Prosperity,
  chapter 9)
source-text: All telecom development
must-include:
- item: Area of search details and details of alternative sites
  level: must
- item: Details of any consultation undertaken, including relationship to schools and other electronic
    communications equipment
  level: must
- item: Details of the proposed structure, technical information (frequency modulation characteristics,
    power output) and technical justification
  level: must
- item: Acoustic report
  level: must
- item: Visual impact assessment
  level: must
- item: Supplementary information template (Annex F of the Code of Best Practice)
  level: must
- item: A signed ICNIRP declaration that the equipment and installation comply with the radio frequency
    public exposure guidelines
  level: must
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 6,
  29. The list calls it 'Telecommunication Information'.
review-status: unverified
field-status: {}
