reference: affordable-housing-statement
local-authority: SGC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings (residential or mixed-use development).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A site of 0.5 hectares or more.
  - all:
    - site:
        in:
        - designated-rural-area
        description: A designated rural area (in South Gloucestershire, the Cotswold Area of Outstanding
          Natural Beauty).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.2
          description: A site of 0.2 hectares or more.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policies CS18, CS19 and CS20; Affordable
  Housing and Extra Care SPD
source-text: Residential or mixed-use development 10 or more dwellings or 0.5 hectares and above unless
  the site is in a designated rural area where the threshold is 5 dwellings or more or 0.2 hectares and
  above
must-include:
- item: The total number of dwellings proposed
  level: must
- item: The number of affordable dwellings proposed
  level: must
- item: The tenure split (social rent, first homes, shared ownership or affordable) of the affordable
    dwellings, with an explanation if the split does not meet the council's preferred terms
  level: must
- item: The type and number of bedrooms of the market dwellings
  level: must
- item: A layout plan with the location of each affordable housing dwelling highlighted, with a key showing
    the unit type
  level: must
- item: 'An affordable housing schedule: plot number, unit type, tenure, number of bedrooms, number of
    persons, accessibility build standard and size in m2'
  level: must
- item: The build standards the dwellings are being built to (e.g. Building Regulations M4(2) and M4(3))
  level: must
- item: Delivery method (i.e. through a Homes West registered provider)
  level: must
- item: Information showing First Homes will be marketed and sold in line with national policy and local
    guidance
  level: must
- item: 'Financial cost and affordability of any intermediate affordable housing: type of product, equity
    share sold, any interest charged on the remaining share, open market value'
  level: must
- item: Details of any phasing plans if the site is to be built out over more than one phase
  level: must
- item: Any service charges (landscaping, unadopted roads, communal areas, management and maintenance)
  level: must
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 2,
  11-12. Part 2 explains that the only designated rural areas in South Gloucestershire are in the Cotswold
  Area of Outstanding Natural Beauty, where the lower threshold (5 or more dwellings or 0.2 ha) applies.
  The statement must also include details of any registered providers acting as partners.
review-status: unverified
field-status: {}
