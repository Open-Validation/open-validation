reference: viability-assessment
local-authority: SGC
required-if:
  any:
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings (residential or mixed-use development).
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: A site of 0.5 hectares or more.
      - all:
        - site:
            in:
            - designated-rural-area
            description: A designated rural area (in South Gloucestershire, the Cotswold Area of Outstanding
              Natural Beauty).
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 5
              description: 5 or more dwellings.
          - condition:
              field: site-area-residential
              operator: '>='
              value: 0.2
              description: A site of 0.2 hectares or more.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The proposal does not comply with the affordable housing requirement of policy CS18.
  - all:
    - ref: major-development
    - condition:
        field: greenfield-site
        value: true
        description: Greenfield development.
    - discretionary
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policy CS18; Policies, Sites and Places
  Plan (2017) policy PSP6; Affordable Housing and Extra Care SPD
source-text: Residential or mixed-use development, meeting affordable housing thresholds, where proposals
  do not comply with the requirement of CS18. Major greenfield development proposals stating not viable
  to further reduce by 20% C02 emissions, via renewable or low carbon energy generation. PSP6 Constraint
  - geographical or built.
confidence: medium
notes: 'From the council''s list (published 2024, this version no older than late November 2024), page
  2, 13. The PSP6 branch (a major greenfield proposal that says it is not viable to cut CO2 emissions
  by a further 20% through renewable or low carbon energy) is shown as discretionary: it depends on what
  the applicant argues, which no field records. The list gives no constraint after ''Constraint - geographical
  or built.'' Part 2 points to Appendix 2 of the Affordable Housing and ExtraCare SPD for details.'
review-status: unverified
field-status: {}
