reference: air-quality-assessment
local-authority: SGC
required-if:
  any:
  - discretionary
  - all:
    - ref: major-development
    - discretionary
  - site:
      in:
      - air-quality-management-area
      description: Within or adjacent to an air quality management area or area of air quality concern.
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policy CS9; Policies, Sites and Places Plan
  (2017) policy PSP21
source-text: 'Developments that meet the indicative criteria for requiring an air quality assessment as
  outlined in EPUK/IAQM Land-Use Planning & Development Control: Planning for Air Quality (2017) and associated
  guidance. All major developments (residential, non-residential, mixed use), major road schemes and other
  small industrial processes, such as those regulated under the Clean Air Act, depending on local circumstances.
  Any relevant proposal in a location within or adjacent to an air quality management area or area of
  air quality concern Unlikely to be required for householder applications'
must-include:
- item: The change in air quality resulting from the development and/or the impacts on receptors introduced
    into an area of existing poor air quality
  level: should
- item: Appropriate mitigation measures as necessary
  level: should
- item: 'Carried out in line with EPUK/IAQM Land-Use Planning & Development Control: Planning for Air
    Quality (2017) by a suitably qualified person'
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 3,
  16. The EPUK/IAQM indicative criteria are not repeated in the list, so that part is discretionary; major
  developments, major road schemes and small industrial processes are listed 'depending on local circumstances',
  so they are discretionary too. The list says it is unlikely to be required for householder applications.
review-status: unverified
field-status: {}
