reference: floor-plan-proposed
local-authority: SGC
required-if: discretionary
source-url: https://beta.southglos.gov.uk/static/73baebe0e4fa06a5abaf9a98107ac464/Planning-application-guidance-plans-and-drawings.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'In most cases, two separate sets of floor plans will be required: "existing" floor plans
  showing the building as it is now and "proposed" floor plans showing how the building will look, after
  the works have been carried out.'
must-include:
- item: At a scale of 1:100 or 1:50, clearly annotated existing and proposed
  level: should
- item: All floor levels (including roof levels) of the building(s) being built, altered or extended,
    in relation to the rest of the building, with each floor clearly labelled
  level: should
- item: The use of each room and the position of windows, doors, walls and partitions
  level: should
- item: The property boundary and parts of adjoining properties
  level: should
- item: Whether there will be any encroachment (e.g. foundations) onto adjoining property where the building
    is on a boundary
  level: should
- item: Anything to be demolished, and the direction of north
  level: should
confidence: medium
notes: From the council's list, Part 3 ('Planning application guidance - plans and drawings', the separate
  drawing standards document the list points to), page 9. 'In most cases' is not defined, so it is shown
  as discretionary.
review-status: unverified
field-status: {}
