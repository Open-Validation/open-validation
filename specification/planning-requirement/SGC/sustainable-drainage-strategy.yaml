reference: sustainable-drainage-strategy
local-authority: SGC
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
source-url: https://beta.southglos.gov.uk/static/a2b5319e25b7e3a805507cbb73796fce/Planning-application-requirements-local-list-2024.pdf
policy: South Gloucestershire Local Plan Core Strategy (2013) policies CS1 and CS9; Policies, Sites and
  Places Plan (2017) policy PSP20; Sustainable Drainage SPD
source-text: All major development that would require full planning permission or where details submitted
  as part of reserved matters submission. … All minor development that would require full planning permission
  or where details submitted as part of reserved matters submission. … This information will be required
  for both outline and full applications so it is clearly demonstrated that the SuDS can be accommodated
  within the development that is proposed.
must-include:
- item: Details of the SuDS, proportionate to the size of the development
  level: must
- item: 'Outline applications: an outline drainage strategy showing the conceptual surface water drainage
    design, existing surface water run-off rates, indicative post-development run-off rates and storm
    water storage requirements'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Full and reserved matters applications: a detailed surface water drainage design showing that
    opportunities to integrate SuDS have been maximised, with any obstacles fully justified'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Landscape details such as tree or shrub planting shown on the drainage plans
  level: should
confidence: medium
notes: From the council's list (published 2024, this version no older than late November 2024), page 5,
  21-22. The list calls it 'Surface Water Drainage Details'; MHCLG's retired id sustainable-drainage-strategy
  is used. Part 1 names full and reserved matters applications; Part 2 adds that the information is needed
  for outline applications too.
review-status: unverified
field-status: {}
