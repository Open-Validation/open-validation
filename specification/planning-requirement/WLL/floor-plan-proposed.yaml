reference: floor-plan-proposed
local-authority: WLL
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The application includes proposed floorspace.
  - condition:
      field: involves-change-of-use
      value: true
      description: The application includes existing floorspace (e.g. a change of use).
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications that include existing and/or proposed floorspace:'
must-include:
- item: Plans labelled clearly and logically, e.g. room names
  level: must
- item: Internal divisions within the building
  level: must
- item: Existing layout (where relevant) and proposed layout shown clearly, e.g. different coloured lines
    with a key
  level: must
- item: At an identified metric scale, typically 1:100, 1:200 or 1:500
  level: must
- item: Scaled to fit onto A4 or A3 paper
  level: should
- item: The 45-degree line(s) from the nearest neighbours' habitable windows, where relevant
  level: should
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 18; householder checklist (Version
  2.0), page 14. LV9 'Floor Plans - Existing and Proposed'. The 45-degree line is optional ('you may wish
  to choose to show'), so it is a 'should'.
review-status: unverified
field-status: {}
