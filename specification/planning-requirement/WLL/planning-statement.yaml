reference: planning-statement
local-authority: WLL
required-if:
  all:
  - ref: major-development
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF
source-text: Major applications (10 or more dwellings or 1,000m2 or more of new floorspace) including
  change of use applications, extensions and mezzanine floors, except for waste management and mineral
  development applications.
must-include:
- item: A general description of the application site and of the proposed development
  level: must
- item: A summary of how the proposal accords with national and local planning policies, including those
    on the sustainable use and consumption of resources
  level: must
- item: A statement showing the proposal is sustainable development
  level: should
- item: A statement showing the proposal is consistent with development plan land use policy, or a justified
    departure (with reasons)
  level: should
- item: 'An Energy Statement: energy efficiency and renewable/low carbon energy'
  level: should
- item: A Waste and Resource Management Statement
  level: should
- item: A Water Conservation Statement
  level: should
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 36-37. LV26.
review-status: unverified
field-status: {}
