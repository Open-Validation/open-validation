reference: elevation-proposed
local-authority: WLL
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: new-build
      value: true
      description: The application includes proposed buildings.
  - condition:
      field: building-works
      value: true
      description: The application includes works to existing buildings.
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications that include existing and/or proposed building(s):'
must-include:
- item: All elevations clearly and logically labelled (e.g. front or rear elevation), with titles that
    refer to their content
  level: must
- item: Existing and proposed elevations shown clearly, e.g. by different shading or colour with a key
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of the openings on each property'
  level: should
- item: 'Where an existing building is extended or altered: the whole of any existing elevation being
    extended or altered, not just part of it'
  level: must
- item: At an identified metric scale, typically 1:100, 1:200 or 1:500
  level: must
- item: Scaled to fit onto A4 or A3 paper
  level: should
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 18; householder checklist (Version
  2.0), page 15. LV10 'Elevation Plans - Existing and Proposed'.
review-status: unverified
field-status: {}
