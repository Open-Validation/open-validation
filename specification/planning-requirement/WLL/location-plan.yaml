reference: location-plan
local-authority: WLL
required-if:
  always: true
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location plan based on an up-to-date ordnance survey map.
must-include:
- item: Shows the application site in relation to the surrounding area
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: At an identified metric scale, typically 1:1250 or 1:2500
  level: must
- item: The direction of North
  level: must
- item: Application site edged clearly in red, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: The red line also includes any associated works to the highway outside the site (e.g. dropped
    kerb, new vehicular access)
  level: should
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: 'Based on an up-to-date Ordnance Survey map: not a photocopy or screen grab, not a Land Registry
    map, not reused for multiple applications without a bulk copy licence, and not copied from OS mapping
    if hand drawn'
  level: must
- item: Shows the OS Crown copyright acknowledgement and the correct licence number
  level: must
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 12-13; householder checklist (Version
  2.0), page 11. NV5.
review-status: unverified
field-status: {}
