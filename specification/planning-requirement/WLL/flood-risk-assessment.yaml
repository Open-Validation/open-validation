reference: flood-risk-assessment
local-authority: WLL
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site area of 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site area of 1 hectare or more in Flood Zone 1.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
    - condition:
        field: new-build
        value: true
        description: New development (excluding extensions at first floor or above).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: A minor extension in Flood Zone 2 or 3.
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF; Environment Agency standing advice
source-text: Flood Risk Assessment required for planning applications where the site area is 1 hectare
  or more in Flood Zone 1. Flood Risk Assessment required for all planning applications for new developments
  (excluding extensions at first floor or above) located in Flood Zones 2 and 3. … Applicants should use
  the Environment Agency’s published advice for minor extensions to complete the form published alongside
  this checklist for a minor extension falling within Flood Zones 2 or 3.
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
- item: That the development is safe and where possible reduces flood risk overall
  level: must
- item: Whether it will increase flood risk elsewhere
  level: must
- item: The measures proposed to deal with these effects and risks
  level: must
- item: Design that reduces flood risk using sustainable drainage and, where necessary, flood resilience
    measures
  level: must
- item: How surface water flows will be reduced back to equivalent greenfield rates
  level: must
- item: Any impacts of a SuDS proposal on the significance of heritage assets
  level: must
- item: 'Householder minor extension (up to 250 sq m) in Flood Zone 2 or 3: the Environment Agency minor
    extensions form'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 26; householder checklist (Version
  2.0), page 18. LV17 'Flood Risk Assessment & Sustainable Urban Drainage Strategy' and, for householders,
  LHV16 'Flood Risk Environment Agency Form'. See the council's West Midlands FRA guidance note.
review-status: unverified
field-status: {}
