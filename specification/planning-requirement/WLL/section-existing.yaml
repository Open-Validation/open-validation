reference: section-existing
local-authority: WLL
required-if:
  condition:
    field: site-level-change
    operator: '>'
    value: 300
    description: Changes to site levels by more than 0.3 metres.
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications that include changes to site levels by more than 0.3 metres:'
must-include:
- item: Any proposed changes to site levels over 0.3 metres within the site
  level: must
- item: Any relationship with adjoining changes in land levels
  level: must
- item: Cross section(s) through the proposed building(s) and/or extension(s)
  level: must
- item: At an identified metric scale, typically 1:100, 1:200 or 1:500
  level: must
- item: Scaled to fit onto A4 or A3 paper
  level: should
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 19; householder checklist (Version
  2.0), page 16. LV12 'Site Section Plans'; the householder checklist (LHV11) has the same contents.
review-status: unverified
field-status: {}
