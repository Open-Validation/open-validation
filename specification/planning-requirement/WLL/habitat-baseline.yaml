reference: habitat-baseline
local-authority: WLL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Environment Act 2021; Biodiversity Gain Requirements (Exemptions) Regulations 2024
source-text: A plan, drawn to an identified scale which must show the direction of North, showing onsite
  habitat existing on the date of application, including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale, with the direction of North
  level: must
- item: On-site habitat existing on the date of application, including any irreplaceable habitat
  level: must
- item: 'Outline: a description of any irreplaceable habitat on the land'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 30-31. LV20, for both outline and
  full applications. Only for development subject to the biodiversity gain condition (householder and
  other exempt applications are exempt by law).
review-status: unverified
field-status: {}
