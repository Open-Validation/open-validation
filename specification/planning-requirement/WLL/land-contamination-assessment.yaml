reference: land-contamination-assessment
local-authority: WLL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves excavation, ground works or other ground disturbance.
    - condition:
        field: new-build
        value: true
        description: New development, not only a change of use or adaptation of existing buildings.
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF
source-text: New development except changes of use or adaptation of existing buildings that do not involve
  any excavation, ground works or other operations which involve ground disturbance.
must-include:
- item: 'A desk top study by a competent person setting out: the land use history of the site and adjoining
    land; the likelihood of contamination, landfill gas, land instability or other hazards; potential
    risks to future site users, the environment, ground water and controlled waters; and the nature and
    extent of any further investigation needed'
  level: must
- item: 'Where the desk study shows significant contamination or extensive remediation: intrusive investigation
    and a site investigation report (land stability may need slope stability analysis)'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 33-34. LV22 'Ground Conditions
  - Contamination and Land Stability'. The site investigation 'may need' to follow, so it is discretionary.
  The Environment Agency foul drainage assessment form, also under LV22, has no matching id (see the unmapped
  list).
review-status: unverified
field-status: {}
