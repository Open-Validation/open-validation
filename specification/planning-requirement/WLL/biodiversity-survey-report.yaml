reference: biodiversity-survey-report
local-authority: WLL
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The proposal has the potential to impact on protected species and wildlife.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Conservation of Habitats and Species Regulations; Walsall Natural Environment SPD
source-text: 'Applications that have potential to impact on protected species and wildlife:'
must-include:
- item: Existing and proposed site plans
  level: must
- item: Up-to-date site photographs (annotated with descriptions for non-householder applications)
  level: must
- item: A description of the proposal
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: A desktop study, including a data search request from EcoRecord (non-householder applications)
  level: must
- item: A field survey by an appropriately qualified and experienced person, with the methodology, at
    an appropriate time of year within the last survey season, using appropriate surveys
  level: must
- item: The ecological importance of the site, habitats and species; detailed results of all specialist
    surveys; a map using UKHAB / JNCC Phase 1 habitat categories
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: Impact assessment, mitigation and enhancement strategy, implementation of mitigation and monitoring
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: 'Householder: an assessment of the field survey results, proposed mitigation and whether further
    survey work is needed, and any biodiversity enhancements (e.g. bat and bird boxes)'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Where a Natural England licence will be needed: a detailed response to the three tests (Natural
    Environment SPD, Annex 9)'
  level: must
- item: Up-to-date best practice survey guidelines followed and referenced, with any deviations or limitations
    justified
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026, Version 2.0), page 23-25; householder checklist
  (Version 2.0), page 17-18. LV16 ''Preliminary Ecological Appraisal / Ecological Impact Assessment report''
  and, for householders, LHV15 ''Bat Preliminary Roost Assessment and Ecological Survey(s)''. Discretionary:
  the householder checklist gives no trigger for LHV15. See the council''s ecology guidance note.'
review-status: unverified
field-status: {}
