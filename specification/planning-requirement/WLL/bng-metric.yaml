reference: bng-metric
local-authority: WLL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Environment Act 2021; Biodiversity Gain Requirements (Exemptions) Regulations 2024
source-text: From February 2024, all developments excluding those that are exempt in chapter 2 of the
  Biodiversity Gain Requirements (Exemptions) Regulations 2024, would need to meet a minimum 10% biodiversity
  net gain.
must-include:
- item: A completed metric calculation tool (latest DEFRA metric spreadsheet) showing the calculations
  level: must
- item: 'Outline: the pre-development biodiversity value on the date of application (or an earlier date,
    with reasons)'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Outline: whether the value is lower because of degradation, with supporting evidence'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Full: included in a draft biodiversity gain plan'
  level: must
  required-if:
    application-type:
      in:
      - full
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 6, 30-31. LV20 'Biodiversity Net
  Gain'. Householder and other exempt applications are exempt by law, so the rule uses the biodiversity
  gain condition.
review-status: unverified
field-status: {}
