reference: town-centre-impact-assessment
local-authority: WLL
required-if:
  any:
  - all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m gross retail and leisure floorspace.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: In an edge or out of centre location.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the development plan.
  - discretionary
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF
source-text: Retail and leisure uses, where over 2,500m2 gross floorspace is proposed in an edge or out
  of centre location, and is not in accordance with the development plan; or • Retail and leisure uses,
  within an existing centre and not in accordance with the development plan, where in the opinion of the
  council with reference to relevant local planning policy, the proposal is potentially not of a scale
  appropriate to the function of that centre, and has the ability to undermine the vitality and viability
  of other centres.
confidence: medium
notes: 'From the council''s list (published May 2026, Version 2.0), page 40. LV30 ''Retail Impact Assessment''.
  Discretionary: retail and leisure uses within an existing centre that, ''in the opinion of the council'',
  may not be of an appropriate scale.'
review-status: unverified
field-status: {}
