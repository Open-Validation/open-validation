reference: design-and-access-statement
local-authority: WLL
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A Design and Access Statement (DAS) must be submitted for: • Applications for major development.
  • Applications for development in a conservation area, where the proposed development consists of one
  or more dwellings or a building or buildings with a floor space of 100 square metres or more. • Applications
  for listed building consent.'
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 15. NV7.
review-status: unverified
field-status: {}
