reference: heritage-statement
local-authority: WLL
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: The proposal could affect a heritage asset or its setting.
  - discretionary
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF
source-text: 'Applications that have potential to impact on a heritage asset(s):'
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
- item: Detail proportionate to the assets' importance and sufficient to understand the potential impact
    on their significance
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026, Version 2.0), page 21; householder checklist (Version
  2.0), page 16. LV14; the householder checklist (LHV13) has the same contents but no trigger. The council''s
  separate heritage statement guidance note gives more detail. Discretionary: ''potential to impact''
  beyond the listed designations.'
review-status: unverified
field-status: {}
