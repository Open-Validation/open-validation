reference: air-quality-assessment
local-authority: WLL
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: An area where air quality does not meet air quality objectives.
  - discretionary
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF
source-text: Developments within areas where air quality does not, or is unlikely to, meet air quality
  objectives (air quality hotspots).
must-include:
- item: Potential increased exposure of relevant receptors affected by the development
  level: should
- item: The individual and cumulative air quality impacts of existing and committed developments
  level: should
- item: Any recommended mitigation measures
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026, Version 2.0), page 36. LV25. Discretionary: areas
  ''unlikely to'' meet the objectives (''air quality hotspots'') beyond a declared air quality management
  area.'
review-status: unverified
field-status: {}
