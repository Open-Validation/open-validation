reference: noise-assessment
local-authority: WLL
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major industrial or commercial development.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Introduces noise- or vibration-sensitive development where noise or vibration is
          likely to have an adverse impact.
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: NPPF
source-text: Major industrial or commercial applications. • Major applications that introduce or expose
  noise and/or vibration- sensitive development(s) into areas and locations where noise and/or vibration
  is likely to have an adverse impact.
must-include:
- item: The potential sources of noise generation and how they may affect local amenity
  level: should
- item: How the developer mitigates any adverse issues identified
  level: should
- item: Recommended noise mitigation incorporated into the submitted plans
  level: should
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 32. LV21.
review-status: unverified
field-status: {}
