reference: site-plan
local-authority: WLL
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - application-type:
      in:
      - hh
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block or Site Plan.
must-include:
- item: Based on an up-to-date map
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Access arrangements
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements,
    within 10 metres of the boundary
  level: must
- item: At an identified metric scale, typically 1:100, 1:200 or 1:500
  level: must
- item: The direction of North
  level: must
- item: Scaled to fit onto A4 or A3 paper
  level: should
- item: 'Unless they would not influence or be affected by the development: public rights of way crossing
    or adjoining the site; all trees on the site and on adjacent land; the extent and type of any hard
    surfacing; proposed boundary treatment; any main river or ordinary watercourse'
  level: should
- item: 'Based on an up-to-date Ordnance Survey map: not a photocopy or screen grab, not a Land Registry
    map, not reused for multiple applications without a bulk copy licence, and not copied from OS mapping
    if hand drawn'
  level: must
- item: Shows the OS Crown copyright acknowledgement and the correct licence number
  level: must
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 15-17; householder checklist (Version
  2.0), page 13-14. LV8 'Site/Block Plans - Existing and Proposed' (existing and proposed plans).
review-status: unverified
field-status: {}
