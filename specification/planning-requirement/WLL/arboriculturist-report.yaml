reference: arboriculturist-report
local-authority: WLL
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: The proposal has the potential to impact on trees (on the site or adjoining land).
source-url: https://go.walsall.gov.uk/sites/default/files/2026-05/Full%20Planning%20Application%20Validation%20Checklist%20Version%202.0.pdf
policy: BS 5837:2012
source-text: 'Applications that have potential to impact on trees:'
must-include:
- item: Survey and appraisal of trees on the site and adjoining land to BS 5837:2012
  level: must
- item: A tree survey in table and plan form (BS 5837:2012) showing the condition, location and constraints
    of all trees on and adjacent to the site
  level: must
- item: Trees to be retained and removed marked on a Tree Protection Plan and the proposed site/layout
    plan, with root protection areas
  level: should
- item: An Arboricultural Method Statement and Tree/hedge Protection Plan, with schedules of any facilitative
    tree work and any special construction techniques
  level: should
- item: A schedule of tree works/pruning to retained trees to BS 3998:2010
  level: should
confidence: medium
notes: From the council's list (published May 2026, Version 2.0), page 21-22; householder checklist (Version
  2.0), page 17. LV15 'Tree Surveys and Arboricultural Implications Assessment'; the householder checklist
  (LHV14) has the same contents. See also the council's trees guidance note.
review-status: unverified
field-status: {}
