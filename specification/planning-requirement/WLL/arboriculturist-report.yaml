reference: arboriculturist-report
local-authority: WLL
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: There are trees on or adjacent to the site.
source-url: https://go.walsall.gov.uk/sites/default/files/2023-07/Householder%20Local%20Validation%20Checklist%202023.pdf
source-text: A tree survey in table and plan form in accordance with the provisions of B.S.5837:2012 Trees
  in Relation to Design Demolition and Construction – Recommendations must be provided showing the condition,
  location and constraints of all trees on and adjacent to the site.
must-include:
- item: A tree survey in table and plan form (BS 5837:2012) showing the condition, location and constraints
    of all trees on and adjacent to the site
  level: must
- item: An Arboricultural Method Statement and Tree/hedge Protection Plan detailing the measures to protect
    all trees proposed to be retained, with schedules of any necessary facilitative tree work
  level: should
confidence: low
