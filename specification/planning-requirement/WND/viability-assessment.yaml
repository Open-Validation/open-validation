reference: viability-assessment
local-authority: WND
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Developments comprising or capable of delivering 1 or more gross residential dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: More than 1,000 square metres of economic floorspace.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
source-text: Developments comprising or capable of delivering 1 or more gross residential dwellings
must-include:
- item: A full unredacted version of the viability report, for the council's independent viability assessors
    (at the applicant's cost)
  level: must
- item: An unredacted executive summary
  level: must
- item: A redacted version for publication, with each redaction justified against the public interest
    test
  level: should
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s excerpt was a fragment. The must-include items are the
  council''s viability submission rules (audit issue 9).'
review-status: unverified
field-status: {}
