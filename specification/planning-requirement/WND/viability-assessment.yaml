reference: viability-assessment
local-authority: WND
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Developments comprising or capable of delivering 1 or more gross residential dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: More than 1,000 sq m of economic floorspace.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP23, LP24, LP37, LP38 and LP62; London Plan policies H4,
  H5 and DF1; Mayor's Affordable Housing and Viability SPG 2017
source-text: Developments comprising or capable of delivering 1 or more gross residential dwellings, including
  all uses classes which provide residential accommodation. Developments providing more than 1,000 sqm
  of economic floorspace.
must-include:
- item: Full Viability Appraisal (for internal council use)
  level: must
- item: Accompanying Viability Model (Argus software or similar)
  level: must
- item: Redacted Viability Appraisal (for the website), with each redaction justified against the public
    interest test
  level: must
- item: 'Unredacted Executive Summary (for the website): residual land value, benchmark land value, surplus/deficit,
    gross development value, build costs, professional fees, contingencies, finance, marketing and letting,
    disposal fees, developer profit'
  level: must
- item: States whether the applicant is following the 'fast track route' or the normal viability route
  level: must
- item: Written confirmation that the applicant will fund independent assessment (paid to the council,
    not to the consultant)
  level: must
confidence: medium
notes: 'From the council''s list (published July 2026), Local Requirements 48 (Viability Appraisal), page
  35-36. The trigger is as the list states it: every scheme of one or more gross dwellings. For small
  sites (1-9 units) viability information is needed only where the £50,000 per dwelling affordable housing
  contribution cannot be paid (item 49).'
review-status: unverified
field-status: {}
