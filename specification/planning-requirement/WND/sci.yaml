reference: sci
local-authority: WND
required-if:
  ref: major-development
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP1; London Plan policies GG1, SD1, SD10 and D3
source-text: Major applications will need to be supported by a statement setting out how the applicant
  has complied with the requirements for pre-application consultation set out in the local planning authority’s
  adopted statement of community involvement and demonstrating that the views of the local community have
  been taken into account in the formulation of development proposals.
must-include:
- item: The approach taken for the scheme, why it was appropriate for the site and how it was achieved
  level: must
- item: A summary of activities undertaken, with outcomes and feedback from participants (qualitative
    as well as attendee numbers)
  level: must
- item: A detailed timeline of activities against project milestones
  level: must
- item: A full schedule of comments received, showing where action was taken, or why not
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 37 (Statement of Community Involvement),
  page 30.
review-status: unverified
