reference: noise-assessment
local-authority: WND
required-if:
  any:
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development.
    - discretionary
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal has the potential to generate noise.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP2 and LP14; London Plan policies D13 and D14; NPPF; PPG
source-text: If your proposal is for a noise sensitive development and is next to an existing noise source
  or your proposal has the potential to generate noise.
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: Existing background noise levels measured over 24 hours
  level: must
- item: Proposed noise output
  level: must
- item: Measures proposed to reduce noise and vibration, and any mitigation needed
  level: must
- item: The method used to compile the report, with example calculations and assumptions
  level: must
- item: The system manufacturer's specification
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 34 (Noise Impact Assessment),
  page 28. 'Next to an existing noise source' shows as discretionary.
review-status: unverified
field-status: {}
