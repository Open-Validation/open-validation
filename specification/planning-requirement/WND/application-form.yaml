reference: application-form
local-authority: WND
required-if:
  always: true
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: NPPG
source-text: 'Standard Application can be used for all applications apart from: mining operations; the
  use of land for mineral-working deposits; Applications made under the Planning (Hazardous Substances)
  Act 1990 for hazardous substance'
must-include:
- item: All sections of the application form filled out
  level: must
- item: Data on residential units, floorspace, parking, open and protected space, non-permanent dwellings
    and other residential accommodation, showing any loss or gain
  level: must
- item: The appropriate ownership certificate (A, B, C or D), confirming that notice has been served on
    any other owners
  level: must
  source-text: An applicant must provide certain details about the ownership of the application site and
    confirms that an appropriate notice has been served on any other owners.
confidence: medium
notes: From the council's list (published July 2026), National Requirements 1 (Application Form) and 8
  (Ownership Certificate), page 4-5. The fee (national item 7) must be paid in full at the time of submission;
  that is recorded in the council's submission standards.
