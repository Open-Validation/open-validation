reference: sustainability-statement
local-authority: WND
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 100
      description: Non-residential planning applications over 100 sq m.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use to residential.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP10; London Plan policy SI 1
source-text: All non-residential planning applications over 100sqm. Where proposals are for a change of
  use to residential, applicants should submit a BREEAM pre-assessment for Domestic Refurbishment
must-include:
- item: A BREEAM assessment certified by an accredited assessor, establishing the sustainability performance
    of the buildings
  level: must
- item: 'For a change of use to residential: a BREEAM Domestic Refurbishment pre-assessment'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use to residential.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 7 and 8 (BREEAM Pre-Assessment;
  BREEAM Domestic Refurbishment), page 11. The change of use condition means a change of use to residential
  only.
review-status: unverified
field-status: {}
