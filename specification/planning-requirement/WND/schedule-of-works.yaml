reference: schedule-of-works
local-authority: WND
required-if:
  all:
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: To or adjacent to a Listed Building.
  - any:
    - condition:
        field: basement
        value: true
        description: Adds a basement.
    - condition:
        field: structural-alteration
        value: true
        description: Significantly alters structure, imposes additional floor loadings or lowers floor
          levels.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP3 and LP6; Wandsworth Historic Environment SPD 2016; NPPF;
  PPG
source-text: Where an application seeks to add a basement/significantly alters structure to or adjacent
  to Listed Buildings, imposing additional floor loadings or lowering floor levels of Listed Buildings.
must-include:
- item: A list of the works taking place
  level: must
- item: A Structural Impact Assessment detailing the impact of the development on the structure of the
    Listed Building
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 28 (Schedule of works affecting
  Listed Buildings and a Structural Impact Assessment), page 23.
review-status: unverified
field-status: {}
