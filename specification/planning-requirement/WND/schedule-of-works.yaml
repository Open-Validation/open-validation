reference: schedule-of-works
local-authority: WND
required-if:
  all:
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: Works to or adjacent to a listed building.
  - any:
    - condition:
        field: basement
        value: true
        description: The application adds a basement.
    - condition:
        field: structural-alteration
        value: true
        description: The application significantly alters structure.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
source-text: Where an application seeks to add a basement/significantly alters structure to or adjacent
  to Listed Buildings
confidence: medium
notes: 'Audit (other): the checklist''s ''Schedule of Works Affecting Listed Buildings and Structural
  Impact Assessment'' (item 28); the workbook quoted the basement Construction Method Statement.'
