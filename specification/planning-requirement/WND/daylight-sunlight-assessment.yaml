reference: daylight-sunlight-assessment
local-authority: WND
required-if: discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP2, LP15, LP27 and LP28; BRE 'Site layout planning for
  daylight and sunlight' (2022)
source-text: Proposals where there may be an impact on levels of daylight and sunlight for the host building
  or adjoining properties (including their gardens or outdoor spaces).
must-include:
- item: 'Follows the BRE guidance ''Site layout planning for daylight and sunlight: A guide to good practice''
    (2022)'
  level: must
- item: The impacts on existing properties and on sites with extant planning permissions
  level: must
- item: The final daylight and sunlight values achieved within the proposed scheme
  level: must
- item: Contextualised daylight/sunlight plans where shading may occur within or adjacent to designated
    wildlife sites, rivers or green open space
  level: must
  required-if:
    any:
    - site:
        in:
        - local-wildlife-site
        - site-of-special-scientific-interest
        - open-space
        description: On or adjacent to a designated wildlife site (including local designations) or green
          open space.
    - condition:
        field: near-watercourse
        value: true
        description: On or adjacent to a river.
  source-text: Where shading may occur within or adjacent to designated wildlife sites (including those
    with local designations), rivers and green open space.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 18 (Daylight and Sunlight Assessments)
  and 6 (Biodiversity), page 10, 16. Shown as discretionary because it depends on whether there 'may be
  an impact'; the scope can be agreed at pre-application stage.
review-status: unverified
field-status: {}
