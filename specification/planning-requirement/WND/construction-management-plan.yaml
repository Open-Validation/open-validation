reference: construction-management-plan
local-authority: WND
required-if:
  any:
  - ref: major-development
  - discretionary
  - condition:
      field: structural-demolition
      value: true
      description: Substantial demolition or excavation works are proposed.
  - all:
    - condition:
        field: basement
        value: true
        description: Basement development.
    - site:
        in:
        - listed-building
        - conservation-area
        - locally-listed-building
        - scheduled-monument
        - park-and-garden
        description: To a listed building or other heritage asset.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP14 and LP50; London Plan policy T7
source-text: All major planning applications. Developments of sites in confined locations (including basements
  and subterranean developments) or near sensitive receptors. If substantial demolition/excavation works
  are proposed. Basement development to listed buildings or heritage assets (which includes buildings,
  monuments, sites, places, areas or landscapes positively identified as having a degree of significance
  meriting consideration in planning decisions).
must-include:
- item: Signed by a Chartered Civil Engineer (MICE) or Chartered Structural Engineer (MIStructE)
  level: must
- item: Control of construction noise and vibration during hours of noisy activities
  level: must
- item: A construction waste and material management, transportation and disposal strategy, including
    delivery booking, vehicle holding arrangements and targets for using the river where feasible
  level: must
- item: Air quality measures for the control and monitoring of dust, fine particles and odours
  level: must
- item: Construction traffic routing through the area and the site, with signage and an enforcement system
    for breaches
  level: must
- item: A low emission strategy for construction traffic and machinery
  level: must
- item: Piling or other penetrative foundation methods in relation to risks to underlying groundwater
  level: must
- item: Measures to protect controlled waters from construction processes and contamination
  level: must
- item: Measures to minimise cross contamination on site and to deal with unexpected contamination
  level: must
- item: Security of the construction site in relation to adjacent sites
  level: must
- item: Coordination of construction activities with neighbouring development sites
  level: must
- item: How 24-hour disturbance to residents will be minimised
  level: must
- item: Cranes and other tall construction equipment, including obstacle lighting, complying with AOA
    Advice Note 4
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 29 (Construction Management Plan),
  page 24-25. Sites in confined locations or near sensitive receptors show as discretionary. Basement
  projects to heritage assets also need a Construction Method Statement (local item 30), and Mayoral referable
  applications a Construction Logistics Plan and Delivery and Servicing Plan (item 31); both are listed
  with the unmapped requirements.
review-status: unverified
field-status: {}
