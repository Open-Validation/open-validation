reference: transport-assessment
local-authority: WND
required-if:
  any:
  - ref: major-development
  - condition:
      field: parking-change
      value: true
      description: 'Non-major applications: loss or increase of parking provision.'
  - condition:
      field: new-vehicle-access
      value: true
      description: 'Non-major applications: change in access arrangements.'
  - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP50; London Plan policy T4; TfL Transport Assessment Guidance
source-text: Major applications or where identified in the thresholds for Transport Assessments by Transport
  for London. ... All non-major applications that could give rise to transport impacts such as the loss
  or increase of parking provision and/or change in access arrangements.
must-include:
- item: Coverage and detail reflecting the scale of the development and its transport implications
  level: must
- item: 'Major proposals: accessibility by all modes, likely modal split, and measures to improve access
    by public transport, walking and cycling, reduce parking need and mitigate transport impacts'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 40 (Transport Assessment) and
  41 (Transport Statement), page 31-32. A Transport Statement is asked for non-major applications. The
  TfL thresholds and other transport impacts show as discretionary.
review-status: unverified
field-status: {}
