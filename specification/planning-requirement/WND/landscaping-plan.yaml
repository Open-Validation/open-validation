reference: landscaping-plan
local-authority: WND
required-if:
  any:
  - condition:
      field: landscaping-works
      value: true
      description: The application proposes changes to or involves new landscaping.
  - all:
    - ref: major-development
    - condition:
        field: external-space
        value: true
        description: Major application that includes external space.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP1, LP55, LP56 and LP57; London Plan policies G1, G5, G6
  and G7
source-text: All applications that propose changes to or involve new landscaping. All major applications
  that include external space must be accompanied by a detailed scheme for landscaping.
must-include:
- item: Planting of trees and/or shrubs, surface materials, boundary screen walls and fences, drawn to
    an identified scale (1:100, 1:200 or 1:500 as appropriate)
  level: must
- item: Materials
  level: should
- item: Species
  level: should
- item: Tree and plant sizes, numbers and planting densities
  level: should
- item: Levels, gradients and any earthworks required
  level: should
- item: Timing of the implementation of the scheme
  level: should
- item: Long term maintenance and landscape management, ecological benefits, climate change adaptation
    measures, approach to trees and sustainable drainage
  level: should
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 23 (Hard/Soft Landscaping Scheme),
  page 20.
review-status: unverified
field-status: {}
