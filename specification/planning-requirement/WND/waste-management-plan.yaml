reference: waste-management-plan
local-authority: WND
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP2; London Plan policies D6 and SI7; Wandsworth Refuse and
  Recyclables in Developments SPD 2014
source-text: All major applications for commercial and residential developments (where appropriate) and
  other application types as may be appropriate (Other applications that will have an impact on the generation
  of waste, for example conversion to flats, changes of use to bars, restaurants, takeaway food outlets).
must-include:
- item: Arrangements and/or space for storage and collection of recycling and refuse, shown on the site
    plan or addressed in the application
  level: must
- item: Location and hours of loading and unloading
  level: must
- item: Frequency and size of the vehicles
  level: must
- item: Swept paths
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 50 (Waste/Site Waste Management
  Plan), page 37-38. The list qualifies even major applications with '(where appropriate)'; other applications
  that affect waste generation show as discretionary.
