reference: design-and-access-statement
local-authority: WND
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (Conservation Area or World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; NPPG; NPPF
source-text: 'Applications for major development, as defined in article 2 of the Town and Country Planning
  Act (Development Management Procedure (England) Order 2015; Applications for development in a designated
  area, where the proposed development consists of: one or more dwellings; or a building or buildings
  with a floor space of 100 square metres or more.'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Demonstrates the steps taken to appraise the context of the development, and how the design takes
    that context into account
  level: must
- item: Explains the applicant's approach to access and how relevant Local Plan policies have been taken
    into account
  level: must
confidence: medium
notes: From the council's list (published July 2026), National Requirements 9 (Design and Access Statement),
  page 5-6.
review-status: unverified
field-status: {}
