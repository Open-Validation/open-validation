reference: land-contamination-assessment
local-authority: WND
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: New development with a sensitive end use (hospitals, schools, care homes and wildlife
        sites, as the list's glossary defines it).
  - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP2 and LP14; London Plan policies E7 and SD1; NPPF; Building
  Regulations Approved Document C
source-text: All new development with a sensitive end use, a minimum of a Preliminary Risk Assessment
  (PRA) will be required regardless of the history of the site, contaminated or otherwise. All new developments
  on adjoining land and some linear constructions, such as cabling, tunnelling including shaft construction,
  trainlines etc.
must-include:
- item: At least a Preliminary Risk Assessment of the potential for contamination, associated risks and
    the potential for the site to be designated as contaminated land
  level: must
- item: Site inspection scope
  level: must
- item: Review of historical land use
  level: must
- item: Review of environmental setting
  level: must
- item: Consultation with relevant regulatory authorities
  level: must
- item: Qualitative environmental risk assessment
  level: must
- item: Review of existing relevant reports
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 16 (Contaminated Land Assessment),
  page 15. 'New developments on adjoining land and some linear constructions' does not say what the land
  adjoins, so it shows as discretionary.
review-status: unverified
field-status: {}
