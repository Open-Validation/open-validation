reference: archaeological-assessment
local-authority: WND
required-if:
  any:
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Development involving ground disturbance.
    - site:
        in:
        - archaeological-priority-area
        description: In an Archaeological Priority Area.
  - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP3
source-text: Proposals for development involving ground disturbance in Archaeological Priority Areas.
  ... Where a site on which development is proposed includes or has the potential to include heritage
  assets with archaeological interest, applicants will be required to submit an appropriate desk-based
  assessment and, where necessary, a field evaluation.
must-include:
- item: Prepared by a qualified individual or organisation
  level: must
- item: Uses existing information to establish the archaeological significance of the site and the impact
    on surviving monuments or remains
  level: must
- item: A response in line with the Archaeological Priority Area Tier the site is in (Policies Map), which
    may need a desk-based assessment and field evaluation
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 22 (Archaeological Assessment)
  and 27 (Heritage Statement), page 19, 23. Sites outside an Archaeological Priority Area that 'have the
  potential to include' archaeological interest show as discretionary.
review-status: unverified
field-status: {}
