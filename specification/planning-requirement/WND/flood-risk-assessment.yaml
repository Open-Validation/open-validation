reference: flood-risk-assessment
local-authority: WND
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2, 3a or 3b.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: applications 1 ha in size or greater.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: applications 1 ha in size or greater.'
  - site:
      in:
      - critical-drainage-area
      description: Land identified by the Environment Agency as having critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Land identified in a strategic flood risk assessment as being at increased flood risk
        in the future.
  - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP12; London Plan policy SI12; NPPF; PPG
source-text: 'All applications that fall within a Flood Risk Area should submit a Flood Risk Assessment.
  This means all applications for developments located within flood zones 2, 3a and 3b . In flood zone
  1 the following applications require a FRA: Applications 1ha in size or greater; Land which has been
  identified by the Environment Agency as having critical drainage problems; Land identified in a strategic
  flood risk assessment as being at increased flood risk in the future. Or land that may be subject to
  other sources of flooding, where its development would introduce a more vulnerable use, as defined in
  the NPPF.'
must-include:
- item: Within the site, the most vulnerable development is located in areas of lowest flood risk, unless
    there are overriding reasons
  level: must
- item: The development is appropriately flood resistant and resilient
  level: must
- item: It incorporates sustainable drainage systems, unless there is clear evidence this would be inappropriate
  level: must
- item: Any residual risk can be safely managed
  level: must
- item: Safe access and escape routes, where appropriate, as part of an agreed emergency plan
  level: must
- item: A sequential test, if the development is in Flood Zone 2 or 3 and one has not already been done
    for development of this type on the site (it can be a standalone document or part of the planning
    statement)
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2, 3a or 3b.
  source-text: 'Applicants will need to undertake a sequential test if both of the following apply: Your
    development is in flood zone 2 or 3; A sequential test hasn’t already been done for a development
    of the type you plan to carry out on your proposed site.'
- item: A Flood Emergency Plan
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2, 3a or 3b.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: 1,000 sq m or more of non-residential development.
      - discretionary
  source-text: In flood zones 2 and 3, all planning applications (or other relevant applications) on sites
    of 10 or more dwellings or 1000sqm of non- residential development or more, or on any other proposal
    where safe access/egress cannot be achieved, a Flood Emergency Plan must be submitted.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 20 (Flood Risk Assessment including
  Sequential Test and Flood Emergency Plans), page 17-18. 'Other sources of flooding' where a more vulnerable
  use is introduced, and the Flood Emergency Plan where safe access/egress cannot be achieved, show as
  discretionary.
review-status: unverified
field-status: {}
