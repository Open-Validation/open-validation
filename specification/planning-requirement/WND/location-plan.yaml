reference: location-plan
local-authority: WND
required-if:
  always: true
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: NPPG
source-text: All applications
must-include:
- item: Based on an up-to-date map, typically at 1:1250 or 1:2500, scaled to fit A4 or A3 wherever possible
  level: should
- item: Shows the direction of north
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly with a red line, including all land needed for the development
    (access from a public highway, visibility splays, landscaping, car parking, open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published July 2026), National Requirements 2 (Site Location Plan), page
  4.
review-status: unverified
field-status: {}
