reference: recreation-facilities-assessment
local-authority: WND
required-if:
  site:
    in:
    - open-space
    description: Affects designated Metropolitan Open Land or any other designated open space.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP54; London Plan policies G4 and S5; PPG; Sport England Playing
  Fields Policy
source-text: For proposals affecting designated Metropolitan Open Land and any other designated open space.
must-include:
- item: Plans showing any existing or proposed open space within or adjoining the site
  level: must
- item: The quantity and quality of any open space, play space or sport and recreation facilities directly
    lost or indirectly affected
  level: must
- item: The current and future need for any indoor sport or recreation facilities that may be directly
    lost
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 47 (Open Space, sport, recreation
  and green infrastructure Assessment), page 35. The separate Metropolitan Open Land Assessment (item
  46) is listed with the unmapped requirements.
review-status: unverified
field-status: {}
