reference: biodiversity-survey-report
local-authority: WND
required-if:
  any:
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - open-space
      description: On or adjacent to a designated wildlife site (including local designations) or green
        open space.
  - condition:
      field: near-watercourse
      value: true
      description: On or adjacent to a river.
  - condition:
      field: protected-species
      value: true
      description: Protected species may be in the locality.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP55; London Plan policy G6; NPPF; Wandsworth Biodiversity
  Strategy 2020
source-text: All development proposals on or adjacent to designated wildlife sites (including those with
  local designations), rivers, green open space and/or where protected species may be in the locality.
must-include:
- item: A Preliminary Ecological Appraisal in accordance with CIEEM technical guidance
  level: must
- item: A data search from GIGL (Greenspace Information for Greater London)
  level: must
- item: Any subsequent surveys or reports identified as being necessary
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 6 (Biodiversity and Biodiversity
  Net Gain), page 9-10. The same item asks for lighting plans (see lighting-assessment), contextualised
  daylight/sunlight plans (see daylight-sunlight-assessment), a Construction Environment Management Plan,
  biodiversity enhancement and net gain proposals with a 10-year management plan, and Gro Green Roof Code
  compliance for green roofs; those without an id are listed with the unmapped requirements. The item's
  heading still says BNG requirements 'will come into force later this year (2023)'; the list names no
  BNG metric, so no bng-metric file is kept.
review-status: unverified
field-status: {}
