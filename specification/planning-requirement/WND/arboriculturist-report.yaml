reference: arboriculturist-report
local-authority: WND
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on the site or on adjacent land (including neighbouring gardens and street trees)
      that could influence or be affected by the development.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP56; London Plan policies G1, G5, G7 and D8
source-text: Where there are trees within a proposed application site, or on land adjacent to an application
  site (including trees in neighbouring gardens and street trees), that could influence or be affected
  by the development, including works such as site access, service routes and site compounds.
must-include:
- item: A tree survey with a plan showing the location of trees and Root Protection Areas
  level: must
- item: Trees for removal and retention, and any ancient, notable and veteran trees
  level: must
- item: How retained trees will be protected during demolition and construction
  level: must
- item: Planting to replace trees proposed for removal
  level: must
- item: Carried out by a qualified arboriculturist
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 44 (Tree Survey/Arboricultural
  Report), page 33.
review-status: unverified
field-status: {}
