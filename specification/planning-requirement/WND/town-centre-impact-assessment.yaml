reference: town-centre-impact-assessment
local-authority: WND
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside existing town centres and other appropriate areas defined in the Local Plan.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 200
        description: Main town centre uses, including extensions, over 200 sq m (gross); the impact assessment
          applies to retail and leisure over 400 sq m.
  - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP33, LP42 and LP43; London Plan policies E9 and SD7; NPPF;
  PPG
source-text: Proposals for retail and leisure development (which exceed 400 sqm (gross) outside of existing
  town centres and other appropriate areas as defined in the Wandsworth Local Plan. ... Proposals for
  main town centre uses, including extensions, above a threshold of 200sqm (gross) and outside the town
  centres and other appropriate locations as defined in the Wandsworth Local Plan (Definition of Main
  Town Centre) Proposals for retail units totalling over 400sqm (gross) in the VNEB OA in locations outside
  of the emerging CAZ retail clusters at Battersea Power Station. Proposals for office uses outside the
  locations listed in LP33.
must-include:
- item: 'Retail and leisure over 400 sq m: impact on existing, committed and planned public and private
    investment in centres in the catchment'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 400
      description: Retail and leisure over 400 sq m (gross) out of centre.
- item: 'Retail and leisure over 400 sq m: impact on town centre vitality and viability, including local
    consumer choice and trade'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 400
      description: Retail and leisure over 400 sq m (gross) out of centre.
- item: Sequential test as set out in the NPPF, considering more central sites and flexibility in format
    and scale
  level: must
confidence: medium
notes: 'From the council''s list (published July 2026), Local Requirements 35 (Retail Impact Assessment)
  and 36 (Sequential Testing: Town Centre), page 28-30. Retail over 400 sq m in the VNEB Opportunity Area
  outside the CAZ retail clusters, and offices outside the LP33 locations, have no field yet and show
  as discretionary.'
review-status: unverified
field-status: {}
