reference: heritage-statement
local-authority: WND
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - locally-listed-building
    - world-heritage-site
    - scheduled-monument
    - park-and-garden
    description: Affects a heritage asset (designated or non-designated) or its setting.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP3; London Plan policy HC1; NPPF; PPG
source-text: All applications affecting a heritage asset and or its setting must be accompanied by a Statement
  of Heritage Significance and Impact (Heritage Statement), either as a separate document or as part of
  a Design and Access Statement.
must-include:
- item: Carried out by a specialist historic environment consultant
  level: should
- item: Shows consideration of any relevant Conservation Area Appraisal; as a minimum the Historic Environment
    Record reviewed and referenced
  level: must
- item: The impact on the Outstanding Universal Value of a World Heritage Site
  level: must
  required-if:
    site:
      in:
      - world-heritage-site
      description: Affects a World Heritage Site.
- item: The significance of the heritage asset affected, including any contribution made by its setting
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset, including whether it causes
    substantial harm or total loss of significance
  level: must
- item: The sources considered and the expertise consulted
  level: must
- item: The steps taken to avoid or minimise any adverse impacts on the significance of the heritage asset
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 27 (Heritage Statement), page
  22-23. The list's glossary covers designated and non-designated heritage assets. Archaeological desk-based
  assessment is in archaeological-assessment.
review-status: unverified
field-status: {}
