reference: affordable-housing-statement
local-authority: WND
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Small site schemes proposing 1-9 residential units (gross).
  - condition:
      field: dwelling-count
      operator: <=
      value: 9
      description: Small site schemes proposing 1-9 residential units (gross).
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP23
source-text: Small site schemes proposing 1-9 residential units (gross).
must-include:
- item: The contribution to be paid relative to the number of gross dwellings (£50,000 per gross dwelling,
    indexed from 1 April 2027)
  level: must
- item: Agreement to pay the affordable housing financial contribution, secured through a planning obligation
  level: must
- item: 'If the contribution cannot be viably provided: viability information in line with the Viability
    Appraisal requirement'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 49 (Small sites Affordable Housing
  Statement), page 37. The list has no affordable housing statement requirement for schemes of 10 or more
  units.
review-status: unverified
field-status: {}
