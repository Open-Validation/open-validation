reference: lighting-assessment
local-authority: WND
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting (including floodlighting and advertising) would be provided or made
        necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a Listed Building or a Conservation Area.
    - site:
        in:
        - local-wildlife-site
        - site-of-special-scientific-interest
        - open-space
        description: On or adjacent to a designated wildlife site (including local designations) or green
          open space.
    - condition:
        field: near-watercourse
        value: true
        description: On or adjacent to a river.
    - condition:
        field: protected-species
        value: true
        description: In the vicinity of a site with important biodiversity value or (crepuscular and nocturnal)
          protected species.
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP2, LP4, LP14 and LP55; London Plan policies D8 and G6;
  NPPF; PPG
source-text: All proposals involving provision of publicly accessible space and/or biodiversity enhancements;
  in the vicinity of residential property, a Listed Building or a Conservation Area; or in the vicinity
  of a site with important biodiversity value or protected species; or advertisements, where external
  lighting would be provided or made necessary by the development.
must-include:
- item: Hours of operation
  level: must
- item: Light spillage, light levels and wavelength
  level: must
- item: Column heights and size of light fittings
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Equipment design
  level: must
- item: Impact (including levels and extent of spillage) on nearby dwellings, roads or habitats, and features
    used to mitigate it
  level: must
- item: Spectrum details and contextualised lux spill maps
  level: must
- item: 'Near wildlife sites, rivers, green open space or nocturnal protected species: times of operation,
    spectrum details and lux spill maps showing no light spill onto adjacent habitats or onsite habitats
    (trees, planting, ecological enhancements)'
  level: must
  required-if:
    any:
    - site:
        in:
        - local-wildlife-site
        - site-of-special-scientific-interest
        - open-space
        description: On or adjacent to a designated wildlife site (including local designations) or green
          open space.
    - condition:
        field: near-watercourse
        value: true
        description: On or adjacent to a river.
    - condition:
        field: protected-species
        value: true
        description: Crepuscular and nocturnal protected species may be in the locality.
  source-text: Where external lighting (including floodlighting and advertising) is proposed within or
    adjacent to designated wildlife sites (including those with local designations), rivers, green open
    space and/or where crepuscular and nocturnal protected species may be in the locality.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 32 (Lighting Plan) and 6 (Biodiversity),
  page 10, 26-27. Publicly accessible space, biodiversity enhancements and the vicinity of residential
  property have no field yet, so they show as discretionary.
review-status: unverified
field-status: {}
