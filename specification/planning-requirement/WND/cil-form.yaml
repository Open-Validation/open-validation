reference: cil-form
local-authority: WND
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: New buildings or extensions creating 100 sq m or more of gross internal floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creation of a dwelling (even below 100 sq m).
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policy LP17; London Plan policy DF1; Wandsworth Planning Obligations
  SPD 2020
source-text: New buildings or extensions which involve the creation of 100 square metres or more of gross
  internal floorspace, or involve creation of a dwelling (even where below 100 square metres)
must-include:
- item: A completed Planning Application Additional Information Requirement Form, with details of residential
    floorspace and the existing use of the site
  level: must
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 14 (Community Infrastructure
  Levy), page 14.
review-status: unverified
field-status: {}
