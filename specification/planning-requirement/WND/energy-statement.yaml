reference: energy-statement
local-authority: WND
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New residential development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major non-residential development.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
source-text: The Energy Statement must demonstrate how the energy requirements will be met in line with
  the Energy Hierarchy.
must-include:
- item: How the energy requirements will be met in line with the Energy Hierarchy
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook filed the Energy Statement under sustainability-statement
  and omitted its trigger, ''All new residential development and major non-residential development''.'
review-status: unverified
field-status: {}
