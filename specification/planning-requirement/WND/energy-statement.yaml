reference: energy-statement
local-authority: WND
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development (one unit or more).
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1
        description: Non-residential development.
source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
policy: Wandsworth Local Plan (2023) policies LP10 and LP11; London Plan policy SI2; Wandsworth Sustainability
  Checklist; GLA Energy Assessment Guidance 2022
source-text: All new residential development and major non-residential development requires an energy
  assessment (and minor non-residential development proposals are encouraged to provide one).
must-include:
- item: Energy demand and carbon emissions of the development, with the expected savings from energy efficiency
    and renewable energy measures
  level: must
- item: The approach to energy supply, showing the options considered and an achievable energy strategy
    in line with the Energy Hierarchy
  level: must
- item: 'Major development: how zero carbon standards are achieved, with at least 35% on-site reduction
    in regulated CO2 emissions over the Target Emission Rate (Building Regulations 2021) and the rest
    offset'
  level: must
  required-if:
    ref: major-development
  source-text: All major developments (residential and non-residential) should submit an assessment that
    details how they achieve zero carbon standards, as set out in the London Plan.
- item: 'Other new residential schemes (one unit or more): a minimum 35% on-site reduction in carbon dioxide
    emissions'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential schemes of one unit or more.
- item: At least a 10% (residential) or 15% (non-residential) reduction in carbon dioxide emissions through
    energy efficiency measures, within the 35% on-site reduction
  level: must
- item: 'Where the 35% on-site reduction cannot be met: why the target cannot be met on-site, with any
    shortfall met through a cash-in-lieu contribution to the Carbon Offset Fund'
  level: must
  required-if: discretionary
  source-text: In exceptional circumstances, where it is clearly demonstrated that the above cannot be
    fully achieved on- site and as a last resort.
confidence: medium
notes: From the council's list (published July 2026), Local Requirements 11, 12 and 13 (Sustainability
  and Energy Assessment; Carbon Dioxide Emissions and Zero Carbon Standards; Carbon Offsetting), page
  12-13. Minor non-residential schemes are only 'encouraged' to provide one. Carbon offsetting shows as
  discretionary because it applies only in exceptional circumstances. The council's carbon price is £95
  per tonne x 30 years (£2,850 per tonne).
review-status: unverified
field-status: {}
