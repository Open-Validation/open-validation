reference: noise-assessment
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: noise-generating-use
      value: true
      description: A noise generating use (e.g. industrial and warehousing, bars, pubs, clubs, takeaways,
        restaurants, venues with amplified music, nurseries, schools, places of worship).
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise sensitive use (e.g. homes, care homes, hospitals, schools, hotels) near to
        noise sources such as railway lines.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies DM10, SP6 and DM23; London Plan 2021 policies D1, D3, D9, D13
  and D14
source-text: This should be prepared by a suitably qualified acoustician, and identify potential noise
  sources, noise sensitive receptors, and then appropriate sound insulation and other mitigation measures
  with reference to the building regulations. ... Applications for noise generating uses must demonstrate
  how they will avoid causing harm to nearest noise sensitive uses.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: Potential noise sources and noise sensitive receptors
  level: should
- item: Appropriate sound insulation and other mitigation, with reference to the building regulations
  level: should
- item: 'For noise generating uses: how they will avoid causing harm to the nearest noise sensitive uses'
  level: must
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: A noise generating use.
confidence: medium
notes: From the council's list (published May 2026), page 22, 27 (Noise and Vibration Impact Assessment
  (Majors) and (Minors)). Can be combined with the Ventilation / Extraction Statement. The Agent of Change
  Assessment (Majors) is listed separately with the unmapped items.
review-status: unverified
field-status: {}
