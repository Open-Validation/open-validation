reference: sci
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 'Large minor or bigger: 5 or more new homes.'
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: 'Large minor or bigger: 500 sq m or more floorspace (new-build or change of use).'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Council Statement of Community Involvement
source-text: For large minors, and larger applications, a Community Engagement Statement is required to
  set out how the developer has complied with the requirements for pre-application consultation in the
  Council's Statement of Community Involvement.
must-include:
- item: How the developer has complied with the pre-application consultation requirements in the Council's
    Statement of Community Involvement
  level: must
confidence: medium
notes: From the council's list (published May 2026), page 19 (Development Size). The list calls it a Community
  Engagement Statement. 'Large Minors +' means 5 or more new homes or 500 sq m or more floorspace, and
  all Majors (definitions, pages 35-36).
review-status: unverified
field-status: {}
