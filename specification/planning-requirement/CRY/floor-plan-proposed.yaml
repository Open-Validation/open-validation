reference: floor-plan-proposed
local-authority: CRY
required-if:
  always: true
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; London Plan
  2021 policies D5 and D7
source-text: Floor Plans Detailed plans of the existing and proposed floors and roof(s) of the building.
must-include:
