reference: land-contamination-assessment
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - contaminated-land
      description: A site with previous polluting uses.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policy DM24; London Plan 2021 policies SD1 and E7
source-text: The results of an investigation into the nature and extent of contamination should be submitted
  at the time of application. ... A Contaminated Land Assessment will not be required if there is no evidence
  or likelihood of contamination from previous land uses.
must-include:
- item: Results of an investigation into the nature and extent of contamination
  level: should
- item: 'Where potential contamination is identified: proposals for remediation measures'
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 21 (Development Size). Threshold: Majors,
  and sites with previous polluting uses.'
review-status: unverified
field-status: {}
