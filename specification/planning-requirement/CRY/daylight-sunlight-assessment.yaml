reference: daylight-sunlight-assessment
local-authority: CRY
required-if:
  ref: major-development
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policy DM10.6; London Plan 2021 policies D6 and D9
source-text: The report needs to be prepared in line with the methods described in the Building Research
  Establishment's most up to date guidance. It will need to demonstrate impacts on the current levels
  of daylight and sunlight enjoyed by adjoining properties or building(s), including associated gardens
  or amenity space.
must-include:
- item: Prepared using the methods in the Building Research Establishment's most up-to-date guidance
  level: must
- item: Impacts on current daylight and sunlight to adjoining properties or buildings, including gardens
    and amenity space
  level: must
- item: 'For new homes: acceptable levels of internal daylight'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates new homes.
- item: The tables provided in an editable digital format
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 21 (Development Size). Threshold: Majors.'
review-status: unverified
field-status: {}
