reference: town-centre-impact-assessment
local-authority: CRY
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Town centre uses (including retail, leisure and office) or extensions to them in edge
      of centre or out-of-centre locations.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP3 and DM8; London Plan 2021 policy SD7
source-text: Required for town centre uses or extensions to town centre uses including retail, leisure,
  and office in edge of centre or out-of-centre locations. A Retail Impact Assessment is required where
  floorspace is 2,500sqm and over.
must-include:
- item: A Retail Impact Assessment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: Floorspace of 2,500 sq m and over.
confidence: medium
notes: From the council's list (published May 2026), page 30 (Development Type). The list calls it a Town
  centre uses impact assessment and sequential test. Whether an impact assessment and/or sequential test
  is needed is derived from the NPPF, London Plan and Croydon Local Plan.
review-status: unverified
field-status: {}
