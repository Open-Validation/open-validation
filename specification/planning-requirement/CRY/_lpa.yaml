    2026, chapter 4)'
  status: current
submission-standards:
- item: Applications submitted electronically through the Planning Portal
  level: should
- item: Documents in PDF or Open Document Format
  level: should
- item: Plans clearly state the paper size and scale, and are scalable
  level: should
- item: All plans and drawings at a standard metric scale, with a scale bar, drawing number, title, and
    a north arrow (for plans)
  level: must
- item: Plans do not say 'DO NOT SCALE'
  level: should
- item: Individual documents no larger than 5MB; larger documents split into sensible, labelled chapters
  level: should
- item: Plans combined into a small number of files
  level: should
- item: No personal or sensitive data in supporting information; where unavoidable, both original and
    redacted versions provided
  level: should
