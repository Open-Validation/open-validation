validation-list:
  url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
  date: 2026-05
  date-basis: 'cover: ''May 2026''; the council''s ''Submit your planning application'' page says the
