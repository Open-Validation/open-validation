reference: sustainable-drainage-strategy
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 'Large minor or bigger: 5 or more new homes.'
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: 'Large minor or bigger: 500 sq m or more floorspace (new-build or change of use).'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP6 and DM25; London Plan 2021 policy SI 13
source-text: Development should demonstrate how sustainable urban drainage systems (SUDS) will be used
  to manage water runoff and ensure surface water run-off is managed as close to its source as possible
  in line with the London Plan drainage hierarchy.
must-include:
- item: How SuDS will manage water run-off as close to its source as possible, in line with the London
    Plan drainage hierarchy
  level: should
confidence: medium
notes: From the council's list (published May 2026), page 20 (Development Size). 'Large Minors +' means
  5 or more new homes or 500 sq m or more floorspace, and all Majors (definitions, pages 35-36). For smaller
  developments information may be requested after validation or secured by condition.
review-status: unverified
field-status: {}
