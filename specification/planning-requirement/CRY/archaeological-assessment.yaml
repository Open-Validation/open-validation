reference: archaeological-assessment
local-authority: CRY
required-if:
  all:
  - ref: major-development
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Archaeological Priority Area.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: The site is over 0.5 hectares.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.5
        description: The site is over 0.5 hectares.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
source-text: Archaeological Assessment - Majors within an Archaeological Priority Area; Majors over 0.5Ha
must-include:
- item: A desk-based assessment of previous uses on the site and any previous ground disturbance
  level: must
  source-text: At the very least, a desk-based assessment of previous uses on the site and any previous
    ground disturbance must accompany an application.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s excerpt left out the threshold.'
review-status: unverified
field-status: {}
