reference: archaeological-assessment
local-authority: CRY
required-if:
  all:
  - ref: major-development
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: Within an Archaeological Priority Area (APA).
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: A site over 0.5 ha.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.5
        description: A site over 0.5 ha.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP4 and DM18; London Plan 2021 policy HC1
source-text: Applicants should review the latest guidance provided by Historic England and provide an
  assessment at an appropriate level for the archaeological potential of the site. At the very least,
  a desk-based assessment of previous uses on the site and any previous ground disturbance must accompany
  an application.
must-include:
- item: At the very least, a desk-based assessment of previous uses on the site and any previous ground
    disturbance
  level: must
- item: At a level appropriate to the archaeological potential of the site, following Historic England's
    latest guidance
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 32 (Site Constraints). Threshold: Majors within
  an APA, and Majors over 0.5 ha. On more important sites, preliminary site investigations may be needed
  before submission.'
review-status: unverified
field-status: {}
