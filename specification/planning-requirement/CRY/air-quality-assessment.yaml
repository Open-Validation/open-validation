reference: air-quality-assessment
local-authority: CRY
required-if:
  ref: major-development
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies DM16 and DM23; London Plan 2021 policy SI 1
source-text: The entire Borough is within an Air Quality Management Area (AQMA). Applicants should explain
  how appropriate measures to minimise emissions of (and exposure to) air pollution are designed-out at
  the design stage.
must-include:
- item: How measures to minimise emissions of, and exposure to, air pollution are designed in at the design
    stage
  level: should
- item: 'Where the development has a negative impact on air quality: mitigation measures to minimise or
    offset its emissions'
  level: should
- item: A calculation of the financial contribution for off-site mitigation
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 20 (Development Size). Threshold: Majors.'
review-status: unverified
field-status: {}
