reference: location-plan
local-authority: CRY
required-if:
  always: true
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All plans or drawings must use a standard metric scale, with a scale bar, drawing number,
  title, and north arrow (for plans). Site Location Plan An Ordnance Survey based site location plan,
  usually at a scale of 1:1250 showing two adjoining streets, with a north arrow, the boundary of the
  land including access to the highway outlined in red and any adjoining land owned by the applicant in
  blue.
must-include:
- item: Ordnance Survey based
  level: must
- item: Usually at a scale of 1:1250
  level: should
- item: Shows two adjoining streets, with a north arrow
  level: must
- item: Boundary of the land, including access to the highway, outlined in red
  level: must
- item: Any adjoining land owned by the applicant outlined in blue
  level: must
confidence: medium
notes: From the council's list (published May 2026), page 5, 13 (Common Invalidation Reasons; All Applications).
  Also listed for advertisement consent applications (page 7).
