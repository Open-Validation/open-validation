reference: biodiversity-survey-report
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 'Large minor or bigger: 5 or more new homes.'
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: 'Large minor or bigger: 500 sq m or more floorspace (new-build or change of use).'
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - national-nature-reserve
      description: The site is within or adjacent to a SINC, SSSI, NNR and/or LNR.
  - condition:
      field: demolition
      value: true
      description: Demolition of a building (Preliminary Roost Assessment for bats).
  - condition:
      field: vacant-building
      value: true
      description: Conversion of a vacant building (Preliminary Roost Assessment for bats).
  - discretionary
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Section 40 NERC Act 2006; Croydon Local Plan 2018 policies DM27 and SP7; London Plan 2021 policy
  G6
source-text: Planning applications must provide certainty about the likelihood of species and habitats
  being present and affected. A Preliminary Ecological Assessment Report (PEA) is required, and where
  further surveys for protected species are recommended within the PEA, the results of those surveys,
  with full details of mitigation, must be submitted. For applications under the validation threshold,
  additional information may be requested if it appears that species are likely to be present and affected.
  ... A Preliminary Roost Assessment (PRA) is required where a vacant building is converted, a building
  is demolished, or where a building or tree has potential roost features.
must-include:
- item: A Preliminary Ecological Assessment Report (PEA)
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 'Large minor or bigger: 5 or more new homes.'
    - condition:
        field: floorspace
        operator: '>='
        value: 500
        description: 'Large minor or bigger: 500 sq m or more floorspace (new-build or change of use).'
    - site:
        in:
        - local-wildlife-site
        - site-of-special-scientific-interest
        - national-nature-reserve
        description: The site is within or adjacent to a SINC, SSSI, NNR and/or LNR.
- item: Results of any further protected species surveys recommended in the PEA, with full details of
    mitigation
  level: must
- item: Surveys up to date, carried out at the appropriate time of year and by a suitably qualified ecologist
  level: must
- item: Any information about badgers in a separate (confidential) document
  level: must
- item: A Preliminary Roost Assessment (PRA) for bats, based on the latest guidance
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building.
    - condition:
        field: vacant-building
        value: true
        description: Conversion of a vacant building.
    - discretionary
confidence: medium
notes: 'From the council''s list (published May 2026), page 18-19, 26 (Development Size: Ecology: Preliminary
  Ecological Assessment; Development Type: Ecology: Preliminary Roost Assessment for bats). ''Large Minors
  +'' means 5 or more new homes or 500 sq m or more floorspace, and all Majors (definitions, pages 35-36).
  Shown as ''check'' as well: a building or tree with potential roost features, and smaller schemes where
  species are likely to be present.'
review-status: unverified
field-status: {}
