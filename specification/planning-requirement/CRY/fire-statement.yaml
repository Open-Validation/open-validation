reference: fire-statement
local-authority: CRY
required-if:
  always: true
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: 'London Plan 2021 policy D12; London Plan Guidance (2022): Fire Safety; Article 9A, Town and Country
  Planning (Development Management Procedure) (England) Order 2015 (relevant buildings)'
source-text: 'All applications need a supporting statement setting out the fire strategy for the site,
  or an Exception Statement explaining why one is not needed (see Form 4 of the London Plan Guidance (2022):
  Fire Safety). The Government''s Planning Gateway One requires Fire Statements to be submitted with applications
  for "relevant buildings" which: contain two or more dwellings / educational accommodation would be 18m
  or more in height, or 7 or more storeys.'
must-include:
- item: 'Either a statement setting out the fire strategy for the site, or a (Reasonable) Exception Statement
    explaining why one is not needed (Form 4 of the London Plan Guidance (2022): Fire Safety)'
  level: must
- item: 'For a relevant building (two or more dwellings or educational accommodation, and 18 m or more
    or 7 or more storeys): a Planning Gateway One Fire Statement'
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
confidence: medium
notes: From the council's list (published May 2026), page 5, 12 (Common Invalidation Reasons; All Applications).
  The fire statement or exception statement must be submitted at validation stage.
review-status: unverified
field-status: {}
