reference: energy-statement
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (Residential Minors).
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policy SP6; London Plan 2021 policies SI 2, SI 3 and SI 4
source-text: Energy Assessments should demonstrate how development will achieve net-zero carbon and comply
  with the requirements of the Development Plan, with reference to the London Plan Energy Hierarchy. ...
  All minor residential development proposals should be accompanied by a statement setting out details
  of clean energy solutions to achieve the target emission reduction set out the development plan, including
  details of amenity impacts associated with external equipment (including solar panels and air source
  heat pumps if proposed).
must-include:
- item: 'For major development: how it will achieve net-zero carbon, with reference to the London Plan
    Energy Hierarchy'
  level: must
  required-if:
    ref: major-development
- item: 'For major development: any necessary carbon offset contribution calculation'
  level: must
  required-if:
    ref: major-development
- item: 'For minor residential development: clean energy solutions to achieve the target emission reduction'
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor residential development.
- item: 'For minor residential development: amenity impacts of external equipment (such as solar panels
    and air source heat pumps)'
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor residential development.
confidence: medium
notes: 'From the council''s list (published May 2026), page 22, 29 (Development Size: Energy Assessment
  (Majors); Development Type: Energy Design Statement (Residential Minors)).'
review-status: unverified
field-status: {}
