reference: waste-management-plan
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: 'Minor development (Croydon''s ''Minors'' band: fewer than 10 homes and/or non-residential
        development under 1000 sq m, including change of use and extensions to flats).'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policy DM13; London Plan 2021 policies D6 and SI7
source-text: A plan and supporting explanation should be provided explaining how waste and recycling storage
  (and access to and from it) is proposed, with reference to the Council's Waste and recycling guidance.
must-include:
- item: A plan and supporting explanation of the waste and recycling storage and access to and from it
  level: should
- item: Capacity calculations for each type of waste
  level: should
- item: The design of the bin storage facility
  level: should
- item: 'Access and collection details: distances from the development to bin storage, drag distance to
    collection vehicles, and drawings of dropped kerbs for roadside access or swept path analysis for
    collection vehicles entering the site'
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 17 (Development Size). The list calls it a
  Refuse and recycling strategy. Threshold: Minors +. ''Minors +'' is Croydon''s ''Minors'' band and above
  (all applications except householder ones); householder applications are not in it (definitions, pages
  35-36).'
review-status: unverified
field-status: {}
