reference: viability-assessment
local-authority: CRY
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 'Major residential: 10 or more new homes.'
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: 'Major residential: a site of 0.5 ha or more where the number of homes is unknown.'
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The London Plan Fast Track Route thresholds/criteria are not met.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: 'Croydon Local Plan 2018 policies SP2 and D1; London Plan 2021 policies H4-H8; Homes for Londoners:
  Affordable Housing and Viability SPG 2017'
source-text: 'Where the London Plan Fast Track Route thresholds/criteria (as set out in the London Plan
  Homes for Londoners: Affordable Housing and Viability SPG 2017) are not met, a Financial Viability Assessment
  (FVA) must be submitted.'
must-include:
- item: A full unredacted Financial Viability Assessment (it will be published online)
  level: must
- item: An undertaking to cover the reasonable costs of the Council's independent third-party assessment
    of the FVA
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 27 (Development Type). The list calls it an
  Affordable Housing Financial Viability Statement. Threshold: Major Residential (10 or more homes, or
  0.5 ha or more where the number of homes is unknown).'
review-status: unverified
field-status: {}
