reference: planning-statement
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: 'Minor development (Croydon''s ''Minors'' band: fewer than 10 homes and/or non-residential
        development under 1000 sq m, including change of use and extensions to flats).'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: London Plan 2021 policy DF1
source-text: This should identify the context and need for the development and should include an assessment
  of how it accords with policies in the development plan. The information provided should be proportionate
  to the scale of the proposal.
must-include:
- item: The context and need for the development
  level: should
- item: An assessment of how the proposal accords with development plan policies
  level: should
confidence: medium
notes: 'From the council''s list (published May 2026), page 17 (Development Size). Threshold: Minors +.
  ''Minors +'' is Croydon''s ''Minors'' band and above (all applications except householder ones); householder
  applications are not in it (definitions, pages 35-36). Items marked * in the list (e.g. refuse strategy,
  transport statement) may be covered within the planning statement for smaller schemes.'
review-status: unverified
field-status: {}
