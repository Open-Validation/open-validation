reference: design-and-access-statement
local-authority: CRY
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: 100 sqm or more of new floorspace (including householder extensions).
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more homes.
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a designated area.
  - application-type:
      in:
      - lbc
  - ref: major-development
  - condition:
      field: large-minor-development
      value: true
      description: Large minor development (Croydon's 'Large Minors' band).
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
confidence: medium
notes: 'From the audit (missing_requirement): 100sqm+, 1+ home in a designated area, listed building consent,
  and Large Minors+.'
review-status: unverified
field-status: {}
