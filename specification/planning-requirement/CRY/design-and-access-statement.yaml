reference: design-and-access-statement
local-authority: CRY
required-if:
  any:
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: A 'designated area' (conservation area or World Heritage Site).
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m or more floorspace created.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new homes.
  - application-type:
      in:
      - lbc
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 'Large minor or bigger: 5 or more new homes.'
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: 'Large minor or bigger: 500 sq m or more floorspace (new-build or change of use).'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Croydon Local
  Plan 2018 policy DM10; London Plan Character and Context SPG
source-text: 100sqm+ or 1+home in a "designated area" (such as a conservation area), Listed building consent
  Large Minors+
must-include:
- item: Proportionate to the scale of the development
  level: should
- item: Visual, using diagrams, sketches, plans and photographs
  level: should
- item: Addresses amount, layout, scale, landscaping, access to the site, appearance, and inclusive design
  level: should
- item: Usually a character appraisal showing how the design respects the local character
  level: should
  source-text: A DAS should usually include a character appraisal, to demonstrate how the design of the
    development respects the local character.
confidence: medium
notes: From the council's list (published May 2026), page 6, 16 (Development Size; Other Application Types).
  The source text is the threshold column. There are no World Heritage Sites in Croydon. 'Large Minors
  +' means 5 or more new homes or 500 sq m or more floorspace, and all Majors (definitions, pages 35-36).
review-status: unverified
field-status: {}
