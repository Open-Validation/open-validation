reference: transport-assessment
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: 'Minor development (Croydon''s ''Minors'' band: fewer than 10 homes and/or non-residential
        development under 1000 sq m, including change of use and extensions to flats).'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP8, DM29 and DM30; London Plan 2021 policies T4, T5 and T6
source-text: For minor applications, a Transport Statement (TS) should outline the transport aspects of
  the application including parking, cycle parking, servicing, and refuse collection access. ... For major
  applications a full Transport Assessment (TA) will be required, which should refer to TfL's healthy
  streets and Active Travel Zone assessment guidance.
must-include:
- item: 'For minor applications: a Transport Statement covering parking, cycle parking, servicing and
    refuse collection access (may be within other documents such as the planning statement)'
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
- item: 1:50 drawings showing the dimensions of cycle storage and bin storage, and access to and from
    them
  level: should
- item: 'For major applications: a full Transport Assessment referring to TfL''s Healthy Streets and Active
    Travel Zone assessment guidance'
  level: must
  required-if:
    ref: major-development
- item: The level of parking and how it complies with parking standards
  level: should
- item: Drawings of vehicle and pedestrian visibility sight lines to Manual for Streets standards
  level: should
- item: Swept path drawings for entry from the public highway for a range of vehicles, including a 4.8
    m car and any servicing, waste or emergency vehicles
  level: should
- item: Any parking stress survey (scoped with the Council's Strategic Transport team at pre-application
    stage)
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published May 2026), page 18 (Development Size). Threshold: Minors +.
  ''Minors +'' is Croydon''s ''Minors'' band and above (all applications except householder ones); householder
  applications are not in it (definitions, pages 35-36).'
review-status: unverified
field-status: {}
