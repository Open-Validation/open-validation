reference: arboriculturist-report
local-authority: CRY
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees are present on or adjacent to the development proposal.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP4, SP7, DM10 and DM28; London Plan 2021 policy G7
source-text: 'Proposals which affect trees require a tree survey and details of proposed works and protection
  measures. This should be prepared by a suitably qualified arboriculturist in accordance with BS5837:
  2012: Trees in Relation to Design, Demolition and Construction'
must-include:
- item: Prepared by a suitably qualified arboriculturist to BS 5837:2012
  level: should
- item: Schedule of tree details and their categorisation
  level: should
- item: Root protection areas (RPAs) and any works within an RPA
  level: should
- item: Arboricultural impact assessment of the direct and indirect effects of the design, with mitigation
    where necessary
  level: should
- item: Tree protection plan based on the topographical survey, with protection measures for every retained
    tree
  level: should
- item: Size, species and location of replacement trees
  level: should
- item: Hard and soft landscape design, including new tree planting
  level: should
confidence: medium
notes: From the council's list (published May 2026), page 33 (Site Constraints). The list calls it a Tree
  Survey / Arboricultural Report (BS5837).
review-status: unverified
field-status: {}
