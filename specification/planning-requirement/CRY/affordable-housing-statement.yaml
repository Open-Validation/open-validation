reference: affordable-housing-statement
local-authority: CRY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 'Major residential: 10 or more new homes.'
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: 'Major residential: a site of 0.5 ha or more where the number of homes is unknown.'
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP2 and DM1; London Plan 2021 policies H4-H8; GLA Housing and
  Viability SPG (2017)
source-text: Major Residential
must-include:
- item: A schedule of the market and affordable housing proposed, by units, habitable rooms and floor
    area (GIA and GEA)
  level: must
- item: The affordable provision by tenure as a percentage, by units, habitable rooms and floor area
  level: must
- item: The location of affordable units on a plan to scale
  level: must
- item: A full explanation of the levels or types of affordability or tenure for different units, how
    they comply with the GLA definitions of affordable housing, and how units comply with the relevant
    income levels (monthly costs and annual salaries)
  level: must
- item: Details of discussions with affordable housing providers on tenure and housing mix, and of any
    agreements with Registered Providers
  level: must
- item: Details of grant funding sought to address London Plan requirements
  level: must
confidence: medium
notes: From the council's list (published May 2026), page 28 (Development Type). The source text is the
  threshold column; the details list only what the statement must include. Major Residential is 10 or
  more homes, or 0.5 ha or more where the number of homes is unknown (definitions, page 36).
review-status: unverified
field-status: {}
