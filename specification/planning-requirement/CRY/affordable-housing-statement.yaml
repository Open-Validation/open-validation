reference: affordable-housing-statement
local-authority: CRY
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Major residential development.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: London Plan 2021 policies H4-H8
source-text: 'The affordable housing statement must include: a schedule setting out the market and affordable
  housing proposed, including a breakdown by units, habitable rooms, and floor area (both GIA and GEA)'
must-include:
- item: A schedule of the market and affordable housing proposed, by units, habitable rooms and floor
    area (GIA and GEA)
  level: must
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the excerpt merged in the next table row; the item is for
  Major Residential schemes only.'
