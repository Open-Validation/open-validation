source-text: Completed application form, and Ownership / Agricultural holdings certificates ... In line
  with the GLA's London Development Database Automation Project, the additional information required as
  part of the GLA Planning Data Standard must be completed. The relevant Ownership certificate (A, B,
  C or D) and Notice 1 or 2 if applicable, alongside the Agricultural Holdings Certificate, needs to be
  provided (included in the planning application form).
