reference: habitat-baseline
local-authority: CRY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is not exempt from biodiversity net gain.
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Environment Act 2021; London Plan 2021 policy SP7; Croydon Local Plan 2018 policy DM27
source-text: If the development is not exempt, detailed ecological information must be provided by a suitably
  qualified ecologist to demonstrate how measurable BNG will be delivered. This must, as a minimum, include
  a plan showing onsite habitat(s), and a copy of a Statutory Metric assessment of the site (baseline
  habitats recorded).
must-include:
- item: A plan showing onsite habitat(s)
  level: must
- item: Provided by a suitably qualified ecologist
  level: must
confidence: medium
notes: From the council's list (published May 2026), page 15 (Biodiversity Net Gain). Part of the BNG
  Statement, which is listed with the unmapped items.
