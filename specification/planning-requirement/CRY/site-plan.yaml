reference: site-plan
local-authority: CRY
required-if:
  always: true
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block Plan Existing and proposed block plans at 1:200 or 1:500, showing the site boundaries
  and all existing and proposed buildings, structures, vehicle and pedestrian access, vehicle and cycle
  parking, hard surfaces, trees and relationships with adjoining properties.
must-include:
- item: Existing and proposed block plans
  level: must
- item: At 1:200 or 1:500
  level: must
- item: Site boundaries and all existing and proposed buildings and structures
  level: must
- item: Vehicle and pedestrian access, vehicle and cycle parking, and hard surfaces
  level: must
- item: Trees and relationships with adjoining properties
  level: must
confidence: medium
notes: From the council's list (published May 2026), page 13 (All Applications). The list calls it a block
  plan. A site plan is also listed for lawful development certificates, listed building consent and advertisement
  consent (pages 6-7).
