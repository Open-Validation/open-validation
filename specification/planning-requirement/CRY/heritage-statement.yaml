reference: heritage-statement
local-authority: CRY
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - listed-building
      - conservation-area
      - park-and-garden
      - locally-listed-building
      - local-character-area
      description: 'Affects a heritage asset: scheduled monument, listed building, conservation area,
        registered or locally listed historic park and garden, locally listed building or local area of
        special character.'
  - site:
      in:
      - listed-building-setting
      description: Works affecting the setting of a heritage asset.
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP1, SP4, SP6, DM10, DM15 and DM18; London Plan 2021 policies
  HC1 and HC2
source-text: Required for all applications that affect a heritage asset (scheduled monument, listed building,
  conservation area, registered historic park and garden, locally listed building, local area of special
  character, locally listed historic park and garden or other non-designated heritage asset), or works
  affecting the setting of a heritage asset.
must-include:
- item: Details of all heritage assets affected
  level: should
- item: A summary of the historic development of the site and affected asset(s)
  level: should
- item: A summary of the significance or 'special interest' of the asset(s)
  level: should
- item: A summary of the proposals / schedule of works
  level: should
- item: A structural survey
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition is proposed.
- item: How the proposals will impact on the significance of the asset(s)
  level: should
- item: Justification of the impact, including how the design conserves or minimises harm to the special
    interest of the asset and any heritage benefits that may outweigh the harm (mitigation)
  level: should
confidence: medium
notes: From the council's list (published May 2026), page 6, 32 (Site Constraints; Other Application Types).
  Proportionate to the assets' importance. Also listed as a minimum for listed building consent (page
  6). 'Other non-designated heritage asset' shows as 'check' because there is no dataset for it.
review-status: unverified
field-status: {}
