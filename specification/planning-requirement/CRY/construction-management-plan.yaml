reference: construction-management-plan
local-authority: CRY
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 'Large minor or bigger: 5 or more new homes.'
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: 'Large minor or bigger: 500 sq m or more floorspace (new-build or change of use).'
  - discretionary
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP6, SP8, DM23 and DM29; London Plan 2021 policies T4 and T7
source-text: Applicants should submit a scoping note setting out the construction management and logistics
  principles which are to be followed ... A construction logistics plan scoping note may also be requested
  during the course of an application for smaller minor developments that are likely to cause nuisance
  or disturbance to residential amenity, or hazard and obstruction to the public highway.
must-include:
- item: Phasing of the scheme and programme
  level: must
- item: Consideration of other development and infrastructure projects likely to be affected
  level: must
- item: Hours of operation
  level: must
- item: Details of vehicles entering and leaving the site
  level: must
- item: Dust and emissions control
  level: must
- item: A risk assessment covering the existing environments, the scale of the activity, proximity of
    sensitive receptors, prevailing meteorological and seasonal conditions, and length of the construction
    phase
  level: must
confidence: medium
notes: From the council's list (published May 2026), page 19-20 (Development Size). The list asks for
  a Construction Management or Logistics Plan scoping note. 'Large Minors +' means 5 or more new homes
  or 500 sq m or more floorspace, and all Majors (definitions, pages 35-36). Smaller minor developments
  show as 'check' because the council may ask for one during the application.
review-status: unverified
field-status: {}
