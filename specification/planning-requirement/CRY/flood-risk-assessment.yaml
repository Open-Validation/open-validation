reference: flood-risk-assessment
local-authority: CRY
required-if:
  always: true
source-url: https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
policy: Croydon Local Plan 2018 policies SP6, DM25 and Table 8.1; London Plan 2021 policies SI 12 and
  SI 13
source-text: All applications require a Flood Risk Assessment (FRA), even if not in areas at risk of flooding,
  to demonstrate that they are not contributing to flood risk. This should be appropriate to the scale,
  nature and location of the development and refer to the Strategic Flood Risk Assessment and flood risk
  maps online.
must-include:
- item: Refers to the Strategic Flood Risk Assessment and the online flood risk maps
  level: should
- item: Considers flood risk from all sources, particularly rivers, surface water and ground water
  level: should
  source-text: Make sure that you check flood risk from all sources, particularly rivers, surface water
    and ground water.
- item: Includes mitigation measures and sustainable drainage where necessary
  level: should
- item: 'For householder extensions: may be a brief statement, a search of online flood risk maps to identify
    risks, and proportionate measures such as a water butt or permeable paving'
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: 'For major developments: refers to the guidance published on the Council''s website'
  level: should
  required-if:
    ref: major-development
- item: 'For a basement in an area at risk of groundwater flooding: a basement impact assessment identifying
    the location in relation to aquifers or watercourses, impacts on flooding and drainage, measures to
    reduce flood risk to the proposed and neighbouring properties, and ongoing drainage and maintenance'
  level: should
  required-if:
    all:
    - condition:
        field: basement
        value: true
        description: Basement development is proposed.
    - discretionary
  source-text: If basement development is proposed in an area at risk of ground water flood risk, the
    FRA should include a basement impact assessment.
confidence: medium
notes: From the council's list (published May 2026), page 5, 12-13 (Common Invalidation Reasons; All Applications).
  The basement item shows the groundwater-risk part as 'check' because there is no dataset for areas at
  risk of groundwater flooding.
review-status: unverified
field-status: {}
