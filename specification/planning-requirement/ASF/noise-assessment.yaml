reference: noise-assessment
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The development would generate significant levels of noise or vibration in relation
          to residential and commercial properties.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise-sensitive use in proximity to a known noise source.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
source-text: Instances where the development would generate significant levels of noise or vibration in
  relation to residential and commercial properties, or it proposes a noise- sensitive use in proximity
  to a known noise source
must-include:
- item: An assessment of the source and the impact, with any mitigation needed to reduce noise or vibration
    to acceptable levels
  level: must
- item: Prepared by a suitably qualified acoustician
  level: should
- item: Sufficient sound insulation (or other mitigation) shown to avoid harm to adjacent residents
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV26. The list calls it a Noise and Vibration Impact Assessment. Application types from
  the council's Supplementary Matrix.
review-status: unverified
field-status: {}
