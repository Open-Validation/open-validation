reference: location-plan
local-authority: ASF
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - prior-approval
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: It should be based on an up-to-date ... The application site should be edged clearly with
  a solid red ... It should include all land necessary to carry out the proposed development
must-include:
- item: Based on an up-to-date map
  level: must
- item: Scale typically 1:1250 or 1:2500, scaled to fit A4 or A3 wherever possible
  level: should
- item: Clearly titled, with a unique reference number, and dated
  level: must
- item: At least two named roads and surrounding buildings, with properties numbered or named, wherever
    possible
  level: should
- item: Application site edged clearly with a solid red line
  level: must
- item: All land needed to carry out the development (e.g. access from a public highway, visibility splays,
    landscaping, car parking, open areas around buildings), including all land for any new private access
    abutting the public highway
  level: must
- item: Any other land owned by the applicant close to or adjoining the site outlined in blue
  level: must
- item: Red line not including the publicly adopted highway unless the proposal changes the highway
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV7. Application types from the council's Supplementary Matrix.
review-status: unverified
field-status: {}
