reference: affordable-housing-statement
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major applications of 10 or more dwellings.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policies HOU1 and HOU14
source-text: Major applications 10 or more dwellings.
must-include:
- item: How the scheme complies with policy HOU1, with an evidence-based justification for any variation
  level: must
- item: The number and mix of units and the floor space of habitable areas
  level: should
- item: Scaled plans showing the location, type and floor space of units and number of bedrooms
  level: should
- item: Wheelchair accessible homes to Building Regulations M4(3)(b) within the affordable rented element
    (capped at 7.5%)
  level: must
- item: 'Where Vacant Building Credit is claimed: the period of vacancy and the last known date of use'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV12. It can form part of the Design and Access Statement. Application types from the council's
  Supplementary Matrix.
review-status: unverified
field-status: {}
