reference: energy-statement
local-authority: ASF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: renewable-energy-development
          value: true
          description: An application for renewable energy production.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential dwellings, including dwellings from a material change of use.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy ENV10
source-text: Major applications and all applications for renewable energy production. ... Climate Mitigation
  Statement – Solar New residential dwellings. Dwellings resulting from a material change of use.
must-include:
- item: Supporting statement addressing the policy ENV10 criteria
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: renewable-energy-development
        value: true
        description: Renewable energy production.
- item: 'For new renewable energy production facilities: how the local environment will be protected'
  level: must
  required-if:
    condition:
      field: renewable-energy-development
      value: true
      description: Renewable energy production.
- item: 'Solar: the scale of the installation (e.g. panels per dwelling) and the amount of energy it will
    generate'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
- item: 'Solar: if generation is under 50% of the dwellings'' yearly average energy consumption, evidence
    of why the target cannot be reached'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
- item: 'Solar: the technology used, and reasons if it is not the most efficient and up to date'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
- item: 'Solar: appearance of the PV panels, with elevations (roof and ground mounted arrays), a roof
    plan for roof systems or a block plan for free-standing systems'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
- item: 'Solar: details of future maintenance'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
- item: 'Outline applications: confirmation that solar PV will be provided, with a commitment to give
    full details at reserved matters'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV5, LV29. Covers the Renewable Energy Statement (LV5) and the Climate Mitigation Statement
  – Solar (LV29). Householder extensions, outbuildings, car ports and garages are only 'encouraged' to
  apply the solar guidance, so householder shows as discretionary. Application types from the council's
  Supplementary Matrix.
review-status: unverified
field-status: {}
