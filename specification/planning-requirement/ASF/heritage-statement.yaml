source-text: Heritage Statement It should include a schedule of works to the heritage asset(s); an analysis
  of the significance of the archaeology, history and character of the building/structure, the principles
  of and justification for the proposed works and their impact on the special character of the heritage
  asset, its setting and the setting of adjacent heritage assets may be required*.
