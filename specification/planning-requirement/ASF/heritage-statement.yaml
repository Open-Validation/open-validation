reference: heritage-statement
local-authority: ASF
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - locally-listed-building
    - scheduled-monument
    - park-and-garden
    description: Will or may impact designated heritage assets and/or their settings (including conservation
      areas and locally listed buildings).
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policies ENV13 and ENV14
source-text: 'Heritage Statement: Applies to all development proposals which will/may impact designated
  Heritage Assets and/or their settings (including conservation areas and locally listed buildings)'
must-include:
- item: A schedule of works to the heritage asset(s)
  level: should
- item: An analysis of the significance of the archaeology, history and character of the building/structure
  level: should
- item: The principles of and justification for the proposed works, and their impact on the special character
    of the heritage asset, its setting and the setting of adjacent heritage assets
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV1. The scope and detail vary with the scale and circumstances of each application. It
  may be combined with the archaeology assessment. The matrix marks it for householder ('as appropriate'),
  full and listed building consent applications.
review-status: unverified
field-status: {}
