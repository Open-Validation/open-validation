reference: section-existing
local-authority: ASF
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal changes ground levels, or the site slopes.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In cases where a proposal involves a change in ground levels or is on a sloping site, drawings
  at a 1:50, 1:100 or 1:200 scale should be submitted showing a cross section through the proposed building
  or site.
must-include:
- item: Scale of 1:50, 1:100 or 1:200
  level: must
- item: A cross section through the proposed building or site
  level: must
- item: Both existing and finished levels (contours, spot levels or cross or long sections as appropriate)
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV9. The list asks for existing and proposed site sections and finished floor and site
  levels.
review-status: unverified
field-status: {}
