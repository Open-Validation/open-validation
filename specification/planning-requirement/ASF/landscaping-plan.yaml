reference: landscaping-plan
local-authority: ASF
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The development changes land contours.
  - condition:
      field: landscaping-works
      value: true
      description: The development changes soils, substrates, waterbodies, vegetation and/or landscape
        features.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
source-text: Where a development involves changes to land contours, soils, substrates, waterbodies, vegetation
  and/or landscape features then a proposed landscaping and restoration concept is expected to be depicted
  on one or more plans.
must-include:
- item: A proposed landscaping and restoration concept
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV9. The list calls it Proposed Landscaping or Restoration Plans.
review-status: unverified
field-status: {}
