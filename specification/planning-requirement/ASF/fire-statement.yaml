reference: fire-statement
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: Seven or more storeys.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All applications for planning permission for development which involves the provision of
  one or more relevant buildings, or development of an existing relevant building or development within
  the curtilage of a relevant building. A relevant building is one which contains two or more dwellings
  or educational accommodation and meets the height condition: 18 metres or more in height, or seven or
  more storeys.'
must-include:
- item: Submitted on the form published by the Secretary of State
  level: must
- item: The fire safety design principles, concepts and standards applied to the development
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV28. Not needed where an exemption applies. Application types from the council's Supplementary
  Matrix.
review-status: unverified
field-status: {}
