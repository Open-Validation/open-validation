reference: floor-plan-existing
local-authority: ASF
required-if:
  condition:
    field: building-works
    value: true
    description: The proposal involves building works or changes to the floor layout.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In addition to the location plan and block/layout plan, other plans should be submitted (dependent
  on the type of application and development proposed) to explain the proposal in detail. The drawings
  submitted should show details of the existing building(s) as well as those for the proposed development.
must-include:
- item: Scale of 1:50 or 1:100
  level: must
- item: Labelled to show the existing and proposed usage
  level: must
- item: Buildings or walls to be demolished clearly shown
  level: must
- item: New buildings shown in relation to adjacent buildings
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV9. Part of 'Other Plans', which the matrix marks for every application type.
review-status: unverified
field-status: {}
