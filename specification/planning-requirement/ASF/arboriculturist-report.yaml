reference: arboriculturist-report
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - approval-condition
  - any:
    - all:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Works are proposed to trees as part of the proposals.
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: A protected tree (TPO or tree in a Conservation Area).
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Works are proposed to trees as part of the proposals.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Town and Country Planning Act 1990 (Section 197-198)
source-text: Where works are required to a protected tree (TPO or tree in Conservation Area), and where
  works are proposed to any trees as part of the proposals.
must-include:
- item: A detailed description of the proposed tree works (e.g. crown thinning, reduction, lifting, felling)
    and the reasons
  level: should
- item: Digital photographs of the existing tree(s)
  level: should
- item: Arboricultural Impact Assessment showing how root protection, changes in levels, services and
    material storage were considered in the design, with no significant adverse impact on important trees
  level: should
- item: Future issues, e.g. long-term effect of changed surfacing or levels, or pressure to prune or remove
    trees due to shading or encroachment
  level: should
- item: Tree root protection zones clearly marked on a scale plan
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV17. The list calls it a Tree survey and/or associated Arboricultural Impact Assessment.
  Application types from the council's Supplementary Matrix.
review-status: unverified
field-status: {}
