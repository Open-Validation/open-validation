submission-standards:
- item: Maximum single file size 5 MB; maximum 25 MB in total (larger submissions by file-sharing link)
  level: must
- item: PDF recommended
  level: should
- item: Drawings specify the printing page size for which the scale applies
  level: must
- item: Drawings correctly orientated for on-screen display (North at the top)
  level: must
- item: Drawings include a scale bar and key dimensions
  level: must
- item: Documents and drawings given a meaningful title and dated, with drawings given a unique plan reference
  level: must
- item: Scanned documents at least 200 dpi (black and white) or 100 dpi (colour)
  level: must
- item: Photographs in PDF format and no larger than 15cm x 10cm
  level: must
- item: Revised plans or documents clearly named to show the change
  level: should
- item: Plans must not contain the phrase 'Do not scale'
  level: should
- item: Large documents broken into manageable files with plain-English names
  level: should
