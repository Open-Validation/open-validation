reference: town-centre-impact-assessment
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 500
          description: Retail of 500 sq m or more.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside the Ashford and Tenterden primary shopping frontages.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other main town centre uses, in accordance with the NPPF.
      - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy EMP9
source-text: Any retail located outside of Ashford and Tenterden Primary Shopping frontages and proposal
  is 500+ sq.m or other main town centre uses in accordance with NPPF.
must-include:
- item: A sequential test
  level: must
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on the vitality and viability of adjacent centres, including local consumer choice and
    trade, and the wider retail catchment (as applicable)
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV25. The list calls it a Town Centre/Retail/Leisure Uses Impact Assessment. Other main
  town centre uses show as discretionary because the list points to the NPPF without giving a threshold.
  Application types from the council's Supplementary Matrix.
review-status: unverified
field-status: {}
