reference: design-and-access-statement
local-authority: ASF
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and Access Statements (DAS) must accompany an application to the following: Applications
  for major development, as defined in article 2 of the Town and Country Planning (Development Management
  Procedure (England) Order 2015 ; Applications for development in a designated area (Conservation Area),
  where the proposed development consists of: one or more dwellings; or a building or buildings with a
  floor space of 100 square metres or ... Applications for listed building'
must-include:
- item: Crime prevention measures for major development, unless addressed in a separate document
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV6. The web page cuts off the last words of some lines ('100 square metres or more', 'listed
  building consent'). The council's matrix marks it for full and outline applications.
review-status: unverified
field-status: {}
