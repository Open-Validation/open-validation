reference: water-impact-assessment
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - all:
    - site:
        in:
        - nutrient-neutrality-area
        description: Within the Stour Catchment Area, or discharging into Bybrook, Lenham, Wye, Sellindge
          or Chartham Wastewater Treatment Works.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New housing.
      - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy ENV1
source-text: 'All applications for new housing and overnight accommodation within the Stour Catchment
  Area or that will discharge into identified Wastewater Treatment Works: Bybrook WwTW, Lenham WwTW, Wye
  WwTW, Sellindge WwTW, or Chartham WwTW'
must-include:
- item: The nutrient loading of the development quantified using the latest Natural England methodology
  level: must
- item: Suitable mitigation identified to achieve nutrient neutrality
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV10. The list calls it a Stodmarsh Mitigation Strategy (Mitigation Strategy / Appropriate
  Assessment). Other overnight accommodation shows as discretionary because there is no field for it.
  Application types from the council's Supplementary Matrix.
review-status: unverified
field-status: {}
