reference: elevation-proposed
local-authority: ASF
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the outside of a building.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In addition to the location plan and block/layout plan, other plans should be submitted (dependent
  on the type of application and development proposed) to explain the proposal in detail. The drawings
  submitted should show details of the existing building(s) as well as those for the proposed development.
must-include:
- item: Scale of 1:50 or 1:100
  level: must
- item: The proposed works shown clearly in relation to what is already there
  level: must
- item: All sides of the proposal shown, with orientations labelled (not just 'front', 'side' and 'rear')
  level: must
- item: Proposed building materials, and the style, materials and finish of windows and doors
  level: must
- item: Blank elevations included
  level: must
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV9. Part of 'Other Plans', which the matrix marks for every application type.
review-status: unverified
field-status: {}
