  all baseline on-site habitat, included in the biodiversity metric calculation, as well as any irreplaceable
  habitat.
must-include:
- item: Drawn to scale, with a north arrow
  level: must
- item: UKHAB V2.0
  level: should
- item: Location and extent of all baseline on-site habitat included in the metric, and any irreplaceable
    habitat
  level: must
confidence: medium
notes: 'From the council''s list (last revised July 2024), Table 1 (National Validation Checklist), page
