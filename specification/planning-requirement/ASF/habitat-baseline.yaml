reference: habitat-baseline
local-authority: ASF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Qualifying development (major and small sites development) subject to the Biodiversity
          Gain Condition.
  - all:
    - application-type:
        in:
        - reserved-matters
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Qualifying development (major and small sites development) subject to the Biodiversity
          Gain Condition.
    - discretionary
