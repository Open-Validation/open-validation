reference: archaeological-assessment
local-authority: ASF
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - archaeological-priority-area
      description: On or adjacent to a heritage asset of archaeological interest, or on a site of archaeological
        potential.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy ENV15
source-text: 'Archaeology: Applications for major development. Applications for development known to be
  on or adjacent to a heritage asset of archaeological interest. Applications for development on sites
  of Archaeological potential.'
must-include:
- item: An appropriate desk-based assessment
  level: must
- item: A suitable field evaluation of the character, condition and extent of any archaeological remains,
    where appropriate
  level: must
  required-if: discretionary
- item: 'Where remains of specific importance are identified: how the development enables preservation
    in situ, or excavation, recording, analysis and reporting'
  level: must
  required-if: discretionary
- item: The Historic Environment Record consulted, as a minimum
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV1. The list calls it an Archaeology Assessment; it may be combined with the Heritage
  Statement.
review-status: unverified
field-status: {}
