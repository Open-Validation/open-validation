reference: sustainable-drainage-strategy
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy ENV9; Sustainable Drainage SPD
source-text: All development proposals (set out in SPD).
must-include:
- item: The overall approach and rationale for surface water management, having regard to the sustainable
    drainage hierarchy in the SPD
  level: must
- item: Sustainable drainage systems incorporated, unless there is clear evidence this would not be appropriate
  level: should
  required-if:
    ref: major-development
- item: SuDS features with multifunctional benefits and maintenance arrangements for the lifetime of the
    development, where possible
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV4. Shows as discretionary because the list leaves which proposals need it to the Sustainable
  Drainage SPD. Application types from the council's Supplementary Matrix.
