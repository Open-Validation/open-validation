reference: viability-assessment
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The scheme does not meet all policy requirements, such as affordable housing (HOU1),
        because doing so would make it unviable.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy IMP2
source-text: Where schemes are not proposing to meet all policy requirements, such as affordable housing
  (HOU1), as meeting such requirements would render the proposal not economically viable.
must-include:
- item: Sufficient evidence to assess the scheme in line with RICS recommended practice and the NPPF
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV20. The scope is best agreed at pre-application stage; an independent review may be charged
  to the applicant. Application types from the council's Supplementary Matrix.
review-status: unverified
field-status: {}
