reference: biodiversity-survey-report
local-authority: ASF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - local-wildlife-site
        description: On or adjacent to designated nature conservation sites (including Local Wildlife
          Sites).
    - condition:
        field: protected-species
        value: true
        description: Disturbance of wildlife habitats, including semi-natural open space and buildings
          with bat roost potential.
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Ashford Local Plan 2030 policy ENV1
source-text: Any development on or adjacent to designated nature conservation sites (including Local Wildlife
  Sites) or developments which will result in the disturbance of wildlife habitats including semi- natural
  open space and buildings with bat roost potential.
must-include:
- item: A description of the proposal
  level: should
- item: Desk study and field survey (extended Phase 1 habitat survey and detailed species surveys as necessary)
    of the site and adjacent area likely to be affected
  level: should
- item: Evaluation of features and assessment of the likely impacts
  level: should
- item: 'Mitigation, compensation and enhancement measures: proportionate, site-specific, feasible and
    deliverable'
  level: should
- item: Surveys at an appropriate time of year by suitably qualified and experienced ecological consultants,
    following published guidance
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV11. The list calls them Ecological Surveys. Application types from the council's Supplementary
  Matrix.
review-status: unverified
field-status: {}
