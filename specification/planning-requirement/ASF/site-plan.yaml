reference: site-plan
local-authority: ASF
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The block plan should be submitted, at an appropriate scale of 1:500 or 1:200.
must-include:
- item: Scale of 1:500 or 1:200
  level: must
- item: The direction of North
  level: must
- item: A scale bar
  level: must
- item: The scale and page size at which the original plan was produced (e.g. 1:1000 at A3)
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access (unless they would not influence
    or be affected by the development)
  level: must
- item: Public rights of way crossing or adjoining the site (unless they would not influence or be affected
    by the development)
  level: must
- item: Position of all trees on the site and on adjacent land (unless they would not influence or be
    affected by the development)
  level: must
- item: Extent and type of any hard surfacing (unless it would not influence or be affected by the development)
  level: must
- item: Boundary treatment, including walls or fencing (unless it would not influence or be affected by
    the development)
  level: must
confidence: medium
notes: From the council's list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV8. The list calls it a block plan. Application types from the council's Supplementary
  Matrix. For non-material amendments it is 'required as appropriate', so that part shows as discretionary.
review-status: unverified
field-status: {}
