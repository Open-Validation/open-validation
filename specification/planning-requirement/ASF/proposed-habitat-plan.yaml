reference: proposed-habitat-plan
local-authority: ASF
required-if:
  all:
  - any:
    - all:
      - application-type:
          in:
          - full
          - outline
      - condition:
          field: biodiversity-gain-condition
          value: true
          description: Qualifying development (major and small sites development) subject to the Biodiversity
            Gain Condition.
    - all:
      - application-type:
          in:
          - reserved-matters
      - condition:
          field: biodiversity-gain-condition
          value: true
          description: Qualifying development (major and small sites development) subject to the Biodiversity
            Gain Condition.
      - discretionary
  - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13415
policy: Schedule 7A, Town and Country Planning Act 1990
source-text: 'All applications for planning permission that will be subject to the ‘Biodiversity Gain
  Condition’ as defined in Paragraph 13, Schedule 7A of the 1990 Act . ... For on-site or combined schemes:
  A scaled plan(s) (UKHAB V2.0 preferred, with north arrow) showing the location and extent of post-development
  on-site habitat; as well as the location and extent of pre-development and post-development off-site
  habitat (if applicable), included in the biodiversity metric calculation. Any irreplaceable habitats
  should also be shown.'
must-include:
- item: Drawn to scale, with a north arrow
  level: must
- item: UKHAB V2.0
  level: should
- item: Location and extent of post-development on-site habitat
  level: must
- item: Location and extent of pre-development and post-development off-site habitat, if applicable
  level: must
  required-if: discretionary
- item: Any irreplaceable habitats
  level: should
confidence: medium
notes: From the council's list (last revised July 2024), Table 2 (Local Validation Requirements), page
  4 of 4, item LV30. Shows as discretionary because the plan is needed only for on-site or combined schemes.
  LV30 also asks for a BNG statement setting out how the objective will be met (recorded as unmapped).
review-status: unverified
field-status: {}
