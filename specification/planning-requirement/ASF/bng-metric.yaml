reference: bng-metric
local-authority: ASF
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Qualifying development (major and small sites development) subject to the Biodiversity
          Gain Condition.
  - all:
    - application-type:
        in:
        - reserved-matters
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: Qualifying development (major and small sites development) subject to the Biodiversity
          Gain Condition.
    - discretionary
source-url: https://www.ashford.gov.uk/publications/validation-checklist/?pid=13414
policy: Schedule 7A, Town and Country Planning Act 1990
source-text: 'Information relating to the ‘Biodiversity Gain Condition’ as defined in Paragraph 13, Schedule
  7A of the 1990 Act must accompany an application for the following: Applications for qualifying development
  ( major development and small sites development *)'
must-include:
- item: A completed biodiversity metric calculation showing the pre-development biodiversity value of
    the onsite habitat
  level: must
- item: The biodiversity value or values of the onsite habitat
  level: must
- item: 'The publication date of the metric calculation: the date of the application, an earlier date,
    or a date before any development activity under paragraph 6 or 6A of Schedule 7A'
  level: must
- item: A statement justifying the reasons for an earlier date, where one is used
  level: must
  required-if: discretionary
- item: A statement confirming whether any development activities under paragraph 6 or 6A of Schedule
    7A have taken place, with evidence of the date immediately before them
  level: must
- item: A description of any irreplaceable habitat on the publication date of the metric calculation
  level: must
confidence: medium
notes: 'From the council''s list (last revised July 2024), Table 1 (National Validation Checklist), page
  3 of 4, item NV10. You must also give a statement confirming whether or not the application is subject
  to the Biodiversity Gain Condition (with reasons if not). Application types from the council''s Supplementary
  Matrix. Reserved matters: ''required as appropriate''. Uses the biodiversity gain condition: householder
  and other exempt applications are exempt by law.'
review-status: unverified
field-status: {}
