reference: schedule-of-works
local-authority: HAO
required-if:
  all:
  - site:
      in:
      - listed-building
      description: The site is or contains a listed building.
  - condition:
      field: structural-alteration
      value: true
      description: Structural alterations to a listed building.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: Structural alterations to a listed building.
must-include:
- item: 'Works such as removal of any part of the building (including ceilings, partitions, fixtures and
    fittings): the location, extent and character of the items on the existing elevations, plans and sections,
    cross referenced to the schedule of works'
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 13, section 5 (Heritage proposals).
review-status: unverified
field-status: {}
