reference: biodiversity-survey-report
local-authority: HAO
required-if:
  condition:
    field: protected-species
    value: true
    description: Likely to affect protected species.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: Proposals likely to affect species protected under the Wildlife and Countryside Act 1981
  (as amended), the Conservation of Habitats and Species Regulations 2010, the Protection of Badgers Act
  1992
must-include:
- item: Which species are present, and their numbers (may be approximate)
  level: must
- item: Their distribution and use of the area, site, structure or feature (for example feeding, shelter
    and breeding)
  level: must
- item: Mitigation strategies where needed
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 17, section 6 (Supporting Information). Section
  6 is headed 'You may also be asked for these documents if relevant to your proposal'; the triggers are
  the list's own.
review-status: unverified
field-status: {}
