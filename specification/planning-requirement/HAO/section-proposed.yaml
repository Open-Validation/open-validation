reference: section-proposed
local-authority: HAO
required-if:
  any:
  - application-type:
      in:
      - ldc-prospective-use
      - advertising
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: The proposal includes a roof extension or dormer.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
must-include:
- item: Roof sections for roof extensions and dormers
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: At a scale of 1:100 or 1:50
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 1:20 sections of fascia or projecting signs, with the method of illumination, colour and fitting
    details
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: low
notes: 'From the audit (missing_requirement): sections 2 and 4 drawing requirements for householder roof
  works, proposed lawful development certificates and adverts. The items are the audit''s summary.'
review-status: unverified
field-status: {}
