reference: floor-plan-existing
local-authority: HAO
required-if:
  always: true
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7; Harborough
  Local Plan 2011-2031
source-text: Existing and proposed floor plans ... All
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For demolition of a listed building: the location and extent of demolition shown by labelling
    or hatching'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
confidence: medium
notes: 'From the council''s list (published April 2026), page 8-9, section 2 and 3. Required for all applications:
  householder ''All'' and other applications ''All applications including change of use''. An example
  is at Appendix 4.'
review-status: unverified
field-status: {}
