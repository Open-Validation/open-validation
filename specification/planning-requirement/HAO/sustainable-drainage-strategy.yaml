reference: sustainable-drainage-strategy
local-authority: HAO
required-if:
  ref: major-development
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: Sustainable Drainage Systems (SDS) ... Major development
must-include:
- item: Details of the implementation, adoption, maintenance and management of the sustainable drainage
    system
  level: must
- item: A sustainable surface water outfall
  level: must
- item: 'Where infiltration drainage is provided: infiltration test results (BRE365 or equivalent), or
    an alternative connection point where testing has not been done'
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: Infiltration drainage is provided.
- item: 'Where a connection to the sewers is proposed: evidence of consultation with the sewerage undertaker
    and that adequate foul water treatment and disposal facilities are available'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published April 2026), page 15-16, section 6 (Supporting Information).
  Uses the retired MHCLG id for a drainage strategy. The sewer connection item shows as 'check' because
  the rule has no field for it. Section 6 is headed 'You may also be asked for these documents if relevant
  to your proposal'; the triggers are the list's own.
review-status: unverified
field-status: {}
