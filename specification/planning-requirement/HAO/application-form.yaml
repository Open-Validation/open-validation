reference: application-form
local-authority: HAO
required-if:
  always: true
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: Application form ... All ... This part of the application form must be signed and dated to
  either confirm if the land to which the application relates is not part of an agricultural holding;
  or if it is that you have notified any tenants. ... This part of the application form must be signed
  and dated to confirm who (if known) owns the land to which the application relates. You must only sign
  and date one ownership certificate.
must-include:
- item: 'Agricultural holding certificate signed and dated: the land is not part of an agricultural holding,
    or any tenants have been notified'
  level: must
- item: One ownership certificate (A, B, C or D) signed and dated, saying who (if known) owns the land
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 2, section 1 (National Validation Requirements).
