reference: flood-risk-assessment
local-authority: HAO
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of one hectare or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of one hectare or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: The development itself is in Flood Zone 2 or 3.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: Planning applications for development proposals of one hectare or greater in Flood Zone 1
  and all development proposals located in Flood Zones 2 and 3 should be accompanied by a Flood Risk Assessment
  ... We only need a Flood Risk Assessment (FRA) if the development itself is in the Flood Zone.
must-include:
- item: Specific to the site and the plans
  level: must
- item: How flood risks will be managed for the lifetime of the development
  level: must
- item: Shows flood risk does not increase elsewhere
  level: must
- item: In proportion to the scale of the work
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 14-15, section 6 (Supporting Information).
  If part of the site is in Flood Zone 2 or 3 but the works are not, no FRA is needed at validation; the
  case officer may ask for one later. Section 6 is headed 'You may also be asked for these documents if
  relevant to your proposal'; the triggers are the list's own.
review-status: unverified
field-status: {}
