reference: landscaping-plan
local-authority: HAO
required-if:
  condition:
    field: external-space
    value: true
    description: The application includes external space.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: All applications that include external space must be accompanied by a detailed scheme for
  landscaping
must-include:
- item: Trees to be removed shown on the plans, with retained existing trees clearly differentiated from
    those proposed
  level: must
- item: Planting of trees and/or shrubs, surface materials, boundary screen walls and fences
  level: must
- item: Materials, species, tree and plant sizes, numbers and planting densities
  level: must
- item: Levels, gradients and any earthworks
  level: must
- item: Proposed timing of implementation
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 16-17, section 6 (Supporting Information).
  Section 6 is headed 'You may also be asked for these documents if relevant to your proposal'; the triggers
  are the list's own.
review-status: unverified
