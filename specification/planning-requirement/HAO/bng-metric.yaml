reference: bng-metric
local-authority: HAO
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning Act 1990 Schedule 7A (inserted by the Environment Act 2021); Town and
  Country Planning (Development Management Procedure) (England) Order 2015 article 7
source-text: 'Where applicable (householder planning applications are exempt) ... Where an applicant believes
  the development would be subject to the biodiversity gain condition, the application must be accompanied
  by minimum information set out in Article 7 of The Town and Country Planning (Development Management
  Procedure) (England) Order 2015:'
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
- item: The earlier date and the reasons for proposing it
  level: must
  required-if: discretionary
  source-text: where the applicant proposes to use an earlier date, this proposed earlier date and the
    reasons for proposing that date;
- item: Completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat, with the publication date of the metric used
  level: must
- item: 'Statement whether activities before that date lost onsite biodiversity value (''degradation'');
    where they did: the date immediately before, the value on that date, the completed metric and any
    supporting evidence'
  level: must
- item: Description of any irreplaceable habitat on the land on the date of application (or earlier date)
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 5-7, section 1 (Biodiversity Net Gain). Required
  by law where the biodiversity gain condition applies; householder and other exempt applications are
  exempt. Where you think the condition does not apply, the application form needs a statement of the
  exemption or transitional provision, with evidence where needed (for example for the de minimis exemption).
review-status: unverified
field-status: {}
