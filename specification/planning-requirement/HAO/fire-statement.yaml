reference: fire-statement
local-authority: HAO
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9A
source-text: Applications for development which involves the provision of one or more buildings to which
  paragraph (2 below) applies (“a relevant building”); ... development of an existing relevant building;
  or ... development within the curtilage of a relevant building. (2) This paragraph applies to a building
  which satisfies the height condition in paragraph (3) and contains— (a)two or more dwellings; or (b)educational
  accommodation. ... (3) The height condition is that— (a)the building is 18 metres or more in height;
  or (b)the building contains 7 or more storeys.
must-include:
- item: On a form published by the Secretary of State (or a form substantially to the same effect)
  level: must
- item: The particulars specified or referred to in the form
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 4-5, section 1 (National Validation Requirements).
  Also required for development of an existing relevant building or within the curtilage of one; the rule
  shows the building test only.
review-status: unverified
field-status: {}
