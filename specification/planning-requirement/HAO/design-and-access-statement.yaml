reference: design-and-access-statement
local-authority: HAO
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 9
source-text: 'Applications for major development ... Applications for development in a Conservation Area,
  where the proposed development consists of: 1. One or more dwellings; or 2. A building or buildings
  with a floor space of 100 square metres or more ... Applications for listed building consent'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development, and how the design takes that context
    into account
  level: must
- item: The applicant's approach to access and how relevant local plan policies have been taken into account
  level: must
- item: Any consultation on access issues, and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access have been addressed
  level: must
- item: Proportionate to the complexity of the application, but not long
  level: should
confidence: medium
notes: From the council's list (published April 2026), page 3-4, section 1 (National Validation Requirements).
  The council publishes two optional templates (with and without listed building consent).
review-status: unverified
field-status: {}
