reference: site-plan
local-authority: HAO
required-if:
  always: true
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7; Harborough
  Local Plan 2011-2031
source-text: Site plan/block plan ... All
must-include:
- item: At an identified standard metric scale (for example 1:500 or 1:200)
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries
  level: must
- item: Car parking arrangements
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Car parking arrangements to be shown.
- item: 'For outline applications: the area or areas where access points to the development will be situated,
    even if access is reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: an application for outline planning permission must also indicate the area or areas where
    access points to the development will be situated, even if access has been reserved.
- item: 'For works to trees with a tree preservation order: the location of the trees, labelled to match
    the application form'
  level: should
  required-if:
    application-type:
      in:
      - consent-under-tpo
  source-text: Site plan showing the location of the trees labelled to match the application form*
confidence: medium
notes: From the council's list (published April 2026), page 8-9, section 2 and 3. The same rules appear
  for householder (section 2) and other applications (section 3); for others the list adds that further
  details 'may be required, unless these would not influence or be affected by the proposed development'
  without listing them. The outline access item is from section 1 (page 5); the tree item is from section
  7, 'Tree applications – advisory guidance' (page 18), so it is 'should'. Example plans are at Appendices
  2 and 3.
review-status: unverified
field-status: {}
