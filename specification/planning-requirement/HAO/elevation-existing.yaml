reference: elevation-existing
local-authority: HAO
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: building-works
      value: true
      description: The proposal involves building work.
  - condition:
      field: external-alterations
      value: true
      description: The proposal involves alterations to buildings.
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7; Harborough
  Local Plan 2011-2031
source-text: Existing and proposed elevations ... All ... All applications involving building work, alterations
  to buildings or display of advertisements
must-include:
- item: 'Drawn at the scale the list gives: a minimum of 1:50 or 1:100 for householder applications, ''a
    minimum scale of 1:500, or 1:100'' for other applications'
  level: must
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For listed building consent: existing internal elevations affected by the works, at scale 1:50'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For demolition of a listed building: the location and extent of demolition shown by labelling
    or hatching'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
confidence: medium
notes: From the council's list (published April 2026), page 8-10, section 2, 3 and 4. Householder applications
  need them in all cases (section 2); other applications for building work, alterations or advertisements
  (section 3). Listed building consent asks for internal elevations affected by the work and lawful development
  certificates for elevations (section 4). For non-material amendments the list asks for drawings showing
  the amendment 'where necessary' (page 11), so that part shows as 'check'. An example is at Appendix
  6.
review-status: unverified
field-status: {}
