reference: transport-assessment
local-authority: HAO
required-if:
  ref: major-development
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031; Leicestershire Highways Design Guide
source-text: Transport statement or transport assessment and travel plan ... Major development
must-include:
- item: Contents as set out in the Leicestershire Highways Design Guide
  level: must
- item: 'For impacts on the trunk road network: in line with Department for Transport guidance on transport
    assessment and Circular 02/2013'
  level: must
  required-if: discretionary
- item: Complete, including Pan Regional Transport Model (PRTM) modelling where necessary (or equivalent
    to the local highway authority standard) and its outputs
  level: must
  required-if: discretionary
- item: Public rights of way, including bridleways, if impacted
  level: must
  required-if:
    condition:
      field: affects-public-right-of-way
      value: true
      description: Public rights of way are impacted.
confidence: medium
notes: From the council's list (published April 2026), page 16, section 6 (Supporting Information). The
  list covers a transport statement or transport assessment. Section 6 is headed 'You may also be asked
  for these documents if relevant to your proposal'; the triggers are the list's own.
review-status: unverified
