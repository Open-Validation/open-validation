reference: land-contamination-assessment
local-authority: HAO
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: Land which could potentially be contaminated as a result of current or historic use.
  - any:
    - condition:
        field: building-works
        value: true
        description: The proposal involves building work.
    - condition:
        field: involves-change-of-use
        value: true
        description: The proposal significantly changes the use of the land.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: Proposals to re-develop or significantly change the use of a piece of land which could potentially
  be contaminated as a result of current or historic use
must-include:
- item: A contaminated land survey
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 17, section 6 (Supporting Information). Section
  6 is headed 'You may also be asked for these documents if relevant to your proposal'; the triggers are
  the list's own.
review-status: unverified
field-status: {}
