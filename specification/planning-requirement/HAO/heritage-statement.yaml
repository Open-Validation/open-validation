reference: heritage-statement
local-authority: HAO
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: The application impacts on the setting of a listed building.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - world-heritage-site
        description: A non-householder proposal affecting a designated heritage asset.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
source-text: Heritage statement All listed building consent applications and applications which impact
  on the setting of listed buildings.
confidence: medium
notes: 'Audit (wrong_app_type): the workbook filed it only under listed building consent. The list also
  requires it for applications affecting a listed building''s setting and for non-householder proposals
  affecting designated heritage assets (shown here as full, outline and reserved matters applications).'
review-status: unverified
field-status: {}
