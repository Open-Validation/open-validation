reference: heritage-statement
local-authority: HAO
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building-setting
      description: The application impacts on the setting of a listed building.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - s73
    - site:
        in:
        - listed-building
        - conservation-area
        - scheduled-monument
        - park-and-garden
        description: The proposal affects a designated heritage asset (listed building, conservation area,
          scheduled monument, registered historic park or garden) or its setting.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: All listed building consent applications and applications which impact on the setting of
  listed buildings. All proposals (other than householder applications) which affect designated heritage
  assets and their settings.
must-include:
- item: The history and value of the site or building
  level: must
- item: How the proposal affects it, and its setting
  level: must
- item: Photographs
  level: should
- item: The Historic England list description included, but not on its own
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: The site is or contains a listed building.
  source-text: do not copy the Historic England list description, that's not enough, but do include it
- item: A justification for any demolition (such as a structural survey)
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: The proposal involves demolition.
- item: 'For a listed building: covers both the inside and outside of the building'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: The site is or contains a listed building.
confidence: medium
notes: From the council's list (published April 2026), page 12, section 5 (Heritage proposals). Householder
  applications need one only for listed building consent or where they impact on the setting of a listed
  building. For small proposals you may write it yourself (the council publishes a template); for complex
  ones the list advises hiring a professional.
review-status: unverified
field-status: {}
