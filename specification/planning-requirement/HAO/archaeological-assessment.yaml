reference: archaeological-assessment
local-authority: HAO
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: In an area of archaeological potential.
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves disturbance of ground.
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: NPPF; Harborough Local Plan 2011-2031
source-text: Proposals involving disturbance of ground within an area of archaeological potential
must-include:
- item: An archaeological desk-based assessment including a field evaluation report
  level: must
confidence: medium
notes: From the council's list (published April 2026), page 15, section 6 (Supporting Information). Section
  6 is headed 'You may also be asked for these documents if relevant to your proposal'; the triggers are
  the list's own.
review-status: unverified
field-status: {}
