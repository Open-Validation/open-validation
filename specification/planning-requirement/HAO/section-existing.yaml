reference: section-existing
local-authority: HAO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: Roof extension or dormer windows, or other change to the roof.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: structural-alteration
        value: true
        description: Structural alterations to a listed building.
  - application-type:
      in:
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.harborough.gov.uk/download/downloads/id/778/local_validation_requirements_for_planning_applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 article 7; Harborough
  Local Plan 2011-2031
source-text: Roof extensions, , dormer windows and ... Submit existing and proposed sections through the
  roof. ... Advertisements ... Scale plans, elevations and sections
must-include:
- item: 'For a lawful development certificate: at scale 1:100 or 1:50, clearly showing the full extent
    of the use or building works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For illuminated advertisements: existing sections through any fascia or projecting sign, cut
    through to show the illumination, at scale 1:20'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
confidence: medium
notes: From the council's list (published April 2026), page 8-11, section 2 and 4. Required for householder
  roof extensions and dormers (section 2), advertisements, listed building consent involving removal or
  insertion of floors, ceilings or alterations to staircases, and lawful development certificates (section
  4). The section for other applications (section 3) does not ask for sections. For non-material amendments
  the list asks for drawings showing the amendment 'where necessary' (page 11), so that part shows as
  'check'.
review-status: unverified
field-status: {}
