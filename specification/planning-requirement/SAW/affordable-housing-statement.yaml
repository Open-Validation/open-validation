reference: affordable-housing-statement
local-authority: SAW
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Black Country Core Strategy (2011) policy HOU3; Sandwell Planning Obligations SPD; NPPF (2021)
  paragraphs 64-66
source-text: All applications for 10 or more dwellings.
must-include:
- item: Property type, number of bedrooms, size, tenure, location and number of the proposed affordable
    dwellings
  level: must
- item: A plan showing the location of the affordable housing
  level: must
- item: 'Where provision is below the policy quantum (25%): reference to the viability assessment'
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less than 25% affordable housing is proposed.
confidence: medium
notes: From the council's list (adopted September 2023), page 25-26. M10 'Affordable Housing Statement
  And a plan showing the location of affordable housing'. The Black Country Core Strategy seeks 25% affordable
  housing.
review-status: unverified
field-status: {}
