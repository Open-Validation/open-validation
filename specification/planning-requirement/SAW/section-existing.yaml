reference: section-existing
local-authority: SAW
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal changes site levels, or existing levels across the site (or between the
      site and a neighbouring site) differ by more than 0.3 m.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing changes to site levels or where existing levels across the site
  vary more than 0.3 metres. … a section will be required where there is clear difference in existing
  levels or level changes are proposed. … Where an application site itself and its relationship with a
  neighbouring site is affected by a change in ground level of over 300mm, sections should be provided
must-include:
- item: The proposals in relation to adjoining land and buildings
  level: must
- item: Cross section(s) through the proposed site and/or building(s), with a supplementary site plan
    showing where each section is taken from
  level: should
- item: Existing and finished levels, including foundations, retaining structures and how eaves relate
    to adjacent land and boundaries; how any encroachment on adjacent land is avoided
  level: should
- item: Existing site levels and finished floor levels (preferably differentiated by colour), related
    to a fixed datum point off site nearby or on a part of the site not affected by the works
  level: should
- item: 'At a scale of 1:200 or 1:100 (householder: 1:100 or 1:200)'
  level: must
- item: 'Householder: the extent of the change in levels, its effect on how the development will appear
    and, where necessary, any retaining structures or mitigation'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (adopted September 2023), page 7-8, 16. N11 'Existing and Proposed Site
  Sections and Finished Floor and Site Levels', H7, H10 and the plan standards in 2.3.
review-status: unverified
field-status: {}
