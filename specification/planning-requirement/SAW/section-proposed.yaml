reference: section-proposed
local-authority: SAW
required-if:
  condition:
    field: site-level-change
    operator: '>'
    value: 300
    description: The site, or its relationship with a neighbouring site, is affected by a change in ground
      level of over 300mm.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
source-text: Where an application site itself and its relationship with a neighbouring site is affected
  by a change in ground level of over 300mm, sections should be provided to demonstrate the extent of
  the change in levels, the effect that this has on how a development will appear and details, where necessary,
  of any retaining structures or mitigation proposed.
must-include:
- item: The extent of the change in levels
  level: should
- item: The effect the change has on how the development will appear
  level: should
- item: Details of any retaining structures or mitigation proposed, where necessary
  level: should
confidence: medium
notes: 'Audit (missing_requirement): the Householder checklist also asks for sections (H7) and levels
  over 300mm (H10).'
review-status: unverified
field-status: {}
