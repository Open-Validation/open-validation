reference: location-plan
local-authority: SAW
required-if:
  always: true
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: At a scale of 1:1250 or 1:2500, scaled to fit onto A4 or A3 paper wherever possible
  level: must
- item: Details clearly and logically labelled, for example road names, including at least two named roads
    and surrounding buildings
  level: must
- item: The direction of North
  level: must
- item: Site boundaries edged clearly with a red line
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged with a blue line
  level: should
confidence: medium
notes: From the council's list (adopted September 2023), page 7-8, 13. N6, the plan standards in 2.3 ('Location
  plans must be 1:1250 or 1:2500 and include details of at least two named roads') and H4.
review-status: unverified
field-status: {}
