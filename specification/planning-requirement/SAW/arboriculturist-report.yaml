reference: arboriculturist-report
local-authority: SAW
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees protected by a Tree Preservation Order.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Mature or semi-mature trees are present (including in a conservation area).
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning Act 1990, Part VIII; NPPF (2021) paragraph 131
source-text: All applications where any trees preservation orders, or are within conservation areas and
  where mature and semimature trees are present
must-include:
- item: A plan showing all trees on site and within 8 m of the proposed work
  level: must
- item: A list of trees to be removed and a schedule of any pruning to retained trees
  level: must
- item: 'Where trees are protected by a Tree Preservation Order or conservation area: a report in full
    accordance with BS5837'
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: Trees protected by a TPO or in a conservation area.
- item: A brief statement of the outcome of any advice sought from the council
  level: should
confidence: medium
notes: From the council's list (adopted September 2023), page 30-31. M17 'Arboricultural Report/ Trees
  Assessments'. Loss of mature and semi-mature trees will normally need replacement planting.
review-status: unverified
field-status: {}
