reference: arboriculturist-report
local-authority: SAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Mature or semi-mature trees are present.
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: The trees are protected by a TPO or are within a conservation area.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
source-text: M17 Arboricultural Report/ Trees Assessments All applications where any trees preservation
  orders, or are within conservation areas and where mature and semimature trees are present A plan must
  be provided showing the location of all trees on site and within 8m of the proposed work (NB trees further
  away may be relevant, see below) together with a list of trees which are desired to be removed and a
  schedule of any pruning to retained trees.
must-include:
- item: A plan showing the location of all trees on site and within 8m of the proposed work
  level: must
- item: A list of trees to be removed
  level: must
- item: A schedule of any pruning to retained trees
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): M17 is in Section 4, for all non-householder applications, not Full planning
  only.'
review-status: unverified
field-status: {}
