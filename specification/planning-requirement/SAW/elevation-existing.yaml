reference: elevation-existing
local-authority: SAW
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
  - condition:
      field: external-alterations
      value: true
      description: The proposal alters the exterior of an existing building.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings.
must-include:
- item: The proposed works shown in relation to what is already there, preferably differentiated by colour
  level: must
- item: Any blank elevations included
  level: should
- item: All elevations clearly and logically labelled (e.g. front or rear elevation), with titles that
    refer to their content and a plan number reference
  level: must
- item: 'Where an elevation adjoins another building on the boundary: the relationship between the buildings
    and the positions of the openings on each property'
  level: should
- item: 'Where an existing building is extended or altered: the whole of any existing elevation being
    extended or altered, not just part of it'
  level: must
- item: 'Householder: normally at a scale of 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (adopted September 2023), page 8, 15. N9, and H5 ('Existing and Proposed
  Floor Plans & Elevations (normally to scale of 1:50 or 1:100)'). The guide (2.1) counts elevations as
  a local requirement. Existing elevations only where there is an existing building.
review-status: unverified
field-status: {}
