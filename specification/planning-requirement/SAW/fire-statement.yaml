reference: fire-statement
local-authority: SAW
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: Buildings of 18 metres or more in height, or of seven or more storeys for residential purposes.
must-include:
- item: The fire safety considerations specific to the development
  level: must
confidence: medium
notes: From the council's list (adopted September 2023), page 16-17. N13 'Fire safety'. The rule follows
  the national requirement (two or more dwellings or educational accommodation, in a building of 18 m
  or 7 storeys or more).
review-status: unverified
field-status: {}
