reference: viability-assessment
local-authority: SAW
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing is not being provided because the scheme would not be viable.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: NPPF (2021) paragraph 58
source-text: All applications for 10 or more residential units where the amount of affordable is not being
  provided because the scheme would not be viable.
must-include:
- item: A full financial appraisal of the scheme, detailing costs and income
  level: should
- item: How the affordable housing will be delivered and the proposed tenure mix
  level: should
- item: A link to the Affordable Housing Statement
  level: should
confidence: medium
notes: From the council's list (adopted September 2023), page 27. M12. The council may have it independently
  assessed at the applicant's cost.
review-status: unverified
field-status: {}
