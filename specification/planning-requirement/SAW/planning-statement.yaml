reference: planning-statement
local-authority: SAW
required-if:
  any:
  - all:
    - ref: major-development
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
        - s73
  - application-type:
      in:
      - waste-dev
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: NPPF
source-text: All major applications (10 or more dwellings or 1,000 m2 or more of new floorspace) including
  change of use applications, extensions and mezzanine floors, except for waste management and mineral
  development applications … All proposals for waste management development (including proposals to expand,
  upgrade or relocate existing waste facilities) should be accompanied by a Planning Statement
must-include:
- item: A general description of the application site and of the proposed development
  level: must
- item: A summary of how the proposal accords with national and local planning policies, including those
    on the sustainable use and consumption of resources
  level: must
- item: A brief statement showing the proposal is sustainable development as defined in current policy
  level: should
- item: A brief statement showing the proposal is consistent with development plan land use policy, or
    a justified departure (with reasons)
  level: should
- item: 'An Energy Statement: energy efficiency and renewable/low carbon energy (may be a separate document)'
  level: should
  required-if:
    ref: major-development
- item: A Waste and Resource Management Statement (may be a separate document; can include an interim
    site waste management plan)
  level: should
  required-if:
    ref: major-development
- item: 'A Water Conservation Statement: minimising water consumption (may be a separate document)'
  level: should
  required-if:
    ref: major-development
- item: 'Waste management development: the key ''facts and figures'', and how the most recent Waste Regulations
    are addressed (waste hierarchy, no harm to health or environment, integrated network, proximity and
    self-sufficiency)'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Landfill or mining waste: compliance with Annex 1 of the Landfill Directive and Articles 7 and
    11 of the Mining Waste Directive'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 33-34, 38-40. S2 ''Planning Statement''
  and S5 ''Waste Management Development Proposals''. Listed under 4.3 ''Supporting documents (non-mandatory)'':
  the list says this information ''would not result in an application being made invalid''.'
review-status: unverified
field-status: {}
