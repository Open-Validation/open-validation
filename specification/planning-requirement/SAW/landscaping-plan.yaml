reference: landscaping-plan
local-authority: SAW
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - site:
        in:
        - listed-building-setting
        - locally-listed-building
        - park-and-garden
        - local-nature-reserve
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Affecting the setting of a listed or locally listed building or a registered park
          or garden; within or next to a Local Nature Reserve, SSSI or Site of Importance for Nature Conservation.
    - ref: major-development
    - discretionary
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Black Country Core Strategy (2011) policies ENV2, ENV3 and ENV4
source-text: All detailed applications (excluding shop fronts, advertisements, changes of use and householder
  applications) meeting the criteria set out in the adjacent guidance column. … Within or adjacent to
  transport corridors, including canals, railways, motorways and major roads. Water frontages where there
  is public access. Affecting the setting of a Listed Building, Building, Structure or Feature on the
  “Local List,” or a Registered Parks or Garden. Within or adjacent to Local Nature Reserves, Sites of
  Special Scientific Interest, Sites of Importance for Nature Conservation, parks, cemeteries or public
  open spaces. Major applications - 10 or more dwellings or new floorspace of 1000 square metres or more.
must-include:
- item: Full details of external layout and landscape proposals, fully integrated with proposals for ecological
    enhancement
  level: must
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 43-44. S8 ''Proposed Landscape Scheme''.
  Not needed where there is no open land visible from a public place, unless a heritage asset is affected.
  Discretionary: transport corridors, public water frontages, parks, cemeteries and public open spaces,
  which have no matching field. Listed under 4.3 ''Supporting documents (non-mandatory)'': the list says
  this information ''would not result in an application being made invalid''.'
review-status: unverified
field-status: {}
