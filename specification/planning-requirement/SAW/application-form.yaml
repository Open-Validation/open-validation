reference: application-form
local-authority: SAW
required-if:
  always: true
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications. All sections and questions must be answered. Declaration must be signed
  and dated.
must-include:
- item: All sections and questions answered
  level: must
- item: Declaration signed and dated
  level: must
- item: Non-residential floorspace given as gross internal floorspace
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Development other than housing (employment, retail, leisure...).
- item: 'Retail development (class E): net floorspace (net tradable area) also given'
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 0
      description: Retail development.
- item: 'Mobile homes, gypsy, traveller or travelling showpeople plots or pitches: the description of
    the proposal gives the number of homes, plots or pitches'
  level: must
  required-if: discretionary
- item: 'Waste management development: made on a detailed planning application form, with the section
    on ''Industrial or Commercial Processes and Machinery'' completed in full'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Mineral development: made on a detailed planning application form'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
confidence: medium
notes: From the council's list (adopted September 2023), page 8, 10-11. N1, and H3 'Completed householder
  application form'.
review-status: unverified
field-status: {}
