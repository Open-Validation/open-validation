reference: sustainable-drainage-strategy
local-authority: SAW
required-if:
  ref: major-development
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Black Country Core Strategy (2011) policy ENV5; NPPF (2021) paragraph 167
source-text: Sustainable Drainage systems are required for all major applications (10 or more dwellings,
  or 1000 square metres or more of new floorspace). … All major planning applications must include details
  setting out how Sustainable Urban Drainage Systems (SuDS) are proposed to be incorporated
must-include:
- item: How SuDS are incorporated to prevent or minimise surface water entering the sewerage system
  level: must
- item: That the scheme is consistent with the relevant planning policies
  level: should
- item: 'If SuDS are not possible: justification of why it would be impractical'
  level: must
confidence: medium
notes: From the council's list (adopted September 2023), page 22. M7 'Sustainable Drainage Details and
  Water Management Assessment'.
review-status: unverified
field-status: {}
