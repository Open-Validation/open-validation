reference: noise-assessment
local-authority: SAW
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - any:
      - condition:
          field: near-licensed-premises
          value: true
          description: Near licensed premises.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Adjacent to existing commercial premises.
  - all:
    - condition:
        field: class-b2-b8-floorspace
        operator: '>'
        value: 0
        description: New commercial development in Use Classes B2 or B8.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Adjacent to existing residential development.
  - condition:
      field: entertainment-leisure-use
      value: true
      description: An entertainment and licensed premises.
  - all:
    - ref: major-development
    - any:
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Major industrial or commercial development.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Introduces noise- or vibration-sensitive development where noise or vibration is
            likely to have an adverse impact.
  - discretionary
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: NPPF (2021) paragraph 174(e)
source-text: 'The following developments should include a noise impact assessment / noise mitigation scheme
  for the impact of noise on nearby residential uses: i) New residential development nearby to licensed
  premises, or adjacent to existing commercial premises. ii) new commercial development within Use Classes
  B2 or B8 adjacent to existing residential development iii) any application for an entertainment and
  licensed premise. iv) Other developments (including day nurseries, sports facilities, smoking areas,
  places of worship) can generate noise and may warrant a noise impact assessment / noise mitigation scheme,
  this will be determined on a site to site basis. … All major industrial or commercial applications.
  All major applications that introduce or expose noise and/or vibration-sensitive development(s) into
  areas and locations where noise and/or vibration is likely to have an adverse impact.'
must-include:
- item: The potential sources of noise generation and how they may affect local amenity
  level: should
- item: How the developer mitigates any adverse issues identified
  level: should
- item: An assessment of commercial noise sources in accordance with BS4142:2014+A1:2019
  level: should
- item: Recommended noise mitigation incorporated into the submitted plans
  level: should
- item: Vibration surveys having regard to BS 6472:2008 and BS 7385-2:1993
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 18-19, 35-36. M2 ''Noise impact assessment/noise
  survey'' (mandatory local requirement) and S3 ''Noise and Vibration Assessment'' (major applications,
  a non-mandatory supporting document). Discretionary: M2''s ''other developments (including day nurseries,
  sports facilities, smoking areas, places of worship)'', decided ''on a site to site basis''.'
review-status: unverified
field-status: {}
