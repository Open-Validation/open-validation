reference: biodiversity-survey-report
local-authority: SAW
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected or important species are present, have been recorded or can reasonably be
        expected on the site, or may be adversely affected.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - change-of-use
        - lbc
        - demolition-con-area
        - advertising
    - site:
        in:
        - local-wildlife-site
        - local-nature-reserve
        - national-nature-reserve
        - special-area-of-conservation
        - site-of-special-scientific-interest
        description: Within or adjacent to a designated wildlife site (SINC, SLINC, LNR, NNR, SAC or SSSI).
  - discretionary
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Black Country Core Strategy (2011) policy ENV1; NPPF (2021) paragraphs 174-177; Natural Environment
  and Rural Communities Act 2006, section 40
source-text: All planning applications with the potential to affect sites where protected or important
  species are present, or may be adversely affected, should be supported by survey work and an impact
  assessment to a nationally recognised standard. All planning applications on sites where protected or
  important species have been recorded, reported or can reasonably be expected to be present should be
  supported by survey work to properly demonstrate presence or absence. … All applications within or adjacent
  to a designated wildlife site (SINC (Site of Importance for Nature Conservation), SLINC (Site of Local
  Importance for Nature Conservation), LNR (Local Nature Reserve), NNR (National Nature Reserve), SAC
  (Special Area of Conservation) or SSSI (Site of Special Scientific Interest), or likely to give rise
  to damaging impacts to any of these sites (householder applications adjacent to a designated site would
  not normally need to meet these requirements).
must-include:
- item: Habitat surveys carried out by suitably qualified ecologists at the appropriate time of year
  level: must
  required-if:
    site:
      in:
      - local-wildlife-site
      - local-nature-reserve
      - national-nature-reserve
      - special-area-of-conservation
      - site-of-special-scientific-interest
      description: Within or adjacent to a designated wildlife site.
- item: Based on comprehensive, relevant and up-to-date survey data, with accurate assessments of impacts
    and practical measures to avoid adverse impacts
  level: should
- item: Reference to the national, regional or local contexts
  level: must
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 22-23. M8 ''Ecological survey and impact
  assessment for protected and important species'' and the ''Habitat Survey'' row (also numbered M7).
  Where an ecological assessment isn''t needed, the list asks for a statement or a note in the covering
  letter explaining why. Discretionary: sites ''likely to give rise to damaging impacts'' to a designated
  site.'
review-status: unverified
field-status: {}
