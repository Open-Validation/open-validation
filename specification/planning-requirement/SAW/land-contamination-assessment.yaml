reference: land-contamination-assessment
local-authority: SAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves excavation, ground works or other ground disturbance (or a change
        of use providing garden areas).
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
source-text: Householder applications, and / or Changes of use or adaptation of existing buildings that
  do not involve any excavation, ground works or other operations which involve ground disturbance (except
  where gardens areas are provided).
must-include:
- item: The presence of land contamination, its nature and potential risk to the proposed development,
    and what further measures are required to ensure the site is suitable for use
  level: must
confidence: low
notes: The source text is M9's exemption wording, which the workbook had put in the affordable housing
  row (audit, wrong_app_type). M9's own positive trigger was not captured.
review-status: unverified
field-status: {}
