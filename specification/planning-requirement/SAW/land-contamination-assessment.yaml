reference: land-contamination-assessment
local-authority: SAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
      - lbc
      - demolition-con-area
      - advertising
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves excavation, ground works or other ground disturbance.
    - condition:
        field: new-build
        value: true
        description: New development, not only a change of use or adaptation of existing buildings.
    - condition:
        field: external-space
        value: true
        description: Garden areas are provided.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Site Allocations and Delivery Development Plan Document (2012) policy DC6; NPPF (2021) paragraphs
  183-185
source-text: 'All new development applications, except for: a) Householder applications, and / or b) Changes
  of use or adaptation of existing buildings that do not involve any excavation, ground works or other
  operations which involve ground disturbance (except where gardens areas are provided).'
must-include:
- item: The likelihood of land contamination, its nature and potential risk to the development, and the
    further measures needed to make the site suitable for use
  level: should
- item: As a minimum, a report of a desk top study and site walk-over
  level: must
- item: Preliminary risk assessment in accordance with Land Contamination Risk Management (LCRM) guidance
  level: should
confidence: medium
notes: From the council's list (adopted September 2023), page 25. M9 'Contaminated Land Site Investigation
  / Statement'.
review-status: unverified
field-status: {}
