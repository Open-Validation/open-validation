reference: recreation-facilities-assessment
local-authority: SAW
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of existing open space, sports and recreational buildings or land, including playing
        fields.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings.
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Black Country Core Strategy (2011) policy ENV6; NPPF (2021) paragraph 99
source-text: Applications that propose loss of existing open space, sports and recreational buildings
  and land including playing fields and all applications for more than 10 dwellings.
must-include:
- item: 'Loss of open space: whether an assessment shows the open space, buildings or land to be surplus
    (with a copy), or that the loss will be replaced by equivalent or better provision, or that the alternative
    sports and recreational provision clearly outweighs the loss'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
- item: 'Open space provided on site or in kind: what it is and how it meets policy ENV6'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 32-33. S1 ''Urban Open Space Statement''.
  Listed under 4.3 ''Supporting documents (non-mandatory)'': the list says this information ''would not
  result in an application being made invalid''.'
review-status: unverified
field-status: {}
