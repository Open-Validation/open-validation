reference: design-and-access-statement
local-authority: SAW
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Development in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  Planning Practice Guidance paragraph 031
source-text: 'A DAS must be submitted for: Applications for major development, as defined in article 9
  of the Town and Country Planning (Development Management Procedure (England) Order 2015 (As amended);
  Applications for development in a designated area, where the proposed development consists of: • • •
  one or more dwellings; or a building or buildings with a floor space of 100 square metres or more. Applications
  for listed building consent.'
confidence: medium
notes: From the council's list (adopted September 2023), page 14. N8. The list adds that applicants may
  submit a DAS even where it isn't required.
review-status: unverified
field-status: {}
