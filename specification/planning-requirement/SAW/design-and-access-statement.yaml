reference: design-and-access-statement
local-authority: SAW
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates a building of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
source-text: major development, dwellings or buildings of 100 sqm+ in designated areas, and listed building
  consent
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s excerpt was minerals (Policy MIN1) text. N8 is a national-list
  item.'
review-status: unverified
field-status: {}
