reference: site-plan
local-authority: SAW
required-if:
  always: true
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: 'Existing and proposed layout of the site at a scale of 1:500 or 1:200 (householder: existing
    and proposed site/block plan at 1:500), including the positions of any buildings'
  level: must
- item: Details clearly and logically labelled, for example road and building names
  level: must
- item: The site boundaries
  level: must
- item: The type and height of any boundary treatment (e.g. walls, fences)
  level: must
- item: The position and height of any building or structure outside the site but within 10 metres of
    the boundary
  level: must
- item: The proposals in context with adjacent buildings, including property numbers where applicable
  level: must
- item: The direction of North
  level: must
- item: Parking and access arrangements, and the position and details of any trees which may be affected
  level: should
confidence: medium
notes: From the council's list (adopted September 2023), page 7-8, 13-14. N7, the plan standards in 2.3
  and H5.
review-status: unverified
field-status: {}
