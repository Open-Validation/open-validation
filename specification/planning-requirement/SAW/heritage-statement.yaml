reference: heritage-statement
local-authority: SAW
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: Development affecting a designated or non-designated heritage asset or its setting
        (listed or locally listed buildings, conservation areas, scheduled monuments, registered parks
        or gardens).
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: NPPF (2021) paragraphs 189-208
source-text: 'Heritage Statement: Will be required on any application (including those for Listed Building
  Consent) for development affecting a “Heritage Asset” … This will be required for applications which
  effect Designated Heritage Assets'
must-include:
- item: Prepared by an appropriate expert, proportionate to the significance of the asset
  level: should
- item: Reference to the Historic Environment Record (HER), as a minimum
  level: should
- item: The significance of the heritage assets affected, including any contribution made by their setting,
    and the impact of the proposal on that significance
  level: should
- item: Reference to NPPF section 16 'Conserving and enhancing the historic environment' (paragraphs 189-208)
  level: should
- item: 'Demolition or significant structural alteration of a listed building, or major alterations causing
    substantial harm or total loss: further justifying evidence, such as a marketing report and/or a structural
    survey'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 8, 28-29. M16 ''Heritage Statement and
  Archaeological Assessments'' and H12. Discretionary: the council''s local designations (Areas of High
  Historic Townscape, Landscape or Designed Landscape Value), which have no matching field.'
review-status: unverified
field-status: {}
