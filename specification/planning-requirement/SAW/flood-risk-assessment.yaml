reference: flood-risk-assessment
local-authority: SAW
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more in Flood Zone 1.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
    - condition:
        field: new-build
        value: true
        description: New development (excluding extensions at first floor or above).
  - discretionary
source-url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
policy: Black Country Core Strategy (2011) policy ENV5; NPPF (2021) paragraph 167
source-text: Flood Risk Assessment – required for planning applications where the site is 1 hectare or
  more in Flood zone 1 and required for all planning applications for new developments (excluding extensions
  at first floor or above) located in Flood Zones 2 and 3. All applications for development in the particular
  areas identified in the adjacent guidance column
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
confidence: medium
notes: 'From the council''s list (adopted September 2023), page 21-22. M6. Discretionary: ''the particular
  areas identified in the adjacent guidance column'', which the guidance column doesn''t actually list
  (its text is cut short in the PDF).'
review-status: unverified
field-status: {}
