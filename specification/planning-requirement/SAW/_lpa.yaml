validation-list:
  url: https://www.sandwell.gov.uk/downloads/file/1297/sandwell-validation-checklist
  date: 2023-09
  date-basis: 'cover: ''September 2023'' (PDF created 26 September 2023); the council''s ''Planning Applications
    Process'' page, step 3 (https://www.sandwell.gov.uk/planning/planning-applications-process-1/4), checked
    2026-11-06, says ''Sandwell Council adopted a revised validation list in September 2023'' and links
    it via the ''Validation Checklist'' download page (https://www.sandwell.gov.uk/downloads/download/427/validation-checklist),
    whose only file is this one. No newer list or consultation is published; the page adds that all applications
    must now include BNG.'
  status: outdated
submission-standards:
- item: Plans drawn to an appropriate metric scale (1:50, 1:100, 1:200 or 1:500)
  level: must
- item: Plans show the direction of North
  level: must
- item: Scale bars on all plans, or at least two dimensions on each plan
  level: must
- item: No 'Do Not Scale' disclaimer or similar on plans
  level: must
- item: All plans clearly labelled with a reference number, including amendments with updated revision
    numbers
  level: must
- item: All elevations and plans clearly and logically labelled (e.g. front or rear elevation), with titles
    that refer to their content and a plan number reference
  level: must
- item: Plans A4 or A3 size wherever possible
  level: should
- item: Information clear enough not to lose detail when scanned and viewed electronically (no faint lines)
  level: must
- item: 'Retrospective applications: detailed drawings clearly showing the work retrospective consent
    is sought for'
  level: must
- item: 'Major applications: coloured three-dimensional imagery of at least the main street elevation'
  level: should
- item: Photographs of the existing site
  level: should
- item: No personal details (names, personal emails, addresses) on submitted drawings; they will not be
    redacted
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot links to Sandwell''s current (and only) validation checklist, dated September 2023 on
    its cover. The extraction has many problems: the Householder H1-H13 checklist was missed, items were
    misplaced under Householder/Adverts (affordable housing, coal mining, landscaping), and CIL, air quality,
    flood risk and education/health statements are missing. Outline, reserved matters and LBC are wrongly
    recorded as having no local requirements, and many trigger excerpts are garbled fragments. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
