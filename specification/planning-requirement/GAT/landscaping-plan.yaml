reference: landscaping-plan
local-authority: GAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: building-works
          value: true
          description: Not wholly change of use/conversion.
    - all:
      - condition:
          field: building-works
          value: true
          description: Not a change of use or alteration to an existing building.
      - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policies CS15, CS18, CS20; Gateshead
  Making Spaces for Growing Places MSGP17, MSGP24, MSGP32, MSGP33, MSGP36
source-text: All major planning applications (as defined by the Town and Country Planning (Development
  Management Procedure) (England) Order 2015 (as amended) should include a landscape strategy and site
  wide landscape masterplan other than wholly change of use/conversion applications. … Planning applications
  (except those for the change of use or alteration to an existing building), where landscaping would
  be a consideration in the assessment of the application.
must-include:
- item: 'Major applications: title states the document is/includes a landscape strategy and masterplan
    (it could be part of the Design and Access Statement)'
  level: must
  required-if:
    ref: major-development
- item: 'Landscaping details: title states whether the documents is/includes landscape details, with a
    list of accompanying plans'
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), page 55, 58. Notes 22 (Landscape Strategy and
  Masterplan, major applications) and 23 (Landscaping Details) of the list, both filed here. Discretionary:
  landscaping details are needed only ''where landscaping would be a consideration in the assessment of
  the application''. The full checklist marks both ''No'' for change of use without building works.'
review-status: unverified
field-status: {}
