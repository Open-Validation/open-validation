reference: bng-metric
local-authority: GAT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Not exempt from the biodiversity gain condition (Schedule 7A, Town and Country Planning
      Act 1990).
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Town and Country Planning Act 1990, Schedule 7A; Core Strategy and Urban Core Plan for Gateshead
  and Newcastle policy CS18; Gateshead Making Spaces for Growing Places MSGP32, MSGP36, MSGP37
source-text: All applications will be required to meet requirements for measurable biodiversity net gain
  as set out in Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment Act
  2021).
must-include:
- item: Title includes that the document is/includes a Biodiversity Net Gain Assessment and Report
  level: must
- item: A fully completed statutory DEFRA Biodiversity Metric Calculation Tool, in Excel format
  level: must
- item: Completed statutory metric condition assessments for baseline habitats, with supporting information
    (species lists and quadrat locations)
  level: must
- item: Predicted condition assessments of created/enhanced habitats, with the interventions and management
    to achieve them for a minimum of 30 years
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 31-33. Note 16C of the list. The list says
  'All applications', but householder and other exempt development is exempt by law (the list names the
  exemptions), so the rule follows the biodiversity gain condition. Exempt applications (other than householder
  or change of use with no groundworks) need a statement setting out why the development is exempt.
review-status: unverified
field-status: {}
