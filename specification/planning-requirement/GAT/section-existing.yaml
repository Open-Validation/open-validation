reference: section-existing
local-authority: GAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - demolition-con-area
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: Site sections and site levels are materially affected by the proposal.
    - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: Floor plans, Site Sections and Site Levels are required for applications where this would
  be expected to add to the understanding of the proposal and/or where floor plans, site sections and
  site levels respectively are materially affected by the proposal;
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is requested and agreed)
  level: must
- item: How the proposal relates to existing site levels and adjacent land, with levels related to a fixed
    datum point off site
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 16. Note 10(c) of the list (site sections
  and site levels). Shown as discretionary as well, because they are also needed where they 'would be
  expected to add to the understanding of the proposal'.
review-status: unverified
field-status: {}
