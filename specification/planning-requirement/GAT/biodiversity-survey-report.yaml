reference: biodiversity-survey-report
local-authority: GAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - any:
    - all:
      - any:
        - condition:
            field: demolition
            value: true
            description: Demolition of existing buildings.
        - condition:
            field: involves-change-of-use
            value: true
            description: Conversion of existing buildings.
        - condition:
            field: structural-alteration
            value: true
            description: Removal or modification of existing buildings.
        - condition:
            field: tree-removal
            value: true
            description: Removal or pruning of trees.
      - any:
        - condition:
            field: protected-species
            value: true
            description: Protected species are known or considered likely to be present (data search or
              local knowledge).
        - condition:
            field: potential-roost-features
            value: true
            description: 'Bat survey criteria: agricultural buildings; weather boarding, wooden cladding
              or hanging tiles within 200 m of woodland or water; buildings within 200 m (pre-1919 within
              400 m) of woodland or water; tunnels, mines, cellars and similar; bridges and viaducts.'
        - condition:
            field: agricultural-building-reuse
            value: true
            description: Agricultural buildings including barns and outbuildings (barn owl survey).
        - condition:
            field: veteran-trees
            value: true
            description: Felling or lopping veteran trees or trees with potential to support bats or barn
              owls.
    - all:
      - condition:
          field: floodlighting
          value: true
          description: Significant new lighting or floodlighting.
      - condition:
          field: near-woodland
          value: true
          description: Within 50 m of woodland, water, hedgerows or lines of trees, or a known roost.
    - condition:
        field: wind-turbine
        value: true
        description: Proposals for wind turbines.
    - all:
      - any:
        - ref: major-development
        - condition:
            field: minor-development
            value: true
            description: Minor development.
      - any:
        - condition:
            field: pond-on-or-near-site
            value: true
            description: Within 500 m of a pond (major) or 100 m of a pond (minor).
        - condition:
            field: near-watercourse
            value: true
            description: Within 200 m of (major) or adjacent to (minor) rivers, streams, canals, lakes
              or wetlands.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy CS18; Gateshead Making Spaces
  for Growing Places MSGP32, MSGP36, MSGP37
source-text: 'All applications (including householders) which include conversion, demolition, removal,
  or modification of existing buildings or removal or pruning of trees as follows: • Where protected species
  are known or considered likely to be present (confirmed by a data search or local knowledge).'
must-include:
- item: Title confirming the document is/includes a protected species survey and report
  level: must
- item: List of surveys carried out and confirmation that they were carried out within the last 12 months
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 29-30. Note 16A of the list (Protected Species
  Survey and Report), with separate criteria for bat, barn owl, tree and great crested newt surveys. A
  householder bat survey is not needed for ground floor works to a building of two or more storeys with
  no disturbance to the roof structure or eaves.
review-status: unverified
field-status: {}
