reference: heritage-statement
local-authority: GAT
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      description: The proposal is in or affects a conservation area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The proposal affects a designated or non-designated heritage asset.
source-url: https://www.gateshead.gov.uk/media/42844/Tyneside-Validation-Checklist-2024/pdf/Tyneside_Validation_Checklist_-Final_1.pdf?m=1725460437977
source-text: 'Heritage Statement When is this required? A Heritage Statement is required for: Listed Building
  Consent applications; … Other applications in conservation areas, including demolition'
must-include:
- item: For heritage assets on the Heritage at Risk Register, how the asset will be brought into repair
    and, where possible, reuse
  level: must
  source-text: Applications which affect heritage assets included on the Heritage at Risk Register will
    be required to demonstrate how they will bring that heritage asset into repair, and where possible,
    reuse.
confidence: medium
notes: 'From the audit (wrong_app_type, missing_requirement): Note 19 also covers major applications in
  or affecting conservation areas, other applications in conservation areas including demolition, and
  non-designated heritage assets. The Full planning row came from the 2019 list. The Heritage at Risk
  sentence was in the workbook''s photographs row.'
