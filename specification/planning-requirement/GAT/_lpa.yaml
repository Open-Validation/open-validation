  status: current
submission-standards:
- item: All plans and drawings numbered or labelled; amended plans carry a revision number and date
  level: must
- item: Applications submitted online through the Planning Portal; post/email only if that is not feasible
    and agreed; paper copies not recommended
  level: should
- item: All relevant questions on the application form completed, or 'Not Applicable'/N/A inserted; the
    description of development accurately describes the proposal and matches the plans
  level: must
- item: Signatures and personal information redacted in supporting documents, or sensitive information
    put in a separate document marked 'Confidential - Not for Public Use'
  level: should
- item: 'Outline applications: indicative information not for determination clearly marked ''Indicative/For
    information only'''
  level: must
joint-list:
  partners:
  - NET
  - NTY
  - STY
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is still the current Gateshead/Tyneside 2024 checklist, although the PDF refused
    automated fetching; contents were checked against the identical copy on Newcastle''s site. The extraction
    blends in the superseded 2019 list, mislabels or swaps many triggers, misses the overheating assessment
    and the householder FRA rule, and places coal mining under Householder and landscaping under change
    of use, although the source excludes both. Fixed 2026-11-05: every file was rewritten from the council''s
    latest list.'
