reference: roof-plan-proposed
local-authority: GAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - demolition-con-area
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: The proposal alters an existing roof.
    - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: Roof Plans should be submitted where there is an alteration to an existing roof or otherwise
  where this is expected to add to the understanding of the proposal.
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is requested and agreed)
  level: must
- item: Shape of the roof, its location and the proposed facing materials
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 16. Note 10(d) of the list. The list asks
  for both existing and proposed roof plans. Shown as discretionary as well, because they are also needed
  'where this is expected to add to the understanding of the proposal'.
review-status: unverified
field-status: {}
