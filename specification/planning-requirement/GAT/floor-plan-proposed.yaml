reference: floor-plan-proposed
local-authority: GAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
      - lbc
      - demolition-con-area
  - any:
    - condition:
        field: floor-layout-change
        value: true
        description: The floor plans are materially affected by the proposal.
    - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: Floor plans, Site Sections and Site Levels are required for applications where this would
  be expected to add to the understanding of the proposal and/or where floor plans, site sections and
  site levels respectively are materially affected by the proposal;
must-include:
- item: Scale 1:50 or 1:100 (unless an alternative scale is required and agreed)
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: Proposal shown in context with the site boundary and existing adjacent buildings, including property
    numbers/names where appropriate
  level: should
- item: Number of bedrooms and bed spaces the property will provide, stated as how it will be marketed
    (e.g. a 3b/5p property)
  level: must
- item: 'Householder applications: the uses of any proposed new rooms'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published January 2025), page 16, 106. Note 10(b) of the list and the
  householder checklist. Shown as discretionary as well, because plans are also needed where they 'would
  be expected to add to the understanding of the proposal'.
review-status: unverified
field-status: {}
