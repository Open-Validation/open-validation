source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policies CS14, CS15; Gateshead Making
  Spaces for Growing Places MSGP17, MSGP24
source-text: When a proposed development is in close proximity to the windows of habitable rooms of an
  existing residential development and is likely to significantly affect the sunlight and/or daylight
  levels to those windows; … When a proposed residential development, because of its proximity to either
  existing buildings or other proposed buildings within the development, is likely to receive low levels
  of sunlight and/or daylight to habitable rooms; … When the scale and form of a development is likely
  to result in significant shadowing impacts upon neighbouring properties or land;
must-include:
- item: Title states whether the documents is/includes a sunlight/daylight/wind study/microclimate assessment
  level: must
