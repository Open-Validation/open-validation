reference: fire-statement
local-authority: GAT
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The building is 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The building has 7 or more storeys.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended),
  article 9A
source-text: 'An application for planning permission for development of/on buildings which contains two
  or more dwellings or educational accommodation and are 18 metres or more in height or of 7 or more storeys
  and which involves: • the erection of one or more relevant buildings, or • development of an existing
  relevant building, or • development within the curtilage of a relevant building; must be accompanied
  by a fire statement unless an exemption applies.'
must-include:
- item: On the prescribed form published by the Secretary of State (or a form to similar effect), with
    the particulars it specifies
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 13-14. Note 8 of the list. Outline applications
  and section 73 applications are exempt; the outline/reserved matters checklist (page 99) marks it 'No'
  for outline.
review-status: unverified
field-status: {}
