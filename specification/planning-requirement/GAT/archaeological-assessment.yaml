reference: archaeological-assessment
local-authority: GAT
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: The proposal is on or near a Scheduled Monument.
  - site:
      in:
      - archaeological-priority-area
      description: The site is in the Hadrian's Wall corridor or a Roman fort vicus area.
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: The site is greenfield.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
  - discretionary
source-url: https://www.gateshead.gov.uk/media/42844/Tyneside-Validation-Checklist-2024/pdf/Tyneside_Validation_Checklist_-Final_1.pdf?m=1725460437977
