reference: affordable-housing-statement
local-authority: GAT
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: The proposal creates 10 or more dwellings.
source-url: https://www.gateshead.gov.uk/media/42844/Tyneside-Validation-Checklist-2024/pdf/Tyneside_Validation_Checklist_-Final_1.pdf?m=1725460437977
source-text: 'The title must state the document is/includes an affordable housing statement The document
  can be included within the Design and Access or Planning Statement Guidance This statement should clearly
  identify the following points: Is affordable housing to be provided? If not, then what is the justification?
  (i.e. financial viability)'
must-include:
- item: The title states that the document is or includes an affordable housing statement
  level: must
- item: Whether affordable housing is to be provided and, if not, the justification (e.g. financial viability)
  level: should
- item: Whether it will be provided on site, off site or by a financial contribution
  level: should
confidence: medium
notes: 'From the audit (wrong_trigger): Gateshead''s threshold is 10+ units (Note 12). The third must-include
