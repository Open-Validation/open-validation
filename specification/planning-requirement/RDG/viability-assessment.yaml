reference: viability-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The applicant cannot meet the affordable housing provision set out in the policies
          or SPDs.
    - discretionary
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: NPPF and NPPG; Reading Borough Local Plan 2019 policies CC9 and H3; Affordable Housing SPD (2021)
source-text: For all minor, other or major applications where on site works or affordable housing is required
  or where a financial contribution towards off-site works or affordable housing provision is required
  in accordance with adopted policy, but the applicant cannot meet the level of provision set out in the
  policies or SPDs.
must-include:
- item: A residual valuation
  level: must
- item: Existing Use Value supported by an independent valuation
  level: must
- item: Land acquisition price and the basis of its purchase; salient terms; purchase process; purchase
    costs including legal and agency fees
  level: must
- item: Estimated sales values with independent supporting evidence, including a schedule of unit sizes
  level: must
- item: Marketing/disposal costs and fees
  level: must
- item: Estimated construction costs supported by tender costs or a QS schedule, with a specified contingency,
    contract related fees and itemised 'abnormals'
  level: must
- item: Itemised preliminary costs and professional fees under each heading
  level: must
- item: S106/CIL costs as advised by the LPA
  level: must
- item: Financing rate with evidence of financing terms
  level: must
- item: Estimated profit with context on the developer's target returns
  level: must
- item: Value/cost of the affordable housing provision, with tenure assumptions and any commuted sum calculation
  level: must
- item: Agreement to pay the fee for independent review of the appraisal
  level: must
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables ('All applications where seeking
  to vary policy requirements for affordable housing') and Part 3 item 27, page 9, 12, 40-41. Shortfalls
  in other on-site works or contributions have no field, so they are shown as discretionary.
review-status: unverified
field-status: {}
