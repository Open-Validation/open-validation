reference: recreation-facilities-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - open-space
        description: Within or adjacent to an area of open space.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: New residential development of 10 dwellings or more.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: NPPF paragraphs 92, 96, 97; Reading Borough Local Plan 2019 policies EN7, EN8, EN9 and EN10
source-text: • Any application within or adjacent to an area of open space; and/or, • Applications for
  new residential development of 10 dwellings or more.
must-include:
- item: 'Where open space would be lost: replacement open space of a similar standard close by, or improvements
    to the remaining open space outweighing the loss'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The development would result in the loss of open space.
- item: 'Where close to open space: how its character and public enjoyment will not be harmed'
  level: must
  required-if:
    site:
      in:
      - open-space
      description: Close to an area of open space.
- item: An independent assessment of the open space and, if necessary, an evaluation of whether it is
    surplus, with plans of existing and proposed open space
  level: must
  required-if:
    all:
    - ref: major-development
    - site:
        in:
        - open-space
        description: In or adjacent to an area of open space.
- item: 'Where open space or facilities are to be provided: their definition and a maintenance specification
    for at least 10 years'
  level: must
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 17 (Open Space
  Statement), page 8, 11, 31.
review-status: unverified
field-status: {}
