reference: roof-plan-existing
local-authority: RDG
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The variation changes the approved plans.
  - application-type:
      in:
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications. To be drawn to scale ... All applications where changes to plans are proposed
must-include:
- item: May need to be at 1:50 scale or even greater detail
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables, page 6-16. Part 2 lists existing
  and proposed plans for householder, full (minor and major), outline ('as per above full planning'),
  listed building consent, proposed-use lawful development certificates and variation of condition where
  the approved plans change. For reserved matters the list asks for 'the requirements of a full application
  for matters which were previously reserved', so it is shown as the council's discretion. For prior approvals
  the list says plans should be submitted 'to avoid delays' but are not a validation requirement.
review-status: unverified
field-status: {}
