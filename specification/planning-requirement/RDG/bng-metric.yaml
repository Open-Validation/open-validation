reference: bng-metric
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The permission would be subject to the biodiversity gain condition.
source-url: https://images.reading.gov.uk/2024/02/Validation-Checklist-Addendum-BNG-February-2024.pdf
policy: Schedule 7A, Town and Country Planning Act 1990 (Environment Act 2021)
source-text: the pre-development biodiversity value of the onsite habitat on the date of application (or
  an earlier date) including the completed metric calculation tool used showing the calculations, the
  publication date and version of the biodiversity metric used to calculate that value;
must-include:
- item: The publication date and version of the biodiversity metric used
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
- item: A statement confirming whether the onsite habitat value is lower because of degradation, with
    supporting evidence if so
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (published November 2021; Biodiversity Net Gain Addendum published February
  2024), addendum paragraphs 1.2 and 3.1, page 3. The addendum says that until the full review of the
  list only these national minimum requirements apply, so the 2021 list's local demands (metric in Excel
  with habitat maps and an ecologist's statement for all non-householder applications) are not shown.
  Section 73, reserved matters and other application types are excluded (paragraphs 3.2-3.3). Shown with
  the biodiversity gain condition because householder and other exempt development are exempt by law.
review-status: unverified
field-status: {}
