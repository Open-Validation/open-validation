reference: site-plan
local-authority: RDG
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - ldc
    - s73
    - lbc
    - advertising
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: ALL APPLICATIONS
must-include:
- item: Based on an up to date survey
  level: should
- item: The proposal in relation to site boundaries, other buildings and trees on or adjacent to the site
  level: should
- item: Drawn to a metric scale of 1:200 or 1:500 with a north point shown
  level: should
- item: Clearly identifies the subject site
  level: must
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (published November 2021), Part 1 (site block plan) and the Part 2 tables,
  page 4, 6-16. Listed in the Part 2 tables for householder, full, outline, reserved matters, lawful development
  certificates, variation of condition, listed building consent and advertisement consent. The BNG addendum
  (paragraph 5.6) asks for on-site biodiversity enhancements and a post-development habitat map on proposed
  site plans, but says it adds no new validation requirement, so that is not shown as a requirement.
