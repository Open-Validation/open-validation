reference: biodiversity-survey-report
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - ref: major-development
    - condition:
        field: protected-species
        value: true
        description: Could directly or indirectly impact rare, protected, invasive or notable species.
    - site:
        in:
        - priority-habitat
        - local-wildlife-site
        description: Near an area of high ecological value on the Proposals Map (priority habitats, Local
          Wildlife Sites, Green Links).
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to roofs or lofts, including residential extensions.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies EN11 and EN12; Wildlife and Countryside Act 1981; Conservation
  of Habitats and Species Regulations 2017
source-text: An ecological assessment will need to be submitted with all major applications, and with
  any other applications that could directly or indirectly potentially impact on rare, protected, invasive
  or notable species, priority habitats, Local Wildlife Sites or Green Links. Proposals, including residential
  extensions, that involve the demolition of buildings or alterations to roofs or lofts will generally
  need to be accompanied by a bat survey.
must-include:
- item: Surveys undertaken and reports produced by suitably qualified ecologists (CIEEM members or equivalent)
  level: must
- item: Surveys and reports in accordance with nationally recognised guidance (CIEEM Preliminary Ecological
    Appraisal and Ecological Impact Assessment guidelines; Bat Conservation Trust Bat Survey Guidelines)
  level: must
- item: Shows how the scheme design has followed the mitigation hierarchy
  level: must
- item: A bat survey report, or a statement with photos setting out why one is not needed
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to roofs or loft spaces.
confidence: medium
notes: 'From the council''s list (published November 2021), Part 2 tables (Biodiversity survey & ecological
  reports) and Part 3 item 6, page 6-7, 10, 22-24. The Part 2 tables say ''If the site lies near to an
  area of high ecological value (as shown on the Proposals map) or if the proposal includes works to the
  roof''. The 2021 list''s own net gain metric demand is replaced by the BNG addendum: see bng-metric.'
review-status: unverified
field-status: {}
