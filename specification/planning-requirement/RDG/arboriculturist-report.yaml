reference: arboriculturist-report
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Any part of the proposal is within 15 metres of the trunk of any tree on or off site,
        including street trees (not change of use only).
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies EN14; Reading Tree Strategy 2021
source-text: Tree survey information will be required on all development sites, apart from change of use,
  where there are trees within the site or adjacent to it, including street trees.
must-include:
- item: Tree survey and arboricultural impact assessment carried out to BS5837:2012 by a suitably qualified
    and experienced arboriculturist
  level: should
- item: Tree retention/removal plan
  level: should
- item: Retained trees and Root Protection Areas shown on the proposed layout
  level: should
- item: Location of new tree planting
  level: should
- item: Existing and proposed finished levels
  level: should
- item: Preliminary tree protection plan
  level: should
- item: Schedule of tree works
  level: should
- item: Position of existing and proposed services
  level: should
- item: 'For householder applications: trunk position, canopy spread and Root Protection Areas of trees
    within 15 m shown on the application plans'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables ('If any part of the proposal
  is within 15 metres of the trunk of any tree(s) on or off-site'), Part 3 item 23 and Appendix 1, page
  6, 9, 12, 37, 43. An arboricultural method statement is described as helpful, not required.
review-status: unverified
field-status: {}
