reference: location-plan
local-authority: RDG
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - ldc
    - s73
    - lbc
    - advertising
    - pip
    - prior-approval
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: ALL APPLICATIONS
must-include:
- item: Current site outlined in red
  level: must
- item: Metric scale of 1:1250 or 1:2500
  level: must
- item: North point shown
  level: must
- item: Any other adjacent land owned by the applicant outlined in blue
  level: must
- item: Nearby properties and their postal numbers, and at least two named roads
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 1 and the Part 2 tables, page 4, 6-16.
  Part 1 says all applications; the Part 2 tables list it for every type except discharge of conditions
  and non-material amendments (for prior determination of demolition it is listed as a local requirement).
review-status: unverified
field-status: {}
