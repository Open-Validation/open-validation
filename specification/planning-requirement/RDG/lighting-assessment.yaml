reference: lighting-assessment
local-authority: RDG
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - local-wildlife-site
          description: In the vicinity of a listed building, a conservation area or a local wildlife site.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
source-text: External Lighting Details When Required All proposals involving the provision of publicly
  accessible developments, in the vicinity of residential property, a Listed Building or a Conservation
  Area, Local Wildlife Site, green link or watercourse where external lighting would be provided or made
  necessary by the development
must-include:
- item: Hours of operation
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): item 9 applies to any application type, not only listed building consent;
  illuminated adverts need lighting details too. Publicly accessible developments and sites near homes,
  green links or watercourses are shown as officer discretion.'
review-status: unverified
field-status: {}
