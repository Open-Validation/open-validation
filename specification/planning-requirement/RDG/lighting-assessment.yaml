reference: lighting-assessment
local-authority: RDG
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed, or is likely because of the type of development (publicly
          accessible developments).
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated signage.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies CC7, CC8 and EN12
source-text: Where external lighting is proposed or is likely due to the type of development (i.e. publicly
  accessible developments) ... All illuminated signage
must-include:
- item: Hours of operation
  level: should
- item: An isolux contour map showing light spillage to 1 lux
  level: should
- item: Light levels
  level: should
- item: Column heights and layout plan with beam orientation
  level: should
- item: A schedule of equipment
  level: should
- item: Measures such as hoods and cowls to avoid glare and light spill
  level: should
- item: Impact on nearby dwellings or roads, and use of planting to mitigate effects
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables (External lighting details; advertisement
  Lighting Details) and Part 3 item 9, page 7, 10, 15, 25-26. Part 3 words it as publicly accessible developments
  near homes, a listed building, conservation area, Local Wildlife Site, green link or watercourse. The
  contents are listed 'as relevant', so they are shown as 'should'.
review-status: unverified
field-status: {}
