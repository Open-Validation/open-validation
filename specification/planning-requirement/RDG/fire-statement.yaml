reference: fire-statement
local-authority: RDG
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (inserted by the Development Management Procedure and Section 62A Applications) (England) (Amendment)
  Order 2021)
source-text: contain two or more dwellings or educational accommodation and • meet the height condition
  of 18m or more in height, or 7 or more storeys
confidence: medium
notes: From the council's list (published November 2021), Part 1, page 5.
review-status: unverified
field-status: {}
