submission-standards:
- item: Application material unlocked for editing
  level: must
- item: No disclaimer such as 'these plans should not be scaled'; plans marked 'do not scale' are not
    accepted
  level: must
- item: Plans drawn to a recognised metric scale (e.g. 1:50, 1:100) with an accurate scale bar to allow
    digital scaling
  level: must
- item: Each document a single layered PDF with the correct orientation
  level: must
- item: Plans labelled with a title, drawing number, revision number and date
  level: must
- item: Plans and elevations consistent with each other; significant discrepancies make the application
    invalid
  level: must
- item: Of sufficient quality for easy viewing on the council's website
  level: must
