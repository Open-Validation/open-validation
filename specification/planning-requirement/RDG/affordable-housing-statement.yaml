reference: affordable-housing-statement
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A net increase in dwellings.
  - condition:
      field: new-build
      value: true
      description: New dwellings or additional floorspace to increase residential units (not HMOs or conversions
        of existing floor area).
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies H3 and H4; Affordable Housing SPD (2021); Planning Obligations
  under S106 SPD
source-text: All developments proposing new dwellings or additional floorspace required to increase residential
  units (not HMOs or conversions of existing floor area) must include an affordable housing statement.
must-include:
- item: Explains how the proposal meets policy H3 and/or H4
  level: should
- item: Draft heads of terms for the affordable housing to be secured by a S106 agreement
  level: should
- item: The total number of all residential units
  level: should
- item: The number of affordable units, numbers of bedrooms and property types
  level: should
- item: Plans showing the location of the affordable units
  level: should
- item: The levels or types of affordability or tenure proposed for different units, including rent levels
    where appropriate
  level: should
- item: Design quality standards (Homes and Communities Agency compliant)
  level: should
- item: Access arrangements for the affordable units
  level: should
- item: The affordable units have proportionate car parking spaces in line with policy
  level: should
- item: 'If the policy is met fully or partly through a financial contribution: how the contribution was
    calculated, with the total number of units, the Gross Development Value of the whole development (based
    on two separate valuations by suitably qualified estate agents) and the proposed contribution'
  level: must
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 1, page 7, 10,
  19. Shown for full and outline applications, where the Part 2 tables list it. Provision below policy
  normally needs a viability appraisal (item 27).
review-status: unverified
field-status: {}
