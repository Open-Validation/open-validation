reference: noise-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Potentially noise generating development (pubs, clubs, takeaways, nurseries, schools,
          industrial or commercial, recreation) near existing noise sensitive development.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive use near existing noise generating uses, classified roads, railways
          or a noisy environment such as the city centre.
    - condition:
        field: plant-equipment
        value: true
        description: Commercial application with extractor or cooling units near noise sensitive uses.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies EN16, EN17 and CC8
source-text: Potentially noise generating developments (e,g. pubs, clubs, takeaways, child care nurseries
  & schools, industrial/commercial uses, recreation) in the vicinity of existing noise sensitive developments
  - residential, schools and hospitals; or . Noise sensitive uses in the vicinity of existing noise generating
  uses, classified roads, railways or in areas with an existing noisy environment such as the city centre;
  or . Mixed use applications comprising both noise generating and noise sensitive uses; or . Commercial
  applications including extractor or cooling units in the vicinity of noise sensitive uses.
must-include:
- item: Prepared by suitably qualified acousticians
  level: should
- item: The existing noise environment, the noise sources from or affecting the development, and mitigation
    measures
  level: should
- item: Sound power level and likely resultant noise level at the site boundary for all noise-producing
    machinery
  level: should
- item: Where noise-generating plant or equipment will be located and installed to reduce impacts on neighbours
  level: should
- item: Delivery times and opening hours for commercial premises in noise sensitive areas
  level: should
- item: Waste collection details where collection could be noisy (e.g. pubs and clubs)
  level: should
- item: 'For development immediately adjoining (including below or above) homes: full details of sound
    insulation, position and design of entrances and exits, and car parking'
  level: should
- item: 'For pubs and clubs: the location provided for smokers'
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 16, page 8, 11,
  16, 30-31. For office prior approvals within 50 m of noisy commercial premises the list asks for an
  acoustic assessment only as further information to avoid delays.
review-status: unverified
field-status: {}
