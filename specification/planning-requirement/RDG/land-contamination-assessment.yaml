reference: land-contamination-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected on or near the site.
      - condition:
          field: ground-disturbance
          value: true
          description: Ground works are proposed.
    - condition:
        field: sensitive-end-use
        value: true
        description: 'A vulnerable or sensitive end user: residential, schools, nurseries, hospitals or
          allotments.'
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies EN16
source-text: Where contamination is known or suspected or the development site is in the vicinity of such
  land, and ground-works are proposed; or, where there is a vulnerable or sensitive end user i.e. Residential,
  Schools, Nurseries, Hospitals or Allotments.
must-include:
- item: A desk study listing current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
- item: A preliminary conceptual site model (all potential pollutant linkages) and a preliminary risk
    assessment of them
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on or near the site.
- item: 'For decommissioning of underground storage tanks: a method statement in line with APEA guidance'
  level: must
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 4, page 7, 10,
  17, 21. For prior approvals it is listed only as further information that should be submitted to avoid
  delays.
review-status: unverified
field-status: {}
