reference: heritage-statement
local-authority: RDG
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - locally-listed-building
          - park-and-garden
          - scheduled-monument
          description: Affects a heritage asset (listed building, conservation area, registered park or
            garden, scheduled monument or locally listed building) or its setting.
      - discretionary
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: NPPF; Reading Borough Local Plan 2019 policies EN1, EN2 and EN4
source-text: Any application which affects a ‘heritage asset’ or its setting or for development proposals
  in conservation areas.
must-include:
- item: The history, character and significance of the building, site or area
  level: must
- item: The extent and nature of the proposed development
  level: must
- item: The impact of the development on the heritage asset
  level: must
- item: The justification for the works and any mitigation proposed
  level: must
- item: Shows that the Historic Environment Record has been consulted
  level: must
- item: 'For householder applications: a schedule of proposed materials'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables, Part 3 item 12 and Appendix 1,
  page 6-7, 11, 14, 27-28, 42-43. Required for all listed building consent applications. The council may
  also ask for one where it identifies a non-designated heritage asset, shown as discretionary.
review-status: unverified
field-status: {}
