reference: heritage-statement
local-authority: RDG
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - conservation-area
      description: The application affects a heritage asset or its setting, or is in a conservation area.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
source-text: Heritage Statements When Required Any application which affects a ‘heritage asset’ or its
  setting or for development proposals in conservation areas.
must-include:
- item: The history, character and significance of the building, site or area concerned (the heritage
    asset)
  level: must
- item: The extent and nature of the proposed development
  level: must
- item: The impact of the development on the heritage asset
  level: must
- item: The justification for the works, and any mitigation proposed
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): listed building consent and householder applications need it too. The
  contents are from the council''s guidance, which the workbook filed as ''Character / Conservation area
  appraisal reference'' (''it is expected that these documents will contain sufficient detail...'').'
review-status: unverified
field-status: {}
