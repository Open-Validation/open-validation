reference: cil-form
local-authority: RDG
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: An increase of 100 sq m or more of floor area.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - pip
  - all:
    - application-type:
        in:
        - ldc
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Additional dwellings are proposed.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Additional floor space of 100 sq m or more.
  - all:
    - application-type:
        in:
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Additional dwellings are proposed.
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: Floor space is to change.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Community Infrastructure Levy Charging Schedule (CIL introduced 1 April 2015)
source-text: 'for the following types of application: • Full planning applications (not householder unless
  over 100sq.m) • Hybrid full/outline planning applications • Reserved matters applications • Lawful development
  certificates (existing and proposed) • Section 73 (variation of condition) applications'
confidence: medium
notes: 'From the council''s list (published November 2021), Part 1 and the Part 2 tables, page 5, 6-16.
  The Part 2 tables add the thresholds: householder 100 sq m or more; lawful development certificates
  where additional dwellings or 100 sq m or more of floor space are proposed; variation of condition where
  dwellings are added or floor space changes; reserved matters and permission in principle ''All applications''.'
review-status: unverified
field-status: {}
