reference: transport-assessment
local-authority: RDG
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: parking-change
          value: true
          description: Parking forms part of the proposal.
      - discretionary
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: NPPF; Reading Borough Local Plan 2019 policies TR1, TR3 and TR5
source-text: All Major Applications and larger Minor and Other applications that will have an impact by
  increasing transport demand will be required to provide a transport assessment to measure those impacts
  and propose measures to mitigate them. For smaller schemes (development that is expected to generate
  relatively low numbers of trips or traffic flows and thus has relatively small transport implications)
  a Transport Statement (TS) will be sufficient to outline the transport aspects of the application.
must-include:
- item: Analysis of all existing and proposed trips by all modes of travel generated by the site
  level: must
- item: Accessibility to the site by all modes, and the likely modal split
  level: should
- item: Measures to improve access by public transport, walking and cycling, to reduce the need for parking
    and to mitigate transport impacts
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 22, page 8, 12,
  17, 36. The Minor table asks for a Transport Statement for 'All applications with parking or traffic
  generation as part of the proposal'; traffic generation and 'larger' minor schemes are shown as discretionary.
  For prior approvals it is only further information.
review-status: unverified
field-status: {}
