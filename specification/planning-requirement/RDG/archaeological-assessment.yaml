reference: archaeological-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - site:
      in:
      - archaeological-priority-area
      description: Within an Area of Archaeological Potential on the Local Plan Proposals Map.
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal disturbs the ground.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies EN2
source-text: For all proposals involving the disturbance of ground within an Area of Archaeological Potential
  as identified on the adopted Local Plan Proposals Map.
must-include:
- item: Plans showing historic features, listed buildings and structures, historic parks and gardens,
    historic battlefields and scheduled ancient monuments
  level: should
- item: An analysis of the significance of the archaeology and of the history and character of the building
    or structure
  level: should
- item: Principles of and justification for the proposed work
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 3, page 7, 10,
  20-21.
review-status: unverified
field-status: {}
