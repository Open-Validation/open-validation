reference: sustainability-statement
local-authority: RDG
required-if:
  application-type:
    in:
    - full
    - outline
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies CC2, CC3, CC4, CC5, EN18 and H5; Sustainable Design and
  Construction SPD (2019)
source-text: All development will need to demonstrate how it has been designed to incorporate measures
  to adapt to climate change in accordance with policies CC2, CC3, CC4, CC5, EN18 and H5 of the Reading
  Borough Local Plan (2019)
must-include:
- item: How the proposal achieves local plan objectives for water efficiency, carbon emissions, emissions
    rate calculations and BREEAM
  level: must
- item: Follows the sustainability checklist(s) at Appendix 1 of the Sustainable Design and Construction
    SPD
  level: should
- item: Building orientation to maximise natural heating and ventilation and reduce exposure to wind
  level: should
- item: Resistance and resilience to climate change (e.g. solar shading, ventilation, materials, green
    and brown roofs)
  level: should
- item: Trees and other planting to shade amenity areas, buildings and streets
  level: should
- item: Minimising surface water runoff in the drainage design
  level: should
- item: Minimising energy and resource (including water) consumption and maximising sustainable or renewable
    resources
  level: should
- item: Minimising waste in construction and use, with adequate space for waste storage, reuse, recycling
    and composting
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables ('All applications') and Part
  3 item 20, page 8, 11, 33-34. Major development also needs an energy statement.
review-status: unverified
field-status: {}
