reference: habitat-baseline
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The permission would be subject to the biodiversity gain condition.
source-url: https://images.reading.gov.uk/2024/02/Validation-Checklist-Addendum-BNG-February-2024.pdf
policy: Schedule 7A, Town and Country Planning Act 1990 (Environment Act 2021)
source-text: a plan, drawn to an identified scale which must show the direction of North, showing onsite
  habitat existing (using the habitat classifications given in the Statutory metric) on the date of application
  (or an earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale
  level: must
- item: Shows the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier date), using the statutory metric's
    habitat classifications
  level: must
- item: Any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (published November 2021; Biodiversity Net Gain Addendum published February
  2024), addendum paragraph 3.1, page 3. Paragraph 5.6 also asks for a post-development habitat map on
  proposed site plans, but the addendum adds no local validation requirement. Shown with the biodiversity
  gain condition because householder and other exempt development are exempt by law.
review-status: unverified
field-status: {}
