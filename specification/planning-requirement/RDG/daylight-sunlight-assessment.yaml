reference: daylight-sunlight-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - condition:
        field: storey-count
        operator: '>'
        value: 4
        description: Buildings exceeding four storeys in height where adjoining other developed land or
          public open spaces.
    - discretionary
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies CC7, CC8 and H9
source-text: 'In support of all applications involving: • buildings exceeding four storeys in height where
  adjoining other developed land or public open spaces; • where proposed buildings or extensions could
  lead to overshadowing of other proposed buildings or spaces within the same development site, particularly
  amenity spaces; • where the application site is itself subject to significant shading from adjoining
  buildings or trees;'
must-include:
- item: A daylight, vertical sky component, sunlight availability and shadow study, with reference to
    the BRE guide BR209
  level: should
- item: The existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties
  level: should
- item: The measures that will be taken to mitigate the expected impact
  level: should
- item: 'For householder applications: in most cases north shown on the block plan and a 45 degree line
    drawn on the proposed plan is sufficient'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables, Part 3 item 5 and Appendix 1,
  page 6, 9, 12, 21-22, 42. The Part 2 tables say 'Where the proposed development is likely to impact
  the daylight or sunlight reaching adjoining properties'; that judgement, overshadowing within the site
  and shading of the site are shown as discretionary. The applicant pays for the council's independent
  review.
review-status: unverified
field-status: {}
