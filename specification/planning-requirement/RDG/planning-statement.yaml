reference: planning-statement
local-authority: RDG
required-if:
  application-type:
    in:
    - full
    - outline
    - s73
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: NPPF; Reading Borough Local Plan 2019
source-text: Statements will be required in support of all “major”, “minor” or “other” applications to
  explain how the proposal relates in policy terms to national planning guidance, the development plan
  and adopted Supplementary Planning Guidance.
must-include:
- item: How the proposal relates to national planning guidance, the development plan and adopted supplementary
    planning guidance
  level: must
- item: 'For variation of condition: explains the change'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Level differences and the mitigation needed
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Site levels change.
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables and Part 3 item 18, page 6, 8,
  11, 14, 31-32. For householder applications a brief statement is only 'encouraged' or 'advisable', so
  they are not included. The BNG addendum (paragraph 3.8) says the biodiversity gain statements can go
  in a planning statement or covering letter until the national form changes.
review-status: unverified
field-status: {}
