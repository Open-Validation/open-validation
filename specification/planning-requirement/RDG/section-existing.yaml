reference: section-existing
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: change-in-ground-levels
      value: true
      description: Site levels change or the site slopes.
  - discretionary
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Reading Borough
  Local Plan 2019 policies CC7, CC8 and H9
source-text: Where site levels are likely to affect the level or extent of impact of the proposal on neighbouring
  properties ... For proposals where site levels require design mitigation or topography will be a material
  consideration.
must-include:
- item: Existing and proposed site levels and finished floor levels, related to a fixed datum point off
    site
  level: should
- item: The proposals in relation to adjoining buildings
  level: should
- item: 'For householder development on sloping sites: how the proposals relate to existing ground levels
    or where ground levels outside the extension would be modified'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables ('Site Levels & Sections (where
  relevant)' and 'Site level information'), Part 3 item 19 and Appendix 1, page 6-12, 32-33, 43. Whether
  the levels affect neighbours or need design mitigation is the council's judgement, so it is shown as
  discretionary next to the level change.
review-status: unverified
field-status: {}
