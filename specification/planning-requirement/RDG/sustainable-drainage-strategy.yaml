reference: sustainable-drainage-strategy
local-authority: RDG
required-if:
  ref: major-development
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies EN18
source-text: Applies to all Major planning applications.
must-include:
- item: Detailed designs for the drainage system
  level: must
- item: Infiltration tests of the existing ground
  level: must
- item: Design calculations showing that the predicted runoff from the site post development is no greater
    than the existing runoff
  level: must
- item: 'If infiltration methods are not used: connection details to the existing watercourse and drainage
    networks, with acceptance of these connections from the relevant approving body (EA, LFA, Canal &
    River Trust, Sewage)'
  level: must
confidence: medium
notes: From the council's list (published November 2021), Part 1 (Sustainable Drainage System Proposals
  (SUDS)), page 5.
review-status: unverified
field-status: {}
