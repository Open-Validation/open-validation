reference: town-centre-impact-assessment
local-authority: RDG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside the defined town centre, district or local centres (and
        not in line with an up-to-date allocation).
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: NPPF paragraphs 86 and 89; Reading Borough Local Plan 2019 policies CR1, CR4, CR5, CR7, CR8, RL2,
  RL3, RL5 and RL6
source-text: The requirement for a Sequential Test applies to all applications for main town centre uses
  as defined in the NPPF (no minimum threshold applies) but in accordance with Reading’s adopted policy
  RL5 an Impact Assessment is required only for developments that would exceed 1,000 sq m (gross) of new
  or additional main town centre use floorspace.
must-include:
- item: A sequential approach to site selection
  level: must
- item: An impact assessment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 sq m (gross) of new or additional main town centre use floorspace.
- item: Impact on existing, committed and planned investment in centres in the catchment, and on town
    centre vitality and viability
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 sq m (gross) of new or additional main town centre use floorspace.
- item: Justification of the scale, why the site was chosen and its accessibility by a choice of transport
    modes
  level: should
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 sq m (gross) of new or additional main town centre use floorspace.
confidence: medium
notes: 'From the council''s list (published November 2021), Part 2 tables (''Town centre uses – sequential
  test approach and impact assessments'') and Part 3 item 21, page 8, 11, 34-35. Out of centre means:
  for retail, outside the Primary Shopping Area and District and Local Centres; for offices, outside the
  Office Core, District and Local Centres and the A33 Corridor; for other uses, outside the Central Core
  and District and Local Centres.'
review-status: unverified
field-status: {}
