reference: landscaping-plan
local-authority: RDG
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: external-space
        value: true
        description: New development that includes external space.
source-url: https://images.reading.gov.uk/2021/12/Validation-Checklist-2021-Final-Version-02.12.21.pdf
policy: Reading Borough Local Plan 2019 policies CC7 and EN14
source-text: For major and minor planning applications for all new development proposals that include
  external space. A statement of landscape principles would be required as a minimum with the requirement
  for further details forming part of a planning condition.
must-include:
- item: Details of existing and proposed planting
  level: must
- item: As a minimum, outline details of the proposed landscaping scheme
  level: should
- item: Proposed finished ground levels or contours, means of enclosure, car parking layouts, access and
    circulation areas, structures and ancillary objects
  level: should
- item: Proposed and existing functional services above and below ground
  level: should
- item: Predominantly native or wildlife friendly species, including large canopy trees resilient to climate
    change, and diverse planting (trees ideally to the 30:20:10 ratio)
  level: should
- item: Integration of sustainable drainage systems and landscaping
  level: should
- item: Boundary treatments that let hedgehogs and other wildlife move across the site
  level: should
- item: Plans clearly showing which trees or landscape features are to be retained and which are to go,
    with a net gain in tree number
  level: should
confidence: medium
notes: From the council's list (published November 2021), Part 2 tables (Landscape principles) and Part
  3 item 13, page 8, 11, 28. The Major table says 'All applications'; the Minor table says 'For all developments
  where external landscaping is proposed'.
review-status: unverified
field-status: {}
