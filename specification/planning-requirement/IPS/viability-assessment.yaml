reference: viability-assessment
local-authority: IPS
required-if:
  any:
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 15
          description: 15 dwellings or more.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Sites of 0.5ha or more.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Affordable housing provision does not meet the requirements of policy CS12.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The development departs from other planning policy requirements due to viability.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy CS12
source-text: For proposals of 15 dwellings or more or on sites of 0.5ha or more where affordable housing
  provision does not meet the requirements of Core Strategy Policy CS12. … Where a proposed development
  departs from other planning policy requirements due to viability.
must-include:
- item: Follows the recommended approach in the viability guidance, including standardised inputs
  level: must
- item: Made publicly available (other than in exceptional circumstances, when an executive summary is
    made public)
  level: must
- item: Based on and referenced back to the viability assessment that informed the plan, with evidence
    of what has changed
  level: must
confidence: medium
notes: From the council's list (adopted January 2026), page 76-77. Site Specific Viability Appraisal.
  The affordable housing requirement does not apply to development of 65% or more flats on brownfield
  sites.
review-status: unverified
field-status: {}
