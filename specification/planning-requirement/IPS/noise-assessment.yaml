reference: noise-assessment
local-authority: IPS
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Uses sensitive to noise are proposed close to an existing source of noise.
  - condition:
      field: noise-generating-use
      value: true
      description: Development likely to generate noise is proposed.
  - condition:
      field: plant-equipment
      value: true
      description: Applications requiring ventilation and extraction equipment, such as for commercial
        kitchens.
  - site:
      in:
      - minerals-waste-safeguarding-area
      description: Within the safeguarding buffer of a minerals or waste site (Suffolk Minerals and Waste
        Local Plan).
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy DM18
source-text: Where uses sensitive to noise are proposed close to an existing source of noise or when development
  that is likely to generate noise is proposed, the Council will require an acoustic report to accompany
  the application. … This includes applications requiring ventilation and extraction equipment, such as
  those for commercial kitchens, as these can be significant sources of noise.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: The potential sources of noise/vibration and how they may affect local amenity
  level: should
- item: How the developer will mitigate and minimise adverse impacts
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 66, 65. Noise and Vibration Assessment. The
  minerals/waste safeguarding buffer trigger ('should include Noise and Air Quality (including dust) Assessments')
  comes from 'Minerals Assessments' (page 65).
review-status: unverified
field-status: {}
