reference: arboriculturist-report
local-authority: IPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges on or adjacent to the site could be affected, whether or not they
          are protected.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Affecting trees protected by a Tree Preservation Order or within a Conservation Area.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy DM9; BS 5837:2012
source-text: All planning applications (full, outline, reserved matters) where trees or hedges on or adjacent
  to the site could be affected by the proposed development, regardless of whether the trees are protected.
  … Planning applications affecting trees protected by a Tree Preservation Order (TPO) or within a Conservation
  Area.
must-include:
- item: A full tree survey and assessment to BS 5837:2012 by a competent arborist
  level: must
- item: A tree constraints plan and root protection zones
  level: must
- item: 'An Arboricultural Impact Assessment: trees and hedges to be retained or removed; dimensions and
    species of hedges to be removed, shown and labelled on the plans; impacts on retained trees and hedges
    including rooting areas and canopies; direct and indirect impacts'
  level: must
- item: A Tree Protection Plan showing protective fencing, ground protection and construction exclusion
    zones, with methods, timings and responsibilities for protection
  level: must
- item: Where applicable, an Arboricultural Method Statement
  level: must
  required-if: discretionary
- item: 'If trees are to be removed: a replanting strategy, ideally 2-for-1 using semi-mature specimens'
  level: should
  required-if:
    condition:
      field: tree-removal
      value: true
      description: Tree removal is proposed.
- item: A clear specification of the extent of any proposed reductions to trees, branches or limbs
  level: must
confidence: medium
notes: From the council's list (adopted January 2026), page 91-93. Tree Survey (Arboricultural Impact
  Assessment). Applications for works to protected trees (TPO or conservation area) follow national requirements
  only; a tree survey 'may be helpful' but 'is not required for validation'.
review-status: unverified
field-status: {}
