reference: sci
local-authority: IPS
required-if:
  ref: major-development
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
source-text: All major developments are expected to include a Community Consultation Exercise Statement.
  Where appropriate, this may be incorporated into the Planning Statement.
must-include:
- item: How the views of the local community have informed the proposal, including the methods used to
    engage with disadvantaged and at-risk groups
  level: must
- item: A description of the engagement activities and who was invited
  level: should
- item: Who took part and the feedback received
  level: should
- item: The information made available to participants
  level: should
- item: How the proposal was amended in response to feedback
  level: should
- item: Engagement extended as a minimum to the local MP, relevant borough and county ward councillors,
    the Planning and Museums Portfolio Holder, group leaders, landowners and occupiers of the site and
    adjoining land, local residents groups and relevant community or business groups
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 44-45. Community Consultation Exercise Statement.
  All consultation is organised and funded by the applicant.
review-status: unverified
field-status: {}
