reference: recreation-facilities-assessment
local-authority: IPS
required-if:
  any:
  - ref: major-development
  - condition:
      field: loss-of-open-space
      value: true
      description: The development includes the loss (in whole or in part) of open space, sports or recreation
        facilities.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies CS16, DM5 and DM6 and Appendix 3; Public Open Space
  SPD (2017)
source-text: For all major developments. For any development that includes the loss (in whole or in part)
  of open space, sports, or recreation facilities.
must-include:
- item: Compliance with policy DM6 and the standards in Appendix 3 of the Local Plan
  level: must
- item: An assessment of open space needs and whether they can be met on site
  level: must
- item: 'Where on-site provision is not achievable: justification for alternative provision (suitably
    located open space nearby and/or financial contributions for off-site mitigation)'
  level: must
- item: The quantity, quality and accessibility of existing facilities on or near the site
  level: should
- item: Remediation or mitigation to compensate for loss or deficiencies in provision
  level: should
- item: 'Where open space or sport facilities would be lost: evidence of early engagement with Sport England
    and any response'
  level: should
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Open space, sport or recreational facilities would be lost.
confidence: medium
notes: From the council's list (adopted January 2026), page 67-68. Open Space Assessment.
review-status: unverified
field-status: {}
