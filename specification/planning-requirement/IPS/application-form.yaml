reference: application-form
local-authority: IPS
required-if:
  always: true
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'An application form is required for all types of planning applications, including but not
  limited to:'
must-include:
- item: All questions answered, with 'Not Applicable' or 'N/A' where a question does not apply
  level: should
- item: 'Vehicle parking: total existing and proposed parking spaces (including spaces retained) by vehicle
    type'
  level: should
- item: Whether the application is for a custom or self-build dwelling (Question 17 - Residential Units)
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates dwellings.
- item: Non-residential floorspace as gross internal floorspace, given for each planning unit (by Use
    Class) where more than one Use Class is proposed
  level: should
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential floorspace is proposed.
- item: 'Employment: existing and additional staff (full-time and part-time) and full-time equivalent
    posts, if known'
  level: should
- item: Site area in hectares
  level: should
- item: A clear, precise description of the proposal that accurately reflects the consent sought
  level: should
- item: The relevant ownership certificate (A, B, C or D) and agricultural land declaration, completed
    fully and accurately (not needed for reserved matters, variation or removal of conditions, TPO tree
    works or advertisement consent; listed building consent needs a certificate but no agricultural declaration)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - ldc
      - prior-approval
- item: 'For certificates C and D: a copy of the notice published in a local newspaper'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Certificate C or D is completed.
confidence: medium
notes: From the council's list (adopted January 2026), page 5-10. The ownership certificate and agricultural
  land declaration (pages 8-10) are part of the form. 'An application is not valid ... unless the relevant
  certificate has been completed.'
review-status: unverified
field-status: {}
