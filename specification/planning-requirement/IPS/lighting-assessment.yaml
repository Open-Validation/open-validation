reference: lighting-assessment
local-authority: IPS
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting (new and intensified), including lighting adjacent to
        a highway and external lighting of historic buildings.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - local-wildlife-site
      - local-nature-reserve
      description: Developments in sensitive areas, such as adjacent to sites of nature conservation importance.
  - condition:
      field: protected-species
      value: true
      description: Protected or S.41 priority species are known or strongly suspected to be present.
  - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy DM18
source-text: 'All developments proposing or including: … Significant external lighting (new and intensified)
  … Illuminated advertisements. … Floodlighting. … Large expanses of glazing which could result in light
  spillage. … Lighting adjacent to a highway. … External lighting of historic buildings. … Developments
  in sensitive areas, such as adjacent to sites of nature conservation importance. … Development where
  protected or S.41 priority species are known or strongly suspected to be present.'
must-include:
- item: Details of external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation, a schedule of the equipment, and any mitigation measures
  level: must
- item: 'For floodlighting: light spillage, hours of illumination, light levels, column heights, specification
    and colour, lamp and luminaire treatment, full horizontal cut-off, no distraction to the highway,
    impact on nearby dwellings, demountable columns, screening vegetation, planting and bunding'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: The scheme involves floodlighting.
- item: How the lighting may affect visual amenity, local character, neighbouring amenity, heritage assets,
    designated nature conservation sites, habitats and protected or S.41 priority species, and how effects
    will be mitigated
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 62-63. 'Large expanses of glazing which could
  result in light spillage' is shown as discretionary because the list gives no size.
review-status: unverified
field-status: {}
