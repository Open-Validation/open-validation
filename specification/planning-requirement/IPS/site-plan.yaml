reference: site-plan
local-authority: IPS
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
    - ldc
    - prior-approval
    - advertising
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
source-text: All applications must include Existing and Proposed Block Plans of the site based on an up-to-date
  map.
must-include:
- item: Scale of 1:200 or 1:500
  level: should
- item: Clearly annotated existing and proposed
  level: should
- item: All existing buildings and structures, and those on all land adjoining the site
  level: should
- item: The whole of the boundary of the property
  level: should
- item: Details of all trees
  level: should
- item: All roads, footpaths and public rights of way adjoining the site
  level: should
- item: Anything to be demolished identified
  level: should
- item: The direction of north
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 28-29. Block plans. The council's page table
  lists them as 'Required' for every application type except tree works. Every drawing needs a title box
  (see submission standards).
review-status: unverified
field-status: {}
