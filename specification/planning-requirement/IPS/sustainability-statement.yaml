reference: sustainability-statement
local-authority: IPS
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: new-build
        value: true
        description: New residential development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
source-text: Sustainability Statement … When is this required? All major developments and new residential
  development.
must-include:
- item: The Council's Sustainability Development Checklist, as an appendix
  level: should
confidence: medium
review-status: unverified
field-status: {}
