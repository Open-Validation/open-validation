reference: location-plan
local-authority: IPS
required-if:
  always: true
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a location plan based on an up-to-date map.
must-include:
- item: Based on an up-to-date map
  level: must
- item: Scale typically 1:1250 or 1:2500, scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: The direction of north and enough roads and/or buildings on adjoining land to make the exact location
    clear
  level: should
- item: Application site edged clearly with a red line, including all land needed for the development
    (access from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
- item: Visibility splays clearly labelled with dimensions, shown to their full extent and to the nearside
    edge of the carriageway
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: Visibility splays are provided.
  source-text: Where visibility splays are provided, they must be clearly labelled including dimensions
    and shown to their full extent and to the nearside edge of the carriageway.
- item: 'For advertisement consent: drawn to an identified scale, showing north, locating the site by
    at least two named roads and the proposed position of the advertisement'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (adopted January 2026), page 11-12, 36-37. The advertisement plan comes
  from 'Advertisement Details' (pages 36-37).
review-status: unverified
field-status: {}
