reference: design-and-access-statement
local-authority: IPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building (or buildings) where the floor space created is 100 square metres or
            more.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Article 4, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Ipswich Local Plan Core Strategy policies DM12 and DM13
source-text: All major1 development (both full and outline … applications). … Applications for listed
  building consent. … Applications in a conservation area where the proposed development consists of one
  or more dwellings, or a building (or buildings) where the floor space created by the development is
  100 square metres or more.
must-include:
- item: The design response to creating accessible and adaptable places, including provision for disabled
    access and sustainable and active forms of movement
  level: should
- item: Any consultation undertaken on the proposal and how the outcomes informed it
  level: should
- item: Where applicable, the content and quality of any public art
  level: should
  required-if: discretionary
- item: 'Where a planning application is made in parallel with listed building consent: a single combined
    statement covering both'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For outline applications: the proposed use or uses and the amount of development for each use,
    and the area or areas where access points will be situated (even if access is reserved)'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (adopted January 2026), page 12-16. Applications for a material change
  of use or for engineering operations do not need one. The Statement of Crime Prevention may be incorporated
  into it. Not needed for minor applications outside these cases (the page table says 'May be required').
review-status: unverified
field-status: {}
