reference: flood-risk-assessment
local-authority: IPS
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3 (including flood zone 3b), including minor development and change
        of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Sites of more than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Sites of more than 1 hectare in flood zone 1.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Sites under 1 ha in flood zone 1 changing to a more vulnerable use (for example commercial
          to residential).
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: Could be affected by sources of flooding other than rivers and the sea.
  - site:
      in:
      - critical-drainage-area
      description: Development in a 'critical drainage area' identified in the Ipswich Surface Water Management
        Plan.
  - site:
      in:
      - future-flood-risk
      description: Flood zone 1 shown at increased risk of flooding during its lifetime (flood map for
        planning or the council's SFRA).
  - site:
      in:
      - surface-water-flood-risk
      description: Areas shown on the 'flood risk from surface water' maps (SCC Local Flood Risk Management
        Strategy).
  - condition:
      field: basement
      value: true
      description: Development in basements and on lowered ground levels.
  - condition:
      field: change-in-ground-levels
      value: true
      description: Land raising that impacts on surface water flood risk.
  - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: National Planning Policy Framework; Ipswich Local Plan Core Strategy policies CS1 and DM4; Development
  and Flood Risk SPD (2022)
source-text: 'Flood Risk Assessments are required to form part of planning applications for development
  in the following situations: … In flood zone 2 or 3 including minor development and change of use. …
  Involving sites of more than 1 hectare (ha) in flood zone 1.'
must-include:
- item: Follows the site-specific Flood Risk Assessment checklist (Table 8-1, Appendix 5 of the Development
    and Flood Risk SPD)
  level: must
- item: Uses the current climate change allowances (peak river flow, peak rainfall intensity and sea level)
  level: must
- item: Meets the extra requirements for specific areas in Table 8-2 of the SPD
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted January 2026), page 73-76. Site Specific Flood Risk Assessment
  (including exception test). Discretionary parts: sites next to roads with no drainage and ''any other
  specific areas that may be listed in SFRAs''. The sequential and exception tests (pages 71-73) are listed
  as unmapped; they can be part of the FRA.'
review-status: unverified
field-status: {}
