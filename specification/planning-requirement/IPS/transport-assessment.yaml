reference: transport-assessment
local-authority: IPS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 30
      description: 30 or more dwellings (Transport Statement 30-49; Transport Assessment 50 or more).
  - condition:
      field: class-eg-floorspace
      operator: '>='
      value: 1500
      description: 1,500 sq m or more of Use Class E(g) floorspace (Transport Statement 1,500-2,499; Transport
        Assessment 2,500 or more).
  - condition:
      field: class-b2-b8-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m or more of B2/B8 floorspace (Transport Statement 2,500-3,999; Transport
        Assessment 4,000 or more).
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 800
      description: 800 sq m or more of Use Class E(a) floorspace (Transport Statement 800-1,499; Transport
        Assessment 1,500 or more).
  - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: National Planning Policy Framework; Ipswich Local Plan Core Strategy policies CS5, CS20 and DM21
source-text: 'A Transport Statement will generally be required for proposals for the development of: …
  30 to 49 dwellings … 1,500 – 2,499 sq. m of Use Class E(g) floorspace; … 2,500 – 3,999 sq. m of B2/B8
  floorspace; and … 800 – 1,499 sq. m of Use Class E(a) floorspace. … A Transport Assessment will generally
  be required for proposals for the development of: … 50 or more dwellings;'
must-include:
- item: The proposed development and site layout, particularly transport access and layout across all
    modes
  level: should
- item: Neighbouring uses, amenity and character, and the functional classification of the nearby road
    network
  level: should
- item: Existing public transport provision and frequency, and proposed changes
  level: should
- item: Travel characteristics of the development across all modes, qualitative and quantitative
  level: should
- item: Trips from directly relevant committed development (likely to proceed within 3 years)
  level: should
- item: Current movements on links and junctions in the study area, identifying critical links and junctions
  level: should
- item: Injury accident records near the site access for the latest 3 years (5 years in a high accident
    area)
  level: should
- item: Environmental impacts of transport, particularly near air quality management areas or noise sensitive
    areas
  level: should
- item: Measures to improve accessibility, the parking strategy, ways of reducing the need to travel and
    mitigation of residual impacts
  level: should
- item: A detailed audit of the local highway network to determine improvements needed for safe sustainable
    and active travel
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 87-91. Transport and Highways Reports. Thresholds
  are 'generally' required; other developments that 'generate significant amounts of movement' (NPPF)
  are discretionary. Use Class E(a) floorspace is shown with the retail floorspace field.
review-status: unverified
field-status: {}
