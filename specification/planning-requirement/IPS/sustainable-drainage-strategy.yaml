reference: sustainable-drainage-strategy
local-authority: IPS
required-if:
  any:
  - ref: major-development
  - condition:
      field: drainage-alterations
      value: true
      description: Development which could affect drainage on or around the site.
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: In an area at risk of flooding such as Flood Zones 2 or 3, or at risk of surface water
        flooding.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: National Planning Policy Framework; Ipswich Local Plan Core Strategy policies CS1, DM1 and DM4;
  Suffolk Local Flood Risk Management Strategy (2023)
source-text: 'The NPPF 2024, Section 169, requires that all major development incorporate Sustainable
  Drainage Systems (SuDS) unless there is clear evidence that this would be inappropriate. … Sustainable
  drainage strategies should be included with applications for development: … which could affect drainage
  on or around the site … in an area at risk of flooding such as Flood Zones 2 or 3, or at risk of surface
  water flooding'
must-include:
- item: A drainage strategy showing how it delivers each of the four pillars of SuDS
  level: must
- item: Site investigation report
  level: must
- item: Dimensioned layout drawings showing existing watercourses and drainage features alongside the
    proposed SuDS features
  level: must
- item: Supporting hydraulic calculations
  level: must
- item: Maintenance and management plan
  level: must
- item: Designed to the national standards for sustainable drainage systems and the Suffolk County Council
    LLFA SuDS Guide (2023)
  level: should
- item: All the information in section 6 of the site-specific flood risk assessment checklist
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 82-84.
review-status: unverified
field-status: {}
