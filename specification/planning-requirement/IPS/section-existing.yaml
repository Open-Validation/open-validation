reference: section-existing
local-authority: IPS
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: A significant change in ground levels, or (for householder development) a sloping site
      where ground levels outside the extension would be modified.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
source-text: Where a proposal involves a significant change in ground levels, illustrative drawings should
  be submitted to show both existing and finished levels … (with levels related to an off-site fixed datum
  point).
must-include:
- item: Existing and finished levels, related to an off-site fixed datum point
  level: must
- item: How the development would relate to existing site levels and neighbouring development
  level: must
- item: Scale of 1:100 or 1:50, clearly annotated existing and proposed
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 32-33. Site sections. For householder development
  the levels may be evident from floor plans and elevations, but on sloping sites it will be necessary
  to show how the proposal relates to existing ground levels. Every drawing needs a title box (see submission
  standards).
review-status: unverified
field-status: {}
