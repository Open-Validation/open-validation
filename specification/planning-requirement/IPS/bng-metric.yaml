reference: bng-metric
local-authority: IPS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015; Ipswich Local Plan Core Strategy policy DM8
source-text: Biodiversity net gain (BNG) is now mandatory for all Town and Country Planning Act development
  bar exempt development types.
must-include:
- item: A Biodiversity Metric – Calculation Tool of the pre-development baseline on the date of application
    (or an earlier date)
  level: must
- item: A condition assessment where the Statutory Biodiversity Metric – Calculation Tool is used
  level: must
- item: Carried out by a suitably qualified person (an ecologist)
  level: must
confidence: medium
notes: 'From the council''s list (adopted January 2026), page 19-27. Section ''Biodiversity Net Gain Statement''.
  The council ''will accept the following information in most instances'': the metric and a habitat map
  of the pre-development baseline; further information may be requested where irreplaceable habitat is
  present or habitat degradation has occurred. The list also sets out the Biodiversity Gain Plan contents
  (approved after permission). Shown with the biodiversity gain condition, as the law sets it.'
review-status: unverified
field-status: {}
