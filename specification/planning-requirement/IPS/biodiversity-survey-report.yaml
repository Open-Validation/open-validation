reference: biodiversity-survey-report
local-authority: IPS
required-if:
  condition:
    field: protected-species
    value: true
    description: The development is likely to affect any sites of biodiversity value, as defined by the
      SBIS Biodiversity Validation Checklist.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies CS4, DM8, DM9, DM11 and DM12
source-text: When the development is likely to affect any sites of biodiversity value, as defined by the
  SBIS Biodiversity Validation Checklist (link provided opposite).
must-include:
- item: An adequate survey, with any further surveys the ecological reports recommend
  level: must
confidence: medium
notes: From the council's list (adopted January 2026), page 50-51. Ecological Impact Assessment. All planning
  applications should show they have used the SBIS Biodiversity Checklist (listed as unmapped). A preliminary
  ecological report may be followed by a request for a further report.
review-status: unverified
