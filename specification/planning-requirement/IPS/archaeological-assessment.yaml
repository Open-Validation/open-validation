reference: archaeological-assessment
local-authority: IPS
required-if:
  condition:
    field: ground-disturbance
    value: true
    description: Development which may disturb remains below ground (sites in the Area of Archaeological
      Importance are especially likely to contain significant remains).
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies CS4 and DM14; Development and Archaeology SPD (2018)
source-text: The Borough will require that development proposals which may disturb remains below ground
  are supported by an appropriate assessment of the archaeological significance of the site including,
  if necessary, the results of a programme of archaeological field investigation.
must-include:
- item: Likely character, complexity and condition of remains, including potential for waterlogging
  level: must
- item: Significance of remains (nationally, regionally or locally important)
  level: must
- item: A likely deposit model (with confidence in it), informing deposit depths and potential for waterlogged
    deposits
  level: must
- item: Impacts of past land use and development on heritage assets and their setting
  level: must
- item: The impact of the proposed development on heritage assets and their setting
  level: must
- item: Review of the Urban Archaeological Database, past planning and building control data, archive
    sources, site photographs and walkover, appraisals, contamination, geological and other data
  level: should
- item: Undertaken by an archaeological contractor or consultant with suitable expertise
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 42-44. Desk Based Assessment. Assessments
  should be proportionate to the importance of the site.
review-status: unverified
field-status: {}
