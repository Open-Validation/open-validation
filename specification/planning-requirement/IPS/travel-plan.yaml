reference: travel-plan
local-authority: IPS
required-if:
  ref: major-development
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: National Planning Policy Framework; Ipswich Local Plan Core Strategy policies CS5, CS20 and DM21;
  Suffolk Travel Plan Guidance (2019)
source-text: The Council will expect major development proposals) to provide an appropriate travel plan,
  having regard to the thresholds set out in the Suffolk County Council Suffolk Travel Plan Guidance,
  to explain how sustainable patterns of travel to and from the site and modal shift targets will be achieved.
must-include:
- item: Benchmark travel data, including trip generation databases
  level: should
- item: The nature of the development and forecast trips by all modes
  level: should
- item: Existing travel habits in the surrounding area
  level: should
- item: Proposals to reduce the need to travel to and from the site by all modes, and provision of improved
    public transport services
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 87-91. Part of 'Transport and Highways Reports';
  regard is had to the thresholds in the Suffolk Travel Plan Guidance, which are not repeated in the list.
review-status: unverified
field-status: {}
