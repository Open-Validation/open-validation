reference: fire-statement
local-authority: IPS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: A building containing two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Planning Gateway One Fire Statement must be included for all applications for full planning
  permission which involve: … Provision of one or more relevant buildings. … Development of an existing
  relevant building. … Development within the curtilage of a relevant building.'
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect), with the particulars
    it specifies
  level: must
confidence: medium
notes: From the council's list (adopted January 2026), page 16-17. A relevant building contains two or
  more dwellings or educational accommodation and is 18m or more in height, or 7 or more storeys.
review-status: unverified
field-status: {}
