reference: affordable-housing-statement
local-authority: IPS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: New housing sites of 0.5ha or more.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy CS12
source-text: For proposals of 15 or more dwellings or on new housing sites of 0.5ha or more.
must-include:
- item: The total number of all proposed residential units
  level: must
- item: The affordable provision as a percentage of all residential units
  level: must
- item: The tenure mix of the affordable units and the percentage split
  level: must
- item: Affordable units, numbers of bedrooms and property types across all tenures, showing a representative
    mix
  level: must
- item: Affordable unit space standards and floor areas (sq m)
  level: must
- item: Metric scaled plans showing the location of affordable units within the site
  level: must
- item: Any Registered Providers acting as development partners
  level: must
- item: The different levels or types of affordability or tenure proposed for different units, fully explained
  level: must
- item: 'For outline applications: confirmation that a legal agreement will be entered into to abide by
    policy CS12, and details of any discussions with Registered Providers'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Where a viability assessment is submitted: based on and referring back to the viability assessment
    that informed the Local Plan, with evidence of what has changed'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A viability assessment is submitted.
confidence: medium
notes: From the council's list (adopted January 2026), page 37-39. The requirement does not apply to developments
  of 65% or more flats on brownfield sites. It can form part of the Planning Statement.
review-status: unverified
field-status: {}
