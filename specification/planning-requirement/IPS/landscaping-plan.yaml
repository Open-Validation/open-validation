reference: landscaping-plan
local-authority: IPS
required-if:
  any:
  - condition:
      field: eia-development
      value: true
      description: An Environmental Impact Assessment is required.
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor applications.
    - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies DM8, DM9, DM11, DM12 and DM13
source-text: All applications where an Environmental Impact Assessment is required. All major developments
  should be accompanied with a Landscaping Strategy and minor applications in a sensitive landscape,.
must-include:
- item: 'The context and setting of the site: existing and historic land uses, vegetation, heritage assets,
    buildings and relationships to the wider landscape, watercourses and green infrastructure'
  level: should
- item: How landscape and visual considerations informed the design
  level: should
- item: Measures to avoid, reduce or offset adverse landscape and visual effects
  level: should
- item: A clear management and maintenance scheme for the long-term success of the landscape proposals
  level: must
  source-text: For all applicable developments, the Landscaping Strategy must also include a clear management
    and maintenance scheme to ensure the long-term success of the landscape proposals.
- item: 'Where relevant: effects on the Suffolk Coast and Heaths National Landscape (AONB) or other locally
    valued landscapes'
  level: should
  required-if:
    site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within or near, or affecting, the Suffolk Coast and Heaths National Landscape.
confidence: medium
notes: From the council's list (adopted January 2026), page 60-61. Landscaping Strategy, Landscaping Scheme
  and Management Plan. Minor applications in a 'sensitive landscape' are shown as discretionary because
  the list does not define it. The detailed scheme may be secured by condition.
review-status: unverified
field-status: {}
