reference: town-centre-impact-assessment
local-authority: IPS
required-if:
  all:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 200
      description: Retail development of more than 200 sq m net.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside defined Centres.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies DM27, DM30, DM31 and DM32
source-text: A Retail Impact Assessment is required for retail developments of more than 200sqm net outside
  defined Centres.
must-include:
- item: Impact on existing, committed and planned public and private investment in Defined Centres in
    the catchment, including cumulative impact
  level: should
- item: Impact on the vitality and viability of Defined Centres up to five years ahead (ten years for
    major developments where the full impact will not be realised in five)
  level: should
- item: 'Over 525 sq m net: impact on all Defined Centres in the catchment, including the Central Shopping
    Area'
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 525
      description: Retail proposals over 525 sq m net.
confidence: medium
notes: From the council's list (adopted January 2026), page 69-71. Retail Impact Assessment / Sequential
  Test. Between 200 and 525 sq m net the assessment covers District and Local Centres. The scope should
  be agreed with the council. The sequential test is listed as unmapped.
review-status: unverified
field-status: {}
