reference: daylight-sunlight-assessment
local-authority: IPS
required-if:
  any:
  - condition:
      field: tall-building
      value: true
      description: 'A tall building: substantially taller than its neighbours or significantly changing
        the skyline.'
  - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies DM15, DM16, DM17 and DM18; Space and Design Guidelines
  SPD (2015)
source-text: Where a development proposal has the potential to affect the amenity of sensitive neighbouring
  uses. This includes proposals that may affect neighbouring daylight or sunlight due to encroachment
  into the 45degree lines, as outlined in the Space and Design Guidelines SPD. All applications for tall
  buildings, defined as ‘buildings which are substantially taller than their neighbours or which significantly
  change the skyline’.
must-include:
- item: Prepared in accordance with the adopted British Standard
  level: must
- item: Identifies and examines the impacts on existing properties, future occupiers and sites with extant
    planning permissions
  level: must
confidence: medium
notes: From the council's list (adopted January 2026), page 48. Daylight/Sunlight/Microclimate Assessment.
  Effects on the amenity of sensitive neighbouring uses (including encroachment into the 45-degree lines)
  are shown as discretionary.
review-status: unverified
field-status: {}
