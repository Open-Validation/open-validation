reference: air-quality-assessment
local-authority: IPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - site:
      in:
      - minerals-waste-safeguarding-area
      description: Within the safeguarding buffer of a minerals or waste site (Suffolk Minerals and Waste
        Local Plan).
  - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy DM3; Low Emissions Supplementary Planning Document (2021)
source-text: All small and medium scale developments (excluding householder developments) are required
  d to submit an Air Quality Exposure Assessment. Where this Exposure Assessment indicates that relevant
  exposure would occur, then applicants should submit an Air Quality Assessment should also be submitted.
  Large scale developments are required to submit an Air Quality Assessment as standard.
must-include:
- item: Uses the templates in the Low Emissions SPD (Template Scheme Mitigation Statement, Appendix 3;
    Air Quality Assessment Protocol, Appendix 4)
  level: should
- item: Appropriate mitigation incorporated at the design stage
  level: must
- item: 'Where designated sites or ecological receptors may be affected: screening using the Air Pollution
    Information System (APIS) and critical loads, with a 10 km screening distance for European sites'
  level: should
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      description: Development that may affect designated nature conservation sites.
- item: 'Within a minerals or waste safeguarding buffer: dust assessment of local and cumulative impacts'
  level: should
  required-if:
    site:
      in:
      - minerals-waste-safeguarding-area
      description: Within a minerals or waste safeguarding buffer.
confidence: medium
notes: 'From the council''s list (adopted January 2026), page 39-41, 65. The thresholds for small, medium
  and large developments are in Appendix 1 of the Low Emissions SPD, not in the list, so they are not
  repeated here: the page table marks it ''Required'' for major and ''May be required'' for minor and
  prior approval applications, and the rest is discretionary, as are assessments for effects on ecological
  receptors. The safeguarding buffer trigger comes from ''Minerals Assessments'' (page 65).'
review-status: unverified
field-status: {}
