reference: land-contamination-assessment
local-authority: IPS
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Land identified on the public register as contaminated, land adjacent to a source of
        contamination, or where contamination is suspected.
  - condition:
      field: sensitive-end-use
      value: true
      description: 'A sensitive end use: dwellings, allotments, schools, nurseries, playgrounds, hospitals
        or care homes.'
  - condition:
      field: underground-storage-tanks
      value: true
      description: The proposal involves underground fuel tanks.
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policy DM18
source-text: For development on land that has been identified on the public register as being contaminated
  or land that … is adjacent to a source of contamination, a Phase 1 Assessment will be required as a
  minimum.. Also, any application where contaminated land is suspected or where a sensitive end use is
  proposed. Development comprising dwellings, allotments, schools, nurseries, playgrounds, hospitals,
  and care homes will require a minimum of a Phase 1 Land Contamination Assessment (often referred to
  as a Preliminary Risk Assessment) to be submitted.
must-include:
- item: A Phase 1 assessment with a desktop study, site walkover and conceptual site model
  level: must
- item: All past uses of the site and adjacent or nearby sites
  level: should
- item: 'For underground fuel tanks: an Above vs Below Ground Options Appraisal'
  level: must
  required-if:
    condition:
      field: underground-storage-tanks
      value: true
      description: The proposal involves underground fuel tanks.
  source-text: Every proposal involving underground fuel tanks should undertake an Above vs Below Ground
    Options Appraisal.
confidence: medium
notes: From the council's list (adopted January 2026), page 57-59.
review-status: unverified
field-status: {}
