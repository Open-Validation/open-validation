reference: floor-plan-proposed
local-authority: IPS
required-if:
  application-type:
    in:
    - full
    - reserved-matters
    - hh
    - lbc
    - ldc
    - prior-approval
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
source-text: All applications must include two separate sets of floor plans. Existing floor plans showing
  the building as it is now and proposed floor plans showing how the building will look, after the works
  have been carried out.
must-include:
- item: Scale of 1:100 or 1:50
  level: should
- item: Clearly annotated existing and proposed
  level: should
- item: All relevant floor levels of the building(s) being constructed, altered or extended, in relation
    to the rest of the building
  level: should
- item: Each floor clearly labelled
  level: should
- item: The use of each room, and the position of windows, doors, walls and partitions
  level: should
- item: The direction of north, and anything to be demolished identified
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 30-31. The council's page table lists floor
  plans as 'Required' for full, householder, listed building, lawful development certificate and prior
  approval applications. Every drawing needs a title box (see submission standards).
review-status: unverified
field-status: {}
