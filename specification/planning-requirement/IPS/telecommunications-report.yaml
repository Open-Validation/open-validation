reference: telecommunications-report
local-authority: IPS
required-if:
  all:
  - condition:
      field: telecommunications-development
      value: true
      description: New telecommunications equipment.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
