reference: elevation-existing
local-authority: IPS
required-if:
  any:
  - application-type:
      in:
      - full
      - reserved-matters
      - hh
      - lbc
      - advertising
  - all:
    - application-type:
        in:
        - ldc
        - prior-approval
    - discretionary
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
source-text: All applications must include two separate sets of elevational drawings. Existing elevations
  showing the building as it is now and proposed elevations showing how the building will look after the
  works have been carried out.
must-include:
- item: Scale of 1:100 or 1:50
  level: should
- item: Clearly annotated existing and proposed
  level: should
- item: Every elevation of the building, stating the direction each faces (e.g. rear (south))
  level: should
- item: Outline elevations of other buildings close to the development
  level: should
- item: 'For semi-detached houses: elevations as seen from the adjoining neighbour''s side of the boundary'
  level: should
- item: Position and size of all windows and doors (existing and proposed)
  level: should
- item: Anything to be demolished identified, and the direction of north
  level: should
confidence: medium
notes: From the council's list (adopted January 2026), page 29-30. The council's page table lists elevations
  as 'Required' for full, householder, listed building and advertisement applications and 'May be required'
  for lawful development certificates and prior approval. Every drawing needs a title box (see submission
  standards).
review-status: unverified
field-status: {}
