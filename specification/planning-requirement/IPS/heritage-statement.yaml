reference: heritage-statement
local-authority: IPS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      - world-heritage-site
      - battlefield
      description: The proposal directly involves, is adjacent to or affects the setting of a heritage
        asset (designated, or identified by the council including local listing).
source-url: https://www.ipswich.gov.uk/sites/ipswich/files/2026-04/Ipswich%20Local%20Validation%20List%20Adopted%20Jan%2026%20v2.pdf
policy: Ipswich Local Plan Core Strategy policies CS4 and DM13
source-text: Where a proposal involves directly, is adjacent to or affects the setting of a heritage asset
  (as defined on page 21), the developer must submit a Heritage Statement proportional to the heritage
  asset status.
must-include:
- item: Identifies and describes all heritage assets that may be affected, with an assessment of their
    significance, going beyond quoting the list description or HER entry
  level: should
- item: Assessment of the impact of the proposal and how it will alter or affect the heritage asset(s)
    and setting
  level: should
- item: A mitigation strategy where necessary
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted January 2026), page 55-57. The page table marks it 'Required'
  for householder applications in a conservation area and for listed building consent. It can be combined
  with a schedule of works or the Design and Access Statement if the title makes the content clear.
review-status: unverified
field-status: {}
