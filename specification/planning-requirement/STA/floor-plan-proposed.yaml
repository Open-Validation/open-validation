reference: floor-plan-proposed
local-authority: STA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: internal-works
        value: true
        description: Extensions or alterations that would affect architectural elements.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Listed-Building-Consent-Quick-Guide-Annex-3_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed floor plans All applications where extensions or alterations which
  would affect architectural elements are proposed.
must-include:
- item: Drawn to a suitable scale, typically 1:50 or 1:100 (1:50 for listed building consent)
  level: must
- item: 'Full internal layouts where car parking provision may be affected (householders: full plans of
    the whole property)'
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: Car parking provision may be affected.
- item: The position of all doors, windows and roof lights
  level: must
- item: The outline of any element of the building on lower floors shown on upper floor plans
  level: must
- item: Any existing buildings or walls to be demolished
  level: must
- item: 'Householder applications outside settlement boundaries: full existing and proposed plans'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: outside-urban-area
        value: true
        description: The site is outside a settlement boundary.
- item: 'For listed building consent: the uses of existing and proposed rooms, and the position of floor
    and ceiling joists and structural beams where they may be affected'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2026), page 14. section 20; 'when required' wording
  from Annex 3 (listed building consent), page 1. The householder items are from Annex 2, page 2.
review-status: unverified
field-status: {}
