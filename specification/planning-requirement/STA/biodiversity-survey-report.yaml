reference: biodiversity-survey-report
local-authority: STA
required-if:
  any:
  - ref: major-development
  - discretionary
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: protected-species
        value: true
        description: Works may impact protected species.
  - all:
    - site:
        in:
        - great-crested-newt-impact-risk-zone
        description: In the higher risk areas for Great Crested Newts (amber or red on the NatureSpace
          impact map).
    - condition:
        field: involves-change-of-use
        value: false
        description: Not only a material change of use of an existing building or land.
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: potential-roost-features
          value: true
          description: A building likely to house bats is to be demolished.
      - condition:
          field: tree-removal
          value: true
          description: A tree likely to provide foraging for bats is to be removed.
      - condition:
          field: pond-on-or-near-site
          value: true
          description: Ponds are involved.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: potential-roost-features
          value: true
          description: Substantial alterations to the roof or re-roofing.
      - condition:
          field: agricultural-building-reuse
          value: true
          description: Conversion schemes.
      - condition:
          field: derelict-site
          value: true
          description: The building is derelict, dilapidated, or has clear points of access for birds
            or bats.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policies N1, N4 and N5; NPPF paragraphs 44, 187 and 193;
  Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017; Protection
  of Badgers Act 1992; Environment Act 2021
source-text: Where a proposed development may have possible impacts on wildlife and biodiversity Renewals
  of existing consents should include an update on any information provided with the original application
  All major applications Applications for listed building consent where works may impact protected species.
  ... All major applications. All applications within the higher risk areas for Great ... Crested Newts
  (amber or red) (www.naturespaceu k.com/district- licensing/impact- map/) except where the proposal only
  relates to the material change of use of an existing building or land, and householder applications.
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: must
- item: Any further surveys required, provided before the application is validated
  level: must
- item: How harm to species and habitats is avoided first; justification of any unavoidable harm, and
    information supporting any mitigation and/or compensation
  level: must
- item: Where appropriate, plans of significant wildlife habitats or features and the location of habitats
    of protected species
  level: should
- item: A Staffordshire Ecological Records search of the site and a minimum 500 metre buffer
  level: should
- item: 'Data 12-18 months old: an ecologist''s addendum on whether surveys need updating; 18-36 months
    old: an updated survey and report'
  level: must
- item: 'Great crested newt assessment: waterbodies and habitats within 500m (with Habitat Suitability
    Index assessment of ponds wherever possible), presence/absence surveys where needed, on-site habitats
    and features such as hibernacula, connectivity, and how impacts are mitigated through a licensing
    option or RAMs/PWMS; or proof of entry to the NatureSpace District Licence Scheme instead'
  level: must
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - great-crested-newt-impact-risk-zone
        description: In the higher risk areas for Great Crested Newts (amber or red on the NatureSpace
          impact map).
- item: 'Low-risk great crested newt statement (no ponds within 250m, no suitable habitat affected and
    no connectivity): nearby ponds or wet ditches within 500m, suitable habitat on site and between the
    site and ponds, surfacing of the site, and significant barriers'
  level: must
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - great-crested-newt-impact-risk-zone
        description: In the higher risk areas for Great Crested Newts (amber or red on the NatureSpace
          impact map).
- item: 'For listed building consent: a phase 1 ecological assessment and any further surveys it calls
    for, by a suitably qualified individual'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2026), page 28-31, 42-43. local requirements 15 (Great
  Crested Newt assessment) and 27 (Preliminary ecological assessment), merged here. 'May have possible
  impacts on wildlife and biodiversity' has no test, so it shows as discretionary. The householder triggers
  (bats, ponds) are from Annex 2, page 3, and the listed building consent triggers from Annex 3, pages
  4-5. The great crested newt zone part covers planning applications other than householder and change-of-use-only
  proposals.
review-status: unverified
field-status: {}
