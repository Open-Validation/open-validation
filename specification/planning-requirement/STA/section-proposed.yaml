reference: section-proposed
local-authority: STA
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: new-build
      value: true
      description: The proposal involves the erection of a new building.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: structural-alteration
        value: true
        description: Alterations to the roof, ceiling or floor, internal wall, roof or floor insulation,
          a new staircase, or alterations to foundations.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In all cases where a proposal involves a change in ground levels, illustrative drawings should
  be submitted to show both existing and finished levels, to include details of foundations and eaves,
  and how encroachment onto adjoining land is to be avoided. ... Any application which involves the erection
  of a new building must be supported by full information to demonstrate how the proposed building(s)
  relates to existing site levels and adjacent development/infrastructure.
must-include:
- item: Existing and finished levels, with details of foundations and eaves and how encroachment onto
    adjoining land is avoided
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: 'For a new building: existing site levels and finished floor levels related to a fixed off-site
    datum point, and the proposal in relation to adjoining buildings/infrastructure'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building.
- item: 'For major development: site level plans based on a topographic survey'
  level: must
  required-if:
    ref: major-development
- item: Site sections typically at 1:50, 1:100 or 1:200, showing cross section(s) through the development;
    site levels and finished floor plans typically at 1:100, 1:200 or 1:500
  level: must
- item: 'For listed building consent: sections at 1:20 or 1:50 showing the alterations proposed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2026), page 14-15. section 21 (site sections, site levels
  and finished floor levels). The listed building consent trigger and scale are from Annex 3, page 2.
  For householder development the levels may be clear from the floor plans and elevations (21.7).
review-status: unverified
field-status: {}
