reference: design-and-access-statement
local-authority: STA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - reserved-matters
    - ref: major-development
    - condition:
        field: matters-beyond-access
        value: true
        description: Appearance, layout and/or scale were not approved at outline stage.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: Article 9 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; Regulation 3A of the Planning (Listed Buildings and Conservation Areas) Regulations 1990
source-text: 'A design and access statement must accompany the following applications: ... Applications
  for major development as defined in article 2 of the Town and Country Planning (Development management
  Procedure) (England) Order 2015 (as amended). For example, 10 houses or more, floorspace of 1,000sqm
  or more, or a site area of 1 hectare or more, where the application is for outline consent or full planning
  permission. ... Applications for development in a conservation area, where the proposed development
  comprises: • One or more dwellings; or • A building or buildings with a floor space of 100sqm or more.
  ... Applications for listed building consent. ... Major applications for the approval of reserved matters
  where appearance, layout, and/or scale have not been approved at outline stage.'
must-include:
- item: Proportionate to the complexity of the application, but not long
  level: should
- item: 'For listed buildings: the special architectural and historic interest of the building, the physical
    features that justify its designation, and its setting'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent: an assessment of the impact of the proposed works on the significance
    of the listed building and the areas affected, including any steps to avoid or minimise adverse impacts
    (it includes the heritage statement)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Include an assessment of the impact of the proposed works on the significance of the listed
    building and those areas affected by the works, including any steps to be taken to avoid or minimise
    any adverse impacts
confidence: medium
notes: From the council's list (published January 2026), page 9-10. section 14; the listed building consent
  item is from Annex 3, page 3-4. Section 9.4 also says major outline applications should include one.
review-status: unverified
field-status: {}
