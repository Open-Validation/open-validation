reference: arboriculturist-report
local-authority: STA
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees subject to a Tree Preservation Order on, or overhanging, the site.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the site or on adjacent land (including street trees) which could be affected
        by or influence the development.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows on or next to the site which could be affected by or influence the development.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: NPPF paragraph 187; BS 5837 'Trees in relation to design, demolition and construction'
source-text: Any site where there are trees which are the subject of a Tree Preservation Order on, or
  overhanging, the site Any application where there are trees or hedgerows on the application site, or
  on land adjacent to it (including street trees) which could be affected by or ... influence the development.
must-include:
- item: Which trees are to be retained and how they will be protected during construction works
  level: must
- item: Survey information, tree protection plan and method statement following the current BS 5837
  level: should
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: should
- item: An addendum report or further survey where any survey is more than two years old
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 51-52. local requirement 35 (Tree survey
  / assessment). Annex 2 asks householders for the same information where trees could be affected by or
  influence the development.
review-status: unverified
field-status: {}
