reference: noise-assessment
local-authority: STA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Likely to have an impact on existing noise or vibration sensitive developments, or
        to introduce noise or vibration where it would have an adverse impact.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A use that may be sensitive to existing nearby sources of noise or vibration.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy N1; NPPF paragraphs 187 and 198; Noise Policy Statement
  for England (March 2010); Environmental Protection Act 1990
source-text: All applications likely to have an impact on existing noise or vibration sensitive developments
  All applications which may introduce or expose noise or ... vibrations into an area where it would have
  an adverse impact, e.g. changes of use within town centres All applications for uses which may be sensitive
  to existing nearby sources of noise or vibration
must-include:
- item: 'Considers BS6472: 2008 (human exposure to vibration in buildings) and BS7385-2: 1993 (vibration
    in buildings)'
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 37-38. local requirement 23 (Noise and vibration
  assessment). Applicants are advised to ask the Environmental and Health Service first whether one is
  needed.
review-status: unverified
field-status: {}
