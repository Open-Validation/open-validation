reference: bng-metric
local-authority: STA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990; Environment Act 2021
source-text: 'Planning permission, where not exempt, is subject to the general biodiversity gain condition.
  All applications shall be supported by a statement as to whether the applicant believes that planning
  permission, if granted, would be subject to the biodiversity gain condition and, if so, the following
  information as a minimum:'
must-include:
- item: Pre-development biodiversity value of the onsite habitat and offsite watercourses within 10m of
    the site boundary (5m for ditches) on the date of application (or an earlier date), with the completed
    metric calculation tool showing the calculations, and the publication date and version of the metric
    used
  level: must
- item: 'Where an earlier date is used: the proposed earlier date and the reasons for it'
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant wishes to use an earlier date.
- item: A statement of whether the onsite habitat value is lower because of degradation, with supporting
    evidence
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded.
confidence: medium
notes: From the council's list (published January 2026), page 15-16. section 23. The rule follows the
  law (exempt applications are exempt), although the list says 'All applications'. The small sites metric
  may be used for small-scale developments (23.2). Applications claiming an exemption need other information
  (local requirement 6, see the unmapped list).
review-status: unverified
field-status: {}
