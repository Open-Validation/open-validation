reference: site-plan
local-authority: STA
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Listed-Building-Consent-Quick-Guide-Annex-3_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; The Plan for
  Stafford Borough 2011-2031 policy T2 and Appendix B (car parking standards)
source-text: Site or block plan All applications
must-include:
- item: Drawn to a suitable scale, typically 1:100, 1:200 or 1:500
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to all site boundaries and all other existing buildings on
    the site (including any building to be demolished)
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: All trees and hedgerows on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: Extent and type of any hard surfacing
  level: must
- item: Type and height of all existing and proposed boundary treatments
  level: must
- item: 'All car parking provision, where changes are proposed or required (local parking standards: Plan
    for Stafford Borough Appendix B)'
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: Parking changes are proposed or required.
- item: Proposed parking provision and access, including any existing provision to be retained, and the
    level of provision (including cycles)
  level: must
  required-if:
    any:
    - condition:
        field: new-vehicle-access
        value: true
        description: New or altered access.
    - condition:
        field: parking-change
        value: true
        description: New or altered parking arrangements.
  source-text: 'The proposed site layout plan must include: • Details of proposed parking provision and
    access, including any existing provision to be retained. • Details of the level of provision (including
    cycles)'
- item: 'Access works: how they support the design'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: Access works are proposed.
- item: Micro-modelling analysis and a Stage 2 Safety Audit where access is via a traffic signalled junction,
    roundabout or priority junction with right turn facility
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: Access via a signalled junction, roundabout or priority junction with right turn facility.
- item: Existing and proposed visibility splays (for simple priority junctions or dropped crossings, and
    wherever the access is intensified or changed)
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new, intensified or altered access.
- item: Speed surveys where proposed visibility splays do not meet Manual for Streets 2
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: Proposed visibility splays below Manual for Streets 2 recommendations.
confidence: medium
notes: 'From the council''s list (published January 2026), page 12-13, 41-42. Section 18 (site plan, items
  ''where relevant''); the parking and access items are local requirement 25 (Parking and access arrangements:
  ''All applications (including householders) which involve new, or alterations to existing, access and
  parking arrangements''), which the list asks for on the proposed site layout plan. The main list gives
  no ''when required'' wording for site plans; the source-text is Annex 3 (listed building consent), page
  1, and Annex 2 asks householders for a site/block plan at 1:100, 1:200 or 1:500.'
review-status: unverified
field-status: {}
