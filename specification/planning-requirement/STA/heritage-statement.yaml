reference: heritage-statement
local-authority: STA
required-if:
  any:
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      - archaeological-priority-area
      - park-and-garden
      - battlefield
      description: The application may affect a heritage asset or its setting (listed buildings, conservation
        areas, scheduled monuments, archaeological sites, registered parks and gardens, registered battlefields).
  - site:
      in:
      - historic-environment-record
      description: Sites recorded on the Staffordshire Historic Environment Record (HER) that the application
        will or may impact.
  - all:
    - any:
      - ref: major-development
      - condition:
          field: solar-panels
          value: true
          description: Significant infrastructure works, including all solar farm proposals.
    - discretionary
  - all:
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedgerow removal.
    - any:
      - site:
          in:
          - archaeological-priority-area
          description: An area of archaeological potential.
      - discretionary
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policies N8 and N9; NPPF paragraphs 207, 210 and 218;
  Design SPD 2018; The Hedgerow Regulations 1997
source-text: 'Any application which may affect a heritage asset or its setting Heritage Assets include:
  • Listed Buildings • Conservation Areas • Scheduled Monuments ... • Archaeological sites • Registered
  parks and gardens • Registered Battlefields Applications which will impact or have the potential to
  impact upon sites (below and above ground) as recorded on the Staffordshire Historic Environment Record
  (HER) Major applications or significant infrastructure works (including all solar farm proposals) where
  archaeological remains may survive ... Hedgerow removal within a significant historic landscape or an
  area of archaeological potential'
must-include:
- item: Proportionate to the importance of the heritage asset
  level: should
- item: A description of the significance of the heritage assets affected and the contribution of their
    setting
  level: must
- item: The level of harm likely to occur
  level: must
- item: Avoidance/mitigation measures to overcome the harm
  level: must
- item: As a minimum, reference to the Staffordshire Historic Environment Record
  level: must
- item: An assessment of the heritage assets themselves, using appropriate expertise where necessary
  level: must
- item: The sources considered and the expertise consulted
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 32-34. local requirement 17. 'Where archaeological
  remains may survive' and 'significant historic landscape' have no test the applicant can check, so those
  parts show as discretionary. Annex 2 asks householders for one where the development may affect a heritage
  asset or its setting; for listed building consent it is part of the design and access statement (Annex
  3).
review-status: unverified
field-status: {}
