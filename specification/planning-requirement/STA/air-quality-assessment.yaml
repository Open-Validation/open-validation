reference: air-quality-assessment
local-authority: STA
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: In (or adjacent to) an Air Quality Management Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New housing development.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1
          description: Industrial, commercial or leisure development.
  - condition:
      field: distance-to-busy-road
      operator: <=
      value: 50
      description: Development within 50m of the edge of the M6 carriageway.
  - discretionary
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy N5; NPPF paragraph 199
source-text: All applications for new housing development, industrial, commercial and leisure development
  in (or adjacent to) an Air Quality Management Area ... Where the development could itself result in
  the designation of an Air Quality Management Area Where the grant of planning permission would conflict
  with, or render unworkable, elements of a local authority’s Air Quality Action Plan Development within
  50m of the edge of M6 carriageway
must-include:
- item: Information that enables full consideration of the impact of the proposal on the air quality of
    the area
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 20-21. local requirement 5. 'Could itself
  result in an AQMA designation' and 'would conflict with an Air Quality Action Plan' have no measurable
  test, so they show as discretionary. The list adds that this may relate to agricultural applications
  such as livestock buildings because of Habitat Regulations Assessment requirements.
review-status: unverified
field-status: {}
