reference: recreation-facilities-assessment
local-authority: STA
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings are proposed.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy C7 and Appendix G; NPPF paragraph 98
source-text: When 10 or more dwellings are proposed
must-include:
- item: Plans showing any existing or proposed open space within or adjoining the site
  level: must
  required-if:
    site:
      in:
      - open-space
      description: Development within open spaces.
- item: 'Where open space is reduced or built on: an assessment showing it is surplus, or that the loss
    is replaced by equivalent or better provision, or that the development is for alternative sports and
    recreational provision whose benefits clearly outweigh the loss'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Open space would be reduced or built upon.
- item: 'Where open space or sport facilities are provided on or off site: their definition and a statement
    with the maintenance specification and how they will be installed and maintained for at least 10 years'
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: Open space or sport facilities are provided on or off site.
confidence: medium
notes: From the council's list (published January 2026), page 38-39. local requirement 24 (Open space
  assessment). Where provision cannot be made on site, a financial contribution through a Section 106
  agreement will be needed.
review-status: unverified
field-status: {}
