reference: location-plan
local-authority: STA
required-if:
  always: true
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include a location plan based on an up to date map. The proposed development
  should not be included on a location plan.
must-include:
- item: Typically at 1:1250 or 1:2500, scaled to fit A3 or A4 paper wherever possible
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location clear; generally at
    least two named roads, with surrounding buildings named or numbered
  level: should
- item: Application site edged with a single solid red line, including all land needed to carry out the
    development (access from a public highway, visibility splays, landscaping, car parking and open areas
    around buildings)
  level: must
- item: Blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: 'If based on an Ordnance Survey map: the Ordnance Survey copyright licence; HM Land Registry plans
    are not accepted'
  level: must
- item: The proposed development is not drawn on the location plan
  level: should
confidence: medium
notes: From the council's list (published January 2026), page 11-12. section 17. Annex 2 (householders)
  and Annex 3 (listed building consent) ask for the same.
review-status: unverified
field-status: {}
