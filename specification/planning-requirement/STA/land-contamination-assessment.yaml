reference: land-contamination-assessment
local-authority: STA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - contaminated-land
        description: Land that is, or may have been, affected by contamination.
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Conversion of agricultural buildings for other uses.
  - condition:
      field: solar-panels
      value: true
      description: A solar farm.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy N2; NPPF paragraphs 187 and 196
source-text: All applications (excluding Householders) where new development is proposed on land that
  is, or may have been, affected by contamination. All applications to convert agricultural buildings
  for other uses. All applications for solar farms
must-include:
- item: An extended assessment of contamination in line with the NPPF
  level: must
- item: Enough information to determine whether contamination exists, its nature and risks, and whether
    these can be reduced to an acceptable level
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 35. local requirement 19 (phase 1).
review-status: unverified
field-status: {}
