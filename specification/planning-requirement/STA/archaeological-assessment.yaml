reference: archaeological-assessment
local-authority: STA
required-if: discretionary
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policies N8 and N9; NPPF paragraphs 207, 210 and 218
source-text: Where an application site includes, or is considered to have the potential to include, heritage
  assets with an archaeological interest, a full Historic Environment Desk-based Assessment (DBA) should
  be submitted (where a Heritage Statement is deemed to be insufficient to adequately address historic
  environment concerns).
must-include:
- item: Considers all aspects of the historic environment (archaeology, built environment and historic
    landscape character)
  level: should
- item: Undertaken by an appropriately experienced organisation, following the relevant CIfA standard
    and guidance
  level: should
confidence: medium
notes: 'From the council''s list (published January 2026), page 33-34. part of local requirement 17 (Heritage
  statement). Shown as discretionary: it is needed only where a heritage statement is judged insufficient,
  and the list says the need for a full DBA should be discussed early. A field evaluation may be required
  where a DBA is insufficient.'
