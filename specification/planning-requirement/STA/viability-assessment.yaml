reference: viability-assessment
local-authority: STA
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The developer states that the standard planning obligations in the Plan for Stafford
      Borough will not be met.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: NPPF paragraph 59
source-text: Where developers state that standard planning obligations as set out in The Plan for Stafford
  Borough will not be met
must-include:
- item: Based on an 'open book' approach
  level: should
- item: Purchase cost of the site and when it was purchased
  level: must
- item: Detailed cost of construction, including any abnormal costs and off-site infrastructure
  level: must
- item: Predicted sale value / income from the finished site
  level: must
- item: Cost of section 106, including affordable housing costs
  level: must
- item: Percentage profit on cost, with and without the full section 106 obligations
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 53. local requirement 37.
review-status: unverified
field-status: {}
