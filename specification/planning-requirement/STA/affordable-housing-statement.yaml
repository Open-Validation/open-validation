reference: affordable-housing-statement
local-authority: STA
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings are proposed.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy C2; NPPF paragraphs 64-69; Circular 6/1998 Planning
  and Affordable Housing
source-text: When 10 or more dwellings are proposed
must-include:
- item: Demonstration that the development addresses the policy requirements on tenure type, house type
    and location (40% affordable at Stone, Eccleshall, Gnosall, Woodseaves, Barlaston, Tittensor and Yarnfield;
    30% at Stafford, Hixon, Great Haywood, Little Haywood/Colwich, Haughton, Weston and elsewhere)
  level: must
- item: Details of any Registered Provider associated with the application
  level: must
- item: An independent economic viability assessment where a lower figure is proposed
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A lower affordable housing figure is proposed.
confidence: medium
notes: From the council's list (published January 2026), page 18-19. local requirement 2.
review-status: unverified
field-status: {}
