  status: current
submission-standards:
- item: Every plan/drawing has a specific drawing number, revision where relevant, and title
  level: must
- item: File names of electronic drawings include the drawing number, revision and title (e.g. '001-A-proposedfloorplans')
  level: should
- item: Details on submitted plans are consistent, or the application will not be registered as valid
  level: must
- item: No documents in draft format; 'draft' annotations and watermarks removed before submission
  level: should
- item: Major applications include a document schedule listing all documents with their references and
    revisions
  level: must
- item: Plans sent electronically are PDF documents, so they can be measured
  level: must
- item: No 'do not scale' on any plan
  level: must
- item: All plans include a scale bar
  level: must
- item: Plans drawn to a suitable scale (recommended scales 1:1 to 1:2500)
  level: should
- item: 'Section 73/73A and s96A applications: amended plans annotated to identify the amendments (revision
    clouds recommended)'
  level: must
- item: An application cannot be made valid without the correct fee
  level: must
