reference: water-impact-assessment
local-authority: STA
required-if: discretionary
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policies N1 and N2; NPPF paragraph 187; Habitats Directive
  92/43/EEC; Water Environment (Water Framework Directive) Regulations 2017
source-text: All planning applications which are likely to, or might, have a detrimental impact on water
  quality
must-include:
- item: How the development will not have a detrimental impact on water quality, directly (pollution of
    surface water) or indirectly (overloading of Wastewater Treatment Works)
  level: must
- item: Site-specific analysis showing no adverse effect on environmentally significant sites, for development
    near or upstream of them
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - site-of-special-scientific-interest
      description: In proximity or upstream of environmentally significant sites (SACs, SSSIs and European
        Sites).
confidence: medium
notes: From the council's list (published January 2026), page 54. local requirement 39 (Water quality
  statement). 'Likely to, or might, have a detrimental impact' has no test, so it shows as discretionary.
review-status: unverified
field-status: {}
