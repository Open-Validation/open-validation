reference: town-centre-impact-assessment
local-authority: STA
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Main town centre uses not in an existing defined centre.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the Plan for Stafford Borough.
  - all:
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the Plan for Stafford Borough.
    - any:
      - all:
        - condition:
            field: settlement-boundary
            value: stafford
            description: Stafford.
        - condition:
            field: town-centre-use-floorspace
            operator: '>'
            value: 1000
            description: Retail, office or leisure development over 1,000 sq m gross floorspace.
      - all:
        - condition:
            field: settlement-boundary
            value: stone
            description: Stone.
        - condition:
            field: town-centre-use-floorspace
            operator: '>'
            value: 500
            description: Retail, office or leisure development over 500 sq m gross floorspace.
      - all:
        - site:
            in:
            - local-centre
            description: Local centres.
        - condition:
            field: town-centre-use-floorspace
            operator: '>'
            value: 300
            description: Retail, office or leisure development over 300 sq m.
  - all:
    - site:
        in:
        - town-centre
        - local-centre
        description: In an existing centre.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the Plan for Stafford Borough.
    - discretionary
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy E8; NPPF paragraphs 91-94
source-text: 'All applications for main town centre uses that are not in an existing defined centre and
  are not in accordance with the Plan for Stafford Borough Applications for retail, office and ... leisure
  developments, which are not in accordance with the Plan for Stafford Borough, at: • Stafford (over 1,000sqm
  gross floorspace) • Stone (over 500sqm gross floorspace) • Local centres (over 300sqm) Applications
  in an existing centre, not in accordance with the Plan for Stafford Borough, which would substantially
  increase the attraction of the centre to an extent that the development could ... impact on other centres'
must-include:
- item: The impact on existing investment within centres
  level: must
- item: The impact on the vitality and viability of town centres
  level: must
- item: The impact on in-centre trade/turnover and trade in the wider area
  level: must
- item: Current and future consumer expenditure capacity in the catchment area
  level: must
- item: Whether the proposal is of an appropriate scale and its impact on locally important centres
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 47-49. local requirement 32 (Town centre
  use / Retail impact assessment). An in-centre proposal that 'could impact on other centres' is a judgement,
  so that part shows as discretionary.
review-status: unverified
field-status: {}
