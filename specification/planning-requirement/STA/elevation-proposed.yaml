reference: elevation-proposed
local-authority: STA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works (new buildings or extensions).
  - condition:
      field: external-alterations
      value: true
      description: The proposal involves external alterations.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Listed-Building-Consent-Quick-Guide-Annex-3_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevations All applications where extensions of external alterations
  are proposed
must-include:
- item: Drawn to a suitable scale, typically 1:50 or 1:100 (1:50 for listed building consent)
  level: must
- item: All sides of the proposed development, including blank (featureless) elevations
  level: must
- item: The proposed works in relation to what is already there, including the full elevation of any existing
    building to be altered or extended
  level: must
- item: The property boundary, where the property or development attaches to another building not within
    the boundary
  level: must
- item: 'Where it adjoins or is close to another building: the relationship between the buildings and
    the positions of openings on each'
  level: should
- item: Any existing buildings or walls to be demolished
  level: must
- item: The proposed building materials
  level: must
- item: 'In a conservation area: the style, materials and finish of all windows and doors'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: 'For listed building consent: the style and materials of all windows, doors, roof lights and other
    openings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2026), page 13. section 19; 'when required' wording
  from Annex 3 (listed building consent), page 2.
review-status: unverified
field-status: {}
