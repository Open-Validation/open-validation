reference: travel-plan
local-authority: STA
required-if: discretionary
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policy T1; NPPF paragraph 118
source-text: All applications likely to generate significant traffic movements
must-include:
- item: Agreed in principle with Staffordshire County Council Highways before the application is submitted
  level: must
- item: How the transport implications of the development will be managed to ensure minimal environmental,
    social and economic impacts
  level: must
- item: How traffic implications will be managed, including the travel plan co-ordinator, management arrangements
    and the development timetable
  level: must
- item: Activities for marketing and promotion of the plan to occupiers, users, visitors and residents
  level: must
confidence: medium
notes: From the council's list (published January 2026), page 50-51. local requirement 34 (a draft travel
  plan). No threshold is given ('likely to generate significant traffic movements'; the list points to
  the indicative thresholds in Appendix B of 'Guidance on Transport Assessment' (March 2007)), so it shows
  as discretionary. A travel plan may need a monitoring agreement secured through a legal obligation.
review-status: unverified
