reference: roof-plan-proposed
local-authority: STA
required-if:
  any:
  - condition:
      field: complex-roof-design
      value: true
      description: Not all of the roof is visible on the elevation drawings.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: solar-panels
        value: true
        description: Roof mounted solar panels on a listed building.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A roof plan is required when not all of a roof is visible on the elevation drawings and must
  show the shape of the proposed roof.
must-include:
- item: The shape of the proposed roof
  level: must
- item: Drawn to a suitable scale, typically 1:50, 1:100 or 1:200 (1:50 for listed building consent)
  level: must
- item: Roofing materials, where relevant
  level: must
- item: Roof lights/vents and their location, where relevant
  level: must
- item: Any overhang, so measurements are consistent across plans
  level: should
- item: 'For listed building consent: roof lights, dormers, sun tubes, flues, parapets, terraces and the
    position of all roof mounted solar panels'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2026), page 15. section 22. Annex 3 (listed building
  consent), page 2, also asks for roof plans for all applications for roof mounted solar panels.
review-status: unverified
field-status: {}
