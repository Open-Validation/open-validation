reference: flood-risk-assessment
local-authority: STA
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 1 hectare or more in Flood Zone 1.
  - site:
