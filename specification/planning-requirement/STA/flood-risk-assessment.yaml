reference: flood-risk-assessment
local-authority: STA
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood zone 1 site of 1 hectare or above.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood zone 1 site of 1 hectare or above.
  - site:
      in:
      - flood-risk-zone
      description: Flood zones 2 or 3 encroach into the application site.
  - all:
    - site:
        in:
        - critical-drainage-area
        description: Designated critical drainage area notified by the Environment Agency (Rising Brook).
    - condition:
        field: minor-development
        value: false
        description: Development other than minor development.
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: The Plan for Stafford Borough 2011-2031 policies N1 and N2; NPPF paragraphs 44, 172, 173 and 181
source-text: In flood zone 1 any development site of 1 hectare or above All developments where flood zones
  2 or 3 encroach into the application site Any development other than minor ... development in a designated
  critical drainage area which has been notified to the Local Planning Authority by the Environment Agency
  (Rising Brook)
must-include:
- item: Specific to the site and development proposal
  level: must
- item: Identifies and assesses the risks of all forms of flooding to and from the development and how
    they will be managed, taking climate change into account
  level: must
- item: The estimated flood level for the development, taking account of climate change over its lifetime
  level: must
- item: Finished floor levels, where relevant
  level: must
- item: Any flood resistance and resilience measures
  level: must
- item: Any supporting plans and drawings
  level: must
- item: Any other information required by the relevant standing advice
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems including SuDS, and safe access to and from the development
    in areas at risk from flooding
  level: must
- item: A surface water construction management plan for the construction phase
  level: must
- item: Prepared with reference to the local plan and any Strategic Flood Risk Assessment
  level: must
- item: Part of the Environmental Statement when one is required
  level: must
  required-if:
    condition:
      field: eia-development
      value: true
      description: An Environmental Statement is required.
- item: Demonstration that a sequential approach to site selection has been taken and there are no more
    suitable sites
  level: must
- item: 'Householders in flood zone 2 or 3: the Environment Agency template'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Complete the Environment Agency template
confidence: medium
notes: From the council's list (published January 2026), page 26-28. local requirement 13. Annex 2 (householders)
  asks for an assessment if the property is in Flood Zone 2 or 3. Householder development can use the
  simplified Environment Agency standing advice.
review-status: unverified
field-status: {}
