reference: habitat-baseline
local-authority: STA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.staffordbc.gov.uk/sites/default/files/cme/DocMan1/Development/Validation-Criteria/Planning-Application-Validation-Guidance-and-Local-Validation-Criteria_0.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990; Environment Act 2021
source-text: 'Planning permission, where not exempt, is subject to the general biodiversity gain condition.
  All applications shall be supported by a statement as to whether the applicant believes that planning
  permission, if granted, would be subject to the biodiversity gain condition and, if so, the following
  information as a minimum:'
must-include:
- item: A plan drawn to an identified scale, with the direction of north, showing onsite habitat on the
    date of application (or an earlier date) and any irreplaceable habitat
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat on the application land.
confidence: medium
notes: From the council's list (published January 2026), page 15-16. section 23. The rule follows the
  law (exempt applications are exempt), although the list says 'All applications'.
review-status: unverified
field-status: {}
