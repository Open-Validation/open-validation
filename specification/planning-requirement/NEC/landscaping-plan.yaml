reference: landscaping-plan
local-authority: NEC
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - reserved-matters
        - change-of-use
    - condition:
        field: outside-urban-area
        value: true
        description: In the rural area.
    - site:
        in:
        - green-corridor
        description: In or adjacent to the Green Heritage Network.
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 130, 145, 153, 155, 174-176 and 185; CSS Strategic Aim 13 and Policies ASP6, CSP1
  and CSP4; Local Plan Policies N14 and N16-N22; CHMAWNP Policies NE1 and HG1; Betley, Balterley and Wrinehill
  Neighbourhood Development Plan Policy BBW1
source-text: Applications involving strategic major development1 ... Applications (other than for householder
  development) in or adjacent to the Green Heritage Network and in the rural area.
must-include:
- item: A Landscape Masterplan fully integrated with proposals for ecological enhancement
  level: must
- item: Landscaping zones and a schedule of likely species
  level: must
- item: Proposals for the long-term management and maintenance of landscaped areas
  level: must
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 21-22. Item 15 'Landscape
  Master Plan'. 'Strategic major development' is not defined, so that part shows as discretionary. The
  Green Heritage Network and rural area are on the Local Development Framework Proposals Map.
review-status: unverified
field-status: {}
