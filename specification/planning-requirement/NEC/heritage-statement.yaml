reference: heritage-statement
local-authority: NEC
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - historic-environment-record
      - park-and-garden
      - locally-listed-building
      description: In or next to a Conservation Area; affecting a listed building, archaeological asset,
        scheduled monument, the registered parks and gardens at Keele and Maer Hall, or a building on
        the Register of Locally Important Buildings and Structures.
  - all:
    - condition:
        field: pre-1900-building
        value: true
        description: Historic Urban Character Areas (Newcastle Extensive Urban Survey 2009; Betley Historic
          Character Assessment 2012) or a Historic Farmstead.
    - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 189-208; CSS Strategic Aim 13 and Policy CSP2; LNP Policy LNPP2; Local Plan Policies
  B2-B7 and B9-B14; CHMAWNP Policy DC1; Madeley Neighbourhood Development Plan Policy HOU1; Betley, Balterley
  and Wrinehill Neighbourhood Development Plan Policy BBW1
source-text: All developments that have the potential to impact on a designated and nondesignated heritage
  asset (or the setting) which includes; ... proposals in or adjacent to a designated Conservation Area
  ... proposals directly or indirectly affecting a statutory Listed Building (Grade I, II* or II)
must-include:
- item: The significance of the heritage asset(s) affected and the contribution of the setting
  level: must
- item: The statutory list description or historic environment record
  level: must
- item: How the proposal contributes positively to the special interest, character and appearance of the
    asset
  level: must
- item: The impact of loss or alteration of features (such as walls) that contribute positively, and of
    any new buildings
  level: must
- item: Justification for any demolition of all or part of the asset
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition is proposed.
- item: Justification for the scale, massing, siting, layout, design and materials, and for the proposed
    use (traffic, parking, activity)
  level: must
- item: A schedule of works for new or restored features of architectural and historic importance
  level: must
  required-if: discretionary
- item: Mitigation for loss of all or part of an asset, such as recording or relocation
  level: must
  required-if: discretionary
- item: 'Within or adjacent to a conservation area: the impact on its character and appearance and on
    views into and out of it'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
- item: The Historic Environment Record (HER) consulted as a minimum
  level: must
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 16-19. Item 12 'Heritage
  Asset Statement'. Historic Urban Character Areas and Historic Farmsteads have no map field here, so
  they show as discretionary. The information can be included in the design and access statement when
  one is required.
review-status: unverified
field-status: {}
