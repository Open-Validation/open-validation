reference: recreation-facilities-assessment
local-authority: NEC
required-if:
  any:
  - site:
      in:
      - open-space
      description: Affects existing areas of open space or sport/recreational facilities.
  - condition:
      field: loss-of-open-space
      value: true
      description: Affects existing open space.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 8, 84, 93, 98-103, 123 and Annex 2; CSS Policy CSP5; LNP Policies LNPP3, LNPS1
  and LNPS3; Local Plan Policy C4; Madeley Neighbourhood Development Plan Policy CF1; Betley, Balterley
  and Wrinehill Neighbourhood Development Plan Policy BBW10; CHMAWNP Policy HG3
source-text: Any development affecting existing areas of open space, sport/recreational facilities. ...
  Any development involving 10 or more dwellings.
must-include:
- item: 'Where existing open space or facilities are affected and the council has no up-to-date assessment:
    an independent assessment showing the land or buildings are surplus'
  level: must
  required-if:
    any:
    - site:
        in:
        - open-space
        description: Existing open space affected.
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space.
- item: Plans of existing or proposed open space within or adjoining the site, with access links, equipment,
    facilities and landscaping
  level: must
- item: 'Where playing field land is affected: current and recent users; fit with needs assessments or
    sports strategy and benefit to sport; specifications of ancillary facilities and any artificial pitch;
    delivery and quality of any replacement area'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing field land.
- item: 'Where open space is provided on site or in kind: a maintenance specification and how it will
    be installed and maintained for at least 10 years'
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: Open space provided on site or in kind.
- item: 'Where open space adjoins an operational railway: fencing details to avoid trespass'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 28-30. Item 21 'Open
  Space Assessment'. The list also names rural developments of 10+ dwellings over 1,000 (printed 'm3'),
  which the 10-dwelling rule already covers.
review-status: unverified
field-status: {}
