reference: lighting-assessment
local-authority: NEC
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting, including floodlighting and lighting for a publicly accessible development.
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        - site-of-special-scientific-interest
        - local-nature-reserve
        - local-wildlife-site
        description: Near a listed building, in a conservation area, or in or near a site of nature conservation
          value (SSSI, LNR, SINC, SLINC, PSI).
    - condition:
        field: adjoins-residential-property
        value: true
        description: In the vicinity of a residential property.
    - condition:
        field: near-watercourse
        value: true
        description: Adjacent to or close to a canal corridor.
    - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraph 185; CHMAWNP Policy CC5
source-text: 'Proposals for external lighting including floodlighting and lighting in connection with
  a publicly accessible development or proposals: ... in the vicinity of a residential property, ... in
  the vicinity of a listed building, ... in a conservation area, ... in or in the vicinity of a site of
  nature conservation value (SSSI, LNR, SINC, SLINC, PSI),'
must-include:
- item: Designed, maintained and operated within the maximum values for the appropriate Zone in table
    2 of the ILP Guidance Notes for the Reduction of Obtrusive Light GN01:2011
  level: must
- item: Why the scheme is needed, and the frequency and hours of use in summer and winter
  level: must
- item: A site survey of the area to be lit relative to its surroundings, with existing and proposed landscaping
    to mitigate impacts
  level: must
- item: Make and model of luminaires/floodlights; size, type and number of lamps; mounting height; location
    and orientation
  level: must
- item: 'A technical report by a qualified lighting engineer or the lighting company: type of lights,
    performance, height and spacing of columns'
  level: must
- item: Upward Light Ratio (sky glow) as a percentage of luminaire flux
  level: must
- item: Potential light intrusion into windows (vertical illuminance in lux) and glare (intensity in candelas)
  level: must
- item: Ground level lux levels at the site boundary and for 25 metres outside it
  level: must
- item: Building luminance in candelas per square metre
  level: must
  required-if: discretionary
- item: Effects on light-sensitive wildlife, full horizontal cut-off, driver distraction and impact on
    nearby dwellings
  level: must
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 23-24. Item 17. Areas
  that are currently unlit and contribute to dark corridors for wildlife show as discretionary, as does
  a canal corridor where the distance 'may vary from site to site'.
review-status: unverified
field-status: {}
