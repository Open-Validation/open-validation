reference: biodiversity-survey-report
local-authority: NEC
required-if:
  any:
  - all:
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of buildings or structures.
      - condition:
          field: involves-change-of-use
          value: true
          description: Conversion of buildings or structures.
      - condition:
          field: roof-alteration
          value: true
          description: Modification of buildings, especially roof voids.
    - any:
      - condition:
          field: agricultural-building-reuse
          value: true
          description: Agricultural buildings (farmhouses, barns).
      - condition:
          field: potential-roost-features
          value: true
          description: Buildings with weather boarding, hanging tiles or soffit boxes, gable ends or slate
            roofs, near woodland, water, tree lines or hedges.
      - condition:
          field: pre-1900-building
          value: true
          description: Pre-1914 buildings, or pre-1960 detached buildings near woodland or water.
      - discretionary
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Lighting of churches and listed buildings, or floodlighting of green space within
          50 m of woodland, water, hedgerows or tree lines.
    - discretionary
  - condition:
      field: near-woodland
      value: true
      description: Affects woodland.
  - condition:
      field: hedgerows-affected
      value: true
      description: Affects field hedgerows or lines of trees connected to woodland or water.
  - condition:
      field: veteran-trees
      value: true
      description: Affects mature and veteran trees older than 100 years.
  - condition:
      field: protected-species
      value: true
      description: Buildings, structures, features or locations where protected or priority species are
        known or strongly suspected.
  - any:
    - all:
      - ref: major-development
      - condition:
          field: distance-to-pond
          operator: <=
          value: 500
          description: A pond within 500 m of a major development.
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development (not major, change of use or householder).
      - condition:
          field: distance-to-pond
          operator: <=
          value: 250
          description: A pond within 250 m of a minor development.
  - condition:
      field: near-watercourse
      value: true
      description: Within 50 m of rivers, streams, canals, lakes, swamps, reedbeds or other aquatic habitats.
  - condition:
      field: derelict-site
      value: true
      description: Derelict land (brownfield), allotments, mature gardens or railway land.
  - condition:
      field: semi-natural-habitat-impact
      value: true
      description: Arable, pasture, semi-natural habitats and uncultivated land.
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines and farms.
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: Previously undeveloped or long abandoned site.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.25
          description: Over a quarter of a hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.25
          description: Over a quarter of a hectare.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - national-nature-reserve
      - local-nature-reserve
      - local-wildlife-site
      - priority-habitat
      description: Protected sites, designated areas (such as Sites of Biological Importance) or habitats
        of principal importance.
  - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 8, 43, 120, 145, 153, 174-176, 179-182 and Annex 2; CSS Policy CSP4; Local Plan
  Policies N2, N3 and N4; CHMAWNP Policy NE1; Madeley Neighbourhood Development Plan Policy NE1; Betley,
  Balterley and Wrinehill Neighbourhood Development Plan Policy BBW1
source-text: 'If the application includes the modification, conversion, demolition of buildings and structures
  (especially roof voids) involving the following: ... Proposals involving lighting of churches and listed
  buildings. ... Proposals affecting woodland, or field hedgerows and/or lines of trees with obvious connectivity
  to woodland or water bodies. ... Where there are no existing great crested newt records: ponds within
  500 m of Major development1 proposals; ponds within 250 m of or Minor proposals2. Where there are local
  records and no barriers to movement all ponds within 500 m of all proposal sites. ... Proposals affecting
  or within 50 m of rivers, streams, canals, lakes, swamps, reedbeds or other aquatic habitats. ... Proposals
  for wind turbines and farms. ... Planning applications that may affect protected sites or species, habitats
  or species of principal importance, or significant geological/ geomorphological features require submission
  of survey and assessment information to show how the proposed development may affect these environmental
  assets.'
must-include:
- item: A Preliminary Ecological Appraisal of the site
  level: must
- item: Impact on the ecological condition of watercourses and water bodies
  level: must
- item: A full ecological report with the likely impact and mitigation, if the initial assessment requires
    it
  level: must
  required-if: discretionary
- item: Reference to international sites (SPAs, SACs, Ramsar), SSSIs, NNRs, LNRs, local wildlife sites,
    RIGS, protected species, biodiversity habitats and species, and geological features
  level: must
- item: 'Where an internationally or nationally designated site is likely to be affected: the interest
    features that may be affected, a full assessment of likely effects and avoidance/mitigation'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      description: An internationally or nationally designated site is likely to be affected.
- item: Surveys at an appropriate time of year, by a reputable, experienced and suitably licensed ecological
    consultant, following published guidance
  level: must
- item: Description of the proposal (type, scale, location, timing, methods, with plans); thorough survey
    of the site and other areas affected; clear impact assessment; proportionate, site-specific, feasible
    mitigation strategy
  level: must
- item: Evidence that adverse impacts are avoided, fully mitigated or compensated, resulting in net gain,
    preferably shown with the Defra metric
  level: must
- item: Any additional protected species surveys the initial reports call for (the application is not
    valid until they are done)
  level: must
- item: A Water Framework Directive risk assessment where the development directly affects the banks of
    a river or stream
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: Directly affects the banks of a river or stream.
- item: Whether invasive species are present, with proposals for control/eradication and to prevent spread
  level: should
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 4-8. Item 4 'Biodiversity
  survey and report'. The list's long set of triggers (building types and distances for bats, trees with
  holes or girth over 1 m, quarries and cliff faces, newt ponds and more) is summarised; the parts without
  a map field, and the general 'may affect protected sites or species', show as discretionary. 'Major'
  is defined in the list's footnote as 10+ dwellings (or 0.5 ha) or 1,000 sq m (or 1 ha), the national
  definition.
review-status: unverified
field-status: {}
