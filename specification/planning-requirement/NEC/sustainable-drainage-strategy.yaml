reference: sustainable-drainage-strategy
local-authority: NEC
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - condition:
          field: involves-change-of-use
          value: false
          description: Not a change of use.
      - condition:
          field: impermeable-area-increase
          operator: '>'
          value: 0
          description: A change of use increasing the impermeable area.
  - all:
    - site:
        in:
        - critical-drainage-area
        description: In a critical drainage area.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Land of 0.5 ha or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 0.5
          description: Land of 0.5 ha or more.
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Development in flood risk locations.
  - all:
    - condition:
        field: new-build
        value: true
        description: New buildings or dwellings.
    - condition:
        field: near-watercourse
        value: true
        description: Within canal buffer zones.
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 8, 34 and 174; CSS Policy CSP3; CHMAWNP Policy NE2; Betley, Balterley and Wrinehill
  Neighbourhood Development Plan Policy BBW1
source-text: Major developments1 (except a change of use where no increase in impermeable area is proposed)
  ... Development on land of 0.5ha or more in critical drainage areas ... Developments in flood risk locations
  ... A Sustainable Drainage Scheme/ Strategy or a Drainage Scheme/Strategy where a sustainable drainage
  system is not proposed, is required for all major development1.
must-include:
- item: How SuDS are incorporated, consistent with planning policy, and how they will be maintained and
    protected in the long term
  level: must
  required-if:
    ref: major-development
- item: How surface water will be managed sustainably under current and future conditions, with evidence
    such as infiltration results and drainage calculations, plans and drawings
  level: must
- item: How the drainage components will be constructed, managed and maintained for the lifetime of the
    development
  level: must
- item: Current drainage system, capacity and discharge rate
  level: must
- item: Infiltration tests to BRE 365
  level: must
- item: 'New surface water system: capacity, storage and discharge rate; proposed outfalls'
  level: must
- item: Existing operational surface water connections on previously developed sites
  level: must
  required-if:
    condition:
      field: previously-developed-land
      value: true
      description: Previously developed site.
- item: Details of adoption, and maintenance and management of un-adopted sections
  level: must
- item: Topographical changes; other mitigation such as finished floor levels
  level: must
- item: Compliance with applicable SuDS guidance
  level: must
- item: 'For phased schemes: access to/from interconnecting phases'
  level: must
  required-if: discretionary
- item: Whether culverts can take increased flows without surcharging; whether discharge to canals is
    feasible
  level: should
- item: A full investigation of the surface water hierarchy, with evidence for discounting preferred options
  level: must
- item: 'Near an operational railway: no SuDS infiltration within 30 m of the railway boundary, closed
    sealed pipes, ponds/basins as far away as possible (Network Rail review)'
  level: must
  required-if: discretionary
- item: 'Near canal assets: their protection; soakaways and attenuation basins generally at least 10 m
    from the canal edge'
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: Adjacent to canal assets.
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 12-14. Item 9 'Foul
  and Surface Water Drainage Scheme and Sustainable Drainage'. Uses MHCLG's retired sustainable-drainage-strategy
  id. Canal buffer zones are read as 'near a watercourse'. 'Major' is defined in the list's footnote as
  10+ dwellings (or 0.5 ha) or 1,000 sq m (or 1 ha), the national definition.
review-status: unverified
field-status: {}
