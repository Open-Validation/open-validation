reference: flood-risk-assessment
local-authority: NEC
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 1 hectare or greater in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 1 hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: New development (including minor development and change of use) in Flood Zone 2 or
        3.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 with critical drainage problems notified by the Environment Agency.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Development or a change of use to a more vulnerable class.
    - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 34, 43, 120, 152-169 and Annex 2; CSS Policy CSP3
source-text: 'A site-specific Flood Risk Assessment (FRA) is required for: ... All proposals of 1 hectare
  or greater in Flood Zone 1; ... All proposals for new development (including minor development and change
  of use) in Flood Zones 2 and 3, or in an area within Flood Zone 1 which has critical drainage problems
  (as notified to the local planning authority by the Environment Agency); and ... Where proposed development
  or a change of use to a more vulnerable class may be subject to other sources of flooding.'
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
- item: That the development is safe and where possible reduces flood risk overall
  level: must
- item: Whether it will increase flood risk elsewhere
  level: must
- item: The measures proposed to deal with these effects and risks, including sustainable drainage and
    flood resilience
  level: must
- item: Consideration of impacts from and on canals
  level: must
- item: 'Where adjacent to an operational railway: the potential to increase the risk of flooding, pollution
    and soil slippage on the railway'
  level: must
  required-if: discretionary
- item: The eleven minimum requirements for FRA content set out in PPG
  level: must
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 10-11. Item 8. Sequential
  and Exception tests may be required in Flood Zones 2 and 3 (not for changes of use), before the detailed
  FRA. Other sources of flooding for more vulnerable uses show as discretionary.
review-status: unverified
field-status: {}
