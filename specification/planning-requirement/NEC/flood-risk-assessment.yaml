reference: flood-risk-assessment
local-authority: NEC
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: All new development in Flood Zones 2 and 3, including minor development and changes
        of use.
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area.
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
source-text: Sites of 1ha+ in Flood Zone 1; all new development in Flood Zones 2 and 3 (including minor
  development and changes of use)
must-include:
- item: Whether the proposed development is likely to be affected by current or future flooding from any
    source
  level: must
- item: That the development is safe and where possible reduces flood risk overall
  level: must
- item: Whether it will increase flood risk elsewhere
  level: must
- item: The measures proposed to deal with these effects and risks
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted ''what information is required'' instead of the trigger.
  Critical drainage areas are from the audit''s summary. It applies to householder applications too (audit
  issue 3).'
review-status: unverified
field-status: {}
