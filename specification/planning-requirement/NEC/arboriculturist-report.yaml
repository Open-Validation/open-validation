reference: arboriculturist-report
local-authority: NEC
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees subject to a Tree Preservation Order on or overhanging the site.
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or overhanging the site.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within or adjacent to the site that could influence or be affected by the development
        (including street trees).
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 174, 180 and Annex 2; Local Plan Policies N12, N14 and B15
source-text: Any site where there are trees which are the subject of a Tree Preservation Order either
  on or overhanging the application site ... Any site within a Conservation Area where there are trees
  either on or overhanging the application site ... Any site where there are trees within the application
  site, or on land adjacent to it that could influence or be affected by the development (including street
  trees).
must-include:
- item: 'Tree survey: all trees numbered on the site plan, with species, age, condition, works proposed
    and need for works on a schedule'
  level: must
- item: 'Schedule: reference number, species, height, stem diameter at 1.5 m, branch spread at the four
    cardinal points (on the survey plan), crown clearance, age class, physiological condition, preliminary
    management recommendations, remaining contribution in years, category rating'
  level: must
- item: An Arboricultural Impact Assessment to BS5837:2012 paragraph 5.4, recommending mitigation where
    necessary
  level: must
- item: Retained trees and Root Protection Areas shown on the proposed layout
  level: must
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 35-36. Item 30 'Tree
  Survey/Arboricultural Impact Assessment/Retained Trees and Root Protection Areas (BS5837:2012)'.
review-status: unverified
field-status: {}
