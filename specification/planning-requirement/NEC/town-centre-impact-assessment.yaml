reference: town-centre-impact-assessment
local-authority: NEC
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses not in an existing centre and not in accordance with the Development
        Plan.
  - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 86-91 and Annex 2; CSS Policy ASP5; LNP Policy LNPE2; Local Plan Policy R12
source-text: Main town centre uses that are not in an existing centre and not in accordance with the Development
  Plan other than small scale rural offices or other small scale rural development.
must-include:
- item: A sequential assessment
  level: must
- item: An impact assessment for retail, leisure and office development over 2,500 sq m (or any Development
    Plan threshold)
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail, leisure or office floorspace over 2,500 sq m.
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 34. Item 27 'Town Centre
  Uses – Evidence to accompany applications'. 'Small scale rural offices or other small scale rural development'
  are excluded but not defined, so it shows as discretionary.
review-status: unverified
field-status: {}
