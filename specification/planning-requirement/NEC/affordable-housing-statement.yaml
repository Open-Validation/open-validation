reference: affordable-housing-statement
local-authority: NEC
required-if:
  any:
  - all:
    - condition:
        field: outside-urban-area
        value: false
        description: In the urban area (Local Development Framework Proposals Map).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 or more dwellings.
  - all:
    - condition:
        field: outside-urban-area
        value: true
        description: In the rural area (Local Development Framework Proposals Map).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Combined gross floorspace of more than 1,000 (stated as 'm3').
  - condition:
      field: rural-exception-housing
      value: true
      description: Affordable housing on a rural exceptions site.
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 62-65, 78, 149 and Annex 2; CSS Policy CSP6; CHMAWNP Policy HG2; Madeley Neighbourhood
  Development Plan Policy HOU2
source-text: Urban area - developments of 15 or more dwellings as designated in the CSS. ... Rural area
  – developments for 10 dwellings or more and which have a combined gross floorspace of more than 1,000m3
  ... Where the proposal is for affordable housing on a “rural exceptions site.”
must-include:
- item: The number of residential units
  level: must
- item: The mix of units, with the number of habitable rooms and/or bedrooms
  level: must
- item: The floor space of habitable areas
  level: must
- item: A full explanation where different levels or types of affordability or tenure are proposed for
    different units
  level: must
  required-if: discretionary
- item: Details of any RSL acting as partners in the development
  level: must
confidence: medium
notes: 'From the council''s list (dated 1 October 2023, still titled ''Draft''), page 1. Item 1. The rural
  threshold is printed as ''1,000m3'' (probably square metres). Urban and rural areas are shown on the
  Local Development Framework Proposals Map. Guidance: Affordable Housing SPD.'
review-status: unverified
field-status: {}
