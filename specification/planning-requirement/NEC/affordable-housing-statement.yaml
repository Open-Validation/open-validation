reference: affordable-housing-statement
local-authority: NEC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Urban area - 15 or more dwellings.
  - all:
    - site:
        in:
        - rural-area
        description: The site is in the rural area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: Rural area - 10 or more dwellings.
      - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
confidence: medium
notes: 'From the audit (missing_requirement): urban 15+ dwellings; rural 10+ dwellings or more than 1,000m3;
  rural exception sites. The volume and exception-site cases have no field, so they are shown as officer
  discretion.'
