reference: noise-assessment
local-authority: NEC
required-if:
  any:
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
  - condition:
      field: noise-generating-use
      value: true
      description: Likely to have an impact on noise and/or vibration-sensitive development or locations.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Introduces or exposes noise/vibration-sensitive development where noise or vibration
        is likely to have an adverse impact.
  - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 174 and 185; CSS Policy SP3
source-text: All applications involving wind turbines. ... All applications likely to have an impact on
  noise and/or vibration-sensitive development(s), All applications likely to have an impact on noise
  and/or vibration-sensitive locations. ... All applications that introduce or expose noise and/or vibration-sensitive
  development(s) into areas and locations where noise and/or vibration is likely to have an adverse impact.
must-include:
- item: Recognised assessment protocols, or an approach agreed in advance with Environmental Health
  level: must
- item: Conducted by an appropriately qualified and experienced acoustic consultant
  level: must
- item: The potential sources of noise and how they may harm local amenity
  level: must
- item: Mitigation, first by optimising design and layout; recommendations incorporated into the submitted
    plans
  level: must
- item: 'For residential development: in accordance with ProPG Planning & Noise'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: 'Where windows must be kept shut for internal noise levels: an overheating assessment to CIBSE
    TM59, with ventilation to the Acoustics, Ventilation and Overheating Guidance'
  level: must
  required-if: discretionary
- item: 'Agent of change: the effects of existing businesses and facilities (noise, dust, odour, vibration),
    including permitted activities'
  level: must
  required-if: discretionary
- item: Canal boat moorings considered near canals
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: Near a canal.
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 25-27. Item 20 'Noise
  and Vibration Assessment and sound insulation details/ventilation to avoid overheating where windows
  need to be kept shut'. Whether an impact is 'likely' is a judgement, so it also shows as discretionary.
review-status: unverified
field-status: {}
