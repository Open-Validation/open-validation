reference: archaeological-assessment
local-authority: NEC
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - historic-environment-record
      - archaeological-priority-area
      description: A scheduled monument or other archaeological remains.
  - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 189-208; Ancient Monuments and Archaeological Areas Act 1979
source-text: Where the development has the potential to impact archaeological remains, as a minimum, a
  desk based assessment should be provided summarising the following;
must-include:
- item: Justification for development affecting a Scheduled Monument or other significant archaeological
    remains
  level: must
- item: The historic development of the site and surrounding area
  level: must
- item: The nature and extent of above- and below-ground remains known or likely to be present
  level: must
- item: The likely impact of the development on surviving assets
  level: must
- item: Proposed mitigation (if any)
  level: must
- item: A proposed written scheme of investigation where field evaluation is needed
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (dated 1 October 2023, still titled ''Draft''), page 17. Part of item
  12 ''Heritage Asset Statement'': the desk-based assessment required where archaeological remains may
  be affected. ''Potential to impact'' is a judgement, so it also shows as discretionary.'
review-status: unverified
field-status: {}
