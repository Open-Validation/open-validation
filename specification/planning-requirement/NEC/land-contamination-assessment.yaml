reference: land-contamination-assessment
local-authority: NEC
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - change-of-use
  - any:
    - site:
        in:
        - contaminated-land
        description: Land contamination can reasonably be expected on or next to the site.
    - site:
        in:
        - near-landfill-site
        description: Active or closed landfill within 250 metres.
    - condition:
        field: industrial-site
        value: true
        description: Industrial land, petrol stations, waste sites, transport depots and yards.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Agricultural to residential conversions.
    - discretionary
source-url: https://www.newcastle-staffs.gov.uk/downloads/file/1938/draft-list-of-local-validation-requirements-1-october-2023-
policy: NPPF paragraphs 183, 184 and Annex 2; Local Plan Policies E4, E5, E11 and H9
source-text: All applications (excluding householder developments) where land contamination can reasonably
  be expected to be found on or adjacent to the development site (e.g. activities for which DOE industry
  profiles have been developed, active or closed landfill sites within 250 metres of the development site,
  coal seams under the development site, areas of infilled land, petrol stations, industrial land, waste
  sites, transport depots and yards, cleared sites, agricultural to residential conversions).
must-include:
- item: A desk study
  level: must
- item: A site reconnaissance (walk over)
  level: must
- item: A preliminary risk assessment identifying sources, pathways and receptors, with a conceptual site
    model
  level: must
- item: Consideration of canals as potentially sensitive receptors
  level: should
confidence: medium
notes: From the council's list (dated 1 October 2023, still titled 'Draft'), page 20. Item 13 'Land Contamination
  Assessment – Preliminary Risk Assessment'. Coal seams, infilled land and cleared sites are also named;
  whether contamination 'can reasonably be expected' is a judgement, so it also shows as discretionary.
review-status: unverified
field-status: {}
