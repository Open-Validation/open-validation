reference: elevation-proposed
local-authority: PLY
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes an elevation.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
  - application-type:
      in:
      - advertising
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevations – all existing and proposed to be shown at a metric scale of 1:50 or 1:100 (unless
  retrospective). ... All elevations of proposed development must be shown, with corresponding existing
  elevation drawings. For applications that propose no changes to any elevations, and clearly state that
  this is the case, elevation drawings are not required.
must-include:
- item: All proposed elevations at a metric scale of 1:50 or 1:100
  level: must
- item: Measured dimensions
  level: should
- item: 'For listed building consent: detailed drawings at 1:20 of all the works (for example new doors,
    windows, door and window furniture, shop fronts, panelling, fireplaces, plaster mouldings and other
    decorative details) and their relationship to adjacent existing structures/details'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Detailed drawings, which may include plans, elevations, and vertical and horizontal sections,
    must be to a scale of 1:20
- item: 'For advertisements: the proposed advertisement at 1:20 or 1:50, showing its size and position
    on the land or building, how it is attached or stands, materials and colours, height above ground,
    any projection from the building, and the method and colour(s) of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: 'The drawing of the proposed advertisement must: Be at a scale of 1:20 or 1:50, show the
    size of the advertisement and its position on the land or the building in question'
confidence: medium
notes: From the council's list (published February 2025), General advice, sections 3.3, 3.4, 3.7 and Local
  item 1 (Plans and Drawings), page 3, 7-8, 11, 21.
review-status: unverified
field-status: {}
