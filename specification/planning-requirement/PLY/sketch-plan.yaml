reference: sketch-plan
local-authority: PLY
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: 'For works to trees protected by a Tree Protection Order, the following information must
  be provided: A completed and dated application form, with all mandatory questions answered, a sketch
  plan showing the location of all trees, a full and clear specification of the works to be carried out,
  statement of reasons for the proposed work; and evidence in support of statement of reasons, where required
  by the standard application form. ... For works to trees in Conservation Areas, it is important to supply
  precise and detailed information on the proposal. Please therefore provide a completed and dated form,
  with all questions answered, sketch plan showing the precise location of all tree(s), and a full and
  clear specification of the works to be carried out.'
must-include:
- item: The precise location of all trees
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 3.6 (Tree Works checklist), page 10.
  The specification of works is in the unmapped list (tree-works-specification).
