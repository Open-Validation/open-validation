reference: air-quality-assessment
local-authority: PLY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 100
      description: Development in excess of 100 dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 10000
      description: Development in excess of 10,000 square metres of new floorspace.
  - all:
    - condition:
        field: use-class
        value: general-industrial
        description: Development falling within Use Class B2.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Use Class B2 with floorspace of 1,000 square metres or more.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 300
      description: More than 300 new parking spaces.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT1, DEV2; National Planning Policy Framework
source-text: Development in excess of 100 dwellings or 10,000m2 new floorspace; and/or, ... Development
  falling within Use Class B2 with floorspace of 1000m2 + and/or, ... Where >300 new parking spaces are
  proposed.
must-include:
- item: The change in air quality resulting from the development
  level: must
- item: Appropriate mitigation measures as necessary
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 4, page 23-24.
review-status: unverified
field-status: {}
