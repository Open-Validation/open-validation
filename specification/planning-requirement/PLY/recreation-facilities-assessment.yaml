reference: recreation-facilities-assessment
local-authority: PLY
required-if:
  site:
    in:
    - open-space
    description: Development within a designated City Green Space or Neighbourhood Green Space, or within
      an undesignated open space recognised in the JLP Open Space Assessments where the site has not been
      allocated.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV27; National Planning Policy Framework
source-text: Where a development is proposed within a designated City Green Space (CGS) or Neighbourhood
  Green Space (NGS) ... Where a development is proposed within an undesignated open space recognised within
  any of the JLP associated Open Space Assessments and where the site has not been allocated.
must-include:
- item: How the proposal meets one of the three tests in JLP policy DEV27 point 2 (surplus to requirements;
    replaced by equivalent or better provision; alternative sports and recreation provision whose need
    clearly outweighs the loss)
  level: must
- item: How the functioning and characteristics of the green space are retained, or how their loss will
    be mitigated
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 23 (Open Space Assessment),
  page 46.
review-status: unverified
field-status: {}
