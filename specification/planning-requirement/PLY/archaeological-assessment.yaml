reference: archaeological-assessment
local-authority: PLY
required-if:
  any:
  - site:
      in:
      - historic-environment-record
      - scheduled-monument
      description: The site is on or adjoining a site of known archaeological interest (for example in
        the Historic Environment Record, or a scheduled monument).
  - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV21; National Planning Policy Framework
source-text: Where any proposal includes works on or adjoining a site of known or suspected archaeological
  interest.
must-include:
- item: A desk-based archaeological assessment and/or field evaluation
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 5, page 24-25. 'Suspected'
  interest is a judgement (the list names sources such as the Historic Environment Record, the council's
  officers, historic maps, nearby scheduled monuments, and says greenfield sites often need one), so that
  part is discretionary.
review-status: unverified
field-status: {}
