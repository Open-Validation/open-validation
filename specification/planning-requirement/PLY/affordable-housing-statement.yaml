reference: affordable-housing-statement
local-authority: PLY
required-if:
  condition:
    field: dwelling-count
    operator: '>'
    value: 10
    description: More than 10 dwellings proposed.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT2, DEV7, DEV9, DEV10, DEV29; NPPF paragraphs
  61 to 64 and annex 2
source-text: More than 10 dwellings proposed
must-include:
- item: An explanation of the affordable housing offer in the context of the policy expectation
  level: must
- item: 'For on-site provision (15 dwellings or more): the total number of dwellings proposed and the
    tenure mix'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 dwellings or more (on-site affordable housing).
- item: 'Schedule of accommodation for market and affordable units: tenure, house type, bedrooms, bed
    spaces, floor area (GIA m²) and any accessible criteria (e.g. M4(2), M4(3))'
  level: must
- item: A design statement confirming the tenure blind approach to design
  level: must
- item: A plan showing the location of the affordable housing units, including associated car parking
  level: must
- item: 'For off-site provision (11-14 dwellings): a schedule of property valuations (RICS red book) for
    the proposed dwellings'
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 to 14 dwellings (off-site affordable housing).
    - condition:
        field: dwelling-count
        operator: <=
        value: 14
        description: 11 to 14 dwellings (off-site affordable housing).
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 3, page 22-23. Heads of
  Terms are also needed for any section 106 obligation (see the unmapped planning-obligations-heads-of-terms
  row). Where policy isn't met on viability grounds, see viability-assessment.
review-status: unverified
field-status: {}
