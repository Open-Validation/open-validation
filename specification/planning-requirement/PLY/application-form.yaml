reference: application-form
local-authority: PLY
required-if:
  always: true
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All sections need be completed using the relevant national 1APP form
must-include:
- item: All sections completed, on the national 1APP form relevant to the proposal
  level: must
- item: Ownership and agricultural holdings certificate (A, B, C or D), where included in the form, with
    notice served on owners under Article 6 and all agricultural tenants notified
  level: must
- item: 'For outline applications: the proposed use or uses and the amount of development for each use,
    and the area(s) where access points will be situated, even if access is reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: Information about the proposed use or uses, and the amount of development proposed for
    each use is required. You must also indicate the area or areas where access points to the development
    will be situated, even if access has been reserved.
confidence: medium
notes: From the council's list (published February 2025), sections 3 (checklists) and 4 (National), page
  6-12, 15. Every application-type checklist starts with the application form.
review-status: unverified
field-status: {}
