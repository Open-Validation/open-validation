reference: floor-plan-proposed
local-authority: PLY
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor plans – existing (where relevant) and proposed at a metric scale of 1:50 or 1:100.
must-include:
- item: Drawn at a metric scale of 1:50 or 1:100
  level: must
- item: Measured dimensions
  level: should
- item: 'For listed building consent: detailed drawings at 1:20 of all the works (for example new doors,
    windows, door and window furniture, shop fronts, panelling, fireplaces, plaster mouldings and other
    decorative details) and their relationship to adjacent existing structures/details'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Detailed drawings, which may include plans, elevations, and vertical and horizontal sections,
    must be to a scale of 1:20
confidence: medium
notes: From the council's list (published February 2025), General advice, sections 3.3, 3.7 and Local
  item 1 (Plans and Drawings), page 3, 7, 11, 21. For proposed lawful development certificates the list
  asks for floor plans 'where appropriate'.
review-status: unverified
field-status: {}
