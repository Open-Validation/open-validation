reference: viability-assessment
local-authority: PLY
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The proposal does not meet policy compliant affordable housing requirements and this
        is justified on viability grounds.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The development is not considered viable and the applicant is unwilling to offer the
        full contribution requested.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEL1; National Planning Policy Framework
source-text: For all applications where the proposal does not meet policy compliant requirements and this
  is being justified on viability grounds a detailed Viability Assessment is required to be submitted
  with the planning application as outlined in para 57 of the NPPF. ... When the development is not considered
  viable and the applicant is unwilling to offer the full contribution requested a viability appraisal
  and associated assessment fee will be required.
must-include:
- item: The associated assessment fee (or an impartial assessor approved by the council)
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local items 3 (Affordable Housing
  Statement) and 25 (Planning obligations), page 23, 47-48.
review-status: unverified
field-status: {}
