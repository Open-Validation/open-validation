reference: site-plan
local-authority: PLY
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
      - outline
      - ldc-prospective-use
  - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Block plan, also known as a Site plan, may be required at a metric scale (suggestive scale
  1:200 or 1:500).
must-include:
- item: At a metric scale (suggested 1:200 or 1:500), with the direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access arrangements, unless they would
    not influence or be affected by the development
  level: must
- item: Public rights of way crossing or adjoining the site, unless they would not influence or be affected
    by the development
  level: must
- item: Position of all trees on the site and on adjacent land, unless they would not influence or be
    affected by the development
  level: must
- item: Extent and type of any hard surfacing, and proposed boundary treatment including walls or fencing,
    unless they would not influence or be affected by the development
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 3.7 and Local item 1 (Plans and Drawings),
  page 11, 21. The list says a block plan 'may be required', so it shows as discretionary.
review-status: unverified
field-status: {}
