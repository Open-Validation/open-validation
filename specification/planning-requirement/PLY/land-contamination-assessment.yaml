reference: land-contamination-assessment
local-authority: PLY
required-if:
  any:
  - all:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected on the site or in its vicinity.
    - condition:
        field: ground-disturbance
        value: true
        description: Ground works are proposed.
  - condition:
      field: sensitive-end-use
      value: true
      description: A vulnerable or sensitive end user, i.e. residential, schools, nurseries, hospitals
        and allotments.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV2; National Planning Policy Framework
source-text: Where contamination is known or suspected or the development site is in the vicinity of such
  land, and ground- works are proposed; or, ... There is a vulnerable or sensitive end user i.e. Residential,
  Schools, Nurseries, Hospitals and Allotments.
must-include:
- item: A desk study listing current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
- item: A preliminary conceptual site model (all potential pollutant linkages) with a preliminary risk
    assessment of them
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on or near the site.
- item: 'For decommissioning underground storage tanks: a method statement in line with APEA guidance'
  level: must
  required-if:
    condition:
      field: underground-storage-tanks
      value: true
      description: The proposal decommissions underground storage tanks.
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 9 (Contaminated Land Assessment),
  page 28-29.
review-status: unverified
field-status: {}
