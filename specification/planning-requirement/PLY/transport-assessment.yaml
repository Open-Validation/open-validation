reference: transport-assessment
local-authority: PLY
required-if:
  any:
  - condition:
      field: traffic-movements-peak-hour
      operator: '>='
      value: 51
      description: 51 or more two-way peak hour trips onto an uncongested network (31 or more onto a congested
        network, as advised by the council).
  - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT10, DEV29; National Planning Policy
  Framework
source-text: Please seek specific advice through the pre-application service on this matter. ... We will
  make a judgement as to whether a development proposal would generate significant amounts of movement
  on a case by case basis
must-include:
- item: Analysis of all existing and proposed trips by all modes generated by the site
  level: should
- item: Accessibility of the site by all modes and the likely modal split of journeys
  level: should
- item: Measures to improve access by public transport, walking and cycling, reduce the need for parking
    and mitigate transport impacts
  level: should
confidence: medium
notes: 'From the council''s list (published February 2025), section 5, Local item 33, page 53-55. The
  list''s table is ''for guidance only'': a Transport Assessment for 51+ two-way peak hour trips onto
  an uncongested network or 31+ onto a congested one, and a Transport Statement below those levels. The
  council advises which networks are congested and decides case by case, so the rule also includes discretionary.'
review-status: unverified
field-status: {}
