reference: cil-form
local-authority: PLY
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - ldc
        - s73
    - any:
      - condition:
          field: involves-change-of-use
          value: true
          description: The proposal involves a change of use.
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: The proposal creates new floorspace (or converts floorspace).
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: A fully completed CIL Information form must accompany any application where there is a change
  of use or a creation of floor space. ... Applications for full planning permission, including householder
  applications; or ... First reserved matters applications (following an outline planning permission ...
  Applications for Lawful Development Certificates
must-include:
- item: Completed in line with Government guidance, with any existing, proposed and lost floorspace identified
    in section 6 of the form
  level: must
- item: 'For development by general permitted development or a Local Development Order: CIL Form 5 with
    supporting plans and evidence, instead of CIL Form 1'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
confidence: medium
notes: From the council's list (published February 2025), sections 3, 4 and 5 (Local item 7), page 6,
  11, 12, 15, 26-27. Reserved matters means the first reserved matters application after an outline permission.
  The lawful development and section 73 checklists ask for it only 'if creating new/converting floorspace'.
review-status: unverified
field-status: {}
