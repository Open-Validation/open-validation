reference: proposed-habitat-plan
local-authority: PLY
required-if:
  all:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
  - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Environment Act 2021; Town and Country Planning (Development Management Procedure) (England) Order
  2015, article 7
source-text: The Council will request the following information where there are particular biodiversity
  net gain matters which will be relevant when determining the planning application or where they are
  relevant to local policies which could influence how the biodiversity net gain objective is to be met.
must-include:
- item: On-site post-intervention proposed habitat plan
  level: must
- item: Off-site post-intervention proposed habitat plan, where off-site gains are used
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site biodiversity gains are proposed.
- item: To scale and in line with the list's conventions for site plans
  level: should
- item: Identifies all habitats in the metric so the size and location of habitat parcels can be understood
  level: should
confidence: medium
notes: 'From the council''s list (published February 2025), section 5, Local item 13 (BNG and Ecological
  Information), page 32-33. Listed under ''All applications where BNG applies'', but the item opens by
  saying the council ''will request'' this information where there are particular BNG matters, so it shows
  as discretionary within BNG applications. The rule follows the law: householder and other exempt applications
  are exempt, so the trigger is the biodiversity gain condition. Where you think the condition doesn''t
  apply, say why (and which exemption) in the application form.'
review-status: unverified
field-status: {}
