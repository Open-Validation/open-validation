reference: sustainability-statement
local-authority: PLY
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Major non-residential development over 1,000 sq m.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: New residential development of 10 units or more (new build and conversion).
  - condition:
      field: minor-development
      value: true
      description: Minor applications (householders excluded).
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT1, DEV32, DEV33, DEV34; National Planning
  Policy Framework, chapter 14
source-text: Major applications for non-residential development over 1,000 sq m; or new residential development
  comprising 10 units or more (new build and conversion) ... All minor applications (householders excluded)
  will include information within a Design & Access Statement instead, and also include an Energy Hierarchy
  evaluation. Alternatively if a Design & Access Statement is not being provided, then a separate statement
  covering these points.
must-include:
- item: Resource minimisation evaluation
  level: must
- item: Climate resilience evaluation
  level: must
- item: Energy Hierarchy evaluation (minor applications)
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor applications.
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 21.1, page 43. For minor
  applications the information can be in the Design and Access Statement instead of a separate statement.
  It should be proportionate to the scale of the application.
review-status: unverified
field-status: {}
