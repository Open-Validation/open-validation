reference: design-and-access-statement
local-authority: PLY
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        - park-and-garden
        description: 'A designated area: a World Heritage Site, a Conservation Area or a Registered Park
          or Garden.'
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  Planning Practice Guidance
source-text: Applications for major development, as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015; ... Applications for development in a designated
  area, where the proposed development consists of ... one or more dwellings; or ... a building or buildings
  with a floor space of 100 square metres or more. ... Applications for listed building consent.
confidence: medium
notes: From the council's list (published February 2025), sections 3.3 and 4, page 7, 15-16. Information
  in the statement can't replace other national or local list items. For minor applications without a
  Design and Access Statement, the sustainability information goes in a separate statement (see sustainability-statement).
review-status: unverified
field-status: {}
