reference: heritage-statement
local-authority: PLY
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - park-and-garden
      - scheduled-monument
      description: The application affects a designated heritage asset (listed building, conservation
        area, registered historic park and garden, scheduled ancient monument) or its setting.
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV21; National Planning Policy Framework
source-text: Any application which affects a ‘designated heritage asset’ or its setting. Designated Heritage
  Assets in Plymouth are Listed Buildings, Conservation Areas, Registered Historic Parks and Gardens and
  Scheduled Ancient Monuments. A Heritage Statement will also be required if the Council identifies a
  building or site as a ‘non-designated heritage asset’ (NDHA).
must-include:
- item: The history, character and significance of the heritage asset
  level: must
- item: The extent and nature of the proposed development
  level: must
- item: The impact of the development on the heritage asset
  level: must
- item: The justification for the works and any mitigation proposed
  level: must
- item: Evidence that, as a minimum, the Plymouth Historic Environment Record and other relevant sources
    were consulted
  level: must
- item: 'For archaeological sites: a desk-based archaeological assessment and/or field evaluation'
  level: must
  required-if: discretionary
- item: Prepared by an architectural historian, accredited conservation architect or qualified archaeologist
    for buildings or sites of high significance
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), section 3.3 and Local item 18, page 7, 40-41.
  Non-designated heritage assets are those the council identifies (including at pre-application or application
  stage), so that part is discretionary. The listed building consent checklist lists a heritage statement.
review-status: unverified
field-status: {}
