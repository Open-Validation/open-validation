reference: landscaping-plan
local-authority: PLY
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: A minor application.
    - any:
      - discretionary
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 or more dwellings.
      - site:
          in:
          - landscape-character-area
          description: Within or directly adjacent to a Landscape Character area as defined within the
            Plymouth and Plymouth's Urban Fringe (landscape character assessment).
      - site:
          in:
          - open-space
          description: Within a Strategic, City or neighbourhood green space.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT12, PLY61, DEV20, DEV23, DEV24, DEV25;
  National Planning Policy Framework
source-text: 'All Major applications ... Any Minor application: ... which needs an LVIA (see LVIA matrix),
  ... is for 5 or more dwellings ... that is within or directly adjacent to a Landscape Character area
  as defined within the Plymouth and Plymouth’s Urban Fringe, ... that is within a Strategic, City or
  neighbourhood green space'
must-include:
- item: 'Full soft landscape specification: tree and plant species and size (to HTA standards), soil details,
    planting specification and establishment care'
  level: should
- item: Drawings of the proposed soft landscape elements and soil layouts (min 1:200), with a planting
    schedule
  level: should
- item: Planting details (1:20 or as appropriate), such as tree pits, tree protection and hedge planting
  level: should
- item: Every new tree with at least a 15m³ root zone free from compaction (soil to BS 3882, 900mm depth),
    with underground crating specified where vehicles may compact it
  level: must
- item: Drawings of the proposed hard landscape elements, street furniture and boundary treatment materials
    (min 1:200), with a specification of the materials
  level: should
- item: Boundary treatment details (1:20 or as appropriate)
  level: should
- item: A Landscape Management Plan showing areas of management responsibility and how each element will
    be managed and maintained, including a commitment to replace dead or defective planting for 5 years
  level: should
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 19 (Landscaping scheme),
  page 41-42. Whether a minor application needs an LVIA is judged with the SPD's LVIA matrix, so that
  part is discretionary.
review-status: unverified
field-status: {}
