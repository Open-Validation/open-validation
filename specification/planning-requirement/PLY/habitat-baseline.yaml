reference: habitat-baseline
local-authority: PLY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Environment Act 2021; Town and Country Planning (Development Management Procedure) (England) Order
  2015, article 7
source-text: a plan, drawn to an identified scale which much show the direction of North, showing onsite
  habitats existing on the date of application (or an earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale, with the direction of North
  level: must
- item: Onsite habitats on the date of application (or earlier date), including any irreplaceable habitat
  level: must
- item: Off-site baseline habitat plan where off-site gains are used
  level: should
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site biodiversity gains are proposed.
- item: Identifies all habitats in the metric so the size and location of habitat parcels can be understood
  level: should
confidence: medium
notes: 'From the council''s list (published February 2025), section 4 and Local item 13 (BNG plans and
  drawings), page 17-18, 33. The rule follows the law: householder and other exempt applications are exempt,
  so the trigger is the biodiversity gain condition. Where you think the condition doesn''t apply, say
  why (and which exemption) in the application form.'
