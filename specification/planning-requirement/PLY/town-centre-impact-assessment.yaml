reference: town-centre-impact-assessment
local-authority: PLY
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses (as defined by the NPPF) not in an existing centre (city, district
      or local centre) or proposed centre (excluding the Derriford Commercial Centre), or not in accordance
      with an up-to-date Development Plan allocation.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT5, PLY38, DEV16; National Planning
  Policy Framework
source-text: All applications for main town centre uses (as defined by the NPPF) that are not in an existing
  centre (city centre, district centre or local centre), proposed centre as shown on the proposals map
  (excluding the Derriford Commercial Centre) or are not in accordance with an up-to-date Development
  Plan allocation will require a statement of justification.
must-include:
- item: A sequential test assessing the availability and suitability of sequentially preferable sites
    in and on the edge of existing and proposed centres
  level: must
- item: A retail impact assessment, for retail over 500 sq m gross floor space
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 500
      description: Retail proposals over 500 sq m gross floor space.
- item: An impact assessment, for leisure and office development over 2,500 sq m gross external floorspace
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Leisure and office development over 2,500 sq m gross external floorspace.
- item: Impact on existing, committed and planned investment in centres, and on town centre vitality and
    viability, including consumer choice and trade
  level: should
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 500
        description: Retail over 500 sq m.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Leisure and office over 2,500 sq m.
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 32 (Town Centre uses -
  statement of justification), page 52-53. The list calls it a statement of justification; the sequential
  test is the core, with an impact assessment above the floorspace thresholds.
review-status: unverified
field-status: {}
