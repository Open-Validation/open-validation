reference: town-centre-impact-assessment
local-authority: PLY
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses not in an existing or proposed centre (excluding the Derriford
      Commercial Centre) or not in line with an up-to-date Development Plan allocation.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
source-text: 'Town Centre uses - statement of justification Where or when this item is required: All applications
  for main town centre uses (as defined by the NPPF) that are not in an existing centre (city centre,
  district centre or local centre), proposed centre as shown on the proposals map (excluding the Derriford
  Commercial Centre) or are not in accordance with an up-to-date Development Plan allocation will require
  a statement of justification.'
must-include:
- item: A sequential test assessing the availability and suitability of sequentially preferable sites
    in and on the edge of existing and proposed centres
  level: should
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The sequential test
  item was in the workbook's 'Sequential / Exception Test (flood)' row. The audit couldn't read this council's
  list, so its contents weren't checked.
