validation-list:
  url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
  date: '2025-02-07'
  date-basis: PDF created 7 February 2025 and stored in the council's /2025-02/ upload folder; the cover
    still reads 'Validation List February 2024' (it carries the February/April 2024 BNG text). The council's
    web pages return a Cloudflare 403 to automated requests, so the page linking it couldn't be read;
    a web search of the council's 'What to submit with your planning application' page shows it links
    a 469 KB local validation list updated for biodiversity net gain, matching this file (480,330 bytes).
    planning.data.gov.uk still records the older November 2023 list.
  status: current
submission-standards:
- item: All plans and drawings accurately drawn using a conventional metric scale such as 1:100 or 1:50,
    and drawn true to the stated scale(s)
  level: must
- item: Plans/drawings must not contain disclaimers such as 'not to scale' and 'do not scale' (except
    perspective drawings)
  level: must
- item: Plans/drawings include a scale bar or dimensions
  level: should
- item: Every plan based on Ordnance Survey maps (including copies) has the appropriate Ordnance Survey
    copyright notice
  level: must
- item: Each plan/drawing has a title box stating the address and proposal, the drawing title, the date,
    the scale and the drawing number, with revisions clearly identified
  level: should
- item: Existing and proposed drawings grouped side by side at the same scale; plans fully annotated
  level: should
- item: 'For coastal developments extending below the high water mark: plans show the full extent of the
    area affected and both the Mean High Water Mark (MHWM) and the Mean Low Water Mark (MLWM)'
  level: must
- item: Applications submitted online through the Planning Portal; paper submissions are strongly discouraged
    and delay validation
  level: should
- item: Where a local list item is considered not applicable, a written statement justifying why it is
    not needed
  level: must
