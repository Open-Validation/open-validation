reference: biodiversity-survey-report
local-authority: PLY
required-if: discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT12, DEV26; National Planning Policy
  Framework
source-text: Applications for development that has the potential to adversely affect biodiversity must
  be accompanied by an Ecological Impact Assessment (EcIA).
must-include:
- item: Up to date, appraising the site and adjacent land
  level: must
- item: Produced by a suitably qualified and licensed ecological consultant, following recognised best
    practice
  level: must
- item: Desk study / Preliminary Ecological Appraisal (including data search), phase 1 survey
  level: must
- item: 'Protected species surveys: methodology, evidence found and assessment of impacts'
  level: must
- item: Any additional habitat and species surveys advised by the ecologist
  level: must
- item: Evaluation of ecological features; assessment of impacts; assessment of significance of residual
    effects
  level: must
- item: Measures to avoid, mitigate or compensate impacts and how they will be delivered
  level: must
- item: Measures to provide biodiversity enhancements, and a scheme for monitoring mitigation/compensation
  level: must
- item: All further surveys needed (such as bat emergence surveys) completed before submission
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 13 (Ecological Requirements),
  page 34-35. Whether a proposal could harm biodiversity is judged case by case (the completed Wildlife
  Trigger Table, required for all applications, is in the unmapped list), so it shows as discretionary.
  A letter from a professional ecologist explaining why no report is needed may be accepted.
review-status: unverified
