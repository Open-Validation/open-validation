reference: location-plan
local-authority: PLY
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
    - lbc
    - advertising
    - outline
    - consent-under-tpo
    - notice-trees-in-con-area
    - ldc
    - pa-demo-building
    - pa-ecomms-network
    - pip
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The plan must show the site location outlined in red at a standard metric scale (typically
  1:1250 or 1:2500) with a north point. Any other land owned by the applicant must be outlined in blue.
must-include:
- item: Site outlined in red at a metric scale of 1:1250 or 1:2500, with a north point
  level: must
- item: Two named roads (where the site has only one road nearby, that road named and the site clearly
    identifiable)
  level: must
- item: Any other land owned by the applicant outlined in blue
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: The appropriate Ordnance Survey copyright notice
  level: must
- item: Provided on a separate sheet to aid consultation
  level: should
confidence: medium
notes: From the council's list (published February 2025), sections 3, 4 and 5 (Local item 1, Plans and
  Drawings), page 6-12, 15, 21. The types are those whose checklist lists a location plan (householder,
  full/reserved matters, listed building, advertisement, outline, tree works, lawful development, prior
  notification of demolition and telecommunications, permission in principle); the conditions, non-material
  amendment and section 73 checklists don't.
review-status: unverified
field-status: {}
