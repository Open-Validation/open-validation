reference: bng-metric
local-authority: PLY
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Environment Act 2021; Town and Country Planning (Development Management Procedure) (England) Order
  2015, article 7
source-text: Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information set out in Article 7 of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015.
must-include:
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), with the completed metric calculation tool, its publication date and version
  level: must
- item: Only the latest version of the Statutory Metric (no earlier versions such as Metric 2.0, 3.0,
    3.1 or 4.0)
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
  required-if: discretionary
- item: Statement on whether the onsite value is lower because of activities ('degradation'), with supporting
    evidence where degradation has taken place
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
- item: Statement on whether the applicant believes the biodiversity gain condition would apply
  level: must
- item: Provided on the Devon BNG statement for validation
  level: should
confidence: medium
notes: 'From the council''s list (published February 2025), section 4 (National BNG requirements) and
  Local item 13, page 16-18, 33. The rule follows the law: householder and other exempt applications are
  exempt, so the trigger is the biodiversity gain condition. Where you think the condition doesn''t apply,
  say why (and which exemption) in the application form.'
review-status: unverified
field-status: {}
