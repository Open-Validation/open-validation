reference: section-proposed
local-authority: PLY
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal involves a change in levels or is on a sloping site.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Sections – required where any proposal involves a change in levels or is on a sloping site.
must-include:
- item: Finished floor levels
  level: must
- item: How the development relates to existing site levels and adjacent development, with levels related
    to a fixed datum point off site
  level: must
- item: Existing and proposed foundations and eaves, where a change is proposed
  level: must
- item: How encroachment onto adjoining land is to be avoided
  level: must
- item: 'For listed building consent: detailed drawings at 1:20 of all the works (for example new doors,
    windows, door and window furniture, shop fronts, panelling, fireplaces, plaster mouldings and other
    decorative details) and their relationship to adjacent existing structures/details'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Detailed drawings, which may include plans, elevations, and vertical and horizontal sections,
    must be to a scale of 1:20
confidence: medium
notes: From the council's list (published February 2025), section 3.3 and Local item 1 (Plans and Drawings),
  page 7, 21.
review-status: unverified
field-status: {}
