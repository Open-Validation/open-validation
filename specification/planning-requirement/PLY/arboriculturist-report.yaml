reference: arboriculturist-report
local-authority: PLY
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the application site, or on adjacent land (including street trees and neighbouring
      gardens) that could influence or be affected by the development.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV28; BS 5837:2012; Town and Country
  Planning (Tree Preservation) (England) Regulations 2012
source-text: Where there are trees within the application site; or ... Where there are trees on land adjacent
  to it that could influence or be affected by the development (including street trees).
must-include:
- item: Prepared in line with BS 5837:2012 by a competent person in arboriculture, including trees with
    a stem diameter over 75 mm at 1.5 m above ground
  level: must
- item: Tree Survey and Tree Constraints Plan, based on an accurate topographical survey (major applications)
  level: must
  required-if:
    ref: major-development
- item: Arboricultural Impact Assessment explaining the criteria used, Tree Protection Plan showing trees
    to be removed/retained, and a mitigation planting plan giving canopy cover net gain (major full and
    reserved matters applications, or where trees have a Tree Preservation Order)
  level: must
  required-if:
    any:
    - all:
      - ref: major-development
      - application-type:
          in:
          - full
          - reserved-matters
    - site:
        in:
        - tree-preservation-zone
        description: Trees covered by a Tree Preservation Order.
- item: Arboricultural Method Statement, where special protection measures are needed within the root
    protection area
  level: must
  required-if: discretionary
- item: Proposed location of underground services, SuDS (in particular attenuation tanks), site compounds
    and utility trenches
  level: must
  required-if:
    any:
    - all:
      - ref: major-development
      - application-type:
          in:
          - full
          - reserved-matters
    - site:
        in:
        - tree-preservation-zone
        description: Trees covered by a Tree Preservation Order.
- item: 'Householder and minor applications: a scaled plan showing the trees affected, each with a reference
    number (T1, T2...), its stem diameter at 1.5 m, trees to be retained/removed (including access and
    service runs) and mitigation planting for any removed trees'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: minor-development
        value: true
        description: Minor applications.
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 34 (Tree Survey), page
  57-59. Some minor applications may need the same information as major ones, depending on scale. A covering
  letter from an arborist confirming no trees of merit are present may be accepted instead of a full tree
  survey.
review-status: unverified
field-status: {}
