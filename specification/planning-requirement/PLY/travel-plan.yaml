reference: travel-plan
local-authority: PLY
required-if:
  any:
  - condition:
      field: traffic-movements-peak-hour
      operator: '>='
      value: 51
      description: 51 or more two-way peak hour trips onto an uncongested network (31 or more onto a congested
        network, as advised by the council).
  - condition:
      field: staff-count
      operator: '>'
      value: 25
      description: More than 25 staff based on-site (commercial uses).
  - all:
    - condition:
        field: educational-accommodation
        value: true
        description: Student accommodation.
    - condition:
        field: residential-capacity
        operator: '>'
        value: 25
        description: More than 25 persons residing within the building.
  - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT10, DEV29; National Planning Policy
  Framework
source-text: NB In addition to the above, a Travel Plan would also be sought for any development where
  there are more than 25 staff based on-site (for commercial uses) or 25 persons residing within a building
  (for student accommodation). ... Travel plans may be requested from all types of development, determined
  on a case by case basis
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 33, page 54-55. The guidance
  table also shows a Travel Plan for 30 or fewer peak hour trips onto a congested network; travel plans
  are otherwise decided case by case.
review-status: unverified
field-status: {}
