reference: flood-risk-assessment
local-authority: PLY
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Development within Flood Zone 2 or Flood Zone 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Development over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Development over 1 hectare.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - site:
        in:
        - critical-drainage-area
        description: Development within an Environment Agency Critical Drainage Area (not householder
          applications).
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV35; National Planning Policy Framework
source-text: 1. Development within Flood Zone 2 or Flood Zone 3; or 2. Development over 1 ha 3. Development
  within Environment Agency Critical Drainage Area (this does not apply to householder applications)
must-include:
- item: Risks of all forms of flooding to and from the development and how they will be managed, taking
    climate change into account
  level: should
- item: Sequential and exception tests for major development in Flood Zones 2 and 3
  level: should
  required-if:
    all:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 16, page 37-38. The critical
  drainage area trigger excludes householder applications, so it is limited to the other planning application
  types.
review-status: unverified
field-status: {}
