reference: sustainable-drainage-strategy
local-authority: PLY
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (this does not apply to householder applications).
    - site:
        in:
        - flood-risk-zone
        - critical-drainage-area
        description: Environment Agency Flood Zone 2 or 3, or an Environment Agency Critical Drainage
          Area.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies DEV35, PLY6, PLY20, DEV2; National Planning
  Policy Framework
source-text: '1. All Major developments 2. Minor developments within: · Environment Agency Flood Zone
  2 or Flood Zone 3; or · Environment Agency Critical Drainage Area ... Please note - this does not apply
  to householder applications.'
must-include:
- item: The drainage approach, with an appropriate level of scheme design detail
  level: should
- item: Justification of the strategy against the drainage hierarchy (section 3.2 of the Plymouth Local
    Flood Risk Management Strategy Part 2)
  level: should
- item: Impacts on water quality, with pollution prevention measures in the surface water drainage system
  level: should
- item: The design standard of the scheme, with enough detail to assess its likely performance
  level: should
- item: The maintenance standard and management arrangements for the lifetime of the development
  level: should
- item: Evidence that any flood risk management or surface water discharge consents (MMO, Environment
    Agency, council as Lead Local Flood Authority) are secured or applied for
  level: should
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 12 (Drainage Strategy),
  page 30-32. The list calls it a Drainage Strategy / Drainage Report; the retired MHCLG id sustainable-drainage-strategy
  is used for it.
review-status: unverified
field-status: {}
