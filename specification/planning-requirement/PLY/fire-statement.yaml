reference: fire-statement
local-authority: PLY
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: A building containing two dwellings or more.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational residential accommodation (i.e. student halls of residence).
  - any:
    - condition:
        field: building-height
        operator: '>'
        value: 18
        description: The building exceeds 18m in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A;
  Plymouth and South West Devon Joint Local Plan policies DEV10
source-text: Developments for the erection or modification (including development within the curtilage)
  of a building containing two dwellings or more, or educational residential accommodation (i.e student
  halls of residence); and the building exceeds 18m in height, or 7 or more storeys
must-include:
- item: Submitted on the Secretary of State's standard fire statement template
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 15, page 36-37.
review-status: unverified
field-status: {}
