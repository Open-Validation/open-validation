reference: energy-statement
local-authority: PLY
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Major non-residential development over 1,000 sq m.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: New residential development of 10 units or more (new build and conversion).
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth and South West Devon Joint Local Plan policies SPT1, DEV32, DEV33, DEV34; National Planning
  Policy Framework, chapter 14
source-text: Major applications for non-residential development over 1,000 sq m; or new residential development
  comprising 10 units or more (new build and conversion)
must-include:
- item: Onsite renewable energy or low carbon technologies to offset at least 20 per cent of predicted
    'regulated' carbon emissions
  level: must
- item: Proposals to connect, or be able to connect, to a district energy network, if in a 'district heating
    opportunity area' or with the relevant characteristics in the Plymouth City-Wide District Energy Strategy
  level: must
- item: 'Solar Masterplan report (if not within a district heating opportunity area) showing how solar
    access has been optimised: aiming for at least 10% Winter Probable Sunlight Hours and a Vertical Sky
    Component of 27%'
  level: must
- item: An Energy Strategy, for a large, multi-phased development
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 21.2 (Energy Statement
  or Strategy), page 44.
review-status: unverified
field-status: {}
