reference: elevation-existing
local-authority: PLY
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes an elevation.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevations – all existing and proposed to be shown at a metric scale of 1:50 or 1:100 (unless
  retrospective). ... All elevations of proposed development must be shown, with corresponding existing
  elevation drawings. For applications that propose no changes to any elevations, and clearly state that
  this is the case, elevation drawings are not required.
must-include:
- item: All existing elevations corresponding to the proposed ones, at a metric scale of 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (published February 2025), General advice, section 3.7 and Local item 1
  (Plans and Drawings), page 3, 11, 21. For proposed lawful development certificates the list asks for
  elevations 'where appropriate', so that part is discretionary.
review-status: unverified
field-status: {}
