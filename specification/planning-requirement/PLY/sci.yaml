reference: sci
local-authority: PLY
required-if:
  any:
  - discretionary
  - all:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: A departure from the Plymouth and South West Devon Joint Local Plan.
  - condition:
      field: eia-development
      value: true
      description: EIA applications.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 20000
      description: Large scale retail (20,000 square metres or more).
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: The site is greenfield land.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 150
          description: 150 dwellings or more.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 5
          description: A site of 5 hectares or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 5
          description: A site of 5 hectares or more.
  - site:
      in:
      - open-space
      description: Development is proposed on playing fields.
  - condition:
      field: wind-turbine-count
      operator: '>'
      value: 2
      description: Onshore wind development of more than 2 turbines.
  - condition:
      field: turbine-hub-height
      operator: '>'
      value: 15
      description: The hub height of any turbine exceeds 15 metres.
source-url: https://www.plymouth.gov.uk/sites/default/files/2025-02/Local-Validation-List.pdf
policy: Plymouth Statement of Community Involvement; National Planning Policy Framework; section 61W,
  Town and Country Planning Act 1990
source-text: Required for applications that in the opinion of the Local Planning Authority have significant
  local impact; or, ... Major applications that are a departure from the Plymouth and South West Devon
  Joint Local Plan; or, ... EIA applications; or, ... Large scale retail (20,000sqm+ or 2,500sqm if combined
  with existing would be 20,000 sq m+); or, ... 150 dwellings or site is 5ha+ on Greenfield land; or,
  ... Development is proposed on playing fields; or, ... Onshore wind developments involving more than
  2 turbines or where the hub height of any turbine exceeds 15 metres.
must-include:
- item: How the principles and guidance in sections 2 and 3 of the council's SCI were applied to the engagement
  level: must
- item: How and when the consultation/engagement was carried out
  level: must
- item: How the needs of equality groups were considered
  level: must
- item: How the issues raised were addressed, whether the scheme changed as a result and, if not, why
    not
  level: must
confidence: medium
notes: From the council's list (published February 2025), section 5, Local item 8 (Community Involvement
  Statement), page 27-28. 'Significant local impact' is the council's opinion, so it shows as discretionary.
  Retail of 2,500 sq m that would take a centre to 20,000 sq m with existing floorspace also counts. It
  may be included within a Planning Statement.
review-status: unverified
field-status: {}
