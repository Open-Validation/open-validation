reference: sci
local-authority: PLY
required-if:
  any:
  - discretionary
  - all:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: A departure from the Plymouth and South West Devon Joint Local Plan.
  - condition:
      field: eia-development
      value: true
      description: EIA applications.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 20000
      description: Large scale retail (20,000 square metres or more).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 150
      description: 150 dwellings or more.
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: The site is greenfield land.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 5
          description: The site is 5 hectares or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 5
          description: The site is 5 hectares or more.
  - site:
      in:
      - open-space
      description: Development is proposed on playing fields.
