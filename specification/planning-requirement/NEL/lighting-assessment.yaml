reference: lighting-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - condition:
      field: external-lighting
      value: true
      description: New lighting, such as floodlighting, that increases light pollution.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: A Light Pollution Statement should support any applications that include proposals that involve
  the increasing of light pollution by means of new lighting such as floodlighting.
must-include:
- item: Measures taken to reduce the impact on neighbouring properties and on any open land
  level: should
- item: Details of light luminance levels, technical specifications and lighting pools
  level: must
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Light Pollution
  Statement/ Assessment' section. The list's Major Application Checklist puts this under 'Site Specific
  Documents', whose need 'should be scoped out with a planning officer before submission by way of a pre
  application enquiry'.
review-status: unverified
field-status: {}
