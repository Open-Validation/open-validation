reference: daylight-sunlight-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: All applications must include where relevant a statement showing the impact of the development
  on neighbouring properties and land with regards to its impact on the daylight and/or sunlight that
  these adjacent properties receive.
must-include:
- item: A written statement and plans showing the existing and proposed levels of daylight and/or sunlight
  level: must
- item: Tests carried out to a recognised standard
  level: must
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Sunlight and Daylight
  Statement/Assessment' section. 'Where relevant' is shown as the council's discretion. The list's Major
  Application Checklist puts this under 'Site Specific Documents', whose need 'should be scoped out with
  a planning officer before submission by way of a pre application enquiry'.
review-status: unverified
field-status: {}
