reference: location-plan
local-authority: NEL
required-if:
  always: true
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site plan to a scale of 1:1250 or 1:2500 with the application site edged clearly with a
  continuous red line adjoining the adopted highway. It must outline all land required for the works to
  be carried out. Any adjoining owned land must be outlined in blue. A north point must be clearly shown
  and sufficient road names and/or buildings on land adjoining the site must be shown in order to clearly
  identify the site.
must-include:
- item: Scale of 1:1250 or 1:2500 (1:1250 for householder and proposed lawful development certificate
    applications)
  level: must
- item: Application site edged clearly with a continuous red line adjoining the adopted highway, outlining
    all land required for the works
  level: must
- item: Any adjoining owned land outlined in blue
  level: must
- item: North point clearly shown
  level: must
- item: Sufficient road names and/or buildings on adjoining land to clearly identify the site
  level: must
- item: 'For variations and non-material amendments: a copy of the previously submitted plan, with the
    same red edge and the blue land updated if required'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: One copy of the previously submitted site location plan . The red edge must match the previously
    submitted however any land outlined in blue denoting other land owned by the applicant must be updated
    accordingly if required.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Site Location Plan'
  section. The same wording is in every 2025 checklist.
review-status: unverified
field-status: {}
