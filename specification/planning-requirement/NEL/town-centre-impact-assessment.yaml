reference: town-centre-impact-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 200
        description: Retail gross floor area in excess of 200 sq m.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Retail in an edge of centre or out of centre location.
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 1
          description: Retail.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: For all retail applications where the gross floor area is in excess of 200 square metres
  a Retail Impact Assessment must be submitted.
must-include:
- item: The development's impact on existing centres, taking account of recently completed developments
    and outstanding permissions
  level: must
- item: Quantitative and qualitative information on the need for the development
  level: must
- item: 'For edge of centre or out of centre retail: evidence of need and that a sequential approach to
    site selection was followed, with all town centre options thoroughly assessed'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Edge of centre or out of centre location.
  source-text: Retail applications in edge of centre or out of centre locations must be accompanied by
    evidence demonstrating that there is a need for the development and that a sequential approach to
    site selection has been followed.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Retail Impact Assessment/
  Sequential Test' section. Smaller retail schemes may also need similar information if they would significantly
  affect smaller district and local centres. The list's Major Application Checklist puts this under 'Site
  Specific Documents', whose need 'should be scoped out with a planning officer before submission by way
  of a pre application enquiry'.
review-status: unverified
field-status: {}
