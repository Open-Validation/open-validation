reference: noise-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development.
    - condition:
        field: noise-generating-use
        value: true
        description: Potentially noise producing developments and uses (e.g. stadia, industry and driven
          piles).
    - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: For noise sensitive development and applications that have the potential to be noise producing
  developments and uses (e.g. Stadia, industry and driven piles etc) a Noise Assessment may be required.
must-include:
- item: Information and measurement of existing and proposed noise levels, where relevant
  level: should
- item: Recommendations for a scheme of measures to mitigate noise impact
  level: should
- item: A Vibration Impact Assessment, for developments that could be affected by vibration (e.g. housing
    next to a railway line or road)
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Noise and/or Vibration
  Impact Assessment' section. Sites next to noise producing sites or environmentally sensitive sites such
  as an SSSI are shown as the council's discretion. The list's Major Application Checklist puts this under
  'Site Specific Documents', whose need 'should be scoped out with a planning officer before submission
  by way of a pre application enquiry'.
review-status: unverified
field-status: {}
