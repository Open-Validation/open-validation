reference: sustainable-drainage-strategy
local-authority: NEL
required-if:
  ref: major-development
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: Required for major developments. The strategy must follow the sustainable drainage hierarchy
  including calculations and discharge rates with details of future management responsibilities.
must-include:
- item: Follows the sustainable drainage hierarchy
  level: must
- item: Calculations and discharge rates
  level: must
- item: Details of future management responsibilities
  level: must
- item: Sustainable drainage systems that take account of advice from the lead local flood authority,
    have appropriate minimum operational standards and maintenance arrangements for the lifetime of the
    development
  level: should
  source-text: Major developments should incorporate sustainable drainage systems unless there is clear
    evidence that this would be inappropriate.
- item: Multifunctional benefits, where possible
  level: should
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Drainage Strategy'
  section. The SuDS points are from the checklist's 'Sustainable Drainage' section.
