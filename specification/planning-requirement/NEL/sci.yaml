source-text: Please also provide a statement detailing the steps taken to ensure that the application
  complies with the Council's Statement of Community Involvement. This statement should identify the steps
  undertaken to promote public involvement, details of any public meetings and/or exhibitions held and
  a summary of (copy of) all correspondence with anyone affected by the proposed development.
