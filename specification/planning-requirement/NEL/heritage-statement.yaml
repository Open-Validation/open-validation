reference: heritage-statement
local-authority: NEL
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - locally-listed-building
      description: The site potentially impacts a conservation area (in or its setting), is or impacts
        the setting of a listed building, or may impact a scheduled monument or locally listed asset.
  - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Full-Application-Checklist-01.07.2025.docx
source-text: Required when your site potentially impacts a conservation area (in or impacts the setting
  of), is or impacts the setting of a listed building. Also required to appraise potential impacts on
  scheduled monument’s, below or above ground archaeology and other non designated assets. As a minimum
  the relevant historic environment record should have been consulted.
must-include:
- item: The relevant historic environment record consulted, as a minimum
  level: should
- item: An assessment of significance of the impacted asset (and of the conservation area, setting and
    other relevant heritage assets including archaeology)
  level: must
  required-if:
    ref: major-development
- item: A heritage impact assessment showing the positive or negative impacts on the heritage assets and
    their setting, and the alternatives considered to mitigate any negative impacts
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 1 July 2025), Full Application Checklist, 'Heritage Assessment'
  section. The same wording is in the Householder, Change of Use, Outline, Reserved Matters and Advertisement
  checklists; the Listed Building Consent checklist says 'Required for listed building consent'. The two-part
  content is from the Major checklist's 'Heritage Assessment'. Below or above ground archaeology and other
  non-designated assets are shown as the council's discretion.
review-status: unverified
field-status: {}
