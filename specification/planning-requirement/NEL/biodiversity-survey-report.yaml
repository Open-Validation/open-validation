reference: biodiversity-survey-report
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected species are found or known to exist within or adjacent to the site.
    - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: An ecological survey will be required wherever there are features of wildlife interest either
  on or adjacent to the application site.
must-include:
- item: Prepared by a professional ecological surveyor
  level: should
- item: Any wildlife interest present, the likely impact of the development on it, and a mitigation scheme
  level: should
- item: Whether protected species (e.g. bats, great crested newts) are present within or adjacent to the
    site
  level: should
- item: 'Where protected species are found or known: details of works to mitigate harm'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species found or known to exist.
- item: A wintering birds survey (with a Habitat Regulations Assessment), on open land within 2km of,
    or within, the Humber Estuary SSSI, SPA, SAC and Ramsar site
  level: must
  required-if:
    any:
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - ramsar
        - site-of-special-scientific-interest
        description: Open land within 2km of, or within, the Humber Estuary SSSI, SPA, SAC and Ramsar
          site.
    - discretionary
  source-text: a Habitat Regulations Assessment will be required and a wintering birds survey must be
    included.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Relevant Ecology
  Survey' section. 'Features of wildlife interest' (grassland, woodland or trees, water bodies, scrub,
  hedges, buildings, old underground features) are shown as the council's discretion. The list does not
  mention biodiversity net gain. The list's Major Application Checklist puts this under 'Site Specific
  Documents', whose need 'should be scoped out with a planning officer before submission by way of a pre
  application enquiry'.
review-status: unverified
field-status: {}
