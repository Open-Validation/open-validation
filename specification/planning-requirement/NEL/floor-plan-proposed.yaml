reference: floor-plan-proposed
local-authority: NEL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - lbc
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - outline-some
        - reserved-matters
    - condition:
        field: reserved-matters-sought
        value: appearance
        description: Appearance is to be considered in this application.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Full-Application-Checklist-01.07.2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed floor plans must be at a scale of 1:100 or 1:50. All windows and doors
  must be shown, room uses labelled and all affected floors must be supplied. Walls must be double lined
  to show thickness. They must correspond with the elevations.
must-include:
- item: Scale of 1:100 or 1:50
  level: must
- item: All windows and doors shown
  level: must
- item: Room uses labelled
  level: must
- item: All affected floors supplied
  level: must
- item: 'Walls double lined to show thickness (for listed building consent: shown at true thickness)'
  level: must
- item: Correspond with the elevations
  level: must
- item: 'For listed building consent: annotated to describe the proposed works, including any altered
    or new electrics, drainage or plumbing routes'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (published 1 July 2025), Full Application Checklist, ''Floor Plan'' section.
  The same wording is in the householder, change of use, listed building, proposed lawful development
  certificate and outline (where appearance is to be considered) checklists. Exceptions: existing floor
  plans are not required for new structures, and no floor plans are required for boundary treatments and
  new access or car park applications.'
review-status: unverified
field-status: {}
