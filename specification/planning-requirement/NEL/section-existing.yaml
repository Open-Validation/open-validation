reference: section-existing
local-authority: NEL
required-if:
  any:
  - condition:
      field: shopfront
      value: true
      description: Shop fronts and roller shutters.
  - all:
    - application-type:
        in:
        - hh
        - ldc-prospective-use
    - condition:
        field: new-vehicle-access
        value: true
        description: A dropped kerb.
  - all:
    - application-type:
        in:
        - outline-some
        - reserved-matters
    - condition:
        field: reserved-matters-sought
        value: access
        description: Access is to be considered in this application.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Full-Application-Checklist-01.07.2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed sections will be required to a recognised scale for applications which
  include shop fronts and roller shutters. … If you have a dropped kerb as part of your application, we
  require a section through to a recognised scale … As you are considering access, we require a section
  through to a recognised scale.
must-include:
- item: Drawn to a recognised scale
  level: must
confidence: medium
notes: From the council's list (published 1 July 2025), Full Application Checklist, 'Elevations' section.
  Also from the Householder (15 May 2026) and Outline Some Matters Reserved / Reserved Matters checklists
  (dropped kerbs; access to be considered).
review-status: unverified
field-status: {}
