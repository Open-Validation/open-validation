reference: arboriculturist-report
local-authority: NEL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site, overhanging it or close to it (e.g. within half their height
          of the boundary), including answering yes to a trees question on the form.
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site, overhanging it or close to it (e.g. within half their height
          of the boundary), including answering yes to a trees question on the form.
    - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
policy: BS 5837:2012 'Trees in relation to design, demolition and construction'
source-text: For any proposal that affects trees that are within the application site or that are overhanging
  or in close proximity of the application site (e.g. within half their height of the boundary of a site)
  … Most likely required if answering yes to either question regarding trees on the application form.
  This should include a tree constraints plan and tree protection plan.
must-include:
- item: Prepared to BS 5837:2012
  level: must
  required-if:
    ref: major-development
- item: 'Tree survey: species, height, stem diameter, age class, condition and category grading (and the
    other details in BS 5837)'
  level: must
  required-if:
    ref: major-development
- item: 'Tree constraints plan: below and above ground constraints, accurate plotting of all tree stems,
    crown spreads and root protection areas'
  level: must
- item: 'Arboricultural method statement: how the site will be developed in its phases, with materials
    and construction processes in relation to trees'
  level: must
  required-if:
    ref: major-development
- item: Tree protection plan showing the form and location of tree protection fencing, with measurements
    from a fixed point
  level: must
- item: Hedgerows indicated on the drawings, with their relationship to the development and the number
    and types of species in each
  level: must
  required-if:
    condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows on the site.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Tree and Hedgerow
  Survey' section. The 'most likely required' passage is from the Full, Change of Use and Outline checklists'
  'Tree Report' (shown as the council's discretion); for reserved matters it is 'most likely required
  if submitted as part of the outline application'. The list's Major Application Checklist puts this under
  'Site Specific Documents', whose need 'should be scoped out with a planning officer before submission
  by way of a pre application enquiry'.
review-status: unverified
field-status: {}
