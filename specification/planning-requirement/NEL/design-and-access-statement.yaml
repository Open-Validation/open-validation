reference: design-and-access-statement
local-authority: NEL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (World Heritage Site or conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for major all developments. … Required for applications in a designated area (World
  Heritage Site or a conservation area) where your proposed development consists of 1 or more new dwelling,
  a building or buildings with a floor space of 100 square meters or more or an application for a listed
  building.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Design & Access
  Statement' section. The second passage is from the Full, Change of Use, Outline Some Matters Reserved
  and Reserved Matters checklists; the Listed Building Consent checklist says 'Required for a listed building
  consent application'.
review-status: unverified
field-status: {}
