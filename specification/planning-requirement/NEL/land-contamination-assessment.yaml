reference: land-contamination-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: A vulnerable end use (e.g. housing) is introduced to the land.
    - condition:
        field: involves-change-of-use
        value: true
        description: A significant change of use of land or buildings that could be affected by contamination.
    - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: A Contaminated Land Survey is more likely to be needed when introducing a vulnerable end
  use (e.g. a residential development) to land, or a significant change of use of land/buildings which
  could be impacted by contamination.
confidence: low
notes: Major checklist item (audit wrong_app_type). The council says a survey is 'more likely to be needed'
  in these cases, so it is not a firm trigger.
review-status: unverified
field-status: {}
