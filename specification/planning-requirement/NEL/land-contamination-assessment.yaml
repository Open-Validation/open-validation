reference: land-contamination-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: previously-developed-land
        value: true
        description: The site has been previously developed.
    - site:
        in:
        - contaminated-land
        description: The site lies adjacent to land that may have been impacted by contamination.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: If the application site has been previously developed or lies adjacent to land that may have
  been impacted by contamination then a survey of the application site will be necessary to establish
  the degree and type of contamination present.
must-include:
- item: The degree and type of contamination present
  level: must
- item: Remedial measures
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Contaminated Land
  Survey' section. A survey is more likely to be needed when introducing a vulnerable end use (e.g. housing)
  or a significant change of use. The list's Major Application Checklist puts this under 'Site Specific
  Documents', whose need 'should be scoped out with a planning officer before submission by way of a pre
  application enquiry'.
review-status: unverified
field-status: {}
