reference: flood-risk-assessment
local-authority: NEL
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      description: The site falls within a flood risk area on the Environment Agency's maps and/or the
        council's local strategic flood risk maps.
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
policy: NPPF; National Planning Practice Guidance (flood risk)
source-text: Required for all major applications regardless of whether the site falls within a flood risk
  area. A sequential and exceptions test will be required in specific instances. … Required when the application
  site falls within a flood risk area on the Environment Agencies maps and/or our local strategic flood
  risk maps. This needs to consider sequential and exception tests.
must-include:
- item: Considers the sequential and exception tests
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
- item: A sequential test, for a major application within a flood risk zone (not needed again on a site
    allocated through the sequential test)
  level: must
  required-if:
    all:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        description: Within a flood risk zone.
  source-text: A sequential test is required for all major applications that falls within a flood risk
    zone.
- item: The exception test, where development cannot be located in a lower flood risk zone
  level: should
  required-if:
    all:
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Flood Risk Assessment'
  section. The second passage is from the Full, Change of Use, Outline and Reserved Matters checklists.
  For householder applications the council asks for its own 'Flood Risk Form' in the same circumstances
  ('This can be obtained by contacting planning').
review-status: unverified
field-status: {}
