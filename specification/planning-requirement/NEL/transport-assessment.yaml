reference: transport-assessment
local-authority: NEL
required-if:
  ref: major-development
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: 'The Council will require major developments to provide a Transport Impact Assessment in
  the following circumstances regardless of the current local traffic conditions: … In all other cases,
  a Transport Statement will suffice.'
must-include:
- item: A Transport Impact Assessment rather than a Transport Statement
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: Residential development in excess of 80 units.
    - condition:
        field: office-floorspace
        operator: '>'
        value: 2500
        description: Office (B1) gross floor area in excess of 2,500 sq m.
    - all:
      - condition:
          field: use-class
          value: higher-further-education
          description: Higher and further education.
      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: In excess of 2,500 sq m.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 2500
        description: Industry (B2) gross floor area in excess of 2,500 sq m.
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 6000
        description: Storage and distribution (B8) gross floor area in excess of 6,000 sq m.
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 800
        description: Food retail gross floor area in excess of 800 sq m.
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 1000
        description: Non-food retail gross floor area in excess of 1,000 sq m.
    - all:
      - condition:
          field: use-class
          value: cinema-conference
          description: Cinemas and conference facilities.
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: In excess of 1,000 sq m.
    - all:
      - condition:
          field: use-class
          value: former-d2
          description: D2 uses (other than cinemas, conference facilities and stadia).
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: In excess of 1,000 sq m.
    - condition:
        field: seat-count
        operator: '>'
        value: 1500
        description: Stadia in excess of 1,500 seats.
    - condition:
        field: traffic-movements-peak-hour
        operator: '>='
        value: 30
        description: 30 or more vehicle movements in and out combined in the peak hour.
    - site:
        in:
        - air-quality-management-area
        description: Where there is an air quality management area.
  source-text: Residential development in excess of 80 units Office (B1) Gross Floor Area in excess of
    2,500m². Higher and Further Education in excess of 2,500m². Industry (B2/B8) Gross Floor Area in excess
    of 2500m2/ 6,000m² Retail (Food) Gross Floor Area in excess of 800m² Non Food Retail Gross Floor Area
    in excess of 1,000m² Cinemas & Conference Facilities with Gross Floor Area in excess of 1,000m² D2
    Uses (Other than Cinemas, Conference Facilities and Stadia) with Gross Floor Area in excess of 1,000m²
    Stadia in excess of 1500 seats Other – 30 plus vehicle movements in/out combined in the peak hour
    Where there is an air quality management area.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Traffic Impact Assessment/
  Transport Statement' section. 'Industry (B2/B8) ... 2500m2/ 6,000m²' is read as 2,500 sq m for B2 and
  6,000 sq m for B8. The list's Major Application Checklist puts this under 'Site Specific Documents',
  whose need 'should be scoped out with a planning officer before submission by way of a pre application
  enquiry'.
review-status: unverified
field-status: {}
