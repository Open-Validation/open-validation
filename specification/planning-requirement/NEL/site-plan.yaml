reference: site-plan
local-authority: NEL
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc
    - change-of-use
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site plan to a scale of 1:500 or 1:200 clearly showing the proposed works to scale, a north
  point, all adjoining land and/or buildings and named roads. It must show an accurate representation
  of the proposed site including all trees (identifying any covered by a TPO), boundary treatments and
  outbuildings.
must-include:
- item: Scale of 1:500 or 1:200, showing the proposed works to scale
  level: must
- item: North point, all adjoining land and/or buildings and named roads
  level: must
- item: Accurate representation of the site, including all trees (identifying any covered by a TPO), boundary
    treatments and outbuildings
  level: must
- item: Finished floor levels and existing and proposed ground levels
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: Erecting a new building/structure.
  source-text: We require finished floor levels and existing and proposed ground levels for new dwellings
    or buildings.
- item: An existing block plan to the same specification, showing the site as existing
  level: must
  required-if:
    any:
    - condition:
        field: new-vehicle-access
        value: true
        description: A new access.
    - condition:
        field: parking-change
        value: true
        description: A new car park.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A new dwelling.
  source-text: 'Note: If your application is for or includes a new access, car park or dwelling, you will
    require an existing block plan to the same specifications as above showing the site as existing.'
- item: 'For outline applications: an existing (and, with all matters reserved, indicative) site plan'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Where scale is to be considered: upper and lower limits for height, width and length of each
    building, in metres, annotated'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - outline-some
        - reserved-matters
    - condition:
        field: reserved-matters-sought
        value: scale
        description: Scale is to be considered in this application.
  source-text: The upper and lower limits for height, width and length for each proposed building should
    be provided in metres and annotated on the block plan.
- item: 'For advertisement consent: all advertisements clearly shown or labelled'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: It must show an accurate representation of the proposed site and all advertisements must
    be clearly shown or labelled.
- item: Boundary treatments and new access or car park works clearly identified (no floor plans are needed
    for these)
  level: must
  required-if:
    any:
    - condition:
        field: new-boundary-treatment
        value: true
        description: New, replacement or altered boundary treatments.
    - condition:
        field: new-vehicle-access
        value: true
        description: A new access.
    - condition:
        field: parking-change
        value: true
        description: A new car park.
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Block Plan' section.
  The block plan is in every checklist except the variation and non-material amendment ones; reserved
  matters applications need it for access, landscaping, layout and scale; the advertisement checklist's
  version is drawn at 1:500 or 1:200 with the adverts shown.
review-status: unverified
field-status: {}
