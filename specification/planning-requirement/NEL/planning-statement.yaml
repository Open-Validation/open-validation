reference: planning-statement
local-authority: NEL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - ldc
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: Planning applications must include a statement indicating how the proposal accords with national
  planning guidance and any relevant parts of the Development Plan and Supplementary Planning Guidance.
  … Supporting planning statement must be provided and must include grounds in which the certificate is
  sought.
must-include:
- item: How the proposal accords with national planning guidance and relevant parts of the Development
    Plan and Supplementary Planning Guidance
  level: must
  required-if:
    ref: major-development
- item: Details of consultations with the local planning authority and wider statutory consultees
  level: should
  required-if:
    ref: major-development
- item: 'On previously developed land or buildings (brownfield sites): a regeneration section on how the
    proposal will benefit the economic and social regeneration of the site and surrounding locality'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: previously-developed-land
        value: true
        description: Previously developed land and/or buildings (brownfield sites).
  source-text: For all applications for proposals on previously developed land and/or buildings (Brownfield
    Sites) any Supporting Planning Statement must include a regeneration section.
- item: 'For lawful development certificates: the grounds on which the certificate is sought and a description
    of all uses of land within the site'
  level: must
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Planning Statement'
  section. The lawful development certificate passage is from the Existing Certificate of Lawfulness checklist
  (the Proposed one says the same).
review-status: unverified
field-status: {}
