source-text: A Sustainability Statement must be submitted for all applications showing how sustainability
  measures have been incorporated into the proposal.
must-include:
- item: The elements of the scheme that address sustainable development, including positive environmental,
    social and economic implications for present and future generations
  level: should
- item: Water management during the construction stage and after use
  level: should
- item: Measures at construction stage to minimise wastage
  level: should
