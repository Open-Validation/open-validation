reference: air-quality-assessment
local-authority: NEL
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Major-Application-Checklist-01.07.2025.docx
source-text: Any applications which include proposals that may impact upon air quality will require an
  Air Quality Assessment.
must-include:
- item: The magnitude of change in air quality from the development during construction and operational
    phases
  level: must
- item: Mitigation measures identified and modelled
  level: should
confidence: medium
notes: From the council's list (published 1 July 2025), Major Application Checklist, 'Air Quality Assessment'
  section. 'May impact upon air quality' is shown as the council's discretion. The list's Major Application
  Checklist puts this under 'Site Specific Documents', whose need 'should be scoped out with a planning
  officer before submission by way of a pre application enquiry'.
review-status: unverified
