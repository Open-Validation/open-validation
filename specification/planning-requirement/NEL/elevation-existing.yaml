reference: elevation-existing
local-authority: NEL
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - hh
          - full
          - change-of-use
          - lbc
          - ldc-prospective-use
      - all:
        - application-type:
            in:
            - outline-some
            - reserved-matters
        - condition:
            field: reserved-matters-sought
            value: appearance
            description: Appearance is to be considered in this application.
    - any:
      - condition:
          field: external-alterations
          value: true
          description: Alterations to an existing building/structure.
      - condition:
          field: footprint-increase
          value: true
          description: Erecting extensions.
      - condition:
          field: new-boundary-treatment
          value: true
          description: New, replacement or altered boundary treatments.
  - application-type:
      in:
      - advertising
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Full-Application-Checklist-01.07.2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing elevations are required if alterations or extensions are being made to an existing
  building/structure or boundary treatment.
must-include:
- item: Scale of 1:100 or 1:50
  level: should
- item: All windows and doors shown, corresponding with the floor plan (if required)
  level: must
- item: Supplied for all affected elevations
  level: must
- item: 'For listed building consent: all building detail (e.g. headers, sills, rainwater goods, fascias,
    blocked openings and other fixtures or features)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For advertisement consent: may be submitted as photographs'
  level: should
  required-if:
    application-type:
      in:
      - advertising
  source-text: Existing elevations can be submitted as photographs. If this is not possible, existing
    elevations must be supplied to the above specification.
confidence: medium
notes: From the council's list (published 1 July 2025), Full Application Checklist, 'Elevations' section.
  For change of use, elevations are only required if the application includes external changes and/or
  extensions.
review-status: unverified
field-status: {}
