reference: elevation-proposed
local-authority: NEL
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - hh
          - full
          - change-of-use
          - lbc
          - ldc-prospective-use
      - all:
        - application-type:
            in:
            - outline-some
            - reserved-matters
        - condition:
            field: reserved-matters-sought
            value: appearance
            description: Appearance is to be considered in this application.
    - any:
      - condition:
          field: new-build
          value: true
          description: Erecting a new building/structure.
      - condition:
          field: footprint-increase
          value: true
          description: Erecting extensions.
      - condition:
          field: new-boundary-treatment
          value: true
          description: New, replacement or altered boundary treatments.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Alterations to an existing building/structure.
  - application-type:
      in:
      - advertising
source-url: https://www.nelincs.gov.uk/assets/uploads/2025/07/Full-Application-Checklist-01.07.2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Proposed elevations are required when erecting a new building/structure, erecting extensions
  and new, replacement or altered boundary treatments.
must-include:
- item: Scale of 1:100 or 1:50
  level: should
- item: All windows and doors shown, corresponding with the floor plan (if required)
  level: must
- item: Supplied for all affected elevations
  level: must
- item: 'For listed building consent: all building detail (e.g. headers, sills, rainwater goods, fascias,
    blocked openings and other fixtures or features)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For advertisement consent: advertisements shown in situ, with all proposed lighting'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Proposed advertisements must be shown in situ.
- item: 'For a projecting sign: side elevations showing the extent of the projection'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - discretionary
confidence: medium
notes: From the council's list (published 1 July 2025), Full Application Checklist, 'Elevations' section.
  Listed building consent also needs proposed elevations for alterations; advertisement consent always
  needs proposed elevations.
review-status: unverified
field-status: {}
