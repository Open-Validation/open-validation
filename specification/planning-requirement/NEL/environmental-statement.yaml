source-text: An Environmental Impact Assessment will be required for all applications as defined in Schedule
  1 of the Town & Country Planning (Environmental Impact Assessment) (England and Wales) of the Regulations
  and for major applications over a certain size (these are defined under Schedule 2 of the above-mentioned
  regulations) where the development would impact on a sensitive area such as a SSSI or where there are
  likely to be significant impacts on the environment.
