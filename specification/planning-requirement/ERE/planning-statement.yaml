reference: planning-statement
local-authority: ERE
required-if:
  ref: major-development
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy DM1; Erewash Core Strategy policies 8 and 19; Erewash Local Plan saved policies H7
  and H9; Developer Contributions SPD
source-text: For all Major applications. … For all major housing applications (10 or more dwellings).
must-include:
- item: How the proposals are consistent with relevant development plan and national decision-making policies
  level: must
- item: The outcome of pre-application engagement and how the proposals changed in response
  level: must
- item: The proposed use of any planning obligations to make the proposals acceptable
  level: must
- item: The level of financial contributions for infrastructure offered, and the number, type and tenure
    of affordable housing offered where required by local policy
  level: must
- item: 'Major housing: the number of affordable dwellings proposed and their tenure, the type and size
    mix of the affordable housing (where dwelling type and size are given), and a rationale for the level
    and tenure of provision'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major housing application (10 or more dwellings).
  source-text: A statement of the number of affordable dwellings proposed, and their proposed tenure.
    Where the application includes details of dwelling type (such as flats, bungalows, terraced) and size
    (in terms of numbers of bedrooms and / or designed occupancy levels), details of the type and size
    mix of the affordable housing proposed is also required. A rationale for the level and tenure of provision
    should be provided
- item: 'Major housing: the matters for which planning obligations will be offered and the scale of provision,
    with reference to the Developer Contributions SPD'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major housing application (10 or more dwellings).
- item: 'Wind turbines: information on the possible impact on the general amenity of the area, including
    an ETSU-R-97 noise report, consideration of shadow flicker and information on electromagnetic interference
    (e.g. to radar and broadcast frequencies)'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbine application (except one for use by a single dwelling within its curtilage).
  source-text: A Planning Statement to provide information regarding the possible impact upon the general
    amenity of the area, including an ETSU-R-97 noise report, consideration of shadow flicker and information
    on Electro Magnetic Interference e.g. to radar and broadcast frequencies.
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. The 'Additional Reports Required In Erewash' page (https://www.erewash.gov.uk/planning/additional-reports-required-erewash)
  adds 'Local Planning Statement Details' for major housing applications and a planning statement for
  wind turbine applications (except turbines for a single dwelling within its curtilage).
review-status: unverified
