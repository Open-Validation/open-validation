reference: location-plan
local-authority: ERE
required-if:
  always: true
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: By law all applications must include a plan which identities the land to which the application
  relates. Such plans must be drawn to an identified scale and show the direction of north. A location
  plan should be based on an up-to-date map. The scale should typically be 1:1250 or 1:2500. A location
  plan should identify sufficient roads and/or buildings on land adjoining the application site to ensure
  that the exact location of the application site is clear. The application site should be edged clearly
  with a red line on the location plan. It should include all land necessary to carry out the proposed
  development (e.g. land required for access to the site from a public highway, visibility splays, landscaping,
  car parking and open areas around buildings). A blue line should be drawn around any other land owned
  by the applicant, close to or adjoining the application site.
