reference: site-plan
local-authority: ERE
required-if:
  always: true
source-url: https://www.erewash.gov.uk/planning/additional-plans-required-erewash
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing Site Plan All applications. … Block plans for small scale operational development
  (e.g. alterations of existing buildings, erection of less than 10 buildings). Master plans for large
  scale operational development (e.g. erection of 10 or more buildings).
must-include:
- item: Existing site plan at a standardised metric scale, preferably 1:100 or 1:200
  level: should
- item: The direction of North
  level: must
- item: All buildings and hard surfaces (yards, parking, driveways and paths) on the site
  level: must
- item: Any relevant trees and water bodies on or adjacent to the site
  level: must
- item: Existing boundary treatments, including the type and height of walls, fences and hedges
  level: must
- item: Roads and footpaths neighbouring the site, including access arrangements
  level: must
- item: Neighbouring buildings
  level: must
- item: Proposed block plan (or, for large scale operational development such as 10 or more buildings,
    a master plan at 1:500) based on the existing site plan
  level: must
  required-if:
    condition:
      field: operational-development
      value: true
      description: Operational development.
- item: Footprint of proposed demolitions, extensions and buildings
  level: must
  required-if:
    condition:
      field: operational-development
      value: true
      description: Operational development.
- item: Distances of new buildings to the site boundaries
  level: must
  required-if:
    condition:
      field: operational-development
      value: true
      description: Operational development.
- item: Changes to areas of hard standing, including vehicular access arrangements and car parking layout
  level: must
  required-if:
    condition:
      field: operational-development
      value: true
      description: Operational development.
- item: Any trees or waterbodies to be lost or affected
  level: must
  required-if:
    condition:
      field: operational-development
      value: true
      description: Operational development.
- item: Any changes to boundaries, including the type and height of walls, fences and hedges
  level: must
  required-if:
    condition:
      field: operational-development
      value: true
      description: Operational development.
confidence: medium
notes: From the council's list (published 2026), web page 'Additional Plans Required In Erewash'. 'Existing
  Site Plan' (all applications) and 'Proposed Block or Master Plan' (operational development).
review-status: unverified
field-status: {}
