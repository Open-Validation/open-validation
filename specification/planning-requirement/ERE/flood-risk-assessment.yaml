reference: flood-risk-assessment
local-authority: ERE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Development in Flood Zones 3 and 2.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Over 1 ha in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Over 1 ha in Flood Zone 1.
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy F4
source-text: All proposals for development in Flood Zones 3 and 2, and proposals of over 1ha in Flood
  Zone 1.
must-include:
- item: Appropriate to the scale, nature and location of development and, where relevant, supporting an
    assessment of the sequential and exception tests (NPPF policies F5 and F6)
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'.
review-status: unverified
field-status: {}
