reference: section-existing
local-authority: ERE
required-if:
  any:
  - all:
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: footprint-increase
          value: true
          description: Extensions to existing buildings.
    - condition:
        field: change-in-ground-levels
        value: true
        description: Located on slopes and / or where a change in ground level is proposed.
  - condition:
      field: new-build
      value: true
      description: Levels plans are required for all applications involving new buildings.
source-url: https://www.erewash.gov.uk/planning/additional-plans-required-erewash
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications for new buildings and extensions to buildings, located on slopes and / or
  where a change in ground level is proposed. … This will be required for all applications involving new
  buildings.
must-include:
- item: Drawn to a standardised metric scale, preferably 1:50 or 1:100, with critical dimensions
  level: should
- item: Cross section(s) through the proposed building(s)
  level: should
- item: 'Where ground levels change: existing and finished levels, details of foundations and eaves, and
    how encroachment onto adjoining land is avoided'
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: Existing site levels and finished floor levels related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Additional Plans Required In Erewash'. 'Existing
  and proposed Site Sections, Finished Floor and Site Levels'. For extensions, levels may be evident from
  floor plans and elevations, but on sloping sites the plans must show how the proposal relates to existing
  ground levels.
review-status: unverified
field-status: {}
