reference: floor-plan-existing
local-authority: ERE
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: footprint-increase
      value: true
      description: Extensions to existing buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use of buildings.
source-url: https://www.erewash.gov.uk/planning/additional-plans-required-erewash
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications for new buildings, extensions to existing buildings, and change of use of
  buildings.
must-include:
- item: Drawn to a standardised metric scale, preferably 1:50 or 1:100
  level: should
- item: Critical external dimensions (width, length etc.)
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
- item: Details of the existing building(s) as well as the proposed development
  level: should
- item: New buildings shown in context with adjacent buildings (including property numbers where applicable)
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Additional Plans Required In Erewash'. 'Existing
  and proposed floor plan drawings'.
review-status: unverified
field-status: {}
