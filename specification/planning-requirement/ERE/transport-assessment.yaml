reference: transport-assessment
local-authority: ERE
required-if:
  any:
  - condition:
      field: class-e-floorspace
      operator: '>'
      value: 250
      description: E.g. over 250 sq m for commercial uses.
  - condition:
      field: class-eg-floorspace
      operator: '>'
      value: 2500
      description: E.g. over 2,500 sq m for employment uses.
  - condition:
      field: class-b2-b8-floorspace
      operator: '>'
      value: 2500
      description: E.g. over 2,500 sq m for employment uses.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: E.g. over 50 dwellings.
  - discretionary
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy TR6; 6Cs Design Guide
source-text: All developments generating significant amounts of traffic. E.g. exceeding the 6Cs Design
  Guidance Thresholds of 250sqm for commercial uses, 2,500sqm for employment uses, or 50 dwellings.
must-include:
- item: A transport statement or transport assessment proportionate to the nature and scale of the development,
    so that its likely transport impacts can be assessed and monitored
  level: must
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. Listed as 'Transport Impact Assessment'. The 6Cs thresholds
  are given as examples of development generating significant traffic, so other cases show as 'check'.
review-status: unverified
field-status: {}
