confidence: medium
notes: From the council's list (published 2026), web page 'Additional Reports Required In Erewash'. Combines
  'Bat Survey Report', 'Protected Species Survey Report' and the wildlife surveys for 'Wind Turbine Applications'.
  Brownfield sites show as 'check' because only those that have naturally re-vegetated are included; wind
  turbines for use by a single dwelling within its curtilage are excluded.
