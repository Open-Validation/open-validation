reference: biodiversity-survey-report
local-authority: ERE
required-if:
  any:
  - all:
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition.
      - condition:
          field: agricultural-building-reuse
          value: true
          description: Barn conversions.
      - all:
        - condition:
            field: involves-change-of-use
            value: true
            description: Other conversions.
        - condition:
            field: roof-alteration
            value: true
            description: Involving works to roof spaces.
    - condition:
        field: adjacent-to-landscape-features
        value: true
        description: The building is adjacent to relevant landscape features (open countryside, mature
          hedgerows, groups of mature trees or watercourses).
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - any:
      - condition:
          field: greenfield-site
          value: true
          description: Greenfield site.
      - all:
        - condition:
            field: previously-developed-land
            value: true
            description: Brownfield site that has naturally re-vegetated.
        - discretionary
      - condition:
          field: near-watercourse
          value: true
          description: Site adjacent to a watercourse.
    - any:
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use of land.
      - condition:
          field: new-build
          value: true
          description: Erection of buildings.
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbine application (except one for use by a single dwelling within its curtilage).
source-url: https://www.erewash.gov.uk/planning/additional-reports-required-erewash
policy: NPPF; Erewash Core Strategy policy 17; Erewash Local Plan saved policies EV10, EV11, EV12 and
  EV13; Biodiversity SPD; Wildlife & Countryside Act 1981; Protection of Badgers Act 1992; Habitats Regulations
  2010
source-text: All applications involving demolition, barn conversions, and other conversions involving
  works to roof spaces where the building is adjacent to relevant landscape features (open countryside,
  mature hedgerows, groups of mature trees or watercourses). … All applications on greenfield sites, brownfield
  sites that have naturally re-vegetated and sites adjacent to a watercourse that consist of a change
  of use of land or the erection of buildings (excluding householder applications). … Appropriate wildlife
  surveys, including for bats and ground nesting or feeding birds.
