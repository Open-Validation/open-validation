reference: biodiversity-survey-report
local-authority: ERE
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: The proposal involves demolition (bat survey).
  - all:
    - any:
      - condition:
          field: greenfield-site
          value: true
          description: Greenfield or re-vegetated brownfield land.
      - condition:
          field: near-watercourse
          value: true
          description: The site is next to a watercourse.
    - any:
      - condition:
          field: involves-change-of-use
          value: true
          description: The proposal changes the use of the land.
      - condition:
          field: new-build
          value: true
          description: The proposal includes new buildings.
  - discretionary
source-url: https://www.erewash.gov.uk/node/354
confidence: low
notes: 'From the audit (missing_requirement): a Bat Survey Report for all applications involving demolition,
  barn conversions, and conversions involving roof-space works next to relevant landscape features (barn
  and roof-space conversions are shown as officer discretion); and a Protected Species Survey Report for
  greenfield, re-vegetated brownfield, or sites next to a watercourse involving change of use of land
  or new buildings, excluding householder applications (the rule can''t express that exclusion).'
