reference: town-centre-impact-assessment
local-authority: ERE
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and / or leisure uses located outside a designated or proposed town centre.
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m gross floorspace or more.
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy TC4
source-text: All applications for retail and / or leisure uses of 2,500sqm gross floorspace or more that
  are located outside a designated or proposed town centre
must-include:
- item: That the development would be unlikely to have a significant adverse impact on existing, committed
    and planned public and private investment in town centres in the catchment
  level: must
- item: That it would be unlikely to have a significant adverse impact on town centre vitality and viability,
    including local consumer choice and trade
  level: must
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'.
review-status: unverified
field-status: {}
