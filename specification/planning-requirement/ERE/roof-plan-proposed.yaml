reference: roof-plan-proposed
local-authority: ERE
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: footprint-increase
        value: true
        description: Extensions to existing buildings.
  - condition:
      field: complex-roof-design
      value: true
      description: The proposed roof design is not a flat or mono-pitched roof.
source-url: https://www.erewash.gov.uk/planning/additional-plans-required-erewash
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications for new buildings and extensions to buildings, where the proposed roof design
  is not a flat or mono-pitched roof.
must-include:
- item: Drawn to a standardised metric scale, preferably 1:50 or 1:100, with critical dimensions
  level: should
- item: The shape of the roof
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Additional Plans Required In Erewash'. 'Roof
  Plan'.
review-status: unverified
field-status: {}
