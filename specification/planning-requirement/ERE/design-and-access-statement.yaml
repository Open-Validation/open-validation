reference: design-and-access-statement
local-authority: ERE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating floorspace of 100 sq m or more.
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement is required to accompany applications for Listed Building
  Consent; Major Development; Development in Conservation Areas consisting of the provision of one or
  more dwellinghouses; or the provision of a building or buildings where the floor space created by the
  development is 100 square metres or more. But not where the application is for planning permission which
  is: for permission to develop land without compliance with conditions previously attached; a renewal
  of a planning permission which has not expired; for engineering or mining operations; for a material
  change in use of the land or buildings; for development which is waste development.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes that context into account
  level: must
- item: The policy adopted as to access, and how access policies in relevant local development documents
    have been taken into account
  level: must
- item: What consultation has been undertaken on access and what account has been taken of its outcome
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'Listed building consent: the special architectural or historic interest of the building and how
    it is preserved or enhanced; the physical features that justify its listing; its setting; and, where
    appropriate, how access balances Equality Act 2010 duties with the building''s significance'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. National validation
  requirements. Not needed for applications to vary conditions, renewals of unexpired permissions, engineering
  or mining operations, material changes of use or waste development.
review-status: unverified
field-status: {}
