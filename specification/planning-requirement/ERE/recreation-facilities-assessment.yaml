reference: recreation-facilities-assessment
local-authority: ERE
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: Loss of recreation facilities (open space, sports and recreational buildings and land,
      playing fields, play space and allotments).
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy HC7
source-text: Proposals resulting in the loss of recreation facilities, unless the development is for a
  more beneficial recreational use or the loss is offset by suitable replacement provision.
must-include:
- item: An assessment clearly showing the open space, buildings or land to be surplus to requirements
  level: must
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. Not needed where the development is for a more beneficial
  recreational use or the loss is offset by suitable replacement provision.
review-status: unverified
field-status: {}
