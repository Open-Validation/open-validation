reference: heritage-statement
local-authority: ERE
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - scheduled-monument
    - park-and-garden
    - world-heritage-site
    - battlefield
    - locally-listed-building
    description: Proposals affecting heritage assets, designated or identified by the council (including
      local listing).
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy HE5
source-text: 'All proposals affecting heritage assets: A building, monument, site, place, area or landscape
  identified as having a degree of significance meriting consideration in planning decisions, because
  of its heritage interest. It includes but is not limited to designated heritage assets and assets identified
  by the local planning authority (including local listing).'
must-include:
- item: An assessment of the significance of the assets affected, including any contribution made by their
    setting, and of the potential effect of the proposal on their significance
  level: should
- item: Detail proportionate to the assets' importance
  level: should
- item: The relevant historic environment record consulted as a minimum, with appropriate expertise employed
    where necessary
  level: should
- item: Whether the proposal would have a positive effect, no effect, harm (with the degree of harm) or
    cause total loss of significance
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. Listed as 'Heritage Impact Assessment'.
review-status: unverified
field-status: {}
