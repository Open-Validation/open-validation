reference: noise-assessment
local-authority: ERE
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Potentially noise generating development (e.g. pubs and clubs, industrial units).
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of existing noise sensitive development (e.g. housing).
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive use in the vicinity of existing noise generating uses (such as major
          roads and railways).
    - discretionary
  - all:
    - condition:
        field: mixed-use
        value: true
        description: Mixed use application.
    - condition:
        field: noise-generating-use
        value: true
        description: Proposes noise generating development.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Proposes noise sensitive development.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Commercial application including extractor or cooling units.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of noise sensitive developments.
source-url: https://www.erewash.gov.uk/planning/additional-reports-required-erewash
policy: NPPF
source-text: Potentially noise generating developments (for example Pubs & clubs, industrial units) in
  the vicinity of existing noise sensitive developments (for example Housing) Noise sensitive uses in
  the vicinity of existing noise generating uses (such as major roads and railways) Mixed use applications
  proposing both noise generating and noise sensitive developments Commercial applications including extractor
  or cooling units in the vicinity of noise sensitive developments
must-include:
- item: Carried out by suitably qualified acousticians
  level: must
- item: The existing noise environment
  level: must
- item: The potential noise sources from the development, or those likely to affect it
  level: must
- item: Any mitigation measures
  level: must
confidence: medium
notes: From the council's list (published 2026), web page 'Additional Reports Required In Erewash'. Noise
  sensitive uses near existing noise sources show as 'check' because the list names no distance.
review-status: unverified
field-status: {}
