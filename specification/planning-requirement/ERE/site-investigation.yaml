reference: site-investigation
local-authority: ERE
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Land suspected to be subject to contamination issues.
  - discretionary
  - all:
    - site:
        in:
        - coal-mining-high-risk-area
        description: In a Coal Mining Development High Risk Area.
    - condition:
        field: ground-disturbance
        value: true
        description: Development involving ground excavations.
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy P2
source-text: All proposals on land suspected to be subject to land stability or contamination issues.
  Includes all applications for development that involves ground excavations (excluding householder applications)
  in “Coal Mining Development High Risk Areas”
must-include:
- item: Adequate site investigation information, prepared by a competent person, to inform land instability
    and contamination assessments
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. Listed as 'Ground Condition Assessment'; householder applications
  are excluded from the coal mining part. Suspected land instability shows as 'check'.
review-status: unverified
field-status: {}
