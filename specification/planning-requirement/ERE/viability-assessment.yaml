reference: viability-assessment
local-authority: ERE
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The application does not provide the infrastructure, including affordable housing, required
      by adopted planning policy.
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy DM5; Developer Contributions SPD
source-text: For all applications that do not provide the infrastructure, including affordable housing,
  required by adopted planning policy. … Where obligations are not offered, or where those offered do
  not meet the requirements of the SPD, applicants will be required to submit a viability assessment
must-include:
- item: Based upon and referring back to the viability assessments that informed the relevant plan policies
  level: should
- item: All inputs and assumptions fully evidenced, with any differences from the plan viability assessment
    explained
  level: should
- item: Follows the approach in planning practice guidance, using the standardised inputs in national
    policy and guidance
  level: should
- item: Made publicly available
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. The 'Additional Reports Required In Erewash' page repeats
  the requirement for major housing.
review-status: unverified
field-status: {}
