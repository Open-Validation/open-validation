reference: telecommunications-report
local-authority: ERE
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications infrastructure.
source-url: https://www.erewash.gov.uk/planning/apply-planning-permission
policy: NPPF policy CO2
source-text: All applications telecommunications infrastructure.
must-include:
- item: The outcome of pre-submission consultation with organisations with an interest (in particular
    where a mast is near a school or college, or within a statutory safeguarding zone), the issues raised
    and how they have been addressed
  level: should
- item: 'For a new site or structure: evidence that the number has been kept to a minimum, including that
    erecting antennas on an existing building, mast or other structure has been explored'
  level: should
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new site or structure is proposed.
- item: A statement self-certifying that cumulative exposure, when operational, will not exceed ICNIRP
    guidelines
  level: should
confidence: medium
notes: From the council's list (published 2026), web page 'Apply for Planning Permission'. Listed under
  'Specific National Validation Requirements'. The list says these are needed 'where relevant', so they
  show as 'should'.
review-status: unverified
field-status: {}
