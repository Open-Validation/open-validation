reference: design-and-access-statement
local-authority: BROADS
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates 100 square metres or more of floorspace.
source-url: https://broads-authority.gov.uk/planning/planning-permission/validation-checklist-2
confidence: medium
notes: 'From the audit (missing_requirement): major development, listed building consent, and development
  in a conservation area or World Heritage Site of 1+ dwelling or 100 sq m+.'
review-status: unverified
field-status: {}
