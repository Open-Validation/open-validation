reference: energy-statement
local-authority: BROADS
required-if:
  always: true
source-url: https://broads-authority.gov.uk/planning/planning-permission/validation-checklist-2
policy: DM14
must-include:
- item: A renewables statement
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: The proposal creates more than 10 dwellings.
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: The proposal creates more than 1,000 square metres of floorspace.
confidence: medium
notes: 'From the audit (missing_requirement): a DM14 energy demand reduction statement for all development,
  with a renewables statement for more than 10 dwellings or more than 1,000 sq m.'
review-status: unverified
field-status: {}
