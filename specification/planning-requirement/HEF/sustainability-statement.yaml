reference: sustainability-statement
local-authority: HEF
required-if:
  condition:
    field: new-build
    value: true
    description: New build development (or at reserved matters stage if applicable).
source-url: https://www.herefordshire.gov.uk/media/kxcca3ky/ss_sd1_climate_change_compliance_checklist.pdf
policy: Herefordshire Local Plan Core Strategy 2011-2031 policies SS7 and SD1
source-text: All applications for all new build development (or at Reserved Matters stage if applicable)
  will need to submit information in the below table(s).
must-include:
- item: 'Energy efficiency: which measures are incorporated (orientation/thermal massing, thermally efficient
    materials, efficient heating, heat recovery, others) with details, and a reasoned explanation for
    those not incorporated'
  level: must
- item: 'Renewable and low carbon energy: how on-site generation opportunities have been considered (solar,
    wind, hydro, geothermal, biomass, heat pumps, battery storage, hybrid systems, heat networks, others),
    with details or a reasoned explanation'
  level: must
- item: 'Enabling sustainable living: recycling/waste storage/composting, bicycle parking, travel plan,
    electric vehicle charging points, others, with details or a reasoned explanation'
  level: must
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the council''s ''Core Strategy Policy SS7 and SD1 - Climate Change Measures compliance checklist'' (undated;
  PDF modified May 2026), pages 2-5, linked from the ''What to submit'' page. The checklist is the document
  to submit; without it the council will give weight to the apparent lack of sustainability measures,
  which may lead to refusal.'
review-status: unverified
field-status: {}
