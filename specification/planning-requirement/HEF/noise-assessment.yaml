reference: noise-assessment
local-authority: HEF
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New housing.
  - discretionary
source-url: https://www.herefordshire.gov.uk/planning-and-building-control/planning-services/about-planning-services/guidance-for-residential-developers-on-noise-risks-and-acoustic-design/
source-text: Should the noise risk assessment highlight that ambient noise levels are more than negligible
  at the outline or full planning application stage developers will be requested to supply a Stage 2 Acoustic
  Design Statement. The purpose of this statement is to demonstrate how transport noise challenges both
  within the proposed dwellings and in outside amenity areas have been addressed and are at the heart
  of the site design and layout.
must-include:
- item: A Stage 2 Acoustic Design Statement showing how transport noise inside the dwellings and in outside
    amenity areas has been addressed in the site design and layout
  level: must
- item: 'Following ProPG: Planning and Noise (June 2017)'
  level: should
  source-text: 'Developers are referred to ProPG: Planning and Noise* Professional Practice Guidance on
    Planning & Noise: New Residential Development'
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the council''s ''Guidance for residential developers on noise risks and acoustic design'' page (undated).
  A Stage 1 noise risk assessment is requested at pre-application stage; the Stage 2 statement is requested
  at outline or full application stage only if that shows noise levels ''more than negligible'', so it
  shows as discretionary.'
review-status: unverified
field-status: {}
