reference: biodiversity-survey-report
local-authority: HEF
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      description: Within, adjacent to or likely to affect a designated site (SAC, SSSI, Local Wildlife
        Site or nature reserve).
  - condition:
      field: potential-roost-features
      value: true
      description: A roof or building being demolished, replaced or altered, or a loft being converted.
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Conversion, demolition or alteration of an agricultural building.
  - condition:
      field: underground-structures
      value: true
      description: Conversion, demolition or alteration of a bridge, tunnel or other underground structure.
  - condition:
      field: wind-turbine
      value: true
      description: A wind turbine installed.
  - condition:
      field: semi-natural-habitat-impact
      value: true
      description: Development, alteration or removal of unoccupied or previously undeveloped land (woodland,
        scrub, grassland, gardens, orchards, allotments, railway or brownfield sites).
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Mature trees affected.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerow affected.
  - condition:
      field: near-watercourse
      value: true
      description: Within 20m of a watercourse.
  - condition:
      field: distance-to-pond
      operator: <=
      value: 500
      description: Within 500m of a pond or ditch.
  - condition:
      field: protected-species
      value: true
      description: Protected species known to occur on or adjacent to the site.
  - site:
      in:
      - priority-habitat
      description: Priority habitat known to occur on or adjacent to the site.
source-url: https://www.herefordshire.gov.uk/media/4j5badjm/ss6_ld2_biodiversity_ecology_compliance_checklist.pdf
policy: Herefordshire Local Plan Core Strategy 2011-2031 policies SS6, LD2 and LD3
source-text: All new applications for development (including revised applications or those at Reserved
  Matters stage) which affect nature conservation sites, habitats and important species will need to complete
  the below table, to demonstrate that the relevant ecological information has been submitted as part
  of the application. ... Where any of these criteria apply, the following will need to be provided;
must-include:
- item: By a suitably qualified ecologist, including a preliminary ecological appraisal (PEA) and/or a
    preliminary roost appraisal (PRA) where bats may be affected, with further survey, impact assessment
    and protection, avoidance or mitigation measures where appropriate
  level: must
- item: 'Or, if the applicant believes no survey is needed: a summary statement explaining why, with photographs
    and/or other evidence clearly showing no likely ecological impact'
  level: must
- item: Biodiversity enhancement details (for example bird or bat boxes, hedgehog or insect habitats)
    shown on the proposed plans
  level: should
  source-text: The specific details should be shown on proposed plans. This can be provided as a condition
    to an approval.
- item: A Habitats Regulations Assessment is likely to be needed for a Special Area of Conservation
  level: should
  required-if:
    site:
      in:
      - special-area-of-conservation
      description: Within, adjacent to or likely to affect a Special Area of Conservation.
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the council''s ''Core Strategy Policy SS6 and LD2 - Biodiversity & Ecology measures compliance checklist''
  (undated; PDF created November 2020), pages 2-3, linked from the ''What to submit'' page, which asks
  applicants to submit the checklist ''if relevant''. The triggers are the checklist''s ''ecological features''.
  Biodiversity enhancement can instead be secured by condition.'
review-status: unverified
field-status: {}
