reference: site-plan
local-authority: HEF
required-if:
  application-type:
    in:
    - hh
    - full
source-url: https://www.herefordshire.gov.uk/media/x3ynt2to/common_reasons_why_a_planning_application_is_invalid.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site Plan also known as block plan – showing any public rights of way on or adjoining the
  site.
must-include:
- item: An identified standard metric scale, typically 1:200 or 1:500
  level: should
- item: The proposed works in relation to the site boundaries and other existing buildings on the site
  level: must
  source-text: Show the proposed works in relation to the site boundaries and other existing buildings
    on the site.
- item: Works to the roof, where proposed
  level: should
  source-text: If works are being undertaken to the roof, this should be shown on the site plan.
- item: An accurately drawn scale bar
  level: must
  source-text: Include an accurately drawn scale bar to the relevant scale.
- item: The direction north
  level: must
  source-text: Show the direction north.
- item: All public rights of way crossing or adjacent to the site
  level: must
  source-text: Show all public rights of way crossing or adjacent to the site.
- item: 'Unless they would not influence or be affected by the development: buildings and roads on adjacent
    land including access arrangements; all trees on the site and adjacent land; the extent and type of
    hard surfacing; boundary treatment where proposed'
  level: must
  source-text: 'Include the following – unless they would NOT influence or be affected by the proposed
    development: • All buildings and roads on land adjacent the site including access arrangements. •
    The position of all trees on the site, and those on adjacent land. • The extent and type of any hard
    surfacing. • The boundary treatment including walls or fencing where this is proposed.'
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the council''s ''Common reasons why a planning application is invalid'' (undated; PDF created May 2021),
  linked from the ''What to submit'' page, pages 1-2. The PDF lists it under ''Minimum requirements for
  most applications''; shown here for householder and full planning applications.'
