reference: design-and-access-statement
local-authority: HEF
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The creation of 100sq m or more of floor space.
  - application-type:
      in:
      - lbc
source-url: https://www.herefordshire.gov.uk/media/x3ynt2to/common_reasons_why_a_planning_application_is_invalid.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement is required for proposed works which are: • Major works. •
  One or more dwelling houses in a Conservation Area. • The creation of 100sq m or more of floor space
  in a conservation area - does not include engineering, mining, change of use or waste development applications.
  • All listed building applications require a Design and Access Statement'
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the council''s ''Common reasons why a planning application is invalid'' (undated; PDF created May 2021),
  linked from the ''What to submit'' page, page 3. The floor space part excludes engineering, mining,
  change of use and waste development applications.'
review-status: unverified
field-status: {}
