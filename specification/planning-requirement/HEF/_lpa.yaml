  status: current
submission-standards:
- item: A bar scale on all plans (for each scale used), which must scale accurately when submitted digitally
  level: must
- item: Every plan states the paper size it was drawn for with its scale (e.g. 1:50 at A1) and shows the
    direction north
  level: must
- item: Each plan has a unique drawing or reference number; each document/plan/drawing has a date and
    number
  level: must
- item: Documents not bound or stapled; one copy of each document
  level: must
- item: Electronic submissions only through the Planning Portal; no A0 plans electronically
  level: must
- item: One format only (electronic or paper), with all documents clearly legible, particularly when copied
    or scanned
  level: must
- item: Documents in A3/A4 format and electronic where possible
  level: should
- item: No photographs of drawings
  level: must
- item: Drawings in PDF, saved so they scale correctly (not 'fit to page')
  level: should
- item: Drawings show any associated copyright; Herefordshire Council/Balfour Beatty maps not used
  level: should
- item: Drawings not a Land Registry document, photocopy or screen grab image
  level: should
