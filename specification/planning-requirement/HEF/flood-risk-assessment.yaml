reference: flood-risk-assessment
local-authority: HEF
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The red outline of the application is within flood zones 2 and 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: A site greater than a hectare (including a change of use).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: A site greater than a hectare (including a change of use).
source-url: https://www.herefordshire.gov.uk/media/x3ynt2to/common_reasons_why_a_planning_application_is_invalid.pdf
source-text: An FRA is required if the red outline of the application is within flood zones 2 & 3 and
  for sites greater than a hectare – including for a change of use.
