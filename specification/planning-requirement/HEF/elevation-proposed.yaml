reference: elevation-proposed
local-authority: HEF
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
  - application-type:
      in:
      - advertising
source-url: https://www.herefordshire.gov.uk/media/x3ynt2to/common_reasons_why_a_planning_application_is_invalid.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Proposed Plans. ... Existing and proposed elevations should be drawn to a recognised metric
  scale, such as 1:100 and 1:50 and are required for all affected sides of the property. ... Advertisement
  drawings to show advertisement size, siting, materials and colours to be used, height above ground,
  extent of projection and details of method and colour(s) of illumination (where illuminated). Both sides
  of a double sided sign should be shown.
must-include:
- item: Drawn to a recognised metric scale, such as 1:100 or 1:50
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
- item: All affected sides of the property
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
- item: The paper size on which they should be reproduced to scale accurately (e.g. 1:100 @ A4)
  level: must
- item: A scale bar
  level: must
  source-text: Include a scale bar.
- item: Saved in PDF format
  level: must
  source-text: Saved in the .PDF format.
- item: Advertisement size, siting, materials and colours, height above ground and extent of projection
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: The method and colour(s) of illumination
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
- item: Both sides of a double-sided sign
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the council''s ''Common reasons why a planning application is invalid'' (undated; PDF created May 2021),
  linked from the ''What to submit'' page, pages 1-2. The PDF lists it under ''Minimum requirements for
  most applications''; shown here for householder and full planning applications. For advertisement consent
  the PDF asks for ''advertisement drawings'', shown here as proposed elevations.'
