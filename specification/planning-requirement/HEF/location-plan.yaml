reference: location-plan
local-authority: HEF
required-if:
  always: true
source-url: https://www.herefordshire.gov.uk/planning-and-building-control/planning-services/apply-for-planning-permission/what-to-submit-with-your-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location plans should be recent Ordnance Survey or equivalent ... Location Plan.
must-include:
- item: A recent Ordnance Survey (or equivalent) map
  level: should
- item: 'Identified standard metric scale: 1:1250 at A4, or 1:2500 at A3 for larger sites'
  level: must
  source-text: Identified standard metric scale (1:1250 @ A4/1:2500 @ A3 for larger sites).
- item: A scale bar to the relevant scale
  level: must
  source-text: Include a scale bar to the relevant scale.
- item: Not an aerial photograph
  level: must
  source-text: We are unable to accept aerial photographs as site location plans.
- item: OS mapping that is not a Land Registry document, not used for multiple applications, not a photocopy
    or screen grab, and not copied from existing OS mapping for hand-drawn maps
  level: must
  source-text: 'When using Ordnance Survey mapping for planning applications, the map should: Not be a
    Land Registry document Not be used for multiple applications Show OS Crown copyright as an acknowledgment
    Not be a photocopy or screen grab image Not be copied from existing OS mapping if using hand drawn
    maps - such as standard sheets'
- item: OS Crown copyright acknowledged, and the correct licence number
  level: must
  source-text: Show OS Crown copyright as an acknowledgment
confidence: medium
notes: 'Herefordshire has no formal local validation list: its ''What to submit with your planning application''
  page points to the national requirements on the Planning Portal and adds some local requirements. From
  the ''What to submit'' page (undated; page metadata modified 30 June 2025) and From the council''s ''Common
  reasons why a planning application is invalid'' (undated; PDF created May 2021), linked from the ''What
  to submit'' page, pages 1-2. The PDF''s other location plan points (north, adjoining roads and buildings,
  site boundary, blue land) repeat the national rules.'
