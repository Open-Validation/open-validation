reference: roof-plan-existing
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - technical-details-consent
      - outline-some
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: New extensions to roof forms.
    - condition:
        field: new-build
        value: true
        description: New roofs / buildings.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policies LP3, LP4, PP11, PPL10, SPL4 and SP6
source-text: Required for all development where there are new extensions to roof forms and new roof /
  buildings proposed.
must-include:
- item: At a scale of 1:50 or 1:100 with the relevant scale bar (or 1:200 or 1:500 if shown on the proposed
    block plan)
  level: must
- item: The shape and location of any roof that would be created or altered
  level: must
- item: Any features the existing and proposed roof may include (e.g. chimney, guttering, solar panels,
    roof lights/dormers)
  level: should
confidence: medium
notes: From the council's list (final version published July/August 2026), page 13. Existing and proposed
  roof plans can be on the same plan if it is clear what is proposed and what is existing. A north point
  is not required. 'HMO Applications' are planning applications for a house in multiple occupation, so
  they are shown as full applications.
review-status: unverified
field-status: {}
