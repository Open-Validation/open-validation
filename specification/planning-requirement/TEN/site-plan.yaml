reference: site-plan
local-authority: TEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - reserved-matters
        - lbc
        - ldc
        - technical-details-consent
        - outline-some
        - outline-all
    - condition:
        field: building-works
        value: true
        description: The development changes the external layout of the site or creates a new external
          layout.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: hmo-creation
        value: true
        description: The proposal creates a house in multiple occupation (HMO) and/or bedsits.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Tendring District Local Plan 2013-2033 and Beyond policies LP3, LP4, LP11, PP5, PP11, PPL10, SPL3, SP6
  and CP2
source-text: All applications for development proposed that include change or new external layouts for
  new development.
must-include:
- item: Existing and proposed block plans / site layout plans at a scale of 1:200 or 1:500
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: The proposed development in relation to the site boundaries and other existing buildings
  level: must
- item: Written dimensions to boundaries from any proposed development, as relevant
  level: must
- item: All buildings, roads and public rights of way on land adjoining the site
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: All public rights of way crossing or adjoining the site (in green)
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: The direction of North
  level: must
- item: The position of all trees and hedgerows on the site and adjacent land
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: The extent and type of existing and proposed hard surfacing
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: The type and height of existing and proposed boundary treatment (e.g. walls/fences)
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: Landscape features proposed for removal or inclusion (e.g. additional planting)
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: Spot heights and levels (topographic survey)
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: The precise location of existing and, where appropriate, proposed vehicular accesses, with written
    dimensions and visibility splays
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - technical-details-consent
      - outline-some
      - outline-all
- item: Cycle storage and EV charging details
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A net increase in residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial development.
- item: Parking (car and cycle) provision and space for bin storage
  level: must
  required-if:
    any:
    - condition:
        field: new-build
        value: true
        description: New housing or commercial schemes.
    - condition:
        field: parking-change
        value: true
        description: The development affects parking.
- item: 'For outline applications with all matters reserved: an indicative site layout showing how the
    development could be accommodated'
  level: must
  required-if:
    application-type:
      in:
      - outline-all
- item: 'For outline applications considering access or layout: full details of the matter sought'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
- item: 'For advertisement consent: the size and position of the proposed advertisement in context (not
    just a larger scaled red lined site plan), at 1:200 or 1:500, with the footprint / outline of site
    boundaries and adjacent buildings'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For HMOs: the parking provision / arrangement to serve the HMO (or confirmation that none is
    proposed)'
  level: must
  required-if:
    condition:
      field: hmo-creation
      value: true
      description: The proposal creates a house in multiple occupation (HMO) and/or bedsits.
- item: 'For HMOs: how all residents have access to adequate space within the curtilage for storing waste
    and recycling bins (or confirmation that none is proposed)'
  level: must
  required-if:
    condition:
      field: hmo-creation
      value: true
      description: The proposal creates a house in multiple occupation (HMO) and/or bedsits.
confidence: medium
notes: From the council's list (final version published July/August 2026), pages 11, 38, 42. Listed as
  'Block Plan / Site Layout Plan'. Advertisement consent has its own section ('All applications for advertisement
  consent.'), and the HMO section asks for block plans showing parking and bin storage. 'HMO Applications'
  are planning applications for a house in multiple occupation, so they are shown as full applications.
review-status: unverified
field-status: {}
