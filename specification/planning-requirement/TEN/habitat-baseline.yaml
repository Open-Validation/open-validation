reference: habitat-baseline
local-authority: TEN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.tendringdc.gov.uk/content/local-validation-list
policy: Environment Act 2021; Town and Country Planning Act 1990, Schedule 7A
source-text: A plan, drawn to an identified scale which must show the direction of North, showing onsite
  habitat existing on the date of application (or an earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale, with the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
- item: A clear red line defining the area of land the metric tool was applied to (unless the habitat
    plan is sufficiently clear and confirmed as that area)
  level: must
confidence: medium
notes: From the council's 'Validation & the Local Validation List' web page (Biodiversity Net Gain section),
  checked 2026-11-06; the PDF list itself has no BNG section. The page says it is needed 'unless exempt';
  in law only development subject to the biodiversity gain condition needs it (householder and other exempt
  applications are exempt), so the rule follows the law.
review-status: unverified
field-status: {}
