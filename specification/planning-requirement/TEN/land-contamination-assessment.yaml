reference: land-contamination-assessment
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - technical-details-consent
      - outline-some
      - outline-all
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A net increase in dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: A net increase in commercial/industrial unit/s.
    - site:
        in:
        - contaminated-land
        description: Land recorded as a present or historic contamination site.
    - all:
      - condition:
          field: hmo-creation
          value: true
          description: The proposal creates a house in multiple occupation (HMO) and/or bedsits.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: A net increase in units.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policy SPL3
source-text: For all development that includes a net increase in dwellings and/or commercial/industrial
  unit/s. For all development that includes land that is recorded as a present or historic contamination
  site.
must-include:
- item: A Phase 1 survey for contamination or a statement
  level: must
- item: A plan of the proposed site layout
  level: must
- item: Site reconnaissance or walkover
  level: must
- item: A physical site description including geology and hydrogeology
  level: must
- item: The condition of soil and vegetation, and any evidence of fly-tipped or similar material
  level: must
- item: The condition of structures on site, including any potential for asbestos and fuel storage (including
    heating oil)
  level: must
- item: Review of current and historical maps
  level: must
- item: Previous, present and proposed uses of the site and direct vicinity
  level: must
- item: Previous and current industrial processes carried out on site
  level: must
- item: Details of any waste disposal practices
  level: must
- item: Details of spillage or pollution incidents
  level: must
- item: Any excavation and infilling activities (including current or historic landfill within 250m)
  level: must
- item: A review of any previous investigations
  level: must
- item: All potential receptors on and outside the site within 250m
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 33. Listed as 'Contamination
  Statement'. Other situations may need a contamination report, which may be identified during the application.
  'HMO Applications' are planning applications for a house in multiple occupation, so they are shown as
  full applications.
review-status: unverified
field-status: {}
