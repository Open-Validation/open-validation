reference: biodiversity-survey-report
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected species present or recorded on site, or suitable habitat on or near the
          site to support them (as set out in the Ecology Table).
    - all:
      - condition:
          field: demolition
          value: true
          description: Demolition of a rural building.
      - condition:
          field: outside-urban-area
          value: true
          description: Outside a defined settlement development boundary.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Conversion of barns/agricultural buildings to any use.
    - condition:
        field: pond-on-or-near-site
        value: true
        description: A pond or water body on the site or on a site adjacent to it.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policy PPL4; BS 42020:2013
source-text: 'A survey/assessment is required when:- • There are protected species present / recorded
  on site; and / or, • There’s suitable habitat on or near the site to support protected species (as set
  out in Ecology Table appended to this document). • For avoidance of doubt this is required when the
  development involves: o The demolition of any rural building outside of a defined settlement development
  boundary. o The conversion of barns/agricultural buildings to any use. o A pond or water body is located
  on the application site or on a site adjacent to the application site.'
must-include:
- item: The likely impacts of the proposal on designated sites, protected and Priority species and habitats,
    with appropriate and effective mitigation and compensation where necessary
  level: must
- item: Completed by a qualified ecologist
  level: must
- item: A Phase I Habitat Survey, and any further surveys it identifies, where there is a reasonable likelihood
    of protected species being present or affected
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species are reasonably likely to be present or affected.
confidence: medium
notes: From the council's list (final version published July/August 2026), page 26. Listed as 'Ecology
  Survey'. The Ecology Table (Place Services Biodiversity Validation Checklist, November 2023, linked
  from the council's validation page) gives the species-by-species trigger list. 'HMO Applications' are
  planning applications for a house in multiple occupation, so they are shown as full applications.
review-status: unverified
field-status: {}
