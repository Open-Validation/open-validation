reference: landscaping-plan
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - outline-some
      - reserved-matters
      - technical-details-consent
      - approval-condition
  - condition:
      field: landscaping-works
      value: true
      description: Landscaping is being dealt with in the application.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
source-text: When dealing with landscaping as part of an outline consent, or when dealing with landscaping
  as part of a reserved matters application, or a discharge of condition application.
must-include:
- item: An appropriately scaled plan (1:50, 1:100 or 1:500) with a scale bar
  level: must
- item: Existing hard and soft landscaping to remain
  level: must
- item: Where existing trees and landscaping are retained, their protection during construction (temporary
    fencing)
  level: must
- item: Proposed hard and soft landscaping, including planting or percentage mix and identification of
    all species
  level: must
- item: Any changes in land / site levels
  level: must
- item: Accompanied by a tree survey when any tree exists on site
  level: should
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: A tree exists on site.
confidence: medium
notes: From the council's list (final version published July/August 2026), page 19. Listed as 'Landscaping
  Plan (Hard and Soft)'. A north point is not required.
review-status: unverified
field-status: {}
