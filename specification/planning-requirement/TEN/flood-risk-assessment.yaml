reference: flood-risk-assessment
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3 (including householder alterations and changes of use).
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in flood zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in flood zone 1.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: A change of use to a more vulnerable class (e.g. commercial to residential).
      - site:
          in:
          - surface-water-flood-risk
          - groundwater-flood-risk
          description: Could be affected by sources of flooding other than rivers and the sea.
    - site:
        in:
        - critical-drainage-area
        description: In flood zone 1 with critical drainage problems notified by the Environment Agency.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policy PPL1; NPPF
source-text: 'This includes developments: • in flood zone 2 or 3 for minor development (including householder
  alterations) and changes of use. • more than 1 hectare (ha) in flood zone 1 less than 1 ha in flood
  zone 1, including a change of use in development type to a more vulnerable class (for example from commercial
  to residential), where they could be affected by sources of flooding other than rivers and the sea (for
  example surface water drains, reservoirs). • in an area within flood zone 1 which has critical drainage
  problems as notified by the Environment Agency.'
must-include:
- item: The site address and a description of the development
  level: must
- item: An assessment of the flood risk from all sources, plus an allowance for climate change
  level: must
- item: The estimated flood level, taking the impacts of climate change over the lifetime into account
    (1 in 100 river flood or 1 in 200 tidal flood, plus climate change; allowing for residual risk if
    defences are present)
  level: must
- item: Finished floor levels
  level: must
- item: Flood resistance and resilience plans
  level: must
- item: Any supporting plans and drawings, and any other information the standing advice asks for
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 21. Listed as 'Flood Assessment'.
  The contents are the national requirements; the list has no local requirements for it.
review-status: unverified
field-status: {}
