reference: bng-metric
local-authority: TEN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.tendringdc.gov.uk/content/local-validation-list
policy: Environment Act 2021; Town and Country Planning Act 1990, Schedule 7A
source-text: 'It is a national requirement for planning applications, unless exempt, to be accompanied
  (as a minimum) by the following information:'
must-include:
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date, with the proposed date and the reasons for it)
  level: must
- item: The completed metric calculation tool showing the calculations
  level: must
- item: The publication date and version of the biodiversity metric used
  level: must
- item: A statement on whether the onsite biodiversity value is lower because of degradation, with supporting
    evidence if so
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: The qualification and experience of the author of the metric
  level: must
confidence: medium
notes: From the council's 'Validation & the Local Validation List' web page (Biodiversity Net Gain section),
  checked 2026-11-06; the PDF list itself has no BNG section. The page says it is needed 'unless exempt';
  in law only development subject to the biodiversity gain condition needs it (householder and other exempt
  applications are exempt), so the rule follows the law.
review-status: unverified
field-status: {}
