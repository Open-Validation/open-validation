reference: transport-assessment
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - pip
      - outline-some
      - outline-all
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50+ dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1000+ sqm floorspace.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policies CP1 and CP2
source-text: 'For all Major Planning Applications: • 50+ dwellings; and/or, • 1000+ sqm floorspace.'
must-include:
- item: Appropriate study parameters (area, scope and duration of study)
  level: must
- item: Assessment of public transport capacity, walking/cycling capacity and road network capacity
  level: must
- item: Road trip generation capacity and trip distribution methodologies and/or assumptions
  level: must
- item: Measures to promote sustainable travel
  level: must
- item: Safety implications of the development
  level: must
- item: Mitigation measures (where applicable), including scope and implementation strategy
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 28. The list's own thresholds
  (50+ dwellings and/or 1000+ sqm) are used, not the national major-development definition.
review-status: unverified
field-status: {}
