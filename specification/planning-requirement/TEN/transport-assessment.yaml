reference: transport-assessment
local-authority: TEN
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres or more of floorspace.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
source-text: 'National Requirements None Local List Requirements A Transport Assessment shall include
  the following: appropriate study parameters (i.e. area, scope and duration of study). assessment of
  public transport capacity, walking/cycling capacity and road network capacity. road trip generation
  capacity and trip distribution methodologies and/ or assumptions about the development proposal. measures
  to promote sustainable travels. safety implications of development. mitigation measures (where applicable)'
must-include:
- item: Appropriate study parameters (area, scope and duration of study)
  level: must
- item: Assessment of public transport, walking/cycling and road network capacity
  level: must
- item: Road trip generation and trip distribution methodologies and/or assumptions
  level: must
- item: Measures to promote sustainable travel
  level: must
- item: Safety implications of the development
  level: must
- item: Mitigation measures (where applicable)
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_trigger):
  TA p28 ''50+ dwellings; and/or, 1000+ sqm floorspace''.'
