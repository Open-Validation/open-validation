reference: application-form
local-authority: TEN
required-if:
  always: true
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: All questions completed in full, quoting N/A when not applicable, including the full name and
    address of the applicant and any agent, and the signed Certificate of Ownership and declaration
  level: must
- item: If a legal agreement is needed, applicant and owner details matching those on the up to date Land
    Registry title
  level: should
  required-if: discretionary
- item: Not 'C/o Agent' in the applicant's details
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 4. The list names every
  application type it covers (full, householder, reserved matters, listed building, lawful development
  certificates, adverts, trees, permission in principle, technical details, outline, HMO, s73, deed of
  variation, non-material amendment, discharge of conditions). The ownership certificate and the fee have
  their own sections (no matching id; see the unmapped list).
review-status: unverified
field-status: {}
