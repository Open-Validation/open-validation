reference: elevation-existing
local-authority: TEN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - reserved-matters
        - lbc
        - technical-details-consent
        - outline-some
    - any:
      - condition:
          field: external-alterations
          value: true
          description: Elevations are altered.
      - condition:
          field: new-build
          value: true
          description: Elevations are created.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: The advertisement is attached to a building.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
source-text: All development where elevations are created or altered.
must-include:
- item: At an appropriate scale, 1:50 or 1:100, with a scale bar
  level: must
- item: The materials to be used, annotated on the drawings
  level: must
- item: Details consistent with the associated floor plans (position/size of windows and doors)
  level: should
- item: 'For advertisement consent: only the elevations affected; at least two key dimensions; the extent
    of projection from the building (if applicable)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (final version published July/August 2026), pages 16, 43. Listed as 'Elevations
  / External Views'; advertisement consent has its own section ('All advertisement consent where the advertisement
  is attached to a building.'). Lawful development certificates need proposed elevations only, unless
  the case officer asks. A north point is not required. 'HMO Applications' are planning applications for
  a house in multiple occupation, so they are shown as full applications.
review-status: unverified
field-status: {}
