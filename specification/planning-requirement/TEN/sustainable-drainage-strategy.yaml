reference: sustainable-drainage-strategy
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
    - discretionary
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: More than 1,000 square metres of floor space.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Site greater than 1 hectare.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Site greater than 1 hectare.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policy PPL5
source-text: 'A surface water drainage strategy utilising a Sustainable Drainage System (SuDS) is required
  for: • Major residential applications as well as some minor development; • Applications for the creation
  of more than 1,000 square metres of floor space; and • Sites greater than 1 hectare. • It may also be
  required when a Flood Risk Assessment is required.'
must-include:
- item: How all surface water affects the site and the surrounding area
  level: must
- item: How water behaves on the site, such as runoff rate, flow pathways and infiltration potential
  level: must
- item: The effect of the development on these, and the measures proposed so that runoff rates meet national
    and local policy requirements for the site
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 23. Listed as 'Surface
  Water Drainage Strategy'. 'Some minor development' and 'may also be required when a Flood Risk Assessment
  is required' have no threshold, so they show as discretionary.
review-status: unverified
field-status: {}
