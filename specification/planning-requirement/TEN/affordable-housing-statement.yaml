reference: affordable-housing-statement
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: Residential development of 11 or more dwellings.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policy LP5
source-text: All residential development of 11 or more dwellings.
must-include:
- item: The total number of all proposed residential units
  level: must
- item: The affordable provision as a percentage of the overall number of units
  level: must
- item: The tenure mix of the affordable units and the percentage split
  level: must
- item: Numbers of bedrooms and property types across all tenures, showing a representative mix of unit
    types and size
  level: must
- item: The affordable unit space standards and floor areas (sqm) for each dwelling
  level: must
- item: Metric scaled layout plans showing the location of the affordable units within the development
  level: must
- item: How the affordable housing units will be managed
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 29. Listed as 'Affordable
  Housing Statement (AHS)'.
review-status: unverified
field-status: {}
