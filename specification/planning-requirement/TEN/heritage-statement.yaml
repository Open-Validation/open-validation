reference: heritage-statement
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - lbc
      - advertising
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
  - any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        description: Directly involves or affects a heritage asset or its setting (including development
          adjacent to a heritage asset).
    - discretionary
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Tendring District Local Plan 2013-2033 and Beyond policies PPL8 and PPL9; NPPF
source-text: A Heritage Statement is required to support all applications for planning permission or listed
  building consent, where the proposal directly involves, or affects the heritage asset or its setting.
  This includes listed building and/or conservation area. Development adjacent to a Heritage asset shall
  be taken to “affect” the setting for the purpose of validation, but “setting” may be far more significant
  covering a wider area depending on the importance of the asset and proposed development.
must-include:
- item: The history and evolution of the asset (any previous extensions and alterations), using photographic,
    map, archival and fabric evidence
  level: must
- item: Consideration of the relevant Historic Environment Record
  level: must
- item: A photographic record of the site context and the spaces and features which might be affected,
    preferably cross-referenced to survey drawings
  level: must
- item: An assessment of the archaeological, architectural, historical or other significance of the asset
    and its setting
  level: must
- item: An assessment of the impact of the works on the significance of the asset and its setting, a justification
    for the works (why they are necessary or desirable) and any mitigation measures
  level: must
- item: Whether a variety of options were considered and why the proposed option was chosen
  level: must
- item: 'If historic fabric is to be removed or altered: its significance understood and explained'
  level: must
  required-if:
    condition:
      field: structural-alteration
      value: true
      description: Historic fabric is to be removed or altered.
- item: 'For a listed building: whether the works are reversible in whole or in part'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Relates to a listed building.
confidence: medium
notes: From the council's list (final version published July/August 2026), page 24. The council adds that
  the setting 'may be far more significant covering a wider area depending on the importance of the asset
  and proposed development', a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
