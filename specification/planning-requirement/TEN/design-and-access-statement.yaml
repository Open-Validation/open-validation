reference: design-and-access-statement
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - technical-details-consent
      - lbc
  - any:
    - ref: major-development
    - application-type:
        in:
        - lbc
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area (a World Heritage Site or a conservation area).
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A DAS is required to accompany applications that meet the following criteria: • Applications
  for major development, as defined in article 2 of the Town and Country Planning (Development Management
  Procedure (England) Order 2015; • Applications for development in a designated area, where the proposed
  development consists of: o one or more dwellings; or o a building or buildings with a floor space of
  100 square metres or more. • Applications for listed building consent. For the purposes of Design and
  Access Statements, a designated area means a World Heritage Site or a conservation area. Applications
  for waste development, a material change of use, engineering or mining operations do not need to be
  accompanied by a Design and Access Statement.'
confidence: medium
notes: From the council's list (final version published July/August 2026), page 37. National requirement
  only; the list has no local requirements for it.
review-status: unverified
field-status: {}
