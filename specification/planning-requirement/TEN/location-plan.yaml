reference: location-plan
local-authority: TEN
required-if:
  application-type:
    in:
    - full
    - hh
    - reserved-matters
    - lbc
    - ldc
    - advertising
    - consent-under-tpo
    - notice-trees-in-con-area
    - pip
    - technical-details-consent
    - outline-some
    - outline-all
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, articles 5
  and 7
source-text: For all development proposals.
must-include:
- item: The proposed site area on an Ordnance Survey style map, outlined in one continuous red line
  level: must
- item: Any other land in the applicant's ownership outlined in a blue line
  level: must
- item: At least one access to the public highway (to the metalled carriageway) within the red line
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - consent-under-tpo
      - notice-trees-in-con-area
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
- item: Scaled at 1:1250 or 1:2500, with the relevant scale bar
  level: must
- item: A north point
  level: must
- item: At least one named road
  level: must
- item: Any part of the land or building needed to access the site or building (e.g. shared entrance,
    stairwells or foyer areas) within the red line, with notice served on the relevant owner
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - ldc
      - consent-under-tpo
      - notice-trees-in-con-area
      - pip
      - technical-details-consent
      - outline-some
      - outline-all
- item: 'For outline applications: the area or areas where access points to the development will be situated,
    even if access is reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
      - outline-all
confidence: medium
notes: From the council's list (final version published July/August 2026), pages 9, 41. Advertisement
  consent has its own 'Site Location Plan for Advertisement Consent' section ('For all development proposals
  with an advert.') with the same items except the access and shared-entrance items. Permission in principle
  and technical details consent also list the plan as a national requirement.
review-status: unverified
field-status: {}
