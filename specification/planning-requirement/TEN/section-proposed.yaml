reference: section-proposed
local-authority: TEN
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - technical-details-consent
      - outline-some
  - any:
    - condition:
        field: upper-floor-extension
        value: true
        description: An additional upper floor.
    - condition:
        field: roof-openings
        value: true
        description: Insertion of roof lights or dormer windows.
    - all:
      - site:
          in:
          - listed-building
          description: A listed building.
      - condition:
          field: internal-works
          value: true
          description: Internal changes (addition or removal of walls, doorways etc.).
source-url: https://legacy.tendringdc.gov.uk/sites/default/files/documents/planning/FINAL%20VERSION%20-%20Local%20Validation%20List%20-%20August%202026.pdf
source-text: 'For all development, including householder extension, new buildings/dwellings that include:
  • Additional upper floor. • Insertion of roof lights. • Insertion of dormer windows. • Any internal
  changes to a listed building (addition or removal of walls, doorways etc.).'
must-include:
- item: The internal configuration (finished floor level and ceiling heights), enough to show whether
    new cills will be at least 1.7m above finished floor level
  level: must
- item: At an appropriate scale (1:20, 1:50 or 1:100), with a scale bar
  level: must
- item: Any change in materials proposed
  level: must
confidence: medium
notes: From the council's list (final version published July/August 2026), page 15. Listed as 'Internal
  Sections'. A north point is not required. 'HMO Applications' are planning applications for a house in
  multiple occupation, so they are shown as full applications.
review-status: unverified
field-status: {}
