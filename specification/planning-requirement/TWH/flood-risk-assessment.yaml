reference: flood-risk-assessment
local-authority: TWH
required-if:
  all:
  - site:
      in:
      - flood-risk-zone
      description: Environment Agency Flood Zone 2 or 3.
  - any:
    - all:
      - application-type:
          in:
          - full
          - outline
          - change-of-use
          - s73
          - non-material-amendment
          - lbc
      - condition:
          field: new-build
          value: true
          description: New builds.
    - all:
      - application-type:
          in:
          - full
          - outline
          - change-of-use
          - s73
          - non-material-amendment
          - lbc
          - hh
      - condition:
          field: ground-floor-or-basement
          value: true
          description: Basement or ground floor extensions.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for all applications in Environment Agency Flood Zone 2, or 3 relating to new builds
  and basement or ground floor extensions. … Required for applications in Environment Agency Flood Zone
  2, or 3 relating to basement or ground floor extensions.
must-include:
- item: The risks of all forms of flooding to and from the development and how they will be managed, taking
    climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 25;
  also Householder checklist (September 2020) page 8. The Full & Outline checklist covers full and outline
  planning permission, listed building consent, change of use, and variation/removal of conditions (s73
  and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
