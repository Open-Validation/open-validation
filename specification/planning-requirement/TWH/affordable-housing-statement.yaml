reference: affordable-housing-statement
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - ref: major-development
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for major development
must-include:
- item: Information on both affordable and market housing
  level: must
- item: Numbers of residential units
  level: must
- item: The mix of units with numbers of habitable rooms, or the floorspace of habitable areas
  level: must
- item: Plans showing the location of units and their number of habitable rooms and/or floorspace
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 12.
  The Full & Outline checklist covers full and outline planning permission, listed building consent, change
  of use, and variation/removal of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
