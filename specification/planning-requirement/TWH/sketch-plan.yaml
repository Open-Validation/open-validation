source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Tree-Protection-Order-TCA.pdf
source-text: The sketch plan showing the location of the tree should contain an arrow showing north, boundaries
  and adjoining properties, including house numbers or names, and names of roads. … A sketch plan is not
  mandatory but would be helpful in the assessment.
must-include:
- item: The location of the tree, an arrow showing north, boundaries and adjoining properties (with house
    numbers or names) and names of roads
  level: must
- item: Tree numbering matching the specification of works
  level: must
confidence: medium
notes: From the council's list (works to trees checklist, March 2023), pages 4 and 7. It is 'not mandatory',
  so it shows as discretionary.
