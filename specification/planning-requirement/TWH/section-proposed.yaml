reference: section-proposed
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
    - condition:
        field: building-works
        value: true
        description: Alterations or new building work.
  - application-type:
      in:
      - hh
  - application-type:
      in:
      - advertising
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications involving new building work, alterations to buildings or display of advertisements.
  … Required for all applications except for the replacement of windows and doors … All applications where
  display of advertisements is required.
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
- item: Cross section(s) through the existing/proposed building(s)
  level: must
- item: Existing site levels and finished floor levels, with levels related to a fixed datum point off
    site
  level: should
- item: The proposals in relation to adjoining buildings
  level: should
- item: A cross-section through the advertisement and associated elevation
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 10;
  also Householder checklist (September 2020) page 5 and Advertisement checklist (September 2020) page
  5. Householder applications only for replacement windows and doors don't need sections. The Full & Outline
  checklist covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
