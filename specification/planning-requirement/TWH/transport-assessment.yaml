notes: 'From the council''s list (Full & Outline Planning Applications Checklist, March 2025), page 36-37.
  Two list items share this id: ''Transport Assessment (TA)'' and ''Transport Statement''. Significant
  transport implications and other minor development with transport impacts show as discretionary. The
  old use classes (A1-A5, B1, D2) are as the list names them. The Full & Outline checklist covers full
  and outline planning permission, listed building consent, change of use, and variation/removal of conditions
  (s73 and s96a), so its rules carry those types.'
