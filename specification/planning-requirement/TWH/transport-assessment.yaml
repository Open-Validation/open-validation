reference: transport-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - ref: major-development
    - any:
      - condition:
          field: use-class
          value: school-nursery
          description: Operational development or change of use to schools and nurseries.
      - condition:
          field: use-class
          value: hospital
          description: Operational development or change of use to hospitals.
      - condition:
          field: use-class
          value: place-of-worship
          description: Operational development or change of use to places of worship.
      - all:
        - any:
          - condition:
              field: use-class
              value: shop
              description: Use Class A1.
          - condition:
              field: use-class
              value: financial-professional-services
              description: Use Class A2.
          - condition:
              field: use-class
              value: restaurant-cafe
              description: Use Class A3.
          - condition:
              field: use-class
              value: drinking-establishment
              description: Use Class A4.
          - condition:
              field: use-class
              value: hot-food-takeaway
              description: Use Class A5.
          - condition:
              field: use-class
              value: business
              description: Use Class B1.
          - condition:
              field: use-class
              value: former-d2
              description: Use Class D2.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: Providing 100 sq m or more floorspace.
      - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: 'A Transport Assessment (TA) should be submitted as part of any major development and any
  planning application where the proposed development has significant transport implications. … A Transport
  Statement should be submitted as part of applications for : Operational development or change of use
  to schools and nurseries, hospitals or places of worship Any proposal for operational development or
  change of use of premises to provide 100sqm or more floorspace in Use Classes A1, A2, A3, A4, A5, B1
  or D2 Any other minor development (including residential) which may give rise to transport impacts due
  to the site location, level of parking proposed, PTAL rating, existing parking stress and other factors.'
