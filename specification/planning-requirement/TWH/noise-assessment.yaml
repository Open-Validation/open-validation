reference: noise-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Noise generating equipment or uses that raise disturbance to occupants of nearby
          buildings.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development close to existing sources of noise.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for developments that raise issues of disturbance by noise generating equipment
  or uses, to the occupants of nearby existing buildings. Developments that are considered to be noise
  sensitive which are close to existing sources of noise, should be supported by a noise assessment prepared
  by a suitably qualified acoustician.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
  required-if:
    condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development close to existing sources of noise.
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 32.
  The list calls it 'Noise Impact Assessment and Mitigation Details'. The Full & Outline checklist covers
  full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
