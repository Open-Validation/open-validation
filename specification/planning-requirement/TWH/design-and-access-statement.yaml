reference: design-and-access-statement
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: In a conservation area or affecting a World Heritage Site.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: Creating one or more dwellinghouses.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Creating floorspace of 100 sq m or more.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - conservation-area
        - listed-building
        description: Adverts in conservation areas and for listed buildings.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'Design and access statements are required for: Major development (see definition above);
  Applications in Conservation Areas or effecting World Heritage Sites, where the proposal is creating
  one or more dwellinghouses, or creating floorspace of 100sqm or more. … Design and access statements
  are required for adverts in conservation areas and for Listed Buildings.'
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 7; also
  Advertisement checklist (September 2020) page 5. The householder checklist does not list a Design and
  Access Statement. The Full & Outline checklist covers full and outline planning permission, listed building
  consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules carry those
  types.
review-status: unverified
field-status: {}
