reference: floor-plan-existing
local-authority: TWH
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
      - hh
  - application-type:
      in:
      - ldc-existing-use
  - all:
    - application-type:
        in:
        - pa-ecomms-network
        - pa-extension
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications. … Existing drawings required for existing use and where operational development
  involved.
must-include:
- item: Drawn at a scale of 1:50, 1:100 or 1:200
  level: must
- item: Where existing buildings or walls are to be demolished, shown clearly, with the proposals in relation
    to adjoining buildings
  level: should
- item: Existing site levels and finished floor levels, with levels related to a fixed datum point off
    site
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
- item: A graphic linear scale bar on each drawing
  level: must
- item: Measured, colour coded plans illustrating Gross Internal Area (RICS definition) floorspace for
    each land use over each floor level and tenure type
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
- item: A floorspace schedule of Gross Internal Area (RICS definition) for each land use over each floor
    level and tenure type
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 9; also
  Householder checklist (September 2020) page 5, Certificate of Lawfulness checklist (September 2020)
  page 5 and Larger Home Extension checklist (September 2020) page 5. The telecoms prior notification
  and larger home extension checklists list this only as 'other supporting information' that may be useful,
  so it shows as discretionary for those. The Full & Outline checklist covers full and outline planning
  permission, listed building consent, change of use, and variation/removal of conditions (s73 and s96a),
  so its rules carry those types.
review-status: unverified
field-status: {}
