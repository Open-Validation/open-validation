reference: planning-statement
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - ref: major-development
    - application-type:
        in:
        - lbc
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: A supporting planning statement will be required for all major development, major change
  of use applications or listed building applications.
must-include:
- item: The context and need for the development and how it accords with national, regional and local
    planning policies
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 35.
  The Full & Outline checklist covers full and outline planning permission, listed building consent, change
  of use, and variation/removal of conditions (s73 and s96a), so its rules carry those types.
