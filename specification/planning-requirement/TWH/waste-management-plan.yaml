reference: waste-management-plan
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential and mixed use developments (a Reuse, Recycle and Waste plan).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial use only developments (a waste management strategy).
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Tower Hamlets Reuse, Recycle and Waste SPD
source-text: Required for all residential and mixed use developments Commercial use only developments
  require a waste management strategy
must-include:
- item: A Reuse, Recycle and Waste (RRW) plan for each RRW system
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential and mixed use developments.
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 35.
  The list calls it 'Reuse, Recycle and Waste (RRW) Plan for each RRW system'. The Full & Outline checklist
  covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
