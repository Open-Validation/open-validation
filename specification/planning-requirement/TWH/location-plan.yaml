source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications must include copies of a location plan based on an up to-date map. This
  should be at a scale of 1:1250 or 1:2500 and identify roads / buildings to ensure the location is clear.
  It should show the application site edged in red and use a blue edge to show any other land owned by
  the applicant close to the site. … A plan indicating the site and showing the proposed development
must-include:
- item: Based on an up-to-date map at a scale of 1:1250 or 1:2500
  level: must
- item: Roads and buildings identified so the location is clear
  level: must
- item: Application site edged in red
  level: must
- item: Any other land owned by the applicant close to the site edged in blue
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 6; also
  Householder checklist (September 2020) page 4, Advertisement checklist (September 2020) page 4, Certificate
  of Lawfulness checklist (September 2020) page 4, Telecoms prior notification checklist (September 2020)
  page 4 and Larger Home Extension checklist (September 2020) page 4. For telecoms and larger home extension
  prior notifications the list asks for 'a plan indicating the site and showing the proposed development',
  ideally a location plan. The Full & Outline checklist covers full and outline planning permission, listed
  building consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules carry
  those types.
