reference: biodiversity-survey-report
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
    - any:
      - ref: major-development
      - site:
          in:
          - local-wildlife-site
          description: Within or adjacent to a site of importance for nature conservation (SINC).
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for all major development, and sites within or adjacent to sites of importance for
  nature conservation (SINC), and other applications where the proposal is likely to have an impact on
  wildlife and biodiversity. … Required if proposal is likely to have an impact on wildlife and biodiversity.
must-include:
- item: Whether the site is inhabited by bats
  level: should
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 16;
  also Householder checklist (September 2020) page 6. The list's item is 'Biodiversity Survey Report,
  Urban Greening Statement and Ecology Assessment'. A likely impact on wildlife has no measure, so it
  shows as discretionary. The Full & Outline checklist covers full and outline planning permission, listed
  building consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules carry
  those types.
review-status: unverified
field-status: {}
