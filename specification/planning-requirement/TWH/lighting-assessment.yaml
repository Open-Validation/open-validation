reference: lighting-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - condition:
        field: floodlighting
        value: true
        description: Provision of flood lighting.
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for all applications where the proposal involves the provision of publicly accessible
  developments, in the vicinity of residential property, a listed building or a conservation area, public
  open space, where external lighting would be provided or made necessary by the development, provision
  of flood lighting and tall buildings. Also required for proposals that are likely to produce significant
  solar glare.
must-include:
- item: Details and specifications of any flood / external lighting and their proposed hours of use
  level: must
- item: A light pollution assessment
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 32.
  Publicly accessible developments near homes, listed buildings, conservation areas or open space, tall
  buildings and significant solar glare have no measure in the list, so they show as discretionary. The
  Full & Outline checklist covers full and outline planning permission, listed building consent, change
  of use, and variation/removal of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
