reference: town-centre-impact-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2,500 sq m gross floor space.
    - discretionary
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other main town centre uses in an edge or out of centre location.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the local plan.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: National Planning Policy Framework
source-text: Required for all retail and leisure developments over 2,500 sqm gross floor space and may
  be required for smaller developments which are likely to have a significant impact on smaller centres.
  Impact assessments should also be provided for applications for other main town centre uses when they
  are in an edge of centre or out of centre location and not in accordance with the local plan.
must-include:
- item: Quantitative and qualitative merits of the proposal tested against national and local planning
    policies
  level: must
- item: The scale of the proposal and the effect on existing centres in the locality and wider catchment
  level: should
- item: The qualitative improvements that would result from the scheme
  level: should
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 35.
  The list calls it 'Retail Impact Assessment'. Smaller developments 'likely to have a significant impact
  on smaller centres' show as discretionary. The Full & Outline checklist covers full and outline planning
  permission, listed building consent, change of use, and variation/removal of conditions (s73 and s96a),
  so its rules carry those types.
review-status: unverified
field-status: {}
