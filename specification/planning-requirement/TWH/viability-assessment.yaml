reference: viability-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: All planning applications which trigger a requirement to provide affordable housing or where
  viability is relied upon as a material consideration are required to provide a financial viability assessment.
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 24.
  The list doesn't say what triggers the affordable housing requirement, and whether viability is relied
  on depends on the scheme, so it shows as discretionary. The Full & Outline checklist covers full and
  outline planning permission, listed building consent, change of use, and variation/removal of conditions
  (s73 and s96a), so its rules carry those types.
