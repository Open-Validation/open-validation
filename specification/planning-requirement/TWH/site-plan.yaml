reference: site-plan
local-authority: TWH
required-if:
  application-type:
    in:
    - full
    - outline
    - change-of-use
    - s73
    - non-material-amendment
    - lbc
    - hh
    - advertising
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: 'A site plan should be submitted, to a stated metric scale, showing:'
must-include:
- item: A stated metric scale
  level: must
- item: The direction of North
  level: must
- item: The development in relation to the site boundaries and other existing buildings on the site
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements (where
    affected by the proposal)
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
- item: The position of all trees on the site, and those on adjacent land (where affected by the proposal)
  level: must
- item: The extent and type of hard surfacing (where affected by the proposal)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
- item: Boundary treatment including walls / fencing where proposed
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 7; also
  Householder checklist (September 2020) page 4 and Advertisement checklist (September 2020) page 4. The
  householder and advertisement checklists leave out public rights of way and hard surfacing. The Full
  & Outline checklist covers full and outline planning permission, listed building consent, change of
  use, and variation/removal of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
