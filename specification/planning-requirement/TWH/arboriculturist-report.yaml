reference: arboriculturist-report
local-authority: TWH
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: The works affect trees on or off the site protected by a TPO or conservation area legislation.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The works affect other sizeable trees not covered by a TPO or in a conservation area.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Householder-V5-Sept-2020.pdf
source-text: Tree Survey/ Arboricultural Statement Where the application involves works that affect any
  trees on or off the site that are protected by Tree Preservation Order (TPO) or Conservation Area legislation.
  … Also where the application would affect other sizeable trees that are not covered by a TPO or in a
  Conservation Area.
must-include:
- item: A survey of the trees (to BS5837:2012)
  level: must
- item: An arboricultural implications assessment
  level: must
- item: A list of trees to be retained or removed, and any other tree surgery works
  level: must
- item: A method statement showing how the trees will be physically protected during the works
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the householder trigger left out the ''other sizeable trees'' case. The
  must-include items are the council''s wording from the Full/Outline checklist (''to include a survey
  of the trees, an arboricultural implications assessment, a concise list of trees which are desired to
  be retained/removed any other tree surgery works and a method statement'').'
review-status: unverified
field-status: {}
