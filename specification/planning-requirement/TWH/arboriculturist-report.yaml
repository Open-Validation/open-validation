reference: arboriculturist-report
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
      - hh
  - any:
    - all:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Works affect trees on or off the site.
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: Trees protected by a Tree Preservation Order or conservation area legislation.
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Where the application involves works that affect any trees on or off the site that are protected
  by Tree Preservation Order (TPO) or Conservation Area legislation. Also where the application would
  affect other sizeable trees that are not covered by a TPO or in a Conservation Area.
must-include:
- item: A plan showing the location of all trees on site and within influencing distance of the proposal
  level: must
- item: 'A report to BS5837: 2012 with a survey of the trees and an arboricultural implications assessment'
  level: must
- item: A concise list of trees to be retained/removed and any other tree surgery works
  level: must
- item: A method statement for how the trees will be physically protected during the works
  level: must
- item: A drawing showing new tree planting, as mitigation for tree losses or new landscaping
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 38;
  also Householder checklist (September 2020) page 10. The list calls it 'Tree Survey/ Arboricultural
  Statement'. 'Other sizeable trees' has no measure, so it shows as discretionary. The Full & Outline
  checklist covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
