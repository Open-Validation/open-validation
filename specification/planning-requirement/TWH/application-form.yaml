reference: application-form
local-authority: TWH
required-if:
  application-type:
    in:
    - full
    - outline
    - change-of-use
    - s73
    - non-material-amendment
    - lbc
    - hh
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - pa-ecomms-network
    - pa-extension
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, articles 7,
  13, 14 and 39
source-text: Completed, signed and dated form … Ownership Certificate (A, B, C, D as applicable) … Agricultural
  Holdings Certificate … Completed application form or covering letter … Written description of the proposed
  development or Completed form
must-include:
- item: Ownership Certificate (A, B, C, D as applicable)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
- item: Agricultural Holdings Certificate
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
- item: Completed in full, signed and dated, with the tree ownership details if different from the applicant
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: A written description of the proposed development (in a cover letter if no form is used), with
    the developer's contact address and, if content to receive communications electronically, email address
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: How far the enlarged part of the house extends beyond the rear wall of the original house, its
    maximum height and the height of its eaves
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: The developer's contact details, including email address, and the address details of any adjoining
    premises
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 6; also
  Householder checklist (September 2020) page 4, Advertisement checklist (September 2020) page 4, Certificate
  of Lawfulness checklist (September 2020) page 4, Telecoms prior notification checklist (September 2020)
  page 4, Larger Home Extension checklist (September 2020) page 4 and works to trees checklist (March
  2023) page 4 and 7. A section 211 notice for trees in a conservation area 'does not have to be in any
  particular form'. The fee is listed on every checklist (sent to the unmapped list). The Full & Outline
  checklist covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
