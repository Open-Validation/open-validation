reference: proposed-habitat-plan
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Environment Act 2021
source-text: pre-development and post-development plan(s) drawn to an identified scale (including the
  direction of North), showing the site boundary and on-site habitat existing on the date of application
  (or an earlier date), and any irreplaceable habitat (if applicable), utilising the relevant version
  of UKHab methodology.
must-include:
- item: Drawn to an identified scale, with the direction of North
  level: must
- item: The site boundary and on-site habitat, and any irreplaceable habitat, using the relevant version
    of UKHab
  level: must
- item: Submitted in both PDF and GIS Shapefile format
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 17.
  Part of the BNG Assessment ('BNG plan(s)'). The list says 'all developments subject to the mandatory
  BNG requirement'; householder and other exempt applications are exempt by law. The Full & Outline checklist
  covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
