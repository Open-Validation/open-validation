reference: elevation-proposed
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
    - condition:
        field: building-works
        value: true
        description: Alterations or new building work.
  - application-type:
      in:
      - hh
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - pa-ecomms-network
        - pa-extension
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications where alterations or new building work will be involved and display of advertisements.
  … All applications. … All applications where display of advertisements is required. … Proposed drawings
  only required for proposed use or development.
must-include:
- item: Drawn at a scale of 1:50, 1:100 or 1:200
  level: must
- item: The proposed works shown clearly in relation to what exists; all elevations of the proposal
  level: must
- item: Proposed building materials and style, including materials of finish of windows and doors, where
    possible
  level: should
- item: Blank elevations
  level: should
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of the openings on each property'
  level: should
- item: A linear scale bar on each drawing
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 8; also
  Householder checklist (September 2020) page 5, Advertisement checklist (September 2020) page 5, Certificate
  of Lawfulness checklist (September 2020) page 5, Telecoms prior notification checklist (September 2020)
  page 5 and Larger Home Extension checklist (September 2020) page 5. The telecoms prior notification
  and larger home extension checklists list this only as 'other supporting information' that may be useful,
  so it shows as discretionary for those. The Full & Outline checklist covers full and outline planning
  permission, listed building consent, change of use, and variation/removal of conditions (s73 and s96a),
  so its rules carry those types.
review-status: unverified
field-status: {}
