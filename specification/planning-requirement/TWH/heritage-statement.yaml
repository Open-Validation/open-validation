reference: heritage-statement
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
        - hh
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - locally-listed-building
          - conservation-area
          description: Affects locally or statutorily listed buildings (including their setting), or is
            in or affects the setting of a conservation area.
      - all:
        - condition:
            field: ground-disturbance
            value: true
            description: Disturbance of ground.
        - site:
            in:
            - archaeological-priority-area
            description: Within an Area of Archaeological Potential.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - listed-building
        - listed-building-setting
        - locally-listed-building
        - conservation-area
        description: May impact the setting of heritage assets, listed buildings or conservation areas.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required where the development affects locally or statutorily listed buildings (including
  their setting); where the development is in, or affects the setting of, a conservation area; where the
  development involves the disturbance of ground within an Area of Archaeological Potential. … All applications
  where the proposal may impact the setting of heritage assets, listed buildings or conservation areas
must-include:
- item: The significance of the heritage assets and / or the conservation area setting
  level: must
- item: The impacts, harmful or positive, of the proposal
  level: must
- item: 'For listed buildings: a schedule of works to the listed building(s) and an analysis of the significance
    of its archaeology, history and character'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: The setting of the listed building and of adjacent listed buildings
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 28;
  also Householder checklist (September 2020) page 9 and Advertisement checklist (September 2020) page
  5-6. The list calls it 'Heritage Impact Statement'; for adverts it can form part of the Design and Access
  Statement. The Full & Outline checklist covers full and outline planning permission, listed building
  consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules carry those
  types.
review-status: unverified
field-status: {}
