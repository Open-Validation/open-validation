reference: heritage-statement
local-authority: TWH
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      description: The development affects locally or statutorily listed buildings, including their setting.
  - site:
      in:
      - conservation-area
      description: The development is in, or affects the setting of, a conservation area.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Area of Archaeological Potential.
    - condition:
        field: ground-disturbance
        value: true
        description: The development disturbs the ground.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Householder-V5-Sept-2020.pdf
source-text: Heritage Impact Statement ... Required where the development affects locally or statutorily
  listed buildings (including their setting); where the development is in, or affects the setting of,
  a conservation area; where the development involves the disturbance of ground within an Area of Archaeological
  Potential.
must-include:
- item: A schedule of works to the listed building(s)
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: The works affect a listed building.
  source-text: For listed buildings, the assessment should include a schedule of works to the listed building(s)
- item: An analysis of the significance, history and character of the building or structure, and of its
    setting
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: The works affect a listed building.
  source-text: For listed buildings, the assessment should include a schedule of works to the listed building(s),
    an analysis of the significance of, history and character of the building / structure and an analysis
    of its setting.
confidence: medium
notes: 'Audit (missing_requirement): the Heritage Impact Statement was not captured for Householder or
  Full planning; Grokbot had only a ''Schedule of works'' row lifted from inside its guidance. The council
  also has a separate Heritage Impact Statement requirement page.'
review-status: unverified
