reference: roof-plan-existing
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
        - hh
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Alterations to an existing roof.
      - condition:
          field: new-build
          value: true
          description: New building work.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-roof
        value: true
        description: Advertisements placed on a roof.
  - all:
    - application-type:
        in:
        - pa-ecomms-network
        - pa-extension
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications where alterations to an existing roof are proposed or new building work
  will be involved. … Only required for proposals where advertisements will be placed on a roof
must-include:
- item: Drawn at a scale of 1:50, 1:100 or 1:200
  level: must
- item: The roofing material and its location
  level: should
- item: A linear scale bar on each drawing
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 10;
  also Householder checklist (September 2020) page 6, Advertisement checklist (September 2020) page 5,
  Telecoms prior notification checklist (September 2020) page 5 and Larger Home Extension checklist (September
  2020) page 5. The list says 'Roof Plans', so both existing and proposed are shown. The telecoms prior
  notification and larger home extension checklists list this only as 'other supporting information' that
  may be useful, so it shows as discretionary for those. The Full & Outline checklist covers full and
  outline planning permission, listed building consent, change of use, and variation/removal of conditions
  (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
