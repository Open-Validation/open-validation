reference: construction-management-plan
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - ref: major-development
    - condition:
        field: basement
        value: true
        description: Basement development.
    - condition:
        field: highway-obstruction
        value: true
        description: The application obstructs a public highway.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: 'GLA SPG: The Control of Dust and Emissions During Construction and Demolition'
source-text: Required for major development, as well as minor works including basement developments or
  any application obstructing a public highway.
must-include:
- item: Meets the requirements of the GLA SPG on the Control of Dust and Emissions During Construction
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 21.
  The list calls it 'Construction Environmental Management Plan (CEMP)'. The Full & Outline checklist
  covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
