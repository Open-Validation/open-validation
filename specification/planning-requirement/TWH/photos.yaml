reference: photos
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
        - hh
        - advertising
    - any:
      - condition:
          field: demolition
          value: true
          description: The proposal involves demolition.
      - site:
          in:
          - conservation-area
          - listed-building
          description: Development affecting a conservation area or listed building.
  - all:
    - application-type:
        in:
        - pa-ecomms-network
        - pa-extension
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required where the proposal involves demolition or development affecting a conservation area
  or listed building. TVIA may be required for applications considered to have a significant impact on
  the townscape. … Desirable for all other advertisement applications
must-include:
- item: A Townscape and Visual Impact Assessment (TVIA), where the townscape impact is significant
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 33;
  also Householder checklist (September 2020) page 9, Advertisement checklist (September 2020) page 6,
  Telecoms prior notification checklist (September 2020) page 5 and Larger Home Extension checklist (September
  2020) page 6. The list's item is 'Photographs / Photomontages/ Townscape and Visual Impact Assessments
  (TVIA)'; photos are desirable for other advertisement applications. The telecoms prior notification
  and larger home extension checklists list this only as 'other supporting information' that may be useful,
  so it shows as discretionary for those. The Full & Outline checklist covers full and outline planning
  permission, listed building consent, change of use, and variation/removal of conditions (s73 and s96a),
  so its rules carry those types.
review-status: unverified
field-status: {}
