reference: subsidence-report
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Tree-Protection-Order-TCA.pdf
source-text: When your application relates to alleged damage to property caused by subsidence/damage to
  drains or driveways, subsidence reports will usually be provided by a structural engineer and/or a chartered
  surveyor and be supported by technically analysis from other experts e.g., for root and soil analysis.
must-include:
- item: A description of the property, the damage and crack pattern, when it was first noted, any previous
    underpinning or building work, and the geological strata
  level: must
- item: Details of nearby vegetation and its management since the damage was found, with a plan of the
    vegetation and affected building
  level: must
- item: Level monitoring of vertical movement (or crack monitoring, with the reason) showing a pattern
    consistent with the implicated tree(s)
  level: must
- item: A trial/bore hole profile showing foundation type and depth and soil characteristics
  level: must
- item: 'Sub-soil characteristics: soil type, liquid limit, plastic limit and plasticity index'
  level: must
- item: The location and identification of roots found (DNA testing where inconclusive)
  level: must
- item: Proposals and estimated costs of options to repair the damage
  level: must
- item: A report from a tree surgeon supporting the tree work proposals, including options for avoidance
    or remediation
  level: must
confidence: medium
notes: From the council's list (works to trees checklist, March 2023), pages 5-6. Needed only for alleged
  subsidence damage, so it shows as discretionary.
review-status: unverified
field-status: {}
