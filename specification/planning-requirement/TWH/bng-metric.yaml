reference: bng-metric
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Environment Act 2021
source-text: BNG Metric in Excel form … Required for all developments subject to the mandatory BNG requirement.
must-include:
- item: A statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value of the on-site habitat on the date of application (or an
    earlier date), with the completed Statutory Metric or Small Sites Statutory Metric calculation, its
    publication date and version
  level: must
- item: 'Where an earlier date is used: the date and the reasons for it'
  level: must
- item: A statement on whether the on-site habitat value is lower because of activities ('degradation'),
    with the relevant date where degradation or authorised activities have reduced it
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
- item: The post-development biodiversity value, with the steps taken to minimise adverse effects and
    to provide net gain
  level: must
- item: The completed metric in Excel form, completed in full without major errors
  level: must
- item: 'Where the Small Sites Statutory Metric is used: confirmation that only its habitats are present
    on site and that there are no priority habitats, statutory protected sites or habitats, or European
    protected species'
  level: must
- item: The completed LBTH BNG Checklist
  level: must
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 17.
  The list says 'all developments subject to the mandatory BNG requirement'; householder and other exempt
  applications are exempt by law. The Full & Outline checklist covers full and outline planning permission,
  listed building consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules
  carry those types.
review-status: unverified
field-status: {}
