source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for all full planning applications for telecommunications and mobile phone masts.
  … All applications must also be accompanied by a declaration that the proposal, when operational, will
  meet the ICNIRP (international Commission on Non-Ionizing Radiation Protection).
must-include:
- item: A signed declaration that the equipment and installation is designed to comply fully with the
    ICNIRP radio frequency public exposure guidelines
  level: must
- item: The area of search, details of any consultation, details of the proposed structure, and technical
    justification and information
  level: should
  required-if:
    application-type:
      in:
      - full
- item: Evidence of consultation with local schools and day nurseries
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Evidence of consultation with local schools and day nurseries
  level: must
  required-if:
    all:
    - application-type:
        in:
        - pa-ecomms-network
    - discretionary
  source-text: Evidence of consultation with local schools and day nurseries maybe requested.
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 29;
  also Telecoms prior notification checklist (September 2020) page 5. The list calls it 'ICNIRP Statement
  for Telecommunications Apparatus'. The Full & Outline checklist covers full and outline planning permission,
  listed building consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules
  carry those types.
