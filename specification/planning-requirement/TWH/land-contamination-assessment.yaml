reference: land-contamination-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - site:
        in:
        - contaminated-land
        description: A contaminated site.
    - condition:
        field: industrial-site
        value: true
        description: A site previously used for industrial processes.
    - ref: major-development
    - site:
        in:
        - open-space
        description: On or adjoining public open space.
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required for all applications on contaminated sites, sites previously used for industrial
  processes, major development and those on or adjoining public open space.
must-include:
- item: Enough information to determine whether contamination exists, its nature, the risks it may pose
    and whether they can be reduced to an acceptable level
  level: must
- item: Investigations following BS 10175:2011 + A2:2017
  level: should
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 31.
  The Full & Outline checklist covers full and outline planning permission, listed building consent, change
  of use, and variation/removal of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
