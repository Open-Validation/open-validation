reference: daylight-sunlight-assessment
local-authority: TWH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
    - any:
      - discretionary
      - all:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Residential development.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
source-text: Required on all applications where the proposal is likely to have an adverse effect upon
  levels of light to adjoining sensitive land uses. Also required for all residential major development
  to demonstrate that adequate daylight and sunlight would be provided to new units.
must-include:
- item: The impact of the scheme on the sunlight and daylight received by adjoining/neighbouring residential
    properties and buildings
  level: must
- item: Assessed with the methodology in the most recent version of the BRE's 'Site layout planning for
    daylight and sunlight'
  level: must
- item: That adequate daylight and sunlight would be provided to new units
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 21;
  also Householder checklist (September 2020) page 7. A likely adverse effect on light has no measure,
  so it shows as discretionary. The Full & Outline checklist covers full and outline planning permission,
  listed building consent, change of use, and variation/removal of conditions (s73 and s96a), so its rules
  carry those types.
review-status: unverified
field-status: {}
