reference: environmental-statement
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - condition:
      field: eia-development
      value: true
      description: EIA development (Schedule 1, or Schedule 2 with likely significant effects).
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: An EIA is compulsory for developments listed in Schedule 1 of the EIA Regulations (as amended).
  Developments listed in Schedule 2 of the EIA Regulations will only require an EIA where a development
  is likely to have significant effects on the environment by virtue of their nature, size or location.
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 23.
  The Full & Outline checklist covers full and outline planning permission, listed building consent, change
  of use, and variation/removal of conditions (s73 and s96a), so its rules carry those types.
