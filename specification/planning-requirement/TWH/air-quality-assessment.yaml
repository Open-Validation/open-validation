reference: air-quality-assessment
local-authority: TWH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - change-of-use
      - s73
      - non-material-amendment
      - lbc
  - any:
    - condition:
        field: earthworks
        value: true
        description: Substantial earthworks or demolition.
    - condition:
        field: use-class
        value: education-facility
        description: Education facilities.
    - condition:
        field: use-class
        value: health-facility
        description: Health facilities.
    - condition:
        field: new-open-space
        value: true
        description: Open space (including child play space).
    - all:
      - condition:
          field: new-build
          value: true
          description: New build development.
      - site:
          in:
          - air-quality-management-area
          description: An area of substandard air quality (as shown on the proposals map).
    - ref: major-development
source-url: https://www.towerhamlets.gov.uk/Documents/Planning-and-building-control/Development-control/Application-processing/Full-Outline-Planning.docx
policy: 'Mayor of London: Sustainable Design and Construction SPG; Control of Dust and Emissions During
  Construction SPG 2014'
source-text: 'Both an Air Quality Assessment and an Air Quality Neutral based on current best practice
  is required for: Developments which require substantial earthworks or demolition Developments which
  propose education and health facilities or open space (including child play space); and New build developments
  in areas of substandard air quality (as shown on the proposals map) Major developments'
must-include:
- item: Site location and description of the development as it relates to air quality, with all receptors
    (including sensitive and ecological receptors) and current air quality, dust and odour nearby
  level: must
- item: Full details of mitigation to maintain and improve air quality nearby and protect internal air
    quality
  level: must
- item: Prediction of the impact of construction and of the future operation of the development on local
    air quality
  level: must
- item: Measures to be continued after completion, with timescales
  level: must
- item: An Air Quality (Dust) Risk-Assessment (AQDRA) for each construction sub-phase (Mayor of London
    SPG 2014)
  level: must
- item: Current baseline and future year projections of NO2 and PM10 from monitoring data and the LAEI
  level: must
- item: At least three to six months of measured NO2 data, unless not requested
  level: must
- item: Modelling of the development's parking and building emissions, stating datasets, methodologies,
    meteorological data, background concentrations, traffic data and dispersion model type
  level: must
- item: 'Air Quality Neutral: building and transport emissions of NOx and PM10 compared with the benchmarks'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (Full & Outline Planning Applications Checklist, March 2025), page 13.
  The list's 'education and health facilities' are shown with the use-class field. The Full & Outline
  checklist covers full and outline planning permission, listed building consent, change of use, and variation/removal
  of conditions (s73 and s96a), so its rules carry those types.
review-status: unverified
field-status: {}
