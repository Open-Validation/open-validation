reference: sustainability-statement
local-authority: REI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of non-residential (commercial) floorspace.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Core Strategy policies CS10, CS11 and CS17; Development Management Plan policies CCF1, DES1, DES8,
  DES9 and TAP1; Climate Change and Sustainable Construction SPD (2021)
source-text: In addition, the RBBC Sustainability Checklist should also be completed for major development
  demonstrating how the proposal accords with principles of sustainable development.
must-include:
- item: The completed RBBC Sustainability Checklist (Appendix 5 of the Climate Change and Sustainable
    Construction SPD), showing how the proposal accords with principles of sustainable development
  level: must
confidence: medium
notes: 'From the council''s list (published June 2024), page 9 of the full checklist (also outline p.
  6). The trigger is the row''s: ''Required for developments of 10 or more dwellings or 1000sqm of non-residential
  floorspace''.'
review-status: unverified
field-status: {}
