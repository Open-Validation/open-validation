reference: air-quality-assessment
local-authority: REI
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
    - site:
        in:
        - air-quality-management-area
        description: Site is in an Air Quality Management Area (AQMA).
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - site:
          in:
          - air-quality-management-area
          description: Site is in an Air Quality Management Area (AQMA).
    - discretionary
  - all:
    - application-type:
        in:
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>'
          value: 10
          description: More than 10 dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 200
          description: More than 200 sq m of commercial floorspace.
      - site:
          in:
          - air-quality-management-area
          description: Site is in an Air Quality Management Area (AQMA).
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS10; Development Management Plan policy DES9
source-text: 'Full checklist: ALL MAJORS HAS TO BE IN AQMA ZONE. Outline checklist: Required for developments
  of more than 10 dwellings or 200sqm of commercial floorspace and all development within an AQMA. For
  minor residential development within an AQMA please discuss the need for an air quality assessment with
  the Council’s environmental health team prior to submission, as a full assessment may not be required.'
must-include:
- item: The potential impacts of the development on local air quality and the proposed mitigation measures
    where necessary
  level: should
confidence: medium
notes: 'From the council''s list (published June 2024), page 8 of the full checklist (also outline p.
  5). The full checklist''s trigger (''ALL MAJORS HAS TO BE IN AQMA ZONE'') is unclear: major development
  in an AQMA shows as needed, and other major or AQMA development shows as ''check''. Minor residential
  development in an AQMA is to be discussed with environmental health.'
review-status: unverified
field-status: {}
