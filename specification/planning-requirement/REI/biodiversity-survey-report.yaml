reference: biodiversity-survey-report
local-authority: REI
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected and priority species are known or have the potential to be present.
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policies CS2 and CS10; Development Management Plan policy NHE2
source-text: Where protected and priority species are known or have the potential to be present in addition
  a Preliminary Ecological Appraisal or Phase 1 Habitat Survey should be carried out to provide an initial
  assessment of the impact of the proposed development on wildlife. Depending on the results of the initial
  survey, further protected species surveys may be required. ... The demolition of buildings in areas
  where bat activity has been identified will require a Preliminary Roost Assessment.
must-include:
- item: A Preliminary Ecological Appraisal or Phase 1 Habitat Survey giving an initial assessment of the
    impact on wildlife
  level: should
- item: Proposals for mitigation or compensation measures, including the protection of habitats and provision
    of new habitats
  level: should
  required-if: discretionary
- item: Account taken of the timing of both surveys and site work, particularly for nesting birds, priority
    species and habitats
  level: should
- item: Information capable of assessment under the requirements of the Habitat Regulations
  level: should
- item: A Preliminary Roost Assessment where buildings are demolished in areas where bat activity has
    been identified
  level: must
  required-if:
    all:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - discretionary
confidence: medium
notes: 'From the council''s list (published June 2024), page 9 of the full checklist (also outline p.
  5, householder p. 5). The list''s row is ''Biodiversity checklist and Ecology surveys/reports''. The
  householder checklist says: ''Required where protected species may be affected. E.g. proposed roof enlargements
  / loss of trees''. Bat roost work shows as ''check'' because the list doesn''t map where bat activity
  has been identified. The biodiversity checklist itself (for all applications) has no matching id and
  is listed as unmapped.'
