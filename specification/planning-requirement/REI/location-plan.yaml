reference: location-plan
local-authority: REI
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - ldc-prospective-use
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO); Section
  192 of the Town and Country Planning Act 1990 (lawful development certificates)
source-text: Required
must-include:
- item: A scale bar
  level: should
- item: Normally at a scale of 1:1250 or 1:2500 (metric)
  level: should
- item: Based on an up-to-date Ordnance Survey base
  level: should
- item: The direction of north
  level: should
- item: Sufficient named roads to identify the exact location of the site
  level: should
- item: All the surrounding buildings, roads and footpaths on land adjoining the site
  level: should
- item: A red line around all land necessary to carry out the development (e.g. land for access from a
    public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around all other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 2 of the full checklist (also outline p. 2,
  householder p. 2, lawful development certificate p. 1). The list says 'This drawing should:' before
  each item, so they show as 'should'. The wording is the same in all four checklists.
review-status: unverified
field-status: {}
