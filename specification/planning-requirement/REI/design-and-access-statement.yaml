reference: design-and-access-statement
local-authority: REI
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal consists of one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor area of 100 square metres or more.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO)
source-text: Required for applications for listed building consent, applications for major development,
  or proposals on sites located within a conservation area where a) the proposal consists of one or more
  dwellings or b) a building/s with a floor area of 100 square metres or more.
must-include:
- item: How the design of the development takes the context of the site into account
  level: should
confidence: medium
notes: 'From the council''s list (published June 2024), page 3 of the full checklist (also outline p.
  3, householder p. 2). The householder checklist says: ''Required where a site is located in a conservation
  area and the floorspace created is 100 square metres or more.'''
review-status: unverified
field-status: {}
