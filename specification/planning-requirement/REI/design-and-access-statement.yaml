reference: design-and-access-statement
local-authority: REI
required-if:
  any:
  - application-type:
      in:
      - lbc
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal consists of one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor area of 100 square metres or more.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
source-text: Design and Access Statement Required for applications for listed building consent, applications
  for major developme nt, or proposals on sites located within a conservatio n area where a) the proposal
  consists of one or more dwellings or b) a building/s with a floor area of 100 square metres or more.
must-include:
- item: The design principles and concepts applied to the proposed development
  level: should
- item: How issues relating to access to the development have been dealt with
  level: should
confidence: medium
notes: 'The Householder checklist: ''Required where a site is located in a conservation area and the floorspace
  created is 100 square metres or more.'' Audit (other): the Full checklist''s DAS row covers listed building
  consent.'
review-status: unverified
field-status: {}
