reference: travel-plan
local-authority: REI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of non-residential (commercial) floorspace.
  - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Core Strategy policy CS17; Development Management Plan policy TAP1
source-text: 'Transport assessment / statement / Travel Plan: Required for developments of 10 or more
  dwellings or 1000sqm on commercial. ... A travel plan may also be required by the Local Highway Authority.'
must-include:
- item: A long-term management strategy for the organisation or site that seeks to deliver sustainable
    transport objectives and is regularly reviewed
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 17 of the full checklist (also outline p. 11).
  The travel plan shares the transport assessment row; other cases where Surrey County Council (the highway
  authority) asks for one show as 'check'.
review-status: unverified
field-status: {}
