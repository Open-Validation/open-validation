validation-list:
  url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
  date: 2024-06
  date-basis: 'No date is stated in any checklist. The full, outline, householder and lawful development
    certificate checklists were created 20-21 June 2024 (PDF metadata) and link example drawings uploaded
    in April 2024 or later; the council''s Local Validation list page says ''The Council has reviewed
    and updated its local validation list'' (undated); MHCLG''s local-area-requirements register gives
    start-date 2024-01-01. Much of the wording still dates from c.2021 (fire statements ''From 1st August
    2021'', Climate Change SPD ''scheduled for adoption by the Council in Autumn 2021''). The tree works
    checklist was created 13 March 2025 (PDF metadata). Five checklists: full (used here), outline, householder,
    lawful development certificate (proposed use) and tree works, all on https://www.reigate-banstead.gov.uk/downloads/download/2253/local_validation_lists'
  status: outdated
submission-standards:
- item: Every drawing has a scale bar and states its paper size
  level: must
- item: Drawings at a metric scale (normally 1:1250 or 1:2500 for location plans, 1:200 or 1:500 for block
    plans, 1:50 or 1:100 for other plans)
  level: should
- item: Where an item is not a separate document, identify on the checklist or in a cover letter where
    it can be found (e.g. within the planning statement)
  level: should
- item: Where a listed item is not submitted, written justification of why it is not appropriate for the
    proposal
  level: should
- item: 'Postal applications: one copy of hard documents (online submission via the Planning Portal is
    encouraged)'
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is to the current Full checklist, part of a five-checklist set that is still
    live, but its 2024-06-01 date comes from PDF metadata, and the text suggests c.2021 content with no
    stated date. The capture is broad but unreliable: many triggers come from the wrong table cell (e.g.
    Heritage and Retail), several rows are invented or duplicated, and green belt calculations, recycling/waste
    strategy, parking strategy and householder parking/access requirements are missing. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: IN LAW, NOT YET IN FORCE: abolished from 1 Apr 2027 by the Surrey (Structural
  Changes) Order 2026 (SI 2026/264); successor East Surrey Council (shadow authority elected 7 May 2026,
  no services until vesting). This council remains the LPA and its validation list applies until 31 Mar
  2027; expect a new East Surrey Council list from vesting day.'
