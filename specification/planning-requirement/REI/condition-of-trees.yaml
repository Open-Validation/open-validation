reference: condition-of-trees
local-authority: REI
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/7443/validation_checklist_-_application_for_tree_works.pdf
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: Evidence in support of reasons for works, if the reasons relate to the health or the condition
  of the trees written evidence or diagnostic information (photos e.g. Fungal bracket) from an arboriculturist
  or other appropriate expert.
must-include:
- item: Written evidence or diagnostic information (e.g. photos of a fungal bracket) from an arboriculturist
    or other appropriate expert
  level: must
confidence: medium
notes: From the council's list (tree works checklist, published March 2025), page 2. Needed when the reason
  for the works is the tree's health or condition. Helpful but not mandatory for conservation area notices.
review-status: unverified
