reference: transport-assessment
local-authority: REI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of non-residential (commercial) floorspace.
  - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Core Strategy policy CS17; Development Management Plan policy TAP1
source-text: Required for developments of 10 or more dwellings or 1000sqm on commercial. A transport assessment
  / statement may also be required for other developments which are likely to generate significant amount
  of vehicle movement.
must-include:
- item: Enough information to assess the highways and traffic impact of the development
  level: should
- item: Measures to improve accessibility and safety for all modes of travel, particularly walking, cycling
    and public transport
  level: should
- item: Measures needed to deal with the anticipated transport impacts of the development
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 17 of the full checklist (also outline p. 11).
  Other developments likely to generate a significant amount of vehicle movement show as 'check'.
review-status: unverified
field-status: {}
