reference: fire-statement
local-authority: REI
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of 7 or more storeys.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO); Building
  Safety Bill 2020
source-text: 'Required for all applications for proposals over 7 storeys or 18m high. ... This includes
  where two or more dwellings or educational accommodation are proposed on a building that is 18m or more
  in height or 7 or more storeys. ... Exemptions: Change of use applications that result in the building
  no longer being a ‘relevant building’, outline planning applications and s73 applications.'
must-include:
- item: On the standard form published by the Secretary of State
  level: must
confidence: medium
notes: From the council's list (published June 2024), page 11 of the full checklist (also outline p. 7).
  The full checklist calls it 'Fire Risk Assessment'. Outline and s73 applications are exempt.
review-status: unverified
field-status: {}
