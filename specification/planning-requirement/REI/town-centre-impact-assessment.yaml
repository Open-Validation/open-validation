reference: town-centre-impact-assessment
local-authority: REI
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: An edge- or out-of-centre proposal.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 150
      description: Exceeding 150 square metres of comparison retail floorspace (other thresholds apply
        to other uses).
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
must-include:
- item: The impact of the proposal on existing, committed and planned public and private investment in
    a centre or centres in the catchment area
  level: must
- item: The impact on town centre vitality and viability, including local consumer choice and trade in
    the town centre and the wider retail catchment
  level: must
confidence: low
notes: 'Audit (wrong_trigger): the Full row carried ''Required for all new residential'' (the recycling/waste
  trigger). From the audit: edge- or out-of-centre proposals above floorspace thresholds, e.g. ''exceeding
  150sqm for comparison retail''; the other thresholds weren''t given.'
review-status: unverified
field-status: {}
