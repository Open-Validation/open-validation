reference: town-centre-impact-assessment
local-authority: REI
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Edge of centre or out of centre development.
  - any:
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 150
        description: More than 150 sq m of comparison retail.
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 250
        description: More than 250 sq m of convenience retail.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail warehousing and any other retail, leisure and office uses exceeding 2,500
          sq m.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS7; Development Management Plan policies RET5 and HOR9
source-text: Required for edge of centre or out of centre development proposals exceeding 150sqm for comparison
  retail, 250 sqm for convenience retail, retail warehousing, and any other retail, leisure and office
  uses exceeding 2,500sqm;
must-include:
- item: The impact on existing, committed and planned public and private investment in a centre or centres
    in the catchment area
  level: should
- item: The impact on town centre vitality and viability, including local consumer choice and trade in
    the town centre and wider retail catchment
  level: should
- item: Details of the sequential test process that supports the chosen site location
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 16 of the full checklist (also outline p. 10).
  The list calls it 'Retail Impact Assessment'. It is unclear whether retail warehousing falls under the
  250 sq m or the 2,500 sq m threshold; it is shown with the 2,500 sq m one.
review-status: unverified
field-status: {}
