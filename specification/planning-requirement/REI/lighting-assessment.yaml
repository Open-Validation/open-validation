reference: lighting-assessment
local-authority: REI
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: floodlighting
      value: true
      description: The proposal incorporates external flood lighting.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS10
source-text: Required for all applications where it is proposed to incorporate external flood lighting.
must-include:
