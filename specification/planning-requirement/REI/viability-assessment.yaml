reference: viability-assessment
local-authority: REI
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 dwellings or more (affordable housing applies).
  - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS15; Development Management Plan policy DES6; Affordable Housing SPD
  (April 2020)
source-text: Where an application fails to comply with the Council’s affordable housing policies a viability
  assessment will be required.
must-include:
- item: Reflects the recommended approach in national planning guidance, including standardised inputs
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 7 of the full checklist (also outline p. 5).
  Part of the affordable housing row. Shown as 'check' because it depends on whether the scheme complies
  with the affordable housing policies. On receipt it is made public on the council's website and independently
  audited at the applicant's cost.
review-status: unverified
field-status: {}
