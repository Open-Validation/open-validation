reference: flood-risk-assessment
local-authority: REI
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Site is in Flood Zone 2 or 3.
    - condition:
        field: ground-floor-or-basement
        value: true
        description: The works relate to the ground floor.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF and PPG; Core Strategy policy CS10; Development Management Plan policy CCF2
source-text: 'Required for all proposals for new development in Flood Zones 2 and 3, except where works
  do not relate to the ground floor and for development in sites of 1 hectare or greater in Flood Zone.
  Exceptions: Vehicle crossover, fences'
must-include:
- item: The design of surface water management systems including Sustainable Drainage Systems (SuDS)
  level: should
- item: How safe access to and from the development will be provided in areas at risk of flooding
  level: should
- item: Evidence that the Sequential and Exception Tests of the NPPF have been met
  level: should
  required-if: discretionary
  source-text: The FRA should provide evidence that demonstrates, where required, the Sequential and Exception
    Test of NPPF have been met.
confidence: medium
notes: From the council's list (published June 2024), page 11 of the full checklist (also outline p. 7,
  householder p. 5). Vehicle crossovers and fences are excepted. The list's 'Flood Zone' (for sites of
  1 hectare or more) means any flood zone, including Flood Zone 1.
review-status: unverified
field-status: {}
