reference: flood-risk-assessment
local-authority: REI
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: New development in flood zone 2 or 3, except where the works do not relate to the ground
        floor.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6901/outline_validation_checklist.pdf
source-text: 'Householder: E.g. proposed roof enlargements / loss of trees Flood Risk Assessment, (including
  sequential test and exceptions test where relevant) Green belt calculations Required for all proposals
  for new development in Flood Zones 2 and 3, except where works do not relate to the ground floor and
  for development in sites of 1 hectare or greater in Flood Zone.


  Full planning: Flood Risk Assessment, (including sequential test and exceptions test where relevant)
  Required for all proposals for new developme nt in Flood Zones 2 and 3, except where works do not relate
  to the ground floor and for developme nt in sites of The FRA should identify and assess the risks of
  all forms of flooding to and from the development and demonstrate how these flood risks will be managed,
  taking climate change into account.


  Outline: Flood Risk Assessment, (including sequential test and exceptions test where relevant) Drainage
  Statement including completed Surrey County Council SuDS Required for all proposals for new development
  in Flood Zones 2 and 3, except where works do not relate to the ground floor and for development in
  sites of 1 hectare or greater in Flood Zone.'
must-include:
- item: Sequential test and exception test, where relevant
  level: must
- item: Identify and assess the risks of all forms of flooding to and from the development
  level: must
- item: How these flood risks will be managed, taking climate change into account
  level: must
confidence: medium
notes: '''Required for all proposals for new development in Flood Zones 2 and 3, except where works do
