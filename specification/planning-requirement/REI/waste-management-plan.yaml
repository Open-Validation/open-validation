reference: waste-management-plan
local-authority: REI
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 1
    description: New residential development.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS10; Development Management Plan policy DES1
source-text: Required for all new residential development
must-include:
- item: How refuse and recycling will be stored and collected
  level: must
- item: That the proposal will meet the waste and recycling requirements of the council's 'Making Space
    for Waste' guidance
  level: must
- item: Adequate provision for servicing, including access, circulation and turning space for refuse and
    recycling vehicles
  level: must
- item: Vehicle tracking drawings
  level: should
  required-if: discretionary
  source-text: with inclusion of vehicle tracking drawings as appropriate
confidence: medium
notes: From the council's list (published June 2024), page 16 of the full checklist (also outline p. 11).
  The list calls it 'Recycling / Waste Strategy'.
