reference: roof-plan-proposed
local-authority: REI
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
    - condition:
        field: roof-alteration
        value: true
        description: Alterations are being made to a roof, or a new roof is proposed.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO)
source-text: 'Required where alterations are being made to a roof or a new roof proposed. Lawful development
  certificate checklist: Roof plans and section drawings may also be required'
must-include:
- item: A scale bar
  level: should
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: The shape of the existing and proposed roof, its location and any features such as chimney positions
    or windows
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 6 of the full checklist (also householder p.
  4, lawful development certificate p. 3). 'Or a new roof proposed' is from the householder checklist.
  For a lawful development certificate roof plans 'may also be required', so they show as 'check'.
review-status: unverified
field-status: {}
