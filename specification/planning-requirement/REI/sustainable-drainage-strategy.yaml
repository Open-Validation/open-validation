reference: sustainable-drainage-strategy
local-authority: REI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of non-residential (commercial) floorspace.
  - site:
      in:
      - surface-water-flood-risk
      description: Site is in an area subject to local surface water flooding.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Core Strategy policy CS10; Development Management Plan policy CCF2
source-text: Required for developments of 10 or more dwellings or 1000sqm on commercial and in all areas
  subject to local surface water flooding.
must-include:
- item: Assessment of surface water and foul water
  level: must
- item: Completed Surrey County Council SuDS Pro-forma
  level: must
  required-if:
    ref: major-development
  source-text: Surrey County Council SUDs Pro-forma to be completed for all major applications.
- item: That the development would not have an unacceptable impact on the local area
  level: must
  required-if:
    site:
      in:
      - surface-water-flood-risk
      description: Other development in areas susceptible to surface water flooding.
  source-text: For other development in areas susceptible to surface water flooding, drainage statement
    to be submitted to demonstrate the development would not have an unacceptable impact on the local
    area.
confidence: medium
notes: From the council's list (published June 2024), page 12 of the full checklist (also outline p. 7).
  The list calls it 'Drainage Statement including completed Surrey County Council SuDS Pro-Forma'.
review-status: unverified
field-status: {}
