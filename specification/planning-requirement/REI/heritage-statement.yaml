reference: heritage-statement
local-authority: REI
required-if:
  any:
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      - archaeological-priority-area
      description: Works to a listed building, a building in a conservation area, or another heritage
        asset.
  - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF para 189; Core Strategy policies CS4 and CS10; Development Management Plan policy NHE9
source-text: Required for works to a listed building, a building within a conservation area or other heritage
  asset. May also be required where a proposal impacts the setting of a historic asset.
must-include:
- item: What heritage assets are on the site and why they are significant
  level: must
- item: How they are affected by the proposals, including the potential impact on the assets' significance
  level: must
- item: A structural survey where appropriate
  level: should
  required-if:
    all:
    - application-type:
        in:
        - outline
    - discretionary
  source-text: A structural survey should be provided where appropriate.
confidence: medium
notes: From the council's list (published June 2024), page 12 of the full checklist (also outline p. 8,
  householder p. 6). Heritage assets include scheduled monuments, listed buildings, conservation areas,
  registered parks and gardens, locally listed assets, Archaeological Notification Areas and other non-designated
  assets. Effects on the setting of a historic asset show as 'check' ('may also be required'). The structural
  survey sentence is in the outline checklist only.
review-status: unverified
field-status: {}
