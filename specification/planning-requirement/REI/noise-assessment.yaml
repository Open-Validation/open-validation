reference: noise-assessment
local-authority: REI
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The proposed development is likely to give rise to excess noise / vibration.
  - condition:
      field: noise-sensitive-use
      value: true
      description: The proposed development is likely to suffer from excess noise / vibration.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS10; Development Management Plan policy DES9
source-text: Required where proposed development is likely to give rise to or suffer from excess noise
  / vibration. ... New residential development on sites falling within the 57 dB LAeq (0700 to 2300) or
  48 dB LAeq (2300 to 0700) noise contours for Gatwick Airport should be accompanied by a full noise impact
  assessment.
must-include:
- item: Prepared by a suitably qualified acoustician in accordance with relevant guidance
  level: should
- item: Details of noise / vibration impact and the mitigation measures proposed
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 15 of the full checklist (also outline p. 10).
  The list calls it 'Noise / Vibration Impact Assessment'. New homes inside the Gatwick Airport noise
  contours count as noise-sensitive development in a noisy place.
review-status: unverified
field-status: {}
