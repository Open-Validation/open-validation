reference: arboriculturist-report
local-authority: REI
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The works are likely to affect trees on or adjacent to the application site.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6901/outline_validation_checklist.pdf
source-text: Tree survey / arboricultural assessment Required where works are likely to affect trees either
  on or adjacent to the application site.
must-include:
- item: Tree protection plan and method statement, as set out in the current BS5837 'Trees in relation
    to construction – Recommendations'
  level: should
confidence: medium
notes: 'Audit (wrong_trigger): the Householder row carried the heritage trigger and the Full row a BS5837
  reference; the real trigger is the Outline wording above. The tree works checklist row (a BS 5837 fragment)
  is not kept. The must-include item came from rows the workbook mislabelled ''Schedule of works''.'
review-status: unverified
field-status: {}
