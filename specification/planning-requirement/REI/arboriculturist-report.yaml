reference: arboriculturist-report
local-authority: REI
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Works are likely to affect trees on or adjacent to the application site.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policies CS2 and CS10; Development Management Plan policies DES1 and NHE3
source-text: Required where works are likely to affect trees either on or adjacent to the application
  site.
must-include:
- item: Which trees are to be retained and the means of protecting them during construction works
  level: must
- item: Survey information, protection plan and method statement following the current BS5837 ‘Trees in
    relation to construction – Recommendations’
  level: should
- item: Prepared by a qualified arboriculturist
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 15 of the full checklist (also outline p. 9,
  householder p. 6). The list calls it 'Tree survey / arboricultural assessment'. The householder checklist
  includes street trees.
review-status: unverified
field-status: {}
