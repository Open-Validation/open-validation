reference: site-plan
local-authority: REI
required-if:
  any:
  - application-type:
      in:
      - outline
  - all:
    - application-type:
        in:
        - hh
        - full
        - ldc-prospective-use
    - condition:
        field: footprint-change
        value: true
        description: The proposal changes the building footprint (not required if there is no change to
          the building footprint).
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO); Section
  192 of the Town and Country Planning Act 1990 (lawful development certificates)
source-text: 'Required. Exceptions: If there is no change to the building footprint.'
must-include:
- item: A scale bar
  level: should
- item: Normally at a scale of 1:200 or 1:500 (metric)
  level: should
- item: The direction of north
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site and adjacent land
  level: should
- item: The extent and type of any hard surfacing
  level: should
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
- item: The type and height of boundary treatment (e.g. walls, fences etc.)
  level: should
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
- item: The area or areas where access points to the development will be situated, even if access is to
    be reserved
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: Indicate the area or areas where access points to the development will be situated, even
    if access is to be reserved
confidence: medium
notes: From the council's list (published June 2024), page 4 of the full checklist (also outline p. 4,
  householder p. 3, lawful development certificate p. 2). The list calls it a 'Block plan'. The outline
  checklist has no footprint exception, and asks for the access points instead of hard surfacing and boundary
  treatment.
review-status: unverified
field-status: {}
