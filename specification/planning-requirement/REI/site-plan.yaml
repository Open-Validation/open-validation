reference: site-plan
local-authority: REI
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - ldc
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6901/outline_validation_checklist.pdf
source-text: 'Householder: When required Block plan Required Exceptions: If there is no change to the
  building footprint.


  Full planning: When required Block plan Required Exceptions: If there is no change to the Guidance Notes
  & Where to look for further assistance This drawing should: Contain a scale bar


  Outline: When required Block plan Required Guidance Notes & Where to look for further assistance This
  drawing should: Contain a scale bar


  Lawful development cert: Example of site location layout and block plan (PDF) Policy Driver Section
  192 of the Town and County Planning Act 1990 Section 192 of the Town and County Planning Act 1990 Provided
  (Y/N) Relevant fee Required Application fees can be paid online via the Council’s website, alternatively
  cheques should be made payable to Reigate and Banstead Borough Council.'
must-include:
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees on the site and adjacent land
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: The type and height of boundary treatment (e.g. walls, fences)
  level: must
- item: A scale bar
  level: must
confidence: medium
notes: Block plan contents from the Full and CLP checklists (the workbook had them as tab items). On the
  Householder checklist a block plan is not needed 'If there is no change to the building footprint.'
