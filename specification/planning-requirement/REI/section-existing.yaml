reference: section-existing
local-authority: REI
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: Alterations are being made to ground levels, or the site slopes.
      - condition:
          field: basement
          value: true
          description: Proposed works below ground level.
  - all:
    - application-type:
        in:
        - outline
        - ldc-prospective-use
    - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO)
source-text: 'Required where alterations are being made to ground levels or on sloping sites, or proposed
  works below ground level. Outline checklist: In addition site sections may also be required particularly
  on sites where there is a change of level either existing or proposed. Lawful development certificate
  checklist: Roof plans and section drawings may also be required'
must-include:
- item: A scale bar
  level: should
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: How proposed buildings relate to existing site levels and neighbouring development, with levels
    related to a fixed datum point off site
  level: should
- item: Details of existing and proposed foundations and eaves where a change is proposed, and how encroachment
    onto adjoining land is to be avoided
  level: should
  required-if: discretionary
  source-text: Where relevant show details of existing and proposed foundations and eaves where a change
    is proposed and how encroachment onto adjoining land is to be avoided.
confidence: medium
notes: From the council's list (published June 2024), page 6 of the full checklist (also householder p.
  4, outline p. 4, lawful development certificate p. 3). The list calls them 'Existing and proposed site
  sections and finished floor and site levels'. For outline and lawful development certificate applications
  sections 'may also be required', so they show as 'check'.
review-status: unverified
field-status: {}
