reference: floor-plan-existing
local-authority: REI
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO)
source-text: 'Required. Outline checklist: Additional plans and drawings will in most cases be necessary
  to describe the proposed development as required by the DMPO. This would include the provision of existing
  and proposed floor plans and elevations or parameter plans where appropriate.'
must-include:
- item: A scale bar
  level: should
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: Details of the layout of existing building(s) as well as those for the proposed development
  level: should
- item: Written dimensions to show the overall size of any new buildings or extensions
  level: should
- item: Where existing buildings or walls are to be demolished
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: The proposal involves demolishing buildings or walls.
- item: A drawing number
  level: should
  required-if:
    application-type:
      in:
      - ldc-prospective-use
  source-text: 'All plans should: Contain a scale bar; Normally be at a scale of 1:50 or 1:100 (metric);
    Have a drawing number'
confidence: medium
notes: From the council's list (published June 2024), page 5 of the full checklist (also householder p.
  3, outline p. 4, lawful development certificate p. 3). Outline applications show as 'check' because
  the outline checklist asks for floor plans 'where appropriate'. For a lawful development certificate
  the plans can be limited to the area of change (e.g. if the change is limited to the ground floor, first
  floor plans are not required).
review-status: unverified
field-status: {}
