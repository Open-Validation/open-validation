reference: energy-statement
local-authority: REI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of non-residential (commercial) floorspace.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Core Strategy policies CS10, CS11 and CS17; Development Management Plan policies CCF1, DES1, DES8,
  DES9 and TAP1; Climate Change and Sustainable Construction SPD (2021)
source-text: Required for developments of 10 or more dwellings or 1000sqm of non-residential floorspace
must-include:
- item: How the proposal will meet or improve on the Target Emission Rate (TER)
  level: must
- item: The carbon emissions for each unit in the scheme / commercial floorspace
  level: must
- item: That the proposal follows the energy hierarchy to minimise carbon emissions
  level: must
- item: The proposed carbon-reduction solutions for the development
  level: must
- item: Uses the council's template (Appendix 4 of the Climate Change and Sustainable Construction SPD)
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 9 of the full checklist (also outline p. 6).
  The list calls it the 'RBBC Carbon Reduction Statement' (part of the 'Carbon Reduction Statement and
  Sustainability Checklist' row). DMP policy CCF1 asks new homes for at least a 19% improvement in the
  Dwelling Emission Rate over the TER (Part L1A 2013). The list still describes the SPD as a draft due
  for adoption in Autumn 2021.
review-status: unverified
field-status: {}
