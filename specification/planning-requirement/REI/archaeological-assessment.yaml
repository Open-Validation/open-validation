reference: archaeological-assessment
local-authority: REI
required-if:
  any:
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Groundworks are proposed.
    - site:
        in:
        - scheduled-monument
        - archaeological-priority-area
        description: Within a Scheduled Monument or an area of Archaeological Importance or High Archaeological
          Potential.
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.4
        description: A site exceeding 0.4 hectares.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.4
        description: A site exceeding 0.4 hectares.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: NPPF; Core Strategy policy CS4; Development Management Plan policy NHE9
source-text: Required for all applications where groundworks are proposed within a Scheduled Monument
  or areas of Archaeological Importance or High Archaeological Potential, or all other sites exceeding
  0.4ha
must-include:
- item: A desk based assessment detailing previous nearby finds recorded in the heritage environment record
  level: should
- item: A discussion of the archaeological potential of the site
  level: should
confidence: medium
notes: From the council's list (published June 2024), page 8 of the full checklist (also outline p. 5).
  The list calls it 'Archaeological Assessment/HER Search'. A written scheme of investigation may be required.
review-status: unverified
field-status: {}
