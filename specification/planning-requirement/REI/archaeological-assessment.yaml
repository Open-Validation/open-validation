reference: archaeological-assessment
local-authority: REI
required-if:
  any:
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Groundworks are proposed.
    - site:
        in:
        - scheduled-monument
        - archaeological-priority-area
        description: Within a Scheduled Monument or an area of Archaeological Importance or High Archaeological
          Potential.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.4
      description: All other sites exceeding 0.4ha.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.4
      description: All other sites exceeding 0.4ha.
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
source-text: Archaeological Assessment/HER Search … Required for all applications where groundwork s are
  proposed within a Scheduled Monument or areas of Archaeologi cal Importance or High Archaeologi cal
  Potential, or all other … sites exceeding 0.4ha
must-include:
- item: Previous nearby finds recorded in the historic environment record
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the Air Quality and Archaeology rows shared one merged excerpt, which dropped
  the archaeology 0.4ha threshold (it surfaced in the ecology row).'
review-status: unverified
field-status: {}
