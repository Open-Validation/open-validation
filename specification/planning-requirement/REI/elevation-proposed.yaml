reference: elevation-proposed
local-authority: REI
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.reigate-banstead.gov.uk/download/downloads/id/6904/full_validation_checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO)
source-text: 'Required. Exceptions: Front elevation not required if extension strictly limited to rear.
  Side elevation not required if no change to that elevation. Outline checklist: Additional plans and
  drawings will in most cases be necessary to describe the proposed development as required by the DMPO.
  This would include the provision of existing and proposed floor plans and elevations or parameter plans
  where appropriate.'
must-include:
- item: A scale bar
  level: should
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: All sides of the existing and proposed development, except where no change is proposed to an elevation
  level: should
- item: Positions of the openings on each property
  level: should
- item: A drawing number
  level: should
  required-if:
    application-type:
      in:
      - ldc-prospective-use
  source-text: 'All plans should: Contain a scale bar; Normally be at a scale of 1:50 or 1:100 (metric);
    Have a drawing number'
confidence: medium
notes: From the council's list (published June 2024), pages 5-6 of the full checklist (also householder
  p. 4, outline p. 4, lawful development certificate p. 3). Outline applications show as 'check' because
  the outline checklist asks for elevations 'where appropriate'. The exceptions only drop individual elevations.
review-status: unverified
field-status: {}
