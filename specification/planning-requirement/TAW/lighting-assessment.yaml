reference: lighting-assessment
local-authority: TAW
required-if:
  all:
  - any:
    - condition:
        field: floodlighting
        value: true
        description: The proposal includes floodlighting.
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting.
  - any:
    - condition:
        field: outside-urban-area
        value: true
        description: The site is outside the urban boundary.
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        description: In or next to a Conservation Area, or on or next to a Listed Building.
    - discretionary
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
source-text: floodlighting or external lighting … adjacent to a residential property, outside the urban
  boundary, in/adjacent to a Conservation Area, on/adjacent to a Listed Building, town centres
must-include:
- item: A polar luminance diagram based on vertical luminance at the nearest sensitive premises
  level: must
confidence: medium
notes: 'Audit (wrong_trigger, wrong_document): the workbook used a bat-corridor sentence as the trigger,
  and filed the polar luminance diagram text under an advertisement row. Sites next to a residential property
  and in town centres are shown as officer discretion. The scheme may also need to take account of ecological
  constraints, e.g. bat commuting corridors.'
review-status: unverified
field-status: {}
