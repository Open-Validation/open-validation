reference: lighting-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Floodlighting or external lighting proposed.
    - any:
      - condition:
          field: adjoins-residential-property
          value: true
          description: Site next to a residential property.
      - condition:
          field: outside-urban-area
          value: true
          description: Outside the urban boundary.
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          description: In or next to a conservation area, or on or next to a listed building.
      - site:
          in:
          - town-centre
          description: Buildings within the town centres.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policies SU5 and EN5
source-text: If floodlighting or external lighting is proposed on a site adjacent to a residential property,
  outside the urban boundary, adjacent or within a Conservation Area or adjacent/on a Listed Building
  and buildings within the town centres.
must-include:
- item: A technical specification
  level: must
- item: Layout plan / lighting orientation plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
- item: Hours of operation
  level: must
- item: Details of light spill, including a polar luminance diagram based on vertical luminance at the
    nearest sensitive premises
  level: must
- item: Ecological constraints, e.g. bat commuting corridors
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2024), page 14. Table Two, 2.9 External Lighting Scheme.
  Application types follow Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
