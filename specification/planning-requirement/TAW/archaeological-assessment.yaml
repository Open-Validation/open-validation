reference: archaeological-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - lbc
      - demolition-con-area
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - archaeological-priority-area
        - scheduled-monument
        description: Known to be on or next to a heritage asset of archaeological interest.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policies SS1, EN5 and EN6; NPPF part 16
source-text: Archaeology Assessment Applications for major development; Applications for development known
  to be on or adjacent to a heritage asset of archaeological interest.
must-include:
- item: As a minimum, an archaeological desk-based assessment
  level: must
- item: Where appropriate, a field evaluation assessing the character, condition and extent of any archaeological
    remains
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2024), page 16. Table Two, 2.13 (archaeology part). Application
  types follow Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
