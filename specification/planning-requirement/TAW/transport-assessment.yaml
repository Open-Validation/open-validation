reference: transport-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy SU2; NPPF paragraph 113
source-text: All developments that will generate significant amounts of movement will be required to provide
  a travel plan, and the application should be supported by a transport statement or transport assessment.
must-include:
- item: Enough to assess the development's movements and their impact on the local highway network, as
    Staffordshire County Council highways requires
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 21. Table Two, 2.25 Transport Assessment/Statement
  and Travel Plan. Application types follow Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf)
  (major applications). Shown as 'check' because no threshold for 'significant amounts of movement' is
  given.
