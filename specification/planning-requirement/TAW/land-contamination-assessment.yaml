reference: land-contamination-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        - near-landfill-site
        description: New development on a former petrol filling station, landfill or industrial site,
          or where there are known contamination issues on or around the site.
    - condition:
        field: sensitive-end-use
        value: true
        description: Development with a vulnerable end user (e.g. residential).
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy SU5
source-text: New developments on former petrol filling stations, former landfill sites and former industrial
  sites. Development with a vulnerable end user (e.g. residential development). Development if there are
  known contamination issues associated with the site or the surrounding sites (e.g. if site or surroundings
  had a former industrial use).
must-include:
- item: As a minimum, a desk study and site walkover report
  level: must
- item: 'Survey stages as needed: desk top study; site investigation / detailed investigation; remediation
    strategy / validation report, including a method for unforeseen contamination during excavation and
    construction'
  level: should
- item: Investigation of previous and future uses for potential to contaminate groundwater (much of the
    district is on a principal aquifer)
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 16-17. Table Two, 2.14. Table Three says 'When
  relevant (See section 2.14)'; shown for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
