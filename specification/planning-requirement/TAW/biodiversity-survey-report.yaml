reference: biodiversity-survey-report
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        - special-area-of-conservation
        - local-nature-reserve
        description: On or next to a designated nature conservation site (including Local Wildlife Sites).
    - condition:
        field: semi-natural-habitat-impact
        value: true
        description: Disturbs wildlife habitats, including semi-natural open space.
    - condition:
        field: potential-roost-features
        value: true
        description: Affects buildings with bat roost potential.
    - ref: major-development
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy EN4; NPPF part 15
source-text: Any development on or adjacent to designated nature conservation sites (including Local Wildlife
  Sites) or developments which will result in the disturbance of wildlife habitats including semi-natural
  open space and buildings with bat roost potential. ... This includes for all Major developments.
must-include:
- item: A description of the proposal
  level: should
- item: Desk study and field survey (extended Phase 1 habitat survey and detailed species surveys as necessary)
    of the site and adjacent area likely to be affected
  level: should
- item: Evaluation of features, assessment of likely impacts, and mitigation, compensation and enhancement
    measures with reference to part 15 of the NPPF
  level: should
- item: Surveys at the appropriate time(s) of year, to an approved methodology, by a suitably qualified
    person
  level: should
- item: 'Where trees and hedges are to be removed: a compliance methodology statement covering the hedges
    and trees to be removed, removal and any netting outside the nesting season (September to February),
    netting fitted by a trained ecologist, and daily checks of netting'
  level: should
  required-if:
    condition:
      field: tree-removal
      value: true
      description: Trees or hedges to be removed.
confidence: medium
notes: From the council's list (published July 2024), page 10-11. Table Two, 2.3. Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
