reference: planning-statement
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Leisure and visitor facilities (Policy EC5).
    - condition:
        field: loss-of-use
        value: true
        description: Loss of existing facilities, e.g. a pub, church or community centre (Policy SU6).
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 (all policies, including EC5 and SU6)
source-text: • All major development • Proposals for leisure and visitor facilities (Policy EC5). ...
  Development proposals that involved the loss of existing facilities (e.g. pub, church community centres
  etc.) (Policy SU6).
must-include:
- item: The context and need for the proposed development
  level: must
- item: How the proposal accords with relevant national and local policies
  level: must
- item: How the application has been informed by local community engagement, and any amendments resulting
    from it
  level: must
- item: 'For leisure and visitor facilities or loss of facilities: the specific information needed by
    the relevant Local Plan policies'
  level: must
  required-if:
    any:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Leisure and visitor facilities.
    - condition:
        field: loss-of-use
        value: true
        description: Loss of existing facilities.
confidence: medium
notes: From the council's list (published July 2024), page 19. Table Two, 2.19 Planning Statement including
  Statement of Community Involvement (one document, so no separate SCI file). Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
