reference: section-existing
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - hh
      - lbc
      - demolition-con-area
      - full
      - reserved-matters
      - pa-ecomms-network
  - condition:
      field: change-in-ground-levels
      value: true
      description: Involves a change in ground levels or is on a sloping site.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In cases where a proposal involves a change in ground levels or is on a sloping site, drawings
  at a 1:50 or 1:100 scale should be submitted showing a cross section through the proposed building or
  site.
must-include:
- item: A cross section through the proposed building or site at 1:50 or 1:100
  level: should
- item: How the proposed buildings relate to existing site levels and neighbouring development
  level: should
- item: Existing site levels and finished floor levels
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 9. Table One, 1.11. Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
