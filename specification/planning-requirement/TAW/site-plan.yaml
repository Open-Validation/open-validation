reference: site-plan
local-authority: TAW
required-if:
  application-type:
    in:
    - hh
    - lbc
    - demolition-con-area
    - advertising
    - full
    - outline
    - reserved-matters
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Block plan of the site (e.g. at a scale of 1:200) (3 copies unless the application is submitted
  electronically) showing the following:'
must-include:
- item: At a scale such as 1:200
  level: should
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements (unless they
    would not influence or be affected by the development)
  level: must
- item: All public rights of way crossing or adjoining the site (unless not influenced or affected)
  level: must
- item: The position of all trees on the site and on adjacent land (unless not influenced or affected)
  level: must
- item: The extent and type of any hard surfacing (unless not influenced or affected)
  level: must
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 7. Table One, 1.5 Block Plan. Application types
  follow Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
