reference: affordable-housing-statement
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site area of 0.5 hectares or more.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy HG4; NPPF paragraph 65
source-text: Planning applications for sites of 10 or more dwellings or where the site area is 0.5 hectares
  or more.
must-include:
- item: Compliance with Policy HG4 (Affordable Housing), including parts 4 and 5
  level: must
- item: If included in another document (planning statement or design and access statement), clearly referenced
    by headings
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 10. Table Two, 2.1. Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf)
  (major residential and reserved matters).
review-status: unverified
field-status: {}
