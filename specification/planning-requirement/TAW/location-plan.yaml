reference: location-plan
local-authority: TAW
required-if:
  always: true
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan based on an up-to-date map.
must-include:
- item: At an identified standard metric scale (typically 1:1250 or 1:2500), scaled to fit A4 or A3 wherever
    possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from the highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 7. Table One, 1.4. Table Three marks it for
  every application type.
review-status: unverified
field-status: {}
