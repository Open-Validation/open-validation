reference: design-and-access-statement
local-authority: TAW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - demolition-con-area
    - all:
      - site:
          in:
          - conservation-area
          description: In a conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A design and access statement (DAS) is required for: • Applications for major development;
  • Applications for development in a designated area (Conservation Area) where the proposed development
  consists of: • One or more dwellings; or – • A building or buildings with a floor space of 100 square
  meters or more; • Applications for listed building consent.'
must-include:
- item: How the proposed development is a suitable response to the site and its setting, and that it can
    be adequately accessed by prospective users
  level: must
- item: If combined with a planning statement, this is clearly stated in the submission
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 8. Table One, 1.6. Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
