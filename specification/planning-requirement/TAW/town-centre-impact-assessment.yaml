reference: town-centre-impact-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: A main town centre use not in an existing centre.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the local plan.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 500
          description: Retail and leisure over 500 sq m (net).
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: In an edge of centre or out of centre location.
      - condition:
          field: site-allocation
          value: false
          description: Not allocated in the Local Plan.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy EC1; NPPF part 7
source-text: Sequential Test Planning applications for main town centre uses which are neither in an existing
  centre nor in accordance with the local plan. ... Retail and leisure developments over 500 sqm (net)
  which are proposed in edge of centre and out of centre locations and which are not allocated in the
  Local Plan.
must-include:
- item: 'Sequential test: availability of sites in the main town centre and other centres in the local
    plan before edge and out of centre sites, with reasons other sites were discounted and evidence that
    no sequentially preferable site exists'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in an existing centre.
- item: Retail impact assessment in accordance with planning practice guidance
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: Retail and leisure over 500 sq m (net).
confidence: medium
notes: From the council's list (published July 2024), page 19-20. Table Two, 2.22 Sequential Test and/or
  Retail Impact Assessment. Application types follow Table Three, the council's application checklist
  matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf). The
  applicant pays for the council's assessment of the retail impact.
review-status: unverified
field-status: {}
