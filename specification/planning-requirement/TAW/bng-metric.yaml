reference: bng-metric
local-authority: TAW
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: 'All applications with some exceptions:'
must-include:
- item: The metric, saying which version, the date it was completed (and why if not recent), and information
    about degradation since April 2020 if necessary
  level: must
- item: A statement saying whether the development is subject to BNG or not, and why
  level: must
- item: Description of any irreplaceable habitat on site
  level: must
- item: Draft habitat management and monitoring plan, if providing on-site gains
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: false
      description: Gains provided on site.
- item: How the mitigation hierarchy has been applied, if looking at off-site gains
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site gains proposed.
- item: All on-site (pre- and post-development) habitat information
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 11-12. Table Two, 2.4 Biodiversity Net Gain
  Information. The list says 'All applications with some exceptions'; shown with the biodiversity gain
  condition, as the law sets it (householder and other exempt applications are exempt by law).
review-status: unverified
field-status: {}
