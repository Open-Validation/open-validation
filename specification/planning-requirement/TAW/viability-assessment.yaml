reference: viability-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Not meeting all policy requirements (e.g. affordable housing, education) on viability
        grounds.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy HG4; NPPF part 4
source-text: Where schemes are not proposing to meet all policy requirements, such as affordable housing,
  education etc. As meeting all policy requirements would make them unviable.
must-include:
- item: In accordance with Planning Practice Guidance, RICS guidance and the NPPF
  level: must
- item: Prepared with professional integrity by a suitably qualified practitioner
  level: should
- item: An executive summary setting out the key findings clearly for the public
  level: must
- item: Prepared on the basis that it will be made publicly available, other than in exceptional circumstances
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 22. Table Two, 2.27. Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
