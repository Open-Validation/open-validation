reference: fire-statement
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings (multi-occupied residential building).
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys,
  must be accompanied by a Fire Statement completed by a competent person.
must-include:
- item: Completed by a competent person
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 8. Table One, 1.7. Follows the national rule
  (two or more dwellings or educational accommodation, and 18 m or 7 storeys). Application types follow
  Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf).
review-status: unverified
field-status: {}
