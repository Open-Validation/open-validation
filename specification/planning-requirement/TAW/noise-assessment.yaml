reference: noise-assessment
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Generates significant levels of noise or vibration affecting residential and commercial
          properties.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise sensitive use close to a known noise source.
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy EN5
source-text: Instances where the development would generate significant levels of noise or vibration in
  relation to residential and commercial properties, or it proposes a noise sensitive use in proximity
  to a known noise source.
must-include:
- item: The noise source and its impact, with mitigation to reduce disturbance from noise or vibration
    to acceptable levels
  level: must
- item: Prepared by a suitably qualified acoustician
  level: should
- item: That there is sufficient sound insulation (or other mitigation) to avoid harm to amenity
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 18. Table Two, 2.18 Noise Impact Assessment.
  Application types follow Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf)
  (full applications).
review-status: unverified
field-status: {}
