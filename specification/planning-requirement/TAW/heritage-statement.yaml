reference: heritage-statement
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - lbc
      - demolition-con-area
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      description: Will or may affect a designated heritage asset or its setting (including conservation
        areas, locally listed buildings and scheduled monuments).
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policies SS1, EN5 and EN6; NPPF part 16
source-text: Heritage Statement All development proposals which will/may impact designated Heritage Assets
  and/or their settings (including conservation areas, locally listed buildings and Scheduled Ancient
  Monuments).
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting,
    proportionate to the asset's importance
  level: must
- item: Photographs, phasing plans, historic photographs or drawings, historic maps and other sources,
    where relevant
  level: should
- item: A structural survey in support of any demolition works
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2024), page 16. Table Two, 2.13 (heritage part). Application
  types follow Table Three, the council's application checklist matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf)
  (listed building, conservation area, full, outline and reserved matters; Table Three does not mark householder).
review-status: unverified
field-status: {}
