reference: arboriculturist-report
local-authority: TAW
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: tree-removal
          value: true
          description: Works to fell a tree.
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: A protected tree (TPO or in a conservation area).
    - site:
        in:
        - tree-preservation-zone
        description: May affect a TPO tree.
    - ref: major-development
    - all:
      - condition:
          field: tree-removal
          value: true
          description: A significant number of trees will be lost.
      - discretionary
source-url: https://www.tamworth.gov.uk/sites/default/files/planning_docs/Planning-Application-Validation-Checklist.pdf
policy: Tamworth Local Plan 2006-2031 policy EN4
source-text: Where works are required to a fell a protected tree (TPO or tree in Conservation Area). Where
  a development proposal may have an impact on a TPO tree. All major development schemes. Officer discretion
  will also be considered if a significant amount of trees will be lost.
must-include:
- item: Tree survey by an arboricultural specialist showing the distribution of trees on site and the
    works proposed
  level: must
- item: Arboricultural Impact Assessment showing how the development will co-exist with trees (level changes,
    services, hard surfacing, material storage, future shadowing)
  level: should
- item: Tree root protection zones clearly marked on a scaled plan
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 21. Table Two, 2.26 Tree survey and/or associated
  Arboricultural Impact Assessment. Application types follow Table Three, the council's application checklist
  matrix (https://www.tamworth.gov.uk/sites/default/files/planning_docs/Validation-Checklist.pdf). Significant
  tree loss is left to officer discretion, so that part shows as 'check'.
review-status: unverified
field-status: {}
