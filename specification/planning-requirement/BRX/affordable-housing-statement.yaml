reference: affordable-housing-statement
local-authority: BRX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings are proposed.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: The total development area is 0.5 hectares or larger.
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
source-text: Applications for new residential development where 10 or more dwellings are proposed, or
  the total development area is 0.5 hectares or larger.
confidence: medium
notes: From the council's list (published July 2024), page 7. Appendix C (local list by development type)
  is shown for full, outline and reserved matters applications; householder applications have their own
  list (Appendix B).
review-status: unverified
field-status: {}
