reference: transport-assessment
local-authority: BRX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: use-class
          value: general-industrial
          description: Use Class B2.
      - condition:
          field: floorspace
          operator: '>='
          value: 2500
          description: 2,500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: storage-distribution
          description: Use Class B8.
      - condition:
          field: floorspace
          operator: '>='
          value: 3000
          description: 3,000 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: hotel
          description: Use Class C1.
      - condition:
          field: bedroom-count
          operator: '>='
          value: 75
          description: 75 bedrooms or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: residential-institution
          description: Use Class C2/C2A.
      - condition:
          field: residential-capacity
          operator: '>='
          value: 250
          description: 250 residents or more (Transport Statement threshold).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 'Use Class C3: 50 units or more (Transport Statement threshold).'
    - all:
      - condition:
          field: use-class
          value: shop
          description: Use Class E(a).
      - condition:
          field: floorspace
          operator: '>='
          value: 250
          description: 250 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: restaurant-cafe
          description: Use Class E(b).
      - condition:
          field: floorspace
          operator: '>='
          value: 300
          description: 300 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Use Class E(c).
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: indoor-sport-recreation
          description: Use Class E(d).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: medical-health-services
          description: Use Class E(e)/(f).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: creche-day-nursery
          description: Use Class E(e)/(f).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: business
          description: Use Class E(g).
      - condition:
          field: floorspace
          operator: '>='
          value: 1500
          description: 1,500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: learning-non-residential-institution
          description: Use Class F1/F2(b)(c)(d).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: community-use
          description: Use Class F1/F2(b)(c)(d).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
source-text: Transport Assessment (TA)/Statement (TS) Use Class TS TA B2 2,500sq.m 4,000sq.m B8 3,000sq.m
  5,000sq.m C1 75 bedrooms 100 bedrooms C2/C2A 250 residents 400 residents C3 50 units 80 units E(a) 250sq.m
  800sq.m E(b) 300sq.m 2,500sq.m E(c) 1,000sq.m 2,500sq.m E(d) 500sq.m 1,500sq.m E(e)/(f) 500sq.m 1,000sq.m
  E(g) 1,500sq.m 2,500sq.m
must-include:
- item: 'A Transport Assessment (rather than a Transport Statement) at or above the TA threshold for the
    use class: B2 4,000 sq m; B8 5,000 sq m; C1 100 bedrooms; C2/C2A 400 residents; C3 80 units; E(a)
    800 sq m; E(b) 2,500 sq m; E(c) 2,500 sq m; E(d) 1,500 sq m; E(e)/(f) 1,000 sq m; E(g) 2,500 sq m;
    F1/F2(b)(c)(d) 1,500 sq m'
  level: must
confidence: medium
notes: 'From the council''s list (published July 2024), page 10. Listed as ''Transport Assessment (TA)/Statement
  (TS)'', with a table of thresholds by use class: the rule uses the lower (Transport Statement) column,
  and the higher column decides when a full Transport Assessment is needed. The last row, F1/F2(b)(c)(d),
  is 500 sq m (TS) and 1,500 sq m (TA). Appendix C (local list by development type) is shown for full,
  outline and reserved matters applications; householder applications have their own list (Appendix B).'
review-status: unverified
field-status: {}
