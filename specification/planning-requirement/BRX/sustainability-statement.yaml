reference: sustainability-statement
local-authority: BRX
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential units, including by change of use or conversion.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: New non-residential floorspace.
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
policy: Broxbourne Local Plan policies DSC5, W3, EQ2, EQ3, TM4 and NEB1 (cited by the Sustainability Checklist)
source-text: Applications for all development proposals involving new residential units or where a change
  of use or conversion would create new dwellings and proposals involving new non-residential floorspace.
  … Sustainability checklist … This checklist should be completed and submitted with all planning applications.
must-include:
- item: 'The council''s Sustainability Checklist (Appendix D) completed: details and any supporting information
    for each of its 18 questions, or clear reasons for not including the measures listed'
  level: must
- item: 'For major developments: how the proposal has considered Local Plan Policy W3 (Water Efficiency)'
  level: must
  required-if:
    ref: major-development
- item: 'Where new lighting is proposed: how the proposal has considered Local Plan Policy EQ3 (Lighting)'
  level: must
  required-if:
    condition:
      field: external-lighting
      value: true
      description: The proposal includes new lighting.
confidence: medium
notes: From the council's list (published July 2024), page 6, 10, 12-14. Listed as 'Sustainability Checklist'
  (Appendix C) and 'Sustainability checklist' (Appendix B, for every householder application). Appendix
  D says it 'should be completed and submitted with all planning applications' and that 'The level of
  detail provided should reflect the type and scale of development'; the rule shows Appendix C's triggers
  for other applications. The policies are those its questions cite.
review-status: unverified
field-status: {}
