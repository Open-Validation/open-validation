reference: design-and-access-statement
local-authority: BRX
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.broxbourne.gov.uk/downloads/file/4490/appendix-a
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement is required to accompany applications: … for major development
  … applications within a conservation area proposing: … one or more dwellings; or … a building or buildings
  with a floorspace or 100sq.m or more … applications for listed building consent'
confidence: medium
notes: From the council's list (published July 2024), page 4. Appendix A, footnote 2.
review-status: unverified
