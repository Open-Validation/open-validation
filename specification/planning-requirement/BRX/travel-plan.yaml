reference: travel-plan
local-authority: BRX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: use-class
          value: general-industrial
          description: Use Class B2.
      - condition:
          field: floorspace
          operator: '>='
          value: 2500
          description: 2,500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: storage-distribution
          description: Use Class B8.
      - condition:
          field: floorspace
          operator: '>='
          value: 3000
          description: 3,000 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: hotel
          description: Use Class C1.
      - condition:
          field: bedroom-count
          operator: '>='
          value: 75
          description: 75 bedrooms or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: residential-institution
          description: Use Class C2/C2A.
      - condition:
          field: residential-capacity
          operator: '>='
          value: 250
          description: 250 residents or more (Transport Statement threshold).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 'Use Class C3: 50 units or more (Transport Statement threshold).'
    - all:
      - condition:
          field: use-class
          value: shop
          description: Use Class E(a).
      - condition:
          field: floorspace
          operator: '>='
          value: 250
          description: 250 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: restaurant-cafe
          description: Use Class E(b).
      - condition:
          field: floorspace
          operator: '>='
          value: 300
          description: 300 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Use Class E(c).
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: indoor-sport-recreation
          description: Use Class E(d).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: medical-health-services
          description: Use Class E(e)/(f).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: creche-day-nursery
          description: Use Class E(e)/(f).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: business
          description: Use Class E(g).
      - condition:
          field: floorspace
          operator: '>='
          value: 1500
          description: 1,500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: learning-non-residential-institution
          description: Use Class F1/F2(b)(c)(d).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
    - all:
      - condition:
          field: use-class
          value: community-use
          description: Use Class F1/F2(b)(c)(d).
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 sq m or more (Transport Statement threshold).
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
source-text: Applications for all developments where a TA or TS is required (see above).
confidence: medium
notes: From the council's list (published July 2024), page 10. Same thresholds as the Transport Assessment/Statement.
  Appendix C (local list by development type) is shown for full, outline and reserved matters applications;
  householder applications have their own list (Appendix B).
review-status: unverified
field-status: {}
