reference: air-quality-assessment
local-authority: BRX
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is in an Air Quality Management Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more units.
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: 500 square metres or more.
  - discretionary
