reference: air-quality-assessment
local-authority: BRX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: The site is within an Air Quality Management Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more residential units.
        - condition:
            field: floorspace-non-residential
            operator: '>='
            value: 500
            description: 500 sq m of non-residential floorspace.
    - condition:
        field: direct-air-emissions
        value: true
        description: Industrial uses etc. which include emissions to the atmosphere.
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
source-text: Applications for developments of 10 or more residential units, or 500 square metres of non-residential
  floor space within Air Quality Management Areas and applications for industrial uses etc. which include
  emissions to the atmosphere.
confidence: medium
notes: From the council's list (published July 2024), page 7. Listed as 'Air Quality Impact Assessment'.
  Appendix C (local list by development type) is shown for full, outline and reserved matters applications;
  householder applications have their own list (Appendix B).
review-status: unverified
field-status: {}
