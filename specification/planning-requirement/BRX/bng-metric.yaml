reference: bng-metric
local-authority: BRX
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: 'Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015:'
must-include:
- item: Confirmation that the applicant believes that planning permission, if granted, would be subject
    to the biodiversity gain condition
  level: must
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
- item: 'Where an earlier date is proposed: that date and the reasons for proposing it'
  level: must
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat, including the publication date of the biodiversity metric used
  level: must
- item: A statement whether activities have been carried out before the date of application (or earlier
    date) that result in loss of onsite biodiversity value ('degradation'); if so, the date immediately
    before they were carried out, the pre-development biodiversity value on that date, the completed metric
    calculation tool and any available supporting evidence
  level: must
- item: A description of any irreplaceable habitat (column 1 of the Schedule to the Biodiversity Gain
    Requirements (Irreplaceable Habitat) Regulations 2024) on the land on the date of application (or
    earlier date)
  level: must
confidence: medium
notes: From the council's list (published July 2024), page 7-8. Listed as 'Biodiversity Net Gain requirements'.
  The list ties this to the biodiversity gain condition; householder and other exempt applications are
  exempt by law. 'If this information has not been provided, the local planning authority will likely
  refuse to validate the application.'
review-status: unverified
field-status: {}
