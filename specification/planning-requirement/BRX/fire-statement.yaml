reference: fire-statement
local-authority: BRX
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.broxbourne.gov.uk/downloads/file/4490/appendix-a
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for applications which involve: … the provision of one or more relevant* buildings;
  or … the development of an existing relevant* building … or development within the curtilage of a relevant
  building*. … ‘relevant buildings’ contain two or more dwellings or educational accommodation and are
  18m or more in height or 7 or more storeys.'
confidence: medium
notes: From the council's list (published July 2024), page 4. Appendix A, footnote 3. This covers new
  relevant buildings, development of an existing one and development within its curtilage.
review-status: unverified
field-status: {}
