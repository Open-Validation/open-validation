reference: noise-assessment
local-authority: BRX
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise-sensitive uses (i.e. residential etc.) close to existing noise generating land
          uses (i.e. industrial uses, major roads etc.).
    - condition:
        field: noise-generating-use
        value: true
        description: Noise-generating uses close to noise-sensitive receptors.
    - condition:
        field: plant-equipment
        value: true
        description: The application would introduce new plant or machinery.
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
source-text: Applications proposing noise-sensitive uses (i.e. residential etc.) close to existing noise
  generating land uses (i.e. industrial uses, major roads etc.), or applications proposing noise-generating
  uses close to noise-sensitive receptors, or applications which would introduce new plant or machinery.
confidence: medium
notes: From the council's list (published July 2024), page 9. Listed as 'Noise Impact Assessment'. Appendix
  C (local list by development type) is shown for full, outline and reserved matters applications; householder
  applications have their own list (Appendix B).
review-status: unverified
field-status: {}
