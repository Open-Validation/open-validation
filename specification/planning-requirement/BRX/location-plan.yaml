reference: location-plan
local-authority: BRX
required-if:
  always: true
source-url: https://www.broxbourne.gov.uk/downloads/file/4490/appendix-a
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: As a minimum, applicants will need to submit a ‘location plan’ that shows the application
  site in relation to the surrounding area.
must-include:
- item: Based on an up-to-date map
  level: should
- item: Scale typically 1:1250 or 1:2500, scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Drawn to an identified scale and showing the direction of north
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: A blue line around any other land owned by the applicant, close to or adjoining the application
    site
  level: should
confidence: medium
notes: From the council's list (published July 2024), page 4. Appendix A, footnote 1. Appendix B (householder)
  also lists a 'Site location plan'. The list says 'should' for most of the contents, so they are shown
  as 'should'.
review-status: unverified
field-status: {}
