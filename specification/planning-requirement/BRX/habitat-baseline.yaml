reference: habitat-baseline
local-authority: BRX
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: 'Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015:'
must-include:
- item: Plan(s) drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date), including any irreplaceable
    habitat (if applicable)
  level: must
confidence: medium
notes: 'From the council''s list (published July 2024), page 8. Part of the ''Biodiversity Net Gain requirements'':
  the plan(s) of onsite habitat. The list ties this to the biodiversity gain condition; householder and
  other exempt applications are exempt by law. ''If this information has not been provided, the local
  planning authority will likely refuse to validate the application.'''
review-status: unverified
field-status: {}
