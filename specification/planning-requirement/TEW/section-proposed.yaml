reference: section-proposed
local-authority: TEW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - s73
        - reserved-matters
        - non-material-amendment
    - condition:
        field: change-in-ground-levels
        value: true
        description: The proposal involves a change in ground levels.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent with new architectural features (e.g. new/replacement windows,
          doors, mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2026/07/Type-4-Final-Jan-25-Application-for-planning-permission.docx
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4 and SD8
source-text: Required if a proposal involves a change in ground levels, the plans should show the existing
  and finished levels and the relationship to neighbouring development. ... Applications for listed building
  consent that include new architectural features e.g. new /replacement windows, doors, mouldings, glazing
  bars, shopfronts, signs, panelling, staircases, fireplaces, railings are proposed.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Existing and finished levels and the relationship to neighbouring development
  level: must
- item: Levels related to a fixed datum point
  level: should
- item: Any significant change in levels illustrated by sections showing existing and proposed levels
  level: should
- item: 'Listed building consent with new architectural features: sections at a minimum scale of 1:5'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent with new architectural features (e.g. new/replacement windows,
          doors, mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
confidence: medium
notes: From the council's summary checklist 'Application for planning permission' (January 2025), which
  goes with the list (January 2025, Version 5). Listed building sections are list item 20 (page 15). Application
  types follow the council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
