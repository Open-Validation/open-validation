reference: site-plan
local-authority: TEW
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - demolition-con-area
      - s73
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
        - non-material-amendment
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2026/07/Type-4-Final-Jan-25-Application-for-planning-permission.docx
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and Proposed Block Plan
must-include:
- item: At a scale of 1:200 or 1:500, with North marked
  level: must
- item: 'Existing plan: the existing structures, boundary treatments, trees etc on the site, and any adjacent
    buildings, roads or footpaths'
  level: must
- item: 'Proposed plan: the proposed development in relation to the site boundaries and other existing
    buildings on the site, and any adjacent buildings, roads or footpaths'
  level: must
- item: Any trees or hedges affected by the development
  level: should
- item: Any new boundary walls or fencing proposed
  level: must
- item: Parking areas, existing or proposed, and any other hard surfacing
  level: must
confidence: medium
notes: From the council's summary checklist 'Application for planning permission' (January 2025), which
  goes with the list (January 2025, Version 5). The list's Part A (page 3) asks for a site (block) plan
  at 1:200 or 1:500. Outline (non-reserved matters only), reserved matters ('if necessary to deal with
  the matters reserved') and non-material amendment ('where relevant') checklists ask for it conditionally,
  so those show as discretionary. Application types follow the council's summary checklists (removal/variation
  of a condition is s73).
review-status: unverified
field-status: {}
