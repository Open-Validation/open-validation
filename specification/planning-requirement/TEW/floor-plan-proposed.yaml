reference: floor-plan-proposed
local-authority: TEW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - s73
        - demolition-con-area
    - condition:
        field: building-works
        value: true
        description: Extensions or new buildings.
  - all:
    - application-type:
        in:
        - reserved-matters
        - non-material-amendment
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2026/07/Type-4-Final-Jan-25-Application-for-planning-permission.docx
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for any extensions or new buildings.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: All existing and proposed uses of rooms and any additional floor space
  level: must
confidence: medium
notes: From the council's summary checklist 'Application for planning permission' (January 2025), which
  goes with the list (January 2025, Version 5). Reserved matters and non-material amendment checklists
  ask for floor plans only where necessary or relevant. Application types follow the council's summary
  checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
