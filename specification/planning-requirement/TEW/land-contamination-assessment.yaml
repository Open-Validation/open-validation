reference: land-contamination-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - site:
        in:
        - contaminated-land
        description: Known contaminated sites (for example landfill, petrol station or some agricultural
          uses).
    - condition:
        field: industrial-site
        value: true
        description: Sites previously used for industrial purposes.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 196-198; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14
source-text: 'Required for applications on any sites where risks from land contamination may be reasonably
  suspected, including: • Known contaminated sites (for example landfill, petrol station or some agricultural
  uses) • Sites previously used for industrial purposes'
must-include:
- item: Sufficient risk assessment information on the existence, nature and extent of contamination, the
    risks and the receptors
  level: should
- item: Undertaken by competent persons in line with CLR11 and BS10175
  level: should
- item: A Phase 1 assessment identifying and assessing the sources, pathways and receptors of ground pollution
  level: should
confidence: medium
notes: From the council's list (January 2025, Version 5), page 14, item 17. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
