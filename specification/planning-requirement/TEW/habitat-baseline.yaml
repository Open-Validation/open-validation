reference: habitat-baseline
local-authority: TEW
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment Act 2021)
source-text: 'Biodiversity Net Gain (BNG): All development which would be subject to the general biodiversity
  gain condition introduced by Schedule 7A of the Town and Country Planning Act 1990 (inserted by the
  Environmental Act 2021).'
must-include:
- item: In digital format, drawn to an identified scale and showing the direction of North
  level: must
- item: The onsite habitat existing on the date of application (or earlier proposed date), including any
    irreplaceable habitat
  level: must
- item: A description of any irreplaceable habitat (column 1 of the Schedule to the Biodiversity Gain
    Requirements (Irreplaceable Habitat) Regulations 2024) on the land
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat exists on the land.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 4, item Part A. The On-site Baseline Map
  may be included in the BNG assessment or ecology reports. The list follows the law (development subject
  to the general biodiversity gain condition). For section 73 applications the normal BNG requirements
  do not apply; a S73 BNG Statement is asked for instead (page 5).
review-status: unverified
field-status: {}
