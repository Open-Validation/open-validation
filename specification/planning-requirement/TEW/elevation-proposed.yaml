reference: elevation-proposed
local-authority: TEW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - s73
        - demolition-con-area
    - condition:
        field: building-works
        value: true
        description: Extensions, external alterations or new buildings.
  - all:
    - application-type:
        in:
        - reserved-matters
        - non-material-amendment
    - discretionary
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent with new architectural features (e.g. new/replacement windows,
          doors, mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2026/07/Type-4-Final-Jan-25-Application-for-planning-permission.docx
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4 and SD8; Tewkesbury Borough
  Plan policies RES8, DES4 and HER2
source-text: Required for any extensions, external alterations or new buildings. ... Applications for
  listed building consent that include new architectural features e.g. new /replacement windows, doors,
  mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings are proposed.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: All existing and proposed elevations affected by the proposal shown and labelled (e.g. North Elevation)
  level: must
- item: 'Advertisements: advertisement drawing(s) (e.g. at 1:20) showing advertisement size, siting, materials
    and colours, height above ground, extent of projection, and the method and colour(s) of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Advertisement drawing(s) (e.g. at a scale of 1:20) (showing advertisement size, siting,
    materials and colours to be used, height above ground, extent of projection and details of the method
    and colour(s) of illumination [if applicable]).
- item: 'Listed building consent with new architectural features: detailed elevational drawings at a minimum
    scale of 1:20'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent with new architectural features (e.g. new/replacement windows,
          doors, mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
confidence: medium
notes: From the council's summary checklist 'Application for planning permission' (January 2025), which
  goes with the list (January 2025, Version 5). Listed building drawings are list item 20 (page 15); advertisement
  details are from the listed building and advertisement consent checklist (https://tewkesbury.gov.uk/wp-content/uploads/2025/01/Type-16-Final-Jan-25-Listed-building-consent-and-advertisement-consent.docx).
  For listed building consent, where only minor external alterations are proposed, alternative media may
  be accepted at the council's discretion. Reserved matters and non-material amendment checklists ask
  for proposed elevations only where necessary or relevant. Application types follow the council's summary
  checklists (removal/variation of a condition is s73).
