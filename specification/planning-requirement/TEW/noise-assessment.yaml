reference: noise-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - all:
      - any:
        - condition:
            field: plant-equipment
            value: true
            description: Installation of plant or equipment.
        - condition:
            field: noise-generating-use
            value: true
            description: Operations, activity or use that may cause noise.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: May adversely affect adjoining or nearby noise sensitive properties.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Proposed noise sensitive development that adjoins or is likely to be affected by
          an existing source of noise.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 187, 198; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14;
  Tewkesbury Borough Plan policies EMP5, AGR1 and RET6
source-text: 'Required for any proposal: • Where the proposed development involves the installation of
  any plant or equipment or the carrying out of any operations, activity or use that may adversely affect
  adjoining or nearby noise sensitive properties. • Proposed noise sensitive developments that adjoin
  or are likely to be affected by an existing source of noise e.g. residential development close to a
  commercial/industrial use or trunk road/railway line where the proposed residential development may
  be impacted upon by unacceptable levels of noise.'
must-include:
- item: Prepared by a suitably qualified acoustic consultant
  level: should
- item: Where required, a scheme of noise mitigation measures
  level: must
confidence: medium
notes: From the council's list (January 2025, Version 5), page 15, item 21. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
