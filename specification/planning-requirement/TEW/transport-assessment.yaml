reference: transport-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: Developments creating 50 or more new dwellings (50-79 a transport statement, 80+
          a transport assessment).
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 109-118; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4
  and INF1; Gloucestershire Manual for Streets
source-text: 'Required for applications likely to that generate significant amounts of transport movement.
  ... For developments creating new dwellings: • 50-79 dwellings require a transport statement (TS) •
  80+ dwellings require a transport assessment (TA)'
must-include:
- item: Site assessments using Active Travel England's Planning Application Assessment toolkit
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 150
        description: 150 dwellings or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 7500
        description: 7,500 sq m or more of non-residential floorspace.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 5
        description: Overall development area of 5 hectares or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 5
        description: Overall development area of 5 hectares or more.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 17-18, item 27. Other developments need
  one if they are 'likely to generate significant amounts of transport movement', judged case by case,
  so that part is discretionary. Application types follow the council's summary checklists (removal/variation
  of a condition is s73).
review-status: unverified
field-status: {}
