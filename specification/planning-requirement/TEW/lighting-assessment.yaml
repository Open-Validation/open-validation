reference: lighting-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
      - lbc
      - advertising
  - any:
    - all:
      - site:
          in:
          - area-of-outstanding-natural-beauty
          description: Within the National Landscape (formerly AONB).
      - condition:
          field: external-lighting
          value: true
          description: External lighting is proposed.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting, e.g. for playing pitches or maneges.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF para 198; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14; Tewkesbury
  Borough Plan policies RCN2, EMP5 and AGR1
source-text: Required for all development within the National Landscape Area where external lighting is
  proposed and proposals for floodlighting, e.g. for playing pitches, maneges, etc.
must-include:
- item: Reference to Institution of Lighting Professionals guidance for the reduction of obtrusive light
  level: should
- item: Technical specification, including light intensity
  level: should
- item: A layout plan with beam orientation
  level: should
- item: A schedule of equipment
  level: should
- item: Intended hours of illumination
  level: should
- item: Possible impacts on ecology and dark skies
  level: should
- item: A non-technical summary
  level: should
- item: Reference to additional lighting which may impact on living conditions of existing residents
  level: should
confidence: medium
notes: From the council's list (January 2025, Version 5), page 15, item 19. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
