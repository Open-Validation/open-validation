reference: recreation-facilities-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss or partial loss of existing open space (NPPF Annex 2).
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 96, 98, 103-104; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy
  INF4; Tewkesbury Borough Plan policy LAN4
source-text: Required for applications which involve the loss or partial loss of existing open space as
  defined in Annex 2 of the National Planning Policy Framework.
must-include:
- item: The amount, quality and type of open space that would be lost, and the quantitative and qualitative
    impact on overall supply in the local area
  level: should
- item: Evidence, including engagement with relevant local community groups and partner organisations,
    of why the facility is no longer required and, as appropriate, how, when and where suitable local
    replacement facilities will be provided
  level: must
confidence: medium
notes: From the council's list (January 2025, Version 5), page 16, item 22. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
