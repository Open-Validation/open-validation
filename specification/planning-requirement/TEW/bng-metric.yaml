reference: bng-metric
local-authority: TEW
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (inserted by the Environment Act 2021)
source-text: 'Biodiversity Net Gain (BNG): All development which would be subject to the general biodiversity
  gain condition introduced by Schedule 7A of the Town and Country Planning Act 1990 (inserted by the
  Environmental Act 2021).'
must-include:
- item: The Statutory Metric or Small Sites Metric as an Excel spreadsheet (.xlsx or .xls)
  level: must
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or proposed
    earlier date), with the publication date of the metric used
  level: must
confidence: medium
notes: From the council's list (January 2025, Version 5), page 3-4, item Part A. The list follows the
  law (development subject to the general biodiversity gain condition). For section 73 applications the
  normal BNG requirements do not apply; a S73 BNG Statement is asked for instead (page 5).
review-status: unverified
field-status: {}
