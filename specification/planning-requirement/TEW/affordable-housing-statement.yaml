reference: affordable-housing-statement
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - all:
      - site:
          in:
          - designated-rural-area
          description: In a Designated Rural Area (as defined in the NPPF).
      - condition:
          field: dwelling-count
          operator: '>='
          value: 6
          description: A net increase of 6-9 dwellings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Developments of 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Sites with an area of 0.5 hectares or more.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 20, 35, 61-65; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies
  SD11 and SD12; Tewkesbury Borough Plan policies RES6, RES12 and RES13
source-text: Required for residential developments in the Designated Rural Areas, (as defined in the NPPF)
  that provide a net increase of 6 – 9 dwellings and developments of 10 or more dwellings or sites with
  an area of 0.5 hectares or more.
must-include:
- item: The number, type, mix, size (including the number of bedrooms and bedspaces) and tenure of affordable
    residential units
  level: must
- item: Any different levels or types of affordability or tenure clearly and fully explained
  level: should
- item: How the proposal addresses JCS Policy SD12, with draft heads of terms for the affordable housing
    to be secured by a S106 agreement
  level: should
confidence: medium
notes: From the council's list (January 2025, Version 5), page 6, item 1. Where the full requirement is
  not provided, a viability assessment is required. Application types follow the council's summary checklists
  (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
