reference: arboriculturist-report
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - reserved-matters
      - demolition-con-area
      - consent-under-tpo
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: Affects trees covered by a tree preservation order.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development (new buildings/extensions, hard surfacing, site set up, utilities, excavations
          or changes in ground level) which could affect trees or hedges within or adjoining the site.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: Town and Country Planning Act 1990, sections 197 and 198; Gloucester, Cheltenham and Tewkesbury
  Joint Core Strategy (JCS) policies SD4, SD9 and INF3; Tewkesbury Borough Plan policy NAT1; BS5837:2012
source-text: 'Required for: • Proposals affecting trees covered by a tree preservation order • Proposals
  involving development (including new buildings/extensions, hard surfacing, site set up, utilities, excavations
  or changes in ground level) which could affect trees or hedges within or adjoining a site.'
must-include:
- item: 'Householder: application plans showing the species, position and canopy spread of the tree(s)
    and the implications of the development for them'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: A tree survey drawing and schedule
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
      - demolition-con-area
      - consent-under-tpo
- item: Survey data on the species, size, age, condition and useful life expectancy of trees
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
      - demolition-con-area
      - consent-under-tpo
- item: Tree survey by a competent arboriculturist following BS5837:2012
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
      - demolition-con-area
      - consent-under-tpo
- item: 'Depending on size and scale: an Arboricultural Constraints Plan, Tree Protection Plan and Arboricultural
    Method Statement'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (January 2025, Version 5), page 19, item 30. Further assessment 'maybe
  required' depending on the size and scale of the proposals, so that item is discretionary. Application
  types follow the council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
