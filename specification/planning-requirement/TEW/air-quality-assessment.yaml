reference: air-quality-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: Within or adjoining an Air Quality Management Area (AQMA).
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more dwellings.
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: Residential development on a site larger than 0.5 hectare.
        - condition:
            field: floorspace-non-residential
            operator: '>'
            value: 1000
            description: Other development where the floor-space exceeds 1,000 sq m.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 1
            description: Other development where the site area is 1 hectare or more.
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 187, 199; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14;
  Tewkesbury Borough Plan policies TEW3 and RET9
source-text: 'Likely to be required for: • Within or adjoining an Air Quality Management Area (AQMA) if
  the proposal is for either 10 or more dwellings (or residential development on a site larger than 0.5
  hectare), or for any other type of development where the floor-space exceeds 1,000 square metres or
  the site area is 1 hectare • Proposals that would lead to an increase in congestion or HGV movements,
  include significant amounts of car parking, emit dust • Proposals that introduce “sensitive receptors”
  e.g. dwellings, schools, hospitals, into an area of poor air quality'
confidence: medium
notes: From the council's list (January 2025, Version 5), page 7, item 4. The other triggers (more congestion
  or HGV movements, 'significant amounts' of car parking, dust, or sensitive receptors in an area of poor
  air quality) are not defined, and the list says an assessment is 'likely to be required' and advises
  pre-application advice, so they show as discretionary. Application types follow the council's summary
  checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
