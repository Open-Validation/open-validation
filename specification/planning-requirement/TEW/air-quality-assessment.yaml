reference: air-quality-assessment
local-authority: TEW
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is within or adjoining an Air Quality Management Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: A residential site of 0.5 hectares or more.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Other development over 1,000 square metres.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Other development on a site of 1 hectare or more.
  - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted item 3''s trigger (new agricultural buildings). From
  the audit (item 4): a site within or adjoining an AQMA with 10+ dwellings or 0.5 ha+, or other development
  over 1,000 sqm or 1 ha+; plus proposals that add congestion, HGV movements or significant parking, emit
  dust, or bring sensitive receptors into poor air quality areas (officer discretion).'
review-status: unverified
field-status: {}
