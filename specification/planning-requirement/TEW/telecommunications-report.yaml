reference: telecommunications-report
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
      - prior-approval
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF para 122; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14; Tewkesbury
  Borough Plan policy COM3
source-text: All applications proposing telecommunications development, including applications for prior
  approval under the Town and Country Planning (General Permitted Development) Order.
must-include:
- item: The outcome of consultations with organisations with an interest, in particular the relevant body
    where a mast is near a school or college or within an aerodrome or technical site safeguarding zone
  level: should
- item: 'For an addition to an existing mast or base station: a self-certification that cumulative exposure
    will not exceed ICNIRP guidelines'
  level: should
- item: 'For a new mast or base station: evidence that erecting antennas on an existing building, mast
    or other structure was explored, and a self-certification that ICNIRP guidelines will be met'
  level: should
confidence: medium
notes: From the council's list (January 2025, Version 5), page 18, item 29. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
