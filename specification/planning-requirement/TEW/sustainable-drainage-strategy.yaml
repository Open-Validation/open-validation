reference: sustainable-drainage-strategy
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings or dwellings.
    - condition:
        field: footprint-area
        operator: '>='
        value: 250
        description: A non-residential extension with a footprint of 250 sq m or more.
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 43, 158, 166, 172-174; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS)
  policies SD4, SD14, INF2, INF3, INF6 and INF7; Tewkesbury Borough Plan policy ENV2; Flood Risk & Water
  Management SPD
source-text: 'Required for all applications for full or outline planning permission except: • non-residential
  extensions with a footprint less than 250 square metres. • alterations that do not increase the size
  of buildings e.g. alterations to external appearance. • householder development'
must-include:
- item: A report, proportionate to the development, outlining the water cycle issues and suitable means
    of providing for sustainable drainage of the site in the long term
  level: must
- item: How foul and storm water sewage from the development will be addressed
  level: must
- item: Existing drainage systems and problems, infiltration, groundwater, surface water flow, foul and
    storm water disposal and any other drainage related flooding issues
  level: must
confidence: medium
notes: 'From the council''s list (January 2025, Version 5), page 22, item 34. The list''s item 10 (Drainage
  Strategy including SuDS, page 10) refers to item 34, the Water Management Statement. Exempt: non-residential
  extensions under 250 sq m footprint, alterations that do not increase the size of buildings, and householder
  development. Other cases (e.g. changes of use) are not clearly in or out, so they show as discretionary.
  Application types follow the council''s summary checklists (removal/variation of a condition is s73).'
review-status: unverified
field-status: {}
