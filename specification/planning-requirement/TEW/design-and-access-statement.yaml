reference: design-and-access-statement
local-authority: TEW
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2026/07/Type-4-Final-Jan-25-Application-for-planning-permission.docx
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD4
source-text: 'Applications for major development, as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015. Applications for listed building consent. Applications
  for development in a Conservation Area, where the proposed development consists of: one or more dwellings;
  or a building or buildings with a floor space of 100 square metres or more.'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: should
- item: How issues relating to access to the development have been dealt with
  level: should
confidence: medium
notes: From the council's summary checklist 'Application for planning permission' (January 2025), which
  goes with the list (January 2025, Version 5). Contents from the list's Part A (page 3), which refers
  to JCS Policy SD4. Applications for a material change of use or engineering operations do not require
  one.
review-status: unverified
field-status: {}
