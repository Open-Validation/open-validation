source-text: 'Full planning, Listed building consent: Page | 4 April 2026 No design and access statement
  submitted: a design and access statement is required for: Major applications Listed building consent
  applications Applications for development in a designated area consisting of o one or more dwellings,
  or o where the floor space created by the building or buildings is 100 square metres or more Further
  guidance on what should be included within a design and access statement can be found here.


  Outline: A Design and Access statement (if required) – this should outline the design principles and
  concepts that have been applied to the proposed development and how issues relating to access to the
  development have been dealt with.'
