reference: flood-risk-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or greater in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or greater in Flood Zone 1.
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - site:
        in:
        - critical-drainage-area
        description: In Flood Zone 1 but affected by critical drainage problems.
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 44, 125, 161, 164, 170-182; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy
  (JCS) policies SD4, SD14, INF2, INF3, INF6 and INF7; Tewkesbury Borough Plan policies INF2 and ENV2;
  Flood Risk & Water Management SPD
source-text: 'A Flood risk assessment (FRA) is required for planning applications for: • Any development
  of 1 hectare or greater in Flood Zone 1. • All proposals for Development in Flood Zones 2 and 3 • Areas
  within flood zone 1 which are affected other sources of flooding, e.g. critical drainage problems, reservoirs
  etc.'
must-include:
- item: Assesses the risks of fluvial, surface water and other sources of flooding
  level: should
- item: 'For sites of strategic scale: the cumulative impact on flood risk to existing settlements, communities
    or allocated sites, with mitigation measures'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: A site of strategic scale.
- item: Based on the most up-to-date climate change guidance from the Environment Agency
  level: should
- item: Evidence of the Sequential and Exception tests, if required
  level: should
- item: 'Householder: details of the existing and proposed floor levels (all that is required)'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: However, all that is required are details of the existing and proposed floor levels for
    a householder application.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 11, item 13. Areas in Flood Zone 1 affected
  by other sources of flooding ('reservoirs etc.') have no single designation, so that part is discretionary.
  The householder item is from the householder checklist (https://tewkesbury.gov.uk/wp-content/uploads/2025/01/Type-1-Final-Jan-25-Householder-application-for-planning-permission.docx).
  Application types follow the council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
