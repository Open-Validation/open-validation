reference: heritage-statement
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - lbc
      - demolition-con-area
      - advertising
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - battlefield
        description: 'Designated heritage assets are affected: scheduled monuments, listed buildings,
          buildings in conservation areas, registered parks and gardens, registered battlefields.'
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: Planning (Listed Buildings and Conservation Areas) Act 1990; NPPF para 214; Gloucester, Cheltenham
  and Tewkesbury Joint Core Strategy (JCS) policies SD4 and SD8; Tewkesbury Borough Plan policies HER1-HER6
source-text: 'Required for planning applications where heritage assets are affected. Heritage assets include:
  • Designated assets: Scheduled Monuments, Listed Buildings, Buildings in Conservation Areas; Registered
  Parks and Gardens; Registered Battlefields. • Undesignated assets: unlisted historic buildings and structures;
  undesignated archaeological sites. • Heritage assets that are identified during the preparation of development
  proposals e.g. through desk-based assessment or field evaluation.'
must-include:
- item: Identification of all designated and undesignated heritage assets affected, including their settings
  level: should
- item: A description of the significance of these assets, proportionate to their importance
  level: should
- item: An assessment of the potential impact of the development on the significance of the assets
  level: should
- item: Reference to any relevant desk-based assessments, field evaluations or other supporting documentation
  level: should
- item: Justification for the proposed works and their impact on the significance of the asset or its
    setting
  level: should
- item: The Historic Environment Record consulted, as a minimum
  level: should
confidence: medium
notes: From the council's list (January 2025, Version 5), page 13, item 16. Undesignated assets (unlisted
  historic buildings and structures, undesignated archaeological sites, and assets found while preparing
  proposals) have no mapped designation, so they show as discretionary. The list calls it the Historic
  Environment Statement. Application types follow the council's summary checklists (removal/variation
  of a condition is s73).
review-status: unverified
field-status: {}
