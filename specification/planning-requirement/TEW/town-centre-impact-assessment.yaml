reference: town-centre-impact-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Town centre uses located outside town and local centres.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 91-95; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD2;
  Tewkesbury Borough Plan policies RET1, RET4 and EMP4
source-text: Applications for retail, leisure and office development outside of town centres, which are
  not in accordance with an up-to-date Local Plan, are required to provide an impact assessment where
  the development has a floorspace of 2,500 square metres or more and demonstrate that they would not
  harm the vitality and viability of centres or planned investment in centres (in accordance with the
  NPPF). The NPPG provides further guidance. Developments for town centre uses (as defined in the NPPF)
  located outside town and local centres must comply with the sequential test.
must-include:
- item: A sequential test
  level: must
- item: An impact assessment demonstrating no harm to the vitality and viability of centres or to planned
    investment in centres
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: Retail, leisure or office development of 2,500 sq m or more outside town centres and
        not in line with an up-to-date Local Plan.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 17, item 26. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
