reference: waste-management-plan
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings (bin storage).
    - discretionary
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.5
          description: Residential development on a site larger than 0.5 hectare.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Other development where the floor-space exceeds 1,000 sq m.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Other development where the site area is 1 hectare or more.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF para 131; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD3, SD4
  and SD14; Tewkesbury Borough Plan policies RES5 and EMP5; Gloucestershire Waste Core Strategy policy
  WCS2; Waste Minimisation in Development Projects SPD
source-text: All proposals involving development that would require bin storage, e.g. all new dwellings,
  retail and business developments. ... Required for any proposal for either 10 or more dwellings (or
  residential development on a site larger than 0.5 hectare), or for any other type of development where
  the floor-space exceeds 1,000 square metres or the site area is 1 hectare or more.
must-include:
- item: Bin storage and collection points shown clearly on drawings at 1:100, 1:200 or 1:500; can be on
    the block plan, but a separate plan for major schemes
  level: must
- item: 'Waste minimisation statement: how waste from demolition, construction and occupation will be
    minimised and sustainably managed'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: Residential development on a site larger than 0.5 hectare.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Other development where the floor-space exceeds 1,000 sq m.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Other development where the site area is 1 hectare or more.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 7, item 5. Combines item 5 (Bin Store)
  and item 33 (Waste Minimisation Statement, page 21). Other development 'that would require bin storage'
  (e.g. retail and business) is not defined, so it shows as discretionary. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
