reference: daylight-sunlight-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - reserved-matters
  - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF para 135; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4 and
  SD14; Tewkesbury Borough Plan policy RES10
source-text: Any application where there is a potential adverse impact upon the current levels of sunlight/daylight
  enjoyed by adjoining properties or building(s), including associated gardens or amenity space. Any application
  for development that may themselves be adversely affected by adjoining sites or where one part of the
  proposed development may be impacted upon by another part of the development.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 9, item 9. Whether there is a 'potential
  adverse impact' is a judgement, so the trigger is discretionary. Application types follow the council's
  summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
