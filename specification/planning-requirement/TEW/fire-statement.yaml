reference: fire-statement
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or higher.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Contains educational accommodation.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Fire statement, required for buildings that are 18 metres or higher or buildings that comprise
  7 or more storeys, and the building contains 2 or more dwellings or educational accommodation.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 3, item Part A. Shown for planning permission
  types; the checklists also list it on listed building and conservation area consent checklists, but
  the legal requirement is for planning applications.
review-status: unverified
field-status: {}
