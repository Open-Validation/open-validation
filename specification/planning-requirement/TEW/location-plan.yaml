reference: location-plan
local-authority: TEW
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - demolition-con-area
    - advertising
    - ldc
    - approval-condition
    - pa-ecomms-network
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A location plan:'
must-include:
- item: Based on an up to date (licensed) Ordnance Survey plan, not title or registry plans
  level: must
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: Showing the direction of North
  level: must
- item: Showing the site area and its surrounding context, including at least two named roads (where possible)
  level: must
- item: A red line around all land required for the development, including access to the public highway
    where relevant
  level: must
- item: A blue outline around other land owned by the applicant close to or adjoining the site
  level: must
  source-text: Blue outline to other land owned by the applicant close to or adjoining the site.
confidence: medium
notes: From the council's list (January 2025, Version 5), page 3, item Part A. The blue line is from the
  summary checklists. Application types follow the council's summary checklists (removal/variation of
  a condition is s73).
review-status: unverified
field-status: {}
