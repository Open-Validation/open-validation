reference: biodiversity-survey-report
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
      - reserved-matters
      - lbc
      - demolition-con-area
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - local-wildlife-site
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - priority-habitat
        description: Statutory or locally designated sites of ecological interest, or areas of priority
          habitat, could be affected.
    - condition:
        field: protected-species
        value: true
        description: Protected or notable species could be affected.
    - discretionary
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 44, 187-188, 192-195; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS)
  policies SD9 and INF4; Tewkesbury Borough Plan policy NAT1
source-text: Required if an important wildlife site, habitat, natural feature or species could be affected
  by the proposal. This includes statutory and locally designated sites of ecological interest, areas
  of priority habitat or other habitat of potentially significant value and protected or notable species
  and other species referred to in the NPPF.
must-include:
- item: A Preliminary Ecological Appraisal only where no further surveys or only precautionary mitigation
    are needed; otherwise an Ecological Impact Assessment
  level: must
- item: How the proposals will protect or enhance biodiversity, with mitigation and enhancement during
    and after construction
  level: should
- item: Surveys by competent persons (with protected species licences if appropriate), carried out at
    the appropriate time of year using nationally recognised methods
  level: must
- item: Survey ordinarily no more than 12 months old
  level: should
- item: All survey information, potential impacts, how the mitigation hierarchy has been followed, and
    proportionate mitigation and enhancement for protected and priority species and designated sites
  level: must
- item: 'Where a European Protected Species Licence is needed: full mitigation proposals as for the Natural
    England licence application'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: A European Protected Species Licence is required.
- item: A Habitats Regulations Assessment, with an HRA mitigation strategy if a Likely Significant Effect
    is anticipated
  level: should
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      description: Within the zone of influence of a European/internationally designated site (Ramsar,
        SAC, SPA, including candidate sites).
confidence: medium
notes: From the council's list (January 2025, Version 5), page 8, item 6. 'Other habitat of potentially
  significant value' is not defined, so the trigger is partly discretionary. Application types follow
  the council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
