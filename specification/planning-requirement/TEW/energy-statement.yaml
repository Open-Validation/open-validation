reference: energy-statement
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: Residential development on a site larger than 0.5 hectare.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Other development where the floor-space exceeds 1,000 sq m.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Other development where the site area is 1 hectare or more.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF paras 8, 161, 164-168; Tewkesbury Borough Plan policy INF5; Gloucester, Cheltenham and Tewkesbury
  Joint Core Strategy (JCS) policy SD3
source-text: Required for any proposal for either 10 or more dwellings (or residential development on
  a site larger than 0.5 hectare), or for any other type of development where the floor-space exceeds
  1,000 square metres or the site area is 1 hectare or more.
must-include:
- item: The methods used to calculate predicted annual energy demand and associated annual CO2 emissions
  level: must
confidence: medium
notes: From the council's list (January 2025, Version 5), page 10, item 11. Application types follow the
  council's summary checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
