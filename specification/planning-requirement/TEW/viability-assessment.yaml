reference: viability-assessment
local-authority: TEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The proposal does not provide the policy requirements for affordable housing and infrastructure.
source-url: https://tewkesbury.gov.uk/wp-content/uploads/2023/10/TBC-Validation-Requirements-Final-Version-Jan-2025.pdf
policy: NPPF para 62; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD11, SD12,
  INF6 and INF7; Tewkesbury Borough Plan policies RES6 and RES12
source-text: Required for applications where the proposal does not provide planning policy requirements
  for affordable housing and infrastructure.
must-include:
- item: A full, un-redacted viability assessment (published like other application documents)
  level: must
- item: 'Where exceptional circumstances are claimed for specific information: a full justification of
    the ''adverse effect'' and harm to the public interest of disclosure'
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: Confidentiality is claimed for specific information.
- item: Follows the government's recommended approach in the PPG on viability
  level: should
confidence: medium
notes: From the council's list (January 2025, Version 5), page 21, item 32. The council is likely to have
  it independently appraised at the applicant's expense. Application types follow the council's summary
  checklists (removal/variation of a condition is s73).
review-status: unverified
field-status: {}
