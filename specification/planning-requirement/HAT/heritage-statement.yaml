reference: heritage-statement
local-authority: HAT
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: Affecting a designated heritage asset (listed building, conservation area, scheduled
        monument, registered park or garden) or its setting.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - locally-listed-building
        description: Affecting a non-designated heritage asset or its setting.
  - all:
    - site:
        in:
        - locally-listed-building
        description: A non-designated heritage asset.
    - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1 and CON10; Hart Local Plan
  (Strategy and Sites) 2032 policy NBE8
source-text: For any proposal affecting a designated heritage asset or its setting. ... If a non-designated
  heritage asset is identified in pre-application advice, a Heritage Statement would also be required
  to include that. ... For any proposal affecting a designated or non-designated heritage asset or its
  setting.
must-include:
- item: Statement of significance
  level: must
- item: Impact assessment and mitigation strategy
  level: must
- item: Statement of justification, including how any perceived harm is weighed against perceived public
    benefit
  level: must
- item: Specialist assessment including an evaluation of alternative solutions and why they were rejected
  level: must
  required-if: discretionary
- item: Structural and condition survey
  level: must
  required-if: discretionary
- item: Repairs schedule
  level: must
  required-if: discretionary
- item: Building regulations compliance
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), general list page 19, householder list page
  11. The wording after the last "..." in source-text is from the householder list. Items marked discretionary
  are needed 'where relevant'. For non-householder applications a non-designated asset counts only if
  pre-application advice identifies it, so that part is discretionary.
review-status: unverified
field-status: {}
