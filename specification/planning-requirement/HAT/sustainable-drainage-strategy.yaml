reference: sustainable-drainage-strategy
local-authority: HAT
required-if:
  any:
  - ref: major-development
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site area larger than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site area larger than 1 hectare.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: NPPF paragraph 175
source-text: 'When required: All Major Development including proposals on sites with an area larger than
  1 hectare.'
must-include:
- item: Sustainable drainage features, where appropriate
  level: must
  required-if: discretionary
- item: Details of the proposed drainage
  level: must
- item: Calculations showing the rate of discharge, compared with the existing
  level: must
- item: A maintenance schedule for the proposed drainage network
  level: must
confidence: medium
notes: From the council's list (published February 2025), general list page 11. See the Lead Local Flood
  Authority's guidance; stricter requirements may apply in a 'priority area'.
review-status: unverified
field-status: {}
