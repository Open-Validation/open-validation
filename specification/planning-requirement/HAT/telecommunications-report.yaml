reference: telecommunications-report
local-authority: HAT
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: New telecommunications antenna.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies RUR10
source-text: For all new telecommunications antenna
must-include:
- item: Outcome of consultation with the local community, including nearby schools and colleges
  level: must
- item: 'For an addition to an existing mast or base station: self-certification that cumulative exposure
    will not exceed ICNIRP guidelines'
  level: must
  required-if: discretionary
- item: 'For a new mast or base station: evidence that erecting antennas on an existing building, mast
    or other structure was explored, and self-certification that ICNIRP guidelines will be met'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), general list page 26. The ICNIRP items depend
  on whether the antenna goes on an existing mast or a new one.
review-status: unverified
field-status: {}
