submission-standards:
- item: All plans legible, with a unique drawing number
  level: must
- item: Each drawing has a title (e.g. proposed / existing elevation / floor plans)
  level: must
- item: Each plan shows the address of the application site
  level: must
- item: Drawings drawn to scale, with a recognised metric scale and scale bar
  level: must
- item: Drawings must not contain 'Do not scale' or similar wording
  level: must
- item: Where plans are based on Ordnance Survey data, the licence to reproduce it clearly shown; no drawing
    may infringe Ordnance Survey or other copyright
  level: must
- item: Elevations clearly labelled and floor plans annotated to show which floor they represent
  level: should
