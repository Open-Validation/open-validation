reference: energy-statement
local-authority: HAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: New floorspace.
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use of existing floorspace.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart Local Plan (Strategy and Sites) 2032 policy NBE9
source-text: For all development proposing new floorspace and changes of use of existing floorspace.
must-include:
- item: How the development complies with Policy NBE9 (i) and (j) on reducing energy consumption through
    sustainable approaches
  level: must
- item: How it incorporates renewable or low carbon energy technologies, where appropriate
  level: must
confidence: medium
notes: From the council's list (published February 2025), general list page 13. The list calls it a Climate
  Mitigation Statement; it can be part of a Planning Statement or Design and Access Statement. Not in
  the householder list.
review-status: unverified
field-status: {}
