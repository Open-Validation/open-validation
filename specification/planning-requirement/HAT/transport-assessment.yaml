reference: transport-assessment
local-authority: HAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: Residential development of 100 units.
    - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: 'Transport Assessment When required a) Residential Development: 100 units b) Class E and
  B2 uses: 2,500m2 c) B8 uses: 5,000m2 d) Retail uses: 1,000m2 e) Education uses: 2,500m2 f) Health uses:
  2,500m2 g) Care Establishments: 500m2 or 5 bedrooms h) Leisure, stadia or ice rinks : All (1,500 seats)
  i) Leisure, other: 1,000m2 j) Commercial development not falling in the above categories: 500m2'
confidence: medium
notes: 'Audit (wrong_app_type): filed under prior approval; it belongs to full and outline applications.
  The use-specific floorspace thresholds have no fields yet, so they are shown as discretionary.'
