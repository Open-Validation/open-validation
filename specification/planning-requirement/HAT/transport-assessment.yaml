reference: transport-assessment
local-authority: HAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 100
      description: Residential development of 100 units.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: B2 uses of 2,500 sq m.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 2500
      description: Class E uses of 2,500 sq m.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 5000
      description: B8 uses of 5,000 sq m.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 1000
      description: Retail uses of 1,000 sq m.
  - condition:
      field: floorspace
      operator: '>='
      value: 2500
      description: Education or health uses of 2,500 sq m.
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: Care establishments of 500 sq m, or commercial development not in the other categories
        of 500 sq m.
  - condition:
      field: bedroom-count
      operator: '>='
      value: 5
      description: Care establishments of 5 bedrooms.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Other leisure uses of 1,000 sq m.
  - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1; Hart Local Plan (Strategy
  and Sites) 2032 policy INF3
source-text: 'a) Residential Development: 100 units b) Class E and B2 uses: 2,500m2 c) B8 uses: 5,000m2
  d) Retail uses: 1,000m2 e) Education uses: 2,500m2 f) Health uses: 2,500m2 g) Care Establishments: 500m2
  or 5 bedrooms h) Leisure, stadia or ice rinks : All (1,500 seats) i) Leisure, other: 1,000m2 j) Commercial
  development not falling in the above categories: 500m2'
must-include:
- item: 'For small schemes: an outline of the transport aspects of the application'
  level: should
- item: 'For major proposals: a non-technical summary'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: proposed modal split'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: proposed development and assessment year'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: existing transport conditions'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: effect of the travel plan'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: traffic impact compared to the existing site use'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: servicing, loading areas and arrangements, and manoeuvring, servicing and
    parking of vehicles'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: measures to address/reduce traffic impact and improve non-car accessibility'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: impact on pedestrians, cyclists and people with disabilities'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: assessment of accident records'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published February 2025), general list page 28. Stadia and ice rinks (all,
  or 1,500 seats) show as discretionary because there is no field for them.
review-status: unverified
field-status: {}
