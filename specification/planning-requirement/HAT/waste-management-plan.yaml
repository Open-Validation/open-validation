reference: waste-management-plan
local-authority: HAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New homes (whether by new build or conversion).
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New retail or commercial premises.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: Any proposal for the creation of new homes (whether by new build or conversion) New retail
  or commercial premises
must-include:
- item: 'Details of the bin stores: location, elevations and materials'
  level: must
- item: Suitable for the appropriate-size wheeled or euro bins
  level: should
- item: 'Designed and sited to minimise visual impact on the public realm: inside the building or behind
    the building line where possible'
  level: should
- item: Where bins are pulled out on collection day, space for them to be safely located at the collection
    point
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), general list page 25. The list calls it Refuse
  Bin storage details and collection points.
review-status: unverified
field-status: {}
