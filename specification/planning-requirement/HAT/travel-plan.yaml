reference: travel-plan
local-authority: HAT
required-if:
  any:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 1000
      description: Food and non-food retail, including extensions, creating more than 1,000 sq m gross
        floorspace.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Other leisure (D2) uses (excluding stadia) of 1,000 sq m gross floorspace.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Class E, B2 or B8 floorspace creating more than 1,000 sq m gross.
  - condition:
      field: floorspace
      operator: '>='
      value: 2500
      description: Higher and further education establishments of 2,500 sq m or more gross floorspace.
  - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1; Hart Local Plan (Strategy
  and Sites) 2032 policy INF3
source-text: 'All planning applications for: a) Food and non-food retail, including extensions, where
  the gross floorspace created is greater than 1,000m2 b) Cinema and conference facilities c) Other leisure
  (D2) uses (excluding stadia) where the gross floorspace is 1000m2 d) Class E, B2, B8 floorspace where
  the gross floorspace created is greater than 1,000m2 e) Higher and further education establishments
  where the gross floorspace is 2500m2 or more. f) Stadia of 1500 or more seats Other service buildings
  such as hospitals'
must-include:
- item: A draft travel plan with measures to widen travel choices by all modes of transport and cut unnecessary
    car use
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 29. Cinemas, conference facilities,
  stadia and hospitals show as discretionary because there is no field for them yet.
review-status: unverified
field-status: {}
