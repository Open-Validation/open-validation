reference: lighting-assessment
local-authority: HAT
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Sports or recreational development (including floodlighting of manèges) that involves
        floodlights.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: external-lighting
        value: true
        description: Major, residential or commercial development where external lighting is proposed.
  - all:
    - condition:
        field: outside-urban-area
        value: true
        description: In the countryside.
    - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1, URB24 and RUR8; Hart Local
  Plan (Strategy and Sites) 2032 policy NBE11
source-text: a) Any sports/recreational development (including floodlighting of ménages) that proposes
  or involves the provision of floodlights b) Any major or residential or commercial development where
  external lighting is proposed c) Any proposal in the countryside where there is ecological or wildlife
  interest.
must-include:
- item: A technical specification for the proposed external lighting
  level: must
- item: The potential impact, especially for illuminated adverts
  level: must
- item: How any potential nuisance from lighting has been mitigated or prevented, including any likely
    impact on bats
  level: must
confidence: medium
notes: From the council's list (published February 2025), general list page 20. Proposals in the countryside
  show as discretionary because they depend on whether there is ecological or wildlife interest.
review-status: unverified
field-status: {}
