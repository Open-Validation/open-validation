reference: flood-risk-assessment
local-authority: HAT
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in Flood Zone 1.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Development to a more vulnerable class (e.g. commercial to residential).
    - discretionary
  - site:
      in:
      - critical-drainage-area
      description: In an area with critical drainage problems notified by the Environment Agency.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart Local Plan (Strategy and Sites) 2032 policy NBE5; Hart District Council Strategic Flood Risk
  Assessment
source-text: 'When required: a) Development in flood zone 2 or 3 b) Developments of more than 1hectare(ha)
  in flood zone 1. c) Less than 1ha in flood zone 1 for development to a more vulnerable class (e.g. commercial
  to residential) where they could be affected by sources flooding other than rivers such as surface water
  or ground water flooding. d) In an area within flood zone 1 which has critical drainage problems as
  notified by the environment agency (not currently relevant in Hart).'
must-include:
- item: Risks of all forms of flooding to and from the development identified and assessed
  level: should
- item: How the flood risks will be managed, taking climate change into account
  level: should
- item: A statement demonstrating compliance with Policy NBE5
  level: should
- item: 'Householder minor extensions (no more than 250 sq m) in Flood Zone 2 or 3: an assessment using
    the advice for minor extensions; anything larger, or on a site of 1 hectare or more, needs a full
    Flood Risk Assessment'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Use the advice for minor extensions to complete an assessment for a minor extension which
    is in flood zone 2 or 3. A “minor extension” is one with a floor space of no more than 250 square
    metres. Anything larger than that or on a site of 1 hectare or more would require a full Flood Risk
    Assessment.
confidence: medium
notes: From the council's list (published February 2025), general list page 10, householder list page
  9. A change to a more vulnerable use in Flood Zone 1 shows as discretionary because it depends on whether
  the site could be affected by other sources of flooding.
review-status: unverified
field-status: {}
