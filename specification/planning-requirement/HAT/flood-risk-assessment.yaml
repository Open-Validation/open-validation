reference: flood-risk-assessment
local-authority: HAT
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Development in flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Development of more than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Development of more than 1 hectare in flood zone 1.
  - site:
      in:
      - critical-drainage-area
      description: An area in flood zone 1 with critical drainage problems notified by the Environment
        Agency.
  - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: 'Flood Risk Assessment Notes When required: a) Development in flood zone 2 or 3 b) Developments
  of more than 1hectare(ha) in flood zone 1. c) Less than 1ha in flood zone 1 for development to a more
  vulnerable class (e.g. commercial to residential) where they could be affected by sources flooding other
  than rivers such as surface water or ground water flooding. d) In an area within flood zone 1 which
  has critical drainage problems as notified by the environment agency (not currently relevant…'
confidence: medium
notes: 'Audit (wrong_trigger): the householder row had the Design and Access Statement trigger. Case (c),
  a change to a more vulnerable use at risk from other sources of flooding, has no field and is shown
  as discretionary.'
review-status: unverified
field-status: {}
