reference: town-centre-impact-assessment
local-authority: HAT
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Main town centre uses (as defined in the NPPF) not in an existing centre.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with an up-to-date Local Plan.
  - all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m of retail, leisure and/or office development outside town centres.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with an up-to-date Local Plan.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies URB1; Hart Local Plan (Strategy
  and Sites) 2032 policies ED1, ED2, ED3, ED4, ED5, ED6 and INF5
source-text: a) Applications for Main Town Centre uses as defined in the National Planning Policy Framework
  that are not in an existing centre and are not in accordance with an up-to-date Local Plan. Applications
  for over 2,500m2 of retail, leisure and/or office development outside town centres, which are not in
  accordance with an up-to-date Local Plan.
must-include:
- item: A sequential assessment (main town centre uses not in an existing centre)
  level: must
- item: An impact assessment (over 2,500 sq m of retail, leisure and/or office development outside town
    centres)
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 sq m outside town centres.
confidence: medium
notes: From the council's list (published February 2025), general list page 27. The list calls it a Town
  Centre Uses Statement.
review-status: unverified
field-status: {}
