reference: elevation-existing
local-authority: HAT
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the outside of a building.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Sufficient plans and drawings (e.g. site/block plans, elevations, sections) are required
  to describe the subject of your application. All plans should be drawn to an identified scale. Where
  relevant, they should show existing and/or proposed features and details.
must-include:
- item: Preferably at 1:50 or 1:100 scale
  level: should
- item: The works in relation to what is already there
  level: must
- item: Existing buildings or walls proposed to be demolished
  level: must
- item: Proposed materials, style and finish of windows and doors, where possible
  level: should
- item: Blank elevations, for clarity
  level: must
- item: New buildings in context with adjacent buildings
  level: must
- item: 'The relationship between buildings, including the approximate position of those adjoining or
    close to the site (householder: and the position of any window openings in them)'
  level: must
- item: Relevant elevations clearly labelled
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 6-7, householder list page
  7. The lists cover floor plans and elevations in one 'Drawings' item; needed where they are relevant
  to describe the works.
review-status: unverified
field-status: {}
