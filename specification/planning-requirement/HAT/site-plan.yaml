reference: site-plan
local-authority: HAT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Sufficient plans and drawings (e.g. site/block plans, elevations, sections) are required
  to describe the subject of your application. ... Section 73 applications do not require a new block
  plan unless there is a proposed change from the original.
must-include:
- item: To an identified scale (ideally 1:500)
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on or
    near the site
  level: must
- item: 'Buildings, roads and footpaths on adjoining land, including access arrangements (householder:
    and any window openings near the boundary)'
  level: should
- item: Any public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Boundary treatments, including any walls or fencing
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 6, householder list page 6.
  The list calls it a site/block plan. The 'should' items are shown 'where relevant'. Section 73 applications
  need one only if there is a change from the original, so that part shows as discretionary.
review-status: unverified
field-status: {}
