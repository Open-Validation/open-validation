reference: affordable-housing-statement
local-authority: HAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings (gross).
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: More than 1,000 sq m gross residential floorspace, irrespective of the number of dwellings.
  - condition:
      field: affordable-housing-proposed
      value: true
      description: The proposal includes affordable housing (including Rural Exceptions schemes) or regenerates
        existing affordable housing schemes or properties.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart Local Plan (Strategy and Sites) 2032 policies H2 and H3
source-text: a) Sites which provide 10 or more dwellings (gross), or greater than 1,000 m² gross residential
  floorspace irrespective of the number of dwellings b) All sites regenerating existing affordable housing
  schemes or properties c) All planning applications proposing affordable housing including Rural Exceptions
  schemes.
must-include:
- item: The numbers of affordable units
  level: must
- item: 'An accommodation schedule: number and tenure of the affordable units, with numbers of bedrooms,
    size (m²), plot numbers and type of property'
  level: must
- item: Plans showing the location of all affordable units and their number of habitable rooms and/or
    bedrooms and/or floor space
  level: must
- item: Details of any Registered Provider acting as partners in the development
  level: must
- item: A clear and full explanation where different levels or types of affordability or tenure are proposed
    for different units
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 12.
review-status: unverified
field-status: {}
