reference: floor-plan-proposed
local-authority: HAT
required-if:
  condition:
    field: building-works
    value: true
    description: The proposal involves building works or changes to the floor layout.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Sufficient plans and drawings (e.g. site/block plans, elevations, sections) are required
  to describe the subject of your application. All plans should be drawn to an identified scale. Where
  relevant, they should show existing and/or proposed features and details.
must-include:
- item: Preferably at 1:50 or 1:100 scale
  level: should
- item: The works in relation to what is already there
  level: must
- item: Existing buildings or walls proposed to be demolished
  level: must
- item: Annotated to show which floor each plan represents
  level: should
- item: The use of each room, with windows, doors and walls
  level: should
- item: The total additional gross floorspace being created
  level: should
- item: 'For new dwellings or conversions to dwellings: the floorspace of each habitable room and the
    total floorspace of each unit'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings or conversions to dwellings.
- item: Existing and proposed vehicle parking space (householder)
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published February 2025), general list page 6-7, householder list page
  7. The lists cover floor plans and elevations in one 'Drawings' item; needed where they are relevant
  to describe the works.
review-status: unverified
field-status: {}
