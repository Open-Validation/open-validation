reference: biodiversity-survey-report
local-authority: HAT
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: The site is within a SSSI or a Site of Interest for Nature Conservation (SINC).
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates one or more new homes.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: The development creates 100 square metres or more of floorspace.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: demolition
        value: true
        description: The householder proposal involves demolition.
  - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: 'Ecological Assessment When required For: Any application within a Site of Special Scientific
  Interest (SSSI), or a Site of Interest for Nature Conservation (SINC); or … Any major development; Creation
  of one or more new homes; …floor space created by the development is 100 square metres or more'
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s non-householder trigger was cut off and the householder
  one was garbled with the contamination item. From the audit: the householder triggers are demolition,
  tree or hedge loss, within 0.5km of waterways or ponds, or within 2km of an SSSI or ancient woodland.
  Only demolition has a field; the rest are shown as discretionary.'
review-status: unverified
field-status: {}
