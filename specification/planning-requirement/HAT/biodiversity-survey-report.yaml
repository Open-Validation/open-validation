reference: biodiversity-survey-report
local-authority: HAT
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Within a Site of Special Scientific Interest (SSSI) or a Site of Interest for Nature
        Conservation (SINC).
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The creation of one or more new homes.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 square metres or more of floorspace.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: demolition
          value: true
          description: Part or full demolition.
      - condition:
          field: loss-of-habitat-features
          value: true
          description: Development that involves the loss of trees or hedges.
      - condition:
          field: near-watercourse
          value: true
          description: Development within 0.5 km of waterways or ponds.
      - site:
          in:
          - site-of-special-scientific-interest
          - ancient-woodland
          description: Within 2 km of a Site of Special Scientific Interest (SSSI) or ancient woodland.
  - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1, CON7 and CON8; Hart Local
  Plan (Strategy and Sites) 2032 policies NBE3 and NBE4; South East Plan policy NRM6
source-text: 'For: Any application within a Site of Special Scientific Interest (SSSI), or a Site of Interest
  for Nature Conservation (SINC); or Any major development; or the creation of one or more new homes;
  or the provision of a building or buildings where the floor space created by the development is 100
  square metres or more. ... Proposals for: part/ full demolition, development that involves the loss
  of trees/ hedges development adjacent to (within 0.5 km of) waterways/ ponds. within 2km of a Site of
  Special Scientific Interest (SSSI) or ancient woodland (except applications for Advertisements, Listed
  Building Consent or Changes of use)'
must-include:
- item: 'A Phase I habitat survey (householder: where there is a reasonable likelihood of a protected
    species being present)'
  level: must
- item: Any significant biodiversity or geological conservation interest
  level: should
- item: Location or habitats of any species protected under the Wildlife and Countryside Act 1981, the
    Conservation of Habitats and Species Regulations 2017 or other legislation
  level: must
- item: A Phase II survey with a proposed mitigation strategy, where a protected species is found
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), general list page 15, householder list page
  12. The wording after the last "..." in source-text is from the householder list. The list calls it
  an Ecological Assessment. It also says preliminary ecological assessments may be needed in other cases
  (shown as discretionary); the 2 km SSSI/ancient woodland test is approximated by the site designation.
review-status: unverified
field-status: {}
