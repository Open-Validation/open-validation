reference: noise-assessment
local-authority: HAT
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: New dwellings or schools close to major roads (within 300m of the M3), within 100m
        of any railway line, or within the 50dB LAeq 16hr contour of Farnborough Airport.
  - condition:
      field: noise-generating-use
      value: true
      description: Motor sports or motor hobbies (e.g. model aeroplane flying), shooting in the open air,
        noise producing activity (e.g. engine testing, air conditioning), or play schools or nurseries.
  - condition:
      field: wind-turbine
      value: true
      description: Windfarms.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: New multiple air source heat pump installations within a defined settlement without
          certification of compliance (MCS 020).
    - condition:
        field: outside-urban-area
        value: false
        description: Within a defined settlement.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1, GEN6 and RUR36; Hart Local
  Plan (Strategy and Sites) 2032 policy NBE11
source-text: a) New dwellings and schools that are proposed close to major roads (within 300m of the M3),
  within 100m of any railway line, or within the 50dB LAeq 16hr contour of Farnborough Airport; b) Any
  application for motor sports or motor hobbies, e.g. model aeroplane flying, c) Any application for shooting
  in the open air, d) Noise producing activity e.g. engine testing/ use of air conditioning, e) Play schools
  or nursery, f) Windfarms
must-include:
- item: Prepared by a suitably qualified acoustician/acoustic consultancy
  level: must
- item: BS 4142:2014-compliant, for multiple air source heat pump installations in a defined settlement
    not supported by MCS 020 certification
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Multiple air source heat pumps.
  source-text: All new multiple air-source heat pump installations which are not supported by an MCS certificate
    demonstrating compliance with the MCS 020 standard, situated within a defined settlement, must have
    a BS 4142:2014-compliant Noise Impact Assessment.
confidence: medium
notes: From the council's list (published February 2025), general list page 13, 21, householder list page
  10. The list calls it a Noise Impact Assessment. The air source heat pump part is from the Air Source
  Heat Pump Calculation item (general list page 13, householder list page 10).
review-status: unverified
field-status: {}
