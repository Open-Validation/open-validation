reference: noise-assessment
local-authority: HAT
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: New dwellings or schools within 300m of the M3, within 100m of a railway, or inside
        Farnborough Airport's 50dB LAeq contour.
  - condition:
      field: noise-generating-use
      value: true
      description: Motor sports, shooting, nurseries or windfarms.
  - condition:
      field: plant-equipment
      value: true
      description: New multiple air source heat pump installations within a defined settlement (without
        MCS 020 compliance).
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: New dwellings and schools that are proposed close to major roads (within 300m of the M3)
  … All new multiple airsource heat pump installations, situated within a defined settlement … BS 4142:2014-compliant
  Noise Impact Assessment.
