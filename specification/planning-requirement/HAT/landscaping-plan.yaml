reference: landscaping-plan
local-authority: HAT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential development.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Minor commercial development.
    - condition:
        field: building-works
        value: true
        description: Material physical alterations are proposed.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1; Hart Local Plan (Strategy
  and Sites) 2032 policy NBE2
source-text: a) Major developments b) New residential or minor commercial development within a Conservation
  Area except where no material physical alterations are proposed
must-include:
- item: Broad indications of landscaping, with any strategic landscaping
  level: should
- item: Proposals for long-term management and maintenance
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 20. The list calls it Landscaping
  Details. Exact planting locations and schedules are usually not needed.
review-status: unverified
field-status: {}
