reference: land-contamination-assessment
local-authority: HAT
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known to exist, or is likely due to existing or previous uses.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a former landfill site (excluding householder development).
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1; Hart Local Plan (Strategy
  and Sites) 2032 policies NBE6 and NBE11
source-text: a) Any site where contamination is likely due to existing or previous uses; or b) Any site,
  excluding householder development, situated within 250 metres of a former landfill site; or c) Any other
  site where contamination is known to exist. ... Only when on land where contamination is known to exist
  or to have existed and where remediation measures were put in place and may be affected by the proposal.
confidence: medium
notes: From the council's list (published February 2025), general list page 14, householder list page
  12. The wording after the last "..." in source-text is from the householder list. For householder applications
  it is needed only where known contamination was remediated and the remediation may be affected. The
  level of information depends on the known or suspected contamination.
review-status: unverified
field-status: {}
