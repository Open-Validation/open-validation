reference: bng-metric
local-authority: HAT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The application is not exempt from the general biodiversity gain condition.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Schedule 7A, Town and Country Planning Act 1990 (inserted by Schedule 14 of the Environment Act
  2021)
source-text: This requirement applies to all applications not subject to exemptions and/or transitional
  arrangements which disapply the general condition, as determined with reference to national requirements
  including The Environment Act 2021, Secondary Legislation and statutory guidance.
must-include:
- item: The statutory biodiversity metric (or later statutory version)
  level: should
- item: Baseline and post-intervention biodiversity value of the on-site habitat, and/or (where applicable)
    of off-site biodiversity gains
  level: should
confidence: medium
notes: 'From the council''s list (published February 2025), general list page 11. The list asks for a
  Biodiversity Net Gain report with the metric (the report is not an MHCLG id, so it is recorded as unmapped).
  Reports are recommended to follow CIEEM guidance. Uses the biodiversity gain condition: householder
  and other exempt applications are exempt by law.'
review-status: unverified
