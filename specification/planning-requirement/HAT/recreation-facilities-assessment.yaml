reference: recreation-facilities-assessment
local-authority: HAT
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: The development involves the loss of playing fields or major sporting facilities.
  - discretionary
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies GEN1; Hart Local Plan (Strategy
  and Sites) 2032 policy INF4; Hart District Council Playing Pitch Strategy
source-text: Any development which involves the loss of playing fields or major sporting facilities or
  proposes playing field or sporting facilities.
must-include:
- item: A justification for the loss of playing field or major sporting facility
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: When the facility was last used and by whom
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: What replacement (if any) is proposed
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: Size of the existing playing field and how much of it is affected (in hectares or square metres)
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: Existing site plan showing the winter and summer pitch layout, including safety margins, at a
    minimum 1:1250 scale
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: Proposed site plan showing the likely impact of new buildings and works on the pitch layout, including
    any realignment
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: Any information on alternative sport and recreational provision
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The application involves removal of playing fields.
- item: 'For new playing fields: the size and proposed uses of the playing field(s)'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), general list page 24. The list calls it a Playing
  Fields and Sporting Facilities Assessment. Proposals that create playing fields or sporting facilities
  show as discretionary because there is no field for them yet.
review-status: unverified
field-status: {}
