reference: section-proposed
local-authority: HAT
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal involves a change in ground levels, or the site is sloping.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: 'Section Drawing and Site Levels Plan Notes Only required: a) Where a proposal involves a
  change in ground levels b) On sloping sites – full information is required concerning alterations to
  levels, the way in which a proposal sits within the site and in particular, the relative levels between
  existing and proposed buildings.'
must-include:
- item: Scale preferably 1:50 or 1:100
  level: should
- item: Alterations to levels, how the proposal sits within the site, and the relative levels of existing
    and proposed buildings
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The site is sloping.
