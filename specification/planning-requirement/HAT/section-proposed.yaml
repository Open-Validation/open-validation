reference: section-proposed
local-authority: HAT
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal changes ground levels, or the site slopes.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Only required: a) Where a proposal involves a change in ground levels b) On sloping sites
  – full information is required concerning alterations to levels, the way in which a proposal sits within
  the site and in particular, the relative levels between existing and proposed buildings.'
must-include:
- item: Preferably at 1:50 or 1:100 scale
  level: should
- item: A cross-section through the proposed building(s)/extension
  level: must
- item: 'Existing and finished floor levels (householder: and existing and proposed ground levels)'
  level: must
- item: How proposed level changes relate to any retained trees
  level: must
- item: For sloping sites, a Site Levels Plan showing how the proposal sits within the site, the relative
    levels between existing and proposed buildings, proposed finished floor levels against existing ground/floor
    levels, and any retaining structures
  level: must
- item: Site Levels Plan related to an identified fixed datum level outside the site
  level: must
confidence: medium
notes: From the council's list (published February 2025), general list page 8, householder list page 8.
  The list calls it a Section Drawing and Site Levels Plan.
review-status: unverified
field-status: {}
