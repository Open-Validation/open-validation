reference: location-plan
local-authority: HAT
required-if:
  always: true
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Section 73 Applications do not require a new location plan as they rely on the original.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At a recognised scale (ideally 1:1250 or 1:2500)
  level: must
- item: The direction of North
  level: must
- item: Site clearly edged in red, including all land needed to carry out the development and the access
    from the public highway
  level: must
- item: Sufficient roads and/or buildings on surrounding land to make the exact location clear
  level: must
- item: Any other land owned by the applicant nearby outlined in blue
  level: should
- item: Fits on a single A4 or A3 page where possible
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 5, householder list page 5.
  Needed for every application except section 73 applications, which rely on the original plan.
review-status: unverified
field-status: {}
