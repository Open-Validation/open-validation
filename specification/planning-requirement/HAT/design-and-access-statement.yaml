reference: design-and-access-statement
local-authority: HAT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates 100 square metres or more of additional floorspace.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: The house is a listed building.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: 'Design and Access Statement Notes When required: a) Applications for Major Development b)
  Applications for one or more dwelling houses in a Conservation Area c) Applications for 100m2 or more
  of additional floorspace in a Conservation Area … [Householder] Only required if creating 100m2 or more
  of additional floorspace in a Conservation Area or where the house is a listed building.'
must-include:
- item: The design principles and design concept, and how the design relates to its wider context
  level: should
confidence: medium
notes: Built from both lists' 'When required' text (non-householder and householder).
review-status: unverified
field-status: {}
