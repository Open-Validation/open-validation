reference: design-and-access-statement
local-authority: HAT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m or more of additional floorspace.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        description: The house is a listed building.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'When required: a) Applications for Major Development b) Applications for one or more dwelling
  houses in a Conservation Area c) Applications for 100m2 or more of additional floorspace in a Conservation
  Area ... Only required if creating 100m2 or more of additional floorspace in a Conservation Area or
  where the house is a listed building.'
must-include:
- item: The design principles and concept, and how the design relates to its wider context (through a
    full context appraisal where appropriate)
  level: should
- item: Illustrated, as appropriate, with plans and elevations, photographs of the site and surroundings,
    and other illustrations such as perspectives
  level: should
- item: How the access arrangements give all users (including disabled people) equal and convenient access
    to buildings, spaces and the public transport network
  level: should
- item: The need for flexibility of the development and how it may adapt to changing needs
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 9, householder list page 9.
  The wording after the last "..." in source-text is from the householder list.
review-status: unverified
field-status: {}
