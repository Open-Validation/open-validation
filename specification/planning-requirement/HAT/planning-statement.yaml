reference: planning-statement
local-authority: HAT
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: A complex proposal clearly contrary to a policy in the Development Plan.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
source-text: a) Major planning applications. b) Other complex proposals where the proposal is clearly
  contrary to a policy in the Development Plan.
must-include:
- item: The context and need for the development
  level: must
- item: An assessment of how the development accords with relevant national, regional and local planning
    policies
  level: must
- item: Any infrastructure or contribution towards off-site infrastructure proposed (e.g. highways or
    education), with draft heads of terms
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2025), general list page 23. It may also cover pre-application
  consultation; a separate statement of community involvement may be appropriate.
review-status: unverified
field-status: {}
