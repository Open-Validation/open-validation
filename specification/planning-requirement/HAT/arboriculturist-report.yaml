source-url: https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
policy: Hart District Local Plan (Replacement) 1996-2006 saved policies CON8; Hart Local Plan (Strategy
  and Sites) 2032 policy NBE4; BS 5837:2012
source-text: 'Where any new building work (including construction of access drive, patios, and the laying
  of drains/services) may have an impact on trees or woodland within the application site or on adjacent
  land. For validation purposes this would include where any work comes within 15 metres of: a) A tree
  the subject of a Tree Preservation Order either within the application site or on adjoining land or
  b) A tree with a trunk diameter greater than 7.5cm at 1.5m above the ground that lies within a Conservation
  Area. c) Any Ancient Woodland, or Ancient or Veteran trees, on or adjacent to the site. d) Any other
  mature tree which is visible in the public domain'
must-include:
- item: Arboricultural Impact Assessment following BS 5837:2012
  level: should
- item: Survey plan identifying the species and dimensions of all trees, trees to be removed, retained
    trees with canopy spreads and root protection areas (including veteran/ancient trees) and buffer zones
    for ancient woodland
  level: should
- item: The impact the tree has (if any)
  level: should
- item: Arboricultural Method Statement where the development requires works to a tree subject to a Tree
    Preservation Order
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      description: Works to a tree subject to a Tree Preservation Order.
  source-text: An Arboricultural Method Statement must be provided where the development requires works
    to be carried out to a tree that is the subject of a Tree Preservation Order.
- item: 'Method statement: measures to protect retained trees, including a Tree Protection Plan'
  level: should
- item: 'Method statement: schedules of any necessary tree work and proposals for long-term maintenance'
  level: should
- item: 'Method statement: details of proposed services/utilities/drainage and associated infrastructure'
  level: should
- item: 'Method statement: details, with cross-sections as appropriate, of engineering work within root
    protection areas or buffer zones'
  level: should
- item: Trees on adjacent sites affected by the works
  level: should
confidence: medium
notes: From the council's list (published February 2025), general list page 30, householder list page
  14. The list calls it a Tree Survey and Arboricultural Assessment. 'Any other mature tree visible in
  the public domain' shows as discretionary because it is a judgement.
