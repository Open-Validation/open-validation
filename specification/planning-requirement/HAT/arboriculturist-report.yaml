reference: arboriculturist-report
local-authority: HAT
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: New building work (including access drives, patios and drains/services) may affect trees
      or woodland on the site or on adjacent land.
source-url: https://www.hart.gov.uk/sites/default/files/2025-02/Householder-Validation-requirements-published-Feb-2025-version.pdf
policy: Saved Local Plan (Replacement) 1996-2006 CON8; Local Plan (Strategy and Sites) 2032 NBE4
source-text: Tree Survey and Arboricultural Assessment When required … Where any new building work (including
  construction of access drive, patios, and the laying of drains/services) may have an impact on trees
  or woodland within the application site or on adjacent land.
must-include:
- item: An Arboricultural Method Statement where the development requires works to a tree subject to a
    Tree Preservation Order
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      description: The development requires works to a tree protected by a Tree Preservation Order.
  source-text: An Arboricultural Method Statement must be provided where the development requires works
    to be carried out to a tree that is the subject of a Tree Preservation Order.
confidence: medium
notes: 'Audit (wrong_app_type): the workbook also put this under Works to trees; it is a requirement of
  development applications that affect trees, not of tree works applications.'
review-status: unverified
field-status: {}
