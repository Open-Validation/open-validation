reference: planning-statement
local-authority: POR
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: For Major applications, Applicants are encouraged to submit a Planning Statement detailing
  the context and purpose of an application and including an assessment of how the proposed development
  accords with policies in national planning guidance, the development plan, and Supplementary Planning
  Documents (SPDs).
must-include:
- item: The context and purpose of the application
  level: should
- item: An assessment of how the development accords with national planning guidance, the development
    plan and SPDs
  level: should
- item: Any other material considerations
  level: should
- item: Details of any proposed planning obligations (section 106)
  level: should
  source-text: Details of any proposed planning obligations should be included in the Planning Statement
    accompanying the application.
- item: 'For town centre uses over 2,500 sq m outside designated town centres: a sequential assessment
    and assessment of likely impacts'
  level: should
  required-if:
    all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Town centre uses with a floorspace larger than 2,500 square metres.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Located outside of designated town centres.
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Major and significant
  applications'. For major applications applicants 'are encouraged' to submit one (the section covers
  submissions 'recommended as good practice'), so it is shown as discretionary within major development.
review-status: unverified
field-status: {}
