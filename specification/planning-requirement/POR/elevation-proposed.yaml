reference: elevation-proposed
local-authority: POR
required-if:
  always: true
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Elevations – Existing and proposed elevations of all elevations drawn to a metric scale of
  1:50 or 1:100.
must-include:
- item: All elevations, drawn to a metric scale of 1:50 or 1:100
  level: must
- item: Clearly annotated with their orientation (north/south and/or front/rear etc)
  level: should
- item: Annotations for the location of proposed materials (for operational development)
  level: should
- item: Details of colour, and method and colour of illumination, where applicable (especially for advertisement
    consent)
  level: should
  required-if:
    any:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The proposal is illuminated.
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. Listed among the 'general or site specific requirements that will apply to planning
  applications', with no further trigger, so it is shown as always required; in practice only where the
  drawing is relevant to the proposal.
review-status: unverified
field-status: {}
