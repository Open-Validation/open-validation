reference: town-centre-impact-assessment
local-authority: POR
required-if:
  all:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Town centre uses with a floorspace larger than 2,500 square metres.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Located outside of designated town centres.
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Applications for Town Centre uses with a floorspace larger than 2,500 square metres, located
  outside of designated town centres should include a sequential assessment and assessment of likely impacts
  within the accompanying planning statement.
must-include:
- item: A sequential assessment and assessment of likely impacts, within the planning statement
  level: should
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Major and significant
  applications'.
review-status: unverified
field-status: {}
