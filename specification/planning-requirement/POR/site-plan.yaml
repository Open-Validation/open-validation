reference: site-plan
local-authority: POR
required-if:
  always: true
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A block plan showing the full application site, including all land associated with the site
  (e.g. front and rear gardens), drawn to a metric scale of 1:500 and showing at least immediately adjoining
  neighbouring buildings and features.
must-include:
- item: The full application site, including all land associated with it (e.g. front and rear gardens)
  level: must
- item: Drawn to a metric scale of 1:500
  level: must
- item: At least the immediately adjoining neighbouring buildings and features
  level: must
- item: All areas of hardstanding (such as permeable driveways and patios) and all outbuildings, including
    refuse and cycle stores
  level: should
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'National mandatory
  planning documents'. The council calls this a block plan; it is listed among the national mandatory
  documents.
review-status: unverified
field-status: {}
