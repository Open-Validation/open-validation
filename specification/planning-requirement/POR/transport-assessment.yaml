source-text: Transport Assessment/Transport Statement – All developments should consider the transport
  impacts created, maximising opportunities to reduce reliance on private cars and assessing the implication
  of traffic movements. A proportionate assessment of impacts must accompany an application and the thresholds
  and details of such assessments are contained with the Council’s SPD on Parking Standards and Transport
  Assessments.
