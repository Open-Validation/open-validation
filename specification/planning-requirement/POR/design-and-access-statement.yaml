reference: design-and-access-statement
local-authority: POR
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The development provides one or more dwellinghouses.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: The development provides a building of 100 square metres or more.
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      description: The development affects a listed building.
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Design and Access Statement (required for all Major development, development providing one
  or more dwelling-house, development providing a building creating a floorspace of 100 square metres
  or more, or developments effecting listed buildings)
confidence: low
notes: 'Audit (wrong_app_type): the trigger is not tied to Full planning; it also covers outline applications.
  The audit couldn''t read this council''s list, so its contents weren''t checked.'
review-status: unverified
field-status: {}
