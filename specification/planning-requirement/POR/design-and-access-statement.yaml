reference: design-and-access-statement
local-authority: POR
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Development providing one or more dwelling-house.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: Development providing a building creating a floorspace of 100 square metres or more.
  - site:
      in:
      - listed-building
      description: Development affecting listed buildings.
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Design and Access Statement (required for all Major development, development providing one
  or more dwelling-house, development providing a building creating a floorspace of 100 square metres
  or more, or developments effecting listed buildings)
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise and take account of the context of the development
  level: must
- item: How the policies relating to access and any specific access issues have been taken into account
  level: must
- item: What, if any, consultation has been undertaken
  level: must
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'National mandatory
  planning documents'.
review-status: unverified
field-status: {}
