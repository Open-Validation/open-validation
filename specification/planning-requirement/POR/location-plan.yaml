reference: location-plan
local-authority: POR
required-if:
  always: true
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan – showing the application site in relation to the surrounding area drawn to
  a metric scale of 1:1250 or 1:2500 and showing the direction of North.
must-include:
- item: Drawn to a metric scale of 1:1250 or 1:2500, showing the direction of North
  level: must
- item: Application site outlined in red
  level: must
- item: Any other land in the ownership of the applicant in the surrounding area outlined in blue
  level: must
- item: Any land required to connect the site to a public highway for access shown in red
  level: should
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'National mandatory
  planning documents'.
