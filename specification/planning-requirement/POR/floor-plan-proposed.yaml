reference: floor-plan-proposed
local-authority: POR
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Floor plans – Existing and proposed floor plans of all floors drawn to a metric scale of
  1:50 or 100 and showing the direction of North.
must-include:
- item: All floors
  level: must
- item: Metric scale of 1:50 or 1:100
  level: must
- item: Direction of north
  level: must
- item: Internal layout of the accommodation and every room within it, with a schedule of gross internal
    floor areas
  level: must
  required-if:
    condition:
      field: housing-type
      value: hmo
      description: The proposal is for a House in Multiple Occupancy.
  source-text: Multiple Occupancy, floor plans must show the internal layout of that accommodation and
    every room within it, accompanied by a schedule of the gross internal floor areas of the proposed
    accommodation.
