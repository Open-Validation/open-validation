reference: biodiversity-survey-report
local-authority: POR
required-if:
  any:
  - discretionary
  - condition:
      field: protected-species
      value: true
      description: Protected species are likely to be affected.
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      description: Protected sites are likely to be affected.
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Biodiversity and Protected Species – Where a proposed development may have possible impacts
  on wildlife and biodiversity information should be provided on existing biodiversity interests and an
  assessment of possible impacts, including any proposals for mitigating, management and compensating
  for such effects. This may include a Protected Species Survey and Assessment (Phase 1 Habitat Survey)
  if protected sites or protected species are likely to be affected.
must-include:
- item: Information on existing biodiversity interests
  level: should
- item: An assessment of possible impacts, including any proposals for mitigation, management and compensation
  level: should
- item: A Protected Species Survey and Assessment (Phase 1 Habitat Survey) if protected sites or species
    are likely to be affected
  level: should
  required-if:
    any:
    - condition:
        field: protected-species
        value: true
        description: Protected species are likely to be affected.
    - site:
        in:
        - site-of-special-scientific-interest
        - special-protection-area
        - special-area-of-conservation
        description: Protected sites are likely to be affected.
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. 'May have possible impacts on wildlife and biodiversity' is shown as discretionary.
