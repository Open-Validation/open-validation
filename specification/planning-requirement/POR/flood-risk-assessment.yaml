reference: flood-risk-assessment
local-authority: POR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Any part of the proposed development falls within Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site area is greater than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site area is greater than 1 hectare.
  - discretionary
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
policy: National Planning Policy Framework paragraph 167
source-text: Flood risk assessment (for development in Flood Zone 2 and 3) – If any part of the proposed
  development will fall within a flood zone you will be required to submit a Flood Risk Assessment. ...
  Flood risk Assessment Required by para 167 of the NPPF for works to properties with Flood Zones 2 and
  3, or where the site area is greater than 1hectare, or the site is at risk of flooding from any source.
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. 'The site is at risk of flooding from any source' is shown as discretionary. The
  council also provides a 'Flood risk - assessment and information form'.
review-status: unverified
