reference: bng-metric
local-authority: POR
required-if:
  all:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Biodiversity net gain applies.
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development (from April 2024).
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
policy: Environment Act 2021 (biodiversity net gain)
source-text: For relevant schemes to be determined after November 2023 details of achieving a 10% Biodiversity
  Net gain in accordance with the national Metric will also need to be submitted. ... Biodiversity Gain
  Plan – As of the November 2023 all proposals for Major Development, and from April 2024 all proposals
  for Minor Development will need to be accompanied by a Biodiversity Gain Plan.
must-include:
- item: Headline results of the latest version of the DEFRA Metric, with supporting calculations showing
    the pre-development and post-development biodiversity value of the onsite habitat
  level: should
- item: Steps taken or to be taken to minimise adverse effects on onsite and other habitat, and to provide
    at least 10% biodiversity net gain on site (unless Local Plan policy requires more)
  level: should
- item: 'Where not all of the gain can be provided on site: any proposed or registered offsite biodiversity
    gain allocated to the development and its biodiversity value'
  level: should
- item: 'Where layout is a reserved matter: headline metric results showing the pre-development biodiversity
    value of the onsite habitat and the location of those habitats'
  level: should
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. The council asks for a 'Biodiversity Gain Plan' with the metric results; it is
  shown here under the metric. The plan contents are 'should include' items.
review-status: unverified
field-status: {}
