reference: construction-management-plan
local-authority: POR
required-if:
  any:
  - discretionary
  - condition:
      field: structural-demolition
      value: true
      description: Schemes involving significant demolition.
  - application-type:
      in:
      - pa-demo-building
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Construction Environmental Management Plan and/or Statement of method of demolition – In
  respect of larger or complex sites where the development work itself will have likely adverse environmental
  effects a ‘CEMP’ may be required to describe how these effects will be managed. For schemes involving
  significant demolition, or for applications for prior approval for demolition a statement of proposed
  method of demolition should be provided.
must-include:
- item: How the likely adverse environmental effects of the development work will be managed
  level: must
  required-if: discretionary
- item: A statement of the proposed method of demolition
  level: must
  required-if:
    any:
    - condition:
        field: structural-demolition
        value: true
        description: Significant demolition.
    - application-type:
        in:
        - pa-demo-building
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. A CEMP 'may be required' on larger or complex sites, shown as discretionary; the
  demolition method statement is for significant demolition or prior approval for demolition.
