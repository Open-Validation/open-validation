reference: condition-of-trees
local-authority: POR
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - discretionary
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: For application to works on a tree within a tree preservation order or in a Conservation
  Area where disease is being claimed or damage to property is alleged written arboricultural advice or
  other diagnostic information from an appropriate expert (e.g. engineer or surveyor as appropriate) will
  be required.
must-include:
- item: Written arboricultural advice or other diagnostic information from an appropriate expert
  level: must
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. Needed when disease is the reason for the works; there is no field for that, so
  it is shown as discretionary.
review-status: unverified
