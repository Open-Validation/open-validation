reference: land-contamination-assessment
local-authority: POR
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: The risk of contamination or gassing is known to be present on site.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates a new dwellinghouse.
    - condition:
        field: residential-extension
        value: true
        description: The proposal extends a residential property.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 250
        description: Commercial redevelopment with an area greater than 250 square metres.
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Contaminated land Assessment – Where the risk of contamination or gassing is known to be
  present on-site applications which involve the creation of new dwellinghouse, an extension to a residential
  property or commercial redevelopment with an area greater than 250m² will need to be accompanied by
  a desk-top study outlining historical uses.
must-include:
- item: A desk-top study outlining historical uses
  level: must
confidence: low
notes: 'Audit (wrong_app_type): the trigger includes extensions to residential properties, so it also
  applies to householder applications. The audit couldn''t read this council''s list, so its contents
  weren''t checked.'
review-status: unverified
field-status: {}
