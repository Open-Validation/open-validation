reference: heritage-statement
local-authority: POR
required-if:
  site:
    in:
    - conservation-area
    - listed-building
    - listed-building-setting
    - scheduled-monument
    - park-and-garden
    - locally-listed-building
    description: The site is within a Conservation Area, includes or could affect the setting of (or is
      adjacent to) a Listed Building, Scheduled Monument or Registered Park or Garden, or could affect
      a locally listed building or other non-designated heritage asset.
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Heritage statement (If the site is within a Conservation Area, includes a Listed Building,
  Scheduled Monument, Registered Park or Garden or could impact on the setting or is adjacent to any of
  these, or if it has the potential to affect a locally listed building and/or other non-designated heritage
  asset)
must-include:
- item: Reference to the Portsmouth Historic Environment Record (as an absolute minimum)
  level: must
- item: Detail proportionate to the importance of the asset, sufficient to understand the potential impact
    of the proposals on its significance
  level: should
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'.
