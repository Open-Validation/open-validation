reference: air-quality-assessment
local-authority: POR
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Development inside, or adjacent to, an air quality management area (AQMA).
  - discretionary
source-url: https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
source-text: Air Quality Impact Assessment – Where a development is proposed inside, or adjacent to an
  air quality management area (AQMA), or where the development could in itself result in the designation
  of an AQMA or where the grant of planning permission would conflict with, or render unworkable, elements
  of a local authority’s air quality action plan, applications should be supported by such information
  as is necessary to allow a full consideration of the impact of the proposal on the air quality of the
  area.
confidence: medium
notes: From the council's list (adopted 23 July 2024), page 1 (single web page), section 'Local mandatory
  planning documents'. 'Could in itself result in the designation of an AQMA' or conflict with the air
  quality action plan needs a judgement, so it is shown as discretionary.
