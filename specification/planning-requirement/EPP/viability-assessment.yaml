reference: viability-assessment
local-authority: EPP
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more homes.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Residential floorspace of more than 1,000 sq m (combined gross internal area).
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The proposal does not provide 40% affordable housing on site.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: On development sites which provide for 11 or more homes, or residential floorspace of more
  than 1000 sqm (combined gross internal area) the requirement is 40% of those homes to be affordable
  housing provided on site. Proposals that do not accord with this must be accompanied by a viability
  assessment with supporting evidence.
must-include:
- item: Supporting evidence
  level: must
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 19. The council has the assessment independently reviewed at the applicant's
  cost, and the Consent Form for the Payment of Council Related Costs must be returned with the application.
review-status: unverified
field-status: {}
