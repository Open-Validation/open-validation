reference: sustainability-statement
local-authority: EPP
required-if:
  any:
  - application-type:
      in:
      - hh
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for all householder applications. You will need to submit the sustainability checklist
  & statement. Which can be viewed and downloaded on the Planning Application Validation Requirements
  homepage. ... Required for all minor & major applications. You will need to submit the sustainability
  checklist & statement – (the statement can form part of the DAS), which can be viewed and downloaded
  on the Council’s Planning Application Validation Requirements homepage.
must-include:
- item: The council's sustainability checklist and statement
  level: must
confidence: medium
notes: From the council's list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications (reports, assessments etc), page 3 and 18. For non-householder
  applications the statement can form part of the Design and Access Statement.
review-status: unverified
field-status: {}
