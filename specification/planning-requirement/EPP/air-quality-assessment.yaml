reference: air-quality-assessment
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - discretionary
      - any:
        - condition:
            field: eia-development
            value: true
            description: EIA development with air quality and/or transport as a likely impact.
        - site:
            in:
            - air-quality-management-area
            description: Within or adjacent to an Air Quality Management Area.
        - condition:
            field: traffic-aadt-increase
            operator: '>='
            value: 5
            description: Could increase traffic on roads of more than 10,000 AADT by 5% or more.
        - discretionary
    - condition:
        field: biomass-or-chp
        value: true
        description: Emissions from biomass burning for heat and/or power generation.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
      - discretionary
    - discretionary
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: 'An appropriate assessment of air quality must be included with: Any application that is
  required to provide a Transport Assessment/Statement and meets the criteria in Appendix A; and any other
  application that may adversely affect local air quality. This includes: • Emissions from biomass burning
  for heat and/or power generation Any application that may introduce new receptors to areas with existing
  pollution sources. In particular: • Residential developments close to Motorways, “A” Roads and busy
  “B” Roads, especially where congestion occurs. ... a) Where the proposed development falls within the
  Town and Country Planning (EIA) (England and Wales) Regulations 2011 and includes air quality and/or
  transport as a specific likely impact. b) Proposals located within or adjacent to an Air Quality Management
  Area (AQMA). c) Proposals that will create an AQMA. d) Proposals that could increase the existing traffic
  flow on roads of >10,000AADT by 5% or more. e) Proposals that increase traffic 5% on road canyons with
  >5000 AADT. f) Proposals that could introduce or significantly alter congestion (DfT Congestion) and
  include the introduction of substantial road infrastructure changes. g) Proposals that reduce average
  speeds by more than 10 kph. h) Proposals that include additional HGV movements by more than 10% of total
  trips.'
must-include:
- item: The likely change in pollutant concentrations at relevant receptors during demolition, construction
    and operational phases, including the cumulative impacts of developments with planning permission
    not yet completed
  level: should
- item: Pollutant emission damage costs and the amount (value) of mitigation expected to be spent
  level: should
- item: Dispersion modelling assessment
  level: should
- item: Necessary and appropriate mitigation measures
  level: should
confidence: medium
notes: 'From the council''s list (published February 2026), Local requirements for all non-householder
  applications (reports, assessments etc) and Appendix A, page 7 and 20. Discretionary in part: the first
  trigger is an application that needs a Transport Assessment/Statement (itself a judgement in this list)
  and meets an Appendix A criterion (EIA, AQMA, 5% traffic increase, road canyons, congestion, speed or
  HGV changes); residential development close to motorways, A roads and busy B roads, and any other application
  that may adversely affect local air quality, are judgements too. Contact Environmental Health if unsure.
  The list gives this under ''Local requirements for all non-householder applications''; it is shown here
  for full, outline and reserved matters applications.'
review-status: unverified
field-status: {}
