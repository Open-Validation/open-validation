reference: heritage-statement
local-authority: EPP
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - conservation-area
      - locally-listed-building
      description: The application may affect a listed building, scheduled monument, historic park or
        garden, conservation area or locally listed building.
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: 'Required for applications which may affect: • Designated heritage assets (Listed Buildings,
  Scheduled Ancient Monuments (SAMs), Historic Parks and Gardens, Conservation Areas); • Non designated
  heritage assets (NDHAs) (including non-scheduled archaeological sites and Buildings on the Register
  of Local List Buildings); • Applications for Listed Building Consent; and • Ancient landscapes'
must-include:
- item: Level of information proportionate to the significance of the heritage asset and the extent and
    nature of the works proposed
  level: must
confidence: medium
notes: From the council's list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications (reports, assessments etc), page 4 and 15. Both sections use the
  same words. Shown as partly discretionary because 'non-scheduled archaeological sites' and 'ancient
  landscapes' have no mapped designation. Applicants are strongly advised to discuss proposals with the
  council at pre-application stage.
review-status: unverified
field-status: {}
