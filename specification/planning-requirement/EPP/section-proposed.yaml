reference: section-proposed
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels, the site slopes, or development is proposed next
        to changing ground levels.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: On sloping sites, it will be necessary to show how proposals relate to existing ground levels
  and where ground levels may be modified. Plan drawn to show a cross section through the proposed building(s)
  and the adjacent level of the land. Where a proposal involves a change in ground levels, drawings must
  show both existing and finished levels. Drawings must include details of floor levels, building height
  and relationship to site boundaries. ... Required for all applications (except outline applications)
  which involve a change in ground levels or where development is proposed next to changing ground levels.
must-include:
- item: A cross section through the proposed building(s)
  level: must
- item: The adjacent level of the land
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: How the proposals relate to existing ground levels and where ground levels may be modified
  level: must
- item: Both existing and finished levels (for non-householder applications, across the site and the adjacent
    site(s))
  level: must
- item: Floor levels, building height and relationship to site boundaries
  level: must
- item: How proposed buildings relate to existing site levels and neighbouring development
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Existing site levels and finished floor levels, related to a fixed datum point off site and in
    relation to adjoining buildings
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications, page 3 and 5. Under 'Sections & Site Levels inc Topographical
  Survey'. The topographical survey (site levels for the whole site) has no id of its own and is in the
  unmapped list.
review-status: unverified
