reference: biodiversity-survey-report
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: demolition
        value: true
        description: The development involves demolition of existing buildings.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Conversion of agricultural barns or buildings.
    - condition:
        field: engineering-operations
        value: true
        description: The proposal involves engineering operations.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for all major planning applications. - Required for all developments that involve
  demolition of existing buildings and/or conversion of agricultural barns or buildings. - Required for
  any engineering operations.
must-include:
- item: As a minimum, a Preliminary Ecology Survey identifying any ecological constraints
  level: must
- item: Any further ecological surveys that are required
  level: should
- item: Undertaken by a suitably qualified ecologist, in accordance with BS 42020:2013 (or its equivalent)
  level: must
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 10. Under 'Ecology Survey'. The list gives this under 'Local requirements
  for all non-householder applications'; it is shown here for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
