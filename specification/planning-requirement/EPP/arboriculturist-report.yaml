reference: arboriculturist-report
local-authority: EPP
required-if:
  site:
    in:
    - tree-preservation-zone
    - conservation-area
    description: There are trees protected by a TPO, or the site is in a conservation area.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Where there are trees protected by TPO or the site is situated with a conservation area,
  then all trees within or adjacent to the site must be shown on a plan including a Tree Protection Plan.
  If any trees identified in the above plan are proposed for removal or likely to be directly impacted
  by the proposed development, then an arboricultural impact assessment produced in accordance with BS
  5837:2012 Trees in Relation to Design, Demolition and Construction – Recommendations, shall be submitted
  with respect of the impacted trees.
must-include:
- item: All trees within or adjacent to the site shown on a plan
  level: must
- item: A Tree Protection Plan
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: An arboricultural impact assessment in accordance with BS 5837:2012 for the impacted trees
  level: must
  required-if:
    any:
    - condition:
        field: tree-removal
        value: true
        description: Trees shown on the plan are proposed for removal.
    - discretionary
confidence: medium
notes: From the council's list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications (reports, assessments etc), page 4 and 8. The householder section
  uses the same words without the Tree Protection Plan. The impact assessment part is partly discretionary
  because it also covers trees 'likely to be directly impacted'.
review-status: unverified
field-status: {}
