reference: arboriculturist-report
local-authority: EPP
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: There are trees protected by a TPO.
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees within or adjacent to the site.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Where there are trees protected by TPO or the site is situated with a conservation area,
  then all trees within or adjacent to the site must be shown on a plan including a Tree Protection Plan.
must-include:
- item: All trees within or adjacent to the site shown on a plan
  level: must
- item: A Tree Protection Plan
  level: must
confidence: medium
notes: The workbook filed this under Works to trees; it is the arboricultural report / tree survey for
  development (householder and non-householder), per the audit's householder list.
review-status: unverified
field-status: {}
