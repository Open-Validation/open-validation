reference: roof-plan-existing
local-authority: EPP
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-alteration
        value: true
        description: Roof alterations are proposed.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Roof plans required only where roof alterations are proposed, and they should show the shape
  and materials of the roof(s). ... Roof plans to show the shape and materials of the roof(s).
must-include:
- item: The shape and materials of the roof(s)
  level: must
confidence: medium
notes: 'From the council''s list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications, page 3 and 5. Householder: only where roof alterations are proposed.
  Non-householder: under ''Floor/Roof Plans - Required for all applications''. The list gives this under
  ''Local requirements for all non-householder applications''; it is shown here for full, outline and
  reserved matters applications.'
