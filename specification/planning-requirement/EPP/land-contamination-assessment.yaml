reference: land-contamination-assessment
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: There is potential for contaminants from onsite or offsite sources to be present.
    - condition:
        field: sensitive-end-use
        value: true
        description: Vulnerable receptors are proposed.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for applications where there is potential for contaminants from onsite or offsite
  sources to be present or where vulnerable receptors are proposed.
must-include:
- item: 'Undertaken by a suitably qualified contaminated land practitioner, in accordance with BS 10175
    and the Environment Agency''s Land Contamination: Risk Management (LCRM 2020) guidelines'
  level: must
- item: Assesses any contamination on the site, whether or not it originates on the site
  level: must
- item: A survey of the extent, scale and nature of contamination
  level: must
- item: An assessment of the potential risks to human health; property (existing or proposed); adjoining
    land; groundwater and surface waters; ecological systems; and archaeological sites and ancient monuments
  level: must
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 10. The list gives this under 'Local requirements for all non-householder
  applications'; it is shown here for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
