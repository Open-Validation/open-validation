reference: sustainable-drainage-strategy
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: footprint-increase
      value: true
      description: The proposal involves an increase in built development.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for all development proposals involving an increase in built development.
must-include:
- item: Details of the proposed sustainable drainage system (SuDS), including a drainage plan and supporting
    calculations
  level: must
- item: Meets the CIRIA SuDS Manual 2015, DEFRA NSTS and ECC SuDS Design Guide
  level: must
- item: A percolation test in accordance with BRE Digest 365
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: Infiltration drainage is proposed.
- item: A drainage plan and details of the type of system (make, mode, capacity and outfall details)
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Non-mains drainage is required.
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 10. Under 'Drainage Strategy (Including SuDS) & Flood Risk Assessments
  (FRA)'. The list gives this under 'Local requirements for all non-householder applications'; it is shown
  here for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
