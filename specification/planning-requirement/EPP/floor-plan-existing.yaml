reference: floor-plan-existing
local-authority: EPP
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for all applications. Existing and proposed floor plans. Existing buildings / walls
  to be demolished should be clearly shown. To show only existing built form and what is proposed.
must-include:
- item: Existing buildings and walls to be demolished clearly shown
  level: should
- item: Only the existing built form and what is proposed
  level: must
confidence: medium
notes: From the council's list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications, page 3 and 5. The householder section asks for existing and proposed
  floor plans in the same words, without 'Required for all applications'. The list gives this under 'Local
  requirements for all non-householder applications'; it is shown here for full, outline and reserved
  matters applications.
review-status: unverified
field-status: {}
