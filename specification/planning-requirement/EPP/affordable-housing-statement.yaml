reference: affordable-housing-statement
local-authority: EPP
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more homes.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: Residential floorspace of more than 1,000 sq m (combined gross internal area).
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for development sites which provide for 11 or more homes, or residential floorspace
  of more than 1000 sqm (combined gross internal area).
must-include:
- item: The number, type, tenure, size and mix of units proposed
  level: must
- item: Details of selection with RSLs / partners
  level: must
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 8.
review-status: unverified
field-status: {}
