reference: fire-statement
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: The building contains more than one dwelling.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: At least 18 metres tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: At least 7 storeys.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Full planning applications involving buildings that are at least 18 metres (or 7 stories)
  tall containing more than one dwelling will require a Fire Statement. There are some exemptions.
confidence: medium
notes: From the council's list (published February 2026), National requirements, page 2. The list says
  there are some exemptions and points to the government's fire statement guidance and template.
review-status: unverified
field-status: {}
