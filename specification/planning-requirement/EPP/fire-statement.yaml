reference: fire-statement
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building at least 18 metres tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of 7 or more storeys.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: The building contains more than one dwelling.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: County Council Fire Statement (if required) - Full planning applications involving buildings
  that are at least 18 metres (or 7 stories) tall containing more than one dwelling will require a Fire
  Statement.
confidence: medium
review-status: unverified
field-status: {}
