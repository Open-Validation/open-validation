reference: noise-assessment
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development (such as residential / educational uses) close to existing
          significant sources of noise.
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: Development that may result in significant noise impacts (such as B2 industrial
            uses, music venues, gyms).
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Close to existing noise sensitive development.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for noise sensitive development (such as residential / educational uses) close to
  existing significant sources of noise (motorways / railway lines / B2 industrial uses); or For developments
  that may result in significant noise impacts (i.e. B2 industrial uses / music venues / gyms) that are
  close to existing noise sensitive development.
must-include:
- item: Undertaken by a suitably qualified person
  level: must
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 16. Under 'Noise Survey'. The list gives this under 'Local requirements
  for all non-householder applications'; it is shown here for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
