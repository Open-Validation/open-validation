reference: flood-risk-assessment
local-authority: EPP
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is more than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is more than 1 hectare in flood zone 1.
  - site:
      in:
      - critical-drainage-area
      description: In an area within flood zone 1 with critical drainage problems as notified by the Environment
        Agency.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: 'Required for householder development in flood zone 2 or 3: For example; sheds, garages,
  games rooms etc within the curtilage of the existing dwelling, in addition to physical extensions to
  the existing dwelling itself; or more than 1 hectare (ha) in flood zone 1; or in an area within flood
  zone 1 which has critical drainage problems as notified by the Environment Agency. ... An FRA will be
  required for development in flood zones 2 or 3; or more than 1 hectare (ha) in flood zone 1; or in an
  area within flood zone 1 which has critical drainage problems as notified by the Environment Agency.'
confidence: medium
notes: From the council's list (published February 2026), Householder local requirements and Local requirements
  for all non-householder applications (reports, assessments etc), page 4 and 10. For householder development
  in flood zone 2 or 3 this includes sheds, garages and games rooms in the curtilage as well as extensions.
review-status: unverified
field-status: {}
