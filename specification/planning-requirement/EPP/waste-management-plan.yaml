reference: waste-management-plan
local-authority: EPP
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for all development which generates waste (except householders).
must-include:
- item: The size, appearance and siting of the bin storage compound, shown clearly on a layout plan
  level: should
- item: 'Where collection vehicles have to enter the site: vehicle tracking and on-site turning circles/turning
    points shown on a layout plan'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 16. Under 'Refuse and Recycling Provision'; the council's Refuse &
  Recycling Guidance Note has more detail. The tracking item applies only where collection vehicles have
  to enter the site, which has no mapped field, so it is shown as discretionary. The list gives this under
  'Local requirements for all non-householder applications'; it is shown here for full, outline and reserved
  matters applications.
review-status: unverified
field-status: {}
