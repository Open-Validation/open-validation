reference: bng-metric
local-authority: EPP
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: 'Biodiversity Gain Plan & Metric Information - All planning applications which are not exempt
  from BNG conditions will be required to submit:'
must-include:
- item: The completed Biodiversity Metric Tool showing the onsite habitat score on the date of the application,
    or on an earlier proposed date with justification
  level: must
- item: The completed metric for before the degradation occurred
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded.
- item: The score in biodiversity units
  level: must
- item: The publication date of the version of the metric used
  level: must
- item: A statement that degradation has occurred, when it started, any evidence for the start date and
    the score before the degradation
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded.
- item: A description of any irreplaceable habitat within the red line boundary on the metric calculation
    date
  level: must
confidence: medium
notes: 'From the council''s list (published February 2026), National requirements, page 2. The list says
  ''all planning applications which are not exempt from BNG conditions'', so this follows the law: householder
  and other exempt applications don''t need it.'
review-status: unverified
field-status: {}
