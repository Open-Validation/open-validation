reference: design-and-access-statement
local-authority: EPP
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Design and Access Statement (if required) - this should outline the design principles and
  concepts that have been applied to the proposed development and how issues relating to access to the
  development have been dealt with.
must-include:
- item: The design principles and concepts applied to the proposed development
  level: should
- item: How issues relating to access to the development have been dealt with
  level: should
confidence: medium
notes: From the council's list (published February 2026), National requirements, page 2. The list says
  '(if required)' without giving the triggers, so the national triggers (article 9 of the Development
  Management Procedure Order 2015) are shown.
review-status: unverified
field-status: {}
