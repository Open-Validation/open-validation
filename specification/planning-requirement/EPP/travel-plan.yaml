reference: travel-plan
local-authority: EPP
required-if:
  any:
  - condition:
      field: staff-count
      operator: '>='
      value: 50
      description: A non-residential proposal involving 50 employees or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 250
      description: A residential scheme of 250 or more units.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for all non-residential proposals involving 50 employees or more; or All residential
  schemes of 250 or more units.
must-include:
- item: How reliance on the private motor car will be reduced through a package of measures to encourage
    alternatives to single-occupancy car use
  level: must
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 19.
review-status: unverified
field-status: {}
