reference: transport-assessment
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for developments that may significantly affect highway safety, traffic generation,
  parking, or movement patterns, including most major applications.
must-include:
- item: Level of submission (Transport Assessment or Transport Statement) proportionate to the scale and
    impact of the proposal
  level: must
- item: Assessment of vehicular trips, junction capacity, parking demand, servicing and highway impacts
  level: must
- item: Assessment of pedestrian, cyclist and public transport access and connectivity
  level: must
- item: Assessment of compliance with relevant local and national transport policies
  level: must
- item: A Movement Strategy showing access points, internal movement routes and desire lines; safe and
    legible movement for all users, prioritising sustainable modes; and integration with the wider transport
    network
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published February 2026), Local requirements for all non-householder
  applications (reports, assessments etc), page 19. Under ''Transport Assessments, Statements & Movement
  Strategy''. Discretionary: needed for developments that ''may significantly affect'' highway safety,
  traffic, parking or movement, ''including most major applications''. The list gives this under ''Local
  requirements for all non-householder applications''; it is shown here for full, outline and reserved
  matters applications.'
review-status: unverified
field-status: {}
