reference: town-centre-impact-assessment
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2,500 square metres.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other main town centre uses in an edge of centre or out of centre location.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the development plan.
    - discretionary
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: 'Required for applications for any of the following: • Retail and leisure developments over
  2500 square metres; • Smaller retail and leisure likely to have a significant impact on smaller centres;
  and • Applications for other main town centre uses when they are an edge of centre or out of centre
  location; and not in accordance with a development plan.'
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: should
- item: Impact on town centre vitality and viability, including consumer choice
  level: should
- item: Impact on allocated sites outside the town centre being developed in accordance with the development
    plan
  level: should
- item: Impact on trade/turnover, both in the centre and the wider area
  level: should
- item: If in or on the edge of a town centre, whether of appropriate scale
  level: should
- item: Any locally important impacts on centres
  level: should
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 16. Under 'Retail or leisure Impact Statement / Assessment'. The 2,500
  sq m threshold covers retail and leisure floorspace. Smaller retail and leisure schemes 'likely to have
  a significant impact on smaller centres' are a judgement, so that part is discretionary. The list gives
  this under 'Local requirements for all non-householder applications'; it is shown here for full, outline
  and reserved matters applications.
review-status: unverified
field-status: {}
