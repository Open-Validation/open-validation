reference: sci
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: departure-from-development-plan
        value: true
        description: Contrary to (a departure from) the Development Plan policies.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 10000
        description: More than 10,000 square metres of gross non-residential floorspace.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 3
        description: A new residential site of 3 hectares or more.
    - condition:
        field: dwelling-count
        operator: '>'
        value: 100
        description: More than 100 dwellings regardless of site size.
    - discretionary
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: 'SCI will be provided where the proposal: • Is contrary to (a departure from) the Development
  Plan policies; • Proposes more than 10,000 square metres or gross non-residential floor space; • Proposes
  a new residential site of 3 hectares or more; • Proposes more than 100 dwellings regardless of site
  size; • Other potentially controversial applications where the nature of the development is likely to
  attract significant local interest.'
must-include:
- item: How the applicant has complied with the requirements for pre-application consultation
  level: should
- item: That the views of the local community have been sought and taken into account in the proposals
  level: should
confidence: medium
notes: 'From the council''s list (published February 2026), Local requirements for all non-householder
  applications (reports, assessments etc), page 18. Partly discretionary: ''other potentially controversial
  applications'' likely to attract significant local interest. The list gives this under ''Local requirements
  for all non-householder applications''; it is shown here for full, outline and reserved matters applications.'
review-status: unverified
field-status: {}
