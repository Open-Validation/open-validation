reference: sci
local-authority: EPP
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: The application is a departure from the development plan.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 10000
      description: More than 10,000 square metres of non-residential floorspace.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 3
      description: The site is 3 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 3
      description: The site is 3 hectares or more.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 100
      description: More than 100 dwellings.
  - discretionary
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
confidence: medium
notes: 'From the audit (missing_requirement): a Statement of Community Involvement for departures, >10,000
  sqm non-residential, sites of 3ha+, >100 dwellings, and controversial proposals (officer discretion).'
review-status: unverified
field-status: {}
