reference: lighting-assessment
local-authority: EPP
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: external-lighting
        value: true
        description: The development requires external lighting.
    - condition:
        field: floodlighting
        value: true
        description: The development requires floodlighting.
source-url: https://www.eppingforestdc.gov.uk/app/uploads/2026/02/Local-List-of-Validation-Requirements-2026-Update.pdf
source-text: Required for developments that require external lighting or floodlighting.
must-include:
- item: A layout plan with beam orientation
  level: must
- item: The height of any light source
  level: must
- item: Intended hours of illumination (other than within private domestic properties)
  level: should
confidence: medium
notes: From the council's list (published February 2026), Local requirements for all non-householder applications
  (reports, assessments etc), page 15. The list gives this under 'Local requirements for all non-householder
  applications'; it is shown here for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
