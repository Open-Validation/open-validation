reference: affordable-housing-statement
local-authority: SOL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more houses.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Site area of 0.5 ha or above.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 62 and 63; Local Plan Policy P4 'Meeting Housing Needs'; Meeting Housing Needs SPD
  (2014)
source-text: All major residential development
must-include:
- item: Number of dwellings, market and affordable, and the percentage proposed as affordable
  level: must
- item: Tenure of affordable dwellings (social rent, affordable rent, shared ownership)
  level: must
- item: Type and size (number of bedrooms) of property by market and affordable tenure
  level: must
- item: Gross internal area (sq m) by tenure and property type
  level: must
- item: Compliance with any standards (e.g. HCA DQS)
  level: must
- item: Location of affordable and market housing shown on a site layout
  level: must
- item: Evidence why, if less affordable or market housing is proposed than Local Plan policy seeks
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less affordable housing than policy seeks.
- item: A viability assessment if viability is stated as an issue
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Viability is stated as an issue.
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 23 (item 25). Called a
  'Meeting Housing Needs (including Affordable Housing) Statement'. The summary table (page 35) defines
  major residential as '10 or more houses or site area of 0.5ha or above'.
review-status: unverified
field-status: {}
