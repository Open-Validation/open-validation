reference: site-plan
local-authority: SOL
required-if:
  always: true
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: The Town and Country (Development Management Procedure) (England) Order 2015 Article 7
source-text: All Applications
must-include:
- item: The existing and proposed layout of the site, including the positions of any buildings
  level: must
- item: Details clearly and logically labelled, e.g. road and building names
  level: must
- item: Orientated to OS Grid North
  level: should
- item: Preferred scale 1:100, 1:200, 1:500 or 1:1000, with a linear scale bar and paper size
  level: should
- item: All site boundaries
  level: must
- item: 'Key written dimensions: minimum and maximum distances to all boundaries; width and depth of extensions'
  level: must
- item: All buildings, roads, footpaths and public rights of way, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees on and adjoining the site
  level: must
- item: The extent and type of hard surfacing and soft landscaping
  level: must
- item: Proposals shown in context with adjacent buildings (including property numbers where applicable)
  level: must
- item: A plan of the existing site as on the day of application
  level: must
- item: A 45 degree line from the centre of the nearest habitable room window of the neighbouring property
  level: must
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: Extensions to residential properties, or development immediately adjacent to existing
        residential properties (for major development, only new dwellings or buildings next to existing
        built form).
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 9 (item 7). Called a 'Block/Site
  Plan'. The list says 'All Applications'.
review-status: unverified
field-status: {}
