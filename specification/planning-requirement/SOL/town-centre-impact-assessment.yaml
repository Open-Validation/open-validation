reference: town-centre-impact-assessment
local-authority: SOL
required-if:
  all:
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Town centre uses over 2,500 m² gross floorspace.
    - discretionary
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up-to-date development plan.
  - any:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside (including on the edge of) an existing centre.
    - discretionary
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: Local Plan Policy P2 'Maintain Strong, Competitive Town Centres'
source-text: a)Economic Impact Assessment is required for applications for town centre uses where over
  2,500m2 gross floorspace would be provided, or would be likely to have significant adverse implications;
  and b) is not in accordance with an up-to-date development plan and the proposal is outside (including
  on the edge) of an existing centre, or is in an existing centre but would substantially increase the
  attraction of that centre.
confidence: medium
notes: 'From the council''s list (January 2020, in force 10 February 2020), page 27 (item 30). The ''Economic
  Impact Assessment'' part of item 30. Other town centre uses ''likely to have significant adverse implications'',
  and proposals in a centre that ''would substantially increase the attraction of that centre'', are judged
  case by case: discretionary. The sequential test is listed as unmapped.'
review-status: unverified
field-status: {}
