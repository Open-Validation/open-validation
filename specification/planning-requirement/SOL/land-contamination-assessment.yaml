reference: land-contamination-assessment
local-authority: SOL
required-if:
  all:
  - condition:
      field: floorspace-change
      value: true
      description: The development creates additional floor space.
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected (e.g. former petrol filling stations).
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 178-180; Local Plan Policy P14 'Amenity' (vi)
source-text: All developments creating additional floor space where contamination is known or suspected,
  e.g. former petrol filling stations
must-include:
- item: The existence or otherwise of contamination, its nature, the risks it may pose and whether they
    can be reduced to an acceptable level
  level: must
- item: A report comprising a desk study, a walkover site reconnaissance and a conceptual model of pollutant
    sources, pathways and receptors
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 21 (item 22).
review-status: unverified
field-status: {}
