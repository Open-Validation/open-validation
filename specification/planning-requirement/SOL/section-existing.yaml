reference: section-existing
local-authority: SOL
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes site levels.
  - condition:
      field: site-level-change
      operator: '>'
      value: 0.3
      description: Existing levels across the site vary more than 0.3 metres.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: Solihull Local Plan P14 and P15; NPPF (Para. 127)
source-text: All applications proposing changes to site levels or where existing levels across the site
  vary more than 0.3 metres.
must-include:
- item: Orientated to OS Grid North
  level: should
- item: Drawn to a recognisable scale with the '@paper size ref' and a linear scale bar
  level: must
- item: Plans numbered correctly with the latest revision indicated
  level: must
- item: The proposals in relation to adjoining land and buildings
  level: must
- item: Cross section(s) through the proposed building(s) to neighbouring land and buildings, showing
    the existing and proposed site context
  level: should
- item: Existing and finished levels, with details of foundations, retaining structures and how eaves
    relate to adjacent land and boundaries
  level: should
- item: How any encroachment on adjacent land is to be avoided
  level: should
- item: Existing site levels and finished floor levels related to a fixed datum point
  level: should
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 12 (item 10). Called 'Existing
  and Proposed Site level drawings'; they include cross sections, so they are shown as sections.
review-status: unverified
field-status: {}
