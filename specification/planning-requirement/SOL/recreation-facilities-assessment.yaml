reference: recreation-facilities-assessment
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - condition:
      field: loss-of-open-space
      value: true
      description: The proposal results in the loss of open space.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para 96 & 97; Local Plan Policies P10, P15, P18 and P20
source-text: Major commercial developments Major residential developments When a proposal results in the
  loss of open space.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: must
- item: 'For major residential development: provision of appropriate open space, sports and recreational
    facilities (2.86 ha per 1000 people at 2.3 people per dwelling), across different typologies'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
- item: 'For major commercial development: new open space and/or a contribution to the green infrastructure
    network'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial development.
- item: 'Where open space is lost: evidence that it is surplus to requirements, that the needs/benefits
    of the development clearly outweigh the loss, and mitigation and/or compensation proposals'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 26 (item 29). Called an
  'Open Space (Children's Play, Sport, Recreation and Leisure) Statement'.
review-status: unverified
field-status: {}
