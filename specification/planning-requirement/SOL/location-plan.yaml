reference: location-plan
local-authority: SOL
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - demolition-con-area
    - lbc
    - advertising
    - ldc
    - prior-approval
    - consent-under-tpo
    - notice-trees-in-con-area
    - pip
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: The Town and Country (Development Management Procedure) (England) Order 2015 Article 7
source-text: All applications (except applications for Non-Material Amendments and discharge of condition
  applications as well as Section 73 applications to vary/remove a planning condition).
must-include:
- item: The application site shown with a red line
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
- item: A plan of the site as sited on the day of application
  level: must
- item: Where possible, at least two named roads and surrounding buildings
  level: should
- item: A linear scale bar (useful, particularly for electronic submissions)
  level: should
- item: Orientated to OS Grid North
  level: should
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 5 (item 5). Not needed
  for non-material amendments, discharge of conditions or section 73 applications.
review-status: unverified
field-status: {}
