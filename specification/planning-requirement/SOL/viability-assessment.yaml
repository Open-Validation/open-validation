reference: viability-assessment
local-authority: SOL
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: Policy-compliant development is not proposed for viability reasons.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: 'NPPF Para. 173; PPG Reference ID: 10'
source-text: For applications when policy-compliant development is not being proposed for viability reasons
must-include:
- item: Enough detail for an objective review, having regard to Appendix C of the RICS guidance note 'Financial
    Viability in Planning'
  level: should
- item: Details of the scheme, including floor areas, types and numbers of units
  level: must
- item: Estimated sales values for residential and commercial property, including affordable housing,
    with market evidence
  level: must
- item: A calculation of the Gross Development Value, with evidence of how it was derived
  level: must
- item: A viability report and appraisal with all costs (acquisition, construction, abnormal, contingency,
    professional fees, marketing, letting and disposal, finance/interest)
  level: must
- item: A development programme (pre-build, construction, marketing and sales periods)
  level: must
- item: The level of development profit, as profit on cost and/or on value
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 30 (item 37). Called a
  'Viability Appraisal'.
review-status: unverified
field-status: {}
