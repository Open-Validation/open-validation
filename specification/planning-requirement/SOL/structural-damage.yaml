reference: structural-damage
local-authority: SOL
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - any:
    - condition:
        field: subsidence-alleged
        value: true
        description: Tree alleged to cause subsidence damage.
    - condition:
        field: structural-damage-alleged
        value: true
        description: Tree alleged to cause structural damage.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: 'PPG Reference ID: 36; Policy P10, P15 of the Solihull Local Plan'
source-text: A structural engineer’s or surveyor’s report and arboriculturist’s report are required if
  the work is based on the claim that the tree(s) are causing structural/ subsidence damage.
must-include:
- item: A structural engineer's or surveyor's report
  level: must
- item: An arboriculturist's report
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 30 (item 36).
review-status: unverified
field-status: {}
