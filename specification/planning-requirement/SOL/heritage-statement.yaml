reference: heritage-statement
local-authority: SOL
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - scheduled-monument
    - archaeological-priority-area
    - park-and-garden
    - locally-listed-building
    description: Affects heritage assets (listed buildings, conservation areas, scheduled monuments, archaeological
      sites, registered parks or gardens, locally listed buildings) or their setting.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Section 12; Local Plan Policy P16 'Conservation of Heritage Assets and Local Distinctiveness'
source-text: Any application affecting heritage assets or their setting. … Heritage assets include listed
  buildings, conservation areas, scheduled ancient monuments or archaeological sites,
must-include:
- item: A description of the heritage asset and its setting
  level: must
- item: An assessment of the significance of the asset and its setting (including an Archaeological Statement
    if required), with photos/photomontages of the building and its setting or the section affected
  level: must
- item: An assessment of the likely impact of the proposal on the asset and its setting
  level: must
- item: A mitigation strategy for any impacts on the significance of the asset and its setting
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 20 (item 21). Can be within
  the Design and Access Statement where robust.
review-status: unverified
field-status: {}
