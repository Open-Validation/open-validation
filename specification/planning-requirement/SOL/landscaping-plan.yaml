reference: landscaping-plan
local-authority: SOL
required-if:
  all:
  - ref: major-development
  - condition:
      field: external-space
      value: true
      description: The development includes external space.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 175, 127; Local Plan Policies P10, P14, P15, P16 and P18
source-text: All major planning developments that include any external space must be accompanied by a
  landscape strategy, plan and written statement detailing design approach proposed for both soft and
  hard landscaping
must-include:
- item: 'For outline applications: indicative landscape proposals showing layout and the type, nature,
    functions, extents and proportions of external treatments, surfaces, structures and retained and proposed
    vegetation'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'For full applications: detailed landscape proposals, including a masterplan at a suitable scale
    (e.g. 1:200) and technical construction and soft works drawings'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'Soft landscaping: the extent of existing and proposed planting areas and the type of planting'
  level: must
- item: 'Hard landscaping: a public realm materials palette including hard landscaping and street furniture'
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 22 (item 23). Called a
  'Landscape and Public Realm Strategy'.
review-status: unverified
field-status: {}
