reference: flood-risk-assessment
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 1+ ha in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 1+ ha in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: All new proposals in Flood Zones 2 or 3.
  - site:
      in:
      - critical-drainage-area
      description: Development proposed in a 'critical drainage area'.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 155-165; Local Plan Policy P11 'Water Management'
source-text: All major planning developments. … Development proposals of 1+ ha in Flood Zone 1, and for
  all new proposals in Flood Zones 2 or 3. Development proposed in ‘critical drainage area’
must-include:
- item: The risks of all forms of flooding to and from the development and how they will be managed, taking
    climate change into account (100 year flood event + 30%)
  level: must
- item: 'On sites larger than 1 ha: evidence of how surface water discharge will be limited to the site-specific
    greenfield run-off rate'
  level: should
  required-if:
    any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: Site larger than 1 ha.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: Site larger than 1 ha.
- item: Opportunities to reduce the probability and consequences of flooding, including surface water
    management with Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 19 (item 20).
review-status: unverified
field-status: {}
