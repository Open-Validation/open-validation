reference: flood-risk-assessment
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      - critical-drainage-area
      description: The site is in flood zone 2 or 3, or in a critical drainage area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in flood zone 1).
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
source-text: FRA should identify opportunities to reduce the probability and consequences of flooding
  and should include the design of surface water management systems including Sustainable Drainage Systems
  (SuDS) and address the requirement for safe access to and from the development in areas at risk of flooding.
must-include:
- item: Design of surface water management systems, including SuDS
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: 'Audit (wrong_trigger): item 20''s trigger is all major development, 1ha+ in flood zone 1, flood
  zones 2/3, or a critical drainage area. Includes Householder in flood zones 2/3.'
review-status: unverified
field-status: {}
