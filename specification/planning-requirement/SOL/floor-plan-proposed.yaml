reference: floor-plan-proposed
local-authority: SOL
required-if:
  any:
  - condition:
      field: floorspace-change
      value: true
      description: New or amended floorspace.
  - condition:
      field: building-works
      value: true
      description: Proposals to alter existing buildings.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: Solihull Local Plan P14 and P15; NPPF (Para. 127)
source-text: All applications proposing new or amended floorspace and/or proposals to alter existing buildings.
must-include:
- item: Orientated to OS Grid North
  level: should
- item: Drawn to a recognisable scale with the '@paper size ref' and a linear scale bar
  level: must
- item: Plans numbered correctly with the latest revision indicated
  level: must
- item: The proposed works shown clearly in relation to what is already there, preferably in colour
  level: must
- item: Existing and proposed plans adjacent on the same sheet, or with identical layouts on separate
    sheets
  level: should
- item: Rooms clearly labelled, showing all internal divisions within the building
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition.
- item: Key written dimensions of the width and depth of extensions
  level: should
- item: A 45 degree line from the centre of the nearest habitable room window of the neighbouring property
  level: must
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: Extensions to residential properties, or development immediately adjacent to existing
        residential properties.
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 11-12 (item 9).
review-status: unverified
field-status: {}
