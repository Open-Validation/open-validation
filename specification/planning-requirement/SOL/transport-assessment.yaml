reference: transport-assessment
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 20
      description: 20 or more new dwellings (transport statement).
  - discretionary
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 111; Local Plan Policies P7 and P8; DfT Circular 02/2013
source-text: All major planning developments and minor developments with significant transport implications.
  In the context of major new housing development a transport statement will be required for proposals
  seeking 20 or more new dwellings.
must-include:
- item: Coverage and detail reflecting the scale, nature and location of the development and the extent
    of its transport implications
  level: must
- item: 'For smaller schemes: a Transport Statement outlining the transport aspects (can be in the Design
    and Access Statement)'
  level: should
confidence: medium
notes: 'From the council''s list (January 2020, in force 10 February 2020), page 29 (item 33). Minor developments
  ''with significant transport implications'' depend on scale, type, location and highway safety or network
  performance: discretionary.'
review-status: unverified
field-status: {}
