  notes: 'The link is the current January 2020 Local Validation Criteria (in force 10 Feb 2020), but Grokbot
    dated it to the 2015 predecessor. Extraction captured under half of the 38 items (missing Aerodrome
    Safeguarding, CIL form, Security, Noise, Parking & Access, Heritage Statement, Affordable Housing,
