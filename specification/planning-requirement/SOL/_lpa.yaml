  date: 2020-01
  date-basis: 'Cover: ''Local Validation Criteria January 2020''. The council''s Local Validation Checklist
    page (https://www.solihull.gov.uk/planning-and-building-control/local-validation-checklist), checked
    2026-11-06, says it was reported to Cabinet on 22 January 2020 and is ''in force from Monday 10th
    February 2020'', and links no newer list or consultation; the national checklist and ''applying for
    planning permission'' pages and the February 2026 Public Open Space SPD point to the same page. A
    web search hinted at a 2026 Cabinet decision on a revised checklist, but the council''s democracy
    site (democracy.solihull.gov.uk) was refused by this session''s network proxy, so it could not be
    checked.'
  status: outdated
submission-standards:
- item: Drawings to a recognisable metric scale, with the paper size reference ('@paper size') and a linear
    scale bar
  level: must
- item: Plans numbered correctly with the latest revision indicated
  level: must
- item: Plans orientated to OS Grid North
  level: should
- item: Key written dimensions annotated on the plans (distances to boundaries; width and depth of extensions;
    external height to ridge and eaves)
  level: must
- item: Existing and proposed plans placed next to each other on the same sheet, or with identical layouts
    if on separate sheets
  level: should
