reference: air-quality-assessment
local-authority: SOL
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
  - any:
    - discretionary
    - condition:
        field: distance-to-busy-road
        operator: <=
        value: 10
        description: Within 10 metres of a road with 10000 or more vehicles per day.
    - condition:
        field: near-no2-exceedance
        value: true
        description: Background above 90% of a National Air Quality Objective limit (DEFRA data).
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 103; 181; Local Plan Policy P14 'Amenity' (v and viii)
source-text: Housing developments where background 90% of National Air Quality Objective limit for a pollutant
  based on DEFRA air quality Data Archive, and/or development is within 10 metres of a … pollutant source
  such as a petrol filling station.
must-include:
- item: Such information as is necessary for full consideration of the impact on the air quality of the
    area
  level: must
- item: A basic screening assessment or a full Air Quality Assessment using advanced dispersion modelling,
    as the development needs
  level: should
- item: Methodology agreed with the council (planning@solihull.gov.uk)
  level: should
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 14 (item 13). Being within
  10 metres of a pollutant source such as a petrol filling station is not a field we hold, so it shows
  as discretionary. The list noted no Air Quality Management Areas in Solihull.
review-status: unverified
field-status: {}
