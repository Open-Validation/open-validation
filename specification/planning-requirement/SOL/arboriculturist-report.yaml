reference: arboriculturist-report
local-authority: SOL
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on site or immediately adjacent to it.
  - all:
    - application-type:
        in:
        - pa-demo-building
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Demolition likely to affect trees on or adjacent to the site.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: Local Plan Policy P10 'Natural Environment', P14 'Amenity' (iv), P15 and P18
source-text: All applications where trees are present on-site or immediately adjacent to the site, and
  particularly where TPO or veteran trees are present. Prior notifications for demolition works that are
  likely to affect trees on or adjacent to the site
must-include:
- item: A tree survey in descriptive and plan form (BS 5837) showing the condition, location and constraints
    of all trees on and adjacent to the site
  level: must
- item: 'A list of trees to be retained and removed, and a schedule of tree works/pruning to retained
    trees (BS 3998: 2010)'
  level: must
- item: A tree retention and removal plan illustrating root protection areas on a proposed layout plan
  level: must
- item: An Arboricultural Impact Assessment with tree protection measures and a method statement (BS5837
    - 2012)
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 29 (item 35). Called 'Trees/Arboricultural
  Implications Assessment'. The summary table says it applies to 'All applications (including Householder)'.
review-status: unverified
field-status: {}
