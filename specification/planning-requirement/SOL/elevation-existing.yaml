reference: elevation-existing
local-authority: SOL
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to the exterior of existing buildings, including extensions.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: Solihull Local Plan P14 and P15; NPPF (Para. 127)
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings
  (including extensions).
must-include:
- item: Orientated to OS Grid North
  level: should
- item: Drawn to a recognisable scale with the '@paper size ref' and a linear scale bar
  level: must
- item: Plans numbered correctly with the latest revision indicated
  level: must
- item: The proposed works shown clearly in relation to what is already there, preferably in colour
  level: must
- item: Existing and proposed plans adjacent on the same sheet, or with identical layouts on separate
    sheets
  level: should
- item: Existing and proposed building materials, and the style, materials and finish of windows and doors
  level: must
- item: Any blank elevations
  level: must
- item: Elevations clearly labelled (e.g. front or rear) with titles referring to their content
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each'
  level: should
  required-if:
    condition:
      field: adjoins-existing-building
      value: true
      description: An elevation adjoins or is close to another building.
- item: The whole of any existing elevation being extended or altered, not just part of it
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: An existing building is extended or altered.
- item: Key written dimensions of external height to ridge and eaves
  level: must
- item: Any streetscene drawing marked as indicative and on a separate plan
  level: should
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 10 (item 8).
review-status: unverified
field-status: {}
