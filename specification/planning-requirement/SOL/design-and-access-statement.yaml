reference: design-and-access-statement
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates 100 square metres or more of floorspace.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
source-text: (iii) Listed Building Consent applications
confidence: medium
notes: 'Audit (wrong_trigger, missing_requirement): item 6 requires a DAS for major development, conservation
  area / World Heritage Site schemes of 1+ dwelling or 100 sqm+, and all LBC applications.'
review-status: unverified
field-status: {}
