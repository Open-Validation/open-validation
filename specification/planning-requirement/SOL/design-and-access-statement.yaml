reference: design-and-access-statement
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: A designated area (conservation area or world heritage site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sqm or more.
  - application-type:
      in:
      - lbc
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF para 127; Solihull Local Plan P15
source-text: 'Required (i) major development as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015; (ii) Applications for development in a NPPF
  para 127 NPPG Paragraph: 030 Reference ID: 14- 030-20140306 https://www.gov.uk/guidance/making-an- application#Design-and-Access-Statement
  The purpose of a Design and Access Statement is to explain the design thinking behind the proposed development
  and why this is a suitable response to the site and its setting, and to demonstrate it can be adequately
  accessed by prospective users. The scope and level of detail in a Design and designated area (conservation
  area or world heritage site), where the proposed development consists of: one or more dwellings or where
  a building or buildings with a floor space of 100sqm or more. (iii) Applications for listed building
  consent.'
must-include:
- item: An assessment of the character and physical features of the site and its surroundings, including
    any potential assets and constraints
  level: must
- item: An explanation of the design approach and principles and how they take account of that assessment
    and align with local design guidance
  level: must
- item: Access and movement arrangements, explaining how all users will have equal and convenient access
    to buildings, external spaces, public realm, street and public transport
  level: must
- item: A description of any heritage assets affected, their setting and significance, and how they are
    affected and integrated into the proposal
  level: must
- item: How the development may provide flexibility to adapt to changing needs
  level: must
- item: Any other factors that have influenced the design (planning policy, access policy, user requirements)
  level: must
- item: What consultation or pre-application discussions on design and access have taken place and how
    they were taken into account
  level: must
- item: How the scheme has evolved during the design process
  level: must
- item: Visual material such as photographs, sketches, cross-sections and diagrams, annotated
  level: should
- item: 'For listed building consent: how the design takes account of the special architectural or historic
    importance of the building and the physical features that illustrate its significance'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For major residential development: reference to the National Design Guide''s 10 characteristics
    and a Building for Life 12 assessment'
  level: should
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  source-text: Should be within the Design and Access statement where required:-
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 5-8, 14 (item 6, 14). Item
  14 (National Design Guide and Building for Life, major residential development) 'Should be within the
  Design and Access statement where required'.
review-status: unverified
field-status: {}
