reference: lighting-assessment
local-authority: SOL
required-if:
  condition:
    field: external-lighting
    value: true
    description: Significant new or amended external lighting.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 180c; Local Plan Policies P10, P14 (ix), P15 and P16
source-text: All developments proposing or including significant new or amended external lighting
must-include:
- item: Details of external lighting and the proposed hours when it would be switched on
  level: must
- item: A layout plan with beam orientation, a schedule of the equipment and any proposed mitigation
  level: must
- item: 'For floodlighting: light spillage, hours of illumination, light levels, column heights, specification
    and colour, lamp and luminaire treatment, full horizontal cut-off, no distraction to the highway,
    impact on nearby dwellings, demountable columns, screening vegetation, planting and bunding'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Floodlighting.
- item: How the lighting may affect visual amenity, local character, neighbouring amenity, heritage assets,
    designated nature conservation sites or priority habitats and protected or priority species, and how
    those effects will be mitigated
  level: should
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 23 (item 24).
review-status: unverified
field-status: {}
