reference: noise-assessment
local-authority: SOL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The development is residential.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise levels of 50-55 dBA or more, or within 250m of an industrial area.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
confidence: low
