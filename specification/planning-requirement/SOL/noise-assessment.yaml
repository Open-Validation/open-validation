reference: noise-assessment
local-authority: SOL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  - condition:
      field: noise-generating-use
      value: true
      description: Development that may raise issues of disturbance to noise sensitive uses.
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise-sensitive use.
    - discretionary
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Para. 180; Local Plan Policy P14 'Amenity' (vii and viii)
source-text: All Major residential developments and other developments that may raise issues of disturbance
  to noise sensitive uses. If modelled level on SMBC noise mapping is in the 50- 55 dBA contour and above
  or … within 250 metres of an industrial area.
must-include:
- item: All proposed noise emissions, mitigation and insulation details
  level: must
- item: Prepared by a suitably qualified acoustician
  level: must
- item: 'Vibration surveys having regard to BS 6472: 2008 and BS 7385-2: 1993'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 24 (item 26). Called a
  'Noise and Vibration Impact Assessment'. The trigger 'modelled level on SMBC noise mapping in the 50-55
  dBA contour and above or within 250 metres of an industrial area' depends on the council's noise map,
  so it shows as discretionary.
review-status: unverified
field-status: {}
