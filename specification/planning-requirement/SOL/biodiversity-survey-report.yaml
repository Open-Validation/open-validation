reference: biodiversity-survey-report
local-authority: SOL
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected or priority species are known or strongly suspected to be present.
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - local-wildlife-site
          - priority-habitat
          description: Designated sites or priority habitats.
      - condition:
          field: semi-natural-habitat-impact
          value: true
          description: Loss of semi-natural habitat.
  - condition:
      field: demolition
      value: true
      description: Demolition of a building (bat survey).
  - condition:
      field: potential-roost-features
      value: true
      description: Works resulting in destruction of a roof void (bat survey).
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: NPPF Section 15; Local Plan Policy P10 'Natural Environment', P13 'Minerals' and P14 'Amenity'
  (ix)
source-text: Development where protected or priority species are known or strongly suspected to be … present.
  Major and minor development likely to affect designated sites or priority habitats, where there is loss
  of semi- natural habitat. … Bat survey required for demolition of a building or works resulting in destruction
  of a roof void.
must-include:
- item: Any significant biodiversity or geological conservation interests and the location of protected
    species or their habitats
  level: must
- item: An assessment of the potential to cause significant disturbance to an ecological site or protected
    species
  level: must
- item: Results submitted as an Ecological Impact Assessment (EcIA) following CIEEM (2018) guidance; a
    Preliminary Ecological Appraisal Report alone may be sufficient for very straightforward sites
  level: must
- item: Protected species and further habitat surveys as required following the PEA
  level: should
- item: A Biodiversity Impact Assessment where there is loss of semi-natural habitats
  level: must
  required-if:
    condition:
      field: semi-natural-habitat-impact
      value: true
      description: Loss of semi-natural habitat.
- item: Demonstrate net biodiversity gain
  level: must
  required-if:
    condition:
      field: semi-natural-habitat-impact
      value: true
      description: Loss of semi-natural habitat.
- item: A bat survey
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building.
    - condition:
        field: potential-roost-features
        value: true
        description: Destruction of a roof void.
- item: A Local Wildlife Site survey if a potential Local Wildlife Site is to be impacted
  level: must
  required-if:
    site:
      in:
      - local-wildlife-site
      description: A potential Local Wildlife Site would be impacted.
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 17-18 (item 18). Called
  an 'Ecological/Geological Assessment (Biodiversity/Geodiversity)'. The list predates statutory biodiversity
  net gain (February 2024) and has no BNG metric requirement.
review-status: unverified
field-status: {}
