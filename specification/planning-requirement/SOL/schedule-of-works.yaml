reference: schedule-of-works
local-authority: SOL
required-if:
  all:
  - site:
      in:
      - listed-building
      description: A listed building.
  - any:
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - condition:
        field: structural-alteration
        value: true
        description: Significant alterations/repairs.
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: Local Plan Policy P16 'Conservation of Heritage Assets and Local Distinctiveness'
source-text: Where the proposed development will involve the demolition or significant alterations/repairs
  to a listed building a Schedule of Works will be required
must-include:
- item: The location, extent and significance of all items to be removed or altered
  level: must
- item: How remaining items will be protected during building works
  level: must
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 20 (item 21). Part of the
  Heritage Statement item.
review-status: unverified
field-status: {}
