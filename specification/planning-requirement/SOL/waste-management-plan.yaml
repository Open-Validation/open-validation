reference: waste-management-plan
local-authority: SOL
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: National Planning Policy for Waste (2014); Local Plan Policy P12 'Resource Management'
source-text: Major planning development and other significant planning applications likely to generate
  significant volumes of waste, such as … flatted development below the majors’ threshold.
must-include:
- item: That waste will be minimised and managed in line with the waste hierarchy
  level: must
- item: 'Construction phase: the anticipated nature and volumes of waste'
  level: must
- item: 'Construction phase: where appropriate, steps to reuse waste arising on previously developed land
    in the new development'
  level: should
- item: 'Construction phase: other steps to manage waste that cannot be incorporated or arises after completion'
  level: must
- item: 'Construction and operational phases: steps for effective segregation of wastes at source, including
    waste sorting, storage, recovery and recycling facilities'
  level: must
confidence: medium
notes: 'From the council''s list (January 2020, in force 10 February 2020), page 31 (item 38). Called
  a ''Waste Audit''. Other applications ''likely to generate significant volumes of waste'' (such as flats
  below the major threshold) are judged case by case: discretionary.'
review-status: unverified
field-status: {}
