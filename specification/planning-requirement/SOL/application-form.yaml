reference: application-form
local-authority: SOL
required-if:
  always: true
source-url: https://www.solihull.gov.uk/sites/default/files/migrated/Planning_Local_Validation_Criteria_Jan_2020.pdf
policy: The Town and Country (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: All sections and questions answered where relevant
  level: must
- item: Declaration signed and dated
  level: must
- item: 'For development other than housing: non-residential floorspace given as gross internal floorspace'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential development.
- item: 'For the siting of mobile homes (including gypsy, traveller or travelling show people plots or
    pitches): the number of homes, plots or pitches in the description'
  level: must
  required-if:
    condition:
      field: traveller-site
      value: true
      description: The siting of mobile homes, plots or pitches.
- item: 'For waste management development: the detailed planning application form, with the ''Industrial
    or Commercial Processes and Machinery'' section completed in full'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'For mineral development: the detailed planning application form'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
confidence: medium
notes: From the council's list (January 2020, in force 10 February 2020), page 3 (item 1).
review-status: unverified
field-status: {}
