reference: site-restoration
local-authority: TOB
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
  - all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: The application involves waste disposal.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: National Planning Policy for Waste; Torbay Local Plan policy W1
source-text: Proposals for mineral extraction and all applications involving waste disposal.
must-include:
- item: A statement and plans of the proposed restored landscape (landform, land cover and landscape features)
    showing how they link to the surrounding area and respond to the landscape character
  level: must
  source-text: 'A statement and plans detailing: ... details of the proposed restored landscape including
    landform, land cover and landscape features'
- item: How the proposals improve and connect with the green infrastructure network, including ecological
    requirements identified in the Wildlife Report
  level: must
- item: Measures for managing emissions (including gases and liquids)
  level: must
- item: Phasing arrangements
  level: must
- item: A programme of aftercare and monitoring of the site
  level: must
confidence: medium
notes: From the council's list (published November 2024), page 40 (section 3.8.8). The list calls it a
  Restoration and Aftercare Scheme Assessment. 'Applications involving waste disposal' is shown with the
  landfill-development field.
review-status: unverified
field-status: {}
