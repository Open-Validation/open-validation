reference: noise-assessment
local-authority: TOB
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development may create additional noise with an adverse effect on residential or
        recreational amenity.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A sensitive development close to a use creating noticeable noise.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policy DE3; NPPF
source-text: For development proposals that may create additional noise resulting in an adverse effect
  on residential / recreational amenity, or for sensitive development proposals located close to a use
  creating noticeable noise ... For development proposals that may create additional noise resulting in
  an adverse effect on residential / recreational amenity Or, upon request of the Council
confidence: medium
notes: From the council's list (published November 2024), pages 42, 55 (sections 3.10.2, 4.2.6). The list
  calls it a Noise Impact Assessment. For prior approvals the list adds 'Or, upon request of the Council'
  (section 4.2), shown as discretionary.
review-status: unverified
field-status: {}
