reference: section-proposed
local-authority: TOB
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - demolition-con-area
      - extraction-oil-gas
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The application proposes altered land levels.
    - condition:
        field: height-change
        value: true
        description: Alterations are proposed to floors, ceilings or roofs.
    - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: 'Applications: proposing altered land levels; where alterations are proposed to floors/ceilings/roofs;
  where the application needs to demonstrate that nationally described space standards can be achieved
  where topography is key to the site; or where the relationship of existing buildings, mature vegetation
  or other distinctive features with or surrounding the sites is required to be shown.'
must-include:
- item: Existing and proposed sections in context with surrounding buildings, structures and topographical
    features, with accurate scale and height, including the height of existing and proposed trees that
    would help screen and integrate the proposal
  level: must
  source-text: show existing and proposed sections in context with surrounding buildings/structures/topographical
    features.
- item: Finished floor and/or site levels
  level: must
  source-text: show finished floor and/or site levels;
- item: Major dimensions
  level: must
  source-text: include major dimensions; and
- item: Spot heights and levels in metres above OS datum (AOD)
  level: must
  source-text: provide spot heights and levels in metres above OS datum (AOD)
confidence: medium
notes: From the council's list (published November 2024), page 15 (section 2.11). Application types are
  those whose checklist on the council's validation page lists this drawing (householder, outline or full
  major and minor, reserved matters, listed building consent, advertisement, relevant demolition in a
  conservation area, onshore oil and gas). Demonstrating nationally described space standards, sites where
  topography is key, and showing the relationship with existing buildings, mature vegetation or other
  features are judgements, so they show as discretionary.
review-status: unverified
field-status: {}
