reference: elevation-existing
local-authority: TOB
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
        - advertising
        - demolition-con-area
        - extraction-oil-gas
    - condition:
        field: building-works
        value: true
        description: The application proposes new or altered buildings or structures.
  - all:
    - application-type:
        in:
        - prior-approval
    - any:
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: The development extends floor space.
      - condition:
          field: building-works
          value: true
          description: Alterations and/or extensions to existing buildings, including changes of use.
      - condition:
          field: new-build
          value: true
          description: A new dwelling or building is proposed.
      - condition:
          field: demolition
          value: true
          description: Structures forming part of the proposal are to be demolished.
      - condition:
          field: plant-equipment
          value: true
          description: The development includes ventilation or extraction equipment.
      - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications proposing new or altered buildings or structures ... Where development extends
  floor space. Where alterations and/or extensions to an existing building(s) are proposed, including
  changes of use. When a new dwelling or building is proposed. Where structures are to be demolished that
  form part of the proposal. Where the development includes provision of ventilation/extraction equipment.
  Or, upon request of the Council
must-include:
- item: All sides of the proposed or affected buildings or structure, including all window and door openings
  level: must
  source-text: show all sides of the proposed/affected buildings/structure including all window and door
    openings;
- item: Existing and proposed elevations (e.g. 1:50 or 1:100)
  level: must
  source-text: show existing and proposed elevations (e.g. 1:50 or 1:100);
- item: The site in the context of the street scene, where appropriate
  level: must
  required-if: discretionary
  source-text: Show the site in context of the streetscene where appropriate
- item: Major dimensions
  level: must
  source-text: Include major dimensions; and
- item: 'For prior approvals: all sides, drawn to an identified scale'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: 4.2.1 Elevations (all sides) drawn to an identified scale
- item: 'For prior approvals: the position of any windows and doors that face towards adjoining premises'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: elevation drawings must show the position of any windows and doors that face towards adjoining
    premises to determine whether there will be any overlooking and impact on privacy.
confidence: medium
notes: From the council's list (published November 2024), pages 15, 53 (sections 2.10, 4.2.1). Application
  types are those whose checklist on the council's validation page lists this drawing (householder, outline
  or full major and minor, reserved matters, listed building consent, advertisement, relevant demolition
  in a conservation area, onshore oil and gas). Drawings must also follow the plan formatting rules (see
  submission standards). For prior approvals the list adds 'Or, upon request of the Council' (section
  4.2), shown as discretionary.
review-status: unverified
field-status: {}
