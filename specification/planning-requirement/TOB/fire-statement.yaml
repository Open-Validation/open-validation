reference: fire-statement
local-authority: TOB
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - prior-approval
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Education accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: 'An application for planning permission for development which involves: the provision of
  one or more relevant buildings development of an existing relevant building development within the curtilage
  of a relevant building A relevant building is one which contains two or more dwellings or education
  accommodation and is 18m or 7 storeys in height or more. The following types of application are exempt:
  material change in use which would result in the building no longer being a relevant building or would
  not result in the provision of one or more relevant buildings within the curtilage of a relevant building
  application for outline planning permission application for permission to develop land without compliance
  with conditions under section 73 of the Town and Country Planning Act 1990'
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect), with
    the particulars it asks for
  level: must
  source-text: Fire statements must be submitted on a form published by the Secretary of State (or a form
    to similar effect) contain the particulars specified or referred to in the form
confidence: medium
notes: From the council's list (published November 2024), pages 16, 59 (sections 2.12, 4.2.25). A relevant
  building contains two or more dwellings or education accommodation and is 18 m or 7 storeys or more;
  new relevant buildings, work to an existing one and development in its curtilage all count. Outline
  applications, section 73 applications and changes of use that leave no relevant building are exempt.
  Reserved matters per the council's reserved matters checklist; prior approvals per section 4.2.25.
review-status: unverified
field-status: {}
