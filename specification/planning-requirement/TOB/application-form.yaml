reference: application-form
local-authority: TOB
required-if:
  always: true
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications
must-include:
- item: Signed Ownership Certificate (A, B, C or D) and Agricultural Land Declaration
  level: must
  source-text: A completed application form including signed Ownership Certificate and Agricultural Land
    Declaration.
- item: 'For prior approvals: a written description of the proposed development covering the relevant
    impacts for the class, with the developer''s contact address and email address'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: 4.1.1 Written description of the proposed development and the developer's contact address
    and email address ... The written description should include information covering the relevant impacts
    for this class in the GPDO.
- item: 'For prior approvals where there is an owner or tenant of the land other than the developer: a
    copy of the notice given to them'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: Where there is an owner or tenant of the land, other than the developer. ... A copy of
    the notice should be provided
confidence: medium
notes: From the council's list (published November 2024), pages 8, 51, 52 (sections 2.1, 4.1.1, 4.1.2).
  Sections 4.1.1-4.1.2 are the national requirements for prior approvals and prior notifications.
review-status: unverified
field-status: {}
