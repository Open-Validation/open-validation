validation-list:
  url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
  date: 2024-11-21
  date-basis: 'Cover: ''Validation Requirements for Planning Applications November 2024''; version control
    (page 3): ''November 2024 - 3.6.1 site specific FRAs'' after the October 2023 comprehensive update
    and the April and August 2024 BNG updates. The Word file was created and last modified on 21 November
    2024 (document properties; the server''s Last-Modified header is the same day). It is the list the
    council''s ''National and local validation requirements'' page links (''Download the Torbay Council
    Local Validation List November 2024''), checked 2026-11-06; the council''s site search and consultations
    page show no newer list or consultation, although the list says it must be reviewed every two years.
    The per-application-type checklists on the same page (2023 files) are used only for the application
    types of the national plan requirements. Page numbers in the requirement notes are pages of a PDF
    rendering of the Word file; the document''s own contents page is out of date.'
  status: current
submission-standards:
- item: No individual document greater than 5MB; large documents broken down into manageable files (e.g.
    chapters)
  level: should
- item: Electronic file names reflect the plan or document names
  level: should
- item: Drawings provided in PDF format and oriented so that they appear correctly on screen
  level: should
- item: Plans legible, with clear labels and legends and a clear distinction between existing features
    to be retained, features to be removed and proposed features
  level: should
- item: Plans show the proposal in context, including surrounding surface features and topography beyond
    the site boundary
  level: should
- item: Plans at an appropriate scale with a scale bar and calibration scale
  level: should
- item: Plans show all major dimensions, including distances from boundaries or key features
  level: should
- item: Plans show cardinal directions including a north point
  level: should
- item: Each plan has a unique drawing reference number and title, and a revision number when revised
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: false
  issues-open: 0
  notes: 'Grokbot links the superseded 2023 Torbay list instead of the November 2024 v3 list the council
    page now offers, and leaves it undated. The extraction covers only a fraction of the roughly 80 numbered
    local requirements: noise, contaminated land, the Wildlife & Geology Trigger Table, crime prevention,
    green infrastructure and the prior-approval section are among those missed. Several rows have the
    wrong application type (e.g. CIL under Householder) or text from a different item. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Devon, Plymouth and Torbay paused 7 Sep 2026 and WITHDRAWN
