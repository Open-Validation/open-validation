reference: viability-assessment
local-authority: TOB
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The applicant considers it unviable to provide the affordable housing set out in Local
        Plan policy H2.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant considers it unviable to provide the contributions set out in the Planning
        Contributions and Affordable Housing SPD and its Update.
  - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policies SS7, H2
source-text: For development where an applicant considers it is unviable to provide the affordable housing
  provision set out in Policy H2 of the Torbay Local Plan and/or contributions set out in the Planning
  Contributions and Affordable Housing SPD and its Update Or, Where viability is a key factor in the assessment
  of a proposed development.
must-include:
- item: An executive summary explaining in plain English the basis and conclusions of the assessment
  level: should
  source-text: The assessment should include an executive summary to explain in plain English the basis
    and conclusions of the assessment.
- item: 'Where parts are claimed to be confidential: why, with those parts clearly identified'
  level: must
  required-if: discretionary
  source-text: If you consider certain parts of the document should be confidential you must explain why
    and clearly identify which parts of the assessment you request are not made public prior to validation.
confidence: medium
notes: 'From the council''s list (published November 2024), page 20 (section 3.1.9). ''Where viability
  is a key factor in the assessment'' is a judgement, shown as discretionary. The council commissions
  an independent review at the applicant''s cost: the application is not validated until the applicant
  has agreed in writing to pay for it and has entered into a PPA or agreed in writing to an extended determination
  period. The assessment is published.'
review-status: unverified
field-status: {}
