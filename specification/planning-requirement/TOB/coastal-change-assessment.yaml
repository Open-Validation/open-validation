reference: coastal-change-assessment
local-authority: TOB
required-if:
  site:
    in:
    - coastal-erosion-zone
    description: Within a Coastal Change Management Area.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policy C3; NPPF
source-text: For all development within a Coastal Change Management Area.
must-include:
- item: Shows the development will be safe over its planned lifetime and will not have an unacceptable
    impact on coastal change
  level: must
  source-text: will be safe over its planned lifetime and will not have an unacceptable impact on coastal
    change
- item: Shows the development will not compromise the character of the coast
  level: must
- item: Shows the development provides wider sustainability benefits
  level: must
- item: Shows the development does not hinder the creation and maintenance of a continuous signed and
    managed route around the coast
  level: must
confidence: medium
notes: From the council's list (published November 2024), page 22 (section 3.1.15). The list calls it
  a Coastal Change Vulnerability Assessment (CCVA).
review-status: unverified
