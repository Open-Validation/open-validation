reference: flood-risk-assessment
local-authority: TOB
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - prior-approval
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Sites that are 1 ha or more in size.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Sites that are 1 ha or more in size.
  - site:
      in:
      - future-flood-risk
      description: Land identified in a strategic flood risk assessment as being at increased flood risk
        in future.
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Flood Zones 2 and 3, or an area susceptible to surface water flooding.
  - site:
      in:
      - critical-drainage-area
      description: Within the Critical Drainage Area (almost all of Torbay).
  - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policy ER1; NPPF
source-text: All applications for householder planning permission/full/outline/reserved matters planning
  permission/relevant demolition in a conservation area. Sites that are 1Ha or more in size. Land identified
  in a strategic flood risk assessment as being at increased flood risk in future; or land that may be
  subject to other sources of flooding, where its development would introduce a more vulnerable use. All
  development in Flood Zones 2 & 3 and/or as identified as being within an area susceptible to surface
  water flooding will require a site-specific flood risk assessment ... A Flood Risk Assessment is therefore
  required in these areas. ... Therefore, a Flood Risk Assessment will be required in most cases. ...
  Developments in Flood Zones 2 and 3, and in an area within Flood Zone 1 which has critical drainage
  problems or where the site area is 1ha or more Or, upon request of the Council
must-include:
- item: A surface water drainage strategy
  level: must
  source-text: 3.6.1 Flood Risk Assessment (including surface water drainage strategy)
- item: 'For householder development in Flood Zone 1: in most cases only the council''s short proforma'
  level: should
  required-if:
    application-type:
      in:
      - hh
  source-text: Householder development in Flood Zone 1 in most cases will only need to complete a short
    proforma
confidence: medium
notes: From the council's list (published November 2024), pages 36, 52, 57 (sections 3.6.1, 4.1.4, 4.2.15).
  Almost all of Torbay is in a Critical Drainage Area, and Maidencombe (outside it) has no mains drainage,
  so an FRA is needed for every householder, full, outline, reserved matters and relevant demolition in
  a conservation area application. Section 4.1.4 lists a Flood Risk Assessment for all prior approvals
  ('required in most cases'). Land that may be subject to other sources of flooding where development
  would introduce a more vulnerable use is a judgement, shown as discretionary. The listed building consent,
  advertisement and hedgerow checklists list an FRA as an additional requirement.
