reference: biodiversity-survey-report
local-authority: TOB
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The completed Wildlife & Geology Trigger Table shows a wildlife report is needed (protected
        species or habitats could be affected).
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: The Conservation of Habitats and Species Regulations 2010 (as amended); Torbay Local Plan policies
  SS8, NC1; NPPF
source-text: Where indicated as necessary from the completed Wildlife & Geology Trigger Table ... Where
  indicated as necessary from the completed Wildlife & Geology Trigger Table. Or, upon request of the
  Council
must-include:
- item: Carried out by a suitably qualified ecologist, proportionate to the potential impacts
  level: should
  source-text: This should be carried out by a suitably qualified ecologist and should be proportionate
    to the potential impacts.
- item: Up-to-date surveys that accord with best practice and local guidance
  level: must
  source-text: Surveys must be up-to-date and accord with best practice guidance/local guidance.
- item: Any further surveys identified as needed carried out before validation
  level: should
  source-text: Where the need for further survey works has been identified the surveys should take place
    prior to the validation of the planning application.
- item: Any detailed protected species surveys the report says are needed, included in the report
  level: must
  source-text: If the wildlife report indicates that detailed protected species surveys are required these
    must also be included as part of the wildlife report.
- item: All details of avoidance, mitigation, compensation and enhancement actions
  level: must
  source-text: All details of avoidance, mitigation, compensation and enhancement actions must be included
    with the application.
confidence: medium
notes: From the council's list (published November 2024), pages 25, 56 (sections 3.3.2, 4.2.14). The list
  calls it a Wildlife Report; it may include an Ecological Impact Assessment. The Wildlife & Geology Trigger
  Table that decides it (section 3.3.1, all applications) has no matching id (see the unmapped list).
  For prior approvals the list adds 'Or, upon request of the Council' (section 4.2), shown as discretionary.
review-status: unverified
field-status: {}
