reference: proposed-habitat-plan
local-authority: TOB
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Biodiversity Net Gain Planning
  Practice Guidance (paragraphs 9, 10 and 16); Devon Biodiversity Net Gain Guidance; Torbay Local Plan
  policies SS8, NC1; NPPF
source-text: All applications that would be subject to the general biodiversity net gain condition.
must-include:
- item: Draft on-site post-intervention proposed habitat plan, to scale
  level: must
  source-text: Draft on-site post-intervention proposed habitat plan
- item: All habitats referred to in the metric identified, so the size and location of habitat parcels
    can be understood
  level: should
- item: Draft off-site post-intervention proposed habitat plan, where off-site gain is proposed
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Biodiversity net gain is to be provided off site.
  source-text: Draft off-site post-intervention proposed habitat plan (if relevant)
confidence: medium
notes: From the council's list (published November 2024), page 29 (section 3.3.8). By law the rule is
  the biodiversity gain condition.
review-status: unverified
field-status: {}
