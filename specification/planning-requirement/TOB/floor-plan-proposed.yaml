reference: floor-plan-proposed
local-authority: TOB
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
        - advertising
        - demolition-con-area
        - extraction-oil-gas
    - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - any:
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: The development extends floor space.
      - condition:
          field: building-works
          value: true
          description: Alterations and/or extensions to existing buildings, including changes of use.
      - condition:
          field: new-build
          value: true
          description: A new dwelling or building is proposed.
      - condition:
          field: basement
          value: true
          description: The development proposed is below ground level.
      - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications (where relevant) ... Where development extends floor space. Where alterations
  and/or extensions to an existing building(s) are proposed, including changes of use. When new dwelling
  or building(s) are proposed. Where the development proposed is below ground level. Or, upon request
  of the Council
must-include:
- item: Proposed floor plans (e.g. 1:50 or 1:100)
  level: should
  source-text: existing and proposed floor plans (e.g. 1:50 or 1:100);
- item: 'For prior approvals: drawn to an identified scale'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: 4.2.2 Floor plan drawn to an identified scale
- item: 'For prior approvals: the use of each room and the position of windows, doors, walls and partitions'
  level: should
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: floor plans should show the uses of each room, position of windows, doors walls and petitions.
- item: 'For prior approvals: floor levels of the building(s) being constructed, altered or extended,
    in relation to the remainder of the building'
  level: should
  required-if:
    application-type:
      in:
      - prior-approval
confidence: medium
notes: From the council's list (published November 2024), pages 13, 54 (sections 2.7, 4.2.2). Application
  types are those whose checklist on the council's validation page lists this drawing (householder, outline
  or full major and minor, reserved matters, listed building consent, advertisement, relevant demolition
  in a conservation area, onshore oil and gas). Section 2.7 says 'All applications (where relevant)' and
  'Plans should include, as appropriate to the development being applied for', so the drawing shows as
  discretionary within these types. For prior approvals the list asks for 'Floor plan' (section 4.2.2),
  shown here on the proposed plan; 'Or, upon request of the Council' is shown as discretionary.
review-status: unverified
field-status: {}
