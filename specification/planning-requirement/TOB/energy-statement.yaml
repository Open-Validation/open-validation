reference: energy-statement
local-authority: TOB
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is not in accordance with a policy or policies in the adopted Local Plan
        or Neighbourhood Plan.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policies SS13, ES1, ES2; NPPF
source-text: Major development proposals, or proposals which are not in accordance with a policy or policies
  in the adopted Local Plan/Neighbourhood Plan
must-include:
- item: The passive and active measures taken to enhance the sustainability of the scheme, in particular
    to reduce greenhouse gas emissions and minimise impact on climate change
  level: must
  source-text: This should explain the passive and active measures that have been taken in the development
    proposals to enhance the sustainability of the scheme
confidence: medium
notes: From the council's list (published November 2024), page 37 (section 3.7.2).
review-status: unverified
field-status: {}
