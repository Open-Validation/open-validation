reference: arboriculturist-report
local-authority: TOB
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Sites with trees, or where trees are in close proximity to the site boundary.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policy C4
source-text: For development proposals on sites with trees, or where trees are in close proximity to the
  site boundary ... For development proposals which would impact on existing trees on site or those in
  close proximity to the site boundary Or, upon request of the Council
must-include:
- item: Tree survey, tree constraint plans and arboricultural impact assessment carried out in accordance
    with BS 5837:2012 (or any superseding standard)
  level: should
  source-text: Tree Surveys and Arboricultural Impact Assessments should be carried out in accordance
    with BS 5837:2012 or any superseding standard.
confidence: medium
notes: From the council's list (published November 2024), pages 33, 57 (sections 3.4.1, 4.2.17). The list
  calls it a Tree Survey, Tree Constraint Plans & Arboricultural Impact Assessment. The Tree Protection
  Plan & Arboricultural Method Statement (section 3.4.2) has no matching id (see the unmapped list). For
  prior approvals the list adds 'Or, upon request of the Council' (section 4.2), shown as discretionary.
review-status: unverified
field-status: {}
