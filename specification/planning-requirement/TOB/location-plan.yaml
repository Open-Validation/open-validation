reference: location-plan
local-authority: TOB
required-if:
  always: true
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications
must-include:
- item: Site outlined in red, including all land needed to carry out the development and access up to
    a public highway
  level: must
  source-text: The location plan must show the site outlined in red ... The red line should include all
    land necessary to carry out the proposed development, including access up to a public highway.
- item: Any adjoining land owned by the applicant outlined in blue
  level: must
  source-text: any adjoining land owned by the applicant outlined in blue.
- item: Drawn to a scale of 1:1250 or 1:2500
  level: should
- item: At least two named roads and a North marker
  level: should
- item: The site shown only as existing
  level: should
  source-text: Site location plans should only show sites as existing.
- item: 'For hedgerow removal notices: the location and length of the hedgerow(s) to be removed, drawn
    to an identified scale with the direction of North, and the location and details of any new hedge
    to be planted, hedge to be transplanted or enhanced management of retained hedges'
  level: should
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: This should show the location and length of hedgerow or hedgerows proposed to be removed
    drawn to an identified scale and showing the direction of North, along with location and details of
    any new hedge to be planted, or details of hedge to be transplanted, or enhanced management of retained
    hedges.
confidence: medium
notes: From the council's list (published November 2024), pages 9, 15 (sections 2.2, 2.9). The hedgerow
  location plan (section 2.9, 'All applications for hedgerow removal notice', Hedgerow Regulations 1997)
  is shown as part of the location plan.
review-status: unverified
field-status: {}
