reference: site-plan
local-authority: TOB
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - demolition-con-area
      - extraction-oil-gas
      - hedgerow-removal
  - application-type:
      in:
      - prior-approval
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: All applications (where relevant) ... 4.1.3 A plan indicating the site and showing the proposed
  development
must-include:
- item: Block plan of the site and existing and proposed site layout (e.g. 1:50 or 1:100)
  level: must
  source-text: block plan of the site (e.g. 1:50 or 1:100); ... existing and proposed site layout (e.g.
    1:50 or 1:100);
- item: 'For prior approvals: drawn to an identified scale and showing the direction of North'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: The plan should be drawn to an identified scale and show the direction of North.
- item: 'For prior approvals: the site outlined in red'
  level: should
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: Outlining the site in red will help to clearly identify the site
- item: 'For prior approvals including waste storage facilities: existing and proposed site plans showing
    the location of the proposed facilities, to an identified scale with the direction of North'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - any:
      - condition:
          field: waste-storage-facilities
          value: true
          description: The development includes provision of waste storage facilities.
      - discretionary
  source-text: 4.2.4 Existing and Proposed Site Plans showing the location of the proposed facilities
    drawn to an identified scale and showing the direction of North ... Where the development includes
    provision of waste storage facilities
confidence: medium
notes: From the council's list (published November 2024), pages 13, 52, 54 (sections 2.7, 4.1.3, 4.2.4).
  Application types are those whose checklist on the council's validation page lists this drawing (householder,
  outline or full major and minor, reserved matters, listed building consent, advertisement, relevant
  demolition in a conservation area, onshore oil and gas). The hedgerow removal checklist also lists existing
  and proposed site plans. For prior approvals (sections 4.1.3, 4.2.4) a plan of the site and proposed
  development is needed for all; the waste-storage site plans are also needed 'upon request of the Council'.
  Existing site and topographic surveys, finished floor and site levels and junction layouts (also in
  section 2.7) have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
