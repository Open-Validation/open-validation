policy: The Conservation of Habitats and Species Regulations 2010 (as amended); Torbay Local Plan policies
  SS8, NC1, DE3; NPPF
source-text: For development proposals that will alter light levels and have the potential to adversely
  affect the use or enjoyment of nearby buildings or open spaces, or adversely affect sensitive habitats
  or protected species, or adversely affect intrinsically dark landscapes ... For development proposals
  that will alter light levels and have the potential to adversely affect the use or enjoyment of nearby
  buildings or open spaces, or adversely affect sensitive habitats or protected species, or adversely
  affect intrinsically dark landscapes Or, upon request of the Council
confidence: medium
notes: From the council's list (published November 2024), pages 41, 56 (sections 3.10.1, 4.2.12). Whether
  the lighting could adversely affect nearby buildings or open spaces, sensitive habitats or protected
  species, or intrinsically dark landscapes is a judgement, so it shows as discretionary. It can be part
  of an Ecological Impact Assessment. To protect bats, external lighting should be 0.5 lux or less with
  shields, baffles or louvres. For prior approvals the list adds 'Or, upon request of the Council' (section
  4.2), shown as discretionary.
