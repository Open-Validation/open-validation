reference: town-centre-impact-assessment
local-authority: TOB
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail and main town centre uses outside of town centres.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Over 500 sq m gross floor space.
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: involves-change-of-use
        value: true
        description: A relevant change of use (prior approval).
    - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policy TC3; NPPF
source-text: Proposals for retail and main town centre uses over 500 sq m gross floor space outside of
  town centres ... Where a relevant change of use is proposed and the building is located outside a key
  shopping area (town centre, district centre or local centre) – only where there is a reasonable prospect
  of the building being used to provide Class E (specifically former Class A1 and A2 use) Where a relevant
  change of use is proposed and the building is located in a key shopping area (town centre, district
  centre or local centre) Where a relevant change of use is proposed and the building is located in an
  area that is important for providing storage or distribution services or industrial services or a mix
  of those services Or, upon request of the Council
must-include:
- item: A sequential test assessment
  level: must
  source-text: (including sequential test assessment)
- item: 'For prior approvals: where alternative Class E (former A1 and A2) services are in the area and,
    if relevant, why there is no reasonable prospect of the building being used to provide them'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: This should describe where alternative Class E (specifically former A1 and A2 services)
    are located in the area, and, if relevant, why there is no reasonable prospect of the building being
    used to provide these services.
confidence: medium
notes: From the council's list (published November 2024), pages 22, 54 (sections 3.1.12, 4.2.5). The list
  notes that the impact test relates to retail, office and leisure development not in accordance with
  an up-to-date Local Plan, while a sequential test must be carried out for all main town centre uses
  (the separate Sequential Test Assessment, section 3.1.11, has no matching id; see the unmapped list).
  For prior approvals (section 4.2.5) the impact assessment of the change of use depends on where the
  building is (in or outside a key shopping area, or in an area important for storage, distribution or
  industrial services) and can be asked for by the council, so it shows as discretionary.
review-status: unverified
field-status: {}
