reference: bng-metric
local-authority: TOB
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Biodiversity Net Gain Planning
  Practice Guidance (paragraphs 9, 10 and 16); Devon Biodiversity Net Gain Guidance; Torbay Local Plan
  policies SS8, NC1; NPPF
source-text: Applies from 12th February 2024 to all major development proposals and to minor development
  proposals from 2nd April 2024. ... All applications that would be subject to the general biodiversity
  net gain condition.
must-include:
- item: A statement as to whether the permission, if granted, would be subject to the biodiversity gain
    condition
  level: must
  source-text: A statement as to whether or not the planning permission, if granted, would be subject
    to the biodiversity gain condition.
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), with the completed metric calculation tool showing the calculations and the publication
    date and version of the metric used
  level: must
  source-text: the pre-development biodiversity value of the onsite habitat on the date of application
    (or an earlier date) including the completed metric calculation tool used
- item: The proposed earlier date and the reasons for it, where an earlier date is used
  level: must
  required-if: discretionary
  source-text: where the applicant wishes to use an earlier date, the proposed earlier date and the reasons
    for proposing that date;
- item: A statement on whether the onsite biodiversity value is lower because of activities ('degradation'),
    with supporting evidence if degradation has taken place
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: A report setting out how the development will achieve 10% Biodiversity Net Gain, with the Statutory
    Biodiversity Metric calculation for the baseline and post-development on-site habitats
  level: must
  source-text: 'A report clearly setting out how the development will achieve 10% Biodiversity Net Gain,
    including: ... The relevant Statutory Biodiversity Metric Calculation for the baseline and post-development
    on-site habitats;'
- item: A statement on whether any on-site BNG is 'significant', summarising how the biodiversity value
    will increase
  level: must
- item: How the biodiversity metric principles have been adhered to
  level: must
- item: An indicative timetable for habitat enhancement or creation
  level: must
- item: A commitment to provide a GIS layer of the habitats being enhanced, managed or created when final
    details are agreed at discharge of the BNG condition (where 'significant' onsite or offsite BNG is
    proposed)
  level: must
- item: Small Sites Statutory Metric completed by a competent person; full Statutory Biodiversity Metric
    completed by a suitably qualified ecologist
  level: must
  source-text: Where the Small Sites Statutory Metric is used, this must be completed by a competent person
    ... Where the full Statutory Biodiversity Metric is used, this must be completed by a suitably qualified
    ecologist.
- item: A section or appendix showing which onsite or offsite enhancements are net gains counted for BNG
    and which are mitigation or compensation required by HRA or other legislation, linked to the Ecological
    Impact Assessment and related documents (such as Bat Mitigation Strategies)
  level: must
  required-if: discretionary
  source-text: For applications where HRA or other legislative requirements stipulates that an application
    is also required to deliver mitigation and/or compensatory habitats for likely significant effects
    upon a protected site/species (these habitats cannot be counted towards your 10% BNG)
- item: A section or appendix detailing the considerations and calculations for irreplaceable habitat
    and bespoke compensation for its loss or deterioration (agreed case by case with the council)
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: The application land includes an irreplaceable habitat.
  source-text: Applications on land which includes an irreplaceable habitat.
confidence: medium
notes: From the council's list (published November 2024), pages 17, 27, 28 (sections 2.13, 3.3.5, 3.3.6,
  3.3.7). The list's national entry says BNG applies to all major development (from 12 February 2024)
  and minor development (from 2 April 2024), and its local entry to applications subject to the general
  biodiversity net gain condition; by law householder and other exempt applications are outside it, so
  the rule is the biodiversity gain condition. The HRA mitigation section (3.3.6) applies where HRA or
  other legislation requires mitigation or compensatory habitats, which is shown as discretionary. The
  Devon Biodiversity Net Gain Statement (3.3.4), management and monitoring plan (3.3.9), phasing report
  (3.3.10), information to discharge the BNG condition (3.3.11-3.3.12) and exemption evidence (3.3.13)
  have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
