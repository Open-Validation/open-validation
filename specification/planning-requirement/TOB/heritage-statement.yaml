reference: heritage-statement
local-authority: TOB
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      description: The development or works will affect a heritage asset or its setting, such as a conservation
        area, listed building, scheduled monument or historic park and garden.
  - application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
  - discretionary
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Torbay Local Plan policies HE1, HE2; NPPF
source-text: Where the development/works will affect a heritage asset or its setting, such as a conservation
  area, listed building, scheduled monument or historic park and garden ... Where the development will
  affect the setting of a heritage asset, such as a conservation area, listed building, scheduled monument
  or historic park and garden Or, upon request of the Council
must-include:
- item: The council's Statement of Heritage Significance template, completed in full and as accurately
    as possible
  level: should
  source-text: It is expected that this template be completed in full and as accurately as possible.
confidence: medium
notes: From the council's list (published November 2024), pages 23, 58 (sections 3.2.1, 4.2.19). The list
  calls it a Statement of Heritage Significance. 'Such as' means other heritage assets count too, so that
  part shows as discretionary. The listed building consent and listed building lawful development certificate
  checklists list it for every such application. A further heritage impact assessment may be needed for
  particularly complex or sensitive proposals. For prior approvals the list adds 'Or, upon request of
  the Council' (section 4.2), shown as discretionary.
review-status: unverified
field-status: {}
