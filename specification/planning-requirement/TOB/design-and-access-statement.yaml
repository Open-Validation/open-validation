reference: design-and-access-statement
local-authority: TOB
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Within a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floorspace of 100 square metres or more.
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - park-and-garden
      - scheduled-monument
      description: Development or works to, or within the curtilage of, a listed building, a Registered
        Park & Garden or a Scheduled Monument.
source-url: https://www.torbay.gov.uk/media/21130/local-validation-list-nov24-website-version-v3.docx
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Torbay Local Plan policies HE1, HE2, SS10, DE1
source-text: 'Applications for: - development within a conservation area or World Heritage Site consisting
  of 1 or more dwellings or floorspace of more than 100m2 or more; - major development However, the following
  applications are exempt from this requirement: waste development; engineering or mining operations;
  a material change of use; and amendments to conditions. ... In addition to applications where a D&A
  Statement is a national requirement, the following developments will also require a Design and Access
  Statement: development or works to, or within the curtilage of, a listed building, a Registered Park
  & Garden or a Scheduled Monument'
must-include:
- item: Explains the design principles and concepts applied to the development and how issues relating
    to access to the development have been dealt with
  level: must
  source-text: The Design and Access Statement (DAS) must explain the design principles and concepts that
    have been applied to the development and explain how issues relating to access to the development
    have been dealt with.
- item: Explains how the design responds to its context and the needs of the development or works
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        - park-and-garden
        - scheduled-monument
        description: Works to or in the curtilage of a listed building, Registered Park & Garden or Scheduled
          Monument.
  source-text: explain how the design responds to its context and the needs of the development or works.
- item: A Crime Prevention Statement on how 'Crime Prevention Through Environmental Design' principles
    are incorporated, where appropriate
  level: should
  required-if: discretionary
  source-text: The statement should include a Crime Prevention Statement where appropriate
confidence: medium
notes: From the council's list (published November 2024), pages 10, 24 (sections 2.4, 3.2.5). The list
  exempts waste development, engineering or mining operations, a material change of use and amendments
  to conditions from the national requirement. The list's wording 'floorspace of more than 100m2 or more'
  is read as the DMPO's 100 square metres or more. The list recommends structuring the statement around
  Local Plan policy DE1 (and Building for a Healthy Life for major housing).
review-status: unverified
field-status: {}
