reference: design-and-access-statement
local-authority: TOB
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - park-and-garden
      - scheduled-monument
      description: Development or works to, or within the curtilage of, a listed building, a Registered
        Park & Garden or a Scheduled Monument.
source-url: https://www.torbay.gov.uk/media/20032/local-validation-list-2023.docx
source-text: '3.2.5 Design and Access Statement In addition to applications where a D&A Statement is a
  national requirement, the following developments will also require a Design and Access Statement: development
  or works to, or within the curtilage of, a listed building, a Registered Park & Garden or a Scheduled
  Monument'
confidence: medium
notes: The council's list keeps the national requirement and adds the heritage cases; the national branch
  is shown as major development and listed building consent (other national cases, such as conservation
  areas, still apply). Not limited to listed building consent.
