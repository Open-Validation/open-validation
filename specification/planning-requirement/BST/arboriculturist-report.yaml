reference: arboriculturist-report
local-authority: BST
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: There are trees within the site, or on adjacent land (including neighbouring gardens
      and street trees), that could influence or be affected by the development.
source-url: https://www.bristol.gov.uk/files/documents/10-planning-applications-local-list-of-requirements/file
source-text: An arboricultural report (see Table 2) must be submitted where there are trees within a proposed
  application site, or on land adjacent to an application site (including trees in neighbouring gardens
  and street trees), that could influence or be affected by the development, including works such as site
  access, service routes and site compounds.
must-include:
- item: An Arboricultural Method Statement where works are needed within the Root Protection Areas (BS5837:2012)
    of retained trees, or where retained trees cannot be protected by standard physical means such as
    fencing and/or ground protection
  level: must
  source-text: 'An Arboricultural Method Statement where works are needed within the Root Protection Areas
    (see BS5837: 2012) of retained trees or where retained trees cannot be protected by standard physical
    means such as fencing and/or ground protection.'
confidence: medium
notes: 'Audit (missing_requirement): applies to householder applications too. The Arboricultural Method
  Statement text was in the workbook''s ''Schedule of works'' row.'
review-status: unverified
field-status: {}
