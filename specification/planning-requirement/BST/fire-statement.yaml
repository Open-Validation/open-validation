reference: fire-statement
local-authority: BST
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.bristol.gov.uk/files/documents/10-planning-applications-local-list-of-requirements/file
confidence: medium
notes: 'From the audit (missing_requirement): Part 1 item 14 Fire Statement, as required by the DMPO 2015
  (as amended); the rule is the DMPO''s relevant-building test.'
review-status: unverified
field-status: {}
