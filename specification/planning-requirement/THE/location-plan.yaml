reference: location-plan
local-authority: THE
required-if:
  always: true
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A plan which identifies the land to which the application relates drawn to an identified
  scale and showing the direction of north (at a scale of 1:1250 or 1:2500). Application site (including
  access) to be outlined in red, any other land in which the applicant has an interest outlined in blue.
must-include:
- item: Drawn to an identified scale (1:1250 or 1:2500) and showing the direction of north
  level: must
- item: Application site, including access, outlined in red, including all land necessary to carry out
    the development (e.g. access from a public highway, visibility splays, landscaping, car parking and
    open areas around buildings)
  level: must
- item: Any other land in which the applicant has an interest (owned close to or adjoining the site) outlined
    in blue
  level: must
- item: Its relation to surrounding buildings, including all adjoining neighbours, and enough roads and/or
    buildings on adjoining land to make the exact location clear (where the nearest side road is some
    distance away, its position with an approximate distance)
  level: must
  source-text: Please provide a site location plan showing the boundary of the site including access marked
    in red, and its relation to surrounding buildings including all adjoining neighbours and sufficient
    roads and/or buildings on land adjoining the site to ensure that the exact location is clear. It should
    normally be at a scale of 1:1250 or 1:12500. Where the nearest side road is some distance away, it
    will be acceptable to indicate where it is with an approximate distance from the site.
- item: A unique drawing reference number, north arrow and linear scale bar
  level: should
  source-text: The plan should include a unique drawing reference number, north arrow and linear scale
    bar.
confidence: medium
notes: From the council's list (adopted August 2024), pages 4 and 5. Part A item 2 and Part B item 2 (which
  gives the scale as '1:1250 or 1:12500', apparently a typing slip for 1:2500). The Part C matrix (pages
  18-19) marks it 'Required' for every type of application.
