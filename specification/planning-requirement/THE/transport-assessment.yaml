reference: transport-assessment
local-authority: THE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: Residential in excess of 50 units (a Transport Assessment above 80).
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 800
      description: Non-food retail of more than 800 sq m GFA (a Transport Assessment above 1,500).
  - condition:
      field: office-floorspace
      operator: '>'
      value: 1500
      description: Offices of more than 1,500 sq m GFA (a Transport Assessment above 2,500).
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 2500
      description: General industrial (B2) of more than 2,500 sq m GFA (a Transport Assessment above 4,000).
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 3000
      description: Warehousing (B8) of more than 3,000 sq m GFA (a Transport Assessment above 5,000).
  - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: 'As set out in the NPPF, all developments that generate significant amounts of movement should
  be supported by a Transport Statement or Transport Assessment to allow an assessment as to whether the
  effects of a proposal on the transport system are acceptable, and to consider the traffic and road safety
  implications of development. ... A Transport Statement will generally be required for the following
  development proposals: • Residential in excess of 50 units and less than 80 units • Non-food retail
  of more than 800m2 and less than 1,500m2 Gross Floor Area (GFA) • Offices (Class B1) of more than 1500m2
  and less than 2,500m2 GFA • General industrial development (Class B2) of more than 2,500m2 and less
  than 4,000m2 GFA • Warehousing (Class B8) of more than 3,000m2 and less than 5,000m2 GFA Where a Transport
  Statement is required, Hertfordshire County Council may require an agreed Travel Plan Statement with
  clearly defined targets and monitoring proposals. A Transport Assessment is required where a development
  has more significant transport implications and will generally be required for the following development
  proposals: • Residential in excess of 80 units • Non-food retail in excess of 1,500m2 Gross Floor Area
  (GFA) • Offices (Class B1) in excess of 2500m2 GFA • General industrial development (Class B2) in excess
  of 4,000m2 GFA • Warehousing (Class B8) in excess of 5,000m2 GFA'
must-include:
- item: A Transport Statement for residential of 50-80 units, non-food retail of 800-1,500 sq m, offices
    of 1,500-2,500 sq m, B2 of 2,500-4,000 sq m or B8 of 3,000-5,000 sq m; a Transport Assessment above
    those
  level: must
- item: 'A Transport Assessment covers: non-technical summary; existing conditions; proposed development;
    assessment years/analysis period; development trip generation; environmental impact issues; promoting
    smarter choices via travel plans; transport impacts and mitigation measures'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: Residential in excess of 80 units.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 1500
        description: Non-food retail in excess of 1,500 sq m GFA.
    - condition:
        field: office-floorspace
        operator: '>'
        value: 2500
        description: Offices in excess of 2,500 sq m GFA.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 4000
        description: General industrial (B2) in excess of 4,000 sq m GFA.
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 5000
        description: Warehousing (B8) in excess of 5,000 sq m GFA.
confidence: medium
notes: From the council's list (adopted August 2024), pages 10-11. Part B item 11. The list says the thresholds
  'are for guidance purposes only and should not be read as absolutes', so the file adds discretionary
  for smaller or larger schemes. The Part C matrix (pages 18-19) marks the Transport Statement and Transport
  Assessment 'required in some circumstances' for new residential development of 10 or more dwellings
  and new commercial development over 1,000 sq m. Submitted information is assessed by Hertfordshire County
  Council.
