reference: landscaping-plan
local-authority: THE
required-if:
  any:
  - all:
    - ref: major-development
    - site:
        in:
        - neighbourhood-plan-area
        description: In the Chorleywood Neighbourhood Development Plan area.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Three Rivers Development Management Policies LDD (July 2013) policy DM6; Chorleywood Neighbourhood
  Development Plan 2020-2035
source-text: Where applicable a hard and soft landscaping scheme should be submitted, in accordance with
  Policy DM6 of the Development Management Policies LDD. ... The Chorleywood Neighbourhood Development
  Plan also requests that for all major applications a proportionate landscape strategy shall be submitted
must-include:
- item: Justification for the scheme
  level: must
- item: Identification of land in private and/or public spaces and its relationship to the surrounding
    area
  level: must
- item: Schedule of planting and details of proposed hard landscaping and materials, including the visual
    appearance of elements
  level: must
- item: Details of boundary treatments, including position, height, design and materials
  level: must
- item: Permeability of hard paving and provision for water run-off; no peat in planting mediums; native
    species where appropriate; recycled materials and sustainably sourced wood products
  level: should
- item: Long term maintenance plans where communal land (not to be adopted by the Council) must be maintained
  level: should
- item: 'Chorleywood major applications, where necessary: existing and proposed hard and soft landscaping;
    a condition survey of existing trees and hedgerows; measures to protect them during construction;
    near and distant views from principal public vantage points, now and after 10 years; management of
    areas retained for open space and/or woodland'
  level: must
  required-if:
    all:
    - ref: major-development
    - site:
        in:
        - neighbourhood-plan-area
        description: In the Chorleywood Neighbourhood Development Plan area.
confidence: medium
notes: From the council's list (adopted August 2024), pages 10-10. Part B item 10. 'Where applicable'
  has no trigger, so it shows as discretionary, except that the Chorleywood Neighbourhood Development
  Plan asks for a landscape strategy with all major applications in its area. The Part C matrix (pages
  18-19) marks landscaping 'required in some circumstances' for householder, full and outline applications.
review-status: unverified
field-status: {}
