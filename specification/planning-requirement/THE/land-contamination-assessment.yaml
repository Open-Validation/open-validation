reference: land-contamination-assessment
local-authority: THE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - contaminated-land
        description: The site has, or is suspected to have, contamination.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable.
    - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: A preliminary risk assessment may be required on sites which have or are suspected to have
  contamination, or which are proposing a potentially contaminating development in a sensitive area. Sufficient
  information should be submitted to determine the existence or otherwise of contamination, its nature
  and the risks it may pose and whether these can be satisfactorily reduced to an acceptable level. Where
  contamination is known or suspected or the proposed use would be particularly vulnerable, the applicant
  should provide such information with the application as is necessary to determine whether the proposed
  development can proceed.
must-include:
- item: Enough information to determine the existence or otherwise of contamination, its nature, the risks
    it may pose and whether these can be satisfactorily reduced to an acceptable level
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 13. Part B item 13. A potentially contaminating
  development in a sensitive area 'may' need one, shown as discretionary. The Part C matrix (pages 18-19)
  marks it 'required in some circumstances' for householder, full and outline applications.
review-status: unverified
field-status: {}
