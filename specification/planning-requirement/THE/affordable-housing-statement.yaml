reference: affordable-housing-statement
local-authority: THE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is to be provided on-site.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Three Rivers Core Strategy (October 2011) policy CP4; Affordable Housing SPD
source-text: An Affordable Housing Statement is required for development where affordable housing is to
  be provided on-site. Such Statements must detail how the affordable housing requirements set out in
  Policy CP4 of the adopted Core Strategy and the Affordable Housing SPD are to be met.
must-include:
- item: Plans of the layout clearly indicating the location of the market and affordable housing
  level: must
- item: 'Details of both the affordable and market housing: number of units, location, mix and type of
    accommodation, bedroom sizes and floorspace, and location of the different affordable tenures'
  level: must
- item: The design standards of both the affordable and market housing
  level: must
- item: Details of any Registered Providers acting as partners in the development
  level: must
- item: 'For outline applications: indicative details of affordable housing'
  level: must
  required-if:
    application-type:
      in:
      - outline
confidence: medium
notes: From the council's list (adopted August 2024), pages 8-9. Part B item 7. Policy CP4 seeks 45% affordable
  housing on all developments with a net gain of one or more dwellings (Part B item 6). The Part C matrix
  (pages 18-19) marks the statement 'required in some circumstances' for new residential development,
  changes of use and conversions, and 'Affordable housing provision' 'Required' for all new residential
  development.
review-status: unverified
field-status: {}
