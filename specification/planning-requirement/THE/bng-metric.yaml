reference: bng-metric
local-authority: THE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.threerivers.gov.uk/services/planning/planning-applications
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: 'Where development would be subject to the general biodiversity gain condition , the application
  must be accompanied by minimum information set out in Article 7 of The Town and Country Planning (Development
  Management Procedure) (England) Order 2015:'
must-include:
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), including the completed metric calculation tool showing the calculations, and the publication
    date and version of the biodiversity metric used
  level: must
- item: 'Where degradation has taken place: the value immediately before the activities, and supporting
    evidence'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Activities before the application date reduced onsite biodiversity value.
confidence: medium
notes: 'From the council''s list (adopted August 2024), page 4. Part A item 6 (page 4) says ''BNG applies
  to most development'' and links to the ''Biodiversity Net Gain (BNG): Validation requirements'' section
  of the council''s planning applications page (undated), quoted here. The file follows the law: it applies
  only where the biodiversity gain condition applies (householder and other exempt applications are exempt,
  and the page says those applicants give a statement of the exemption instead).'
review-status: unverified
field-status: {}
