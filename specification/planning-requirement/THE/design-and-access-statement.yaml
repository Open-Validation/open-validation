reference: design-and-access-statement
local-authority: THE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) where the floorspace to be created is 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement for: - all major developments, as defined in article 2 of
  the Town and Country Planning (Development Management Procedure (England) Order 2015; - applications
  within Conservation Areas which comprise provision of one or more dwellings or building(s) where the
  floorspace to be created is 100m2 or more - Listed Building Consent (Listed Building Consent applications
  should also include a Heritage Statement) Details of what to include in a Design and Access Statement
  are set out in the validation requirements in the NPPG.'
confidence: medium
notes: From the council's list (adopted August 2024), page 4. The Part C matrix (pages 18-19) marks it
  'Required' for new residential development of 10 or more dwellings, new commercial development over
  1,000 sq m and listed building consent, and 'in some circumstances' for smaller new-build and outline
  applications, which matches the national rule.
review-status: unverified
field-status: {}
