source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed plans: Existing elevations and floorplans are required where applicable,
  at a scale of 1:50 or 1:100. This is particularly important for sites within the Green Belt. Proposed
  elevations and floorplans are required, as well as a roof plan, site sections and finished floor and
  site levels where relevant.'
must-include:
- item: Site sections with finished floor and site levels, at a scale of 1:50 or 1:100
  level: must
confidence: medium
notes: 'From the council''s list (adopted August 2024), page 5. Part B item 3: ''site sections and finished
  floor and site levels where relevant'', so it shows as discretionary. The Part C matrix (pages 18-19)
  marks site sections ''required in some circumstances'' for householder, new-build full and outline applications.'
