reference: sustainability-statement
local-authority: THE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development of one unit and above.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: All new commercial development.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: new residential development of one unit and above
must-include:
- item: A CPLAN Energy Statement and Sustainability Checklist
  level: must
  source-text: a CPLAN Energy Statement and Sustainability Checklist in order to demonstrate the extent
    to which sustainability principles have been incorporated into the location, design, construction
    and future use of proposals, and the expected carbon emissions.
