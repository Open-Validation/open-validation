source-text: This list is not exhaustive and applications for major development are likely to require
  additional supporting information in the form of submissions such as a Planning Statement and Statement
  of Community Involvement. Also, certain applications may require further specialist assessments such
  as a Retail Impact Assessment, Economic Assessment, Air Quality Assessment (including an Odour Assessment)
  or Open Space Assessment to be submitted.
