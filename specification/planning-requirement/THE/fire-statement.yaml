reference: fire-statement
local-authority: THE
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Fire Statement is required for planning permission for development which includes ‘a relevant
  building’, defined as: - Contains two or more dwellings or educational accommodation and - Meet the
  height condition: 18m or more in height, or 7 or more storeys Fire Statements are also required for:
  - The provision of one or more relevant buildings, or - Development of an existing relevant building
  - Or development within the curtilage of a relevant building'
must-include:
- item: On the prescribed form
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 17. Part B item 20. Covers the provision of
  a relevant building, development of an existing one, or development within its curtilage; 'Exemptions
  also apply.'
review-status: unverified
field-status: {}
