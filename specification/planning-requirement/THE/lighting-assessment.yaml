reference: lighting-assessment
local-authority: THE
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: Proposals involving the provision of publicly accessible developments in the vicinity of
  residential property, a Listed Building or a Conservation Area or open countryside where external lighting
  would be provided or made necessary by the development, are required to be accompanied by a Lighting
  Impact Assessment prepared by a lighting specialist. This must include details of any external lighting,
  the proposed hours when the lighting would be switched on, a layout plan with beam orientation and a
  schedule of equipment.
must-include:
- item: Prepared by a lighting specialist
  level: must
- item: Details of any external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule of equipment
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 13. Part B item 14. 'Publicly accessible developments
  in the vicinity of residential property ... or open countryside' has no distance, so that part shows
  as discretionary. The Part C matrix (pages 18-19) marks it 'required in some circumstances' for new
  residential and commercial development and advertisement consent.
review-status: unverified
field-status: {}
