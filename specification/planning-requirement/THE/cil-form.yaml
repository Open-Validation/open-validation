reference: cil-form
local-authority: THE
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - s73
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended); Three Rivers CIL Charging Schedule
  (adopted 24 February 2015)
source-text: 'As such the following CIL Determining whether a Development may be CIL Liable Planning Application
  Additional Information Requirement form must be submitted with ALL planning applications: CIL Additional
  Questions Form (Form 1)'
must-include:
- item: Existing and proposed floorspace calculations (sq m) for each use
  level: must
  required-if:
    condition:
      field: cil-liable
      value: true
      description: The applicant considers the development would be CIL liable.
  source-text: If you consider that your development would be CIL liable you must also provide existing
    and proposed floorspace calculations (sqm) for each use.
- item: CIL Form 1 - Assumption of liability, or a claim for relief or exemption (including self-build
    exemption)
  level: must
  required-if:
    condition:
      field: cil-liable
      value: true
      description: The applicant considers the development would be CIL liable.
  source-text: 'If you consider that your development would be CIL liable you must assume the liability
    for the payment of CIL, or to claim for relief or exemption, including self-build exemption. The following
    form must be submitted with your application: CIL form 1 - Assumption of liability'
- item: Self-build exemption claim form (Form 9 for domestic extensions, Form 8 for annexes, Form 7 part
    1 for new dwellings) where self-build exemption is claimed
  level: should
  required-if:
    condition:
      field: cil-relief-claimed
      value: true
      description: Self-build exemption is claimed.
confidence: medium
notes: From the council's list (adopted August 2024), pages 5-6. Part B item 5. The CIL Additional Questions
  Form 'must be submitted with ALL planning applications'; lawful development certificate applications
  instead need a Notice of Chargeable Development. The Part C matrix (pages 18-19) marks it 'Required'
  for householder and full applications (for changes of use and conversions 'where building no longer
  in lawful use').
review-status: unverified
field-status: {}
