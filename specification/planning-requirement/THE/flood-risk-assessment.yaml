reference: flood-risk-assessment
local-authority: THE
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more (in Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more (in Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - all:
    - site:
        in:
        - conservation-area
        description: In the Moor Park Conservation Area.
    - condition:
        field: basement
        value: true
        description: The application includes a basement.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Moor Park Conservation Area Appraisal (2006)
source-text: A FRA is required for development proposals of 1 hectare or greater in Flood Zone 1 and for
  proposals for new development located in Flood Zones 2 and 3 as designated by the Environment Agency.
  The Moor Park Conservation Area Appraisal (2006) requires an FRA with any application that includes
  provision of a basement. The FRA should detail the effects of the proposals on any existing underground
  water courses.
must-include:
- item: The effects of the proposals on any existing underground water courses
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In the Moor Park Conservation Area.
    - condition:
        field: basement
        value: true
        description: The application includes a basement.
confidence: medium
notes: From the council's list (adopted August 2024), page 16. Part B item 18. The Part C matrix (pages
  18-19) marks it 'required in most circumstances' for householder and new-build full applications and
  'in some circumstances' for changes of use, conversions and outline; the triggers are the Part B text's.
review-status: unverified
field-status: {}
