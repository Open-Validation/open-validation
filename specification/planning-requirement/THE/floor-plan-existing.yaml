reference: floor-plan-existing
local-authority: THE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - ldc
      - lbc
      - outline
  - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed plans: Existing elevations and floorplans are required where applicable,
  at a scale of 1:50 or 1:100. This is particularly important for sites within the Green Belt. Proposed
  elevations and floorplans are required, as well as a roof plan, site sections and finished floor and
  site levels where relevant.'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 5. Existing floor plans 'where applicable',
  so they show as discretionary. The Part C matrix (pages 18-19) marks floor plans 'required in most circumstances'
  for householder, full, lawful development certificate and listed building consent applications and 'in
  some circumstances' for outline. Not marked for advertisement consent.
