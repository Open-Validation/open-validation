reference: biodiversity-survey-report
local-authority: THE
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: Likely to affect internationally or nationally designated sites, non-statutory designated
        sites or priority habitats.
  - condition:
      field: protected-species
      value: true
      description: Likely to affect European or nationally protected species, priority species or significant
        populations of national or local red list or notable species.
  - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Natural Environment and Rural Communities Act 2006; NPPF
source-text: 'Information provided by professional ecologists should be submitted with an application
  when it is likely to affect: • Internationally and nationally designated sites • European and nationally
  protected species • Non-statutory designated sites • Priority habitats and species • Non-priority habitats
  impacted by major development and • Significant populations of national or local red list or notable
  species These habitat resources and protected species are outlined within the Biodiversity Checklist
  in Part D which must be submitted with applications. Statutory Sites and non-statutory Wildlife Sites
  are highlighted in the development plan. Where the biodiversity checklist indicates a need for further
  surveys, these should also be submitted with the application.'
must-include:
- item: Provided by professional ecologists
  level: must
- item: 'Where a European Protected Species may be affected: information to take impacts and recommendations
    into account, and answers to the 3 licence tests if a European Protected Species Mitigation Licence
    is required'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: A European Protected Species may be affected.
confidence: medium
notes: From the council's list (adopted August 2024), pages 12-13. Part B item 12. Non-priority habitats
  impacted by major development, and further surveys that the Part D biodiversity checklist shows are
  needed, are judgements and show as discretionary. The Part C matrix (pages 18-19) marks 'Biodiversity
  Checklist and any surveys required' 'Required' for householder, full and outline applications.
review-status: unverified
field-status: {}
