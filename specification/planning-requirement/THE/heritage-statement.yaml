reference: heritage-statement
local-authority: THE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      - archaeological-priority-area
      - historic-environment-record
      description: 'The application is for, or could affect, a heritage asset or its setting: works to
        a listed building, in or next to a conservation area or listed building, or in an Area of Archaeological
        Significance.'
  - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: NPPF
source-text: Applications for, or that could impact upon, a heritage asset or its setting should be accompanied
  by a Desk-Based Assessment or a Heritage Statement. Paragraph 200 of the NPPF states that where a site
  on which development is proposed includes or has the potential to include heritage assets with archaeological
  interest, Local Planning Authorities should require developers to submit an appropriate Desk-Based Assessment
  and, where necessary, a field evaluation. Development in this context includes but is not limited to;
  any works which require Listed Building Consent, works requiring planning permission within a Conservation
  Area, development adjacent to a Listed Building or Conservation Area and development in an Area of Archaeological
  Significance.
must-include:
- item: An assessment/description of the significance of the heritage asset(s) which may be affected,
    including the contribution of their setting to that significance
  level: must
- item: The works proposed, and the principles behind and justification for the proposed development
  level: must
- item: The expected impact of the proposed works on the heritage asset and its setting
  level: must
- item: The steps taken to avoid or minimise any identified impacts
  level: must
- item: Detail proportionate to the importance of the heritage asset and the works; for significant large
    scale work to a listed building, a detailed statement by a suitably qualified professional
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), pages 14-15. Part B item 17. 'Could impact upon'
  is a judgement, so discretionary is kept alongside the listed assets. The Part C matrix (pages 18-19)
  marks it 'Required' for listed building consent and 'required in some circumstances' for householder,
  full and outline applications. Part A also says listed building consent applications should include
  a heritage statement.
