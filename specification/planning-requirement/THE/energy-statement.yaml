reference: energy-statement
local-authority: THE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development of one unit and above.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New commercial development.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Three Rivers Core Strategy (October 2011) policy CP1; Three Rivers Development Management Policies
  LDD (July 2013) policy DM4
source-text: Policy CP1 of the adopted Core Strategy requires all applications for new residential development
  of one unit and above and all new commercial development to be accompanied by a CPLAN Energy Statement
  and Sustainability Checklist in order to demonstrate the extent to which sustainability principles have
  been incorporated into the location, design, construction and future use of proposals, and the expected
  carbon emissions.
must-include:
- item: 'Shows how the proposal meets Policy DM4: at least 5% less carbon dioxide emissions than Building
    Regulations Part L (2013), having regard to feasibility and viability'
  level: must
  source-text: applicants cannot submit a CPLAN Energy and Sustainability Statement but should submit
    an Energy Statement demonstrating the extent to which relevant proposals meet the requirements of
    Policy DM4 of the Development Management Policies document.
- item: 'For building conversions: an overall improvement in the energy performance of the building'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Building conversion.
confidence: medium
notes: 'From the council''s list (adopted August 2024), pages 9-9. Part B item 8. The CPLAN Sustainability
  Checklist is no longer available, so only an Energy Statement is asked for. The Part C matrix (pages
  18-19) marks it ''Required'' for replacement dwellings and new residential and commercial development,
  ''required in most circumstances'' for changes of use and conversions and ''in some circumstances''
  for outline (those show as discretionary). The council''s planning applications page words it differently:
  ''all new residential units (including conversions)'' and ''non-residential development (including change
  of use, conversions and extensions) with a floor area over 500 metres squared''.'
review-status: unverified
field-status: {}
