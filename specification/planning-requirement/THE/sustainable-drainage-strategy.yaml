reference: sustainable-drainage-strategy
local-authority: THE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Developments of 10 dwellings or more.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial development.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Flood and Water Management Act 2010
source-text: With regard to surface water drainage, the Flood and Water Management Act (2010) introduced
  the requirement for Sustainable Drainage Systems (SuDs) in new developments. The Government’s Ministerial
  Statement of 18 December 2014 requires that all developments of 10 dwellings or more and all major commercial
  developments must incorporate SuDs, details of which must be submitted at the planning application stage.
confidence: medium
notes: From the council's list (adopted August 2024), page 16. Part B item 19; the matrix calls it 'Sustainable
  Drainage Systems Details' and marks it 'Required' for new residential development of 10 or more dwellings
  and new commercial development over 1,000 sq m. Hertfordshire County Council is the Lead Local Flood
  Authority.
