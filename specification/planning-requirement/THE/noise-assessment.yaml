reference: noise-assessment
local-authority: THE
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal raises issues of noise and/or disturbance to the occupants of nearby buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive development, e.g. housing close to railway lines.
  - condition:
      field: plant-equipment
      value: true
      description: Plant such as air conditioning systems, ground and air source heat pumps, swimming
        pool pumps and extraction systems.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: 'Proposals that raise issues of noise and / or disturbance to the occupants of nearby buildings,
  and for developments that are considered to be noise sensitive, e.g. residential developments in close
  proximity to railway lines, must be supported by a Noise Impact Assessment prepared by a suitably qualified
  acoustician. Application proposals which include plant such as air conditioning systems, ground and
  air source heat pumps, swimming pool pumps and extraction systems must be accompanied by: - A plan showing
  the location of the unit in relation to the closest residential property - Data relating to the noise
  level, in octave bands, at 1 metre from the unit'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: A plan showing the location of the unit in relation to the closest residential property
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Plant such as air conditioning systems, ground and air source heat pumps, swimming
        pool pumps and extraction systems.
- item: Data relating to the noise level, in octave bands, at 1 metre from the unit
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Plant such as air conditioning systems, ground and air source heat pumps, swimming
        pool pumps and extraction systems.
confidence: medium
notes: From the council's list (adopted August 2024), pages 13-14. Part B item 15. The Part C matrix (pages
  18-19) marks it 'required in some circumstances' for new residential and commercial development, changes
