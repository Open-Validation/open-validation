notes: 'From the council''s list (adopted August 2024), page 5. Part B item 3: ''a roof plan ... where
  relevant'', so it shows as discretionary. The Part C matrix (pages 18-19) marks the roof plan ''required
  in most circumstances'' for replacement dwellings and new residential and commercial development, and
  ''in some circumstances'' for householder and outline applications.'
