policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed plans: Existing elevations and floorplans are required where applicable,
  at a scale of 1:50 or 1:100. This is particularly important for sites within the Green Belt. Proposed
  elevations and floorplans are required, as well as a roof plan, site sections and finished floor and
  site levels where relevant.'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
