reference: travel-plan
local-authority: THE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: Residential in excess of 80 units.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 1500
      description: Non-food retail in excess of 1,500 sq m GFA.
  - condition:
      field: office-floorspace
      operator: '>'
      value: 2500
      description: Offices in excess of 2,500 sq m GFA.
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 4000
      description: General industrial (B2) in excess of 4,000 sq m GFA.
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 5000
      description: Warehousing (B8) in excess of 5,000 sq m GFA.
  - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: In addition, developments generating a significant amount of movement should provide a Travel
  Plan. ... Where a Transport Assessment is required, Hertfordshire County Council will require an agreed
  Travel Plan with clearly defined targets and monitoring proposals.
must-include:
- item: Clearly defined targets and monitoring proposals
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), pages 10-11. Part B item 11. A Travel Plan goes
  with a Transport Assessment (the thresholds above); with a Transport Statement the county 'may require
  an agreed Travel Plan Statement', shown as discretionary.
review-status: unverified
field-status: {}
