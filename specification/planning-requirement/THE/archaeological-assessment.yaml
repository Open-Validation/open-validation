reference: archaeological-assessment
local-authority: THE
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: In an Area of Archaeological Significance.
  - discretionary
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: NPPF
source-text: Where an application site includes, or is considered to have the potential to include, heritage
  assets with archaeological interest, a desk-based Archaeological Assessment must be submitted.
must-include:
- item: In accordance with the CIfA Standard and Guidance for Archaeological Desk-Based Assessments
  level: must
- item: The aims and purposes of the assessment, including the context of development or other land change
  level: must
- item: Methodology including sources consulted (as a minimum the relevant historic environment record)
  level: must
- item: An assessment of the potential for heritage assets to survive within the area of study
  level: must
- item: An assessment/description of the significance of the known or predicted heritage asset(s) affected,
    including their setting
  level: must
- item: Strategies for further evaluation where the resource is not sufficiently well defined
  level: must
- item: An assessment of the impact of the proposed development on the significance of the heritage assets
    and their settings
  level: must
- item: Strategies to conserve the significance of heritage assets and their settings
  level: must
- item: Proposals for further archaeological investigation within a programme
  level: must
- item: A field survey and Written Scheme of Investigation where the desk-based assessment is insufficient
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted August 2024), pages 15-15. Part B item 17. 'Considered to have
  the potential' is a judgement, so discretionary is kept alongside the Area of Archaeological Significance.
review-status: unverified
field-status: {}
