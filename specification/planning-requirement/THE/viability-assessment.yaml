reference: viability-assessment
local-authority: THE
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing policy requirements cannot be met due to viability.
  - application-type:
      in:
      - mod-discharge-s106
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Three Rivers Core Strategy (October 2011) policy CP4; Affordable Housing SPD
source-text: Where policy requirements cannot be met due to viability, a Viability Assessment / Financial
  Appraisal must be submitted at validation stage.
must-include:
- item: Accompanied by an executive summary (both are published unless an exemption is sought and agreed)
  level: must
  source-text: PLEASE ENSURE THAT ANY VIABILITY ASSESSMENT IS ACCOMPANIED BY AN EXECUTIVE SUMMARY. PLEASE
    BE AWARE THAT BOTH WILL BE PUBLISHED UNLESS AN EXEMPTION IS SOUGHT AND AGREED.
- item: The fee for independent assessment received at validation stage, as a separate payment to the
    planning fee
  level: must
  source-text: The fee for this external assessment must be received at validation stage, as a separate
    payment to the planning fee.
- item: Executive summary sets out the gross development value, benchmark land value including landowner
    premium, costs and return to developer
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), pages 8-8. Part B item 6. Applications to modify
  or discharge affordable housing clauses ('Section 106BA applications') must also provide viability evidence
  and a fee for its independent assessment; only those about affordable housing clauses are meant.
review-status: unverified
field-status: {}
