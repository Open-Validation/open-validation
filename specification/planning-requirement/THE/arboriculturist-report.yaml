    the Root Protection Area of trees on the site and their protection
  level: should
- item: An Arboricultural Method Statement (AMS) and Tree Protection Plan (TPP)
  level: must
  source-text: an Arboricultural Method Statement (AMS) and Tree Protection Plan (TPP).
