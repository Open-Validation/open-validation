reference: arboriculturist-report
local-authority: THE
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: The site is subject to a Tree Preservation Order or is in a Conservation Area.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The site has trees over 75mm in diameter.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
source-text: An Arboricultural Implications Assessment report and Tree Constraints Plan should be drawn
