reference: arboriculturist-report
local-authority: THE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: The site is covered by a Tree Preservation Order.
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees greater than 75mm in diameter within or adjacent to the site.
source-url: https://cdn.threerivers.gov.uk/files/2025/06/430751e0-4c3b-11f0-9e82-5f29d78682ab-Adopted%20Validation%20Checklist%20(1%20August%202024).pdf
policy: Three Rivers Development Management Policies LDD (July 2013) policy DM6
source-text: In accordance with Policy DM6 of the Development Management Policies LDD, if the site is
  covered by a Tree Preservation Order or within a Conservation Area, or if the site has trees within
  or adjacent to it which are greater than 75mm in diameter, then the advice of an arboriculturalist should
  be sought to identify all relevant trees to be included in a Tree Survey. A Tree Survey should be undertaken
  by an arboriculturalist and should record information about trees on the site independently from any
  proposed development.
must-include:
- item: A Tree Survey undertaken by an arboriculturalist, recording the trees independently from any proposed
    development
  level: must
- item: 'Carried out in accordance with section 4 of BS 5837:2012, with for each tree: reference number,
    species, height, stem diameter, branch spread, crown clearance, age class, physiological and structural
    condition, preliminary management recommendations, estimated remaining contribution in years and a
    U or A to C category grading'
  level: should
- item: An Arboricultural Implications Assessment and Tree Constraints Plan identifying trees to be removed,
    root protection areas and protection measures
  level: should
- item: An Arboricultural Method Statement (AMS) and Tree Protection Plan (TPP)
  level: should
  required-if: discretionary
  source-text: If it is acknowledged that significant trees on the site are affected by the proposals
    it will be necessary to provide an Arboricultural Method Statement (AMS) and Tree Protection Plan
    (TPP). It is good practice to provide this at the application stage, however if it is not this is
    likely to be required as a condition of any permission granted.
confidence: medium
notes: From the council's list (adopted August 2024), pages 9-10. Part B item 9. The Part C matrix (pages
  18-19) marks it 'required in some circumstances' for householder, full and outline applications; the
  triggers are the Part B text's. The AMS and TPP are 'good practice' at application stage, so that item
  is 'should' and discretionary.
