policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: An Environmental Statement (ES) must be provided for any development that falls within Schedule
  1 of the Environmental Impact Assessment Regulations 2011 (as amended by the 2017 Regulations). For
  development included within Schedule 2 an ES must be provided where its location and scale corresponds
  with the criteria listed in the EIA Regulations.
