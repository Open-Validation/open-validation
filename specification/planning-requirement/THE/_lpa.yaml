submission-standards:
- item: Plans marked "not to scale" or "do not scale" will not be registered
  level: must
- item: All plans and drawings state the paper size, key dimensions and a scale, and include a scale bar
  level: must
- item: All plans to a recognised metric scale (e.g. 1:100, 1:50)
  level: must
- item: For major applications, an electronic copy and one hard copy of all plans and documents, with
    an index listing all plan numbers
  level: must
- item: 'Major applications whose supporting information exceeds 100 pages (excluding the application
    form): a summary of the whole scheme of no more than 20 pages'
  level: should
- item: Where a required item is not submitted, a short written justification of why it is not appropriate
  level: should
