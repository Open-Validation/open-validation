reference: site-plan
local-authority: ASH
required-if:
  application-type:
    in:
    - hh
    - full
    - outline-some
    - outline-all
    - reserved-matters
    - demolition-con-area
    - advertising
    - lbc
    - ldc-existing-use
    - ldc-prospective-use
    - s73
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Block plan should be drawn at an identified standard metric scale (1:500 or 1:200). It should
  accurately show:'
must-include:
- item: An identified standard metric scale (1:500 or 1:200)
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Written metric (critical) dimensions, including those to the boundaries
  level: must
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    on adjoining land (including access), public rights of way, trees on and next to the site, hard surfacing
    and proposed boundary treatment'
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 8, 26. Called 'Block
  Plan'. In the Householder Guide (page 7) the adjoining features are 'required' unless they would not
  influence or be affected by the development; elsewhere they 'maybe required'. A local requirement for
  s73 applications (Miscellaneous Guide page 61).
review-status: unverified
field-status: {}
