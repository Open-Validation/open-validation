reference: sustainable-drainage-strategy
local-authority: ASH
required-if:
  all:
  - ref: major-development
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Major applications.
must-include:
- item: Implementation, adaptation, maintenance and management of a sustainable drainage system, including
    adoption or other arrangements for its lifetime
  level: must
- item: 'Where SuDS are not included: why they are not feasible and how drainage will be dealt with, including
    during construction'
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 33. Called 'Drainage Strategy'.
  Retired MHCLG id used. The outline and reserved matters checklists (Miscellaneous Guide pages 25 and
  57) refer to the Full/Major Guide for the details and plans of the matters to be considered, so those
  types show as discretionary.
review-status: unverified
