reference: noise-assessment
local-authority: ASH
required-if:
  all:
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Developments close to existing sources of noise.
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal could generate significant noise levels.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Where developments are close to existing sources of noise, or the proposal could generate
  significant noise levels.
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: Mitigation measures needed to meet current noise guidelines
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 20, 41-42. Called 'Noise
  Impact Assessment'. The outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57)
  refer to the Full/Major Guide for the details and plans of the matters to be considered, so those types
  show as discretionary.
review-status: unverified
field-status: {}
