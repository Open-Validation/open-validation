reference: land-contamination-assessment
local-authority: ASH
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: Land which could potentially be contaminated as a result of current or historic uses,
        being redeveloped or significantly changed in use.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any proposal which redevelops or significantly changes the use of a piece of land which could
  potentially be contaminated as a result of current or historic uses.
must-include:
- item: A Phase 1 contaminated land assessment
  level: must
- item: A Phase 2 assessment with a remediation strategy where the Phase 1 says it is needed
  level: must
- item: A verification report for any remediation completed
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 14, 32-33. Called 'Contaminated
  Land Assessment'. The outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57)
  refer to the Full/Major Guide for the details and plans of the matters to be considered, so those types
  show as discretionary.
review-status: unverified
field-status: {}
