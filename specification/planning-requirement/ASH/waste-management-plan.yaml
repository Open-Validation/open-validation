reference: waste-management-plan
local-authority: ASH
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
    - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Site Waste Management Plan | All residential development and other applications that have
  an impact on the generation of waste.
must-include:
- item: Bin storage, waste vehicle tracking and collection arrangements
  level: must
- item: A litter management plan
  level: must
  required-if:
    condition:
      field: food-or-drink-use
      value: true
      description: The proposal is a hot food takeaway.
confidence: medium
notes: 'From the audit (missing_requirement): Major list; the contents are the audit''s summary.'
review-status: unverified
field-status: {}
