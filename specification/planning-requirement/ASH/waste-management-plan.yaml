reference: waste-management-plan
local-authority: ASH
required-if:
  all:
  - any:
    - condition:
        field: waste-storage-facilities
        value: true
        description: New development which would result in the need for new storage or recycling facilities.
    - all:
      - ref: major-development
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: All residential development.
        - discretionary
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All new development which would result in the need for new or storage or recycling facilities.
  … All residential development and other applications that have an impact on the generation of waste.
must-include:
- item: A scaled plan of the location of bin stores, with the materials, design and type of enclosure
  level: must
- item: Elevations with written critical dimensions in metric
  level: must
- item: Details of collection arrangements
  level: must
- item: 'Major: a statement on bin storage areas, waste disposal and the recycling scheme'
  level: must
  required-if:
    ref: major-development
- item: 'Major: tracking details for a waste vehicle'
  level: must
  required-if:
    ref: major-development
- item: 'Major hot food takeaways: a litter management plan'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Hot food takeaway.
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 13, 32, 43. Called 'Bin
  Stores / Recycling Facilities' (minor and major) and, for majors, also 'Site Waste Management Plan'.
  For major non-residential applications 'that have an impact on the generation of waste' shows as discretionary.
  The outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major
  Guide for the details and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
