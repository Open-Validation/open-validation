reference: photos
local-authority: ASH
required-if:
  any:
  - all:
    - application-type:
        in:
        - advertising
        - lbc
    - condition:
        field: retrospective
        value: true
        description: Retrospective application.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - town-centre
        description: Advertisements within the Town Centre boundaries (photomontages).
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.ashfield.gov.uk/media/cw3m1dzz/validation-list-miscellaneous-2025-1.docx
source-text: All retrospective applications … Photographs of the signage in situ. … This is required for
  advertisements within the Town Centre boundaries as defined by the Ashfield Local Plan. … Retrospective
  applications … Photographs of the works carried out … To show the trees which the works is being applied
  for.
must-include:
- item: 'Retrospective adverts: the signage in situ'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Adverts in the Town Centre boundaries: photomontages'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - town-centre
        description: Within the Town Centre boundaries.
- item: 'Retrospective listed building consent: the works carried out'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Tree works: edited to show the shape of the tree(s) once the works are done, with critical measurements
    in metric'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (adopted April 2025), Miscellaneous Guide, pages 29, 42, 68. Local requirement
  for advertisement consent, listed building consent and tree works.
review-status: unverified
field-status: {}
