reference: bng-metric
local-authority: ASH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Development required to meet mandatory biodiversity net gain.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Article 7
source-text: For all development required to meet mandatory biodiversity net gain (BNG) requirements …
  A statutory biodiversity metric. Please note we can only accept these in excel format (.xls) and it
  must include the date of the assessment, the details of the assessor and should not include any red
  boxes, unless the application is in outline, and whether the applicant is requesting permission to purchase
  statutory biodiversity credits, or if Rule 4 of the metric has been instigated.
must-include:
- item: Excel format (.xls) only
  level: must
- item: The date of the assessment and the details of the assessor
  level: must
- item: No red boxes, unless the application is in outline
  level: must
- item: Whether the applicant asks to purchase statutory biodiversity credits, or whether Rule 4 of the
    metric has been used
  level: must
- item: The completed metric calculation of the pre-development biodiversity value on the date of application
    (or an earlier date, with the date and reasons)
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2025), Full and Major Guide, pages 10-11, 29-30. Called
  ''Biodiversity DEFRA Metric and Statement''; also in the outline checklist (Miscellaneous Guide pages
  22-23). Follows the law: only development subject to the biodiversity gain condition (householder and
  other exempt applications are exempt). The council''s ''Apply for permission'' page (last updated 11
  June 2026) adds that ''As of 11 June 2026, all applications which may be subject to BNG, irrespective
  of exemptions, require a predevelopment BNG metric to produce a baseline'', with a statement where a
  self-build exemption is advanced.'
review-status: unverified
field-status: {}
