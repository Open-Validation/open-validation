reference: sci
local-authority: ASH
required-if:
  all:
  - all:
    - ref: major-development
    - any:
      - all:
        - condition:
            field: wind-turbine
            value: true
            description: An installation for harnessing wind power for energy production.
        - any:
          - condition:
              field: wind-turbine-count
              operator: '>'
              value: 2
              description: More than two turbines.
          - condition:
              field: turbine-hub-height
              operator: '>'
              value: 15
              description: The hub height of any turbine exceeds 15 metres.
      - condition:
          field: employment-site-non-employment-use
          value: true
          description: Alternative uses proposed on allocated employment sites.
      - condition:
          field: loss-of-open-space
          value: true
          description: Loss of open space, or development on allotment land.
      - condition:
          field: loss-of-use
          value: true
          description: Loss of existing facilities, e.g. pub, church, community centres.
      - discretionary
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any development involving an installation for the harnessing of wind power for energy production
  where- The development involves the installation of more than two turbines The hub height of any turbine
  exceeds 15 metres Alternative uses proposed on allocated employment sites. … d) Development proposals
  involving the loss of open space, or development on allotment land. e) Proposals for leisure and visitor
  facilities. f) Development proposals that involve the loss of existing facilities e.g. pub, church community
  centres.
must-include:
- item: The context and need for the development
  level: must
- item: How the development accords with national and local policies
  level: must
- item: How local community engagement informed the application, and any resulting amendments
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 44-45. Major list only.
  'Proposals for leisure and visitor facilities' has no field, so that part shows as discretionary. The
  outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major
  Guide for the details and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
