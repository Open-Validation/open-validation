reference: viability-assessment
local-authority: ASH
required-if:
  any:
  - all:
    - all:
      - ref: major-development
      - condition:
          field: planning-obligations-shortfall
          value: true
          description: Major development that does not offer planning obligations in accordance with the
            council's Housing SPD.
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
  - all:
    - application-type:
        in:
        - demolition-con-area
    - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any major development that does not offer planning obligations in accordance with the council’s
  Housing Supplementary Planning Document (SPD). … When demolition is proposed due to the cost of repair.
must-include:
- item: As set out in the viability section of national Planning Practice Guidance
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 48. Also a 'Viability
  Report' for relevant demolition in a conservation area 'when demolition is proposed due to the cost
  of repair' (Miscellaneous Guide page 16); no field captures that, so it shows as discretionary. The
  outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major
  Guide for the details and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
