reference: roof-plan-existing
local-authority: ASH
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - lbc
  - condition:
      field: roof-alteration
      value: true
      description: Roof extensions, roof terraces or dormer windows.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof extensions, roof terraces, dormer windows and window and door replacement.
must-include:
- item: 'Roof extensions and dormers: elevations of the whole property, not just the roof and upper floor(s)'
  level: must
- item: 'Roof extensions and dormers: existing and proposed sections through the roof'
  level: must
- item: 'Roof terraces: the nearest windows on the immediately adjoining properties on elevations and
    floor plans'
  level: must
- item: 'Roof terraces: materials and measurements of the means of enclosure and any privacy screens'
  level: must
- item: All critical dimensions in metric
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 9-10, 27-28. Also in
  the Householder Guide (page 8) and for listed building consent (Miscellaneous Guide page 33). The trigger
  also names window and door replacement, but the contents only cover roof works.
review-status: unverified
field-status: {}
