reference: landscaping-plan
local-authority: ASH
required-if:
  all:
  - condition:
      field: external-space
      value: true
      description: Applications that include external space.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Applications that include external space.
must-include:
- item: Trees/hedges to be removed, clearly differentiating retained existing trees/hedges and those proposed
  level: must
- item: Planting of trees and/or shrubs, surface materials, boundary screen walls and fences
  level: must
- item: Materials, species, tree and plant sizes, numbers and planting densities
  level: must
- item: Levels, gradients and any earthworks
  level: must
- item: Timing of implementation, with proposals for long-term maintenance and landscape management
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 18-19, 40. Called 'Landscaping
  Scheme'. The outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to
  the Full/Major Guide for the details and plans of the matters to be considered, so those types show
  as discretionary.
review-status: unverified
field-status: {}
