reference: flood-risk-assessment
local-authority: ASH
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - flood-risk-zone
          description: All development in Flood Zones 2 and 3.
      - site:
          in:
          - critical-drainage-area
          description: Development in a critical area.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: 1 hectare or more in Flood Zone 1.
  - all:
    - any:
      - site:
          in:
          - flood-risk-zone
          description: All development in Flood Zones 2 and 3.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or more in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or more in Flood Zone 1.
      - site:
          in:
          - critical-drainage-area
          description: Development in a critical area.
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All development of 1 hectare or more in Flood Zone 1, development in a critical area, all
  development in Flood Zones 2 and 3
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development
  level: must
- item: How flood risks will be managed, considering climate change
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: Use and details of Sustainable Drainage Systems
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 15, 35. Also in the Householder
  Guide (pages 10-11). The outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57)
  refer to the Full/Major Guide for the details and plans of the matters to be considered, so those types
  show as discretionary.
review-status: unverified
field-status: {}
