reference: section-existing
local-authority: ASH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - reserved-matters
        - lbc
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: A significant change in levels across the site or street scene.
      - discretionary
  - application-type:
      in:
      - pa-extension
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All applications where there is a significant change in levels across the site or street
  scene, or where greater details relating the construction of the proposal is required. … Existing and
  proposed elevations, site sections and finished floor and site levels
must-include:
- item: Existing site levels and finished floor levels, with levels relating to fixed datum points off
    site
  level: must
- item: The proposals in relation to adjoining buildings, with section plans
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2025), Full and Major Guide, pages 19, 28. Called ''Levels,
  Existing and Proposed Site Sections and Finished Floor Levels'': a local requirement for minor full
  applications and a national one for majors, outline, reserved matters and listed building consent. ''Where
  greater details relating the construction of the proposal is required'' is a judgement, so that part
  shows as discretionary. Required for the larger home extension prior approval (Householder Guide page
  16).'
review-status: unverified
field-status: {}
