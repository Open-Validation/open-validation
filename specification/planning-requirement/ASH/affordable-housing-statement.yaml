reference: affordable-housing-statement
local-authority: ASH
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The development is residential.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Affordable Housing Statement | All major residential developments
must-include:
- item: The private/affordable mix, tenure and number of bedrooms
  level: must
- item: The affordable units shown on the floor plans
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): the contents are the audit''s summary.'
review-status: unverified
field-status: {}
