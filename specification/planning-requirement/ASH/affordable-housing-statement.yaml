reference: affordable-housing-statement
local-authority: ASH
required-if:
  all:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All major residential developments
must-include:
- item: The mix of private and affordable units, with numbers of bedrooms, habitable floor space and how
    many people each property can house
  level: must
- item: Any different levels or types of affordability or tenure explained clearly and fully
  level: must
- item: The proposed mix of tenure
  level: must
- item: How the development meets the council's threshold
  level: must
- item: The location of affordable units, and their habitable rooms/bedrooms and/or floor space, on the
    floor plans
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 31. The outline and reserved
  matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details
  and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
