reference: elevation-proposed
local-authority: ASH
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - pa-extension
      - advertising
  - all:
    - application-type:
        in:
        - outline-some
        - outline-all
    - discretionary
  - all:
    - application-type:
        in:
        - s73
        - approval-condition
        - non-material-amendment
    - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All plans to be drawn at a minimum scale of 1:50 or 1:100. Plans should be proportionate
  to the nature and size of the proposal, titled, and numbered identifying revisions, and annotated with
  critical dimensions (in metric) and a scale bar. … Applications where approval is sought for appearance,
  scale or layout … Existing and proposed elevations, site sections and finished floor and site levels,
  existing and proposed floor plans (all should be to metric scale 1:50 or 1:100)
must-include:
- item: A minimum scale of 1:50 or 1:100, with a scale bar
  level: must
- item: Annotated with critical dimensions in metric (height including existing eaves and ridge from existing
    ground levels, width and length of the existing and proposed building)
  level: must
- item: The proposed works in relation to what is already there, highlighting structures to be demolished
    or changes to external materials
  level: should
- item: All elevations included
  level: should
- item: 'Listed building consent: all new doors, windows (including cill and lintel details), shopfronts,
    panelling, fireplaces, plaster moulding and other decorative details'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Plans to show all new doors, windows (including cill and lintels details), shopfronts,
    panelling, fireplaces, plaster moulding and other decorative details.
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 8-9, 26-27. National
  requirement for householder, full, reserved matters, listed building consent and lawful development
  certificates. For outline applications they are needed only 'where approval is sought for appearance,
  scale or layout', and s73, approval of details and non-material amendment applications need only the
  plans relevant to the change, so those show as discretionary. Also a local requirement for the larger
  home extension prior approval (Householder Guide page 16).
review-status: unverified
