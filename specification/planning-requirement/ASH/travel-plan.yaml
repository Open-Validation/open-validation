reference: travel-plan
local-authority: ASH
required-if:
  all:
  - ref: major-development
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All major development.
must-include:
- item: How the transport implications will be managed to minimise environmental, social and economic
    impacts
  level: must
- item: An implementation strategy naming the travel plan coordinator, management arrangements and timetable
  level: should
- item: Activities for marketing and promoting the plan to occupiers, users, visitors and residents
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 47. The outline and reserved
  matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details
  and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
