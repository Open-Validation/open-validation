reference: planning-statement
local-authority: ASH
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - advertising
      - reserved-matters
      - s73
      - ldc
      - ldc-existing-use
      - ldc-prospective-use
source-url: https://www.ashfield.gov.uk/media/cw3m1dzz/validation-list-miscellaneous-2025-1.docx
source-text: Planning Statement | All | A planning statement justifying the design and location of the
  advert.
must-include:
- item: Justification of the design and location of the advert
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: How the details relate to the reserved matters
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
- item: An explanation and justification of the removal or variation of the condition
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Background, compliance with the Local Plan, when the use started, opening times and parking
  level: must
  required-if:
    application-type:
      in:
      - ldc
      - ldc-existing-use
      - ldc-prospective-use
confidence: medium
notes: 'From the audit (missing_requirement): all major developments; all advertisement, reserved matters,
  s73 and LDC (existing and proposed) applications. The contents are the audit''s summary.'
review-status: unverified
field-status: {}
