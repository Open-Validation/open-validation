reference: planning-statement
local-authority: ASH
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
  - application-type:
      in:
      - reserved-matters
      - s73
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All major developments. … The planning statement should explain the principles of and justification
  for the proposed works.
must-include:
- item: The principles of and justification for the proposed works
  level: must
- item: How the development accords with local plan policies, and details of any pre-application consultation
  level: must
  required-if:
    ref: major-development
- item: 'Reserved matters: how the details relate to the reserved matters applied for'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
- item: 's73: explains/justifies the proposed removal or variation'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: 'Advertisement consent: justifies the design and location of the advert'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Lawful development certificates: background, accordance with the Local Plan, when the use started,
    opening times, parking and community benefits where applicable'
  level: should
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 42-43. Majors; and every
  reserved matters, s73, advertisement and lawful development certificate application (Miscellaneous Guide
  pages 29, 46-47, 50, 58, 61).
review-status: unverified
field-status: {}
