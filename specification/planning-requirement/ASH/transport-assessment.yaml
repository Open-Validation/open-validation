reference: transport-assessment
local-authority: ASH
required-if:
  all:
  - ref: major-development
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All major development.
must-include:
- item: Coverage and detail reflecting the scale of the development and its transport implications
  level: must
- item: 'Major proposals: accessibility by all modes, likely modal split, and measures to improve access
    by public transport, walking and cycling, reduce parking need and mitigate transport impacts'
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 46. The outline and reserved
  matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details
  and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
