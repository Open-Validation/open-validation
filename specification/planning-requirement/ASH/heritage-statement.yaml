reference: heritage-statement
local-authority: ASH
required-if:
  any:
  - application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
  - all:
    - application-type:
        in:
        - hh
        - demolition-con-area
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - locally-listed-building
        - park-and-garden
        - scheduled-monument
        description: Affecting a listed building, conservation area or locally listed building, including
          their setting.
  - all:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - locally-listed-building
        - park-and-garden
        - scheduled-monument
        description: Affecting a listed building, conservation area or locally listed building, including
          their setting.
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - archaeological-priority-area
        description: Excavations in an Archaeological Constraint area (Article 4 checklist).
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Applications affecting a listed building, conservation area, or locally listed building,
  including the setting of these heritage assets. In accordance with paragraph 128 of the NPPF, Heritage
  Impact Assessments are required for applications for development or works directly affecting or within
  the setting of a heritage asset.
must-include:
- item: The significance of the heritage asset affected, and the contribution its setting makes to it
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset
  level: must
- item: The sources considered and the expertise consulted
  level: must
- item: The steps taken to avoid or minimise adverse impacts on the significance/setting of any heritage
    asset
  level: must
- item: 'Certificate of lawfulness of proposed works to a listed building: why the works would not affect
    its character as a building of special architectural or historic interest'
  level: must
  required-if:
    application-type:
      in:
      - ldc-proposed-work-lb
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 15-18, 36-40. May be
  part of the Design and Access Statement where one is needed. Also in the Householder Guide (pages 11-14),
  the Miscellaneous Guide (demolition in a conservation area, listed building consent, certificate of
  lawfulness of proposed works to a listed building) and the Article 4 checklist (page 74). A Heritage
  Impact Assessment is 'always advisable' for applications notifiable to Historic England. The outline
  and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide
  for the details and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
