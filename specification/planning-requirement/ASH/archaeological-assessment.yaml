reference: archaeological-assessment
local-authority: ASH
required-if:
  all:
  - ref: major-development
  - condition:
      field: ground-disturbance
      value: true
      description: Disturbance of previously undisturbed ground where archaeological artefacts are believed
        to remain.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Archaeological Assessment | Any proposal which involves disturbance of previously undisturbed
  ground where archaeological artefacts are believed to remain.
must-include:
- item: A desk-based assessment
  level: must
- item: A geophysical survey
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the audit (missing_requirement): Major local list; geophysical survey ''where necessary''.'
review-status: unverified
field-status: {}
