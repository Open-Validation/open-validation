reference: archaeological-assessment
local-authority: ASH
required-if:
  all:
  - all:
    - ref: major-development
    - condition:
        field: ground-disturbance
        value: true
        description: Disturbance of previously undisturbed ground.
    - discretionary
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any proposal which involves disturbance of previously undisturbed ground where archaeological
  artefacts are believed to remain.
must-include:
- item: An archaeological desk-based assessment, and a geophysical survey where necessary
  level: must
- item: The principles and justification for the works and their impact on archaeological features
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 32. Major applications
  only. Whether artefacts 'are believed to remain' is a judgement, so it shows as discretionary. The outline
  and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide
  for the details and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
