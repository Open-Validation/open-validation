source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location based up-to-date map. This should be at an identified standard metric scale (typically
  1:1250 or 1:2500, but wherever possible the map should fit onto A4 or A3 size paper) Plans should identify
  sufficient roads and/or buildings on land adjoining the application site to ensure that the exact location
  of the application site is clear. Must include the direction of North. … This drawing should not show
  the proposed development. … To clearly show the location and length of the hedgerow to be removed.
must-include:
- item: Based on an up-to-date map at an identified standard metric scale (typically 1:1250 or 1:2500)
  level: must
- item: Fits onto A4 or A3 paper wherever possible
  level: should
- item: Sufficient roads and/or buildings on adjoining land to make the exact location clear
  level: must
- item: The direction of North
  level: must
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: Does not show the proposed development
  level: should
- item: All other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: 'Hedgerow removal: the location and length of the hedgerow(s), at a defined scale (typically 1:1250
    or 1:2500)'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 7-8, 25-26. Also in the
  Householder Guide (page 6) and the Miscellaneous Guide for each application type it covers (hedgerow
  plan page 65).
