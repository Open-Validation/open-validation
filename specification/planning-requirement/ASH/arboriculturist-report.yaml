reference: arboriculturist-report
local-authority: ASH
required-if:
  any:
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees at or adjoining the site that could be affected by the proposed development.
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
  - all:
    - application-type:
        in:
        - hh
        - demolition-con-area
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees at or adjoining the site that could be affected by the proposed development.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any proposal where there are trees at or adjoining the site that could be affected by the
  proposed development.
must-include:
- item: A tree survey from an arboricultural specialist showing the distribution of trees on site
  level: must
- item: An Arboricultural Impact Assessment showing how the development will co-exist with the trees (level
    changes, services, hard surfacing, material storage, future shadowing)
  level: must
- item: Tree root protection zones clearly marked on a scaled plan
  level: must
- item: Species, spread, roots and position of trees
  level: must
- item: Which trees are to be felled and which retained, and which will be affected
  level: must
- item: Measures to protect trees during construction
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 22-23, 47. Called 'Tree
  Survey and/or associated Arboricultural Impact Assessment'. Also in the Householder Guide (page 11)
  and for demolition in a conservation area (Miscellaneous Guide page 12). The outline and reserved matters
  checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details and plans
  of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
