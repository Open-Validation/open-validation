reference: structural-damage
local-authority: ASH
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: structural-damage-alleged
      value: true
      description: It is alleged that trees are causing structural damage to property.
source-url: https://www.ashfield.gov.uk/media/cw3m1dzz/validation-list-miscellaneous-2025-1.docx
source-text: Circumstances where it is alleged that Trees are causing structural damage to property. …
  A statement prepared by a suitably qualified person to evidence that the tree(s) in question is the
  cause of any structural damage.
must-include:
- item: Prepared by a suitably qualified person, evidencing that the tree(s) cause the damage
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Miscellaneous Guide, page 68. Called 'Structural
  Report'; local requirement for tree works.
review-status: unverified
field-status: {}
