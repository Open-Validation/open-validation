reference: habitat-baseline
local-authority: ASH
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Development required to meet mandatory biodiversity net gain.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Article 7
source-text: For all development required to meet mandatory biodiversity net gain (BNG) requirements …
  A plan showing onsite habitat existing on the date of application (or an earlier date), including any
  irreplaceable habitat.
must-include:
- item: On-site habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
- item: A statement on whether the on-site value is lower because of degradation
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2025), Full and Major Guide, pages 10-11, 29-30. Follows
  the law: only development subject to the biodiversity gain condition (householder and other exempt applications
  are exempt). The council''s ''Apply for permission'' page (last updated 11 June 2026) adds that ''As
  of 11 June 2026, all applications which may be subject to BNG, irrespective of exemptions, require a
  predevelopment BNG metric to produce a baseline'', with a statement where a self-build exemption is
  advanced.'
review-status: unverified
field-status: {}
