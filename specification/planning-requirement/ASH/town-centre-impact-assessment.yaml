reference: town-centre-impact-assessment
local-authority: ASH
required-if:
  all:
  - all:
    - ref: major-development
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail and leisure development outside town centres, not in accordance with an up-to-date
          plan.
    - discretionary
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Applications for retail and leisure development outside town centres, which are not in accordance
  with an up-to-date plan if over the relevant thresholds
must-include:
- item: The requirements of paragraph 94 of the NPPF and national Planning Practice Guidance
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 43. Called 'Retail Impact
  Assessment'. The list does not give the thresholds, so it shows as discretionary. The outline and reserved
  matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details
  and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
