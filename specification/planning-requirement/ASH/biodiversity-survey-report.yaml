reference: biodiversity-survey-report
local-authority: ASH
required-if:
  any:
  - all:
    - any:
      - condition:
          field: protected-species
          value: true
          description: The development has the potential to affect protected species.
      - site:
          in:
          - priority-habitat
          description: Habitats/species of principal importance (Section 41, NERC Act 2006).
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
  - all:
    - application-type:
        in:
        - demolition-con-area
        - lbc
    - any:
      - condition:
          field: protected-species
          value: true
          description: The development has the potential to affect protected species.
      - site:
          in:
          - priority-habitat
          description: Habitats/species of principal importance (Section 41, NERC Act 2006).
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: 'Developments that have the potential to affect: Species protected under the Wildlife and
  Countryside Act 1981 (as amended), the Conservation of Habitats and Species Regulations 2010, the Protection
  of Badgers Act 1992. Habitats/species of principal importance listed under Section 41 of the Natural
  Environment and Rural Communities Act 2006'
must-include:
- item: Prepared by competent persons with suitable qualifications and experience
  level: must
- item: Carried out at an appropriate time of year, in suitable weather, using nationally recognised methods
  level: must
- item: Records which species are present and their (approximate) numbers
  level: must
- item: Maps their distribution and use of the area, site, structure or feature
  level: must
- item: Identifies potential impacts likely to harm protected species or their habitats, direct and indirect,
    during and after construction
  level: must
- item: 'Where harm is likely: alternatives considered, avoidance, mitigation, compensation, likely change
    in species numbers, and enhancement'
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 14-15, 33-34. Called
  'Ecology / Protected Species Surveys and Report'. Also for relevant demolition in a conservation area
  and listed building consent (Miscellaneous Guide pages 15, 40-41). The outline and reserved matters
  checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details and plans
  of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
