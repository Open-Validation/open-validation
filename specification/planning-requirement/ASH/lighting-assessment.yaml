reference: lighting-assessment
local-authority: ASH
required-if:
  any:
  - all:
    - any:
      - condition:
          field: floodlighting
          value: true
          description: Installation of flood lighting with the potential to impact on existing light sensitive
            uses.
      - condition:
          field: external-lighting
          value: true
          description: Other external lighting with the potential to impact on existing light sensitive
            uses.
    - any:
      - application-type:
          in:
          - full
      - all:
        - application-type:
            in:
            - outline-some
            - outline-all
            - reserved-matters
        - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - any:
      - condition:
          field: illuminated
          value: true
          description: Illuminated advertisement with the potential to impact on existing light sensitive
            uses.
      - condition:
          field: external-lighting
          value: true
          description: External lighting.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any proposal which involves the installation of flood lighting or other external lighting
  and that lighting has the potential to impact on existing light sensitive uses.
must-include:
- item: Hours of operation
  level: must
- item: Light spillage and light levels
  level: must
- item: Column heights
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Equipment design
  level: must
- item: Mitigation measures needed to meet current light guidelines
  level: should
- item: Details of any timers or automatic switch-off/on
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 19, 40-41. Called 'Lighting
  Impact Assessment'. Also for advertisement consent (Miscellaneous Guide page 29). The outline and reserved
  matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details
  and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
