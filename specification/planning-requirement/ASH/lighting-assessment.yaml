reference: lighting-assessment
local-authority: ASH
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal installs floodlighting that could affect existing light-sensitive uses.
  - condition:
      field: external-lighting
      value: true
      description: The proposal installs other external lighting that could affect existing light-sensitive
        uses.
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: Any proposal which involves the installation of flood lighting or other external lighting
  and that lighting has the potential to impact on existing light sensitive uses.
confidence: medium
