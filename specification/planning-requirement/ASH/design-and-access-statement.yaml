reference: design-and-access-statement
local-authority: ASH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - site:
        in:
        - conservation-area
        description: A designated area (eg conservation areas).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings proposed.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: The floor area of the proposal is greater than 100 square metres.
  - application-type:
      in:
      - lbc
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement must be submitted in support of applications for both outline
  and full planning permission which is for: Major applications. Applications for development in a designated
  area (eg conservation areas) where there are one or more dwellings proposed, or the floor area of the
  proposal is greater than 100 square meters. Applications for listed building consent'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes it into account
  level: must
- item: The approach to access and how relevant local plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how its outcome has informed the development
  level: must
- item: How specific issues which might affect access have been addressed
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 10, 28-29. Also in the
  Miscellaneous Guide (demolition in a conservation area, outline and listed building consent).
review-status: unverified
field-status: {}
