reference: environmental-statement
local-authority: ASH
required-if:
  all:
  - all:
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: Development listed under Schedule 1 or 2 of the EIA Regulations 2017 that requires
          EIA.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'Required for developments that: are listed under Schedule 1 and Schedule 2 of The Town and
  County Planning (Environmental Impact Assessment) Regulations 2017.'
must-include:
- item: In the form set out in Schedule 4 of the Regulations
  level: must
- item: The likely significant effects on the environment and the proposed mitigation
  level: must
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, page 34. Called 'Environment
  Impact Assessment'. A screening opinion should be requested first if the development area is over 0.5
  ha. The outline and reserved matters checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major
  Guide for the details and plans of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
