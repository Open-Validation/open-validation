reference: recreation-facilities-assessment
local-authority: ASH
required-if:
  all:
  - condition:
      field: loss-of-open-space
      value: true
      description: A loss of open space, including playing fields.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - outline-some
          - outline-all
          - reserved-matters
      - discretionary
source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
source-text: All applications where there would be a loss of open space, including playing fields.
must-include:
- item: Relevant local and national open space policy and how the development addresses it
  level: should
- item: Open spaces in the area and the site's relationship to them
  level: should
- item: Supply and demand for the type of development proposed
  level: should
- item: Any remediation to compensate the local community for the loss
  level: should
confidence: medium
notes: From the council's list (adopted April 2025), Full and Major Guide, pages 21, 42. Called 'Open
  Space Assessment'; the contents are what it 'will typically address'. The outline and reserved matters
  checklists (Miscellaneous Guide pages 25 and 57) refer to the Full/Major Guide for the details and plans
  of the matters to be considered, so those types show as discretionary.
review-status: unverified
field-status: {}
