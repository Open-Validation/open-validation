reference: energy-statement
local-authority: PRE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The application is for residential development.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: The application is for 500 square metres or more of non-residential floorspace.
source-url: https://www.preston.gov.uk/article/5129/Validation-Checklist-for-Planning-and-Other-Applications
confidence: medium
notes: 'From the audit (missing_requirement): an Energy Efficiency Statement for all full residential
  applications, full non-residential of 500 sqm or more, and outline residential with enough detail (otherwise
  a letter of intent).'
review-status: unverified
field-status: {}
