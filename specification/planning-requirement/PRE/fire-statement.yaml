reference: fire-statement
local-authority: PRE
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.preston.gov.uk/article/5129/Validation-Checklist-for-Planning-and-Other-Applications
source-text: 'Fire Statement Required for all types of applications proposing: The provision of one or
  more relevant buildings; or Development of an existing relevant building;'
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The council's trigger
  is new or existing 'relevant buildings' (18m+ or 7+ storeys with 2+ dwellings or educational accommodation).
review-status: unverified
field-status: {}
