reference: biodiversity-survey-report
local-authority: PRE
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development is likely to affect the habitat of protected species, Section 41 species
        or priority habitats and species (including work affecting roofs or roof spaces).
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - special-protection-area
      description: The development impacts Biological or Geological Heritage Sites, Wildlife Corridors,
        Red Scar & Tun Brook SSSI, the Ribble and Alt Estuaries SPA/Ramsar site, or SSSI Impact Risk Zones.
source-url: https://www.preston.gov.uk/article/5129/Validation-Checklist-for-Planning-and-Other-Applications
source-text: 'Biodiversity Survey and Report Required for developments which is likely to affect the habitat
  of protected species*, species included on the Section 41 of the National Environment and Rural Communities
  2006 list and priority habitats and species, including: Work affecting roofs or roof spaces; … Biodiversity
  Survey and Report Required for developments which impact upon: Biological Heritage Sites; Geological
  Heritage Sites; Wildlife Corridors; Red Scar & Tun Brook Site of Special Scientific Interest; Ribble
  and Alt Estuaries Special Protection Area/Ramsar site, including the Ribble Estuary SSSI and the National
  Nature Reserve; Site of Special Scientific Interest (SSSI) Impact Risk Zones (IRZs).'
