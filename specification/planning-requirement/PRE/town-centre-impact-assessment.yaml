reference: town-centre-impact-assessment
local-authority: PRE
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: A main town centre use that is not in an existing centre and not in accordance with an
      up-to-date local plan.
source-url: https://www.preston.gov.uk/article/5129/Validation-Checklist-for-Planning-and-Other-Applications
source-text: Sequential Assessment and Impact Assessment for main town centre uses a) Sequential Assessment
  will be required for all applications for main town centre uses* that are not in an existing centre
  and are not in accordance with an up-to-date local plan; b) An Impact Assessment will be required for
  all applications for retail, leisure and office development over 2,500 square metres that are not in
  an existing centre and are not in accordance with an up-to-date local plan.
must-include:
- item: Sequential Assessment
  level: must
- item: Impact Assessment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail, leisure and office development over 2,500 square metres.
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. 'Not in accordance
  with an up-to-date local plan' can't be expressed as a field.
review-status: unverified
field-status: {}
