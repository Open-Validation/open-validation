reference: floor-plan-existing
local-authority: PRE
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The proposal is new built development.
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The proposal creates new floorspace.
  - condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use.
source-url: https://www.preston.gov.uk/article/9630/Validation-Checklist-for-Householder-Applications
source-text: 'Floor Plans (existing and proposed) Required for all householder applications proposing
  new floor space These should: Be drawn to a scale of 1:50 or 1:100 (scale bar must be shown);'
must-include:
- item: Drawn to a scale of 1:50 or 1:100, with a scale bar
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the Full row quoted telecommunications text; the source trigger is new
  built development, new floorspace or change of use.'
review-status: unverified
field-status: {}
