reference: flood-risk-assessment
local-authority: PRE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - site:
      in:
      - critical-drainage-area
      description: The Environment Agency has identified the land as having critical drainage problems.
  - discretionary
source-url: https://www.preston.gov.uk/media/9955/Validation-Checklist-for-Planning-and-Other-Applications-Full-Version/pdf/2022_FINAL_Validation_Checklist_-_Main_document.pdf?m=638098051882430000
source-text: 'Flood Risk Assessment Required for: All developments within flood zones 2 and 3; In floor
  zone 1, assessments will be required for: Sites of 1 hectare or more Land which has been identified
  by the Environment Agency as having critical drainage problems; Land identified in a strategic flood
  risk assessment at being at increased flood risk in future; or Land that may be subject to other sources
  of flooding, where its development would introduce a more vulnerable use.'
confidence: medium
notes: 'Officer discretion covers land at increased future flood risk in the SFRA and land subject to
  other sources of flooding where a more vulnerable use is introduced. Audit (outdated_link): the wording
  is from the 2022 PDF.'
