reference: design-and-access-statement
local-authority: PRE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The development provides one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The development creates 100 square metres or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.preston.gov.uk/media/9955/Validation-Checklist-for-Planning-and-Other-Applications-Full-Version/pdf/2022_FINAL_Validation_Checklist_-_Main_document.pdf?m=638098051882430000
source-text: 'Design and Access Statements Required for: All major applications; All development within
  a designated area (conservation area or World Heritage Site) where the development consists of the provision
  of one or more dwellinghouses or the provision of a building or buildings where the floorspace created
  by the development is 100 square metres or more; and All applications for listed building consent.'
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the excerpt was prefixed with BNG link text and its exemptions
  were filed as requirements for s73, change of use and waste rows. A DAS is not required for s73 applications,
  engineering or mining operations, material changes of use or waste development.'
review-status: unverified
field-status: {}
