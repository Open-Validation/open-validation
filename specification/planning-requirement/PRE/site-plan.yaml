reference: site-plan
local-authority: PRE
required-if:
  any:
  - condition:
      field: involves-change-of-use
      value: false
      description: The application is not a change of use.
  - condition:
      field: external-alterations
      value: true
      description: External works are proposed.
source-url: https://www.preston.gov.uk/article/5129/Validation-Checklist-for-Planning-and-Other-Applications
source-text: Site Plan / Block Plan (Existing and Proposed) Required for all applications, with the exception
  of change of use proposal where no external works are proposed.
must-include:
- item: Scale of 1:500 or 1:200, with a scale bar
  level: must
- item: A north point
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: All trees and hedges on or adjacent to the site identified and annotated
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): the checklist doesn''t cover prior approvals. Required for all applications
  except change of use with no external works.'
review-status: unverified
field-status: {}
