reference: land-contamination-assessment
local-authority: PRE
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: The site is known or suspected to be contaminated.
  - condition:
      field: previously-developed-land
      value: true
      description: The site is previously developed land.
  - site:
      in:
      - near-landfill-site
      description: The site is within 250m of a current or former landfill site.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposal is for a particularly vulnerable use (allotments, residential, schools,
        hospitals).
source-url: https://www.preston.gov.uk/article/5129/Validation-Checklist-for-Planning-and-Other-Applications
confidence: medium
notes: 'From the audit (missing_requirement): a Land Quality Assessment for known or suspected contamination,
  previously developed land, sites within 250m of a current or former landfill, and particularly vulnerable
  uses.'
