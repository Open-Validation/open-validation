reference: town-centre-impact-assessment
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-all
      - outline-some
  - any:
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 600
          description: Main town centre uses of more than 600m² net internal floor space.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside of defined town centres.
    - all:
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 600
          description: Retail uses of more than 600m² net internal floor space.
      - condition:
          field: outside-primary-shopping-area
          value: true
          description: Outside of defined primary shopping areas.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP7; NPPF
source-text: A proposal for main town centre uses of more than 600m2 net internal floor space that are
  outside of defined town centres. A proposal for retail uses of more than 600m2 net internal floor space
  that are outside of defined primary shopping areas.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 9. Listed as ''Retail Sequential Approach / Impact Assessment''.'
review-status: unverified
field-status: {}
