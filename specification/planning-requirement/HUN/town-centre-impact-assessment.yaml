reference: town-centre-impact-assessment
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside defined town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 600
      description: More than 600m2 net internal floorspace.
source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
source-text: A proposal for main town centre uses of more than 600m2 net internal floor space that are
  outside of defined town centres.
confidence: medium
notes: 'Audit (wrong_app_type): PP and OPP only. Covers the sequential test and impact assessment.'
review-status: unverified
field-status: {}
