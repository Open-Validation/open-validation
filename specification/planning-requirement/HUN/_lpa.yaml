  date: 2024-02-09
  date-basis: 'PDF metadata: the planning permission (including change of use) checklist was created 9
    February 2024 (no date is printed in it; its text cites the NPPF (2019) and ''As at May 2019''). Huntingdonshire
    publishes one validation checklist per application type on its Guidance, Checklists and Advice Notes
    page (https://www.huntingdonshire.gov.uk/planning/planning-applications/apply-for-planning-permission-listed-building-consent/guidance-checklists-and-advice-notes/);
    on 2026-11-06 that page linked these files: planning permission and outline (both 9 February 2024,
    new links replacing the older /media/5514 and /media/5513 files that MHCLG''s register still lists),
    reserved matters (15 March 2023), and householder, listed building, advertisement, lawful development,
    hedgerow, section 73 and tree works (July 2021), plus a Policy Guidance Checklist. No newer list or
    consultation was found on the council''s site. Published more than two years ago, so outdated, but
    still the council''s current checklists. Each requirement file cites the checklist its wording comes
    from.'
  status: outdated
submission-standards:
- item: Written (metric) dimensions on drawings
  level: must
- item: Revisions clearly shown on drawings (e.g. Revision A)
  level: should
- item: The validation checklist and the Policy Guidance Checklist (policy tick sheet) submitted with
    the application, marking items not relevant as n/a
  level: must
- item: 'Listed building consent: no electronic links to websites or products on drawings; drawings show
    only the works applied for (no old drawings from previous applications) and are of quality sufficient
    to scan'
  level: must
- item: 'Listed building consent: photographs are helpful supplementary information but not a replacement
    for drawings'
  level: should
