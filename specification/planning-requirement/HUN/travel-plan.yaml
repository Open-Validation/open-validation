reference: travel-plan
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 80
        description: 80 or more dwellings (Residential Travel Plan).
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1000
        description: 1000m2 or more of retail.
    - discretionary
source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
source-text: 'Transport Assessment & Travel Plan … A proposal that includes: 1000m2 or more for retail
  OR 2500m2 for employment OR 50 rooms + for hotels OR 100+bedrooms for residential homes OR 50 residential
  dwellings OR all leisure and 2500m2 or more for Health care and education.'
confidence: low
notes: 'Audit (wrong_trigger): from the audit, 80+ dwellings for a Residential Travel Plan; the checklist
  groups the Travel Plan with the Transport Assessment thresholds. Check which applies.'
review-status: unverified
field-status: {}
