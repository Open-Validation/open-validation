reference: heritage-statement
local-authority: HUN
required-if:
  any:
  - all:
    - any:
      - application-type:
          in:
          - full
          - change-of-use
          - hh
          - outline-all
          - outline-some
      - all:
        - application-type:
            in:
            - reserved-matters
        - any:
          - condition:
              field: reserved-matters-sought
              value: access
              description: The application seeks approval of access.
          - condition:
              field: reserved-matters-sought
              value: appearance
              description: The application seeks approval of appearance.
          - condition:
              field: reserved-matters-sought
              value: layout
              description: The application seeks approval of layout.
          - condition:
              field: reserved-matters-sought
              value: scale
              description: The application seeks approval of scale.
          - condition:
              field: reserved-matters-sought
              value: landscaping
              description: The application seeks approval of landscaping.
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        - locally-listed-building
        - scheduled-monument
        - park-and-garden
        - archaeological-priority-area
        description: The significance of a heritage asset (or its setting) is affected by the proposal.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - listed-building
        description: 'Advertisement consent: the property is a Listed Building.'
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP34; NPPF
source-text: Where the significance of any heritage asset is affected by the proposal, a statement that
  describes the significance of any heritage assets affected, including any contribution made by their
  setting, is required.
must-include:
- item: Describes the significance of any heritage assets affected, including any contribution made by
    their setting
  level: must
- item: Detail proportionate to the assets' importance and no more than sufficient to understand the potential
    impact
  level: should
- item: Reference to the relevant historic environment record, and appropriate expertise where necessary
  level: should
- item: 'In or adjoining a Conservation Area, or demolition in one: how the proposal would preserve or
    enhance its character or appearance, including views into and out of the area'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Development in or adjoining a Conservation Area, or demolition in a Conservation Area.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 6; advertisement consent checklist page 3. Statements should
  consider all historic assets, designated or not, so the site list includes locally listed buildings
  and archaeological areas.'
review-status: unverified
field-status: {}
