reference: recreation-facilities-assessment
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-all
      - outline-some
  - any:
    - site:
        in:
        - open-space
        description: Development within open spaces.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Major residential development (10 or more homes).
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Major residential development (site of 0.5ha or more where the number of homes is
          not known).
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP32; Developer Contributions SPD (December
  2011)
source-text: Applications for development within open spaces and/or major residential development
must-include:
- item: Whether the open space, buildings or land are surplus to requirements; or the loss would be replaced
    by equivalent or better provision; or the development is for alternative sports and recreation provision
    whose need clearly outweighs the loss
  level: must
- item: 'Major residential development: the contributions towards outdoor playing space and informal open
    space to be provided'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Major residential development.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Major residential development.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 8. ''Major'' uses the checklist''s own definition. Can be part
  of a Planning or Design and Access Statement.'
review-status: unverified
field-status: {}
