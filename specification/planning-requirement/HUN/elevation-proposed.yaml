reference: elevation-proposed
local-authority: HUN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: appearance
          description: The application seeks approval of appearance.
      - condition:
          field: reserved-matters-sought
          value: scale
          description: The application seeks approval of scale.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications. Where there is an existing elevation where there will be no proposed works
  then photos of this elevation are acceptable.
must-include:
- item: All sides of the proposal shown with written dimensions, at 1:50 or 1:100
  level: must
- item: The proposed works shown accurately in relation to what is already there
  level: must
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: 'Where a proposed elevation adjoins or is close to another building: the physical relationship
    between them and the positions of openings on each property'
  level: should
- item: 'For advertisements: photographs with the proposed advertisements superimposed to scale may be
    submitted instead'
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 4; reserved matters checklist page 3. For reserved matters
  only where appearance or scale is sought.'
review-status: unverified
field-status: {}
