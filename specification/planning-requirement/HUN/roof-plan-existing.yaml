reference: roof-plan-existing
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - hh
        - lbc
    - condition:
        field: building-works
        value: true
        description: There are changes to the existing building(s), or new buildings.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications except where there are no changes to the existing building(s)
must-include:
- item: The shape of the roof, particularly where its appearance and shape change, at 1:50 or 1:100
  level: must
- item: The position of all ridges, valleys, dormer windows, roof lights and other features such as chimneys
    or raised parapets
  level: must
