reference: section-proposed
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - hh
        - lbc
        - ldc-existing-use
        - ldc-prospective-use
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: There is (or will be) a difference in ground levels across the site and/or with
            adjoining land.
      - condition:
          field: distance-to-site-boundary
          operator: <=
          value: 0.3
          description: The development is within 300mm of the site boundary.
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: access
          description: The application seeks approval of access.
      - condition:
          field: reserved-matters-sought
          value: appearance
          description: The application seeks approval of appearance.
      - condition:
          field: reserved-matters-sought
          value: layout
          description: The application seeks approval of layout.
      - condition:
          field: reserved-matters-sought
          value: scale
          description: The application seeks approval of scale.
      - condition:
          field: reserved-matters-sought
          value: landscaping
          description: The application seeks approval of landscaping.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where there is (or proposes to be) a difference in ground levels across the site and/or with
  adjoining land Or Where the development is within 300mm of the site boundary
must-include:
- item: Cross sections through the building, particularly where common boundaries are involved, with written
    dimensions, at 1:50 or 1:100
  level: must
- item: 'Where ground levels change: a plan of existing and proposed levels, including how encroachment
    of foundations and eaves is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: 'Finished floor and site levels: how new buildings and external areas relate to existing/proposed
    site levels and neighbouring development'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A difference in ground levels across the site and/or with adjoining land.
  source-text: Plans should demonstrate how proposed new buildings and external areas relate to existing/proposed
    site levels and neighbouring development.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 9; reserved matters checklist page 5. Includes the checklist''s
  separate ''Finished Floor and Site Levels'' row (same trigger). The reserved matters checklist lists
  site sections for all matters.'
review-status: unverified
field-status: {}
