reference: air-quality-assessment
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-all
      - outline-some
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 200
        description: Proposals for 200 or more dwellings.
    - site:
        in:
        - air-quality-management-area
        description: Site is within an Air Quality Management Area (AQMA), or within 50m of an AQMA or
          a Clean Air Zone (CAZ).
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP36
source-text: Proposals for 200 or more dwellings OR Site is within an Air Quality Management Area (AQMA)
  OR Site is within 50m of AQMA or a Clean Air Zone (CAZ)
must-include:
- item: Information as necessary to allow full consideration of the impact on the air quality of the area,
    supported by a technical report
  level: must
- item: Carried out by a suitably qualified person
  level: must
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 2. The 50m distance from an AQMA or CAZ is shown with the AQMA
  designation.'
review-status: unverified
field-status: {}
