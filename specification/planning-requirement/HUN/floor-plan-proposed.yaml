reference: floor-plan-proposed
local-authority: HUN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: layout
          description: The application seeks approval of layout.
      - condition:
          field: reserved-matters-sought
          value: scale
          description: The application seeks approval of scale.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Existing and proposed floor plans at 1:50 or 1:100, with written dimensions
  level: must
- item: The proposal in detail, with existing buildings or walls to be demolished clearly identified
  level: must
- item: All existing and proposed rooms labelled
  level: should
- item: 'For listed building consent: the entire floor plan (part plans are not acceptable)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: The proposed alterations need to be understood in the context of the entire floor plan
    therefore part plans are not acceptable.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 6; reserved matters checklist page 4. For reserved matters
  only where layout or scale is sought.'
review-status: unverified
field-status: {}
