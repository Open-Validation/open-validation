reference: landscaping-plan
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: landscaping
          description: The application seeks approval of landscaping.
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - condition:
        field: landscaping-works
        value: true
        description: Where a replacement (replanting) is proposed.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policies LP3, LP11, LP12 and LP31
source-text: All development proposals that include areas of public and private open space within the
  site boundary; the treatment of which is judged likely to affect the character of the site itself and/or
  its surrounding area. These details can be included in a Design and Access Statement under a clearly
  defined heading/details.
must-include:
- item: The planting scheme, with species, spacing, number and height at planting
  level: must
- item: Existing trees and hedgerows to be retained and protected during construction
  level: must
- item: Implementation, long term maintenance and management of the soft landscape works
  level: must
- item: 'Hedgerow removal: details of any proposed replacement or replanting'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
  source-text: Details of any proposed replacement or replanting
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 7; reserved matters checklist page 4; hedgerow removal checklist
  page 1. For planning permission it applies to proposals with public and private open space whose treatment
  ''is judged likely to affect the character'' of the site or area, so shown as discretionary.'
review-status: unverified
field-status: {}
