reference: design-and-access-statement
local-authority: HUN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.huntingdonshire.gov.uk/media/5512/application-for-lb.pdf
source-text: All applications Design and Access Statement All applications
confidence: low
notes: 'LBC: all applications. From the audit: householder in a conservation area with 1+ dwelling or
  100m2+. The full, outline and reserved matters excerpts describe the statement but not when it is needed,
  so they are shown as officer judgement.'
review-status: unverified
field-status: {}
