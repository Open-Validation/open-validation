reference: design-and-access-statement
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline-all
        - outline-some
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: The site is in a Conservation Area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: The application is for 1 or more dwelling houses.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: The floor space created is 100m² or more.
  - all:
    - application-type:
        in:
        - hh
    - all:
      - site:
          in:
          - conservation-area
          description: The site is in a Conservation Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The application is for 1 or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: The floor space created is 100m² or more.
  - application-type:
      in:
      - lbc
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All Major developments. Or If in the site is in a Conservation Area and the application is
  for 1 or more dwelling houses or the floor space created is 100m2+ Or A Listed Building Consent Application
  Not required for change of use, replacement planning permission or engineering works.
must-include:
- item: Explains how the development is a suitable response to the site and its setting and shows it can
    be adequately accessed by prospective users
  level: must
- item: 'For listed building consent: the design principles and concepts, how the context was appraised,
    and how the design takes account of the building''s special architectural or historic importance,
    the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Explain the design principles and concepts that have been applied to the development. Demonstrate
    the steps that have been taken to appraise the context of the development and how the design of the
    development takes that context into account in relation to the proposed use. • Include how you have
    taken account of (a) the special architectural or historic importance of the building (b) the particular
    physical features of the building that justify its designation as a listed building AND c) the building’s
    setting.
- item: 'For listed building consent: where an aspect of the design could affect this adversely, why it
    is necessary and what has been done to minimise its impact'
  level: should
  required-if:
    application-type:
      in:
      - lbc
  source-text: Where an aspect of the design has the potential to affect this adversely, you should explain
    why this is necessary and what measures have been taken to minimise its impact
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 4; listed building consent checklist page 2. Not required for
  change of use, replacement planning permission or engineering works. The householder checklist asks
  for it only in a Conservation Area (1 or more dwellings or 100m²+); the reserved matters checklist for
  all matters on the same conditions; listed building consent for all applications.'
review-status: unverified
field-status: {}
