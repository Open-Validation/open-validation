reference: lighting-assessment
local-authority: HUN
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - any:
      - site:
          in:
          - listed-building
          - conservation-area
          - rural-area
          description: Near a listed building or a conservation area, or in open countryside.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Externally illuminated signage.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
source-text: … listed building or a conservation area, or open countryside, where external lighting would
  be provided or made necessary by the development … Lighting Assessment For any external illuminated
  signage Must provide details of external lighting and the proposed hours when the lighting would be
  switched on.
must-include:
- item: Details of the external lighting and the hours when it would be switched on
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: The start of the full-planning trigger is cut off (it likely also covers residential property),
  so other cases are shown as officer judgement.
review-status: unverified
field-status: {}
