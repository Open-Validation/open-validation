reference: lighting-assessment
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - any:
      - site:
          in:
          - listed-building
          - conservation-area
          - rural-area
          description: In the vicinity of a listed building, a conservation area, or open countryside.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: In the vicinity of residential property.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Any external illuminated signage.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policies LP12 and LP14
source-text: Proposals involving the provision of publicly accessible developments, in the vicinity of
  residential property, a listed building or a conservation area, or open countryside, where external
  lighting would be provided or made necessary by the development
must-include:
- item: Details of external lighting and the hours when it would be switched on
  level: must
- item: A layout plan with beam orientation and a schedule of the equipment design
  level: must
- item: 'Advertisements: an assessment of light spillage, hours and levels of illumination, column heights,
    specification and colour, lamps and luminaires, full horizontal cut off, no distraction to the highway,
    impact on nearby dwellings, demountable columns, screening and planting'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: An assessment that covers matters such as light spillage, hours of illumination, light
    levels, column heights, specification and colour, treatment for lamps and luminaries, the need for
    full horizontal cut off, no distraction to the highway, levels of impact on nearby dwellings, use
    of demountable columns, retention of screening vegetation, use of planting and bunding to contain
    lighting effects should also be submitted.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 7; advertisement consent checklist page 4. ''Publicly accessible
  developments'' near the listed places are shown with the designations; other cases are discretionary.'
review-status: unverified
field-status: {}
