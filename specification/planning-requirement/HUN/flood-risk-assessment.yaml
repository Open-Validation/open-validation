reference: flood-risk-assessment
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: New development in Flood Zone 2 or 3.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or more in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or more in Flood Zone 1.
source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
source-text: Flood Risk Assessment Planning applications for development proposals of 1ha or greater in
  Flood Zone 1 and all proposals for new development located in Flood Zones 2 and 3 to be accompanied
  by a … Flood Risk Assessment for householders is only required in Flood Zones 2 and 3. (A tick box form
  can be used and is available here) Please also include mitigation measures.
must-include:
- item: Mitigation measures
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'Audit (missing_requirement, wrong_app_type): also on the Full checklist; not reserved matters.
  A tick-box form can be used for householder development and non-domestic extensions up to 250sqm.'
review-status: unverified
field-status: {}
