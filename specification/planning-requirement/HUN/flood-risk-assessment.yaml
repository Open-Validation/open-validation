reference: flood-risk-assessment
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline-all
        - outline-some
    - any:
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 1
            description: Development proposals of 1ha or greater in Flood Zone 1.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 1
            description: Development proposals of 1ha or greater in Flood Zone 1.
      - site:
          in:
          - flood-risk-zone
          description: New development located in Flood Zones 2 and 3.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: 'Householder: Flood Zones 2 and 3.'
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP5; NPPF
source-text: Planning applications for development proposals of 1ha or greater in Flood Zone 1 and all
  proposals for new development located in Flood Zones 2 and 3 to be accompanied by a Flood Risk Assessment
  (FRA). Planning applications for all proposals for new development located in Flood Zones 2 and 3 should
  be accompanied by a Flood Risk Assessment (FRA).
must-include:
- item: 'Householder development and non-domestic extensions up to 250sqm: the council''s tick box form
    can be used'
  level: should
- item: Uses the council's Strategic Flood Risk Assessment with the Environment Agency flood zone maps
  level: should
- item: 'Householder: mitigation measures'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Please also include mitigation measures.
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 5; householder checklist page 3. The checklist adds that the
  Middle Level Commissioners and associated Boards have their own requirements for an FRA in Fen areas.'
review-status: unverified
field-status: {}
