reference: roof-plan-proposed
local-authority: HUN
required-if:
  any:
  - application-type:
      in:
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes the existing building(s).
source-url: https://www.huntingdonshire.gov.uk/media/5512/application-for-lb.pdf
source-text: Roof plans as existing and proposed (1:50 or 1:100 scale measured drawings) All applications
  except where there are no changes to the existing building(s) Plan to show the shape of the roof particularly
  when development includes changes to its appearance and shape.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: The shape of the roof, including ridges, valleys, dormer windows, roof lights and other features
    such as chimneys or raised parapets
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): also on the Householder checklist. Reserved matters asks
  for proposed roof plans.'
review-status: unverified
field-status: {}
