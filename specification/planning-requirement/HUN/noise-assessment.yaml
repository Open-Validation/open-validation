reference: noise-assessment
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline-all
        - outline-some
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Applications that raise issues of disturbance by noise to occupants of nearby existing
            buildings.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise-sensitive developments close to existing sources of noise.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP14
source-text: Applications that raise issues of disturbance by noise to occupants of nearby existing buildings
  and for developments that are considered to be noise sensitive and which are close to existing sources
  of noise.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Noise levels and any proposed mitigation measures
  level: must
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 8. The householder checklist lists it under ''further information
  we may require in some applications'' (discretionary).'
review-status: unverified
field-status: {}
