reference: site-plan
local-authority: HUN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
      - outline-all
      - outline-some
      - lbc
      - advertising
  - all:
    - application-type:
        in:
        - reserved-matters
    - any:
      - condition:
          field: reserved-matters-sought
          value: access
          description: The application seeks approval of access.
      - condition:
          field: reserved-matters-sought
          value: layout
          description: The application seeks approval of layout.
      - condition:
          field: reserved-matters-sought
          value: scale
          description: The application seeks approval of scale.
      - condition:
          field: reserved-matters-sought
          value: landscaping
          description: The application seeks approval of landscaping.
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - condition:
        field: building-works
        value: true
        description: Applications for works or extension(s).
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Drawn at 1:200 or 1:500 (flexible depending on the nature and scale of the development)
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with all written dimensions including those to boundaries
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees on the site and on adjacent land that could influence or be affected
    by the development
  level: must
- item: The extent and type of any hard surfacing, and existing and proposed boundary treatment
  level: must
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 3; reserved matters checklist page 3; lawful development certificate
  checklist page 2. Required on every checklist except reserved matters (only for access, layout, scale
  or landscaping) and lawful development (only for works or extensions). The checklist notes that Ordnance
  Survey plans do not always show boundaries and buildings accurately.'
review-status: unverified
field-status: {}
