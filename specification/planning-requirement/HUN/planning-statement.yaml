reference: planning-statement
local-authority: HUN
required-if:
  any:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-all
      - outline-some
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
source-text: All applications
must-include:
- item: The context and need for the proposed development and how it accords with relevant national and
    local planning policies
  level: should
- item: Details of any pre-application consultations with the council, the wider community, statutory
    consultees and neighbours
  level: should
- item: The possible detrimental impact on existing infrastructure, and any improvements required
  level: should
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 8; lawful development certificate checklist page 3. Also listed
  for lawful development certificates (''Lawful and Proposed''). For major applications a separate statement
  of community involvement ''may be appropriate''. The householder checklist lists it under ''further
  information we may require''.'
review-status: unverified
field-status: {}
