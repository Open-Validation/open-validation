reference: affordable-housing-statement
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-all
      - outline-some
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: Sites of 11 or more homes.
    - condition:
        field: housing-floorspace
        operator: '>='
        value: 1001
        description: 1,001m² or more residential floorspace (gross internal area).
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP24
source-text: Where a proposal for residential development exceeds the relevant thresholds for affordable
  housing in local planning policies. The Affordable Housing Statement can be included in a Planning Statement
  under a clearly defined heading
must-include:
- item: The amount, location and tenure of the affordable units (statement/plan)
  level: must
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 2. The thresholds are from the checklist''s guidance column
  (LP24 target of 40% on sites of 11 or more homes or 1,001m² residential floorspace). Can be part of
  a Planning Statement under a clear heading.'
review-status: unverified
field-status: {}
