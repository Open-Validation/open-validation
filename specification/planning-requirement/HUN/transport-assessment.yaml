reference: transport-assessment
local-authority: HUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline-all
        - outline-some
    - any:
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 1000
          description: 1000m² or more for retail.
      - condition:
          field: office-floorspace
          operator: '>='
          value: 2500
          description: 2500m² for employment (offices).
      - condition:
          field: industrial-floorspace
          operator: '>='
          value: 2500
          description: 2500m² for employment (industrial).
      - condition:
          field: warehousing-floorspace
          operator: '>='
          value: 2500
          description: 2500m² for employment (warehousing).
      - all:
        - condition:
            field: hotel-development
            value: true
            description: Hotels.
        - condition:
            field: bedroom-count
            operator: '>='
            value: 50
            description: 50 rooms or more.
      - condition:
          field: residential-capacity
          operator: '>='
          value: 100
          description: 100+ bedrooms for residential homes.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: 50 residential dwellings.
      - condition:
          field: entertainment-leisure-use
          value: true
          description: All leisure.
      - all:
        - any:
          - condition:
              field: use-class
              value: medical-health-services
              description: Health care.
          - condition:
              field: use-class
              value: learning-non-residential-institution
              description: Education.
        - condition:
            field: floorspace
            operator: '>='
            value: 2500
            description: 2500m² or more for health care and education.
      - condition:
          field: traffic-movements-peak-hour
          operator: '>'
          value: 100
          description: More than 100 vehicles visit the site in an hour.
      - condition:
          field: hgv-movements-daily
          operator: '>'
          value: 20
          description: More than 20 HGV vehicles visit the site in one day.
      - condition:
          field: night-time-servicing
          value: true
          description: HGVs access the site between midnight and 06:00.
  - all:
    - application-type:
        in:
        - full
        - change-of-use
    - ref: major-development
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policies LP16 and LP17
source-text: 'A proposal that includes: 1000m2 or more for retail OR 2500m2 for employment OR 50 rooms
  + for hotels OR 100+bedrooms for residential homes OR 50 residential dwellings OR all leisure and 2500m2
  or more for Health care and education. Other circumstances may be where more than 100 vehicles visit
  the site in an hour OR more than 20 HGV vehicles visit the site in one day OR if HGV’s are accessing
  the site between the hours of midnight and 06:00. A proposal for major development below the thresholds
  set out above for a Transport Assessment.'
