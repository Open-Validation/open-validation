reference: land-contamination-assessment
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline-all
      - outline-some
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP37
source-text: Where contamination is known or suspected, or the proposed use would be particularly vulnerable.
must-include:
- item: Information as necessary to determine whether the site is, or can be made, suitable for the proposed
    use/development
  level: must
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 6. Listed as ''Ground Contamination and/or Groundwater Pollution
  Investigation''.'
review-status: unverified
field-status: {}
