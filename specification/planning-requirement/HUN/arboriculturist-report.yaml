reference: arboriculturist-report
local-authority: HUN
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - hh
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Existing or proposed trees on or adjacent to the site.
    - condition:
        field: hedgerows-affected
        value: true
        description: Adverse impacts are possible on hedges or hedgerows on or adjacent to the site.
source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
policy: Huntingdonshire Local Plan to 2036 (May 2019) policy LP31; BS5837:2012
source-text: Where investigations show that adverse impacts are possible on trees, woodland, hedges or
  hedgerows on or adjacent site. Can be included in a Design and Access Statement under a clearly defined
  heading Where there will be any existing/ proposed trees on/adjacent the site
must-include:
- item: A statement covering parts a and b of Local Plan policy LP31
  level: must
- item: A Tree Protection Plan where there are existing or proposed trees on or adjacent to the site
  level: must
- item: 'Where there will be any adverse impact on trees: an Arboricultural Assessment and Tree Protection
    Plan by a suitably qualified and experienced arboricultural expert, to BS5837:2012'
  level: must
  required-if:
    any:
    - condition:
        field: tree-removal
        value: true
        description: Trees will be removed.
    - discretionary
  source-text: Where there will be any adverse impact on trees
confidence: medium
notes: 'From the council''s list (published 9 February 2024: PDF date, no date printed), planning permission
  (including change of use) checklist page 10; householder checklist page 5. Three ''Trees, Woodland,
  Hedges and Hedgerows'' rows (assessment, protection plan, assessment and protection plan). ''Adverse
  impact'' other than tree removal is shown as discretionary.'
review-status: unverified
field-status: {}
