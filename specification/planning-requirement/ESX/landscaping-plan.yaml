reference: landscaping-plan
local-authority: ESX
required-if: discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 131-141 (Achieving well-designed places) and 210
source-text: Depending on the proposal, a full landscape scheme may be required at validation stage. Alternatively,
  following the validation and consideration of the application, further landscape details may be required.
must-include:
- item: Proposed materials and design details of all existing and proposed external landscape works, hard
    (e.g. paving, benches, fencing) and soft (e.g. planting)
  level: must
- item: New landscape features to compensate for any lost to the development, where relevant
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 24-26. The list's 'L2 – Landscape Details'
  asks for landscape information for applications in or affecting the setting of the High Weald AONB,
  the Sussex Heritage Coast or the South Downs National Park, others that could affect the landscape,
  and those affecting an existing landscaping scheme. It says a full landscape scheme 'may be required
  at validation stage', or later, so the scheme shows as discretionary. The Landscape and Visual Impact
  Assessment has no matching id (see the unmapped list).
