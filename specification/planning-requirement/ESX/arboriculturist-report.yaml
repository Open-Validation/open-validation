reference: arboriculturist-report
local-authority: ESX
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on the site or on adjacent land that could influence or be affected by the development
      (including street trees).
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 193 (for Ancient Woodlands and aged and veteran trees outside A.Ws.)
source-text: Proposals which have the potential to affect existing trees, including trees within the application
  site or on land adjacent to it that could influence or be affected by the development (including street
  trees).
must-include:
- item: Which trees are to be removed and which retained
  level: must
- item: Tree protection measures during construction works
  level: must
- item: Prepared by a qualified arboriculturist
  level: should
- item: Trees that may need surgery to accommodate the development, and how this will be carried out in
    line with best practice
  level: should
- item: Effect on soils, close to Ancient Woodland
  level: should
  required-if:
    site:
      in:
      - ancient-woodland
      description: Close to Ancient Woodland.
confidence: medium
notes: From the council's list (published April 2025), page 34-35. The list's 'T3 – Tree Survey / Arboricultural
  Implications / Implications for Ancient Woodland'.
review-status: unverified
field-status: {}
