reference: section-existing
local-authority: ESX
required-if:
  all:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change to site levels or finished floor levels is proposed.
  - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In addition, other drawings may also be required (dependent on the type of application),
  if deemed necessary to describe the development. ... Existing and proposed site sections and finished
  floor and site levels, where a change is proposed.
must-include:
- item: How the development relates to existing site levels and adjacent development, with levels related
    to a fixed datum point off site
  level: must
- item: Existing and proposed foundations and eaves, where a change is proposed
  level: must
- item: How encroachment onto adjoining land is to be avoided
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 6. The list says these drawings 'may also
  be required (dependent on the type of application), if deemed necessary to describe the development',
  so they show as discretionary. Plans must be drawn to an identified scale and show North.
review-status: unverified
field-status: {}
