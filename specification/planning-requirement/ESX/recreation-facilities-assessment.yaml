reference: recreation-facilities-assessment
local-authority: ESX
required-if:
  site:
    in:
    - open-space
    description: Within public open space, or other open space used for recreation and as playing fields.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 97
source-text: All planning applications involving development within public open spaces, also other open
  spaces used for recreation and as playing fields, unless the development is very minor and the PP&DM
  team has confirmed in writing that the Assessment is not necessary.
must-include:
- item: Plans of any existing or proposed open space or playing fields within or adjoining the site, including
    Rights of Way
  level: must
- item: An independent assessment showing whether the land or buildings are surplus to local requirements
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 30. The list's 'O2 – Open Space/ Playing Field
  Provision Assessment'. Not needed if the development is very minor and the team has confirmed this in
  writing.
review-status: unverified
field-status: {}
