reference: water-impact-assessment
local-authority: ESX
required-if:
  any:
  - condition:
      field: dewatering-or-abstraction
      value: true
      description: De-watering below the water table.
  - condition:
      field: landfill-development
      value: true
      description: Land-filling.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: The EU Water Framework Directive 2000, and as recommended by Natural England; NPPF paragraph 196
source-text: Certain landfill proposals and mineral winning and working, as discussed with the Planning
  Policy & Development Management Team. A Hydrogeological Report should be submitted where de-watering
  below the water table or land-filling is proposed. A Hydrological Report may be required where mineral
  development is proposed above the water table.
must-include:
- item: How the water table and any underground aquifers would be affected, and effects on salinity, the
    water level and the flow of water in nearby water bodies
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 23. The list's 'H2 – Hydrogeological Report/
  Hydrological Report'. A hydrological report 'may be required' for mineral development above the water
  table, and other landfill and mineral working proposals are 'as discussed' with the team, so those parts
  show as discretionary.
review-status: unverified
field-status: {}
