reference: location-plan
local-authority: ESX
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The following items will be required for all applications unless otherwise stated.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At an identified standard metric scale (typically 1:1250 or 1:2500)
  level: should
- item: Scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, car parking and open areas around
    buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 4-5. The list covers every application the
  county council decides (minerals, waste and the council's own development), so 'all applications' is
  shown as those application types.
review-status: unverified
field-status: {}
