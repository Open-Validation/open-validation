reference: application-form
local-authority: ESX
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications will need to be presented on the relevant standard application form (1App)
must-include:
- item: The appropriate ownership certificate (A, B, C or D), confirming that notice has been served on
    any other owners
  level: must
  source-text: All applications for planning permission must include the appropriate certificate of ownership
- item: 'The agricultural holdings declaration: any agricultural tenants notified before submission, or
    no agricultural tenants on the site'
  level: must
  source-text: Applicants must certify that they have notified any agricultural tenants about their application,
    or that there are no agricultural tenants on the site.
confidence: medium
notes: From the council's list (published April 2025), page 4, 6. The list covers every application the
  county council decides (minerals, waste and the council's own development), so 'all applications' is
  shown as those application types. The fee is also a national requirement (see the unmapped list).
