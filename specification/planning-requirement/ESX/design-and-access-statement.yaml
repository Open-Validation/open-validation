reference: design-and-access-statement
local-authority: ESX
required-if:
  all:
  - application-type:
      in:
      - reg-3
      - lbc
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area (conservation area or World Heritage Site).
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with a floorspace of 100 square metres or more.
    - application-type:
        in:
        - lbc
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Article 2 and Article 9, Town and Country Planning (Development Management Procedure) (England)
  Order 2015
source-text: 'A Design and Access Statement must accompany: • All major development applications (as defined
  in Article 2 of the Town and County Planning (Development Management Procedure (England) Order 2015.
  • Applications for development in a designated area where the development consists of; - One or more
  dwellings - A building or buildings with a floorspace of 100 square metres or more • Applications for
  Listed Building Consent Applications for waste development, a material change of use, amendments to
  conditions attached to planning permissions, engineering or mining operations do not need to be accompanied
  by a Design and Access Statement.'
confidence: medium
notes: From the council's list (published April 2025), page 7. Waste development, a material change of
  use, amendments to conditions, and engineering or mining operations do not need one, so the rule is
  limited to the council's own (Regulation 3) development and listed building consent.
review-status: unverified
field-status: {}
