reference: archaeological-assessment
local-authority: ESX
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: In an Archaeological Notification Area (East Sussex Historic Environment Record).
    - condition:
        field: ground-disturbance
        value: true
        description: Development involving groundworks.
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: Significant groundworks outside the areas above.
    - discretionary
  - site:
      in:
      - historic-environment-record
      description: The site includes or may include a heritage asset with archaeological potential.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 202-221 (Conserving and enhancing the historic environment)
source-text: All planning applications for development involving groundworks which affect land in an Archaeological
  Notification Area as defined on the East Sussex Historic Environment Record (ESHER) • All planning applications
  for development (including all major development) outside any of the areas listed above that would involve
  significant groundworks, subject to advice from the Planning Development Control team/County Archaeologist.
  ... Where an application site includes or has the potential to include a heritage asset with archaeological
  potential, a desk based assessment should be submitted with the planning application.
confidence: medium
notes: From the council's list (published April 2025), page 22-23. A desk based assessment. Significant
  groundworks elsewhere (including all major development) need one 'subject to advice from the Planning
  Development Control team/County Archaeologist', so that part shows as discretionary.
review-status: unverified
field-status: {}
