reference: transport-assessment
local-authority: ESX
required-if:
  condition:
    field: traffic-movements-daily
    operator: '>'
    value: 0
    description: New or an increased number of traffic movements, temporary (e.g. during construction)
      or permanent.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF Paragraph 105
source-text: Proposals which would have an effect on traffic generation, including those involving new
  or an increased number of traffic movements, either for a temporary period (e.g. during construction)
  or on a more permanent basis.
must-include:
- item: 'For smaller schemes: an outline of the transport aspects of the application'
  level: should
- item: 'For major proposals: accessibility to the site by all modes and the likely modal split of journeys'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: measures to improve access by public transport, walking and cycling'
  level: must
  required-if:
    ref: major-development
- item: 'For major proposals: appropriate vehicle and cycle parking, and measures to mitigate transport
    impacts'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published April 2025), page 32. The list's 'T1 – Transport Assessment/
  Statement/ Report'; coverage should reflect the scale of the development.
review-status: unverified
field-status: {}
