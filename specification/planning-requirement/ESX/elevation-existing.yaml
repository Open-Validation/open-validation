reference: elevation-existing
local-authority: ESX
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: A new building.
    - condition:
        field: external-alterations
        value: true
        description: Elevations would be created or altered.
  - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In addition, other drawings may also be required (dependent on the type of application),
  if deemed necessary to describe the development. ... Existing and proposed elevations, showing clearly
  the proposed works in relation to what is already there and for any elevations that would be created
  or altered by the development proposal.
must-include:
- item: The proposed works shown clearly in relation to what is already there
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the two
    buildings and the positions of the openings on each'
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 5. The list says these drawings 'may also
  be required (dependent on the type of application), if deemed necessary to describe the development',
  so they show as discretionary. Plans must be drawn to an identified scale and show North.
review-status: unverified
field-status: {}
