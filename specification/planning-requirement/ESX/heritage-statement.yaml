reference: heritage-statement
local-authority: ESX
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - park-and-garden
      - battlefield
      - protected-wreck-site
      - scheduled-monument
      description: Relating to or impacting on a designated heritage asset.
  - site:
      in:
      - locally-listed-building
      description: Relating to or impacting on a locally listed heritage asset.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 202-221 (Conserving and enhancing the historic environment)
source-text: All applications for Listed Building Consent or Conservation Area Consent. • All applications
  for development relating to or impacting on a designated heritage asset (designated heritage assets
  in East Sussex are Conservation Areas, Listed Buildings, Registered Parks or Gardens, Registered Battlefields,
  Protected Wreck Sites, Scheduled Ancient Monuments). ... All applications for development relating to
  or impacting on a locally listed heritage asset
must-include:
- item: A full description of the affected heritage asset and an analysis of its archaeological, architectural,
    historical, artistic or other significance
  level: must
- item: A schedule of works affecting the feature, its site and setting
  level: must
- item: An assessment of the impact on the special character of the feature, its setting and that of adjacent
    heritage assets (scale and nature of development, depths of foundations, landscaping, demolition,
    drainage)
  level: must
- item: Justification for the proposals, with any mitigation measures
  level: must
- item: 'For a listed building or scheduled ancient monument: the grade and the text of the listing or
    monument description'
  level: should
  required-if:
    site:
      in:
      - listed-building
      - scheduled-monument
      description: Affects a listed building or scheduled ancient monument.
confidence: medium
notes: From the council's list (published April 2025), page 21-23. The list's 'H1 – Heritage Statement'.
  Archaeology is in archaeological-assessment.
review-status: unverified
field-status: {}
