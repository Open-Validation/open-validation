reference: bng-metric
local-authority: ESX
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (as inserted by Schedule 14 of the Environment
  Act 2021)
source-text: 'All applications except those subject to an exemption as summarised below and explained
  in greater detail here: • Major applications made before 12/02/24 • Non-major applications made before
  02/04/24 • Reserved matters where outline application approved before 12/02/24 • Variation to existing
  permissions made/approved before 12/02/24 • Retrospective planning permission • Permitted Development/development
  order • de minimis – impacting less than 25 square metres (5m x 5m) of on-site habitat or 5m of on-site
  linear habitat that is not priority habitat (as listed here) • Urgent Crown development • Biodiversity
  gain sites'
must-include:
- item: Completed Statutory Biodiversity Metric showing the pre- and post-development biodiversity value
    of on-site and any off-site habitats on the date of application (or an earlier date), in Excel format
  level: must
- item: 'Where an earlier date is proposed: the proposed earlier date and the reasons for it'
  level: must
- item: Completed habitat condition assessment sheets (or equivalent)
  level: must
- item: Evidence of competency in undertaking UKHab field survey and the Metric
  level: must
- item: The correct Metric (Small Sites Metric or full Statutory Metric) for the scale of development
    and any priority habitats or protected species
  level: should
- item: The Statutory Metric, not the Small Sites Metric, where a protected site (including SSSI, LNR,
    LWS or LGS) is present on site
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 11-14. The list says 'All applications except
  those subject to an exemption'; the rule follows the law (the biodiversity gain condition), which covers
  the exemptions it lists. The statement on whether BNG applies, the irreplaceable habitat description
  and the draft Biodiversity Gain Plan have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
