reference: air-quality-assessment
local-authority: ESX
required-if:
  any:
  - discretionary
  - all:
    - site:
        in:
        - air-quality-management-area
        description: In an Air Quality Management Area.
    - discretionary
  - all:
    - site:
        in:
        - site-of-special-scientific-interest
        description: An environmentally sensitive area, e.g. a SSSI.
    - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 192
source-text: Proposals that would be likely to impact on air quality through odour, dust, fumes, bio-aerosols,
  or significant traffic generation, (e.g. a composting site, asphalt plant, recycling operation, energy
  from waste plant). ... • Proposals that are likely to further reduce air quality within an existing
  Air Quality Management Area (AQMA) • Proposals where the development would result in the designation
  of an AQMA, or would conflict with or render unworkable a local authority’s air quality action plan.
  • Proposals that would be likely to impact on the air quality of an environmentally sensitive area,
  e.g. a SSSI.
must-include:
- item: An assessment of current air quality
  level: must
- item: The predicted effect of the scheme on air quality, including the number of people exposed to a
    change, with all assumptions and timescales clearly identified
  level: must
- item: An explanation of and justification for mitigation and/or compensation measures proposed
  level: must
confidence: medium
notes: 'From the council''s list (published April 2025), page 9-10. Every trigger turns on a judgement
  (''likely to impact on air quality through odour, dust, fumes, bio-aerosols, or significant traffic
  generation'', ''likely to further reduce air quality'' in an AQMA, ''would result in the designation
  of an AQMA''), so it shows as discretionary, with the AQMA and SSSI cases picked out. Examples given:
  a composting site, asphalt plant, recycling operation, energy from waste plant.'
review-status: unverified
field-status: {}
