reference: sustainable-drainage-strategy
local-authority: ESX
required-if:
  any:
  - condition:
      field: hard-surfacing
      value: true
      description: A change in surface treatment.
  - condition:
      field: drainage-alterations
      value: true
      description: Infiltration methods are proposed.
  - all:
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development of 1 hectare or greater.
    - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 170, 171, 172, 173 & 174
source-text: A surface water drainage strategy may be required for development of 1 hectare or greater.
  ... Where proposals would result in a change in surface treatment or where ... infiltration methods
  are proposed a drainage strategy will be required.
confidence: medium
notes: From the council's list (published April 2025), page 20-21. The list's surface water drainage strategy
  (with the FRA under F1). For sites of 1 hectare or more it 'may be required', so that part shows as
  discretionary. See the council's surface water drainage checklist for contents.
