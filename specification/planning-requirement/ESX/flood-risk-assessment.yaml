reference: flood-risk-assessment
local-authority: ESX
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development (including minor development and changes of use) in Flood Zone 2 or
        3.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 with critical drainage problems, or where a Surface Water Management Plan
        or equivalent shows the site may be subject to drainage problems.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Development or a change of use to a more vulnerable class.
    - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 170, 171, 172, 173 & 174
source-text: All proposals of 1 hectare or greater in Flood Zone 1. • All proposals for new development
  (including minor development and changes of use) in Flood Zones 2 and 3, ... • All proposals for new
  development (including minor development and changes of use) in an area within Flood Zone 1 which has
  critical drainage problems and/ or where a Surface Water Management Plan or an equivalent document is
  in place which indicates that the site may be subject to drainage problems; and/ or where the proposed
  development or change of use to a more vulnerable class may be subject to other sources of flooding.
must-include:
- item: Identify and assess the risks of all forms of flooding to and from the development
  level: should
- item: Show how these flood risks will be managed
  level: should
- item: Consider the possible impact of climate change
  level: should
- item: Identify opportunities to reduce the probability and consequences of flooding
  level: should
- item: Surface water management systems such as SuDS, where appropriate
  level: should
- item: Address safe access to and from the development
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 19-20. 'May be subject to other sources of
  flooding' is a judgement, so that part shows as discretionary. The level of detail depends on the scale,
  form and complexity of the development.
review-status: unverified
field-status: {}
