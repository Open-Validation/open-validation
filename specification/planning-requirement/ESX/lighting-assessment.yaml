reference: lighting-assessment
local-authority: ESX
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: New external lighting.
  - any:
    - discretionary
    - site:
        in:
        - national-park
        description: Close to the South Downs National Park.
    - site:
        in:
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or conservation area.
    - site:
        in:
        - rural-area
        description: In or close to open countryside.
    - condition:
        field: protected-species
        value: true
        description: Where bats and their roosts, or other protected species, are present.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 198
source-text: 'All planning applications involving new external lighting: • in the vicinity of a residential
  property; • Close to the South Downs National Park; ... in the vicinity of a listed building or conservation
  area; • in or close to open countryside; or • at a location where bats and their roosts, or other protected
  species, are present In some cases, where the proposed lighting is very minor or unlikely to have any
  impact, the PP&DM team may consider that a Lighting Assessment is not required. Pre- application advice
  should be sought.'
must-include:
- item: Details of external lighting, including the height and number of any lighting columns
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
- item: A layout plan with beam orientation and a schedule of the equipment in the design
  level: must
- item: An assessment of the potential landscape and visual impacts of the lighting, and mitigation for
    any adverse effects
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 26-27. 'In the vicinity of a residential property'
  has no distance, so that part shows as discretionary. Very minor lighting may not need an assessment
  if the team agrees.
review-status: unverified
field-status: {}
