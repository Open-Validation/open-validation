reference: planning-statement
local-authority: ESX
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 44
source-text: All planning applications. The level of detail in the Planning Statement should be proportionate
  to the scale of the proposal. For smaller developments which require a Design & Access Statement, the
  Planning Statement could be incorporated as part of the D&A Statement.
must-include:
- item: Explain the proposal and identify the context and need for the development
  level: must
- item: A summary of likely impacts
  level: must
- item: A brief assessment of how the development accords with relevant national, regional and local planning
    policies
  level: must
- item: Details of consultations with the community
  level: must
  required-if: discretionary
  source-text: For larger or more complex proposals in particular, include details of consultations with
    the community which have been undertaken;
- item: A summary of the proposal in Plain English
  level: must
  required-if: discretionary
  source-text: For larger or more complex proposals in particular, include a summary of the proposal written
    in Plain English.
- item: 'Where there is a large amount of supporting information: a summary of the whole scheme with an
    overview and a clear description of its key impacts'
  level: should
  required-if: discretionary
  source-text: Where there is a large amount of supporting information applicants should provide a summary
    of the whole scheme. The summary should provide an overview of the proposal and a clear description
    of its key impacts.
- item: 'For replacement windows and doors: specifications of the existing and proposed windows/doors'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: Windows and doors replacements.
  source-text: Any application for windows and doors replacements should include specifications of the
    existing windows/doors and proposed windows/doors within the planning statement.
confidence: medium
notes: From the council's list (published April 2025), page 30-31. The list covers every application the
  county council decides (minerals, waste and the council's own development), so 'all applications' is
  shown as those application types. The detail should be proportionate; the community consultation and
  Plain English summary are 'for larger or more complex proposals in particular', so they show as discretionary.
review-status: unverified
field-status: {}
