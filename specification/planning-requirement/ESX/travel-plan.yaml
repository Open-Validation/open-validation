reference: travel-plan
local-authority: ESX
required-if:
  any:
  - condition:
      field: traffic-movements-daily
      operator: '>'
      value: 0
      description: A development for which a Transport Assessment or Transport Report is required.
  - condition:
      field: existing-travel-plan
      value: true
      description: A development with traffic implications at a site that already has a Travel Plan (an
        update is needed).
  - all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: pupil-increase
        operator: '>='
        value: 1
        description: A school proposal that would increase the number of pupils.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF Paragraph 105
source-text: All developments for which a Transport Assessment or Transport Report is required (see above).
  • All planning applications for development which has traffic implications at a site which is subject
  to an existing Travel Plan should include an update to the Travel Plan. • For School proposals which
  would increase the number of existing pupils in attendance.
must-include:
- item: A review period
  level: should
- item: A named person for monitoring purposes
  level: should
confidence: medium
notes: From the council's list (published April 2025), page 33.
review-status: unverified
field-status: {}
