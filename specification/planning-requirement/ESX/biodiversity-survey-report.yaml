reference: biodiversity-survey-report
local-authority: ESX
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      description: Within, adjacent to or could affect a SAC, SPA, Ramsar site or SSSI.
  - site:
      in:
      - ancient-woodland
      description: Within, adjacent to or could affect Ancient Woodland.
  - condition:
      field: veteran-trees
      value: true
      description: Ancient and veteran trees.
  - all:
    - site:
        in:
        - priority-habitat
        description: Other irreplaceable habitat (coastal sand dunes, spartina saltmarsh swards, mediterranean
          saltmarsh scrub, lowland fens).
    - discretionary
  - site:
      in:
      - local-wildlife-site
      description: Within, adjacent to or could affect a locally designated area (LWS, LGS, Local Nature
        Reserve).
  - condition:
      field: protected-species
      value: true
      description: Could affect protected, priority or notable species or habitats.
  - all:
    - condition:
        field: geodiversity-interest
        value: true
        description: A minerals site or other site with a geological interest (Geodiversity Survey).
    - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 187 and 193; NERC Act 2006, as amended, Section 40; Environment Act Schedule 15
source-text: Applications for development within or adjacent to or that could have an impact upon an internationally
  designated area (SAC, SPA or Ramsar site) or nationally designated area (SSSI) ... • Applications for
  development within or adjacent to or that could have an impact on irreplaceable habitat, including Ancient
  Woodland, ancient and veteran trees, coastal sand dunes, spartina saltmarsh swards, mediterranean saltmarsh
  scrub and lowland fens. • Applications for development within or adjacent to or that could have an impact
  upon a locally designated area (e.g. LWS (formerly SNCI), LGS (formerly RIGGS), Local Nature Reserve).
  • Proposals that could affect protected, priority or notable species or habitats. These could include
  (but are not limited to) proposals on brownfield sites, applications involving works to or demolition
  of an existing building, and proposals that involve the removal of trees, scrub or hedgerows or the
  alteration of watercourses. ... For proposals at minerals sites or other sites with a geological interest,
  a Geodiversity Survey may be required. Advice should be sought from the PP&DM Team at pre-application
  stage. • In some cases (for example for very small scale development proposals), the PP&DM team may
  be satisfied that the proposal would have no impact on the designated/ notable area/ feature, and in
  these cases a full Ecological Assessment may not be required.
must-include:
- item: Up-to-date information on priority habitats, protected/notable species and designated areas on
    or next to the site, including a data search from the Sussex Biodiversity Record Centre
  level: must
- item: Ecological surveys as appropriate, by a suitably qualified ecologist and in line with best practice
    guidance
  level: must
- item: A full assessment of the likely effects of the development
  level: must
- item: Measures for avoidance, mitigation, compensation or new benefits for biodiversity, showing how
    the mitigation hierarchy has been applied
  level: must
  required-if: discretionary
  source-text: Measures for avoidance, mitigation, compensation or new benefits for biodiversity if applicable,
    demonstrating how the mitigation hierarchy has been applied;
- item: Information to support any proposed mitigation/compensation measures
  level: must
- item: A summary of how the development will protect and enhance biodiversity
  level: should
confidence: medium
notes: 'From the council''s list (published April 2025), page 16-19. The list''s ''E2 – Ecological Impact
  Assessment''. Examples of proposals that could affect species include brownfield sites, works to or
  demolition of a building, removal of trees, scrub or hedgerows, and alteration of watercourses. Other
  irreplaceable habitats and a Geodiversity Survey ''may be required'' and show as discretionary; the
  team may also agree that a very small proposal needs no full assessment. If a proposal may have a likely
  significant effect on a SAC, SPA or Ramsar site, an Appropriate Assessment is needed under the Habitats
  Regulations: seek advice before applying.'
review-status: unverified
field-status: {}
