reference: site-restoration
local-authority: ESX
required-if:
  all:
  - any:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
    - condition:
        field: landfill-development
        value: true
        description: Land-filling or land-raising.
  - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Phased working plans and Restoration plans (including cross sections). These drawings are
  likely to be required for all applications for development involving mineral winning and working, land-filling
  and land-raising.
must-include:
- item: Cross sections
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 6. The list says restoration plans are 'likely
  to be required' for mineral winning and working, land-filling and land-raising, within drawings that
  may be required if deemed necessary, so the rule keeps a discretionary part. The phased working plans
  that go with them have no matching id (see the unmapped list).
review-status: unverified
field-status: {}
