reference: site-plan
local-authority: ESX
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following items will be required for all applications unless otherwise stated. ... Note:
  The location plan and site plan may not be required for applications for extending the time limit to
  implement a planning permission or applications to carry out development without complying with one
  or more conditions).'
must-include:
- item: At an identified standard metric scale
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access arrangements, unless they would
    not influence or be affected by the development
  level: must
- item: Public rights of way crossing or adjoining the site, unless they would not influence or be affected
    by the development
  level: must
- item: Position of all trees on the site and on adjacent land, unless they would not influence or be
    affected by the development
  level: must
- item: Extent and type of any hard surfacing, unless it would not influence or be affected by the development
  level: must
- item: Boundary treatment including walls or fencing, unless it would not influence or be affected by
    the development
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 5. The list covers every application the county
  council decides (minerals, waste and the council's own development), so 'all applications' is shown
  as those application types. The list says the location plan and site plan may not be needed for applications
  to extend the time limit or to vary conditions. It also says a block plan (site boundaries, boundary
  treatment where it changes, and buildings beyond the boundary that could be affected) may be required
  if deemed necessary.
review-status: unverified
field-status: {}
