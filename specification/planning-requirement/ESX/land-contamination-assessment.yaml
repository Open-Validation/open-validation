reference: land-contamination-assessment
local-authority: ESX
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: The application involves groundworks.
  - any:
    - site:
        in:
        - contaminated-land
        description: Land where contamination is known or suspected.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly vulnerable.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 196
source-text: All planning applications involving groundworks on land where contamination is known or suspected,
  or where the proposed use would be particularly vulnerable.
must-include:
- item: Enough information to establish whether there is contamination, its nature, the risks it may pose
    and whether these can be reduced to an acceptable level
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 24.
review-status: unverified
field-status: {}
