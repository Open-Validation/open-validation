reference: waste-management-plan
local-authority: ESX
required-if:
  condition:
    field: operational-development
    value: true
    description: Operational development that would result in construction waste.
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: East Sussex, South Downs and Brighton & Hove Waste and Minerals Local Plan (2013) policies WMP3a
  & WMP3d
source-text: All planning applications for operational development which would result in construction
  waste. Unless the Planning Policy & Development Management team has confirmed in writing that a Statement
  is not necessary, or the information is contained within a Design and Access Statement/supporting statement.
must-include:
- item: The volume and type of waste material that will arise from the development (e.g. demolition and
    excavation)
  level: must
- item: Opportunities for the reuse, recycling and recovery of materials
  level: must
- item: How off-site waste disposal will be minimised and managed
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 35. The list's 'W1 – Waste Minimisation Statement'.
  Not needed if the team has confirmed this in writing, or if the information is in the Design and Access
  Statement or a supporting statement.
review-status: unverified
field-status: {}
