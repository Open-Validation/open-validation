reference: noise-assessment
local-authority: ESX
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: A new noise source, or an existing one made worse, that could affect sensitive receptors
        (e.g. homes, schools, hospitals).
  - condition:
      field: noise-sensitive-use
      value: true
      description: New noise-sensitive development near an existing source of noise.
  - all:
    - site:
        in:
        - special-protection-area
        description: Likely increased noise at an environmentally designated site, such as an SPA.
    - discretionary
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraph 187 (Noise); NPPF paragraph 198 (Designated sites)
source-text: Planning applications for development where a new noise source is being proposed, or an existing
  noise source exacerbated, which could affect sensitive receptors (e.g. residential properties, schools,
  hospitals) • Planning applications for new noise-sensitive development proposed near an existing source
  of noise. • Planning applications for development which is likely to result in increased noise at an
  environmentally designated site, such as a Special Protection Area (SPA), as advised by the PP&DM team.
must-include:
- item: An assessment of current background and ambient noise levels
  level: must
- item: The predicted noise impact of the development, with all assumptions and timescales clearly identified
  level: must
- item: Explanation and justification of mitigation measures proposed
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 28. Noise at a designated site is 'as advised
  by the PP&DM team', so that part shows as discretionary.
review-status: unverified
field-status: {}
