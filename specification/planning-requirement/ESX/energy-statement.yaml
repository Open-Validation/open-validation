reference: energy-statement
local-authority: ESX
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.eastsussex.gov.uk/media/ucifvhsh/local-validation-list-april-2025.pdf
policy: NPPF paragraphs 162-168; East Sussex, South Downs and Brighton & Hove Waste and Minerals Local
  Plan (2013) policy WMP24a
source-text: All minerals and waste planning applications. All other applications that include new and
  existing buildings, structures and uses including change of use applications. Contact the PP&DM at pre-application
  stage for further guidance on requirements if unsure.
must-include:
- item: Carbon emissions from the site as existing and anticipated after the development, showing the
    carbon reduction expected
  level: must
confidence: medium
notes: From the council's list (published April 2025), page 15. The list's 'C2 – Carbon Assessment'. It
  can use recognised standards (e.g. SAP ratings, EPCs) and can be a stand-alone document or part of the
  Design and Access Statement or Planning Statement. The list names all minerals and waste applications
  and all other applications that include new and existing buildings, structures and uses (including change
  of use), which is every application the county council decides.
