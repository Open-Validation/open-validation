reference: biodiversity-survey-report
local-authority: HAS
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: New build and extension applications.
  - condition:
      field: involves-change-of-use
      value: true
      description: Changes of use.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policies EN2, EN3, EN4 and EN5; Hastings Development Management Plan
  policies HN7, HN8 and HN9; NPPF (August 2026) N2 and Annex C
source-text: All sites have the potential to support protected species, flora and fauna. You are required
  to carry out relevant up to date surveys prior to the submission of an application and provide adequate
  ecological information, conforming to British Standard BS42020, Biodiversity Code of practice for planning
  and development, the Chartered Institute of Ecology and Environmental Management Guidelines for Ecological
  Report Writing and Natural England Standing Advice series. This must be prepared by a competent ecology
  professional. ... This applies to changes of use, new build and extension applications.
must-include:
- item: Conforms to BS42020, the CIEEM Guidelines for Ecological Report Writing and Natural England Standing
    Advice
  level: must
- item: Proportionate to the site and proposal
  level: should
- item: Identifies protected species, habitats, constraints, survey findings, avoidance, mitigation, compensation
    and enhancement measures
  level: should
- item: Surveys current and carried out at an appropriate time of year; assessments/plans carried out
    more than 18 months ago will not be accepted
  level: must
- item: Prepared by an appropriately qualified and experienced person with current membership of CIEEM
    or another recognised professional body
  level: must
- item: Evidence of the author's membership, with a short CV setting out their relevant experience and
    qualifications
  level: must
- item: 'Where Biodiversity Net Gain applies: how the development will achieve at least 10% biodiversity
    net gain, or why the biodiversity gain condition does not apply'
  level: should
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: Biodiversity Net Gain applies.
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Biodiversity/Ecology
  Information, page 12.
review-status: unverified
field-status: {}
