reference: arboriculturist-report
local-authority: HAS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within or adjacent to the site that could influence or be affected by the development
        (including access, routes of new services or storage of materials).
  - site:
      in:
      - tree-preservation-zone
      description: Affecting a Tree Preservation Order (TPO).
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policies EN2, EN3, EN4 and EN5; Hastings Development Management Plan
  policies HN7 and HN8; NPPF (August 2026) N2, N3 and DP3; BS5837
source-text: Where there are trees, within or adjacent to a planning application site that could influence
  or be affected by proposed development (including any other work associated with the proposal such as
  access to the site, the routes of new services or the storage of materials) Affecting a Tree Preservation
  Order (TPO)
must-include:
- item: BS5837-compliant tree survey, arboricultural impact assessment, tree protection plan and method
    statement
  level: must
- item: Justification for any tree loss
  level: must
- item: Any street tree proposed for removal clearly identified in a statement submitted with the tree
    survey and arboricultural implication assessment, or in the planning statement
  level: should
  source-text: Where an application proposes to remove a street tree this should be clearly identified
    within with a Statement submitted with the Tree Survey and Arboricultural Implication Assessment or
    Planning Statement.
confidence: medium
notes: 'From the council''s list (dated September 2026, Version 26), section 2 (Local Requirements), Tree
  Survey: Arboricultural Implication Assessments and method Statements, page 28.'
review-status: unverified
field-status: {}
