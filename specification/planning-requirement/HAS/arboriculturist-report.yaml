reference: arboriculturist-report
local-authority: HAS
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees on or next to the site.
  - site:
      in:
      - tree-preservation-zone
      description: Trees protected by a Tree Preservation Order are affected.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
must-include:
- item: Tree survey, arboricultural impact assessment and method statement to BS5837
  level: must
confidence: medium
notes: 'From the audit (missing_requirement, wrong_app_type): trees on or next to the site, or TPO trees;
  householders included.'
review-status: unverified
field-status: {}
