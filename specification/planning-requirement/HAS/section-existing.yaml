reference: section-existing
local-authority: HAS
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels, or is next to changing ground levels
        or on a sloping site.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: structural-alteration
        value: true
        description: Removal of internal walls, changes to floors/floor levels, removal or changes to
          ceilings, staircases, or other key architectural features.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A
source-text: Required for all applications which involve a change in ground levels or where development
  is proposed next to changing ground levels. On sloping sites it will be necessary to show how proposals
  relate to existing ground levels where ground levels may be modified. ... Where the proposed development
  will result in the removal of internal walls, changes to floors/floor levels, removal or changes to
  ceilings, staircases, or other key architectural features.
must-include:
- item: Scale 1:50 or 1:100 with a scale bar
  level: must
- item: Existing and proposed ground levels, finished floor levels, building heights and the relationship
    to boundaries and neighbouring development
  level: should
- item: 'Listed building consent: existing and proposed internal sections at 1:20 or 1:10 scale'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 1 (National Requirements) and
  section 4 (Listed Building Consent), page 8, 38. The national row asks for existing and proposed site
  sections and finished floor and site levels; section 4 asks for internal sections for listed building
  works.
review-status: unverified
field-status: {}
