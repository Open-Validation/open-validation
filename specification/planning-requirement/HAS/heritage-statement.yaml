reference: heritage-statement
local-authority: HAS
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      - locally-listed-building
      description: 'Affects a designated or non-designated heritage asset or its setting: conservation
        area, listed building, scheduled ancient monument or archaeological site, historic park and garden,
        Archaeological Notification Area or Local List of Heritage Assets.'
  - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy EN1; Hastings Development Management Plan policies HN1, HN2,
  HN3, HN4 and HN5; NPPF (August 2026) HE5 and Annex C; Planning (Listed Buildings and Conservation Areas)
  Regulations 1990, section 3A
source-text: Required on all applications which affect designated and non-designated heritage assets or
  their setting and all major developments. ... They will all require:- 1) A Heritage statement AND 2)
  A Historic Environment Record (HER) checklist ... All Applications for listed building consent will
  require a Heritage Statement that includes any relevant information that is available from the Historic
  Environment Record (HER).
must-include:
- item: A Historic Environment Record (HER) checklist
  level: must
- item: Identifies affected designated and non-designated heritage assets and their settings, describes
    significance, and assesses the impact of the proposal
  level: should
- item: Level of detail proportionate to the asset and proposal
  level: should
- item: Photographs, historic maps, phasing, schedule of works, HER checklist/consultation and structural
    information where relevant
  level: should
- item: Consultation report from the Historic Environment Record (HER), where consultation with the HER
    is necessary
  level: must
  required-if: discretionary
  source-text: Some applications will also require consultation with the Historic Environment Record (HER).If
    necessary, the consultation report will be submitted with the application.
- item: 'Listed building consent: identifies significance, assesses impact and includes any relevant information
    available from the HER, with proportionate supporting evidence such as photographs, historic maps,
    phasing and schedule of works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: where harm is identified, justification and mitigation clearly explained'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Heritage
  Statement (including Archaeology) and section 4, page 19, 39. Other buildings or areas identified through
  the application process as having enough heritage significance to be treated as non-designated heritage
  assets are shown as the council's discretion.
review-status: unverified
field-status: {}
