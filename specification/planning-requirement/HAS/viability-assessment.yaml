reference: viability-assessment
local-authority: HAS
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The policy requirement for affordable housing provision will not be met in full.
  - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy H3; NPPF (August 2026) DM5 and Annex C
source-text: Any application where s106 planning obligations will not be met in full, including the policy
  requirement for affordable housing provision, contributions towards highways, play space, ecology/biodiversity,
  art, schools etc. It is up to the applicant whether a viability statement is submitted with the application.
must-include:
- item: Explains why policy obligations cannot be met
  level: should
- item: Sufficient appraisal information, values, costs, affordable housing details and assumptions
  level: should
- item: Prepared by a suitably qualified RICS professional
  level: should
confidence: medium
notes: 'From the council''s list (dated September 2026, Version 26), section 2 (Local Requirements), Viability
  Statement, page 29. Shown partly as discretionary: it is up to the applicant whether to submit one,
  and other s106 obligations not met in full have no field. A Viability Statement may be requested during
  the application.'
review-status: unverified
field-status: {}
