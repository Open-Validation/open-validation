reference: location-plan
local-authority: HAS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - demolition-con-area
    - ldc
    - prior-approval
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A
source-text: All applications except variation/discharge of condition and non-material amendment. ...
  All applications for Listed Building Consent.
must-include:
- item: Scale 1:1250 or 1:2500, based on up-to-date mapping
  level: must
- item: Direction of north and a scale bar
  level: must
- item: Application site edged red
  level: must
- item: Any other nearby land in the applicant's ownership edged blue
  level: must
- item: Sufficient surrounding detail to identify the site
  level: must
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 1 (National Requirements) and
  section 4 (Listed Building Consent), page 6, 37. Not needed for variation or discharge of conditions
  or non-material amendments.
review-status: unverified
field-status: {}
