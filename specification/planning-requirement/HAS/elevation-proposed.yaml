reference: elevation-proposed
local-authority: HAS
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to the exterior of an existing building.
  - application-type:
      in:
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A; Town and
  Country Planning (General Permitted Development) (England) Order 2015 (as amended), Schedule 2
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings.
  ... Applications proposing external alterations. NB Applications proposing internal alterations only
  will not require this.
must-include:
- item: Scale 1:50 or 1:100, with written dimensions to show the overall size of any new buildings or
    extensions, and a scale bar
  level: must
- item: The external appearance, dimensions, materials and any demolition or alteration to existing walls
    or buildings
  level: should
- item: 'Listed building consent: at 1:50 scale'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Additional storeys on a dwellinghouse (Class AA, Part 1): the existing and proposed elevations,
    and the position and dimensions of the proposed windows, drawn to an identified scale'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
  source-text: a plan which is drawn to an identified scale and shows— (i) the existing and proposed elevations
    of the dwellinghouse, and (ii) the position and dimensions of the proposed windows.
- item: 'New dwellinghouses on top of buildings (Part 20): the existing and proposed elevations of the
    building, drawn to an identified scale'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
confidence: medium
notes: 'From the council''s list (dated September 2026, Version 26), sections 1, 3 and 4, page 7, 30-34,
  37. Internal alterations only do not need them. Section 3 (prior approval for upward extensions: Class
  AA of Part 1 and Classes A to AD of Part 20) gives the GPDO''s own plan requirements, shown here as
  items.'
review-status: unverified
field-status: {}
