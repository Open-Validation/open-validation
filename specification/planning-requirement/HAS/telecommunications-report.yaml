reference: telecommunications-report
local-authority: HAS
required-if:
  any:
  - condition:
      field: telecommunications-development
      value: true
      description: Planning applications for mobile base stations.
  - application-type:
      in:
      - pa-ecomms-network
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Development Management Plan policy DM2; NPPF (August 2026) CO2 and Annex C
source-text: Prior approval and planning applications mobile base stations.
must-include:
- item: The outcome of pre-submission consultations with organisations with an interest in the proposed
    development, where relevant
  level: should
- item: 'For a new site: evidence that the applicant has explored keeping new sites to a minimum, including
    considering existing buildings, masts or other structures'
  level: should
- item: ICNIRP self-certification confirming cumulative exposure, when operational, will not exceed International
    Commission guidelines on non-ionising radiation protection
  level: must
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Telecommunications
  Statement and ICNIRP Statement of Compliance, page 27. The ICNIRP statement is named in the requirement's
  title, so it shows as 'must'.
review-status: unverified
field-status: {}
