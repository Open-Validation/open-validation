reference: bng-metric
local-authority: HAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.2
        description: The site is over 0.2 hectares.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.2
        description: The site is over 0.2 hectares.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
must-include:
- item: Pre-development biodiversity metric
  level: must
- item: Statement on any degradation of the site's habitats
  level: must
- item: Details of any irreplaceable habitat
  level: must
- item: Habitat plan
  level: must
confidence: low
notes: 'From the audit (wrong_trigger): major applications and small sites subject to the general BNG
  condition. Householder, de minimis and sites of 0.2ha or below (applications on or after 6 August 2026)
  are exempt; the self/custom build exemption no longer applies. The must-include items are the audit''s
  summary of Section 5. The application types are inferred from the householder exemption; de minimis
  has no field.'
review-status: unverified
field-status: {}
