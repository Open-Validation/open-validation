reference: site-plan
local-authority: HAS
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: The listed building consent application includes external works.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A; Town and
  Country Planning (General Permitted Development) (England) Order 2015 (as amended), Schedule 2
source-text: All applications including Change of Use. ... All applications for Listed Building Consent
  that include external works.
must-include:
- item: Existing and proposed block plans
  level: must
- item: Scale 1:200 or 1:500, with the direction of north and a scale bar
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: Neighbouring buildings, access, highways, public rights of way, trees, hedges, hardstanding, boundary
    treatments and relevant landscape features, with dimensions where required
  level: should
- item: 'Listed building consent with external works: buildings, boundaries, dimensions, hardstanding,
    access, boundary treatment and relevant landscape features'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Prior approval for upward extensions: drawn to an identified scale, showing the direction of
    North, indicating the site and showing the proposed development'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
  source-text: a plan which is drawn to an identified scale and shows the direction of North, indicating
    the site and showing the proposed development
confidence: medium
notes: 'From the council''s list (dated September 2026, Version 26), sections 1, 3 and 4, page 7, 30-34,
  37. Section 3 (prior approval for upward extensions: Class AA of Part 1 and Classes A to AD of Part
  20) gives the GPDO''s own plan requirements, shown here as items.'
review-status: unverified
field-status: {}
