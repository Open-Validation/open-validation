reference: application-form
local-authority: HAS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - s73
    - lbc
    - advertising
    - demolition-con-area
    - ldc
    - approval-condition
    - non-material-amendment
    - consent-under-tpo
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7 and Article 13, Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section
  3A
source-text: All applications for planning permission and associated consents, except for applications
  for hazardous substance consent or prior approval applications ... All applications for Listed Building
  Consent.
must-include:
- item: Completed application form, ownership certificates and fee, where required
  level: must
- item: Certificates signed and dated
  level: must
- item: 'Where Certificate B, C or D applies: notice served on owners/agricultural tenants in accordance
    with the DMPO'
  level: must
  source-text: All applications where there are "owners" of the application site other than the applicant.
    "Owners" are freeholders or leaseholders with at least 7 years of the leasehold left unexpired.
- item: 'Listed building consent: all relevant form sections completed, with a description that lists
    the proposed works (general references to internal or external works will not be accepted)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 1 (National Requirements) and
  section 4 (Listed Building Consent), page 5, 36. Not needed for hazardous substance consent or prior
  approval applications. The ownership certificate and notice rows are shown as items here.
review-status: unverified
field-status: {}
