reference: roof-plan-existing
local-authority: HAS
required-if:
  condition:
    field: roof-alteration
    value: true
    description: 'A roof would be created or altered (for listed buildings: changes to the roof profile,
      new roof coverings, new dormers or rooflights, solar panels, changes to chimney stacks or parapet
      gutters).'
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A
source-text: 'Required where a roof would be created or altered by the proposed development. ... Where
  alterations to the roof are proposed, for example : changes to the roof profile, new roof coverings,
  new dormers or rooflights, solar panels, changes to the chimney stacks or parapet gutters etc.'
must-include:
- item: Scale 1:100 or 1:200 with a scale bar; simple roof changes may be shown on a clear block plan
  level: must
- item: The roof form, materials and features such as chimneys, rooflights, dormers, vents and solar panels
  level: should
- item: 'Listed building consent: existing and proposed roof plans at 1:50 scale'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 1 (National Requirements) and
  section 4 (Listed Building Consent), page 8, 38. Existing roof plans only where an existing roof is
  altered.
review-status: unverified
field-status: {}
