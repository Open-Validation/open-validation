reference: sci
local-authority: HAS
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is contrary to (a departure from) the Development Plan policies.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: More than 1,000 square metres of non-residential floor space.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings regardless of site size.
  - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Borough Council Statement of Community Involvement; NPPF (August 2026) DM1 and Annex
  C
source-text: 'SCI will be provided where the proposal: • Is contrary to (a departure from) the Development
  Plan policies; • Proposes more than 1,000 square metres of non-residential floor space; • Proposes more
  than 10 dwellings regardless of site size; • Other potentially controversial applications where the
  nature of the development is likely to attract significant local interest.'
must-include:
- item: Explains pre-application engagement, how community views were sought and how comments influenced
    the proposal
  level: should
- item: A Planning Forum is strongly recommended for larger or potentially controversial schemes
  level: should
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Statement
  of Community Involvement (SCI), page 27. Other potentially controversial applications likely to attract
  significant local interest are shown as the council's discretion.
review-status: unverified
field-status: {}
