reference: schedule-of-works
local-authority: HAS
required-if:
  all:
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A
source-text: Required for all listed building consent applications involve a range of different repairs
  or alterations to the listed building. A Schedule of works may require a Method Statement for proposals
  which involve complex repairs, alterations, or demolition works to significant parts of the building.
must-include:
- item: Itemises each work, identifying location, existing fabric, proposed change, method, materials
    and finishes
  level: must
- item: A Method Statement explaining sequencing and protection measures, for complex repairs, alterations
    or demolition works to significant parts of the building
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 4 (Listed Building Consent),
  page 40. Only if a full schedule of works is not included in the Heritage Statement. 'A range of different
  repairs or alterations' has no threshold, so it is shown as the council's discretion.
