reference: affordable-housing-statement
local-authority: HAS
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 1
    description: Residential development, including conversions and/or changes of use, resulting in one
      or more net additional dwellings.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy H3; NPPF (August 2026) HO8, DM5 and Annex C
source-text: Required for any residential development, including conversions and/or changes of use, that
  would result in one or more net additional dwellings.
must-include:
- item: The affordable housing provision proposed and how this relates to Hastings Planning Strategy Policy
    H3
  level: must
- item: Whether the site is brownfield or greenfield
  level: must
- item: The number of net additional dwellings and, where relevant, the site area
  level: must
- item: The percentage of affordable housing proposed and/or financial contribution proposed
  level: must
- item: The number, size and mix of units
  level: must
- item: The tenure of each unit and an explanation of the proposed mix
  level: must
- item: Plans for ongoing housing management and details of any Registered Provider involvement
  level: must
- item: A plan showing the location of affordable housing units and reasoning for this location
  level: must
- item: Details of design and proposed build quality standards
  level: must
- item: Proposed nominations agreement
  level: must
- item: Any proposed financial contribution, with supporting valuation information where relevant
  level: must
- item: Justification for any contribution in lieu of on-site provision, where relevant
  level: must
confidence: medium
notes: 'From the council''s list (dated September 2026, Version 26), section 2 (Local Requirements), page
  10. Policy H3 thresholds: previously developed land 1-4 net dwellings 10% financial contribution, 5-14
  net dwellings 20%, 15+ net dwellings or sites of 0.5 ha or more 25% on site; greenfield 1-4 net dwellings
  20% financial contribution, 5-9 net dwellings 20%, 10-14 net dwellings 40%, 15+ net dwellings 40% on
  site. Where full compliance would be unviable, viability evidence goes under the Viability Statement
  (viability-assessment).'
review-status: unverified
field-status: {}
