reference: habitat-baseline
local-authority: HAS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (major applications
      and small sites, unless exempt).
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Environment Act 2021; Schedule 7A, Town and Country Planning Act 1990; Biodiversity Gain Regulations
  2024 as amended; Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended); Hastings Planning Strategy policies EN2-EN5; Hastings Development Management Plan
  policies HN7-HN9
source-text: All major applications and small sites where the statutory biodiversity gain condition applies,
  unless exempt.
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
- item: Uses UK Habitat Classification and is cross-referenced to the metric
  level: should
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements) and
  section 5 (Biodiversity Net Gain), page 13-14, 42. Exemptions include householder development, permitted
  development, the de minimis exemption (no onsite priority habitat, under 25 sq m of habitat and under
  5 m of linear habitat), and, for applications made on or after 6 August 2026, sites of 0.2 ha or below
  and temporary development (5 years or less) unless onsite priority habitat is impacted. The self-build
  and custom build exemption no longer applies to new applications made on or after 6 August 2026. The
  Biodiversity Statement and the 'BNG Not Applicable' statement are listed in the unmapped requirements.
review-status: unverified
field-status: {}
