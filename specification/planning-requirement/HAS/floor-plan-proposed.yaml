reference: floor-plan-proposed
local-authority: HAS
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: New or amended floorspace, or alterations to existing buildings (internal and/or external).
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: involves-change-of-use
        value: true
        description: The listed building consent application includes a change of use.
  - application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A; Town and
  Country Planning (General Permitted Development) (England) Order 2015 (as amended), Schedule 2
source-text: All applications proposing new or amended floorspace and/or proposals to alter existing buildings.
  ... Applications proposing internal and/or external alterations. Applications that include a change
  of use.
must-include:
- item: Scale 1:50 or 1:100, with written dimensions to show the overall size of any new buildings or
    extensions, and a scale bar
  level: must
- item: The layout, use of rooms/spaces, dimensions and any demolition or alteration to existing buildings
  level: should
- item: 'Listed building consent: at 1:50 scale, clearly showing existing and proposed layouts, room uses
    and the location of proposed works cross-referenced to the schedule of works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'New dwellinghouses on top of buildings (Part 20): drawn to an identified scale, showing the direction
    of North, the dimensions and proposed use of each room, and the position and dimensions of windows,
    doors and walls'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
  source-text: floor plans which are drawn to an identified scale and show the direction of North indicating
    the dimensions and proposed use of each room, the position and dimensions of windows, doors and walls
confidence: medium
notes: 'From the council''s list (dated September 2026, Version 26), sections 1, 3 and 4, page 8, 30-34,
  37. Section 3 (prior approval for upward extensions: Class AA of Part 1 and Classes A to AD of Part
  20) gives the GPDO''s own plan requirements, shown here as items.'
review-status: unverified
field-status: {}
