reference: town-centre-impact-assessment
local-authority: HAS
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure developments over 2,500 square metres gross floorspace (where no
        local threshold applies).
  - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policies DS3 and E3; NPPF (August 2026) TC4 and Annex C
source-text: 'Applications for any of the following: • Retail and leisure developments over 2500 square
  metres; • the site is not allocated for the proposed use; and • where no local threshold applies, exceeds
  2,500 sqm gross floorspace'
must-include:
- item: Impact on existing, committed and planned investment in town centres
  level: should
- item: Impact on town centre vitality and viability
  level: should
- item: Impact on local consumer choice
  level: should
- item: Impact on trade in the town centre and wider retail catchment
  level: should
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Retail
  or Leisure Impact Assessment, page 24. The 'site is not allocated for the proposed use' bullet has no
  threshold of its own, so it is shown as the council's discretion. The sequential test for main town
  centre uses is listed in the unmapped requirements.
review-status: unverified
field-status: {}
