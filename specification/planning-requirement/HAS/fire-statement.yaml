reference: fire-statement
local-authority: HAS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
confidence: medium
notes: 'Audit (wrong_app_type): the workbook placed it under prior approval and quoted the exemption clause.
  Relevant buildings are 18m+ or 7+ storeys with 2+ dwellings or educational accommodation; material change
  of use, outline and s73 applications are exempt.'
review-status: unverified
field-status: {}
