reference: fire-statement
local-authority: HAS
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains, or will contain, two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains, or will contain, educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 storeys or more.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (as amended)
source-text: 'Applications for planning permission for development involving: • the provision of one or
  more relevant buildings; • Development of an existing relevant building; or • development within the
  curtilage of a relevant building. A relevant building is one that contains, or will contain, two or
  more dwellings or educational accommodation and is 18 metres or more in height, or 7 storeys or more.'
must-include:
- item: Submitted on the published form, or a substantially equivalent form
  level: must
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 1 (National Requirements),
  page 9. Not required where a change of use means the building is no longer a relevant building, for
  a change of use in the curtilage that would not result in a relevant building, for outline applications,
  or for section 73 applications.
review-status: unverified
field-status: {}
