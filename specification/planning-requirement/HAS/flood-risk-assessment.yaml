reference: flood-risk-assessment
local-authority: HAS
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zones 2 or 3 (including Flood Zone 3b), including minor development and changes
        of use.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Within Flood Zone 1 with a site area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Within Flood Zone 1 with a site area of 1 hectare or more.
  - site:
      in:
      - future-flood-risk
      description: Within Flood Zones plus Climate Change (increased risk from rivers or sea in future),
        or where the council's SFRA shows increased risk of flooding during the development's lifetime.
  - site:
      in:
      - surface-water-flood-risk
      description: Within Flood Zone 1 where the flood map for planning shows a risk of flooding from
        surface water, now or in future.
  - site:
      in:
      - critical-drainage-area
      description: In an area with critical drainage problems.
  - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy SC7; NPPF (August 2026) F4, F8 and Annex C
source-text: 'A Flood Risk Assessment (FRA) is required for all development, including minor development
  and changes of use, proposed: • in Flood Zones 2 or 3 or as shown in the flood map for planning; • within
  Flood Zone 3b; • within Flood Zone 1 with a site area of 1 hectare or more; • within Flood Zones plus
  Climate Change, showing it is at increased risk of flooding from rivers or sea in future; • within Flood
  Zone 1 where the flood map for planning shows it is at risk of flooding from surface water, now or in
  future; • in areas with critical drainage problems; • within Flood Zone 1 where the LPA''s strategic
  flood risk assessment (SFRA) shows it will be at increased risk of flooding during its lifetime; • that
  increases the vulnerability classification and may be subject to sources of flooding other than rivers
  or sea.'
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development and demonstrates
    how these flood risks will be managed, taking climate change into account
  level: must
- item: Identifies opportunities to reduce the probability and consequences of flooding
  level: should
- item: Includes the design of surface water management systems, including Sustainable Drainage Systems
    (SuDS)
  level: should
- item: Addresses safe access to and from the development in areas at risk of flooding
  level: should
- item: Sequential Test, where national policy and guidance require one
  level: must
  required-if: discretionary
  source-text: Sequential Tests will be required where national policy and guidance require them.
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Flood
  Risk Assessment (FRA) and Sequential Test, page 16-17. Development that increases the vulnerability
  classification and may be subject to sources of flooding other than rivers or sea is shown as the council's
  discretion (no field for it yet), as is the Sequential Test, which the list ties to national policy
  without setting its own trigger. The completed SuDS Strategy Form is filed under sustainable-drainage-strategy.
review-status: unverified
field-status: {}
