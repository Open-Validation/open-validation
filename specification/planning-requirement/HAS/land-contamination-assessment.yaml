reference: land-contamination-assessment
local-authority: HAS
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Within the contaminated land zone (however minor the application), or known contamination
        issues associated with the site or surrounding sites (e.g. a former industrial use).
  - ref: major-development
  - condition:
      field: eia-development
      value: true
      description: Applications subject to the Environmental Impact Assessment regulations.
  - all:
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of any contaminated land or historical land fill.
    - discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy SC1; Hastings Development Management Plan policy DM5; NPPF (August
  2026) P2 and Annex C
source-text: 'In all cases on sites that are within the contaminated land zone, irrespective of how minor
  the application is, a Ground Investigation Report (GIR) is required. A GIR maybe required for development
  proposed not directly on but within 250 metres of any contaminated land or historical land fill (please
  note that if a GIR has been carried out for the site as part of a previous permission, a further ground
  investigation report will be required). A GIR will be required for: • major applications including brownfield
  sites, • applications subject to Environmental Impact Assessment regulations and • small scale extensions
  and development if there are known contamination issues associated with the site or the surrounding
  sites (e.g. If site or surroundings had a former industrial use).'
must-include:
- item: Assesses risk and, where required, sets out investigation, remediation and verification measures
  level: should
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Ground
  Investigation Report, page 17-18. Development within 250 m of contaminated land or historical landfill
  'maybe required', so it shows as the council's discretion. A new report is needed even if one was done
  for a previous permission.
review-status: unverified
field-status: {}
