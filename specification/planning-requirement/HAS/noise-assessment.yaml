reference: noise-assessment
local-authority: HAS
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Industrial uses that share a common boundary with residential properties or are sited
        in noise sensitive areas due to wildlife designations; restaurants/cafes with residential uses
        directly above or adjacent, or with a potentially noisy extract system.
  - condition:
      field: plant-equipment
      value: true
      description: Air conditioner/condensers.
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy SC1; Hastings Development Management Plan policy DM6; NPPF (August
  2026) P3, P4 and Annex C
source-text: 'Assessments shall be required for: • Applications for industrial uses that share a common
  boundary with residential properties and could potentially raise issues of disturbance by noise to the
  occupants; • Applications for industrial uses that are sited in noise sensitive areas due to wildlife
  designations; • Restaurants/cafes where residential uses are located directly above or adjacent or which
  may have potentially noisy extract system • Air conditioner/condensers'
must-include:
- item: Identifies likely noise impacts and demonstrates suitable mitigation or insulation
  level: should
- item: Prepared by a suitably qualified acoustic consultant, normally with current ANC or IOA membership
  level: should
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), page
  22.
review-status: unverified
field-status: {}
