reference: design-and-access-statement
local-authority: HAS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Any part of the development is in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The provision of a building or buildings where the floor space created is 100 square
            metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A; Hastings
  Planning Strategy policies SC1, SC2, SC3 and SC4
source-text: (a) development which is major development; (b) where any part of the development is in a
  designated area, development consisting of— (i) the provision of one or more dwellinghouses; or (ii)
  the provision of a building or buildings where the floor space created by the development is 100 square
  metres or more.
must-include:
- item: Explains the design principles, evolution of the scheme and access arrangements
  level: should
- item: Proportionate to the scale and complexity of the proposal
  level: should
- item: Addresses layout, appearance, scale, landscaping, access, climate adaptation, sustainable drainage,
    biodiversity and energy where relevant
  level: should
- item: 'Listed building consent only: focuses on design, heritage impact, justification and mitigation,
    especially where harm is identified'
  level: should
  required-if:
    application-type:
      in:
      - lbc
  source-text: Where submitted alongside planning permission, a combined DAS may be used. For LBC only,
    the statement should focus on design, heritage impact, justification and mitigation, especially where
    harm is identified.
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 1 (National Requirements) and
  section 4 (Listed Building Consent), page 5-6, 39. Section 4 requires a Design and Access Statement
  for all listed building consent applications; a combined statement may be used where submitted alongside
  planning permission.
review-status: unverified
field-status: {}
