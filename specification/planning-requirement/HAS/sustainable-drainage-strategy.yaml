reference: sustainable-drainage-strategy
local-authority: HAS
required-if: discretionary
source-url: https://www.hastings.gov.uk/content/ValidationService/validation_checklist.pdf
policy: Hastings Planning Strategy policy SC7; NPPF (August 2026) F4, F8 and Annex C; National Standards
  for Sustainable Drainage Systems
source-text: A completed SuDS Strategy Form with supporting documents is required for development proposals
  which could affect drainage on or around the site. This should be proportionate to the nature and scale
  of the proposal.
must-include:
- item: 'Uses the national form appropriate to the scale of development: the Major development SuDS Strategy
    Form for major development, or the Non-major development SuDS Strategy Form for non-major development'
  level: should
- item: Explains how the proposal complies with the National Standards for Sustainable Drainage Systems
  level: should
- item: Addresses the drainage hierarchy, discharge destination, runoff rates and volumes, water quality,
    exceedance routes, and maintenance and management arrangements
  level: should
- item: Supporting documents including drainage plans, calculations and maintenance/management details
    where needed to show how the national SuDS standards have been achieved
  level: should
- item: A separate drainage report, only where the completed form and supporting documents do not provide
    enough technical information, or where the proposal is complex
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (dated September 2026, Version 26), section 2 (Local Requirements), Completed
  SuDS Strategy Form with supporting documents, page 16-17. Filed under the retired MHCLG id for a drainage
  strategy. 'Development proposals which could affect drainage on or around the site' has no threshold,
  so it is shown as the council's discretion.
review-status: unverified
