reference: flood-risk-assessment
local-authority: IOW
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development or a change of use in flood zone 2 or 3 (the Council's SFRA or the
        latest Environment Agency information).
source-url: https://www.iow.gov.uk/media/769/Local-validation-list-2025-final/pdf/Local_validaiton_list_2025_-_final_4.pdf?m=1787651665373
policy: Core Strategy Policy DM14
source-text: Flood Risk Assessment (including sequential and exceptions tests, as necessary) NPPF Core
  Strategy Policy DM14 Required for all Planning applications for development proposals of 1 hectare or
  more in Flood Zone 1 and all proposals for new development or changes of use located in Flood Zones
  2 and 3 based on the modelled extents of these Flood Zones in the Council’s published SFRA and the latest
  flood risk information issued by the Environment Agency.
must-include:
- item: Sequential and exception tests, as necessary
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): applies to all application types, not only Outline.'
review-status: unverified
field-status: {}
