reference: biodiversity-survey-report
local-authority: IOW
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - local-wildlife-site
      description: The site is within or adjacent to a designated nature conservation site (including
        local designations).
  - condition:
      field: greenfield-site
      value: true
      description: The site is a greenfield site.
  - condition:
      field: protected-species
      value: true
      description: The proposal could affect protected habitats or species known to exist, or the site
        has the potential to support them.
source-url: https://www.iow.gov.uk/media/769/Local-validation-list-2025-final/pdf/Local_validaiton_list_2025_-_final_4.pdf?m=1787651665373
policy: Core Strategy Policies SP5 and DM12
source-text: Ecology Survey and Report NPPF Core Strategy Policies SP5 and DM12 Required for all applications
  where the proposal is located within or adjacent to a designated nature conservation site (including
  local designations), is a greenfield site, and/or would potentially have an impact on protected habitats
  or species, where they are known to exist, or if the proposed development site has the potential to
  support them.
confidence: medium
notes: 'Audit (wrong_app_type): applies to all application types, not only Outline.'
review-status: unverified
field-status: {}
