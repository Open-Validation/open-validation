reference: lighting-assessment
local-authority: IOW
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The development results in additional external lighting or glazing.
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: The site is within the National Landscape (AONB).
source-url: https://www.iow.gov.uk/media/769/Local-validation-list-2025-final/pdf/Local_validaiton_list_2025_-_final_4.pdf?m=1787651665373
policy: Core Strategy Policies SP5, DM2, DM11 & DM12
source-text: Lighting Assessment Core Strategy Policies SP5, DM2, DM11 & DM12 Required for major development
  or for those developments that would result in additional external lighting or glazing within the National
  Landscape (AONB).
must-include:
- item: Details of proposed external lighting
  level: must
- item: Details of the light output of the proposed lighting
  level: must
- item: Lighting measures adopted to prevent light spillage or glare and to protect the character of the
    area and amenity of nearby properties and uses
  level: must
confidence: medium
notes: 'The must-include items were merged into the workbook''s LVIA row (audit: wrong_trigger).'
review-status: unverified
field-status: {}
