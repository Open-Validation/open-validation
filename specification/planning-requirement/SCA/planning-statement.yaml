reference: planning-statement
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: involves-change-of-use
        value: true
        description: Material changes of use.
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: Proposals that do not accord with the adopted development plan.
    - all:
      - discretionary
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Proposals that require a sequential assessment of alternative sites.
    - site:
        in:
        - green-belt
        description: Proposals located within the Green Belt.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan
source-text: 'Development which includes: Material changes of use Proposals for major development Proposals
  that do not accord with the adopted development plan Where proposals require a sequential assessment
  of alternative sites Where proposals are located within the Green Belt'
must-include:
- item: Context and background to the development
  level: must
- item: Details of and justification for the proposed use, including activities, intended numbers of staff
    and users, and the intensity of use
  level: must
- item: How the proposal has taken account of national and local policy and other material considerations
  level: must
- item: The assessment of alternative sites and why they are less sequentially preferable, where policy
    requires it
  level: must
- item: Reasoned justification of appropriateness in the Green Belt (NPPF paragraphs 149 and 150) and
    any very special circumstances
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: In the Green Belt.
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Planning statement'. The same section appears in the 'Outline Planning Permission' checklists.
  'Where proposals require a sequential assessment' is shown as discretionary together with the out-of-centre
  field.
review-status: unverified
field-status: {}
