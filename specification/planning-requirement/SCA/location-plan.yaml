reference: location-plan
local-authority: SCA
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
    - ldc
    - advertising
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: Use an up-to-date Ordnance Survey-based location plan at an appropriate scale, usually 1:1250
  or 1:2500. In the case of large sites other scales may be appropriate.
must-include:
- item: Up-to-date Ordnance Survey-based plan at an appropriate scale, usually 1:1250 or 1:2500 (other
    scales may suit large sites)
  level: must
- item: At least two named roads and all surrounding buildings or land (unless this would need a plan
    greater than 1:2500)
  level: must
- item: The application site (the whole planning unit)
  level: must
- item: A north compass point and the scale clearly identified
  level: must
- item: OS Crown copyright and the correct licence number shown; not copied from existing OS mapping
  level: must
- item: Site boundary edged clearly in red, including all land needed to carry out the development (access
    from a public highway, visibility splays, landscape, car parking, open areas)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Location plan'. The same section appears in the 'Outline Planning Permission', 'Approval of
  Reserved Matters', 'Householder planning application', 'Listed Building Consent', 'Lawful Development
  Certificate - Existing Use or Development', 'Lawful Development Certificate - Proposed Use or Development',
  'Advertisement consent' checklists. The location plan section has no separate 'when required' wording,
  so the source text is its opening line. The council's 'Validation guide for agents and developers' (reviewed
  10 February 2026) repeats these points.
review-status: unverified
field-status: {}
