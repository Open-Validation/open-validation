reference: sustainable-drainage-strategy
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: impermeable-area-increase
        operator: '>'
        value: 0
        description: Surface water will be created (new impermeable area).
    - condition:
        field: drainage-alterations
        value: true
        description: Surface water drainage will be affected.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policies CC/8 and CC/9
source-text: A surface water drainage strategy is required for all scales of development where surface
  water will be created or affected.
must-include:
- item: How the surface water scheme follows the drainage hierarchy
  level: must
- item: Pre- and post-development runoff rates, with storm water storage calculations
  level: must
- item: Discharge location(s) and drainage calculations supporting the design
  level: must
- item: Infiltration testing to BRE365, if infiltration is proposed
  level: must
- item: Drawings of the proposed surface water drainage scheme, with sub-catchment breakdown where applicable;
    SuDS shown on all relevant plans
  level: must
- item: Maintenance and management plan for the lifetime of the development, including future adoption
  level: must
- item: Completed drainage pro forma from the Cambridgeshire Flood and Water SPD
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Surface water drainage strategy'. The same section appears in the 'Outline Planning Permission',
  'Approval of Reserved Matters' checklists. Uses the retired MHCLG id for a surface water drainage strategy.
  The list cites 'CLP Policies CC/8 and CC/9' (South Cambridgeshire Local Plan policy numbers). For householder
  applications 'The means of and changes to surface water drainage ... must be shown on the submitted
  plans' instead.
review-status: unverified
field-status: {}
