reference: travel-plan
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 20
        description: Residential developments at or above 20 dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Residential developments at or above 0.5 hectares.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: Other developments at or above 1000m2.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Other developments at or above 1 hectare.
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy TI/2
source-text: A Travel Plan is required for; Residential Developments at or above 20 dwellings or 0.5 hectares
  Other developments at or above 1000m2 or 1 hectare Where developments have significant transport implications
must-include:
- item: Includes a Low Emissions Strategy Statement
  level: must
- item: In accordance with the latest County Council guidance, at a level agreed with Cambridgeshire County
    Council
  level: must
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Travel plan''. The same section appears in the ''Outline Planning Permission'' checklists.
  Discretionary part: ''Where developments have significant transport implications''.'
review-status: unverified
field-status: {}
