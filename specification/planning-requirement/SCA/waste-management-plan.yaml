reference: waste-management-plan
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Development of new residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial development of any scale.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy HQ/1; RECAP Waste Management Design Guide
source-text: All scales of commercial development and development of new residential units.
must-include:
- item: Safe, secure, convenient and accessible provision for waste management, recycling and collection,
    in line with the RECAP Waste Management Design Guide and Toolkit
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Waste design guide toolkit'. The same section appears in the 'Outline Planning Permission'
  checklists.
review-status: unverified
field-status: {}
