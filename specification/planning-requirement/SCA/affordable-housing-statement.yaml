reference: affordable-housing-statement
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Major developments of 10 dwellings or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site area of 0.5 hectares or more.
    - condition:
        field: rural-exception-housing
        value: true
        description: 'Rural exception site (Policy H/11): affordable homes outside the village framework
          to meet local housing needs.'
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policies H/10 and H/11
source-text: For all major developments of 10 dwellings or more, or if the site area is 0.5 hectares or
  more, will be required to provide 40%affordable housing. For Rural Exception Site Policy H/11 - affordable
  homes outside the village framework to meet local housing needs.
must-include:
- item: Compliance with policy (40% affordable housing on qualifying sites)
  level: must
- item: The number of residential units
  level: must
- item: A balanced mix of dwelling sizes (bedrooms), types and tenures of the affordable homes, taking
    account of local housing needs evidence
  level: must
- item: The location of the affordable units
  level: must
- item: A viability assessment justifying any market housing
  level: must
  required-if:
    condition:
      field: rural-exception-housing
      value: true
      description: Rural exception site.
  source-text: Rural exception site affordable housing applications will, in addition to the above, be
    required to justify any market housing through a viability assessment.
- item: Evidence that no alternative sites exist that would have less impact on the Green Belt
  level: must
  required-if:
    all:
    - condition:
        field: rural-exception-housing
        value: true
        description: Rural exception site.
    - site:
        in:
        - green-belt
        description: In the Green Belt.
  source-text: If the site is within the Green Belt they must show that no alternative sites exist that
    would have less impact on the Green Belt, having regard to its purposes.
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Housing statement - affordable housing'. The same section appears in the 'Outline Planning
  Permission' checklists.
review-status: unverified
field-status: {}
