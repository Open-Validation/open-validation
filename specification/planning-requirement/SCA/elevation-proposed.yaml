  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Plan of elevations - proposed'. The same section appears in the 'Householder planning application',
  'Listed Building Consent', 'Advertisement consent' checklists. Advertisement drawings (size, siting,
  materials, height, projection, illumination) are listed separately and sent to unmapped.
