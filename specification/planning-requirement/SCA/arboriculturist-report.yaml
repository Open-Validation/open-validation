      - full
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Demolition, building or engineering operations (including excavation of foundations,
        changes in level and service/utility runs) may affect trees on site or on adjoining land.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: 'Householder: particularly Appendix 1 Tree survey/arboriculture implications When is it required?
  For sites on which demolition, building or engineering operations (including the excavation of foundations
  is being carried out, and for changes in level and service/utility runs) where these may affect trees
  both on-site, or on adjoining land.


  Full planning: as superseded) Tree survey/arboriculture implications When is it required? For sites
