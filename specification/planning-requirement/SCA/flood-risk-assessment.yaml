reference: flood-risk-assessment
local-authority: SCA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - site:
      in:
      - surface-water-flood-risk
      description: Less than 1 hectare in flood zone 1 (including a change to a more vulnerable use) where
        it could be affected by other sources of flooding such as surface water.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: 'Householder: validation requirement Flood risk assessment When is it required? A site specific
  Flood Risk Assessment (FRA) is required if the site is: In flood zone 2 or 3 including minor development
  and change of use More than 1 hectare in flood zone 1 Less than 1 hectare in flood zone 1, including
  a change of use in development type to a more vulnerable class (for example from commercial to residential),
  where they could be affected by other sources of flooding such as surface water.


  Full planning: Design Compendium Flood risk assessment When is it required? A site specific Flood Risk
  Assessment (FRA) is required if the site is: In flood zone 2 or 3 including minor development and change
  of use More than 1 hectare in flood zone 1 Less than 1 hectare in flood zone 1, including a change of
  use in development type to a more vulnerable class (for example from commercial to residential), where
  they could be affected by other sources of flooding such as surface water.'
must-include:
- item: Evidence that the Sequential Test and, where necessary, the Exception Test have been applied in
    selecting the site
  level: should
- item: Different types of flooding (for example fluvial, surface water and groundwater)
  level: should
- item: The risk of flooding arising from the development as well as to the site
  level: should
- item: The effect of climate change
  level: should
confidence: medium
notes: Rows from Change of use - prior approval were dropped after the audit. The must-include items were
  in the workbook's separate Sequential / Exception Test rows (audit, duplicate).
review-status: unverified
field-status: {}
