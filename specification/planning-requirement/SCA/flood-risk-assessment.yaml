reference: flood-risk-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3, including minor development and change of use.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in flood zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in flood zone 1.
    - all:
      - discretionary
      - any:
        - site:
            in:
            - surface-water-flood-risk
            description: Could be affected by other sources of flooding such as surface water.
        - condition:
            field: more-vulnerable-use-change
            value: true
            description: Change of use to a more vulnerable class (for example commercial to residential).
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: 'A site specific Flood Risk Assessment (FRA) is required if the site is: In flood zone 2
  or 3 including minor development and change of use More than 1 hectare in flood zone 1 Less than 1 hectare
  in flood zone 1, including a change of use in development type to a more vulnerable class (for example
  from commercial to residential), where they could be affected by other sources of flooding such as surface
  water.'
must-include:
- item: Evidence that the Sequential Test and, where necessary, the Exception Test have been applied
  level: must
- item: Different types of flooding (fluvial, surface water and groundwater)
  level: must
- item: Risk of flooding arising from the development as well as to the site
  level: must
- item: The effect of climate change
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Flood risk assessment'. The same section appears in the 'Outline Planning Permission', 'Householder
  planning application' checklists. The flood zone 1 sites under 1 hectare part ('where they could be
  affected by other sources of flooding') shows as discretionary.
review-status: unverified
field-status: {}
