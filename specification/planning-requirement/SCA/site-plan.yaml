reference: site-plan
local-authority: SCA
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: It is always required
must-include:
- item: Proposed site layout at a recognised scale (1:100, 1:200 or 1:500 as appropriate), with the direction
    of North and a scale bar or metric measurements
  level: must
- item: Buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: Public rights of way crossing or adjoining the site; the position of all trees on the site and
    on adjacent land
  level: should
- item: Extent and type of any hard surfacing; boundary treatment including walls or fencing
  level: should
- item: Existing car parking and turning arrangements; any existing bin and cycle stores
  level: should
- item: Existing site layout plan (same scale and content as the proposed site plan)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - hh
        - lbc
        - advertising
    - discretionary
    - any:
      - condition:
          field: demolition
          value: true
          description: The development involves demolition of existing structures.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: There are trees on site that may be affected.
  source-text: 'One may be required if: the proposed development involves the demolition of any existing
    structures there are trees on site that may be affected by the proposed development.'
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Site plan - proposed'. The same section appears in the 'Householder planning application',
  'Listed Building Consent' checklists. The 'should' items are what the list asks for 'unless these would
  not influence or be affected by the proposed development'. The existing site plan ('One may be required
  if') is also in the advertisement checklist (which has no proposed site plan), so advertisement consent
  shows as discretionary.
review-status: unverified
field-status: {}
