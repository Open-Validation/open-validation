reference: site-plan
local-authority: SCA
required-if:
  application-type:
    in:
    - hh
    - full
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: 'Site plan - existing When is it required? One may be required if: the proposed development
  involves the demolition of any existing structures there are trees on site that may be affected by the
  proposed development.'
must-include:
- item: An existing site plan
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: The development involves the demolition of existing structures.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on site that may be affected.
- item: North point, and a scale bar or metric measurements, at a recognised scale (1:100, 1:200 or 1:500)
  level: should
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The excerpt is the
  existing site plan trigger ('One may be required if ...').
review-status: unverified
field-status: {}
