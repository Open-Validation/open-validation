reference: roof-plan-proposed
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - lbc
  - condition:
      field: complex-roof-design
      value: true
      description: The proposal has a complex roof structure.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: They are required only for complex roof structures.
must-include:
- item: Shape of the roof at an appropriate scale, usually 1:50 or 1:100, with correct overall dimensions
    in metric measurements
  level: must
- item: Details such as the material, vents and their location
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Roof plans - proposed'. The same section appears in the 'Householder planning application',
  'Listed Building Consent' checklists.
review-status: unverified
field-status: {}
