reference: land-contamination-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - contaminated-land
        description: On or adjacent to land where contamination is known or suspected.
    - condition:
        field: agricultural-land
        value: true
        description: All agricultural land.
    - condition:
        field: industrial-site
        value: true
        description: Land previously used for industrial purposes.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed end use or users are sensitive and vulnerable to land contamination.
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a currently licensed or historic landfill site.
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy SC/11
source-text: Where development is on or adjacent to land where contamination is known or suspected to
  exist. All agricultural land and land previously used for industrial purposes. The proposed end use/users
  is/are sensitive and vulnerable to land contamination. The development is within 250 metres of a currently
  licensed or historic landfill site. The development could affect or cause the movement of contaminants
  within the ground.
must-include:
- item: 'Preliminary assessment (Phase I): historical and current land uses, environmental setting, initial
    risk assessment, Conceptual Site Model and proposals for intrusive investigation if necessary'
  level: must
- item: 'Intrusive assessment (Phase II) of ground conditions: existence and extent of contamination and
    plausible risks to human health or the environment, particularly from soils, groundwater and ground
    gases'
  level: must
- item: Updated risk assessment and Conceptual Site Model, and a remediation or mitigation strategy if
    contamination is found above assessment criteria
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Contamination land assessment'. The same section appears in the 'Outline Planning Permission'
  checklists. The discretionary part is 'The development could affect or cause the movement of contaminants
  within the ground.'
review-status: unverified
field-status: {}
