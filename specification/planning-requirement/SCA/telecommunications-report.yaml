reference: telecommunications-report
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications proposals.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy TI/7
source-text: For all telecommunications proposals
must-include:
- item: Area of search, details of any consultation, details of the proposed structure and technical justification
  level: must
- item: A signed declaration that the equipment and installation comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Telecommunications supplementary information'. The same section appears in the 'Outline Planning
  Permission' checklists.
review-status: unverified
field-status: {}
