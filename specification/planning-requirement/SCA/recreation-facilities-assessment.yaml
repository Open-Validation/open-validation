reference: recreation-facilities-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development (conversions or new build) which will need to make provision
          for new open space.
    - condition:
        field: loss-of-open-space
        value: true
        description: Proposals adversely affecting or leading to the loss of existing open space.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policies SC/7 and SC/8
source-text: For proposals for new residential development (conversions or new build) which will need
  to make provision for new open space. For proposals adversely affecting or leading to the loss of existing
  open space.
must-include:
- item: How the open space requirements of policy SC/7 are to be satisfied
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
- item: Where a loss is proposed, a statement having regard to policy SC/8
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Existing open space is affected or lost.
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Open space assessment'. The same section appears in the 'Outline Planning Permission', 'Remove
  or Variation of a Condition (Section 73)' checklists.
review-status: unverified
field-status: {}
