reference: daylight-sunlight-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy HQ/1
source-text: if new development or the altering or extending of existing buildings would overshadow neighbouring
  buildings or open spaces. This is particularly relevant for applications for tall buildings (any structure
  which breaks the existing skyline and/or is significantly taller than the surrounding built form). if
  existing mature tree planting may have an impact upon residential rear gardens.
must-include:
- item: Confirmation that the BRE 25 and 45 degree rules of thumb test has been carried out
  level: must
- item: If the test is not passed, an assessment of the impacts on daylight and sunlight
  level: must
  required-if:
    condition:
      field: fails-bre-basic-tests
      value: true
      description: The BRE 25 and 45 degree tests are not passed.
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Daylight/sunlight assessment/shadow study''. The same section appears in the ''Outline
  Planning Permission'' checklists. Discretionary: it depends on whether development ''would overshadow
  neighbouring buildings or open spaces''. The ''What is required'' text adds that ''A statement should
  be submitted with every application where new building works are proposed'' confirming the BRE test.'
review-status: unverified
field-status: {}
