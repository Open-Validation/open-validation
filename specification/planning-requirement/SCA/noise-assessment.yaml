reference: noise-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: The development would generate noise or vibration (including deliveries, servicing
            and traffic).
      - discretionary
    - all:
      - condition:
          field: plant-equipment
          value: true
          description: Installation of building services plant or equipment (flues, air conditioning,
            extraction, air source heat pumps, combustion appliances).
      - discretionary
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Residential or other noise-sensitive development close to existing noise sources
            (agent of change).
      - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy SC/10
source-text: Noise / Vibration Generation Where a proposed new development would generate noise or vibration
  including delivery and servicing and vehicle movements / traffic changes on local roads which may have
  a negative impact on existing or planned uses (in particular noise sensitive uses such as residential,
  hospitals, nursing homes, schools). Applications which involve the installation of mechanical and electrical
  building services plant / equipment such as flues, air handling units / air conditioning, extraction,
  air source heat pumps, combustion appliances. New Noise Sensitive Premises Proposals for residential
  and other noise sensitive development close to existing sources of noise such as transport (road, rail
  and air) and industrial, commercial or business premises. Where the operation of an existing / established
  business or community facility generating noise could have an unacceptable significant adverse effect
  on proposed new development (including changes of use) in its vicinity such as the introduction of new
  noise sensitive premises into an area for example, residential ('agent of change principle').
must-include:
- item: Undertaken by a suitably qualified and competent acoustician, following current guidance and British
    Standards
  level: must
- item: The existing noise environment and the noise sources or activities associated with, or affecting,
    the development
  level: must
- item: The number of deliveries and the times of deliveries and servicing
  level: must
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Noise/vibration assessment''. The same section appears in the ''Outline Planning Permission'',
  ''Householder planning application'' checklists. Each trigger is discretionary: the list says ''Where
  necessary an acoustic ... assessment will be undertaken'', and its guidance note says ''Not normally
  required but may be for heat pumps etc.'''
review-status: unverified
field-status: {}
