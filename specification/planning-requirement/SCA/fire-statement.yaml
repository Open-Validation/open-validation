reference: fire-statement
local-authority: SCA
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A height of 18 metres or more.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: Government (2015) Fire safety statement When is it required? It is required where a building
  contains 2 or more dwellings or educational accommodation and has a height of 18 metres or more, or
  7 or more storeys whichever is reached first What is required? Fire statements must be submitted on
  a form published by the Secretary of State (or a form to similar effect) and contain the particulars
  specified or referred to in the form, which includes information about (not exhaustive list) the principle
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given.
review-status: unverified
field-status: {}
