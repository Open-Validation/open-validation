reference: landscaping-plan
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - discretionary
    - site:
        in:
        - green-belt
        description: Development in or adjacent to the Green Belt.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy HQ/1
source-text: Major development and where landscape proposals will be necessary because the new development
  is likely to have an impact on the local and/or wider landscape or townscape as a result of its proposed
  location or height. Development in or adjacent to the Green Belt.
must-include:
- item: As a minimum, a landscape strategy or indicative planting scheme
  level: must
  required-if:
    ref: major-development
- item: Management and maintenance plans, showing hard paving to be adopted by Cambridgeshire County Council
    and SuDS and landscape features to be adopted by the council
  level: must
- item: 'For large scale and complex sites: a masterplan and design code setting the overall site landscape
    vision and strategy'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Landscape details''. The same section appears in the ''Outline Planning Permission''
  checklists. Discretionary part: ''where landscape proposals will be necessary because the new development
  is likely to have an impact''.'
review-status: unverified
field-status: {}
