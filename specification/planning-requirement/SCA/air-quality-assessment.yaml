reference: air-quality-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: In or affecting an Air Quality Management Area.
      - discretionary
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: A sensitive use (residential, schools, care homes) is proposed in an area of poor
            air quality or near busy roads.
      - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policies SC/12, SC/14 and TI/2
source-text: 'If air quality is likely to be a significant issue. This could be either from: Where a development
  would adversely affect air quality in a designated Air Quality Management Area (AQMA), or lead to the
  declaration of a new or increase an existing AQMA, or render unworkable elements of our Air Quality
  Action Plan. Proposed introduction of a sensitive use (for example, residential) into an area of poor
  air quality. Proposed introduction of a sensitive use (for example, schools and care homes) near busy
  roads where pollution from traffic is of concern.'
must-include:
- item: Assessment using guidance current at the time of the application
  level: must
- item: A site based Low Emission Strategy
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 20
        description: Residential developments at or above 20 dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Residential developments at or above 0.5 hectares.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: Other developments at or above 1000m2.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Other developments at or above 1 hectare.
  source-text: A site based Low Emission Strategy is required for Large development proposals that require
    a Transport Assessment and a Travel Plan (Policy TI/2).
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Air quality assessment''. The same section appears in the ''Outline Planning Permission''
  checklists. Discretionary: the list asks for it ''If air quality is likely to be a significant issue''.
  The Low Emission Strategy is for ''Large development proposals that require a Transport Assessment and
  a Travel Plan'', so it uses the transport thresholds.'
review-status: unverified
field-status: {}
