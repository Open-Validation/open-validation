reference: lighting-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: external-lighting
          value: true
          description: New external artificial lighting or changes to existing lighting (including illuminated
            adverts and outdoor sports facilities).
      - discretionary
    - all:
      - ref: major-development
      - discretionary
    - condition:
        field: floodlighting
        value: true
        description: Proposals for floodlighting.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy SC/9
source-text: For proposals for new external artificial lighting or changes to existing lighting may have
  an adverse impact on local residential amenity, wildlife or landscape character through light pollution.
  Illuminated adverts and outdoor sports facilities (including multi-use games area) where external lighting
  is proposed. In particular major sites at the edge of Cambridge and adjoining open countryside in South
  Cambridgeshire and proposals for floodlighting.
must-include:
- item: Details of external lighting, including building, security, floodlighting, street or courtyard
    columns and bollards
  level: must
- item: 'For major sites: an artificial lighting assessment of the impact on sensitive residential premises
    on and off site'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Lighting (artificial) assessment''. The same section appears in the ''Outline Planning
  Permission'' checklists. Discretionary: lighting that ''may have an adverse impact'', and ''major sites
  at the edge of Cambridge and adjoining open countryside''.'
review-status: unverified
field-status: {}
