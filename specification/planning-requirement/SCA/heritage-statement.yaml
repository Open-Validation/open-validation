reference: heritage-statement
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - s73
      - reserved-matters
  - any:
    - site:
        in:
        - world-heritage-site
        - scheduled-monument
        - listed-building
        - park-and-garden
        - conservation-area
        description: Development affecting a designated heritage asset.
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policies NH/14 and NH/15
source-text: 'Development affecting a heritage asset. Heritage assets are buildings, monuments, sites,
  places, areas or landscapes which are significant because of their historic interest. Designated heritage
  assets include: World Heritage Site Scheduled Monument Listed Building Registered Park and Garden Conservation
  Area For new development, consideration should be given to the potential of archaeological assets.'
must-include:
- item: Identifies the heritage assets and shows how the proposals preserve or enhance their significance
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Heritage statement'. The same section appears in the 'Outline Planning Permission', 'Householder
  planning application', 'Listed Building Consent', 'Remove or Variation of a Condition (Section 73)',
  'Approval of Reserved Matters' checklists. Non-designated heritage assets and 'the potential of archaeological
  assets' for new development are covered by the discretionary part.
review-status: unverified
field-status: {}
