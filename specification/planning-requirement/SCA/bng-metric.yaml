reference: bng-metric
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: You must demonstrate how your major development site meets the minimum mandatory requirement
  of 10% biodiversity net gain over the pre-development value of the site. The minimum information that
  you must submit is set out in paragraph 9 of the draft biodiversity net gain planning practice guidance.
must-include:
- item: A completed statutory biodiversity metric, in Excel format
  level: must
- item: A scaled plan
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Biodiversity Net Gain assessment'. The same section appears in the 'Outline Planning Permission',
  'Approval of Reserved Matters' checklists. The list's wording refers to 'your major development site',
  but biodiversity net gain applies by law to all development that is not exempt, so the rule uses the
  biodiversity gain condition.
review-status: unverified
field-status: {}
