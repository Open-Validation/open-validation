reference: section-proposed
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
  - discretionary
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The site, or the site and surrounding land, are at variable levels.
    - condition:
        field: roof-alteration
        value: true
        description: The proposal involves a roof extension or roof-lights.
    - condition:
        field: external-alterations
        value: true
        description: The proposal involves installing windows.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: 'It may be required where: a site or site and surrounding land are at variable levels the
  proposal involves a roof extension or installation of roof-lights or windows.'
must-include:
- item: How the proposals relate to existing ground levels, or where ground levels would be modified
  level: must
- item: Drawn to an identified scale or showing metric measurements
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Cross-section and site levels - proposed'. The same section appears in the 'Householder planning
  application' checklists. Shown as discretionary because the list says 'It may be required'.
review-status: unverified
field-status: {}
