reference: town-centre-impact-assessment
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - site:
          in:
          - town-centre
          description: In a Rural Centre village centre.
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 500
          description: Additional retail floorspace resulting in a retail unit over 500 m2 (gross).
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside such centres.
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 250
          description: Additional retail floorspace resulting in a retail unit over 250 m2 (gross).
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policies E/22 and E/23
source-text: 'Proposals involving additional retail floorspace resulting in a retail unit in excess of
  the following thresholds should be accompanied by a Retail Impact Assessment, including a sequential
  test: Rural Centre village centres 500 m2 (gross) Outside such centres 250 m2 (gross)'
must-include:
- item: Impact on existing, committed and planned investment in centres in the catchment
  level: must
- item: Impact on town and village centre vitality and viability, including consumer choice and trade
  level: must
- item: 'Sequential test: evidence that no sequentially preferable sites are available in Town and Rural
    Centres'
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Retail statement'. The same section appears in the 'Outline Planning Permission' checklists.
  The thresholds refer to the size of the resulting retail unit; retail-floorspace is used for it.
review-status: unverified
field-status: {}
