reference: construction-management-plan
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: for all Major Developments or developments that are likely to result in noise, smells, dust,
  visual or other adverse effects during the construction. if a Construction Management Plan is not submitted
  with the application, it is likely that details will be required by planning condition.
must-include:
- item: Management of materials (including soils) and wastes on site, including re-use and recycling
  level: must
- item: Siting and layout of construction compounds and contractor parking
  level: must
- item: Mitigation for works that might cause noise, smell, dust, visual or other impacts
  level: must
- item: Temporary haul roads and accesses, and management of vehicle movements
  level: must
- item: Wheel washing facilities, working and delivery hours, methods of demolition
  level: must
- item: Protection measures for sensitive features such as water courses or neighbouring residences
  level: must
- item: Details and location of site lighting; external safety and information signage
  level: must
- item: Complaints procedures, including contact details and response procedures
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Construction management plan'. The same section appears in the 'Outline Planning Permission'
  checklists. The discretionary part is 'developments that are likely to result in noise, smells, dust,
  visual or other adverse effects during the construction'.
review-status: unverified
field-status: {}
