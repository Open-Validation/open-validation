reference: application-form
local-authority: SCA
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
    - s73
    - non-material-amendment
    - approval-condition
    - ldc
    - advertising
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
source-text: Always required - A completed form is always required (one copy of all application documents
  must be supplied if submitted by post).
must-include:
- item: Every section completed; where sections or questions are not relevant, this is stated on the form
  level: must
- item: The relevant ownership certificate (A, B, C or D) completed, signed and dated; only one certificate
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - s73
      - ldc
  source-text: The relevant certificate must be completed, signed and dated (part of application form).
    Only one certificate should be completed.
- item: A copy of the notice served on owners (Notice 1, or Notice 2 published for unknown owners) sent
    with the application
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Ownership certificate B, C or D is completed.
  source-text: The Notice to Owners (Notice 1) must also be completed and sent to all known owners. A
    copy of the notice must be sent with the application to the local authority.
confidence: medium
notes: 'From the council''s list (published 28 January 2026), ''Full planning permission'' checklist web
  page, section ''Application form''. The same section appears in the ''Outline Planning Permission'',
  ''Approval of Reserved Matters'', ''Listed Building Consent'', ''Non-Material Amendment (Section 96A)'',
  ''Approval of Details Reserved by Condition'', ''Lawful Development Certificate - Existing Use or Development'',
  ''Lawful Development Certificate - Proposed Use or Development'', ''Advertisement consent'' checklists.
  The householder and section 73 checklists have no separate application form section, but list ''Ownership
  certificates'' as ''always required (part of application form)''; ownership certificates are also listed
  for full, outline, listed building and proposed lawful development certificate applications. For discharge
  of conditions you can use the form or ''give a full written description of the details needed to discharge
  the condition(s)''. Prior approvals: the council refers only to the national requirements in the GPDO,
  so no local items are set for them.'
