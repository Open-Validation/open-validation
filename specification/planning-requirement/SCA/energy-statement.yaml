reference: energy-statement
local-authority: SCA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission
policy: South Cambridgeshire Local Plan Policy CC/3; Greater Cambridge Sustainable Design and Construction
  SPD 2020
source-text: All major new development
must-include:
- item: How the carbon reduction requirements for new development have been met
  level: must
- item: Carbon calculations based on Building Regulations Part L (SAP/SBEM)
  level: must
- item: Set out following the energy hierarchy (Be Lean, Be Clean, Be Green), with the 10% requirement
    calculated on baseline emissions after the Be Lean and Be Clean elements
  level: must
confidence: medium
notes: From the council's list (published 28 January 2026), 'Full planning permission' checklist web page,
  section 'Energy statement'. The same section appears in the 'Outline Planning Permission' checklists.
  Can be part of the sustainability statement or a standalone document.
review-status: unverified
field-status: {}
