reference: waste-management-plan
local-authority: SRI
required-if:
  any:
  - condition:
      field: construction-cost
      operator: '>'
      value: 300000
      description: Construction projects with an estimated cost greater than £300,000.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Retail, commercial and industrial developments.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential apartments.
    - discretionary
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: South Ribble Planning Policies
source-text: For all construction projects with an estimated cost greater than £300,000; for development
  of residential apartments, retail, commercial and industrial developments; the storage of any hazardous,
  clinical waster, irrelevant of the size of the development.
must-include:
- item: The number, design and location of bin stores and recycling facilities, their capacity and how
    it was calculated
  level: must
- item: A recycling strategy, and how refuse vehicles and staff will access and service the site
  level: must
- item: 'For developments homing animals: details of odour abatement'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published August 2026), Waste Management Statement row, page 40. Apartments
  (no field separates flats from houses), storage of hazardous or clinical waste and developments homing
  animals are shown as the council's discretion.
review-status: unverified
field-status: {}
