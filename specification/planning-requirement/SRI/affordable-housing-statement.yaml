reference: affordable-housing-statement
local-authority: SRI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Residential development of 15 or more dwellings (urban areas).
  - all:
    - site:
        in:
        - rural-area
        description: The site is in a rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10 or more dwellings.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
source-text: For residential developments of 15 dwellings or more in urban areas where a 30% affordable
  provision is required
confidence: medium
notes: 'From the audit (missing_requirement): 15+ dwellings in urban areas (30%), 10+ in rural areas (35%),
  and 100% on rural exception or Green Belt sites (shown as discretionary).'
review-status: unverified
field-status: {}
