reference: affordable-housing-statement
local-authority: SRI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Residential development of 15 dwellings or more (urban areas, 30% affordable).
  - all:
    - site:
        in:
        - rural-area
        description: In a rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10 dwellings or more in rural areas (35% affordable).
  - condition:
      field: rural-exception-housing
      value: true
      description: '''Exception'' sites (100% affordable).'
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'Core Strategy Policy 7: Affordable and Special Needs Housing; National Planning Policy Framework'
source-text: For residential developments of 15 dwellings or more in urban areas where a 30% affordable
  provision is required, and residential developments of 1O dwellings or more in rural areas where a 35%
  affordable provision is required. On 'Exception' sites or those in the Green Belt, a 100% provision
  is required.
must-include:
- item: The number and mix of units and the floor space of habitable areas
  level: should
- item: Plans showing the location, type, floor space and number of bedrooms of the units
  level: should
- item: Justification of any variation from policy
  level: should
- item: 'Where different levels or types of affordability or tenure are proposed: a clear explanation,
    with details of any Registered Social Landlord partners'
  level: should
- item: 'Where Vacant Building Credit is claimed: the period of vacancy and the last known date of use'
  level: should
  required-if:
    condition:
      field: vacant-building
      value: true
      description: Vacant Building Credit is claimed.
- item: 'Where an off-site affordable housing contribution is proposed: a financial viability report of
    the site'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published August 2026), Affordable Housing Statement row, page 9. Sites
  in the Green Belt also need 100% provision; the off-site contribution item depends on what is proposed,
  so it is shown as the council's discretion.
review-status: unverified
field-status: {}
