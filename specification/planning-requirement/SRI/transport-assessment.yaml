source-text: The thresholds for submission are set out in the table in Appendix 2 The proposed parking
  provision should be adequately justified
must-include:
- item: Measures to deal with the anticipated transport impacts in relation to all forms of travel, and
    to improve accessibility and encourage sustainable travel
  level: must
- item: The impact on the entire transport system near the development, by all modes, including the railway
    network
  level: must
- item: Proposed parking provision justified and linked to the type of development
  level: should
- item: 'For smaller schemes, a Transport Statement: site audit, baseline traffic, existing use and access,
    scale, access, trip generation and distribution by mode, accessibility improvements, parking and servicing
    strategy, vehicle trip impact, construction traffic and net change in traffic flows'
  level: should
  required-if: discretionary
