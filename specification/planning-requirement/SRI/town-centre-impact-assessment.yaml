reference: town-centre-impact-assessment
local-authority: SRI
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development outside the centres, not in accordance with the
        development plan.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over the default threshold of 2,500 sq m.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Ensuring the Vitality of Town
  Centres; South Ribble Planning Policies'
source-text: For planning applications for retail, leisure and office development outside of the centres,
  which are not in accordance with the development plan and are over the default threshold of 2,500 sq
  m. … For retail, leisure and office development outside of town centres; those which are not in accordance
  with an up-to-date … Local Plan, if the development is over a proportionate, locally set floorspace
  threshold (the default threshold is 2,500 sq m)
must-include:
- item: The need for additional floor space
  level: must
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
- item: Impact on town centre vitality and viability, including consumer choice and trade, up to five
    years ahead (ten years for major schemes whose full impact takes longer)
  level: must
- item: 'Sequential assessment: town centre, then edge-of-centre, then out-of-centre sites, preferring
    accessible, well-connected sites, with flexibility on format and scale'
  level: must
confidence: medium
notes: From the council's list (published August 2026), Retail Impact Assessment and Sequential Assessment
  rows, page 16-17.
review-status: unverified
field-status: {}
