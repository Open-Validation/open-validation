reference: air-quality-assessment
local-authority: SRI
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Inside or adjacent to an Air Quality Management Area.
  - condition:
      field: traffic-aadt-increase
      operator: '>='
      value: 10
      description: An increase of 10% or more in traffic outside an AQMA.
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Within an AQMA.
    - condition:
        field: traffic-aadt-increase
        operator: '>='
        value: 5
        description: An increase of 5% or more in traffic within an AQMA.
  - condition:
      field: hgv-movements-daily
      operator: '>='
      value: 200
      description: An increase of 200 or more heavy goods vehicles per day.
  - condition:
      field: parking-spaces
      operator: '>='
      value: 100
      description: An increase in car parking of 100 spaces (outside an AQMA).
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Within an AQMA.
    - condition:
        field: parking-spaces
        operator: '>='
        value: 50
        description: An increase in car parking of 50 spaces within an AQMA.
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Within an AQMA.
    - any:
      - condition:
          field: dwelling-count
          operator: '>'
          value: 10
          description: More than 10 dwellings within an AQMA.
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: More than 1,000 m² floorspace within an AQMA.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 75
      description: More than 75 dwellings.
  - condition:
      field: floorspace
      operator: '>'
      value: 10000
      description: More than 10,000 m² floorspace.
  - condition:
      field: biomass-or-chp
      value: true
      description: The development includes a combined heat and power plant.
  - condition:
      field: direct-air-emissions
      value: true
      description: Industrial processes with direct emissions to the air.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Air Quality; Environmental Health
  Planning Advisory Note'
source-text: Where the development is inside or • adjacent to an Air Quality Management Area (AQMA) or
  where the development could result in the designation of an AQMA; Where a development will lead to an
  increase of 5% • more in traffic within an AQMA • 10% elsewhere; Where the Average Annual Daily Traffic
  (AADT) would exceed 10,000 vehicles (or 5,000 if narrow and congested); • Where a development would
  increase the number of heavy goods vehicles by 200 or more per day; Where there would be an increase
  in car parking of 50 parking spaces within an AQMA and 100 parking spaces elsewhere; … For development
  in excess of 10 dwellings/1,000m2 floorspace within an AQMA; For development exceeding 75 dwellings
  or 10,000m2 floorspace; • Where the development includes a or combined heat and power plant; Proposals
  for industrial processes where there are direct emissions to the air.
must-include:
- item: The impact of the proposal on local air quality and of local air quality on future site users
  level: must
- item: Existing and proposed air quality, with and without the development, including all permitted development
    in the area
  level: must
- item: Mitigation measures or controls to avoid or mitigate significant adverse impacts
  level: must
confidence: medium
notes: From the council's list (published August 2026), Air Quality Assessment row, page 30-31. Developments
  that could lead to an AQMA being designated, or where traffic would exceed 10,000 AADT (5,000 if narrow
  and congested), are shown as the council's discretion (no field for total traffic).
review-status: unverified
field-status: {}
