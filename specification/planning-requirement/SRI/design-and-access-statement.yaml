reference: design-and-access-statement
local-authority: SRI
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a designated area (conservation area or World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with 100 square metres or more of floor space.
  - application-type:
      in:
      - lbc
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The type of applications that must be accompanied by a D & A Statement are: a) Applications
  for major development b) Applications for development in a designated area, where the proposed development
  consists of one or more dwellings or a building(s) with a floor space of 100 square metres or more.
  … c) Applications for listed building consent'
must-include:
- item: Explains how the proposed development is suitable for the site and its setting and shows it can
    be adequately accessed
  level: should
- item: 'For listed building consent: the design principles and concepts applied to the works, and how
    they take account of the special architectural or historic importance of the building and its particular
    physical features'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: must include an explanation of the design principles and concepts that have been applied
    to the proposed works, and how they have taken account of the special architectural or historic importance
    of the building; the particular physical features of the building that
confidence: medium
notes: From the council's list (published August 2026), section 5, page 3. The sentence on listed building
  consent is cut off in the PDF. For major applications with new or changed access, written access details
  should also be in the statement.
review-status: unverified
field-status: {}
