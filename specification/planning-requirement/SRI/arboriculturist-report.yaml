reference: arboriculturist-report
local-authority: SRI
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site, on adjacent land within 15 metres of the boundary, or street trees
      between the site and the highway.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'Local Plan Policy G13: Trees, Woodlands and Development; BS 5837:2012'
source-text: Where there are trees within the application site, trees on adjacent land within 15 metres
  of the boundary, and street trees between the site and the highway and/or carriageway
must-include:
- item: By a suitably qualified arboriculturist, to BS 5837:2012
  level: must
- item: Categorisation of the trees and which are to be retained or removed
  level: must
- item: Root Protection Areas of retained trees and how they will be protected during construction
  level: must
- item: 'A Tree Protection Plan: a scaled drawing showing trees for retention and the protection measures'
  level: must
confidence: medium
notes: From the council's list (published August 2026), Tree Survey and Arboricultural Implications Assessment
  row, page 27-29, 47. For householder applications it is needed if the answer to question 7 of the application
  form (trees) is 'Yes'.
review-status: unverified
field-status: {}
