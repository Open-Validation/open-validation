reference: noise-assessment
local-authority: SRI
required-if:
  any:
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use to Class E(b), E(c)(ii and iii), E(d), E(f), E(g)(ii and iii), F2(b),
          F2(c) or Sui Generis.
    - discretionary
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Next to classified roads, railway or existing industrial uses.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential premises.
    - condition:
        field: near-licensed-premises
        value: true
        description: Near to licensed premises.
  - condition:
      field: industrial-floorspace
      operator: '>'
      value: 0
      description: New commercial development within use class B2.
  - condition:
      field: warehousing-floorspace
      operator: '>'
      value: 0
      description: New commercial development within use class B8.
  - condition:
      field: plant-equipment
      value: true
      description: Air conditioning units on dwellinghouses, and on commercial premises in a residential
        area.
  - condition:
      field: renewable-energy-development
      value: true
      description: Renewable energy schemes.
  - condition:
      field: use-class
      value: restaurant-cafe
      description: All applications relating to A3 uses, including changes of use to A3.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Noise; South Ribble Planning
  Policies'
source-text: Change of use applications to Class EB, EC (ii and iii) ED, EF, EG (ii and iii) F2b, F2c
  and Sui Generis, depending on proximity to residential properties; New residential development adjacent
  to classified roads, railway or existing industrial uses; New residential premises near to licensed
  premises; New commercial development within use class B2 or B8 and other … noise sensitive uses such
  as schools, care homes etc adjacent to existing residential development, extension to existing premises,
  air conditioning units on dwellinhouses and on commercial premises in residential area and renewable
  energy schemes … For all applications relating to A3 uses, including changes of use to A3 uses.
must-include:
- item: The potential impact of the development on its surroundings, and on the development from the present
    noise climate
  level: must
- item: Detailed mitigation measures, considering design before noise barriers
  level: should
- item: A vibration assessment where the development is next to a railway line or has equipment likely
    to cause excess vibration
  level: should
  required-if: discretionary
- item: Noise impacts during the construction phase
  level: should
- item: 'For A3 uses: noise assessment to BS4142: 2014+A1:2019'
  level: must
  required-if:
    condition:
      field: use-class
      value: restaurant-cafe
      description: A3 use.
  source-text: 'Noise Assessments should be undertaken in line with BS4142: 2014+A1:2019'
confidence: medium
notes: From the council's list (published August 2026), Noise Impact Assessment and Noise/Odour Assessment
  rows, page 13-14, 30. Changes of use depend on proximity to homes, and 'other noise sensitive uses',
  extensions to existing premises and the vibration assessment have no clear test, so they are shown as
  the council's discretion. The odour part of the Noise/Odour Assessment is in the unmapped list.
review-status: unverified
field-status: {}
