reference: landscaping-plan
local-authority: SRI
required-if:
  any:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: All new residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Commercial development.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: National Planning Policy Framework; National Planning Practice Guidance; South Ribble Planning
  Policies
source-text: All new residential development … Major applications, residential developments, commercial
  development.
must-include:
- item: Scaled plans showing hard and soft landscaping, levels, paving treatment and materials
  level: must
- item: Plant species, position, number and/or densities per square metre with the area, and the size
    and specification of plants
  level: must
- item: A survey of existing site features of landscape, amenity or nature conservation interest, showing
    what is retained and removed
  level: should
- item: Existing or proposed underground or overhead services that could affect planting
  level: should
- item: Pathways, hard standing, mounding or earth contouring, and boundary treatments
  level: should
- item: Long-term maintenance and landscape management, with a five-year planting and maintenance schedule
  level: should
- item: How the scheme relates to the wider ecological network
  level: should
- item: 'Where open space is provided: a management and maintenance schedule'
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: The development includes open space provision.
- item: 'For sites particularly sensitive in landscape or visual terms: a Landscape and Visual Impact
    Assessment by a qualified landscape professional'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published August 2026), Landscaping Details rows, page 10, 24.
review-status: unverified
field-status: {}
