reference: sustainable-drainage-strategy
local-authority: SRI
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - critical-drainage-area
      description: In a Critical Drainage Area.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: National Planning Policy Framework; Technical Standards for Sustainable Drainage Systems; South
  Ribble Planning Policies
source-text: A SuDS Strategy and SuDS Pro-forma are both a requirement for any application for major development.
  … If your development proposal is for major development1, or in a Critical Drainage Area, regardless
  of your type of planning application, you must submit the following with your
must-include:
- item: The overall approach to SuDS and evidence for surface water management (plans, drawings, calculations)
  level: must
- item: Drainage design, construction phases, management of SuDS during and after development, maintenance
    schedule and adoption arrangements
  level: must
- item: Takes account of any requirements in the site-specific Flood Risk Assessment
  level: must
- item: A completed South Ribble SuDS pro-forma
  level: must
- item: How the development relates to existing foul and surface water drainage, and any history of flooding
  level: should
- item: 'For foul drainage to a public sewer: a load/flow assessment by a suitably qualified professional'
  level: should
- item: 'Where surface water would connect to a public foul sewer: written confirmation of agreement from
    United Utilities'
  level: must
  required-if: discretionary
- item: 'For non-mains drainage: a foul drainage assessment by a drainage specialist, the system and soakaway
    shown within the site on the location plan, and percolation tests for any soakaway'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: A non-mains drainage system is proposed.
confidence: medium
notes: From the council's list (published August 2026), Sustainable Drainage row and Appendix 5 guidance,
  page 32, 32-34, 58.
review-status: unverified
field-status: {}
