reference: cil-form
local-authority: SRI
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
      - ldc-existing-use
      - ldc-prospective-use
  - condition:
      field: cil-liable
      value: true
      description: 'Development that will or may be liable for CIL: new or additional gross internal area,
        including extensions, annexes and new dwellings.'
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Community Infrastructure Levy Regulations 2010
source-text: 'Development involving new or additional gross internal area for residential and non-residential
  buildings, including extensions, annexes and new dwellings. Applicants for full planning permission,
  reserved matters following an outline planning permission, PIP Stage 2 Technical Details and applicants
  for lawful development certificates. … All applications for a development that will be or may be liable
  for CIL must submit Form 1: CIL Additional Information.'
must-include:
- item: 'Form 1: CIL Additional Information, with accurate floorspace in sections 6 and 7'
  level: must
confidence: medium
notes: From the council's list (published August 2026), CIL row, page 8. CIL Form 1 is not required for
  householder applications at validation; extensions over 100 sq m are handled during the application.
review-status: unverified
field-status: {}
