reference: section-existing
local-authority: SRI
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Drawn at a scale of 1:50 or 1:100 must be submitted and should show a cross section(s) through
  the proposed building(s). … This will be required for all applications involving new buildings.
must-include:
- item: At a scale of 1:50 or 1:100, with a cross section through the proposed building(s)
  level: must
- item: 'Where ground levels change: existing and finished site and floor levels, including foundations
    and eaves, and how encroachment onto adjoining land is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: 'For new buildings: existing site levels and finished floor levels related to a fixed datum point
    off site, and the proposals in relation to adjoining buildings'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The application involves new buildings.
- item: A reference number and date, with any revision clearly marked and dated
  level: must
confidence: medium
notes: From the council's list (published August 2026), section 6e, page 1-5, 46. For householder development
  the levels may be evident from the floor plans and elevations.
review-status: unverified
field-status: {}
