source-text: For all works affecting a Listed Building or structure; all works affecting unlisted buildings
  identified as heritage assets, all development with a Conservation Area; works affecting a Scheduled
  Monument; works affecting a | A Heritage Statement must assess the significance of heritage assets which
  may be affected by a proposed development, including their setting. Significance is defined as the value
  of a heritage asset to this and future generations because of its heritage interest. That interest may
  be archaeological, architectural, artistic or historic. The statement should also include an assessment
  of the National & Local Policy Drivers | | Types of application that | What information is required?
  | | requires this information | | | | | | | | Historic Environment South Ribble Planning Polices Historic
  England Lancashire Historic Environment Record | Registered Park or Garden of Special Historic Interest,
  all development affecting an archaeological site.
must-include:
- item: The significance of heritage assets that may be affected, including their setting
  level: must
- item: The likely impact of the development on the assets or their setting
  level: should
- item: A mitigation strategy to address any impacts on significance
  level: should
- item: 'For listed buildings: the schedule of works, an analysis of character, significance and archaeology,
    the justification for the works and their impact, the setting, and a structural survey'
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: Works affecting a listed building.
confidence: medium
notes: From the council's list (published August 2026), Heritage Statement row, page 23-25, 47. The householder
