reference: viability-assessment
local-authority: SRI
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Deliverability may be compromised by the scale of planning obligations and other costs.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Housing and economic development
  needs assessment; South Ribble Planning Policies'
source-text: Viability Statement may be required where the deliverability of the development may be compromised
  by the scale of planning obligations and other costs.
must-include:
- item: Informed by the particular circumstances of the site and the proposed development
  level: should
confidence: medium
notes: From the council's list (published August 2026), Viability Statement row, page 12. The list says
  it 'may be required', so it is also shown as the council's discretion. Applicants are expected to pay
  for independent reviews.
review-status: unverified
field-status: {}
