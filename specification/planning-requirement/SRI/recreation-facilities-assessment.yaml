reference: recreation-facilities-assessment
local-authority: SRI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development with a net gain of ten or more dwellings.
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of existing open space, sports or recreational land or buildings.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: National Planning Policy Framework; Central Lancashire Supplementary Planning Document, Open Space
  and Playing Pitches 2013; South Ribble Planning Policies
source-text: Open space and playing pitch provision or a financial contribution will only be required
  on residential developments resulting in a net gain of ten or more dwellings.
must-include:
- item: Existing or proposed open space within or adjoining the site, with plans showing its extent
  level: must
- item: 'For loss of existing open space or buildings: evidence (an independent assessment) that they
    are surplus to requirements'
  level: should
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
- item: 'For loss of accessible natural greenspace: justification and any mitigation or compensation'
  level: should
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of natural greenspace.
confidence: medium
notes: 'From the council''s list (published August 2026), Open Space Assessment row, page 24-26. Exceptions:
  nursing and rest homes, sheltered accommodation, replacement dwellings and 100% affordable housing schemes.'
review-status: unverified
field-status: {}
