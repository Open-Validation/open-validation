reference: proposed-habitat-plan
local-authority: SRI
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Environment Act 2021; Town and Country Planning Act 1990 (as amended)
source-text: Pre-development and post-development plans, showing the location of onsite habitat and drawn
  to an identified scale and showing the direction of North. … Please provide BNG provide shape files
  of the site and the finalised planned post development habitats which are to be retained and/or created.
must-include:
- item: Post-development plan showing the location of onsite habitat, drawn to an identified scale with
    the direction of North
  level: must
- item: Shape files of the finalised planned post-development habitats to be retained and/or created
  level: should
confidence: medium
notes: From the council's list (published August 2026), Appendix 8, page 103, 7. The list applies BNG
  to major and minor applications; shown with the biodiversity gain condition, as the law sets (householder
  and other exempt applications are exempt; Appendix 8 tabulates the exemptions).
