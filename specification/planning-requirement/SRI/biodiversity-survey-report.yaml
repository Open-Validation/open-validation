reference: biodiversity-survey-report
local-authority: SRI
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - priority-habitat
      - local-wildlife-site
      description: The site is in or affects a SSSI, SPA, priority habitat, Biological Heritage Site or
        Local Nature Reserve.
  - condition:
      field: greenfield-site
      value: true
      description: Greenfield sites.
  - condition:
      field: protected-species
      value: true
      description: Protected species may be affected.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
source-text: Interest or Special Protection Area (SPA), or a priority habitat; on Greenfield sites or
  sites where natural features exists; on locally designated Biological Heritage Sites and Local Nature
  Reserves An Ecological/ Geological Assessment and Survey should be undertaken and prepared by a suitably
  qualified person
confidence: medium
notes: 'Audit (wrong_trigger, duplicate): the workbook''s ecology row quoted the EPS licence sentence;
  the trigger was filed under its Habitats Regulations row and is cut at the start. Sites with natural
  features are shown as discretionary. The list also has a separate Protected Species Assessment and Survey.'
