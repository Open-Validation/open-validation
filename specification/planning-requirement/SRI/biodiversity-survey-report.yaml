reference: biodiversity-survey-report
local-authority: SRI
required-if:
  any:
  - site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      - site-of-special-scientific-interest
      - national-nature-reserve
      description: Likely impact on an internationally or nationally designated site (SPA, SAC, Ramsar,
        SSSI, NNR).
  - site:
      in:
      - local-wildlife-site
      - local-nature-reserve
      description: Likely impact on a Biological Heritage Site or Local Nature Reserve.
  - site:
      in:
      - priority-habitat
      description: Likely impact on a priority habitat (Priority Habitat Trigger List).
  - condition:
      field: greenfield-site
      value: true
      description: Greenfield sites.
  - condition:
      field: geodiversity-interest
      value: true
      description: Geological features may be affected.
  - condition:
      field: protected-species
      value: true
      description: Proposals which may affect protected species or their habitats.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'Core Strategy Policy 22: Biodiversity and Geodiversity; Local Plan Policy G16: Biodiversity and
  Nature Conservation; Biodiversity and Nature Conservation SPD; Conservation of Habitats and Species
  Regulations 2017'
source-text: Where a development is likely to have an impact on an internationally or nationally designated
  area, for example a Site of Special Scientific Interest or Special Protection Area (SPA), or a priority
  habitat; on Greenfield sites or sites where natural features exists; on locally designated Biological
  Heritage Sites and Local Nature Reserves … Applications for development proposals which may affect protected
  species or their habitats
must-include:
- item: Prepared by a suitably qualified person, at an appropriate time of year, in suitable weather,
    using nationally recognised survey guidelines
  level: must
- item: Habitats and features present on and around the site, their extent, and a map of their distribution
    on an appropriate scale plan
  level: must
- item: 'Protected species: which species are present, their numbers, and a map of their distribution
    and use of the area'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species may be affected.
- item: Potential impacts on designated sites, priority habitats, species and geological features, direct
    and indirect, during and after construction
  level: must
- item: 'Where harm is likely: how alternatives were considered and how impacts will be avoided, mitigated
    or compensated'
  level: must
- item: The likely change in priority habitat area (hectares) and in species numbers after development
  level: must
confidence: medium
notes: From the council's list (published August 2026), Ecological/Geological Assessment and Protected
  Species rows and the trigger lists, page 21-27, 51-54. 'Sites where natural features exist' and the
  other biodiversity features in the trigger list are shown as the council's discretion. A survey is not
  needed where Natural England, or the council's ecologist or the Wildlife Trust, has confirmed in writing
  that designated sites or habitats will not be affected. The protected species trigger table (Appendix
  2) is a scanned image.
review-status: unverified
field-status: {}
