reference: lighting-assessment
local-authority: SRI
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Light Pollution; South Ribble
  Planning Policies'
source-text: Where external lighting would be provided or made necessary by the development; development
  for the provision of new lighting; publicly accessible developments; those in the vicinity of residential
  properties; a Listed Building or Conservation Area; within the open countryside where it is likely to
  affect wildlife, such as bats.
must-include:
- item: Location and height of lighting columns, the light fittings, colour and louvres
  level: must
- item: Luminance or lux levels and the proposed hours of use
  level: must
- item: Light overspill, horizontal glare and upward light ratio
  level: should
- item: Potential impact on wildlife, particularly bats, and avoidance or mitigation measures
  level: must
confidence: medium
notes: From the council's list (published August 2026), Lighting Assessment row, page 42. Publicly accessible
  developments, sites near homes, listed buildings or conservation areas and open countryside are shown
  as the council's discretion.
review-status: unverified
field-status: {}
