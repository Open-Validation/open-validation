reference: location-plan
local-authority: SRI
required-if:
  always: true
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The type of plans and drawings required include the following but as a minimum a location
  plan is required.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At a scale of typically 1:1250 or 1:2500, scaled to fit A4 or A3 paper wherever possible
  level: should
- item: A north point
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location clear (for householder
    applications, the names of two roads where possible)
  level: should
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published August 2026), section 6a, page 3, 46.
review-status: unverified
field-status: {}
