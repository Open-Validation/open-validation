reference: flood-risk-assessment
local-authority: SRI
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zones 2 and 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: Land identified by the Environment Agency as having critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Land identified in a strategic flood risk assessment as being at increased flood risk
        in future.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Development introducing a more vulnerable use.
    - discretionary
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Flood Risk and Coastal Change;
  South Ribble Planning Policies'
source-text: 'To be provided for all development in Flood Zones 2 and 3. In Flood Zone 1, an FRA should
  accompany all proposals involving: • sites of 1 hectare or more; • land which has been identified by
  the Environment Agency as having critical drainage problems; • land identified in a strategic … flood
  risk assessment as being at increased flood risk in future, or; • land that may be subject to other
  sources of flooding, where its development would introduce a more vulnerable use.'
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development
  level: must
- item: How the risks will be managed, taking climate change into account, and opportunities to reduce
    the probability and consequences of flooding
  level: should
- item: The design of surface water management systems including SuDS
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (published August 2026), Flood Risk Assessment row, page 34-36. Land subject
  to other sources of flooding is shown as the council's discretion.
review-status: unverified
field-status: {}
