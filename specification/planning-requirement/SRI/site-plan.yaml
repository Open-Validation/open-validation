reference: site-plan
local-authority: SRI
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: At a scale of 1:500 or 1:200 which includes the direction of North and must have a plan reference
  number.
must-include:
- item: 'At a scale of 1:500 or 1:200 (householder applications: 1:100 or 1:200), with the direction of
    North'
  level: must
- item: A plan reference number
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written dimensions including those to boundaries
  level: should
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    on adjoining land including access; public rights of way crossing or adjoining the site; trees on
    the site and adjacent land; the extent and type of hard surfacing; proposed boundary treatments'
  level: should
- item: 'For householder applications: the relationship of the proposal to adjacent boundaries and the
    required off-road parking spaces'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: A Site Plan to a 1:100/1:200 scale to show the relationship of the proposal to adjacent
    boundaries. The required off road parking spaces should also be detailed on this plan.
confidence: medium
notes: From the council's list (published August 2026), section 6b (Existing and Proposed Site Layout
  Plan), page 1, 46. The list says plans are needed for 'the majority of applications'; the site plan
  is shown for planning applications.
