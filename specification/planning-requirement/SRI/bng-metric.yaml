reference: bng-metric
local-authority: SRI
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Environment Act 2021; Town and Country Planning Act 1990 (as amended)
source-text: A BNG statement, completed statutory biodiversity metric spreadsheet and draft biodiversity
  gain plan are to be submitted with any application which is required to achieve BNG.
must-include:
- item: Covers all on-site and off-site baseline and post-development conditions
  level: must
- item: Supplied as an Excel spreadsheet; screenshots or PDF versions are not acceptable
  level: must
- item: All start page details filled out
  level: must
- item: No input error or 'rules and principles not met' flags (red boxes), unless the application is
    outline or relies on statutory credit purchase and the reasons are stated in the BNG statement
  level: must
confidence: medium
notes: From the council's list (published August 2026), BNG row, page 7-8. The list applies BNG to major
  and minor applications; shown with the biodiversity gain condition, as the law sets (householder and
  other exempt applications are exempt; Appendix 8 tabulates the exemptions).
review-status: unverified
field-status: {}
