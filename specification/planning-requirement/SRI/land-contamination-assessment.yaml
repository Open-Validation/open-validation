reference: land-contamination-assessment
local-authority: SRI
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: Development particularly sensitive to land contamination (e.g. residential, education,
        health facilities, children's play areas).
  - site:
      in:
      - near-landfill-site
      description: On top of, or within 250 metres of, a former landfill site.
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: 'National Planning Policy Framework; Planning Practice Guidance: Land affected by contamination;
  South Ribble Local Plan policies G14 and G15'
source-text: Where the proposed development is particularly sensitive to land contamination. For example
  residential, … education, health facilities and children's play areas; and/or … where the proposed development
  is located on top, or within 250 metres of a former landfill site.
must-include:
- item: The nature, degree and distribution of contamination and ground gases
  level: must
- item: Enough information to show the site could not be determined as contaminated land under Part 2A
    of the Environmental Protection Act 1990
  level: must
- item: Measures in the development to mitigate landfill gas risks
  level: should
  required-if:
    site:
      in:
      - near-landfill-site
      description: Near a former landfill site.
confidence: medium
notes: From the council's list (published August 2026), Contaminated Land Assessment row, page 20-21.
review-status: unverified
field-status: {}
