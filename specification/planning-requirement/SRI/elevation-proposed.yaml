reference: elevation-proposed
local-authority: SRI
required-if:
  application-type:
    in:
    - hh
    - full
    - reserved-matters
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: At a scale of 1:50 or 1:100 must be submitted showing clearly the proposed works in relation
  to what is already there.
must-include:
- item: At a scale of 1:50 or 1:100, showing the proposed works in relation to what is already there
  level: must
- item: All elevations of the proposal, including blank elevations
  level: must
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: Corresponding exactly with the plan drawings
  level: must
- item: 'Where the elevation adjoins or is close to an existing building: the relationship between the
    buildings and the positions of openings on each'
  level: must
- item: A reference number and date, with any revision clearly marked and dated
  level: must
- item: 'Householder applications with rooms in the roof space with windows or roof lights: the height
    from floor level to window cill'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: roof-space-room
        value: true
        description: Rooms are proposed in the roof space, with windows or roof lights.
  source-text: 'Note: In respect of householders where rooms are proposed in a roof space which involve
    windows/roof lights, the height from the floor level to the window cill level is shown.'
confidence: medium
notes: From the council's list (published August 2026), section 6d, page 1, 46.
review-status: unverified
field-status: {}
