reference: sustainability-statement
local-authority: SRI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: All residential development.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major non-residential development.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
policy: South Ribble Planning Policies
source-text: All residential development and all major non-residential development.
must-include:
- item: How the development will connect to existing utility services (electricity, gas, telecommunications
    and water)
  level: must
- item: That the availability of services has been examined with the providers, and any substation or
    utility requirements are included
  level: should
- item: Service routes planned to avoid damage to trees and archaeological remains
  level: should
- item: Separate connections to foul and storm water sewers, and the type, quantity and means of disposal
    of any trade waste or effluent
  level: should
- item: 'Where foul drainage is not to a public sewer: a foul drainage assessment showing why mains connection
    is not practical and that the alternative is satisfactory'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Foul drainage not to the public sewer.
- item: 'For major non-residential development: a BREEAM pre-assessment estimator showing the likely rating
    (''very good'' minimum), or why it is not viable'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major non-residential development.
  source-text: Required for major non residential development as this needs to achieve the minimum energy
    efficiency standards equivalent to 'very good' of BREEAM. Planning Applications therefore need to
    be accompanied by a pre-assessment estimator showing the likely BREEAM rating to be achieved under
    a formal assessment. The Sustainability Statement should demonstrate compliance with these ratings,
    or, if not viable, demonstrate what level it can achieve and why.
confidence: medium
notes: From the council's list (published August 2026), Sustainability Statement row, page 36-38. The
  BREEAM paragraph sits at the foot of the Renewable Energy Statement row but refers to the Sustainability
  Statement.
review-status: unverified
field-status: {}
