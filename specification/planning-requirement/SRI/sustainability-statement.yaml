reference: sustainability-statement
local-authority: SRI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: All residential development.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major non-residential development.
source-url: https://southribble.gov.uk/downloads/file/763/validation-august-2026
source-text: All residential development and all major non-residential development
must-include:
- item: How the development will connect to existing utility services, including electricity and gas,
    telecommunications and water supply
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): not only Outline; it applies to Full planning too.'
review-status: unverified
field-status: {}
