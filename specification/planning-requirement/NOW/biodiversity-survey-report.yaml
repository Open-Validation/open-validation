reference: biodiversity-survey-report
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: Conversion, removal or replacement of a roof (except a flat roof or one that already
          provides usable floorspace).
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: residential-extension
        value: true
        description: Extensions to the property.
    - any:
      - condition:
          field: near-watercourse
          value: true
          description: The property abuts or is adjacent to a watercourse.
      - site:
          in:
          - local-wildlife-site
          - site-of-special-scientific-interest
          - ancient-woodland
          description: The property abuts or is adjacent to a woodland or designated wildlife site.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: 'Preliminary ecological appraisal (PEA) required for any householder application which: o
  involves the conversion, removal or replacement of a roof (except where the roof is a flat roof or where
  the roof already provides usable floorspace) o involves the removal of trees or significant vegetation;
  o includes extensions to the property and abuts or is adjacent to a woodland, watercourse or designated
  wildlife site;'
confidence: medium
notes: 'Preliminary ecological appraisal. Officer discretion covers removal of trees or significant vegetation.
  Audit (wrong_app_type): LBC needs a PEA for roof conversion or removal.'
review-status: unverified
field-status: {}
