reference: biodiversity-survey-report
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - change-of-use
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Involves the conversion, removal or replacement of a roof (except a flat roof or
            a roof that already provides usable floorspace).
      - condition:
          field: loss-of-habitat-features
          value: true
          description: Involves the removal of trees or significant vegetation.
      - all:
        - condition:
            field: residential-extension
            value: true
            description: Includes extensions to the property.
        - any:
          - condition:
              field: near-woodland
              value: true
              description: Abuts or is adjacent to a woodland.
          - condition:
              field: near-watercourse
              value: true
              description: Abuts or is adjacent to a watercourse.
          - site:
              in:
              - local-wildlife-site
              description: Abuts or is adjacent to a designated wildlife site.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: Involves the conversion, removal or replacement of a roof (except a flat roof or
          a roof that already provides usable floorspace).
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - special-area-of-conservation
          - local-wildlife-site
          description: Within or abuts a SSSI, a Special Area of Conservation or any other site of nature
            conservation interest (including a County Wildlife Site).
      - condition:
          field: roof-alteration
          value: true
          description: Involves the conversion, removal or replacement of a roof (except a flat roof or
            a roof that already provides usable floorspace).
      - condition:
          field: loss-of-habitat-features
          value: true
          description: Involves the removal of trees or significant vegetation.
      - all:
        - any:
          - condition:
              field: demolition
              value: true
              description: Demolition of an existing building.
          - condition:
              field: new-build
              value: true
              description: Extensions or new build.
        - any:
          - site:
              in:
              - open-space
              description: Within or abuts a designated urban green space or a publicly accessible recreational
                open space.
          - condition:
              field: near-watercourse
              value: true
              description: Abuts a watercourse.
          - condition:
              field: near-woodland
              value: true
              description: Abuts a woodland.
          - condition:
              field: derelict-site
              value: true
              description: Site is derelict/vacant or overgrown.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: biodiversity
        description: The condition in question relates to ecology, biodiversity or protected species.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Preliminary ecological appraisal (PEA) required for any householder application which: involves
  the conversion, removal or replacement of a roof (except where the roof is a flat roof or where the
  roof already provides usable floorspace) involves the removal of trees or significant vegetation; includes
  extensions to the property and abuts or is adjacent to a woodland, watercourse or designated wildlife
  site; … Ecological assessment (including protected species surveys) required for: Any application site
  which is within or abuts: a Site of Special Scientific Interest; a Special Area of Conservation; or
  any other site of nature conservation interest (including a County Wildlife Site). Any application which:
  involves the conversion, removal or replacement of a roof (except where the roof is a flat roof or where
  the roof already provides usable floorspace); or involves the removal of trees or significant vegetation;
  Any application which involves the demolition of an existing building, extensions or new build proposals
  and where the site: is within or abuts a designated urban green space; is within or abuts a publicly
  accessible recreational open space; abuts a watercourse; abuts a woodland; is derelict/vacant or overgrown.
  … Ecological assessment. Required where the condition in question relates to ecology, biodiversity or
  protected species.'
must-include:
- item: Site survey(s) by an appropriately qualified specialist at the appropriate time of year
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
- item: Copies of the surveys and plans showing any significant wildlife habitats or features and the
    location of habitats or protected species
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
- item: 'Where there is an impact on wildlife or biodiversity: an assessment of the likely impact and
    measures to avoid, reduce or mitigate it before and/or during construction and after completion'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
- item: Details of any potential biodiversity enhancements
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
- item: Where necessary, proposals for long term maintenance and management
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - s73
confidence: medium
notes: 'From the council''s list (published March 2026), page 3, 5, 10, 15, 23, 26, 44. A preliminary
  ecological appraisal for householder, change of use and listed building applications (listed building:
  roof works only); an ecological assessment including protected species surveys for full and outline
  applications and for variations of condition about ecology. If a PEA shows protected species may be
  affected, further surveys may be requested before determination. The contents list is from the ''Ecological
  assessment'' guidance (page 44).'
review-status: unverified
field-status: {}
