reference: habitat-baseline
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development would be subject to the biodiversity gain condition (not exempt).
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: A statement as to whether the applicant believes that planning permission, if granted, would
  be subject to the biodiversity gain condition, and if not, why not (space for this statement can be
  found on the application form and valid exemptions can be viewed here); and where development is subject
  to the biodiversity gain condition; … A plan drawn to an identified scale showing onsite habitat existing
  on the date of application (or an earlier date), including any irreplaceable habitat.
must-include:
- item: Drawn to an identified scale
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date)
  level: must
- item: Any irreplaceable habitat
  level: must
confidence: medium
notes: 'From the council''s list (published March 2026), page 8-9, 13, 18, 25. National requirement for
  full, outline, reserved matters and variation of condition applications (major applications valid from
  12 February 2024, minor from 2 April 2024). Shown with the biodiversity gain condition, as the law sets:
  householder and other exempt applications are exempt. The council also asks for a statement that the
  person who completed the metric is a competent person (listed with the unmapped items).'
review-status: unverified
field-status: {}
