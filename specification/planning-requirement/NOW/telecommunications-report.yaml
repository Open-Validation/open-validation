reference: telecommunications-report
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications development by a telecommunications code system operator.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: Telecommunications Statement required for all telecommunications development by a telecommunications
  code system operator.
must-include:
- item: A description of the need and purpose of the development
  level: must
- item: Other sites considered and discounted, including the area of search
  level: must
- item: The design principles and concepts applied and how the design minimises visual impact
  level: must
- item: The rating of the site under the traffic light model
  level: must
- item: Evidence that nearby schools have been consulted, and any responses
  level: must
- item: Any other consultations undertaken, and any responses
  level: must
- item: A signed declaration that the equipment and installation fully comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
- item: Technical specifications for the proposed equipment
  level: must
confidence: medium
notes: From the council's list (published March 2026), page 12, 17, 53. The council calls it a 'Telecommunications
  Statement'. Listed for full and outline applications. It can be incorporated into the design and access
  statement. The telecommunications prior notification checklist (page 29) has no local requirements.
review-status: unverified
field-status: {}
