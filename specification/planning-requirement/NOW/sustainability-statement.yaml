reference: sustainability-statement
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 sq m or more gross non-residential floorspace.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Greater Norwich Local Plan Policy 2
source-text: Sustainability statement required for all applications ≥10 dwellings or ≥1000sq.m gross non-residential
  floorspace (refer to Greater Norwich Local Plan Policy 2 and any relevant Supplementary Planning Documents
  to understand the content required).
confidence: medium
notes: From the council's list (published March 2026), page 7, 12, 17, 21, 27. Listed for change of use,
  full, outline, reserved matters and variation of condition applications. New in the March 2026 list.
review-status: unverified
field-status: {}
