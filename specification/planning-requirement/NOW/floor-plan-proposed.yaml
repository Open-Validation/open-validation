reference: floor-plan-proposed
local-authority: NOW
required-if:
  any:
  - application-type:
      in:
      - change-of-use
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - discretionary
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The variation involves amendment to any of the approved plans.
    - discretionary
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A full set of accurate existing and proposed plans illustrating the proposals to a standard
  scale and clearly showing the site in context. Depending on the type and scale of the proposals these
  are likely to include site and block plans, elevations, sections and roof plans. … For the purposes
  of a change of use these should include existing and proposed floor plans and site plans. … A full set
  of accurate proposed plans. Required where the variation involves amendment to any of the approved plans.
  … A full set of accurate proposed plans clearly detailing the proposed amendments and illustrating them
  to a standard scale.
must-include:
- item: Clearly details the proposed amendments, at a standard scale
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
confidence: medium
notes: From the council's list (published March 2026), page 3-4, 8, 13, 18, 23, 26, 28. Change of use
  applications must include existing and proposed floor plans. The national list asks householder, full,
  outline, reserved matters and listed building applications for 'a full set of accurate existing and
  proposed plans'; which drawings are needed depends on the type and scale of the proposal ('likely to
  include'), so it shows as discretionary. Variations of condition (where the approved plans change) and
  non-material amendments need a full set of proposed plans.
review-status: unverified
field-status: {}
