reference: transport-assessment
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: 50 or more residential dwellings (C3) or houses in multiple occupation (C4).
      - condition:
          field: office-floorspace
          operator: '>='
          value: 1500
          description: 1,500 sq m or more of offices or research and development (Class E(g)).
      - condition:
          field: industrial-floorspace
          operator: '>='
          value: 2500
          description: 2,500 sq m or more of light industrial (Class E(g)) or general industrial (B2).
      - condition:
          field: warehousing-floorspace
          operator: '>='
          value: 2500
          description: 2,500 sq m or more of storage and distribution (B8).
      - condition:
          field: bedroom-count
          operator: '>='
          value: 75
          description: 75 or more bedrooms in hotels (C1) or residential institutions (C2 and C2A).
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: highways
        description: The condition in question relates to highways, access or other transport matters.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Transport statements, assessments and interim travel plans required for all applications
  which meet one of the thresholds in the table below: … Transport statements/assessments. Required where
  the condition in question relates to highways, access or other transport matters.'
confidence: medium
notes: 'From the council''s list (published March 2026), page 5-6, 11, 16-17, 20-21, 26, 46. Covers the
  council''s transport statement (lower threshold) and transport assessment (higher threshold), set out
  in a table by use (gross floor area). The table rows with clear figures are shown as conditions at the
  transport statement threshold. Discretionary: Thresholds the council sets by location or for uses without
  a matching field (shops, financial services, cafés, restaurants, drinking establishments and takeaways
  from 250 sq m outside a defined centre; health centres, nurseries, educational establishments and assembly
  and leisure uses from 500 sq m; hostels of 75 residents or more; 3 or more pitches or courts; petrol
  filling stations; other uses from 1,000 sq m).'
review-status: unverified
field-status: {}
