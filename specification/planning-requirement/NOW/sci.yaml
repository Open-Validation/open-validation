reference: sci
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 sq m or more gross non-residential floorspace.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Norwich City Council Statement of Community Involvement 2013
source-text: Statement of community involvement required for all applications ≥10 dwellings or ≥1000sq.m
  gross non-residential floorspace.
must-include:
- item: How the local community was involved and what types of involvement were undertaken
  level: must
- item: Where the involvement took place, who was involved, when (at what stage) and why (with what purpose)
  level: must
- item: 'The methodology behind the involvement strategy: the methods used, the people or groups contacted
    and the level of involvement sought'
  level: must
confidence: medium
notes: From the council's list (published March 2026), page 6, 12, 17, 21, 50. Listed for change of use,
  full, outline and reserved matters applications. If insufficient or inappropriate pre-application community
  involvement has taken place relative to the size, complexity or impact of the development, the application
  will not be validated.
review-status: unverified
field-status: {}
