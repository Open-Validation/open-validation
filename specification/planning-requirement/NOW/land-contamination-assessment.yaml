reference: land-contamination-assessment
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: operational-development
        value: true
        description: Operational development.
    - any:
      - site:
          in:
          - contaminated-land
          description: There is a record of potentially polluting uses.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: contamination
        description: The condition in question relates to land contamination.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Land contamination desk top studies and intrusive investigations required as follows: desk
  top study – required for all operational development where there is a record of potentially polluting
  uses or there is a potential for contamination to be present. preliminary intrusive investigation, risk
  assessment and options appraisal – required where the desk top study confirms the potential for contamination,
  further intrusive studies to assess the risks and identify and appraise the options for remediation
  would be required. … Land contamination desk top studies and intrusive investigations. Required where
  the condition in question relate to land contamination.'
must-include:
- item: 'A desk top study: site definition and description, history, current land use and environmental
    setting'
  level: must
- item: Identification of sources, receptors and pathways
  level: must
- item: A preliminary risk assessment
  level: must
- item: A preliminary intrusive investigation (design, techniques, sampling and analysis), risk assessment
    and evaluation, and options appraisal for further investigation and/or remediation, where the desk
    top study confirms the potential for contamination
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published March 2026), page 11-12, 16-17, 26, 47. Listed for full and
  outline applications and for variations of condition about land contamination. Discretionary: ''a potential
  for contamination to be present'', and the intrusive investigation (needed where the desk study confirms
  potential contamination and it is feasible).'
review-status: unverified
field-status: {}
