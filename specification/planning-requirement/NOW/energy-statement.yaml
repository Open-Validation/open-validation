reference: energy-statement
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: 1,000 sq m or more gross non-residential floorspace.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: energy
        description: The condition in question relates to energy efficiency.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: Energy, water and construction statement required for applications involving the creation
  of 10 or more new residential dwellings or ≥1000sq.m gross non-residential floorspace. … Energy, water
  and construction statement. Required where the condition in question relates to energy efficiency.
must-include:
- item: Details of water efficiency measures; for residential development, measures to meet code for sustainable
    homes level 4 for water efficiency
  level: must
- item: Details of how 10% of the site's expected energy requirements will be provided by decentralised
    renewable or low carbon sources
  level: must
- item: The renewable or low carbon technologies investigated, those discounted and those selected
  level: must
- item: The estimated annual energy usage of the development (in kWh)
  level: must
- item: The estimated energy which can be provided from the selected technologies (in kWh)
  level: must
- item: The technologies shown on the plans, including any plant rooms and external plant on the relevant
    plans and elevations
  level: must
- item: An assessment of whether there is viable and practical scope for exceeding the minimum of 10%
  level: must
- item: Details of the proposed construction, showing how all practical and viable steps have been taken
    to maximise opportunities for sustainable construction
  level: must
confidence: medium
notes: From the council's list (published March 2026), page 5, 10, 15, 19-20, 26, 39. The council calls
  it an 'Energy, water and construction statement'. Listed for change of use, full, outline and reserved
  matters applications and for variations of condition about energy efficiency. The guidance (page 39)
  also asks for location and transport and layout and building design sections.
review-status: unverified
field-status: {}
