reference: energy-statement
local-authority: NOW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1,000 sqm or more of non-residential floorspace.
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: details of water efficiency measures to be incorporated within the proposals which in the
  case of residential developments shall detail measures to meet code for sustainable homes level 4 for
  water efficiency; b. details of how 10% of the sites expected energy requirements will be provided by
  decentralised renewable or low carbon sources. … v. an assessment of whether or not there is viable
  and practical scope for exceeding the minimum percentage of 10%. c. details of the proposed construction
  including details of how all practical and viable steps have been taken to maximise opportunities for
  sustainable construction.
must-include:
- item: Water efficiency measures (residential to meet code for sustainable homes level 4 for water efficiency)
  level: must
- item: How 10% of the site's expected energy requirements will come from decentralised renewable or low
    carbon sources, shown on the relevant plans
  level: must
- item: Whether there is viable and practical scope for exceeding 10%
  level: must
- item: Details of how all practical and viable steps have been taken to maximise sustainable construction
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): the Energy, water and construction statement (10+ dwellings
  or 1,000 sqm+ non-residential); the workbook had it under water efficiency and floor plans.'
review-status: unverified
field-status: {}
