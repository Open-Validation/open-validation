reference: noise-assessment
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - outline
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise sensitive uses proposed within close proximity to noise generating uses or
            the late night activity zone.
      - all:
        - condition:
            field: noise-generating-use
            value: true
            description: Noise generating development (uses, plant, machinery or equipment).
        - condition:
            field: near-noise-sensitive-use
            value: true
            description: Within close proximity to noise sensitive uses.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: noise
        description: The condition in question relates to noise impact.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Noise impact assessment required for: any application proposing noise sensitive uses within
  close proximity to noise generating uses or the late night activity zone; any application proposing
  noise generating development (this includes uses, plant, machinery or equipment) within close proximity
  to noise sensitive uses. … Noise impact assessment. Required where the condition in question relates
  to noise impact.'
must-include:
- item: Undertaken by a suitably qualified acoustician
  level: should
- item: Detailed information on where the readings were taken from
  level: should
confidence: medium
notes: From the council's list (published March 2026), page 5, 11, 16, 26, 48. Listed for change of use,
  full and outline applications and for variations of condition about noise. 'Close proximity' includes
  adjacent properties and those within a perimeter block's distance, and may extend further. The energy
  statement guidance (page 39) adds that renewable technologies with noise impacts on or near noise sensitive
  properties need a noise impact assessment.
review-status: unverified
field-status: {}
