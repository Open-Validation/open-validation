reference: town-centre-impact-assessment
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - outline
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail or leisure development located outside an existing local, district or town
          centre.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 1000
        description: Retail or leisure floorspace exceeding 1,000 sq m.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: retail
        description: The condition in question relates to the use/operation of a retail or leisure use.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Norwich Development Management Policies Local Plan (2014), appendix 4
source-text: 'Retail or leisure impact assessment required for: proposals for retail or leisure developments
  located outside an existing local, district or town centre and which exceed 1,000sq.m. … Retail or leisure
  impact assessment. Required where the condition in question relates to the use/operation of a retail
  or leisure use.'
must-include:
- item: The impact on existing, committed and planned public and private investment in a centre or centres
    in the catchment area
  level: must
- item: The impact on town centre vitality and viability, including local consumer choice and trade in
    the town centre and the wider retail catchment
  level: must
confidence: medium
notes: From the council's list (published March 2026), page 5, 10, 15, 26, 38. The council calls it a
  'Retail or leisure impact assessment'. Listed for change of use, full and outline applications and for
  variations of condition about a retail or leisure use. The 1,000 sq m threshold is set locally (the
  NPPF default is 2,500 sq m). The guidance also covers proposals in a centre at a scale inconsistent
  with its place in the retail hierarchy. The main town centre uses sequential assessment is listed with
  the unmapped items.
review-status: unverified
field-status: {}
