reference: fire-statement
local-authority: NOW
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: 'Fire Statement required for any application which involves: o the provision of one or more
  relevant buildings, or o development of an existing relevant building o or development within the curtilage
  of a relevant building A “relevant building” is any building which contains two or more dwellings or
  educational accommodation; and meets the height condition of 18m or more in storey height, or 7 or more
  storeys.'
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Includes development
  of an existing relevant building or within its curtilage.
