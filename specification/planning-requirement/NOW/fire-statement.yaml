reference: fire-statement
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - reserved-matters
      - pa-storey
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
      - pa-demo-replace-dwh
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
      - pa-col-fac-shop
      - pa-roof-solar-nondom
      - pa-uni-building
      - pa-movable-structure
      - pa-accom-defence
      - pa-solar-eq-dom
      - pa-sa-solar-dom
      - pa-sa-solar-nondom
      - pa-solar-nondom-park
      - pa-tmp-school-vacant-comm
      - pa-tmp-use-comm-film
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Fire Statement required for any application which involves: the provision of one or more
  relevant buildings, or development of an existing relevant building or development within the curtilage
  of a relevant building A “relevant building” is any building which contains two or more dwellings or
  educational accommodation; and meets the height condition of 18m or more in storey height, or 7 or more
  storeys.'
confidence: medium
notes: From the council's list (published March 2026), page 4, 9, 19, 32. Listed for change of use, full,
  reserved matters and 'other prior notification' applications (not outline). Covers new relevant buildings,
  development of an existing relevant building and development within its curtilage.
review-status: unverified
field-status: {}
