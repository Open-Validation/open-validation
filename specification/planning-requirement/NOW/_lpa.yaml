submission-standards:
- item: Applications submitted either electronically or in hard copy, not a mix of the two
  level: should
- item: 'Acceptable file types: images in JPG, TIF, GIF, BMP or PNG; plans in PDF, TIF or PLT; text documents
    in DOC, PDF, TXT or XLS'
  level: must
- item: Individual file sizes 10Mb or less; no zipped or condensed files
  level: must
- item: File names reflect the drawing/document reference number or title and paper size
  level: should
- item: All plans and drawings drawn to an identified scale and configured correctly to enable online
    measuring
  level: must
- item: All plans and drawings show a scale bar, the paper size and the scale (e.g. 1:200 at A3)
  level: must
- item: Scanned plans preserve the scale of the original; photographs of plans are not acceptable
  level: must
- item: Revised drawings or documents given a new plan reference number/title to highlight the amended
    version
  level: must
