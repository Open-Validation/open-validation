reference: design-and-access-statement
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: Within a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: 1 or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Building(s) creating 100 sq m or more floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; National Planning
  Policy Framework 2024, paragraph 207
source-text: 'Design and access statement, including an assessment of heritage assets, will be required
  for: Major applications (a major application is 10 or more dwellings, residential development on a site
  having an area of 0.5 hectares or more, the provision of building/s creating 1000sqm or more floorspace,
  or development on a site having an area of 1 hectare or more); or Developments within a conservation
  area and comprising 1 or more dwellings or the provision of building/s creating 100sqm or more floorspace.
  … A design and access statement (or heritage impact assessment), including a description of the significance
  of any heritage asset affected, the contribution to significance made by the asset’s setting, and an
  explanation of the impact of the proposals on the asset’s significance, as required by section 16, paragraph
  207 of the National Planning Policy Framework 2024.'
must-include:
- item: An assessment of heritage assets
  level: must
- item: A description of the significance of any heritage asset affected, the contribution made by its
    setting, and an explanation of the impact of the proposals on that significance
  level: must
- item: 'For listed building consent: an assessment of the impact of any works upon the significance of
    the listed building'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Where the Design and Access Statement accompanies an application for Listed Building Consent
    the Statement MUST include an assessment of the impact of any works upon the significance of the listed
    building.
confidence: medium
notes: From the council's list (published March 2026), page 8, 14, 19, 23, 35. National requirement for
  full applications; for outline and reserved matters the list repeats the same trigger ('may be required').
  For listed building consent a design and access statement or a heritage impact assessment is required.
review-status: unverified
field-status: {}
