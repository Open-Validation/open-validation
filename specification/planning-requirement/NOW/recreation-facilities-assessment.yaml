reference: recreation-facilities-assessment
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss or reduction of publicly accessible recreational open space or urban greenspace,
          as defined in the Local Plan.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: open-space
        description: The condition in question relates to the provision, retention or improvement of open
          space.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: Open space assessment required for all development proposals resulting in loss or reduction
  of publicly accessible recreational open space or urban greenspace, as defined in the Local Plan. …
  Open space assessment. Required where the condition in question relates to the provision, retention
  or improvement of open space.
must-include:
- item: Analysis of the contribution made by the existing urban greenspace or open space
  level: must
- item: Evaluation of existing provision in the locality, in qualitative and quantitative terms
  level: must
- item: Impact analysis of the proposed development
  level: must
- item: Compensation/mitigation options
  level: must
- item: The chosen proposal and its justification
  level: must
confidence: medium
notes: From the council's list (published March 2026), page 11, 16, 26, 45. The council calls it an 'Open
  space assessment'. Listed for full and outline applications and for variations of condition about open
  space. Where the impact on open space or children's playspace cannot be understood from the application,
  it will not be validated.
review-status: unverified
field-status: {}
