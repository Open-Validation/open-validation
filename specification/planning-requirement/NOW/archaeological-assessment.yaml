reference: archaeological-assessment
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: Within the Area of Main Archaeological Interest and not predominantly occupied by
          existing buildings.
    - discretionary
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or more.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: National Planning Policy Framework, paragraph 200
source-text: 'Archaeological Field Evaluation required on: sites which are located within the Area of
  Main Archaeological Interest and are not predominantly occupied by existing buildings (where trial trenching
  is feasible on areas not covered by buildings i.e. car parks this should take place and be covered by
  the evaluation); any other sites which have been identified at pre-application stage as having, or having
  the potential to include, heritage assets with archaeological interest which are not predominantly occupied
  by existing buildings (where trial trenching is feasible on areas not covered by buildings i.e. car
  parks this should take place and be covered by the evaluation); Sites of 1 hectare or more.'
confidence: medium
notes: 'From the council''s list (published March 2026), page 9-10, 14-15, 19, 36. An archaeological field
  evaluation, for full, outline and reserved matters applications (at reserved matters, one submitted
  at outline should be updated). Discretionary: other sites identified at pre-application stage (or, for
  reserved matters, in a heritage impact assessment) as having archaeological potential. Norfolk County
  Council''s Historic Environment Service may confirm that no field evaluation is needed; that confirmation,
  submitted with the application, removes the requirement. Where the site is covered by buildings, evaluation
  will be conditioned.'
review-status: unverified
field-status: {}
