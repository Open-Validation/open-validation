reference: archaeological-assessment
local-authority: NOW
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: The site is in the Area of Main Archaeological Interest and not predominantly occupied
        by existing buildings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - discretionary
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: … identified in a heritage impact assessment as having, or having the potential to include,
  heritage assets with archaeological interest which are not predominantly occupied by existing buildings
  (where trial trenching is feasible on areas not covered by buildings i.e. car parks this should take
  place and be covered by the evaluation); … A large area of the city is covered by the Area of Main Archaeological
  Interest.
confidence: medium
notes: 'Audit (wrong_trigger): the triggers are Area of Main Archaeological Interest sites not predominantly
  built on, sites flagged at pre-application (officer discretion) and sites of 1ha+. The workbook filed
  part of this under Heritage Statement.'
review-status: unverified
field-status: {}
