reference: travel-plan
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 80
        description: 80 or more residential dwellings (C3) or houses in multiple occupation (C4).
    - condition:
        field: office-floorspace
        operator: '>='
        value: 2500
        description: 2,500 sq m or more of offices or research and development (Class E(g)).
    - condition:
        field: industrial-floorspace
        operator: '>='
        value: 4000
        description: 4,000 sq m or more of light industrial (Class E(g)) or general industrial (B2).
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 4000
        description: 4,000 sq m or more of storage and distribution (B8).
    - condition:
        field: bedroom-count
        operator: '>='
        value: 100
        description: 100 or more bedrooms in hotels (C1) or residential institutions (C2 and C2A).
    - discretionary
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Transport statements, assessments and interim travel plans required for all applications
  which meet one of the thresholds in the table below: … Travel Plans offer useful tools to reduce car
  dependency and promote sustainable travel when the end user is known at the time of application; these
  are required over certain thresholds; interim travel plans are required for major developments when
  the end user is not known.'
confidence: medium
notes: 'From the council''s list (published March 2026), page 5-6, 11, 16-17, 20-21, 46. An interim travel
  plan is required with a transport assessment (the higher column of the council''s table). Discretionary:
  the other rows of the table, set by location or for uses without a matching field (shops, cafés, restaurants,
  drinking establishments and takeaways from 800 sq m outside a defined centre or 1,000 sq m in or next
  to a centre; health centres, nurseries, educational establishments and assembly and leisure uses from
  1,000 sq m outside the primary retail area; 5 or more pitches; other uses from 1,500 sq m). Travel Information
  Plans are not a validation requirement.'
review-status: unverified
field-status: {}
