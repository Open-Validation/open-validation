reference: landscaping-plan
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: 1,000 sq m or more gross non-residential floorspace.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: 1,000 sq m or more gross non-residential floorspace.
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: landscaping
        description: The condition in question relates to landscaping.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Norwich Trees and Landscape Supplementary Planning Document
source-text: 'Landscape assessment and design statement required for all aplications ≥10 dwellings or
  ≥1000sq.m gross non-residential floorspace and shall include: a topographical and site context plan;
  details of the approach to soft and hard landscape design of the areas external to buildings including
  detail of any features to be retained. … Landscape assessment and design statement required for all
  applications ≥10 dwelling or ≥1000sq.m gross non-residential floorspace where landscape is a matter
  for consideration. … Landscape assessment and design proposals. Required where the condition in question
  relates to landscaping.'
must-include:
- item: A topographical and site context plan
  level: must
- item: Details of the approach to soft and hard landscape design of the areas external to buildings,
    including any features to be retained
  level: must
confidence: medium
notes: From the council's list (published March 2026), page 10, 15, 20, 26, 41-42. The council calls it
  a 'Landscape assessment and design statement'. Full applications at the threshold; for outline and reserved
  matters only where landscape is a matter for consideration, which shows as discretionary. It may be
  included in the design and access statement. The guidance (pages 41-42) lists what the site assessment
  and landscape strategy should typically cover.
