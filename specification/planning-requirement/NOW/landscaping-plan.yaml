reference: landscaping-plan
local-authority: NOW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 sqm or more.
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: The layout of external areas and an outline of the landscape strategy which should include
  both the soft (planting) and (hard) paving/ built external elements and show at least indicatively the
  treatment of different areas through hatching and simple notation.
must-include:
- item: The layout of external areas and an outline of the landscape strategy, covering soft and hard
    elements, with the treatment of different areas shown at least indicatively
  level: must
confidence: low
notes: 'From the audit (missing_requirement): a Landscape assessment and design statement for 10+ dwellings
  or 1,000 sqm+. The must-include item is the outline section''s wording.'
review-status: unverified
field-status: {}
