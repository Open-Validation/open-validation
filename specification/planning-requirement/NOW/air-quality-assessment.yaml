reference: air-quality-assessment
local-authority: NOW
required-if:
  any:
  - discretionary
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is in or adjacent to an air quality management area.
    - any:
      - condition:
          field: traffic-movements-peak-hour
          operator: '>'
          value: 100
          description: More than 100 traffic movements an hour at peak times.
      - condition:
          field: traffic-movements-daily
          operator: '>'
          value: 1000
          description: More than 1,000 movements over 24 hours.
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: 'Air quality assessment required for: o development proposals which would give rise to air-borne
  emissions including harmful substances, smoke, grit and dust; o developments expected to generate more
  than 100 traffic movements an hour at peak times or more than 1,000 movements over 24 hours in or adjacent
  to an air quality management area.'
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. Officer discretion
