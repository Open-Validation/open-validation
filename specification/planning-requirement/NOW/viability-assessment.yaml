reference: viability-assessment
local-authority: NOW
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: More than 10 dwellings.
    - condition:
        field: housing-floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m or more of residential floorspace.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: A case is made that the full policy compliant percentage of affordable housing is not
        viable.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Norwich Affordable Housing Supplementary Planning Document
source-text: 'Planning obligations statement required for all applications involving: >10 dwellings or
  ≥1,000sqm of residential floorspace … A viability assessment - where a case is made that the full policy
  compliant percentage of affordable housing is not viable.'
confidence: medium
notes: From the council's list (published March 2026), page 6-7, 12, 17, 51. Part of the council's planning
  obligations statement (the statement itself is listed with the unmapped items). Listed for change of
  use, full and outline applications. Where external advice is needed to assess viability, the applicant
  meets the cost.
review-status: unverified
field-status: {}
