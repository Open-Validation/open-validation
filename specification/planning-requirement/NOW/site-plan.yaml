policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site plan at an identified standard metric scale (usually to a scale 1:500 or 1:200) including
  a north point, the proposed development (including any new boundary treatments or hard surfacing) in
  relation to the site boundaries and other existing buildings on the site, any affected public rights
  of way and the position of any existing trees on site. … The plan should include any external areas
  associated with the property and any changes proposed to the external spaces. … A plan indicating the
  site and showing the proposed development
must-include:
- item: At an identified standard metric scale (usually 1:500 or 1:200)
  level: must
- item: North point
  level: must
- item: The proposed development, including any new boundary treatments or hard surfacing, in relation
