reference: site-plan
local-authority: NOW
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: A site plan at an identified standard metric scale (usually to a scale 1:500 or 1:200) including
  a north point, the proposed development (including any new boundary treatments or hard surfacing) in
  relation to the site boundaries and other existing buildings on the site, any affected public rights
  of way and the position of any existing trees on site.
must-include:
- item: Identified standard metric scale (usually 1:500 or 1:200) and a north point
  level: must
- item: The proposed development, including new boundary treatments or hard surfacing, in relation to
    the site boundaries and other existing buildings
  level: must
- item: Any affected public rights of way and the position of any existing trees on site
  level: must
- item: Proposed remediation and how the site is to be left following demolition
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
