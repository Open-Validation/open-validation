confidence: medium
notes: From the council's list (published March 2026), page 3-13, 31-32. National requirement for householder,
  change of use, full and outline applications. For larger home extension and other prior notifications
  the national list asks for 'A plan indicating the site and showing the proposed development'. Reserved
  matters and listed building applications need the 'full set of plans', which is 'likely to include site
  and block plans' (see the elevation files).
