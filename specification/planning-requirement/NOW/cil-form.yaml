reference: cil-form
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: An increase in floor space of 100sqm or more.
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Any increase in non-residential gross internal area.
  - all:
    - application-type:
        in:
        - ldc
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: An increase in non-residential gross internal area.
source-url: https://www.norwich.gov.uk/downloads/file/1558/validation_requirements
source-text: Community Infrastructure Levy (CIL) Additional Information Requirement Form required for
  all householder development involving an increase in floor space of 100sqm or more.
confidence: medium
notes: 'From the audit (missing_requirement, wrong_app_type): the full and LDC branches; reserved matters
  also lists a CIL form, without a trigger.'
review-status: unverified
field-status: {}
