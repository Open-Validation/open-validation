reference: cil-form
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: An increase in floor space of 100 sq m or more.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: 1 or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Any increase in the gross internal area of non-residential premises (including
            extensions).
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: A proposed certificate involving any increase in the gross internal area of non-residential
          premises (including extensions).
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Community Infrastructure Levy Regulations 2010; Greater Norwich CIL
source-text: 'Community Infrastructure Levy (CIL) Additional Information Requirement Form required for
  all householder development involving an increase in floor space of 100sqm or more. … Community Infrastructure
  Levy (CIL) Additional Information Requirement Form required for all development involving: ≥1 dwelling;
  Any increase in the gross internal area of non-residential premises (including extensions). … Community
  Infrastructure Levy (CIL) Additional Information Requirement Form required for all applications for
  a proposed certificate involving any increase in the gross internal area of non-residential premises
  (including extensions).'
confidence: medium
notes: From the council's list (published March 2026), page 3, 12, 17, 21, 24, 27, 52. Listed for householder,
  full, outline, reserved matters, variation of condition and proposed lawful development certificate
  applications. The guidance page (52) gives the trigger as '1 or more dwelling or 100sqm gross internal
  area of non residential floor space'; the application-type pages say any increase in non-residential
  floorspace, which is used here.
review-status: unverified
field-status: {}
