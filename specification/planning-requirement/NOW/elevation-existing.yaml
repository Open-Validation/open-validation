reference: elevation-existing
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - discretionary
  - application-type:
      in:
      - advertising
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A full set of accurate existing and proposed plans illustrating the proposals to a standard
  scale and clearly showing the site in context. Depending on the type and scale of the proposals these
  are likely to include site and block plans, elevations, sections and roof plans. … Existing and proposed
  elevations (e.g. at a scale of 1:50 or 1:100);
must-include:
- item: At a scale such as 1:50 or 1:100
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published March 2026), page 3, 8, 13, 18, 22, 23. The national list asks
  householder, full, outline, reserved matters and listed building applications for 'a full set of accurate
  existing and proposed plans'; which drawings are needed depends on the type and scale of the proposal
  ('likely to include'), so it shows as discretionary. Advertisement applications need existing and proposed
  elevations.
review-status: unverified
field-status: {}
