reference: flood-risk-assessment
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - change-of-use
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 and/or flood zone 3.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: flood-risk
        description: The condition in question relates to flood risk.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: 'Flood Risk Assessment required for: householder developments located within flood zone 2
  and/or flood zone 3. … Flood Risk Assessment required for: developments located within flood zone 2
  and/or flood zone 3 … Flood Risk Assessment. Required where the condition in question relates to flood
  risk.'
confidence: medium
notes: From the council's list (published March 2026), page 3, 5, 10, 15, 20, 26, 40. Listed for householder,
  change of use, full, outline and reserved matters applications, and for variations of condition about
  flood risk.
review-status: unverified
