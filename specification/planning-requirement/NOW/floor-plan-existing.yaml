reference: floor-plan-existing
local-authority: NOW
required-if:
  any:
  - application-type:
      in:
      - change-of-use
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - discretionary
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A full set of accurate existing and proposed plans illustrating the proposals to a standard
  scale and clearly showing the site in context. Depending on the type and scale of the proposals these
  are likely to include site and block plans, elevations, sections and roof plans. … For the purposes
  of a change of use these should include existing and proposed floor plans and site plans.
confidence: medium
notes: From the council's list (published March 2026), page 3-4, 8, 13, 18, 23. Change of use applications
  must include existing and proposed floor plans. The national list asks householder, full, outline, reserved
  matters and listed building applications for 'a full set of accurate existing and proposed plans'; which
  drawings are needed depends on the type and scale of the proposal ('likely to include'), so it shows
  as discretionary.
review-status: unverified
field-status: {}
