reference: arboriculturist-report
local-authority: NOW
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - any:
      - all:
        - condition:
            field: operational-development
            value: true
            description: Operational development.
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Existing trees adjacent to the development (within falling distance of it).
      - condition:
          field: tree-removal
          value: true
          description: Includes the felling or pruning of trees.
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: varied-condition-topic
        value: trees
        description: The condition in question relates to arboriculture.
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
source-text: Arboricultural (tree) assessment required for all development proposals which would involve
  operational development adjacent to existing trees, or include the felling or pruning of trees. … Arboricultural
  assessment. Required where the condition in question relates to arboriculture. … For the purposes of
  assessing validity a tree will be considered as adjacent to the development where it is within falling
  distance of the proposed development.
must-include:
- item: Carried out by an arborist in accordance with BS5837:2012
  level: should
- item: An accurate topographical land and tree survey
  level: should
- item: Trees, hedges and large shrub masses to be retained, those lost for development, those lost for
    sound arboricultural reasons, and any on adjoining land that may be affected
  level: should
- item: A tree protection plan and arboricultural method statement integrated into the assessment
  level: should
confidence: medium
notes: From the council's list (published March 2026), page 3, 10, 15, 26, 43. Listed for householder,
  full and outline applications and for variations of condition about arboriculture. Minor works (such
  as replacement windows or re-cladding) and work with no excavation or tree pruning (such as roof alterations)
  will not normally need one.
review-status: unverified
field-status: {}
