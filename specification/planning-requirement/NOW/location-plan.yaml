reference: location-plan
local-authority: NOW
required-if:
  application-type:
    in:
    - hh
    - change-of-use
    - full
    - outline
    - reserved-matters
    - advertising
    - lbc
    - ldc
    - pa-ecomms-network
source-url: https://www.norwich.gov.uk/sites/default/files/2026-03/Validation-Requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location plan (usually to a scale 1:1250 or 1:2500) based on an up to date map with a solid
  red line outlining the site in question and a blue line indicating adjacent/nearby land within the same
  ownership and a north point. The red line should include all land necessary to carry out the development
  including land necessary to access the site, servicing and parking areas.
must-include:
- item: Usually at 1:1250 or 1:2500
  level: should
- item: Based on an up to date map
  level: must
- item: Site outlined with a solid red line
  level: must
- item: Adjacent or nearby land in the same ownership outlined in blue
  level: must
- item: North point
  level: must
- item: Red line includes all land needed to carry out the development, including access, servicing and
    parking areas
  level: must
  required-if:
    application-type:
      in:
      - hh
      - change-of-use
      - full
      - outline
- item: Matches the location plan in the outline consent
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: These should match those detailed in the outline consent.
- item: Red line includes all land the certificate relates to; where it relates to part of a building,
    the floor plans show those areas in red; where two or more uses, operations or matters are specified,
    the plan shows which part of the land or building each relates to
  level: must
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (published March 2026), page 3-24, 29. National requirement for householder,
  change of use, full, outline, advertisement, listed building and lawful development certificate applications;
  for reserved matters the council lists it as a local requirement (page 19). For telecommunications prior
  notification the national list asks for 'A plan indicating the proposed location'. It is not listed
  for variation of condition or non-material amendment.
