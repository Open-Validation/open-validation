reference: site-plan
local-authority: CRW
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - pa-extension
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications for planning permission.
must-include:
- item: At an identified standard metric scale of 1:100, 1:200 or 1:500, with the direction of North
  level: must
- item: Ordnance Survey map not a Land Registry document, a photocopy or a screen grab; shows OS Crown
    copyright and the licence number
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: Public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing; boundary treatment; outbuildings; other features such as
    ponds and wells
  level: should
- item: 'For a larger home extension (Class A4 prior approval): the proposed development and any existing
    enlargement of the original house that it will join onto'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 9-10,
  14. The 'should' items are what the list calls helpful 'unless they would NOT influence or be affected
  by the proposed development'.
review-status: unverified
field-status: {}
