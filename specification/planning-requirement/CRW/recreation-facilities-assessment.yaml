reference: recreation-facilities-assessment
local-authority: CRW
required-if:
  any:
  - site:
      in:
      - open-space
      description: Existing open space, sport or recreational/play space, or allotments.
  - condition:
      field: loss-of-open-space
      value: true
      description: The proposal removes or affects the use of open space without suitable replacement.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policies OS1 and OS2; Green Infrastructure SPD (2016)
source-text: Required where proposals remove or affect the use of existing open space, sport, and recreational
  / play spaces, allotments without suitable replacement. For amenity and natural green spaces such as
  roadside verges this assessment is only required on sites exceeding 0.2 hectares.
must-include:
- item: Shows the site is surplus to requirements, against the Open Space, Sport and Recreation Study
    and the Playing Pitch Study
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 38-39. Where playing fields
  are affected, Sport England's checklists apply.
review-status: unverified
field-status: {}
