reference: noise-assessment
local-authority: CRW
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The major development is residential.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use, including dwellings near the London-Brighton or Three Bridges-Horsham
        railways, major roads or aviation noise contours.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
confidence: medium
notes: 'From the audit (missing_requirement): major residential, noise-sensitive uses, and dwellings near
  the London-Brighton and Three Bridges-Horsham railways, major roads or aviation noise contours.'
review-status: unverified
field-status: {}
