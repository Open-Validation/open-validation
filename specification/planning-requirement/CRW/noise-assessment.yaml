reference: noise-assessment
local-authority: CRW
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
  - condition:
      field: noise-sensitive-use
      value: true
      description: 'Noise-sensitive uses likely to be exposed to significant noise: aviation noise contours,
        dwellings within 200m of the London-Brighton main line or 50m of the Three Bridges-Horsham line,
        or near the M23, A and B roads or busy side roads.'
  - condition:
      field: noise-generating-use
      value: true
      description: Industrial or commercial development that could affect noise-sensitive receptors, or
        another noise generator.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policy EP4 and Noise Annex
source-text: 'Required for: Major applications for residential development, Any other applications where
  noise sensitive uses are likely to be exposed to significant or unacceptable noise, either as a noise
  receptor or generator; all Industrial or Commercial development with where such activities could impact
  upon noise sensitive receptors.'
must-include:
- item: The impact of the proposal as a noise receptor or generator
  level: must
- item: How the development will be designed, located and controlled to mitigate noise on health, quality
    of life, neighbours and the area
  level: must
- item: 'Prepared following the Planning Noise Advice Document: Sussex and ProPG: Planning and Noise'
  level: should
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 37-38. For industrial or commercial
  uses it can be combined with a ventilation and extraction statement.
review-status: unverified
field-status: {}
