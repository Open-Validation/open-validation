reference: biodiversity-survey-report
local-authority: CRW
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - ancient-woodland
      - local-wildlife-site
      - priority-habitat
      description: May affect an SSSI, Ancient Woodland, a Local Nature Reserve, a Local Wildlife Site
        or a Habitat of Principal Importance.
  - condition:
      field: veteran-trees
      value: true
      description: Aged or veteran trees.
  - condition:
      field: protected-species
      value: true
      description: Protected species or species of principal importance recorded or likely, including
        in buildings and roof voids to be modified, converted or demolished.
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policy GI2; Green Infrastructure SPD (2016)
source-text: 'Required for planning applications which may, directly or indirectly, affect the following
  sites, species or features identified in policy GI2: Sites of Special Scientific Interest (SSSIs); Ancient
  Woodland and aged or veteran trees; Local Nature Reserves; Local Wildlife Sites (LWS); Nature Improvement
  Areas; Habitats of Principle Importance (see Table 10 of the Green Infrastructure SPD); Biodiversity
  Opportunity Areas; Sites where protected species or species of principle importance have been recorded
  are likely to be present (see Table 9 of the Green Infrastructure SPD). Also required for development
  including the modification, conversion, demolition or removal of buildings and structures (especially
  roof voids) where protected species or species of principle importance are likely to be present'
must-include:
- item: Ecological Impact Assessment with survey data; a Preliminary Ecological Appraisal alone only where
    it finds no designated sites or priority habitats affected and negligible potential for protected
    species
  level: must
- item: Presence of habitats, biodiversity features, plants and animals (including bats) accurately identified
    and recorded
  level: must
- item: Impacts assessed, showing significant impacts can be avoided, mitigated or, as a last resort,
    compensated
  level: must
- item: Informed by a search of the Sussex Biodiversity Record Centre
  level: must
- item: Complies with BS 42020:2013 and CIEEM best practice guidance
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 26-27. Nature Improvement Areas
  and Biodiversity Opportunity Areas are shown as the council's discretion (no map field for them yet).
review-status: unverified
field-status: {}
