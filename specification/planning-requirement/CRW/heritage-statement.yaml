reference: heritage-statement
local-authority: CRW
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - conservation-area
      - locally-listed-building
      - local-character-area
      - park-and-garden
      description: 'Affects a heritage asset or its setting: listed building, scheduled monument, conservation
        area, locally listed building, Area of Special Local Character or historic park and garden.'
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 chapter 6 (policies HA2 to HA7)
source-text: 'A HIA will be required with applications for Listed Building Consent and with all applications
  for development affecting heritage assets or the setting of a heritage asset, including the following:
  Listed Buildings and Structures; Scheduled Ancient Monuments; Conservation Areas; Locally Listed Buildings;
  Areas of Special Local Character; Historic Parks and Gardens; Other assets with archaeological interest.'
must-include:
- item: Significance of the heritage assets affected and the contribution of their setting, the impact
    of the development, and measures to respect, preserve or enhance them
  level: must
- item: Informed by a search of the Historic Environment Record (HER)
  level: must
- item: 'Conservation areas: conformity with the Conservation Area Statement and policy HA2'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: 'Areas of Special Local Character: regard to the reasons for designation, character and significance,
    and policy HA3'
  level: must
  required-if:
    site:
      in:
      - local-character-area
      description: In an Area of Special Local Character.
- item: 'Listed buildings: how the value of the building, its setting and key features are protected,
    and policy HA4'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      description: Affects a listed building.
- item: 'Locally listed buildings: heritage significance against the criteria in policy HA5'
  level: must
  required-if:
    site:
      in:
      - locally-listed-building
      description: Affects a locally listed building.
- item: 'Historic parks and gardens: designation, character, key features and setting, and policy HA6'
  level: must
  required-if:
    site:
      in:
      - park-and-garden
      description: Affects a historic park or garden.
- item: 'Scheduled monuments: how the significance is protected or enhanced, and policy HA7'
  level: must
  required-if:
    site:
      in:
      - scheduled-monument
      description: Affects a scheduled monument.
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 32-34. 'Other assets with archaeological
  interest' are shown as the council's discretion.
review-status: unverified
field-status: {}
