reference: sustainable-drainage-strategy
local-authority: CRW
required-if:
  ref: major-development
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policy EP1; West Sussex LLFA Policy for the Management of
  Surface Water
source-text: A Drainage Strategy will be required for all proposals for major development.
must-include:
- item: Proposed surface water drainage arrangements, complying with West Sussex County Council's sustainable
    drainage policies, existing flow paths and water re-use
  level: must
- item: Surface water not draining to the foul sewer
  level: must
- item: How the drainage design will be certified after construction
  level: must
- item: 'In Flood Zones 2 and 3: a more comprehensive statement showing no reduction in flood plain area'
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3 (Flood Risk Assessment and Drainage
  Strategy), page 29.
review-status: unverified
field-status: {}
