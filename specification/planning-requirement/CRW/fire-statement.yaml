reference: fire-statement
local-authority: CRW
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for an application for planning permission for development which involves the provision
  of one or more buildings to which the definition of 'relevant building' applies, development of an existing
  relevant building or development within the curtilage of a relevant building.
must-include:
- item: On the form published by the Secretary of State (or one substantially to the same effect), with
    the particulars it asks for
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 12.
  A relevant building has 2 or more dwellings or educational accommodation and is 18 metres or more high
  or 7 or more storeys. Work to an existing relevant building, or in its curtilage, also needs one.
review-status: unverified
field-status: {}
