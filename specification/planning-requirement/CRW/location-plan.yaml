reference: location-plan
local-authority: CRW
required-if:
  always: true
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: At an identified metric scale (typically 1:1250, or 1:2500 for larger sites), with the direction
    of North
  level: must
- item: Scaled to fit on an A4 size document
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location clear
  level: must
- item: Application site, including all land needed to carry out the development (such as access from
    the road), outlined in red
  level: must
- item: Any other land owned by the applicant close to or adjoining the site outlined in blue
  level: must
- item: Ordnance Survey map not a Land Registry document, a photocopy or a screen grab; shows OS Crown
    copyright and the licence number; not reused for multiple applications
  level: must
- item: 'For advertisements: the position of the proposed signs, with the site located by reference to
    at least two named roads'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 8-9,
  12.
review-status: unverified
field-status: {}
