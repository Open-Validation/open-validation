reference: roof-plan-existing
local-authority: CRW
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: A new building.
  - condition:
      field: roof-alteration
      value: true
      description: The development is attached to or changes an existing roof, or forms a new roof.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for new buildings and where a development is attached to or changes an existing
  roof structure or forms a new roof.
must-include:
- item: Drawn at a metric scale of 1:50 or 1:100; for less complicated proposals it can be shown on the
    1:500 or 1:200 block plan
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 11.
review-status: unverified
field-status: {}
