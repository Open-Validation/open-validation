reference: floor-plan-proposed
local-authority: CRW
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building operations or changes the floor layout.
  - condition:
      field: external-alterations
      value: true
      description: The plans need to show where new windows or doors go relative to the existing property.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Crawley Borough
  Local Plan 2023-2040 policy DD2
source-text: Required when the application would involve building operations or some change to the floor
  layout, or to indicate the locations of new windows/doors relative to the existing property.
must-include:
- item: Drawn at a metric scale of 1:50 or 1:100
  level: must
- item: The use of each room
  level: must
- item: 'For change of use: the existing and proposed use of each part of the building'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use.
- item: Surrounding context, with a consistent north sign
  level: should
- item: Marked up to show compliance with Building Regulations Part M Category 2 (accessible and adaptable
    dwellings), unless exceptional circumstances mean this cannot be met
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The development creates one or more new dwellings.
  source-text: For development which includes the creation of one or more new dwellings. The proposed
    floorplans must be marked up to show compliance with Building Regulations Part M Category 2 – accessible
    and adaptable dwellings, unless there are exceptional circumstances which mean this standard cannot
    be met.
confidence: medium
notes: From the council's list (adopted 3 November 2025), sections 1 and 3, page 10, 30.
review-status: unverified
field-status: {}
