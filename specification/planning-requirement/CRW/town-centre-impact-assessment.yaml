reference: town-centre-impact-assessment
local-authority: CRW
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses outside the Primary Shopping Area and Neighbourhood Parades.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policies EC6, EC7, EC12 and TC5; Town Centre SPD (2016)
source-text: Required for proposals for Main Town Centre Uses (as defined in the NPPF) outside the Primary
  Shopping Area and Neighbourhood Parades. For all applications this comprises a Sequential Assessment
  (except hotels/ and visitor accommodation within the Gatwick Airport boundary and Grade A office floorspace
  proposed within Main Employment Areas or located within 500 metres of a public transport interchange)
  AND in some cases an Impact Assessment
must-include:
- item: Sequential assessment (not needed for hotels in the Gatwick Airport boundary, or Grade A offices
    in Main Employment Areas or within 500m of a public transport interchange)
  level: must
- item: 'Impact assessment where retail creates more than 500 sq m gross, or leisure more than 2,500 sq
    m gross: expenditure and trade draw, store format and trade densities, product range, cumulative impact'
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 500
        description: Retail over 500 sq m gross.
    - discretionary
- item: 'Hotels in the Gatwick Airport boundary: no harm to the airport''s long-term ability to meet its
    operational land and floorspace needs'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 44-45. It can be included in
  an Economic Statement. Leisure over 2,500 sq m shows as 'check'.
review-status: unverified
field-status: {}
