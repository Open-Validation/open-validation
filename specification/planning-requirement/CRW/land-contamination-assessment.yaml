reference: land-contamination-assessment
local-authority: CRW
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Site known or suspected to be at risk from contaminants.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Former commercial buildings converted to residential.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates homes.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policy EP3
source-text: 'Required for: Development on a site which is known or suspected to be at risk from contaminants
  or materials that present a hazard to health or a risk to underlying groundwater. Where former commercial
  buildings are being converted into residential the developer must either submit evidence that the building
  was built post 2000 or provide an intrusive pre-demolition and refurbishment Asbestos Survey.'
must-include:
- item: Stage 1 Risk Assessment (such as a desk study with a conceptual model of potential pollutant linkages)
    by a competent person
  level: must
  required-if:
    site:
      in:
      - contaminated-land
      description: Site known or suspected to be contaminated.
- item: 'Stage 2 Risk Assessment where required: detailed site investigation by an accredited consultant
    to BS 10175:2011'
  level: must
  required-if: discretionary
- item: 'For commercial-to-residential conversions: evidence the building was built after 2000, or an
    intrusive pre-demolition and refurbishment asbestos survey to HSG264 with a mitigation scheme'
  level: must
  required-if:
    all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates homes.
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 25-26.
review-status: unverified
field-status: {}
