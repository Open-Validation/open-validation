  level: must
- item: Evidence that the Developer's Notice was served before the application was submitted
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
- item: Evidence that the owner or agricultural tenant has been notified
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Signed declaration that the equipment and installation fully comply with ICNIRP guidelines
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 15.
  Gatwick Airport Safeguarding should be consulted on masts, antennas, aerials and dishes within 3 km
