reference: design-and-access-statement
local-authority: CRW
required-if:
  any:
  - &id001
    ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Crawley Borough Local Plan 2023-2040 strategic policy CL2 and policies CL3, CL4, CL5 and CL7
source-text: 'A Design and Access Statement must accompany applications for both outline and full planning
  permission for: Major development (10 or more dwellings or creation in excess of 1000sqm of non-residential
  floor space). Listed Building Consent. Conservation Area and World Heritage Sites only - to be submitted
  with applications for one or more dwellings, or, a building or buildings where the floor space created
  by the development is 100 square metres or more.'
must-include:
- item: 'For major applications: each of the 10 characteristics of well-designed places addressed under
    the National Model Design Code sub-headings (context, identity, built form, movement, nature, public
    spaces, uses, homes and buildings, resources, lifespan)'
  level: must
  required-if: *id001
  source-text: For Major applications each of the 10 Characteristics of well-designed places must be addressed,
    using the sub-headings set out in the National Model Design Code.
- item: 'For significant development: a master plan and design code (in the statement or separately) showing
    how the site will be developed and phased, the landscape and movement strategy, and key principles'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 150
        description: More than 150 dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 6000
        description: More than 6,000 sq m of commercial floorspace.
  source-text: To support applications for significant development (proposals in excess of 150 dwellings
    or 6,000 sqm of commercial floorspace)
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 2, page 20-23.
review-status: unverified
field-status: {}
