reference: arboriculturist-report
local-authority: CRW
required-if:
  any:
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on or near the site.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: The trees have a tree preservation order or are in a conservation area.
  - site:
      in:
      - ancient-woodland
      - local-character-area
      description: The site is in or near ancient woodland, or in an Area of Special Local Character.
  - condition:
      field: veteran-trees
      value: true
      description: There are veteran trees on or next to the site.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
source-text: It should include copies of the Tree Survey and Tree Retention/Removal Plan and provide details
  of any required facilitation pruning.
must-include:
- item: Copies of the Tree Survey and Tree Retention/Removal Plan
  level: should
- item: Details of any required facilitation pruning
  level: should
confidence: medium
notes: 'From the audit (missing_requirement): Tree Information covers trees with a TPO or in a conservation
  area, ancient woodland, veteran trees and Areas of Special Local Character, including householder applications.'
review-status: unverified
field-status: {}
