reference: arboriculturist-report
local-authority: CRW
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees subject to a Tree Preservation Order.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or affected by the proposal.
    - site:
        in:
        - conservation-area
        - local-character-area
        description: Trees in a Conservation Area or an Area of Special Local Character.
  - site:
      in:
      - ancient-woodland
      description: Ancient Woodland.
  - condition:
      field: veteran-trees
      value: true
      description: Veteran trees.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or affected by the proposal.
    - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policies HA2, GI3, DD1 and DD4; Green Infrastructure SPD
  (2016)
source-text: 'Required where the following are present on the site or affected by the proposal: Trees
  subject to a Tree Preservation Order (TPO); Trees within a Conservation Area; Areas of Ancient Woodland,
  Veteran trees or Structural Landscaping; Trees within an Area of Special Local Character (ASLC); Other
  trees which make a contribution to amenity or landscaping.'
must-include:
- item: 'Arboricultural Impact Assessment: impact of the development on trees, and of trees on the development,
    with any facilitation pruning'
  level: must
- item: 'Tree survey to BS 5837:2012 of trees on and next to the site: category (A, B, C or U) and Root
    Protection Areas'
  level: must
- item: 'Retention/removal plan: retained trees circled with a continuous line, trees to be removed with
    a dashed line, with survey numbers'
  level: must
- item: 'Arboricultural Method Statement: how demolition will happen, where materials are stored, and
    phasing'
  level: must
- item: Tree Protection Plan on the final site layout, showing all protective barriers and proposed hard
    surfacing
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 48-49. Structural landscaping
  and other trees that matter for amenity show as 'check'.
review-status: unverified
field-status: {}
