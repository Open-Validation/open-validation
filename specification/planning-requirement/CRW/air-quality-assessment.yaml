reference: air-quality-assessment
local-authority: CRW
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - air-quality-management-area
      description: In an Air Quality Management Area and likely to affect air quality.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 500
      description: Use Class B8 (storage or distribution) with 500 sq m or more floorspace.
  - condition:
      field: biomass-or-chp
      value: true
      description: Plant with emissions to the atmosphere, such as boiler plant, solid fuel or district
        heating.
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policy EP5 and Planning Obligations Annex
source-text: 'Required for: major development; development within an Air Quality Management Area which
  is likely to have an impact on air quality. Development in relevant proximity to an AQMA or close to
  exceeding Air Quality objectives (to be advised by CBC Air Quality officer) Development within Use Class
  B8 (Storage or distribution) where 500 sq m or more floorspace is provided; Development of plant which
  has potential to impact on air quality through emissions to the atmosphere (such as boiler plant including
  solid fuel and district heating systems or through a proposed industrial or commercial process).'
must-include:
- item: Predicted concentrations of pollutants of concern at appropriate dates and sensitive locations,
    the predicted change in air quality and its spatial impact
  level: must
- item: 'Emissions Mitigation Statement: the development''s emissions, the monetised health damage value,
    and the mitigation required'
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 24-25. Officer discretion covers
  sites near an AQMA and industrial or commercial processes. An Odour Impact Assessment is also needed
  within 800m of Crawley Sewage Treatment Works (see data/unmapped-requirement.csv).
review-status: unverified
field-status: {}
