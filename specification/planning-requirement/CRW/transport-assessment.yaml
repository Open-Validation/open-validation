reference: transport-assessment
local-authority: CRW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more dwellings (Use Class C3).
  - condition:
      field: bedroom-count
      operator: '>='
      value: 75
      description: Hotels (C1) with 75 or more bedrooms.
  - condition:
      field: office-floorspace
      operator: '>='
      value: 1500
      description: Business (E(g)) 1,500 sq m or more.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: General industrial (B2) 2,500 sq m or more.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 3000
      description: Storage and distribution (B8) 3,000 sq m or more.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 800
      description: Retail (E(a)) 800 sq m or more.
  - all:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 250
        description: Food retail 250 sq m or more.
    - discretionary
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 strategic policy ST1, policy IN1 and Planning Obligations
  Annex
source-text: 'A Transport Statement will be required for development with relatively small transport implications.
  Specifically: Hotels (Use Class C1) including 75 bedrooms or more; New residential institutions (Use
  Class C2) including 50 or more students or 30 or more hospital beds; Residential development (Use Class
  C3) including 50-80 dwellings; Business development (Use Class E(g)) including 1500 sqm or more; General
  industrial development (Use Class B2) including 2500 sqm or more; Storage and distribution development
  (Use Class B8) including 3000 sqm or more; Food retail development (Use Class E(a)) including 250 sqm
  or more; Non-food retail development (Use Class E(a)) including 800 sqm or more. For other uses please
  contact the council.'
must-include:
- item: 'A full Transport Assessment (not a Transport Statement) for: 80+ dwellings; hotels with 100+
    bedrooms; C2 with 150+ students or 50+ hospital beds; E(g) 2,500+ sq m; B2 4,000+ sq m; B8 5,000+
    sq m; food retail 800+ sq m; non-food retail 1,500+ sq m'
  level: must
  required-if: &id001
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 80
        description: 80 or more dwellings.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 100
        description: Hotels with 100 or more bedrooms.
    - condition:
        field: office-floorspace
        operator: '>='
        value: 2500
        description: Business (E(g)) 2,500 sq m or more.
    - condition:
        field: industrial-floorspace
        operator: '>='
        value: 4000
        description: General industrial (B2) 4,000 sq m or more.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 5000
        description: B8 5,000 sq m or more.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1500
        description: Retail 1,500 sq m or more.
    - all:
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 800
          description: Food retail 800 sq m or more.
      - discretionary
- item: Vehicle movements, access and visibility splays, hours of operation and parking
  level: must
- item: Review of road traffic incidents
  level: must
- item: Mitigation such as off-site highway improvements
  level: must
- item: Swept path tracking for all vehicles, including refuse collection and fire appliances
  level: must
- item: 'For a Transport Assessment: existing public transport, travel characteristics across all modes,
    cumulative impacts of committed development, traffic flows and junction capacity'
  level: must
  required-if: *id001
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 45-48. The council asks for
  a Transport Statement at the lower thresholds and a Transport Assessment at the higher ones (shown under
  'Must show'). C2 thresholds (students, hospital beds) and other uses show as 'check'. Talk to National
  Highways about any impact on the Strategic Road Network.
review-status: unverified
field-status: {}
