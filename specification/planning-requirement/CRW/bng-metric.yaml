reference: bng-metric
local-authority: CRW
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Environment Act 2021; Biodiversity Gain (Town and Country Planning) (Consequential Amendments)
  Regulations 2024
source-text: BNG is a mandatory requirement ... Most Major and Minor planning applications must demonstrate
  that the development exceeds the pre-development biodiversity value of the onsite habitat by at least
  10%. If this information has not been provided, the Council will refuse to validate the application.
must-include:
- item: Completed metric showing the pre-development biodiversity value on the date of application (or
    an earlier proposed date), with the publication date of the metric used
  level: must
- item: Provided as a 'live' version in an unlocked Excel spreadsheet so the data can be checked
  level: must
- item: The earlier date and the reasons for it, if an earlier date is used
  level: must
  required-if: discretionary
- item: Statement on any activities before that date that lost onsite biodiversity value ('degradation'),
    with the date, the earlier value, the metric and evidence
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 2, page 16-17. If you think the biodiversity
  gain condition doesn't apply, you must give a statement saying why.
review-status: unverified
field-status: {}
