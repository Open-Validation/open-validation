reference: affordable-housing-statement
local-authority: CRW
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development with one or more additional units (Use Class C2 or C3).
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 strategic policy H4, policies H5, H6 and H7 and Planning
  Obligations Annex; Affordable Housing SPD (2017)
source-text: Required for all Full applications for residential development which result in one or more
  additional units. This includes applications which provide care and fall in Use Classes C2 or C3.
must-include:
- item: Consideration of the Strategic Housing Market Assessment
  level: must
- item: 'Type of provision: on-site (the default), or a financial contribution in exceptional circumstances'
  level: must
- item: 'For on-site provision: quantum, tenure split and unit mix; site plan showing tenures; floor plans
    with room sizes and storage; parking allocation plan; phasing plan; schedule of accommodation; design
    and sustainability standards; how a provider will be appointed'
  level: must
  required-if: discretionary
- item: 'Build to rent: the requirements of policy H6'
  level: must
  required-if: discretionary
- item: 'Self and custom build: policy H7, and a phasing plan where more than one self-build dwelling
    is proposed'
  level: must
  required-if: discretionary
- item: 'Major residential development: compliance with the Housing Mix test in policy H4'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 34-35. For outline applications
  affordable housing is secured at permission stage and detail may follow at reserved matters; for Permission
  in Principle, at Technical Details Consent. The list calls this a 'Housing and Affordable Housing Statement/Scheme'
  and asks for it from one additional unit, which is lower than most councils; its links include a 'CBC
  Summary Guidance Document for Small Residential Applications'.
review-status: unverified
field-status: {}
