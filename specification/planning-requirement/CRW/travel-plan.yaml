reference: travel-plan
local-authority: CRW
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more dwellings (Use Class C3).
  - condition:
      field: bedroom-count
      operator: '>='
      value: 75
      description: Hotels (C1) with 75 or more bedrooms.
  - condition:
      field: office-floorspace
      operator: '>='
      value: 1500
      description: Business (E(g)) 1,500 sq m or more.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 2500
      description: General industrial (B2) 2,500 sq m or more.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 3000
      description: Storage and distribution (B8) 3,000 sq m or more.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 800
      description: Retail (E(a)) 800 sq m or more.
  - all:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 250
        description: Food retail 250 sq m or more.
    - discretionary
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 strategic policy ST1, policy IN1 and Planning Obligations
  Annex
source-text: Transport Assessment (including Travel Plan or Mobility Strategy in the case of large-scale
  major residential and strategic developments) ... Transport Statement (including a Travel Plan Statement)
must-include:
- item: How the development will reduce single occupancy car use and increase sustainable and active travel
  level: must
- item: 'A full Travel Plan or Mobility Strategy (with a Transport Assessment): specific outcomes, targets
    and measures; monitoring and management; extra measures if targets are missed'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 80
        description: 80 or more dwellings.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 100
        description: Hotels with 100 or more bedrooms.
    - condition:
        field: office-floorspace
        operator: '>='
        value: 2500
        description: Business (E(g)) 2,500 sq m or more.
    - condition:
        field: industrial-floorspace
        operator: '>='
        value: 4000
        description: General industrial (B2) 4,000 sq m or more.
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 5000
        description: B8 5,000 sq m or more.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1500
        description: Retail 1,500 sq m or more.
    - all:
      - condition:
          field: retail-floorspace
          operator: '>='
          value: 800
          description: Food retail 800 sq m or more.
      - discretionary
- item: 'Mobility Strategy, where required: plans for full access needs on Mobility as a Service (MaaS)
    principles'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted 3 November 2025), section 3, page 45-48. Needed whenever a Transport
  Assessment or Statement is: a Travel Plan Statement with a Transport Statement, a Travel Plan or Mobility
  Strategy with a Transport Assessment.'
review-status: unverified
field-status: {}
