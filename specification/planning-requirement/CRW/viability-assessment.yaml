reference: viability-assessment
local-authority: CRW
required-if: discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 strategic policy H5 and Planning Obligations Annex; Affordable
  Housing SPD (2017)
source-text: Required where an application is seeking on grounds of financial viability to justify non-compliance
  with policy requirements which are applicable subject to financial viability.
must-include:
- item: Open book, prepared in line with national Planning Practice Guidance
  level: must
- item: 'Executive summary of key inputs: gross development value, benchmark land value, landowner premium,
    costs and developer return'
  level: must
- item: Publicly available (or a public executive summary if the council agrees the content is commercially
    sensitive)
  level: must
- item: 'Development costs: build, abnormal, site infrastructure, policy requirements and contributions,
    finance, fees and marketing, contingency'
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 50-51. Shown as 'check' because
  it depends on whether you argue viability. The applicant pays for the council's external review.
review-status: unverified
field-status: {}
