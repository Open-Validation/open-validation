reference: sustainability-statement
local-authority: CRW
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New build floorspace.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: More than 100 sq m of new build floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings, including by conversion.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use into Class E, C or F.
    - discretionary
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policies SDC1, SDC2 and SDC3; Planning & Climate Change SPD
  (2016)
source-text: 'A Sustainability Statement is required for applications for development including any of
  the following: The creation of more than 100sqm of new build floorspace; The creation of one or more
  new dwellings (including by conversion). Extension of a building which already comprises 1000sqm or
  more. The following changes of use, where cumulatively affecting 100 sqm or more: Non E Class to E class
  Non C Class to C class Non F Class to F class'
must-include:
- item: How the development will mitigate and adapt to climate change, following 'Be Lean, Be Clean, Be
    Green'
  level: must
- item: How carbon will be minimised through the development process and existing embodied carbon kept,
    including the feasibility of re-using existing buildings
  level: must
- item: How decentralised energy has been considered (policy SDC2)
  level: must
- item: Use of renewable and low carbon energy, including roof-space for solar PV where possible
  level: must
- item: 'New dwellings: the Target Emission Rate met through fabric and energy efficiency alone, and a
    19% reduction against Part L 2013 (or any new national standard)'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwellings.
- item: '10 or more homes or 0.5 ha or more: a quality regime so ''as built'' performance matches design'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more homes.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: 0.5 ha or more.
- item: 'New non-residential buildings: BREEAM certification meeting the Excellent minimum standards for
    Energy and Water, or evidence this isn''t technically feasible'
  level: must
  required-if:
    all:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Non-residential floorspace.
- item: How it tackles water stress (policy SDC3) and copes with future temperature extremes using the
    cooling hierarchy
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 42-44. Extensions to buildings
  of 1,000 sq m or more, and changes of use affecting 100 sq m or more, show as 'check'.
review-status: unverified
field-status: {}
