reference: sustainability-statement
local-authority: CRW
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new-build floorspace.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Over 100 square metres of new floorspace.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: The proposal changes the use of a building.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: The change of use covers 100 square metres or more.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt stops mid-sentence and runs into Statement of Community Involvement
  text. From the audit: over 100 sqm new build, one or more new dwellings, extensions to buildings of
  1,000 sqm or more, and changes of use of 100 sqm or more. The extension case is not encoded (it is unclear
  whether 1,000 sqm is the extension or the existing building).'
review-status: unverified
field-status: {}
