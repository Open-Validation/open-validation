reference: flood-risk-assessment
local-authority: CRW
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Site over 1 hectare.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Site over 1 hectare.
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Crawley Borough Local Plan 2023-2040 policies EP1 and EP2
source-text: 'A Flood Risk Assessment is required for: Major development proposals on sites of over 1
  hectare in Flood Zone 1. Any proposals for development in Flood Zones 2 or 3. (excluding householder
  development, minor non-residential extensions with a footprint of less than 250 sqm and minor alterations
  to a property which are subject to separate requirements.'
must-include:
- item: Sequential test and, if needed, the exception test shown to be met, where required
  level: must
- item: Whether the development is likely to be affected by current or future flooding from any source,
    and that flood risk on site is acceptable
  level: must
- item: That it will not increase flood risk elsewhere
  level: must
- item: Measures to deal with the risks over the lifetime of the development, allowing for climate change
  level: must
- item: A reduction in run-off through SuDS (unless shown unviable or not feasible)
  level: must
- item: 'For householder development, minor non-residential extensions under 250 sq m and minor alterations:
    a proportionate Flood Risk and Resilience Statement can be given instead, showing how loss of flood
    storage is mitigated and how the design is resilient'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: A Flood Risk and Resilience Statement is required for the following development within
    Flood Zone 2, Flood Zone 3a and Flood Zone 3b Householder development Minor non-residential extensions
    with a footprint of less than 250 sq m Minor alterations to a property
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 28-30. Also needed in Flood
  Zone 1 where the development may be at risk from non-fluvial flooding (shown as the council's discretion).
  Separate consents are needed for works to ordinary watercourses (West Sussex County Council) and drain
  connections (Thames Water).
review-status: unverified
field-status: {}
