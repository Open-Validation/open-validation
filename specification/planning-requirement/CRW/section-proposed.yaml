reference: section-proposed
local-authority: CRW
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes floor levels in an existing building, or a new building is on
        changing ground levels, or land is infilled.
  - condition:
      field: hard-surfacing
      value: true
      description: Laying materials for a drive or similar.
  - discretionary
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for buildings to show proposed elevations obscured by other structures/buildings
  that aren't apparent on plan drawings and when the application would cause changes to floor levels in
  an existing building, or when a new building is to be built on changing ground levels. Also required
  with any infill of land or laying of materials for a drive etc.
must-include:
- item: Drawn at a metric scale of 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 11.
  'Elevations obscured by other structures' is shown as the council's discretion.
review-status: unverified
field-status: {}
