reference: sci
local-authority: CRW
required-if:
  any:
  - condition:
      field: pre-application-community-consultation
      value: true
      description: The developer has carried out public consultation.
  - condition:
      field: wind-turbine-count
      operator: '>'
      value: 2
      description: More than 2 wind turbines.
  - condition:
      field: turbine-hub-height
      operator: '>'
      value: 15
      description: A turbine hub height over 15 metres.
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Sections 61W and 61X, Town and Country Planning Act 1990; Crawley Statement of Community Involvement
  (June 2020)
source-text: Required where the developer has undertaken public consultation regarding the proposals (this
  is mandatory for wind turbine development including more than 2 turbines or where the hub height of
  any turbine exceeds 15 metres).
must-include:
- item: Nature, location and timing of consultation activity
  level: must
- item: Examples of consultation material
  level: must
- item: Summary of responses and how the proposal was influenced
  level: must
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 3, page 42.
review-status: unverified
field-status: {}
