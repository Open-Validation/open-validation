reference: elevation-proposed
local-authority: CRW
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building operations.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the elevations of an existing building.
  - application-type:
      in:
      - advertising
source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning (Control of Advertisements) (England) Regulations 2007
source-text: Required when the proposal would involve building operations or cause some change to the
  elevations of an existing building.
must-include:
- item: Drawn at a scale of 1:50 or 1:100, showing all new sides of the proposal
  level: must
- item: 'For minor changes such as materials: the existing and proposed materials highlighted'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: Minor external changes, such as materials.
- item: 'For advertisements: drawings of the proposed advertisement(s) at 1:50 or 1:100, showing dimensions
    and their position on the land or building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisements: materials, fixings, colours, height above ground and any projection from
    the building'
  level: should
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (adopted 3 November 2025), section 1 (National Requirements), page 10-13.
review-status: unverified
field-status: {}
