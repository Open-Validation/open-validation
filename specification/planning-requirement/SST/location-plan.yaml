reference: location-plan
local-authority: SST
required-if:
  always: true
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Based on an up-to-date map at a scale of 1:1250 or 1:2500
  level: must
- item: At least one named road and 2 surrounding buildings, with the properties shown numbered or named
    so the exact location of the site is clear
  level: should
- item: 'For householder applications: at least two named roads and surrounding buildings'
  level: should
  required-if:
    application-type:
      in:
      - hh
  source-text: The plan should show at least two named roads and surrounding buildings.
- item: The direction of north and a linear scale bar to assist with electronic scaling / measuring
  level: must
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (e.g. access from a public highway, visibility splays, landscaping, septic tanks, car parking and
    open areas around buildings)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
- item: 'Outline applications: the area or areas where access points to the development will be situated,
    even if access is reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: Outline applications must indicate the area or areas where access points to the development
    will be situated, even if access has been reserved.
confidence: medium
notes: From the council's list (published March 2022), page 11; and its householder validation guidance
  (updated October 2026), page 4-5. Item 5.
review-status: unverified
field-status: {}
