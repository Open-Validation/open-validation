reference: lighting-assessment
local-authority: SST
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting is provided or made necessary by the development.
  - any:
    - condition:
        field: adjoins-residential-property
        value: true
        description: In the vicinity of residential property.
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or conservation area.
    - condition:
        field: protected-species
        value: true
        description: Habitats of value for nocturnal wildlife (e.g. bats).
    - condition:
        field: outside-urban-area
        value: true
        description: Open countryside.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: South Staffordshire Core Strategy
source-text: Applications which involve the use of external lighting in sensitive areas.
must-include:
- item: Details of external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation, an illuminance contour plan and a schedule of the equipment
  level: must
- item: Mitigation of any detrimental amenity or nature conservation impacts
  level: must
confidence: medium
notes: 'From the council''s list (published March 2022), page 36. Item 33. The sensitive areas are those
  the list names: near homes, listed buildings or conservation areas, nocturnal wildlife habitats, or
  open countryside.'
review-status: unverified
field-status: {}
