reference: heritage-statement
local-authority: SST
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - conservation-area
      - park-and-garden
      - locally-listed-building
      description: Development affecting a designated heritage asset or its setting, or a locally listed
        building.
  - site:
      in:
      - historic-environment-record
      description: Sites of archaeological potential and other non-designated assets.
  - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF Section 16
source-text: Any application which either impacts or has the potential to impact upon a heritage asset
  in line with NPPF Section 16 paragraph 194A, a Heritage Impact Assessment will be required where development
  will impact upon designated heritage assets and their settings (Listed buildings/structures, Scheduled
  Monuments, Conservation Areas, Registered Parks and Gardens) as well as non-designated assets, such
  as locally listed buildings, sites of archaeological potential and historic hedgerows … Where your application
  involves a listed building, ancient monument or conservation area, your statement must also include
  a section on its heritage aspects.
must-include:
- item: A description of the significance of the heritage assets affected and the contribution of their
    setting to that significance, proportionate to their importance
  level: must
- item: Evidence that the relevant historic environment record has been consulted, and the sources and
    expertise used
  level: must
- item: An assessment of the impact of the proposal on that significance
  level: must
- item: 'Householder: the relevant designations (listed and at what grade, Scheduled Ancient Monument,
    conservation area), then the effect on the building''s special architectural and historic interest,
    the physical features that justify its designation, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published March 2022), page 26-28; and its householder validation guidance
  (updated October 2026), page 7-8. Item 23 (Heritage Impact Assessment). Whether a proposal has 'the
  potential to impact' a heritage asset is partly a judgement, so the list also shows as discretionary.
  The list recommends (not requires) an assessment for conversions of traditional farm buildings.
review-status: unverified
field-status: {}
