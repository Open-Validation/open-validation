source-text: 'Householder: Roof plans A roof plan is used to show the shape of the roof and is typically
  drawn at a scale smaller than the scale used for the floor plans.


  Full planning: Roof plans, where relevant, at a scale of 1:50 or 1:100 which should include the location
  of details such as roof lights and chimneys Where any proposed elevation adjoins another building or
  is in close proximity, the drawings should clearly show the relationship between the buildings and detail
  the positions of the openings on each property.'
