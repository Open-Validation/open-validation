reference: flood-risk-assessment
local-authority: SST
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3 (new development, excluding extensions at first floor or above).
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - change-of-use
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more (Flood Zone 1).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: 'Householder: the property is in flood zone 2 or 3.'
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: 'NPPF paragraphs 159-168; Planning Practice Guidance: Flood risk and coastal change'
source-text: Required for planning applications where the site area is 1 hectare or more in Flood Zone
  1 and required for all planning applications for new developments (excluding extensions at first floor
  or above) located in Flood Zones 2 and 3. … You do not need to submit a full flood risk assessment with
  a householder application. However, if your property is within flood risk zones two or three, your proposal
  must demonstrate that any new development will be at or above existing floor levels, and that you have
  included flood proofing measures where appropriate.
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
    (watercourses, ditches, culverts, surface water, sewers, groundwater and artificial sources such as
    canals and reservoirs)
  level: must
- item: That the development is safe and where possible reduces flood risk overall
  level: must
- item: Whether it will increase flood risk elsewhere
  level: must
- item: The measures proposed to deal with these effects and risks
  level: must
- item: Designs that reduce flood risk, incorporating sustainable drainage systems and, where necessary,
    flood resilience measures
  level: must
- item: How surface water flows will be reduced back to equivalent greenfield rates
  level: must
- item: 'Householder applications in flood zone 2 or 3: new development at or above existing floor levels
    with flood proofing measures, or finished floor levels set above the maximum extent of flooding'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published March 2022), page 18-19; and its householder validation guidance
  (updated October 2026), page 7. Item 14. Householder applications need flood protection details rather
  than a full FRA ('Flood protection details' in the householder checklist).
review-status: unverified
field-status: {}
