reference: travel-plan
local-authority: SST
required-if: discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: National Planning Practice Guidance
source-text: A Travel Plan should be submitted alongside planning applications which are likely to have
  significant transport implications (see Transport Assessments above).
must-include:
- item: How the transport implications of the development will be managed
  level: must
- item: The travel plan coordinator and management arrangements (e.g. a steering group and timetable)
  level: must
- item: Marketing activities and how the plan will be promoted to occupiers, users, visitors and residents
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 34-35. Item 30. 'Significant transport implications'
  is a judgement, so discretionary; the scope should be agreed with the highway authority before submission.
