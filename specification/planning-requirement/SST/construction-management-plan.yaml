reference: construction-management-plan
local-authority: SST
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: Residential development greater than 10 units.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.4
        description: Where the number of units is not known, a site of 0.4ha or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: Retail, commercial and industrial schemes (including changes of use) of 1,000 sq
          m or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Retail, commercial or industrial sites of 1ha or more.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Habitats Regulations
source-text: 'Full and Reserved Matters applications for: • Residential development greater than 10no.
  units; or, where the number of units is not known, on sites 0.4ha or greater in area • Retail, commercial
  and industrial schemes (including changes of use) involving floorspace of 1,000 square 9 metres; or
  more or sites of 1ha or more in area'
must-include:
- item: How the construction process will be managed to avoid harm to environmental interests at or around
    the site and to nearby communities
  level: must
- item: Mitigation strategies preventing pollution and other impacts on sensitive receptors (controlled
    waters including rivers, canals and groundwater)
  level: must
- item: 'Links to biodiversity net gain: how biodiversity loss is avoided/minimised and how mitigation
    or compensation achieves a net gain'
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 30-31. Listed under item 25a as the Construction
  Environment Management Plan (CEMP) / Habitat Management Plan (HMP). The '1,000 square 9 metres' typo
  is the council's.
review-status: unverified
field-status: {}
