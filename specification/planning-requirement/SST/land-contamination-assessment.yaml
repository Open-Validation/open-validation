reference: land-contamination-assessment
local-authority: SST
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
  - any:
    - site:
        in:
        - contaminated-land
        description: Land that is affected by contamination.
    - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF Section 15
source-text: All applications (excluding Householders, Advertisement and Heritage) where new development
  is proposed on land that is or may have been affected by contamination.
must-include:
- item: Enough information to determine whether contamination exists, its nature, the risks it may pose
    and whether these can be reduced to an acceptable level
  level: must
- item: Follows the 'Model Procedures for the Management of Land Contamination' (CLR11) risk management
    framework
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 37-38. Item 35. Land that 'may have been'
  affected is a judgement, so discretionary.
review-status: unverified
field-status: {}
