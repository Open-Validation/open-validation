reference: biodiversity-survey-report
local-authority: SST
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected or important species recorded, reported or reasonably expected.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - national-nature-reserve
      - local-nature-reserve
      - local-wildlife-site
      description: Potential to directly or indirectly affect international, national or local designated
        sites.
  - condition:
      field: irreplaceable-habitat
      value: true
      description: Potential to affect irreplaceable habitats.
  - site:
      in:
      - priority-habitat
      description: Potential to affect important (priority) habitats.
  - ref: major-development
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF paragraph 180; Wildlife and Countryside Act 1981; NERC Act 2006
source-text: All planning applications with the potential to affect protected or important species All
  planning applications with the potential to directly or indirectly affect designated sites including
  international, national and local designations. All planning applications with the potential to affect
  irreplaceable (NPPF 180 (d) or important habitats … All major developments should be accompanied by
  a Preliminary Ecological Assessment. … If your proposal might affect natural habitats and/or disturb
  protected species like bats, barn owls, badgers, great crested newts, you will need to conduct an ecological
  survey.
must-include:
- item: Survey work and an impact assessment to a nationally recognised standard, by suitably qualified
    ecologists at the appropriate time of year
  level: must
- item: 'Major development: a Preliminary Ecological Assessment including a Biodiversity Metric'
  level: must
  required-if:
    ref: major-development
- item: 'Great crested newts under District Licensing: the NatureSpace report/certificate'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Great crested newts, using the District Licence.
- item: 'Great crested newts under a Natural England licence: the surveys, impact assessment, mitigation
    and compensation measures'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Great crested newts, using a Natural England mitigation licence.
- item: 'Species survey: which species are present and their numbers, their distribution and use of the
    site, uncertainties and limitations, and whether further survey is needed'
  level: must
- item: 'Assessment: likely impacts, and where harm is likely, how alternatives were considered and how
    harm is avoided, mitigated or compensated'
  level: must
- item: 'Designated sites and priority habitats: habitats and features present, their extent, and a map
    of their distribution'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2022), page 28-29, 48-58; and its householder validation
  guidance (updated October 2026), page 7. Item 25a and Appendix A. The appendix lists exceptions (written
  confirmation from the council or Natural England that no survey is needed, or evidence of absence).
  Changes of use, advertisement, conservation area, listed building and TPO applications 'will not usually'
  need to consider newts.
review-status: unverified
field-status: {}
