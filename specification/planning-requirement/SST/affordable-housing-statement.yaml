reference: affordable-housing-statement
local-authority: SST
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A housing site of 0.5ha or more.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Affordable Housing and Housing Mix SPD
source-text: A major housing development - all applications for 10 or more dwellings or the site has an
  area of 0.5ha or more
must-include:
- item: Tenure, location and number of the proposed affordable dwellings
  level: must
- item: 'Where the appropriate level of affordable housing (30% brownfield / 40% greenfield) is not proposed:
    a financial viability assessment to an agreed methodology'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less than 30% (brownfield) or 40% (greenfield) affordable housing is proposed.
confidence: medium
notes: From the council's list (published March 2022), page 20-21. Item 15.
review-status: unverified
field-status: {}
