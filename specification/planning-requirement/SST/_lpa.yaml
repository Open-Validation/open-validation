  status: outdated
submission-standards:
- item: Applications submitted electronically need no further copies; paper applications need the original
    form and one paper copy of each plan and accompanying document (the householder guidance asks for
    three copies of everything on paper)
  level: must
- item: All elevations and plans clearly and logically labelled (for example 'front' or 'rear elevation')
    and given titles which refer to their content
  level: must
- item: Drawings include a linear scale bar to assist with electronic scaling / measuring, with written
    dimensions of the proposed works
  level: should
- item: Proposed works distinguished from the existing building, preferably using colour
  level: should
- item: Where a required item is not submitted, a written justification of why it is not appropriate
  level: must
- item: Re-submitted reports updated where they may be out of date
  level: should
