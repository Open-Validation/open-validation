  notes: 'Grokbot''s link is the FULL validation guidance the council still links, but the document is
    dated March 2022, not February 2023. The extraction is poor: many local items are missing (Coal Mining,
    Noise, SCI conformity, Agricultural need, Employment land, etc.), triggers are garbled or mislabelled,
    contaminated land is placed under the very types it excludes, and householder rows are wrongly copied
    to prior approval. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
