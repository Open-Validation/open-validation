reference: elevation-existing
local-authority: SST
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to the exterior of existing buildings.
  - application-type:
      in:
      - hh
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings.
must-include:
- item: Drawn to an appropriate scale, for example 1:50 or 1:100
  level: must
- item: The proposed works shown clearly in relation to what is already there, preferably in colour
  level: should
- item: Existing and proposed building materials, and the style, materials and finish of windows and doors
  level: should
- item: Corresponds exactly with the existing / proposed floor plan drawings
  level: must
- item: Any blank elevations included
  level: should
- item: Clearly and logically labelled (e.g. 'front' or 'rear elevation') with titles that refer to the
    content
  level: must
- item: Where an elevation adjoins or is close to another building, the relationship between the buildings
    and the positions of openings on each property
  level: should
- item: Where an existing building is extended or altered, the whole of each existing elevation being
    extended or altered, not just part of it
  level: must
- item: A linear scale bar, with written dimensions of the proposed works
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 12-13; and its householder validation guidance
  (updated October 2026), page 5. Item 7. The householder checklist lists existing and proposed elevations
  as a national requirement for every householder application.
review-status: unverified
field-status: {}
