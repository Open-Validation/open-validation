reference: bng-metric
local-authority: SST
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The statutory biodiversity gain condition applies.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF paragraph 174(d); Environment Act 2021 (statutory biodiversity net gain)
source-text: All planning applications that will result in a net loss of any habitat. … All major developments
  should be accompanied by a Preliminary Ecological Assessment. This should include a Biodiversity Metric
  which demonstrates net gain through the proposal.
must-include:
- item: Defra biodiversity metric used to determine whether there is a net loss to biodiversity, and to
    evaluate any proposed compensation such as off-site habitat creation
  level: must
confidence: medium
notes: From the council's list (published March 2022), page 28-29, 31. Item 25b (Biodiversity net gain).
  The 2022 list predates statutory biodiversity net gain; the rule follows the law (householder and other
  exempt applications are exempt).
review-status: unverified
field-status: {}
