reference: planning-statement
local-authority: SST
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings (temporary or permanent).
    - any:
      - site:
          in:
          - green-belt
          description: In the Green Belt.
      - condition:
          field: outside-urban-area
          value: true
          description: In the Open Countryside.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - site:
        in:
        - green-belt
        description: In the Green Belt.
    - discretionary
  - condition:
      field: enabling-development
      value: true
      description: The application involves 'enabling' development.
  - discretionary
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - green-belt
          description: In the Green Belt.
      - condition:
          field: outside-urban-area
          value: true
          description: In the Open Countryside.
    - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: South Staffordshire Core Strategy policy EV2
source-text: '- Applications for all Major development - New dwellings [temporary or permanent] within
  the Green Belt/Open Countryside - All Minor development within the Green Belt which results in inappropriate
  development -Tourism proposals outside of identified development boundaries. - Large scale equestrian
  uses and a business case where necessary - Applications which involve ‘enabling’ development … However,
  if your proposal exceeds the normal policy limits on extensions in the Green Belt or Open Countryside,
  you will need to set out the ‘very special circumstances’ that you feel support our making an exception
  to policy in your case.'
must-include:
- item: The context and need for the development, and how it accords with national, regional and local
    planning policies
  level: must
- item: Details of consultations with the council and the wider community / statutory consultees before
    submission
  level: must
- item: 'Business case: the contribution the development will make to the local economy'
  level: must
  required-if: discretionary
- item: 'Enabling development or other financial justification: a financial statement with a cost assessment
    breakdown, valuation methodology, completed development value, development costs and developer''s
    profit'
  level: must
  required-if:
    condition:
      field: enabling-development
      value: true
      description: Enabling development or other financial justification.
- item: 'Householder proposals beyond the normal policy limits in the Green Belt or Open Countryside:
    the ''very special circumstances'' relied on'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published March 2022), page 23-24; and its householder validation guidance
  (updated October 2026), page 8. Item 19 (Planning Statement / Business Case). Whether Green Belt development
  is 'inappropriate', and tourism proposals outside development boundaries and large-scale equestrian
  uses, are shown as discretionary. For householders the statement is only needed where the proposal exceeds
  the normal policy limits, which is a judgement.
review-status: unverified
field-status: {}
