reference: transport-assessment
local-authority: SST
required-if:
  any:
  - discretionary
  - condition:
      field: affects-public-right-of-way
      value: true
      description: Likely Public Right of Way implications.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: DfT Guidance on Transport Assessment (Appendix B thresholds)
source-text: All applications likely to generate very significant traffic movements associated with developments
  above the set thresholds All applications likely to have Public Right of Way implications
must-include:
- item: Existing and proposed vehicle movements to and from the site
  level: must
- item: Analysis of how the proposal will affect existing transport conditions
  level: must
- item: Accessibility of the site by all modes of transport, including likely modal shift
  level: must
- item: Measures to improve access by public transport, walking and cycling, to reduce the need for parking
  level: must
- item: Any necessary transport corridor mitigation works
  level: must
- item: 'Works within the Strategic Road Network: a preliminary design to DMRB standards, with a WCHAR
    and Stage 1 Road Safety Audit where relevant'
  level: must
  required-if:
    condition:
      field: affects-trunk-road
      value: true
      description: Works within the Strategic Road Network.
confidence: medium
notes: From the council's list (published March 2022), page 32-34. Item 29. The thresholds are in DfT
  guidance, not the list, so the traffic part is discretionary.
review-status: unverified
field-status: {}
