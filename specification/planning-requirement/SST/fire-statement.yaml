reference: fire-statement
local-authority: SST
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Full applications involving buildings which contain more than 1 dwelling and are 18 metres
  or more in height or contains 7 or more storeys
must-include:
- item: The fire safety design principles, concepts and standards applied to the development
  level: must
confidence: medium
notes: From the council's list (published March 2022), page 16. Item 11. The rule follows the national
  requirement (Article 9A), which also covers educational accommodation.
review-status: unverified
field-status: {}
