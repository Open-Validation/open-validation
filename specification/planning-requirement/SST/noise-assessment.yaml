reference: noise-assessment
local-authority: SST
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Development which could generate noise.
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: New housing or other noise/vibration-sensitive development.
    - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF
source-text: New housing development where there are existing high levels of noise or for development
  which could generate noise. All applications that introduce or expose noise and/or vibration sensitive
  development(s) into areas and locations where noise and/or vibration is likely to have an adverse impact.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (published March 2022), page 38-39. Item 36. Whether existing noise is
  'high' or 'likely to have an adverse impact' is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
