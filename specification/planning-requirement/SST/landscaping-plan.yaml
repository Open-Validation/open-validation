reference: landscaping-plan
local-authority: SST
required-if:
  any:
  - application-type:
      in:
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: South Staffordshire Core Strategy
source-text: All detailed applications (excluding shop fronts, advertisements, changes of use and householder
  applications) … Tree survey and landscaping details
must-include:
- item: 'All relevant information on new planting: proposed species, nursery stock type, size and aftercare'
  level: must
- item: Details of surfacing and edge treatments, retaining and decorative walls, street furniture and
    landscape art
  level: should
  required-if: discretionary
- item: Protection of retained trees and hedgerows throughout construction
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 18; and its householder validation guidance
  (updated October 2026), page 10. Item 12. 'Detailed applications' are shown as full and reserved matters;
  the list's exclusions (shop fronts, changes of use) can't be expressed. The householder checklist lists
  'Tree survey and landscaping details' among local requirements that may be needed, so it shows as discretionary
  for householders.
review-status: unverified
field-status: {}
