reference: town-centre-impact-assessment
local-authority: SST
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main village centre uses not in an existing centre.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up-to-date development plan.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF paragraph 87
source-text: A sequential assessment (Paragraph 87 of the NPPF) is required for main village centre uses
  that are not in an existing centre and are not in accordance with an up to-date development plan.
must-include:
- item: 'Sequential assessment: whether sequentially preferable sites exist and why they are not practical
    (availability, suitability, viability)'
  level: must
- item: 'Impact assessment (where needed): impact on investment in centres, vitality and viability, allocated
    sites, trade and turnover, consumer expenditure capacity, and appropriate scale'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2022), page 41. Item 40 (Village Centre Uses/Retail Impact
  Assessments). The list gives no floorspace threshold for the impact assessment; parameters are set case
  by case.
review-status: unverified
field-status: {}
