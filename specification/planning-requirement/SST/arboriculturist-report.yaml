reference: arboriculturist-report
local-authority: SST
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development within 15m of the centre of any tree with a stem diameter of 75mm or more
        at 1.5m above ground, on or next to the site.
  - site:
      in:
      - tree-preservation-zone
      description: Sites with a Tree Preservation Order.
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: tree-works
        value: true
        description: Proposals affecting trees.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: BS5837:2012
source-text: A tree survey is required for all development within 15m of the centre of any tree that has
  a stem diameter of 75mm or above measured at 1.5m above ground level whether on or adjacent to the application
  site. All sites where there is a Tree Preservation Order or any proposals affecting trees within a Conservation
  … If your proposal might affect or be affected by trees on or near the site the Council will require
  a survey of the tree to be carried out.
must-include:
- item: A tree survey and report to BS5837:2012, prepared by a suitably qualified and experienced arboriculturalist
  level: must
- item: Which trees are retained (including works needed, e.g. crown reduction or raft foundations) and
    which are removed
  level: must
- item: How retained trees will be protected during construction
  level: must
- item: 'Householder: tree positions on a scale plan, with each tree''s species, condition, trunk diameter
    at 1.5m, crown spread and root protection area'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published March 2022), page 35; and its householder validation guidance
  (updated October 2026), page 8-9. Item 31 (Tree Survey/Report/Arboricultural Impact Assessment).
review-status: unverified
field-status: {}
