reference: floor-plan-existing
local-authority: SST
required-if:
  any:
  - condition:
      field: floorspace-change
      value: true
      description: New or amended floor space.
  - condition:
      field: building-works
      value: true
      description: Proposals to alter existing buildings.
  - application-type:
      in:
      - hh
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new or amended floor space and/or proposals to alter existing
  buildings
must-include:
- item: Drawn to an appropriate scale, for example 1:50 or 1:100
  level: must
- item: Corresponds exactly with the existing / proposed block plan drawings
  level: must
- item: Clearly and logically labelled, e.g. room names showing all internal divisions
  level: must
- item: Walls or buildings to be demolished clearly shown
  level: must
- item: Existing building(s) and proposed development differentiated, preferably in colour
  level: should
- item: New buildings shown in context with adjacent buildings (including property numbers)
  level: should
- item: A linear scale bar, with written dimensions of the proposed works
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 13-14; and its householder validation guidance
  (updated October 2026), page 5. Item 8. The householder checklist lists existing and proposed floor
  plans as a national requirement for every householder application.
review-status: unverified
field-status: {}
