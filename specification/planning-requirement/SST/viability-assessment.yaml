reference: viability-assessment
local-authority: SST
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Major development of 10 or more units.
    - any:
      - condition:
          field: planning-obligations-shortfall
          value: true
          description: The applicant cannot provide the full range of S106 requirements on viability grounds.
      - condition:
          field: affordable-housing-below-target
          value: true
          description: Affordable housing below 30% / 40%.
  - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Affordable Housing and Housing Mix SPD; RICS Guide to Planning Viability
source-text: Required for major development of 10 or more units where the applicant is proposing that
  they cannot provide the full range of S106 requirements, which includes affordable housing due to financial
  viability issues. Any application where the viability of the existing/proposed use is relevant. Any
  application proposing the demolition of or substantial harm to a designated or undesignated heritage
  asset.
must-include:
- item: An agreement that the applicant will pay the reasonable costs of an independent appraisal
  level: must
- item: Contents as set out in Appendix C of the RICS Guide to Planning Viability
  level: should
confidence: medium
notes: From the council's list (published March 2022), page 43-44. Item 44 (Viability Statement). Whether
  viability is 'relevant', and substantial harm to a heritage asset, are judgements, so discretionary.
review-status: unverified
field-status: {}
