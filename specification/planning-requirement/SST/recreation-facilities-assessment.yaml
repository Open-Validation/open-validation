reference: recreation-facilities-assessment
local-authority: SST
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: The application involves the loss of open space.
  - condition:
      field: affects-playing-field
      value: true
      description: The application affects playing field land.
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF Section 8; Sport England Playing Fields Policy
source-text: Applications which involve the loss of open space … All applications affecting playing field
  land
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: must
- item: Any independent assessment that the land or buildings are surplus to requirements
  level: should
- item: 'Loss of playing fields: area in hectares of playing field land lost and of any replacement'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Playing fields are lost.
- item: 'Existing site plan: extent of the playing field, existing buildings and sports facilities (including
    pitch layouts), significant features and existing levels'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing field land.
- item: 'Proposed site plan: the development, the playing field area to be lost, all sports facilities
    and any changes to features and levels'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing field land.
- item: 'Supporting statement: extent of playing field lost, reasons for the location and alternatives
    considered, and changes to sports facilities'
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Affects playing field land.
confidence: medium
notes: From the council's list (published March 2022), page 39-40, 46-47. Items 37 (Open Space Assessment)
  and 47 (Applications affecting playing field land). Item 47 lists further statements for applications
  relying on Sport England's exceptions.
review-status: unverified
field-status: {}
