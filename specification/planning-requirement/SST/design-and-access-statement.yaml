reference: design-and-access-statement
local-authority: SST
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: A designated area (conservation area or World Heritage Site, as defined in the DMPO).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - site-of-special-scientific-interest
        - area-of-outstanding-natural-beauty
        - conservation-area
        description: 'Householder: the property is a listed building, or in an SSSI, AONB or conservation
          area.'
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications for major development, as defined in article 2 of the Town and Country Planning
  (Development Management Procedure (England) Order 2015; Applications for development in a designated
  area, where the proposed development consists of: one or more dwellings; or a building or buildings
  with a floor space of 100 square metres or more. Applications for listed building consent. … You do
  not need to submit a design and access statement with a householder application unless your property
  is: a listed building; within a Site of Special Scientific Interest; within an Area of Outstanding Natural
  Beauty within a conservation area.'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development, and how the design takes that context
    into account
  level: must
- item: A response to the principles in the District Design Guide
  level: must
- item: Regard to the relevant Conservation Area Management Plan
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In a conservation area.
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'Listed building consent: how the design principles have taken account of the building''s special
    architectural or historic importance, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published March 2022), page 14-16; and its householder validation guidance
  (updated October 2026), page 6. Item 10. The householder guidance requires a statement for householder
  applications at a listed building or in an SSSI, AONB or conservation area, wider than the national
  rule.
review-status: unverified
field-status: {}
