reference: design-and-access-statement
local-authority: SST
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - site-of-special-scientific-interest
        - area-of-outstanding-natural-beauty
        - conservation-area
        description: The property is a listed building, or within a SSSI, AONB or conservation area.
  - application-type:
      in:
      - lbc
source-url: https://www.sstaffs.gov.uk/sites/default/files/2026-10/Validation%20Guidance%20%28Householder%29%202026%20Update.pdf
source-text: 'You do not need to submit a design and access statement with a householder application unless
  your property is: a listed building; within a Site of Special Scientific Interest; within an Area of
  Outstanding Natural Beauty within a conservation area.'
must-include:
- item: An explanation of the design principles and concepts applied to the proposed works, and how they
    have taken account of the special architectural or historic importance of the building
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: The FULL guidance's own DAS triggers for other applications were not captured.
review-status: unverified
field-status: {}
