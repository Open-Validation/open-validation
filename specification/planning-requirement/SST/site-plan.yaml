reference: site-plan
local-authority: SST
required-if:
  always: true
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Existing and proposed site plan at a scale of 1:500 or 1:200
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site, taken from Staffordshire County Council's
    Definitive Map and Statement (not Ordnance Survey or other mapping data)
  level: must
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: Boundary treatment (existing and proposed) including walls, fencing or hedging
  level: must
- item: A linear scale bar to assist with electronic scaling / measuring
  level: must
confidence: medium
notes: From the council's list (published March 2022), page 12; and its householder validation guidance
  (updated October 2026), page 5. Item 6 (Block/Site Plan). The householder guidance lists the same contents.
review-status: unverified
field-status: {}
