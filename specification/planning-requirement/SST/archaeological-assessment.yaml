reference: archaeological-assessment
local-authority: SST
required-if:
  any:
  - site:
      in:
      - historic-environment-record
      description: The site includes known heritage assets with archaeological interest.
  - discretionary
source-url: https://www.sstaffs.gov.uk/sites/default/files/2023-02/2.%20Validation%20Guidance%20%28FULL%29.pdf
policy: NPPF Section 16
source-text: Where an application site includes, or is considered to have the potential to include, heritage
  assets with archaeological interest, applicants should submit an appropriate desk-based assessment and,
  where desk-based research is insufficient to properly assess the interest, a field evaluation.
must-include:
- item: A desk-based assessment
  level: must
- item: A field evaluation where desk-based research is insufficient to assess the interest
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published March 2022), page 26-27. Part of item 23. Sites 'considered
  to have the potential' for archaeology, and those in historic settlement cores or of a sufficiently
  large scale, are a judgement, so discretionary.
review-status: unverified
field-status: {}
