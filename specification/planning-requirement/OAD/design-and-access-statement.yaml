reference: design-and-access-statement
local-authority: OAD
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: In a designated area (a World Heritage Site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: National Planning Policy Framework and National Planning Practice Guidance
source-text: 'Applications for major development. Applications for development in a designated area, where
  the proposed development consists of: one or more dwellings; or a building or buildings with a floor
  space of 100 square metres or more. Applications for listed building consent.'
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 7. For listed building consent it can
  be combined with the Heritage Statement. The scope should be proportionate to the proposal; the contents
  are the national ones.
review-status: unverified
field-status: {}
