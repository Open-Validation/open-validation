reference: site-plan
local-authority: OAD
required-if:
  always: true
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Oadby and Wigston
  Local Plan and key SPDs
source-text: All application types. … The plans and drawings set out below are required for all development
  proposals. … - Existing and Proposed block plan at 1:100, 1:200 or 1:500 scale, including north arrow.
must-include:
- item: Existing and proposed block plans at 1:100, 1:200 or 1:500 scale
  level: must
- item: North arrow
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: should
- item: Parking arrangements after the development
  level: should
- item: Position and canopy extent of all trees and hedges on site, before and after the development
  level: should
- item: All trees and hedges on or adjacent to the site identified and annotated on the proposed block
    plan
  level: should
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges on or adjacent to the site.
  source-text: All trees and hedges on or adjacent to the proposed development site should be identified
    and appropriately annotated on the Proposed block plan.
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF pages 8, 11. Part of the local 'Additional
  Plans and Drawings' item for 'All application types'. The list's GPDO section says prior approvals and
  other GPDO proposals must contain the information the GPDO asks for. The drawing standards that follow
  the item (critical dimensions, no 'do not scale', page size, scale bar, title, date and plan reference)
  are in the council's submission standards.
