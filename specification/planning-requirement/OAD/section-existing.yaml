reference: section-existing
local-authority: OAD
required-if:
  any:
  - condition:
      field: residential-extension
      value: true
      description: An extension to an existing dwelling.
  - condition:
      field: floorspace-increase-percent
      operator: '>'
      value: 0
      description: An extension to an existing building (for example a commercial unit).
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Oadby and Wigston
  Local Plan and key SPDs
source-text: Applications for extensions to existing buildings, for example dwellings, or commercial units.
  … - Existing and proposed site sections at a scale of 1:50 or 1:100 - Existing and proposed finished
  floor levels (FFL) at a scale of 1:50 or 1:100 - Existing and proposed site levels at a scale of 1:50
  or 1:100.
must-include:
- item: Existing site sections at 1:50 or 1:100
  level: should
- item: Existing finished floor levels at 1:50 or 1:100
  level: should
- item: Existing site levels at 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 9. Local 'Additional Plans and Drawings
  continued' item. The list says the sections, finished floor levels and site levels can be shown on the
  same plan or drawing.
review-status: unverified
field-status: {}
