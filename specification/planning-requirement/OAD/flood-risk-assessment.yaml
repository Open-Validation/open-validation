reference: flood-risk-assessment
local-authority: OAD
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 'Flood zone 1: site of 1 hectare and over.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 'Flood zone 1: site of 1 hectare and over.'
  - site:
      in:
      - critical-drainage-area
      description: Flood zone 1 area with critical drainage problems notified by the Environment Agency.
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: National Planning Policy Framework and National Planning Practice Guidance
source-text: 'Required for: all developments within flood zones 2 and 3; developments on sites of 1 hectare
  and over within flood zone 1; developments in an area within flood zone 1 which has critical drainage
  problems as notified by the Environment Agency.'
must-include:
- item: Risks from all forms of flooding to and from the development, and how they will be managed, taking
    climate change into account
  level: should
- item: Opportunities to reduce the probability and consequence of flooding, including surface water management
    and SuDS
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 13.
review-status: unverified
field-status: {}
