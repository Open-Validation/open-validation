reference: location-plan
local-authority: OAD
required-if:
  always: true
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan All application types.
must-include:
- item: Red line showing the application boundary
  level: must
- item: Blue line around any other land owned by the applicant, close to or adjoining the application
    site
  level: must
- item: North arrow
  level: must
- item: Shows the site as it is on the day of application
  level: must
- item: Where possible, at least two named roads and surrounding buildings
  level: must
- item: Scaled to either 1:1250 or 1:2500
  level: must
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 7.
review-status: unverified
