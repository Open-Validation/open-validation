reference: arboriculturist-report
local-authority: OAD
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Development affecting trees and hedgerows within or adjacent to the application site.
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: National Planning Policy Framework and National Planning Practice Guidance
source-text: Required for all development affecting trees and hedgerows within or adjacent to the application
  site.
must-include:
- item: Undertaken by a suitably qualified arborist
  level: should
- item: All sections of BS5837 addressed for the arboricultural implications and method statements
  level: should
- item: Topographical survey showing current and proposed levels, all trees and all features listed in
    BS5837 section 4.1
  level: should
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Tree protection plan identifying all temporary fencing, ground protection and other physical means
    of protection
  level: should
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 11.
review-status: unverified
field-status: {}
