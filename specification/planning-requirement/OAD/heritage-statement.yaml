reference: heritage-statement
local-authority: OAD
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - scheduled-monument
      - park-and-garden
      description: In or immediately adjacent to a scheduled ancient monument or a registered park and
        garden.
  - site:
      in:
      - conservation-area
      description: Within or adjoining a conservation area.
  - site:
      in:
      - archaeological-priority-area
      description: Affecting any known or suspected archaeological site.
  - all:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - locally-listed-building
        description: Could affect designated or non-designated heritage assets.
    - discretionary
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: National Planning Policy Framework and National Planning Practice Guidance
source-text: All applications for Listed Building Consent. Applications in or immediately adjacent a scheduled
  Ancient Monument or a site on the Register of Parks and Gardens. All development within or adjoining
  a Conservation Area. All applications affecting any known or suspected archaeological sites. Applications
  whose scale or nature could impact on heritage assets(designated and non-designated)
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: should
- item: Analysis of the significance of the asset and its setting, and how this has informed the proposals
  level: should
- item: Method statement on how the works will be carried out without harming the listed building
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Full window audit showing the condition of all existing windows
  level: should
  required-if:
    all:
    - condition:
        field: openings-only
        value: true
        description: Works to windows, including replacements.
    - site:
        in:
        - listed-building
        - conservation-area
        description: A listed building or a site in a conservation area.
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 13. 'Applications whose scale or nature
  could impact on heritage assets' needs a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
