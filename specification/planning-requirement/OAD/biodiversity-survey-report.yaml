reference: biodiversity-survey-report
local-authority: OAD
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major development comprising 10 dwellings or more.
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - priority-habitat
      description: Impacts Biological Heritage Sites, Wildlife Corridors, SSSIs or priority habitats.
  - condition:
      field: geodiversity-interest
      value: true
      description: Impacts Geological Heritage Sites.
  - site:
      in:
      - ecology-consultation-zone
      description: Works within an Ecology consultation zone.
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Barn conversions.
  - condition:
      field: demolition
      value: true
      description: Demolition.
  - condition:
      field: potential-roost-features
      value: true
      description: Works impacting roof spaces.
  - condition:
      field: tree-removal
      value: true
      description: Removal of trees.
  - condition:
      field: hedgerows-affected
      value: true
      description: Removal of hedgerows.
  - condition:
      field: protected-species
      value: true
      description: Impacts priority species (for example bats, owls and newts).
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: National Planning Policy Framework and National Planning Practice Guidance
source-text: 'Required for all major development proposals (comprising 10 dwellings or more) and developments
  which impact upon: Biological Heritage Sites; Geological Heritage Sites; Wildlife Corridors; Sites of
  Special Scientific Interest; priority habitats (such as barn conversions; demolition; works impacting
  roof spaces; removal of trees and hedgerows; and works within an Ecology consultation zone), and priority
  species (for example, bats, owls and newts).'
must-include:
- item: Undertaken and prepared by competent persons with suitable qualifications and experience
  level: should
- item: Carried out at an appropriate time and month of year, in suitable weather and using nationally
    recognised survey guidelines/methods where available
  level: must
- item: Surveys not more than 24 months old
  level: must
- item: Scope and detail proportionate to the proposal and its potential impact on priority species and
    habitats
  level: should
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 12.
review-status: unverified
field-status: {}
