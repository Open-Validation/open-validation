reference: floor-plan-proposed
local-authority: OAD
required-if:
  always: true
source-url: https://www.oadby-wigston.gov.uk/files/documents/local_validation_checklist_august_2026/Local%20Validation%20Checklist%20August%202026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Oadby and Wigston
  Local Plan and key SPDs
source-text: All application types. … The plans and drawings set out below are required for all development
  proposals. … - Existing and proposed floor plans at 1:50 or 1:100 scale. Plans should clearly illustrate
  the buildings current floor plan and the floor plan post development.
must-include:
- item: At 1:50 or 1:100 scale
  level: must
- item: The floor plan after the development
  level: should
confidence: medium
notes: From the council's list (in effect 5 August 2026), PDF page 8. Part of the local 'Additional Plans
  and Drawings' item for 'All application types'. The list's GPDO section says prior approvals and other
  GPDO proposals must contain the information the GPDO asks for. The drawing standards that follow the
  item (critical dimensions, no 'do not scale', page size, scale bar, title, date and plan reference)
  are in the council's submission standards.
