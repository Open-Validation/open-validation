reference: noise-assessment
local-authority: BAI
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal is residential.
    - condition:
        field: noise-sensitive-use
        value: true
        description: The housing would be affected by road, rail or industrial noise.
  - condition:
      field: noise-generating-use
      value: true
      description: B2/B8 or late-night A3-A5 uses next to homes.
source-url: https://www.basildon.gov.uk/media/7449/Local-List-of-Validation-Requirements-for-Planning-Applications-July-2019/pdf/Basildon_Council_-_Local_List_of_Validation_Requirements_for_Planning_Applications_-_July_2019.pdf?m=637001811042370000
confidence: medium
notes: 'From the audit (missing_requirement): major residential affected by road, rail or industrial noise;
  B2/B8 or late-night A3-A5 uses next to homes.'
review-status: unverified
