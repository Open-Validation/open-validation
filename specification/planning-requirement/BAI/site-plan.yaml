notes: Rows from Discharge of conditions were dropped after the audit. The council's Block Plan applies
  to all applications except non-material amendments, discharge of condition applications and outline
  applications where siting is a reserved matter; the rules can't express those exceptions. The audit
  (wrong_app_type) notes this is a national drawing requirement restated in the local list.
