source-text: Bar required Block Plan All Scale 1:200 or 1:500 showing the direction of north and the development
  in relation to site boundaries and other existing buildings on the sites. (except applications for NonMaterial
  Amendments and discharge of condition applications and outline applications, where siting is a reserved
  matter) Scale Bar required.
