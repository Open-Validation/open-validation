reference: flood-risk-assessment
local-authority: BAI
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: A Flood Zone 1 site over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: A Flood Zone 1 site over 1 hectare.
source-url: https://www.basildon.gov.uk/media/7449/Local-List-of-Validation-Requirements-for-Planning-Applications-July-2019/pdf/Basildon_Council_-_Local_List_of_Validation_Requirements_for_Planning_Applications_-_July_2019.pdf?m=637001811042370000
source-text: Flood Zone 2 or 3; or Flood Zone 1 sites over 1 ha
must-include:
- item: The design of surface water management systems, including Sustainable Drainage (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the FRA''s content, not its trigger. The must-include
  items are the council''s wording (''The FRA should include ...'').'
