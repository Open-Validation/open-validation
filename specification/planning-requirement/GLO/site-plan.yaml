reference: site-plan
local-authority: GLO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - ldc
      - prior-approval
      - demolition-con-area
      - pip
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
        - approval-condition
    - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended); NPPF paragraphs 109-114; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy
  (JCS) policy SD4; Gloucester City Plan (GCP) policy G1
source-text: All applications. There may be exceptions for applications seeking variation of a condition
  (section 73 application)/discharge of condition and non-material amendment depending on nature of the
  change.
must-include:
- item: At a scale of 1:200 or 1:500, up to date, with the direction of North and a scale bar
  level: must
- item: 'Existing: the footprint of all existing buildings with written dimensions and distances to the
    site boundaries'
  level: must
- item: 'Proposed: the footprint of the proposed development and all buildings to be retained, with written
    dimensions (householder: height, width and depth) and distances to the site boundaries'
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all proposed trees and those to be retained on the site and on adjacent land
  level: must
- item: The extent and type of any hard surfacing, and boundary treatment including the type and height
    of walls or fencing
  level: must
- item: Parking arrangements, including dimensions of the spaces, secure cycle parking (location and size)
    and pedestrian access, with justification for any spaces smaller than GCP Policy G1 sizes
  level: must
  required-if:
    any:
    - condition:
        field: parking-change
        value: true
        description: A loss or gain in parking provision on site, or an increase in parking demand.
    - condition:
        field: new-vehicle-access
        value: true
        description: A change to vehicular/pedestrian access.
  source-text: 'All applications likely to result in either of the following should show parking arrangements:
    -a loss or gain in parking provision on site; -an increase in parking demand; -a change to vehicular
    /pedestrian access.'
- item: 'Householder: any trees or hedges affected shown on the existing plan, and any new boundary walls
    or fencing'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (June 2026), page 21, item 41. The householder items are from appendix
  1 (page 28). Section 73, discharge of condition and non-material amendment applications may be exceptions
  'depending on nature of the change', so they show as discretionary.
review-status: unverified
field-status: {}
