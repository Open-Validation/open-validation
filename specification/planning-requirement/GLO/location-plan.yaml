reference: location-plan
local-authority: GLO
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc
    - prior-approval
    - demolition-con-area
    - pip
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended)
source-text: All applications except variation of a condition (section 73 application)/discharge of condition
  and a non- material amendment.
must-include:
- item: Based on an up-to-date Ordnance Survey based map
  level: should
- item: At a scale of typically 1:1250 or 1:2500, scaled to fit onto A4 or A3 where possible
  level: should
- item: Sufficient roads (usually 2 road names) and/or buildings on adjoining land to make the exact location
    clear
  level: should
- item: The direction of North and a scale bar
  level: must
- item: The application site edged clearly with a red line, including all land necessary to carry out
    the development (e.g. access from a public highway, visibility splays, landscaping, car parking and
    open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (June 2026), page 7, item A8. Shown for the main application types; the
  list excludes section 73, discharge of condition and non-material amendment applications.
review-status: unverified
field-status: {}
