reference: environmental-statement
local-authority: GLO
required-if:
  condition:
    field: eia-development
    value: true
    description: 'EIA development: Schedule 1, or Schedule 2 development likely to have significant effects
      on the environment.'
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'Schedule 1 Development: An Environmental Impact Assessment (EIA) is mandatory in every case.
  Schedule 2 Development: An EIA is required if the project is listed in the first column of Schedule
  2 and exceeds the relevant thresholds or criteria in the second column (or is in a sensitive area),
  and is likely to have significant effects on the environment. In these cases, the project must be screened
  by the local planning authority against the criteria in Schedule 3 to determine if an EIA is necessary.'
must-include:
- item: 'A description of the proposed development: site, design, size and other relevant features'
  level: must
- item: A description of the likely significant effects of the proposed development on the environment
  level: must
- item: A description of features or measures to avoid, prevent, reduce and if possible offset likely
    significant adverse effects
  level: must
- item: A description of the reasonable alternatives studied and the main reasons for the option chosen
  level: must
- item: A non-technical summary
  level: must
- item: A statement from the developer outlining the relevant expertise or qualifications of the competent
    experts who prepared it
  level: must
confidence: medium
notes: From the council's list (June 2026), page 5-6, item A5.
review-status: unverified
field-status: {}
