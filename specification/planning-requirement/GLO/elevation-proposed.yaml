reference: elevation-proposed
local-authority: GLO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: external-alterations
          value: true
          description: Extensions or alterations to the exterior of an existing building.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent including new architectural features (e.g. new windows, doors,
          mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended); Gloucester City Plan (GCP) policies F7 and D1
source-text: All applications proposing new buildings, extensions or alterations to the exterior of an
  existing building. ... Application for advertisement consent ... Applications for listed building consent
  that include new architectural features e.g. new windows, doors, mouldings, glazing bars, shopfronts,
  signs, panelling, staircases, fireplaces, railings etc
must-include:
- item: The building shown in full, with all existing and proposed elevations affected labelled
  level: must
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: must
- item: 'At 1:50 or 1:100 with written dimensions of the overall size of any new buildings or extensions
    (householder: height, width and depth), and a scale bar'
  level: must
- item: 'Advertisements: drawings at a suitable scale showing advertisement size, siting, materials and
    colours, height above ground, extent of projection, and the method and colour(s) of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Listed building consent: detailed elevational drawings of the new features at a minimum scale
    of 1:20'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent including new architectural features (e.g. new windows, doors,
          mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
confidence: medium
notes: From the council's list (June 2026), page 20-21, item 39, 42 and 33 (page 19).
review-status: unverified
field-status: {}
