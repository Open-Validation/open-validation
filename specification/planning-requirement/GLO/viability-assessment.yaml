reference: viability-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: S106 planning obligations are not proposed to be met in full.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF 56-59; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD11, SD12,
  INF6 and INF7; Gloucester City Plan (GCP) policy G7
source-text: Any application where s106 planning ... obligations are not proposed to be met in full, including
  the policy requirement for affordable housing provision and other infrastructure including contributions
  towards highways, education, libraries, open space, ecology/biodiversity etc.
must-include:
- item: A full, un-redacted viability assessment (published like other application documents)
  level: must
- item: 'Where exceptional circumstances are claimed for specific information: a full justification of
    the ''adverse effect'' and harm to the public interest of disclosure'
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: Confidentiality is claimed for specific information.
- item: Follows the government's recommended approach in the PPG on viability
  level: should
- item: A written commitment to pay the council's reasonable costs of independent appraisal
  level: must
confidence: medium
notes: From the council's list (June 2026), page 26-27, item 62.
review-status: unverified
field-status: {}
