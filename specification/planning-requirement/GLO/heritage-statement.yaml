reference: heritage-statement
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - battlefield
        description: 'Designated heritage assets are affected: scheduled monuments, listed buildings,
          buildings in conservation areas, registered parks and gardens, registered battlefields.'
    - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4 and SD8
source-text: 'Required for planning applications where heritage assets are affected. Heritage assets include:
  - Designated assets: Scheduled Monuments, Listed Buildings, Buildings in Conservation Areas; Registered
  Parks and Gardens; Registered Battlefields. - Undesignated assets: unlisted historic buildings and structures;
  undesignated archaeological sites. - Heritage assets that are identified during the preparation of development
  proposals e.g. through desk-based assessment or field evaluation.'
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
- item: Demonstrates that the historic character and distinctiveness of the locality has been assessed
    and taken into account
  level: must
- item: Evidence that the Historic Environment Record has been consulted, as a minimum
  level: must
confidence: medium
notes: From the council's list (June 2026), page 17, item 26. Undesignated assets (unlisted historic buildings
  and structures, undesignated archaeological sites, and assets found while preparing proposals) have
  no mapped designation, so they show as discretionary. The list calls it the Historic Impact Statement
  (and Historic Environment Statement). Part B items 'will not necessarily be required in every case';
  the list gives no application types for most of them, so they are shown for householder, full, outline
  and reserved matters applications unless the item says otherwise.
review-status: unverified
field-status: {}
