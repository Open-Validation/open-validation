reference: landscaping-plan
local-authority: GLO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: Minor development.
    - condition:
        field: landscaping-works
        value: true
        description: Landscaping is to be considered.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - air-quality-management-area
        description: Within an air quality management area (AQMA).
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4, SD6 and INF3; Gloucester
  City Plan (GCP) policy F2; Gloucester City Plan (GCP) policy C5 (AQMAs)
source-text: Major and Minor developments where landscaping is to be considered. ... All applications
  within an AQMA will require an existing and proposed planting plan.
must-include:
- item: The retention of existing natural features
  level: must
- item: Hard and soft landscaping
  level: must
- item: Boundary treatments
  level: must
- item: Planting density and spacing, plant size at time of planting, and species
  level: must
- item: Areas of root cells for planting and beds within hard landscaping
  level: must
- item: Underground services potentially impacted by tree planting
  level: must
- item: A plan indicating spaces proposed for adoption, with maintenance and adoption arrangements
  level: must
- item: 'In an AQMA: existing and replacement shrubs, hedging and/or tree planting, with location, species,
    size and canopy volume'
  level: must
  required-if:
    site:
      in:
      - air-quality-management-area
      description: Within an air quality management area (AQMA).
- item: 'In an AQMA: the new canopy volume compared with the canopy volume lost (CAVAT value)'
  level: must
  required-if:
    site:
      in:
      - air-quality-management-area
      description: Within an air quality management area (AQMA).
confidence: medium
notes: From the council's list (June 2026), page 18, item 30. The AQMA planting plan is from item 7 (Air
  Quality Assessment), page 10.
review-status: unverified
field-status: {}
