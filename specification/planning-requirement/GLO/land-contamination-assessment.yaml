reference: land-contamination-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - contaminated-land
      description: Risks from land contamination may be reasonably suspected.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14
source-text: Required for applications on any sites where risks from land contamination may be reasonably
  suspected.
must-include:
- item: In the first instance a Preliminary Risk Assessment (Phase 1 Desk Study and Site Walkover)
  level: should
- item: Any unacceptable risks from contamination identified, with proposals to deal with them
  level: should
- item: Carried out in accordance with the Environment Agency's Land Contamination Risk Management (LCRM)
    and established industry guidance
  level: must
- item: Carried out by competent persons with relevant experience and qualifications
  level: must
confidence: medium
notes: From the council's list (June 2026), page 18, item 29. Part B items 'will not necessarily be required
  in every case'; the list gives no application types for most of them, so they are shown for householder,
  full, outline and reserved matters applications unless the item says otherwise.
review-status: unverified
field-status: {}
