reference: sustainable-drainage-strategy
local-authority: GLO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: impermeable-area-increase
        operator: '>='
        value: 50
        description: A householder development increasing impermeable area (additional building footprint
          and hard surfacing) by 50 sq m or more.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4, SD14, INF2, INF3,
  INF6 and INF7; Gloucester City Plan (GCP) policy E4
source-text: Required for any application that has surface water implications, including any householder
  development resulting in an increase in impermeable area of 50 m2 or more.
must-include:
- item: A completed Flood Risk & Drainage Validation Checklist
  level: must
- item: Demonstrates that suitable consideration has been given to surface water drainage
  level: must
- item: Demonstrates that arrangements for attenuating surface water run-off as close as possible to its
    source can be accommodated within the site
  level: must
- item: Demonstrates that issues of ownership and maintenance are addressed
  level: must
- item: 'Householder (50 sq m or more): an outline drainage layout plan showing new roof/driveway/paving
    areas with sizes in m2 and the proposed drainage layout (flow control, attenuation/storage, soakaways)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: impermeable-area-increase
        operator: '>='
        value: 50
        description: A householder development increasing impermeable area (additional building footprint
          and hard surfacing) by 50 sq m or more.
- item: 'Where soakaways are proposed: BRE 365 infiltration test results and soakaway sizing calculations'
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: Soakaways are proposed.
- item: 'Major/minor: a plan of the condition, location, capacity and ownership of existing drainage infrastructure,
    natural flow paths and existing and future flood risk'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: 'Major/minor: surface water design aligned with the SuDS hierarchy, not connected to the public
    foul sewer, and discharge limited to greenfield rates (Qbar) based on the positively drained area'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: 'Major/minor: a plan showing proposed and existing ground levels, and details of any permissions
    or legal agreements for discharge (Severn Trent Water, private sewers)'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: 'Where hydraulic modelling is used: the council''s parameters (40% climate change for the 100-year
    and 37% for the 30-year design, 10% urban creep, Cv 1, PIMP 100%, durations 15-10800 min) and a contributing
    area plan'
  level: must
  required-if:
    condition:
      field: hydraulic-modelling
      value: true
      description: Hydraulic modelling is used.
- item: 'Major/minor: infiltration testing to BRE365 (with test locations plan, trial pit photographs
    and readings, percolation rate and groundwater evidence) supporting the inclusion or exclusion of
    infiltration'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: 'Where SuDS basins are proposed: sections through the basins'
  level: must
  required-if:
    condition:
      field: suds-basins
      value: true
      description: SuDS basins are proposed.
- item: 'Major/minor: surface water runoff quality meeting CIRIA SuDS Manual (C753)'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Any areas of the site within 8 m of a watercourse (including culverted watercourses) identified
  level: must
- item: 'Major/minor: any ground level raising identified on plans and sections'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (June 2026), page 13, item 19. Detailed items come from the Flood Risk
  & Drainage Validation Checklist (appendix 3), pages 30-33. 'Surface water implications' for other development
  is not defined, so that part is discretionary. Part B items 'will not necessarily be required in every
  case'; the list gives no application types for most of them, so they are shown for householder, full,
  outline and reserved matters applications unless the item says otherwise.
review-status: unverified
field-status: {}
