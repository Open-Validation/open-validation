reference: recreation-facilities-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss or partial loss of existing open space.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy INF4; Gloucester City Plan
  (GCP) policy C3
source-text: Applications which involve loss or partial loss of existing open space.
must-include:
- item: The amount, quality and type of open space that would be lost, and the quantitative and qualitative
    impact on overall supply in the local area
  level: should
- item: Evidence of how the proposal accords with GCP Policy C3, including engagement with relevant local
    community groups and partner organisations
  level: must
- item: Why the facility is no longer required and, as appropriate, how, when and where suitable local
    replacement facilities will be provided
  level: must
confidence: medium
notes: From the council's list (June 2026), page 20, item 38.
review-status: unverified
field-status: {}
