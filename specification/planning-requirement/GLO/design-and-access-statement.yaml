reference: design-and-access-statement
local-authority: GLO
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 2, Article 9, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended); Planning (Listed Buildings and Conservation Areas) Regulations 1990; NPPF paragraphs
  137-139, 167; Gloucester City Plan (GCP) policy C1
source-text: 'Required in the following circumstances: Applications for major development. Applications
  for development in a conservation area, where the proposed development consists of: - one or more dwellings;
  or - a building or buildings with a floor space of 100 square metres or more. Applications for listed
  building consent.'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Demonstrates the steps taken to appraise the context and how the design takes that context into
    account
  level: must
- item: 'For listed building consent: how the design principles have taken account of the special architectural
    or historic importance of the building, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For major development: a section addressing how GCP Policy C1 and ''Building for a Healthy Life''
    have been addressed'
  level: must
  required-if:
    ref: major-development
  source-text: Within the Design and Access Statement a section addressing how Policy C1 and ‘Building
    for a Healthy Life’ has been addressed.
confidence: medium
notes: From the council's list (June 2026), page 7, item A7. The major-development item is local item
  2 (Active Design and Accessibility), page 8.
review-status: unverified
field-status: {}
