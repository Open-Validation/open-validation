reference: waste-management-plan
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings (bin storage).
    - discretionary
    - ref: major-development
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD3, SD4 and SD14;
  Gloucester City Plan (GCP) policy A1; Gloucestershire Waste Core Strategy policy WCS2; Waste Minimisation
  in Development Projects SPD
source-text: All proposals involving development that would require bin storage, including all new dwellings.
  ... Major development
must-include:
- item: Bin storage and collection points shown clearly on drawings at 1:100, 1:200 or 1:500; can be on
    the block plan, but a separate plan for major schemes
  level: must
- item: A statement confirming compliance with the Gloucester City Council Waste and Recycling Guidance
    for New Residential Development
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
- item: 'Waste minimisation statement: how waste from demolition, construction and occupation will be
    minimised and sustainably managed'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (June 2026), page 10, item 9. Combines item 9 (Bin Store) and item 63 (Waste
  Minimisation Statement, major development, page 27). Other development 'that would require bin storage'
  is not defined, so it shows as discretionary.
review-status: unverified
field-status: {}
