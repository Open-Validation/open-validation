reference: fire-statement
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The relevant building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The relevant building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 9A, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended)
source-text: Full applications proposing the provision of one or more ‘relevant buildings’, or proposing
  the demolition of an existing relevant building, or proposing development within the curtilage of a
  relevant building, where the relevant building(s) in question are 18 metres or more in height or contain
  7 or more storeys. Relevant building must satisfy the above height criteria and contain either two or
  more dwellings or educational accommodation.
must-include:
- item: On the form published by the Secretary of State (or a form substantially to the same effect)
  level: must
- item: The particulars specified or referred to in the form
  level: must
confidence: medium
notes: From the council's list (June 2026), page 6, item A6. Also covers demolition of, or development
  within the curtilage of, a relevant building; the list's exemptions for some changes of use apply.
review-status: unverified
field-status: {}
