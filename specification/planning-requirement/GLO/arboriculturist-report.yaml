reference: arboriculturist-report
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: Affects trees covered by a tree preservation order.
    - all:
      - site:
          in:
          - conservation-area
          description: Within a conservation area.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within or adjacent to the site are affected.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges within or bounding the site, with a stem diameter over 75 mm at 1.5
          m above ground level, are affected.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Gloucester City Plan (GCP) policy E7
source-text: Proposals affecting trees covered by a tree preservation order. Proposals within a Conservation
  Area, and trees within or adjacent the site are affected by the Application. All sites with trees and
  hedges growing within or bounding them, with a stem diameter greater than 75mm when measured at 1.5m
  above ground level, where the proposals affect the trees/hedges.
must-include:
- item: A tree survey by a competent arboriculturist following BS5837:2012
  level: should
- item: A tree works method statement
  level: must
- item: A Tree Protection Plan
  level: must
- item: Depending on the size and scale of the proposals, an Arboricultural Impact Assessment with a plan
    of trees for retention and removal, an evaluation of the impact of tree losses and any specialist
    issues for a method statement
  level: must
  required-if: discretionary
- item: 'Where trees are removed: replacement planting (location, species, size and canopy volume) and
    the new canopy volume compared with the previous (CAVAT value)'
  level: must
  required-if:
    condition:
      field: loss-of-habitat-features
      value: true
      description: Trees are to be removed.
- item: 'Householder: where development is within two metres of the canopy spread of any tree within or
    adjoining the site, the position and spread of the tree(s) on the application plans'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (June 2026), page 26, item 60. The householder item is from appendix 1,
  page 29. 'An Arboricultural Impact Assessment may be required' depending on size and scale, so that
  item is discretionary.
review-status: unverified
field-status: {}
