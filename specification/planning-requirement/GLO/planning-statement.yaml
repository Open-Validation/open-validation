reference: planning-statement
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: A departure from, or contrary to, the development plan.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF
source-text: All major applications. Proposals seeking a departure from or being contrary to the development
  plan.
must-include:
- item: The context and need for the development and the principles and justification for it
  level: must
- item: An assessment of how the development accords with national and local planning policies and supplementary
    planning documents
  level: must
- item: 'Regeneration benefits: new jobs created or supported, floor space totals for each use (where
    known), community benefits, pre-application advice, and any regeneration strategies'
  level: should
confidence: medium
notes: From the council's list (June 2026), page 23, item 47.
review-status: unverified
field-status: {}
