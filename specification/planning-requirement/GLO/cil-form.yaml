reference: cil-form
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - ldc
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more dwellings.
  - condition:
      field: dwelling-count
      operator: <=
      value: 449
      description: No more than 449 dwellings.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Gloucester CIL (implemented 1 January 2019); CIL Regulations 2010
source-text: Applications for full planning permission/lawful development certificates for 11 to 449 dwellings.
  Applications for reserved matters for new dwellings following an outline planning permission for 11
  ... to 449 dwellings granted on or after 1 January 2019.
must-include:
- item: The CIL Additional Information Requirement Form
  level: must
confidence: medium
notes: From the council's list (June 2026), page 11-12, item 14. Reserved matters only where the outline
  permission was granted on or after 1 January 2019.
review-status: unverified
field-status: {}
