reference: biodiversity-survey-report
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - local-wildlife-site
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - priority-habitat
        description: An important wildlife site or habitat could be affected.
    - condition:
        field: protected-species
        value: true
        description: A protected species could be affected.
    - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Gloucester City Plan (GCP) policies A1, E1, E2 and E3
source-text: Required where an important wildlife site, habitat, natural feature or species could be affected
  by the proposal.
must-include:
- item: The current habitat and how it will be impacted, including the effect on any protected species
  level: should
- item: A Habitats Regulations Assessment where the application may be connected to or impact a European/internationally
    designated site (Ramsar, SAC or SPA, including candidate sites)
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      description: May be connected to or impact a European/internationally designated site.
- item: A summary of all recent surveys required and confirmation that they were undertaken before the
    application at appropriate times of year for the affected species
  level: must
- item: Surveys under 12 months old; 12-18 months old only if site conditions have not changed; surveys
    over 18 months old will not be validated
  level: must
confidence: medium
notes: From the council's list (June 2026), page 11, item 11. Which sites, habitats, natural features
  or species are 'important' is not defined, so the trigger is partly discretionary. Part B items 'will
  not necessarily be required in every case'; the list gives no application types for most of them, so
  they are shown for householder, full, outline and reserved matters applications unless the item says
  otherwise.
review-status: unverified
field-status: {}
