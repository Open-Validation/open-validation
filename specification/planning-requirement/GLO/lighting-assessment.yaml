reference: lighting-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF 198; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD14 and SD4;
  Gloucester City Plan (GCP) policy A1
source-text: Development where external lighting is proposed or where the proposal involves areas of public
  access.
must-include:
- item: Light spillage, hours of illumination, light levels, column heights, specification and colour
  level: must
- item: Treatment for lamps and luminaires, the need for full horizontal cut off, and no distraction to
    the highway
  level: must
- item: Levels of impact on nearby dwellings
  level: must
- item: Use of demountable columns, retention of screening vegetation, and planting and bunding to contain
    lighting effects
  level: must
- item: Details of lighting covers or cowling and any other mitigation
  level: must
- item: Effects on visual amenity, local character and distinctiveness, neighbouring amenity, heritage
    assets if present and nature conservation, and how they will be mitigated
  level: should
confidence: medium
notes: From the council's list (June 2026), page 19, item 32. 'Areas of public access' has no data field,
  so that part is shown as discretionary. Part B items 'will not necessarily be required in every case';
  the list gives no application types for most of them, so they are shown for householder, full, outline
  and reserved matters applications unless the item says otherwise.
review-status: unverified
field-status: {}
