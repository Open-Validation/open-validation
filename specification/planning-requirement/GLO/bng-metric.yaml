reference: bng-metric
local-authority: GLO
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Schedule 7A of the Town and Country Planning Act 1990 (as inserted by Schedule 14 of the Environment
  Act 2021)
source-text: All planning applications. (Householder applications are exempt.)
must-include:
- item: The completed Statutory Biodiversity Metric in Excel format, showing the pre-development biodiversity
    value of the onsite habitat on the date of application (or an earlier agreed date)
  level: must
- item: The specific pre-development biodiversity value(s) derived from the metric calculation
  level: must
- item: Completed statutory condition assessment sheets for all habitats recorded in the baseline metric
  level: must
- item: 'Where onsite habitat has been degraded since 30 January 2020 (other than under a planning permission):
    a statement to that effect and the pre-degradation value'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded since 30 January 2020.
- item: 'If the 10% gain cannot be achieved on-site: details of the proposed off-site location or proof
    of intention to purchase biodiversity credits'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: The 10% gain cannot be achieved on-site.
confidence: medium
notes: From the council's list (June 2026), page 5, item A4. The list says 'All planning applications.
  (Householder applications are exempt.)'; by law householder and other exempt applications are outside
  BNG, so the rule is the biodiversity gain condition. The BNG statement, biodiversity assessment report
  and draft HMMP are in the unmapped list.
review-status: unverified
field-status: {}
