reference: section-proposed
local-authority: GLO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change in ground levels, or development next to changing ground levels.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent including new architectural features (e.g. new windows, doors,
          mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended); Gloucester City Plan (GCP) policy D1
source-text: Required for all applications which involve a change in ground levels or where development
  is proposed next to changing ground levels. ... Applications for listed building consent that include
  new architectural features e.g. new windows, doors, mouldings, glazing bars, shopfronts, signs, panelling,
  staircases, fireplaces, railings etc
must-include:
- item: Existing and proposed finished ground levels, related to a fixed datum point
  level: must
- item: Floor levels, building height and the relationship to site boundaries and neighbouring development
  level: must
- item: On sloping sites, how the proposals relate to existing ground levels
  level: must
- item: At 1:50 or 1:100 with written dimensions and a scale bar
  level: must
- item: 'Listed building consent: sections of the new features at a minimum scale of 1:5'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: new-architectural-features
        description: Listed building consent including new architectural features (e.g. new windows, doors,
          mouldings, glazing bars, shopfronts, signs, panelling, staircases, fireplaces, railings).
confidence: medium
notes: From the council's list (June 2026), page 22, item 44. Listed building detail sections are item
  33, page 19.
review-status: unverified
field-status: {}
