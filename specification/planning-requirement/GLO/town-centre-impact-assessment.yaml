reference: town-centre-impact-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside the city or local centre.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF paragraphs 90-95
source-text: All retail and leisure developments greater than 2500 square metres located outside of city
  centre. ... Any application for ‘Main Town Centre Uses’ outside the city or local centre.
must-include:
- item: 'Sequential test: catchment definition (drive and walk time isochrones and a catchment map) and
    the centres within the catchment'
  level: should
- item: 'Sequential test: sequential preference and alternatives (Primary Shopping Area, city centre,
    edge of centre, out of centre, local centres), reviewing existing or soon-to-be available units'
  level: should
- item: 'Sequential test: suitability, availability and viability assessment, a flexibility statement,
    a comparison table of sites and a conclusion'
  level: should
- item: 'Impact: evidence the proposal does not negatively impact the vitality or viability of the city
    centre'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development greater than 2,500 sq m outside the city centre.
- item: 'Impact: on existing, committed and planned public and private investment in centres in the catchment'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development greater than 2,500 sq m outside the city centre.
- item: 'Impact: on town centre vitality and viability including consumer choice, on allocated sites outside
    the town centre, and on trade/turnover in centre and the wider area'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development greater than 2,500 sq m outside the city centre.
- item: 'Impact: whether of appropriate scale if in or on the edge of the town centre, and any locally
    important impacts on centres'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development greater than 2,500 sq m outside the city centre.
- item: Evidence the development does not result in an over-concentration of uses in a centre or area
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure development greater than 2,500 sq m outside the city centre.
confidence: medium
notes: From the council's list (June 2026), page 24, item 51 and 52. Combines the Retail or Leisure Development
  Impact Test Assessment and the Retail and Main Town Centre Sequential Test. The sequential test 'may
  include' its listed contents, so they are 'should'.
review-status: unverified
field-status: {}
