reference: elevation-existing
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: external-alterations
        value: true
        description: Extensions or alterations to the exterior of an existing building.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended)
source-text: All applications proposing new buildings, extensions or alterations to the exterior of an
  existing building.
must-include:
- item: The building shown in full, with all existing and proposed elevations affected labelled
  level: must
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: must
- item: 'At 1:50 or 1:100 with written dimensions of the overall size of any new buildings or extensions
    (householder: height, width and depth), and a scale bar'
  level: must
confidence: medium
notes: From the council's list (June 2026), page 21, item 42. Existing elevations only where there is
  an existing building.
review-status: unverified
field-status: {}
