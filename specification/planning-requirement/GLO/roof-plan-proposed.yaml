reference: roof-plan-proposed
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - condition:
      field: roof-alteration
      value: true
      description: A roof would be created or altered.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended)
source-text: Required where a roof would be created or altered by the proposed development.
must-include:
- item: The shape of the roof, the roofing materials, and features such as chimneys, windows, roof lights
    and flues
  level: must
- item: At 1:50, 1:100 or 1:200 with a scale bar and the direction of North; a simple roof plan can be
    combined with the proposed block plan
  level: must
confidence: medium
notes: From the council's list (June 2026), page 22, item 45.
review-status: unverified
field-status: {}
