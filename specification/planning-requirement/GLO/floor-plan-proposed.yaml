reference: floor-plan-proposed
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - condition:
      field: building-works
      value: true
      description: New or amended floor space, or alterations to existing buildings.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: Part 3, Article 7, Town and Country Planning (Development Management Procedure) (England) Order
  2015 (as amended)
source-text: All applications proposing new or amended floor space and/or proposals to alter existing
  buildings.
must-include:
- item: Where existing buildings or walls are to be demolished (if applicable)
  level: must
- item: Details of the existing building(s) as well as the proposed development
  level: must
- item: At 1:50 or 1:100 with written dimensions of the overall size of any new buildings or extensions,
    and a scale bar
  level: must
confidence: medium
notes: From the council's list (June 2026), page 21, item 43.
review-status: unverified
field-status: {}
