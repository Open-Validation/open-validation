submission-standards:
- item: A scale bar on all drawings; plans marked 'not to scale' or 'do not scale' will not be registered
  level: must
- item: All drawings to a recognised metric scale
  level: must
- item: Location plans and block plans include a north arrow
  level: must
- item: Key dimensions annotated on the relevant plans and drawings (for householder applications, the
    external width, height and depth of the proposed works)
  level: should
- item: Hand drawn plans are unlikely to be acceptable unless produced by a technician or professional
    plan drawer
  level: should
- item: Assessments (heritage statements, flood risk assessments, drainage strategies and others) are
    not placeholders but significant enough in content for full assessment without further information
  level: must
- item: Postal applications include a list of the plans and documents submitted
  level: must
