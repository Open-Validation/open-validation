source-text: All applications for planning permission and associated consents.
must-include:
- item: All sections of the relevant application form completed
  level: must
- item: The correct signed ownership certificate (A, B, C or D) and agricultural land declaration; for
    listed building consent an ownership certificate but no agricultural declaration
  level: must
- item: 'For certificates C and D: a copy of the notice published in the local press'
  level: must
  source-text: The applicant must send a copy of the published notice with their application forms.
