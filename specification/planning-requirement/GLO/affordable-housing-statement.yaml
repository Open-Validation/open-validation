reference: affordable-housing-statement
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: Proposals for 11 or more dwellings.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: Sites with a maximum combined floorspace greater than 1000 sq m.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site area of 0.5 hectares or more.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD11 and SD12
source-text: Proposals for 11 or more dwellings, sites with a maximum combined floorspace greater than
  1000 square metres or site area of 0.5 hectares or more.
must-include:
- item: Details preferably in an excel/csv file format
  level: should
- item: The total number of residential units
  level: must
- item: The mix of residential units, including number, type, size, and number of bedrooms and bedspaces
  level: must
- item: The tenure of all affordable units, with any different levels or types of affordability or tenure
    clearly and fully explained
  level: must
- item: Floorplans for each house type
  level: must
- item: How the proposal addresses JCS Policy SD12, with draft heads of terms for the affordable housing
    to be secured by a S106 agreement
  level: must
- item: Details of the Registered Provider appointed to deliver and/or manage the affordable housing
  level: must
- item: Details of engagement with a Housing Association/Registered Provider on quality, tenure and location,
    or a robust justification for off-site delivery or commuted sums
  level: must
- item: Details and terms of any grant funding
  level: must
- item: Any rental charge and service charge liability for each affordable unit
  level: must
- item: A Marketing and Communication Strategy
  level: must
- item: A full delivery programme showing which affordable units will be delivered and when
  level: must
- item: A commitment to give at least eight weeks' notice of completion of units
  level: must
- item: A colour coded site plan illustrating property types and tenures dispersed throughout the development
  level: must
- item: A commitment to manage the initial and aftersales administration of any discounted market sale
    properties, including First Homes, so they remain affordable in perpetuity
  level: must
- item: 'Where the full (currently 20%) on-site requirement cannot be delivered: a statement explaining
    what design and subsidy options were considered and why they were not successful'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The full affordable housing requirement is not provided on site.
confidence: medium
notes: From the council's list (June 2026), page 8-9, item 4.
review-status: unverified
field-status: {}
