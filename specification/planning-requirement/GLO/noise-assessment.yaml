reference: noise-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - discretionary
    - all:
      - any:
        - condition:
            field: plant-equipment
            value: true
            description: Installation of plant or equipment.
        - condition:
            field: noise-generating-use
            value: true
            description: Operations, activity or use that may cause noise.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: May adversely affect adjoining or nearby noise sensitive properties.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Proposed noise sensitive development that adjoins or is likely to be affected by
          an existing source of noise.
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF 198; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14
source-text: Any application which in the opinion of the LPA has the potential to generate or be disturbed
  by significant noise and disturbance. Where the proposed development involves the installation of any
  plant or equipment or the carrying out of any operations, activity or use that may adversely affect
  adjoining or nearby noise sensitive properties. Proposed noise sensitive developments that adjoin or
  are likely to be affected by an existing source of noise e.g. residential development close to a commercial/industrial
  use or trunk road where the proposed residential development may be impacted upon by unacceptable levels
  of noise.
must-include:
- item: Existing background noise levels measured over a 24-hour period (including cumulative levels of
    all existing units) at times likely to show the worst case
  level: must
- item: Proposed noise levels, including cumulative levels of all proposed units
  level: must
- item: Any proposed measures to reduce noise from the development, and mitigation where necessary
  level: must
- item: The manufacturer's specification of any equipment to be installed, altered or replaced
  level: must
- item: The method used to compile the report, with examples of the calculations and assumptions
  level: must
- item: Prepared by a suitably qualified acoustician, demonstrating sufficient sound insulation or other
    mitigation to avoid harm to adjacent residents
  level: should
confidence: medium
notes: From the council's list (June 2026), page 20, item 37. The first trigger is the LPA's opinion,
  so it shows as discretionary. Part B items 'will not necessarily be required in every case'; the list
  gives no application types for most of them, so they are shown for householder, full, outline and reserved
  matters applications unless the item says otherwise.
review-status: unverified
field-status: {}
