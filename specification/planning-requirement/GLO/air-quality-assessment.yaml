reference: air-quality-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - site:
          in:
          - air-quality-management-area
          description: Within or adjoining an air quality management area (AQMA).
    - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policy SD14; Gloucester
  City Plan (GCP) policy C5
source-text: Major development within or adjoining an air quality management area (AQMA) Proposals that
  would lead to an increase in congestion or HGV movements, include significant amounts of car parking
  or emit dust. Proposals that introduce “sensitive receptors” e.g. dwellings, schools, hospitals, into
  an area of poor air quality.
must-include:
- item: Methodology in line with EPUK/IAQM guidance
  level: should
confidence: medium
notes: From the council's list (June 2026), page 10, item 7. The other triggers (more congestion or HGV
  movements, 'significant amounts' of car parking, dust, or sensitive receptors in an area of poor air
  quality) are not defined, so they show as discretionary; the list advises pre-application advice on
  whether an assessment is needed. The AQMAs are Barton Street, Priory Road and Painswick Road. The planting
  plan required in AQMAs is under landscaping-plan.
review-status: unverified
field-status: {}
