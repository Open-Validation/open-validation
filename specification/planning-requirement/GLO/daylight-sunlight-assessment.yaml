reference: daylight-sunlight-assessment
local-authority: GLO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.gloucester.gov.uk/media/ainn53uq/lvc-adopted.pdf
policy: NPPF; Gloucester, Cheltenham and Tewkesbury Joint Core Strategy (JCS) policies SD4 and SD14
source-text: Any application where there is a potential adverse impact upon the current levels of sunlight/daylight
  enjoyed by adjoining properties or building(s), including associated gardens or amenity space. Any application
  where there is potential adverse impacts on future occupiers, buildings and spaces within the proposed
  development.
must-include:
- item: Confirms the assessment follows BRE BR 209 (2022) and BS EN 17037
  level: must
- item: 'A scope statement: impact on neighbouring properties, quality of light in the proposed development,
    and amenity spaces'
  level: must
- item: 'Model and methodology: software, assumptions and parameters; existing and proposed buildings,
    ground levels and tree cover (leaf-on/off); surface reflectance and glass transmittance values'
  level: must
- item: 'Neighbouring properties: VSC for affected windows, No-Sky Line analysis, APSH for main living
    rooms (annual and winter), and sunlight to gardens/open spaces on 21 March'
  level: must
- item: 'Proposed development: internal daylight compliance (SDA, Median Daylight Factor or lux levels
    per BS EN 17037), internal sunlight hours for habitable rooms, and Sun-On-Ground for amenity spaces'
  level: must
- item: Shadow diagrams for 21 March, 21 June and 21 December
  level: must
- item: Tabulated results for all tests, floorplans and diagrams showing compliance or non-compliance,
    and weighted averages for rooms with multiple windows
  level: must
- item: A statement explaining any deviations from BRE targets, with contextual justification
  level: must
- item: 'An executive summary and conclusion: compliance, impacts and any mitigation'
  level: must
confidence: medium
notes: From the council's list (June 2026), page 12-13, item 17. Whether there is a 'potential adverse
  impact' is a judgement, so the trigger is discretionary. Part B items 'will not necessarily be required
  in every case'; the list gives no application types for most of them, so they are shown for householder,
  full, outline and reserved matters applications unless the item says otherwise.
review-status: unverified
field-status: {}
