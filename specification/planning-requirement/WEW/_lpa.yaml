  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'The linked page is a single item page (List 1 #13) of Welwyn Hatfield''s web-based local list,
    which is still the current list (adopted 7 December 2017), but the workbook records no date. Coverage
    is thin: most List 1 items (including Air Quality on the linked page itself) and all List 2 householder
    requirements are missing, and there are several mis-assigned triggers and application types. Fixed
    2026-11-05: every file was rewritten from the council''s latest list.'
