    than 2 years old, so outdated.'
  status: outdated
submission-standards:
- item: Plans correctly titled, with individual drawing numbers on each plan
  level: must
- item: Plans annotated with either dimensions or a scale bar (horizontally and vertically), and show
    the paper size
  level: must
- item: Plans not marked 'Do Not Scale' or equivalent
  level: must
- item: Plans proportionate to the nature and size of the proposal
  level: should
- item: One copy only of the application form and plans, whether submitted electronically or on paper
  level: must
- item: Personal or sensitive information removed or redacted before submission (signatures, personal
    phone numbers and email addresses, photographs of children and vulnerable adults, vehicle registration
    numbers)
  level: should
- item: 'Where not submitted through the Planning Portal: 1 hard copy of all plans and documents and 1
    electronic copy on CD, in three folders (A: form, covering letter, design and access statement and
    planning statement; B: all plans; C: all other documents), with paper and CD matching'
  level: should
- item: No file bigger than 10 MB
  level: should
- item: Files not security locked, and each document labelled with a clear description of its contents
  level: should
audit:
