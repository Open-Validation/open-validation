reference: biodiversity-survey-report
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - hh
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected species are known to exist on the site.
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/14
policy: Draft Local Plan Proposed Submission (August 2016) policies SP9, SP10, SP11 and SADM16
source-text: May be required where your proposed development is part of, or located next to, a site designated
  for its biodiversity value, where it supports other locally significant habitat interest or may affect
  protected species or the potential for them. For sites where protected species are known to exist, you
  will need to accompany your planning application with a biodiversity survey and report.
must-include:
- item: Details of the existing biodiversity interests and protected species found on the site, including
    possible impacts of the development on them
  level: must
- item: Details of proposed measures to prevent, mitigate or compensate for the possible impacts on habitats
    and species
  level: must
- item: Where necessary, an appropriate ecological survey (e.g. walkover, Phase 1 Habitat Survey, National
    Vegetation Classification or protected species) with details of any statutory or non-statutory sites
  level: should
- item: Details for long term maintenance and management, where needed
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 14 (item 3e) and List 2, page 5
  (item 4e). List 1 covers applications for planning permission, outline permission (some or all matters
  reserved), planning permission with listed building consent or advertisement consent, and, per the council's
  'Planning application requirements' page, reserved matters and relevant demolition in a conservation
  area. Sites next to designated sites or other habitat interest are discretionary ('May be required').
  Where protected species are believed present and would be affected, a phase 1 survey is recommended.
  The 2017 list predates statutory biodiversity net gain and has no BNG items.
review-status: unverified
field-status: {}
