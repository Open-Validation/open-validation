reference: noise-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise and/or vibration sensitive development.
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/26
policy: Welwyn Hatfield District Plan 2005 policy R19; Draft Local Plan Proposed Submission (August 2016)
  policies SP11 and SADM18
source-text: Required for applications with issues of disturbance, or are considered to be noise and/or
  vibration sensitive development.
must-include:
- item: The potential sources of noise and/or vibration and how these may have a negative effect on local
    amenity
  level: must
- item: How the developer intends to overcome these issues
  level: must
- item: Prepared by a suitably qualified practitioner
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 26 (item 3u). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. 'Issues of disturbance' has no
  clear test, so it is discretionary. The list points to ProPG (May 2017) on good acoustic design.
review-status: unverified
field-status: {}
