reference: archaeological-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: Within an Area of Archaeological Significance.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal involves a new building or the disturbance of ground.
    - all:
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.5
            description: A site of over 0.5 hectares.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 0.5
            description: A site of over 0.5 hectares.
      - discretionary
    - all:
      - ref: major-development
      - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/13
policy: Welwyn Hatfield District Plan 2005 policy R29; Draft Local Plan Proposed Submission (August 2016)
  policies SP11 and SADM15
source-text: Required for proposals involve a new building or the disturbance of ground within an Area
  of Archaeological Significance and/or where the development would have an impact on a site which has,
  or may have, archaeological interest of over 0.5ha. … or in other areas in the case of a major development
  proposal or significant infrastructure works, an applicant may need to commission an assessment of existing
  archaeological information and submit the results as part of the Heritage Statement.
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 13 (item 3c). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. Sites of over 0.5 ha that have
  or may have archaeological interest, and major or significant infrastructure proposals elsewhere, are
  discretionary ('may have', 'may need'). The list says the assessment may be a desk-based assessment
  and/or field evaluation, submitted as part of the Heritage Statement.
review-status: unverified
field-status: {}
