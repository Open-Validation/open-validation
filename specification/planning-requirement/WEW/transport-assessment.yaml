reference: transport-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 80
        description: 'Transport Assessment: residential development in excess of 80 units.'
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 1500
        description: 'Transport Assessment: non-food retail of more than 1,500 sq m GFA.'
    - condition:
        field: office-floorspace
        operator: '>'
        value: 2500
        description: 'Transport Assessment: Class B1 business of more than 2,500 sq m GFA.'
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 4000
        description: 'Transport Assessment: Class B2 general industrial of more than 4,000 sq m GFA.'
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 5000
        description: 'Transport Assessment: B8 warehousing of more than 5,000 sq m GFA.'
    - all:
      - condition:
          field: affects-trunk-road
          value: true
          description: 'Transport Statement: development affecting a trunk road.'
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: Between 50 and 80 units.
      - condition:
          field: dwelling-count
          operator: <=
          value: 80
          description: Between 50 and 80 units.
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 800
        description: 'Transport Statement: non-food retail of more than 800 sq m GFA.'
    - condition:
        field: office-floorspace
        operator: '>'
        value: 1500
        description: 'Transport Statement: Class B1 business of more than 1,500 sq m GFA.'
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 2500
        description: 'Transport Statement: Class B2 general industrial of more than 2,500 sq m GFA.'
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 3000
        description: 'Transport Statement: B8 warehousing of more than 3,000 sq m GFA.'
    - all:
      - application-type:
          in:
          - outline
      - condition:
          field: access-reserved-matter
          value: false
          description: Access is to be determined at the outline stage (not reserved).
      - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/34
policy: Welwyn Hatfield District Plan 2005 policies M2, M3 and M6; Draft Local Plan Proposed Submission
  (August 2016) policies SADM2, SADM3, SP9, SADM12 and SADM13
source-text: 'Transport Statement - development affecting a trunk road with between 50 and 80 units Non-food
  retail development of more than 800m2 and less than 1,500m2 Gross Floor Area (GFA) Class B1 Business
  of more than 1500m2 and less than 2,500m2 GFA Class B2 General Industrial of more than 2,500m2 and less
  than 4,000m2 GFA Warehousing (use class B8) of more than 3,000m2 and less than 5,000m2 GFA Transport
  Assessment will be required in the following cases: Residential development in excess of 80 units Non-food
  retail development of more than 1,500m2 Gross Floor Area (GFA) Class B1 Business of more than 2500m2
  GFA Class B2 General Industrial of more than 4,000m2 GFA Warehousing (use class B8) of more than 5,000m2
  GFA'
must-include:
- item: All existing and proposed commercial and residential vehicular and pedestrian movements to and
    from the site
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles
  level: must
- item: A description and analysis of existing transport conditions, how the development would affect
    them and measures proposed to overcome any problems
  level: must
confidence: medium
notes: 'From the council''s list (adopted 7 December 2017), List 1, page 34 (item 3zvi) and page 7 (item
  2i, outline: ''If access is to be determined at the outline stage all transport matters must be dealt
  with in detail, including the submission of a Transport Impact assessment where necessary''). List 1
  covers applications for planning permission, outline permission (some or all matters reserved), planning
  permission with listed building consent or advertisement consent, and, per the council''s ''Planning
  application requirements'' page, reserved matters and relevant demolition in a conservation area. Covers
  both the Transport Statement (lower bands) and the Transport Assessment (upper bands); ''between 50
  and 80 units'' is read as 50 to 80 inclusive, since a Transport Assessment starts above 80. The outline
  case is discretionary (''where necessary'').'
review-status: unverified
field-status: {}
