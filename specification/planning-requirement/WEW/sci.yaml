notes: From the council's list (adopted 7 December 2017), List 1, page 31 (item 3zii). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. The list says 'Required for all
  developments' (shown as every List 1 application), while its guidance expects consultation for larger
  developments.
