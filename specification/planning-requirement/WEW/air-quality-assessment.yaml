reference: air-quality-assessment
local-authority: WEW
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is within or adjoining an Air Quality Management Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal includes housing.
  - condition:
      field: eia-development
      value: true
      description: The proposal needs an Environmental Statement.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 300
      description: The proposal includes more than 300 new car parking spaces.
  - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/13
confidence: medium
notes: 'From the audit (missing_requirement): 3b Air Quality Assessment - housing within or adjoining
  an AQMA; proposals needing an ES or Transport Assessment; schemes that increase congestion or change
  traffic composition; coach/lorry parks; sensitive areas (shown as officer discretion); "more than 300
  new car parking spaces".'
review-status: unverified
field-status: {}
