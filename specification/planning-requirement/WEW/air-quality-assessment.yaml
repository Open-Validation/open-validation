reference: air-quality-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: Within or adjoining an Air Quality Management Area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal includes housing.
    - condition:
        field: eia-development
        value: true
        description: The proposal requires an Environmental Statement.
    - condition:
        field: parking-spaces
        operator: '>'
        value: 300
        description: New car parking of more than 300 spaces.
    - discretionary
  - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/13
policy: Welwyn Hatfield District Plan 2005 policy R18; Draft Local Plan Proposed Submission (August 2016)
  policies SP11 and SADM18
source-text: 'The Council may require an applicant to submit an Air Quality Assessment for proposals that
  would: • Include housing and is within or adjoining an Air Quality Management Area; • Require an Environmental
  Statement; • Require a Transport Assessment; • Result in increased traffic congestion, or create a change
  in traffic volumes or vehicle speed; • Significantly alter the traffic composition in an area (i.e.
  bus stations, HGV Parks etc.); • Include proposals for new car parking (>300 spaces) or coach/ lorry
  parks; or • Have an effect on sensitive areas such as ecological sites, or areas previously defined
  as having poor air quality (including Air Quality Management Areas)'
must-include:
- item: The change in air quality resulting from the proposed development
  level: must
- item: Appropriate mitigation measures as necessary
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 13 (item 3b). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. The list says the council 'may
  require' the assessment, so the whole rule is discretionary within the listed cases. Needing a Transport
  Assessment, traffic congestion or composition changes, coach or lorry parks and effects on sensitive
  areas have no clear test and are shown as discretionary.
review-status: unverified
field-status: {}
