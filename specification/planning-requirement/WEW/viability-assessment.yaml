reference: viability-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - all:
      - ref: major-development
      - condition:
          field: planning-obligations-shortfall
          value: true
          description: The proposal does not offer planning obligations in line with the council's Planning
            Obligations SPD (February 2012) and Hertfordshire County Council's planning obligation guidance.
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 11
            description: 11 or more new dwellings.
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: A site of 0.5 hectares or more.
      - condition:
          field: affordable-housing-below-target
          value: true
          description: The proposed affordable housing is not policy compliant.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/20
policy: Welwyn Hatfield District Plan 2005 policies H10 and D9; Draft Local Plan Proposed Submission (August
  2016) policies SP7 and SP10; Planning Obligations SPD (February 2012)
source-text: Required for major developments that do not offer planning obligations in accordance with
  the Council’s Supplementary Planning Document on Planning. Obligations, February 2012 and Hertfordshire
  County Council’s planning obligation guidance – toolkit for Hertfordshire. … If you are proposing affordable
  housing that is not policy compliant, a viability statement will need to be submitted.
must-include:
- item: A robust open book appraisal
  level: must
- item: Evidence and firm assurances demonstrating the reliability of the financial viability information
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, pages 20 (item 3o, Financial Viability
  Assessment) and 12 (item 3a, Affordable Housing Statement). List 1 covers applications for planning
  permission, outline permission (some or all matters reserved), planning permission with listed building
  consent or advertisement consent, and, per the council's 'Planning application requirements' page, reserved
  matters and relevant demolition in a conservation area.
review-status: unverified
field-status: {}
