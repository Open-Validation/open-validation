reference: heritage-statement
local-authority: WEW
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - park-and-garden
      description: Development affecting a Registered Park and Garden or a Locally Listed Park and Garden.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/22
policy: Welwyn Hatfield District Plan 2005 policy R28; Draft Local Plan Proposed Submission (August 2016)
  policy SADM15
source-text: Required for all listed building consent applications and / or developments affecting Registered
  Park & Garden or Locally Listed Park & Gardens.
must-include:
- item: The significance of the architectural and historical interest and character of the building, structure
    or park and garden
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the special interest of the listed building, structure and/or park
    and garden, its setting and the setting of adjacent listed buildings
  level: must
- item: The sources considered and the expertise consulted
  level: must
- item: The steps taken to avoid or minimise any adverse impacts on the significance of the building
  level: must
- item: 'Statement of Justification: where the works would cause substantial harm or total loss of significance
    to the building, a method statement and justification'
  level: must
  required-if:
    all:
    - site:
        in:
        - listed-building
        description: A listed building.
    - any:
      - condition:
          field: structural-alteration
          value: true
          description: Structural alterations to a listed building.
      - condition:
          field: demolition
          value: true
          description: Demolition of a listed building.
  source-text: If the proposed works would cause substantial harm or total loss of significance to the
    building, provide a method statement and justification.
confidence: medium
notes: 'From the council''s list (adopted 7 December 2017), List 1, pages 22 (item 3q) and 31 (item 3ziii,
  Statement of Justification), List 2, pages 7-8 (items 4g, 4i) and List 5, page 5 (item 7d). Shown for
  all types: List 1 and List 2 cover planning or householder applications with listed building consent,
  and List 5 repeats the item.'
review-status: unverified
field-status: {}
