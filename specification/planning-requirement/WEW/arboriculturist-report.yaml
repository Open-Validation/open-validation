reference: arboriculturist-report
local-authority: WEW
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - demolition-con-area
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-5/4
policy: Welwyn Hatfield District Plan 2005 policies D8 and R17; Draft Local Plan Proposed Submission (August
  2016) policies SP9, SP10, SP11 and SADM16
source-text: Required for all applications for proposals that affect protected trees or those trees subject
  to conservation area consent. … a tree survey / tree protection plan / arboricultural method statement,
  trees should be considered in line with BS 5837:2012 ‘trees in relation to design, demolition and construction
  recommendations’;
must-include:
- item: Species, spread, roots and position of trees
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Details of the works proposed
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Why the proposed works are necessary
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Proposed replacement trees, if necessary
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: A tree survey, tree protection plan and arboricultural method statement in line with BS 5837:2012
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 5, page 4 (item 7c, Tree Survey/Arboricultural
  Statement) and List 1, page 23 (Landscape Strategy). List 5 (tree works) is not formally adopted. For
  List 1 applications the tree survey is part of the Landscape Strategy, whose 'amount/level of information
  will vary depending upon the scale of the development as well as its location', so it is shown as discretionary.
review-status: unverified
field-status: {}
