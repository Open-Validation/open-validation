reference: land-contamination-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - site:
      in:
      - contaminated-land
      description: Land which could potentially be contaminated as a result of current or historic use,
        being re-developed or significantly changing use.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/17
policy: Welwyn Hatfield District Plan 2005 policy R2; Draft Local Plan Proposed Submission (August 2016)
  policy SADM18
source-text: Required for applications to re-develop or significantly change the use of a piece of land
  which could potentially be contaminated as a result of current or historic use.
must-include:
- item: Enough information to determine whether contamination exists, its nature, the risks it may pose
    to human health and controlled waters, and whether these can be reduced to an acceptable level
  level: must
- item: A Site Investigation and Risk Assessment and Remediation Strategy, depending on the site, the
    end use and the potential for contamination
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 17 (item 3i, Contaminated Land
  Assessment). List 1 covers applications for planning permission, outline permission (some or all matters
  reserved), planning permission with listed building consent or advertisement consent, and, per the council's
  'Planning application requirements' page, reserved matters and relevant demolition in a conservation
  area.
review-status: unverified
field-status: {}
