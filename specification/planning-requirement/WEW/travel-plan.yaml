reference: travel-plan
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/34
source-text: Green Travel Plans – In accordance with Hertfordshire’s Travel Plan Guidance for Business
  and Residential Development
must-include:
- item: How the transport implications of the development will be managed to ensure the least environmental,
    social or economic impact
  level: must
- item: How new occupiers or customers will use alternative means of travel that do not involve private
    vehicle use
  level: must
- item: Clear targets so the Travel Plan can be monitored and reviewed
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 34 (item 3zvi). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. The list gives no threshold of
  its own and defers to Hertfordshire's Travel Plan Guidance, so it is discretionary.
review-status: unverified
field-status: {}
