reference: lighting-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - ref: major-development
    - condition:
        field: floodlighting
        value: true
        description: The proposal includes floodlighting.
