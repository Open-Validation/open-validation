reference: floor-plan-proposed
local-authority: WEW
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: building-works
        value: true
        description: Householder applications comprising building works or alterations to buildings.
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/2
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications including change of use. … Required for all applications comprising
  building works or alterations to buildings.
must-include:
- item: Drawn at a minimum scale of 1:50, or 1:100
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: should
- item: Existing and proposed drawings provided in the same orientation
  level: should
- item: Equipment, ducting and acoustic enclosures or screening shown, with neighbouring windows cross-referenced
    to the acoustic report
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
- item: Ground floor plans showing separate access to upper floors, where a shop front proposal affects
    access to the upper floors
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: A shop front proposal that affects access to the upper floors.
- item: 'For basements extending to the front and rear of the property: the distance between the basement
    and the boundary'
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: Basement works extending to the front and rear of the property.
- item: The location of the affordable units and the number of habitable rooms and/or bedrooms, and/or
    the floor space of the units
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more new dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site of 0.5 hectares or more.
- item: 'For lawful development certificates: plans, elevations and sections at 1:100 or 1:50 that clearly
    show the full extent of the use or building works'
  level: should
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, pages 2, 8-10 and 12 (items 2b, 2j,
  2k, 2l, 3a) and List 2, page 2 (item 4a). List 1 covers applications for planning permission, outline
  permission (some or all matters reserved), planning permission with listed building consent or advertisement
  consent, and, per the council's 'Planning application requirements' page, reserved matters and relevant
  demolition in a conservation area. For lawful development certificates (List 4) the list is not formally
  adopted (the council says it has not, or for lawful development certificates 'cannot', formally adopt
  a local list for these types and recommends the information), so shown as discretionary.
review-status: unverified
field-status: {}
