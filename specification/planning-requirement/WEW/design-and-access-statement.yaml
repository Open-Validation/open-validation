reference: design-and-access-statement
local-authority: WEW
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building or buildings where the floorspace to be created is 100 sq m or more.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-national-requirements/5
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for all major developments and applications within conservation areas which comprise:
  • Provision of one or more dwellinghouses • Building or buildings where the floorspace to be created
  is 100m² or more'
confidence: medium
notes: From the council's list (adopted 7 December 2017), National Requirements, page 5 (item 1f). Contents
  are the national ones (DMPO), so none are listed here.
review-status: unverified
field-status: {}
