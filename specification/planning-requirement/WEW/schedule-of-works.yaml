reference: schedule-of-works
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - hh
      - lbc
  - any:
    - all:
      - site:
          in:
          - listed-building
          description: A listed building.
      - any:
        - condition:
            field: structural-alteration
            value: true
            description: Structural alterations to a listed building.
        - condition:
            field: demolition
            value: true
            description: Demolition of a listed building.
    - all:
      - condition:
          field: demolition
          value: true
          description: Demolition of another heritage asset.
      - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/29
source-text: Required for structural alterations to a listed building or demolition of a listed building
  or other heritage asset.
must-include:
- item: The location, extent and character of items to be removed (including ceilings, partitions, fixtures
    and fittings) shown on the existing elevations, plans and sections and cross-referenced to the schedule
  level: must
- item: 'Where major repair works are proposed: a supplementary schedule of works and method statement
    explaining the principles'
  level: must
- item: Structural plans where demolition of a designated heritage asset is proposed on the grounds that
    it is structurally unsound
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 29 (item 3z) and List 2, page 8
  (item 4h). List 1 covers applications for planning permission, outline permission (some or all matters
  reserved), planning permission with listed building consent or advertisement consent, and, per the council's
  'Planning application requirements' page, reserved matters and relevant demolition in a conservation
  area. 'Other heritage asset' is not defined, so demolition of other heritage assets is discretionary.
  The schedule is in addition to the Heritage Statement.
review-status: unverified
field-status: {}
