reference: location-plan
local-authority: WEW
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
      - s73
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - non-material-amendment
        - approval-condition
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-national-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for all applications, except non material amendments and submission of details
  when it clear from the application which development the proposal relates to:'
must-include:
- item: At a scale of 1:1250 or 1:2500 (other scales may be required in exceptional circumstances)
  level: must
- item: Identifies the site and the surrounding area, showing at least two roads and the north point
  level: must
- item: Site outlined in red, including land needed to carry out the development (e.g. access from a public
    highway, visibility splays, car parking and open areas around buildings)
  level: must
- item: Any other land owned by the applicant outlined in blue
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), National Requirements, page 1 (item 1b). For
  non-material amendments and approval of details it is needed only where it is not clear which development
  the proposal relates to (shown as discretionary). The list adds that applications with unlicensed Ordnance
  Survey mapping will be accepted, with any possible copyright infringement pointed out.
review-status: unverified
field-status: {}
