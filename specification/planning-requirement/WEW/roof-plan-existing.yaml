reference: roof-plan-existing
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - condition:
      field: roof-alteration
      value: true
      description: The application involves alterations to the roof layout.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/4
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications involving alterations to the roof layout.
must-include:
- item: Drawn at a minimum scale of 1:50, or 1:100
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: should
- item: Existing and proposed drawings provided in the same orientation
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 4 (item 2e). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. List 2 (householder) has no roof
  plan item.
review-status: unverified
field-status: {}
