reference: flood-risk-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - hh
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: A site of one hectare or greater (in Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A site of one hectare or greater (in Flood Zone 1).
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/21
policy: Welwyn Hatfield District Plan 2005 policies TCR7, TCR8, TCR10, TCR11, TCR16, TCR17, TCR19, TCR20,
  TCR23-TCR28 and RA17; Draft Local Plan Proposed Submission (August 2016) policies SADM4, SADM5, SADM20,
  SADM23, SADM24 and SP25
source-text: Required for Planning applications for development proposals of one hectare or greater in
  Flood Zone 1 and all development proposals located in Flood Zones 2 and 3 should be accompanied by a
  Flood Risk Assessment (FRA).
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development, and how
    they will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
confidence: medium
notes: 'From the council''s list (adopted 7 December 2017), List 1, page 21 (item 3p) and List 2, page
  6 (item 4f). List 1 covers applications for planning permission, outline permission (some or all matters
  reserved), planning permission with listed building consent or advertisement consent, and, per the council''s
  ''Planning application requirements'' page, reserved matters and relevant demolition in a conservation
  area. Discretionary part: the list says the Strategic Flood Risk Assessment (May 2009) identifies areas
  vulnerable to flooding from sewers, groundwater, overland flow and artificial sources, and applicants
  must contact the planning department to find out whether an FRA is needed there.'
review-status: unverified
field-status: {}
