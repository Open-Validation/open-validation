reference: recreation-facilities-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - site:
        in:
        - open-space
        description: Existing open space within or adjoining the site.
    - condition:
        field: new-open-space
        value: true
        description: The proposal includes open space.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/27
source-text: Required for applications with open space.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: must
- item: 'For playing fields: the size of the existing playing field and how much of it is affected (in
    ha or m²)'
  level: must
- item: 'For playing fields: an existing site plan showing the layout of winter and summer pitches, including
    safety margins, at a minimum 1:1000 scale'
  level: must
- item: 'For playing fields: a proposed site plan showing how new buildings and other works will affect
    the pitch layout, including any realignment of pitches'
  level: must
- item: 'For playing fields: relevant correspondence or supporting statement, including when last used
    and by whom, and any formal sports provision or replacement facilities proposed'
  level: must
- item: 'For playing fields: information on alternative sport and recreational provision'
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 27 (item 3v, Open Space Assessment).
  List 1 covers applications for planning permission, outline permission (some or all matters reserved),
  planning permission with listed building consent or advertisement consent, and, per the council's 'Planning
  application requirements' page, reserved matters and relevant demolition in a conservation area. The
  list adds that an applicant may show through an independent assessment that open space is surplus to
  requirements.
review-status: unverified
field-status: {}
