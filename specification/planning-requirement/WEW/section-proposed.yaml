  - any:
    - condition:
        field: building-works
        value: true
        description: The proposal involves building work or alterations to buildings.
    - application-type:
        in:
        - advertising
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal includes or involves a change in ground levels.
