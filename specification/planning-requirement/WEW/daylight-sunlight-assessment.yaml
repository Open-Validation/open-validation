reference: daylight-sunlight-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - all:
      - ref: major-development
      - discretionary
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/18
policy: Welwyn Hatfield District Plan 2005 policy D1; Draft Local Plan Proposed Submission (August 2016)
  policies SP9, SP10, SADM11 and SADM12
source-text: Required for major applications where there is a potential adverse impact upon thebcurrent
  levels of sunlight/daylight enjoyed by adjoining properties or buildings, including associated gardens
  or amenity space. Applications where the application site itself is subject to potential adverse impact
  from adjoining buildings or features or where one part of the development is affectedby another part
  of the same development.
must-include:
- item: A daylight, vertical sky component, sunlight availability and shadow study, assessed against the
    criteria in the BRE guide
  level: must
- item: The existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties
  level: must
- item: The measures to mitigate the expected impact of the development
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 18 (item 3k). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. 'Potential adverse impact' has
  no clear test, so both parts are discretionary (the first only for major applications). 'thebcurrent'
  and 'affectedby' are the council's typos.
review-status: unverified
field-status: {}
