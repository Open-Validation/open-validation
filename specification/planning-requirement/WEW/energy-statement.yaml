reference: energy-statement
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings (District Plan 2005).
    - ref: major-development
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A non-residential site of 1 hectare or more.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/19
policy: Welwyn Hatfield District Plan 2005 policy R3; Draft Local Plan Proposed Submission (August 2016)
  policies SP10 and SADM13
source-text: Welwyn Hatfield District Plan 20015 – required for 10 or more dwellings. Draft Local Plan
  Proposed Submission, August 2016, required for major developments or a non-residential site of 1 hectare
  or more.
must-include:
- item: How the proposal will maximise energy conservation, through means such as renewable energy or
    low carbon sources
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 19 (item 3m). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. '20015' is the council's typo
  for 2005.
review-status: unverified
field-status: {}
