reference: subsidence-report
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - site:
      in:
      - chalk-mine-risk-area
      description: In the chalk mine areas in Hatfield (University of Hertfordshire, College Lane Campus).
  - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/16
source-text: Required for those in Hatfield on University of Hertfordshire, College Lane Campus. … Where
  the risk is established to be ‘very high’ or ‘high’ a Geophysical Technical Survey’ report will be need
  to be undertaken and submitted with the planning application to enable the consideration of the risk
  to be undertaken.
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 16 (item 3g, Chalk Mining). List
  1 covers applications for planning permission, outline permission (some or all matters reserved), planning
  permission with listed building consent or advertisement consent, and, per the council's 'Planning application
  requirements' page, reserved matters and relevant demolition in a conservation area. Retired MHCLG id
  used for the Geophysical Technical Survey report. The council first carries out a chalk mine risk assessment
  (applicants supply the site address, land use, access and services); the report is needed only where
  that finds 'very high' or 'high' risk, which is shown as discretionary.
review-status: unverified
field-status: {}
