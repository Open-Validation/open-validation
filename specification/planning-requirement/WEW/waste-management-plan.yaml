reference: waste-management-plan
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: waste-storage-facilities
        value: true
        description: New development needing new or additional bin storage or recycling facilities.
    - ref: major-development
    - condition:
        field: dwelling-subdivision
        value: true
        description: Conversion to flats.
    - condition:
        field: food-or-drink-use
        value: true
        description: Change of use to a bar, restaurant or takeaway food outlet.
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/30
policy: Welwyn Hatfield District Plan 2005 policy R5; Draft Local Plan Proposed Submission (August 2016)
  policy SP10
source-text: Required for all new development which would result in the need for new or additional bin
  storage or recycling facilities. … Required for major applications (excluding householder applications
  which are majors by virtue of the site area) and those that will have an impact on the generation of
  waste. For example conversion to flats, changes of use to bars, restaurants, takeaway food outlets.
must-include:
- item: A scaled plan indicating the location of bin stores
  level: must
- item: Details of the materials, design and type of enclosure to be used, with elevations with dimensions
  level: must
- item: 'For new residential and commercial development: refuse bin storage and its proximity to the point
    of collection'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: New commercial development.
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, pages 13 (item 3d, Bin Stores / Recycling
  Facilities) and 30 (item 3zi, Site Waste Management Plan). List 1 covers applications for planning permission,
  outline permission (some or all matters reserved), planning permission with listed building consent
  or advertisement consent, and, per the council's 'Planning application requirements' page, reserved
  matters and relevant demolition in a conservation area. Other proposals that 'will have an impact on
  the generation of waste' are discretionary.
review-status: unverified
field-status: {}
