reference: sustainability-statement
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - condition:
      field: new-build
      value: true
      description: Newly constructed dwellings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Newly constructed dwellings.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/36
policy: Draft Local Plan Proposed Submission (August 2016) policy SADM13
source-text: For all newly constructed dwellings.
must-include:
- item: An estimated water consumption of no more than 110 litres/person/day
  level: must
- item: Water reuse and recycling and rainwater harvesting wherever feasible
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 36 (item 3zviiii, Water Usage).
  List 1 covers applications for planning permission, outline permission (some or all matters reserved),
  planning permission with listed building consent or advertisement consent, and, per the council's 'Planning
  application requirements' page, reserved matters and relevant demolition in a conservation area. The
  list names no document for the water usage information; it is filed here as a sustainability statement.
review-status: unverified
field-status: {}
