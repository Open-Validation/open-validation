reference: section-existing
local-authority: WEW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - demolition-con-area
        - hh
    - condition:
        field: change-in-ground-levels
        value: true
        description: Building work, alterations or advertisements where the proposal includes or involves
          a change in ground levels.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - demolition-con-area
    - any:
      - condition:
          field: basement
          value: true
          description: Basements or excavations.
      - condition:
          field: plant-equipment
          value: true
          description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/4
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications involving building work, alterations to buildings or display
  of advertisements when the proposal includes or involves a change in ground levels.
must-include:
- item: Drawn at a minimum scale of 1:50, or 1:100, showing a cross section(s) through the proposed building(s)
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: should
- item: Existing and proposed drawings provided in the same orientation
  level: should
- item: 'For fascia or projecting signs: existing and proposed sections cut through to show the illumination,
    at 1:20'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For lawful development certificates: plans, elevations and sections at 1:100 or 1:50 that clearly
    show the full extent of the use or building works'
  level: should
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: 'From the council''s list (adopted 7 December 2017), List 1, pages 4, 6, 8 and 10 (items 2d, 2h,
  2j, 2l), List 2, page 3 (item 4c). List 1 covers applications for planning permission, outline permission
  (some or all matters reserved), planning permission with listed building consent or advertisement consent,
  and, per the council''s ''Planning application requirements'' page, reserved matters and relevant demolition
  in a conservation area. Sections are also listed for advertisements (2h: ''submit existing and proposed
  sections through any fascia or projecting sign''), basements (2l: ''Existing and proposed sections'')
  and plant (2j). For lawful development certificates the list is not formally adopted (the council says
  it has not, or for lawful development certificates ''cannot'', formally adopt a local list for these
  types and recommends the information), so shown as discretionary.'
review-status: unverified
field-status: {}
