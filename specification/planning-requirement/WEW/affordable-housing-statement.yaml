reference: affordable-housing-statement
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more new dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site of 0.5 hectares or more.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/12
policy: Welwyn Hatfield District Plan 2005 policy H7; Draft Local Plan Proposed Submission (August 2016)
  policy SP7
source-text: Draft Local Plan Proposed Submission, August 2016, required for proposals of 11 new dwellings
  or a site of a site of 0.5 hectares or more.
must-include:
- item: The mix of private and affordable units, with numbers of habitable rooms and/or bedrooms
  level: must
- item: A clear and full explanation of any different levels or types of affordability or tenure proposed
    for different units
  level: must
- item: The location of the affordable units and their habitable rooms and/or bedrooms and/or floor space,
    shown on the floor plans
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 12 (item 3a). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. Where the affordable housing
  is not policy compliant, a viability statement is also needed (see viability-assessment).
review-status: unverified
field-status: {}
