reference: elevation-proposed
local-authority: WEW
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - demolition-con-area
        - hh
    - any:
      - condition:
          field: building-works
          value: true
          description: The application involves building work.
      - condition:
          field: external-alterations
          value: true
          description: The application involves alterations to buildings.
  - application-type:
      in:
      - advertising
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/3
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications involving building work, alterations to buildings or display
  of advertisements. … Required for all applications involving building work or alterations to buildings.
must-include:
- item: Drawn at a minimum scale of 1:50, or 1:100
  level: must
- item: All sides of the proposal shown, including blank elevations
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished, and the relationship to neighbouring buildings
  level: should
- item: 'Where a proposed elevation adjoins or is close to another building: the relationship between
    the buildings and the positions of the openings on each property'
  level: should
- item: Existing and proposed drawings provided in the same orientation
  level: should
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: 'For a change of use with no change to the external elevations: a statement that no external changes
    are proposed'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use with no change to the external elevations.
- item: Equipment, ducting and acoustic enclosures or screening shown, with neighbouring windows cross-referenced
    to the acoustic report
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
- item: 'For ATMs: details of height (for disabled access) and of any illuminated adverts'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: The proposal includes the installation of an ATM.
- item: 'For lawful development certificates with roof lights: how far they project from the roof slope,
    marked on the drawings'
  level: should
  required-if:
    application-type:
      in:
      - ldc
- item: 'For lawful development certificates with dormer windows: the distance between the eaves of the
    original roof and the bottom of the dormer window'
  level: should
  required-if:
    application-type:
      in:
      - ldc
- item: 'For proposed lawful development certificates: drawings annotated to confirm whether any part
    of the extension is clad'
  level: should
  required-if:
    application-type:
      in:
      - ldc
- item: 'For lawful development certificates: plans, elevations and sections at 1:100 or 1:50 that clearly
    show the full extent of the use or building works'
  level: should
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, pages 3, 6, 8-9 (items 2c, 2h, 2j, 2k),
  List 2, page 2 (item 4b) and List 4, pages 2-3 (items 6a, 6b). List 1 covers applications for planning
  permission, outline permission (some or all matters reserved), planning permission with listed building
  consent or advertisement consent, and, per the council's 'Planning application requirements' page, reserved
  matters and relevant demolition in a conservation area. Advertisements are included because items 2c
  and 2h name them. For lawful development certificates the list is not formally adopted (the council
  says it has not, or for lawful development certificates 'cannot', formally adopt a local list for these
  types and recommends the information), so shown as discretionary.
review-status: unverified
field-status: {}
