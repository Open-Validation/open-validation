reference: telecommunications-report
local-authority: WEW
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Mobile phone masts and associated equipment, including prior approvals.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-5/3
policy: Welwyn Hatfield District Plan 2005 policy R21; Draft Local Plan Proposed Submission (August 2016)
  policy SP9
source-text: Required for all applications including prior approvals (where required by legislation)
must-include:
- item: The frequency characteristics of the emitter
  level: must
- item: The maximum power of the emitter (in watts)
  level: must
- item: The orientation of the central axis of the beam, relative to the horizontal and to the ground
  level: must
- item: The maximum power intensity (watts per square metre) on the central axis of the beam at 50, 100
    and 200 metres from the emitter
  level: must
- item: The angular spreads of the surface of half-maximum intensity of the beam in the vertical and lateral
    directions
  level: must
- item: A statement that the proposal, when operational, will meet the ICNIRP guidelines
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 5, page 3 (item 7b, Telecoms). List 5 is
  not formally adopted, but the item reads 'Required'.
review-status: unverified
field-status: {}
