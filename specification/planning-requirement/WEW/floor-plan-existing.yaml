reference: floor-plan-existing
local-authority: WEW
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: building-works
        value: true
        description: Householder applications comprising building works or alterations to buildings.
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/2
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications including change of use. … Required for all applications comprising
  building works or alterations to buildings.
must-include:
- item: Drawn at a minimum scale of 1:50, or 1:100
  level: must
- item: The proposed works shown clearly in relation to what is already there, highlighting any structures
    to be demolished
  level: should
- item: Existing and proposed drawings provided in the same orientation
  level: should
- item: 'For lawful development certificates: plans, elevations and sections at 1:100 or 1:50 that clearly
    show the full extent of the use or building works'
  level: should
  required-if:
    application-type:
      in:
      - ldc
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 2 (item 2b) and List 2, page 2
  (item 4a). List 1 covers applications for planning permission, outline permission (some or all matters
  reserved), planning permission with listed building consent or advertisement consent, and, per the council's
  'Planning application requirements' page, reserved matters and relevant demolition in a conservation
  area. For lawful development certificates (List 4, page 2-3) the list is not formally adopted (the council
  says it has not, or for lawful development certificates 'cannot', formally adopt a local list for these
  types and recommends the information), so shown as discretionary.
review-status: unverified
field-status: {}
