reference: planning-statement
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - ref: major-development
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/28
source-text: Required for all major applications.
must-include:
- item: The principles of and justification for the proposed works
  level: must
- item: How the development accords with the Local Plan, Supplementary Planning Documents/Guidance and
    any development briefs
  level: must
- item: Details of any pre-application consultation carried out in line with the council's Statement of
    Community Involvement 2013
  level: must
- item: How crime prevention has been considered and community safety designed in, with the design steps,
    products and measures to reduce crime
  level: must
  required-if:
    all:
    - ref: major-development
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Major commercial development.
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 28 (item 3x, Planning Statement
  and Additional Supporting Information). List 1 covers applications for planning permission, outline
  permission (some or all matters reserved), planning permission with listed building consent or advertisement
  consent, and, per the council's 'Planning application requirements' page, reserved matters and relevant
  demolition in a conservation area.
review-status: unverified
field-status: {}
