reference: town-centre-impact-assessment
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use (or extension) in an edge-of-centre or out-of-centre location.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up-to-date development plan.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/29
policy: Draft Local Plan Proposed Submission (August 2016) policies SP5, SP16 and SP20
source-text: Required for Retail Impact Assessments are required for any application for a main town centre
  use (or an extension to a use) which would be in an edge-of-centre or out-of-centre location and which
  is not in accordance with an up-to-date development plan.
must-include:
- item: The need for the development
  level: must
- item: Whether it is of an appropriate scale
  level: must
- item: Whether there are any sites closer to a centre for the development
  level: must
- item: Whether there are any unacceptable impacts on existing centres
  level: must
- item: Whether the location is accessible
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 29 (item 3y, Retail Assessment).
  List 1 covers applications for planning permission, outline permission (some or all matters reserved),
  planning permission with listed building consent or advertisement consent, and, per the council's 'Planning
  application requirements' page, reserved matters and relevant demolition in a conservation area.
review-status: unverified
field-status: {}
