reference: site-plan
local-authority: WEW
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - advertising
      - ldc
      - prior-approval
      - s73
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - non-material-amendment
        - approval-condition
    - discretionary
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-national-requirements/2
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for all applications, except non material amendments and submission of details
  when it clear from the application which development the proposal relates to:'
must-include:
- item: Drawn at an identified standard metric scale (1:500 or 1:200)
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries, or a bar scale drawn both horizontally
    and vertically
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site, and those on adjacent land
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing, where proposed
  level: should
confidence: medium
notes: From the council's list (adopted 7 December 2017), National Requirements, page 2 (item 1c). For
  non-material amendments and approval of details it is needed only where it is not clear which development
  the proposal relates to (shown as discretionary). The 'should' items are what the list says 'may be
  required, unless these would not influence or be affected by the proposed development'.
review-status: unverified
field-status: {}
