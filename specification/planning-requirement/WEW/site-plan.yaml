source-text: 'Site Plan/Block Plan Required for all applications, except non material amendments and submission
  of details when it clear from the application which development the proposal relates to: The site plan
  should be drawn at an identified standard metric scale (1:500 or 1:200).It should accurately show: the
  direction of North; the proposed development in relation to the site boundaries and other existing buildings
  on site, with written dimensions including those to the boundaries or include a bar sca…'
must-include:
- item: An identified standard metric scale (1:500 or 1:200)
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries, or a bar scale
  level: must
