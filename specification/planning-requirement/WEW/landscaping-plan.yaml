reference: landscaping-plan
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: bedroom-increase
        value: true
        description: The proposal increases the number of bedrooms.
    - condition:
        field: parking-change
        value: true
        description: The proposal reduces on-site parking provision, or provides forecourt parking.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: The proposal increases commercial floorspace.
    - condition:
        field: use-class
        value: house-in-multiple-occupation
        description: The proposal is for a house in multiple occupation.
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/5
source-text: 'Required for: Increase in bedroom numbers; Proposals reducing on-site parking provision;
  Increase in commercial floorspace; Houses in multiple occupation; Forecourt parking.'
must-include:
- item: Existing and proposed layout plans to scale
  level: must
- item: Areas of hard and soft landscaping
  level: must
- item: Location and type of boundary treatment (for example gates, walls, fences, railings)
  level: must
- item: Location, type and spread of trees on the site and on the pavement
  level: must
- item: Existing and proposed changes of levels
  level: must
- item: An indication of how the hard standing will be drained
  level: must
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 5 (item 2f). List 1 covers applications
  for planning permission, outline permission (some or all matters reserved), planning permission with
  listed building consent or advertisement consent, and, per the council's 'Planning application requirements'
  page, reserved matters and relevant demolition in a conservation area. The list's separate 'Landscape
  Strategy' (List 1, page 23, required for all List 1 applications, including a Landscape Masterplan)
  is recorded as unmapped.
review-status: unverified
field-status: {}
