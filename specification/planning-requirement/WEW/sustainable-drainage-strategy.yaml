reference: sustainable-drainage-strategy
local-authority: WEW
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - ref: major-development
source-url: https://www.welhat.gov.uk/planning-applications/validation-checklist-list-1/33
policy: Welwyn Hatfield District Plan 2005 policies R7 and R9; Draft Local Plan Proposed Submission (August
  2016) policies SADM14, SP10 and SADM13
source-text: 'Sustainable urban drainage systems (SuDS) is required to support major applications where
  developments of ten dwellings or more and equivalent non- residential schemes. Applications will need
  to be supported by the following information. Applications will not be made valid without this information:'
must-include:
- item: Detailed site layout at an identified scale
  level: must
- item: Topographical survey of the site
  level: must
- item: Plans, drawings and specification of the SuDS proposed, including hard construction, soft landscaping
    and planting
  level: must
- item: Calculations of discharge and run-off rates and water storage capacity, showing they meet the
    requirements of the site
  level: must
- item: Evidence that the discharge hierarchy has been assessed and at least one discharge mechanism confirmed
    (infiltration test results, adequacy of the receiving waterbody or, as a last resort, agreement to
    connect to the sewer network)
  level: must
- item: Details of any offsite works required, with the necessary consents
  level: must
- item: Management and maintenance plan for all SuDS
  level: must
- item: 'Scale plans of the new foul drainage arrangements: a location plan, cross sections/elevations
    and specification'
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development changes or replaces the existing drainage system or creates a new one.
- item: 'Where Thames Water identifies a capacity constraint: a detailed water and/or drainage strategy
    saying what infrastructure is required, where, when and how it will be delivered'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 7 December 2017), List 1, page 33 (item 3zv, Sustainable Urban
  Drainage Systems and Foul Sewage Assessment). List 1 covers applications for planning permission, outline
  permission (some or all matters reserved), planning permission with listed building consent or advertisement
  consent, and, per the council's 'Planning application requirements' page, reserved matters and relevant
  demolition in a conservation area. Retired MHCLG id used for the SuDS and foul sewage assessment.
review-status: unverified
field-status: {}
