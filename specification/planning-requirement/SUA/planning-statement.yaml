  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: details of the operational and processing methods, and if landfill, details of phasing
    and timeframes for filling;
- item: 'Waste Planning Statement, where applicable: details of any existing features of the site that
    require removal or diversion'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: details of any existing features of the site that require removal or diversion;
- item: 'Waste Planning Statement, where applicable: details of stockpiles including heights'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: details of stockpiles including heights;
- item: 'Waste Planning Statement, where applicable: details of any residual materials and how they will
