  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: a statement of how the facility meets Somerset’s requirements, the need will need to be
    demonstrated if the proposal is not consistent with the Somerset Waste Core Strategy;
- item: 'Waste Planning Statement, where applicable: details of the operational and processing methods,
