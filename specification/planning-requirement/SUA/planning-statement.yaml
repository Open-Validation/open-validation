reference: planning-statement
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - change-of-use
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - ldc-existing-use
      - ldc-prospective-use
      - ldc-proposed-work-lb
      - s73
  - all:
    - application-type:
        in:
        - reserved-matters
        - consent-under-tpo
        - notice-trees-in-con-area
        - hedgerow-removal
    - discretionary
  - application-type:
      in:
      - waste-dev
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: NPPF paragraphs 10-11; Town and Country Planning Act 1990 sections 191 and 192; Local Plans of
  the former district areas
source-text: 'Required for all change of use applications ... This can be combined with a Design and Access
  Statement. ... Required this should: • Describe the use, operations or other matter • Give the reasons
  for determining the use, operations or other matter to be lawful'
must-include:
- item: An explanation of the principles behind, and justification for, the proposed development
  level: should
  required-if:
    application-type:
      in:
      - change-of-use
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - reserved-matters
      - s73
- item: How the proposal fits the Local Plan policies and supplementary planning documents
  level: should
  required-if:
    application-type:
      in:
      - change-of-use
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - reserved-matters
      - s73
- item: Details of any pre-application consultation undertaken
  level: should
  required-if:
    application-type:
      in:
      - change-of-use
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - reserved-matters
      - s73
- item: A description of the use, operations or other matter, and the reasons it is lawful
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
      - ldc-proposed-work-lb
- item: 'For existing use: the reasons it is lawful (4 or 10 years) and evidence such as sworn affidavits
    from people with personal knowledge of the use, dated photographs and utility bills'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
- item: 'For section 73: why removal or variation of the condition is sought, and any other conditions
    to be discharged through the application'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: 'For section 73: a schedule of plans setting out existing and proposed'
  level: should
  required-if:
    application-type:
      in:
      - s73
  source-text: A schedule of plans setting out existing and proposed would be beneficial.
- item: 'For tree works or hedgerow removal: a detailed description of the works and the reasons for the
    works or removal'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
      - hedgerow-removal
- item: 'Waste Planning Statement, where applicable: how the facility meets sustainable waste management,
    drives waste up the waste hierarchy and does not undermine movement up the waste hierarchy (prevent,
    reuse, recycle, other recovery and disposal)'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: how the facility meets sustainable waste management, drives waste up the waste hierarchy
    and does not undermine movement up the waste hierarchy (prevent, reuse, recycle, other recovery and
    disposal);
- item: 'Waste Planning Statement, where applicable: how the facility meets the spatial strategy of the
    Somerset Waste Core Strategy'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: how the facility meets the spatial strategy of the Somerset Waste Core Strategy
- item: 'Waste Planning Statement, where applicable: the maximum annual capacity of the facility and the
