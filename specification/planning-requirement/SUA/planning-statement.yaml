  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: the maximum annual capacity of the facility and the types, quantities and sources of waste;
- item: 'Waste Planning Statement, where applicable: a statement of how the facility meets Somerset’s
    requirements, the need will need to be demonstrated if the proposal is not consistent with the Somerset
