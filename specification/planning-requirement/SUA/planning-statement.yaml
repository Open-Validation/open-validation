- item: 'Waste Planning Statement, where applicable: details of site management and monitoring procedures'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: details of site management and monitoring procedures; and
- item: 'Waste Planning Statement, where applicable: details of the restoration and aftercare proposed'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: details of the restoration and aftercare proposed.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 22, 32, 36, 44, 52, 61, 71, 74, 76, 80,
  116. For reserved matters it is ''Required, except if addressed under Outline permission'' and for tree
  works and hedgerow removal ''Required, unless already included on the application form'', so those show
  as ''check''. The general contents are what the glossary says the statement ''should contain''. Minerals
  and waste applications: from the council''s Minerals and Waste Validation Checklist (cover ''December
  2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 40. The M&W checklist''s ''Waste Planning Statement'', ''Required for all waste related applications'';
  its contents apply ''where applicable'', so they are ''should''.'
