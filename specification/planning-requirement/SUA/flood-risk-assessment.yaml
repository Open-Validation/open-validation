reference: flood-risk-assessment
local-authority: SUA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: near-watercourse
      value: true
      description: Works within 8 metres of a main river.
source-url: https://www.somerset.gov.uk/planning-buildings-and-land/information-requirements-for-planning-applications/
source-text: Flood Risk Assessment Required for development in Flood Zone 2 and 3 or works within 8 metres
  of a main river.
must-include:
- item: The Householder Flood Risk Assessment form, for householder applications
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'Audit (wrong_app_type): not only full planning; the source also applies it to householder, change
  of use, outline, reserved matters and s73 applications, and provides a householder FRA form.'
review-status: unverified
field-status: {}
