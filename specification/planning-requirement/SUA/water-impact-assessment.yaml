reference: water-impact-assessment
local-authority: SUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - approval-condition
      - prior-approval
  - site:
      in:
      - nutrient-neutrality-area
      description: The site is in the Somerset Levels and Moors Ramsar or River Axe SAC catchment.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential units (including tourist accommodation and traveller sites).
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
must-include:
- item: Nutrient Neutrality Assessment and Mitigation Strategy (NNAMS)
  level: must
- item: Habitat Regulations Assessment information
  level: must
- item: Phosphate Budget Calculator
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): nutrient neutrality in the Somerset Levels and Moors Ramsar
  and River Axe SAC catchments, for new residential units (including tourist accommodation and traveller
  sites), agricultural development that increases herd size, and commercial uses with overnight accommodation.
  It covers full, outline, reserved matters, s73 (where floorspace or drainage changes), pre-commencement
  discharges, retrospective applications, and prior approvals in the River Axe catchment only.'
review-status: unverified
field-status: {}
