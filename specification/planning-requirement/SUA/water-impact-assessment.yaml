reference: water-impact-assessment
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
        - reserved-matters
        - s73
        - pip
    - site:
        in:
        - nutrient-neutrality-area
        description: In the Somerset Levels and Moors Ramsar Site or River Axe SAC phosphate catchment.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential units.
      - condition:
          field: overnight-accommodation
          value: true
          description: Overnight accommodation (tourist accommodation, traveller sites, commercial).
      - discretionary
  - all:
    - application-type:
        in:
        - lbc
        - approval-condition
        - prior-approval
    - site:
        in:
        - nutrient-neutrality-area
        description: In a phosphate catchment.
    - discretionary
  - any:
    - any:
      - all:
        - application-type:
            in:
            - waste-dev
        - any:
          - condition:
              field: earthworks
              value: true
              description: The proposal involves significant ground works.
          - condition:
              field: landfill-development
              value: true
              description: The proposal is for landfill or the infilling of land with waste.
          - condition:
              field: dewatering-or-abstraction
              value: true
              description: The proposal involves dewatering or water abstraction.
      - all:
        - application-type:
            in:
            - reg-3
        - ref: major-development
        - condition:
            field: earthworks
            value: true
            description: The proposal involves significant ground works.
      - all:
        - application-type:
            in:
            - mineral-app
            - mineral-extraction
            - extraction-oil-gas
        - discretionary
    - all:
      - application-type:
          in:
          - mineral-app
          - mineral-extraction
          - extraction-oil-gas
          - waste-dev
      - site:
          in:
          - nutrient-neutrality-area
          description: In a phosphate catchment.
      - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: 'Conservation of Habitats and Species Regulations 2017; Nutrient Neutrality in Somerset: Guidance
  for Applicants'
source-text: Certain types of development in certain locations will need to provide evidence of levels
  of phosphates generated by the proposed development and the proposed phosphate mitigation strategy.
  ... Required for applications that add to phosphate loading in the Catchment areas within Somerset.
must-include:
- item: A shadow Habitats Regulations Assessment (sHRA) or a Nutrient Neutrality Assessment and Mitigation
    Strategy (NNAMS); only one is needed
  level: must
- item: A shadow HRA that the council can adopt (recommended)
  level: should
- item: Phosphate budget calculations made with the Somerset Phosphate Budget Calculator
  level: must
- item: Details of the proposed mitigation (if necessary)
  level: must
- item: Details of the maintenance and monitoring of the mitigation in perpetuity (at least 80 years)
  level: must
- item: 'Minerals and waste: hydrological and hydrogeological assessment covering existing groundwater
    levels, impacts on existing water levels, and mitigation and management of those impacts'
  level: must
  required-if:
    any:
    - all:
      - application-type:
          in:
          - waste-dev
      - any:
        - condition:
            field: earthworks
            value: true
            description: The proposal involves significant ground works.
        - condition:
            field: landfill-development
            value: true
            description: The proposal is for landfill or the infilling of land with waste.
        - condition:
            field: dewatering-or-abstraction
            value: true
            description: The proposal involves dewatering or water abstraction.
    - all:
      - application-type:
          in:
          - reg-3
      - ref: major-development
      - condition:
          field: earthworks
          value: true
          description: The proposal involves significant ground works.
    - all:
      - application-type:
          in:
          - mineral-app
          - mineral-extraction
          - extraction-oil-gas
      - discretionary
  source-text: 'All applications should include: • details of existing groundwater levels; • impacts of
    the development on existing water levels; • mitigation measures and management of such impacts; and'
- item: 'Minerals and waste: in a groundwater source protection zone, a risk assessment of the impact
    on water quality and resources'
  level: must
  required-if:
    all:
    - any:
      - all:
        - application-type:
            in:
            - waste-dev
        - any:
          - condition:
              field: earthworks
              value: true
              description: The proposal involves significant ground works.
          - condition:
              field: landfill-development
              value: true
              description: The proposal is for landfill or the infilling of land with waste.
          - condition:
              field: dewatering-or-abstraction
              value: true
              description: The proposal involves dewatering or water abstraction.
      - all:
        - application-type:
            in:
            - reg-3
        - ref: major-development
        - condition:
            field: earthworks
            value: true
            description: The proposal involves significant ground works.
      - all:
        - application-type:
            in:
            - mineral-app
            - mineral-extraction
            - extraction-oil-gas
        - discretionary
    - site:
        in:
        - source-protection-zone
        description: In a groundwater source protection zone.
  source-text: for applications within a groundwater source protection zone, a risk assessment will be
    required considering the impact on water quality and resources.
- item: 'Dewatering or abstraction: calculations of the extent and volumes of dewatering; topography,
    surface drainage, geology and borehole details (including licensed and unlicensed abstractions); the
    natural water table, its depth and source catchment'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: The proposal involves dewatering or water abstraction.
  source-text: 'For applications involving dewatering or abstraction, the assessment should also include:
    • calculations of the extent and volumes of dewatering;'
- item: 'Dewatering or abstraction: potential impact on any wetland SSSI, and evidence that third parties
    will not be affected (with mitigation where public or private water supplies, water bodies or watercourses
    could be affected)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: The proposal involves dewatering or water abstraction.
  source-text: consideration of the potential impact upon any wetland SSSI;
- item: 'Dewatering or abstraction: proposed methods of dewatering and water disposal, pollution control
    to protect ground and surface water, drainage and flood control, and monitoring (including settlement
    lagoons)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: The proposal involves dewatering or water abstraction.
  source-text: details of proposed methods of dewatering and proposed methods of water disposal;
- item: 'Dewatering or abstraction: monitoring of the existing water regime for at least 12 months before
    submission, where necessary'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: The proposal involves dewatering or water abstraction.
    - discretionary
  source-text: Monitoring of the existing water regime for at least 12 months prior to submission of the
    application may be necessary in order to ensure that surface and ground water can be safeguarded.
- item: 'Minerals and waste in a phosphate catchment: phosphate budget using the Somerset Phosphate Budget
    Calculator'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - site:
        in:
        - nutrient-neutrality-area
        description: In a phosphate catchment.
    - discretionary
  source-text: 'Required for certain types of applications: Somerset Phosphate Budget Calculator'
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 9-11, 24-25, 27-29, 38-39, 46-47, 54-55,
  62-64, 68, 80-82, 85, 95, 97. The list''s ''Phosphate information'' (Nutrient Neutrality). Affected
  development: new residential units (including overnight tourist accommodation and traveller sites),
  agricultural development likely to increase herd size, commercial development with overnight accommodation,
  anaerobic digesters and possibly some tourist attractions; the non-residential cases show as ''check''.
  Required for change of use, full, outline, reserved matters, section 73 and permission in principle.
  The list also names discharge of pre-commencement conditions, prior approvals in the River Axe catchment
  and a Habitat Regulations Assessment for listed building consent (''Required for certain types of applications''),
  shown as ''check''. Small package treatment plant schemes meeting the Interim Guidelines on Small Scale
  Thresholds only need a NNAMS. A P-credit Reservation Notice or Allocation Certificate ''is not a validation
  requirement''. Minerals and waste applications: from the council''s Minerals and Waste Validation Checklist
  (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 26-27, 33. The M&W checklist''s ''Hydrological and Hydrogeological Assessments'' (''For waste applications
  that involve significant ground works or the infilling of land, dewatering or abstraction and major
  Regulation 3 applications which require significant ground works'') and ''Phosphate'' rows. Mineral
  applications and phosphate cases show as ''check''. Uses new fields landfill-development and dewatering-or-abstraction.'
