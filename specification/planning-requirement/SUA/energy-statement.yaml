notes: From the council's list (published 1 April 2025), page 97-98. From 'Sustainability Checklist and
  Energy Statement' under Other Supporting Information. Required for all development in the former Taunton
  Deane area; in the former West Somerset area the council only 'encourage[s]' it 'In appropriate cases',
