policy: Taunton Deane Core Strategy policy DM5; West Somerset Local Plan to 2032 policy NH13; West Somerset
  Local Plan 2006 saved policy BD/9; Somerset Climate Emergency Strategy; Climate Change Act 2008; NPPF
source-text: Required for all development, including extensions and conversions in the former Taunton
  Deane area to demonstrate how measures required by policy DM5 of the Taunton Deane Core Strategy have
  been incorporated. ... In appropriate cases the Council will be in a position to encourage applicants
  in the former West Somerset area to formulate proposals responding to policy NH13 of the West Somerset
  Local Plan to 2032 and saved policy BD/9 of the West Somerset Local Plan 2006, which reflect the requirements
  of policy DM5.
must-include:
- item: How the measures required by Taunton Deane Core Strategy policy DM5 have been incorporated
  level: must
