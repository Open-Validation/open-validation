reference: habitat-baseline
local-authority: SUA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
  Article 7; Biodiversity Gain Requirements (Exemptions) Regulations 2024; Somerset BNG Guidance Note
source-text: In addition to the national minimum requirements, Somerset Council requires sufficient information
  about the proposed strategy for delivering at least 10% BNG (including the expected balance between
  on-site, off-site and credits) to be submitted as part of a BNG-liable planning application. ... • BNG
  plans and drawings
must-include:
- item: An on-site baseline habitat plan, to scale and following the checklist's site plan conventions
  level: must
- item: All habitats in the Metric on the relevant date, including any irreplaceable habitat, so the size
    and location of habitat parcels can be understood
  level: must
- item: 'Where off-site units are to be secured through a bespoke off-site solution in the application:
    an off-site baseline habitat plan'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Off-site gains secured as part of the application.
- item: 'Minerals and waste: GIS data providing the same information as the BNG plans and drawings'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the biodiversity gain condition.
  source-text: GIS data (providing same information as BNG plans and drawings)
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 22-23, 29-30, 39-40, 45-46, 55-56, 90.
  Shown for developments subject to the biodiversity gain condition: householder and other exempt applications
  are exempt by law (the list includes BNG in the change of use, full and outline tables). Contents are
  from the council''s BNG validation requirements (Appendix 4 of the Somerset BNG Guidance Note, adopted
  as an addendum to the validation checklists: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EdFbqbFh8VxEhxlAqGc7aZQBjLZ3FiAomv9-WXTOCUoJyg?e=ClG4O6).
  The BNG Statement, Declaration Form and SHEP/HEP Metric are listed as unmapped. Minerals and waste applications:
  from the council''s Minerals and Waste Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 31-33. The M&W checklist marks the BNG Statement ''always required'' and adds that ''Most minerals
  and waste applications will likely be phased developments''; the rule stays the biodiversity gain condition,
  as the law sets.'
review-status: unverified
field-status: {}
