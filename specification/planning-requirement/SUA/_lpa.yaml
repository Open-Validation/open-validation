  status: current
submission-standards:
- item: Where an applicant considers a required item is not applicable, an explanation that can be readily
    identified is provided, otherwise the application could be made invalid
  level: must
- item: Personal or sensitive personal data submitted in a separate document, not cross-referenced in
    documents that can be made public, and clearly marked as confidential
  level: should
- item: Online submission through the Planning Portal is preferred, following the Planning Portal guidance
    on file sizes
  level: should
- item: Direct submissions by WeTransfer or Dropbox, or by email to the planning mailbox (west, east,
    north or south) for the area where the site is
  level: should
- item: An application accompanied by a schedule or list of submitted documents
  level: should
- item: Ordnance Survey map extracts carry the copyright acknowledgement and the licence number; not a
    Land Registry document; not reused for multiple applications; not a photocopy or screen grab (such
    as Google Maps); hand-drawn maps not copied from existing OS mapping
  level: must
- item: Drawings have a unique drawing number, which is used in the decision notice (plans without a number
    are numbered by the council)
  level: must
- item: Drawings indicate the original paper size (A4, A3 etc.) for printing and are uploaded or printed
    in colour where needed
  level: must
