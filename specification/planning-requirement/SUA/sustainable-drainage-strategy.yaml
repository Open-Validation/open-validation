notes: 'From the council''s list (published 1 April 2025), page 36, 52, 92, 119. ''Surface Water Drainage
  Assessment'' is required for full and outline major applications. Under Other Supporting Information
  a ''Foul and Surface Water Drainage Assessment'' is needed where there is potentially an impact, ''determined
  on a site by site basis'', so other cases show as ''check''. It ''can be combined with a FRA''. Minerals
  and waste applications: from the council''s Minerals and Waste Validation Checklist (cover ''December
  2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 28. The M&W checklist''s ''Drainage Plan and Strategy'', marked ''always required''.'
