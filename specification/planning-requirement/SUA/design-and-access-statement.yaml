reference: design-and-access-statement
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - any:
      - site:
          in:
          - listed-building
          description: The building is listed.
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: The building(s) have a floorspace of 100 sq m or more.
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: An increase in floor space of 100 sq m or more.
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - ref: major-development
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
  Article 9; Planning Practice Guidance (Design); Somerset Placemaking Principles
source-text: 'Required for development within a Conservation Area (this can be combined with the Heritage
  Statement) comprising: • One or more dwellings • Increase in floor space of 100m² or more ... Required,
  unless the development is for an engineering operation only'
must-include:
- item: Addresses the Somerset Placemaking Principles
  level: must
confidence: medium
notes: From the council's list (published 1 April 2025), page 19, 32, 35, 44, 51, 61, 68, 108. Major applications
  need one 'unless the development is for an engineering operation only'. Reserved matters ('except if
  ... addressed under Outline permission') shows as 'check'.
review-status: unverified
field-status: {}
