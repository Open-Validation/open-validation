reference: elevation-existing
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - hh
      - advertising
      - lbc
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - technical-details-consent
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes the elevations.
  - all:
    - application-type:
        in:
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes the elevations.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  local requirement
source-text: Required for changes to elevations – for further details please see Elevation Drawings ...
  Required, except if matters are reserved – for further details please see Elevation Drawings ... Required,
  this will be determined on a case by case basis if changes to elevations are proposed
must-include:
- item: At an identified measurable scale of 1:50 or 1:100, with a scale bar
  level: must
- item: Larger scale drawings for listed buildings, where required
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: The building is listed.
- item: All elevations shown in full unless otherwise agreed
  level: must
- item: Any other buildings attached to the elevation and, where possible, the main features of the adjoining
    building (such as doors and windows on the same elevation of an adjoining terraced or semi-detached
    dwelling)
  level: must
- item: Existing elevations clearly identified as North, South, East and West, with all existing door
    and window detailing
  level: must
- item: 'Where the access is new or changing: existing and proposed elevations of the access arrangements
    (street scenes) clearly showing the changes to the access, such as works to boundary walls'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - condition:
        field: new-vehicle-access
        value: true
        description: A new or changed access is proposed (for example off-road parking).
- item: 'Minerals and waste: buildings or walls to be demolished clearly shown, and the relationship to
    nearby buildings including the position of openings'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
  source-text: Where existing buildings or walls are to be demolished these should be clearly shown.
- item: 'Minerals and waste: all sides of the proposal shown, including blank elevations'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
  source-text: All sides of the proposal must be shown
- item: 'Minerals and waste: no disclaimer such as ''do not scale'' or ''not to scale''; plans consistent
    with each other'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
  source-text: Plans will be checked for consistency; any significant discrepancies will result in the
    application being invalid. Any plans marked with a disclaimer (such as “do not scale” or “not to scale”)
    will result in the application not being valid.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 14-15, 20, 26, 33, 42, 49, 58-59, 66-67,
  70, 73, 77, 101, 103. Required for every householder, advertisement and listed building consent application
  and for full major applications; for change of use, full minor and lawful development certificates only
  where the elevations change. For outline applications it is ''Required, except if matters are reserved'',
  for reserved matters it depends on the matters applied for (appearance, scale), and for section 73 it
  is decided case by case, so those show as ''check''. Minerals and waste applications: from the council''s
  Minerals and Waste Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 11-12.'
review-status: unverified
field-status: {}
