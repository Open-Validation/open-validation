reference: waste-management-plan
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
  - all:
    - application-type:
        in:
        - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Somerset Waste Core Strategy policies WCS1 and WCS2; National Planning Policy for Waste
source-text: SWMS for Minor developments SWMP for Major developments
must-include:
- item: A Site Waste Management Statement (SWMS) for minor development
  level: must
- item: A Site Waste Management Plan (SWMP) for major development
  level: must
  required-if:
    ref: major-development
- item: 'For large-scale major projects (200 or more dwellings or more than 10,000 sq m): a site waste
    management strategy in line with Waste Core Strategy policy WCS1'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 200
        description: 200 or more dwellings.
    - condition:
        field: floorspace
        operator: '>'
        value: 10000
        description: More than 10,000 sq m.
  source-text: A site waste management strategy is needed for large-scale major projects (200 or more
    dwellings or >10,000m2)
- item: How the development will plan for waste prevention and the sustainable management of wastes during
    design and construction
  level: should
- item: 'Minerals and waste: a site waste management statement for minor development (fewer than 10 dwellings
    or less than 1,000 sq m)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - discretionary
  source-text: A site waste management statement for the construction of minor development (less than
    10 dwellings or where the floorspace to be created by the development is less than 1000m2); or
- item: 'Minerals and waste: a site waste management plan for 10 or more dwellings or 1,000 sq m or more'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more created.
  source-text: A site waste management plan for the construction of 10 or more dwellings or where the
    floor space to be created by the development is 1000m2 or more; or
- item: 'Minerals and waste: a site waste management strategy for large-scale major projects (200 or more
    dwellings or more than 10,000 sq m) or multi-site projects'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 200
          description: 200 or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 10000
          description: The development covers more than 10,000 sq m.
      - discretionary
  source-text: A site waste management strategy for the construction of large-scale major projects (200
    or more dwellings or where the development covers more than 10,000 m2) or for multi-site projects
    within the same application.
- item: 'Minerals and waste: takes account of Waste Core Strategy policy WCS2 on separation, temporary
    storage and collection of waste'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - discretionary
  source-text: The waste audit should also take account of Policy WSC2 in regard to designing for the
    effective separation, temporary storage and collection of waste.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 25, 31, 41, 48, 56-57, 118. Required for
  full and outline applications; marked ''may be required'' for change of use, so ''check'' there. Minerals
  and waste applications: from the council''s Minerals and Waste Validation Checklist (cover ''December
  2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 41-42. The M&W checklist''s ''Waste Audit Statement'' (''Dependent upon the scale of the proposed
  development''), marked ''sometimes required'', so it shows as ''check''.'
review-status: unverified
field-status: {}
