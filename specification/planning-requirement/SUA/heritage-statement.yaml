reference: heritage-statement
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - change-of-use
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - any:
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          - locally-listed-building
          - scheduled-monument
          description: 'Works to or affecting a heritage asset: in a conservation area, to or next to
            a listed or locally listed building, or a scheduled monument.'
      - site:
          in:
          - archaeological-priority-area
          description: An area of high archaeological potential or an archaeological site.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        - scheduled-monument
        description: Works within a conservation area, to or next to a listed building, or a scheduled
          monument.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: NPPF; Local Plans of the former district areas
source-text: Required for works to or affecting heritage assets (eg. within a Conservation Area, works
  adjacent or to a Listed Building or locally listed building, Scheduled Monument or proposals that have
  archaeological implications. ... Required, this must include a full schedule of the proposed works.
must-include:
- item: 'For listed building consent: a full schedule of the proposed works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The significance of any heritage assets affected, including any contribution made by their setting,
    in proportion to the assets' importance
  level: must
- item: The relevant historic environment record consulted and the heritage assets assessed using appropriate
    expertise where necessary
  level: should
  source-text: As a minimum the relevant historic environment record should have been consulted and the
    heritage assets assessed using appropriate expertise where necessary.
- item: 'Minerals and waste: required for works within a conservation area, to or next to a listed building,
    or a scheduled monument'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        - scheduled-monument
        description: Works within a conservation area, to or next to a listed building, or a scheduled
          monument.
  source-text: Required for works within a Conservation Area, works adjacent or to a Listed Building,
    Scheduled Ancient Monument.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 18, 21, 31, 35, 43, 50-51, 60, 68, 79,
  110-111. Required for every listed building consent. For major applications the list adds effects on
  settings ''in some instances further away, according to the scale and nature of the development'', and
  section 73 applies only to changes on this issue, so those show as ''check''. It can be combined with
  the Design and Access Statement. Minerals and waste applications: from the council''s Minerals and Waste
  Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 24.'
