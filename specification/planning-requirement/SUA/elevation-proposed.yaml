reference: elevation-proposed
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - hh
      - advertising
      - lbc
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - technical-details-consent
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes the elevations.
  - all:
    - application-type:
        in:
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: external-alterations
        value: true
        description: The proposal changes the elevations.
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  local requirement
source-text: Required for changes to elevations – for further details please see Elevation Drawings ...
  Required, except if matters are reserved – for further details please see Elevation Drawings ... Required,
  this will be determined on a case by case basis if changes to elevations are proposed
must-include:
- item: At an identified measurable scale of 1:50 or 1:100, with a scale bar
  level: must
- item: Larger scale drawings for listed buildings, where required
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: The building is listed.
- item: All elevations shown in full unless otherwise agreed
  level: must
- item: Any other buildings attached to the elevation and, where possible, the main features of the adjoining
    building (such as doors and windows on the same elevation of an adjoining terraced or semi-detached
    dwelling)
  level: must
- item: Proposed building materials, style and finish of the building and of windows and doors, and the
    particulars given in the application form (such as materials)
  level: must
- item: Proposed changes shown on each elevation; an elevation with no changes shown once, confirmed as
    existing and proposed; part elevations allowed for inset areas
  level: must
- item: Vehicle charging points
  level: must
- item: Advertisement drawings showing colours, materials, dimensions, the means of illumination and the
    extent of any internal illumination (including luminance level)
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Advertisement drawings are required showing colours/materials/dimensions means of illumination
    and extent of any internal illumination for advertisements (including luminance level).
- item: 'Where the access is new or changing: existing and proposed elevations of the access arrangements
    (street scenes) clearly showing the changes to the access, such as works to boundary walls'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - condition:
        field: new-vehicle-access
        value: true
        description: A new or changed access is proposed (for example off-road parking).
- item: Street scene at a scale of 1:100 or 1:200
  level: should
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - condition:
        field: new-vehicle-access
        value: true
        description: A new or changed access is proposed (for example off-road parking).
- item: Street scene accurately shows the height and outline of neighbouring buildings, the position and
    size of their windows and doors, any differences in levels, and written dimensions for gaps between
    buildings
  level: should
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - condition:
        field: new-vehicle-access
        value: true
        description: A new or changed access is proposed (for example off-road parking).
- item: Street scene states the direction it faces (for example 'street scene viewed from … Road')
  level: should
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - condition:
        field: new-vehicle-access
        value: true
        description: A new or changed access is proposed (for example off-road parking).
confidence: medium
notes: From the council's list (published 1 April 2025), page 14-15, 20, 26, 33, 42, 49, 58-59, 66-67,
  70, 73, 77, 101, 103. Required for every householder, advertisement and listed building consent application
  and for full major applications; for change of use, full minor and lawful development certificates only
  where the elevations change. For outline applications it is 'Required, except if matters are reserved',
  for reserved matters it depends on the matters applied for (appearance, scale), and for section 73 it
  is decided case by case, so those show as 'check'. The street scene contents are what the list says
  street scenes 'should' show (page 103).
