source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017 (as amended); Conservation
  of Habitats and Species Regulations 2017
source-text: Compulsory for all development listed in Schedule 1 and for all development listed in Schedule
  2 screened likely to have significant effects on the environment.
must-include:
- item: Where a Habitats Regulations Assessment is also needed, the HRA and the EIA co-ordinated
  level: must
- item: 'For section 73 applications for EIA development: an Environmental Statement or ES addendum'
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: Whether changes to the original ES are required or not, an ES/ES addendum must be submitted
    with a section 73 application for EIA development.
- item: 'Minerals and waste: where HRA is also required, the HRA and the EIA co-ordinated'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: Where a development is subject to EIA and there is also a requirement to carry out a Habitats
    Regulation Assessment (HRA), where appropriate, the HRA and the EIA must be co-ordinated.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 21, 34, 50, 60, 78-79. For reserved matters,
  ''Where appropriate all reserved matters will be screened by the LPA for EIA and HRA.'' Minerals and
  waste applications: from the council''s Minerals and Waste Validation Checklist (cover ''December 2024''),
  https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 17.'
