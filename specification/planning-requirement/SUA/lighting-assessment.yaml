reference: lighting-assessment
local-authority: SUA
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes a significant amount of external lighting.
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The advertisement is illuminated.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Local Plans of the former district areas
source-text: all applications including/for floodlighting, or a significant amount of external lighting
  ... Lighting assessments will also be required to detail the level of luminance for all advertisements.
must-include:
- item: Details of the external lighting and the hours it would be switched on
  level: must
- item: A layout plan with beam orientation and a schedule of the equipment
  level: must
- item: The expected level of luminance and glare
  level: must
- item: 'For advertisements: the level of luminance'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For floodlights for an area (such as a sports pitch): a light contour diagram on a layout of
    the facility in its context, showing projected lux levels including backlight, superimposed on a topographical
    survey where ground levels differ'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
confidence: medium
notes: From the council's list (published 1 April 2025), page 93. Under 'Other Supporting Information',
  which the list says 'should ideally be provided at submission' and otherwise 'may be requested during
  the course of the application'. Whether external lighting is 'significant' is a judgement, so that part
  shows as 'check'.
review-status: unverified
field-status: {}
