reference: location-plan
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - hh
      - change-of-use
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - reserved-matters
      - advertising
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - ldc-proposed-work-lb
      - consent-under-tpo
      - notice-trees-in-con-area
      - hedgerow-removal
      - s73
      - non-material-amendment
      - pip
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Required – for further details please see Location Plan
must-include:
- item: Must not be a Land Registry document/plan
  level: must
- item: As up to date as possible (within the last two years)
  level: must
- item: At an identified measurable scale of 1:1250 or 1:2500, with a scale bar
  level: must
- item: Clearly marked with the direction of North
  level: must
- item: The full site, all site boundaries and adjoining properties (numbered or named), with enough roads
    and/or buildings to identify the land
  level: must
- item: The application site and all land needed to carry out the development (such as access to the site
    from the road) outlined in a continuous red line
  level: must
- item: 'The red line takes in the domestic curtilage: dwelling, private gardens, garaging, driveway and
    access from the public highway'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Any other land in the applicant's ownership or control close to or adjacent to the site outlined
    in blue
  level: must
- item: An authorised copier's licence number with the appropriate copyright acknowledgements
  level: must
- item: Does not encroach outside the outline permission red line
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
  source-text: This must not encroach outside of the Outline permission red line.
- item: 'Minerals and waste: an up-to-date map, preferably on an Ordnance Survey base, ideally at 1:1250
    or 1:2500'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: All applications must include a location plan an up-to-date map (preferably from an Ordnance
    Survey base) ideally at a metric scale of 1:1250 or 1:2500.
- item: 'Minerals and waste: at least two named roads and surrounding buildings, and any public rights
    of way affected (if known)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: Plans should show (where possible) at least two named roads and any surrounding buildings.
    Any other public rights of way affected (if known) should also be shown.
- item: 'Minerals and waste: the red line includes land for access from a public highway, visibility splays,
    landscaping, car parking and open areas around buildings'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: It should include all land necessary to carry out the proposed development including land
    required for access to the site from a public highway, visibility splays, landscaping, car parking
    and open areas around buildings.
- item: 'Minerals and waste: clearly titled, with a unique reference number, signed and dated'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: Plans should be clearly titled and given a unique reference number, signed and dated.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 13, 58, 77, 83, 85, 99-100. For section
  73 and non-material amendment applications the plan ''can be that same as the original application,
  providing you own the copyright on the plan''. Drawing number, paper size and colour rules are in the
  council''s submission standards. Minerals and waste applications: from the council''s Minerals and Waste
  Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 8.'
review-status: unverified
field-status: {}
