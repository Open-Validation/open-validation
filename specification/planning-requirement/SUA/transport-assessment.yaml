reference: transport-assessment
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - ref: major-development
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - any:
      - condition:
          field: new-vehicle-access
          value: true
          description: A new or changed access is proposed (for example off-road parking).
      - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
        - s73
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: new-vehicle-access
          value: true
          description: The laying out or construction of a highway or access.
      - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Local Plans of the former district areas; Somerset Placemaking Principles
source-text: 'Required for Development that is likely to: • Result in a material increase or change in
  traffic; • Affect a classified road or proposed highway; • Involve the laying out or construction of
  a highway or access; • Impact on other modes of transport; Must address the Somerset Placemaking Principles'
must-include:
- item: Addresses the Somerset Placemaking Principles
  level: must
- item: Car parking and vehicle servicing in line with the parking standards in the council's Parking
    Strategy
  level: should
- item: 'Minerals and waste: required where the development is likely to increase or change traffic, affect
    a classified road or proposed highway, or involve laying out a highway or access'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: new-vehicle-access
          value: true
          description: The laying out or construction of a highway or access.
      - discretionary
  source-text: 'Required for development that is likely to: • Result in a material increase or change
    in the traffic • Affect a classified road or proposed highway • Involve the laying out or construction
    of a highway or access.'
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 22, 32, 36, 44, 52, 59, 62, 80, 95, 115.
  Required for every full and outline major application. For other types, only a new highway or access
  is a clear trigger; a material increase in traffic, effects on a classified road and impacts on other
  modes show as ''check'', as do reserved matters and section 73. Minerals and waste applications: from
  the council''s Minerals and Waste Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 30. ''Transport Assessment / Statement (Minor Developments)''. Only a new highway or access is
  a clear trigger; the rest shows as ''check''.'
