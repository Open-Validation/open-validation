reference: bng-metric
local-authority: SUA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
  Article 7; Biodiversity Gain Requirements (Exemptions) Regulations 2024; Somerset BNG Guidance Note
source-text: In addition to the national minimum requirements, Somerset Council requires sufficient information
  about the proposed strategy for delivering at least 10% BNG (including the expected balance between
  on-site, off-site and credits) to be submitted as part of a BNG-liable planning application. ... • Completed
  Biodiversity Metric (Macros disabled Excel version and PDF)
must-include:
- item: The latest published statutory Metric appropriate for the size and type of development
  level: must
- item: The proposed post-development biodiversity value of the on-site habitat, to the extent known
  level: must
- item: Where available, any information about potential off-site biodiversity units being targeted
  level: must
- item: Submitted both as a Microsoft Excel workbook (macros disabled) and as a PDF
  level: must
- item: No red flag errors on trading rules or on-site elements
  level: must
  source-text: Any red flag errors relating to non-compliance with trading rules or on-site elements will
    result in the Metric being returned and the application not being validated.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 22-23, 29-30, 39-40, 45-46, 55-56, 90.
  Shown for developments subject to the biodiversity gain condition: householder and other exempt applications
  are exempt by law (the list includes BNG in the change of use, full and outline tables). Contents are
  from the council''s BNG validation requirements (Appendix 4 of the Somerset BNG Guidance Note, adopted
  as an addendum to the validation checklists: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EdFbqbFh8VxEhxlAqGc7aZQBjLZ3FiAomv9-WXTOCUoJyg?e=ClG4O6).
  The BNG Statement, Declaration Form and SHEP/HEP Metric are listed as unmapped.'
