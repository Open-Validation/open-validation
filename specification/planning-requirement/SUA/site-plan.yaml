reference: site-plan
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - hh
      - change-of-use
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - reserved-matters
      - advertising
      - lbc
      - ldc-prospective-use
      - ldc-proposed-work-lb
      - s73
      - prior-approval
  - all:
    - application-type:
        in:
        - consent-under-tpo
        - notice-trees-in-con-area
        - hedgerow-removal
    - discretionary
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Required – for further details please see Block / Site Plan ... A plan indicating the site
  and showing the proposed development.
must-include:
- item: As up to date as possible (within the last two years)
  level: must
- item: At an identified measurable scale of 1:200 or 1:500, with a scale bar
  level: must
- item: Clearly marked with the direction of North
  level: must
- item: Clearly shows the proposed development, and new buildings in context with adjacent buildings
  level: must
- item: All site boundaries, existing buildings, roads, tracks, footpaths, public rights of way, walls,
    banks and historic features, ponds, watercourses, and proposed boundary treatments (including removal
    and/or retention)
  level: must
- item: Any buildings to be demolished
  level: must
- item: Existing and proposed parking, access to the highway and access arrangements, and the extent and
    type of any hard surfacing
  level: must
- item: Details of recycling and waste storage
  level: must
- item: The position of all trees and hedges that could influence or be affected by the development, on
    or near the site, with proposals for removal and/or retention (including boundary hedges)
  level: must
- item: An authorised copier's licence number with the appropriate copyright acknowledgements
  level: must
- item: The same red outline as the original application
  level: must
  required-if:
    application-type:
      in:
      - s73
  source-text: This must be the same red outline as the original application for it to be accepted
- item: 'Minerals and waste: at 1:200 or 1:500 (1:1000 may be permissible for larger sites)'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: This should be drawn at a scale of at 1:200 or 1:500 (for larger sites it may be permissible
    for a 1:1000 scale)
- item: 'Minerals: a site layout plan showing faces, processing areas, welfare and workshop or other buildings'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
  source-text: Block plan not relevant for most mineral development but a site layout plan showing faces,
    processing areas, welfare and workshop or other buildings is required
- item: 'Minerals and waste: the development in relation to the site boundaries and other buildings, with
    written dimensions including to the boundaries'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: The proposed development in relation to the site boundaries and other existing buildings
    on the site, with written dimensions including those to the boundaries;
- item: 'Minerals and waste: species, position and spread of all trees within 12 metres of any proposed
    buildings or operations'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: The species, position and spread of all trees within 12 metres of any proposed buildings
    or operations;
- item: 'Minerals and waste: location and identity of fixed and mobile plant'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: The location and identity of fixed and mobile plant associated with the development
- item: 'Minerals and waste: any residential development associated with, or owned by, the developer'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: It is also helpful to identify residential development associated with, or in the ownership
    of the developer
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 14, 75, 77, 84, 100. For prior approvals
  the list only asks for ''A plan indicating the site and showing the proposed development'' (a plan to
  an identified scale ''will assist''); the contents listed here are for the other application types.
  For tree works and hedgerow removal it is marked ''may be required'', so it shows as ''check''. Minerals
  and waste applications: from the council''s Minerals and Waste Validation Checklist (cover ''December
  2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 9-10.'
review-status: unverified
field-status: {}
