reference: application-form
local-authority: SUA
required-if:
  always: true
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications must be submitted on the appropriate Standard Application Form, it must
  be signed and dated and all questions on the form must be answered fully and accurately.
must-include:
- item: Signed and dated, with all questions answered fully and accurately
  level: must
- item: The relevant ownership certificate (A, B, C or D) completed, with the correct notice served on
    any other owners or agricultural tenants
  level: must
  source-text: An application is not valid, and therefore cannot be determined by the local planning authority,
    unless the relevant certificate (either A, B, C or D) has been completed.
confidence: medium
notes: From the council's list (published 1 April 2025), page 8, 13, 83, 114-115. For a discharge of condition,
  'A covering letter is acceptable in place of an application form' (page 83). The fee must also be paid
  where one applies.
