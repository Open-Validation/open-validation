reference: application-form
local-authority: SUA
required-if:
  always: true
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications must be submitted on the appropriate Standard Application Form, it must
  be signed and dated and all questions on the form must be answered fully and accurately.
must-include:
- item: Signed and dated, with all questions answered fully and accurately
  level: must
- item: The relevant ownership certificate (A, B, C or D) completed, with the correct notice served on
    any other owners or agricultural tenants
  level: must
  source-text: An application is not valid, and therefore cannot be determined by the local planning authority,
    unless the relevant certificate (either A, B, C or D) has been completed.
- item: 'Minerals and waste: all relevant sections completed; paper copies signed (typed signatures accepted
    online)'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  source-text: Please make sure you complete all the relevant sections; Paper copies - make sure that
    all copies are signed. Online copies – typed signatures are accepted.
- item: 'Minerals applications: on the council''s own form, not through the Planning Portal'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
  source-text: It should be noted that the planning portal does not accept Minerals applications – the
    required forms are accessible here
- item: 'Waste applications: on the standard planning application forms (1APP)'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: For Waste applications you are required to use the standard planning application forms
    (‘1APP form’)
- item: 'Onshore oil and gas: section 6 of the application form completed (phase of development, brief
    description, quantity (m3), period of permission, location of hydrocarbon licence block, surface area
    (ha), whether an ES is attached)'
  level: must
  required-if:
    application-type:
      in:
      - extraction-oil-gas
  source-text: 'General requirements covered in section 6 of the application form for onshore oil and
    gas development. This includes: - What phase of development - Brief description of development - Quantity
    (m3) - Period of permission - Location of hydrocarbon licence block - Surface area (ha) - If an ES
    attached to the application.'
- item: 'Onshore oil and gas: how the applicant will engage with local communities during the operational
    life of the site'
  level: must
  required-if:
    application-type:
      in:
      - extraction-oil-gas
  source-text: An applicant must outline how they intend to engage with local communities during the operational
    life of the site.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 8, 13, 83, 114-115. For a discharge of
