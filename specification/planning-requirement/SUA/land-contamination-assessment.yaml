reference: land-contamination-assessment
local-authority: SUA
required-if:
  any:
  - all:
    - site:
        in:
        - contaminated-land
        description: Previous or suspected contaminative use at the site.
    - any:
      - condition:
          field: ground-disturbance
          value: true
          description: Operational development that would disturb the ground or groundwater regime.
      - condition:
          field: sensitive-end-use
          value: true
          description: A vulnerable use where human health may be impacted.
  - all:
    - application-type:
        in:
        - reserved-matters
        - s73
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: NPPF; Local Plans of the former district areas
source-text: 'Required for application sites where there has been a previous or suspected contaminative
  use at the site AND: • Operational development is proposed where there would be disturbance to the ground
  or groundwater regime AND/OR • A vulnerable use is proposed where human health may be impacted'
confidence: medium
notes: From the council's list (published 1 April 2025), page 37, 52-53, 92, 107. The list's 'Contaminated
  Land Report (CLR)'. Reserved matters and section 73 (changes on this issue) show as 'check'.
review-status: unverified
field-status: {}
