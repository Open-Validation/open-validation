reference: fire-statement
local-authority: SUA
required-if:
  all:
  - application-type:
      in:
      - full
      - technical-details-consent
      - outline
      - outline-some
      - outline-all
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
  Article 9A (national requirement)
source-text: 'Required for proposals for buildings of: • Two or more dwellings or educational accommodation
  and • Meet the height condition of 18m or more in height, or 7 or more storeys'
confidence: medium
notes: From the council's list (published 1 April 2025), page 41, 57, 64. Listed in the full major, outline
  major and reserved matters tables; the national requirement applies to any such building.
review-status: unverified
field-status: {}
