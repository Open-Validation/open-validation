reference: section-existing
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change of levels within the site is proposed (for example a building part cut into
          the ground).
  - all:
    - application-type:
        in:
        - outline
        - outline-some
        - outline-all
        - reserved-matters
        - lbc
    - discretionary
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change of levels within the site is proposed (for example a building part cut into
          the ground).
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change of levels within the site is proposed (for example a building part cut into
          the ground).
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: A change in ground levels.
      - condition:
          field: building-works
          value: true
          description: Buildings or structures are involved in the application.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Local requirement
source-text: Required if there is proposed to be a change of levels within the site i.e. building part
  cut into the ground ... Required, if topography is sloping, this will be determined on a case by case
  basis
must-include:
- item: At an identified measurable scale (1:100 or 1:200) appropriate to the scale of the development,
    with a scale bar
  level: must
- item: Cross section(s) through the proposed building(s), structure(s) or site
  level: must
- item: Existing and proposed levels with reference to an off-site fixed datum point
  level: must
- item: 'For listed buildings: new details (such as doors, shop-fronts, panelling, fireplaces, plaster
    moulding and other decorative details) at a scale of not less than 1:20; for windows, 1:20 and 1:1
    sections of reveals and glazing bars'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed buildings: details of the existing and proposed alterations'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Minerals and waste: existing and finished levels, related to a fixed datum point off site, and
    how proposed buildings relate to existing site levels and neighbouring development'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: A change in ground levels.
      - condition:
          field: building-works
          value: true
          description: Buildings or structures are involved in the application.
  source-text: In all cases where a proposal involves a change in ground levels, drawings should be submitted
    to show both existing and finished levels.
- item: 'Minerals and waste: cross section(s) through the proposed building(s) at 1:50 or 1:100'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
  source-text: Plans drawn at a scale of 1:50 or 1:100 showing a cross section(s) through the proposed
    building(s) should be submitted.
- item: 'Minerals and waste: may be contours, spot levels or cross or long sections, as suits the development'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: A change in ground levels.
      - condition:
          field: building-works
          value: true
          description: Buildings or structures are involved in the application.
  source-text: The drawings may take the form of contours, spot levels or cross or long sections as appropriate
    to the type of development proposed.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 16, 27, 34, 43, 50, 58-59, 68, 73, 77,
  102. Required for full major applications, and for householder and full minor applications where levels
  change within the site. Outline (''Required, except if matters are reserved''), reserved matters, listed
  building consent (''determined on a case by case basis''), proposed lawful development certificates
  on sloping sites and section 73 show as ''check''. Minerals and waste applications: from the council''s
  Minerals and Waste Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 13. The M&W checklist''s ''Section Plans / Levels'' row: ''Required when there is a change in ground
  levels or when buildings are proposed.'''
review-status: unverified
field-status: {}
