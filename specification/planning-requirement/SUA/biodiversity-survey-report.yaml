reference: biodiversity-survey-report
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - change-of-use
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
        - reserved-matters
        - lbc
        - s73
    - any:
      - condition:
          field: protected-species
          value: true
          description: Works may affect protected species or their habitats.
      - site:
          in:
          - priority-habitat
          - special-area-of-conservation
          - site-of-special-scientific-interest
          - local-wildlife-site
          description: Works may affect designated sites or priority habitats.
      - discretionary
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: protected-species
          value: true
          description: Works may affect protected species or habitats.
      - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Conservation of Habitats and Species Regulations 2017; Local Plans of the former district areas;
  Somerset BNG Guidance Note
source-text: 'Required if works are proposed which may affect protected species or habitats, survey dated
  within last 2 years. See Appendix A: Ecology report requirements and types ... The local validation
  requirements for BNG are: • Wildlife/Ecology Survey'
must-include:
- item: Survey dated within the last 2 years
  level: must
- item: A Preliminary Roost Assessment, unless clear photographs (with a written explanation if needed)
    show the site has negligible opportunities for roosting bats and birds or the works cannot affect
    roosts
  level: must
  source-text: A Preliminary Roost Assessment will be required unless it can be demonstrated that the
    site has negligible opportunities to host roosting bats and birds
- item: 'Where negligible roosting potential is claimed: photographs of all internal roof voids, all external
    roofing, guttering, fascia and soffit, and all external walls that the works could affect, of enough
    quality for the council''s ecologists to assess'
  level: must
- item: A Preliminary Ecological Appraisal where the development may affect designated sites, priority
    habitats, priority and protected species or other species and habitats of conservation concern (or
    photographic and written evidence that one is not needed)
  level: must
  source-text: A Preliminary Ecological Appraisal will be required where the proposed development may
    impact (either directly or indirectly) designated sites, priority habitats, priority and protected
    species and their habitats, or other species and habitats of conservation concern.
- item: Any further surveys the assessment recommends, completed and submitted
  level: must
  source-text: In the event that further surveys are required, all surveys must be completed and submitted
    in order to validate the application.
- item: Surveys done to nationally recognised guidelines (such as BS 42020:2013 and CIEEM guidance) by
    a suitably licensed and qualified ecologist
  level: must
- item: Based on up-to-date ecological reports and survey data (usually within 12 months)
  level: must
- item: Follows CIEEM guidance on the lifespan of ecological reports and surveys
  level: must
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
- item: 'Minerals and waste: the requisite ecology report where any answer on the Biodiversity Checklist
    is ''yes'', unless otherwise agreed'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: protected-species
          value: true
          description: Works may affect protected species or habitats.
      - discretionary
  source-text: If you answer ‘yes’ to any question you must include the requisite ecology report unless
    otherwise agreed.
confidence: medium
