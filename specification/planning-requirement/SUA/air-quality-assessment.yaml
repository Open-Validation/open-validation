reference: air-quality-assessment
local-authority: SUA
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - extraction-oil-gas
      - waste-dev
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Inside or near an air quality management area.
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm
policy: PPG Air Quality; PPG Minerals; Somerset Minerals Plan policy DM8; Somerset Waste Core Strategy
  policy DM3
source-text: Almost always needed for minerals and waste applications ... All proposals that have the
  potential to have an adverse impact on air quality will require the submission of a scheme detailing
  how the application will limit its impact on the surrounding environment.
must-include:
- item: 'Minerals and waste: a scheme detailing how the development will limit its impact on the surrounding
    environment'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - discretionary
  source-text: All proposals that have the potential to have an adverse impact on air quality will require
    the submission of a scheme detailing how the application will limit its impact on the surrounding
    environment.
- item: 'Minerals and waste: a dust suppression scheme showing how dust impact on the surrounding area
    will be minimised, where the development could generate more dust'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - discretionary
  source-text: Any application that has the potential to generate increased dust should include a dust
    suppression scheme
- item: 'Minerals and waste: enough information for full consideration of the air quality impact, inside
    or near an AQMA or where significant gaseous, dust or bio-aerosol emissions are expected'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - site:
          in:
          - air-quality-management-area
          description: Inside or near an air quality management area.
      - discretionary
  source-text: applications should be supported by such information as is necessary to allow a full consideration
    of the impact of the proposal on the air quality of the area.
confidence: medium
notes: 'Only in the council''s minerals and waste checklist (''Air Quality Impact Assessments''). Minerals
  and waste applications: from the council''s Minerals and Waste Validation Checklist (cover ''December
  2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 37. Marked ''sometimes required'' though ''Almost always needed'', so cases other than an AQMA
  show as ''check''.'
