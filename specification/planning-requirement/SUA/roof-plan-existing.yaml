reference: roof-plan-existing
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: roof-alteration
        value: true
        description: The proposal changes the roof.
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
        - reserved-matters
        - lbc
        - s73
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Local requirement
source-text: Required if there are changes to the roof. ... Required in some cases - for further details
  please see Roof Plan
must-include:
- item: Drawn to a scale of 1:50 or 1:100
  level: must
- item: The shape of the roof, particularly where its appearance and shape change
  level: must
- item: The position of all ridges, valleys, dormer windows, roof lights and other features such as chimneys
    or raised parapets
  level: must
- item: Roofing materials and their location
  level: must
confidence: medium
notes: From the council's list (published 1 April 2025), page 17, 27, 34, 43, 50, 68, 70-71, 73, 78, 103.
  Required for householder applications and lawful development certificates where the roof changes; for
  full, outline, reserved matters, listed building consent and section 73 it is 'Required in some cases',
  so it shows as 'check'.
review-status: unverified
field-status: {}
