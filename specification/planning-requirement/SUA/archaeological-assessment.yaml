reference: archaeological-assessment
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - site:
        in:
        - archaeological-priority-area
        description: An area of high archaeological potential or an archaeological site.
  - all:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - archaeological-priority-area
        description: An area of high archaeological potential or an archaeological site.
    - condition:
        field: new-build
        value: true
        description: The works involve new build.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: An area of high archaeological potential or an archaeological site.
    - condition:
        field: ground-disturbance
        value: true
        description: The development would disturb the ground.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
