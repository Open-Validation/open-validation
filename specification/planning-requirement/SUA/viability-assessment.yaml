reference: viability-assessment
local-authority: SUA
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The development is not fully policy compliant in delivering the required planning obligations.
  - all:
    - condition:
        field: loss-of-use
        value: true
        description: A change of use that loses, for example, a retail unit or an economic or tourist
          use in the countryside.
    - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: NPPF; Local Plans of the former district areas
source-text: Where development is proposed which is not fully Policy compliant in delivering required
  planning obligations to make the development acceptable. ... Development to change the use of a building
  which requires marketing or viability information e.g. loss of a retail unit to a non-conforming use
  or loss of an economic/tourist use in a countryside location
must-include:
- item: 'For a change of use: a marketing report summarising how the site has been marketed over a prolonged
    period'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: The change of use loses an existing use.
  source-text: A marketing report is a report to summarise how efforts to market a site have been carried
    out over a prolonged window.
confidence: medium
notes: From the council's list (published 1 April 2025), page 98, 121. Under 'Other Supporting Information',
  which the list says 'should ideally be provided at submission' and otherwise 'may be requested during
  the course of the application'. The list's 'Viability / Marketing Assessment'. Which changes of use
  need marketing or viability information is a judgement, so that part shows as 'check'.
review-status: unverified
field-status: {}
