reference: noise-assessment
local-authority: SUA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development generates potentially significant noise, vibration, odour or other
        environmental impacts.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New or converted noise-sensitive development, or development close to existing significant
        noise, vibration or odour.
  - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: NPPF; Local Plans of the former district areas
source-text: Required for developments generating potentially significant levels of noise / vibration
  / odour or other environmental impacts, for development in close proximity to sensitive receptors, or
  developments within close proximity to existing significant levels of noise / vibration / odour. ...
  New or converted noise-sensitive development;
must-include:
- item: An Acoustic Design Statement (ADS) to British Standard, proportionate to the scale of development
  level: should
confidence: medium
notes: From the council's list (published 1 April 2025), page 37, 52, 94, 114. The list's 'Noise / Vibration
  / Odour or Other Environmental Impacts Evaluation'. Reserved matters ('except if addressed under Outline
  permission') and section 73 (changes on this issue) show as 'check'.
review-status: unverified
field-status: {}
