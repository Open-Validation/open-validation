reference: noise-assessment
local-authority: SUA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development generates potentially significant noise, vibration, odour or other
        environmental impacts.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New or converted noise-sensitive development, or development close to existing significant
        noise, vibration or odour.
  - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Noise or vibration from the development is expected to appear distinct or cause
            a significant change at a sensitive location.
      - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: NPPF; Local Plans of the former district areas
source-text: Required for developments generating potentially significant levels of noise / vibration
  / odour or other environmental impacts, for development in close proximity to sensitive receptors, or
  developments within close proximity to existing significant levels of noise / vibration / odour. ...
  New or converted noise-sensitive development;
must-include:
- item: An Acoustic Design Statement (ADS) to British Standard, proportionate to the scale of development
  level: should
- item: 'Minerals and waste: the sources and emissions of the development, direct and indirect, fully
    detailed'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Noise or vibration from the development is expected to appear distinct or cause
            a significant change at a sensitive location.
      - discretionary
  source-text: The sources and emissions from a development will need to be fully detailed in respect
    to those arising directly from the development and indirectly from the use of the development.
- item: 'Minerals and waste: predicted effects at sensitive locations, with the operational and prediction
    assumptions made'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Noise or vibration from the development is expected to appear distinct or cause
            a significant change at a sensitive location.
      - discretionary
  source-text: Prediction of the level of effects at sensitive locations shall be detailed along with
    any operational and prediction assumptions made.
- item: 'Minerals and waste: the impacts on all sensitive locations, with operational measures or mitigation,
    or the justification for treating impacts as not significant'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Noise or vibration from the development is expected to appear distinct or cause
            a significant change at a sensitive location.
      - discretionary
  source-text: Discussion shall be provided to show the consequential impacts of development on all sensitive
    locations with either, the suggested operational measures or mitigation thought necessary to make
    development acceptable, or the justification to regard impacts as not significant to planning.
- item: 'Minerals and waste: the pre-development situation at potentially sensitive locations over representative
    periods, where required'
  level: should
  required-if:
    all:
    - all:
      - application-type:
          in:
          - mineral-app
          - mineral-extraction
          - extraction-oil-gas
          - waste-dev
      - any:
        - condition:
            field: noise-generating-use
            value: true
            description: Noise or vibration from the development is expected to appear distinct or cause
              a significant change at a sensitive location.
        - discretionary
    - discretionary
  source-text: A noise/vibration assessment may be required to establish the pre-development situation
    at potentially sensitive locations
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 37, 52, 94, 114. The list''s ''Noise /
  Vibration / Odour or Other Environmental Impacts Evaluation''. Reserved matters (''except if addressed
  under Outline permission'') and section 73 (changes on this issue) show as ''check''. Minerals and waste
  applications: from the council''s Minerals and Waste Validation Checklist (cover ''December 2024''),
  https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 35-36. ''Almost always needed for minerals and waste applications'', but marked ''sometimes required'',
  so cases other than a noisy development show as ''check''.'
