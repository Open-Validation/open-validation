reference: arboriculturist-report
local-authority: SUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The works could affect the health or survival of a tree on the site or adjoining
          land.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: BS 5837:2012; Local Plans of the former district areas; Somerset BNG Guidance Note
source-text: 'Required for works that potentially affect the health or survival of a tree on the site
  or adjoining land. ... The local validation requirements for BNG are: • Wildlife/Ecology Survey • Biodiversity
  Checklist • Arboriculture Report'
must-include:
- item: A tree survey to BS 5837:2012 Trees in relation to design, demolition and construction
  level: must
confidence: medium
notes: From the council's list (published 1 April 2025), page 19, 32, 36, 44, 51, 61, 80, 121. Also required
  as the 'Arboriculture Report' for every BNG-liable application, to inform the baseline, proposals and
  management plans (BNG validation addendum, https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EdFbqbFh8VxEhxlAqGc7aZQBjLZ3FiAomv9-WXTOCUoJyg?e=ClG4O6).
  Section 73 (changes to conditions on this issue) shows as 'check'.
review-status: unverified
field-status: {}
