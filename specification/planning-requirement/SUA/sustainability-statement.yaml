policy: Interim Guidance Statement on Planning for the Climate Emergency (Somerset West and Taunton area);
  Net Zero Carbon Toolkit; Taunton Deane Core Strategy policy DM5; Somerset Climate Emergency Strategy;
  Climate Change Act 2008; NPPF
source-text: Sustainability Statement Required ... Climate Emergency Checklist West area only ... Required
  for all development, including extensions and conversions in the former Taunton Deane area to demonstrate
  how measures required by policy DM5 of the Taunton Deane Core Strategy have been incorporated.
must-include:
- item: Sustainable design, construction and other measures to reduce energy, water and materials use,
    such as PV panels, ground source heat pumps, electric charging points, combined heat and power, and
    other measures to help future occupiers reduce their carbon footprint
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
        - outline-some
        - outline-all
    - ref: major-development
- item: Confirmation of access to fibre broadband
  level: should
  required-if:
    all:
    - application-type:
