notes: 'From the council''s list (published 1 April 2025), page 19, 22, 27, 36-38, 45, 52-53, 62, 69,
  80, 91, 97-98, 119-120. This file brings together three things in the list: the Sustainability Statement
  required for every full and outline major application; the Climate Emergency Checklist, required for
  householder, change of use, full, outline, reserved matters and section 73 applications in the West
  area only (former Somerset West and Taunton; marked ''may be required'' for listed building consent
  there, so ''check''); and the Sustainability Checklist required for all development in the former Taunton
  Deane area. The area parts use a new field, former-district. There are no parts specific to the former
  South Somerset area.'
