reference: floor-plan-proposed
local-authority: SUA
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - change-of-use
        - full
        - technical-details-consent
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - condition:
        field: floor-layout-change
        value: true
        description: The proposal changes the floor plans.
  - all:
    - application-type:
        in:
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floor-layout-change
        value: true
        description: The proposal changes the floor plans.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended);
  local requirement
source-text: 'Existing: Required if there is a change to floor plans ... Proposed: Required if there is
  a change to floor plans ... Required, except if matters are reserved for changes to floor plans ...
  Required, this will be determined on a case by case basis if changes to floor plans are proposed'
must-include:
- item: At an identified measurable scale of 1:50 or 1:100, with a scale bar
  level: must
- item: The extent of any proposed uses being applied for, and the existing and proposed use of each room
  level: must
- item: All openings (doors and windows)
  level: must
- item: Any buildings or walls to be demolished
  level: must
- item: An existing and proposed roof plan where the alterations change the roof
  level: must
  required-if:
    condition:
      field: roof-alteration
      value: true
      description: The proposal changes the roof.
- item: Finished floor level for any new buildings
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
- item: 'Minerals and waste: all relevant existing and proposed floor plans'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - extraction-oil-gas
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings or structures are involved in the application.
  source-text: Plans should show all relevant existing and proposed floor plans.
confidence: medium
notes: 'From the council''s list (published 1 April 2025), page 16, 20, 27, 34, 42, 49, 58-59, 67, 70,
  73, 77, 101. Required for householder and listed building consent applications and full major applications;
  for change of use, full minor and lawful development certificates only where the floor plans change.
  Outline (''Required, except if matters are reserved''), reserved matters (layout, appearance, scale)
  and section 73 (case by case) show as ''check''. Minerals and waste applications: from the council''s
  Minerals and Waste Validation Checklist (cover ''December 2024''), https://somersetcc.sharepoint.com/:b:/s/SCCPublic/IQCzOOmh87H1SKjkgWPBAbPcAQKHAq5ikzhvqHRk3xHWpxM?e=DvdtPm,
  page 12.'
review-status: unverified
field-status: {}
