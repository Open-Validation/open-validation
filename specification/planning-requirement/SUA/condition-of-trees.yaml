reference: condition-of-trees
local-authority: SUA
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - discretionary
source-url: https://somersetcc.sharepoint.com/:b:/s/SCCPublic/EXumNGRLz7tBh2yzrGBuimkBBUMpxpuI4wQ-UkB_z9MfWQ?e=wIIPMU
policy: BS 3998:2010; local requirement
source-text: 'Required for works to trees covered by a TPO if: • It is diseased or you have fears that
  it might break or fall (you are required to provide written arboricultural advice or other diagnostic
  information from an appropriate expert).'
must-include:
- item: Written arboricultural advice or other diagnostic information from an appropriate expert
  level: must
confidence: medium
notes: From the council's list (published 1 April 2025), page 76. Shows as 'check' because it depends
  on the reason for the works (disease or fear the tree might break or fall).
review-status: unverified
