reference: lighting-assessment
local-authority: LBH
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: External lighting for a publicly accessible development, or external lighting or floodlighting
        near a residential property, Listed Building, Conservation Area or area of biodiversity value
        (SINC, SSSI, LNR).
  - condition:
      field: illuminated
      value: true
      description: The application is for an illuminated advertisement.
source-url: https://www.lambeth.gov.uk/sites/default/files/2025-12/Local_Information_Requirements_2024.pdf
source-text: Lighting Assessment Required in support of proposals for external lighting in connection
  with a publicly accessible development or proposals that include external lighting or floodlighting,
  which is in the vicinity of a residential property, Listed Building, Conservation Area or areas of biodiversity
  value such as SINC, SSSI or LNR.
confidence: medium
notes: 'Audit (wrong_app_type): not LBC-specific; LIR 47 also covers ''all illuminated advertisements''.'
review-status: unverified
field-status: {}
