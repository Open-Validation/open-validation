reference: archaeological-assessment
local-authority: LBH
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: The site is on or near a Scheduled Ancient Monument.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.4
      description: The site is 0.4 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 0.4
      description: The site is 0.4 hectares or more.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Archaeological Priority Area.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves ground works or excavation.
source-url: https://www.lambeth.gov.uk/sites/default/files/2025-12/Local_Information_Requirements_2024.pdf
confidence: medium
notes: 'From the audit (missing_requirement): LIR 13, on or near a Scheduled Ancient Monument, sites of
  0.4ha+, ground works in Archaeological Priority Areas (householder included).'
review-status: unverified
field-status: {}
