reference: affordable-housing-statement
local-authority: MAL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: More than 10 dwellings.
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 1000
      description: 1000 sq m or greater of residential floor space.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Maldon District Local Development Plan 2014-2029; National Planning Policy Framework
source-text: Where an element of affordable housing is required as part of the scheme, i.e where more
  than 10 dwellings are proposed or 1000sqm or greater of residential floor space is proposed.
must-include:
- item: Number, size (bedrooms), type and proposed location of the affordable units
  level: must
- item: Size of each type in square metres
  level: must
- item: Future management and tenure
  level: must
- item: Contact details for the chosen Registered Provider, or confirmation of the agreement for a financial
    contribution when requested
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 9.
review-status: unverified
field-status: {}
