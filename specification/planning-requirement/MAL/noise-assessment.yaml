reference: noise-assessment
local-authority: MAL
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential development introduced to a noisy environment.
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Noisy uses or processes.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Likely to impact on existing residential development.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework
source-text: Where noise nuisance on residential amenity may be a consideration i.e. • Where it is proposed
  to introduce residential development to a noisy environment • Where it is proposed to introduce noisy
  uses/processes which are likely to impact on existing residential development
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 18. Noise Impact Assessment / Acoustic Report.
review-status: unverified
field-status: {}
