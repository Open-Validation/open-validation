reference: town-centre-impact-assessment
local-authority: MAL
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure developments over 2500 square metres.
  - discretionary
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Other main town centre uses in an edge or out of centre location.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the Development Plan.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework; Maldon District Council Economic Prosperity Strategy 2013-2029
source-text: Retail and leisure developments over 2500 square metres. Smaller retail and leisure developments
  likely to have a significant impact on smaller centres. Applications for other main town centre uses
  when they are an edge of centre or out of centre location; and not in accordance with the Development
  Plan
must-include:
- item: Details of the sequential test process supporting the chosen site location
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 20. Smaller schemes 'likely to have a significant
  impact on smaller centres' are a judgement, so discretionary.
review-status: unverified
field-status: {}
