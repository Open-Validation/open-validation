reference: habitat-baseline
local-authority: MAL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.maldon.gov.uk/info/20045/planning_and_building_control/10185/biodiversity_net_gain/3
policy: Environment Act 2021; Town and Country Planning Act 1990 Schedule 7A
source-text: Mandatory Validation Requirements a statement indicating whether BNG is applicable or the
  reasons why not, where relevant the completed Biodiversity Metric showing the pre-development biodiversity
  value of onsite habitat on the date of application (or earlier date) (to be submitted in Excel and PDF
  format) where an earlier date is proposed, the proposed earlier date and the reasons for proposing that
  date a statement confirming whether the biodiversity value of the onsite habitat is lower on the application
  date due to any degradation activities; a description of any irreplaceable habitat on the site a scale
  plan showing onsite habitat on the date of application (or earlier date), including irreplaceable habitat
must-include:
- item: Statement of whether BNG applies, or the reasons why not
  level: must
- item: Any proposed earlier date and the reasons for it
  level: must
  required-if: discretionary
- item: Statement on whether onsite habitat value is lower because of degradation
  level: must
- item: Description of any irreplaceable habitat on the site
  level: must
- item: Scale plan showing onsite habitat on the date of application (or earlier date), including irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's 'Mandatory Validation Requirements' for Biodiversity Net Gain web page, linked
  beside the June 2022 list on the 'Applying for planning permission' page. Shown with the biodiversity
  gain condition as the law sets out (householder and other exempt applications are exempt). Outline applications
  have the same requirements; reserved matters should add detail based on the final layout.
review-status: unverified
field-status: {}
