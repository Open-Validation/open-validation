reference: floor-plan-proposed
local-authority: MAL
required-if:
  any:
  - condition:
      field: floorspace-change
      value: true
      description: New or amended floor space.
  - condition:
      field: building-works
      value: true
      description: Proposals to alter existing buildings.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications proposing new or amended floor space and/or proposals to alter existing buildings
must-include:
- item: Scale 1:50 or 1:100 (metric)
  level: must
- item: Written scale and/or a scale bar, and written dimensions showing the overall size of any new buildings
    or extensions
  level: must
- item: Unique drawing number
  level: must
- item: Existing buildings or walls to be demolished (if applicable)
  level: must
- item: Layout of the existing building(s) as well as the proposed development
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 6. For development already complete or begun,
  original and existing floor plans are asked for.
review-status: unverified
field-status: {}
