reference: transport-assessment
local-authority: MAL
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework
source-text: All developments which are likely to generate significant amount of vehicle movement i.e.
  major developments
must-include:
- item: Existing conditions and development details
  level: should
- item: Predicted person trip generation and mode splits
  level: should
- item: Predicted residual vehicle trips after travel plan measures, and their distribution
  level: should
- item: Junction capacity and merge/diverge assessments at opening year and ten years on
  level: should
- item: Proposed mitigation measures
  level: should
confidence: medium
notes: From the council's list (published June 2022), page 24. Contents are what a transport assessment
  is 'likely to include' under Essex Highways' guidance, so 'should'. Other schemes likely to generate
  significant vehicle movement are a judgement, so discretionary.
