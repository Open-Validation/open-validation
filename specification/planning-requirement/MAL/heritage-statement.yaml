reference: heritage-statement
local-authority: MAL
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      - historic-environment-record
      description: Likely to affect designated heritage assets, or non-designated assets such as non-scheduled
        archaeological sites and buildings on the Register of Buildings of Local Value.
  - application-type:
      in:
      - lbc
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework
source-text: 'Applications which are likely to affect: • Designated heritage assets • Non-designated heritage
  assets such as non-scheduled archaeological sites and Buildings on the Register of Buildings of Local
  Value • Applications for Listed Building Consent'
must-include:
- item: Significance of the archaeology, history and character of the building, structure or area
  level: must
- item: Justification and principles of the proposed works and their impact on its special character
  level: must
- item: Detailed schedule of the proposed work
  level: must
- item: Structural survey, if required
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2022), page 16.
review-status: unverified
field-status: {}
