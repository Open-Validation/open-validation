reference: viability-assessment
local-authority: MAL
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Heads of terms not submitted, or contributions below the Local Development Plan and
        Infrastructure Delivery Plan requirements, for viability reasons.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing not provided, or below the Local Development Plan requirements,
        for viability reasons.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Maldon District Local Development Plan 2014-2029; Infrastructure Delivery Plan
source-text: If Heads of Terms are not going to be submitted, or the contributions do not meet the requirements
  set out in the Maldon District Local Development Plan 2014-2029 and the Infrastructure Delivery Plan,
  due to financial viability reasons, then a Viability Assessment should be submitted justifying the contributions
  or lack of. … If Affordable Housing is not going to be provided, or the contributions do not meet the
  requirements set out in the Maldon District Local Development Plan 2014-2029, due to financial viability
  reasons, then a Viability Assessment should be submitted justifying the contributions or lack of.
confidence: medium
notes: From the council's list (published June 2022), page 8-9. Set out under 'Planning Obligations -
  Draft Heads of Terms' (major development) and 'Affordable Housing Statement'.
review-status: unverified
field-status: {}
