reference: location-plan
local-authority: MAL
required-if:
  always: true
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan All applications
must-include:
- item: Scale 1:1250 or 1:2500 (metric), up to date, with the direction of north and a scale bar or written
    scale
  level: must
- item: Sufficient named roads to identify the exact location (wherever possible at least two)
  level: must
- item: All surrounding buildings, roads and footpaths on adjoining land
  level: must
- item: Red line around all land required for the development (access from a public highway, visibility
    splays, landscaping, car parking, open areas around buildings)
  level: must
- item: Blue line around all other land owned by the applicant close to or adjoining the site
  level: must
- item: Unique drawing number
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 4.
review-status: unverified
field-status: {}
