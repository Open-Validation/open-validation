      in:
      - consent-under-tpo
  - discretionary
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: Where an application is for works to a tree protected by a Tree Preservation Order due to
  their condition or it is alleged that they are causing structural damage, a report from an appropriate
  expert will be required
