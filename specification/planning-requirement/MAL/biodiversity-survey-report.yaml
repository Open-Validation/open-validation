reference: biodiversity-survey-report
local-authority: MAL
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The proposal may have an impact on wildlife, including protected and priority species.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Affects international sites (SACs, SPAs, Ramsar sites), SSSIs or locally designated
        sites including Local Wildlife Sites.
  - discretionary
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework; Conservation of Habitats and Species Regulations; Maldon District
  Local Development Plan 2014-2029
source-text: All applications where the proposal may have an impact on wildlife and biodiversity. Where
  the development additionally affects international sites (Special Areas of Conservation, Special Protection
  Areas and RAMSAR Sites), national sites (Sites of Special Scientific Interest) and locally designated
  sites including Local Wildlife Sites.
must-include:
- item: At least a Preliminary Ecological Appraisal survey and report assessing the impact on wildlife
    and biodiversity, with mitigation or compensation measures including habitat protection and new habitats
  level: must
- item: Account taken of the timing of surveys and site work (nesting birds, priority species and habitats)
  level: must
- item: Extended Phase 1 Habitat Survey where protected and priority species are known or likely to be
    present
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected or priority species are known or likely to be present.
- item: Further protected species surveys if the initial survey shows they are needed
  level: must
  required-if: discretionary
- item: Information capable of assessment under the Habitat Regulations
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 11. Whether a proposal 'may have an impact
  on wildlife and biodiversity' is a judgement, so discretionary as well. The council's Biodiversity Check
  List for major applications is marked '(Once published)' and is sent to unmapped.
review-status: unverified
field-status: {}
