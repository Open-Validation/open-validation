reference: site-plan
local-authority: MAL
required-if:
  always: true
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block Plan All applications
must-include:
- item: Scale 1:200 or 1:500 (metric)
  level: must
- item: Direction of north
  level: must
- item: Written scale and/or a scale bar
  level: must
- item: Unique drawing number
  level: must
- item: Proposed development in relation to the site boundaries and other existing buildings, with written
    dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: Position of all trees on the site and adjacent land
  level: must
- item: Extent and type of any hard surfacing
  level: must
- item: Existing and proposed ground levels and finished floor levels
  level: must
- item: Type and height of boundary treatment (walls, fences etc.)
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 5.
review-status: unverified
field-status: {}
