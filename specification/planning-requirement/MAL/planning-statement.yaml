reference: planning-statement
local-authority: MAL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: 0.5 hectares if it is not known how many dwellings are proposed.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Floor space created of 1,000 square metres.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site area of 1 hectare or more.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework; National Planning Practice Guidance
source-text: Applications for 10 or more dwellings, or 0.5 hectares if is not known how many dwellings
  are proposed Applications for a building or buildings where the floor space to be created by the development
  is 1,000 square metres Application on a site having an area of 1 hectare or more
must-include:
- item: Full explanation of the proposal, including relevant background or site history
  level: must
- item: Context and need for the development, including justification for any change of use
  level: must
- item: How the proposal accords with the Local Plan and other relevant documents
  level: must
- item: Any consultation with statutory consultees and the local community
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 21. Supporting Planning Statement.
review-status: unverified
field-status: {}
