reference: section-existing
local-authority: MAL
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The application involves a change in ground levels.
  - discretionary
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications which involve a change in ground levels or are on sloping sites or where ground
  levels are a critical issue in terms of the design
must-include:
- item: Scale 1:50 or 1:100 (metric), with a unique drawing number and a written scale and/or scale bar
  level: must
- item: How proposed buildings relate to existing site levels and neighbouring development, with levels
    related to a fixed datum point off site
  level: must
- item: Existing and proposed foundations and eaves where a change is proposed, and how encroachment onto
    adjoining land is avoided
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in levels is proposed.
confidence: medium
notes: From the council's list (published June 2022), page 7. Site sections and finished floor and site
  levels. Sloping sites, or where levels are 'a critical issue in terms of the design', have no matching
  field, so that part is discretionary.
review-status: unverified
field-status: {}
