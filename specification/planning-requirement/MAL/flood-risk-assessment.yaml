reference: flood-risk-assessment
local-authority: MAL
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Sites of more than one hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Sites of more than one hectare in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: New development within Flood Zone 2 and 3.
  - site:
      in:
      - critical-drainage-area
      description: Sites within a Critical Drainage Area.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework
source-text: Sites of more than one hectare in Flood Zone 1 All new development within Flood Zone 2 and
  3 Sites situated within a Critical Drainage Area
must-include:
- item: Assessment of the existing situation and whether the proposal is likely to be affected by current
    or future flooding from any source
  level: must
- item: Shows the development is safe and, where possible, reduces flood risk overall
  level: must
- item: Whether flood risk increases elsewhere, and opportunities to reduce flooding
  level: must
- item: Mitigation measures, taking climate change into account
  level: must
- item: Design of surface water management systems including SuDS
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: Evidence that the Sequential and Exception Tests have been met, where required
  level: must
  required-if: discretionary
- item: 'Householder applications in flood zone 2 or 3: the Environment Agency householder and minor extensions
    matrix'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In flood zone 2 or 3.
confidence: medium
notes: From the council's list (published June 2022), page 13.
review-status: unverified
field-status: {}
