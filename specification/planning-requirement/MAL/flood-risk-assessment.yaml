reference: flood-risk-assessment
local-authority: MAL
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in a flood zone (householders in Zones 2/3 complete the EA matrix).
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area.
source-url: https://www.maldon.gov.uk/download/downloads/id/18194/planning_validation_list_2022.pdf
source-text: Flood risk assessment in flood zone 1 and critical drainage areas The FRA should include
  the design of surface water management systems including Sustainable Drainage (SUDS) and address the
  requirement for safe access to and from the development in areas at risk of flooding.
must-include:
- item: The design of surface water management systems, including Sustainable Drainage (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
