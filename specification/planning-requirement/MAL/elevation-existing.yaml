reference: elevation-existing
local-authority: MAL
required-if:
  any:
  - condition:
      field: operational-development
      value: true
      description: Applications proposing operational development.
  - application-type:
      in:
      - lbc
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications proposing operational development including Listed Building Consent
must-include:
- item: Scale 1:50 or 1:100 (metric), clearly showing the proposed works in relation to what is already
    there
  level: must
- item: Written scale and/or a scale bar, and written dimensions showing the overall size of any new buildings
    or extensions
  level: must
- item: Unique drawing number
  level: must
- item: All sides of the proposal
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2022), page 6. For development already complete or begun,
  original and existing elevations are asked for instead of existing and proposed. The adjoining-building
  item has no matching field, so it is discretionary.
review-status: unverified
field-status: {}
