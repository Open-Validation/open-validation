reference: landscaping-plan
local-authority: MAL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial development.
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Maldon District Local Development Plan 2014-2029
source-text: Hard and soft landscape strategies are required for:All applications for major residential
  development • Major commercial developments
must-include:
- item: 'All public and private spaces: open space, sports pitches and play facilities, green infrastructure,
    biodiversity habitats, water bodies and landscape buffers'
  level: must
- item: Hard surfaces, boundary treatment and all proposed soft landscaping
  level: must
- item: Builds on the principles in the Design and Access Statement, where relevant
  level: should
confidence: medium
notes: From the council's list (published June 2022), page 17. Landscape Strategy.
review-status: unverified
field-status: {}
