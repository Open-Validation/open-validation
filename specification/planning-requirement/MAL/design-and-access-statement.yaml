reference: design-and-access-statement
local-authority: MAL
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more dwellinghouses.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  - all:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Floor space created of 100 square metres or more.
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
  - application-type:
      in:
      - lbc
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Planning (Listed
  Buildings and Conservation Areas) Regulations 1990
source-text: All major planning applications Applications for one or more dwellinghouses in a Conservation
  Area Applications for the provision of a building or buildings where the floor space created by the
  development is 100 square metres or more within a Conservation Area All Listed Building Consent applications
must-include:
- item: Design principles and concepts applied to the development
  level: must
- item: How the development's context has influenced the design
  level: must
- item: Approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how its outcome has informed the proposal
  level: must
- item: How specific issues that might affect access have been addressed
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 3.
review-status: unverified
field-status: {}
