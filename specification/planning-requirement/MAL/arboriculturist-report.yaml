reference: arboriculturist-report
local-authority: MAL
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges within or adjacent to the site that could influence or be affected
        by the development.
  - ref: major-development
  - application-type:
      in:
      - consent-under-tpo
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework; BS5837:2012
source-text: Where there are trees or hedges, within or adjacent to the application site that could influence
  or be affected by proposed development. For major development sites Applications for works to a tree
  protected by a Tree Preservation Order
must-include:
- item: Details of the protected tree
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: Comprehensive survey of all existing trees and hedges
  level: must
- item: Proposed works to existing trees and hedges
  level: must
- item: Replacements, where applicable
  level: must
  required-if: discretionary
- item: How retained trees and hedges will be protected during development
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 25. Arboricultural / Tree Survey. Detail depends
  on the scale of development and the conflicts with trees and hedges.
review-status: unverified
field-status: {}
