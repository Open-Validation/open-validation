reference: air-quality-assessment
local-authority: MAL
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Development within a designated Air Quality Management Area.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: More than 50 dwellings.
  - condition:
      field: biomass-or-chp
      value: true
      description: The proposal includes biomass burners.
  - discretionary
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
source-text: Developments that may introduce a significant impact on air quality i.e. >50 dwellings, industrial
  emissions, bio mass burners or major construction projects
must-include:
- item: An assessment of the potential impacts of the development on local air quality
  level: must
- item: The proposed mitigation measures, where necessary
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): the workbook put this under Outline only; the trigger is location and
  scale based. Industrial emissions and major construction projects are shown as officer discretion.'
review-status: unverified
field-status: {}
