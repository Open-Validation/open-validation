reference: air-quality-assessment
local-authority: MAL
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Within a designated Air Quality Management Area.
    - any:
      - condition:
          field: sensitive-end-use
          value: true
          description: Introduces new receptors.
      - discretionary
  - condition:
      field: dwelling-count
      operator: '>'
      value: 50
      description: More than 50 dwellings.
  - condition:
      field: direct-air-emissions
      value: true
      description: Industrial emissions.
  - condition:
      field: biomass-or-chp
      value: true
      description: Biomass burners.
  - discretionary
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework; Planning Practice Guidance - Air Quality
source-text: Any developments within a designated Air Quality Management Areas that generate additional
  traffic movements or introduce new receptors Developments that may introduce a significant impact on
  air quality i.e. >50 dwellings, industrial emissions, bio mass burners or major construction projects
must-include:
- item: Assessment of potential impacts of the development on local air quality
  level: must
- item: Proposed mitigation measures where necessary
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 10. Additional traffic movements in an AQMA,
  and major construction projects, have no matching field, so those parts are discretionary.
review-status: unverified
field-status: {}
