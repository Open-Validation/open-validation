reference: land-contamination-assessment
local-authority: MAL
required-if:
  site:
    in:
    - contaminated-land
    description: Contamination is known or suspected (potentially contaminative former use such as industrial,
      commercial or agricultural).
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
source-text: Where contamination is known or suspected, i.e. potentially contaminative former use such
  as industrial/commercial/agricultural If the applicant does not consider a Contaminated Land Assessment
  is necessary for the site a full justification of reasons should be submitted i.e. site has only ever
  been a residential garden
must-include:
- item: Carried out by or under the direction of a suitably qualified competent person, in line with relevant
    guidance including BS10175:2011
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): the workbook filed this under listed building consent from adjacent text.
  The must-include item was in the workbook''s structural survey row.'
review-status: unverified
field-status: {}
