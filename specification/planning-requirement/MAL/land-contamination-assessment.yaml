reference: land-contamination-assessment
local-authority: MAL
required-if:
  site:
    in:
    - contaminated-land
    description: Contamination is known or suspected (for example a former industrial, commercial or agricultural
      use).
source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
policy: National Planning Policy Framework
source-text: Where contamination is known or suspected, i.e. potentially contaminative former use such
  as industrial/commercial/agricultural
must-include:
- item: Carried out by or under the direction of a suitably qualified competent person
  level: must
- item: In line with BS10175:2011, the Essex Contaminated Land Consortium guidance and CLR11
  level: must
confidence: medium
notes: From the council's list (published June 2022), page 16. If the applicant thinks no assessment is
  needed, a full justification must be submitted (for example the site has only ever been a residential
  garden).
review-status: unverified
field-status: {}
