reference: air-quality-assessment
local-authority: SHF
required-if:
  any:
  - all:
    - condition:
        field: traffic-movements-peak-hour
        operator: '>='
        value: 60
        description: 60+ vehicle movements in any hour.
    - condition:
        field: near-no2-exceedance
        value: true
        description: Within 200m of an area exceeding Air Quality Limitation Values.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Sensitive uses, such as housing or schools, are introduced.
    - condition:
        field: near-no2-exceedance
        value: true
        description: In or within 200m of an area exceeding Air Quality Limitation Values.
  - discretionary
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/air-quality-requirements
source-text: An Air Quality Assessment is required for any development that generates 60+ vehicle movements
  in any hour within 200m of an area exceeding Air Quality Limitation Values. It is also required where
  sensitive uses, such as housing or schools, are being introduced to or within 200m of the area. Significant
  industrial polluters may also require an Assessment.
must-include:
- item: That the development will not cause critical additional harm to air quality or subject sensitive
    uses to harmful air quality
  level: must
- item: Proposed mitigation measures
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'air-quality-requirements' web page. 'Significant industrial polluters may also require an Assessment'
  is shown as discretionary.
review-status: unverified
field-status: {}
