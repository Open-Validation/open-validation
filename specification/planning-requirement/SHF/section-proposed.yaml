reference: section-proposed
local-authority: SHF
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
    - discretionary
source-url: https://www.sheffield.gov.uk/sites/default/files/docs/planning-and-development/planning-applications/Application%20Requirements.pdf
source-text: Existing and proposed site sections, finished floor and site levels. Unless the development
  is a long way from any boundary or the area is unusually flat people need to see how it relates vertically
  to adjoining property. This may be done with existing and proposed levels but normally a section is
  easier to produce and understand. If an infill building is proposed, a street scene drawing is needed,
  showing it in relation to those adjoining it.
must-include:
- item: Finished floor and site levels
  level: must
- item: How the development relates vertically to adjoining property (a section is normally easier than
    levels alone)
  level: must
- item: 'Householder: a cross section showing how the extension relates to the levels of the adjoining
    houses/gardens'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: A cross section showing how the extension relates to the levels of the adjoining houses/gardens
    is necessary
- item: 'Preferably at 1:50 or 1:100 scale (householder: at 1:50 or 1:100)'
  level: should
confidence: medium
notes: 'From the council''s list (Local Planning Application Requirements, last reviewed July 2020), the
  planning permission checklist (''Application Requirements'', 7 January 2013), page 1; the householder
  checklist (''Householder Requirements'', 7 January 2013), page 1; the listed building consent checklist
  (''Listed Building Requirements'', 7 January 2013), page 1. For planning permission and householder
  applications they are needed ''Unless the development is a long way from any boundary or the area is
  unusually flat'': that exception is the officer''s judgement, so it shows as discretionary. The listed
  building checklist asks for them without that exception (but not for very minor or internal works).
  The street scene drawing for infill buildings and householder height increases has no id here and is
  listed as unmapped.'
review-status: unverified
field-status: {}
