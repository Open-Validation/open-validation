reference: noise-assessment
local-authority: SHF
required-if:
  all:
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Likely to have an adverse impact on existing occupants of nearby buildings.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise sensitive use.
    - discretionary
  - discretionary
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/noise-impact-assessment
source-text: 'A Noise Impact Assessment may be required where: a proposal is likely to have an adverse
  impact on existing occupants of nearby buildings a development is a noise sensitive use a proposal is
  close to existing sources of noise'
must-include:
- item: Prepared by a suitably qualified acoustician, to an agreed method statement
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'noise-impact-assessment' web page. It 'may be required' and the need should be agreed with the case
  officer and the Environmental Protection Service at pre-application stage, so it shows as discretionary
  within those circumstances ('close to existing sources of noise' has no distance, so it is discretionary
  too).
review-status: unverified
field-status: {}
