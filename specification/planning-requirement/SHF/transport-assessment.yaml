reference: transport-assessment
local-authority: SHF
required-if:
  any:
  - condition:
      field: convenience-retail-floorspace
      operator: '>='
      value: 1000
      description: Food retail of 1,000 m² GFA.
  - all:
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 0
        description: Food retail.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.2
        description: Site of 0.2 ha.
  - condition:
      field: comparison-retail-floorspace
      operator: '>='
      value: 1000
      description: Non-food retail of 1,000 m² GFA.
  - all:
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 0
        description: Non-food retail.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.8
        description: Site of 0.8 ha.
  - condition:
      field: office-floorspace
      operator: '>='
      value: 2500
      description: Office (B1) of 2,500 m² GFA.
  - all:
    - condition:
        field: office-floorspace
        operator: '>'
        value: 0
        description: Office (B1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.8
        description: Site of 0.8 ha.
  - condition:
      field: class-b2-b8-floorspace
      operator: '>='
      value: 6000
      description: Industry (B2/B8) of 6,000 m² GFA.
  - all:
    - condition:
        field: class-b2-b8-floorspace
        operator: '>'
        value: 0
        description: Industry (B2/B8).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 2.0
        description: Site of 2.0 ha.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 80
      description: 'Residential: 80 units.'
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1.0
      description: 'Residential: site of 1.0 ha.'
  - condition:
      field: traffic-movements-peak-hour
      operator: '>='
      value: 60
      description: 'Other: 60+ vehicle movements in any hour.'
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/transport-assessment
source-text: The following table sets out the site area, or minimum gross floor area (GFA) above where
  we would expect a planning application to be supported by a Transport Assessment.
must-include:
- item: 'For developments with little or no car parking above the thresholds: access by means of transport
    other than the car'
  level: must
  required-if:
    condition:
      field: car-free
      value: true
      description: Little or no car parking.
confidence: medium
notes: 'From the council''s list (Local Planning Application Requirements, last reviewed July 2020), the
  ''transport-assessment'' web page. Thresholds from the page''s table (site area or GFA): food retail
  0.2 ha / 1,000 m²; non-food retail 0.8 ha / 1,000 m²; office (B1) 0.8 ha / 2,500 m²; industry (B2/B8)
  2.0 ha / 6,000 m²; residential 1.0 ha / 80 units; other 60+ vehicle movements in any hour. For a small
  development it ''could be little more than a letter''.'
review-status: unverified
field-status: {}
