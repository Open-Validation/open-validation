reference: town-centre-impact-assessment
local-authority: SHF
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre use (shops, leisure and entertainment, offices, culture and tourism)
        not in an existing centre.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up-to-date Sheffield Plan.
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/town-centre-use
policy: NPPF paragraph 87
source-text: The National Planning Policy Framework (paragraph 87) states that a sequential test should
  be applied to planning applications for main town centre uses that are not in an existing centre and
  are not in accordance with an up-to-date Sheffield Plan.
must-include:
- item: No suitable sites closer to a nearby centre, or a need for the development in that particular
    location
  level: must
- item: No unacceptable impacts on existing centres
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: More than 2,500 square metres of floor space.
- item: Locations accessible by a choice of means of transport
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'town-centre-use' web page. A sequential test (and impact assessment over 2,500 m²), proportionate to
  the scale and nature of the proposal.
review-status: unverified
field-status: {}
