reference: sustainability-statement
local-authority: SHF
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: 5 dwellings or more (including apartments).
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 500
      description: Non-residential development over 500 square metres gross internal floor space.
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/sustainability-statement
policy: Sheffield Core Strategy Policies CS 64 and CS 65
source-text: For developments of 5 dwellings or over (including apartments) and all non-residential developments
  over 500 square metres gross internal floor space, we require a Sustainability Statement to be submitted
  as part of a valid planning application. It can either form part of the Design and Access Statement
  or be a separate document.
must-include:
- item: Brief and to the point
  level: must
- item: The environmental benefits and impacts of the proposal
  level: must
- item: How the proposal addresses the 5 key questions in Sheffield's Sustainability toolkit (local economy;
    neighbourhoods and communities; transport options and inclusive access; natural environment and resources;
    high quality design and construction)
  level: must
- item: How carbon emissions will be reduced during construction
  level: must
- item: How renewable or low-carbon energy will be used during construction and once occupied
  level: must
- item: How the risk of flooding associated with the development will be reduced
  level: must
- item: How the development will support and improve biodiversity
  level: must
- item: Reference to Policies CS 64 and CS 65
  level: should
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'sustainability-statement' web page. It can be part of the Design and Access Statement. The four carbon,
  energy, flooding and biodiversity items come from a full Council resolution of November 2021; you can
  refer to other documents instead of repeating them.
review-status: unverified
field-status: {}
