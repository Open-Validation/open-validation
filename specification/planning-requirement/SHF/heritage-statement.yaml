reference: heritage-statement
local-authority: SHF
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
  - site:
      in:
      - listed-building
      - conservation-area
      - park-and-garden
      - scheduled-monument
      - locally-listed-building
      description: Likely to affect a listed building, conservation area, registered park or garden, scheduled
        monument or non-designated heritage asset (including non-designated archaeological sites and historic
        buildings).
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/heritage-statements
policy: NPPF Chapter 16
source-text: 'A Heritage Statement is required for the following types of application: a heritage statement
  will be required for all listed building consents a heritage statement will be required for all planning
  applications involving demolition in a conservation area Planning Applications that are likely to affect
  the following: listed buildings conservation areas registered parks and gardens scheduled monuments
  non-designated heritage assets including non-designated archaeological sites and historic buildings'
must-include:
- item: A description of the character and significance of any heritage assets likely to be affected,
    including how their setting contributes to that significance
  level: must
- item: A description of the proposal and an explanation of how it has been designed to respond to its
    heritage context
  level: must
- item: An assessment of the likely impact on the character and significance of the affected heritage
    assets
  level: must
- item: 'Historic buildings: accurate drawings of the existing building and proposed works (measured survey
    plans, sections and elevations at 1:50)'
  level: should
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: Works to a historic building.
- item: 'Historic buildings: detailed drawings (1:5, 1:10 or full size where appropriate) of proposed
    features such as windows, doors, ironwork, plasterwork or joinery'
  level: should
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: Works to a historic building.
- item: 'Historic buildings: photographs of all exteriors and interiors affected, with a plan showing
    where and in which direction each was taken'
  level: should
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: Works to a historic building.
- item: 'Extensive restoration, alteration or refurbishment: a detailed schedule of works and specification
    of methods and materials'
  level: should
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: Works to a historic building.
- item: Any proposed demolition, alteration or removal of joinery, plasterwork, walls, doors and windows
    shown clearly
  level: should
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      description: Works to a historic building.
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'heritage-statements' web page. The information must be proportionate to the importance of the assets
  affected. The 'Historic Buildings' items are things the statement 'may need to be supported by', so
  they are 'should'.
review-status: unverified
field-status: {}
