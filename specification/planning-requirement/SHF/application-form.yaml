source-text: Completed application form • The completed Ownership Certificate (A, B, C or D – as applicable)
  as required by Article 7 of the Town and Country Planning (General Development Procedure) Order 1995
  • Agricultural Holdings Certificate as required by Article 7 of the Town and Country Planning (General
  Development Procedure) Order 1995 • In addition, where Ownership Certificates B, C or D have been completed,
  notice(s) as required by Article 6 of the Town and Country Planning (General Development Procedure)
  Order 1995 must be given and/or published in accordance with this Article
