    application-type:
      in:
      - full
      - outline
      - lbc
- item: 'Preferably at 1:50 or 1:100 scale (householder: at 1:50 or 1:100)'
  level: should
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  planning permission checklist ('Application Requirements', 7 January 2013), page 1; the householder
