reference: telecommunications-report
local-authority: SHF
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Mast and antenna development by mobile phone network operators.
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/telecoms
source-text: Planning applications for mast and antenna development by mobile phone network operators
  in England should be accompanied by a range of supplementary information including the area of search,
  details of any consultation undertaken, details of the proposed structure, and technical justification
  and information about the proposed development. Planning applications should also be accompanied by
  a signed declaration that the equipment and installation has been designed to be in full compliance
  with the requirements of the radio frequency (RF) public exposure guidelines of the International Commission
  on Non-Ionizing Radiation Protection (ICNIRP).
must-include:
- item: The area of search
  level: must
- item: Details of any consultation undertaken
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification and information about the proposed development
  level: must
- item: Signed declaration that the equipment and installation comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
