reference: affordable-housing-statement
local-authority: SHF
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 dwellings or more.
  - all:
    - condition:
        field: educational-accommodation
        value: true
        description: Student cluster housing.
    - condition:
        field: bedroom-count
        operator: '>='
        value: 60
        description: 60 bedspaces or more.
source-url: https://www.sheffield.gov.uk/sites/default/files/docs/planning-and-development/sheffield-plan/Template%20for%20an%20Affordable%20Housing%20Statement.xlsx
policy: Sheffield Core Strategy Policy CS40; CIL and Planning Obligations SPD (2015), Guideline GAH2
source-text: The submission of a completed Affordable Housing Template is a requirement of validation
  for an application for 15 dwellings or more (or 60 bedspaces or more for student cluster housing).
must-include:
- item: How the affordable housing requirements of Core Strategy Policy CS40 and the CIL and Planning
    Obligations SPD (2015) will be met
  level: must
  source-text: Applicants will be required to submit an Affordable Housing Statement. It will need to
    set out how the affordable housing requirements, set out in Core Strategy Policy CS40 and the CIL
    and Planning Obligations SPD (2015), will be met.
- item: 'On the council''s Affordable Housing Statement template: all proposed residential units, their
    sizes and estimated market values, and any other floor area making up the gross internal floor area'
  level: must
- item: The Required Affordable Housing Contribution calculated and acknowledged
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'affordable-housing' web page; the Affordable Housing Statement template (linked from the Affordable
  housing page). The Affordable housing page says the absence of a required statement makes the application
  invalid; the threshold comes from the template it links to.
review-status: unverified
field-status: {}
