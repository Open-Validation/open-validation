reference: lighting-assessment
local-authority: SHF
required-if:
  all:
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Lighting sports pitches.
    - condition:
        field: external-lighting
        value: true
        description: Lighting car parks or large scale buildings.
  - discretionary
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/telecoms
source-text: 'Depending on location, applications that include proposals for lighting sports pitches,
  car parks and large scale buildings can raise issues relating to glare and light pollution. Such applications
  need to be supported by detailed information that should include:'
must-include:
- item: An Isolux diagram (to an appropriate scale) showing proposed light intensity on and around the
    development
  level: must
- item: Location and height of lighting columns/pylons
  level: must
- item: A clear statement of proposed hours of operation and any management arrangements or automatic
    switching equipment
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'telecoms' web page. Needed 'depending on location', which is not defined, so the lighting triggers
  sit with 'discretionary'.
review-status: unverified
field-status: {}
