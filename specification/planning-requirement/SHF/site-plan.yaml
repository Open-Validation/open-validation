reference: site-plan
local-authority: SHF
required-if:
  application-type:
    in:
    - full
    - outline
    - hh
    - lbc
source-url: https://www.sheffield.gov.uk/sites/default/files/docs/planning-and-development/planning-applications/Application%20Requirements.pdf
policy: Town and Country Planning (General Development Procedure) Order 1995 (as cited in the checklists)
source-text: Block plan/site plan showing the site boundaries (usually 1:100 or 1:200 scale). This plan
  should also show any trees and buildings (including those in close proximity to the site), existing
  or proposed boundary treatments of note and a north point. A tree survey will also be required if there
  are substantial trees on or near the site (question 16 of the application form). Only if all the above
  information is included on the layout or floor plans will the absence of a block plan not result in
  invalidity.
must-include:
- item: Site boundaries, usually at 1:100 or 1:200 scale
  level: must
- item: North point
  level: must
- item: Trees and buildings, including those in close proximity to the site
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
- item: Existing or proposed boundary treatments of note
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
- item: Dimensions, including the distances to important boundaries
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: 'Layout plan: rights of way, trees to be retained/removed, areas of landscaping (hard and soft
    for listed building consent), accesses and parking areas'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - lbc
  source-text: Layout plans. Including a north point, rights of way, trees to be retained/removed, areas
    of landscaping, accesses and parking areas.
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  planning permission checklist ('Application Requirements', 7 January 2013), page 1; the householder
  checklist ('Householder Requirements', 7 January 2013), page 2; the listed building consent checklist
  ('Listed Building Requirements', 7 January 2013), page 1. The block plan is a national requirement;
  the layout plan is a local one (planning permission and listed building consent). The block plan can
  be left out only if all its information is on the layout or floor plans.
review-status: unverified
