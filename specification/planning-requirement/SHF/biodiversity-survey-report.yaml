reference: biodiversity-survey-report
local-authority: SHF
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The site contains, or may contain, habitat used by protected species.
  - condition:
      field: potential-roost-features
      value: true
      description: Buildings, structures or trees on the site could provide bat roosts.
  - all:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting is proposed.
    - condition:
        field: near-watercourse
        value: true
        description: Near buildings, woodland, watercourses or other habitats used by bats.
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: A wind turbine is proposed.
    - discretionary
  - discretionary
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/ecology-local-planning-requirements
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017; Protection
  of Badgers Act 1992; Natural Environment and Rural Communities Act 2006 section 41
source-text: You must submit ecological surveys and assessments with your planning application if the
  development is likely to have a significant ecological impact.
must-include:
- item: Carried out by suitably qualified professionals, following recognised guidance such as CIEEM standards
  level: must
- item: Normally from the most recent survey season and no older than 24 months
  level: must
- item: Bat surveys follow the latest Bat Conservation Trust guidance and are done in the appropriate
    survey season
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Bats may be affected.
- item: Any further surveys recommended by a preliminary assessment completed and submitted with the application
  level: must
- item: Mitigation following the hierarchy (avoid, reduce, compensate) and proposals for long-term management
    of habitats and wildlife features
  level: should
confidence: medium
notes: 'From the council''s list (Local Planning Application Requirements, last reviewed July 2020), the
  ''ecology-local-planning-requirements'' web page. ''Likely to have a significant ecological impact''
  (on designated sites, protected or priority species and habitats, threatened species or ancient woodland)
  is a judgement, so it shows as discretionary next to the clear bat-survey triggers: local records of
  bats, potential roosts, floodlighting near bat habitats, sites close to water bodies, quarries or cliff
  faces, and wind turbines close to bat habitats (the last two also discretionary).'
review-status: unverified
field-status: {}
