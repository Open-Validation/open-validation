reference: elevation-proposed
local-authority: SHF
required-if:
  application-type:
    in:
    - full
    - outline
    - hh
    - lbc
source-url: https://www.sheffield.gov.uk/sites/default/files/docs/planning-and-development/planning-applications/Application%20Requirements.pdf
source-text: Existing and proposed elevations. If an extension is proposed the design of the existing
  windows and any other features of note should be shown. The proposed elevations should include facing
  materials and the style and finish of windows/doors. Where a new building is close to another building
  the relationship must be shown together with any openings in the neighbouring building close to the
  boundary.
must-include:
- item: Facing materials
  level: must
- item: Style and finish of windows/doors
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - lbc
- item: The full extent of the walls down to ground level
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Where the new building or elevation is close to another building: the relationship to it, with
    any openings in the neighbouring building close to the boundary'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
- item: 'Preferably at 1:50 or 1:100 scale (householder: at 1:50 or 1:100)'
  level: should
- item: Key dimensions, such as the main external dimensions and the distance to nearby boundaries
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  planning permission checklist ('Application Requirements', 7 January 2013), page 1; the householder
  checklist ('Householder Requirements', 7 January 2013), page 1; the listed building consent checklist
  ('Listed Building Requirements', 7 January 2013), page 1. A local requirement in all three checklists.
  The listed building checklist adds that 'not all the above are required if the works are very minor
  or internal'.
