reference: elevation-proposed
local-authority: SHF
required-if:
  application-type:
    in:
    - hh
    - full
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/information-requirements
must-include:
- item: Facing materials
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: The wall shown down to ground level
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: A street scene drawing where the height of the dwelling is increased
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: height-change
        value: true
        description: The proposal increases the height of the dwelling.
- item: A street scene drawing for infill buildings
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - discretionary
confidence: medium
notes: 'From the audit (missing_requirement): Householder and Application Requirements PDFs, Local Requirements.
  The full-planning elevations have ''specified detail'' the audit doesn''t list. ''Infill building''
  can''t be expressed as a field, so it is shown as officer discretion.'
review-status: unverified
field-status: {}
