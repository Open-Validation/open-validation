notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  planning permission checklist ('Application Requirements', 7 January 2013), page 2; the householder
  checklist ('Householder Requirements', 7 January 2013), page 2; the listed building consent checklist
  ('Listed Building Requirements', 7 January 2013), page 2. A national requirement in all three checklists;
  the listed building checklist doesn't ask for the blue line.
