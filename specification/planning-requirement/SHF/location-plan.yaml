policy: Town and Country Planning (General Development Procedure) Order 1995 (as cited in the checklists)
source-text: A location plan which identifies the land to which the application relates drawn to an identified
  scale – usually OS based at no less than 1:2500 - it must be recent and extensive enough to ensure that
  the exact location is clear. The direction of north to be shown, the site edged red and any adjoining
  land in the applicants ownership edged in blue.
must-include:
- item: Drawn to an identified scale, usually Ordnance Survey based at no less than 1:2500
  level: must
- item: Recent, and extensive enough to make the exact location clear
  level: must
- item: Direction of north shown
  level: must
- item: Site edged red
  level: must
- item: Any adjoining land in the applicant's ownership edged blue
  level: must
