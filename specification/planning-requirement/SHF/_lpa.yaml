validation-list:
  url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements
  date: 2020-07
  date-basis: 'Sheffield has no single list document: its Local Planning Application Requirements (LPAR)
    are the web pages under ''Planning application requirements''. The ''Safeguards for planning applicants''
    page says ''These LPAR were last reviewed in July 2020 and only very minor adjustments ... were implemented''.
    The three checklists on the Information requirements page (planning permission, householder, listed
    building consent) are dated ''7th January 2013''. Checked 2026-11-06: no newer list, consultation
    or adoption notice on the council''s site; MHCLG''s register (entity 20283) also points to the web
    pages (''There is no document, the information is on a webpage''). Last reviewed more than two years
    ago, so outdated. Each file cites the page or checklist its wording comes from.'
  status: outdated
submission-standards:
- item: 'Paper applications: one copy of every form, drawing or document; two copies for a major scheme
    or a site in a parish or town council area'
  level: must
- item: Drawings preferably at 1:50 or 1:100 scale
  level: should
- item: Key dimensions (main external dimensions and distance to nearby boundaries) shown on drawings,
    to help people who cannot measure electronic plans
  level: should
