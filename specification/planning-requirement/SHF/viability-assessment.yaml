reference: viability-assessment
local-authority: SHF
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 dwellings or more.
    - all:
      - condition:
          field: educational-accommodation
          value: true
          description: Student cluster housing.
      - condition:
          field: bedroom-count
          operator: '>='
          value: 60
          description: 60 bedspaces or more.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The developer considers they cannot meet the full affordable housing contribution.
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/affordable-housing
policy: Sheffield Core Strategy Policy CS40; CIL and Planning Obligations SPD (2015)
source-text: Where the developer considers that they cannot meet the full affordable housing contribution,
  agreement will need to be reached on a viable level of provision. In these circumstances, the applicant
  will be asked to provide a full financial appraisal.
must-include:
- item: Full financial appraisal with a full breakdown of development costs, first sent to CP Viability
    with a covering letter (a copy of the letter is submitted with the application)
  level: must
- item: Scheme drawings, layouts, brief specifications and house/building sizes
  level: must
- item: Anticipated sale prices or lease rents, with evidence of the values of similar schemes in the
    locality
  level: must
- item: Land cost and fees
  level: must
- item: Build costs of the houses/units and site infrastructure, supported by independent quantity surveyor
    estimates
  level: must
- item: Cost of any 'abnormals', with supporting reports and independent estimates
  level: must
- item: Design and project management fees, planning and building regulation fees
  level: must
- item: Cost of geotechnical and environmental surveys, with a summary of the findings
  level: must
- item: Interim/development finance calculation with details of the loan facility from the funder
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'affordable-housing' web page. The page says the Affordable Housing Statement, the full financial appraisal
  and the covering letter to CP Viability 'are required to validate the application'. The applicant pays
  for the independent appraisal upfront; both appraisals are published.
review-status: unverified
field-status: {}
