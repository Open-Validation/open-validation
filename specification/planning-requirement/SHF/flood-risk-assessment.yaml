reference: flood-risk-assessment
local-authority: SHF
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
