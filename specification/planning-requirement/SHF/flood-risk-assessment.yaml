reference: flood-risk-assessment
local-authority: SHF
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater.
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: A change of use to a more vulnerable class (for example from commercial to residential).
    - discretionary
  - site:
      in:
      - critical-drainage-area
      description: An area within flood zone 1 which has critical drainage problems as notified by the
        Environment Agency.
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/flood-risk-assessment-local-planning
source-text: 'A Flood Risk Assessment is required in the following instances: in Flood zone 1: Development
  of 1 hectare or greater less than 1 ha in flood zone 1, including a change of use in development type
  to a more vulnerable class (for example from commercial to residential), where they could be affected
  by sources of flooding other than rivers and the sea (for example surface water drains, reservoirs).
  in an area within flood zone 1 which has critical drainage problems as notified by the Environment Agency.
  in Flood zones 2 and 3: All development'
must-include:
- item: The risks to and from the development from all forms of flooding identified and assessed
  level: must
- item: How these risks will be managed, taking account of climate change
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Safe access to and from the development
  level: must
- item: Surface water management integrated into the design (which may include SuDS)
  level: must
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'flood-risk-assessment-local-planning' web page. A site under 1 hectare in flood zone 1 changing to
  a more vulnerable class needs one only 'where they could be affected by sources of flooding other than
  rivers and the sea', which is a judgement, so that part shows as discretionary. The page advises passing
  the Sequential Test first.
review-status: unverified
field-status: {}
