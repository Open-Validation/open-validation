reference: design-and-access-statement
local-authority: SHF
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.sheffield.gov.uk/planning-development/planning-application-requirements/design-access-statements
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and access statements are required when: major development (from 10 houses or 1,000
  sq m floor space) in a conservation area (from 1 house or 100 sq m) any listed building application'
must-include:
- item: The design principles and concepts that have been applied to the development
  level: must
- item: How the proposed development's context has influenced the design
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation undertaken in relation to access issues, and how its outcome has informed the
    development
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'Listed building consent: includes a heritage statement setting out how the design has taken account
    of, and seeks to preserve, the historic and architectural importance of the building'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Design and Access Statement, including a heritage statement which sets out how the design
    has taken account of, and seeks to preserve, the historic and architectural importance of the building
confidence: medium
notes: From the council's list (Local Planning Application Requirements, last reviewed July 2020), the
  'design-access-statements' web page; the listed building consent checklist ('Listed Building Requirements',
  7 January 2013), page 2. The 2013 householder checklist says 'only for conservation areas' and the planning
  permission checklist lists it without a trigger; the newer Design and access statements page gives the
  national triggers used here.
review-status: unverified
field-status: {}
