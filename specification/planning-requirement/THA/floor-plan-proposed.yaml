reference: floor-plan-proposed
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: external-alterations
          value: true
          description: Alterations and/or extensions to an existing building are proposed.
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use of buildings to any residential use.
  - all:
    - application-type:
        in:
        - hh
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Alterations and/or extensions to an existing building are proposed.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: For all new buildings and for all proposals where external alterations and extensions are
  proposed and a change of use of buildings to any residential use is proposed ... Where alterations and/or
  extensions to an existing building are proposed.
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Any floor plans that would be created or altered by the development, clearly and accurately shown
  level: must
- item: Any walls to be demolished highlighted
  level: should
- item: The uses of any proposed new rooms
  level: should
confidence: medium
notes: From the council's list (published April 2018), page 2 of the Full and Outline checklist (003),
  page 2 of checklists 001 and 002, page 1 of checklist 011. The second quoted part is from the Householder
  (001, 002) and Listed Building Consent (011) checklists. Existing floor plans only where there is an
  existing building.
review-status: unverified
field-status: {}
