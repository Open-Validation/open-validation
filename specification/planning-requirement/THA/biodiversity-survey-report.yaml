reference: biodiversity-survey-report
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: protected-species
      value: true
      description: The proposal affects a traditional timber framed building (e.g. a barn or oast house);
        develops meadows, grassland, parkland or pasture linked to other semi-natural habitat; has ponds
        or slow flowing water bodies (e.g. ditches) on or within 500 metres of the site linked by semi-natural
        habitat; or has rough grassland on or immediately next to the site.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Where the proposal affects a traditional timber framed building (for example a barn or oast
  house Development of meadows, grassland, parkland and pasture on, adjacent to or linked to the site
  be other semi-natural habitat Ponds or slow flowing water bodies (e.g. ditches) are found on or within
  500 metres of the site and linked by semi-natural habitat Rough grassland on or immediately adjacent
  to the site
must-include:
- item: What protected species may be using the site and where they are found, concentrating on bats,
    breeding birds, reptiles, badger, great crested newt, water vole and invertebrates
  level: must
- item: Proposals for mitigating the impact of the development
  level: must
confidence: medium
notes: From the council's list (published April 2018), page 3 of the Full and Outline checklist (003).
  The checklist calls it 'Ecological Assessment/Protected Species Survey [Phase One]'. The four site circumstances
  are combined in one protected-species condition.
review-status: unverified
field-status: {}
