reference: heritage-statement
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - demolition-con-area
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Demolition of a building/structure.
  - application-type:
      in:
      - lbc
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Where demolition of a building/structure in a Conservation Area is proposed ... All Applications
must-include:
- item: An assessment of the contribution of the building to the character and appearance of the Conservation
    Area
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition in a conservation area.
- item: An explanation and justification for the proposed demolition
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition in a conservation area.
- item: The significance of the heritage asset and the impact of the proposals, in accordance with the
    NPPF, including any archaeological impacts
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: The listing details of the property
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published April 2018), page 3 of the Full and Outline checklist (003);
  page 2 of checklists 002 and 011. 'All Applications' is from the Householder and Listed Building Consent
  (002) and Listed Building Consent (011) checklists. It can be included in the design and access statement.
review-status: unverified
field-status: {}
