reference: roof-plan-existing
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - condition:
      field: roof-alteration
      value: true
      description: Any roof is being altered.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Where any roof is being altered.
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: The shape of the roof, including any areas cut away or proposed to be used for balconies or seating
  level: must
confidence: medium
notes: From the council's list (published April 2018), page 3 of the Full and Outline checklist (003),
  page 2 of checklists 001 and 002. Checklist 002 covers householder and listed building consent applications.
review-status: unverified
field-status: {}
