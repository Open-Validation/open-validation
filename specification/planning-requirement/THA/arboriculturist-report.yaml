reference: arboriculturist-report
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: trees-on-or-near-site
      value: true
      description: The development will affect trees covered by a TPO or in a conservation area, or trees
        within or next to the site, including street trees.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: When the development will affect any trees covered by a Tree Preservation Order or within
  a Conservation Area, or if the proposal is likely to affect trees within the application site or adjacent
  to the site including street trees.
must-include:
- item: Survey drawings showing the position of any existing trees and their canopy spread
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Trees to be felled and any pruning required during and after construction
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: A full tree survey, including a plan showing the location of the tree
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published April 2018), page 4 of the Full and Outline checklist (003);
  page 2 of the Householder checklist (001). The checklists call it 'Tree Survey/Arboricultural Survey'
  and 'Tree Report/Survey'.
review-status: unverified
field-status: {}
