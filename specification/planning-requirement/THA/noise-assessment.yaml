reference: noise-assessment
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Industrial uses in class B2 proposed within 10 metres of a boundary with residential
          property, or waste management facilities.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Residential uses proposed next to or close to noise generating industrial uses.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: For industrial uses falling within class B2 (general industrial uses) and that are proposed
  within 10 metres of a boundary with residential property and waste management facilities. For proposed
  residential uses that are adjacent to or within close proximity of noise generating industrial uses
must-include:
- item: A professional noise assessment
  level: must
- item: The impact of the use on the amenity of existing residential properties, or for new homes the
    likely impact on the amenity of their occupiers
  level: must
- item: Any mitigation proposals
  level: must
confidence: medium
notes: From the council's list (published April 2018), page 5 of the Full and Outline checklist (003).
review-status: unverified
field-status: {}
