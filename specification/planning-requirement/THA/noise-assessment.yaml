reference: noise-assessment
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: noise-generating-use
      value: true
      description: Class B2 industrial uses proposed within 10 metres of a boundary with residential property,
        and waste management facilities.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Noise Impact Assessment When required? For industrial uses falling within class B2 (general
  industrial uses) and that are proposed within 10 metres of a boundary with residential property and
  waste management facilities.
must-include:
- item: The impact of the use on the amenity of existing residential properties, or for new residential
    development the likely impact on the amenity of the occupiers, including any mitigation proposals
  level: must
confidence: low
notes: 'Audit (wrong_trigger): the noise trigger was in the workbook''s rural workers row; the noise row
  held its content and the LVIA text. The audit couldn''t read this council''s list, so its contents weren''t
  checked.'
review-status: unverified
field-status: {}
