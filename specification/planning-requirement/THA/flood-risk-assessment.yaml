reference: flood-risk-assessment
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Within Environment Agency Flood Zone 2 or 3.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Over 1 hectare in size in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Over 1 hectare in size in Flood Zone 1.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: When the development is within Environment Agency Flood Zone areas 2 or 3 OR is over 1 hectare
  in size in Flood Zone 1
confidence: medium
notes: From the council's list (published April 2018), page 4 of the Full and Outline checklist (003).
review-status: unverified
field-status: {}
