reference: elevation-proposed
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - any:
      - condition:
          field: new-build
          value: true
          description: 'New buildings (for householders: such as garages/outbuildings).'
      - condition:
          field: external-alterations
          value: true
          description: Alterations and/or extensions to an existing building are proposed.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-boundary-treatment
        value: true
        description: New boundary treatments are proposed.
  - application-type:
      in:
      - advertising
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: For all new buildings and for all proposals where extensions or alterations to an existing
  building are proposed ... Where alterations and/or extensions to an existing building are proposed,
  when new buildings, such as garages/outbuildings are proposed or where new boundary treatments are proposed.
  ... Drawing/Sections – Scale 1:100 or 1:50 When required? All applications
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Any elevations that would be created or altered by the development, clearly and accurately shown,
    with all elevations clearly labelled
  level: must
- item: 'For new buildings or structures: the relationship of the new building to neighbouring buildings'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: new-build
        value: true
        description: New buildings or structures are proposed.
- item: Proposed building materials and the style and materials of windows and doors
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For adverts: the advert shown in context on the existing building, if applicable'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For adverts: advertisement drawings showing its size, a cross section through it, position on
    the land or building, materials, colours, style of lettering and symbols, height above the ground
    and extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published April 2018), page 2 of the Full and Outline checklist (003),
  page 2 of the Householder checklist (001), page 1 of the Listed Building Consent (011) checklist, pages
  1-2 of the Advertisement checklist (012). The second quoted part is from the householder checklists
  (001, 002); the third ('Drawing/Sections') from the Advertisement checklist (012), where proposed elevations
  are also asked for when the advert is on an existing building/structure.
review-status: unverified
field-status: {}
