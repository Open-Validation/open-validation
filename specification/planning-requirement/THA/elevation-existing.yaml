reference: elevation-existing
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Alterations and/or extensions to an existing building are proposed.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: The advert is proposed on an existing building/structure.
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Where alterations and/or extensions to an existing building are proposed. ... All applications
  where the advert is proposed on an existing building/structure
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: The existing appearance of the building, with all elevations clearly labelled
  level: must
confidence: medium
notes: From the council's list (published April 2018), page 2 of the Full and Outline checklist (003),
  page 1 of the Householder (001), Listed Building Consent (011) and Advertisement (012) checklists, page
  2 of checklist 002. The second quoted part is from the Advertisement checklist (012).
review-status: unverified
field-status: {}
