reference: design-and-access-statement
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: 1 or more dwelling houses.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: A building or buildings creating 100 sq m or more of floor space.
  - application-type:
      in:
      - lbc
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Any major development (10 houses or 1000 or more square metres of floorspace) anywhere in
  Thanet. Development in Conservation Areas where the proposal is for the provision of 1 or more dwelling
  houses or the provision of a building or buildings where the floor space created is 100square metres
  or more. ... All Applications
must-include:
- item: The design principles and concepts applied to the development
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The policy adopted as to access, and how access policies in relevant local development documents
    have been taken into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Any consultation undertaken on access, and what account has been taken of the outcome
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: How any specific issues which might affect access to the development have been addressed
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (published April 2018), page 2 of the Full and Outline checklist (003);
  page 1 of checklist 002 and page 2 of checklist 011. 'All Applications' is from the Householder and
  Listed Building Consent (002) and Listed Building Consent (011) checklists. 'Major' is shown as MHCLG's
  major-development definition; the checklist describes it as '10 houses or 1000 or more square metres
  of floorspace'.
review-status: unverified
field-status: {}
