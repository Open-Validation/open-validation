reference: land-contamination-assessment
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - contaminated-land
      description: 'Former petrol filling sites, commercial garages, landfill sites and other brownfield
        sites where contamination is known or suspected (householder: the site is known to be contaminated
        land).'
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: For redevelopment of former petrol filling sites; commercial garages; landfill sites and
  other brownfield sites where contamination is known or suspected ... When the development is known to
  be contaminated land
must-include:
- item: A desk based study
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Reports of on-site investigations, if warranted by the desk study
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - discretionary
- item: A contaminated land preliminary risk assessment
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published April 2018), page 4 of the Full and Outline checklist (003);
  page 2 of the Householder checklist (001). The second quoted part is from the Householder checklist
  (001).
review-status: unverified
field-status: {}
