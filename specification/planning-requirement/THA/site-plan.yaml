reference: site-plan
local-authority: THA
required-if:
  application-type:
    in:
    - hh
    - lbc
    - full
    - outline
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/002-Householder-and-Listed-Building-Consent-%E2%80%93-Validation-Checklist.pdf
source-text: 'Householder, Listed building consent:  Proposed Site Plan – Scale 1:500 or 1:200 When required?
  All applications other than alterations to roof or fenestration What information is The plan must show
  the proposed development in relation to the site required? boundaries, neighbouring properties and other
  existing buildings on the site.


  Outline:  Site/Block Plan – Scale 1:500 or 1:200 When required? All applications excluding change of
  use where no external alterations are proposed What information is The plan must show the proposed development
  in relation to the site required? boundaries and other existing buildings on the site, details of all
  proposed parking should be shown on the drawings.'
must-include:
- item: Scale 1:500 or 1:200
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Neighbouring properties
  level: must
  required-if:
    application-type:
      in:
      - hh
      - lbc
- item: Details of all proposed parking
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
