reference: site-plan
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: building-works
          value: true
          description: Any proposal other than a change of use with no external alterations.
      - condition:
          field: external-alterations
          value: true
          description: A change of use with external alterations.
  - application-type:
      in:
      - hh
      - lbc
      - advertising
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: All applications excluding change of use where no external alterations are proposed ... All
  applications other than alterations to roof or fenestration
must-include:
- item: At a scale of 1:500 or 1:200
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: Neighbouring properties
  level: must
  required-if:
    application-type:
      in:
      - hh
      - lbc
- item: Details of all proposed parking
  level: should
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
- item: Any trees or public rights of way affected by the development
  level: should
- item: Any boundary walls or fencing proposed as part of the development
  level: should
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
confidence: medium
notes: From the council's list (published April 2018), page 1 of each of the Full and Outline (003), Householder
  (001), Householder and Listed Building Consent (002), Listed Building Consent (011) and Advertisement
  (012) checklists. The second quoted part is from the householder checklists (001, 002). For householder
  applications the plan is not needed when the proposal only alters the roof or fenestration; there is
  no field for that exclusion, so the rule shows every householder application. Listed building consent
  and advertisement checklists say 'All applications'.
review-status: unverified
field-status: {}
