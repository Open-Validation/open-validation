reference: transport-assessment
local-authority: THA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 100
          description: Residential development of 100 dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1000
          description: Retail and/or employment/leisure uses of 1000 sq m or more.
  - application-type:
      in:
      - waste-dev
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: Residential development of 100 dwellings; Retail and/or employment/leisure uses of 1000m2.or
  more; and waste management facilities
must-include:
- item: The transport implications of the proposal, including access to the site by different modes
  level: must
- item: The impact on any nearby trunk road
  level: must
confidence: medium
notes: From the council's list (published April 2018), page 4 of the Full and Outline checklist (003).
review-status: unverified
field-status: {}
