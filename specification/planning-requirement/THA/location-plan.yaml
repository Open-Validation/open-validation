reference: location-plan
local-authority: THA
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: All applications
must-include:
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: On A4
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Up to date map with the site edged clearly with a red line
  level: must
- item: The direction of north
  level: should
- item: At least two road names, where practicable
  level: should
- item: Covers a large enough area for the location to be found easily
  level: must
- item: A blue line around any other land owned by the applicant
  level: should
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (published April 2018), page 1 of the Full and Outline checklist (003),
  and page 1 of the Householder (001), Householder and Listed Building Consent (002), Listed Building
  Consent (011) and Advertisement (012) checklists. Checklists 002 and 012 exclude non-material amendments
  and variation of conditions.
review-status: unverified
field-status: {}
