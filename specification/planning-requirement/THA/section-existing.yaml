reference: section-existing
local-authority: THA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change in level is proposed, e.g. on a sloping site.
    - all:
      - application-type:
          in:
          - hh
      - condition:
          field: ground-disturbance
          value: true
          description: 'Householder: excavation is proposed.'
source-url: https://www.thanet.gov.uk/wp-content/uploads/2018/03/003-Full-and-Outline-Planning-Permission-Validation-Checklist.pdf
source-text: When a change in level is proposed eg on a sloping site ... When a change in existing land
  level or excavation is proposed e.g. on a sloping site
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Existing and proposed site levels and finished floor levels, related to a defined datum point
  level: should
confidence: medium
notes: From the council's list (published April 2018), page 3 of the Full and Outline checklist (003),
  page 2 of checklists 001 and 002. The second quoted part is from the Householder checklist (001).
review-status: unverified
field-status: {}
