reference: heritage-statement
local-authority: SAL
required-if:
  any:
  - application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - hh
        - outline-some
        - outline-all
        - reserved-matters
    - site:
        in:
        - listed-building
        - conservation-area
        - locally-listed-building
        - archaeological-priority-area
        - park-and-garden
        description: The application is likely to affect designated heritage assets (e.g. listed buildings
          and conservation areas) or non-designated heritage assets such as locally listed buildings,
          areas of local archaeological importance and locally listed gardens.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Minor%202023.pdf
policy: Harpenden Neighbourhood Plan policy ESD2; St Stephen Parish Neighbourhood Plan policy S4; Sandridge
  Neighbourhood Plan policy E5
source-text: 'This is required for Applications which are likely to affect: Designated heritage assets
  (e.g. Listed Buildings and Conservation Areas) Non designated heritage assets such as Locally Listed
  Buildings, Areas of local archaeological importance and Locally Listed Gardens'
must-include:
- item: As a minimum, a reference to the appropriate Historic Environment Records
  level: must
- item: The significance of the heritage asset, including any contribution made by its setting
  level: must
- item: An impact assessment describing any potential impact of the proposals on the significance of the
    heritage assets affected, including any contribution made by their setting
  level: must
- item: A structural survey, if required
  level: must
  required-if: discretionary
- item: Why the applicant thinks they are entitled to a certificate, i.e. why the works do not affect
    the special architectural or historic interest of the listed building and will not affect its character
  level: must
  required-if:
    application-type:
      in:
      - ldc-proposed-work-lb
  source-text: This shall include the reasons why the applicant thinks they are entitled to a Certificate
    of Lawfulness of Proposed Works i.e. why they think the proposed works do not affect the special architectural
    or historic interest of the listed building
confidence: medium
notes: From the council's list (checklists published 2023), minor full checklist page 13; major full page
  14. Also on the householder, householder and listed building consent, listed building consent, outline,
  reserved matters, demolition in a conservation area and lawful development (proposed works to a listed
  building) checklists. Listed building consent, demolition in a conservation area and lawful development
  certificates for works to a listed building always affect a heritage asset, so they always need it.
review-status: unverified
field-status: {}
