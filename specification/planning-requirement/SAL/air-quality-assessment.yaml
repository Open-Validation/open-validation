reference: air-quality-assessment
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - site:
        in:
        - air-quality-management-area
        description: The site is within an Air Quality Management Area.
    - any:
      - discretionary
      - condition:
          field: sensitive-end-use
          value: true
          description: A sensitive use (e.g. a new residential use) within the AQMA.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: This information is required for an application which proposes a use or development which
  has the potential to impact air quality and is located within an Air Quality Management Area or if the
  proposal is for a sensitive use (e.g. a new residential use) located within the AQMA.
must-include:
- item: An assessment of potential impacts of the development on local air quality, with proposed mitigation
    where necessary
  level: must
- item: 'For sensitive uses within the AQMA: proposed mitigation measures only'
  level: must
  required-if:
    condition:
      field: sensitive-end-use
      value: true
      description: A sensitive use within the AQMA.
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 8. Also on the minor
  full and outline checklists. A use with the potential to impact air quality is shown as discretionary.
  The reserved matters checklist says only 'potential to impact air quality' (discretionary). The list
  cites the NPPF only.
review-status: unverified
field-status: {}
