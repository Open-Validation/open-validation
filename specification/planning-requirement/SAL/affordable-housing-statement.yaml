reference: affordable-housing-statement
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 or more new residential units.
  - all:
    - application-type:
        in:
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more new residential units.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 7A; Affordable Housing SPG (March 2004); Harpenden
  Neighbourhood Plan policy H6; Sandridge Neighbourhood Plan policy D3
source-text: Required for applications providing 15 or more new residential units.
must-include:
- item: The number, size (number of bedrooms) and type of proposed affordable units, including their proposed
    location
  level: must
- item: The size of each type (square metres)
  level: must
- item: Future management and tenure
  level: must
- item: Contact details for the chosen Registered Provider, or confirmation of agreement to the financial
    contribution when requested
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 7. Also on the outline
  checklists (15 or more units). The reserved matters checklist (https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Reserved%20Matters%202023.pdf,
  page 6) says '10 or more new residential units'.
review-status: unverified
field-status: {}
