reference: planning-statement
local-authority: SAL
required-if:
  any:
  - site:
      in:
      - green-belt
      description: Applications within the Metropolitan Green Belt.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Applications for 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: 0.5 hectares, if it is not known how many dwellings are proposed.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Building(s) where the floor space to be created is 1,000 square metres.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Sites of 1 hectare or more.
  - application-type:
      in:
      - pa-demo-building
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20OUTLINE%20WITH%20SOME%20MATTERS%20RESERVED%202023.pdf
source-text: 'Supporting Planning Statement Required for: Applications within the Metropolitan Green Belt
  … Required for: Applications for 10 or more dwellings, or 0.5 hectares if is not known how many dwellings
  are proposed Applications for a building or buildings where the floor space to be created by the development
  is 1,000 square metres Application on a sit…'
must-include:
- item: A full explanation of the proposal including any relevant background or site history
  level: should
- item: The context and need for the proposed development, including justifications
  level: should
- item: An overview of how the proposal accords with the Local Plan, Neighbourhood Plans and other relevant
    documents
  level: should
- item: Current/last use and a detailed justification for the demolition
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: 'Audit (wrong_trigger): the Full planning excerpt was the Recycling/Waste Strategy trigger. The
  Green Belt trigger is from the Householder checklist; the size thresholds from the Outline and Major
  checklists (''sites of 1ha+'' per the audit). The s73 checklist says an application ''may include''
  one.'
review-status: unverified
field-status: {}
