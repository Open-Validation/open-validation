reference: planning-statement
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - green-belt
        description: The site is within the Metropolitan Green Belt.
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - discretionary
  - application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
      - pa-build-agri-forest
      - pa-demo-building
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994; Harpenden Neighbourhood Plan 2019; Sandridge Neighbourhood
  Plan policies D4 and D5
source-text: 'Required for: Applications for 10 or more dwellings, or 0.5 hectares if is not known how
  many dwellings are proposed. Applications for a building or buildings where the floor space to be created
  by the development is 1,000 square metres Application on a site having an area of 1 hectare or more
  … Applications within the Metropolitan Green Belt'
must-include:
- item: A full explanation of the proposal, including any relevant background or site history
  level: must
- item: The context and need for the proposed development, including justification for any change of use
  level: must
- item: An overview of how the proposal accords with the Local Plan and other relevant documents
  level: must
- item: Details of any consultation with statutory consultees and the local community
  level: must
  required-if:
    ref: major-development
- item: 'Lawful development certificates: the case for the application, including legislation or why the
    development is lawful'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
  source-text: To put forward the case in favour of the application, including details such as legislation
    or why the development is lawful.
- item: 'Prior notification of agricultural development: the area of the agricultural unit, the area of
    the parcel to be developed, the purpose of the development and whether it is reasonably required for
    agriculture or forestry, and the materials'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
- item: 'Prior notification of demolition: the current or last use (including whether a drinking establishment)
    and a detailed justification for the demolition'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 19 and the householder
  checklist page 12. Called a Supporting Planning Statement. The thresholds are those of major development.
  Householder applications need it in the Metropolitan Green Belt. The advert checklists say it 'may be
  required for Conservation Area location' and the Section 73 checklist says supporting information 'may
  include a Planning Statement', so both show as discretionary. The lawful development (existing and proposed)
  and prior notification (agricultural building, demolition) checklists list a statement without conditions.
  The neighbourhood plan sections list other documents that 'may also be required'.
review-status: unverified
field-status: {}
