reference: arboriculturist-report
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - reserved-matters
        - demolition-con-area
        - hedgerow-removal
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Significant trees within the site, or street trees, may be affected by the development
            or construction works, including storage of materials.
      - site:
          in:
          - tree-preservation-zone
          description: A Tree Preservation Order protects trees on the site, or the development is near
            protected trees on neighbouring land.
      - all:
        - site:
            in:
            - conservation-area
            description: The site is in a conservation area.
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Trees are present on a conservation area site.
  - all:
    - application-type:
        in:
        - pa-demo-building
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Significant trees within the site, or street trees, may be affected by the development
            or construction works, including storage of materials.
      - site:
          in:
          - tree-preservation-zone
          description: A Tree Preservation Order protects trees on the site, or the development is near
            protected trees on neighbouring land.
  - all:
    - application-type:
        in:
        - outline-some
        - outline-all
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Significant trees within the site, or street trees, may be affected by the development
            or construction works, including storage of materials.
      - site:
          in:
          - tree-preservation-zone
          description: A Tree Preservation Order protects trees on the site, or the development is near
            protected trees on neighbouring land.
      - all:
        - site:
            in:
            - conservation-area
            description: The site is in a conservation area.
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Trees are present on a conservation area site.
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 74; Harpenden Neighbourhood Plan policy ESD14
source-text: 'This is required where: There are significant trees within the site or street trees that
  may be affected by the development or construction works, including storage of materials; or There is
  a Tree Preservation Order protecting trees on the application site; or The proposed development is sited
  near to a protected tree(s) on neighbouring land; or For application sites within Conservation Areas
  where trees are present.'
must-include:
- item: A tree survey and arboricultural implications assessment, including a tree protection method statement,
    to BS5837:2012
  level: must
- item: How trees will be protected during demolition and site clearance
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 17. Called a Tree
  Survey and Arboricultural Implications Assessment including Tree Protection Method Statement. Also on
  the minor full, householder (and with listed building consent), reserved matters, demolition in a conservation
  area and prior notification of demolition checklists, and the hedgerow removal checklist (June 2017).
  The outline checklists need it 'when layout is being sought', shown as discretionary.
review-status: unverified
field-status: {}
