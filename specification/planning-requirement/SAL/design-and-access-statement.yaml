reference: design-and-access-statement
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor area of 100 square metres or more.
  - application-type:
      in:
      - reserved-matters
      - lbc
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20OUTLINE%20WITH%20SOME%20MATTERS%20RESERVED%202023.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Sandridge Neighbourhood
  Plan policy E2; St Stephen Parish Neighbourhood Plan policies S3 and S5
source-text: 'Required for major development and for sites situated within a conservation area where the
  proposal consists of: One or more dwellings; or A building or buildings with a floor area of 100 square
  metres or more.'
must-include:
- item: The design principles and concepts that have been applied to the development
  level: must
- item: How the design of the development takes the context of the site into account
  level: must
- item: The approach to access, and how Local Plan policies relating to access have been taken into account
  level: must
- item: What, if any, consultation has been undertaken on access and how it has informed the approach
    to access
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), outline checklists page 2; major full page
  2; minor full page 2. The wording is from the outline checklists; the minor full checklist gives the
  conservation area part only, the major full checklist lists it without conditions, and the reserved
  matters, listed building consent and householder with listed building consent checklists list it without
  conditions.
review-status: unverified
field-status: {}
