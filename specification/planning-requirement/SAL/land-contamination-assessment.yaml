reference: land-contamination-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected.
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: Where contamination is known or suspected, i.e. potentially contaminative former use such
  as industrial/commercial/agricultural.
must-include:
- item: Carried out by or under the direction of a suitably qualified competent person
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 15. Also on the
  minor full, outline and reserved matters checklists. A suspected contaminative former use is shown as
  discretionary. The list cites the NPPF only.
review-status: unverified
field-status: {}
