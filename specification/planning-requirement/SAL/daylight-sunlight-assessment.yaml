reference: daylight-sunlight-assessment
local-authority: SAL
required-if: discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist-%20%20Householder%20and%20Listed%20Building%20Consent%202023.pdf
source-text: 'Householder, Listed building consent: degree line, a Daylight and Sunlight Assessment will
  be required in order to establish the level of harm which would occur from the proposed development.


  Full planning: levels of daylight/sunlight enjoyed by adjoining properties or building(s), including
  associated gardens or amenity space, a Daylight and Sunlight Assessment will be required in order to
  establish the level of harm which would occur from the proposed development.


  Outline: proposed development, a Daylight and Sunlight Assessment will be required in order to establish
  the level of harm which would occur from the proposed development.'
must-include:
- item: Diagrams of how the shadows of the building will impact on neighbours for all four quarters of
    the year
  level: should
  source-text: Should include diagrams of how the shadows of the building will impact on neighbours for
    all four quarters of the year.
