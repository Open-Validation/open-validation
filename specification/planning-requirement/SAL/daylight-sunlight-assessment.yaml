reference: daylight-sunlight-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline-some
      - reserved-matters
  - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policies 70 and 72
source-text: Required where there is a potential adverse impact upon the current levels of daylight/sunlight
  enjoyed by adjoining properties or building(s), including associated gardens or amenity space, a Daylight
  and Sunlight Assessment will be required in order to establish the level of harm which would occur from
  the proposed development.
must-include:
- item: Diagrams of how the shadows of the building will affect neighbours in all four quarters of the
    year
  level: must
- item: Diagrammatic and technical information showing the BRE guide 'Site Layout Planning for Daylight
    and Sunlight' (2nd edition) is met
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 12. Shown as discretionary.
  The minor full and outline (some matters reserved, when scale is sought) checklists ask for it for tall
  buildings and proposals that break the established building grain and street pattern or affect light
  sensitive buildings; the householder checklists where primary side facing windows exist and the proposal
  would breach a 25 degree line (or the 45 degree line).
review-status: unverified
field-status: {}
