confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 19. Listed without
  conditions or guidance on the full, outline and reserved matters checklists. The advertisement checklists
  say photographs 'may be required'; the larger home extension checklist asks for them if a neighbour
  objects; the listed building consent and demolition in a conservation area checklists list them under
  information that 'could' be included. Those show as discretionary.
