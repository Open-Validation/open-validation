source-text: 'Full planning: Photographs/Photomontages and Contextual Drawings Recycling / Waste Strategy
  Supporting Planning Statement Required for any new mixed use development, any major development and
  any development involving blocks of apartments.


  Outline: Photographs/Photomontages and Contextual Drawings See article 7(1)(c)(ii) of the Town and Country
  Planning (Development Management Procedure (England) (Order) 2015 Recycling / Waste Strategy Required
  when layout is being sought.


  Listed building consent: This could include: • Photographs • Schedule of works • Method Statement for
  the works/repairs • Technical specifications of materials/finishes (e.g. a lime mortar specification)
  • Information on proposed changes to services (e.g. new plumbing) • Samples of proposed materials (to
  be viewed on site) Archaeology Assessment All submitted plans and drawings must have written dimensions.


  Advertisement consent: Annotated photographs may be required to indicate the location of the proposed
  sign(s).


  Lawful development cert: This could include: • Photographs • Existing and proposed floorplans and/or
  elevations at a scale of 1:50 or 1:100 • Sections at a scale of 1:50 or 1:100 • Detailed sections or
  drawings at a scale of 1:10 or 1:20 • Schedule of works • Method Statement for the works/repairs • Technical
  specifications of materials/finishes (e.g. a lime mortar specification) All submitted plans and drawings
  must have written dimensions.


  Demolition in cons area: This could include: • Photographs • Schedule of works • Method Statement for
  the works/repairs • Technical specifications • Samples of proposed materials (to be viewed on site)
  need for conditions on a decision notice.'
