reference: transport-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - ref: major-development
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 34; Sandridge Neighbourhood Plan policies T1,
  T2 and T3; St Stephen Parish Neighbourhood Plan policies S11, S13, S14 and S15
source-text: All developments which are likely to generate significant amount of vehicle movement i.e.
  major developments
must-include:
- item: Enough information to assess the highways and traffic impact of the development
  level: must
- item: Existing conditions and development details
  level: should
- item: Predicted person trip generation and mode splits, and predicted residual vehicle trip generation
    based on travel plan measures
  level: should
- item: Distribution of residual vehicle trips and junction capacity assessments
  level: should
- item: Details of the proposed mitigation measures
  level: should
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 21. Also on the
  minor full, outline and reserved matters checklists.
review-status: unverified
field-status: {}
