reference: archaeological-assessment
local-authority: SAL
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks are proposed.
  - site:
      in:
      - scheduled-monument
      - archaeological-priority-area
      description: Within a Scheduled Monument, an archaeological site for local preservation or an archaeological
        site subject to recording conditions.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: 'Archaeology Assessment An archaeological desk based assessment is required for all applications
  where groundworks are proposed within a: Scheduled Monument Archaeological sites for local preservation
  Archaeological sites subject to recording conditions'
must-include:
- item: Previous nearby finds recorded in the historic environment record
  level: should
- item: The archaeological potential of the site
  level: should
- item: The results of an archaeological evaluation
  level: should
  required-if:
    condition:
      field: basement
      value: true
      description: New basements, extensions to basements or other extensive groundworks.
  source-text: Where such proposals include new basements, extensions to basements or other extensive
    groundworks, the results of an archaeological evaluation should be included.
confidence: medium
notes: 'Audit (wrong_trigger): the Householder/LBC excerpt was drawing-dimension text; the trigger is
  from the Major and Outline checklists.'
review-status: unverified
field-status: {}
