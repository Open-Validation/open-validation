reference: archaeological-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline-some
      - outline-all
      - reserved-matters
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks are proposed.
  - site:
      in:
      - scheduled-monument
      - archaeological-priority-area
      description: A Scheduled Monument, an archaeological site for local preservation or an archaeological
        site subject to recording conditions.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 111; Sandridge Neighbourhood Plan policy E5;
  St Stephen Parish Neighbourhood Plan policy S4
source-text: 'An archaeological desk based assessment is required for all applications where groundworks
  are proposed within a: Scheduled Monument Archaeological sites for local preservation Archaeological
  sites subject to recording conditions'
must-include:
- item: Previous nearby finds recorded in the historic environment record
  level: must
- item: The archaeological potential of the site
  level: must
- item: A written scheme of investigation
  level: must
  required-if: discretionary
- item: The results of an archaeological evaluation
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: New basements, basement extensions or other extensive groundworks.
  source-text: Where such proposals include new basements, extensions to basements or other extensive
    groundworks, the results of an archaeological evaluation should be included.
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 9. Called an Archaeology
  Assessment. Also on the minor full, householder (and with listed building consent), outline and reserved
  matters checklists.
review-status: unverified
field-status: {}
