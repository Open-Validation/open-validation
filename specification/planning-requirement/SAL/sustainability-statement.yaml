reference: sustainability-statement
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - ref: major-development
  - application-type:
      in:
      - outline-some
      - outline-all
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Harpenden Neighbourhood Plan policies ESD1, ESD13, ESD15-ESD19; Sandridge Neighbourhood Plan policy
  D6; St Stephen Parish Neighbourhood Plan policy S6
source-text: 'Climate Change Statement This should cover: … For major development, this should cover:'
must-include:
- item: Measures taken or to be taken to reduce energy demand beyond the minimum required by Building
    Regulations
  level: must
- item: Measures to limit the carbon consumed through implementation and construction (e.g. reusing on-site
    materials, sourcing locally, more sustainable construction methods)
  level: must
- item: Measures to use renewable or low carbon energy sources
  level: must
- item: Measures to reduce potential flooding impacts of the development
  level: must
- item: Measures to promote biodiversity in the development
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 11; outline checklists
  pages 11 and 9; reserved matters page 10. Called a Climate Change Statement. Only the major full planning
  checklist names it for full applications, so full applications show it for major development. The reserved
  matters checklist says 'for major development'; the outline checklists list it for all outline applications.
review-status: unverified
field-status: {}
