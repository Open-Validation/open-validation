reference: flood-risk-assessment
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - outline-some
        - outline-all
        - reserved-matters
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: A site of more than 1 ha (Flood Zone 1).
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: A site of more than 1 ha (Flood Zone 1).
      - site:
          in:
          - flood-risk-zone
          description: New development in Flood Zones 2 and 3.
  - all:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zones 2 and 3.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 84; Harpenden Neighbourhood Plan policy ESD18
source-text: Required for sites of more than 1 ha. In Flood Zone 1. Required for all new development in
  Flood Zones 2 and 3.
must-include:
- item: An assessment of the existing situation
  level: must
- item: Whether the proposal is likely to be affected by current or future flooding from any source
  level: must
- item: Evidence that the development is safe and where possible reduces flood risk overall
  level: must
- item: Whether it will increase flood risk elsewhere, and opportunities to reduce the probability and
    consequences of flooding
  level: must
- item: Proposed mitigation for the effects and risks of flooding, taking climate change into account
  level: must
- item: The design of surface water management systems, including Sustainable Drainage (SUDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: Evidence that the Sequential and Exception Tests of the NPPF have been met, where required
  level: should
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 13. Also on the
  minor full, householder, outline and reserved matters checklists; the householder and listed building
  consent checklist asks for it in Flood Zones 2 and 3 only.
review-status: unverified
field-status: {}
