reference: viability-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: There is a policy requirement to provide affordable housing.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The development departs from other planning policy requirements due to viability.
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 7A; Affordable Housing SPG (March 2004)
source-text: A financial viability appraisal is required where there is a planning policy requirement
  to provide affordable housing or where the proposed development departs from other planning policy requirements
  due to viability.
must-include:
- item: An executive summary of the key conclusions for the lay reader
  level: must
- item: A model that explicitly shows the calculations and assumptions used
  level: must
- item: The applicant meets the cost of reviewing the appraisal
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 23. Called a Viability
  Appraisal. Shown for affordable housing below the policy requirement or other departures due to viability;
  other cases where affordable housing policy applies show as discretionary. Also on the outline and reserved
  matters checklists.
review-status: unverified
field-status: {}
