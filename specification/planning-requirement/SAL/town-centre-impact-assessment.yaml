reference: town-centre-impact-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2500 square metres.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other main town centre uses in an edge of centre or out of centre location.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the Development Plan.
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: Required for retail and leisure developments over 2500 square metres and smaller retail and
  leisure developments likely to have a significant impact on smaller centres. Also required for applications
  for other main town centre uses when they are an edge of centre or out of centre location; and not in
  accordance with the Development Plan
must-include:
- item: Details of the sequential test process that supports the chosen site location
  level: should
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 17. Called a Retail
  Impact Assessment. Smaller retail and leisure schemes likely to have a significant impact on smaller
  centres are shown as discretionary. Also on the minor full, outline and reserved matters checklists.
  The list cites the NPPF only.
review-status: unverified
field-status: {}
