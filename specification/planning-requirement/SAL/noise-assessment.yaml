reference: noise-assessment
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: 'Such an Assessment may be required in the following circumstances (this list is not exhaustive):
  Where it is proposed to introduce residential development next to a noisy environment Where it is proposed
  to introduce noisy uses/processes which are likely to impact on existing residential development or
  open countryside The provision of new plant or machinery including (but not limited to) air source heat
  pumps and air conditioning.'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 18. Called a Noise
  Impact Assessment / Acoustic Report. Shown as discretionary because the list says it 'may be required'
  and its list of circumstances (housing next to a noisy environment, noisy uses near housing or open
  countryside, new plant such as heat pumps and air conditioning) is not exhaustive. Also on the minor
  full, outline and reserved matters checklists. The list cites the NPPF only.
review-status: unverified
field-status: {}
