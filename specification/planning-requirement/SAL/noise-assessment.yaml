reference: noise-assessment
local-authority: SAL
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential development introduced to a noisy environment.
  - condition:
      field: noise-generating-use
      value: true
      description: Noisy uses near housing.
  - condition:
      field: plant-equipment
      value: true
      description: New plant such as air source heat pumps.
  - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20OUTLINE%20WITH%20SOME%20MATTERS%20RESERVED%202023.pdf
source-text: 'Such an Assessment may be required in the following circumstances (this list is not exhaustive):
  Where it is proposed to introduce residential development to a noisy environment'
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted parking-standards text. The list is ''not exhaustive'',
  so officer discretion is included.'
