reference: floor-plan-existing
local-authority: SAL
required-if:
  any:
  - any:
    - application-type:
        in:
        - full
        - hh
        - reserved-matters
        - lbc
        - demolition-con-area
    - all:
      - application-type:
          in:
          - outline-some
          - ldc-existing-use
          - ldc-prospective-use
          - non-material-amendment
      - discretionary
    - all:
      - application-type:
          in:
          - s73
      - condition:
          field: amends-approved-plans
          value: true
          description: A variation of the approved plans condition is sought.
  - application-type:
      in:
      - pa-extension
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'Existing and proposed floor plans (at a scale of 1:50 or 1:100); These drawings should:
  Contain a scale bar Normally be at a scale of 1:50 or 1:100 (metric) Include written dimensions to show
  overall size of any new buildings or extensions.'
must-include:
- item: A scale bar
  level: must
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: Written dimensions showing the overall size of any new buildings or extensions
  level: must
- item: Where existing buildings or walls are to be demolished
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: The layout of the existing building(s) as well as the proposed development
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), Full planning permission (major) checklist,
  page 5. Also on the minor full, householder (and with listed building consent), listed building consent,
  reserved matters and demolition in a conservation area checklists. Outline (some matters reserved) applications
  need it when that matter (layout, appearance or scale) is applied for, and lawful development and non-material
  amendment applications 'as necessary to describe' the proposal, so those show as discretionary; Section
  73 applications need it if a variation of the approved plans condition is sought. The larger home extension
  checklist also asks for floor plans.
review-status: unverified
field-status: {}
