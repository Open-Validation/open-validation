reference: landscaping-plan
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - outline-some
    - condition:
        field: landscaping-reserved-matter
        value: false
        description: Landscaping is being sought (not reserved) at outline stage.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 74
source-text: Required for all major developments. Landscape schemes should be underpinned by a comprehensive
  site survey and analysis, identify key environmental constraints and opportunities in line with national
  and local landscape, green infrastructure, biodiversity, and historic environment policy.
must-include:
- item: Based on a comprehensive site survey and analysis, identifying key environmental constraints and
    opportunities
  level: must
- item: All public and private spaces, including open space, sports pitches and play facilities, green
    infrastructure, biodiversity habitats, water bodies and landscape buffers
  level: must
- item: Hard surfaces, boundary treatment and all soft landscaping proposed
  level: must
- item: Building on the principles in the Design and Access Statement (where relevant)
  level: should
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 16. Called a Landscape
  Strategy (Landscape Details including Maintenance on the reserved matters checklist, page 15). Only
  the major full planning checklist names it for full applications, so full applications show it for major
  development. The outline (some matters reserved) checklist also needs it 'when landscaping is being
  sought'.
review-status: unverified
field-status: {}
