reference: application-form
local-authority: SAL
required-if:
  application-type:
    in:
    - hh
    - full
    - outline-some
    - outline-all
    - reserved-matters
    - lbc
    - demolition-con-area
    - advertising
    - approval-condition
    - s73
    - non-material-amendment
    - ldc-existing-use
    - ldc-prospective-use
    - ldc-proposed-work-lb
    - pa-extension
    - pa-build-agri-forest
    - pa-demo-building
    - pa-ecomms-network
    - hedgerow-removal
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Completed application form, ownership certificate and agricultural land declaration … Application
  form must be completed in full, signed and dated. The description of the development should be concise
  and must accurately reflect all aspects of the proposal requiring planning permission.
must-include:
- item: Completed in full, signed and dated
  level: must
- item: A concise description of the development that accurately reflects all aspects of the proposal
  level: must
- item: The ownership certificate, where there are owners of the site other than the applicant
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: There are owners of the site other than the applicant.
- item: 'For reserved matters: enough information to identify the outline permission the application relates
    to'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
confidence: medium
notes: From the council's list (checklists published 2023), every checklist, page 1. Every checklist for
  an application type lists the completed form (the tree works and hedgerow checklists are June 2017).
  The reserved matters checklist adds the outline permission item.
review-status: unverified
field-status: {}
