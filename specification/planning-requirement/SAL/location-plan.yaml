policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'This drawing should: Contain a scale bar Normally be at a scale of 1:1250 or 1:2500 (metric).
  Be up to date Include the direction of north Include sufficient named roads to identify the exact location
  of the site (wherever possible at least two) Include all the surrounding buildings, roads and footpaths
  on land adjoining the site Include a red line around all land required for the development'
must-include:
- item: A scale bar
  level: must
- item: Normally at a scale of 1:1250 or 1:2500 (metric)
  level: should
- item: Up to date
  level: must
- item: The direction of north
  level: must
- item: Enough named roads to identify the exact location of the site (wherever possible at least two)
  level: must
- item: All surrounding buildings, roads and footpaths on land adjoining the site
  level: must
- item: A red line around all land required for the development (e.g. access from a public highway, visibility
    splays, landscaping, car parking and open areas around buildings)
  level: must
- item: A blue line around all other land owned by the applicant close to or adjoining the application
    site
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), Full planning permission (major) checklist,
  page 1. Every checklist except approval of details reserved by condition asks for it; the hedgerow checklist
  (June 2017) asks for a plan showing the hedgerow's location and length.
