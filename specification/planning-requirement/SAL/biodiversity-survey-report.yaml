reference: biodiversity-survey-report
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - outline-some
        - outline-all
        - reserved-matters
        - demolition-con-area
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - hh
        - outline-some
        - outline-all
        - reserved-matters
        - demolition-con-area
        - pa-demo-building
        - hedgerow-removal
    - condition:
        field: protected-species
        value: true
        description: Protected and priority species are known or have the potential to be present.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: St Albans District Local Plan Review 1994 policy 106; Harpenden Neighbourhood Plan policy ESD13;
  Sandridge Neighbourhood Plan policy E1; St Stephen Parish Neighbourhood Plan policy S7
source-text: You will need to provide this with applications where the type and location of development
  are such that the impact on biodiversity may be significant. … Where protected and priority species
  are known or have the potential to be present an Extended Phase 1 Habitat Survey should be carried out.
must-include:
- item: 'A Preliminary Ecological Appraisal survey and report: an initial assessment of the impact of
    the development on wildlife'
  level: must
- item: Proposals for mitigation or compensation, including protecting habitats and providing new habitats
  level: should
  required-if: discretionary
- item: Survey timing that takes account of nesting birds, priority species and habitats
  level: should
- item: An Extended Phase 1 Habitat Survey
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected and priority species are known or have the potential to be present.
- item: Further protected species surveys, depending on the results of the initial survey
  level: must
  required-if: discretionary
- item: Information capable of assessment under the Habitat Regulations
  level: must
- item: A Preliminary Roost Assessment
  level: must
  required-if:
    all:
    - condition:
        field: demolition
        value: true
        description: Buildings are to be demolished.
    - discretionary
  source-text: The demolition of buildings in areas where bat activity has been identified will require
    a Preliminary Roost Assessment.
- item: 'Hedgerow removal: an ecological survey of the hedgerow and any categories of woody species'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
  source-text: Ecological survey of the hedgerow and any categories of woody species.
confidence: medium
notes: 'From the council''s list (checklists published 2023), major full checklist pages 9-10. Also on
  the minor full, householder (and with listed building consent), outline, reserved matters, demolition
  in a conservation area and prior notification of demolition checklists, and the hedgerow removal checklist
  (June 2017, https://www.stalbans.gov.uk/sites/default/files/documents/publications/validation-checklists/Hedgerow%20Removal%20Notice%20Validation%20Checklist%20June%202017.pdf:
  ''required if there are protected species known to be present''). A significant impact on biodiversity,
  and demolition in areas of known bat activity, are shown as discretionary.'
review-status: unverified
field-status: {}
