reference: fire-statement
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (Amendment Order 2021/746)
source-text: The completion of the prescribed form for buildings that contain two or more dwellings, or
  educational accommodation and meet the height condition of either 18m-plus, or seven-plus storeys -
  whichever is reached first.
must-include:
- item: The prescribed form, completed
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 12. Called a Fire
  Safety Statement. Also on the minor full, outline and reserved matters checklists.
review-status: unverified
field-status: {}
