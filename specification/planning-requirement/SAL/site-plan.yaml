reference: site-plan
local-authority: SAL
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - outline-all
      - reserved-matters
      - lbc
      - demolition-con-area
      - pa-demo-building
  - all:
    - application-type:
        in:
        - outline-some
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: A variation of the approved plans condition is sought.
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'Block Plan This drawing should: Contain a scale bar Normally be at a scale of 1:200 or 1:500
  (metric) Include the direction of north Show the proposed development in relation to the site boundaries
  and other existing buildings on the site'
must-include:
- item: A scale bar
  level: must
- item: Normally at a scale of 1:200 or 1:500 (metric)
  level: should
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees on the site and adjacent land
  level: must
- item: The extent and type of any hard surfacing
  level: must
- item: The type and height of boundary treatment (e.g. walls, fences)
  level: must
- item: Written dimensions, including those to the boundaries
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
confidence: medium
notes: From the council's list (checklists published 2023), Full planning permission (major) checklist,
  page 4. Called a Block Plan. Also on the minor full, householder, householder and listed building consent,
  listed building consent, outline, reserved matters and demolition in a conservation area checklists.
  The outline (some matters reserved) checklist needs it 'when layout is being sought', shown as discretionary;
  the Section 73 checklist needs it if a variation of the approved plans condition is sought; the non-material
  amendment checklist asks for the new plans of the amendment (discretionary); the prior notification
  of demolition checklist asks for an existing block plan at 1:100 or 1:200 showing the building to be
  demolished.
review-status: unverified
field-status: {}
