reference: elevation-proposed
local-authority: SAL
required-if:
  any:
  - application-type:
      in:
      - full
      - hh
      - reserved-matters
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - outline-some
        - ldc-existing-use
        - ldc-prospective-use
        - non-material-amendment
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: A variation of the approved plans condition is sought.
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'Existing and proposed elevations (at a scale of 1:50 or 1:100); These drawings should: Contain
  a scale bar Normally be at a scale of 1:50 or 1:100 (metric) Should clearly show the proposed works
  in relation to what is already there Show all sides of the proposal'
must-include:
- item: A scale bar
  level: must
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: The proposed works in relation to what is already there
  level: must
- item: All sides of the proposal
  level: must
- item: Where a proposed elevation adjoins or is close to another building, the relationship between the
    buildings and the positions of the openings on each property
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (checklists published 2023), Full planning permission (major) checklist,
  page 4. Also on the minor full, householder (and with listed building consent), listed building consent,
  reserved matters and demolition in a conservation area checklists. Outline (some matters reserved) applications
  need it when that matter (layout, appearance or scale) is applied for, and lawful development and non-material
  amendment applications 'as necessary to describe' the proposal, so those show as discretionary; Section
  73 applications need it if a variation of the approved plans condition is sought.
review-status: unverified
field-status: {}
