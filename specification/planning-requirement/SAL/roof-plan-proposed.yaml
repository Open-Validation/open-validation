source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
policy: Article 7(1)(c)(ii), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: 'Roof plans (at a scale of 1:50 or 1:100). These drawings should: Contain a scale bar Normally
  be at a scale of 1:50 or 1:100 (metric). Show the shape of the roof, its location and any features such
  as chimney positions or windows'
must-include:
- item: A scale bar
  level: must
- item: Normally at a scale of 1:50 or 1:100 (metric)
  level: should
- item: The shape of the roof, its location and any features such as chimney positions or windows
  level: must
