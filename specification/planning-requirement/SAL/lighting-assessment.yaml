reference: lighting-assessment
local-authority: SAL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - reserved-matters
    - condition:
        field: floodlighting
        value: true
        description: External flood lighting is proposed.
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: Required for all applications where it is proposed to incorporate external flood lighting.
  A contour plan should be provided which shows the layout of the proposed lighting scheme with beam orientation
  and lighting spill.
must-include:
- item: A contour plan showing the layout of the lighting scheme, with beam orientation and lighting spill
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 17. Also on the
  minor full, outline and reserved matters checklists. The advertisement checklists say a contour plan
  'may be required' (discretionary). The list cites the NPPF only.
review-status: unverified
field-status: {}
