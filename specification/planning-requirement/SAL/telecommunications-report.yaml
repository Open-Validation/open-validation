source-text: 'Signed declaration that the equipment and installation fully complies with the ICNIRP requirements.
  … Planning Statement To include:'
must-include:
- item: A signed ICNIRP declaration that the equipment and installation fully comply
  level: must
- item: The area of search and the justification for this particular site
  level: must
- item: Alternative sites rejected, with reasons (including existing masts, structures and other buildings
    in the search area), or an explanation if none were considered
  level: must
- item: A map showing the site's relationship to schools and other telecommunication equipment nearby
  level: must
- item: Any other relevant additional information
  level: should
