validation-list:
  url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
  date: 2023-03
  date-basis: 'The checklists are undated in their text; their link titles and file names say ''2023''
    (demolition in a conservation area ''2022'') and the PDFs were created on 1 March 2023 (the LLFA drainage
    pro-forma: ''Version 1 : Issued 28/04/2023''). They followed the council''s Aug-Sep 2022 consultation
    (''Planning Validation Lists'', now under past consultations). The council''s checklists page (https://www.stalbans.gov.uk/application-forms-and-validation-checklists),
    checked 2026-11-06, still links this set (one checklist per application type) and adds a BNG validation
    note; it links no newer list, and MHCLG''s register (planning.data.gov.uk entity 20213) points to
    the same 2023 checklists. Older checklists still linked for some types: hedgerow removal and tree
    works (June 2017), full planning with listed building consent (June 2017, https://www.stalbans.gov.uk/sites/default/files/documents/publications/validation-checklists/No%208%20Full%20Planning%20Appplication%20and%20Listed%20Building%20Consent%20Validation%20Checklist%20June%202017_tcm15-60544.pdf)
    and planning permission with advertisement consent (2019). The full planning (major) checklist is
    used as the list URL; each file cites the checklist its wording comes from.'
  status: outdated
submission-standards:
- item: Applications submitted online via the Planning Portal (encouraged)
  level: should
- item: 'Posted applications: 2 copies of hard documents, or 1 copy and a CD, with plans no larger than
    A3 and to scale'
  level: must
- item: All submitted plans and drawings have written dimensions
  level: must
- item: A scale bar is shown for the scale of all plans
  level: must
- item: The scale on submitted plans states the paper size at which it applies (e.g. scale 1:200 at A3)
  level: must
- item: Where required information is not submitted, a written justification of why it is not appropriate
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'The workbook link works and the 2023 checklists are still current. But it links only the Major
    full-planning checklist instead of the checklists page that holds the whole local list, and the date
    comes from PDF metadata. The extraction has many garbled or swapped triggers, misses major-only items
    (CEMP, Climate Change Statement, Waste Strategy, Landscape Strategy, Neighbourhood Plan statements),
    copies Householder rows into LBC, and leaves Reserved matters and Works to trees empty despite checklists
    existing for them. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Hertfordshire paused 7 Sep 2026 and WITHDRAWN 29 Oct
