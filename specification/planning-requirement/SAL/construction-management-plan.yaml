reference: construction-management-plan
local-authority: SAL
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - ref: major-development
source-url: https://www.stalbans.gov.uk/sites/default/files/documents/publications/planning-building-control/Validation%20Checklists/2023/Validation%20Checklist%20-%20Full%20Planning%20Permission%20Major.pdf
source-text: Required for all major developments to demonstrate how negative impacts of the construction
  process on the amenity of neighbouring occupiers and the environment will be managed and mitigated.
must-include:
- item: How on-site impacts will be managed during demolition and construction (particularly on homes,
    other sensitive uses and biodiversity)
  level: must
- item: Traffic management, storage and contractor parking
  level: must
- item: Dust, noise, vibration and stability
  level: must
confidence: medium
notes: From the council's list (checklists published 2023), major full checklist page 11. Called a Construction
  Environment Management Plan. Also on the reserved matters checklist. The list cites the NPPF only.
review-status: unverified
field-status: {}
