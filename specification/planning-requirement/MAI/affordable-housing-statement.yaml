reference: affordable-housing-statement
local-authority: MAI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Housing or mixed-use development of 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Housing or mixed-use development with a site area of 0.5 hectares or more.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Affordable and Local Needs Housing Supplementary Planning Document (July 2020)
source-text: Applications for housing or mixed-use development of 10 or more dwellings or with a site
  area of 0.5 hectares (ha) or more.
must-include:
- item: Total number of all residential units
  level: should
- item: Number of affordable units
  level: should
- item: Numbers of bedrooms and property types across all tenures, showing a representative mix of unit
    types and sizes
  level: should
- item: Drawings showing the location of units
  level: should
- item: Levels or types of affordability or tenure proposed for different units, clearly and fully explained
    in line with policy
  level: should
- item: Design standards (ideally Nationally Described Space Standards compliant) with full unit floor
    plans
  level: should
- item: Affordable units have car parking spaces in line with policy
  level: should
- item: Number and location of wheelchair accessible units (M4(3))
  level: should
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A9. The list says 'A typical affordable housing statement should include details of the following',
  so the items are shown as 'should'.
review-status: unverified
field-status: {}
