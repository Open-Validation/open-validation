reference: town-centre-impact-assessment
local-authority: MAI
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 sq m (within the Maidstone Urban Area).
  - all:
    - condition:
        field: outside-urban-area
        value: true
        description: Outside the Maidstone Urban Area.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 400
        description: Over 400 sq m.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Maidstone Local Plan Review policy LPRCD1; National Planning Policy Framework (2026), section
  8
source-text: proposals over 2,500sqm within the Maidstone Urban Area … proposals over 400sqm outside the
  Maidstone Urban Area
must-include:
- item: Sequential test
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
  item B6. The list calls it 'Retail and town centre uses impact assessment'. The reasoning says town
  centre uses are retail, leisure and office uses outside town centres and not in accordance with the
  local plan.
review-status: unverified
field-status: {}
