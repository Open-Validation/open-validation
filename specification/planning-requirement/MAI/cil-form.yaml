reference: cil-form
local-authority: MAI
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: 100 square metres or more of new gross internal floorspace (new buildings or extensions).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates one or more dwellings, including conversions to residential.
  - condition:
      field: cil-liable
      value: true
      description: The development may potentially be CIL liable.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Community Infrastructure Levy Regulations 2010 (as amended); Maidstone CIL Charging Schedule
source-text: Applications involving the construction of new buildings, extensions to existing buildings,
  or comprising a dwelling or dwellings (including conversions to residential). All applications for development
  that may potentially be CIL liable. The CIL applies to development for 100 square metres of gross internal
  area of new floorspace and development involving the creation of a dwelling or dwellings.
must-include:
- item: The additional CIL information requirements form (form 1), fully completed
  level: must
- item: Existing and proposed plans covering all accessible floors, levels of buildings and communal areas,
    with clearly marked dimensions and a correct scale bar
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A11. Not a validation requirement, but the list advises sending the CIL assumption of liability
  form 2 and any claims for exemption or relief at the same time.
review-status: unverified
field-status: {}
