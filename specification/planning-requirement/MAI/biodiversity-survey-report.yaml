reference: biodiversity-survey-report
local-authority: MAI
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Likely to affect statutorily protected species.
  - site:
      in:
      - site-of-special-scientific-interest
      description: In a Site of Special Scientific Interest (SSSI) or within its 200m buffer.
  - site:
      in:
      - special-protection-area
      description: In a Special Protection Area (SPA).
  - site:
      in:
      - special-area-of-conservation
      description: In a Special Area of Conservation (SAC).
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017; Protection
  of Badgers Act 1992
source-text: 'If the development is: … likely to affect statutorily protected species … in a site of Special
  Scientific Interest (SSSI) and within a 200m buffer … in a Special Protection Area (SPA) … in Special
  Area of Conservation (SAC)'
must-include:
- item: Possible impacts on statutorily protected species
  level: must
- item: Drawings showing significant wildlife habitats or features and the location of habitats of species
    protected under the Wildlife and Countryside Act 1981, the Conservation of Habitats and Species Regulations
    2017 or the Protection of Badgers Act 1992
  level: should
- item: Assessments of impacts and proposals for long-term maintenance and management
  level: must
- item: Any further surveys that a preliminary ecological appraisal identifies as needed, carried out
    and provided with the application
  level: must
- item: Preliminary Ecological Appraisals, protected species surveys and Ecological Impact Assessments
    no more than 18 months old at submission
  level: should
- item: 'Where ecological information is older than 18 months: an updated site visit by a qualified ecologist
    confirming whether the original findings remain valid, clearly documented and submitted'
  level: must
  source-text: Where ecological information is older than 18 months, an updated site visit must be undertaken
    by a qualified ecologist to confirm whether the original findings remain valid.
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A6. The list calls it 'Ecological and protected species survey'. If the original information is
  no longer valid, a new or updated ecological assessment is needed.
review-status: unverified
field-status: {}
