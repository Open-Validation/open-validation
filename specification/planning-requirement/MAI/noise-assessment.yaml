reference: noise-assessment
local-authority: MAI
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Generates high levels of noise, such as noisy sports, or commercial, industrial or
        warehousing development using noisy machinery, vehicles or refrigeration plant.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New housing or other noise-sensitive uses next to sources of noise, including roads,
        railways and noisy commercial uses.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: proposals that generate high levels of noise such as noisy sports; commercial, industrial
  or manufacturing/warehousing developments using noisy machinery or vehicles, refrigeration plant and
  equipment, or; … new housing or other noise-sensitive uses adjacent to sources of noise, including roads,
  railways and noisy commercial uses
must-include:
- item: Prepared by a suitably qualified person
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
  item B3. The list calls it 'Noise impact assessment'.
review-status: unverified
field-status: {}
