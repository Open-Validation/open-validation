notes: 'From the council''s list (published 26 January 2026), web page, Part A (required for all applications),
  item A13. The list ties the threshold to government advice, so the rule follows the law: the files are
  needed wherever the biodiversity gain condition applies (householder and other exempt applications are
  exempt). Where an exemption is argued, the list asks only for dated photos (see photos).'
