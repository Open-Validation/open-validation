    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Town and Country Planning Act 1990, Schedule 7A (inserted by the Environment Act 2021); Maidstone
  Local Plan Review policies LPRSP4(A) and LPRSP4(B)
source-text: Threshold to be in line with the current, up-to-date government advice, where a Biodiversity
  Gain Plan would be required or where an exemption is being argued.
must-include:
- item: Map showing baseline habitats on the development site
  level: must
