reference: energy-statement
local-authority: MAI
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New development involving the erection of a building.
  - condition:
      field: involves-change-of-use
      value: true
      description: New development involving the conversion of a building.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Maidstone Local Plan Review policy LPRQD1
source-text: Applications for new development involving the erection or conversion of a building.
must-include:
- item: Demonstrates 10% on-site renewable or low carbon production
  level: must
- item: Assesses the technical feasibility of renewable energy technologies
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
  item B5. The list calls it 'Renewable energy assessment'. The 'information required' starts 'Where appropriate'
  and policy LPRQD1 expects 10% 'where appropriate'. The assessment may also calculate the carbon dioxide
  saving to show the 10% has been achieved.
review-status: unverified
field-status: {}
