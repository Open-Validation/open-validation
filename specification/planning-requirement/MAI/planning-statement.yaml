  to two or more flats
must-include:
- item: Demonstrates the proposal meets space and room size standards
  level: must
- item: Details of refuse storage
  level: must
- item: Details of cycle storage
  level: must
- item: Parking survey or assessment
  level: must
- item: Details of the concentration of HMOs in the area
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
