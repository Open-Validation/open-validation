  - condition:
      field: hmo-occupants
      operator: '>'
      value: 6
      description: A larger house in multiple occupation (HMO) for over 6 occupants.
  - condition:
      field: dwelling-subdivision
      value: true
      description: Conversion of a single dwelling to two or more flats.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
