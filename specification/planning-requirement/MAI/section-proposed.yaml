reference: section-proposed
local-authority: MAI
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal changes the level of the land, or the site is on land of different levels.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: If the proposal leads to a change in the level of the land or the proposed development is
  on land of different levels.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Existing and proposed levels of the site, and where they differ from those of land and buildings
    immediately adjoining the site
  level: must
- item: Contour plans (at 0.25 intervals) and longitudinal plans
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A14. The list calls it 'Site levels and sections (scale 1:50 or 1:100)'.
review-status: unverified
field-status: {}
