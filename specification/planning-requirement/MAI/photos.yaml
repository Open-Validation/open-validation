reference: photos
local-authority: MAI
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: The proposal involves the demolition of an existing building.
  - site:
      in:
      - conservation-area
      - listed-building
      description: Development affecting a conservation area or a listed building.
  - condition:
      field: bng-exemption-claimed
      value: true
      description: The applicant claims an exemption from biodiversity net gain.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: 'Photographs should be provided if the proposal involves the demolition of an existing building
  or development affecting a conservation area or a listed building. … Where claiming an exemption: …
  dated photos of the site from each boundary looking inwards'
must-include:
- item: 'Where claiming a biodiversity net gain exemption: dated photos of the site from each boundary
    looking inwards'
  level: must
  required-if:
    condition:
      field: bng-exemption-claimed
      value: true
      description: The applicant claims an exemption from biodiversity net gain.
