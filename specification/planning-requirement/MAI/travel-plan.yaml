reference: travel-plan
local-authority: MAI
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development of 10-39 dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Development (including non-residential) of 1,000-2,499 sq m gross floorspace.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.25
          description: A site of 0.25 ha or more where the development will have limited transport issues.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 0.25
          description: A site of 0.25 ha or more where the development will have limited transport issues.
  - discretionary
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: National Planning Policy Framework (2026), section 15
source-text: if the transport assessment recommends a draft travel plan as mitigation, one should also
  be submitted … if the transport statement recommends a draft travel plan as mitigation, one should also
  be submitted
confidence: medium
notes: 'From the council''s list (published 26 January 2026), web page, Part B (additional information),
  item B8. and item B9. Shown as discretionary within the transport thresholds: a draft travel plan is
  needed only if the transport assessment or statement recommends one as mitigation.'
review-status: unverified
field-status: {}
