reference: air-quality-assessment
local-authority: MAI
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: A significant proposal in, or significantly increasing traffic through, an Air Quality
        Management Area.
  - discretionary
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: B1 Air Quality Assessment (AQA) Open proposals that are likely to generate high levels of
  air pollution, such as significant industrial developments significant proposals that are located in
  any Air Quality Management Area (AQMA) proposals that would result in a significant increase in traffic
  passing through any AQMA development that may result in the exceedance of air quality standards within
  currently undesignated areas
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. 'Significant' proposals
  and other polluting development have no threshold, so they are shown as officer discretion.
