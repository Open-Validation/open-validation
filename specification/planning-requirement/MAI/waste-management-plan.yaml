reference: waste-management-plan
local-authority: MAI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential development on a site of 0.5 ha or more (if the number of dwellings is
        unknown).
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Development of floorspace of 1,000 square metres or more (including change of use).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development on a site of 1 hectare or more.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development on a site of 1 hectare or more.
  - discretionary
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: A12 Waste minimisation and recycling assessment report Open residential development of 10
  or more dwellings residential development on a site area of 0.5 ha or more (if the number of dwellings
  is unknown development of floorspace of 1,000sqm or more development on sites of 1 ha or more change
  of use of 1,000sqm or more larger Houses of Multiple Occupancy (HMO) over 6 persons
confidence: medium
notes: 'Audit (wrong_app_type): A12, Maidstone only; it is a planning application item, not a prior approval
  or county matter. Larger HMOs (over 6 persons) have no field, so they are shown as officer discretion.'
