reference: waste-management-plan
local-authority: MAI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential development on a site of 0.5 ha or more (if the number of dwellings is
        unknown).
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Development of 1,000 sq m or more of floorspace.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development on a site of 1 ha or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development on a site of 1 ha or more.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Of 1,000 sq m or more.
  - condition:
      field: hmo-occupants
      operator: '>'
      value: 6
      description: A larger house in multiple occupation (HMO) for over 6 persons.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Maidstone Local Plan policy DM1; Local Plan Review policy LPRSP15; Kent Waste Disposal Strategy
  2017-2035; Kent Minerals and Waste Local Plan 2013-2030
source-text: residential development of 10 or more dwellings … residential development on a site area
  of 0.5 ha or more (if the number of dwellings is unknown … development of floorspace of 1,000sqm or
  more … development on sites of 1 ha or more … change of use of 1,000sqm or more … larger Houses of Multiple
  Occupancy (HMO) over 6 persons
must-include:
- item: A proportionate assessment of waste minimisation and recycling, relevant to the scheme
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A12. The list calls it 'Waste minimisation and recycling assessment report'.
review-status: unverified
field-status: {}
