reference: bng-metric
local-authority: MAI
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Town and Country Planning Act 1990, Schedule 7A (inserted by the Environment Act 2021); Maidstone
  Local Plan Review policies LPRSP4(A) and LPRSP4(B)
source-text: Threshold to be in line with the current, up-to-date government advice, where a Biodiversity
  Gain Plan would be required or where an exemption is being argued.
must-include:
- item: Statutory biodiversity metric with condition assessments, pre- and post-development values completed,
    in Excel format
  level: must
- item: Small sites metric, where used
  level: must
- item: 'Statement of competency: for the main metric, produced by a suitably competent and qualified
    assessor (ideally a member of an appropriate recognised body)'
  level: must
- item: 'Heathlands and Lidsing garden settlements: a minimum 20% biodiversity net gain'
  level: must
  required-if:
    site:
      in:
      - strategic-allocation
      description: Heathlands or Lidsing garden settlement (Local Plan Review policies LPRSP4(A) and LPRSP4(B)).
  source-text: Heathlands and Lidsing garden settlements must deliver 20% … The Maidstone Local Plan Review
    has taken the 10% requirement further for the site allocations for Heathlands (LPRSP4 (A) and Lidsing
    LPRSP4 (B) and require that such development deliver a minimum 20% biodiversity net gain
- item: 'All other developments: a minimum 10% biodiversity net gain'
  level: must
  source-text: 'All other developments: 10%.'
confidence: medium
notes: 'From the council''s list (published 26 January 2026), web page, Part A (required for all applications),
  item A13. The list ties the threshold to government advice, so the rule follows the law: the files are
  needed wherever the biodiversity gain condition applies (householder and other exempt applications are
  exempt). Where an exemption is argued, the list asks only for dated photos (see photos). The list also
  asks for a Kent and Medway Biodiversity Gain Statement and a draft Biodiversity Gain Plan, and, for
  off-site or significant on-site gain, a draft Habitat Management and Monitoring Plan and drawings of
  off-site proposals (no matching id; listed as unmapped). The 2026 NPPF removed the 20% requirement for
  other residential development.'
review-status: unverified
field-status: {}
