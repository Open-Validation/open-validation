reference: archaeological-assessment
local-authority: MAI
required-if:
  site:
    in:
    - archaeological-priority-area
    description: In an area of archaeological importance, or affects a heritage asset with archaeological
      interest.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: Proposals within areas of archaeological importance or heritage asset with archaeological
  interest.
must-include:
- item: Desk-based archaeological assessment
  level: must
- item: A field evaluation, where necessary (where desk-based research is insufficient to assess the interest)
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
  item B25. The list calls it 'Archaeological information'. Item A4 (reasoning) also asks for a desk-based
  assessment, and a field evaluation where that is insufficient, where a site includes or may include
  heritage assets with archaeological interest.
