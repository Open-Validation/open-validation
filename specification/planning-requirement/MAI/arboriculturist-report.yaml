reference: arboriculturist-report
local-authority: MAI
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Tree removal or substantial pruning is needed, or the proposal could affect retained
        trees, including their roots.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedge removal or substantial pruning is needed, or the proposal could affect retained
        hedges.
  - site:
      in:
      - ancient-woodland
      description: Construction within 30m of the stem of any tree in Semi Natural or Replanted Ancient
        Woodland.
  - condition:
      field: veteran-trees
      value: true
      description: Construction within 30m of the stem of a tree likely to be categorised as a veteran
        tree.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: Town and Country Planning Act 1990 (section 211); Town and Country Planning (Tree Preservation)
  (England) Regulations 2012; Hedgerow Regulations 1997
source-text: tree/hedge removals or substantial pruning work (beyond that normally undertaken for general
  maintenance) has taken place or will be necessary to implement any aspect of the development and/or;
  … the proposal has the potential to affect retained trees/hedges, including their roots and/or; … construction
  activity will be within 30 metres (m) of the stem of any tree within woodland designated as Semi Natural
  or Replanted Ancient Woodland or likely to be categorised as a veteran tree
must-include:
- item: In accordance with the current edition of BS5837, covering all existing trees on the site and
    all aspects of the development, including level changes or excavations
  level: must
- item: Prepared by an arboriculturist using the BS5837 methodology
  level: must
- item: A tree constraints plan and an Arboricultural Implications Assessment (AIA) as a minimum, or a
    statement setting out why they are not required
  level: must
  source-text: In most cases, a tree constraints plan and an Arboricultural Implications Assessment (AIA)
    must be provided as a minimum, or a statement setting out why these details are not required.
- item: 'Where the AIA identifies potential conflicts with trees: an Arboricultural Method Statement (AMS)
    with tree protection details'
  level: must
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A7. The list calls it 'Tree survey or arboricultural assessment'. Outline applications are expected
  to include an AMS and tree protection details only for the matters being considered.
review-status: unverified
field-status: {}
