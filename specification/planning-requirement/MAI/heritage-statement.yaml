reference: heritage-statement
local-authority: MAI
required-if:
  site:
    in:
    - conservation-area
    - listed-building
    - listed-building-setting
    - scheduled-monument
    description: The proposal affects a conservation area, a listed building (or its setting) or a scheduled
      monument.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: National Planning Policy Framework (2026), section 20; National Planning Practice Guidance
source-text: If the proposal affects a conservation area, a listed building, or a scheduled monument.
must-include:
- item: Level of detail proportionate to the importance of the heritage assets and the extent of the proposed
    development, enough to understand the potential impact on the significance of the heritage assets
    and their settings
  level: should
- item: Reference to the statutory list description and the Kent County Council Historic Environment Record,
    with details of the expertise and sources consulted
  level: should
  source-text: It will normally include reference to the statutory list description and the Kent County
    Council Historic Environment Record and details of the expertise and sources that have been consulted.
- item: 'As a minimum: photographs'
  level: should
- item: 'As a minimum: an impact assessment'
  level: should
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A4. The list says the statement 'as a minimum should include photographs and an impact assessment',
  so those are shown as 'should'. The setting of a listed building is included because the reasoning covers
  heritage assets 'or their settings'.
review-status: unverified
field-status: {}
