notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
  item B15. The list calls it 'Viability appraisal'. Shown as discretionary because it depends on whether
  the applicant argues viability (for example affordable housing below policy, or the loss of community
  facilities, rural buildings or employment uses). In most cases it will be independently assessed at
  the applicant's cost.
