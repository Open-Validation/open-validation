reference: transport-assessment
local-authority: MAI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres or more of floorspace.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.25
      description: A site of 0.25 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 0.25
      description: A site of 0.25 hectares or more.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: B8 Transport assessment and draft travel plan Open residential developments of 40 dwellings
  or more or developments (including non-residential) with a gross floor space of 2,500sqm or more
must-include:
- item: A full Transport Assessment (rather than a Transport Statement)
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 40
        description: 40 or more dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 2500
        description: 2,500 square metres or more gross floorspace.
confidence: medium
notes: B8 Transport Assessment for 40+ dwellings or 2,500 sqm+; B9 Transport Statement (from the audit,
  missing_requirement) for 10-39 dwellings, 1,000-2,499 sqm or 0.25 ha+.
