reference: transport-assessment
local-authority: MAI
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10-39 dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: Development (including non-residential) of 1,000-2,499 sq m gross floorspace.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.25
        description: A site of 0.25 ha or more where the development will have limited transport issues.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 0.25
        description: A site of 0.25 ha or more where the development will have limited transport issues.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: National Planning Policy Framework (2026), section 15
source-text: residential developments of 40 dwellings or more or developments (including non-residential)
  with a gross floor space of 2,500sqm or more … residential developments of 10-39 dwellings or; … development
  (including non-residential) with a gross floor space of 1,000sqm – 2,499sqm … site has an area of 0.25ha
  or more and the development proposed will have limited transport issues arising.
must-include:
- item: A full Transport Assessment for 40 or more dwellings or 2,500 sq m or more gross floorspace
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 40
        description: Residential development of 40 dwellings or more.
    - condition:
        field: floorspace
        operator: '>='
        value: 2500
        description: Development (including non-residential) of 2,500 sq m or more gross floorspace.
- item: A Transport Statement (a lighter-touch version) for 10-39 dwellings, 1,000-2,499 sq m gross floorspace,
    or a site of 0.25 ha or more with limited transport issues
  level: must
confidence: medium
notes: 'From the council''s list (published 26 January 2026), web page, Part B (additional information),
  item B8. and item B9: B8 ''Transport assessment and draft travel plan'' and B9 ''Transport statement
  and draft travel plan'' are combined here, since a transport statement is the simplified version of
  a transport assessment.'
review-status: unverified
field-status: {}
