reference: flood-risk-assessment
local-authority: MAI
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2, 3 or 3b.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - site:
      in:
      - critical-drainage-area
      description: The site is in a critical drainage area or an area of increased future flood risk in
        the SFRA.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
source-text: Information required site-specific FRA; a sequential assessment (to allow the LPA to do a
  sequential test) should be provided for relevant development (as defined in the NPPF and NPPG on flooding
  in flood zones 2 and 3) and; if required, an exception test the FRA and sequential assessment exception
  test will only be acceptable if they have been updated within the 12 months before planning application
  submission
must-include:
- item: A sequential assessment, for relevant development in flood zones 2 and 3
  level: should
  required-if:
    site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3.
- item: An exception test, if required
  level: must
- item: FRA, sequential assessment and exception test updated within the 12 months before submission
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the information-required text. From the audit: FZ2/3/3b,
  FZ1 1 ha+, critical drainage areas, or SFRA future-risk areas (A5, also householder).'
