reference: flood-risk-assessment
local-authority: MAI
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2, 3 or 3b.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: In flood zone 1 with a site area of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: In flood zone 1 with a site area of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: In an area with critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: In flood zone 1 where the council's strategic flood risk assessment shows it will be
        at increased risk of flooding during its lifetime.
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: National Planning Policy Framework (2026), sections 14 and 18 and Annex F; National Planning Practice
  Guidance
source-text: 'All development (including minor development and changes of use) proposed: … in flood zones
  2, 3 or 3b … within flood zone 1 with a site area of 1 hectare or more … in areas with critical drainage
  problems … within flood zone 1 where the Local Planning Authority’s (LPA) strategic flood risk assessment
  (SFRA) shows it will be at increased risk of flooding during its lifetime'
must-include:
- item: A sequential assessment (to allow the council to do a sequential test) for relevant development
    in flood zones 2 and 3
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3.
  source-text: a sequential assessment (to allow the LPA to do a sequential test) should be provided for
    relevant development (as defined in the NPPF and NPPG on flooding in flood zones 2 and 3)
- item: An exception test, if required
  level: must
  required-if: discretionary
- item: FRA, sequential assessment and exception test updated within the 12 months before the application
    is submitted
  level: must
  source-text: the FRA and sequential assessment exception test will only be acceptable if they have been
    updated within the 12 months before planning application submission
- item: Risks of all forms of flooding to and from the development, and how they will be managed, taking
    climate change into account
  level: should
- item: Design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part A (required for all applications),
  item A5. The list adds 'That increases the vulnerability classification and may be subject to sources
  of flooding other than rivers or sea.' after the bullets; it is not clear which bullets this qualifies,
  so it is not built into the rule. The 'should' items come from the item's 'Reasoning'.
review-status: unverified
field-status: {}
