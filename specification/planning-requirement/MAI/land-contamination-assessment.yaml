reference: land-contamination-assessment
local-authority: MAI
required-if:
  site:
    in:
    - contaminated-land
    description: Previous uses on or adjoining the site could have given rise to contamination (landfill,
      former industrial and commercial processes, petrol filling stations, institutional uses, storage
      of chemicals).
source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
policy: National Planning Policy Framework (2026), section 17 policy P3
source-text: when previous uses on or adjoining the site could have given rise to contamination such as
  landfill sites, former industrial and commercial processes, petrol filling stations, institutional uses,
  storage of chemicals (including on farms), or; … when an initial desktop and walkover study suggests
  that contaminants may be present
must-include:
- item: An initial desktop and walkover study assessing whether previous uses on or adjoining the site
    could have caused contamination
  level: must
- item: A full Contaminated Land Investigation where the initial desktop and walkover study suggests contaminants
    may be present
  level: must
- item: Remediation measures that take account of the presence of any trees
  level: should
confidence: medium
notes: From the council's list (published 26 January 2026), web page, Part B (additional information),
  item B2. The list calls it 'Initial contaminated land desktop study/investigation'.
review-status: unverified
field-status: {}
