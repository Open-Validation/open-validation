reference: transport-assessment
local-authority: SHO
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 80
      description: 80 or more dwellings.
  - condition:
      field: retail-floorspace
      operator: '>='
      value: 1000
      description: 1000m2 and above gross retail floor space.
  - condition:
      field: office-floorspace
      operator: '>='
      value: 2500
      description: 2500m2 and above gross office floor space.
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 5000
      description: 5000m2 and above gross industrial floor space.
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 10000
      description: 10000m2 and above gross warehousing floor space.
source-url: https://www.sholland.gov.uk/media/14057/Local-List-for-All-Applications-2019/pdf/South_Holland_District_Council_Local_List_for_All_Applications_20191.pdf?m=1607959333640
source-text: 'Transport Assessment Required for applications which would result in the development of:
  a. 80 or more dwellings; b. 1000m2 and above gross retail floor space; c. 2500m2 and above gross office
  floor space; d. 5000m2 and above gross industrial floor space; and e. 10000m2 and above gross warehousing
  floor space.'
confidence: medium
notes: Applies to outline as well as full applications (audit, wrong_app_type).
review-status: unverified
field-status: {}
