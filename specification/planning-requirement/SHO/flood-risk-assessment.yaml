reference: flood-risk-assessment
local-authority: SHO
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3 (including minor development and change of use).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in flood zone 1).
  - site:
      in:
      - surface-water-flood-risk
      - critical-drainage-area
      description: A site under 1 hectare at risk from other sources of flooding, or with critical drainage
        problems notified by the Environment Agency.
source-url: https://www.sholland.gov.uk/media/14057/Local-List-for-All-Applications-2019/pdf/South_Holland_District_Council_Local_List_for_All_Applications_20191.pdf?m=1607959333640
source-text: a. In flood zone 2 or 3 (including minor development and change of use); or b. Of 1 hectare
  (ha) or more in flood zone 1.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave only ''most developments within one of the flood zones''.'
review-status: unverified
field-status: {}
