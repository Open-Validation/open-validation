  notes: 'Grokbot''s link and 2019 vintage are right, and it captures nearly every Table 1 row of the
    All Applications list, but the extraction is unreliable in detail. Many triggers are truncated or
    mixed up with neighbouring rows: S106, drainage, archaeology and contaminated land carry the wrong
    text, and the FRA, retail, HRA and ecology thresholds are lost. The blanket ''INFERRED'' Full-only
    placement misfiles items: LBC holds only Lighting, and Full planning is missing site levels, contamination
    and lighting. There are also invented rows (Travel Plan, wind) and process text logged as requirements.
    The Householder list was not part of the manual upload, so the Householder rows were judged only from
    Grokbot''s own text.'
notes: 'Reorganisation: LGR: July 2026 decision for Lincolnshire, North Lincolnshire and North East Lincolnshire
