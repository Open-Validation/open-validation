reference: design-and-access-statement
local-authority: SHO
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.sholland.gov.uk/media/14057/Local-List-for-All-Applications-2019/pdf/South_Holland_District_Council_Local_List_for_All_Applications_20191.pdf?m=1607959333640
source-text: 'Design and Access Statement A Design and Access Statement is required for: All major applications
  (as defined in the DMPO) (whether outline or full); … All applications for Listed Building Consent.'
