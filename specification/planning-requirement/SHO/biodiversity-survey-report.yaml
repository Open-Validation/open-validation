reference: biodiversity-survey-report
local-authority: SHO
required-if:
  any:
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: The development may directly or indirectly affect International Sites (SAC/SPA/Ramsar),
        SSSI, NNR, SNCI, RIGS, LNR, LWS or s41 priority habitats.
  - condition:
      field: demolition
      value: true
      description: Applications involving demolition works to an existing building.
  - condition:
      field: veteran-trees
      value: true
      description: Work to veteran trees, trees with holes or cavities, or trees with a girth over 1m.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting within 50m of woodland or water.
  - condition:
      field: near-watercourse
      value: true
      description: Proposals within 20m of rivers.
  - condition:
      field: protected-species
      value: true
      description: Protected or priority species are known or likely to be present.
  - discretionary
source-url: https://www.sholland.gov.uk/media/14057/Local-List-for-All-Applications-2019/pdf/South_Holland_District_Council_Local_List_for_All_Applications_20191.pdf?m=1607959333640
source-text: 'Ecological Assessment Required for all developments which may, directly or indirectly affect:
  - International Sites (SAC/SPA/ Ramsar); … - Applications involving demolition works to an existing
  building; … - Major proposals within 500m of a pond or lake or minor proposals within 100m of a pond
  or lake; … - Proposed tree work (felling or lopping)'
must-include:
- item: Recommendations for biodiversity net gain
  level: must
  source-text: Make recommendations for biodiversity net gain.
- item: A Protected Species Survey, where protected or priority species are known or likely to be present
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected or priority species are known or likely to be present.
confidence: medium
notes: 'Audit (wrong_trigger): the workbook kept only the first bullet. From the audit, the trigger also
  covers barn conversions, works affecting roof spaces, church curtilages, major proposals within 500m
  (minor within 100m) of a pond or lake, and derelict, allotment or railway land; these are shown as officer
  discretion. Applies to all application types, including householder, demolition in a conservation area
  and works to trees.'
review-status: unverified
field-status: {}
