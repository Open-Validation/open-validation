reference: town-centre-impact-assessment
local-authority: HAA
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure or office development not in an existing centre (policies CS4 and AL3).
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: More than 2,500 sq m.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS4, AL3; NPPF paragraph 26
source-text: All applications for retail, leisure and office development of more than 2,500 square metres
  that are not in an existing centre as defined by Local Plan (Core Strategy) policy CS4 and Local Plan
  (Allocations) policy AL3 will require an impact assessment in line with paragraph 26 of the NPPF.
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 19. From 'Town Centre Uses/Sequential Assessment'. The sequential assessment for
  all main town centre uses outside existing centres has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
