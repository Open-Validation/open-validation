policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS11, CS13, CS16, DM8
source-text: Applications should be accompanied by both hard and soft landscaping details and include
  proposals for long term maintenance and landscape management.
must-include:
- item: Hard and soft landscaping details
  level: must
- item: Proposals for long-term maintenance and landscape management
  level: must
- item: Detailed proposals that follow on from the design concept in the Design and Access Statement (if
    required)
  level: should
- item: Existing trees and other vegetation retained where practicable and incorporated into the design,
    and protected during construction
  level: should
confidence: medium
