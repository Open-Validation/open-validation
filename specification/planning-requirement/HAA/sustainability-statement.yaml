reference: sustainability-statement
local-authority: HAA
required-if:
  condition:
    field: floorspace-non-residential
    operator: '>'
    value: 500
    description: Non-residential development over 500 sq m.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS14, CS16; Emsworth Neighbourhood
  Plan policy D6
source-text: Policy CS14 of the Local Plan (Core Strategy) - Efficient Use of Resources - advises that
  on completion, unless proven to be financially or technically unviable non-residential* over 500 square
  metres, should meet the ‘very good’ standard of the Building Research Establishment’s Environmental
  Assessment Method (BREEAM).
must-include:
- item: A BREEAM pre-assessment estimator showing how the development will meet BREEAM Very Good, using
    a licensed BREEAM assessor
  level: must
- item: A sustainability statement setting out the development's approach to sustainable design (it can
    be in the Design and Access Statement)
  level: must
- item: 'If BREEAM Very Good is said to be unviable: evidence why (for technical feasibility, an expanded
    pre-assessment estimator or design stage assessment showing which credits can and cannot be pursued)'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 18-19. Whether a scheme is residential or non-residential generally depends on its
  Part L assessment (SAP = residential, SBEM = non-residential).
review-status: unverified
field-status: {}
