reference: water-impact-assessment
local-authority: HAA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development with a net increase of one dwelling or more.
  - discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS11, DM24; Conservation of Habitats
  and Species Regulations 2017 (as amended)
source-text: 'This applies to the following types of development: • Any residential development proposing
  a net increase of one dwelling or more • Any development which would result in an increase in overnight
  accommodation'
must-include:
- item: A nutrient budget completed using the up-to-date Natural England calculator
  level: must
- item: An occupancy calculator completed using the up-to-date Havant Borough Council occupancy calculator
    (unless an outline application where the quantum and mix of development are not known)
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 15. From 'Nutrient Neutrality and Recreational Disturbance Mitigation'. Any increase
  in overnight accommodation has no field, so it is shown as discretionary. The European Sites Avoidance
  and Mitigation Checklist also required has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
