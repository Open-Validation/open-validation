reference: floor-plan-existing
local-authority: HAA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The plans are needed to show the works in relation to what is there.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed floor plans (scale 1:100 or 1:50) – as necessary to clearly show the
  proposed works in relation to what is already there. Where applicable, these should highlight any existing
  walls or buildings that are to be demolished
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Existing walls or buildings to be demolished highlighted
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Walls or buildings are to be demolished.
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 3. Existing floor plans only where there is an existing building.
review-status: unverified
field-status: {}
