reference: recreation-facilities-assessment
local-authority: HAA
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: The development involves the loss of playing fields and sporting facilities.
  - site:
      in:
      - open-space
      description: Development within open spaces.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS1, DM1; Emsworth Neighbourhood
  Plan policies C4 and C5
source-text: Justification will be required for any development that involves the loss of playing fields
  and sporting facilities. … For development within open spaces, application proposals should be accompanied
  by plans showing any areas of existing or proposed open space within or adjoining the application site.
must-include:
- item: A surplus of provision shown against the local standards in the council's Open Spaces and Play
    Pitch documents, or, where there is no surplus, details of replacement facilities
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of playing fields and sporting facilities.
- item: What facilities exist or last existed, when they were last used and by whom, and what formal sports
    provision is proposed, including any replacement facilities
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of playing fields and sporting facilities.
- item: 'Playing fields: the size of the playing field and how much is affected (hectares or square metres)'
  level: must
  required-if: discretionary
- item: 'Playing fields: an existing site plan showing the layout of any pitches, including safety margins,
    at a minimum 1:1250 scale'
  level: must
  required-if: discretionary
- item: 'Playing fields: a proposed site plan showing how new buildings and other works are likely to
    affect the pitch layout, including any realignment'
  level: must
  required-if: discretionary
- item: 'Playing fields: any information on alternative sport and recreational provision'
  level: must
  required-if: discretionary
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: should
  required-if:
    site:
      in:
      - open-space
      description: Development within open spaces.
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 17-18. From 'Playing Fields, Sporting Facilities and Open Space Assessments'. The
  playing field items apply to 'applications specifically involving playing fields'; there is no field
  for that, so they are shown as discretionary.
review-status: unverified
field-status: {}
