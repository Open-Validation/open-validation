reference: affordable-housing-statement
local-authority: HAA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings (affordable housing on site).
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 to 14 dwellings.
    - discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policy CS9; Housing SPD July 2011
source-text: 'Developments of 15 dwellings or more need to provide 30-40% affordable housing on site …
  Developments between 5 and 14 dwellings need to provide 30-40% affordable housing on site or a suitable
  contribution in lieu of this. … In the case that affordable housing is provided on site, please provide
  a statement which contains the following information:'
must-include:
- item: The numbers of residential units
  level: must
- item: Plans showing the location and mix of units, with numbers of habitable rooms and/or bedrooms,
    or the floor space of habitable areas
  level: must
- item: A clear and full explanation if different levels or types of affordability or tenure are proposed
    for different units
  level: should
  required-if: discretionary
- item: Details of any Registered Social Landlords acting as partners in the development
  level: should
confidence: medium
notes: 'From the council''s list (implemented 12 December 2022, minor updates 3 April 2023), Part Two
  (Local Requirements), page 5. The statement is needed where affordable housing is provided on site:
  always at 15+ dwellings; at 5-14 dwellings only if on-site provision is chosen instead of a contribution,
  so that part is shown as discretionary. A separate CIL Social Housing Relief form is needed for relief.'
review-status: unverified
field-status: {}
