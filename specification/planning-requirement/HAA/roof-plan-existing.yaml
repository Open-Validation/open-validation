reference: roof-plan-existing
local-authority: HAA
required-if: discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof plans (drawn to an identifiable scale – can be shown on block plan) – where the roof
  design is not simple single dual or mono pitches, to clearly show the proposed works in relation to
  what is already there.
must-include:
- item: Drawn to an identifiable scale (can be shown on the block plan)
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 3. Needed where the roof design is not a simple single, dual or mono pitch; there
  is no field for roof design, so it is shown as discretionary. Existing roof plans only where there is
  an existing roof.
