reference: sustainable-drainage-strategy
local-authority: HAA
required-if:
  ref: major-development
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policy CS15; LLFA Guidance
source-text: This requirement applies to all major applications.
must-include:
- item: Existing flood risk
  level: must
- item: 'SuDS design: potential discharge points and locations, including their sensitivity'
  level: must
- item: Existing drainage
  level: must
- item: 'Ground conditions and infiltration: contamination that may affect infiltration devices, ground
    investigation, groundwater levels and infiltration tests (detail may not be needed for outline applications)'
  level: must
- item: Runoff calculations
  level: must
- item: 'Attenuation: how surface water flows and volumes will be contained on site'
  level: must
- item: 'Exceedance flows: what happens if the design event is exceeded, including flow routes, depths
    and velocities'
  level: must
- item: 'General maintenance regimes: who will manage surface water, with evidence they are in discussion
    with the developer, including agreed management of any off-site system receiving flows where critical
    to the on-site SuDS'
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 8-9. From the section 'Drainage (Surface Water and SuDS) and Foul Sewage Assessment'.
  The Foul Sewage Assessment part has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
