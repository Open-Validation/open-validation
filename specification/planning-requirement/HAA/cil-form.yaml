reference: cil-form
local-authority: HAA
required-if:
  any:
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 100
      description: New residential development (including extensions) over 100 sq m.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more dwellings, including annexes (even under 100 sq m).
  - condition:
      field: residential-annexe
      value: true
      description: A residential annexe.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Out-of-town retail.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 100
        description: More than 100 sq m of new or additional retail floorspace.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: CIL Regulations 2010; CIL Regulations (Amendment) 2019; HBC Developer Contributions Guide
source-text: Completion of BOTH the Additional Information Form and Assumption of Liability Form is required
  for • New residential development (extensions) over 100 sqm • The creation of 1 or more dwellings including
  annexes (even if it is less than 100 sqm) • Development in excess of 100 sqm of new/additional out of
  town retail floor space
must-include:
- item: Additional Information Form
  level: must
- item: Assumption of Liability Form
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 7-8. A Self Build Exemption Claim Form Part 1 is recommended early but is not a
  validation requirement.
review-status: unverified
field-status: {}
