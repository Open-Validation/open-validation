reference: location-plan
local-authority: HAA
required-if:
  always: true
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A plan which identifies the land, to an identified scale (1:1250 or 1:2500) and showing a
  north point.
must-include:
- item: At an identified scale (1:1250 or 1:2500), with a north point
  level: must
- item: At least two named roads and the surrounding buildings, wherever possible
  level: should
- item: Application site edged clearly in red, including all land needed to carry out the development
    (for example access from a public highway, landscaping, car and cycle parking and open areas around
    buildings)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: 'If based on Ordnance Survey data: the licence number or download details clearly shown'
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 2-3.
review-status: unverified
field-status: {}
