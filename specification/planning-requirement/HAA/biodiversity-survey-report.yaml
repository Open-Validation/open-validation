reference: biodiversity-survey-report
local-authority: HAA
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The development could affect habitats or species of principal importance (England Biodiversity
        List).
  - site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      description: Could affect statutory designated wildlife sites (SSSIs, SPAs, SACs and Ramsar sites).
  - discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policy CS9 (as cited); BS 42020
source-text: Where a proposed development has the potential to affect biodiversity and wildlife interests,
  information should be provided on existing biodiversity features, including possible impacts on them.
must-include:
- item: Existing biodiversity features and the possible impacts on them
  level: must
- item: How the application addresses identified impacts, following the 'avoid, mitigate, compensate'
    approach (BS 42020)
  level: should
- item: Based on a data search from the Hampshire Biodiversity Information Centre, not just the NBN Atlas
  level: should
- item: Assessment of impacts on Habitats and Species of Principal Importance (England Biodiversity List)
    and, where applicable, on SSSIs, SPAs, SACs and Ramsar sites
  level: should
- item: All ecological information submitted with the application (survey work is not normally conditioned)
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 7. The list calls this 'Biodiversity/ Ecological Assessment'. 'Potential to affect
  biodiversity and wildlife interests' has no threshold, so it is also shown as discretionary. The Biodiversity
  Checklist 'should be completed' as a guide; it is not a separate requirement in this list (the 2024
  consultation draft proposes making it one).
review-status: unverified
field-status: {}
