reference: viability-assessment
local-authority: HAA
required-if: discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS19, CS21, DM11, DM24
source-text: Where applicants intend to make submissions regarding the viability of developments a Viability
  Statement must be submitted with the application at the outset.
must-include:
- item: Development costs and values and any key assumptions made in assessing profitability
  level: should
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 22-23. Needed when the applicant intends to argue viability, which has no field,
  so it is shown as discretionary. The council is likely to peer review it at the applicant's cost. If
  viability becomes an issue later, the application will be invalidated until a statement is provided.
