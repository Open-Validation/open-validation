reference: travel-plan
local-authority: HAA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 100
      description: Residential development over 100 dwellings.
  - condition:
      field: office-floorspace
      operator: '>='
      value: 2500
      description: B1 (including office, higher and further education establishments) from 2,500 sq m
        gross floorspace.
  - discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies DM11, DM12
source-text: A Travel Plan is required for • Any residential development over 100 dwellings • food and
  non-food retail • cinema and conference facilities • other leisure (D2) uses (excluding stadium) from
  and above 1000 sqm gross floor space • B1 (including office, higher and further education establishments
  from and above 2500 sqm gross floor space • stadia of 1500+ seats • other service developments such
  as hospitals, • smaller traffic attracting developments in rural areas
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 20. Retail, cinema and conference, leisure (D2) from 1,000 sq m, stadia of 1,500+
  seats, hospitals and smaller traffic-attracting rural development have no matching field (and the list
  gives no threshold for some), so they are shown as discretionary.
review-status: unverified
field-status: {}
