reference: site-plan
local-authority: HAA
required-if:
  always: true
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block plan (scale 1:500 or 1:200) – to show the footprint of the proposal and detailing any
  changes to the existing boundary treatment. A block plan need not be provided where the information
  is only a duplication of that clearly visible and identifiable on the location plan.
must-include:
- item: At a scale of 1:500 or 1:200
  level: must
- item: The footprint of the proposal
  level: must
- item: Any changes to the existing boundary treatment
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 3. Not needed where it would only duplicate what is clearly shown on the location
  plan. Written dimensions to boundaries 'may be included'; the council's 2024 consultation draft proposes
  making them required, but that draft has not been adopted.
review-status: unverified
