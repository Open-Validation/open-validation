reference: noise-assessment
local-authority: HAA
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development, and/or close to existing sources of noise or vibration
        (e.g. major roads, railway lines, industry, wind turbines).
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal raises issues of disturbance.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS16, DM10; BS 4142
source-text: A Noise Impact Assessment will be required for developments that are considered to be noise
  sensitive and/or are close to existing sources of noise or vibration, e.g. major roads, national railway
  lines and industrial developments, wind turbines.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 14-15. The list calls this a Noise Impact Assessment.
review-status: unverified
field-status: {}
