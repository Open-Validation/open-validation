reference: arboriculturist-report
local-authority: HAA
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on site, or off-site trees in close proximity (including works for access drives,
      patios, drains and services).
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policy DM8; BS5837:2012
source-text: An Arboricultural Implications Appraisal (AIA) is required for any development (including
  construction of access drive, patios, and the laying of drains/services) where trees are located on
  site, or there are off site trees in close proximity to the proposed project. An Arboricultural Method
  Statement (AMS) must be provided (including a Tree Protection Plan) where there is potential for impact
  on a tree in relation to the proposed development.
must-include:
- item: Arboricultural Implications Appraisal showing how tree constraints informed the design and identifying
    all possible conflicts with existing trees (including drains and services, construction access, contractors'
    parking, storage of materials and changes in ground levels)
  level: must
- item: Arboricultural Method Statement with a Tree Protection Plan, setting out protection measures for
    retained trees through the whole development, any tree work, and how conflicts will be addressed
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Potential for impact on a tree.
- item: Following BS5837:2012 'Trees in relation to design, demolition and construction'
  level: should
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 20-21. The list calls this 'Tree Survey/ Arboricultural Implications'.
review-status: unverified
field-status: {}
