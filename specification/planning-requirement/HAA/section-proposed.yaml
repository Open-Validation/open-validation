reference: section-proposed
local-authority: HAA
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground level, or the site slopes.
  - discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed site sections, finished floor and site levels (scale 1:100 – 1:50)
  – where the proposal involves a change in ground level or sloping sites. Section drawings may also be
  requested in other cases.
must-include:
- item: At a scale between 1:100 and 1:50
  level: must
- item: Finished floor and site levels
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 3. 'May also be requested in other cases' is shown as discretionary. The drawings
  may take the form of contours, spot levels, or cross/long sections.
review-status: unverified
field-status: {}
