reference: land-contamination-assessment
local-authority: HAA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: New development of more than 10 dwellings.
  - site:
      in:
      - contaminated-land
      description: Contamination is known to exist on the site.
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - near-landfill-site
        description: The site is within 250 metres of an existing or former landfill site listed by the
          Environment Agency (not householder applications).
source-url: https://www.havant.gov.uk/media/10122/download?inline
source-text: 'A Land Contamination Assessment will be required for: Any new development of dwellings,
  greater than 10 units Any site where contamination is known to exist Excluding householder application,
  any site situated within 250 metres of existing or former landfill site listed by the Environment Agency
  (see ‘Further Guidance’).'
confidence: low
notes: 'Audit (wrong_app_type): the workbook placed this under Householder and Minerals & waste (county);
  the trigger is about new dwellings, known contamination and landfill proximity. The landfill branch
  excludes householder applications; full and outline are shown as the main other types. Audit (wrong_document):
  most excerpts come from the 2024 consultation draft (media/10122), not the adopted list (media/9115,
