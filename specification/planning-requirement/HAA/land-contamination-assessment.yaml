reference: land-contamination-assessment
local-authority: HAA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 10
      description: New development of more than 10 dwellings.
  - site:
      in:
      - contaminated-land
      description: Contamination is known to exist.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of an existing or former landfill site listed by the Environment
          Agency.
  - condition:
      field: previously-developed-land
      value: true
      description: Development on previously developed land (screening assessment).
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive land use such as residential units, gardens, public open space, play space
        or allotments (screening assessment).
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policy DM10; BS10175
source-text: 'A Land Contamination Assessment will be required for: • Any new development of dwellings,
  greater than 10 units • Any site where contamination is known to exist • Excluding householder application,
  any site situated within 250 metres of existing or former landfill site listed by the Environment Agency
  (see ‘Further Guidance’). … Applications should be supported by such information as is necessary to
  allow a screening assessment of the risks from ground contamination to the completed development, to
  sensitive adjacent land uses or ecosystems, and to controlled waters, where: • Development is proposed
  on land that has been previously developed, whether or not previous structures have been demolished,
  or • Proposals include a sensitive land use such as residential units, private residential gardens,
  public open space, play space or allotment gardens'
must-include:
- item: At minimum, an environmental desk study and site 'walkover' survey report (environmental searches
    alone are not a desk study)
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 12. The list excludes householder applications; the rules can't say 'not householder',
  so the main planning application types are listed.
review-status: unverified
field-status: {}
