reference: elevation-proposed
local-authority: HAA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The proposal involves building works.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes the elevations of a building.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevations (scale 1:100 or 1:50) – as necessary to clearly show the
  proposed works in relation to what is already there. Where a proposed elevation adjoins another building,
  or is in close proximity to it, the drawings should show the relationship between the two buildings
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: 'Where the elevation adjoins or is close to another building: the relationship between the two
    buildings'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 3. The relationship item has no field for 'close to another building', so it is
  shown as discretionary.
review-status: unverified
field-status: {}
