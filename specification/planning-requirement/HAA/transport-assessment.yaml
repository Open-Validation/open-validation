reference: transport-assessment
local-authority: HAA
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS20, DM11, DM12
source-text: A Transport Assessment is required where the proposal is a major development or would lead
  to significant transport implications.
must-include:
- item: 'For major proposals: accessibility to the site by all modes and the likely modal split of journeys'
  level: should
  required-if:
    ref: major-development
- item: 'For major proposals: measures to improve access by public transport, walking and cycling, to
    reduce parking need and to mitigate transport impacts'
  level: should
  required-if:
    ref: major-development
- item: 'Where a new access is proposed: general arrangement plans clearly showing the visibility provided,
    in line with the standards for the design/recorded speed of traffic'
  level: should
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new access is proposed.
- item: 'Where new streets are provided: a Stage 1 or Stage 2 Road Safety Audit of the internal street
    layout'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 19-20. 'Significant transport implications' has no threshold, so it is shown as
  discretionary; the new-streets item has no field, so it is too.
review-status: unverified
field-status: {}
