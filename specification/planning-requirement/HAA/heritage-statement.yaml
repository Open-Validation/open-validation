reference: heritage-statement
local-authority: HAA
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - locally-listed-building
    description: 'Affects heritage assets: listed buildings, unlisted buildings in Conservation Areas
      or locally listed buildings, including their setting.'
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policy CS11; Emsworth Neighbourhood Plan
  policy H1
source-text: 'A Heritage Statement is required for all applications affecting heritage assets: i.e., listed
  buildings; unlisted buildings in Conservation Areas or locally listed buildings, including applications
  affecting the setting for any of the above.'
must-include:
- item: The impact and implications of the development on heritage assets, such as historic buildings,
    archaeology, designed and historic landscapes, set out and discussed
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 11. The scope and detail will vary with the circumstances of each application.
review-status: unverified
field-status: {}
