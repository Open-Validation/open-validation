reference: lighting-assessment
local-authority: HAA
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: Street lighting on housing developments, or external lighting for business parks and
        commercial premises (including nursing homes, sports pitches, car parks, garage forecourts).
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Fixed illuminated noticeboards or neon lighting displayed through the night (24 hours)
          within a residential area.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Havant Borough Local Plan (Core Strategy/Allocations) policies CS16, DM10
source-text: A Lighting Assessment will be required to accompany all applications for ▪ Street lighting
  on housing developments ▪ Developments which include external lighting for business parks and commercial
  premises including nursing homes, sports pitches, car parks, garage forecourts. ▪ Advertisements with
  fixed illuminated noticeboards or neon lighting to be displayed through the night (24 hours) within
  a residential area
must-include:
- item: Prepared by a recognised independent consultant
  level: should
- item: Sky glow (%) and source intensity, with measurements in lux
  level: must
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part Two (Local
  Requirements), page 13.
review-status: unverified
field-status: {}
