reference: design-and-access-statement
local-authority: HAA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          description: In a Conservation Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace-non-residential
            operator: '>'
            value: 100
            description: More than 100 sq m of non-residential floorspace.
source-url: https://www.havant.gov.uk/media/9115/download?inline
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Emsworth Neighbourhood Plan policy D1 and Design Checklist
source-text: 'A Design and Access Statement must accompany applications for both outline and full planning
  permission for • Major development: 10 or more dwellings or creation in excess of 1000 sqm of non-residential
  floor space • The provision of one or more dwellings or creation in excess of 100 sqm of non-residential
  floor space in a Conservation Area.'
must-include:
- item: The design principles and concepts applied to the development, explained
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: How issues relating to access have been dealt with, and the policy adopted as to access
  level: must
- item: What, if any, consultation has been undertaken on access and what account has been taken of it
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'For proposals in Emsworth: how the Design Checklist in the Emsworth Neighbourhood Plan has influenced
    the proposal'
  level: must
  required-if:
    site:
      in:
      - neighbourhood-plan-area
      description: In Emsworth (the Emsworth Neighbourhood Plan area).
  source-text: For proposals in Emsworth only – demonstrate how the Design Checklist in the Emsworth Neighbourhood
    Plan has influenced the proposal.
confidence: medium
notes: From the council's list (implemented 12 December 2022, minor updates 3 April 2023), Part One (National
  Requirements), page 3-4.
review-status: unverified
field-status: {}
