reference: heritage-statement
local-authority: RUS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
        - demolition-con-area
        - ldc-prospective-use
        - s73
    - any:
      - site:
          in:
          - conservation-area
          description: Development within a Conservation Area.
      - site:
          in:
          - archaeological-priority-area
          - historic-environment-record
          description: Archaeological sites.
      - site:
          in:
          - listed-building
          - listed-building-setting
          description: Development to, or neighbouring/adjacent to, a Listed Building.
      - site:
          in:
          - scheduled-monument
          description: Development to a Scheduled Ancient Monument.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - listed-building-setting
        description: Householder development connected to a Listed Building.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 1: Policies 10 and 11; Local Plan Part 2: Policies 1, 28 and 29; NPPF Section
  16'
source-text: 'For all applications that include the following: Development within a Conservation Area
  (only required if the householder is in connection to a Listed Building) Archaeological Sites (applicants
  must consult Nottinghamshire Historic Environment Record prior to applying) Development to a Listed
  Building Development neighbouring / adjacent to a Listed Building Development to Scheduled Ancient Monument'
must-include:
- item: Historic features on or adjacent to the site
  level: must
- item: The significance of the heritage asset and the contribution of its setting
  level: must
- item: The impact of the development on that significance and/or setting
  level: must
- item: Clear and convincing justification of any harm
  level: must
- item: Mitigation of any negative impact
  level: must
- item: Reference to local sources (Conservation Area Appraisals, the Historic Environment Record, the
    Heritage Strategy)
  level: must
- item: Archaeological implications and mitigation where an archaeological site is present
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: An archaeological site is present.
- item: 'Listed building consent: an audit of affected features of importance, with photographs, and the
    principles of and justification for harmful works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: 'Heritage Statements for Listed Building Consent should also include: A detailed schedule
    of all works, including all internal and external works to the building(s). An audit of features of
    importance that will be affected by the proposals. This needs to include photographs of such features.
    The principles of and justification for the proposed works which have a harmful impact on the special
    character of the building, archaeological site or Scheduled Ancient Monument, and its setting.'
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 17. 'Heritage Statement
  (includes Archaeology)'. Applicants must consult the Nottinghamshire HER before applying for archaeological
  sites. The grid doesn't list it for householder applications, but the text asks for it where householder
  works in a conservation area connect to a listed building, so that case is shown. Application types
  are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
