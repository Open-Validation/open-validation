reference: travel-plan
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - all:
      - ref: major-development
      - discretionary
    - condition:
        field: new-school
        value: true
        description: New school facilities.
    - condition:
        field: school-expansion
        value: true
        description: Expanded school facilities.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Local Plan Part 1 Policy 14; Local Plan Part 2 Policy 1; NPPF Chapter 9
source-text: All major developments, specifically those which generate significant amounts of movement.
  Applications for New and expanded school facilities.
must-include:
- item: Specific outcomes, targets and measures promoting more environmentally friendly travel
  level: must
- item: Monitoring and management arrangements, and further measures if targets are not met
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 25. New and expanded
  schools always; major developments 'specifically those which generate significant amounts of movement',
  a judgement, so discretionary. Application types are those the scheme's application-type grid lists
  it for.
review-status: unverified
field-status: {}
