reference: energy-statement
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: renewable-energy-development
        value: true
        description: Applications for renewable energy production.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 2: Policy 16 Renewable Energy, Policy 1; NPPF Chapters 2 and 14'
source-text: Required for major applications and all applications for renewable energy production.
must-include:
- item: How the relevant measures in Local Plan Part 2 Policy 16 have been considered or incorporated
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 22. 'Renewable Energy
  Statement'; it can form part of the Sustainability Statement. Application types are those the scheme's
  application-type grid lists it for.
review-status: unverified
field-status: {}
