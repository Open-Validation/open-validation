reference: cil-form
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: cil-liable
      value: true
      description: The development is liable for CIL (not exempt, e.g. not minor development under 100
        sq m unless it creates one or more dwellings).
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Community Infrastructure Levy Regulations 2010; Rushcliffe CIL Charging Schedule
source-text: 'Our local validation requirements have been revised to include information required for
  CIL, to include: CIL additional information form (where applicable) CIL assumption of liability form
  (where applicable)'
must-include:
- item: CIL additional information form (where applicable)
  level: must
- item: CIL assumption of liability form (where applicable)
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 11. CIL has been charged
  in Rushcliffe since 7 October 2019. Application types are those the scheme's application-type grid lists
  it for.
review-status: unverified
field-status: {}
