reference: fire-statement
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: Required when the provision of one or more relevant buildings (residential or educational
  establishments of 7 or more storeys or 18m in height), or the development of an existing relevant building
  or Development within the curtilage of a relevant building. Includes change of use applications. Exemptions
  apply.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect)
  level: must
- item: The fire safety principles, concepts and approach applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How fire safety policies in local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 15. Shown with the national
  thresholds (relevant buildings with two or more dwellings or educational accommodation, 18 m or 7 storeys).
  Application types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
