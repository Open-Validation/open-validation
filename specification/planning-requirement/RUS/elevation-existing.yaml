reference: elevation-existing
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - ldc-existing-use
      - ldc-prospective-use
      - pa-ecomms-network
      - s73
      - consent-under-tpo
  - discretionary
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7(1)(c)(ii)
source-text: Should be submitted with all planning applications. ... Elevations if required - Preferably
  on paper size less than A2 and at a typical scale of 1:50 or 1:100, (existing & proposed should be at
  a similar scale to aid comparative study) scale annotated on the plan. Full elevations showing all sides
  of the development even if they do not contain windows/door openings. These plans should have critical
  dimensions marked for easy reference and to check scale.
must-include:
- item: Preferably on paper smaller than A2, typically at 1:50 or 1:100, existing and proposed at a similar
    scale, with the scale annotated
  level: should
- item: Full elevations showing all sides of the development, even those without windows or doors
  level: must
- item: Critical dimensions marked
  level: should
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 7. Part of 'Additional
  Plans'. The scheme says elevations 'if required', so discretionary. Existing elevations only where there
  is an existing building. Application types are those the scheme's application-type grid lists it for.
