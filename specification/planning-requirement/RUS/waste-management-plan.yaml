notes: From the council's list (adopted January 2024, revised January 2026), page 23. 'Site Waste Management
  Plan (where included in Neighbourhood plans)'. The heading limits it to areas whose neighbourhood plan
  asks for it, and 'an impact on the generation of waste' needs judgement, so it shows as discretionary.
  Application types are those the scheme's application-type grid lists it for.
