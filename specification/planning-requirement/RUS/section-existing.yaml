reference: section-existing
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: A sloping site, or level differences with adjacent sites.
    - discretionary
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Town and Country Planning (Development Management Procedure) (England) Order 2015; Local Plan
  Part 2: Policy 1 Development requirements'
source-text: Cross-sections – Showing the relationship between the development and any other structures
  on adjacent sites and in particular where there are level differences. ... In the case of householder
  development, the levels may be evident from floor plans and elevations, but particularly in the case
  of sloping sites it will be necessary to show how proposals relate to existing ground levels or where
  ground levels outside the extension would be modified.
must-include:
- item: Existing and proposed site levels and how buildings or structures relate to existing levels and
    neighbouring development or land
  level: must
- item: Related to a fixed datum point off site, at an accurate standard metric scale, with finished floor
    and site levels and major dimensions
  level: must
- item: The relationship between the development and structures on adjacent sites, particularly where
    levels differ
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), pages 7, 19. 'Levels and
  Cross Sections'. Needed 'particularly' on sloping sites or where levels differ; otherwise the levels
  may show on floor plans and elevations, so other cases are discretionary. Application types are those
  the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
