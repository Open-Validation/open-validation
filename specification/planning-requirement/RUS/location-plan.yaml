source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: An up-to-date site location plan at a scale of either 1:1250 or 1:2500 which identifies the
  site and the surrounding area and shows at least two roads and the north point. The site should be outlined
  in red on all copies and any other land owned by the applicant in blue. It should include all land necessary
  to carry out the proposed development (for example, changes to access arrangements, visibility splays,
  car parking and open areas around buildings).
must-include:
- item: Up to date, at a scale of 1:1250 or 1:2500
  level: must
- item: Identifies the site and the surrounding area, showing at least two roads and the north point
  level: must
- item: Site outlined in red, including all land needed for the development (e.g. access changes, visibility
    splays, car parking and open areas around buildings); other land owned by the applicant in blue
  level: must
- item: If based on Ordnance Survey data, purchased or licensed for this purpose; not a copy of a plan
    made for another purpose (such as title deeds)
  level: must
- item: Preferably electronically or on paper smaller than A2, typically at 1:1250
  level: should
  source-text: Location plan – Preferably electronically or on paper size less than A2
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 6. Application types
  are those the scheme's application-type grid lists it for.
