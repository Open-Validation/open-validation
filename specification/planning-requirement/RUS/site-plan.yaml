reference: site-plan
local-authority: RUS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - demolition-con-area
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - pa-ecomms-network
    - s73
    - approval-condition
    - consent-under-tpo
    - non-material-amendment
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Nottinghamshire County Council Highway Design Guide
source-text: One copy of the block plan should accompany any application
must-include:
- item: At a standard scale, e.g. 1:200 or 1:500
  level: must
- item: The direction north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written dimensions of the proposal and to the boundaries
  level: must
- item: The position and crown spread (to scale) of all trees within the site or within falling distance
    of it, where applicable
  level: must
- item: 'Unless they would not influence or be affected by the development: surrounding buildings and/or
    roads with access arrangements; public rights of way crossing or adjoining the site; extent and type
    of hard surfacing; existing and proposed boundary treatments'
  level: must
- item: Visibility splays to the highway authority's standards
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: The proposal includes a new access.
- item: Proposed/existing vehicle parking facilities
  level: must
- item: A linear scale bar and a unique plan/drawing reference number
  level: must
- item: 'Site layout plans: preferably on paper smaller than A2 at a typical scale of 1:200 or 1:500,
    with critical dimensions marked'
  level: should
  source-text: Site Layout Plans – Preferably on paper size less than A2 and at a typical scale of 1:200
    or 1:500 clearly marking on the proposed development, these plans should have critical dimensions
    marked for easy reference and to check scale.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), pages 7, 10. 'Block Plan'
  in the scheme. Application types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
