reference: archaeological-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - any:
        - condition:
            field: new-build
            value: true
            description: New building.
        - condition:
            field: ground-disturbance
            value: true
            description: Ground disturbance.
      - site:
          in:
          - scheduled-monument
          - archaeological-priority-area
          - historic-environment-record
          description: On or adjoining a designated or non-designated heritage asset of archaeological
            interest (e.g. near a Scheduled Ancient Monument or known remains on the Nottinghamshire HER).
    - discretionary
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 1: Policy 11; Local Plan Part 2: Policy 28; NPPF 16'
source-text: When any proposed development includes new building or ground disturbance on or adjoining
  a designated or non-designated heritage asset of archaeological interest or development upon a site
  which has the potential for heritage assets of archaeological interest. This can include sites in close
  proximity to a Scheduled Ancient Monument, sites in close proximity to church yards, sites containing
  or close to known undesignated remains as identified on the Nottinghamshire Historic Environment Record.
must-include:
- item: An archaeological desk-based assessment
  level: must
- item: 'Where the desk-based assessment finds potential: an archaeological field evaluation or historic
    building recording, as the County Council''s archaeological advisor advises'
  level: should
  required-if: discretionary
- item: Undertaken by a suitably qualified heritage practitioner, to Chartered Institute for Archaeologists
    standards
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 9. Sites with 'the potential
  for heritage assets of archaeological interest' (including near church yards) need judgement, so that
  part is discretionary. Application types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
