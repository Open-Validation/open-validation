reference: land-contamination-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - ldc-prospective-use
      - s73
  - any:
    - site:
        in:
        - contaminated-land
        - near-landfill-site
        description: Known or suspected to be affected by land contamination (e.g. previous industrial
          use or a landfill site).
    - condition:
        field: sensitive-end-use
        value: true
        description: Development vulnerable to contamination (residential housing, schools and pre-school
          nurseries).
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 2: Policy 40, Policy 1; NPPF 15'
source-text: Where the development site is known or suspected to be affected by land contamination (e.g.
  has previously been used for industrial purposes or is a landfill site). All developments vulnerable
  to the effects of contamination (residential housing, schools and pre-school nurseries).
must-include:
- item: The likelihood, nature and potential risk of land contamination, and further measures needed to
    make the site suitable
  level: must
- item: As a minimum, a desk top study and site walk-over report
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 18. Application types
  are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
