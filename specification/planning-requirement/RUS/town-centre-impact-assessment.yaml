reference: town-centre-impact-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use (e.g. retail) outside defined centres.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'NPPF 7; Local Plan Part 2: Policies 1, 25, 26 and 27'
source-text: Retail Impact Assessment is required for retail developments of more than 200 square meters
  net outside defined Centres. Assessment of the retail impact of proposed development on the Central
  Shopping Area will only be required where the retail floorspace proposed exceeds 525 square meters net.
  Retail proposals that are over 525 square meters net will be required to undertake a Retail Impact Assessment
  on all Defined Centres (including the Central Shopping Area) in the catchment area. Retail proposals
  that are between 200 and 525 square meters over 200 square meters net will be required to undertake
  a Retail Impact Assessment on District and Local Centres in the catchment area.
must-include:
- item: A Sequential Assessment showing that in-centre then edge-of-centre sites have been assessed and
    can be discounted as unavailable or unsuitable
  level: must
- item: Retail Impact Assessment on District and Local Centres in the catchment
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 200
      description: Retail floorspace over 200 sq m net, outside defined Centres.
- item: Retail Impact Assessment on all Defined Centres in the catchment, including the Central Shopping
    Area
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 525
      description: Retail floorspace over 525 sq m net.
- item: Impact on investment in Defined Centres (with cumulative impact) and on their vitality and viability
    up to five years (ten for major schemes)
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 22. 'Sequential Test
  / Retail Impact'. The scheme gives no trigger for the sequential assessment itself; it is shown for
  main town centre uses outside centres, the NPPF test it refers to. Scope to be agreed with the council.
  Application types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
