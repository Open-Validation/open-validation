reference: biodiversity-survey-report
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - s73
      - consent-under-tpo
  - any:
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-wildlife-site
        - local-nature-reserve
        description: In or adjacent to a European site (SAC/SPA/Ramsar), SSSI, National Nature Reserve,
          Local Wildlife Site or Local Nature Reserve.
    - condition:
        field: geodiversity-interest
        value: true
        description: In or adjacent to a Regionally Important Geological Site (RIGS).
    - all:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
          - lbc
          - demolition-con-area
          - s73
          - consent-under-tpo
      - site:
          in:
          - wildlife-corridor
          - priority-habitat
          description: In or adjacent to a Wildlife Corridor or Priority Habitat (not householder).
    - condition:
        field: greenfield-site
        value: true
        description: Development of a greenfield site.
    - condition:
        field: derelict-site
        value: true
        description: Redevelopment of disused, redundant or buildings in disrepair in the main urban area.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 2: Policy 38, Policy 1; NPPF Chapter 15; Conservation of Habitats and Species
  Regulations 2017'
source-text: 'Required with all developments in or adjacent to: European Site (i.e. SAC/SPA/Ramsar) Site
  of Special Scientific Interest (SSSI) In or adjacent to National Nature Reserve (NNR) Local Wildlife
  Sites (LWS) Regionally Important Geological Sites (RIGS) Local Nature Reserve (LNR) Wildlife Corridors
  (except for householders) Priority Habitats (except for householders) Development of greenfield sites
  Redevelopment of disused, redundant or buildings in disrepair in the main urban area'
must-include:
- item: Existing biodiversity interests on the land and on adjoining or nearby land that may be affected
  level: must
- item: Possible impacts on those interests, direct and indirect, during construction and afterwards
  level: must
- item: Avoidance, mitigation and/or compensation measures, including how alternatives were considered
    where harm is likely
  level: must
- item: In most cases a data request to the Nottinghamshire Biological Records Centre and a Preliminary
    Ecological Appraisal (PEA)
  level: should
- item: A Protected Species Survey and Assessment where protected species are likely to be affected
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: The proposal is likely to affect protected species.
- item: Bat roost and bird nesting surveys (external and internal photographs of roofs and eaves may show
    they aren't needed)
  level: must
  required-if:
    any:
    - condition:
        field: roof-alteration
        value: true
        description: Removal of the whole roof or raising of the roof height.
    - condition:
        field: derelict-site
        value: true
        description: Poorly maintained roofs and eaves, or derelict or unused buildings being converted.
  source-text: Bat roost and bird nesting surveys are required in relation to applications proposing the
    removal of the whole roof or raising of the roof height, poorly maintained roofs and eaves. Also any
    derelict or unused buildings that are being converted. Photographs (external and internal) of the
    roofs and eaves may be sufficient to demonstrate that the bat roost and bird nesting surveys may not
    be required.
- item: Habitats, features and species present or likely present, their extent and numbers, mapped on
    a plan at an appropriate scale
  level: must
- item: Surveys by competent persons at an appropriate time of year and in suitable conditions, using
    nationally recognised methods
  level: must
- item: Proposed enhancements, and likely changes to habitats and species numbers after development (net
    loss or gain)
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 12. 'Ecology Report'
  in the scheme. RIGS are shown as geodiversity interest. Application types are those the scheme's application-type
  grid lists it for.
review-status: unverified
field-status: {}
