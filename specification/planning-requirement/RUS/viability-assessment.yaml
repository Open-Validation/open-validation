reference: viability-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - lbc
      - s73
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The contributions expected from the development are not financially possible.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Local Plan Part 1 Policy 19; Local Plan Part 2 Policy 43; Developer Contributions SPD
source-text: Required for applications where contributions expected from the development are not financially
  possible.
must-include:
- item: Follows the government's recommended approach in National Planning Practice Guidance
  level: must
- item: A redacted copy for publication, removing sensitive information and personal data
  level: must
- item: A residual land value and a benchmark land value
  level: must
- item: Evidence for all values and costs, and justification of all assumptions
  level: must
- item: A model capable of full interrogation by the council and its advisors
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 26. 'Viability Assessment
  - Enabling development'. The applicant pays for independent review. Application types are those the
  scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
