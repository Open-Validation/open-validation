reference: noise-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Development with the potential to generate noise (e.g. industrial units, external
          air conditioning or extraction, workshops, nurseries, nightclubs, pubs, restaurants/takeaways,
          schools, outdoor sports).
    - condition:
        field: near-noise-source
        value: true
        description: Development next to an existing noise source (e.g. an industrial site, a busy road
          or railway line).
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 2: Policy 40; NPPF 15 (para. 187)'
source-text: 'They are required for the following types of development: Proposed developments that have
  the potential to generate noise, for example, industrial units, installation of external air conditioning
  and ventilation / exhaust system / flue units, workshops, day nurseries, nightclubs, public houses,
  restaurants/takeaways, schools/colleges, outdoor sports facilities etc. Proposed developments located
  next to an existing noise source, for example, next to an industrial site, a busy road, or railway line.'
must-include:
- item: Existing background noise levels measured over 24 hours (including cumulative levels of existing
    units)
  level: must
- item: Proposed noise levels (including cumulative levels of proposed units)
  level: must
- item: Proposed measures to reduce noise
  level: must
- item: Manufacturer's specification of any equipment to be installed, altered or replaced
  level: must
- item: The method used, with example calculations and assumptions
  level: must
- item: Completed by a qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 21. 'Noise Impact Assessment
  (include extract equipment)'. Application types are those the scheme's application-type grid lists it
  for.
review-status: unverified
field-status: {}
