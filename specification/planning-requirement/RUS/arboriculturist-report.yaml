reference: arboriculturist-report
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - s73
      - approval-condition
      - consent-under-tpo
      - non-material-amendment
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site may be affected.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedges within or adjacent to the site may be affected.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'NPPF 15; Local Plan Part 2: Policy 1, Policy 37 Trees and Woodlands'
source-text: Required for all applications where trees or hedges within or adjacent to the application
  site may be affected
must-include:
- item: 'Tree survey: condition of the trees and potential impact of the development; trees to be removed/retained;
    protection of trees and roots during construction; future growth issues; new planting; impact of hard
    and soft landscaping; maintenance regime'
  level: must
- item: 'Arboricultural Impact Assessment by a qualified arboriculturalist: accurate positions (with canopy
    spread and root area), species, health, vigour and amenity value of all trees/hedgerows on and next
    to the site; schedule of those to be retained or removed and why; protection measures during construction
    and the life of the development'
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 25. 'Tree Survey or
  Associated Arboricultural Impact Assessment'. Application types are those the scheme's application-type
  grid lists it for.
review-status: unverified
field-status: {}
