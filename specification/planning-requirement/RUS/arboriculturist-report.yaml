reference: arboriculturist-report
local-authority: RUS
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees or hedges within or adjacent to the application site may be affected.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
source-text: 'Government Guidance Tree Survey or Associated Arboricultural Impact Assessment Required
  for all applications where trees or hedges within or adjacent to the application site may be affected
  The Tree survey should include: A survey of the trees which should detail their current condition and
  the potential impact of the development, A concise list of trees to be removed/ retained Details of
  how the tree and tree roots would be protected during construction.'
must-include:
- item: A survey of the trees detailing their current condition and the potential impact of the development
  level: must
- item: A concise list of trees to be removed / retained
  level: must
- item: Details of how the trees and tree roots would be protected during construction
  level: must
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The scheme also lists
