reference: telecommunications-report
local-authority: RUS
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: NPPF 10. Supporting high quality communications
source-text: Telecommunications applications for planning permission should be supported by the necessary
  evidence to justify the proposed development.
must-include:
- item: The outcome of consultations with interested organisations, in particular the relevant body for
    a mast near a school or college or in an aerodrome, technical site or explosives storage safeguarding
    zone
  level: must
- item: 'Addition to an existing mast or base station: a self-certified statement that cumulative exposure
    will not exceed International Commission guidelines'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: true
      description: An addition to an existing mast or base station.
- item: 'New mast or base station: evidence that antennas on an existing building, mast or structure were
    explored, and a self-certified statement that International Commission guidelines will be met'
  level: must
  required-if:
    condition:
      field: existing-mast
      value: false
      description: A new mast or base station.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 14. Part of the scheme's
  'Evidence Statement' (the grid's Telecommunications Application).
review-status: unverified
field-status: {}
