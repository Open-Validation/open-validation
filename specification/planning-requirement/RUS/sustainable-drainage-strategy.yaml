reference: sustainable-drainage-strategy
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        description: Adjacent to areas at risk of flooding.
    - condition:
        field: hard-surfacing
        value: true
        description: Creating new areas of hardstanding.
    - condition:
        field: non-mains-drainage
        value: true
        description: Disposal of foul sewage effluent other than to the public sewer.
    - condition:
        field: trade-effluent
        value: true
        description: Disposal of trade waste.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 1: Policy 2 Climate Change; Local Plan Part 2: Policies 1, 17, 18 and 19'
source-text: 'Required for all the below: All major applications Applications adjacent to areas at risk
  of flooding Developments creating new areas of hardstanding Developments involving the disposal of foul
  sewage effluent other than to the public sewer Developments involving the disposal of trade waste'
must-include:
- item: Details of the Sustainable Drainage Systems proposed
  level: must
- item: The type of permeable surfacing, and how surface water will be directed (soakaway, etc.)
  level: must
- item: 'Where discharging to a public sewer: why an alternative is not viable'
  level: must
- item: 'Trade effluent: the type, quantities, storage, treatment and disposal of any trade waste or effluent'
  level: must
  required-if:
    condition:
      field: trade-effluent
      value: true
      description: The development involves trade effluent.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 11. 'Drainage Assessment
  / Drainage Strategy' in the scheme (retired MHCLG id). Application types are those the scheme's application-type
  grid lists it for.
review-status: unverified
field-status: {}
