reference: transport-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - ref: major-development
  - condition:
      field: fronts-main-road
      value: true
      description: The development is accessed from a Trunk or Major A Road.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Local Plan Part 1 Policy 14; Local Plan Part 2 Policy 1; NPPF Chapters 2, 9 and 14; Nottinghamshire
  Highway Design Guide
source-text: Required for all major residential and commercial developments where the development is accessed
  from a Trunk or Major A Road.
must-include:
- item: Existing transport conditions, total travel demand and public transport patterns, and the development's
    impacts
  level: must
- item: How infrastructure or services could be improved, the need to travel (especially by car) minimised,
    and existing infrastructure best used
  level: must
- item: Adverse traffic impacts addressed, sustainable transport improvements, accessibility of the location,
    mitigation of residual impacts and other travel behaviour measures
  level: must
- item: Justification if the Highway Authority's parking requirements cannot be met
  level: must
  required-if:
    condition:
      field: parking-standards-departure
      value: true
      description: Parking requirements are not met.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 24. Application types
  are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
