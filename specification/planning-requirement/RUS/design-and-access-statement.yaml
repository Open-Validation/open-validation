reference: design-and-access-statement
local-authority: RUS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: Development in a designated area (a world heritage site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
source-text: '2015 Article 8 Design & Access Statement Design and access statements will be required for
  following types of application: Applications for major development Applications for development in a
  designated area (for the purposes of design and access statements, a designated area means a world heritage
  site or a conservation area), where the proposed development consists of: One or more dwellings; or
  A building or buildings with a floor space of 100 square metres or more Applications for listed buil'
confidence: medium
review-status: unverified
