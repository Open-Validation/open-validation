reference: design-and-access-statement
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
      - s73
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area (a world heritage site or a conservation area).
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with a floor space of 100 square metres or more.
    - application-type:
        in:
        - lbc
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  Local Plan Part 2 Policy 1 Development requirements
source-text: 'Design and access statements will be required for following types of application: Applications
  for major development Applications for development in a designated area (for the purposes of design
  and access statements, a designated area means a world heritage site or a conservation area), where
  the proposed development consists of: One or more dwellings; or A building or buildings with a floor
  space of 100 square metres or more Applications for listed building consent For householder applications,
  a Design and Access Statement will only be required where the above criteria triggers the need for one.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context of the development, and how the design takes that context
    into account
  level: must
- item: The applicant's approach to access and how relevant local plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access have been addressed
  level: must
- item: 'Built development: how the design complies with Local Plan design policies and, where relevant,
    Neighbourhood Plans and Local Design Guides'
  level: must
  required-if:
    condition:
      field: building-works
      value: true
      description: Built development.
  source-text: For all built developments a statement demonstrating how a design would be in compliance
    with Local Plan design policies, and, where relevant, Neighbourhood Plans and Local Design Guides
    will be required.
- item: 'Where appropriate: evidence of a design review panel, how its recommendations were considered,
    and how community engagement influenced the proposal'
  level: should
  required-if: discretionary
  source-text: Where appropriate any such statement should provide evidence of having gone through a design
    review panel, including setting out how any panel recommendations have been considered and incorporated
    into the final design, along with details of how any engagement with the local community has influenced
    the proposal.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 6. National rule, as
  the scheme sets out. The 'Design Statement National design guide' (section 6) asks for design considerations
  to go in the Design and Access Statement, or the Planning Statement where no DAS is needed; its items
  are shown here.
review-status: unverified
field-status: {}
