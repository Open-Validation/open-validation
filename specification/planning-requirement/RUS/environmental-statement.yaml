reference: environmental-statement
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: eia-development
      value: true
      description: Schedule 1 development, or Schedule 2 development likely to have significant environmental
        effects (including changes or extensions).
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'Required for: Schedule 1 Major developments for which an EIA is required. Schedule 2 If
  project is in a specific sensitive location. If project would have significant environmental effects
  by virtue of nature, size or location. Changes or extensions to Schedule 1 or Schedule 2 development
  May require an EIA if it has a significant adverse effect on the environment.'
must-include:
- item: Comprehensively covers all issues identified in the scoping opinion
  level: should
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 13. 'Environmental Impact
  Statement' in the scheme. Application types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
