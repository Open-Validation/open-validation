reference: lighting-assessment
local-authority: RUS
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: All proposals involving floodlighting.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: An illuminated advertisement.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
source-text: Environmental Impact Assessment - Guidance External Lighting Scheme Required for all proposals
  involving floodlighting, to assess the impact on neighbours and the wider area.
must-include:
- item: Reasons why the lighting is proposed
  level: must
- item: Mitigation measures
  level: must
- item: Impact on the amenity of neighbouring properties, specifically if light could extend beyond the
    site boundary
  level: must
- item: Impact on roads / highway safety
  level: must
- item: Impact on the character of the area and the wider landscape (Conservation Areas, Listed Buildings,
    SSSI, AONB, dark rural areas)
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. From the audit
  (wrong_app_type): Advertisement consent requires an External Lighting Scheme and Light Impact Assessment;
  that they are for illuminated adverts is inferred. The contents are from the workbook''s ''Advertisement
  drawings'' row, which is External Lighting Scheme text.'
review-status: unverified
field-status: {}
