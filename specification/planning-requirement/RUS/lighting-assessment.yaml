reference: lighting-assessment
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Proposals involving (external) floodlighting.
    - all:
      - application-type:
          in:
          - advertising
      - condition:
          field: illuminated
          value: true
          description: Illuminated advertisements.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 2: Policy 40 Pollution and Land Contamination, Policy 1'
source-text: Required for all proposals involving floodlighting, to assess the impact on neighbours and
  the wider area. ... Proposals which include external floodlighting and illuminated advertisements.
must-include:
- item: A technical specification, layout/lighting orientation plan with beam orientation and a schedule
    of equipment
  level: must
- item: Lighting contour/spread plan; hours of operation; light spill (with a polar luminance diagram
    at the nearest sensitive premises)
  level: must
- item: Reasons for the lighting and mitigation measures
  level: must
- item: Impact on neighbouring amenity, highway safety, the character of the area and wider landscape
    (conservation areas, listed buildings, SSSI, AONB, dark rural areas) and ecology (European protected
    species)
  level: must
- item: 'Floodlighting (External Lighting Scheme): survey of the night environment and critical viewpoints;
    existing lighting and baseline measurements; environmental light control limits and design objectives;
    task and overspill calculations; obtrusive light, glare and upward light ratio; comparison with baseline;
    visualisations and walkthrough; reflection factors, mounting heights and aiming angles'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Floodlighting is proposed.
  source-text: Details of the survey of the surrounding night environment Identification of critical viewpoints
    Establishment and calculation of existing lighting conditions Summary of baseline measurements and
    / or calculations Analysis of task lighting level recommendations Establishment of environmental light
    control limits Statement of new lighting design quality objectives Calculated measurement of task
    working areas Calculated measurement of overspill areas Obtrusive light calculation of property intrusion
    Viewed source intensities including nominal glare assessment Direct upward light ratio Comparison
    of design achievement with baseline values Designers critique of final design constraints Viewpoint
    visualisation Virtual walkthrough of illuminated site Schedule of model reflection factors Schedule
    of luminaire mounting heights and aiming angles Layout plan with beam orientation indication
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), pages 14, 20. Combines the
  scheme's 'External Lighting Scheme' and 'Light Impact Assessment'. Application types are those the scheme's
  application-type grid lists it for.
review-status: unverified
field-status: {}
