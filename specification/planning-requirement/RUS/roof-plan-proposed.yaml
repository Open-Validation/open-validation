reference: roof-plan-proposed
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - demolition-con-area
      - ldc-existing-use
      - ldc-prospective-use
      - pa-ecomms-network
      - s73
      - consent-under-tpo
  - discretionary
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7(1)(c)(ii)
source-text: Should be submitted with all planning applications. ... Roof Plan – A roof plan is used to
  show the shape of the roof and is typically drawn at a scale smaller than the scale used for the floor
  plans. Details such as the roofing material and their location are typically specified on the roof plan.
must-include:
- item: The shape of the roof
  level: must
- item: Roofing materials and their location
  level: should
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 7. Listed under 'Additional
  Plans' without a trigger; a roof plan only makes sense where there is a roof to show, so it is shown
  as discretionary. The scheme doesn't say existing or proposed. Application types are those the scheme's
  application-type grid lists it for.
review-status: unverified
field-status: {}
