  status: current
submission-standards:
- item: Every plan has an individual reference identifying the plan, its version number and date of production;
    amended plans follow the same format
  level: must
- item: A linear scale bar to assist electronic scaling/measuring and a unique plan/drawing reference
    number (block plans)
  level: must
- item: Site layout plans preferably on paper smaller than A2, typically at 1:200 or 1:500, with critical
    dimensions marked
  level: should
- item: Elevations and internal layouts preferably on paper smaller than A2, typically at 1:50 or 1:100
    (existing and proposed at a similar scale), scale annotated
  level: should
- item: Ordnance Survey based plans purchased or licensed for the purpose; copies of plans made for other
    purposes (e.g. title deeds) make the application invalid
  level: must
- item: Where information is not supplied, a written justification under Article 12 of the DMPO
  level: should
- item: Viability assessments are published, so a redacted copy must also be submitted
  level: must
