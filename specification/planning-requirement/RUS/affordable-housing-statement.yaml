reference: affordable-housing-statement
local-authority: RUS
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more units.
  - condition:
      field: housing-floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres or more.
  - condition:
      field: housing-type
      value: older-people
      description: Specialist older persons housing.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
confidence: medium
notes: 'From the audit (missing_requirement): 11+ units or 1,000 sq m+, and specialist older persons housing.'
review-status: unverified
field-status: {}
