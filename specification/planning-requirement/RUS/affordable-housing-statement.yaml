reference: affordable-housing-statement
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 units or more.
    - condition:
        field: housing-floorspace
        operator: '>='
        value: 1000
        description: 1000 sq m gross floor space or more.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 1: Policy 8 – Housing Size, Mix and Choice; Rushcliffe Affordable Housing SPD
  (2022)'
source-text: this applies to all applications proposing:11-units or 1000 sq. gross floor space or more.
  Specialist housing developments for older people, where falling within Use Class C3; Developments of
  Age Restricted/Sheltered Housing or similar housing; and Developments of Assisted Living/Extra Care
  Housing
must-include:
- item: A 'Heads of Terms' pro-forma on affordable housing contributions (Affordable Housing SPD appendix
    8)
  level: must
- item: Number of residential units, mix of units and proposed tenure
  level: must
- item: A clear explanation of any different levels or types of affordability or tenure for different
    units
  level: must
- item: 'Where a financial contribution instead of on-site affordable housing is proposed: that fact and
    why it is acceptable'
  level: must
  required-if:
    condition:
      field: affordable-housing-commuted-sum
      value: true
      description: A commuted sum is proposed instead of on-site affordable housing.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 7. The threshold covers
  specialist housing for older people (C3), age-restricted/sheltered housing and assisted living/extra
  care housing too. A Viability Assessment is needed if the scheme can't support the policy level. Application
  types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
