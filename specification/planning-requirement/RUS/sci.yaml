reference: sci
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: pre-application-community-consultation
      value: true
      description: Pre-application consultation has taken place with the local community.
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: NPPF Chapter 4 Decision-making
source-text: Required for all applications where pre-application consultation has taken place with the
  local community.
must-include:
- item: How, when and where consultation took place
  level: must
- item: A summary of the level and content of responses
  level: must
- item: Changes made to the scheme to take account of the responses
  level: must
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 23. Application types
  are those the scheme's application-type grid lists it for.
