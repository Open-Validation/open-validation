reference: application-form
local-authority: RUS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - demolition-con-area
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - pa-ecomms-network
    - s73
    - approval-condition
    - consent-under-tpo
    - non-material-amendment
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: There are a number of application forms for various types of applications (please ensure
  the correct form is used)
must-include:
- item: The correct application form for the type of application
  level: must
- item: 'Ownership certificate (A, B, C or D): one signed; Certificate B if any part of the proposal overhangs
    or forms a party wall on a neighbour''s land'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
  source-text: One of the ownership certificates must be signed. (If part of your proposal overhangs or
    forms a party wall on your neighbours land you are required to submit certificate B).
- item: Agricultural holding certificate signed (the land is not an agricultural holding, or any tenants
    have been notified)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - s73
  source-text: This part of the application form must be signed to either confirm the land to which the
    application relates is not part of an agricultural holding; or if it is that you have notified any
    tenants
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), pages 5, 6. Application types
  are those the scheme's application-type grid lists it for. The fee and Crown land statements are national
  requirements too (see the unmapped list).
