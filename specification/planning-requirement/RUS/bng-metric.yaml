reference: bng-metric
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - demolition-con-area
      - s73
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Environment Act 2021; Local Plan Part 2: Policy 38, Policy 1; NPPF 15'
source-text: All major development and small developments must be supported by Bio-diversity Net Gain
  (BNG). ... All developments unless exempt will need to supply a Biodiversity Metric.
must-include:
- item: DEFRA's latest biodiversity metric (the small sites metric may be used for qualifying small sites)
  level: must
- item: An accompanying statement explaining the relevant inputs and metric score
  level: must
- item: A Biodiversity Management Plan (BMP) setting out biodiversity goals, how they will be achieved,
    maintenance and monitoring
  level: should
  source-text: The Biodiversity Net Gain Metric should also be accompanied by a Bio-diversity Management
    Plan (BMP) to set out goals for biodiversity (species and habitats), the means by which these goals
    will be achieved, their maintenance and monitoring.
- item: 'Self-build: the self-build pro forma'
  level: must
  required-if:
    condition:
      field: exception-site-housing
      value: true
      description: The works are for a self-build property.
  source-text: If the works are for a self-build property, the self-build pro forma will need completing
    and submitting with your application.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 9. Shown with the biodiversity
  gain condition (the scheme says 'unless exempt'). The Biodiversity Gain Statement is in the unmapped
  list. Application types are those the scheme's application-type grid lists it for.
review-status: unverified
field-status: {}
