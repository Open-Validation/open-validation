reference: planning-statement
local-authority: RUS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - pa-ecomms-network
      - s73
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the development plan.
    - discretionary
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'Local Plan Part 2: Policy 1 Development requirements'
source-text: 'However, a statement will be required for: all major planning applications applications
  that are not in accordance with the development plan proposals that require detailed policy consideration'
must-include:
- item: Why the proposal complies with development plan policies, or why permission should be granted
    if it is contrary to them
  level: must
- item: How relevant Neighbourhood Plan policies are complied with
  level: must
  required-if:
    site:
      in:
      - neighbourhood-plan-area
      description: In a neighbourhood plan area.
- item: A business case with evidence of need, where the proposal is linked to a business (e.g. agricultural
    workers' dwellings)
  level: should
  required-if: discretionary
- item: Design considerations where no DAS is needed but design is an important and material consideration
  level: should
  required-if: discretionary
  source-text: All design considerations and assessments should be incorporated into the Design and Access
    Statement or the Supporting Planning Statement where a Design and Access Statement is not required
    but where design is an important and material consideration.
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), pages 11, 21. 'Proposals
  that require detailed policy consideration' is a judgement, so discretionary. A Secured by Design assessment
  may also go in it (see the unmapped list). Application types are those the scheme's application-type
  grid lists it for.
review-status: unverified
field-status: {}
