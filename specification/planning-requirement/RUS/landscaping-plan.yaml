reference: landscaping-plan
local-authority: RUS
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - pa-ecomms-network
    - approval-condition
source-url: https://www.rushcliffe.gov.uk/about-us/about-the-council/policies-strategies-and-other-documents/accessible-documents/local-scheme-of-validation/
policy: 'NPPF 15; Local Plan Part 2: Policy 1 Development requirements, Policy 22 Development within the
  Countryside'
source-text: Applications should be accompanied by landscaping details and include proposals for long
  term maintenance and landscape management.
must-include:
- item: Proposals for long-term maintenance and landscape management
  level: must
- item: 'Proportionate to the scheme; where relevant: a plan of external works with existing and proposed
    levels; features to be retained and removed; hard and soft landscape proposals; flood management measures;
    roads/paths, fencing/walls, screening and noise bunds'
  level: should
- item: 'Where relevant: an evaluation of existing landscape features and how the proposal maintains and
    enhances the area and protects valued features (e.g. important trees and hedges)'
  level: should
- item: 'Where relevant: planting specifications, evidence the ground suits the proposed vegetation, construction
    details of landscape features, and maintenance for the first 5 years including replacement of failures'
  level: should
confidence: medium
notes: From the council's list (adopted January 2024, revised January 2026), page 18. 'Landscaping Details'
  in the scheme ('Landscaping if required' under Additional Plans). Application types are those the scheme's
  application-type grid lists it for.
review-status: unverified
field-status: {}
