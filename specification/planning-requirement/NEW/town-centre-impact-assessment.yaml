reference: town-centre-impact-assessment
local-authority: NEW
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: The site is outside town centre boundaries.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Retail development of over 1,000 square metres gross internal area.
  - all:
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 500
        description: Retail development of over 500 square metres in villages or outside built-up areas.
    - discretionary
source-url: https://www.newforest.gov.uk/media/1199/Summary-of-what-is-requried-and-when/pdf/Summary_of_what_is_requried_and_when.pdf?m=1605271374517
policy: ECON5
source-text: Retail development of over 1,000sqm gross internal area (GIA) outside of town centre boundaries
  needs a Retail Impact Assessment.
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): not householder. From the audit: also over 500 sqm in villages
  or outside built-up areas; that location has no field, so it is shown as officer discretion.'
review-status: unverified
