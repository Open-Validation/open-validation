reference: energy-statement
local-authority: NEW
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: New floorspace of more than 100 square metres.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more new dwellings.
source-url: https://www.newforest.gov.uk/media/1199/Summary-of-what-is-requried-and-when/pdf/Summary_of_what_is_requried_and_when.pdf?m=1605271374517
must-include:
- item: The predicted regulated energy use of the development and the energy generation achieved through
    the proposed renewable/low carbon measures
  level: should
  source-text: An Energy Statement should include evidence to demonstrate the predicted regulated energy
    use of the proposed development and the energy generation achieved through the proposed renewable/low
    carbon measures.
confidence: medium
notes: 'From the audit (wrong_trigger): Renewable and Low Carbon Energy Statement for new floorspace >100
  sqm or 1+ dwellings. The workbook filed this text under sustainability-statement.'
review-status: unverified
