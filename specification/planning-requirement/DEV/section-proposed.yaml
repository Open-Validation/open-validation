reference: section-proposed
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The proposal alters land levels.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications: proposing altered land levels where topography is key to the site where the
  relationship of existing buildings, mature vegetation, or other distinctive features with or surrounding
  the sites is required to be shown'
must-include:
- item: Existing and proposed sections in context with surrounding buildings, structures and topographical
    features, at an accurate scale and height, including the height of existing and proposed trees that
    would help screen the proposal
  level: must
- item: Finished floor and/or site levels
  level: must
- item: Major dimensions
  level: must
- item: Spot heights and levels in metres above OS datum (AOD)
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.1 (Plans,
  drawings and surveys). Where topography is key or the relationship with surrounding features needs showing
  is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
