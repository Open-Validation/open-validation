reference: protected-landscape-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within, or affecting the setting of, an AONB (National Landscape).
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Countryside and Rights of Way Act 2000; NPPF paragraphs 174, 176 and 177; Devon Waste Plan policy
  W12
source-text: All applications for development within, or affecting the setting of an AONB
must-include:
- item: How the existing site contributes to the wider landscape's natural beauty and special qualities,
    with reference to landscape character assessments and AONB Management Plans
  level: must
- item: The nature of the impact (negative, neutral or positive) and resulting site character
  level: must
- item: Measures to mitigate adverse effects on the AONB's natural beauty and special qualities
  level: must
- item: Cross-references to any Landscape and Visual, Lighting and Noise Impact Assessments also submitted
  level: must
- item: 'Major development: exceptional circumstances, assessing the need for the development (including
    national considerations) and the impact of permitting or refusing it on the local economy'
  level: must
  required-if:
    ref: major-development
- item: 'Major development: the cost of, and scope for, developing outside the designated area or meeting
    the need in some other way'
  level: must
  required-if:
    ref: major-development
- item: 'Major development: any detrimental effect on the environment, landscape and recreational opportunities,
    and how far it could be moderated'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.6 (Landscape
  and trees). The list calls it an Area of Outstanding Natural Beauty Statement.
review-status: unverified
field-status: {}
