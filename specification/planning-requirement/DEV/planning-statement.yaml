reference: planning-statement
local-authority: DEV
required-if:
  application-type:
    in:
    - waste-dev
    - reg-3
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF; Devon Waste Plan; National Planning Policy for Waste
source-text: All applications (proportionate and specific to the development) ... All waste applications
must-include:
- item: Description of the site (access, existing uses, landscape, ecological and built features) and
    its surroundings, including relevant historic, ecological and landscape designations or uses
  level: must
- item: Description of the proposed development and a summary of its impacts (activities, hours of operation,
    phases, physical dimensions, appearance, vegetation affected, proposed planting)
  level: must
- item: The relevant national and development plan policies and guidance, and how far the proposal accords
    with them
  level: must
- item: Why the applicant considers there is a valid need, where justification and need are a material
    consideration
  level: must
  required-if: discretionary
- item: How the proposal achieves sustainable development and responds to the climate and ecological emergency,
    and how it will improve social equality and the condition of the environment
  level: must
- item: 'For variations of conditions or minor material amendments: what changes are proposed and why'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Details of any pre-application discussions with the County Council and statutory consultees
  level: must
- item: Summary of the conclusions and recommendations of the reports submitted, stating which recommendations
    are taken forward (with implementation details) and which are not, and why
  level: must
- item: 'Waste: how the facility meets sustainable waste management and drives waste up the waste hierarchy'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: 'The Waste Planning Statement should include all of the information required in the above
    Planning Statement section and, where applicable:'
- item: 'Waste: how the facility meets the spatial strategy of the Devon Waste Plan'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: the maximum annual capacity of the facility and the types, quantities and sources of waste'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: how the facility meets Devon''s requirements and, if not consistent with the Devon Waste
    Plan, the need for the development'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: operational and processing methods and, for landfill, phasing and timeframes for filling'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: existing site features that require removal or diversion'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: stockpiles, including heights'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: how residual materials will be managed and how any energy produced will be used'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: site management (e.g. wheel wash facilities), monitoring and complaints procedures'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Waste: the restoration and aftercare proposed'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.2 (Planning
  statement). The list applies to waste development and the County Council's own (Regulation 3) development,
  so 'all applications' is shown as those two types. Waste applications need a Waste Planning Statement
  (its own row in the list), which includes everything in the Planning Statement plus the 'Waste:' items
  here 'where applicable'. Other Local List information may be included in the Planning Statement, depending
  on the scale of the development.
review-status: unverified
field-status: {}
