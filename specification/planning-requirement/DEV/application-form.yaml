reference: application-form
local-authority: DEV
required-if:
  application-type:
    in:
    - waste-dev
    - reg-3
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Articles 7 and 13, Town and Country Planning (Development Management Procedure) (England) Order
  2015; Town and Country Planning (Fees for Applications, Deemed Applications, Requests and Site Visits)
  (England) Regulations 2012
source-text: All applications
must-include:
- item: A completed '1APP' planning application form
  level: must
- item: The relevant ownership certificate (A, B, C or D) completed, including the Agricultural Land Declaration
  level: must
  source-text: An application is not valid unless the relevant certificate has been completed.
- item: The correct fee (where a fee is necessary), received before the application can be validated
  level: must
  source-text: The Council must receive the correct fee before an application can be validated.
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 2 (National
  Validation Requirements). The list applies to waste development and the County Council's own (Regulation
  3) development, so 'all applications' is shown as those two types. The list gives the fee and ownership
  certificate their own rows; they are shown here as part of the form.
review-status: unverified
field-status: {}
