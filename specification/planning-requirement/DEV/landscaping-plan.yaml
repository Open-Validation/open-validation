reference: landscaping-plan
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: landscaping-works
        value: true
        description: Existing vegetation is to be removed and replacement landscaping is proposed.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF; Devon Waste Plan policy W12
source-text: 'A Landscaping Scheme is required if: the proposal could harm the character or appearance
  of the area and/or where existing vegetation is to be removed and replacement landscaping is proposed'
must-include:
- item: 'Plan of the proposed external works: existing and proposed levels, features retained and removed,
    hard and soft landscape proposals and other landscape features (planting, flood management measures,
    roads/paths, fencing/walls, screening, noise bunds)'
  level: must
  required-if: discretionary
- item: Evaluation of the importance of existing landscape features and how the proposal maintains and
    enhances the area and mitigates negative impacts
  level: must
  required-if: discretionary
- item: Measures to protect and improve existing valued landscape features (e.g. important trees and hedges)
  level: must
  required-if: discretionary
- item: Planting specifications (soil preparation, planting method, spacing, seed types, species, stock
    size, protection/support, timing)
  level: must
  required-if: discretionary
- item: Evidence that the ground is suitable for the proposed vegetation or habitat type
  level: must
  required-if: discretionary
- item: Construction details and materials for landscape features
  level: must
  required-if: discretionary
- item: Maintenance of proposed vegetation for the first 5 years, including replacement of failures, weed
    control and aftercare period
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.6 (Landscape
  and trees). The list calls it a Landscaping Scheme. Whether the proposal could harm the character or
  appearance of the area is a judgement, so that part is discretionary. The contents are 'where relevant',
  so each is discretionary.
review-status: unverified
field-status: {}
