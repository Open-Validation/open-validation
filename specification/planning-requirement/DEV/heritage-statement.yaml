reference: heritage-statement
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - world-heritage-site
        - listed-building
        - listed-building-setting
        - conservation-area
        - archaeological-priority-area
        description: Affects a World Heritage Site, a listed building or their setting; within or affecting
          a conservation area; or in an area of archaeological interest.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Planning (Listed Buildings and Conservation Areas) Act 1990; NPPF section 16; Devon Waste Plan
  policy W13
source-text: 'All applications for development which: affect a World Heritage Site or its setting affect
  a listed building or its setting are within or would impact upon a conservation area would impact upon
  a World Heritage Site or its setting may lie within an area of archaeological interest could impact
  upon any other designated or non-designated heritage asset or its setting'
must-include:
- item: The proposed works and their extent, scope and purpose (repair, alteration or extension; internal
    or external)
  level: must
- item: Description and assessment of the significance of the asset affected, including the contribution
    of its setting
  level: must
- item: Any harm to the heritage asset and its setting, and any positive impacts
  level: must
- item: Mitigation and/or enhancement measures
  level: must
- item: Sources of information used and experts consulted; the Historic Environment Record consulted as
    a minimum
  level: must
- item: The designation records for the asset from the National Heritage List for England (address, number
    and date of listing or schedule entry) and the description
  level: must
- item: 'Conservation areas: the impact on the character and appearance of the area as described in the
    Conservation Area Appraisal'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within or affecting a conservation area.
- item: 'Archaeology: an assessment of archaeological information and, if required, non-intrusive and/or
    intrusive investigations, with the results included in the statement'
  level: must
  required-if:
    all:
    - condition:
        field: ground-disturbance
        value: true
        description: The works disturb the ground.
    - site:
        in:
        - archaeological-priority-area
        description: Known or likely archaeological interest.
  source-text: involving the disturbance of ground on sites that are known to have or are considered likely
    to have archaeological interest, an applicant will need to commission an assessment of archaeological
    information
- item: 'World Heritage Site: a heritage impact assessment based on ICOMOS guidance (2011) and Appendix
    2 of the Cornwall and Devon Mining Landscape World Heritage Site SPD (2017)'
  level: must
  required-if:
    site:
      in:
      - world-heritage-site
      description: Impacts on a World Heritage Site.
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.4 (Historic
  environment). Other designated or non-designated heritage assets are covered by 'could impact upon',
  which is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
