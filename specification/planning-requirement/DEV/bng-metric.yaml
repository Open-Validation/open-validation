reference: bng-metric
local-authority: DEV
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Environment Act 2021; NPPF section 15
source-text: All applications unless otherwise agreed with Devon County Council ... Unless agreed with
  Devon County Council, any development resulting in land take (including agricultural or amenity land)
  will require the completion of the latest national Biodiversity Metric as part of the planning application.
must-include:
- item: The latest national Biodiversity Metric, completed
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.5 (Ecology).
  The list says 'All applications' and asks for 10% net gain; by law exempt applications are not subject
  to the biodiversity gain condition, so the rule follows the law. The council also publishes separate
  Biodiversity Net Gain Validation Guidance (on SharePoint, which could not be reached).
